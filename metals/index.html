톤, ESS +60% YoY)."}]}, {"h": "알루미늄 — 전쟁이 만든 공급 차질", "blocks": [{"t": "table", "cols": ["기업", "국가", "차질 내용", "추정 규모"], "rows": [["ALBA", "바레인", "호르무즈 물류 차질+미사일, 가동률 30%", "약 31만톤/년"], ["EGA 알타윌라", "UAE", "정전으로 전해조 비상정지, 복구 최대 12개월", "CAPA 150만톤 중 상당 부분"], ["Qatalum", "카타르", "가스 공급 차질, 가동률 60%", "월 1.3만톤 수준"], ["IRALCO(Arak)", "이란", "공격 대상 보도", "CAPA 20만톤/년"]], "title": "이란 전쟁 이후 중동 알루미늄 제련소 생산 차질", "note": "업계·언론 종합. Wood Mackenzie는 전체 공급 차질 300~350만톤 추정, 중동은 세계 알루미늄 공급의 약 8%"}, {"t": "p", "text": "중국 알루미늄 생산은 2025년 4,402만톤으로 연 4,500만톤 상한에 근접하여 증산 여지가 작습니다. 여기에 중동(세계 공급의 약 8%) 제련소가 전쟁 피해를 입으며 공급 차질이 300~350만톤(Wood Mackenzie 추정)으로 거론되었고, LME 가격은 2026년 4월 $3,600대까지 상승했습니다. 구리/알루미늄 가격비가 3.5~4배를 넘으면 전선·방열 등에서 알루미늄 대체가 가속된다는 점이 구리 가격 상단의 제약 요인입니다."}]}, {"h": "비중국 희토류 프로젝트(원자료)", "blocks": [{"t": "table", "cols": ["지역", "프로젝트/기업", "진행 상황"], "rows": [["미국", "MP Materials(Mountain Pass·10X)", "정제·자석 구축, DoD 지원, 2027년 중국산 자석 0% 목표, 자석 1만톤(2028~29)"], ["미국", "Energy Fuels + Chemours", "유타·노스캐롤라이나 정제, NdPr 3,000톤 목표(2026)"], ["호주/미국", "Lynas", "말레이시아 정제·중희토류 증설(2026.04~), 텍사스 분리시설"], ["호주", "Iluka Eneabba", "정제공장(2027~29), 정부 12억달러 지원"], ["프랑스", "Solvay La Rochelle", "2025.04 NdPr 상업생산 재개, 2030년 4,500톤 목표"], ["에스토니아", "Neo Performance", "NdFeB 자석 2,000톤(2025)"], ["브라질", "Serra Verde", "Phase I 연 5,000톤 REO 이상, USA Rare Earth가 약 28억달러 인수"], ["사우디", "Ma'aden + MP Materials", "2028년 중반 생산 목표"], ["한국", "포스코인터내셔널 + ReElement / 광해광업공단", "미국 분리정제 연 6,000톤(2027.4Q 시범), 정제 5,000톤 목표(2027)"]], "title": "비중국 희토류 공급망 주요 프로젝트", "note": "언론 종합·각사 공시"}, {"t": "p", "text": "단계·정부 지원까지 포함한 확장 트래커는 06 핵심광물 공급망 탭에 있습니다."}]}, {"h": "보호무역 제도(원자료)", "blocks": [{"t": "table", "cols": ["지역", "제도", "주요 내용"], "rows": [["미국", "Section 232(철강)", "2018.03 25% → 2020 파생제품 확대 → 2025.06 50%, 2026.04.06 파생제품 추가 확대, 매년 1·5·9월 정기 확대"], ["미국", "Section 232(구리)", "2025.08 반가공·고함량 구리제품 50%(정광·전기동·스크랩 제외), 정련동 2027년 15%·2028년 30% 권고(미확정)"], ["미국", "AD/CVD(철근·OCTG)", "알제리 철근 예비 AD 127%, 이집트 CVD 30%, 중국 AD 133%, 멕시코 20.6%"], ["EU", "세이프가드 → 신규 TRQ", "2026.07 무관세 쿼터 약 3,000만톤 → 1,834만톤(−47%), 초과분 50%, Melt & Pour 10월"], ["EU", "CBAM", "2026.01 비용 부과, 무상할당 2029년부터 급감·2035 폐지"], ["EU", "방향성 전기강판 세이프가드 조사", "2026.03 착수, 규제가 고부가 제품으로 확대"]], "title": "미국·EU 철강·구리 보호무역 제도", "note": "WorldSteel, 산업통상부, EU 집행위, 미 관세청"}, {"t": "p", "text": "도구별 작동 방식과 한국 영향은 05 통상·관세 지도 탭에서 정리했습니다."}]}]}, "theme": {"title": "테마·하위섹터", "h2": "테마·하위섹터 — 아홉 개의 서로 다른 사이클", "en": "Themes & Sub-sectors", "lede": "'금속 업황'이라는 말은 이제 한 방향을 가리키지 않습니다. 2026년 9월 현재 **철강은 바닥 확인 후 완만한 회복, 구리는 공급 병목 속 가격 하단 레벨업, 희토류는 정책 대기, 리튬은 바닥 통과 후 박스권**에 있습니다. 이 탭은 아홉 개 하위섹터를 ①~⑨ 번호 순서로 각각 '지금 무엇이 가격을 움직이나 → 핵심 숫자 → 다음에 볼 것 → 국내 연결점'으로 정리하고, 마지막에 1년의 서사와 상방·하방 논리를 덧붙였습니다.", "sections": [{"h": "지금 어디에 있나 — 사이클 국면 진단", "blocks": [{"t": "callout", "text": "2026년 9월 현재 철강은 '바닥 확인 후 완만한 회복' 국면입니다. 중국 조강·수출이 역성장하고 한국 판재·철근 유통가가 반덤핑·MIP·감산으로 20% 안팎 상승하여 국내 고로사는 1Q26을 바닥으로 상저하고가 전망되나, 글로벌 과잉설비(2028년 7.45억톤)와 중국 부동산 부진 탓에 2016년식 리레이팅은 어렵다는 것이 공통 인식입니다. 비철은 구리가 광산 차질·TC 마이너스·황산 병목 속 사상 최고가(현물 $14,912)를 기록한 '가격 하단 레벨업' 국면이며, 미국 정련동 관세 결정과 Grasberg 복구 속도가 다음 방향을 좌우합니다. 희토류·희소금속은 2026년 11월 미중 유예 종료를 앞둔 정책 대기 국면이고, 리튬은 바닥 통과 후 $18,000~25,000 박스권에서 2027년 짐바브웨 금수를 기다리고 있습니다.", "title": "2026년 9월 현재 국면"}, {"t": "figure", "svg": "<svg viewBox=\"0 0 960 350\" role=\"img\" aria-label=\"금속 가격은 현금원가 바닥과 신규 광산 유인가격 사이를 4단계로 순환하며, 2026년 철강·구리·리튬은 서로 다른 국면에 있다\"><defs><marker id=\"a-mt18\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"40\" y=\"40\" width=\"240\" height=\"76\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"160\" y=\"75\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">① 초과수요<\/text><text x=\"160\" y=\"91\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">가격 급등·기존 업체 증산<\/text><rect x=\"128\" y=\"126\" width=\"64\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"160\" y=\"137\" font-size=\"11\" text-anchor=\"middle\" style=\"fill:var(--accent)\">구리(2026)<\/text><rect x=\"330\" y=\"40\" width=\"240\" height=\"76\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"450\" y=\"75\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">② 신규 공급 증가<\/text><text x=\"450\" y=\"91\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">신규 진입·치킨게임<\/text><rect x=\"330\" y=\"200\" width=\"240\" height=\"76\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--alert);fill-opacity:.12;stroke:var(--alert)\" stroke-width=\"1.4\"/><text x=\"450\" y=\"235\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">③ 초과공급<\/text><text x=\"450\" y=\"251\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">AISC 하회·고비용 퇴출<\/text><rect x=\"416\" y=\"286\" width=\"68\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"450\" y=\"297\" font-size=\"11\" text-anchor=\"middle\" style=\"fill:var(--alert)\">철강(2021~)<\/text><rect x=\"40\" y=\"200\" width=\"240\" height=\"76\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--ok);fill-opacity:.12;stroke:var(--ok)\" stroke-width=\"1.4\"/><text x=\"160\" y=\"235\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--ok)\">④ 초과공급 해소<\/text><text x=\"160\" y=\"251\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">신규 공급 경제성 회복<\/text><rect x=\"106\" y=\"286\" width=\"107\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"160\" y=\"297\" font-size=\"11\" text-anchor=\"middle\" style=\"fill:var(--ok)\">리튬(2025 하반기~)<\/text><path d=\"M280 78 L328 78\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt18)\"/><path d=\"M450 116 L450 198\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt18)\"/><path d=\"M330 238 L282 238\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt18)\"/><path d=\"M160 200 L160 118\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt18)\"/><rect x=\"620\" y=\"40\" width=\"330\" height=\"236\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><line x1=\"632\" y1=\"70\" x2=\"938\" y2=\"70\" stroke=\"currentColor\" stroke-opacity=\"1\" stroke-width=\"1.4\" stroke-dasharray=\"4 4\" style=\"stroke:var(--warn)\"/><text x=\"636\" y=\"52\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--warn)\">대체 임계<\/text><text x=\"636\" y=\"66\" font-size=\"11\" text-anchor=\"start\" opacity=\".8\">Cu/Al 가격비 3.5~4배<\/text><line x1=\"632\" y1=\"150\" x2=\"938\" y2=\"150\" stroke=\"currentColor\" stroke-opacity=\"1\" stroke-width=\"1.4\" stroke-dasharray=\"4 4\" style=\"stroke:var(--accent)\"/><text x=\"636\" y=\"132\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--accent)\">Incentive Price<\/text><text x=\"636\" y=\"146\" font-size=\"11\" text-anchor=\"start\" opacity=\".8\">구리 $10,000~12,000/t<\/text><line x1=\"632\" y1=\"236\" x2=\"938\" y2=\"236\" stroke=\"currentColor\" stroke-opacity=\"1\" stroke-width=\"1.4\" stroke-dasharray=\"4 4\" style=\"stroke:var(--ok)\"/><text x=\"636\" y=\"218\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--ok)\">현금원가·LRMC (바닥)<\/text><text x=\"636\" y=\"232\" font-size=\"11\" text-anchor=\"start\" opacity=\".8\">리튬 LRMC 약 $12,000/t<\/text><path d=\"M800 225 C 820 215, 830 150, 850 125 S 885 100, 900 170 S 925 230, 940 205\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-opacity=\".7\"/><text x=\"785\" y=\"300\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">가격이 움직이는 상하단 (개념도)<\/text><text x=\"460\" y=\"338\" font-size=\"12\" text-anchor=\"middle\">품위 하락·자본집약도 상승으로 Incentive Price 지속 상승, 가격 하단 레벨업<\/text><\/svg>", "cap": "**금속 가격은 현금원가(바닥)와 신규 광산 유인가격(Incentive Price) 사이를 초과수요 → 신규 공급 → 초과공급 → 해소의 4단계로 순환합니다.** 2026년 철강은 ③초과공급의 긴 꼬리, 구리는 ①초과수요, 리튬은 ④해소에서 ①로 넘어가는 경계에 있습니다. 품위 하락과 자본집약도 상승으로 구리 Incentive Price($10,000~12,000)가 계속 상승하는 것이 '가격 하단 레벨업' 논리의 원리입니다."}]}, {"h": "① 고로 철강 — 바닥은 확인, 회복은 무역장벽 덕분", "note": "판재 중심의 고로사는 중국 수출 강도와 한국 무역구제가 판가를, 철광석·원료탄이 원가를 결정합니다.", "blocks": [{"t": "p", "text": "중국 조강은 2025년 9.61억톤(−4.4%), 2026년 1~4월 누적 −6%로 감소하고 있고, 순수출도 1Q26 −22%로 꺾였습니다. 그러나 이 감소는 '폐쇄 없는 감산'이 많아 수요가 살아나면 빠르게 되돌아올 수 있습니다. 국내 판재 가격을 실제로 끌어올린 것은 중국 감산이 아니라 한국의 열연 반덤핑·MIP였습니다 — 연초 톤당 80만원이던 열연 유통가가 5월 말 96~98만원으로 약 20% 상승했습니다."}, {"t": "p", "text": "원가 측면은 우호적입니다. 메이저 광산 증산과 기니 시만두 가동(연 1.2억톤)으로 철광석이 톤당 90불 중반으로 하향 안정될 것이라는 전망이 우세하여, 2H26 고로 스프레드가 톤당 약 50만원(1H 대비 +5만원)으로 확대될 수 있습니다. 1Q26을 바닥으로 한 '상저하고'가 공통 전망입니다."}, {"t": "bullets", "items": ["한국 열연-철광석 스프레드 $384(1Q26) → $450(2Q26, 6/16)", "중국산 열연 수입 비중 64.7%(2Q25) → 11.9%(1H26)", "POSCO홀딩스 영업이익 2025년 1.83조원(OPM 2.6%) → 1Q26 7,070억원", "K-ETS 4기 할당총량 −11%(2026)로 고로사 배출권 부족 구간 진입"]}, {"t": "callout", "text": "고로사는 이익 회복이 '무역구제 판정 일정'과 '실수요 계약가 전이'라는 두 이벤트에 달려 있습니다. 저PBR(0.2~0.5배) 구간의 메자닌은 리픽싱 하단과 탄소비용(K-ETS 부족분·CBAM)을 함께 확인해야 하고, 해외 상공정 CAPEX(인도 오디샤 10.7조원, 루이지애나 58억달러)가 추가 조달 수요로 이어질 수 있습니다.", "title": "ECM·국내 연결점"}], "tag": "추정"}, {"h": "② 전기로·철근 — 구조적 과잉 품목의 두 출구: 수출과 폐쇄", "note": "철근은 생산능력이 수요의 1.7배인 품목이어서 공급 조절(감산·폐쇄·수출)이 가격을 결정합니다.", "blocks": [{"t": "p", "text": "국내 철근 생산능력은 1,170만~1,230만톤인데 수요는 약 690만톤이어서 가동률이 56~57%에 불과합니다. 정부는 2025년 11월 철근·형강을 구조조정 1순위로 지정했고, 현대제철은 인천 철근 설비(75~80만톤)를 중단했습니다. 전기로가 배치식이어서 감산이 쉽다는 점이 구조조정을 석유화학·고로보다 빠르게 진행시킵니다."}, {"t": "p", "text": "예상 밖의 출구는 미국이었습니다. 미국이 알제리·이집트·베트남 등 4개국 철근에 AD/CVD 조사를 시작하면서 생긴 공백을 한국산이 채웠고, 한국 철근 수출은 2024년 연간 3.9만톤에서 2026년 2월 한 달 13만톤으로 급증했습니다(미국 데이터센터·전력 인프라향). 수출 증가와 20~25% 설비 감축이 겹치면 가동률이 80%대로 정상화될 수 있다는 것이 시장 추정입니다."}, {"t": "bullets", "items": ["철근 유통가 66만원(2025-11) → 75만원(2026-02), 스프레드 27만 → 35만원(+30%)", "2026년 4월 누적 월평균 대미 철근 수출 9.2만톤(전년 1,300톤)", "메모리 팹 2025~29 누적 강재 수요 145만톤 추정(H형강)", "리스크: 준공 후 미분양 증가, 미국 RTAC의 한국산 제소 가능성"]}, {"t": "callout", "text": "철근사는 '감산 담합 예외'를 인정한 K-스틸법 시행령 수위와 자사주 활용(대한제강 약 24.9% 보유)이 자본정책 이벤트입니다. 구조조정 과정의 설비 매각·사업재편 인허가 특례는 M&A·블록딜 수요로 이어질 수 있습니다.", "title": "ECM·국내 연결점"}]}, {"h": "③ 강관 — 유가·관세·해상풍력이 교차하는 프로젝트형 사이클", "note": "에너지 강관은 미국 시추 활동과 232조 관세, 해상풍력 발주가 동시에 작용합니다.", "blocks": [{"t": "p", "text": "북미 OCTG P110 현물은 2026년 9월 첫째 주 숏톤당 $2,625로 연초 대비 31.4% 상승했습니다. 호르무즈 재격화로 유가가 오르고, 50% 관세가 저가 수입재를 차단하면서 미국 내 가격이 급등했습니다. 한국 강관사는 관세를 부담하고도 미국 판가가 충분히 높아 채산성이 유지되고, 미국 현지 생산능력을 가진 업체는 관세 없이 그 가격 수준의 수혜를 누립니다."}, {"t": "p", "text": "다만 물량 효과는 예전만 못합니다. 원유 리그 수의 유가 반응계수가 2020년 이후 5.92에서 2026년 1.79로 낮아졌습니다(E&P 자본 규율). 해상풍력 모노파일(영국 AR7 8.44GW, Dogger Bank South 3.0GW)은 프로젝트 FID에 좌우되는 별도 사이클이며, 초기 자회사의 일회성 충당금(세아윈드 NVE 1,100억원) 리스크가 있습니다."}, {"t": "bullets", "items": ["미국 원유 리그 450개(2026-09), DUC 재고 감소세 둔화", "캐나다 한국산 OCTG 반덤핑 13.6%(5년)", "세아제강 2Q26 영업이익률 7.1%(추정)", "알래스카 LNG 1단계 X70 라인파이프 약 70만톤"]}, {"t": "callout", "text": "강관사 밸류에이션은 WTI와 PBR의 상관(유가 80달러 전제 시 PBR 약 0.4배 예시)과 해상풍력 자회사 SOTP로 나뉩니다. 프로젝트형 매출이므로 IPO·메자닌 검토 시 수주잔고의 확정 계약 비중과 충당금 이력을 먼저 확인합니다.", "title": "ECM·국내 연결점"}]}, {"h": "④ 구리 — 슈퍼사이클이 아니라 가격 하단 레벨업", "note": "광산 품위 하락·연쇄 사고·17년 리드타임이 공급을 제약하고, 전력망·데이터센터·국방·비축이 수요를 확대했습니다.", "blocks": [{"t": "p", "text": "2025년 주요 9개 광산사의 생산은 9,586kt로 전년 대비 4.0% 감소하여 연초 가이던스(10,068kt)를 크게 밑돌았습니다. Grasberg 토사 유입(−220kt), Kamoa-Kakula(−155kt) 같은 사고가 겹쳤고, 남미 품위는 25년 만에 절반(1.2~1.3% → 0.6%)이 되었습니다. 광산 건설비는 10년 전 톤당 $8,000~10,000에서 $15,000~20,000으로 상승했습니다."}, {"t": "p", "text": "수요는 성격이 바뀌었습니다. AI 데이터센터(Tier IV 2N 40t/MW 이상), 전력망, EV(BEV 대당 83kg 이상), 국방 비축, 미국 핵심광물 목록 편입(2025-11)과 Project Vault가 가격에 덜 민감한 수요를 형성했습니다. LME 현물은 2026년 3분기 $14,912로 사상 최고를 경신했고 COMEX는 8월 파운드당 $6.88을 기록했습니다."}, {"t": "bullets", "items": ["ICSG 2026 전망: +28.9만톤 과잉(2025-04) → −15만톤 부족(2025-10) → +9.6만톤 과잉(2026-04)", "3대 거래소 재고 124만톤(2026-03, 23년 최고)", "Incentive Price $10,000~12,000/t", "구리/알루미늄 가격비 3.5~4배가 대체 임계"]}, {"t": "callout", "text": "구리 가격은 전선·신동 기업의 매출과 메탈게인을 확대시킵니다. 공모 기업의 이익 중 메탈 관련 이익을 분리하지 않으면 사이클 고점 밸류에이션이 됩니다. 반대로 에스컬레이션이 적용된 전선 수주잔고는 가격 변동과 무관한 '구조적' 이익입니다.", "title": "ECM·국내 연결점"}], "tag": "확인"}, {"h": "⑤ 제련 — 수수료의 시대가 끝나고 회수력의 시대", "note": "TC가 0달러가 된 뒤 제련사 이익은 부산물·Free Metal·희소금속 회수에서 발생합니다.", "blocks": [{"t": "p", "text": "중국 제련 설비가 광산 공급보다 빠르게 늘면서 정광 확보 경쟁이 벌어졌고, 구리 벤치마크 TC는 $92(2015) → $21.25(2025) → $0(2026)이 되었습니다. 중국 제련소들은 2026년 가동률 10% 이상 감축(CSPT)에 합의했으나, 황산 고가가 마이너스 TC를 버티게 하여 실제 감산은 더뎠습니다."}, {"t": "p", "text": "이익은 회수력으로 옮겨갔습니다. 고려아연 1Q26 연결 영업이익은 7,460억원(YoY +175%)으로 사상 최대였는데, 그 중심은 TC가 아니라 금·은 가격과 회수율이었습니다(별도 매출 중 금·은 65% 초과, 희소금속 GPM 74.3%). LS MnM도 영업이익의 약 80%가 부산물 기여로 추정됩니다."}, {"t": "bullets", "items": ["현물 TC −$227.5(2026-08-14), TC-구리가 역상관 확률 72~92%", "고려아연 2025 연결 영업이익 1.23조원(OPM 7.4%) → 1Q26 12.3%", "고려아연 유형자산 취득 0.5조(2026E) → 5.5조(2027E)", "2027년 벤치마크 TC 협상(2026-4Q)이 다음 이벤트"]}, {"t": "callout", "text": "제련사는 CAPEX 사이클(해외 제련소 74억달러 등)과 차입 증가, 경영권 분쟁에 따른 유통 물량 변화가 자본시장 이벤트입니다. 실적 분해 시 Metal Gain(일시적)과 Free Metal·희소금속(구조적)을 반드시 분리해야 합니다.", "title": "ECM·국내 연결점"}]}, {"h": "⑥ 귀금속 — 은의 산업금속화", "note": "금은 통화 신뢰의 지표이며, 은은 부산물 공급과 산업 수요의 비대칭이 가격을 형성합니다.", "blocks": [{"t": "p", "text": "금은 중앙은행 매입과 통화신뢰 변화로 2025년 65% 상승했습니다(3Q25 $3,459 → 4Q25 $4,157/oz). 은은 상승폭이 더 컸습니다. 2025년 161% 상승한 뒤 2026년 1월 온스당 100달러를 돌파했고, 중국의 은 수출 허가제 전환(2026-01)으로 상하이 실물가가 COMEX보다 온스당 10~11달러 높게 거래되는 지역 분절까지 발생했습니다."}, {"t": "p", "text": "은 공급의 약 60%는 구리·아연·납·금 광산의 부산물이어서 은 가격이 올라도 증산되지 않습니다. 반면 수요의 60% 이상이 태양광·전장·AI 인프라 같은 산업용입니다. 금은비율은 역사 평균 70에서 약 40으로 내려와 은의 상대 가격이 이미 높다는 신호이기도 합니다."}, {"t": "bullets", "items": ["SLV ETF 169일 연속 자금 유입(2026-01)", "CME 은 선물 증거금 2만 → 3.25만달러/계약", "고려아연 은 판매 약 2,000톤/년(글로벌 5.7%)", "전쟁 국면에서 조정 — 가격 변동성 큼"]}, {"t": "callout", "text": "귀금속 가격은 제련사의 일회성 메탈게인과 구조적 부산물 이익을 동시에 만들어냅니다. 공모 기업 실적에 귀금속 가격 급등기가 포함되면 가격 정상화 시 이익 민감도(온스당 $10 변동 시 EBITDA)를 투자위험요소에 명시해야 합니다.", "title": "ECM·국내 연결점"}]}, {"h": "⑦ 희토류·희소금속 — 가격 사이클이 아닌 정책 이벤트 사이클", "note": "중국 수출통제와 미국의 가격하한·지분투자가 가치를 결정합니다.", "blocks": [{"t": "p", "text": "중국은 2025년 4월 희토류 7종과 자석을 수출허가제로 묶었고, 10월 12종·0.1% 역외적용·기술 통제로 확대했다가 미중 합의로 1년 유예했습니다. 유예 종료 시점(2026-11-10)이 다음 이벤트입니다. 통제가 걸릴 때마다 역외 가격이 급등했습니다 — 유럽 Dy 산화물 $850 vs 중국 약 $250/kg(2025-05), 산화이트륨 역외 $270 vs 중국 $18/kg."}, {"t": "p", "text": "수요의 2차 파도는 로봇·방산입니다. 휴머노이드 1억대 보급 시 NdPr 수요가 10~20만톤 늘 수 있다는 추정이 있고(현재 중국 채굴쿼터 27만톤), 고온 모터용 고등급 자석은 Dy·Tb 투입을 늘립니다. 희소금속(안티모니·비스무스·게르마늄)은 2025년 106~270% 상승했습니다."}, {"t": "bullets", "items": ["NdPr 하한 $110/kg vs 시장가 약 $57(2025-10)", "Dy $202.99·Tb $1,073.76/kg(2025-10)", "MP Materials 1Q26 NdPr 생산 917톤(+63%), 판매 1,006톤(+117%)", "미국 희토류 순수입의존 약 80%(이트륨 100%)"]}, {"t": "callout", "text": "희토류·자석 기업은 EV/Sales 기반 옵션가치로 평가되기 쉬워 IPO 시 '정부 계약이 MOU·LOI 단계인지 실계약인지', '고객 인증이 끝났는지'를 투자위험요소에 구분 기재해야 합니다. Molycorp(2010~11년 주가 10배 → 2015년 파산) 사례가 반대편 논거입니다.", "title": "ECM·국내 연결점"}]}, {"h": "⑧ 리튬 — 바닥 통과, 2027년 공급부족 논쟁", "note": "리튬은 2025년 중반 원가 커브 바닥을 형성한 뒤 중국 감산·자원국 규제·ESS 수요로 반등했습니다.", "blocks": [{"t": "p", "text": "탄산리튬은 2025년 6월 톤당 $8,100 저점에서 2026년 1월 $23,000으로 약 2.8배 반등했습니다. CATL 젠샤워 광산(세계 생산의 약 3%)·이춘시 광산(연 28만톤, 중국의 12~15%) 중단, 짐바브웨 정광 수출 중단, 중국 배터리 수출 VAT 환급 축소 전 선구매가 겹쳤습니다. 2026년 9월 수산화리튬은 $18,000~20,000으로 조정된 박스권입니다."}, {"t": "p", "text": "수요 측의 새로운 축은 ESS입니다. ESS 출하는 2025년 315GWh에서 2026E 450~750GWh로 전망되고, 시장은 짐바브웨 금수(2027-01)와 합쳐 2027년 구조적 공급부족 진입 가능성을 제시합니다. 반대로 CATL 광산 조기 재가동이나 짐바브웨 쿼터 유지는 하방 요인입니다."}, {"t": "bullets", "items": ["리튬 LRMC 약 $12,000/t — 바닥의 근거", "2027년 탄산리튬 $25,000/t 전망(추정)", "포스코아르헨티나 C1 $5,391/LCE톤(1Q26), 3월 첫 월간 흑자", "글로벌 리튬 생산능력 +31%(2025) → +22%(2026)"]}, {"t": "callout", "text": "리튬 사업가치는 가격 가정 하나로 수 배 변동합니다(POSCO 리튬 사업가치 2030년 8조원 추정 등). 램프업 중 적자 사업이 포함된 기업의 공모·메자닌은 가격 시나리오별 민감도와 C1 원가 달성 경로를 기재해야 합니다.", "title": "ECM·국내 연결점"}]}, {"h": "⑨ 특수합금 — 인증이 만든 공급자 우위", "note": "항공엔진·가스터빈·우주 수요가 겹친 시장에서 공장과 인증에 5년 가까이 걸리는 공급이 수요를 따라가지 못합니다.", "blocks": [{"t": "p", "text": "제트엔진 리드타임은 최대 60주로 늘었고, 엔진 애프터마켓은 역사 평균의 2배 속도로 성장합니다. 데이터센터 전력용 가스터빈 수주(Siemens Energy 8월 수주의 60%)와 민간 발사체 시장(CAGR +14.6%)이 수요에 더해졌습니다. 신규 진입에는 공장 18~36개월과 인증 24~48개월이 필요하여 기존 공급자의 가격결정력이 유지됩니다."}, {"t": "p", "text": "글로벌 선도 기업의 수익성이 이를 보여줍니다. Carpenter SAO 부문 EBITDA 마진 36.0%(FY4Q25), ATI HPMC 23.7%(2Q25), 2020~25년 이익 CAGR 각각 67%·35%. 국내에서는 세아베스틸지주가 미국 텍사스 SST(니켈합금 6,000톤, 2027 상업생산)를, 에이치브이엠이 진공용해 2,400톤을 운영합니다."}, {"t": "bullets", "items": ["글로벌 초합금 45.3만톤(2021) → 98.9만톤(2031E)", "", "니켈계 특수합금 대미 상호관세 15%", "초기 가동률 가정 78%(SST 2027)"]}, {"t": "callout", "text": "특수합금 신사업은 인증 전 고정비만 발생하는 램프업 구간이 있어 P/E 적용 시점이 너무 이르면 과대평가됩니다. 우주 기업 상장 이벤트(스페이스X 상장 추진 보도)가 관련 소재 기업 주가를 움직인 사례처럼 테마성 변동도 큽니다.", "title": "ECM·국내 연결점"}]}, {"h": "1년의 서사 — 2025년 6월부터 2026년 9월까지", "note": "2025년 가을 시장은 '철강은 구조적 과잉, 구리는 구조적 결핍'이라는 대비로 출발했습니다. 이후 1년 동안 철강은 '중국 감산 기대 → 실망 → 보호무역발 국지적 반등'으로, 비철은 '공급 사고 → TC 붕괴 → 전략자산화 → 황산·관세라는 새 병목'으로, 희토류·희소금속은 '중국 무기화 → 미국식 국가자본주의 대응'으로 서사가 전개되었습니다.", "blocks": [{"t": "timeline", "items": [{"date": "2025-06", "title": "미국 232조 철강 관세 50%로 인상", "body": "2월 25% 재개에 이어 6월 50%로 두 배 인상하고 한국 쿼터제를 폐지. 이후 한국 대미 강관 수출이 급감하고 지역별 가격 분절의 출발점이 됨", "tone": "부정"}, {"date": "2025-09", "title": "Grasberg 토사 유입·열연 잠정 반덤핑", "body": "세계 2위 구리 광산이 불가항력을 선언해 정광 부족이 심화. 같은 달 한국은 중·일산 열연에 28~33% 잠정관세를 부과해 국내 판가 반등의 씨앗을 뿌림", "tone": "중립"}, {"date": "2025-10", "title": "중국 희토류 통제 12종·역외적용", "body": "Ho·Er·Tm·Eu·Yb를 추가하고 0.1% 함량 역외적용, 장비·기술·인력 통제를 발표. 시장은 희토류가 실효적 외교 레버리지임을 재확인했다고 평가", "tone": "부정"}, {"date": "2025-11", "title": "미중 1년 유예·철강산업 고도화 방안·K-스틸법 통과", "body": "희토류 통제가 1년 유예됐고, 한국은 철근 구조조정 1순위 지정과 특수탄소강 지원을 담은 고도화 방안을 내놓았으며 K-스틸법이 국회를 통과. 전망 시즌 시장은 '구리 결핍·철강 과잉·리튬 반등'을 핵심 구도로 제시", "tone": "중립"}, {"date": "2025-12", "title": "CSPT 감산 합의·중국 경제공작회의", "body": "중국 제련소들이 2026년 가동률 10% 이상 감축에 합의하고 벤치마크 TC 0달러가 굳어짐. 중국 철강 감산의 구체적 수치는 이번에도 나오지 않아 '기대와 실망의 반복'이 이어짐", "tone": "중립"}, {"date": "2026-01", "title": "구리 사상 최고·은 100달러·중국 수출허가제·CBAM 시행", "body": "LME 3개월물이 $14,528로 사상 최고, 은은 온스당 100달러를 돌파했습니다. 중국 철강 수출허가제와 EU CBAM 비용 부과가 시작됐고 탄산리튬은 저점 대비 약 3배인 $23,000까지 반등", "tone": "긍정"}, {"date": "2026-02", "title": "Project Vault·짐바브웨 리튬 수출 중단·철근 수출 최대", "body": "미국이 120억달러 규모 핵심광물 비축을 발표하고 짐바브웨가 정광 수출을 무기한 중단. 한국 철근 수출은 월 13만톤으로 역대 최대, 철강 업종 PBR 0.44배로 코스피 대비 약 70% 할인이 부각", "tone": "긍정"}, {"date": "2026-03", "title": "이란 전쟁·호르무즈 봉쇄, 중국 PPI 플러스 전환", "body": "알루미늄·황·원유 공급망이 동시에 흔들리고 이란 철강사도 피격. 중국 PPI가 41개월 만에 플러스로 돌아서고 포스코아르헨티나가 첫 월간 흑자를 기록", "tone": "중립"}, {"date": "2026-04", "title": "구리 조정·ICSG 과잉 전망 전환", "body": "거래소 재고 124만톤(23년 최고)과 콘탱고 전환으로 구리가 조정받고, ICSG가 2026년 전망을 부족에서 9.6만톤 과잉으로 바꿈. 시장은 공급 과대 추정이라며 반박하고 '전략자산화' 논리를 유지", "tone": "중립"}, {"date": "2026-05", "title": "중국 설비 치환 규정 개정·황산 수출 중단·국내 판가 20%↑", "body": "치환비율 1.5:1 전국 통일로 구조조정이 '집행 단계'에 진입했다는 신호. 중국 황산 수출 중단으로 병목이 SX-EW 광산까지 확산. 하반기 전망에서 시장은 '드디어 돌아선 가격 지표, 업황 바닥 확인'을 선언", "tone": "긍정"}, {"date": "2026-06", "title": "열연 MIP 시행·광양 전기로·SST 준공·EU TRQ 개편", "body": "중·일산 열연 반덤핑 확정과 가격약속 병행, 도금재 잠정관세 발효. 포스코 250만톤 전기로와 세아 SST가 준공됐고 EU 쿼터 축소가 7월 시행을 앞둠. 시장은 '회복은 더디지만 싸다'로 요약", "tone": "긍정"}, {"date": "2026-07", "title": "포스코그룹 트리플 코어 선언", "body": "철강을 산업자원으로 재정의하고 리튬·희토류·LNG에 29.1조원을 배정. 철강사의 가치가 본업 스프레드보다 자본 재배치에 달려 있다는 인식이 확산", "tone": "긍정"}, {"date": "2026-08", "title": "현물 TC −$227.5·COMEX 사상 최고·DRC 정광 수출 제한", "body": "구리 현물 TC가 역사적 저점으로 추락하고 COMEX가 파운드당 6.88달러를 기록. 시장은 TC-구리가 역상관(확률 72~92%)을 근거로 2027년 추가 상승 압력을 제시", "tone": "긍정"}, {"date": "2026-09", "title": "LME 구리 재경신·OCTG 급등·호르무즈 재격화", "body": "LME 3개월물 $14,597로 신고가, 북미 OCTG 가격이 연초 대비 +31% 올라 강관사 4분기 이익 확장 전망. 철강 업계 전망은 '철강의 회복, 비철금속의 도약'으로 1년을 정리", "tone": "긍정"}]}]}, {"h": "상방 논리와 하방 논리", "blocks": [{"t": "proscons", "bull": ["중국 설비 치환 1.5:1·수출허가제·ETS가 실제 설비 폐쇄로 이어지면 장기 공급과잉률이 30%에서 15~20%로 낮아지고 아시아 판재 가격이 반등할 수 있습니다", "한국 무역구제(열연 MIP, 도금재·봉강 반덤핑, 조강국 확인)가 판가 하단을 지지하고, 원재료 하향 안정화(철광석 $95)로 2H26 고로 스프레드가 톤당 50만원으로 확대될 수 있습니다", "구리는 17년 리드타임·품위 하락·TC 마이너스로 공급이 비탄력적인데 데이터센터·전력망·국방·비축 수요가 가격 비탄력적으로 늘어 '하단 레벨업'이 지속될 수 있습니다", "중국 수출통제가 상시 정책 수단으로 자리 잡으면서 비중국 회수·정제·자석 역량(부산물 희소금속, NdPr 가격하한 모델)에 구조적 프리미엄이 형성됩니다", "리튬은 ESS 수요(2026E 450~750GWh)와 자원국 수출통제(짐바브웨 2027.01 금수)로 2027년 구조적 공급부족 진입 가능성이 있습니다", "특수합금·전기강판·HVDC 케이블처럼 인증 장벽이 있는 고부가 소재는 리드타임 장기화로 가격결정력이 유지됩니다"], "bear": ["중국이 폐쇄 없는 감산에 그치면 수요 회복 시 잉여 설비가 빠르게 재가동되고, 흑자 전환 후 자율감산 이탈(죄수의 딜레마)이 반복됩니다", "중국 부동산·국내 건설 회복 지연으로 철근·형강 수요가 더 줄고, 유통가 인상에 실수요가의 가격 저항이 커질 수 있습니다", "Grasberg·Kamoa-Kakula 조기 정상화, 미국 정련동 관세 확정·무산에 따른 COMEX 재고 역류, 110만톤 이상 거래소 재고가 구리 가격을 급락시킬 수 있습니다", "CATL 젠샤워·이춘시 광산 조기 재가동이나 짐바브웨 쿼터 유지로 리튬 가격 상승이 조기에 꺾일 수 있습니다", "미중 합의로 수출통제가 장기 유예되면 희토류·희소금속 프리미엄이 축소되고, 미국 정권 교체 시 가격하한·지분투자 정책의 지속성이 흔들립니다", "EU CBAM 무상할당 축소(2029~)와 TRQ 강화, 232조 파생제품 확대가 한국 철강 수출 채산성을 구조적으로 저하시킵니다"], "lt": "상방 — 회복·레벨업이 이어지는 조건", "rt": "하방 — 기대가 꺾이는 조건"}]}, {"h": "다음 6개월 체크리스트", "blocks": [{"t": "bullets", "items": ["중국 월간 조강·순수출 역성장 지속 여부와 설비 치환 규정에 따른 실제 폐쇄·M&A 건수", "국내 판재 유통가 상승분의 3분기 이후 자동차·조선 실수요 계약가 전이, 특수강봉강 반덤핑 예비판정(2026.09~10)", "2027년 구리 벤치마크 TC 협상(2026.4Q)과 미국 정련동 관세 최종 결정, COMEX-LME 스프레드", "중국 황산 가격 하락 전환 시 제련 감산 가속 여부(중국 정련동 월간 생산 YoY 감소 전환)", "2026년 11월 미중 희토류·갈륨·게르마늄 통제 유예 종료 후 중국의 조치", "짐바브웨 리튬 정광 금수(2027.01) 시행 강도와 CATL 광산 재가동 시점"]}]}]}, "policy": {"title": "정책·지정학 워치", "h2": "정책·지정학 워치 — 이슈별 심화", "en": "Policy & Geopolitics Watch", "lede": "2025~26년 금속 가격을 가장 크게 움직인 것은 수요가 아니라 **정책**이었습니다. 미국 관세, EU 탄소국경세, 한국 무역구제, 중국의 감산·수출통제, 자원국 원광 수출금지가 모두 날짜가 정해진 이벤트로 가격을 변화시켰습니다. 이슈별로 '무엇이·언제·어떤 경로로·국내에 어떤 영향을·무엇을 확인할지'를 같은 틀로 정리하고, 마지막에 30개 정책 전체 요약표를 덧붙였습니다.", "sections": [{"h": "① 중국 반내권 — 설비 치환·수출허가·ETS를 통한 공급 통제", "tag": "확인", "blocks": [{"t": "brief", "items": [{"k": "무엇이", "v": "반내권(과잉경쟁 억제) 기조 아래 신규 조강 설비 금지, 설비 치환비율 전국 1.5:1 통일(M&A 1.25:1 우대), 기업 간 생산능력 거래 폐지(2028-05-18), 약 300개 품목 수출허가제, 철강 전국 ETS 편입."}, {"k": "언제", "v": "안정성장 업무방안 2025-09 / 수출허가제 2026-01-01 / 치환 규정 개정 2026-05-18 / ETS 2단계(벤치마크·유상할당) 2027~."}, {"k": "산업 경로", "v": "편법 증설 차단 → 대형사 중심 M&A → 순증설 억제. 수출허가로 허위 저가수출(마  이익의 원천이 멀티플을 결정", "en": "Valuation", "lede": "금속 업종 밸류에이션의 핵심은 '같은 금속 회사라도 이익의 원천이 다르면 멀티플이 다르다'는 것입니다. 범용 철강은 자산가치(PBR)와 ROE 정상화 여부로, 다각화 기업은 사업부별 합산(SOTP)으로, 희토류·특수합금처럼 정책·인증이 공급을 제한하는 영역은 미래 현금흐름의 하단을 선반영한 높은 멀티플로 평가됩니다. 시장이 공통으로 제시한 업종 내 서열은 철강 < 리튬·구리 가공 < 특수합금입니다. 이 탭은 **기업 유형별 방법론 매칭 → 멀티플 사다리 도식 → 방법론별 함정 → 섹터 주가 드라이버 → IPO·자본시장 동향** 순서로 정리했습니다. 개별 기업의 적정가치나 투자 판단은 다루지 않습니다.", "sections": [{"h": "기업 유형별 방법론 매칭", "blocks": [{"t": "table", "cols": ["기업 유형", "이익 원천", "1차 방법론", "보조 방법론", "시장 인용 밴드(시점별)", "가장 흔한 실수"], "rows": [["고로 철강", "판가-원료 스프레드 × 물량", "PBR-ROE(잔여이익) 밴드", "업종 상대 PBR 디스카운트", "12M Fwd P/B 0.2~0.5배, 글로벌 평균 PBR 약 1.0배", "2015년식 리레이팅 가정"], ["전기로·철근", "스크랩 스프레드 × 가동률", "PBR-ROE", "자산가치(설비·자사주)", "업종 PBR 0.44배(2026-02)·0.68배(2026-06)", "구조조정 효과 선반영"], ["에너지 강관", "미국 판가 − 원가 − 관세", "유가 연동 PBR", "해상풍력 자회사 SOTP", "WTI 80달러 전제 시 PBR 약 0.4배 예시", "리그 반응계수 둔화 무시"], ["신동·전선 가공", "롤마진 + 메탈게인 / 수주잔고", "정상이익 기준 PBR·P/E", "SOTP(방산 등)", "", "메탈게인 포함 이익에 P/E"], ["다금속 제련", "Free Metal + 부산물 + 희소금속", "ROE-PBR", "EV/EBITDA·해외 거점 옵션", "PBR 약 1.9~2.1배, EV/EBITDA 16.2배(2025) → 9.2배(2026E)", "일회성 귀금속 이익 반복 가정"], ["리튬", "(판가 − C1) × 물량", "EV/EBITDA(정상 가동 연도)", "PSR·가격 시나리오", "글로벌 리튬 EV/EBITDA 약 6.8배, PBR 약 2.4배", "단일 가격 가정"], ["특수합금", "Base Price(인증) + Surcharge", "EV/EBITDA", "P/E(신공장, 할인)", "", "인증 전 신공장에 P/E"], ["희토류·자석", "정책 하한·오프테이크", "EV/Sales·PSR", "유사거래 멀티플(할인)", "MP PSR 약 40배·Lynas 약 20배·JL Mag 약 6배", "MOU를 확정 계약으로 간주"], ["지주사", "자회사 합산", "SOTP·NAV 할인(30~50%)", "지분 유동화 효과", "사업형 지주 NAV 할인 30~50%", "중복상장·PRS 정산 리스크 누락"]], "note": "밴드는 Bloomberg 시장 컨센서스·업계 추정이며 시점이 서로 다릅니다. 공모가 산정에 직접 사용하지 말고 피어 선정의 출발점으로만 활용해야 합니다."}]}, {"h": "멀티플 사다리 — 가격 민감도가 낮을수록 높은 멀티플", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 940 380\" role=\"img\" aria-label=\"같은 금속 기업이라도 이익이 가격 스프레드에서 인증·정책으로 옮겨갈수록 적용 멀티플이 계단식으로 높아진다\"><defs><marker id=\"a-mt17\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 t)\">특수합금<\/text><text x=\"651\" y=\"150\" font-size=\"11\" text-anchor=\"middle\" opacity=\".8\">인증·리드타임<\/text><text x=\"651\" y=\"166\" font-size=\"11\" text-anchor=\"middle\" opacity=\".8\">EV/EBITDA·P/E<\/text><text x=\"651\" y=\"184\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">EV/EBITDA 약 25.3배<\/text><rect x=\"748\" y=\"70\" width=\"170\" height=\"230\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"833\" y=\"92\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">희토류·자석<\/text><text x=\"833\" y=\"110\" font-size=\"11\" text-anchor=\"middle\" opacity=\".8\">정책 하단·독점<\/text><text x=\"833\" y=\"126\" font-size=\"11\" text-anchor=\"middle\" opacity=\".8\">EV/Sales·PSR<\/text><text x=\"833\" y=\"144\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">MP PSR 약 40배<\/text><path d=\"M20 330 L920 330\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.6\" marker-end=\"url(#a-mt17)\"/><text x=\"470\" y=\"350\" font-size=\"12\" text-anchor=\"middle\">이익 원천: 가격 스프레드 → 가공마진 → 부산물·자원 → 인증 장벽 → 정책이 만든 가격 하단<\/text><text x=\"20\" y=\"40\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--accent)\">가격 민감도 ↓  진입장벽 ↑  →  멀티플 ↑<\/text><text x=\"470\" y=\"372\" font-size=\"11\" text-anchor=\"middle\" opacity=\".7\">밴드는 피어 수치(2026년 시점별) — 개별 기업 적정가치가 아니다<\/text><\/svg>", "cap": "**시장이 공통으로 제시한 업종 내 서열은 범용 철강 < 신동·가공 < 제련·리튬 < 특수합금 < 희토류·자석이며, 이 서열은 '이익이 금속 가격에 얼마나 덜 흔들리고 진입장벽이 얼마나 높은가'의 순서입니다.** 따라서 같은 공모 기업도 어느 계단의 피어셋을 쓰느냐에 따라 밸류가 몇 배 달라집니다. ECM 실무의 핵심 질문은 '이 회사의 이익은 어느 계단에서 나오는가'이며, 여러 계단에 걸쳐 있으면 SOTP로 나누어야 합니다."}]}, {"h": "방법론 9가지 — 언제 쓰고 어디서 틀리나", "blocks": [{"t": "mods", "open": 1, "items": [{"name": "PBR-ROE(잔여이익) 밴드", "fields": [{"k": "언제 쓰나", "v": "범용 철강(고로·전기로)처럼 이익 변동이 크고 자산이 무거운 기업, 강관처럼 사이클 연동성이 큰 업종"}, {"k": "어떻게", "v": "적정 P/B = (ROE − g) / (COE − g). COE는 무위험이자율+베타×시장위험프리미엄. 과거 유사 업황 구간(스프레드·판매량이 비슷한 시기)의 PBR 중간값을 적용하거나 12개월 선행 PBR 밴드의 하단·평균 회귀를 확인합니다."}, {"k": "시장 인용 밴드", "v": "국내 고로사 12M Fwd P/B 0.2~0.5배(2026, 역사적 저점권). POSCO홀딩스 0.4~0.5배(2분기 일시 0.6~0.7배), 현대제철 0.19~0.3배(20년 중앙값 0.4배). 2015년 말 중국 구조개혁 발표 당시 0.6~0.8배. 글로벌 철강사 평균 PBR 약 1.0배, PER 12.8배(2026E). 업계 추정·Bloomberg"}, {"k": "함정", "v": "ROE가 1~3%대로 낮아 PBR 할인이 '저평가'가 아니라 '정당한 할인'일 수 있습니다. 2015년과 달리 중국 부동산 회복 가시성이 낮아 동일 폭 리레이팅 가정은 위험하며, 자회사 손실(건설·리튬 램프업)이 연결 ROE를 왜곡합니다."}]}, {"name": "업종 상대 PBR 디스카운트", "fields": [{"k": "언제 쓰나", "v": "지수 변동성이 둔화되며 저PBR 업종이 반등하는 '키 맞추기' 국면, 업종 전체의 저평가 정도를 판단할 때"}, {"k": "어떻게", "v": "업종 PBR과 코스피 PBR의 괴리율을 역사 평균과 비교하여 괴리 해소 여지를 가늠합니다."}, {"k": "시장 인용 밴드", "v": "철강 업종 PBR 0.44배, 코스피(1.5배) 대비 약 70% 할인(2026.02). KRX 철강 지수 PBR 0.68배, 할인율 67%(2026.06) vs 2008년 이후 평균 33%. 업계 추정"}, {"k": "함정", "v": "PBR이 37% 올라도 0.6배에 불과할 정도로 절대 수준이 낮지만, 괴리 해소는 실적(스프레드) 확인이 전제입니다. 시점별로 수치가 달라 인용 시 기준일을 명시해야 합니다."}]}, {"name": "사업부별 SOTP(EV/EBITDA 합산)", "fields": [{"k": "언제 쓰나", "v": "철강+리튬, 신동+방산, 제련+전선+전력기기처럼 이종 사업을 겸영하는 기업과 지주사"}, {"k": "어떻게", "v": "사업부별 차기 EBITDA에 해당 업종 피어 EV/EBITDA를 적용하여 합산하고, 상장 자회사는 시가에 할인, 순차입금을 차감합니다. 사업형 지주사는 NAV에 30~50% 할인을 적용합니다."}, {"k": "시장 인용 밴드", "v": "2027년 EV/EBITDA 피어 평균: 글로벌 철강 약 6.5배, 구리 가공(신동) 약 8.7배, 특수합금(Carpenter·ATI) 약 25.3배, 글로벌 리튬 평균 약 6.8배(2028 EBITDA 기준), 방산은 방산 피어에 20% 할인. Bloomberg 시장 컨센서스"}, {"k": "함정", "v": "사업부 분리 공시가 불충분하면 EBITDA 배분이 자의적이 됩니다. 지주사 할인율(중복상장 규제, 유통주식 비율)과 자회사 지분 유동화(PRS·EB)의 정산 리스크가 NAV에 큰 영향을 미칩니다."}]}, {"name": "리튬 사업가치(EV/EBITDA·PSR·원가 커브)", "fields": [{"k": "언제 쓰나", "v": "지주사 내 리튬 자회사, 램프업 중 적자인 신규 광산·정제 사업"}, {"k": "어떻게", "v": "정상 가동 연도(예: 2028E) EBITDA에 글로벌 리튬 피어 멀티플을 적용하거나 미래 매출×피어 PSR로 산정하고, 리튬 가격 시나리오(LCE $20,000·25,000/t)별 민감도를 덧붙입니다. C1 원가 대비 판가 마진이 지속 가능성의 기준입니다."}, {"k": "시장 인용 밴드", "v": "글로벌 리튬 업종 평균 PBR 약 2.4배(2026E). POSCO 리튬 사업가치 업계 추정 2030년 8조원·2035년 11조원(가격 가정 의존). 리튬 가격 $25/kg 지지 시 2028년 리튬 영업이익 약 5,179억원 추정"}, {"k": "함정", "v": "가격 가정 하나로 가치가 수 배 변동합니다. 자원국의 정부 몫 확대(칠레 SQM 2031년부터 영업이익의 85%) 같은 제도 변화, 기관별 수요 전망 편차(최대 3배)를 반드시 시나리오로 반영해야 합니다."}]}, {"name": "정책 옵션가치(EV/Sales·PSR) — 희토류·희소금속", "fields": [{"k": "언제 쓰나", "v": "매출·이익이 아직 작지만 배타적 공급 지위와 정부 가격하한·오프테이크가 있는 비중국 희토류·자석·희소금속 기업"}, {"k": "어떻게", "v": "현재 이익이 아닌 정책이 보강한 미래 현금흐름의 하단(가격하한·구매보장)을 선반영하여 EV/Sales·PSR로 평가합니다. 유사 거래 멀티플(예: USA Rare Earth의 영국 금속 제조사 인수 EV/Sales 19배)에 보수적 할인을 적용합니다."}, {"k": "시장 인용 밴드", "v": "글로벌 광산사 평균 PBR 2.1~2.3배 대비 희토류 기업 100% 이상 프리미엄. 업계 추정"}, {"k": "함정", "v": "Molycorp는 2010~11년 가격 10배 급등기에 주가가 10배 오른 뒤 가격 90% 하락으로 2015년 파산했습니다. 현물 가격보다 가격하한·구매계약 같은 하방 장치의 존재와 집행 단계(MOU vs 실계약), 정권 교체 리스크를 먼저 확인해야 합니다."}]}, {"name": "P/E(방산·특수합금 신사업)", "fields": [{"k": "언제 쓰나", "v": "탄약 등 방산 부문, 순이익 가시성이 생긴 특수합금 신공장"}, {"k": "어떻게", "v": "목표 연도 순이익에 피어 P/E를 적용하되, 제품 한정·납기 변동성·램프업 리스크를 할인으로 반영합니다."}, {"k": "시장 인용 밴드", "v": "특수합금 신사업: 글로벌 특수합금 피어 PER 대비 약 20% 할인 적용 예시(2028E 순이익 기준). 신동+방산 겸영 기업 P/E 7.8~15배로 K-방산 피어(약 21.6배) 대비 47~76% 할인(2026년 시점별). 업계 추정"}, {"k": "함정", "v": "방산 사업 분할·매각 등 지배구조 불확실성, 선적 차질·수락시험 지연에 따른 매출 이연이 할인을 정당화합니다. 신공장은 인증 획득 전 이익이 없어 P/E 적용 시점이 너무 이르면 과대평가됩니다."}]}, {"name": "제련사 SOTP와 ROE-PBR", "fields": [{"k": "언제 쓰나", "v": "아연·연·구리 제련사처럼 본업(TC·Free Metal)과 부산물·희소금속·해외 신규 거점이 섞인 기업"}, {"k": "어떻게", "v": "본업은 ROE 대비 PBR(역사적으로 ROE 10% 시기 최고 PBR 약 1.8배)로, 희소금속·해외 제련소 거점은 별도 옵션가치로 분리하여 합산합니다. 이익 급증기에는 EV/EBITDA 압축 여부를 확인합니다."}, {"k": "시장 인용 밴드", "v": "2026-06 기준 P/E 20.8배, P/B 2.1배. 업계 추정"}, {"k": "함정", "v": "1Q26 이익의 상당 부분이 금·은 가격 급등과 판가·원가 시차(일회성)에서 발생했습니다. 연 5조원대 CAPEX(2027~28E)와 차입 증가, 경영권 분쟁에 따른 유통물량 이슈가 멀티플에 영향을 미칩니다."}]}, {"name": "신동·가공업체 PBR vs ROE(정상 이익 기준)", "fields": [{"k": "언제 쓰나", "v": "구리 가격에 이익이 즉시 반응하는 신동·황동봉·동 선재 업체"}, {"k": "어떻게", "v": "메탈게인·재고평가이익을 제외한 정상 이익 기준 ROE와 PBR을 비교하고, 과거 최대 실적기 PBR 밴드와 대조합니다."}, {"k": "시장 인용 밴드", "v": "업계 추정"}, {"k": "함정", "v": "가격 하락 반전 시 역래깅으로 이익이 급감합니다. 헤지 파생손익이 금융비용으로 계상되어 영업이익과 순이익이 괴리될 수 있습니다."}]}, {"name": "유가 연동 PBR — 에너지 강관", "fields": [{"k": "언제 쓰나", "v": "OCTG·라인파이프 등 미국 시추 활동에 연동되는 강관사"}, {"k": "어떻게", "v": "WTI와 PBR의 높은 상관관계를 이용하여 유가 가정에 따라 적정 PBR을 설정하고, 해외 법인·해상풍력 자회사는 SOTP로 별도 가산합니다."}, {"k": "시장 인용 밴드", "v": "WTI 배럴당 80달러 유지 전제 시 적정 PBR 약 0.4배 적용 예시. 해상풍력 자회사는 유럽 해상풍력 업종 멀티플 적용. 업계 추정"}, {"k": "함정", "v": "유가-리그 반응계수가 둔화(5.92 → 1.79)되어 유가가 올라도 물량 효과가 약할 수 있습니다. 해상풍력 자회사의 일회성 충당금(1,100억원)처럼 초기 단계 자회사가 현금을 소모합니다."}]}]}]}, {"h": "섹터 주가 드라이버 — 무엇이 멀티플을 움직이나", "blocks": [{"t": "grid", "cols": 3, "items": [{"h": "철강", "p": "중국 순수출·감산 이행, 국내 유통가와 실수요 계약가 전이, 무역구제 판정 일정, 업종 PBR의 코스피 대비 할인율(2008년 이후 평균 33% vs 2026-06 67%)."}, {"h": "구리·제련", "p": "LME·COMEX 가격과 스프레드, 벤치마크 TC 협상, 금·은 가격, 희소금속 가격과 회수율, 해외 제련소 CAPEX와 차입."}, {"h": "희토류·희소금속", "p": "중국 수출통제 이벤트(2026-11 유예 종료), 미국 정부 계약·지분투자 발표, 역외 가격 스프레드, 고객 인증 공시."}, {"h": "리튬", "p": "탄산리튬 현물가, 짐바브웨 금수·CATL 광산 재가동, ESS 출하, 램프업 가동률과 C1 원가."}, {"h": "특수합금·소재", "p": "항공기 인도·엔진 MRO, 가스터빈 수주, 우주 발사·관련 기업 상장 이벤트, 인증 획득 공시, 신공장 가동률."}, {"h": "지주·자본정책", "p": "상장 자회사 지분 유동화(블록딜·EB·PRS), 중복상장 규제, 자사주 소각, 주주환원 정책(예: 조정 지배순이익의 35~40%)."}]}]}, {"h": "IPO·자본시장 동향과 ECM 시사점", "blocks": [{"t": "callout", "text": "금속 업종의 공모·메자닌은 '어느 계단의 이익인가'를 먼저 확정한 뒤 피어를 선정합니다. 범용 철강(PBR 0.2~0.5배), 신동·가공(EV/EBITDA 약 8.7배), 리튬(피어 PBR 약 2.4배), 특수합금(EV/EBITDA 약 25배), 희토류·자석(EV/Sales 옵션가치)을 한 피어셋에 혼합하면 밴드가 무의미해집니다.", "title": "피어 선정이 공모가의 절반을 좌우합니다"}, {"t": "bullets", "items": ["IPO 피어 선정 시 '금속'으로 묶지 말고 이익 원천별로 나누어야 합니다: 범용 철강(PBR 0.2~0.5배), 신동·가공(EV/EBITDA 약 8.7배), 리튬(피어 PBR 약 2.4배), 특수합금(EV/EBITDA 약 25배), 희토류·자석(EV/Sales 기반 옵션가치). 같은 공모기업도 어떤 피어셋을 사용하느냐에 따라 공모가 밴드가 몇 배 달라집니다.", "메탈게인·재고평가이익이 섞인 이익으로 P/E를 적용하면 공모가가 사이클 고점에 맞춰집니다. 증권신고서의 실적 분해(가공마진 vs 메탈 관련 이익)와 정상화 이익 기준 밸류에이션 병기가 필요합니다.", "희토류·특수합금·HVDC처럼 '인증·정책'이 가치를 만드는 영역은 MOU·LOI·프레임워크가 확정 계약과 혼재되어 홍보되기 쉽습니다. 정부 자금 집행 단계, 고객 품질인증 완료, 프레임워크의 PO 전환 여부를 투자위험요소에 구분 기재해야 합니다.", "지주사의 자회사 지분 유동화(블록딜·EB·PRS)는 ECM 실무 기회이자 리스크입니다. PRS는 매각 충격을 분산하지만 사후 정산 시 자회사 주가 하락 손실을 지주사가 부담하고, EB는 교환가가 자회사 주가 상단을 제약합니다. 중복상장 규제 강화 흐름은 비상장 핵심 자회사(LS전선·LS MnM 등) 가치를 지주사에 남기는 방향입니다.", "업황 저점의 저PBR 철강사 메자닌(CB·EB)은 리픽싱 하단과 탄소비용(K-ETS 부족분·CBAM) 같은 장기 원가 변수를 함께 확인해야 합니다. 대규모 해외 CAPEX(루이지애나·인도·Crucible)의 자금조달 구조가 향후 추가 조달 수요로 이어질 수 있습니다.", "POSCO홀딩스는 2027년 말까지 핵심 상장 자회사 지분을 50%로 낮춰 약 3.6조원을 확보하고 90%는 리튬 등 전략자원, 10%는 자사주 매입·소각에 사용하겠다고 밝혔습니다 — 블록딜·EB·PRS 등 지분 유동화 딜의 공급원입니다.", "고려아연은 유형자산 취득이 2026E 0.5조원에서 2027E 5.5조원·2028E 5.0조원으로 급증할 것으로 추정되고, 미국 테네시 제련소(총 74억달러)는 미 정부·금융기관 차입 47억달러를 전제로 합니다 — 대규모 CAPEX 사이클은 추가 자본조달 수요로 이어질 수 있습니다.", "미국 정부의 직접 지분투자(MP Materials·Trilogy Metals·Lithium Americas 등)는 해외 핵심광물 피어의 멀티플을 정책 프리미엄으로 끌어올렸습니다. 국내 공모 기업이 이 피어를 그대로 사용하면 정책 지원이 없는 국내 기업이 과대평가됩니다.", "우주 기업 상장 추진 보도가 특수합금 공장 가치를 부각시켜 관련 소재 기업 주가가 급등했다가 이벤트 소멸 우려로 조정받은 사례가 있습니다 — 테마성 변동이 큰 구간의 공모 일정은 수요예측 변동성을 감안해야 합니다.", "중복상장 규제 강화(원칙 금지·예외 허용) 흐름은 LS전선·LS MnM 같은 비상장 핵심 자회사의 별도 상장을 어렵게 하고, 그 가치를 지주사 NAV에 남기는 방향입니다."]}]}]}, "check": {"title": "체크포인트", "h2": "체크포인트 — 딜 검토용 질문 목록", "en": "Due-Diligence Checkpoints", "lede": "금속 기업 딜 검토는 '금속 가격이 오르면 좋은 회사인가'라는 질문으로는 걸러낼 수 있는 것이 없습니다. 먼저 **기업 유형별 5분 스캔**으로 이익의 원천과 가장 흔한 착시를 확인하고, **영역별 세부 체크리스트**로 내려간 뒤, 마지막으로 모든 유형에 공통인 **레드플래그**를 통과시킵니다.", "sections": [{"h": "기업 유형별 5분 스캔", "blocks": [{"t": "table", "cols": ["기업 유형", "먼저 볼 숫자", "이익 원천 분해", "가장 흔한 착시", "참고 탭"], "rows": [["고로 철강", "열연-철광석 스프레드, 판매량, 배출권 부족분", "스프레드 × 물량 − 고정비 − 탄소비용", "유통가 상승 = 평균 판가 상승", "04·05·11"], ["전기로·철근", "철근 스프레드, 가동률, 수출 물량", "스크랩 스프레드 × 가동률", "일시적 대미 수출을 구조적 수요로 간주", "04·09"], ["에너지 강관", "OCTG 가격, 리그 수, 관세 후 채산성", "미국 판가 − 열연 원가 − 관세 − 운임", "유가 상승 = 물량 증가(반응계수 둔화)", "05·09"], ["신동·전선", "메탈게인 비중, 에스컬레이션 비율, 잔고", "가공마진 + 메탈게인 + 수주잔고 마진", "메탈게인 포함 이익에 P/E", "04·11"], ["다금속 제련", "금·은 매출 비중, 희소금속 GPM, 회수율", "TC + Free Metal + 부산물 + 메탈게인", "귀금속 급등기 이익의 반복 가정", "02·04"], ["희토류·자석", "정부 계약 단계, 고객 인증, Dy·Tb 조달처", "정책 하한 × 물량 + 오프테이크", "MOU·LOI를 확정 매출로 간주", "06·10"], ["리튬", "C1 원가, 가동률, 가격 가정", "(판가 − C1) × 물량", "단일 가격 시나리오", "02·09"], ["특수합금", "인증 현황, 신공장 가동률, 리드타임", "Base Price 마진 + Surcharge 전가", "인증 전 신공장의 P/E 평가", "02·09·11"]], "note": "참고 탭 번호: 02 공정 백과, 04 가격·스프레드 before": true, "blocks": [{"t": "p", "text": "칩으로 하위섹터를, 드롭다운으로 국내·해외·비상장을 필터링할 수 있습니다. '핵심 포인트'는 자료 시점의 사실(실적·캐파·계약)만 옮겼고 평가 표현은 제외했습니다. 해외 기업은 국내 기업의 피어 또는 공급망 상대방으로 포함했습니다."}]}]}, "cal": {"title": "이벤트 캘린더", "en": "Event Calendar", "special": "calendar", "lede": "금속 가격은 날짜가 정해진 정책 이벤트로 움직입니다. 아래 목록은 **확정 일정**(발표·시행일이 공표된 것)과 **예정 일정**(기업·기관이 제시한 목표·예상 시점)을 함께 담았습니다 — 월만 있거나 분기·연도로 표기된 항목은 미확정으로 해석합니다. 목록 아래에 날짜가 변동될 수 있는 이벤트와 ECM 관점의 연간 운용을 정리했습니다.", "sections": [{"h": "미확정 이벤트 — 날짜나 결과가 바뀔 수 있는 것", "blocks": [{"t": "table", "cols": ["이벤트", "현재 상태", "확정되면 무엇이 움직이나"], "rows": [["미국 정련동 관세", "상무부 2027년 15%·2028년 30% 권고, 최종 결정 미발표", "COMEX-LME 스프레드, 거래소 재고 역류, 구리 가공품 수출"], ["미중 희토류·희소금속 통제 유예", "2026-11-10 종료 예정, 연장 여부 미정", "Dy·Tb·Y 역외가, 갈륨·게르마늄·안티모니 가격"], ["EU CBAM 인증서 구매·신고 개시", "원문 2027년 2월 vs 5월 표기 상이", "EU 수출 철강사의 현금 지출 시점"], ["중국산 봉강 반덤핑 예비판정", "2026년 9~10월 예정, 세율 미정", "특수강 봉강 점유율·판매량"], ["2027년 구리 벤치마크 TC", "2026-4Q 협상, 고정 vs 현물지수 연동 방식 논의", "제련사 수수료 수입, 정광 수급 인식"], ["Grasberg 정상화", "2H26 가동률 65%, 2027년 말 완전 정상화 근접 예상", "정광 공급·TC 반등 여부"], ["CATL 젠샤워 광산 재가동", "2025-08 이후 중단 장기화", "탄산리튬 가격 박스권 하단"], ["짐바브웨 리튬 정광 금수", "2027-01 시행 예고, 예외·쿼터 운용 불확실", "리튬 공급 약 7~10%"]]}]}, {"h": "ECM 관점 연간 운용", "blocks": [{"t": "grid", "cols": 2, "numbered": true, "items": [{"h": "1분기 — 연간 계약과 연말 실적이 확정되는 시기", "p": ["벤치마크 TC 적용 개시, 중국 양회의 철강 감산 목표 발표 여부, 전년 4분기 실적과 연간 가이던스가 발표됩니다.", "금속 기업은 연말 재고평가(메탈게인·로스)가 확정되는 시점이라 정상이익 분해가 가장 명확합니다. 증권신고서 실적 기준 시점으로 유리합니다."]}, {"h": "2분기 — 하반기 전망과 무역구제 판정", "p": ["5~6월 하반기 전망 시즌, 한국 무역구제 판정과 조선용 후판 상반기 협상 타결, 232조 파생제품 5월 확대 창이 겹칩니다.", "수요예측 전에 피어 멀티플을 최신 판정 결과로 재설정합니다."]}, {"h": "3분기 — 비수기와 정책 이벤트", "p": ["철강은 계절 비수기(3분기)라 실적 모멘텀이 부족하고, 232조 9월 확대 창·미중 유예 만료 전 이벤트가 몰립니다.", "반기 실적의 일회성(메탈게인·귀금속) 비중을 점검하고, 정책 결과 발표일과 청약일이 겹치지 않도록 일정을 수립합니다."]}, {"h": "4분기 — 다음 해 가격의 뼈대 형성", "p": ["차년도 벤치마크 TC 협상, 10~11월 연간 전망 시즌, 하반기 후판 협상, ICSG 전망 발표가 몰립니다.", "다음 해 공모 기업의 사업계획 가격 전제를 이 시기 컨센서스와 대조하여 과도한 가정을 걸러냅니다."]}]}]}]}, "gloss": {"title": "용어 사전", "en": "Gl 연을 한 곳에서 수행하는 제철소", "group": "철강 공정·제품"}, {"term": "슬래브·블룸·빌릿", "en": "Slab·Bloom·Billet", "def": "연속주조로 만든 반제품. 판재용 판상, 대형 봉상, 소형 봉상 순", "group": "철강 공정·제품"}, {"term": "열연강판", "en": "HRC(Hot Rolled Coil)", "def": "슬래브를 고온 압연한 판재. 냉연·도금·강관의 기초 소재이자 국내 판재 가격 기준점", "group": "철강 공정·제품"}, {"term": "후판", "en": "Heavy Plate", "def": "두께 6mm 이상 강판. 조선·교량·해양구조물·압력용기용", "group": "철강 공정·제품"}, {"term": "냉연·도금강판", "en": "CR / GI·GL", "def": "열연을 상온 압연한 뒤 아연 등으로 도금한 표면처리 강판", "group": "철강 공정·제품"}, {"term": "전기강판(GO/NO)", "en": "Electrical Steel", "def": "방향성(변압기 철심)과 무방향성(모터 코어)으로 나뉘는 규소강판", "group": "철강 공정·제품"}, {"term": "봉형강", "en": "Long Products", "def": "철근·형강·봉강 등 막대·형태 단면의 강재. 주로 전기로에서 생산", "group": "철강 공정·제품"}, {"term": "특수강 봉강", "en": "SBQ", "def": "탄소강·합금강을 압연·단조한 봉 형태 제품. 자동차·기계·방산 부품용", "group": "철강 공정·제품"}, {"term": "OCTG", "en": "Oil Country Tubular Goods", "def": "유정관·케이싱·튜빙 등 원유·가스 시추·생산용 강관 총칭", "group": "철강 공정·제품"}, {"term": "모노파일", "en": "Monopile", "def": "해상풍력 터빈을 해저에 고정하는 대형 단일 강관 기초구조물", "group": "철강 공정·제품"}, {"term": "롤마진", "en": "Roll Margin", "def": "철강 제품가격에서 원재료 투입원가를 뺀 압연 마진(스프레드)", "group": "철강 공정·제품"}, {"term": "명목수요", "en": "Apparent Steel Use", "def": "생산+수입−수출로 계산한 겉보기 철강 소비량", "group": "철강 공정·제품"}, {"term": "배치식 가동", "en": "Batch Operation", "def": "전기로처럼 필요할 때마다 가동하는 방식. 차지 수·조업일 조정으로 감산이 쉬움", "group": "철강 공정·제품"}, {"term": "DRI", "en": "Direct Reduced Iron", "def": "가스·수소로 철광석을 직접 환원한 철. 전기로 원료", "group": "철강 공정·제품"}, {"term": "수소환원제철", "en": "Hydrogen-based Steelmaking(HyREX)", "def": "환원제로 석탄 대신 수소를 써 CO2 대신 물을 배출하는 저탄소 제철. HyREX는 유동환원로 기반 포스코 공정", "group": "철강 공정·제품"}, {"term": "DUC", "en": "Drilled but Uncompleted", "def": "시추는 끝났으나 완결(프래킹)되지 않은 유정 재고. 시추 활동 선행지표", "group": "철강 공정·제품"}, {"term": "전기동", "en": "Copper Cathode", "def": "전해정련으로 만든 순도 99.99% 구리 판. LME·COMEX·SHFE 표준 상품", "group": "비철·제련"}, {"term": "정광", "en": "Concentrate", "def": "광석을 선광해 목적 금속 함량을 높인 중간재(구리 약 25%)", "group": "비철·제련"}, {"term": "품위", "en": "Ore Grade", "def": "광석·정광 속 목적 금속 함량 비율. 낮을수록 같은 금속을 얻는 데 더 많은 광석·에너지 필요", "group": "비철·제련"}, {"term": "TC/RC", "en": "Treatment/Refining Charge", "def": "광산이 정광을 넘길 때 제련·정련 대가로 제련소에 지불하는 수수료. 정광이 부족하면 낮아지고 마이너스도 가능", "group": "비철·제련"}, {"term": "벤치마크 TC vs 현물 TC", "en": "Benchmark vs Spot TC", "def": "연말 대형 광산-중국 제련소가 정하는 연간 고정 수수료와 현물시장 실시간 수수료. 현물이 벤치마크에 선행", "group": "비철·제련"}, {"term": "CSPT", "en": "China Smelters Purchase Team", "def": "중국 주요 동 제련소 구매연합. 벤치마크 TC 협상 주체", "group": "비철·제련"}, {"term": "Free Metal", "en": "Free Metal", "def": "정광 매입 payable 비율보다 실제 회수율이 높아 원가 없이 매출로 인식되는 금속분", "group": "비철·제련"}, {"term": "Payable", "en": "Payable", "def": "정광 대금 산정 시 함유 금속 중 지불 대상 비율(아연 85%, 연 95%, 동 96% 등)", "group": "비철·제련"}, {"term": "부산물 경제", "en": "By-product Economics", "def": "TC 수익이 사라진 제련소가 금·은·황산·희소금속 부산물로 수익을 내는 구조", "group": "비철·제련"}, {"term": "SX-EW", "en": "Solvent Extraction-Electrowinning", "def": "저품위 산화광을 황산으로 침출해 용매추출·전해채취로 전기동을 만드는 습식 공정. 세계 정련동의 약 1/5", "group": "비철·제련"}, {"term": "Fumer", "en": "Fuming Furnace", "def": "제련 부산물을 고온 기화시켜 금속별 응고 온도 차로 유가금속을 회수하는 설비", "group": "비철·제련"}, {"term": "신동", "en": "Copper Fabrication", "def": "구리·동합금을 판·대·봉·관·선 형태로 가공하는 산업", "group": "비철·제련"}, {"term": "메탈게인·래깅 효과", "en": "Metal Gain / Lagging", "def": "원재료 매입과 판매의 시차로 금속가 상승기에 생기는 재고평가이익. 하락기엔 반대로 손실", "group": "비철·제련"}, {"term": "에스컬레이션 조항", "en": "Escalation Clause", "def": "전선 등 공급계약에서 구리 등 원재료 변동을 판가에 연동하는 조항", "group": "비철·제련"}, {"term": "LME·COMEX·SHFE", "en": "Exchanges", "def": "런던금속거래소, 뉴욕상품거래소(CME), 상하이선물거래소. 비철 가격·재고의 3대 기준", "group": "비철·제련"}, {"term": "콘탱고·백워데이션", "en": "Contango / Backwardation", "def": "선물가가 현물보다 높은 상태와 낮은 상태. 백워데이션은 실물 타이트 신호", "group": "비철·제련"}, {"term": "양산 프리미엄", "en": "Yangshan Copper Premium", "def": "상하이 양산항 보세 전기동 수입 프리미엄. 중국 실물 수입 수요 지표", "group": "비철·제련"}, {"term": "ICSG", "en": "International Copper Study Group", "def": "국제구리연구그룹. 4월·10월 구리 수급 전망 발표", "group": "비철·제련"}, {"term": "Incentive Price", "en": "Incentive Price", "def": "신규 광산 개발을 유인하는 최소 금속 가격. 구리 약 $10,000~12,000/t", "group": "비철·제련"}, {"term": "AISC·C1 원가", "en": "All-In Sustaining Cost / C1", "def": "AISC는 운영·유지투자·관리비를 포함한 총유지비용, C1은 직접 현금원가(C2는 감가상각, C3는 금융·로열티 추가)", "group": "비철·제련"}, {"term": "브라운필드·그린필드", "en": "Brownfield / Greenfield", "def": "기존 광산 인근 확장 개발과 신규 발견 광산 개발", "group": "비철·제련"}, {"term": "불가항력", "en": "Force Majeure", "def": "사고·재해로 계약 이행 불가를 선언해 책임을 면하는 조치", "group": "비철·제련"}, {"term": "황동봉", "en": "Brass Rod", "def": "구리·아연 약 6:4 합금 봉재. 배관·밸브·기계부품용", "group": "비철·제련"}, {"term": "동 선재", "en": "Cu-Rod", "def": "전기동을 연속주조압연한 굵은 구리 선. 전선 도체 원료", "group": "비철·제련"}, {"term": "HVDC", "en": "High Voltage Direct Current", "def": "교류를 직류로 바꿔 장거리·해저 대용량 송전하는 방식", "group": "비철·제련"}, {"term": "CLV", "en": "Cable Laying Vessel", "def": "해저케이블 포설 전용선. DWT(재화중량톤수)가 체급 지표", "group": "비철·제련"}, {"term": "TSO", "en": "Transmission System Operator", "def": "송전망 운영사(TenneT, National Grid 등)", "group": "비철·제련"}, {"term": "부스덕트·버스바", "en": "Busduct / Busbar", "def": "대전류를 배전하는 금속 덕트·판형 도체. AI 데이터센터 배전의 필수 구성", "group": "비철·제련"}, {"term": "금은비율", "en": "Gold-Silver Ratio", "def": "금 가격 ÷ 은 가격. 역사 평균 약 70", "group": "비철·제련"}, {"term": "리스 레이트", "en": "Lease Rate", "def": "실물 은·금 대여 이자율. 급등은 실물 부족 신호", "group": "비철·제련"}, {"term": "LBMA", "en": "London Bullion Market Association", "def": "런던귀금속시장연합회. 인증 정련소 목록 관리", "group": "비철·제련"}, {"term": "SGE", "en": "Shanghai Gold Exchange", "def": "상하이금거래소. 중국 실물 귀금속 가격 기준", "group": "비철·제련"}, {"term": "스트리밍", "en": "Streaming", "def": "광산에 선불 자금을 대고 향후 생산물을 고정가에 매입할 권리를 갖는 사업 모델", "group": "비철·제련"}, {"term": "희토류", "en": "REE(Rare Earth Elements)", "def": "란탄족 15개와 스칸듐·이트륨을 합친 17개 원소", "group": "희토류·핵심광물"}, {"term": "경희토류·중희토류", "en": "LREE / HREE", "def": "La~Eu(경)와 Gd~Lu·Y(중). 중희토류는 희소하고 분리가 어려워 병목·가격이 집중", "group": "희토류·핵심광물"}, {"term": "란탄족 수축", "en": "Lanthanide Contraction", "def": "원자번호가 커질수록 원자 크기가 줄어 원소 간 성질이 비슷해져 분리가 어려워지는 현상", "group": "희토류·핵심광물"}, {"term": "이온흡착형 점토광상", "en": "IAC(Ion-Adsorption Clay)", "def": "풍화 점토 표면에 희토류가 흡착된 광상. 중국 남부·미얀마에 편중된 HREE 주 공급원", "group": "희토류·핵심광물"}, {"term": "바스트네사이트·모나자이트·제노타임", "en": "Bastnaesite / Monazite / Xenotime", "def": "희토류 광물 유형. 앞의 둘은 경희토류 중심(모나자이트는 방사성 부담), 제노타임은 Y·HREE 비중 높음", "group": "희토류·핵심광물"}, {"term": "용매추출", "en": "SX(Solvent Extraction)", "def": "추출제가 든 유기상으로 희토류를 원소별로 조금씩 분리하는 공정. HREE는 100~200단 이상 필요", "group": "희토류·핵심광물"}, {"term": "REO·TREO", "en": "Rare Earth Oxide / Total REO", "def": "희토류를 산화물 기준으로 환산한 양과 총량. 품위·생산량 단위", "group": "희토류·핵심광물"}, {"term": "MREC", "en": "Mixed Rare Earth Carbonate", "def": "침출 후 여러 희토류가 섞인 탄산염 중간재(분리 전 단계)", "group": "희토류·핵심광물"}, {"term": "NdPr(디디뮴)", "en": "NdPr / Didymium", "def": "네오디뮴·프라세오디뮴 혼합 산화물. NdFeB 자석 주원료", "group": "희토류·핵심광물"}, {"term": "NdFeB 영구자석", "en": "Neodymium Magnet", "def": "네오디뮴-철-붕소 소결자석. EV·풍력·로봇 구동계의 표준", "group": "희토류·핵심광물"}, {"term": "SmCo 자석", "en": "Samarium-Cobalt Magnet", "def": "퀴리온도 700~850℃의 고내열 자석. 미사일·항공엔진·소나용", "group": "희토류·핵심광물"}, {"term": "보자력", "en": "Coercivity(HcJ)", "def": "자석이 외부 자기장·열에 자성을 잃지 않고 버티는 힘. Dy·Tb 첨가로 강화", "group": "희토류·핵심광물"}, {"term": "퀴리온도", "en": "Curie Temperature", "def": "자성체가 자성을 잃는 온도(NdFeB 약 310℃)", "group": "희토류·핵심광물"}, {"term": "SH·UH·EH 등급", "en": "Magnet Grade", "def": "영구자석 최대 사용온도 등급. 뒤로 갈수록 내열성이 높고 HREE 투입이 많음", "group": "희토류·핵심광물"}, {"term": "입계확산", "en": "Grain Boundary Diffusion", "def": "Dy·Tb를 결정립 경계에만 확산시켜 중희토류 사용량을 줄이는 자석 제조 기술", "group": "희토류·핵심광물"}, {"term": "페라이트 마그넷", "en": "Ferrite Magnet", "def": "희토류 없는 산화철 기반 자석. 성능은 낮지만 대체재", "group": "희토류·핵심광물"}, {"term": "유효 공급", "en": "Effective Supply", "def": "채굴량이 아니라 분리·정제·금속화·자석·고객인증까지 거쳐 실제 쓸 수 있는 물량", "group": "희토류·핵심광물"}, {"term": "가격하한", "en": "Price Floor", "def": "정부가 최저가를 보장하고 차액을 보전하는 장치. 미 국방부-MP의 NdPr $110/kg가 대표", "group": "희토류·핵심광물"}, {"term": "오프테이크", "en": "Off-take", "def": "생산 전에 향후 생산물을 사전 구매하는 계약", "group": "희토류·핵심광물"}, {"term": "핵심광물", "en": "Critical Minerals", "def": "희소성보다 공급이 끊기면 경제·안보에 타격을 주는 광물 목록(USGS 60종, 한국 33~35종)", "group": "희토류·핵심광물"}, {"term": "희소금속", "en": "Rare Metals", "def": "추출·제련이 어렵거나 매장이 편중돼 공급 리스크가 큰 금속의 정책적 총칭", "group": "희토류·핵심광물"}, {"term": "부산물 금속", "en": "By-product Metal", "def": "인듐·게르마늄·비스무스처럼 모금속(아연·구리·납) 제련 과정에서만 회수되는 금속", "group": "희토류·핵심광물"}, {"term": "이중용도 품목", "en": "Dual-use", "def": "민수·군수 모두 쓰일 수 있어 수출통제 대상이 되는 품목", "group": "희토류·핵심광물"}, {"term": "역외적용", "en": "Extraterritorial Rule", "def": "중국산 성분 0.1% 이상이나 중국 기술을 쓴 해외 제품에도 수출허가를 요구하는 규정", "group": "희토류·핵심광물"}, {"term": "FDPR", "en": "Foreign Direct Product Rule", "def": "미국 기술이 쓰인 역외 생산제품까지 통제하는 미국 규칙. 중국 역외적용의 모델", "group": "희토류·핵심광물"}, {"term": "DPA", "en": "Defense Production Act", "def": "미국 국방물자생산법. 정부가 전략물자 생산을 지원·명령하는 법적 근거", "group": "희토류·핵심광물"}, {"term": "OBBBA", "en": "One Big Beautiful Bill Act", "def": "2025년 7월 미국 법. 국방부 핵심광물 자금, 세액공제의 비PFE 요건 등 포함", "group": "희토류·핵심광물"}, {"term": "비PFE 요건", "en": "Non-Prohibited Foreign Entity", "def": "미국 세액공제에서 중국 등 금지 외국기관 관련 조달을 배제하는 요건(2030년 25%→2033년 50%)", "group": "희토류·핵심광물"}, {"term": "Project Vault", "en": "Project Vault", "def": "EXIM 100억달러+민간 20억달러로 핵심광물 60일치를 민관 계약형·순환형으로 비축하는 미국 프로그램", "group": "희토류·핵심광물"}, {"term": "MSP·FORGE", "en": "Minerals Security Partnership / FORGE", "def": "미국 주도 핵심광물 다자 협력체(2022)와 이를 55개국으로 재출범한 포럼(2026)", "group": "희토류·핵심광물"}, {"term": "CRMA", "en": "Critical Raw Materials Act", "def": "EU 핵심원자재법. 2030년 역내 채굴 10%·가공 40%·재활용 25% 목표", "group": "희토류·핵심광물"}, {"term": "RKAB", "en": "Rencana Kerja dan Anggaran Biaya", "def": "인도네시아 연간 광물 채굴 사업계획·예산 승인 제도. 니켈 쿼터 근거", "group": "희토류·핵심광물"}, {"term": "InP·GaN·Ge-on-Si", "en": "Compound Semiconductors", "def": "인듐인(통신파장 레이저 기판), 질화갈륨(고전압 전력반도체), 실리콘 위 게르마늄(광검출기)", "group": "희토류·핵심광물"}, {"term": "APT", "en": "Ammonium Paratungstate", "def": "텅스텐 정련 중간재. 탄화텅스텐·합금의 원료", "group": "희토류·핵심광물"}, {"term": "LCE", "en": "Lithium Carbonate Equivalent", "def": "각종 리튬 화합물을 탄산리튬 기준으로 환산한 단위", "group": "배터리금속·리튬"}, {"term": "탄산리튬·수산화리튬", "en": "Li2CO3 / LiOH", "def": "양극재 원료가 되는 리튬 화합물. 수산화리튬은 하이니켈용", "group": "배터리금속·리튬"}, {"term": "스포듀민·레피돌라이트", "en": "Spodumene / Lepidolite", "def": "경암형 리튬 원광. 레피돌라이트(운모계)는 처리비가 높음", "group": "배터리금속·리튬"}, {"term": "SC6", "en": "Spodumene Concentrate 6%", "def": "산화리튬 6% 품위 리튬 정광", "group": "배터리금속·리튬"}, {"term": "DLE", "en": "Direct Lithium Extraction", "def": "흡착·이온교환으로 염수에서 리튬을 직접 뽑는 기술. 회수율 약 90%(증발식 40~50%)", "group": "배터리금속·리튬"}, {"term": "LRMC", "en": "Long-Run Marginal Cost", "def": "장기적으로 신규 공급이 경제성을 갖는 한계비용(리튬 약 $12,000/t)", "group": "배터리금속·리튬"}, {"term": "RIGI", "en": "Régimen de Incentivo para Grandes Inversiones", "def": "아르헨티나 대규모 투자 인센티브(법인세 25%, 관세 면제, 외화보유 허용, 30년 안정성)", "group": "배터리금속·리튬"}, {"term": "ESS·BESS", "en": "(Battery) Energy Storage System", "def": "전력을 저장했다 공급하는 장치. 리튬 신규 수요의 핵심 축", "group": "배터리금속·리튬"}, {"term": "MHP", "en": "Mixed Hydroxide Precipitate", "def": "니켈 광석을 황산 침출해 만든 중간재. 황산니켈 원료", "group": "배터리금속·리튬"}, {"term": "나트륨이온배터리", "en": "Sodium-Ion Battery", "def": "리튬 대신 나트륨을 쓰는 이차전지. 대형 ESS·저가 EV에서 잠재 대체재", "group": "배터리금속·리튬"}, {"term": "LEU·HALEU", "en": "Low-/High-Assay Low-Enriched Uranium", "def": "농축도 3~5%(경수로)와 5~19.75%(SMR 등 4세대) 우라늄", "group": "배터리금속·리튬"}, {"term": "초내열합금", "en": "Superalloy", "def": "고온·고압에서 강도·내산화성을 유지하는 니켈계 중심 합금", "group": "특수합금·소재"}, {"term": "크리프", "en": "Creep", "def": "고온에서 일정 하중이 장시간 가해질 때 서서히 생기는 영구 변형", "group": "특수합금·소재"}, {"term": "VIM·ESR·VAR", "en": "Vacuum Induction Melting 등", "def": "진공유도용해(1차), 전기슬래그 재용해(청정도), 진공아크 재용해(결함 최소화) 청정용해 공정", "group": "특수합금·소재"}, {"term": "Surcharge", "en": "Surcharge", "def": "니켈·코발트 등 원재료 변동분을 기본단가에 별도로 얹어 전가하는 가변 요금", "group": "특수합금·소재"}, {"term": "리드타임", "en": "Lead Time", "def": "발주부터 납기까지 기간. 장기화는 공급자 우위·가격결정력 강화 신호", "group": "특수합금·소재"}, {"term": "NADCAP·AS9100", "en": "Aerospace Quality Certification", "def": "항공우주·방산 부품 제조 공정 품질 인증", "group": "특수합금·소재"}, {"term": "적층제조", "en": "AM(Additive Manufacturing)", "def": "금속 분말을 층층이 쌓아 부품을 만드는 공정(L-PBF·DED·EBM)", "group": "특수합금·소재"}, {"term": "소재투입비", "en": "BTF(buy-to-fly) Ratio", "def": "최종 부품 중량 대비 투입 소재 중량. 절삭 약 20, AM 약 1.2", "group": "특수합금·소재"}, {"term": "MRO", "en": "Maintenance, Repair & Overhaul", "def": "항공기·엔진 정비·수리·분해점검. 특수합금 애프터마켓 수요", "group": "특수합금·소재"}, {"term": "CMC", "en": "Ceramic Matrix Composite", "def": "니켈 초합금 보완용 세라믹 복합재(무게 1/3, 내열 20% 우수)", "group": "특수합금·소재"}, {"term": "CASK", "en": "Cask", "def": "사용후핵연료 건식저장용기(특수강)", "group": "특수합금·소재"}, {"term": "대형단조", "en": "Large Forging", "def": "링압연기 등으로 만든 대형 링·샤프트 부품. 풍력·조선·원전용", "group": "특수합금·소재"}, {"term": "Section 232", "en": "무역확장법 232조", "def": "국가안보를 근거로 미국 대통령이 수입 관세·제한을 부과하는 조항", "group": "무역·정책"}, {"term": "반덤핑·상계관세", "en": "AD / CVD", "def": "정상가 이하 덤핑 수입품에 부과하는 관세와 보조금 받은 수입품에 부과하는 관세", "group": "무역·정책"}, {"term": "가격약속", "en": "MIP(Minimum Import Price)", "def": "수출자가 최저가격 이상으로만 수출하기로 약속하는 반덤핑 대체 구제수단", "group": "무역·정책"}, {"term": "세이프가드·TRQ", "en": "Safeguard / Tariff Rate Quota", "def": "쿼터 내 무·저관세, 초과분 고관세를 부과하는 수입규제", "group": "무역·정책"}, {"term": "Melt & Pour", "en": "Melted and Poured", "def": "철강 원산지를 쇳물 최초 생산국으로 판정하는 규정(한국은 '조강국 확인')", "group": "무역·정책"}, {"term": "MTC", "en": "Mill Test Certificate", "def": "제강사 품질검사증명서. 실제 생산자·원산지 추적 수단", "group": "무역·정책"}, {"term": "반내권", "en": "Anti-Involution(反內卷)", "def": "소모적 내부경쟁·저가 덤핑을 바로잡아 한계기업을 퇴출하려는 중국 정책 기조", "group": "무역·정책"}, {"term": "생산능력 치환", "en": "Capacity Replacement", "def": "신규 설비 건설 시 더 큰 기존 설비 폐쇄를 의무화하는 중국 제도(2026년 1.5:1)", "group": "무역·정책"}, {"term": "초저배출 개조", "en": "Ultra-low Emission Retrofit", "def": "중국 철강 환경설비 전환 정책. 미완료 설비에 요금 차등으로 사실상 구조조정 수단", "group": "무역·정책"}, {"term": "CR10", "en": "Concentration Ratio Top 10", "def": "상위 10개사 점유율 합계. 중국 철강 2024년 51%", "group": "무역·정책"}, {"term": "삼정삼불요", "en": "三定三不要", "def": "판매·수익·현금회수에 맞춰 생산한다는 중국 철강업계 자율 경영원칙", "group": "무역·정책"}, {"term": "K-스틸법", "en": "K-Steel Act", "def": "철강 경쟁력 강화·녹색 전환 특별법(2026.06.17 시행). 감산 담합 예외 인정 등", "group": "무역·정책"}, {"term": "FAST-41", "en": "FAST-41", "def": "미국 연방 인프라 프로젝트 인허가 신속처리 제도", "group": "무역·정책"}, {"term": "K-ETS", "en": "Korea Emissions Trading Scheme", "def": "한국 배출권거래제. 5년 단위, 제4기 2026~30", "group": "탄소"}, {"term": "유상·무상할당", "en": "Auctioned / Free Allocation", "def": "배출권을 경매로 파는 방식과 무료로 나눠주는 방식", "group": "탄소"}, {"term": "MSR", "en": "Market Stability Reserve", "def": "배출권 가격 안정을 위해 시장에서 격리해 두는 예비 물량", "group": "탄소"}, {"term": "CBAM", "en": "Carbon Border Adjustment Mechanism", "def": "EU 수입품 내재 탄소에 EU ETS 연동 비용을 부과하는 탄소국경조정제도", "group": "탄소"}, {"term": "EU ETS", "en": "EU Emissions Trading System", "def": "EU 배출권거래제. CBAM 비용 산정의 기준 가격", "group": "탄소"}, {"term": "탄소집약도", "en": "Carbon Intensity", "def": "제품 1톤당 CO2 배출량(고로 2.0~2.3, 전기로 약 0.5 tCO2/t)", "group": "탄소"}, {"term": "합탕", "en": "Hot Metal Blending", "def": "고로 용선과 전기로 쇳물을 섞어 판재를 만드는 저탄소 전환 공정", "group": "탄소"}, {"term": "WSA", "en": "World Steel Association", "def": "세계철강협회. 글로벌 철강 수요·생산 통계와 전망", "group": "시장·재무"}, {"term": "CISA", "en": "China Iron and Steel Association", "def": "중국철강공업협회. 중국 철강 통계·자율감산 주체", "group": "시장·재무"}, {"term": "PMI", "en": "Purchasing Managers' Index", "def": "구매관리자지수. 50 이상 확장, 이하 위축", "group": "시장·재무"}, {"term": "PPI·M1", "en": "Producer Price Index / Narrow Money", "def": "생산자물가와 협의통화. 중국 M1은 PPI를 약 9개월 선행", "group": "시장·재무"}, {"term": "SOTP", "en": "Sum of the Parts", "def": "사업부문별 가치를 따로 산정해 합산하는 밸류에이션", "group": "시장·재무"}, {"term": "PBR-ROE 모델", "en": "Residual Income P/B", "def": "적정 P/B = (ROE−g)/(COE−g). 자본집약 경기민감 업종에 사용", "group": "시장·재무"}, {"term": "EV/EBITDA", "en": "EV/EBITDA", "def": "기업가치를 상각 전 영업이익으로 나눈 배수. 설비 집약 업종 비교에 사용", "group": "시장·재무"}, {"term": "PRS", "en": "Price Return Swap", "def": "지분 매각대금을 선수령하고 사후 가격차를 정산하는 파생계약. 지주사 지분 유동화 수단", "group": "시장·재무"}, {"term": "영업레버리지", "en": "Operating Leverage", "def": "판매량 증가 시 고정비 분산으로 이익률이 매출보다 크게 개선되는 효과", "group": "시장·재무"}, {"term": "키 맞추기 장세", "en": "Mean Reversion", "def": "지수 변동성이 둔화되며 소외된 저평가 업종이 상대 반등하는 국면", "group": "시장·재무"}, {"term": "ROIC", "en": "Return On Invested Capital", "def": "세후영업이익 ÷ 투하자본. 자본 재배치 성과 지표", "group": "시장·재무"}, {"term": "HyREX", "en": "Hydrogen Reduction Ironmaking", "def": "포스코의 유동환원로 기반 수소환원제철 기술. 포항 데모플랜트 연산 30만톤·1.3조원, 2030년 상용기술 확보 목표", "group": "철강 공정·제품"}, {"term": "가격 분절화", "en": "Price Fragmentation", "def": "관세·쿼터·원산지 규정으로 같은 제품의 내수 가격이 지역별로 갈라지는 현상. 미국·EU가 가장 높고 한국은 2026년부터 중국과 분리", "group": "무역·정책"}, {"term": "가시재고", "en": "Visible Inventory", "def": "LME·COMEX·SHFE 등 거래소 창고에 등록된 재고. 총량보다 지역 분포가 스프레드와 변동성을 만듭니다", "group": "비철·제련"}, {"term": "금속가격 사이클", "en": "Metal Price Cycle", "def": "초과수요 → 신규 공급 증가 → 초과공급 → 초과공급 해소의 4단계 순환. 저점은 한계 현금원가, 상단은 대체 임계에서 형성", "group": "시장·재무"}, {"term": "현금원가 커브", "en": "Cash Cost Curve", "def": "광산·설비를 현금원가 순으로 줄 세운 곡선. 가격이 한계 설비의 현금원가를 밑돌면 고원가 공급이 퇴출되며 바닥이 형성됩니다", "group": "비철·제련"}, {"term": "우회수출", "en": "Transshipment / Circumvention", "def": "관세가 낮은 제3국에서 단순 가공만 해 원산지를 바꾸는 수출. 조강국 확인(Melt & Pour)·MTC 제출 의무화로 차단", "group": "무역·정책"}, {"term": "철강 수출허가제(중국)", "en": "Export License", "def": "중국이 2026-01부터 약 300개 철강 품목에 수출계약서·품질검사증명서 제출을 의무화한 제도. 2007~09년 선례가 있습니다", "group": "무역·정책"}, {"term": "다금속 회수", "en": "Polymetallic Recovery", "def": "아연·연·동 정광과 잔사에서 금·은·황산·인듐·게르마늄·안티모니·비스무스 등 여러 금속을 함께 뽑아내는 제련 모델", "group": "비철·제련"}, {"term": "마이단", "en": "Maidan (买单出口)", "def": "중국에서 수출 자격을 빌려 서류를 사서 하는 허위·저가 수출 관행. 수출허가제·세금 실시간 검증의 단속 대상", "group": "무역·정책"}, {"term": "폐쇄 없는 감산", "en": "Curtailment without Closure", "def": "설비를 폐쇄하지 않고 가동만 줄이는 감산. 수요가 회복되면 빠르게 재가동되어 가격 반등을 제한합니다", "group": "철강 공정·제품"}], "facts": [], "desks": [{"key": "hub", "name": "전체", "url": "../index.html"}, {"key": "hc", "name": "헬스케어", "url": "../healthcare/index.html"}, {"key": "oilchem", "name": "정유·화학", "url": "../oilchem/index.html"}, {"key": "transition", "name": "에너지전환", "url": "../transition/index.html"}, {"key": "power", "name": "전력인프라", "url": "../power/index.html"}, {"key": "nuclear", "name": "원전", "url": "../nuclear/index.html"}, {"key": "metals", "name": "철강·비철", "url": "../metals/index.html"}]}</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const TAGC={'확인':'t-ok','추정':'t-warn','미확인':'t-alert','구자료':'t-dim'};
const tag=t=>!t?'':`<span class="tag ${TAGC[t]||'t-acc'}">${esc(t)}</span>`;
const tone=t=>t==='긍정'?'<span class="tag t-ok">긍정</span>':t==='부정'?'<span class="tag t-alert">부정</span>':'<span class="tag t-dim">중립</span>';
const uniq=a=>[...new Set(a.filter(Boolean))];
const M=D.meta;
document.title=M.short+' 리서치 데스크';
$('#b-eng').textContent=M.eng;$('#b-title').textContent=M.short;$('#b-sub').innerHTML=esc(M.subtitle)+(M.owner?`<br>${esc(M.owner)}`:'');
$('#foot').textContent=M.version;$('#cut').textContent='DATA CUT '+M.cut;$('#upd').textContent=M.updated?('UPDATED '+M.updated):'';
$('#desks').innerHTML='<div class="dl">SECTOR DESKS</div>'+(D.desks||[]).map(x=>`<a href="${esc(x.url)}"${/^https?:/.test(x.url)?' target="_blank" rel="noopener"':''}${x.key===M.key?' class="cur"':''}>${esc(x.name)}</a>`).join('');

let uid=0;
function chips(el,groups,cb,label='전체'){el.innerHTML=[label,...groups].map((g,i)=>`<button class="chip" aria-pressed="${i===0}" data-g="${esc(i?g:'')}">${esc(g)}</button>`).join('');el.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;el.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b.dataset.g);});}
const tableH=(cols,rows,cls='')=>`<div class="tw"><table class="${cls}"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' style="font-weight:600;color:var(--ink)"':''}>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const fmt=v=>{const a=Math.abs(v);return a>=1000?v.toLocaleString('ko-KR',{maximumFractionDigits:0}):a>=100?v.toFixed(0):a>=10?(+v.toFixed(1)).toString():(+v.toFixed(2)).toString();};
const barChart=b=>{const vs=b.items.map(i=>+i.v);const mx=Math.max(...vs,0),mn=Math.min(...vs,0);const span=(mx-mn)||1;const z=(-mn)/span*100;
 return `<div class="chart"><h4>${esc(b.title)}</h4><div class="u">단위 ${esc(b.unit)} · 빗금 = 추정</div><div class="bars">${b.items.map(i=>{const v=+i.v;const w=Math.abs(v)/span*100;const left=v>=0?z:z-w;return `<div class="bar"><span class="bl">${esc(i.l)}</span><span class="bt">${mn<0?`<span class="zero" style="left:${z}%"></span>`:''}<span class="bf${v<0?' neg':''}${i.tag==='추정'?' est':''}" style="left:${left}%;width:${Math.max(w,.6)}%"></span></span><span class="bv">${fmt(v)}</span></div>`;}).join('')}</div>${b.note?`<div class="cn">${md(b.note)}</div>`:''}</div>`;};
const dl=fields=>`<dl>${(fields||[]).map(f=>`<dt>${esc(f.k)}</dt><dd>${md(f.v)}</dd>`).join('')}</dl>`;

/* ---------- block renderers ---------- */
const B={
 p:b=>`<p class="note">${md(b.text)}</p>`,
 callout:b=>`<div class="callout ${b.tone==='warn'?'w':b.tone==='alert'?'r':''}">${b.title?`<b>${esc(b.title)}</b><br>`:''}${md(b.text)}</div>`,
 kpis:b=>`<div class="grid kg">${b.items.map(k=>`<div class="kpi"><span class="lab">${esc(k.lab)}</span><span class="val"${k.tag==='추정'?' style="color:var(--warn)"':k.tag==='미확인'?' style="color:var(--alert)"':''}>${esc(k.val)}</span><span class="cap">${md(k.cap)} ${tag(k.tag)}</span></div>`).join('')}</div>`,
 chain:b=>`<div class="flow">${b.items.map((c,i)=>(i?'<div class="farr">→</div>':'')+`<div class="fnode"><div class="n">${esc(c.no||'')}</div><div class="t">${esc(c.name)}</div></div>`).join('')}</div>`,
 cards:b=>`<div class="vc">${b.items.map(c=>`<div class="vcx"><div class="r">${esc(c.r||'')}</div><h4>${esc(c.h)}</h4><p>${md(c.p)}</p>${c.co?`<div class="co">${md(c.co)}</div>`:''}</div>`).join('')}</div>`,
 grid:b=>`<div class="grid ${b.cols===3?'g3':'g2'}">${b.items.map((c,i)=>`<div class="gcard"><h4>${b.numbered?`<span class="num-h">${i+1}</span>`:''}${esc(c.h)} ${c.tag?tag(c.tag):''}</h4>${(Array.isArray(c.p)?c.p:[c.p]).filter(Boolean).map(x=>`<p>${md(x)}</p>`).join('')}${c.list?`<ul>${c.list.map(x=>`<li>${md(x)}</li>`).join('')}</ul>`:''}</div>`).join('')}</div>`,
 table:b=>`${b.title?`<div class="tcap">${esc(b.title)}</div>`:''}${tableH(b.cols,b.rows)}${b.note?`<div class="tnote">${md(b.note)}</div>`:''}`,
 figure:b=>`<figure class="fig">${b.svg}${b.cap?`<figcaption>${md(b.cap)}</figcaption>`:''}</figure>`,
 steps:b=>`<div style="margin-top:6px">${b.items.map((s,i)=>`<div class="stage"><div class="col"><div class="dot">${esc(s.n||i+1)}</div></div><div class="content"><h4>${esc(s.h)}</h4>${s.meta&&s.meta.length?`<div class="meta">${s.meta.map(m=>`<span class="pill">${esc(m)}</span>`).join('')}</div>`:''}<p${s.meta&&s.meta.length?'':' style="margin-top:6px"'}>${md(s.p)}</p>${s.chk?`<div class="chk"><b>체크</b> ${md(s.chk)}</div>`:''}</div></div>`).join('')}</div>`,
 mods:b=>`<div class="mods">${b.items.map((x,i)=>`<details class="mod"${b.open&&i<b.open?' open':''}><summary><span class="mname">${esc(x.name)}</span>${x.en?`<span class="men">${esc(x.en)}</span>`:''}${x.pill?`<span class="pill">${esc(x.pill)}</span>`:''}${x.tag?tag(x.tag):''}</summary><div class="body">${x.lede?`<p class="dplede">${md(x.lede)}</p>`:''}${x.formula?`<div class="formula">${esc(x.formula)}</div>`:''}${(x.paras||[]).length?`<div class="dpn">${x.paras.map(p=>`<p>${md(p)}</p>`).join('')}</div>`:''}${x.fields?dl(x.fields):''}${x.table?`<div style="margin-top:14px">${tableH(x.table.cols,x.table.rows)}</div>`:''}${x.svg?`<figure class="fig">${x.svg}${x.cap?`<figcaption>${md(x.cap)}</figcaption>`:''}</figure>`:''}${(x.bullets||[]).length?`<ul class="dpul">${x.bullets.map(t=>`<li>${md(t)}</li>`).join('')}</ul>`:''}${x.kr?`<div class="dpkr"><span class="l">국내 연결점</span>${md(x.kr)}</div>`:''}</div></details>`).join('')}</div>`,
 bullets:b=>`<ul class="bb">${b.items.map(x=>`<li>${md(x)}</li>`).join('')}</ul>`,
 bars:b=>`<div class="grid g2">${b.charts.map(barChart).join('')}</div>`,
 timeline:b=>`<div class="tl">${b.items.map(t=>`<div class="tli ${t.tone==='긍정'?'pos':t.tone==='부정'?'neg':''}"><div class="d">${esc(t.date)}</div><h4>${esc(t.title)} ${t.tone?tone(t.tone):''}</h4><p>${md(t.body)}</p></div>`).join('')}</div>`,
 proscons:b=>`<div class="grid g2"><div class="card"><h4 style="color:var(--ok)">${esc(b.lt||'상방')}</h4><ul class="bb">${b.bull.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div><div class="card"><h4 style="color:var(--alert)">${esc(b.rt||'하방')}</h4><ul class="bb">${b.bear.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div></div>`,
 checklist:b=>`<div class="grid g2">${b.groups.map(a=>`<div class="card"><h4>${esc(a.area)}</h4><ul class="ck">${a.items.map(t=>{uid++;return `<li><input type="checkbox" id="ck${uid}"><label for="ck${uid}">${md(t)}</label></li>`;}).join('')}</ul></div>`).join('')}</div>`,
 brief:b=>`<div class="brief">${b.items.map(x=>`<div class="bi"><div class="k">${esc(x.k)}</div><p>${md(x.v)}</p></div>`).join('')}</div>`,
 dict:b=>{uid++;const id='dx'+uid;setTimeout(()=>{const L=b.items;let g='',q='';const draw=()=>{const R=L.filter(x=>(!g||x.group===g)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));document.getElementById(id+'c').textContent=R.length+'개';
   document.getElementById(id+'l').innerHTML=R.map(x=>`<details class="mod dcard"><summary><span class="mname">${esc(x.name)}</span>${x.en?`<span class="men">${esc(x.en)}</span>`:''}<span class="pill">${esc(x.group)}</span>${x.tag?tag(x.tag):''}</summary><div class="body">${x.tags&&x.tags.length?`<div class="dfl">${x.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div>`:''}${x.lede?`<p class="dplede">${md(x.lede)}</p>`:''}${dl(x.fields)}${x.table?`<div style="margin-top:14px">${tableH(x.table.cols,x.table.rows)}</div>`:''}${x.note?`<div class="dnote">${md(x.note)}</div>`:''}</div></details>`).join('');};
   chips(document.getElementById(id+'h'),uniq(L.map(x=>x.group)),x=>{g=x;draw();});document.getElementById(id+'q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();draw();});draw();},0);
   return `<div class="tools"><input class="search" id="${id}q" placeholder="${esc(b.placeholder||'검색')}"><span class="count" id="${id}c"></span></div><div class="chips" id="${id}h"></div><div class="mods" id="${id}l"></div>`;}
};
const renderBlocks=bs=>(bs||[]).map(b=>{const f=B[b.t];return f?`<div class="blk">${f(b)}</div>`:`<div class="blk"><div class="callout r">알 수 없는 블록: ${esc(b.t)}</div></div>`;}).join('');
const secH=s=>`<div class="sec"><h3>${esc(s.h)}${s.tag?' '+tag(s.tag):''}</h3>${s.note?`<p class="note">${md(s.note)}</p>`:''}${renderBlocks(s.blocks)}</div>`;

/* ---------- special tabs ---------- */
const SPECIAL={
 universe:(t)=>{const U=D.universe.slice().sort((a,b)=>(b.n||0)-(a.n||0));setTimeout(()=>{let g='',q='',m='';const kr=x=>/KOSPI|KOSDAQ|KONEX/.test(x.mkt);const nl=x=>/비상장|기타/.test(x.mkt);
  const draw=()=>{const L=U.filter(x=>(!g||x.seg===g)&&(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!m||(m==='KR'?kr(x):m==='NL'?nl(x):!kr(x)&&!nl(x))));$('#uni-c').textContent=L.length+'개사';
  $('#uni-t').innerHTML=`<div class="tw"><table><thead><tr><th>기업</th><th>시장</th><th>코드</th><th>하위섹터</th><th>사업</th><th>핵심 포인트</th><th>언급</th></tr></thead><tbody>${L.map(x=>`<tr><td class="nm">${esc(x.name)}</td><td><span class="pill">${esc(x.mkt)}</span></td><td class="tk">${esc(x.code)}</td><td style="font-size:12.5px;color:var(--ink-3);min-width:110px">${esc(x.seg)}</td><td style="min-width:220px">${md(x.biz)}</td><td style="min-width:280px">${md(x.point)}</td><td class="num">${x.n||''}</td></tr>`).join('')}</tbody></table></div>`;};
  chips($('#uni-ch'),uniq(U.map(x=>x.seg)),x=>{g=x;draw();});$('#uni-q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();draw();});$('#uni-m').addEventListener('change',e=>{m=e.target.value;draw();});draw();},0);
  return `<div class="tools"><input class="search" id="uni-q" placeholder="기업·사업 검색"><select class="search" id="uni-m"><option value="">전체 시장</option><option value="KR">국내(KOSPI·KOSDAQ)</option><option value="GL">해외</option><option value="NL">비상장·기타</option></select><span class="count" id="uni-c"></span></div><div class="chips" id="uni-ch"></div><div id="uni-t"></div>`;},
 calendar:(t)=>{const C=D.calendar.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));const cut=M.cut;const up=C.filter(x=>String(x.date)>=cut.slice(0,String(x.date).length)),past=C.filter(x=>!up.includes(x)).reverse();
  const row=(x,p)=>`<div class="evt${p?' past':''}"><div class="d">${esc(x.date)}</div><div><div class="n">${esc(x.event)} <span class="pill">${esc(x.type)}</span></div><div class="m">${md(x.why)}</div></div></div>`;
  return `<div class="grid g2" style="margin-top:20px;align-items:start"><div class="card"><h4>예정 (${up.length})</h4>${up.map(x=>row(x)).join('')}</div><div class="card"><h4>지나간 핵심 이벤트 (${past.length})</h4>${past.map(x=>row(x,1)).join('')}</div></div>`;},
 facts:(t)=>{if(M.public)return `<div class="callout" style="margin-top:18px">공개판에서는 원수치 데이터베이스를 제외했습니다. 핵심 수치는 각 탭 안에 확인·추정 태그와 함께 수록되어 있습니다.</div>`;const F=D.facts;setTimeout(()=>{let g='',q='',lim=200;const draw=()=>{const L=F.filter(x=>(!g||x.tag===g)&&(!q||(x.k+' '+x.v+' '+x.unit+' '+x.src+' '+x.asof).toLowerCase().includes(q)));$('#f-c').textContent=L.length.toLocaleString()+'개';
  $('#f-t').innerHTML=`<div class="tw"><table><thead><tr><th>항목</th><th>값</th><th>단위</th><th>시점</th><th>원출처</th><th>태그</th><th>발행</th></tr></thead><tbody>${L.slice(0,lim).map(x=>`<tr><td style="min-width:240px">${esc(x.k)}</td><td class="num"><b>${esc(x.v)}</b></td><td class="tk">${esc(x.unit)}</td><td class="tk">${esc(x.asof)}</td><td style="font-size:12.5px;color:var(--ink-3)">${esc(x.src)}</td><td>${tag(x.tag)}</td><td class="tk">${esc(x.date)}</td></tr>`).join('')}</tbody></table></div>`;$('#f-m').hidden=L.length<=lim;};
  chips($('#f-ch'),['확인','추정','미확인'],x=>{g=x;lim=200;draw();});$('#f-q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();lim=200;draw();});$('#f-m').addEventListener('click',()=>{lim+=300;draw();});draw();},0);
  return `<div class="tools"><input class="search" id="f-q" placeholder="키워드 (예: 마진, 캐파, 2027)"><span class="count" id="f-c"></span></div><div class="chips" id="f-ch"></div><div id="f-t"></div><button class="more" id="f-m" hidden>더 보기</button>`;},
 glossary:(t)=>{const G=D.glossary.slice().sort((a,b)=>a.term.localeCompare(b.term,'ko'));setTimeout(()=>{let g='',q='';const draw=()=>{const L=G.filter(x=>(!g||x.group===g)&&(!q||(x.term+x.en+x.def).toLowerCase().includes(q)));$('#g-c').textContent=L.length+'개';
  $('#g-t').innerHTML=`<div class="tw"><table><thead><tr><th>용어</th><th>영문·약어</th><th>정의</th><th>분류</th></tr></thead><tbody>${L.map(x=>`<tr><td class="nm">${esc(x.term)}</td><td class="tk">${esc(x.en)}</td><td style="min-width:320px">${md(x.def)}</td><td style="font-size:12px;color:var(--ink-3);white-space:nowrap">${esc(x.group)}</td></tr>`).join('')}</tbody></table></div>`;};
  chips($('#g-ch'),uniq(G.map(x=>x.group)),x=>{g=x;draw();});$('#g-q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();draw();});draw();},0);
  return `<div class="tools"><input class="search" id="g-q" placeholder="용어 검색"><span class="count" id="g-c"></span></div><div class="chips" id="g-ch"></div><div id="g-t"></div>`;}
};

/* ---------- build nav + panes ---------- */
let nav='',panes='',n=0;const NUM={};
D.nav.forEach(gr=>{nav+=`<div class="nav-group">${esc(gr.group)}</div>`;gr.tabs.forEach(id=>{const t=D.tabs[id];if(!t)return;n++;const k=String(n).padStart(2,'0');NUM[id]=k;nav+=`<button data-p="${id}"><span class="k">${k}</span>${esc(t.title)}</button>`;panes+=`<section class="pane" id="p-${id}"></section>`;});});
$('#nav').innerHTML=nav;$('#panes').innerHTML=panes;
Object.keys(NUM).forEach(id=>{const t=D.tabs[id];let h=`<div class="eyebrow">${NUM[id]} — ${esc(t.en||'')}</div><h2>${esc(t.h2||t.title)}</h2>${t.lede?`<p class="lede">${md(t.lede)}</p>`:''}`;
 if(t.special&&SPECIAL[t.special]){h+=`${(t.sections||[]).filter(s=>s.before).map(secH).join('')}`+SPECIAL[t.special](t)+(t.sections||[]).filter(s=>!s.before).map(secH).join('');}
 else h+=(t.sections||[]).map(secH).join('');
 document.getElementById('p-'+id).innerHTML=h;});

const show=id=>{if(!document.getElementById('p-'+id))id=Object.keys(NUM)[0];document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+id));document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.p===id));};
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;show(b.dataset.p);try{history.replaceState(null,'','#'+b.dataset.p)}catch(_){}window.scrollTo(0,0);});
show((location.hash||'#').slice(1));
const root=document.documentElement;const setT=t=>{root.setAttribute('data-theme',t);document.querySelectorAll('.tsb').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));try{localStorage.setItem('desk-theme',t)}catch(_){}};
document.querySelectorAll('.tsb').forEach(b=>b.addEventListener('click',()=>setT(b.dataset.t)));
try{const t=localStorage.getItem('desk-theme');if(t)setT(t);}catch(_){}
})();
</script>

</html>
