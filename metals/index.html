서 수행하는 제철소", "group": "철강 공정·제품"}, {"term": "슬래브·블룸·빌릿", "en": "Slab·Bloom·Billet", "def": "연속주조로 만든 반제품. 판재용 판상, 대형 봉상, 소형 봉상 순", "group": "철강 공정·제품"}, {"term": "열연강판", "en": "HRC(Hot Rolled Coil)", "def": "슬래브를 고온 압연한 판재. 냉연·도금·강관의 기초 소재이자 국내 판재 가격 기준점", "group": "철강 공정·제품"}, {"term": "후판", "en": "Heavy Plate", "def": "두께 6mm 이상 강판. 조선·교량·해양구조물·압력용기용", "group": "철강 공정·제품"}, {"term": "냉연·도금강판", "en": "CR / GI·GL", "def": "열연을 상온 압연한 뒤 아연 등으로 도금한 표면처리 강판", "group": "철강 공정·제품"}, {"term": "전기강판(GO/NO)", "en": "Electrical Steel", "def": "방향성(변압기 철심)과 무방향성(모터 코어)으로 나뉘는 규소강판", "group": "철강 공정·제품"}, {"term": "봉형강", "en": "Long Products", "def": "철근·형강·봉강 등 막대·형태 단면의 강재. 주로 전기로에서 생산", "group": "철강 공정·제품"}, {"term": "특수강 봉강", "en": "SBQ", "def": "탄소강·합금강을 압연·단조한 봉 형태 제품. 자동차·기계·방산 부품용", "group": "철강 공정·제품"}, {"term": "OCTG", "en": "Oil Country Tubular Goods", "def": "유정관·케이싱·튜빙 등 원유·가스 시추·생산용 강관 총칭", "group": "철강 공정·제품"}, {"term": "모노파일", "en": "Monopile", "def": "해상풍력 터빈을 해저에 고정하는 대형 단일 강관 기초구조물", "group": "철강 공정·제품"}, {"term": "롤마진", "en": "Roll Margin", "def": "철강 제품가격에서 원재료 투입원가를 뺀 압연 마진(스프레드)", "group": "철강 공정·제품"}, {"term": "명목수요", "en": "Apparent Steel Use", "def": "생산+수입−수출로 계산한 겉보기 철강 소비량", "group": "철강 공정·제품"}, {"term": "배치식 가동", "en": "Batch Operation", "def": "전기로처럼 필요할 때마다 가동하는 방식. 차지 수·조업일 조정으로 감산이 쉬움", "group": "철강 공정·제품"}, {"term": "DRI", "en": "Direct Reduced Iron", "def": "가스·수소로 철광석을 직접 환원한 철. 전기로 원료", "group": "철강 공정·제품"}, {"term": "수소환원제철", "en": "Hydrogen-based Steelmaking(HyREX)", "def": "환원제로 석탄 대신 수소를 써 CO2 대신 물을 배출하는 저탄소 제철. HyREX는 유동환원로 기반 포스코 공정", "group": "철강 공정·제품"}, {"term": "DUC", "en": "Drilled but Uncompleted", "def": "시추는 끝났으나 완결(프래킹)되지 않은 유정 재고. 시추 활동 선행지표", "group": "철강 공정·제품"}, {"term": "전기동", "en": "Copper Cathode", "def": "전해정련으로 만든 순도 99.99% 구리 판. LME·COMEX·SHFE 표준 상품", "group": "비철·제련"}, {"term": "정광", "en": "Concentrate", "def": "광석을 선광해 목적 금속 함량을 높인 중간재(구리 약 25%)", "group": "비철·제련"}, {"term": "품위", "en": "Ore Grade", "def": "광석·정광 속 목적 금속 함량 비율. 낮을수록 같은 금속을 얻는 데 더 많은 광석·에너지 필요", "group": "비철·제련"}, {"term": "TC/RC", "en": "Treatment/Refining Charge", "def": "광산이 정광을 넘길 때 제련·정련 대가로 제련소에 지불하는 수수료. 정광이 부족하면 낮아지고 마이너스도 가능", "group": "비철·제련"}, {"term": "벤치마크 TC vs 현물 TC", "en": "Benchmark vs Spot TC", "def": "연말 대형 광산-중국 제련소가 정하는 연간 고정 수수료와 현물시장 실시간 수수료. 현물이 벤치마크에 선행", "group": "비철·제련"}, {"term": "CSPT", "en": "China Smelters Purchase Team", "def": "중국 주요 동 제련소 구매연합. 벤치마크 TC 협상 주체", "group": "비철·제련"}, {"term": "Free Metal", "en": "Free Metal", "def": "정광 매입 payable 비율보다 실제 회수율이 높아 원가 없이 매출로 인식되는 금속분", "group": "비철·제련"}, {"term": "Payable", "en": "Payable", "def": "정광 대금 산정 시 함유 금속 중 지불 대상 비율(아연 85%, 연 95%, 동 96% 등)", "group": "비철·제련"}, {"term": "부산물 경제", "en": "By-product Economics", "def": "TC 수익이 사라진 제련소가 금·은·황산·희소금속 부산물로 수익을 내는 구조", "group": "비철·제련"}, {"term": "SX-EW", "en": "Solvent Extraction-Electrowinning", "def": "저품위 산화광을 황산으로 침출해 용매추출·전해채취로 전기동을 만드는 습식 공정. 세계 정련동의 약 1/5", "group": "비철·제련"}, {"term": "Fumer", "en": "Fuming Furnace", "def": "제련 부산물을 고온 기화시켜 금속별 응고 온도 차로 유가금속을 회수하는 설비", "group": "비철·제련"}, {"term": "신동", "en": "Copper Fabrication", "def": "구리·동합금을 판·대·봉·관·선 형태로 가공하는 산업", "group": "비철·제련"}, {"term": "메탈게인·래깅 효과", "en": "Metal Gain / Lagging", "def": "원재료 매입과 판매의 시차로 금속가 상승기에 생기는 재고평가이익. 하락기엔 반대로 손실", "group": "비철·제련"}, {"term": "에스컬레이션 조항", "en": "Escalation Clause", "def": "전선 등 공급계약에서 구리 등 원재료 변동을 판가에 연동하는 조항", "group": "비철·제련"}, {"term": "LME·COMEX·SHFE", "en": "Exchanges", "def": "런던금속거래소, 뉴욕상품거래소(CME), 상하이선물거래소. 비철 가격·재고의 3대 기준", "group": "비철·제련"}, {"term": "콘탱고·백워데이션", "en": "Contango / Backwardation", "def": "선물가가 현물보다 높은 상태와 낮은 상태. 백워데이션은 실물 타이트 신호", "group": "비철·제련"}, {"term": "양산 프리미엄", "en": "Yangshan Copper Premium", "def": "상하이 양산항 보세 전기동 수입 프리미엄. 중국 실물 수입 수요 지표", "group": "비철·제련"}, {"term": "ICSG", "en": "International Copper Study Group", "def": "국제구리연구그룹. 4월·10월 구리 수급 전망 발표", "group": "비철·제련"}, {"term": "Incentive Price", "en": "Incentive Price", "def": "신규 광산 개발을 유인하는 최소 금속 가격. 구리 약 $10,000~12,000/t", "group": "비철·제련"}, {"term": "AISC·C1 원가", "en": "All-In Sustaining Cost / C1", "def": "AISC는 운영·유지투자·관리비를 포함한 총유지비용, C1은 직접 현금원가(C2는 감가상각, C3는 금융·로열티 추가)", "group": "비철·제련"}, {"term": "브라운필드·그린필드", "en": "Brownfield / Greenfield", "def": "기존 광산 인근 확장 개발과 신규 발견 광산 개발", "group": "비철·제련"}, {"term": "불가항력", "en": "Force Majeure", "def": "사고·재해로 계약 이행 불가를 선언해 책임을 면하는 조치", "group": "비철·제련"}, {"term": "황동봉", "en": "Brass Rod", "def": "구리·아연 약 6:4 합금 봉재. 배관·밸브·기계부품용", "group": "비철·제련"}, {"term": "동 선재", "en": "Cu-Rod", "def": "전기동을 연속주조압연한 굵은 구리 선. 전선 도체 원료", "group": "비철·제련"}, {"term": "HVDC", "en": "High Voltage Direct Current", "def": "교류를 직류로 바꿔 장거리·해저 대용량 송전하는 방식", "group": "비철·제련"}, {"term": "CLV", "en": "Cable Laying Vessel", "def": "해저케이블 포설 전용선. DWT(재화중량톤수)가 체급 지표", "group": "비철·제련"}, {"term": "TSO", "en": "Transmission System Operator", "def": "송전망 운영사(TenneT, National Grid 등)", "group": "비철·제련"}, {"term": "부스덕트·버스바", "en": "Busduct / Busbar", "def": "대전류를 배전하는 금속 덕트·판형 도체. AI 데이터센터 배전의 필수 구성", "group": "비철·제련"}, {"term": "금은비율", "en": "Gold-Silver Ratio", "def": "금 가격 ÷ 은 가격. 역사 평균 약 70", "group": "비철·제련"}, {"term": "리스 레이트", "en": "Lease Rate", "def": "실물 은·금 대여 이자율. 급등은 실물 부족 신호", "group": "비철·제련"}, {"term": "LBMA", "en": "London Bullion Market Association", "def": "런던귀금속시장연합회. 인증 정련소 목록 관리", "group": "비철·제련"}, {"term": "SGE", "en": "Shanghai Gold Exchange", "def": "상하이금거래소. 중국 실물 귀금속 가격 기준", "group": "비철·제련"}, {"term": "스트리밍", "en": "Streaming", "def": "광산에 선불 자금을 대고 향후 생산물을 고정가에 매입할 권리를 갖는 사업 모델", "group": "비철·제련"}, {"term": "희토류", "en": "REE(Rare Earth Elements)", "def": "란탄족 15개와 스칸듐·이트륨을 합친 17개 원소", "group": "희토류·핵심광물"}, {"term": "경희토류·중희토류", "en": "LREE / HREE", "def": "La~Eu(경)와 Gd~Lu·Y(중). 중희토류는 희소하고 분리가 어려워 병목·가격이 집중", "group": "희토류·핵심광물"}, {"term": "란탄족 수축", "en": "Lanthanide Contraction", "def": "원자번호가 커질수록 원자 크기가 줄어 원소 간 성질이 비슷해져 분리가 어려워지는 현상", "group": "희토류·핵심광물"}, {"term": "이온흡착형 점토광상", "en": "IAC(Ion-Adsorption Clay)", "def": "풍화 점토 표면에 희토류가 흡착된 광상. 중국 남부·미얀마에 편중된 HREE 주 공급원", "group": "희토류·핵심광물"}, {"term": "바스트네사이트·모나자이트·제노타임", "en": "Bastnaesite / Monazite / Xenotime", "def": "희토류 광물 유형. 앞의 둘은 경희토류 중심(모나자이트는 방사성 부담), 제노타임은 Y·HREE 비중 높음", "group": "희토류·핵심광물"}, {"term": "용매추출", "en": "SX(Solvent Extraction)", "def": "추출제가 든 유기상으로 희토류를 원소별로 조금씩 분리하는 공정. HREE는 100~200단 이상 필요", "group": "희토류·핵심광물"}, {"term": "REO·TREO", "en": "Rare Earth Oxide / Total REO", "def": "희토류를 산화물 기준으로 환산한 양과 총량. 품위·생산량 단위", "group": "희토류·핵심광물"}, {"term": "MREC", "en": "Mixed Rare Earth Carbonate", "def": "침출 후 여러 희토류가 섞인 탄산염 중간재(분리 전 단계)", "group": "희토류·핵심광물"}, {"term": "NdPr(디디뮴)", "en": "NdPr / Didymium", "def": "네오디뮴·프라세오디뮴 혼합 산화물. NdFeB 자석 주원료", "group": "희토류·핵심광물"}, {"term": "NdFeB 영구자석", "en": "Neodymium Magnet", "def": "네오디뮴-철-붕소 소결자석. EV·풍력·로봇 구동계의 표준", "group": "희토류·핵심광물"}, {"term": "SmCo 자석", "en": "Samarium-Cobalt Magnet", "def": "퀴리온도 700~850℃의 고내열 자석. 미사일·항공엔진·소나용", "group": "희토류·핵심광물"}, {"term": "보자력", "en": "Coercivity(HcJ)", "def": "자석이 외부 자기장·열에 자성을 잃지 않고 버티는 힘. Dy·Tb 첨가로 강화", "group": "희토류·핵심광물"}, {"term": "퀴리온도", "en": "Curie Temperature", "def": "자성체가 자성을 잃는 온도(NdFeB 약 310℃)", "group": "희토류·핵심광물"}, {"term": "SH·UH·EH 등급", "en": "Magnet Grade", "def": "영구자석 최대 사용온도 등급. 뒤로 갈수록 내열성이 높고 HREE 투입이 많음", "group": "희토류·핵심광물"}, {"term": "입계확산", "en": "Grain Boundary Diffusion", "def": "Dy·Tb를 결정립 경계에만 확산시켜 중희토류 사용량을 줄이는 자석 제조 기술", "group": "희토류·핵심광물"}, {"term": "페라이트 마그넷", "en": "Ferrite Magnet", "def": "희토류 없는 산화철 기반 자석. 성능은 낮지만 대체재", "group": "희토류·핵심광물"}, {"term": "유효 공급", "en": "Effective Supply", "def": "채굴량이 아니라 분리·정제·금속화·자석·고객인증까지 거쳐 실제 쓸 수 있는 물량", "group": "희토류·핵심광물"}, {"term": "가격하한", "en": "Price Floor", "def": "정부가 최저가를 보장하고 차액을 보전하는 장치. 미 국방부-MP의 NdPr $110/kg가 대표", "group": "희토류·핵심광물"}, {"term": "오프테이크", "en": "Off-take", "def": "생산 전에 향후 생산물을 사전 구매하는 계약", "group": "희토류·핵심광물"}, {"term": "핵심광물", "en": "Critical Minerals", "def": "희소성보다 공급이 끊기면 경제·안보에 타격을 주는 광물 목록(USGS 60종, 한국 33~35종)", "group": "희토류·핵심광물"}, {"term": "희소금속", "en": "Rare Metals", "def": "추출·제련이 어렵거나 매장이 편중돼 공급 리스크가 큰 금속의 정책적 총칭", "group": "희토류·핵심광물"}, {"term": "부산물 금속", "en": "By-product Metal", "def": "인듐·게르마늄·비스무스처럼 모금속(아연·구리·납) 제련 과정에서만 회수되는 금속", "group": "희토류·핵심광물"}, {"term": "이중용도 품목", "en": "Dual-use", "def": "민수·군수 모두 쓰일 수 있어 수출통제 대상이 되는 품목", "group": "희토류·핵심광물"}, {"term": "역외적용", "en": "Extraterritorial Rule", "def": "중국산 성분 0.1% 이상이나 중국 기술을 쓴 해외 제품에도 수출허가를 요구하는 규정", "group": "희토류·핵심광물"}, {"term": "FDPR", "en": "Foreign Direct Product Rule", "def": "미국 기술이 쓰인 역외 생산제품까지 통제하는 미국 규칙. 중국 역외적용의 모델", "group": "희토류·핵심광물"}, {"term": "DPA", "en": "Defense Production Act", "def": "미국 국방물자생산법. 정부가 전략물자 생산을 지원·명령하는 법적 근거", "group": "희토류·핵심광물"}, {"term": "OBBBA", "en": "One Big Beautiful Bill Act", "def": "2025년 7월 미국 법. 국방부 핵심광물 자금, 세액공제의 비PFE 요건 등 포함", "group": "희토류·핵심광물"}, {"term": "비PFE 요건", "en": "Non-Prohibited Foreign Entity", "def": "미국 세액공제에서 중국 등 금지 외국기관 관련 조달을 배제하는 요건(2030년 25%→2033년 50%)", "group": "희토류·핵심광물"}, {"term": "Project Vault", "en": "Project Vault", "def": "EXIM 100억달러+민간 20억달러로 핵심광물 60일치를 민관 계약형·순환형으로 비축하는 미국 프로그램", "group": "희토류·핵심광물"}, {"term": "MSP·FORGE", "en": "Minerals Security Partnership / FORGE", "def": "미국 주도 핵심광물 다자 협력체(2022)와 이를 55개국으로 재출범한 포럼(2026)", "group": "희토류·핵심광물"}, {"term": "CRMA", "en": "Critical Raw Materials Act", "def": "EU 핵심원자재법. 2030년 역내 채굴 10%·가공 40%·재활용 25% 목표", "group": "희토류·핵심광물"}, {"term": "RKAB", "en": "Rencana Kerja dan Anggaran Biaya", "def": "인도네시아 연간 광물 채굴 사업계획·예산 승인 제도. 니켈 쿼터 근거", "group": "희토류·핵심광물"}, {"term": "InP·GaN·Ge-on-Si", "en": "Compound Semiconductors", "def": "인듐인(통신파장 레이저 기판), 질화갈륨(고전압 전력반도체), 실리콘 위 게르마늄(광검출기)", "group": "희토류·핵심광물"}, {"term": "APT", "en": "Ammonium Paratungstate", "def": "텅스텐 정련 중간재. 탄화텅스텐·합금의 원료", "group": "희토류·핵심광물"}, {"term": "LCE", "en": "Lithium Carbonate Equivalent", "def": "각종 리튬 화합물을 탄산리튬 기준으로 환산한 단위", "group": "배터리금속·리튬"}, {"term": "탄산리튬·수산화리튬", "en": "Li2CO3 / LiOH", "def": "양극재 원료가 되는 리튬 화합물. 수산화리튬은 하이니켈용", "group": "배터리금속·리튬"}, {"term": "스포듀민·레피돌라이트", "en": "Spodumene / Lepidolite", "def": "경암형 리튬 원광. 레피돌라이트(운모계)는 처리비가 높음", "group": "배터리금속·리튬"}, {"term": "SC6", "en": "Spodumene Concentrate 6%", "def": "산화리튬 6% 품위 리튬 정광", "group": "배터리금속·리튬"}, {"term": "DLE", "en": "Direct Lithium Extraction", "def": "흡착·이온교환으로 염수에서 리튬을 직접 뽑는 기술. 회수율 약 90%(증발식 40~50%)", "group": "배터리금속·리튬"}, {"term": "LRMC", "en": "Long-Run Marginal Cost", "def": "장기적으로 신규 공급이 경제성을 갖는 한계비용(리튬 약 $12,000/t)", "group": "배터리금속·리튬"}, {"term": "RIGI", "en": "Régimen de Incentivo para Grandes Inversiones", "def": "아르헨티나 대규모 투자 인센티브(법인세 25%, 관세 면제, 외화보유 허용, 30년 안정성)", "group": "배터리금속·리튬"}, {"term": "ESS·BESS", "en": "(Battery) Energy Storage System", "def": "전력을 저장했다 공급하는 장치. 리튬 신규 수요의 핵심 축", "group": "배터리금속·리튬"}, {"term": "MHP", "en": "Mixed Hydroxide Precipitate", "def": "니켈 광석을 황산 침출해 만든 중간재. 황산니켈 원료", "group": "배터리금속·리튬"}, {"term": "나트륨이온배터리", "en": "Sodium-Ion Battery", "def": "리튬 대신 나트륨을 쓰는 이차전지. 대형 ESS·저가 EV에서 잠재 대체재", "group": "배터리금속·리튬"}, {"term": "LEU·HALEU", "en": "Low-/High-Assay Low-Enriched Uranium", "def": "농축도 3~5%(경수로)와 5~19.75%(SMR 등 4세대) 우라늄", "group": "배터리금속·리튬"}, {"term": "초내열합금", "en": "Superalloy", "def": "고온·고압에서 강도·내산화성을 유지하는 니켈계 중심 합금", "group": "특수합금·소재"}, {"term": "크리프", "en": "Creep", "def": "고온에서 일정 하중이 장시간 가해질 때 서서히 생기는 영구 변형", "group": "특수합금·소재"}, {"term": "VIM·ESR·VAR", "en": "Vacuum Induction Melting 등", "def": "진공유도용해(1차), 전기슬래그 재용해(청정도), 진공아크 재용해(결함 최소화) 청정용해 공정", "group": "특수합금·소재"}, {"term": "Surcharge", "en": "Surcharge", "def": "니켈·코발트 등 원재료 변동분을 기본단가에 별도로 얹어 전가하는 가변 요금", "group": "특수합금·소재"}, {"term": "리드타임", "en": "Lead Time", "def": "발주부터 납기까지 기간. 장기화는 공급자 우위·가격결정력 강화 신호", "group": "특수합금·소재"}, {"term": "NADCAP·AS9100", "en": "Aerospace Quality Certification", "def": "항공우주·방산 부품 제조 공정 품질 인증", "group": "특수합금·소재"}, {"term": "적층제조", "en": "AM(Additive Manufacturing)", "def": "금속 분말을 층층이 쌓아 부품을 만드는 공정(L-PBF·DED·EBM)", "group": "특수합금·소재"}, {"term": "소재투입비", "en": "BTF(buy-to-fly) Ratio", "def": "최종 부품 중량 대비 투입 소재 중량. 절삭 약 20, AM 약 1.2", "group": "특수합금·소재"}, {"term": "MRO", "en": "Maintenance, Repair & Overhaul", "def": "항공기·엔진 정비·수리·분해점검. 특수합금 애프터마켓 수요", "group": "특수합금·소재"}, {"term": "CMC", "en": "Ceramic Matrix Composite", "def": "니켈 초합금 보완용 세라믹 복합재(무게 1/3, 내열 20% 우수)", "group": "특수합금·소재"}, {"term": "CASK", "en": "Cask", "def": "사용후핵연료 건식저장용기(특수강)", "group": "특수합금·소재"}, {"term": "대형단조", "en": "Large Forging", "def": "링압연기 등으로 만든 대형 링·샤프트 부품. 풍력·조선·원전용", "group": "특수합금·소재"}, {"term": "Section 232", "en": "무역확장법 232조", "def": "국가안보를 근거로 미국 대통령이 수입 관세·제한을 부과하는 조항", "group": "무역·정책"}, {"term": "반덤핑·상계관세", "en": "AD / CVD", "def": "정상가 이하 덤핑 수입품에 부과하는 관세와 보조금 받은 수입품에 부과하는 관세", "group": "무역·정책"}, {"term": "가격약속", "en": "MIP(Minimum Import Price)", "def": "수출자가 최저가격 이상으로만 수출하기로 약속하는 반덤핑 대체 구제수단", "group": "무역·정책"}, {"term": "세이프가드·TRQ", "en": "Safeguard / Tariff Rate Quota", "def": "쿼터 내 무·저관세, 초과분 고관세를 부과하는 수입규제", "group": "무역·정책"}, {"term": "Melt & Pour", "en": "Melted and Poured", "def": "철강 원산지를 쇳물 최초 생산국으로 판정하는 규정(한국은 '조강국 확인')", "group": "무역·정책"}, {"term": "MTC", "en": "Mill Test Certificate", "def": "제강사 품질검사증명서. 실제 생산자·원산지 추적 수단", "group": "무역·정책"}, {"term": "반내권", "en": "Anti-Involution(反內卷)", "def": "소모적 내부경쟁·저가 덤핑을 바로잡아 한계기업을 퇴출하려는 중국 정책 기조", "group": "무역·정책"}, {"term": "생산능력 치환", "en": "Capacity Replacement", "def": "신규 설비 건설 시 더 큰 기존 설비 폐쇄를 의무화하는 중국 제도(2026년 1.5:1)", "group": "무역·정책"}, {"term": "초저배출 개조", "en": "Ultra-low Emission Retrofit", "def": "중국 철강 환경설비 전환 정책. 미완료 설비에 요금 차등으로 사실상 구조조정 수단", "group": "무역·정책"}, {"term": "CR10", "en": "Concentration Ratio Top 10", "def": "상위 10개사 점유율 합계. 중국 철강 2024년 51%", "group": "무역·정책"}, {"term": "삼정삼불요", "en": "三定三不要", "def": "판매·수익·현금회수에 맞춰 생산한다는 중국 철강업계 자율 경영원칙", "group": "무역·정책"}, {"term": "K-스틸법", "en": "K-Steel Act", "def": "철강 경쟁력 강화·녹색 전환 특별법(2026.06.17 시행). 감산 담합 예외 인정 등", "group": "무역·정책"}, {"term": "FAST-41", "en": "FAST-41", "def": "미국 연방 인프라 프로젝트 인허가 신속처리 제도", "group": "무역·정책"}, {"term": "K-ETS", "en": "Korea Emissions Trading Scheme", "def": "한국 배출권거래제. 5년 단위, 제4기 2026~30", "group": "탄소"}, {"term": "유상·무상할당", "en": "Auctioned / Free Allocation", "def": "배출권을 경매로 파는 방식과 무료로 나눠주는 방식", "group": "탄소"}, {"term": "MSR", "en": "Market Stability Reserve", "def": "배출권 가격 안정을 위해 시장에서 격리해 두는 예비 물량", "group": "탄소"}, {"term": "CBAM", "en": "Carbon Border Adjustment Mechanism", "def": "EU 수입품 내재 탄소에 EU ETS 연동 비용을 부과하는 탄소국경조정제도", "group": "탄소"}, {"term": "EU ETS", "en": "EU Emissions Trading System", "def": "EU 배출권거래제. CBAM 비용 산정의 기준 가격", "group": "탄소"}, {"term": "탄소집약도", "en": "Carbon Intensity", "def": "제품 1톤당 CO2 배출량(고로 2.0~2.3, 전기로 약 0.5 tCO2/t)", "group": "탄소"}, {"term": "합탕", "en": "Hot Metal Blending", "def": "고로 용선과 전기로 쇳물을 섞어 판재를 만드는 저탄소 전환 공정", "group": "탄소"}, {"term": "WSA", "en": "World Steel Association", "def": "세계철강협회. 글로벌 철강 수요·생산 통계와 전망", "group": "시장·재무"}, {"term": "CISA", "en": "China Iron and Steel Association", "def": "중국철강공업협회. 중국 철강 통계·자율감산 주체", "group": "시장·재무"}, {"term": "PMI", "en": "Purchasing Managers' Index", "def": "구매관리자지수. 50 이상 확장, 이하 위축", "group": "시장·재무"}, {"term": "PPI·M1", "en": "Producer Price Index / Narrow Money", "def": "생산자물가와 협의통화. 중국 M1은 PPI를 약 9개월 선행", "group": "시장·재무"}, {"term": "SOTP", "en": "Sum of the Parts", "def": "사업부문별 가치를 따로 산정해 합산하는 밸류에이션", "group": "시장·재무"}, {"term": "PBR-ROE 모델", "en": "Residual Income P/B", "def": "적정 P/B = (ROE−g)/(COE−g). 자본집약 경기민감 업종에 사용", "group": "시장·재무"}, {"term": "EV/EBITDA", "en": "EV/EBITDA", "def": "기업가치를 상각 전 영업이익으로 나눈 배수. 설비 집약 업종 비교에 사용", "group": "시장·재무"}, {"term": "PRS", "en": "Price Return Swap", "def": "지분 매각대금을 선수령하고 사후 가격차를 정산하는 파생계약. 지주사 지분 유동화 수단", "group": "시장·재무"}, {"term": "영업레버리지", "en": "Operating Leverage", "def": "판매량 증가 시 고정비 분산으로 이익률이 매출보다 크게 개선되는 효과", "group": "시장·재무"}, {"term": "키 맞추기 장세", "en": "Mean Reversion", "def": "지수 변동성이 둔화되며 소외된 저평가 업종이 상대 반등하는 국면", "group": "시장·재무"}, {"term": "ROIC", "en": "Return On Invested Capital", "def": "세후영업이익 ÷ 투하자본. 자본 재배치 성과 지표", "group": "시장·재무"}], "sources": {"orig": ["WSA(세계철강협회)", "OECD Steel Outlook", "CISA(중국철강공업협회)", "중국 국가통계국·해관총서(GACC)", "중국 공업정보화부·상무부", "중국야금공업기획연구원", "Mysteel", "CEIC·Wind", "한국철강협회", "스틸데일리(SteelDaily)", "산업통상부 무역위원회", "관세청·한국무역협회(KITA)", "국토교통부", "환경부·한국거래소(K-ETS)", "EU 집행위원회", "LME·CME(COMEX)·SHFE", "ICSG(국제구리연구그룹)", "IEA", "USGS", "미국 DOE·국방부·상무부·EXIM", "S&P Global", "BloombergNEF", "Benchmark Mineral Intelligence", "SMM(상해유색금속망)", "CRU·Fastmarkets·Argus", "Wood Mackenzie", "Cochilco·Codelco", "Silver Institute·Metal Focus", "Baker Hughes·EIA", "Kpler", "JLL·WEF·Bain & Company", "Energy UK", "GMI·Spherical Insight", "각사 공시·IR(MP Materials, Lynas, Carpenter, ATI, Freeport, BHP, Albemarle, SQM 등)", "Bloomberg 컨센서스"], "notes": ["구리 수급 전망은 기관·시점별로 방향이 바뀐다: ICSG 2026년 전망이 2025.04 +28.9만톤 과잉 → 2025.10 −15만톤 부족 → 2026.04 +9.6만톤 과잉으로 변경됐고, 리포트 자체 추정은 2026년 55만톤 부족까지 제시한다. 인용 시 발표 시점을 반드시 병기.", "동일 지표의 원문 간 수치 차이: 국내 철근 생산능력 1,170만~1,230만톤, EU 신규 TRQ 무관세 쿼터 1,830만/1,834만/1,835만톤, 중국 희토류 채굴 점유율 58~70%, CBAM 인증서 구매 개시 2027년 2월 vs 5월 등은 '미확인'으로 처리했다.", "일부 리포트는 추출 품질 한계가 있다: 2025년 11월 철강 전망 리포트 1건은 국가별 Peer Valuation 표 수치가 OCR로 소실됐고, 2026년 6월 하반기 전망 리포트 1건은 본문(이미지 페이지)이 추출되지 않아 실적표만 반영됐다. 전선 피어 비교표의 일부 잔고 수치도 OCR 소실로 추정치다.", "2025년 국내 철근 내수판매는 원문에 6,554만톤으로 표기됐으나 단위 오기로 판단해 655만톤으로 해석했다.", "희토류 가격은 중국 내수가와 역외가가 수배~수십 배 괴리(산화이트륨 $18 vs $270/kg)하며, 역외 가격은 실거래가 적어 과대 표시됐을 수 있다는 단서가 원문에 있다.", "기업 실적 전망치(영업이익·ROE·PBR 등)는 리포트 발간 시점의 추정이며 리포트 간에도 차이가 크다(예: POSCO홀딩스 2026E 영업이익 2.9조~3.5조원, 현대제철 3,953억~8,082억원). 대쉬보드에는 방향성 파악용으로만 인용했다."]}, "desks": [{"key": "hc", "name": "헬스케어", "url": "https://kj-ryan-ra.github.io/healthcare-desk/"}, {"key": "oilchem", "name": "정유·화학", "url": "../oilchem/"}, {"key": "transition", "name": "에너지전환", "url": "../transition/"}, {"key": "power", "name": "전력인프라", "url": "../power/"}, {"key": "nuclear", "name": "원전", "url": "../nuclear/"}, {"key": "metals", "name": "철강·비철", "url": "../metals/"}], "re <script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const tag=t=>!t?'':`<span class="tag ${t==='확인'?'t-ok':t==='추정'?'t-warn':t==='미확인'?'t-alert':'t-dim'}">${esc(t)}</span>`;
const tone=t=>t==='긍정'?'<span class="tag t-ok">긍정</span>':t==='부정'?'<span class="tag t-alert">부정</span>':'<span class="tag t-dim">중립</span>';
const M=D.meta;
document.title=M.title.replace(' 리서치 데스크','')+' 리서치 데스크';
$('#b-eng').textContent=M.eng; $('#b-title').textContent=M.short||M.title; $('#b-sub').textContent=M.subtitle;
$('#foot').textContent=`${M.version} · 리포트 ${D.reports.length}건`;
$('#desks').innerHTML='<div class="dl">SECTOR DESKS</div>'+(D.desks||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener"${x.key===M.key?' class="cur"':''}>${esc(x.name)}</a>`).join('');
$('#cut').textContent=`DATA CUT ${M.cut}`;

const TABS=[
 ['기초 체계',[['map','산업 지도'],['prod','제품·기술 백과'],['econ','수익 구조'],['ind','핵심 지표'],['deep','딥다이브 라이브러리']]],
 ['시장 · 자본',[['mkt','시장·수급'],['cyc','사이클·내러티브'],['pol','정책·지정학 워치'],['val','밸류에이션']]],
 ['데스크 도구',[['chk','체크포인트'],['uni','커버리지 유니버스'],['cal','이벤트 캘린더'],['fact','수치 DB'],['gl','용어 사전'],['src','출처·데이터 품질']]]
];
let nav='',panes='',n=0;const NUM={};
TABS.forEach(([g,items])=>{nav+=`<div class="nav-group">${g}</div>`;items.forEach(([id,name])=>{n++;const k=String(n).padStart(2,'0');NUM[id]=k;nav+=`<button data-p="${id}"><span class="k">${k}</span>${name}</button>`;panes+=`<section class="pane" id="p-${id}"></section>`;});});
$('#nav').innerHTML=nav;$('#panes').innerHTML=panes;
const head=(id,en,title,lede)=>`<div class="eyebrow">${NUM[id]} — ${en}</div><h2>${title}</h2>${lede?`<p class="lede">${md(lede)}</p>`:''}`;
const table=(cols,rows)=>`<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function chips(el,groups,cb,label='전체'){el.innerHTML=[label,...groups].map((g,i)=>`<button class="chip" aria-pressed="${i===0}" data-g="${esc(i?g:'')}">${esc(g)}</button>`).join('');el.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;el.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b.dataset.g);});}
const uniq=a=>[...new Set(a.filter(Boolean))];

/* 01 map */
(function(){const m=D.map;
 let h=head('map','Industry Map',M.title.replace(' 리서치 데스크','')+' 산업 지도',m.lede);

 $('#p-src').innerHTML=head('src','Sources & Data Quality','출처·데이터 품질',`증권사 산업 리포트 ${R.length}건(${R[R.length-1].date} ~ ${R[0].date})을 재구성했다. 발행사·작성자·종목 의견은 전부 지웠고, 수치에 딸린 원출처 기관만 남겼다.`)+`
 <div class="sec"><h3>데이터 품질 주의</h3><ul class="bb">${S.notes.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div>
 <div class="sec"><h3>인용된 원출처 기관</h3><div class="cloud">${S.orig.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></div>
 ${M.public?'':`<div class="sec"><h3>리포트 인덱스</h3><p class="note">발행일·주제·업황 톤만 남겼다. 톤 분포: 긍정 ${tc['긍정']||0} · 중립 ${tc['중립']||0} · 부정 ${tc['부정']||0}.</p><div style="margin-top:14px">${table(['#','발행일','주제','톤','핵심 주장'],R.map((r,i)=>[String(R.length-i),r.date,'**'+r.topic+'**',r.tone,r.thesis]))}</div></div>`}`+(M.public?`<div class="sec"><h3>근거 자료</h3><p class="note">톤 분포: 긍정 ${tc['긍정']||0} · 중립 ${tc['중립']||0} · 부정 ${tc['부정']||0}. 공개판에서는 개별 리포트 목록을 싣지 않았다.</p></div>`:'');})();

/* nav + theme */
const show=id=>{if(!document.getElementById('p-'+id))id='map';document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+id));document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.p===id));};
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;show(b.dataset.p);try{history.replaceState(null,'','#'+b.dataset.p)}catch(_){}window.scrollTo(0,0);});
show((location.hash||'#map').slice(1));
const root=document.documentElement;const setT=t=>{root.setAttribute('data-theme',t);document.querySelectorAll('.tsb').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));try{localStorage.setItem('desk-theme',t)}catch(_){}};
document.querySelectorAll('.tsb').forEach(b=>b.addEventListener('click',()=>setT(b.dataset.t)));
try{const t=localStorage.getItem('desk-theme');if(t)setT(t);}catch(_){}
})();
</script>
