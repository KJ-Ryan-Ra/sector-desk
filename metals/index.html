가율 둔화는 공급 탄력성 축소. 원료 수출 감소+자석 수출 증가는 해외 자석 자급 봉쇄 신호"], ["가격", "희소금속 가격(Sb·Ge·Ga·Bi·W)", "중국 FOB·로테르담·미국 창고가", "Bloomberg, Argus, 회사 자료", "2025년 비스무스 +270%, 안티모니 +144%, 게르마늄 +106%. 미국 창고가 중국 내수 대비 약 +130%. 텅스텐 정광 ASP 1Q26 +418%", "수출통제 강도의 실시간 신호. 산업금속(구리 +6%, 아연 +3%)과 다른 경로로 움직임"], ["수급", "미국 원유 리그 수·DUC·OCTG 가격", "베이커휴즈 가동 리그 수, 미완결유정 재고, 북미 OCTG 현물가", "Baker Hughes, EIA, 업계 가격지", "원유 리그 408(5월 저점) → 450(9/4), DUC 4,935개(7월), OCTG P110 $2,625/숏톤", "리그 증가·DUC 감소 둔화는 OCTG 수요 지지. 유가 대비 리그 반응계수 둔화에 유의"], ["정책", "탄소가격(EU ETS·CBAM 인증서·KAU)", "EU 배출권·CBAM 인증서 가격과 한국 배출권 가격", "EU 집행위, ICE, 한국거래소", "EU ETS 약 80유로, CBAM 인증서 1Q26 75.3유로, KAU 약 1만원", "EU 가격 상승은 CBAM 비용에 비례. K-ETS 4기 총량 축소 후 KAU 상승 여부가 고로사 비용 경로"], ["금융", "철강 업종 PBR과 코스피 대비 할인율", "KRX 철강 지수 PBR, 시장 PBR 대비 괴리", "한국거래소 자료로 산출", "2026-02 업종 PBR 0.44배·할인 약 70%, 2026-06 KRX 철강 0.68배·할인 67%(2008년 이후 평균 33%)", "실적 개선 확인 시 괴리 축소 여지. 다만 ROE(2025F 1.6%)가 낮아 2015년식 리레이팅(P/B 0.6~0.8배)은 어렵다는 단서 병기"]]}]}, {"h": "자주 나오는 오독 7가지", "blocks": [{"t": "grid", "cols": 2, "numbered": true, "items": [{"h": "'구리 최고가 = 제련사 호황'", "p": "구리 가격과 제련 수수료는 반대로 움직입니다. 정광이 부족해 구리가 오를 때 TC는 0달러·마이너스가 됩니다. 제련사 이익은 부산물과 회수율에서 나오고, 구리 가격 효과는 대부분 메탈게인(일시적)입니다."}, {"h": "'중국 감산 발표 = 가격 반등'", "p": "2016년은 행정 폐쇄로 설비가 실제로 사라졌지만 2025년 반내권은 폐쇄 없는 감산이 많습니다. 원가가 우호적이면 일평균 생산이 다시 늘어 감산이 무력화됩니다. 발표가 아니라 순별 일평균 생산과 순수출을 봅니다."}, {"h": "'유통가 상승 = 실적 개선'", "p": "유통가는 전체 판매의 일부입니다. 자동차·조선 실수요 계약가는 포뮬러로 1~2분기 늦게 따라오고, 조선용 후판은 반기 협상입니다. 유통가 20% 상승이 곧바로 평균 판가 20% 상승이 아닙니다."}, {"h": "'메탈게인도 이익이다'", "p": "회계상 이익이지만 반복되지 않습니다. 가격 하락 반전 시 같은 크기로 역래깅 손실이 납니다. 정상이익(가공마진)과 분리해 밸류에이션합니다."}, {"h": "'매장량이 많으니 희토류 공급은 문제없다'", "p": "병목은 매장이 아니라 분리·정제(중국 89%)와 자석(92%)입니다. 광산이 늘어도 SX 분리·금속화·고객 인증이 없으면 유효 공급은 늘지 않습니다."}, {"h": "'LME 재고 감소 = 전 세계가 타이트'", "p": "관세 차익으로 재고가 COMEX로 옮겨간 것일 수 있습니다. 3대 거래소 합산과 지역별 분포, COMEX-LME 스프레드를 함께 봅니다."}, {"h": "'PBR 0.4배면 싸다'", "p": "ROE가 1~3%면 낮은 PBR은 정당한 할인일 수 있습니다. 2015년 말 리레이팅은 중국 부동산 회복이 동반됐지만 지금은 그 조건이 없습니다. 할인 해소는 스프레드 확인이 전제입니다."}]}]}]}, "trade": {"title": "통상·관세 지도", "h2": "통상·관세 지도 — 철강 가격은 더 이상 하나가 아니다", "en": "Trade & Tariff Map", "lede": "2025년 이후 철강은 **관세가 가격을 만드는 산업**이 됐습니다. 미국 232조 50%, EU 쿼터 47% 축소와 초과분 50%, 한국의 열연·후판·도금재 반덤핑과 가격약속(MIP), 중국의 수출허가제가 동시에 작동하면서 같은 열연이 지역마다 다른 가격에 거래됩니다. 한국 철강사 실적이 중국 지표와 따로 움직이는 이유, 한국산 강관이 관세 50%를 내고도 미국에서 이익을 내는 이유가 모두 이 지도에 있습니다.", "sections": [{"h": "철강 무역의 흐름 — 중국의 1.1억톤은 어디로 가는가", "tag": "확인", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 430\" role=\"img\" aria-label=\"중국의 1.1억톤 순수출이 막힌 시장을 돌아 흐르고, 각국 무역장벽이 그 흐름을 끊으면서 지역별 가격이 갈라진다\"><defs><marker id=\"a-mt11\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"30\" y=\"160\" width=\"180\" height=\"100\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"120\" y=\"191\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">중국<\/text><text x=\"120\" y=\"207\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">조강 9.61억t (세계 52%)<\/text><text x=\"120\" y=\"223\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">순수출 1.13억t (2025)<\/text><text x=\"120\" y=\"239\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">수출허가제 2026-01<\/text><rect x=\"390\" y=\"30\" width=\"180\" height=\"64\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"480\" y=\"59\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">동남아·중동 등<\/text><text x=\"480\" y=\"75\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">제3국 경유<\/text><rect x=\"400\" y=\"175\" width=\"170\" height=\"70\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"485\" y=\"199\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">한국<\/text><text x= \"fill:var(--alert)\">TRQ·CBAM<\/text><path d=\"M450 338 L450 247\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt11)\"/><rect x=\"405\" y=\"290\" width=\"28\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"430\" y=\"301\" font-size=\"11\" text-anchor=\"end\">열연<\/text><rect x=\"446\" y=\"258\" width=\"8\" height=\"28\" rx=\"2\" fill=\"currentColor\" style=\"fill:var(--alert)\" fill-opacity=\".8\"/><rect x=\"366\" y=\"267\" width=\"79\" height=\"14\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"442\" y=\"277\" font-size=\"10\" text-anchor=\"end\" style=\"fill:var(--alert)\">AD 31.6~33.6%<\/text><path d=\"M520 247 L520 338\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt11)\"/><rect x=\"527\" y=\"290\" width=\"59\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"530\" y=\"301\" font-size=\"11\" text-anchor=\"start\">수출 11.2%<\/text><text x=\"30\" y=\"300\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\">2026-1Q 중국 순수출 −22% YoY<\/text><text x=\"30\" y=\"318\" font-size=\"11\" text-anchor=\"start\" opacity=\".75\">(2,339만t, 수출허가제 효과)<\/text><rect x=\"30\" y=\"398\" width=\"8\" height=\"18\" rx=\"2\" fill=\"currentColor\" style=\"fill:var(--alert)\" fill-opacity=\".8\"/><text x=\"46\" y=\"412\" font-size=\"11\" text-anchor=\"start\" opacity=\".8\">= 무역장벽   ·   비중 = 한국 철강 수출의 국가별 비중<\/text><\/svg>", "cap": "**중국의 순수출 1.13억톤(2025, 세계 조강의 6.3%)은 벽이 낮은 시장과 제3국 우회 경로로 흐르고, 각국은 관세·쿼터·조강국 확인으로 그 흐름을 끊고 있습니다.** 한국은 반덤핑+MIP로 중국산 열연 수입 비중을 64.7%에서 11.9%로 낮춰 내수 가격을 방어했지만, 수출 쪽에서는 미국(비중 14.8%)의 232조 50%와 EU(12.3%)의 TRQ·CBAM이라는 두 벽을 동시에 맞습니다. 중국 수출허가제(2026-01) 이후 1Q26 순수출은 −22%로 줄었습니다."}, {"t": "kpis", "items": [{"lab": "중국 철강 순수출(2025)", "val": "1.13억t", "cap": "+8% YoY, 글로벌 조강 대비 6.3%. 원출처 CEIC·GACC", "tag": "확인"}, {"lab": "중국 순수출 1Q26", "val": "−22%", "cap": "약 2,339만t. 수출허가제 시행 첫 분기", "tag": "확인"}, {"lab": "한국 대미 수출(5월 누적)", "val": "+56% 3년은 무상할당 90% 이상으로 부담이 작고, 2029년 이후 무상할당이 줄면서 비용이 가팔라진다\"><defs><marker id=\"a-mt13\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><line x1=\"80\" y1=\"270\" x2=\"860\" y2=\"270\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1\"/><line x1=\"80\" y1=\"50\" x2=\"80\" y2=\"270\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1\"/><text x=\"100\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">2026<\/text><text x=\"182\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">2027<\/text><text x=\"264\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">2028<\/text><text x=\"347\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">2029<\/text><text x=\"429\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">2030<\/text><text x=\"511\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">2031<\/text><text x=\"593\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">2032<\/text><text x=\"676\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">2033<\/text><text x=\"758\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">2034<\/text><text x=\"840\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">2035<\/text><path d=\"M100 61 L264 68 L347 94 L511 149 L676 204 L758 244 L840 270\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"6 4\" style=\"stroke:var(--ok)\"/><path d=\"M100 61 L264 68 L347 94 L511 149 L676 204 L758 244 L840 270 L840 50 L100 50 Z\" fill=\"currentColor\" style=\"fill:var(--alert)\" fill-opacity=\".10\"/><text x=\"104\" y=\"92\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--ok)\">무상할당 90% 이상<\/text><text x=\"593\" y=\"212\" font-size=\"11\" text-anchor=\"middle\" opacity=\".8\">무상할당 축소 (곡선 모양은 개념도)<\/text><text x=\"603\" y=\"72\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">실제 부담 = 무상할당 밖 영역<\/text><text x=\"836\" y=\"228\" font-size=\"12\" text-anchor=\"end\" font-weight=\"600\" style=\"fill:var(--alert)\">2035 폐지<\/text><line x1=\"346.6666666666667\" y1=\"50\" x2=\"346.6666666666667\" y2=\"270\" stroke=\"currentColor\" stroke-opacity=\".4\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/><text x=\"351\" y=\"62\" font-size=\"11\" text-anchor=\"start\" opacity=\".8\">2029 가속 구간<\/text><text x=\"84\" y=\"44\" font-size=\"11\" text-anchor=\"start\" opacity=\".75\">무상할당 비율<\/text><text x=\"460\" y=\"316\" font-size=\"12\" text-anchor=\"middle\">한국 철강 CBAM 비용 추정: 2026E 약 8,200억원 → 전면 도입 시 최대 1.9조원 (€80·2tCO2/t·1,600원/€ 가정, 추정)<\/text><\/svg>", "cap": "**CBAM은 2026년부터 비용이 발생하지만 초기 3년은 무상할당 90% 이상이라 실제 부담이 작고, 2029년 이후 무상할당이 빠르게 줄어 2035년 전면 폐지됩니다.** 한국 철강의 CBAM 비용은 2026E 약 8,200억원(POSCO 약 3,700억원)에서 전면 도입 시 최대 1.9조원으로 추정되며, 이는 관세율로 환산하면 최대 29%에 해당합니다. 고로 비중(72.3%)이 높은 한국이 탄소집약도를 낮추지 못하면 EU 시장 접근이 사실상 관세 인상과 같아집니다."}, {"t": "mods", "items": [{"name": "CBAM 비용 계산", "en": "Carbon Border Adjustment", "formula": "CBAM 비용 ≈ EU향 수출량 × 내재배출(tCO2/t) × (EU ETS 가격 − 국내 탄소가격) × (1 − 무상할당 비율)", "paras": ["내재배출은 고로 톤당 2.0~2.3tCO2, 전기로 약 0.5tCO2입니다. EU ETS는 2020년 초 20유로에서 약 80유로로 올랐고, CBAM 인증서 가격은 1Q26 75.3유로로 확정됐습니다. 국내 배출권(KAU) 약 1만원/톤을 차감할 수 있다는 점이 한국 기업에 유리한 조정 항목입니다.", "소량 면제 임계값은 연 50톤이고, 인증서 구매·신고 의무 개시는 원문에 따라 2027년 2월과 5월로 표기가 다르다(미확인)."], "fields": [{"k": "추정 가정", "v": "원/유로 1,600원, 톤당 2tCO2, 탄소가격 80유로"}, {"k": "추정 결과", "v": "한국 연 약 8,200억원(POSCO 약 3,700억원, 45%), 전면 도입 시 최대 1.9조원"}]}]}]}, {"h": "비철 통상 — 구리 관세와 핵심광물 수출통제", "blocks": [{"t": "p", "text": "비철의 통상 변수는 두 방향입니다. 수입국 쪽에서는 미국이 구리 반가공품에 50% 관세를 매기고 전기동 관세(2027년 15%, 2028년 30% 권고)를 검토하면서 COMEX-LME 괴리와 재고 이동이 생겼습니다. 수출국 쪽에서는 중국이 희토류·희소금속·은·황산 수출을 허가제로 묶고, 짐바브웨(리튬)·인도네시아(니켈)·콩고(코발트)가 원광 수출을 제한해 '자원을 가진 나라가 가격을 정하는' 구조가 확산됐습니다. 세부 공급망 영향은 06 핵심광물 공급망 탭에서 다룹니다."}, {"t": "table", "cols": ["시점", "중국 수출통제 조치"], "rows": [["2020.10", "수출통제법 제정"], ["2023.07", "갈륨·게르마늄 임시 수출통제"], ["2023.10", "흑연 임시 수출통제"], ["2024.08", "안티모니·초경질 재료 수출통제"], ["2024.12", "갈륨·게르마늄·안티모니 대미 수출 금지(2026-11까지 유예)"], ["2025.02", "텅스텐·텔루륨·비스무트·몰리브덴·인듐 수출통제"], ["2025.04", "희토류 7종(Sm·Gd·Tb·Dy·Lu·Sc·Y)·자석 수출허가"], ["2025.10", "희토류 12종으로 확대·0.1% 역외적용·기술 통제 → 미중 합의로 1년 유예"], ["2026.01", "은 수출 허가제 전환(44개사)"], ["2026.05", "황산 수출 사실상 중단"]], "title": "중국 핵심광물 수출통제 연표"}]}]}, "supply": {"title": "핵심광물 공급망", "h2": "핵심광물 공급망 — 쟁점은 매장이 아닌 정제", "en": "Critical Mineral Supply Chain", "lede": "핵심광물의 병목은 땅속이 아니라 공장 안에 있습니다. 희토류 매장의 중국 비중은 48% 수준이지만 분리·정제는 89%, 자석은 92%, 중희토류 정제는 98~99%입니다. 갈륨·흑연은 100%에 가깝습니다. 따라서 공급망 재편은 광산 개발보다 **정제·금속화·자석 공장과 그것을 버티게 하는 정부 가격 장치**의 문제이며, 한국 기업의 기회도 '비중국 회수·정제 역량'에 있습니다.", "sections": [{"h": "중국 의존도 — 하류로 갈수록 상승", "tag": "확인", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 900 480\" role=\"img\" aria-label=\"갈륨·흑연·중희토류 정제는 사실상 100% 중국이고, 광산 단계보다 정제·가공 단계의 의존도가 훨씬 높다\"><defs><marker id=\"a-mt14\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><text x=\"250\" y=\"30\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\">중국 점유율 (%)<\/text><line x1=\"530.0\" y1=\"40\" x2=\"530.0\" y2=\"450\" stroke=\"currentColor\" stroke-opacity=\".4\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/><text x=\"530\" y=\"468\" font-size=\"11\" text-anchor=\"middle\" opacity=\".7\">50%<\/text><line x1=\"754.0\" y1=\"40\" x2=\"754.0\" y2=\"450\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/><text x=\"754\" y=\"468\" font-size=\"11\" text-anchor=\"middle\" opacity=\".7\">90%<\/text><text x=\"240\" y=\"63\" font-size=\"12\" text-anchor=\"end\">구형흑연 (가공)<\/text><rect x=\"250\" y=\"50\" width=\"554\" height=\"18\" rx=\"2\" fill=\"currentColor\" style=\ "fill:var(--accent)\" fill-opacity=\".8\"/><text x=\"471\" y=\"402\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\">38<\/text><text x=\"240\" y=\"427\" font-size=\"12\" text-anchor=\"end\">안티모니 (광산)<\/text><rect x=\"250\" y=\"414\" width=\"202\" height=\"18\" rx=\"2\" fill=\"currentColor\" style=\"fill:var(--accent)\" fill-opacity=\".8\"/><text x=\"460\" y=\"428\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\">36<\/text><\/svg>", "cap": "**90%를 넘는 붉은 막대는 모두 정제·가공 단계이고, 광산 단계(희토류 채굴 58%, 안티모니 광산 36%)는 상대적으로 분산돼 있습니다.** 즉 비중국 광산을 확보해도 원료는 다시 중국 정제소로 가야 하는 구조이며, 중국이 수출통제로 겨냥하는 것도 바로 이 정제·가공 단계입니다. 국가·출처별로 수치가 다르므로(희토류 채굴 58~70%, 비스무스 82~88%) 인용 시 단계와 출처를 함께 적습니다."}, {"t": "table", "cols": ["원자재", "상위 3개국(점유율)"], "rows": [["리튬(정련)", "중국 58%, 칠레 29%, 아르헨티나 10%"], ["희토류(정련)", "중국 87%, 말레이시아 12%, 에스토니아 1%"], ["코발트(정련)", "중국 65%, 핀란드 10%, 벨기에 5%"], ["구형흑연", "중국 99%"]], "title": "핵심원자재 정련·가공 상위국 점유율", "note": "원출처 IEA. 같은 '희토류 정련'도 자료에 따라 87~91%로 표기됩니다."}, {"t": "table", "cols": ["국가", "채굴", "분리", "제련(금속)", "자성합금"], "rows": [["중국", "58%", "89%", "90%", "92%"], ["미국", "16%", "—", "—", "<1%"], ["미얀마", "12%", "—", "—", "—"], ["호주", "7%", "—", "—", "—"], ["말레이시아", "—", "7%", "—", "—"], ["일본", "—", "—", "—", "7%"], ["베트남", "—", "—", "~3%", "1%"]], "title": "영구자석 공급망 단계별 국가 점유율"}]}, {"h": "비중국 공급망은 정부가 만든다 — 가격 바닥을 사는 네 가지 수단", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"중국이 가격을 떨어뜨려 경쟁자를 퇴출시키는 전략에 맞서 미국은 가격 바닥·지분·구매·비축으로 비중국 공급망의 하방을 사들였다\"><defs><marker id=\"a-mt15\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"20\" y=\"40\" width=\"200\" height=\"62\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--ok);fill-opacity:.12;stroke:var(--ok)\" stroke-width=\"1.4\"/><text x=\"120\" y=\"68\" font-size=\"12\" text-anchor=\"mi 25\" y=\"81\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">증산·저가 수출<\/text><path d=\"M525 96 L525 178\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" marker-end=\"url(#a-mt15)\" style=\"stroke:var(--alert)\"/><rect x=\"557\" y=\"130\" width=\"53\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"560\" y=\"141\" font-size=\"11\" text-anchor=\"start\" style=\"fill:var(--alert)\">가격 공격<\/text><rect x=\"800\" y=\"164\" width=\"145\" height=\"94\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"872\" y=\"200\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">매출 = max(시장가, 하한)<\/text><text x=\"872\" y=\"216\" font-size=\"10\" text-anchor=\"middle\" opacity=\".75\">초과분 30% 환수<\/text><text x=\"872\" y=\"230\" font-size=\"10\" text-anchor=\"middle\" opacity=\".75\">최소 EBITDA 보장<\/text><path d=\"M760 211 L798 211\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt15)\"/><rect x=\"290\" y=\"310\" width=\"470\" height=\"54\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"525\" y=\"334\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">Molycorp 2015 파산 (가격 90% 하락) → MP 2025 흑자전환<\/text><text x=\"525\" y=\"350\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">순이익 940만$, 1Q26 NdPr 생산 +63%<\/text><\/svg>", "cap": "**중국은 경쟁자가 나타나면 증산·덤핑으로 가격을 떨어뜨려 퇴출시켰고(Molycorp 2015 파산), 미국은 그 가격 공격을 정부가 흡수하는 구조로 답했습니다.** 미 국방부-MP Materials 계약은 NdPr 하한 $110/kg(당시 시장가 약 $57의 2배), 4억달러 우선주, 10년 자석 전량구매, 최소 EBITDA를 한 번에 묶었고, 그 결과 MP는 2025년 흑자로 전환했습니다. 비중국 프로젝트의 가치는 광석 품위보다 이런 하방 장치의 유무와 집행 단계가 결정합니다."}, {"t": "grid", "cols": 2, "items": [{"h": "가격 하한 (Price Floor)", "p": ["정부가 시장가와 하한가의 차액을 보전하고, 시장가가 하한을 넘으면 초과분 일부(30%)를 환수합니다. MP 모델은 Lynas USA(약 9,600만달러 LOI, NdPr 하한 $110 동일)로 확장됐고 G7은 2026년 1월 희토류 가격하한 시장개입을 공식화했습니다."]}, {"h": "지분 투자 (Equity Stake)", "p": ["미국 정부는 2025년 MP Materials(최대주주), Trilogy Metals(10%+워런트 7.5%), Lithium Americas(모회사 5%·JV 5%), USA Rare Earth(CHIPS LOI 최대 15.8억달러, 지분 8~16%) 등에 직접 지분을 취했습니다."]}, {"h": "장기 구매 (Offtake)", "p": ["국방부가 10X 자석공장 생산을 10년간 전량 구매하고, Apple은 MP와 5억달러 자석 계약(선급금 2억달러, 2027년부터)을 맺었습니다. 오프테이크는 매출 가시성을 만들어 프로젝트 파이낸싱을 가능하게 합니다."]}, {"h": "전략 비축 (Stockpile)", "p": ["Project Vault는 EXIM 100억달러 대출과 민간 20억달러로 60종 핵심광물 약 60일치를 민관 계약형·순환형으로 비축합니다(GM·보잉·GE버노바 참여). OBBBA는 국방부 핵심광물 직접자금 75억달러(비축 20억·산업기반기금 50억·신용 5억)를 배정했습니다."]}]}, {"t": "table", "cols": ["항목", "Project Vault", "기존 전략비축"], "rows": [["성격", "민관 협력 계약형 실물 비축", "정부 주도 비상 대응 비축"], ["운영 주체", "민간 원자재 트레이딩 기업", "정부 직접 운영"], ["재원", "정부 대출(EXIM 100억달러) + 민간 자본 20억달러", "정부 재정 직접 매입"], ["접근", "계약 참여 기업만", "국가 필요 시 시장 전체 방출"], ["재고 순환", "인출 후 보충(순환형)", "축적 후 필요 시만 방출"]], "title": "Project Vault vs 기존 전략비축"}]}, {"h": "대체 공급망 프로젝트 트래커", "note": "확정 계약·가동 중인 것과 LOI·목표 단계인 것을 구분해 읽습니다. '단계' 칸이 딜 검토 때 가장 중요한 정보입니다.", "blocks": [{"t": "table", "cols": ["지역", "프로젝트·기업", "공급망 단계", "규모·목표", "일정", "정부 지원·계약", "단계"], "rows": [["미국", "MP Materials (Mountain Pass)", "채굴→분리→자석", "REO 연 약 4.5만t(세계 15~20%), NdPr 산화물 6,000t 목표, 10X 자석 1만t", "NdPr 1Q26 917t(+63%), 10X 2028", "국방부 하한 $110·우선주 4억$·대출 1.5억$·오프테이크", "가동·확장"], ["미국", "MP 중희토류 분리", "분리(Dy·Tb)", "원료 3,000t → Dy·Tb 200t", "2026 중반 목표", "—", "건설"], ["미국(텍사스)", "Lynas Seadrift", "경·중희토류 분리", "—", "2026 가동 예정", "국방부 계약 1.2억$(1·2단계 2.58억$, 환경허가 협상)", "협상·건설"], ["호주·말레이시아", "Lynas (Mt Weld·Kuantan)", "채굴·분리", "생산능력 1.05만t+1,500t, NdPr 산화물 3,407t", "Mt Weld 수명 20년+", "Lynas USA 약 9,600만$ LOI", "가동"], ["미국", "Energy Fuels + Chemours", "정제", "NdPr 3,000t 목표, Dy 산화물 파일럿 약 29kg(2025)", "2026", "—", "파일럿"], ["미국", "USA Rare Earth (Round Top·오클라호마)", "채굴·자석", "미국 최대 HREE 광상, NdFeB 자석 공장", "2026 상반기 상업화 목표", "CHIPS LOI 최대 15.8억$", "LOI"], ["미국", "E-Vac Magnetics / Vulcan Elements", "자석", "Mountain Pass 원료 → NdFeB / Nidec 공급 예정", "—", "—", "건설"], ["호주", "Iluka Eneabba", "정제", "—", "2027", "호주 정부 12억$", "건설"], ["프랑스", "Solvay La Rochelle", "분리·정제", "NdPr 4,500t(2030 목표)", "2025-04 상업생산", "EU CRMA", "가동"], ["에스토니아", "Neo Performance Materials", "자석", "NdFeB 2,000t", "2025", "EU", "가동"], ["사우디", "Ma'aden + MP Materials", "채굴·정제", "—", "2028 중반 생산 목표", "—", "건설"], ["인도", "IREL", "정제", "5,000t(2030 목표)", "2030", "정부", "확장"], ["일본", "JOGMEC + Sojitz", "광산 지분·비축", "재고 12개월분 확대", "—", "정부", "운영"], ["호주(갈륨)", "Alcoa Wagerup", "갈륨 회수", "연 100t(세계 수요 약 10%)", "2026-07 FID", "호주 정부 최대 2억$", "FID"], ["한국", "한국광해광업공단 + 포스코인터내셔널", "정제·광산 투자", "정제 5,000t(2027 목표), 미국 분리정제 공장", "시범 2027-4Q, 양산 2028", "한미 핵심광물 프레임워크", "계획"], ["한국·미국", "고려아연 Crucible (테네시)", "통합 제련·희소금속", "총 74억$, Sb 2,600t·Bi 430t·In 100t·Ga 54t·Ge 44t", "2029 단계 가동", "미 정부·금융기관 차입 47억$ + CHIPS 2.1억$", "계획"], ["한국", "고려아연 폐자석 리사이클", "재활용(Nd·Pr·Dy·Tb)", "연 100t", "2027 상업가동", "—", "계획"], ["인도네시아", "LS MnM 니켈제련소", "니켈 제련(비중국)", "지분 78%(취득가 2,563억원)", "2026-11 인수 완료 예정", "비PFE 요건 대응", "인수 중"], ["아르헨티나", "포스코아르헨티나", "리튬(염수)", "1·2단계 5만t → 2034년 10만t", "2공장 2.5만t 2026-10", "RIGI 세제", "가동·확장"]], "note": "원출처: 각사 공시·IR, 미 국방부·상무부, 호주 정부. 목표치는 회사 계획이며 '단계'는 2026-09 기준. 개별 기업 평가가 아니라 공급망 위치 정리입니다."}]}, {"h": "자원국 수출통제의 확산 — 인도네시아 모델", "blocks": [{"t": "p", "text": "인도네시아는 2014년 니켈 원광 수출을 금지해 정제 투자를 유치했고, 니켈 정제 점유율을 3% 미만에서 43%(2024)로 끌어올렸습니다. 이 성공이 다른 자원국의 교본이 됐습니다. 짐바브웨는 리튬 원광 수출 금지(2022) → 정광 수출 무기한 중단(2026-02) → 쿼터제(수출세 10%) → 2027-01 정광 전면 금지로 단계를 밟고 있고, 콩고는 코발트 쿼터제를 시행 중입니다. 자원국 규제는 '가격 사이클'이 아니라 '정책 사이클'이라 날짜가 정해진 이벤트로 추적해야 합니다."}, {"t": "table", "cols": ["국가", "광물", "진행사항", "생산비중", "대체가능성"], "rows": [["콩고", "코발트", "시행중(쿼터제)", "약 73%", "낮음"], ["짐바브웨", "백금", "즉각금지 시행", "3위", "낮음"], ["남아공", "크롬원광", "수출허가제 도입", "세계 1위(약 40%)", "낮음"], ["가봉", "망간원광", "2029년 금지 예고", "세계 2위(약 23%)", "중간"], ["남아공", "백금", "리스크(미발표)", "세계 1위(약 75%)", "매우 낮음"], ["기니", "보크사이트", "허가취소 압박", "세계 1위(약 32%)", "낮음"], ["나미비아", "우라늄", "리스크(논의중)", "세계 2위(약 14%)", "중간"]], "title": "지정학 리스크에 노출된 광물과 대체 가능성"}, {"t": "table", "cols": ["시나리오", "짐바브웨 리튬 정광 수출통제 영향"], "rows": [["공급 비중", "글로벌 리튬 정광의 약 8~10%(2025 정광 수출 기준 탄산리튬 환산 약 9%)"], ["공급 차질 규모", "3~19만t LCE(SMM, 2026) / 2027년 1~9만t LCE 시나리오"], ["가격 전망", "2027년 탄산리튬 $25,000/t(추정)"]], "title": "짐바브웨 리튬 수출통제 시나리오"}]}, {"h": "국내 기업 공급망 매핑 — 어디에 서 있나", "blocks": [{"t": "table", "cols": ["기업", "공급망 위치", "핵심 자산·계획", "딜 검토 시 확인할 것"], "rows": [["고려아연", "비중국 다금속 회수·제련", "은 약 2,000t/년(글로벌 5.7%), 희소금속 회수, 테네시 Crucible, 폐자석 리사이클", "CAPEX 2027~28E 연 5조원대와 차입, 희소금속 가격 변동, 지배구조 이슈"], ["POSCO홀딩스", "리튬(염수·광석·DLE)·희토류", "리튬 캐파 9.3만t → 17.3만t(2033), MinRes 30%(정광 27만t 오프테이크)", "리튬가 $20,000 이상·가동률 95%·C1 $5,500 조건 충족 여부"], ["포스코인터내셔널", "희토류 정제·자석 코어·흑연", "미국 분리정제 공장(시범 2027-4Q), 구동모터 코어", "정부 계약의 집행 단계(MOU vs 실계약)"], ["LS (LS MnM·LS전선)", "구리 제련·니켈 제련·케이블", "인니 니켈제련소 78%, LS MnM 영업이익의 약 80% 부산물(추정)", "비상장 자회사 가치와 중복상장 규제"], ["LS에코에너지", "희토류 금속화", "Dy·Tb 금속화(2027 목표), Sm 금속 시생산(2026)", "원료 조달선과 고객 인증"], ["제이에스링크", "NdFeB 자석 직접 생산", "Lynas 원료로 N42SH 시생산, 미국·말레이시아 공장(2027 완공 예상)", "양산 수율과 고객 인증 단계"], ["성림첨단산업", "NdFeB 자석", "희토류 금속 수입 → 자석 생산", "Dy·Tb 조달의 중국 의존도"]], "note": "사실 기반 위치 정리이며 투자 판단이 아닙니다. 상세는 13 커버리지 유니버스 참조."}]}]}, "deep": {"title": "딥다이브 라이브러리", "h2": "딥다이브 라이브러리 — 19편", "en": "Deep-Dive Library", "lede": "뉴스 한 줄 뒤에 있는 구조를 한 편씩 끝까지 따라가는 심화 노트입니다. 각 편은 **한 문장 결론 → 원리와 수치 → 비교표 → 핵심 사실 → 국내 연결점** 순서로 되어 있어, 처음 공부할 때는 위에서부터, 딜 검토 때는 해당 하위섹터 편만 골라 읽으면 됩니다. 핵심 네 편(중국 구조조정, 황산 병목, 은, 특수합금)에는 메커니즘 도식을 붙였습니다.", "sections": [{"h": "철강 — 과잉 설비와 무역장벽이 만든 국지적 회복", "note": "중국 구조조정의 성격, 가격 분절, 한국 무역구제, 철근 구조조정, 탄소 규제, 고부가 전략까지 철강 본업을 움직이는 여섯 가지 축.", "blocks": [{"t": "mods", "open": 1, "items": [{"name": "중국 공급측 개혁 2016 vs 반내권 2025~26: 같은 목표, 다른 메커니즘", "pill": "2025.11~2026.09", "lede": "이번 중국 철강 구조조정은 행정 감산으로 가격을 끌어올린 2016년식 '슈퍼사이클'이 아니라, 치환 규정과 환경 기준으로 한계 설비를 자연 퇴출시키는 L자형 산업재편에 가깝습니다.", "paras": ["중국은 2001년 WTO 가입 이후 도시화로 조강 생산이 급증해 세계 비중이 15%(2000년)에서 50%(2013년)로 커졌고, 이후 글로벌 철강 사이클은 중국 정책에 좌우되는 구조가 됐습니다. 중국 철강 수요의 약 50%가 부동산·인프라에서 나오기 때문에 경기부양기엔 수요가 늘고 긴축기엔 위축됩니다. 2020년 부동산 '3대 레드라인' 규제와 2021년 헝다 사태 이후 중국은 장기 다운사이클에 들어섰고, 2025년 중국 철강 수요는 7.1% 급감해 8억톤을 밑돌았습니다(WSA).", "1차 공급측 개혁(2016~2018)은 지방정부가 불법 설비(지조강)를 폐쇄하는 Top-down 행정 감산이었고, 강한 글로벌 수요와 부동산 호황이 겹쳐 철강 가격이 V자로 반등했습니다. 다만 명목상 1.5억톤 이상을 폐쇄했다는 발표와 달리 유령설비 위주 퇴출이어서 조강 생산은 2016년 8억톤에서 2019년 9.9억톤으로 오히려 늘었다는 평가가 있습니다. 당시 국내 고로사 P/B는 0.6~0.8배까지 재평가됐습니다.", "2025년 이후의 '반내권(反內卷)'은 합법 설비의 실제 생산량과 설비 교체를 규칙으로 묶습니다. 2026년 5월 18일 개정된 설비 치환 규정은 치환비율을 전국 1.5:1로 통일하고 승인 유효기간을 24개월로 명확히 했으며, M&A에는 1.25:1 우대비율을 주고 기업 간 생산능력 지표 거래는 2년 유예 후(2028년 5월) 폐지합니다. 여기에 초저배출 개조 미완료 설비(약 2억톤)에 대한 전기·수도요금 차등, 2026년 1월 수출허가제, 철강업 전국 ETS 편입이 겹쳐 '버티지 못하는 회사부터' 퇴출시키는 구조입니다.", "시장의 공통 결론은 '업황 추가 악화를 막는 방어 장치'라는 것입니다. 설비가 폐쇄되지 않고 잉여로 남는 한 수요 회복 시 공급이 빠르게 늘 수 있고, OECD는 신규 증설이 폐쇄 물량을 상쇄해 중국 생산능력이 2028년까지 최대 3,860만톤 순증할 수 있다고 경고합니다. 반면 40년 이상 노후 고로 약 1.8억톤이 1.5:1로 치환되면 장기 공급과잉률이 30%에서 15~20%로 낮아질 잠재력도 있습니다. 또 2026년 4월 중국 철강업계가 흑자 전환하자 자율감산 원칙(삼정삼불요)에서 이탈하는 죄수의 딜레마가 재현돼, 실질 감산 속도는 제한적이라는 시각이 우세합니다."], "table": {"cols": ["구분", "1차 공급측 개혁(2016~2018)", "반내권 구조조정(2025~)"], "rows": [["방식", "지방정부 행정명령식 설비 폐쇄", "치환비율·환경·에너지 기준으로 자연 퇴출"], ["통제 대상", "생산'능력'(불법 설비 퇴출)", "합법 설비의 생산'량'과 설비 교체"], ["수요 환경", "강한 글로벌 수요+부동산 호황", "부동산 장기 침체, 내수 보통 이하"], ["가격 경로", "V자 급등, 업계 전반 이익 레벨업", "바닥 다지기+완만한 회복, 대형·국유사 중심 차별화"], ["핵심 장치", "감산 기한·물량 하달", "1.5:1 치환, 24개월 유효기간, M&A 1.25:1, 지표거래 폐지(2028.05), 수출허가제, ETS"], ["국내 철강 시사점", "고로사 P/B 0.6~0.8배 재평가", "동일 폭 리레이팅 어려움, 고부가·저탄소·대형사 선별"]]}, "bullets": ["중국 국유기업이 조강 생산의 약 63%를 차지해 정책 실행력의 기반이 됨(국유 초저배출 개조 96% vs 민영 63%)", "CR10(상위 10사 집중도) 2024년 51%로 목표 60~70%에 미달 → M&A 우대가 집중도 상승 수단", "14차 5개년 목표 대비 전기로 비중 약 10.4%(목표 15%), 스크랩 비중 20.8%(목표 30%)로 미달", "15차 5개년(2026~30)은 총량 감산 수치 없이 '신품질 생산력'·고급강 확대에 방점", "확인 지표: 월간 조강·순수출 역성장 지속, 실제 설비 폐쇄·M&A 건수"], "kr": "POSCO홀딩스·현대제철의 판재 스프레드 회복 폭과 밸류에이션 저점 통과 여부가 중국 구조조정의 실제 이행 강도에 달려 있습니다. IPO 관점에서 국내 철강 피어의 멀티플이 2015년식으로 재평가될 것이라는 가정은 보수적으로 다뤄야 합니다.", "svg": "<svg viewBox=\"0 0 960 300\" role=\"img\" aria-label=\"2016년은 행정 폐쇄와 강한 수요로 V자 반등했지만, 2025년 반내권은 치환·환경 기준으로 한계설비를 천천히 퇴출시키는 L자형 재편이다\"><defs><marker id=\"a-mt20\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><text x=\"20\" y=\"78\" font-size=\"13\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--ok)\">1차 공급측 개혁<\/text><text x=\"20\" y=\"96\" font-size=\"11\" text-anchor=\"start\" opacity=\".75\">2016~2018<\/text><rect x=\"200\" y=\"50\" width=\"170\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"285\" y=\"79\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">행정 명령<\/text><text x=\"285\" y=\"95\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">지방정부 설비 폐쇄<\/text><path d=\"M370 82 L388 82\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt20)\"/><rect x=\"390\" y=\"50\" width=\"170\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"475\" y=\"79\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">생산능력 퇴출<\/text><text x=\"475\" y=\"95\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">낙후설비 1.5억t<\/text><path d=\"M560 82 L578 82\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt20)\"/><rect x=\"580\" y=\"50\" width=\"170\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"665\" y=\"79\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">수요 환경<\/text><text x=\"665\" y=\"95\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">글로벌 수요+부동산<\/text><path d=\"M750 82 L768 82\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt20)\"/><rect x=\"770\" y=\"50\" width=\"170\" height=\"64\" rx=\"6\" fill=\"var(--surfac y=\"180\" width=\"170\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--warn);fill-opacity:.12;stroke:var(--warn)\" stroke-width=\"1.4\"/><text x=\"855\" y=\"209\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">가격<\/text><text x=\"855\" y=\"225\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">L자형 재편<\/text><text x=\"480\" y=\"284\" font-size=\"12\" text-anchor=\"middle\">중국 조강 세계 비중 15%(2000) → 50%(2013) → 52%(2025): 글로벌 철강 사이클은 중국 정책의 함수<\/text><\/svg>", "cap": "**같은 '구조조정'이라도 2016년은 설비를 행정적으로 없애고 강한 수요가 받쳐 V자 반등했지만, 2025년은 치환 규정과 환경 기준으로 한계설비를 천천히 밀어내는 L자형 재편입니다.** 국유기업 비중(조강의 약 63%)이 집행력의 기반이지만 부동산 수요가 없어 가격 탄력은 약합니다. 국내 철강 피어 멀티플이 2015년식으로 재평가될 것이라는 가정은 보수적으로 다뤄야 합니다."}, {"name": "보호무역이 만든 철강 가격의 지역 분절화", "pill": "2025.06~2026.09", "lede": "과거에는 중국 가격이 곧 글로벌 가격이었지만, 미국 50% 관세·EU 쿼터 축소·한국 반덤핑으로 철강 가격이 지역별로 따로 움직이는 '뉴노멀'이 자리 잡았습니다.", "paras": ["미국은 2025년 2월 232조 철강·알루미늄 관세를 25%로 재개한 뒤 국내 가격 상승으로 효과가 상쇄되자 6월 50%로 인상했고, 한국산에 적용되던 쿼터제도 폐지했습니다. 파생상품 관세는 매년 1·5·9월 정기적으로 대상을 넓히는 시스템으로 설계돼 1차(2025.08) 신청 467개 중 407개(90%)가 승인됐고, 2차에는 688개 품목이 접수됐으며 2026년 4월 6일 파생제품 확대가 발효됐습니다. 그 결과 미국 열연 유통가는 톤당 900달러 중반까지 올랐고 Nucor·Steel Dynamics 주가는 2026년 +56~58%를 기록했습니다.", "EU는 2026년 6월 만료되는 세이프가드를 대체해 7월부터 무관세 쿼터를 2024년 대비 47% 줄인 1,830만~1,835만톤으로 축소하고 초과분 관세를 25%에서 50%로 올렸으며, 원산지를 실제 쇳물 생산국으로 보는 Melt & Pour 규정을 10월 시행합니다. 한국의 EU 쿼터 소진율은 이미 90%(2025년 3분기)였고, 한국 전용쿼터는 207만톤으로 기존보다 줄었습니다. 여기에 2026년 1월 CBAM 비용 부과가 겹칩니다.", "중국 가격은 1분기 횡보 후 4월부터 제품별 1~7% 오르는 데 그쳤고, 한국·동남아·인도는 중국산 수입 규제로 그 중간에서 반등했습니다. 한국은 1H26 열연·철근 유통가가 약 20% 올라 한중 열연 가격차가 $101(2025.11)에서 $141(2026.06)로 벌어졌습니다. 업계는 국내 철강사 실적을 중국 가격만으로 추정하면 오판할 수 있다고 경고합니다.", "지역 분절은 수출에도 비대칭 효과를 냅니다. 한국의 미국향 철강 수출은 2026년 5월 누적 물량 +56%(ASP −23%)로 오히려 늘었는데, 증가분 64만톤 중 42만톤이 철근이었습니다. 반면 EU향은 2025년 물량 −8%·ASP −5%로 이미 위축됐고 7월 TRQ 강화로 추가 감소가 예상됩니다. 결국 보호시장 안에 생산기반(현지화)을 가진 기업에 수혜가 집중되는 구조입니다."], "table": {"cols": ["지역", "주요 제도", "2025~26 가격 반응"], "rows": [["미국", "232조 50%(2025.06), 파생상품 정기 확대, 국가별 쿼터 폐지", "열연 톤당 900달러 중반, 최고 수준 형성"], ["EU", "TRQ 무관세 쿼터 −47%, 초과분 50%(2026.07), Melt & Pour(10월), CBAM(2026.01)", "역내 가격 상승, 역외 수출 여력 축소"], ["한국", "후판·열연 반덤핑+MIP, 도금재 잠정 AD, 봉강 조사, 조강국 확인", "1H26 열연·철근 유통가 약 +20%"], ["중국", "수출허가제(2026.01), 치환 규정(2026.05)", "4월 이후 제품별 +1~7%에 그침"], ["동남아·인도", "중국산 수입 규제", "내수가 반등"]]}, "bullets": ["중국산 철강재에 대한 전 세계 반덤핑 건수 약 190건(2020년 약 173건, WTO)", "한국 철강 수출 비중: 미국 14.8%, EU 12.3%, 일본 11.2%", "한국 대미 수출 2025년 −8.2%(ASP −6.5%), 에너지용 강관은 6월 이후 급감(연간 −11%)", "EU 초과관세 50%는 사실상 물량·가격 동시 제약", "시장은 2026년 하반기 미국 정치환경 변화로 관세 완화 가능성도 언급"], "kr": "관세 장벽 안의 현지 생산(현대제철·포스코 루이지애나 전기로, 세아제강 미국 법인, 넥스틸 텍사스)이 '관세 회피 옵션'으로 가치가 커졌습니다. 국내 기업 실사 시 지역별 매출·생산 믹스를 가격 분절 관점에서 분해해야 합니다."}, {"name": "한국형 무역구제의 확산: H형강에서 열연·도금재·봉강까지", "pill": "2025.04~2026.09", "lede": "한국 정부의 반덤핑·가격약속(MIP)·조강국 확인이 판재 전반으로 확산되며 국내 판가가 중국과 디커플링됐습니다.", "paras": ["한국 무역구제의 효과를 보여주는 선례는 2015년 중국산 H형강 반덤핑입니다. 관세 부과 후 중국산 수입은 73.7만톤(2014)에서 2.2만톤(2018)으로 급감했고 수입 유통가는 62만원에서 74만원으로 올랐습니다. 2025~26년에는 이 방식이 후판(2025.08 최종, 27.91~34.10%), 열연(2025.09 잠정 28~33%, 2026.02 최종 판정, 2026.06.23부터 MIP 병행), 도금·컬러강판(2026.06 잠정 최고 33.67%), 특수강 봉강(2026.05 조사 개시)으로 확산됐습니다.", "효과는 품목별로 다르게 나타났습니다. 열연은 중국산 수입 비중이 2Q25 64.7%에서 1H26 11.9%로 급감했고, 가격약속으로 수입 오퍼가 자체가 올라갔습니다. 무역위원회는 가격약속 이행 시 국산 열연 출하가 약 100만톤 늘고 점유율이 8.9%p 오를 것으로 봤습니다. 후판은 수입량이 오히려 늘었지만(2026.5 누적 +31.6%) 중국산 오퍼가가 원화 약 100만원으로 국내 수입 유통가(95만원)를 웃돌게 됐습니다.", "가격 효과에는 시차가 있습니다. 관세가 부과돼도 이미 들어온 저가 수입재 재고가 소진돼야 유통가가 오르는데, 열연은 2025년 9월 관세 후 재고 소진을 거쳐 2026년 1분기부터 가격이 올랐습니다. 열연은 냉연·도금·강관의 기초 소재라 열연 가격 상승은 다운스트림 전반으로 전이되고, 철강재는 무거워 국내 생산의 약 60%가 내수로 팔리므로 내수가 개선의 수혜가 큽니다.", "우회로 차단도 병행됩니다. 2026년 수입 철강 신고 시 품질검사증명서(MTC) 제출 의무화와 조강국(Melted and Poured) 확인 대상을 냉연·도금·형강·봉강·선재·STS·특수강 등 사실상 전 품목으로 넓히는 작업이 진행 중입니다. 다만 업계는 반덤핑과 MIP가 '판가 하단 지지'일 뿐 구조적 해법은 아니며, 제3국 경유 우회수출과 MIP 분기 재산정 결과를 계속 점검해야 한다고 지적합니다."], "table": {"cols": ["품목", "대상국", "조치·세율", "진행"], "rows": [["H형강", "중국", "반덤핑 28.23~32.72%(2015)", "2021.03 재심 후 5년 재부과"], ["스테인리스 평판압연", "중국·인니·대만", "반덤핑", "2025.05 재심 후 5년 재부과"], ["스테인리스 후판", "중국", "AD 21.62%", "2025.09 확정, 2030.09까지"], ["탄소강·합금강 후판", "중국", "27.91~34.10%(9개사 가격약속)", "2025.08 최종판정, 5년"], ["열연", "중국·일본", "중국 28.16~33.10%, 일본 31.58~33.57% + MIP(중국 6개 그룹·일본 3개사)", "2026.02 최종판정, 2026.06.23부터 5년"], ["아연·아연합금 도금 냉연(GI·컬러)", "중국", "잠정 22.34~33.67%", "2026.06.12 잠정, 10월 최종 예정"], ["봉강(STS 제외)", "중국", "덤핑 조사", "2026.05.07 개시, 예비 9~10월, 최종 2027.02 예정"]]}, "bullets": ["가격약속 대상(일본 3개사+중국 6개 그룹)이 한국 열연 수입의 약 81%", "국내 봉강 수입의 90.7%가 중국산, 단가 22.5% 낮음", "2026.5 누적 중국산 특수강봉강 수입 −94.0%(조사 개시 효과)", "국내 열연 유통가 연초 80 → 5월 말 96~98만원(+20%)", "관세 발효 시점과 판가 반영 사이 1~2분기 시차 존재"], "kr": "POSCO홀딩스·현대제철(열연·후판), KG스틸(도금재), 세아베스틸지주(봉강)가 직접 영향권입니다. 반덤핑 판정 일정은 해당 기업 공모·메자닌의 실적 가정에 들어가는 핵심 이벤트입니다."}, {"name": "철근: 5년 내리막 끝의 수출 급증과 구조조정 1순위", "pill": "2026.01~2026.09", "lede": "만성 과잉이던 국내 철근이 미국 데이터센터향 수출 급증과 정부의 구조조정 1순위 지정이 맞물려 수급 개선 국면에 들어섰습니다.", "paras": ["국내 철근은 생산능력 1,170만~1,230만톤(9개사) 대비 2025년 수요 687만톤, 생산 702만톤으로 가동률이 56~57%에 불과합니다. 철근 내수 판매는 2021년 1,028만톤에서 2024년 756만톤으로 줄었고, 2025년 착공면적은 −12.2%, 건설투자는 265조원(−9.7%, IMF 이후 최대 낙폭)으로 수요 회복은 아직 뚜렷하지 않습니다. 준공 후 미분양이 늘고 있어 근본적 수요 반등에는 시간이 더 필요하다는 것이 공통된 시각입니다.", "변화는 수출에서 왔습니다. 2024년 3.9만톤에 불과하던 철근 수출이 2025년 15.5만톤, 2026년 1월 11.8만톤, 2월 13만톤(역대 최대, 이 중 미국 11만톤·푸에르토리코 1.5만톤)으로 급증했습니다. 배경은 국내외 가격차 확대(미국 내 가격 900달러 초중반 vs 한국산 수출가 톤당 약 541달러), 미국 데이터센터발 봉형강 수요(연간 약 100만톤 추가 추정), 그리고 기존 미국향 수출국의 관세·AD/CVD입니다(멕시코 AD 20.6%, 알제리 예비 AD 127%, 이집트 예비 CVD 30%, 중국 AD 133%).", "공급 측에서는 정부가 2025년 11월 '철강산업 고도화 방안'에서 철근을 구조조정 1순위 품목으로 지정했고, 현대제철이 2026년 1월 인천공장 철근 설비(연 75~80만톤, 국내 생산의 약 10%)를 폐쇄했습니다. 업계는 감축 규모를 생산능력의 20~25%(240~300만톤)로 추정하며, 수출과 구조조정이 맞물리면 가동률이 56%에서 86%까지 개선될 수 있다고 봅니다. K-스틸법(2026.06.17 시행)은 감산·가동률 조정을 공정거래법상 담합 예외로 인정해 이를 제도적으로 뒷받침합니다.", "전기로 철근은 고로·석유화학 같은 연속공정과 달리 배치식이라 차지 수와 조업일만 조정해도 감산이 쉽고, 감가상각이 많이 진행돼 고정비 부담도 낮습니다. 따라서 봉형강 가격은 수요보다 공급 조절에 민감하게 반응하며, 실제로 철근 유통가는 2025년 11월 66만원에서 2026년 2월 75만원으로, 스프레드는 27만원에서 35만원으로 뛰었습니다. 남은 과제는 잉여인력 문제로, 신사업이 있는 대형사는 전환배치가 가능하지만 순수 철근업체는 대응 수단이 마땅치 않습니다."], "table": {"cols": ["항목", "수치", "시점·출처"], "rows": [["국내 철근 생산능력", "1,170만~1,230만톤", "2025, 한국철강협회·업계(원문 간 차이, 미확인)"], ["철근 수요/명목소비", "687만톤 / 666만톤(−14%)", "2025, 한국철강협회"], ["가동률", "56~57%", "2025, 업계 추정"], ["철근 수출", "3.9만(2024) → 15.5만(2025) → 월 13만톤(2026.02)", "무역통계"], ["미국향 월평균 수출", "9.2만톤(2026.4 누적, 전년 1,300톤)", "SteelDaily·Bloomberg"], ["구조조정 감축 추정", "생산능력의 20~25%(240~300만톤)", "업계 추정"], ["수출+구조조정 시 가동률", "56% → 86%", "업계 추정(Capa 930만 vs 수요 800만톤 가정)"]]}, "bullets": ["현대제철 철근 시장점유율 27%, 인천공장 가동중단으로 선제 대응", "대한제강(연 240만톤)·한국철강 등 순수 철근업체는 수출 수혜와 고용 부담이 공존", "미국 내 한국산 철근 수입이 급증하면 RTAC의 AD/CVD 제소 가능성", "철근 유통가 상승이 건설사 가격 저항으로 이어질 위험", "2026년 월평균 수출 10만톤 유지 여부가 핵심 추적 지표"], "kr": "현대제철, 동국제강, 대한제강, 한국철강이 직접 대상입니다. 순수 철근업체의 경우 자사주(대한제강 약 25%) 활용 등 자본정책 이슈도 함께 봐야 합니다."}, {"name": "2026 탄소 규제 대전환: K-ETS 제4기와 EU CBAM", "pill": "2025.11~2026.09", "lede": "2026년은 국내 배출권 할당이 11% 줄고 EU CBAM 비용 부과가 시작되는 해로, 고로 비중 72%의 한국 철강에 탄소가 새 원가 항목으로 들어왔습니다.", "paras": ["K-ETS는 기업에 배출권을 할당하고 실제 배출량과 정산하는 제도로 5년 단위로 운영되며 2026년 제4기(2026~30)가 시작됐습니다. 제1~3기 연평균 할당량은 5.6~5.8억톤으로 과도했고 유상할당 비중은 약 2%에 불과해 배출권 가격이 톤당 약 1만원에서 횡보했습니다. 제4기는 총량을 5.0억톤(−11%)으로 줄이고 2027~30년 연평균 3.5%씩 추가 축소하며, 시장안정화 예비분(MSR)을 총량에 포함하고 발전부문 유상할당을 2030년 50%까지 올립니다.", "철강은 무역집약도가 높아 사실상 100% 무상할당을 받아왔지만, 발전 외 부문 총량이 약 14% 줄면서 POSCO(최근 3년 평균 배출 7,100만톤, 할당 7,691만톤)의 2026년 할당은 약 6,600만톤으로 추정돼 부족 구간에 들어섭니다. 이월분 1,041만톤으로 약 2년을 버틸 수 있어 실제 구매는 2028년 이후로 추정되고, 현대제철은 2026년부터 연 300만톤 이상 부족이 예상됩니다. POSCO와 현대제철 고로 배출이 철강금속 업종 총배출(1억1,524만톤)의 84%를 차지합니다.", "대응 수단은 전기로입니다. 고로(톤당 2.0~2.3tCO2)보다 전기로(약 0.5tCO2)의 탄소집약도가 1.5 가량 낮아, POSCO는 광양 250만톤 전기로(2026년 6월 준공)를 고로 용선과 합탕해 300만톤 이상, 현대제철은 유휴 전기로 재가동으로 150만톤 감축이 가능합니다. 다만 자동차강판·후판 등 고급강을 합탕 쇳물로 만들어야 하는 품질·원가 과제가 있습니다. 장기적으로는 POSCO의 수소환원제철(HyREX, 데모플랜트 1.3조원·연 30만톤, 2030년 상용기술 목표)이 핵심이며, 경제성에는 kg당 2,000원 이하 수소가 필요합니다.", "EU CBAM은 철강·알루미늄·비료·시멘트·전기·수소 수입품의 내재 탄소에 EU ETS 가격 상당의 비용을 부과합니다. 2025년 9월 개정으로 연 50톤 이하 소량 면제, 인증서 예치 의무 완화가 반영되었고 초기 3년 무상할당이 90% 이상이므로 단기 충격은 제한적입니다. 그러나 2029년부터 무상할당이 가파르게 줄고 2035년 전면 폐지되며, 한 추정은 한국 CBAM 비용을 연 약 8,200억원(POSCO 약 3,700억원), 전면 도입 시 최대 1.9조원으로 추정합니다. 역설적으로 저탄소 전환이 빠른 국내 업체에는 고탄소 경쟁국(중국·인도) 대비 반사 수혜 가능성도 제시됩니다."], "table": {"cols": ["구분", "K-ETS 제4기", "EU CBAM"], "rows": [["시행", "2026~2030", "2026.01 비용 부과 시작(인증서 구매는 2027년, 원문 간 2월·5월 표기 차이)"], ["총량/범위", "5.0억톤(−11%), 이후 연 −3.5%", "철강·알루미늄·비료·시멘트·전기·수소"], ["무상할당", "철강은 무상할당 유지하나 총량 축소", "초기 3년 90% 이상 → 2029년부터 급감 → 2035 폐지"], ["가격", "KAU 약 1만원/톤", "EU ETS 약 80유로, 인증서 1Q26 75.3유로"], ["한국 철강 비용 추정", "POSCO 연 약 500억원(현 가격, 2028년 이후)", "연 약 8,200억원, 전면 도입 시 최대 1.9조원"]]}, "bullets": ["2024년 국내 배출 5억6,562만톤(−1.7%), 상위 10개사가 53%", "ArcelorMittal 유럽 탄소집약도 1.8 → 2030년 1.35tCO2/t 목표", "중국도 2025년 철강을 전국 ETS에 편입(2027년 2단계 벤치마크·유상할당)", "수소환원제철 본예타 통과 총 8.1천억원(국비 3.1천억원)", "정부 로드맵: 고로→전기로 전환(2026~35), 수소환원제철 15기(2036~50)"], "kr": "POSCO홀딩스·현대제철의 배출권 부족 규모와 전기로 합탕 품질은 향후 원가와 밸류에이션 할인율을 결정하는 장기 변수입니다. 탄소 다배출 제조업 IPO 시 할당량·이월분·CBAM 노출을 반드시 확인해야 합니다."}, {"name": "공급과잉 시대의 생존 전략: 고부가 믹스와 해외 상공정", "pill": "2026.05~2026.09", "lede": "글로벌 과잉설비가 2028년 7.45억톤으로 커지는 가운데 국내 철강사의 해법은 범용재 축소·고부가 믹스·관세장벽 뒤 현지 일관생산·신사업 자본 재배치로 수렴합니다.", "paras": ["OECD는 2026년 6월 글로벌 과잉설비 전망을 2025년 6.4억톤에서 2028년 7.45억톤으로 상향했습니다. 2026~28년 수요 증가분은 3,400만톤인데 생산능력은 최대 1.39억톤 늘 수 있고, 증설의 약 60%가 아시아(중국 최대 3,860만톤, 인도 3,180만톤)에서 나옵니다. ASEAN은 2025~30년 생산이 연 8.5% 늘어 수요(3.5%)를 크게 웃돕니다. 글로벌 철강 수요는 2026년 17.2억톤으로 정체되고 2027년 17.6억톤(+2.2%)이며, 증가분의 41.7%를 인도가 차지합니다.", "이 과잉은 지역별로 불균등하게 작용합니다. 인도·미국·인도네시아는 자국 중심 정책으로 수입재 진입이 어렵고 현지 철강사 영업이익률이 한국(4~5%)의 2~3배(인도 10~14%, 미국 12~18%, 인니 7~15%)입니다. 따라서 포스코는 하공정 위주 해외 진출 공식을 버리고 인도(JSW 합작 오디샤 600만톤, 총 10.7조원), 미국(루이지애나 250~270만톤 전기로, 58억달러, 현대제철 50%·현대차 15%·기아 15%·포스코 20%), 인니(PT.KP 확장)에서 상공정 완결형 체제를 구축하여 2031년 해외 조강 1,000만톤을 목표로 합니다.", "국내에서는 범용재(건설용 철근·형강·일반 후판)에 대한 투자를 줄이고 자동차강판·전기강판·에너지강재·방산/원전/전력향 특수강에 자본을 집중합니다. 자동차강판은 생산량의 약 20%이나 수익 기여는 훨씬 크며, AI 인프라향 '특화강 패키지'(송전탑·배터리 케이스·서버랙용 고내식 도금·압력용기 후판) 판매를 2025년 38만톤에서 2028년 52만톤, 2030년 100만톤으로 늘리는 계획이 제시되었습니다. 현대제철도 데이터센터·송전철탑·ESS 인클로저향 강재를 2030년까지 누적 100만톤 판매하는 것을 목표로 합니다.", "마지막 축은 신사업으로의 자본 재배치입니다. 포스코그룹은 2026년 7월 CEO Investor Day에서 철강을 '산업자원'으로, 리튬·희토류를 '전략자원'으로, LNG·신재생을 '에너지자원'으로 재정의한 트리플 코어를 선언하고 2026~28년 29.1조원(성장투자 16.7조원)을 배정했습니다. 그룹 매출 내 철강 비중을 51%에서 35%로 낮추고 2028년 PBR 1.0배 이상을 목표로 하며, 상장 자회사 지분을 50%까지 낮춰 약 3.6조원을 확보(90% 재투자, 10% 자사주)합니다. 세아베스틸지주도 본업 현금을 미국 특수합금(SST)에 재배치하는 같은 구조입니다."], "table": {"cols": ["거점", "형태·규모", "투자·지분", "일정"], "rows": [["인도 오디샤", "JSW 50:50 일관제철소 600만톤", "총 10.7조원(자본 1.6조+차입 3.7조)", "2026.04 본계약, 현지 마진 15% 전후"], ["미국 루이지애나", "전기로 일관제철소 250~270만톤", "58억달러, 현대제철 50%·현대차 15%·기아 15%·포스코 20%", "2029 상업생산 목표"], ["인도네시아", "PT.KP 확장 300만톤, STS 상공정", "냉연·도금 고도화", "2025 턴어라운드, 2028 STS 상공정"], ["포스코 해외 조강 목표", "1,000만톤", "해외 철강 성장투자 6.7조원", "2031"]]}, "bullets": ["인도 철강 수요 1.47억톤(2024) → 2.4~2.6억(2035) → 3.42억톤(2045) 전망, 1인당 소비 103kg(세계 215kg)", "미국 전기로사 영업이익률 Nucor 12%·STLD 10.3%(1Q26) vs 고로사 마진 압박", "포스코그룹 2035 매출 187조·영업이익 13.1조원 목표", "리스크: 자회사 지분 출회 오버행, PRS 사후정산 손실, 대규모 CAPEX 대비 현금흐름", "현대제철 루이지애나는 자금조달 구조가 관건으로 지적됨"], "kr": "POSCO홀딩스, 현대제철, 세아베스틸지주. 지주사의 자회사 지분 유동화(블록딜·EB·PRS)는 ECM 실무와 직결되는 이슈로, 할인율·정산 리스크·유통주식 확대 효과를 함께 확인해야 합니다."}]}]}, {"h": "구리·제련 — 병목이 광산에서 제련·황산으로 이동", "note": "광산 공급 병목, TC 붕괴 이후의 제련 경제학, 황산 병목, 새로운 수요 축과 미국 관세.", "blocks": [{"t": "mods", "open": 0, "items": [{"name": "구리 공급 병목: 광산 연쇄 사고·품위 하락·17년 리드타임", "pill": "2025.05~2026.09", "lede": "2025년 세계 최대급 광산들이 연달아 멈추면서 구리 공급의 구조적 취약성이 드러났고, 시장은 이를 '슈퍼사이클'이 아닌 '가격 하단의 레벨업'으로 규정합니다.", "paras": ["2025년 5월 콩고 Kamoa-Kakula(지진·지하수 유입), 7월 칠레 El Teniente(지진 갱도 붕괴), 9월 인도네시아 Grasberg(대규모 토사 유입, 불가항력 선언)가 잇따라 가동을 중단했습니다. Grasberg는 2026년 생산 전망이 77만톤에서 36만톤으로 절반 수준으로 줄었고 2H26 가동률 65%, 2027년 중반 80%, 2027년 말 완전 정상화(일부는 2028년 초까지 지연 가능)가 제시되었습니다. Kamoa-Kakula는 2026년 가이던스를 29~31만톤으로 거듭 하향했습니다.", "사고만의 문제가 아닙니다. 글로벌 정광 생산의 약 42%를 차지하는 주요 9개사의 2025년 합산 생산은 958.6만톤으로 가이던스 중간값 대비 −4.8%였고 9개사 모두 가이던스를 달성하지 못했습니다. 2026년에도 주요 광산 생산은 1Q −4.6%, 2Q −5.6%(YoY)였고 Codelco −11%, Anglo American은 품위 저하로 가이던스를 70~76만톤으로 하향했습니다. 칠레 Cochilco는 2026년 칠레 생산 전망을 560만톤에서 527만톤으로 낮췄습니다.", "구조적 원인은 세 가지입니다. 첫째 품위: 남미 주요 광산 품위는 2000년 1.2~1.3%에서 2025년 0.6%로 절반 수준이 되었고 BHP는 1.02%에서 2027년 0.7%로 하락할 전망이어서, 같은 구리를 얻는 데 에너지 집약도가 120~150% 늘었습니다. 둘째 리드타임: 신규 광산의 발견부터 생산까지 평균 17년(15.5~24.1년, 미국은 약 29~32년)이 소요되고, 최근 발견 자산의 70% 이상이 기존 광산 인근 확장(브라운필드)입니다. 셋째 투자: 글로벌 구리 탐사예산은 2012년 47억달러에서 2024년 30억달러로 감소했고 광산 건설비는 톤당 $8,000~10,000에서 $15,000~20,000으로 상승했습니다.", "시장은 이것이 수요 급증에 의한 슈퍼사이클이 아니라, 공급 병목과 통제로 가격의 '바닥'이 구조적으로 높아진 것이라고 해석합니다. 신규 공급을 끌어내는 인센티브 가격이 톤당 $10,000~12,000이어서 이 수준이 실질적 하방으로 작동하고, LME 구리는 2025년 초 약 $9,000에서 연말 약 $13,000, 2026년 3분기 현물 $14,912까지 상승했습니다. 반대로 Grasberg 정상화가 빨라지거나 스크랩 규제가 완화되면 병목이 해소되는 하방 리스크도 명확합니다."], "table": {"cols": ["광산(국가)", "연간 CAPA(kt)", "2025 연초 가이던스(kt)", "2025 실제(kt)", "원인"], "rows": [["Grasberg(인도네시아)", "770", "680", "460", "산사태·토사 유입(2025.09)"], ["El Teniente(칠레)", "430", "370", "310", "지진 갱도 붕괴(2025.07)"], ["Kamoa-Kakula(콩고)", "600", "520~580", "389", "지진·지하수 유입(2025.05)"], ["Quebrada Blanca(칠레)", "316", "230~270", "190", "테일링 댐 고도화 지연"]]}, "bullets": ["주요 9사 2025년 생산 958.6만톤(YoY −4.0%, 가이던스 대비 −4.8%)", "ICSG 2026년 광산 생산 증가율 2.4% → 1.6%로 하향, 시장 자체 추정 1.0%", "Cobre Panamá(세계 공급 1~2%) 재가동 여부 미정", "Kamoa-Kakula 2028년 연 50만톤 이상 회복, Oyu Tolgoi 2028~36 연평균 50만톤 체제가 중기 공급 증가 요인", "DRC 2026년 8월 구리·코발트 정광 수출 제한"], "kr": "국내에는 구리 광산이 없어 정광 부족은 제련사(고려아연·LS MnM)의 원료 조달 비용으로, 구리가 상승은 신동·전선(풍산·대창·LS전선·대한전선)의 메탈게인·판가로 전이됩니다."}, {"name": "TC/RC 붕괴와 제련업의 생존 모델: 부산물 경제", "pill": "2024.04~2026.09", "lede": "구리 제련수수료가 2026년 사상 처음 0달러, 현물은 톤당 −227.5달러까지 하락하면서 제련소는 수수료가 아니라 금·은·황산·희소금속 회수로 수익을 내는 '부산물 경제'로 전환되었습니다.", "paras": ["TC/RC는 광산이 정광을 판매할 때 제련·정련 대가로 대금에서 차감하는 수수료입니다. 정광 4톤(품위 25%)으로 전기동 1톤을 만든다면 TC×4톤이 제련소 마진이 됩니다. 정광이 귀해지면 제련소 간 원료 확보 경쟁으로 TC가 낮아지고, 심하면 제련소가 웃돈을 지급하는 마이너스가 됩니다. 벤치마크 TC는 2015년 $92, 2024년 $80에서 2025년 $21.25, 2026년 $0으로 급락했습니다.", "원인은 수급 불균형입니다. 최근 5년 중국 1차 제련능력은 43%(320만톤) 늘었지만 세계 정광 생산은 11%(약 200만톤) 증가에 그쳤고, 2020~25년 중국 정련능력은 83% 늘어 글로벌 정련의 약 50%(960만톤 이상)를 차지하나 원료 자급률은 30% 미만입니다. 제련소 가동률은 중국 약 85%, 중국 외 70% 미만이며, 일본 미쓰비시머티리얼즈는 오나하마 제련소(연 23만톤) 정광 처리를 1년간 중단했고 Glencore PASAR는 약 20만톤을 감산했습니다.", "그런데도 2026년 상반기 중국 정련동 생산이 늘어난 이유는 부산물입니다. 호르무즈 봉쇄와 중국의 황산 수출 중단으로 황산 가격이 457위안에서 2,105위안까지 상승했고, 중국 Yunnan Copper처럼 황산이 매출의 1%이나 매출총이익의 10% 이상을 차지하는 구조가 제련소를 지탱했습니다. 금·은 가격 급등도 같은 역할을 했습니다. 제련사 이익과 TC의 상관관계가 약해진 것은 국내도 마찬가지로, 고려아연은 TC 사상 최저 환경에서 1Q26 사상 최대급 이익을 기록했습니다.", "TC와 구리 가격은 역상관입니다. 둘 다 '정광 부족'이라는 공통 원인의 결과이므로 1988~2025년 TC 하락과 구리가 상승이 동시에 나타날 확률은 72.2%(2013~25년 92.3%, Fisher exact test p=0.017)였습니다. 40년간 유지된 연간 벤치마크 계약도 현물과의 괴리(2000~23년 평균 약 $12 → 2024~25년 약 $90)가 커지면서 Antofagasta 등이 현물지수 연동(하한 포함) 방식을 일부 도입했고, 2026년 4분기 2027년 협상에서 추가 하락과 계약 구조 변화가 핵심 쟁점입니다. 중국 제련소 구매연합(CSPT)은 2026년 가동률 10% 이상 감축(정광 수요 약 100만톤 축소)에 합의했습니다."], "table": {"cols": ["연도", "벤치마크 TC($/t)", "비고"], "rows": [["2015", "92", "정상 수준"], ["2023", "88", ""], ["2024", "80", "4월부터 현물 TC 마이너스 진입"], ["2025", "21.25", "전년 대비 −58.75, 현물 저점 약 −$50"], ["2026", "0", "사상 최저, 현물 −$45(연말) → −$227.5(2026-08-14)"], ["2027(협상 예정)", "추가 하락 유력(시장 판단)", "고정 vs 현물지수 연동 비중이 쟁점"]]}, "bullets": ["제련 이익원: TC/RC → Free Metal·귀금속·황산·희소금속으로 이동", "독립 제련소 퇴출·수직계열화 메이저(BHP·Rio·Freeport) 수혜의 양극화", "Aurubis: 총마진 중 TC/RC 비중 14% → 6%로 낮아졌으나 Metal result·황산으로 방어", "Boliden 1Q26 광산 EBIT +133% vs 제련 +28%", "리스크: 부산물 가격 하락 시 제련 감산 가속 → 정련동 공급 추가 감소"], "kr": "LS MnM(정광 구매 기반 전통 제련, TC 약세 직접 노출, 2Q25부터 전기동 부문 3개 분기 적자를 부산물로 방어)과 고려아연(부산물·재활용 원료 기반 저원가 구조)의 차이가 뚜렷합니다. 구리 증설(고려아연 2025년 습식 3.3만톤 → 2028년 약 15만톤)은 원료 확보력이 관건입니다."}, {"name": "황·황산 병목: 제련소엔 호재, 습식 광산엔 악재", "pill": "2026.03~2026.09", "lede": "호르무즈 봉쇄로 중동 황 공급이 막히고 중국이 황산 수출을 중단하면서, 구리 공급 병목이 광산·제련에 이어 '황산'이라는 세 번째 경로로 확산되었습니다.", "paras": ["구리를 만드는 방법은 두 가지입니다. 황화광을 선광·용융하는 건식제련과, 저품위 산화광을 황산으로 녹여 용매추출·전해채취로 바로 전기동을 만드는 습식제련(SX-EW)입니다. SX-EW는 세계 정련동의 약 1/5(약 17%), 칠레의 약 21%, 콩고의 약 80%를 차지하여 황산이 광산의 핵심 투입재입니다.", "중동은 세계 황 생산의 약 24%를 차지하고 전 세계 해상 황 교역의 절반이 호르무즈를 통과합니다. 2026년 3월 이란 전쟁 이후 카타르산 황은 톤당 890달러(+243% YoY)로 상승했고, 중국은 비료용 수요를 지키기 위해 1~4월 약 70만톤 쿼터 운영 후 5월부터 전자급을 제외한 황산 수출을 사실상 중단했습니다(5월 11.7만톤 → 6월 980톤). 칠레는 황산 수입의 37%를 중국에 의존해 왔고 3월 중국산 수입이 0톤이 되었으며, 콩고는 연 130~140만톤의 황을 대부분 중동에서 수입합니다.", "영향은 비대칭적입니다. Antofagasta는 황산이 생산원가의 약 5%로 2Q 현금원가가 6% 상승했고, Capstone은 Mantoverde(SX-EW)에서 황산 사용 20만톤·전기동 생산 5,000톤을 줄였습니다. 업계는 SX-EW 황산 물류 차질에 따른 구리 생산 차질을 약 12.5만톤으로 추정합니다. 반면 황산을 부산물로 판매하는 건식 제련소에는 수익원이 되어, 중국 제련소가 마이너스 TC에도 정광을 매입하며 감산이 지연되는 효과를 냈습니다.", "따라서 황산 가격은 구리 수급의 숨은 스위치입니다. 황산이 높으면 제련소가 가동을 유지하며 정련동 공급이 유지되고, 하락하면 제련 감산이 가속되어 정련동 공급이 줄어듭니다. 2026년 8월 중순 중국 98% 황산은 1,941위안으로 고점(7월초 2,105위안)에서 소폭 내려왔고, 동시에 중국의 허위 세금계산서 단속(역발행 한도 개인당 연 500만 위안)으로 공식 유통 가능한 동스크랩이 줄어 제련 원료가 추가로 부족해졌습니다. 8월 중국 전기동 생산은 YoY 감소로 추정됩니다."], "bullets": ["SX-EW 비중: 세계 정련동 약 1/5, 칠레 약 21%, 콩고 약 80%", "중국 황산 457위안(2025초) → 1,782(4월초) → 2,105(7월초) → 1,941위안(8월 중순)", "황 공급의 중동 비중 약 24%, 해상 교역의 절반이 호르무즈 통과", "동스크랩 규제는 스크랩이 정광 부족을 완충하던 경로를 약화", "황산은 인산비료 원료라 식량안보 정책과도 연결"], "kr": "고려아연·LS MnM은 황산을 부산물로 판매하는 쪽이어서 황산 강세의 수혜 측면이 있습니다(LS MnM 황산 부문 영업이익 4Q25 169억 → 1Q26 253억원). 반대로 우라늄·니켈 습식 공정에도 황산이 필요하여 원가 전이가 넓게 퍼집니다.", "svg": "<svg viewBox=\"0 0 960 330\" role=\"img\" aria-label=\"황산 가격 급등은 제련소에는 마이너스 TC를 버티게 하는 부산물 이익이지만, 황산을 사서 쓰는 SX-EW 광산에는 원가 상승이다\"><defs><marker id=\"a-mt21\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"20\" y=\"40\" width=\"200\" height=\"60\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"120\" y=\"67\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">원소 황<\/text><text x=\"120\" y=\"83\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">중동 정유·가스 부산물<\/text><rect x=\"20\" y=\"150\" width=\"200\" height=\"60\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"120\" y=\"177\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">제련 SO2 회수<\/text><text x=\"120\" y=\"193\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">동·아연 제련소<\/text><rect x=\"360\" y=\"95\" width=\"220\" height=\"70\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--warn);fill-opacity:.12;stroke:var(--warn)\" stroke-width=\"1.4\"/><text x=\"470\" y=\"127\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">황산 시장<\/text><text x=\"470\" y=\"143\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">가격 신고가 부근<\/text><path d=\"M220 70 L358 118\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt21)\"/><rect x=\"266\" y=\"74\" width=\"28\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"280\" y=\"85\" font-size=\"11\" text-anchor=\"middle\">연소<\/text><path d=\"M220 180 L358 142\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt21)\"/><rect x=\"260\" y=\"166\" width=\"39\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"280\" y=\"177\" font-size=\"11\" text-anchor=\"middle\">부산물<\/text><rect x=\"20\" y=\"250\" width=\"200\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--alert);fill-opacity:.12;stroke:var(--alert)\" stroke-width=\"1.4\"/><text x=\"120\" y=\"275\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">공급 충격<\/text><text x=\"120\" y=\"291\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">중국 수출 중단(2026-05)<\/text><rect x=\"250\" y=\"250\" width=\"200\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--alert);fill-opacity:.12;stroke:var(--alert)\" stroke-width=\"1.4\"/><text x=\"350\" y=\"275\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">공급 충격<\/text><text x=\"350\" y=\"291\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">러시아 황 수출통제·호르무즈<\/text><path d=\"M150 250 L400 167\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" marker-end=\"url(#a-mt21)\" style=\"stroke:var(--alert)\"/><path d=\"M350 250 L430 167\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" marker-end=\"url(#a-mt21)\" style=\"stroke:var(--alert)\"/><rect x=\"720\" y=\"30\" width=\"220\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--ok);fill-opacity:.12;stroke:var(--ok)\" stroke-width=\"1.4\"/><text x=\"830\" y=\"59\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--ok)\">제련소<\/text><text x=\"830\" y=\"75\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">황산 매출↑ → 감산 지연<\/text><rect x=\"720\" y=\"130\" width=\"220\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--alert);fill-opacity:.12;stroke:var(--alert)\" stroke-width=\"1.4\"/><text x=\"830\" y=\"159\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">SX-EW 광산<\/text><text x=\"830\" y=\"175\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">원가↑·감산 (콩고 80%)<\/text><rect x=\"720\" y=\"230\" width=\"220\" height=\"64\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"830\" y=\"259\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">인산비료<\/text><text x=\"830\" y=\"275\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">농업 원가 상승<\/text><path d=\"M580 115 L718 62\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt21)\"/><rect x=\"623\" y=\"68\" width=\"53\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"650\" y=\"79\" font-size=\"11\" text-anchor=\"middle\">판매 수익<\/text><path d=\"M580 130 L718 162\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt21)\"/><rect x=\"623\" y=\"126\" width=\"53\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"650\" y=\"137\" font-size=\"11\" text-anchor=\"middle\">구매 원가<\/text><path d=\"M580 145 L718 262\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt21)\"/><\/svg>", "cap": "**황산 한 가지 가격이 제련소에는 이익(부산물 판매)으로, SX-EW 광산에는 원가(침출 원료)로 작용하여 같은 사건이 구리 공급을 두 방향으로 움직입니다.** 중국 황산 수출 중단(2026-05)과 러시아 황 통제·호르무즈 리스크가 겹치며, 마이너스 TC에도 제련소는 황산 수익으로 가동을 유지하고 콩고 등 습식 광산은 감산 압력을 받습니다. 황산 가격이 하락 전환하는 시점에 제련 감산이 가속된다는 점이 다음 체크포인트입니다."}, {"name": "구리 수요의 새 축과 미국 관세: 데이터센터·전력망·국방·비축", "pill": "2025.08~2026.09", "lede": "구리는 중국 건설경기의 선행지표('닥터 코퍼')에서 전력망·AI 데이터센터·전동화·안보와 연결된 전략 자산으로 재평가되었고, 미국 관세가 거래소 간 재고와 가격에 영향을 미치는 변수로 더해졌습니다.", "paras": ["데이터센터 1MW에 약 27톤의 구리가 들어가며(MS 시카고 81MW에 약 2,177톤), 글로벌 데이터센터 용량이 2024년 67GW에서 2030년 163GW로 늘면 누적 약 260만톤, 연 약 43만톤(2025년 전기동 생산의 약 1.8%)의 추가 수요가 발생합니다. 데이터센터 구리 수요는 연 50만톤에서 2040년 250만톤으로 늘 전망입니다. 특히 AI 학습·금융 데이터센터는 전력·냉각 경로를 완전히 이중화(Tier IV, 2N)하여 구리 집약도가 40톤/MW 이상으로 올라가고, 랙 전력밀도(7kW → 100kW 이상) 상승으로 두꺼운 버스바가 필수가 됩니다. 광통신(CPO) 대체 우려는 최대 21만톤(전체 수요의 0.5~0.7%)으로 미미합니다.", "전력망은 더 큰 축입니다. 글로벌 그리드 투자는 2025년 처음 4,700억달러를 넘었고(미국 약 1,150억), 중국 국가전력망공사는 2026~30년 약 4조 위안(직전 5개년 대비 +40%)을 투자합니다. 미국은 송전선의 70%가 25년 이상 노후되었고 지중 케이블은 km당 19.5~27톤의 구리를 사용합니다. 해상풍력은 MW당 4.9톤, 태양광 2.3톤, BESS 1.7톤이 필요하며, BEV는 대당 83kg 이상으로 내연기관(20~25kg)의 3~4배입니다. 대형 전력변압기 리드타임은 12~14개월에서 36~48개월(일부 5년)로 늘었습니다.", "국방·비축 수요는 가격 비탄력적입니다. 155mm 포탄 1발에 약 0.5kg의 구리가 들어가고 소화기 탄약 케이스는 황동(구리 70%)입니다. 미국 국방비축(NDS)은 국방 소요량의 약 40%만 충당 가능하고, 2026년 2월 발표된 Project Vault(EXIM 대출 100억달러+민간 20억달러, 60종 핵심광물 약 60일치)는 실물 매입 방식이어서 파생상품이 아닌 실제 수요를 만듭니다. 한국 조달청도 구리 포함 61일분 비축을 검토 중입니다.", "미국은 2025년 8월 232조로 구리 반제품·고함량 구리제품에 50% 관세를 부과하고 정광·전기동·스크랩은 제외했습니다. 상무부는 정련동에 2027년 15%, 2028년 30% 관세를 권고했으나 대통령은 2026년 6월 30일까지 재검토를 지시했고 8월 말까지 최종 결정이 나오지 않았습니다. 관세 기대로 COMEX 프리미엄이 형성되며 물량이 미국으로 이동하여 COMEX 재고는 급증하고 LME·SHFE 재고는 줄었으며, 2026년 3월 3대 거래소 합산 재고가 124만톤(23년 최고)인데도 가격이 오르는 이례적 현상이 나타났습니다. 관세가 확정되든 무산되든 재고 역류로 가격 변동성이 커질 수 있습니다."], "table": {"cols": ["수요처", "구리 원단위", "출처·비고"], "rows": [["AI 데이터센터", "약 27톤/MW(Tier IV 40톤/MW 이상)", "업계 추정·MS 시카고 사례"], ["해상풍력 / 태양광 / BESS", "4.9 / 2.3 / 1.7톤/MW", "S&P Global"], ["지중 송전 케이블", "19.5~27.0톤/km", "업계 정리"], ["BEV / PHEV / HEV / ICE", "83 이상 / 60 / 40 / 20~25kg/대", "GlobalData 등"], ["155mm 포탄", "약 0.5kg/발", "업계 추정"]]}, "bullets": ["2035년 글로벌 구리 수요 4,270만톤(현재 대비 +24%) 전망", "운송 부문 구리 수요 260만톤(2025) → 630만톤(2040)", "재생에너지 부문 향후 10년 추가 200만톤(WoodMac)", "미국 정련동 관세 확정 여부가 연말까지 COMEX-LME 스프레드의 핵심 변수", "한국산 황동봉 대미 수출 6월 누적 −60%(232조 파생품 관세)"], "kr": "LS전선(해저·HVDC·부스덕트), 대한전선(수주잔고 약 4조원), 대창(동 선재·황동봉), 풍산(신동), LS ELECTRIC(전력기기)이 이 수요 축에 연결됩니다. 전선사는 에스컬레이션으로 구리 원가를 전가하므로 잔고의 믹스가 본질입니다."}]}]}, {"h": "귀금속·희소금속 — 부산물이 핵심 변수로 부상", "note": "은 급등의 구조, 다금속 회수 플랫폼의 가치, 중국 수출통제의 진화.", "blocks": [{"t": "mods", "open": 0, "items": [{"name": "은(銀) 급등의 구조: 부산물 공급과 첨단 산업 수요", "pill": "2025.01~2026.06", "lede": "은은 2025년 161% 상승하여 2026년 1월 온스당 100달러를 돌파했는데, 투기만이 아니라 부산물 공급의 비탄력성·산업수요 60% 이상·중국 정련 병목이 겹친 결과라는 해석이 제시되었습니다.", "paras": ["은 공급의 약 60%는 구리·납·아연·금 광산의 부산물이어서, 주산물 생산이 늘지 않으면 은 가격이 올라도 공급이 늘지 않습니다. 광산 생산은 2016년 정점 이후 감소 중이고 2025~30년 연 0.9% 감소가 예상되며, 최대 생산국 멕시코는 광업권을 50년에서 30년으로 줄이고 노천광을 제한한 광업법 개정(2023)으로 연 2.9% 감소가 전망됩니다. 탐사부터 생산까지 10년 이상 걸려 고가격이 즉시 공급으로 이어지지 않습니다.", "수요는 산업용이 60%를 넘습니다. 태양광은 2026년 설치 665GW(IEA) 전망에 TOPCon·HJT 셀이 PERC보다 패널당 은을 20~50% 더 사용하며, 셀당 은 함량을 70% 이상 줄인 절감 기술(Thrifting)을 설치량 증가가 압도합니다. EV는 대당 25~50g으로 내연기관(15~28g)보다 많고, 은-탄소 복합층 전고체 배터리가 상용화되면 100kWh 팩당 약 1kg이 필요하다는 추정도 있습니다. 2021~25년 누적 8.2억온스 부족에 이어 2026년 이후 연 1.5~2억온스 부족이 예상됩니다(Metal Focus는 2026년 4,630만온스 부족).", "지정학이 가격을 분절시켰습니다. 중국은 광산 생산 비중은 12~13%에 불과하나 남미 정광을 수입해 고순도로 가공하는 정련을 장악했고, 2026년 1월 1일부터 수출 쿼터를 더 엄격한 허가제(허가 기업 44개사)로 변경했습니다. 그 결과 상하이금거래소(SGE) 실물가가 COMEX보다 온스당 10~11달러 높게 형성되었고, 미국은 정련 은의 80%를 수입하며 2025년 11월 은을 핵심광물로 지정했습니다.", "금융 억제는 가격을 꺾지 못했습니다. CME는 2025년 12월 세 차례 증거금을 계약당 2만에서 3.25만달러로 올리고 2026년 1월 13일 비례증거금 9%를 도입했지만, 리스 레이트 급등과 관세 우려로 실물 인도가 가속되었고 증거금 인상은 숏 포지션에도 부담을 주어 숏커버를 부를 수 있습니다. 1월 15일 미국의 핵심광물 관세 유예 발표로 하루 3% 급락했다가 회복한 사례처럼 정책 변동성은 큽니다. 한편 금은비율이 약 40(역사적 평균 70)까지 내려와 은의 상대적 고평가와 추가 급등 여력 제한을 지적하는 시각도 있습니다."], "table": {"cols": ["셀 기술", "PERC 대비 은 사용량", "비고"], "rows": [["PERC", "기준", "기존 주력"], ["TOPCon", "+20~50%", "차세대 고효율"], ["HJT", "+20~50%(최대)", "저온 은 페이스트"]]}, "bullets": ["은 전도성: 구리 대비 +5.8%, 금 대비 +39.4%", "SLV ETF 169일 연속 자금 유입(2026.01)", "2025년 은 산업용 수요 6.65억온스(YoY 감소, Silver Institute)", "은 광산주는 온스당 80달러 이상에서 수익성 급개선(판가−AISC)", "2Q26 미국-이란 전쟁 이후 귀금속 가격 조정"], "kr": "고려아연은 연 약 2,000톤(글로벌 공급의 약 5.7%)의 은을 판매하여 2025년 매출 비중에서 은(32.3%)이 아연(26.0%)을 넘어섰습니다. LS MnM도 LBMA 인증 정련소를 보유하고 있습니다. 은 가격 민감도와 1Q26 메탈게인의 일회성 여부가 제련사 이익 추정의 핵심입니다.", "svg": "<svg viewBox=\"0 0 960 320\" role=\"img\" aria-label=\"은 공급의 약 60%는 다른 금속의 부산물이라 가격이 올라도 늘지 않는데, 태양광·전장·투자 수요가 겹치며 온스당 100달러를 넘었다\"><defs><marker id=\"a-mt22\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"20\" y=\"50\" width=\"240\" height=\"70\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"140\" y=\"74\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">공급: 부산물 약 60%<\/text><text x=\"140\" y=\"90\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">구리·아연·납·금 광산<\/text><text x=\"140\" y=\"106\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">주금속 가격이 생산량 결정<\/text><rect x=\"20\" y=\"170\" width=\"240\" height=\"60\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--warn);fill-opacity:.12;stroke:var(--warn)\" stroke-width=\"1.4\"/><text x=\"140\" y=\"197\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">가격 비탄력 공급<\/text><text x=\"140\" y=\"213\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">중국 은 수출 허가제 전환<\/text><path d=\"M140 120 L140 168\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt22)\"/><rect x=\"340\" y=\"30\" width=\"220\" height=\"60\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"450\" y=\"57\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">태양광<\/text><text x=\"450\" y=\"73\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">TOPCon·HJT 은 +20~50%<\/text><path d=\"M560 60 L648 140\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt22)\"/><rect x=\"340\" y=\"110\" width=\"220\" height=\"60\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"450\" y=\"137\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">AI·EV 전장<\/text><text x=\"450\" y=\"153\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">전도율 1위 금속<\/text><path d=\"M560 140 L648 140\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt22)\"/><rect x=\"340\" y=\"190\" width=\"220\" height=\"60\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"450\" y=\"217\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">투자 수요<\/text><text x=\"450\" y=\"233\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">SLV 169일 연속 유입<\/text><path d=\"M560 220 L648 140\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt22)\"/><text x=\"450\" y=\"270\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">산업 수요 60% 이상<\/text><rect x=\"650\" y=\"100\" width=\"290\" height=\"80\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"795\" y=\"129\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">가격: 온스당 $100 돌파<\/text><text x=\"795\" y=\"145\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">2026-01 · 2025년 +161%<\/text><text x=\"795\" y=\"161\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">금은비율 약 40 (역사 평균 70)<\/text><path d=\"M260 200 L330 182 L600 180 L648 165\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-mt22)\"/><rect x=\"650\" y=\"220\" width=\"290\" height=\"60\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--ok);fill-opacity:.12;stroke:var(--ok)\" stroke-width=\"1.4\"/><text x=\"795\" y=\"247\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--ok)\">고려아연 은 판매 약 2,000t/년<\/text><text x=\"795\" y=\"263\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">글로벌 공급의 약 5.7%<\/text><path d=\"M795 180 L795 218\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt22)\"/><\/svg>", "cap": "**은은 공급의 약 60%가 다른 금속의 부산물이어서 가격이 올라도 공급이 늘지 않는 금속이며, 수요의 60% 이상이 산업용이어서 경기와 기술 채택에 동시에 반응합니다.** 태양광 셀 전환(TOPCon·HJT는 PERC 대비 은 +20~50%)과 투자 수요가 겹쳐 2026년 1월 온스당 100달러를 넘었고, 금은비율은 역사 평균 70에서 약 40으로 내려왔습니다. 제련 부산물로 은을 대량 생산하는 제련사의 이익 구조가 이 가격에 크게 노출됩니다."}, {"name": "부산물 희소금속과 '다금속 회수 플랫폼'의 가치", "pill": "2025.10~2026.08", "lede": "인듐·안티모니·비스무스·갈륨·게르마늄 같은 희소금속은 독립 광산이 아니라 아연·연·구리 제련의 부산물로만 생산되므로, 이를 회수하는 제련사는 핵심광물 공급망의 전략 거점이 됩니다.", "paras": ["희소금속은 지각 함량이 적어서가 아니라 추출·제련이 어렵거나 매장이 편중되어 공급망 리스크가 큰 금속을 정책적으로 묶은 개념입니다(한국 35종, 미국 60종, EU 34종 지정). 대부분 모금속 제련 부산물로만 회수되어 가격이 올라도 모금속 생산이 늘지 않으면 공급이 늘지 않습니다. 미국 USGS는 2025년 핵심광물 목록에 구리·은·납 등 전통 금속까지 포함시켜, 기준이 '희귀함'에서 '끊기면 산업이 흔들리는 금속'으로 넓어졌습니다.", "2025년 희소금속 가격 급등은 수요 급증이 아니라 중국 수출통제의 결과였습니다. 같은 해 비스무스 +270%, 안티모니 +144%, 게르마늄 +106%가 오른 반면 구리 +6%, 아연 +3%에 그쳐 산업금속과 경로가 갈렸습니다. 2026년 상반기 미국 창고의 게르마늄 등 가격은 중국 내수 대비 약 130% 프리미엄을 형성했고, 미국의 갈륨·인듐 수입의존도는 100%, 비스무스·안티모니는 92%·91%입니다.", "수요 측에서는 AI가 새로운 동력입니다. 게르마늄은 실리콘 포토닉스 광검출기(Ge-on-Si)에서 통신파장대 수광을 담당하여 대체가 불가능하고, 인듐인(InP) 기판은 1.6T 광모듈이 800G 대비 3배 이상 면적을 요구하여 'HBM 다음 병목'으로 불립니다. 갈륨은 800V DC 데이터센터 전력 아키텍처의 GaN 전력반도체, 텅스텐·몰리브덴은 3D NAND·로직 배선에 쓰입니다. 실리콘 포토닉스·CPO는 InP를 대체하는 것이 아니라 InP 광원을 전제로 한 보완 플랫폼이므로 확산될수록 InP 수요도 늘어납니다.", "제련사 입장에서는 부산물 회수가 이익을 TC 등락에서 분리시키는 별도 이익 축입니다. 고려아연은 Fumer 설비로 부산물을 기화시켜 금속별 응고 온도 차이로 회수하는데, 3Q25 희소금속 매출 1,270억원(GPM 84%)이 별도 매출총이익의 약 36%를 차지했고 안티모니 수율은 약 70%에서 90%로 상승했습니다. 희소금속 GPM은 1Q24 43% → 2025년 80%대 → 1Q26 74.3%(안티모니 가격 약세)로 변동했고, 매출 비중 1.9%로 매출총이익의 7.4%를 창출합니다. 시장은 이를 희토류 퓨어플레이도 일반 제련사도 아닌 '다금속 회수 플랫폼'으로 규정하며 SOTP 분리 평가의 근거로 삼습니다."], "table": {"cols": ["금속", "주요 용도", "회수 출처", "중국 공급 비중", "美 수입의존도"], "rows": [["안티모니", "난연재 49%, 납축전지·탄약 40%", "연 정광·폐납축전지", "약 36%(광산)", "91%"], ["인듐", "ITO·디스플레이, InP·반도체", "아연(섬아연석) 부산물", "약 70%(정련)", "100%"], ["비스무스", "화학·의약·무독성 납 대체", "연·아연 제련 부산물", "약 82~88%(정련)", "92%"], ["갈륨", "화합물반도체(IC 73%, 광전자 26%)", "보크사이트·아연 부산물", "약 99%(저순도 1차)", "100%"], ["게르마늄", "광섬유, 적외선 광학, 반도체", "아연·연-아연-동 황화광 부산물", "약 53%(정련)", "50% 초과"]]}, "bullets": ["2025년 글로벌 생산(추정): 갈륨 900톤, 게르마늄 145톤, 인듐 1,100톤, 탄탈럼 2,500톤", "Teck Trail(캐나다) Ge·Sb·Ga 증설에 캐나다 정부 최대 4억 캐나다달러 지원", "Alcoa Wagerup 갈륨 연 100톤(세계 수요 약 10%), 호주 정부 최대 2억달러, 2026.07 FID", "국내 첨단산업 희소금속 31종 중 16종이 중국 수입 의존(2024)", "리스크: 모금속 수요 정체 시 부산물 공급도 정체"], "kr": "고려아연(게르마늄 1,400억원·갈륨 557억원 투자, 2028년 정상가동 목표, 록히드마틴 게르마늄 장기공급 MOU)과 LS MnM(게르마늄)이 국내 대표 회수 거점입니다. 비중국 공급 확대 속도가 '탈중국 프리미엄'의 지속 기간을 결정합니다."}, {"name": "중국 수출통제의 진화: 쿼터에서 허가제, 흐름(Flow)에서 축적(Stock)으로", "pill": "2010.09~2026.09", "lede": "중국의 자원 통제는 물량을 조절하는 가역적 수단에서 장비·기술·인력까지 제한하는 비가역적 수단으로 진화하고 있어, 유예 합의가 나와도 공급망 재편 수요는 지속됩니다.", "paras": ["중국은 2007년 수출쿼터 라이선스를 도입했고, 2010년 9월 센카쿠 분쟁 때 대일 희토류 통관을 사실상 중단하여 사흘 만에 선장 석방을 이끌어내며 자원을 처음으로 지정학적 수단으로 활용했습니다. 당시 희토류 가격은 6~28배(네오디뮴 톤당 1.5만 → 25만달러) 급등했습니다. 이후 WTO 패소(2014, 2016)로 쿼터·수출세를 폐지하고 허가제로 전환하면서 통제의 무게중심이 국경에서 국내(쿼터·국유기업 통합)로 이동했습니다.", "2020년 수출통제법 제정으로 명분이 '자원 보전'에서 '국가안보'로 바뀌었습니다. 이후 2023년 7월 갈륨·게르마늄, 10월 흑연, 2024년 8월 안티모니·초경질 재료, 12월 갈륨·게르마늄·안티모니 대미 수출 금지, 2025년 2월 텅스텐·텔루륨·비스무스·몰리브덴·인듐, 4월 희토류 7종(Sm·Gd·Tb·Dy·Lu·Sc·Y)과 자석, 10월 5종(Ho·Er·Tm·Eu·Yb) 추가로 12종 확대가 이어졌습니다. 2025년 4월 조치 직후 5월 자석 수출이 급감하여 Ford 시카고 공장 등 미국·유럽·일본 완성차 라인이 중단되었고, 글로벌 완성차 생산 차질까지 약 2개월이 소요되었습니다.", "2025년 10월 9일 조치는 질적으로 달랐습니다. 중국산 희토류가 0.1% 이상 포함되거나 중국 원천기술을 사용한 해외 제품에도 허가를 요구하는 역외적용(미국 FDPR과 유사)과 함께, 제련·분리 장비, 자석 제조 기술, 공정 파라미터·시뮬레이션 데이터, 해외 생산을 지원하는 중국 인력까지 통제 대상에 포함했습니다. 물량 통제는 해제하면 즉시 회복되지만(가역적) 기술·역량 통제는 시간이 갈수록 격차가 누적된다(비가역적)는 점에서 구조적으로 다른 위협입니다.", "2025년 11월 미중 정상 합의(펜타닐 관세 10%p 인하 ↔ 희토류 통제 1년 유예)로 일부 조치가 정지되었으나, 허가제와 군사용도 금지는 유지되고 12월부터 군사용 희토류 수출신청은 전면 거부되었습니다. 2026년 1월에는 대일 희토류 수출 추가 규제가 나왔고, 대미 갈륨·게르마늄·안티모니 금수 유예와 희토류 통제 유예는 2026년 11월 종료 예정입니다. 업계는 통제가 협상 카드로 반복 가능하다는 점 자체가 공급망 재편 수요를 영구화한다고 평가합니다."], "table": {"cols": ["시점", "조치"], "rows": [["2010.09", "센카쿠 분쟁 중 대일 희토류 통관 중단(첫 무기화)"], ["2014·2016", "WTO 패소 → 쿼터·수출세 폐지, 허가제 전환"], ["2020.10", "수출통제법 제정(명분: 자원 → 안보)"], ["2023.07", "갈륨·게르마늄 수출통제"], ["2023.10", "흑연 수출통제"], ["2024.08", "안티모니·초경질 재료"], ["2024.12", "갈륨·게르마늄·안티모니 대미 수출 금지"], ["2025.02", "텅스텐·텔루륨·비스무스·몰리브덴·인듐 수출허가"], ["2025.04", "중희토류 7종(Sm·Gd·Tb·Dy·Lu·Sc·Y)·자석 수출허가"], ["2025.10", "Ho·Er·Tm·Eu·Yb 추가 12종, 역외적용·장비·기술·인력 통제"], ["2025.11", "미중 합의로 일부 1년 유예(허가제·군사용도 금지 유지)"], ["2026.01", "은 수출 허가제 전환, 대일 희토류 추가 규제"], ["2026.11", "대미 금수·희토류 통제 유예 종료 예정"]]}, "bullets": ["IEA: 전면 통제 시 비중국 하류산업 연 매출 위험 약 6.5조달러(미국·유럽 각 1.5조달러 이상)", "중국 희토류 자석 국가 추적 시스템(2024~25)으로 최종 용도 실시간 파악", "중국 수출금지·제한 기술목록에 희토류 추출·분리·자석 제조기술 추가", "자원보유국 확산: 인니 니켈(2014), 짐바브웨 리튬, 콩고 코발트, 남아공 크롬, 가봉 망간(2029 예고)", "2026년 9월 미중 계열사 확장 규칙 유예 종료 예정(역외통제 재개 가능)"], "kr": "국내 자석·반도체·배터리 소재 기업의 원료 조달처 중 중국산 비중과 수출허가 취득 현황은 실사에서 반드시 확인해야 할 항목입니다. 비중국 회수·정제 역량(고려아연, 포스코인터내셔널, LS에코에너지)의 전략 가치가 커지는 배경입니다."}]}]}, {"h": "희토류·자석 — 병목은 정제, 해법은 정부", "note": "희토류 밸류체인의 병목, 미국식 국가자본주의 모델, EV에서 로봇·방산으로 확대되는 수요.", "blocks": [{"t": "mods", "open": 0, "items": [{"name": "희토류 밸류체인: 병목은 채굴이 아니라 분리·정제와 자석", "pill": "2025.10~2026.07", "lede": "중국의 희토류 지배력은 채굴(약 60%)보다 분리·정제(91%)와 영구자석(94%) 단계로 갈수록 견고해지며, 그 원천은 매장량이 아니라 수십 년의 용매추출 운전 경험과 사회화된 환경비용입니다.", "paras": ["희토류는 란탄족 15개 원소와 스칸듐·이트륨을 합친 17개 원소로, 4f 전자의 강한 스핀-궤도 결합 덕분에 0.1~1%만 첨가해도 자석·광학·촉매 특성을 크게 변화시킵니다. 매장량 자체는 적지 않으나(세계 약 1.2~1.3억톤, 중국 48.4%) 란탄족 수축으로 원소 간 화학적 성질이 거의 같아 분리가 극도로 어렵습니다. 경희토류(La~Eu)는 부존량이 많고, 중희토류(Gd~Lu, Y)는 희소하고 분리가 어려워 훨씬 고가입니다.", "분리는 산에 녹인 희토류 용액을 P507 등 추출제가 든 유기상과 섞어 원소별로 조금씩 나누는 용매추출(SX)을 수십~수백 단 연결하여 이루어집니다. 경희토류는 10~20단이면 되지만 중희토류는 100~200단 이상이 필요합니다. 추출제와 산은 표준화되어 누구나 구할 수 있으나, 중국은 30년 넘게 100개 이상의 SX 라인을 산업 규모로 운전하며 회수율 99.5%(서방 95~97%), 고농도 원료 투입(250~300g/L vs 100~150g/L), 산 소비 60% 절감 등 운전 노하우를 축적했습니다.", "환경비용도 결정적입니다. 희토류 1톤 생산 시 폐가스 약 9,600~12,000㎥(황산 포함 독성가스 약 6만㎥라는 추정도 있음), 산성폐수 75㎥~20만L, 토륨 등 방사성 잔류물 약 1톤이 발생합니다. 1980년대 이후 선진국이 환경 문제로 제련시설을 폐쇄하는 동안 중국은 이 비용과 주민 반발을 국가가 부담했고, 호주·캐나다는 폐기물 처리비가 총원가의 20~25%에 이릅니다. 미국 Mountain Pass가 2002년 폐광한 이유도 중국 바이윈어보의 저가 공세와 환경 정화 비용이었습니다.", "따라서 탈중국의 핵심은 광산이 아니라 미드스트림과 다운스트림입니다. 서방이 광산을 늘려도 분리·금속화·합금·분말·소결·가공·코팅·고객인증까지 다단 공정이 이어지지 않으면 시장이 사용할 수 있는 '유효 공급'은 늘지 않습니다. 중국 외 중희토류 정제 비용은 2029년에도 중국의 5~7배로 추정되고, 서방의 중희토류 대중 의존도는 2024년 99%에서 2030년에도 91%로 예상됩니다(CRU)."], "table": {"cols": ["단계", "중국 점유율", "주요 비중국 대안"], "rows": [["매장", "48.4%", "베트남·브라질·러시아·호주"], ["채굴", "58~70%(연도·출처별 차이)", "미국 Mountain Pass(약 11.5~16%), 호주 Mt Weld, 미얀마 12%"], ["분리·정제", "89~91%(중희토류 98~99%)", "말레이시아 Lynas(7%), 프랑스 Solvay(약 1%)"], ["금속·자성합금", "90~92%", "일본 7%, 베트남"], ["영구자석", "94%", "일본 Shin-Etsu, MP Materials(1,000톤), 에스토니아 Neo"]]}, "bullets": ["중국 희토류 특허 약 4,000여 건(미·일의 약 8배)", "NdPr 손익분기: 중국 약 $50/kg vs 해외 설비 1/4은 $100/kg 이상", "북방희토 대비 Lynas 산화물 원가 25~35% 높음", "중국 쿼터 증가율: 2021~23 +20%대 → 2024 +4~6% → 2025 비공개", "원료가 아닌 제품 전략: LREE 산화물 수출은 두고 HREE·자석 완제품으로 통제"], "kr": "한국은 희토류~영구자석 공급망이 사실상 전무하여, 정제는 해외에 두고 자석만 국내에서 만드는 일본식 분업과 동맹 기반 조달이 현실적 경로로 제시됩니다. 제이에스링크·성림첨단산업(자석), LS에코에너지(금속화), 포스코인터내셔널(원료·분리정제), 고려아연(폐자석 리사이클)이 각 단계에 포진해 있습니다."}, {"name": "미국식 국가자본주의: MP Materials 모델과 서방 공급망 재건", "pill": "2025.07~2026.07", "lede": "미국은 희토류를 국가안보 문제로 격상하고 지분투자·가격하한·전량구매·저리대출을 결합한 패키지로 민간 투자의 가격 리스크를 정부가 흡수하는 모델을 구축했습니다.", "paras": ["트럼프 2기 통상정책은 무역적자 해소보다 경제안보(재산업화, 대중 절연)를 목표로 하며, 정부가 인텔·MP Materials·Lithium Americas(DOE 5%)·Trilogy Metals(10%+워런트) 등 개별 기업 지분을 직접 취득하는 '미국식 국가자본주의'로 전환하고 있습니다. 법적 근거는 1950년 국방물자생산법(DPA), 국방수권법(NDAA), IRA 45X(제조원가 10% 세액공제), 그리고 2025년 7월 OBBBA의 국방부 핵심광물 자금(직접 75억달러: 비축 20억+산업기반기금 50억+신용 5억)입니다.", "상징적 사례는 2025년 7월 미 국방부(전쟁부)-MP Materials 계약입니다. 4억달러 전환우선주(지분 최대 약 15%), 1.5억달러 중희토류 분리 대출, NdPr 가격하한 $110/kg(10년, 당시 시장가 약 $57), 10X 자석공장 10년 100% 오프테이크와 최소 EBITDA 1.4억달러 보장을 묶었습니다. 시장가가 하한을 넘으면 초과분의 30%를 국방부가 환수합니다. MP는 2025년 순이익 흑자로 전환했고 Apple(5억달러, 선급금 2억달러)·GM과 상업 공급계약도 체결했으며, 자석 생산능력을 1,000톤에서 2028~29년 1만톤으로 늘릴 계획입니다.", "이 모델은 확장 중입니다. Lynas USA는 텍사스 Seadrift 중희토류 분리시설(비용환급 약 2.58억달러, 환경허가 이슈로 협상)과 NdPr $110 하한이 적용된 약 96백만달러 산화물 공급 LOI를, USA Rare Earth는 상무부 CHIPS로부터 최대 15.8억달러(보조금 2.77억+대출 13억달러, 정부지분 8~16%) LOI를 받았습니다. G7은 2026년 1월 희토류 가격하한 시장개입을 공식화했고, 2026년 2월 55개국이 참여하는 FORGE(기존 MSP 재출범)는 동맹국 참조가격과 덤핑물량 조정관세를 도입합니다. 2026년 2월 Project Vault는 핵심광물 60일치 비축을 민관 계약형으로 추진합니다.", "한계도 뚜렷합니다. Mountain Pass 정광은 NdPr이 15.7%이나 중희토류는 1.8%(그중 Dy/Tb 4%)에 불과하여 고등급 자석용 Dy·Tb를 외부에서 조달해야 하고, MP의 NdPr 산화물 생산은 2025년 3분기에도 풀가동(분기 약 1,500톤)에 못 미쳤습니다. Energy Fuels의 Dy 산화물 파일럿 생산은 약 29kg(2025)에 그쳤습니다. 결국 서방은 채굴 대비 분리·정제·자석 역량이 절대적으로 부족하여 완전한 자립까지 다년이 소요되며, 정권 교체 시 정책 지속성이 최대 리스크입니다."], "table": {"cols": ["기업/프로젝트", "지원 내용", "진행"], "rows": [["MP Materials(Mountain Pass·10X)", "우선주 4억$, 대출 1.5억$, NdPr $110 하한, 10년 오프테이크, 최소 EBITDA 1.4억$", "2025 흑자전환, 자석 1만톤 2028~29"], ["Lynas USA(Seadrift, 텍사스)", "비용환급 약 2.58억$, 산화물 LOI 약 96백만$(하한 $110)", "HRE 분리 Phase1 진행, 환경허가 협상"], ["USA Rare Earth(Round Top·오클라호마 자석)", "CHIPS 최대 15.8억$ LOI, 정부지분 8~16%", "자석 1,200톤 → 4,800~5,000톤 계획, Serra Verde 약 28억$ 인수"], ["Critical Metals(그린란드 Tanbreez)", "EXIM 대출 자격, 지분 인수 논의", "중희토류 비중 약 30%"], ["Project Vault", "EXIM 100억$ + 민간 20억$", "60종 핵심광물 60일치 비축(2026.02 발표)"]]}, "bullets": ["MP Materials 1Q26 NdPr 생산 917톤(+63%)·판매 1,006톤(+117%)", "MP 정광은 과거 중국 Shenghe에 판매하다 2025년 7월 중단", "EU CRMA: 2030년 역내 채굴 10%·가공 40%·재활용 25%·단일국 의존 65% 이하", "일본은 2010년 이후 JOGMEC·소지쯔가 Lynas에 2.5억달러 투자해 대중 의존도 90% → 60%대", "밸류에이션: MP EV/EBITDA 58배, PSR 약 40배 — 정책이 보강한 현금흐름 하단의 옵션가치"], "kr": "포스코인터내셔널은 미국 ReElement와 연 6,000톤 분리정제 공장(2027년 4분기 시범생산, 2028 양산)을 추진하고 북미·유럽 완성차와 비중국 원료 영구자석 장기계약(약 9,000억원·2,600억원)을 체결했습니다. 한미 핵심광물 협력 프레임워크(2026.04)가 국내 기업의 미국 가치사슬 편입 통로입니다."}, {"name": "희토류 수요의 2차 파도: EV에서 로봇·방산으로", "pill": "2025.12~2026.05", "lede": "희토류 수요는 EV·풍력의 설치기반 위에, 관절마다 모터가 탑재되는 로봇과 대체 불가능한 방산·우주 용도가 더해지며 경기보다 기술 보급률에 민감한 구조로 바뀌고 있습니다.", "paras": ["희토류 시장은 중량이 아닌 가치 기준으로 영구자석(NdFeB) 비중이 압도적입니다. 2024년 세계 희토류 수요는 약 9만톤(IEA), EV 모터용은 37kt(+32%)에서 2025년 43kt로 늘었고 EV 1대 구동모터에 NdFeB 약 1~2kg이 들어갑니다. 2025년 세계 전기차 판매는 2,000만대를 넘어 신차의 23.5%를 차지했습니다. 고온 EV 모터용 자석에는 Dy·Tb가 8~12% 첨가되며, 이 두 원소가 자석 원가의 30~50%를 차지합니다.", "로봇은 EV의 연장이 아니라 '모터 개수'가 늘어나는 시장입니다. EV는 대당 구동모터 중심이지만 로봇은 관절 수만큼 액추에이터가 분산 탑재됩니다. Tesla Optimus는 액추에이터 28개(회전 14, 선형 14)에 NdFeB 약 3.5kg이 들어갈 것으로 추정되고, 휴머노이드 1억대 보급 시 NdPr 수요가 10~20만톤이라는 추정도 있습니다. 휴머노이드는 이미 연간 50만대 설치·가동 400만대 이상인 산업용 로봇 설치기반 위에 더해지는 새로운 폼팩터이며, 부품원가 40% 절감 시 2035년 140만대·380억달러 시장이 제시되었습니다.", "특히 로봇 손가락은 희토류 대체가 어렵습니다. 어깨·팔꿈치 모터(10~50cm)는 페라이트로 설계 대체가 가능하지만, 손가락 관절의 지름 5~10mm 마이크로 모터는 고토크·저중량을 동시에 만족하는 NdFeB가 사실상 유일합니다. 장시간 작동 시 열이 누적되어 효율이 10~20% 떨어지고 탈자 위험이 생기는데, Dy 1~5% 첨가로 보자력이 2~3배 강화되어 휴머노이드 희토류 수요 중 Dy 비중이 20~30%에 이릅니다.", "방산·우주에서는 특정 원소에 묶인 영역이 많습니다. 미사일 핀 구동기는 유압에서 희토류 자석 전기기계식 액추에이터(EMA)로 전환되었고, F-35 1대에 희토류 약 417kg이 들어갑니다. 군용 고출력 레이저의 95%가 Yb 파이버 레이저인데 Yb 산화물의 99%가 중국산이며 ASML EUV 광원 펌프 레이저도 Yb에 의존합니다. 위성 간 광통신은 Er 도핑 증폭기(EDFA), AESA 레이더 T/R 모듈은 Y·Gd·Sm·Nd·Dy를 사용하고, SmCo 자석(퀴리온도 700~850℃)은 미사일·항공엔진·소나에 쓰입니다. 중국이 2025년 통제한 12개 원소는 대부분 이 무기체계 소재와 겹칩니다."], "table": {"cols": ["항목", "Dy", "Tb", "Sm(SmCo)"], "rows": [["스핀-궤도 결합", "매우 강함", "가장 강함", "-"], ["첨가 효과", "보자력·고온 자화 유지", "Dy보다 강한 자화방향 고정", "퀴리온도 약 700~850℃로 상승"], ["실무 용도", "일반 NdFeB 보자력 강화", "고온·고이방성 고급 자석", "방산·항공 고온 자석"], ["단점", "자화세기 감소", "희귀·고가(Nd의 약 20배)", "가공성·가격 불리"]]}, "bullets": ["SH등급 자석 1톤에 Dy 약 42kg 필요(추정)", "Dy·Tb 저감(입계확산·HDDR)과 재활용 확대는 중희토류 프리미엄 완화 요인", "희토류 가격 급등 시 페라이트 부분 대체 확대(완전 대체는 어려움)", "휴머노이드 상업화 지연 시 2차 수요 파동 시점도 지연", "중국 Sanhua가 Optimus 선형 액추에이터 약 70% 공급 예상"], "kr": "국내 로봇·액추에이터·방산 업체(한화시스템 레이저 대공무기 '천광', 현대로템 UGV)의 자석·희토류 조달 안정성이 원가와 양산 일정의 핵심 변수입니다. 페라이트 대체 수혜 영역에는 유니온머티리얼·삼화전자가 있습니다."}]}]}, {"h": "리튬·특수합금·강관 — 사이클 바닥과 공급자 우위", "note": "리튬 가격 바닥 통과, 특수합금의 공급자 우위, 에너지강관과 호르무즈.", "blocks": [{"t": "mods", "open": 0, "items": [{"name": "리튬 바닥 통과: 공급 쇼크·정책 전환·ESS 수요", "pill": "2025.06~2026.09", "lede": "리튬은 2025년 6월 톤당 약 8,100달러에서 바닥을 형성한 뒤 중국의 자원안보 정책 전환, 자원국 수출통제, ESS 수요 급증으로 약 3배 반등했으며, 시장은 단기 박스권 후 2027년 구조적 공급부족 진입 가능성을 제시합니다.", "paras": ["금속가격은 ①초과수요 ②신규 공급 증가 ③초과공급(고원가 업체 파산) ④초과공급 해소의 4단계로 순환하며 저점은 현금원가 수준에서 형성됩니다. 리튬은 2023~25년 남미 저비용 공급 확대로 초과공급 국면을 겪었고, 2024~1H25 톤당 약 1만달러 안팎에서 장기한계비용(LRMC 약 $12,000)을 밑돌며 바닥을 다졌습니다. 2025년 하반기부터 중국 재고 급감, CATL 젠샤워 광산 중단 장기화, 정책 변화가 트리거로 작용했습니다.", "공급 측 쇼크는 중국과 아프리카에서 동시에 나왔습니다. CATL 젠샤워 광산(세계 생산의 약 3%)은 2025년 8월 조업허가 만료로 중단되었고 2026년 6월 허가를 받았으나 환경영향평가 미완료로 미가동 상태입니다. 이춘시 광산 생산 중단 규모는 연 28만톤(중국 전체의 12~15%)으로 거론되고, 2024년 11월 개정·2025년 7월 시행된 광물자원법은 리튬을 전략광물로 지정하고 승인권을 자연자원부로 일원화했습니다. 짐바브웨(글로벌 공급의 약 7~10%)는 2026년 2월 원광·정광 수출을 무기한 중단했다가 4월 쿼터제(정광 수출세 10%)로 완화했고 2027년 1월 정광 수출 전면 금지를 예고했습니다.", "수요는 EV에서 ESS로 무게가 옮겨갔습니다. 중국은 2025년 6월 신설 신재생 발전소의 전력 판매를 고정가격에서 시장가격으로 전환하여 저장 후 고가 판매의 차익 유인을 만들었고, ESS 저장용량 목표를 2027년 180GW로 제시했습니다. 글로벌 ESS 출하는 2025년 315GWh에서 2026년 450~750GWh로 늘 전망이며 BNEF는 6개월 만에 2026년 ESS 설치 전망을 360GWh에서 459GWh로 상향했습니다. 여기에 배터리 수출 증치세 환급 축소(2026.04 9% → 6%, 2027.01 폐지)를 앞둔 선구매가 2026년 1월 탄산리튬 선물을 9% 끌어올렸습니다.", "기관별 전망의 괴리가 크다는 점에 유의해야 합니다. IEA는 보수적 시나리오에서도 2030년 리튬 수요(Li 기준)가 53.1만톤으로 2024년 대비 159% 늘고 평균 규모 광산 55곳이 추가로 필요하다고 보지만, LCE 기준 2030년 수요는 Albemarle 280만~360만톤, BMI 355만톤, BNEF 300만톤 등으로 편차가 큽니다. 공급 측에서도 BMI의 2030년 증분 211만톤 중 점토리튬·DLE·국유화 분쟁 등 고위험 프로젝트가 많아 20% 이상이 실현되지 않을 수 있다는 분석이 제시되었습니다. 탄산리튬은 5월 중순 19.2만위안(+198% YoY) 이후 6월말 16만위안, 9월 수산화리튬 약 $18,000~20,000로 조정되었습니다."], "table": {"cols": ["기관", "기준연도 수요", "2030년 전망"], "rows": [["IEA(Li 기준, 보수적)", "20.5만톤(2024)", "53.1만톤"], ["Albemarle(LCE)", "160만톤(2025)", "280만~360만톤"], ["BMI(LCE)", "158만톤(2025)", "355만톤"], ["Lithium Harvest(LCE)", "110만톤(2024)", "300만~370만톤"], ["BNEF(LCE)", "120만톤(2024)", "300만톤"]]}, "bullets": ["탄산리튬 $8,100(2025.06) → $23,000(2026.01), 스포듀민 스폿 600 → 2,500호주달러(+316%)", "짐바브웨 2027년 공급차질 시나리오: Bull 6~9만톤, Base 3~6만톤, Bear 1~3만톤 LCE", "2025년 글로벌 리튬 수요 146만톤 LCE(+23%), ESS +60%", "나트륨이온배터리(CATL·BYD 양산)는 대형 ESS·저가 EV에서 잠재 대체재", "리스크: CATL 광산 조기 재가동·짐바브웨 쿼터 유지 시 가격 조정"], "kr": "POSCO홀딩스는 아르헨티나 염호(1공장 2.5만톤, 2026.03 첫 월간 흑자, 2공장 2026.10 준공), 광양 수산화리튬 4.3만톤, MinRes 중간지주 30%(연 27만톤 정광 오프테이크)로 염수·광석·DLE 3원화 전략을 추진하며, 리튬 캐파를 9.3만톤에서 2033년 17.3만톤으로 늘릴 계획입니다."}, {"name": "특수합금: 공급자 우위 시장과 적층제조(AM)의 개화", "pill": "2025.10~2026.09", "lede": "항공엔진·가스터빈·우주 발사체 수요가 동시에 늘지만 청정용해 설비와 인증 장벽 때문에 공급이 따라가지 못해, 특수합금은 철강 업종 안에서 가장 높은 멀티플을 받는 고수익 니치로 자리잡았습니다.", "paras": ["초합금은 니켈·티타늄·코발트·철 기반으로 초고온·고압에서 크리프(고온 장시간 하중에 의한 영구 변형)와 산화를 견디는 소재입니다. 글로벌 시장은 2021년 45.3만톤에서 2031년 98.9만톤(CAGR +8.3%, GMI)으로 성장이 전망되며 수요의 52%가 항공우주, 27%가 산업용 가스터빈이고, 지역별로는 북미가 41%입니다. 미국이 세계 특수합금 수요의 약 40%를 차지합니다.", "공급 제약은 진입장벽에서 비롯됩니다. VIM → VAR 또는 VIM → ESR → VAR 같은 청정용해 설비가 필요하고, 공장 건설에 18~36개월, 가스터빈 Hot Section·엔진 회전체 인증에 24~48개월이 추가로 소요됩니다. 그 결과 Carpenter의 제트엔진 리드타임은 2024~25년 60~65주 이상으로 고착되었고 ATI의 엔진 Hot Section 디스크 리드타임도 1년 이상입니다. 2020~25년 Carpenter SAO 영업이익과 ATI HPMC EBITDA는 매출 성장(13%·16%)을 크게 웃도는 연 67%·35%로 늘었고 항공우주·방산 매출 비중은 60%대로 높아졌습니다.", "수요는 세 갈래입니다. 항공은 운항 여객기 2.47만대에 2044년까지 신규 인도 4.3만대(Airbus)가 전망되고, LEAP·GTF 차세대 엔진은 특수합금 사용량이 2배 이상이며 엔진 애프터마켓 수요는 역사적 평균의 2배 속도입니다. 가스터빈은 AI 데이터센터 전력 공백을 메우는 LNG 복합발전 수요로 Siemens Energy 수주잔고가 1,579억달러(사상 최대)로 늘었고 8월 14GW 주문의 60%가 데이터센터향이었습니다. 우주는 미국 FAA 상업 우주 운항이 FY2015 14건에서 FY2025 204건으로 늘었습니다.", "성장의 새로운 축은 적층제조(AM)입니다. 금속 AM 분말 수요는 2020년 4,650톤에서 2025년 17,770톤으로 연 31% 늘었고, 니켈계 초내열 분말합금 수요는 2020년 1,030톤에서 2030년 4,095톤(연 23%)으로 전망됩니다. 절삭가공은 1kg 부품에 약 20kg의 소재가 필요하지만 AM은 약 1.2kg이면 되어, 분말 가격이 밀프로덕트의 2배여도 원재료비가 약 88% 절감됩니다. GE Aerospace LEAP 연료노즐 팁은 20개 부품을 1개로 통합하여 무게 −25%, 내구성 5배, 제조비용 −30%를 달성했고, MRO에서는 DED 공법으로 손상 부위만 복원하는 재생수리가 상용화되었습니다."], "table": {"cols": ["기업", "지표", "수치", "시점"], "rows": [["Carpenter(SAO)", "Surcharge 제외 영업이익률 / EBITDA 마진", "30.5% / 36.0%", "FY4Q25"], ["ATI(HPMC)", "EBITDA 마진 / 수주잔고", "23.7% / 41억달러(사상 최대)", "2Q25 / 1Q26"], ["세아베스틸지주", "특수합금 생산능력(국내+미국 SST)", "4,000 + 6,000 = 10,000톤", "2026"], ["에이치브이엠", "생산능력(1공장 → 서산 2공장 포함)", "2,400 → 15,600톤", "2025 증설 중"], ["스피어", "SpaceX 장기공급계약", "10.5억달러(2025.07~2035.12)", "공시"]]}, "bullets": ["업종 내 멀티플 서열: 철강(EV/EBITDA 약 6.5배) < 신동(8.7배)·리튬 < 특수합금(약 25.3배)", "니켈 50% 이상 특수합금 대미 상호관세 15%(가격 전가 가능)", "CMC(세라믹 복합재)는 무게 1/3·내열 20% 우수한 보완재지만 전면 대체는 어려움", "리스크: 항공기 제조 병목·파업, 신규 공장 인증·수율 지연, 소수 고객 의존", "Boeing 월 38대 제한(42대 가능성), Airbus 2027년 월 75대 목표"], "kr": "세아베스틸지주의 SST(텍사스 Temple, 2026년 6월 준공, 모합금 46종·분말합금 14종, 2027년 상업생산 목표)와 세아항공방산소재(1Q26 OPM 20%), 에이치브이엠, 스피어, 태웅(대형단조)이 국내 노출 기업입니다. 특수합금 기업 IPO에서는 인증(NADCAP·고객 품질인증) 완료 여부와 초기 수율이 멀티플의 전제입니다.", "svg": "<svg viewBox=\"0 0 920 300\" role=\"img\" aria-label=\"절삭가공은 부품 1kg에 소재 20kg을 쓰지만 적층제조는 1.2kg이면 돼, 분말 가격이 2배여도 원재료비가 약 88% 줄어든다\"><defs><marker id=\"a-mt23\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><text x=\"20\" y=\"86\" font-size=\"13\" text-anchor=\"start\" font-weight=\"600\">절삭가공<\/text><rect x=\"150\" y=\"50\" width=\"170\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"235\" y=\"79\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">소재 20kg<\/text><text x=\"235\" y=\"95\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">밀프로덕트 단가 ×1<\/text><path d=\"M320 82 L358 82\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt23)\"/><rect x=\"360\" y=\"50\" width=\"170\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"445\" y=\"79\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">단조·절삭<\/text><text x=\"445\" y=\"95\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">칩 19kg 발생<\/text><path d=\"M530 82 L568 82\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt23)\"/><rect x=\"570\" y=\"50\" width=\"170\" height=\"64\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"655\" y=\"79\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">부품 1kg<\/text><text x=\"655\" y=\"95\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">원재료비 20<\/text><text x=\"20\" y=\"206\" font-size=\"13\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--accent)\">적층제조<\/text><rect x=\"150\" y=\"170\" width=\"170\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"235\" y=\"199\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">분말 1.2kg<\/text><text x=\"235\" y=\"215\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">분말 단가 ×2<\/text><path d=\"M320 202 L358 202\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt23)\"/><rect x=\"360\" y=\"170\" width=\"170\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"445\" y=\"199\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">3D 프린팅<\/text><text x=\"445\" y=\"215\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">근정형 성형<\/text><path d=\"M530 202 L568 202\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt23)\"/><rect x=\"570\" y=\"170\" width=\"170\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"655\" y=\"199\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">부품 1kg<\/text><text x=\"655\" y=\"215\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">원재료비 2.4<\/text><rect x=\"770\" y=\"100\" width=\"140\" height=\"84\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--ok);fill-opacity:.12;stroke:var(--ok)\" stroke-width=\"1.4\"/><text x=\"840\" y=\"131\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--ok)\">약 88% 절감<\/text><text x=\"840\" y=\"147\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">(2.4 vs 20)<\/text><text x=\"840\" y=\"163\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">투입 대비 부품 비율<\/text><path d=\"M740 82 L768 130\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt23)\"/><path d=\"M740 202 L768 160\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt23)\"/><text x=\"460\" y=\"280\" font-size=\"12\" text-anchor=\"middle\">원재료비 = 투입 소재량 × 소재 단가 (밀프로덕트 단가 = 1 기준, 예시)<\/text><\/svg>", "cap": "**적층제조는 분말이 밀프로덕트보다 2배 비싸도 부품 1kg당 투입 소재를 20kg에서 1.2kg으로 줄여 원재료비를 약 88% 낮춥니다.** 로켓·항공엔진 부품에서 분말 합금 수요가 발생하는 이유이며, 분무·분말 역량을 가진 소재사가 인증을 통과하면 가격결정력이 생깁니다. 판가는 Base + Surcharge이므로 니켈 가격 변동은 고객에게 전가됩니다."}, {"name": "에너지강관(OCTG)과 호르무즈: 유가·관세·해상풍력의 교차점", "pill": "2026.03~2026.09", "lede": "이란 전쟁과 호르무즈 통항 차질로 유가가 상승하고 미국 시추가 저점을 지나며, 50% 관세 속에서도 미국 OCTG 가격이 올라 국내 강관사의 수출 채산성이 회복되고 있습니다.", "paras": ["2026년 미국-이스라엘의 이란 공격 이후 호르무즈 해협 통항 리스크가 현실화되었습니다. 미 중부사령부는 4월 말까지 봉쇄로 6,900만배럴의 원유가 판매되지 못했다고 밝혔고, UAE 해상유전 차질(합산 약 −193만b/d 추정)과 미국 전략비축유 주간 712만배럴 방출(러-우 전쟁 이후 최대)이 이어졌습니다. 9월 초에는 보복 공격이 재격화되어 호르무즈 통과 원자재 운반선이 평시 125척에서 일평균 약 10척으로 급감했고 사우디 우회 수출로(홍해·동서 파이프라인)도 위협받았습니다. WTI는 7월초 68.6달러에서 9월 91.5달러로 상승했고 EIA는 2026년 평균 전망을 86.8달러로 상향했습니다.", "과거 오일쇼크와 비교하면 이번 충격은 고점 도달이 0~1개월로 가장 빨랐습니다. 2차 오일쇼크는 고점까지 33개월, 기준가 복귀까지 52개월이 걸렸지만 걸프전·러-우전쟁은 각각 5·4개월 만에 복귀했습니다. 한 분석은 생산능력 파괴가 아니라 '수출 병목'형 충격이므로 발생과 소멸이 모두 빠를 수 있다고 해석하며, EIA·IEA도 2027년 공급과잉 전환을 전망합니다.", "미국 시추는 느리게 반응합니다. 원유 리그 수는 5월 408개 저점에서 9월 450개로 회복했지만, 2020년 이후 리그 수의 유가 반응계수는 5.92에서 2026년 1.79로 크게 둔화되었습니다. 대형 E&P가 자본규율로 CapEx를 보수적으로 운용하고(ConocoPhillips 약 +2% 상향), 미국 원유 생산은 DUC 재고 소진에 의존해 왔습니다. DUC는 7월 4,935개로 감소폭이 둔화되어 시추·완결 활동이 활발함을 시사합니다.", "가격은 관세가 뒷받침합니다. 50% 232조 관세와 제3국 AD/CVD로 저가 수입재가 차단되면서 북미 OCTG P110 현물가는 9월 첫째 주 숏톤당 $2,625로 2주 새 +10%, 연초 대비 +31.4% 상승했습니다. 국내 강관사는 판매량보다 가격 상승분의 판가 반영과 수출 수익성에 주목할 시점이며, 3분기는 비수기·환율 하락·미국향 물량 감소로 일시 감익 후 4분기부터 이익 확장이 예상됩니다. 중장기로는 알래스카 LNG(가스관 약 1,300km, 1단계 X70 라인파이프 약 70~72.5만톤), 영국 AR7(8.44GW, 고정식 97.7%)·Dogger Bank South(3.0GW, 모노파일 113~200개), 국내 신안우이 해상풍력이 대구경 강관 수요처입니다."], "table": {"cols": ["사례", "고점 도달", "고점 대비 −20%", "기준가 복귀"], "rows": [["1차 오일쇼크", "3개월", "-", "-"], ["2차 오일쇼크", "33개월", "4개월", "52개월"], ["걸프전", "1개월", "2개월", "5개월"], ["러-우 전쟁", "3개월", "3개월", "4개월"], ["미-이란(호르무즈)", "0~1개월", "진행 중", "진행 중"]]}, "bullets": ["세아제강 미국 생산능력 Welded 116.2만톤·Seamless 118만톤, 넥스틸 텍사스 7.2만톤", "캐나다, 한국산 OCTG에 반덤핑 13.6%(5년) 부과", "국내 유정관 수출 2Q26 13.3만톤(−0.1%), 송유관 11.7만톤(+40.1%)", "알래스카 LNG는 예비 공급계약(Corinth Pipeworks, Europipe)으로 국내 직접 수혜가 제한될 수 있음", "북미 LNG 수출용량 11.4Bcf/d(2024초) → 28.7Bcf/d(2029) 전망"], "kr": "세아제강·세아제강지주(세아윈드 영국 모노파일, 2Q26 NVE 충당금 1,100억원), 넥스틸, 휴스틸이 직접 노출됩니다. 강관 업종은 유가(WTI)와 PBR의 상관관계가 높아 유가 가정이 밸류에이션의 출발점입니다."}]}]}]}, "market": {"title": "시장 규모·수급", "h2": "시장 규모·수급 — 과잉의 철강, 병목의 비철", "en": "Market Size & Supply-Demand", "lede": "수급표 하나로 금속 시장을 요약하면 다음과 같습니다. **철강은 수요 증가 0.34억톤(2026~28) 대비 설비 증가가 최대 1.39억톤**이어서 과잉설비가 6.4억톤에서 7.45억톤으로 커지는 시장이고, **구리는 광산 공급이 가이던스를 4% 밑도는데 수요는 전력망·데이터센터·국방으로 넓어지는** 시장입니다. 같은 '원자재'라도 방향이 반대라는 점을 숫자로 확인하는 탭입니다. 철강은 '수요 정체 + 설비 과잉 + 지역별 관세'라는 삼중 구조 속에서 가격이 지역별로 분절되었고, 비철은 '광산·제련·황산의 연쇄 병목 + 전력화·안보 수요 + 거래소 재고의 지역 편중'으로 가격 하단이 올라갔습니다. 아래 차트는 원출처 기관 수치를 재구성한 것으로, 전망치는 '추정' 태그로 구분했습니다.", "sections": [{"h": "철강 수요 — 증가분은 비중국이 주도, 중국은 감소", "tag
