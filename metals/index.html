<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>철강·비철금속 리서치 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#FBFAF7; --surface:#FFFFFF; --raised:#F3F4F0; --sunken:#EFF1EC;
  --line:#E0E4DC; --line-strong:#C9D0C6;
  --ink:#17211F; --ink-2:#3A4744; --ink-3:#55625D; --ink-4:#626F6A;
  --accent:#A04E2A; --accent-soft:color-mix(in srgb,var(--accent) 10%,transparent); --accent-line:color-mix(in srgb,var(--accent) 34%,transparent);
  --ok:#1D7A5C; --warn:#8A6300; --alert:#A2304A; --dim:#55625D;
  --shadow:0 1px 2px rgba(23,33,31,.06),0 8px 24px -12px rgba(23,33,31,.18);
  --rail:252px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0C1116; --surface:#131A21; --raised:#1A232B; --sunken:#0F161C;
    --line:#253039; --line-strong:#33424E;
    --ink:#DCE5EA; --ink-2:#BCCAD2; --ink-3:#9DAEB9; --ink-4:#8DA0AB;
    --accent:#E3906A; --ok:#3DB08E; --warn:#D2A63A; --alert:#D9738A; --dim:#9DAEB9;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0C1116; --surface:#131A21; --raised:#1A232B; --sunken:#0F161C;
  --line:#253039; --line-strong:#33424E;
  --ink:#DCE5EA; --ink-2:#BCCAD2; --ink-3:#9DAEB9; --ink-4:#8DA0AB;
  --accent:#E3906A; --ok:#3DB08E; --warn:#D2A63A; --alert:#D9738A; --dim:#9DAEB9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;line-height:1.3;letter-spacing:-.011em}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
b{font-weight:600;color:var(--ink)}

.shell{display:flex;min-height:100vh;align-items:flex-start}
.rail{width:var(--rail);flex:0 0 var(--rail);position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brand .mark{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--accent);font-weight:500;display:flex;align-items:center;gap:7px;line-height:1.4}
.brand .mark::before{content:"";width:7px;height:7px;background:var(--accent);border-radius:50%;flex:none}
.brand h1{font-size:18px;margin-top:9px;letter-spacing:-.02em;font-weight:700}
.brand .sub{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.5}
.nav{flex:1;overflow-y:auto;padding:10px 10px 20px}
.nav-group{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.15em;color:var(--ink-4);padding:14px 10px 6px;text-transform:uppercase}
.nav button{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-family:inherit;font-size:13.5px;line-height:1.4}
.nav button:hover{background:var(--raised);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button .k{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);flex:none;width:16px}
.nav button[aria-current="true"] .k{color:var(--accent)}
.desks{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px}
.desks .dl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-4);width:100%;padding:2px 4px 4px}
.desks a{font-size:12px;text-decoration:none;color:var(--ink-3);border:1px solid var(--line);border-radius:14px;padding:3px 9px;white-space:nowrap}
.desks a:hover{color:var(--accent);border-color:var(--accent-line)}
.desks a.cur{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);pointer-events:none}
.railfoot{padding:12px 16px;border-top:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}

.main{flex:1;min-width:0;padding:0 0 96px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:11px 40px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.legend .li{display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.legend .sw{width:9px;height:9px;border-radius:2px;flex:none}
.stamps{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.stamp{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);white-space:nowrap}
.tsw{display:inline-flex;gap:2px;padding:2px;background:var(--sunken);border:1px solid var(--line);border-radius:7px}
.tsb{padding:4px 9px;border:0;border-radius:5px;background:transparent;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:11px;cursor:pointer}
.tsb[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.pane{display:none;padding:34px 40px 0;max-width:1220px}
.pane.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pane.on{animation:none}}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;font-weight:500}
.pane > h2{font-size:29px;margin-top:8px;letter-spacing:-.025em;font-weight:700}
.lede{color:var(--ink-2);font-size:15.5px;max-width:74ch;margin-top:11px;line-height:1.72}
.sec{margin-top:44px}
.sec > h3{font-size:17.5px;display:flex;align-items:center;gap:11px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.sec > h3::before{content:"";width:3px;height:15px;background:var(--accent);border-radius:2px;flex:none}
.note{color:var(--ink-2);font-size:14px;line-height:1.72;margin-top:12px;max-width:78ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.card h4{font-size:14.5px;margin-bottom:8px}
.card p{font-size:13.5px;color:var(--ink-2);line-height:1.68}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kg{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.kg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kg{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px;display:flex;flex-direction:column;gap:5px}
.kpi .lab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.kpi .val{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;color:var(--accent)}
.kpi .cap{font-size:11.5px;color:var(--ink-3);line-height:1.5}

.tag{display:inline-flex;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 7px;border-radius:4px;border:1px solid;white-space:nowrap;vertical-align:middle}
.t-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 34%,transparent);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.t-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 34%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.t-alert{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 34%,transparent);background:color-mix(in srgb,var(--alert) 10%,transparent)}
.t-dim{color:var(--ink-3);border-color:var(--line-strong);background:var(--raised)}
.t-acc{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-2);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--raised);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.62}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--raised)}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
td.tk{font-family:"IBM Plex Mono",monospace;color:var(--ink-3);font-size:12.5px;white-space:nowrap}
td.nm{font-weight:600;white-space:nowrap}
.tcap{font-size:13.5px;font-weight:600;margin:22px 0 8px}
.tnote{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);margin-top:8px;line-height:1.6}

.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:14px 17px;border-radius:0 8px 8px 0;font-size:14.5px;color:var(--ink-2);line-height:1.76;max-width:88ch}

.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 6px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink-3);border-radius:20px;padding:5px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ground);font-weight:500}
.search{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 13px;font-family:inherit;font-size:14px}
.search:focus{border-color:var(--accent);outline:none}
select.search{max-width:200px}
.count{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}

/* chain */
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 2px 10px;margin-top:16px}
.fnode{flex:0 0 150px;background:var(--sunken);border:1px solid var(--line-strong);border-radius:9px;padding:10px 12px;font-size:13px}
.fnode .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--accent)}
.fnode .t{font-weight:600;line-height:1.35;margin-top:2px}
.farr{flex:0 0 22px;display:grid;place-items:center;color:var(--ink-4);font-size:14px}
.vc{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:14px}
.vcx{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px;border-top:2px solid var(--accent)}
.vcx .r{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--accent);margin-bottom:5px}
.vcx h4{font-size:14px;margin-bottom:5px}
.vcx p{font-size:13.2px;color:var(--ink-2);line-height:1.66}
.vcx .co{font-size:12px;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.6}

/* modules */
.mods{display:grid;gap:10px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mod > summary{padding:14px 18px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mod > summary::-webkit-details-marker{display:none}
.mod > summary::after{content:"+";margin-left:auto;font-family:"IBM Plex Mono",monospace;color:var(--ink-4);font-size:16px}
.mod[open] > summary::after{content:"−"}
.mod > summary:hover{background:var(--raised)}
.mname{font-size:15px;font-weight:600}
.men{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-4)}
.mod .body{padding:4px 18px 18px;border-top:1px solid var(--line)}
.mod dl{margin:0}
.mod dt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4);margin:14px 0 4px}
.mod dd{margin:0;font-size:14.3px;color:var(--ink-2);line-height:1.74;max-width:86ch}
.pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 7px;border-radius:3px;background:var(--raised);border:1px solid var(--line);color:var(--ink-3)}
.dplede{font-size:15.5px;color:var(--ink);line-height:1.78;margin:16px 0 4px;padding:2px 0 2px 14px;border-left:3px solid var(--accent);max-width:84ch;font-weight:450}
.dpn p{margin-top:12px;font-size:14.5px;color:var(--ink-2);line-height:1.84;max-width:82ch}
.dpul{margin:10px 0 0;padding-left:18px}
.dpul li{font-size:14px;color:var(--ink-2);line-height:1.74;margin-bottom:8px;max-width:84ch}
.dpkr{margin-top:18px;padding:13px 16px;background:var(--sunken);border:1px solid var(--line);border-radius:9px;font-size:14px;color:var(--ink-2);line-height:1.72}
.dpkr .l{color:var(--accent);font-weight:600;margin-right:6px}
.formula{font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;padding:10px 13px;margin-top:10px;color:var(--ink);line-height:1.6;white-space:pre-wrap}

/* bars */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.chart h4{font-size:14.5px}
.chart .u{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.bar{display:grid;grid-template-columns:minmax(90px,34%) 1fr 72px;gap:10px;align-items:center}
.bar .bl{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.bar .bt{position:relative;height:12px;background:var(--sunken);border-radius:3px;border:1px solid var(--line)}
.bar .bf{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:2px}
.bar .bf.neg{background:var(--alert)}
.bar .bf.est{background:repeating-linear-gradient(135deg,var(--accent) 0 4px,color-mix(in srgb,var(--accent) 55%,transparent) 4px 7px)}
.bar .bf.neg.est{background:repeating-linear-gradient(135deg,var(--alert) 0 4px,color-mix(in srgb,var(--alert) 55%,transparent) 4px 7px)}
.bar .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink-4)}
.bar .bv{font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.chart .cn{font-size:12px;color:var(--ink-3);margin-top:12px;line-height:1.6;padding-top:10px;border-top:1px solid var(--line)}

/* timeline */
.tl{margin-top:18px;border-left:1px solid var(--line-strong);margin-left:6px}
.tli{position:relative;padding:0 0 20px 22px}
.tli::before{content:"";position:absolute;left:-5px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--dim)}
.tli.pos::before{border-color:var(--ok)} .tli.neg::before{border-color:var(--alert)}
.tli .d{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.tli h4{font-size:14.5px;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tli p{font-size:13.8px;color:var(--ink-2);margin-top:4px;line-height:1.7;max-width:84ch}
.bb{list-style:none;margin:10px 0 0;padding:0}
.bb li{font-size:13.8px;color:var(--ink-2);line-height:1.66;padding:8px 0;border-bottom:1px dashed var(--line)}
.bb li:last-child{border-bottom:0}

.ck li{list-style:none;display:flex;gap:9px;align-items:flex-start;font-size:13.8px;color:var(--ink-2);line-height:1.62;padding:6px 0}
.ck{margin:6px 0 0;padding:0}
.ck input{margin-top:4px;accent-color:var(--accent);flex:none}
.more{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-family:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
.more:hover{border-color:var(--accent);color:var(--accent)}
.evt{display:grid;grid-template-columns:104px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.evt .d{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.evt .n{font-size:14px;font-weight:600}
.evt .m{font-size:13px;color:var(--ink-3);margin-top:2px;line-height:1.55}
.evt.past .d{color:var(--ink-4)}
.cloud{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

@media (max-width:900px){
  .desks{display:none}
  .shell{flex-direction:column}
  .rail{position:static;width:100%;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{display:flex;overflow-x:auto;padding:8px;gap:4px}
  .nav-group{display:none}
  .nav button{width:auto;white-space:nowrap}
  .nav button .k{display:none}
  .desks{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px}
.desks .dl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-4);width:100%;padding:2px 4px 4px}
.desks a{font-size:12px;text-decoration:none;color:var(--ink-3);border:1px solid var(--line);border-radius:14px;padding:3px 9px;white-space:nowrap}
.desks a:hover{color:var(--accent);border-color:var(--accent-line)}
.desks a.cur{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);pointer-events:none}
.railfoot{display:none}
  .topbar{padding:10px 16px}
  .pane{padding:24px 16px 0}
  .pane > h2{font-size:24px}
  .bar{grid-template-columns:1fr 60px}
  .bar .bl{grid-column:1/-1}
  .evt{grid-template-columns:1fr;gap:2px}
}
/* ===== v2 blocks ===== */
.fig{margin:18px 0 0;padding:16px 14px 14px;background:var(--sunken);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.fig svg{display:block;width:100%;min-width:560px;height:auto;color:var(--ink-2)}
.fig svg text{fill:currentColor;font-family:inherit}
.fig figcaption{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2);line-height:1.74;max-width:86ch}
.sec .blk{margin-top:16px}
.callout.w{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.callout.r{border-left-color:var(--alert);background:color-mix(in srgb,var(--alert) 7%,transparent)}
.stage{display:grid;grid-template-columns:26px 1fr;gap:0 15px}
.stage .col{position:relative}
.stage .col::before{content:"";position:absolute;left:12px;top:6px;bottom:-6px;width:1px;background:var(--line)}
.stage:last-child .col::before{display:none}
.stage .dot{width:25px;height:25px;border-radius:50%;border:1px solid var(--accent-line);background:var(--surface);color:var(--accent);font-family:"IBM Plex Mono",monospace;font-size:11px;display:grid;place-items:center;position:relative;z-index:1;font-weight:500}
.stage .content{padding-bottom:22px}
.stage h4{font-size:15px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.stage .meta{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 8px}
.stage p{font-size:13.8px;color:var(--ink-2);line-height:1.68;max-width:80ch}
.stage .chk{font-size:12.8px;color:var(--ink-3);margin-top:7px;padding-left:12px;border-left:2px solid var(--line);line-height:1.6}
.stage .chk b{color:var(--accent);font-weight:500}
.dcard .dfl{display:flex;flex-wrap:wrap;gap:6px;padding-top:12px}

 font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">NdPr·Dy·Tb<\/text><path d=\"M586 368 L622 368\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt1)\"/><rect x=\"592\" y=\"351\" width=\"26\" height=\"14\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"605\" y=\"361\" font-size=\"10\" text-anchor=\"middle\">합금<\/text><rect x=\"624\" y=\"338\" width=\"130\" height=\"60\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"689\" y=\"365\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">NdFeB 자석<\/text><text x=\"689\" y=\"381\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">中 92%<\/text><path d=\"M754 368 L790 368\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt1)\"/><rect x=\"760\" y=\"351\" width=\"26\" height=\"14\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"773\" y=\"361\" font-size=\"10\" text-anchor=\"middle\">자석<\/text><rect x=\"792\" y=\"338\" width=\"130\" height=\"60\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"857\" y=\"365\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">EV·로봇<\/text><text x=\"857\" y=\"381\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">방산·풍력<\/text><text x=\"120\" y=\"424\" font-size=\"12\" text-anchor=\"start\">돈의 원천 — 정책이 만든 가격 바닥: NdPr 하한 $110/kg(미 국방부, 10년) + 장기 오프테이크<\/text><text x=\"940\" y=\"458\" font-size=\"11\" text-anchor=\"end\" opacity=\".7\">강조 상자 = 이익·병목이 몰린 구간 (붉은색 = 중국 집중 병목)<\/text><\/svg>", "cap": "**세 레인의 '돈의 원천'이 다르다는 것이 이 데스크 전체의 출발점입니다.** 철강 레인은 판가와 원료비의 차이(스프레드)여서 무역구제가 판가 하단을 올려야 이익이 늘고, 비철 레인은 TC가 0달러가 되며 제련의 수수료 수입이 사라져 부산물·Free Metal로 이익원이 옮겨갔으며, 핵심광물 레인은 중국이 58%→89%→92%로 하류로 갈수록 장악한 병목을 정부 가격하한으로 뚫는 구조입니다."}, {"t": "cards", "items": [{"r": "01", "h": "광산·원료", "p": "철광석·원료탄, 동·아연 정광, 리튬(염호·스포듀민), 희토류 원광을 채굴·선광해 정광(구리 약 25%) 형태로 판매", "co": "**마진 원천** (금속가격 − AISC/C1 현금원가) × 물량. 품위 하락·용수·인허가가 원가를 올리고, 공급 차질기엔 가격 레버리지가 극대화(SCCO 1Q26 영업이익률 58%)\n**국내** POSCO홀딩스(아르헨티나 염호·호주 리튬광산 지분), 포스코인터내셔널(가스전·흑연광산 지분), 고려아연(TMC 지분)"}, {"r": "02", "h": "원료 조달·트레이딩·오프테이크", "p": "장기구매계약(LTA)·오프테이크·스트리밍으로 원료를 선확보하고 지역 간 가격차를 활용해 물량을 재배치", "co": "**마진 원천** 트레이딩 스프레드와 지분법이익. 수출통제 국면에서는 '비중국 원료 확보력' 자체가 프리미엄\n**국내** 포스코인터내셔널, LX인터내셔널"}, {"r": "03", "h": "제련·정련·분리", "p": "동·아연·연 정광을 전기동·아연괴로 만들고 금·은·황산·희소금속을 회수. 희토류는 용매추출(SX)로 원소별 분리·정제", "co": "**마진 원천** TC/RC + Free Metal(회수율−payable) + 부산물(금·은·황산·In·Sb·Ge 등) + 프리미엄. TC 0달러 시대엔 부산물 비중이 이익의 대부분\n**국내** 고려아연, LS MnM(비상장, LS 자회사), LS에코에너지(희토류 금속화 추진)"}, {"r": "04", "h": "제선·제강", "p": "고로(철광석→용선)·전로(용선→용강) 또는 전기로(스크랩·DRI→용강)로 조강 생산, 연주로 슬래브·빌릿 제조", "co": "**마진 원천** 고로는 제품가 − (철광석+원료탄) 롤마진, 전기로는 제품가 − 스크랩 스프레드. 탄소비용(K-ETS·CBAM)이 새 원가 항목\n**국내** POSCO홀딩스, 현대제철, 동국제강, 대한제강, 한국철강"}, {"r": "05", "h": "1차 압연 제품", "p": "열연(HRC)·후판·철근·H형강·특수강 봉강·선재 등 기초 강재 생산", "co": "**마진 원천** 지역별 가격 분절 속 무역구제(AD·MIP·세이프가드) 강도가 판가 하단을 결정. 믹스(자동차강판·전기강판) 개선이 핵심\n**국내** POSCO홀딩스, 현대제철, 세아베스틸지주, 동국제강"}, {"r": "06", "h": "2차 가공(판재 가공·강관·신동)", "p": "냉연·도금·컬러강판, 유정관(OCTG)·송유관·모노파일, 구리 판·봉·관·황동봉·동 선재", "co": "**마진 원천** 가공마진 + 래깅(메탈게인). 강관은 미국 판가 − 국내 열연원가 − 50% 관세. 신동은 구리 상승기 재고평가이익\n**국내** KG스틸, 세아제강, 세아제강지주, 넥스틸, 휴스틸, 풍산, 대창"}, {"r": "07", "h": "고부가 소재", "p": "니켈계 초내열합금(모합금·분말), 전기강판(GO/NO), NdFeB 영구자석, 동박, 알루미늄박", "co": "**마진 원천** 인증(NADCAP·고객 품질인증)과 리드타임이 만든 가격결정력. 특수합금 부문 EBITDA 마진 24~36%\n**국내** 세아베스틸지주(세아창원특수강·SST), 에이치브이엠, 제이에스링크, 성림첨단산업, 롯데에너지머티리얼즈, 삼아알미늄"}, {"r": "08", "h": "부품·시스템", "p": "초고압·HVDC·해저케이블, 부스덕트, 구동모터 코어, 탄약, 대형단조품", "co": "**마진 원천** 수주잔고와 에스컬레이션 조항(원가 연동)으로 금속가격 변동을 전가. 해저케이블 OPM 18%\n**국내** LS(LS전선), 대한전선, 포스코인터내셔널, 풍산, 태웅"}, {"r": "09", "h": "최종 수요", "p": "건설·자동차·조선·가전(전통) + 전력망·AI 데이터센터·ESS·EV·방산·항공우주(신규)", "co": "**마진 원천** 철강은 중국 부동산에 연동된 전통 수요 정체, 비철은 전력화·안보 수요로 가격 비탄력적 수요 확대\n**국내** 현대차그룹·조선사·전력기기사 등 수요처"}, {"r": "10", "h": "재활용·도시광산", "p": "철스크랩·동스크랩 회수, 폐자석에서 Nd·Pr·Dy·Tb 회수, 폐배터리 리사이클", "co": "**마진 원천** 원료 자급률과 탄소 저감 프리미엄. 중국 세금계산서 단속처럼 제도 변화가 스크랩 유통량을 좌우\n**국내** 고려아연(폐자석 희토류 연 100톤 목표), 현대제철(스크랩 전기로), 대창(동스크랩 기반 황동봉)"}]}]}, {"h": "하위 섹터 7개 — 같은 금속, 다른 경제학", "note": "커버리지 유니버스(13번 탭)의 분류와 같습니다. 각 섹터는 이익을 내는 방식과 가격을 움직이는 변수가 다르므로 피어셋도 섹터 안에서 골라야 합니다.", "blocks": [{"t": "grid", "cols": 2, "items": [{"h": "고로 철강(판재)", "p": ["철광석과 원료탄으로 고로에서 쇳물을 만들어 열연·냉연·후판·도금재·전기강판을 생산합니다. 국내 판재 가격은 중국산 수입 오퍼가에 좌우돼 왔으나 2025~26년 반덤핑·가격약속(MIP)으로 중국 가격과 분리(디커플링)되기 시작했습니다."], "list": ["**드라이버** 중국 조강·수출, 한국 무역구제, 철광석·원료탄 가격, 원/달러", "**사이클** 중국 부동산 사이클에 연동된 장기 다운사이클(2021년~) 속 무역장벽이 만든 국지적 반등. 2026년 1Q를 바닥으로 '상저하고'", "**국내** POSCO홀딩스, 현대제철, KG스틸"]}, {"h": "전기로·봉형강·철근", "p": ["철스크랩을 전기로에서 녹여 철근·H형강 등 건설용 강재를 만듭니다. 국내 철근은 생산능력 1,170~1,230만톤 대비 수요 690만톤 안팎으로 가동률이 56~57%에 불과한 구조적 과잉 품목입니다."], "list": ["**드라이버** 주택 착공·미분양, 스크랩 가격, 제강사 감산·설비폐쇄, 미국향 수출", "**사이클** 배치식 가동이라 감산이 쉬워 공급 조절에 가격이 민감. 2026년 미국 데이터센터향 수출 급증(월 10만톤대)과 구조조정 1순위 지정으로 반등", "**국내** 현대제철, 동국제강, 대한제강, 한국철강"]}, {"h": "강관·특수강", "p": ["에너지용 강관(OCTG·송유관·모노파일)과 자동차·기계용 특수강 봉강을 포함합니다. 강관은 미국 시추 리그 수와 232조 관세, 특수강은 중국산 수입(국내 봉강 수입의 약 91%)과 반덤핑 여부가 핵심입니다."], "list": ["**드라이버** WTI·미국 리그 수·DUC 재고, 미국 OCTG 가격, 특수강봉강 반덤핑 판정", "**사이클** 유가·지정학(호르무즈) 사이클과 해상풍력 프로젝트 사이클이 겹친 프로젝트형", "**국내** 세아제강, 세아제강지주, 넥스틸, 휴스틸, 세아베스틸지주"]}, {"h": "구리·제련(TC/RC)", "p": ["광산 품위 하락·연쇄 사고로 정광이 부족해지고 중국 제련설비는 과잉이라 제련수수료가 0 이하로 붕괴했습니다. 가격은 AI 데이터센터·전력망·전동화·비축 수요로 사상 최고를 경신했고, 신동·전선 가공업체는 메탈게인과 수주로 이익을 냅니다."], "list": ["**드라이버** 광산 가이던스, 벤치마크·현물 TC, 황산 가격, 미국 정련동 관세, 3대 거래소 재고", "**사이클** '슈퍼사이클'보다는 공급 병목에 의한 '가격 하단 레벨업'. 병목이 광산에서 제련 단계로 이동 중", "**국내** 고려아연, LS(LS MnM·LS전선), 풍산, 대창, 대한전선"]}, {"h": "귀금속(금·은)", "p": ["금은 중앙은행 매입과 통화신뢰 변화, 은은 부산물 공급(약 60%)의 비탄력성과 태양광·AI 산업수요(60% 이상)로 급등했습니다. 국내에서는 제련 부산물로 은을 대량 생산하는 제련사의 이익 구조를 바꿨습니다."], "list": ["**드라이버** 달러·실질금리, 은 리스 레이트, SGE-COMEX 스프레드, ETF 흐름, 태양광 설치량", "**사이클** 2025년 은 +161%, 2026년 1월 온스당 100달러 돌파 후 전쟁 국면에서 조정. 금은비율 약 40(역사 평균 70)", "**국내** 고려아연, LS MnM(비상장)"]}, {"h": "희토류·핵심광물", "p": ["희토류(NdPr·Dy·Tb), 희소금속(갈륨·게르마늄·인듐·안티모니·텅스텐), 리튬·니켈·코발트를 포함합니다. 문제는 매장량이 아니라 중국이 쥔 분리·정제·자석 공정과 반복되는 수출통제이며, 미국은 가격하한·지분투자·비축으로 비중국 공급망을 국가 주도로 재건 중입니다."], "list": ["**드라이버** 중국 수출허가·쿼터, 미국 가격하한(NdPr $110/kg)·Project Vault, 역외 가격 프리미엄, 리튬 재고·자원국 수출통제", "**사이클** 가격 사이클보다 정책·지정학 이벤트 사이클. 리튬은 2025년 중반 바닥 후 ESS 수요로 계단식 반등", "**국내** POSCO홀딩스, 포스코인터내셔널, 고려아연, LS에코에너지, 제이에스링크, 성림첨단산업"]}, {"h": "특수합금·소재", "p": ["니켈계 초내열합금(항공엔진·가스터빈·로켓), 항공용 알루미늄, 전기강판·알루미늄박 등 인증이 필요한 고부가 소재. 제트엔진 리드타임 60주 이상, 신규 진입에 공장 18~36개월+인증 24~48개월이 걸리는 공급자 우위 시장입니다."], "list": ["**드라이버** 항공기 인도·엔진 MRO, 가스터빈(데이터센터 전력) 수주, 우주 발사 횟수, 니켈 Surcharge", "**사이클** 경기보다 항공·방산·발전 설비 사이클. 업종 내 멀티플 서열 철강 < 리튬·구리 < 특수합금", "**국내** 세아베스틸지주, 에이치브이엠, 스피어, 태웅, 삼아알미늄"]}]}]}, {"h": "이 도구의 사용법", "blocks": [{"t": "grid", "cols": 2, "numbered": true, "items": [{"h": "처음 배울 때 순서", "p": ["01 산업 지도에서 '철강=스프레드, 비철=공급 병목, 핵심광물=정책 하단'이라는 세 갈래를 먼저 잡습니다. 다음으로 02 공정 백과에서 고로·전기로·수소환원과 구리·희토류 사슬 도식을 보고, 04 가격·스프레드 읽기에서 롤마진·TC/RC·메탈게인 공식을 손으로 한 번 계산해 봅니다.", "그 뒤 07 딥다이브의 '중국 구조조정 2016 vs 반내권', 'TC 붕괴와 제련 경제학', '희토류 병목은 분리·정제' 세 편을 읽고, 04의 지표 사전에서 주간으로 볼 지표 5개(중국 조강·수출, 국내 열연 유통가, 구리 현물 TC, 탄산리튬, NdPr 역외가)를 골라 두면 됩니다."]}, {"h": "딜 검토할 때", "p": ["금속 기업 IPO·메자닌은 먼저 이익이 '가격(메탈게인·래깅)'에서 나오는지 '구조(부산물 회수·인증·수주잔고·정책 계약)'에서 나오는지 분해한다(04 가격 읽기, 11 밸류에이션).", "통상 노출은 05 통상·관세 지도, 원료 조달 리스크는 06 핵심광물 공급망으로 확인하고, 12 체크포인트의 기업 유형별 5분 스캔과 공통 레드플래그를 통과시킵니다. 피어셋은 13 유니버스에서 하위섹터별로 고릅니다."]}, {"h": "숫자를 인용하기 전에", "p": ["금속 가격은 기준(LME 3개월물·현물, COMEX, SHFE, 중국 내수가, 역외가)에 따라 수십 % 차이가 납니다. 희토류는 중국 내수가와 역외가가 수배~수십 배 벌어져 있고(산화이트륨 $18 vs $270/kg), 구리 수급은 ICSG가 6개월 만에 '15만톤 부족'에서 '9.6만톤 과잉'으로 방향을 바꿨습니다.", "인용 시 시점·거래소·원출처를 붙이고, 16 출처·데이터 품질의 '수치 상충' 표를 먼저 확인합니다. 태그가 '추정'이면 전망치, '미확인'이면 자료 간 수치가 엇갈린다는 뜻입니다."]}, {"h": "이 자료의 한계", "p": ["2025.09~2026.09 국내외 산업 분석 자료·통계·기업 공시를 바탕으로 재구성했습니다. 국내 상장사 관점과 업황 개선 쪽 시각이 상대적으로 많이 반영됐을 수 있고, 일부 표 수치는 원자료 확인이 끝나지 않았습니다.", "개별 기업에 대한 투자 판단·가격 전망 표현은 의도적으로 넣지 않았고, 수치에는 원출처 기관을 병기했으나 원출처 대조 검증은 하지 않았습니다. 도식의 수치는 인용값이며 '개념도' 표기가 있는 곡선은 모양만 나타냅니다."]}]}]}]}, "process": {"title": "공정 백과", "h2": "공정 백과 — 쇳물과 정광이 소재가 되기까지", "en": "Process Encyclopedia", "lede": "쇳물 1톤을 만드는 길은 세 가지(고로·전기로·수소환원)이고, 어느 길을 택하느냐가 **원가 구조·탄소비용·감산 탄력성**을 한꺼번에 결정합니다. 비철은 반대로 품위 0.5%짜리 원광을 99.99% 금속으로 농축하는 긴 사슬이어서, **그 사슬 어디에 병목이 있는지**가 가격과 이익의 위치를 정합니다. 공정을 알면 '왜 고로사는 감산을 못 하나', '왜 TC가 마이너스인데 제련소가 돌아가나', '왜 희토류는 캐도 부족한가'가 한 번에 풀립니다.", "sections": [{"h": "① 철을 만드는 세 가지 길 — 고로·전기로·수소환원", "tag": "확인", "note": "고로-전로(BF-BOF)는 철광석을 코크스로 환원해 쇳물(용선)을 만들고, 전기로(EAF)는 철스크랩을 전력으로 녹이며, 수소환원(DRI)은 코크스 대신 수소로 철광석의 산소를 떼어냅니다.", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 450\" role=\"img\" aria-label=\"고로는 탄소집약도가 전기로의 4배지만 연속 공정이라 감산이 어렵고, 전기로는 배치식이라 감산이 쉽다\"><defs><marker id=\"a-mt2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><text x=\"95\" y=\"22\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" opacity=\".7\">원료<\/text><text x=\"295\" y=\"22\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" opacity=\".7\">환원·용해<\/text><text x=\"490\" y=\"22\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" opacity=\".7\">정련<\/text><text x=\"675\" y=\"22\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" opacity=\".7\">주조<\/text><text x=\"860\" y=\"22\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" opacity=\".7\">탄소·가동 특성<\/text><text x=\"20\" y=\"62\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--alert)\">고로-전로 (한국 조강의 72%)<\/text><rect x=\"20\" y=\"70\" width=\"150\" height=\"64\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"95\" y=\"99\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">철광석 1.5~1.6t<\/text><text x=\"95\" y=\"115\" font-size=\"11\" text-anchor=\"middle\" opa \" style=\"fill:var(--accent)\">CO2 대폭 감축 목표<\/text><text x=\"860\" y=\"376\" font-size=\"11\" text-anchor=\"middle\">HyREX 데모 30만t<\/text><path d=\"M750 362 L778 362\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"/><path d=\"M295 134 L295 198\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-mt2)\" style=\"stroke:var(--accent)\"/><rect x=\"297\" y=\"160\" width=\"164\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"300\" y=\"171\" font-size=\"11\" text-anchor=\"start\" style=\"fill:var(--accent)\">용선 합탕 (광양 전기로 250만t)<\/text><text x=\"480\" y=\"432\" font-size=\"12\" text-anchor=\"middle\">고로 1톤당 CO2는 전기로 대비 약 1.5t 많음 — K-ETS 4기·CBAM이 격차에 가격 부여<\/text><\/svg>", "cap": "**고로 경로는 톤당 2.0~2.3tCO2를 배출해 전기로(약 0.5tCO2)의 4배지만, 한국 조강의 72%가 이 경로입니다.** 고로는 한 번 불을 끄면 재가동이 어려운 연속 공정이라 감산 탄력성이 낮고, 전기로는 차지 수를 줄이는 배치식이라 감산이 쉽습니다. 따라서 철근(전기로) 가격은 제강사 공급 조절에, 판재(고로) 가격은 수입재와 무역구제에 더 민감합니다. 광양 250만톤 전기로처럼 고로 용선과 전기로 쇳물을 합탕하는 복합 공정이 전환기의 현실적 해법입니다."}, {"t": "table", "cols": ["구분", "고로-전로 (BF-BOF)", "전기로 (EAF)", "수소환원 (H2-DRI + EAF)"], "rows": [["주원료", "철광석 1.5~1.6t + 원료탄 0.7~0.8t (톤당, 업계 근사치)", "철스크랩 1.0~1.2t (+DRI·선철)", "철광석 펠릿 + 수소"], ["탄소집약도", "2.0~2.3 tCO2/t (현대제철 고로 2.24, 2024)", "약 0.5 tCO2/t", "대폭 감축 목표(상용화 전)"], ["가동 방식", "연속 공정 — 감산·재가동 비용 큼", "배치식 — 일 차지 수로 생산 조절", "환원로 연속 + 전기로 배치"], ["주 제품", "열연·후판·냉연·자동차강판·전기강판", "철근·H형강·특수강 봉강(+합탕 시 판재)", "저탄소 판재(목표)"], ["비용 변수", "철광석·원료탄·환율·탄소비용", "스크랩·전력비·전극봉", "그린수소 단가(경제성 요건 kg당 2,000원 이하, 추정)"], ["국내 현황", "POSCO·현대제철 — 한국 고로 비중 72.3%", "현대제철 1,000만t, 동국·대한제강 등 / 광양 250만t(2026-06 준공)", "HyREX 포항 데모 연산 30만t·1.3조원, 2030 상용기술 목표"]], "title": "제선·제강 경로 비교", "note": "원출처: 회사 공시·한국철강협회·업계 추정. 수소환원제철 본예타 총 8.1천억원(국비 3.1천억원, 2025-06)."}, {"t": "callout", "text": "K-ETS 제4기와 EU CBAM은 고로-전기로의 탄소집약도 차이(톤당 약 1.5tCO2)에 가격을 매깁니다. 전기로 전환·합탕 확대는 '친환경'이 아니라 **배출권 부족분과 CBAM 비용을 줄이는 원가 전략**으로 읽어야 합니다. 한국 정부 로드맵은 고로→전기로 전환(2026~ 65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt3)\"/><rect x=\"498\" y=\"308\" width=\"123\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"560\" y=\"319\" font-size=\"11\" text-anchor=\"middle\">유통가·스크랩 스프레드<\/text><path d=\"M330 396 L768 396\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt3)\"/><rect x=\"485\" y=\"378\" width=\"149\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"560\" y=\"389\" font-size=\"11\" text-anchor=\"middle\">중국산이 봉강 수입의 약 91%<\/text><\/svg>", "cap": "**열연(HRC)은 냉연·도금·강관의 원재료라 모든 하공정 판재 가격이 열연 가격 위에 쌓입니다.** 따라서 반덤핑·MIP로 열연 수입가가 오르면 그 효과가 냉연·강관으로 전이되고, 한중 열연 가격차가 곧 수입재 압력의 온도계가 됩니다. 후판은 조선사와 반기 협상가로, 철근은 유통가-스크랩 스프레드로, 특수강 봉강은 중국산 수입(봉강 수입의 약 91%) 규제 여부로 각각 다른 가격 논리를 따릅니다."}, {"t": "steps", "items": [{"h": "제선 — 쇳물(용선) 만들기", "meta": ["고로", "철광석·코크스"], "p": "소결광·펠릿과 코크스를 고로 상부에 넣고 뜨거운 바람을 불어 넣으면 코크스가 철광석의 산소를 빼앗아 쇳물이 됩니다. 고로 한 기는 수십 년 연속 가동이 전제입니다.", "chk": "고로 개보수·가동 중단 일정은 분기 판매량과 고정비 흡수에 직결됩니다."}, {"h": "제강 — 용선을 강으로", "meta": ["전로·전기로", "성분 조정"], "p": "전로에서 산소를 불어 탄소·불순물을 태워 용강을 만들고, 노외정련·진공탈가스로 합금 성분과 청정도를 맞춥니다. 특수강은 이 단계의 청정도 관리가 품질을 가릅니다.", "chk": "특수강·자동차강판 비중이 높을수록 정련 부하와 부가가치가 함께 올라갑니다."}, {"h": "연주 — 반제품 만들기", "meta": ["슬래브", "빌릿·블룸"], "p": "용강을 연속주조기로 굳혀 판재용 슬래브, 봉형강용 빌릿·블룸을 만듭니다. 조강(Crude Steel) 생산량은 이 단계 물량을 뜻합니다.", "chk": "'조강 생산'과 '제품 출하'는 시차·재고로 다르므로 감산 뉴스는 둘을 구분해 읽습니다."}, {"h": "열간압연 — 열연·후판", "meta": ["1,100~1,300℃", "HRC·Plate"], "p": "슬래브를 고온에서 눌러 얇은 코일(열연) 또는 두꺼운 판(후판, 6mm 이상)을 만듭니다. 열연은 그대로 유통되거나 하공정 원재료가 됩니다.", "chk": "국내 열연 유통가(스틸데일리)와 중국 오퍼가 차이, 조선용 후판 반기 협상가."}, {"h": "냉간압연·표면처리 — 냉연·도금·컬러·전기강판", "meta": ["상온 압연", "GI·GA·PPGI·GO·NO"], "p": "열연을 산세 후 상온에서 더 얇게 누르고(냉연), 아연 도금·도장(컬러)이나 규소 첨가·절연코팅(전기강판)을 입혀 자동차·가전·변압기·모터에 공급합니다.", "chk": "원가(열연) 상승분 전가 시차, 중국산 도금재 반덤핑(2026-06 잠정 최고 33.67%)."}, {"h": "조관 — 강관", "meta": ["ERW·Seamless", "OCTG·라인파이프"], "p": "열연·후판을 말아 용접하거나 빌렛을 뚫어 이음매 없는 강관을 만들고, 유정용은 나사 가공을 더합니다.", "chk": "북미 OCTG 가격(P110 숏톤당  x=\"470\" y=\"180\" width=\"120\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"530\" y=\"205\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">금·은<\/text><text x=\"530\" y=\"221\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">애노드 슬라임<\/text><rect x=\"620\" y=\"180\" width=\"130\" height=\"56\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"685\" y=\"205\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">동 스크랩<\/text><text x=\"685\" y=\"221\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">정련동의 16.9%<\/text><path d=\"M440 112 L395 178\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt4)\"/><path d=\"M640 112 L545 178\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt4)\"/><path d=\"M685 180 L685 114\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt4)\"/><rect x=\"702\" y=\"140\" width=\"39\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"705\" y=\"151\" font-size=\"11\" text-anchor=\"start\">재투입<\/text><rect x=\"20\" y=\"300\" width=\"150\" height=\"56\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"95\" y=\"325\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">산화광<\/text><text x=\"95\" y=\"341\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">저품위 원광<\/text><rect x=\"212\" y=\"300\" width=\"150\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--warn);fill-opacity:.12;stroke:var(--warn)\" stroke-width=\"1.4\"/><text x=\"287\" y=\"325\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">침출·SX-EW<\/text><text x=\"287\" y=\"341\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">황산 투입<\/text><rect x=\"596\" y=\"300\" width=\"150\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"671\" y=\"325\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">전기동<\/text><text x=\"671\" y=\"341\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">정련동의 약 1/5<\/text><path d=\"M170 328 L210 328\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt4)\"/><path d=\"M362 328 L594 328\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt4)\"/><rect x=\"429\" y=\"310\" width=\"98\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"478\" y=\"321\" font-size=\"11\" text-anchor=\"middle\">용매추출·전해채취<\/text><path d=\"M372 236 L320 298\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" marker-end=\"url(#a-mt4)\" style=\"stroke:var(--warn)\"/><rect x=\"387\" y=\"262\" width=\"53\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"390\" y=\"273\" font-size=\"11\" text-anchor=\"start\" style=\"fill:var(--warn)\">황산 공급<\/text><path d=\"M746 312 L838 114\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt4)\"/><path d=\"M95 112 L95 298\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-mt4)\"/><rect x=\"97\" y=\"196\" width=\"59\" height=\"14\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"100\" y=\"206\" font-size=\"10\" text-anchor=\"start\">산화광 분리<\/text><text x=\"480\" y=\"388\" font-size=\"12\" text-anchor=\"middle\">TC: 2026 벤치마크 $0, 현물 −$227.5(2026-08-14) → 제련 마진은 황산·금·은·희소금속이 원천<\/text><\/svg>", "cap": "**황산은 제련의 부산물이면서 습식(SX-EW) 광산의 원료라, 황산 가격 하나가 제련소와 광산의 이익을 반대 방향으로 움직입니다.** 세계 정련동의 약 1/5, 콩고 생산의 약 80%가 SX-EW 방식이라 중국의 황산 수출 중단(2026-05)은 광산 생산 자체를 제약합니다. 반면 황산 고가는 TC가 마이너스여도 제련소가 정광을 계속 사게 만들어 정상적인 감산을 늦춥니다."}, {"t": "steps", "items": [{"h": "채굴", "meta": ["품위 0.5~0.6%", "리드타임 약 17년"], "p": "남미 주요 광산 품위는 2000년 1.2~1.3%에서 2025년 0.6%로 절반이 됐고, BHP는 1.02%(2025) → 0.7%(2027E)를 예상합니다. 같은 구리를 얻기 위해 더 깊이, 더 많이 캐야 합니다.", "chk": "광산 가이던스 대비 실제 생산 — 2025년 주요 9개사 합계 9,586kt(−4.0%)로 가이던스 중간값 10,068kt 미달."}, {"h": "선광 — 정광", "meta": ["품위 25~40%", "용수 집약"], "p": "원광을 분쇄·부유선광해 구리 함량 25~40% 정광으로 농축합니다. 구리 1톤 처리에 용액용 물 450~600L가 들어 칠레(세계 생산 약 23%)의 가뭄이 곧 공급 리스크입니다.", "chk": "정광이 귀한지 흔한지는 TC가 가장 먼저 알려줍니다."}, {"h": "건식 제련", "meta": ["블리스터·애노드", "SO2 → 황산"], "p": "정광을 녹여 황을 태워 날리고 조동(블리스터) → 애노드로 만듭니다. 이때 나온 이산화황을 회수해 황산을 팝니다.", "chk": "중국 제련 설비 과잉(CSPT 2026년 가동률 10% 이상 감축 합의)과 황산 가격."}, {"h": "전해 정련", "meta": ["전기동 99.99%", "슬라임 → 금·은"], "p": "애노드를 전해조에서 녹여 순도 99.99% 전기동(캐소드)을 석출시키고, 바닥에 쌓인 슬라임에서 금·은을 회수합니다. 스크랩(정련동의 16.9%, 2023)도 이 단계에 재투입됩니다.", "chk": "LME·COMEX·SHFE 표준 상품이 이 전기동입니다."}, {"h": "습식 제련 (SX-EW)", "meta": ["산화광", "황산 침출"], "p": "저품위 산화광을 황산으로 녹여 용매추출·전해채취로 바로 전기동을 만듭니다. 제련소를 거치지 않지만 황산을 대량 소비합니다.", "chk": "황산 고가 → SX-EW 원가 상승(Antofagasta 원가의 약 5%)·감산."}, {"h": "가공 — 신동·전선", "meta": ["판·봉·선·관", "케이블·버스바"], "p": "전기동과 스크랩을 녹여 판·봉·관(신동), 동 선재·케이블(전선), 황동봉(구리+아연)으로 가공합니다. 원가 연동(에스컬레이션)과 재고 시차(메탈게인)가 이익을 좌우합니다.", "chk": "영업이익 중 메탈게인 비중과 수주잔고의 에스컬레이션 적용 비율."}]}]}, {"h": "④ 아연·연 제련 — '다금속 회수 플랫폼'", "note": "아연·연 정광에는 소량의 은·인듐·게르마늄·안티모니·비스무스가 섞여 있습니다. 이것을 얼마나 뽑아내느냐가 TC 0달러 시대 제련사의 이익을 결정합니다.", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 920 392\" role=\"img\" aria-label=\"아연·연 제련소는 본업 금속보다 부산물(금·은·황산·희소금속)에서 더 많은 이익을 내는 회수 플랫폼이다\"><defs><marker id=\"a-mt6\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"20\" y=\"40\" width=\"160\" height=\"60\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"100\" y=\"67\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">아연 정광<\/text><text x=\"100\" y=\"83\" font-size=\"11\" text-anchor=\"midd r(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"695\" y=\"45\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">아연괴·연괴·전기동<\/text><text x=\"695\" y=\"61\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">본업: TC + Free Metal<\/text><path d=\"M500 190 L598 48\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt6)\"/><text x=\"800\" y=\"53\" font-size=\"11\" text-anchor=\"start\" opacity=\".75\">구조적<\/text><rect x=\"600\" y=\"90\" width=\"190\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"695\" y=\"115\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">금·은<\/text><text x=\"695\" y=\"131\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">고려아연 은 약 2,000t/년<\/text><path d=\"M500 190 L598 118\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt6)\"/><text x=\"800\" y=\"123\" font-size=\"11\" text-anchor=\"start\" opacity=\".75\">가격 연동<\/text><rect x=\"600\" y=\"160\" width=\"190\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"695\" y=\"185\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">황산<\/text><text x=\"695\" y=\"201\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">SO2 회수 → 비료·SX-EW<\/text><path d=\"M500 190 L598 188\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt6)\"/><text x=\"800\" y=\"193\" font-size=\"11\" text-anchor=\"start\" opacity=\".75\">가격 연동<\/text><rect x=\"600\" y=\"230\" width=\"190\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"695\" y=\"255\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">안티모니·비스무스·인듐<\/text><text x=\"695\" y=\"271\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">게르마늄·갈륨<\/text><path d=\"M500 190 L598 258\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt6)\"/><text x=\"800\" y=\"263\" font-size=\"11\" text-anchor=\"start\" style=\"fill:var(--accent)\">희소금속 GPM 74~85%<\/text><rect x=\"600\" y=\"300\" width=\"190\" height=\"56\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"695\" y=\"325\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">메탈게인<\/text><text x=\"695\" y=\"341\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">판가·원가 시차<\/text><path d=\"M500 190 L598 328\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt6)\"/><text x=\"800\" y=\"333\" font-size=\"11\" text-anchor=\"start\" opacity=\".75\">일시적<\/text><text x=\"400\" y=\"300\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">1Q26 연결 영업이익 7,460억원<\/text><text x=\"400\" y=\"318\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">(YoY +175%, 별도 OPM 16.1%)<\/text><text x=\"400\" y=\"380\" font-size=\"12\" text-anchor=\"middle\">벤치마크 TC와 제련사 이익률 상관: 2007~18년 +0.85 → 2019~23년 −0.14<\/text><\/svg>", "cap": "**TC와 제련사 이익률의 상관계수가 +0.85(2007~18)에서 −0.14(2019~23)로 무너졌다는 것은 이익의 원천이 수수료에서 회수력으로 옮겨갔다는 뜻입니다.** 금·은 판매, 황산, 희소금속(분기 GPM 74~85%)이 본업 금속보다 더 많은 이익을 내고, 그 중 메탈게인만 일시적입니다. 같은 '제련사'라도 회수 가능한 원소 수와 회수율(예: 안티모니 약 70% → 90%)이 멀티플을 가릅니다."}, {"t": "table", "cols": ["금속", "주요 용도", "회수 출처", "공급 집중(중국)", "미국 수입의존"], "rows": [["안티모니", "난연재 약 49%, 납축전지·탄약 약 40%", "연 정광·폐납축전지", "약 36% (광산 4.0만t / 세계 11.0만t)", "91%"], ["인듐", "ITO·디스플레이, InP·반도체", "아연 광물(섬아연석) 부산물", "약 70% (정련)", "100%"], ["비스무스", "화학·의약·무독성 납 대체", "연·아연 제련 부산물", "약 82~88% (정련, 출처별 상이)", "92%"], ["갈륨", "화합물 반도체(IC 73%, 광전자 26%)", "보크사이트 정제·아연 처리 부산물", "약 99% (저순도 1차)", "100%"], ["게르마늄", "광섬유·적외선 광학·반도체", "아연·연-아연-동 황화광 부산물", "약 53% (정련)", "50% 초과"]], "title": "부산물 희소금속 한눈에", "note": "원출처 USGS·KOMIS. 고려아연 Crucible(미국 테네시) 계획 생산능력: 안티모니 2,600t·비스무스 430t·인듐 100t·갈륨 54t·게르마늄 44t(연간, 2029E)."}]}, {"h": "⑤ 희토류 — 채굴보다 분리가 난관", "tag": "확인", "note": "희토류 17종은 화학적 성질이 비슷해 한 광석에서 원소별로 나누려면 용매추출(SX)을 수십~수백 단 반복해야 합니다. 따라서 병목은 광산이 아니라 분리·정제와 자석 공정입니다.", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 330\" role=\"img\" aria-label=\"희토류 병목은 채굴이 아니라 분리·정제와 자석이며, 하류로 갈수록 중국 점유율이 올라간다\"><defs><marker id=\"a-mt5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"20\" y=\"44\" width=\"135\" height=\"62\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"88\" y=\"72\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">채굴<\/text><text x=\"88\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">경암·이온흡착 점토<\/text><path d=\"M155 75 L173 75\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt5)\"/><rect x=\"152\" y=\"27\" width=\"26\" height=\"14\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"165\" y=\"37\" font-size=\"10\" text-anchor=\"middle\">원광<\/text><rect x=\"175\" y=\"44\" width=\"135\" height=\"62\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"242\" y=\"72\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">선광·침출<\/text><text x=\"242\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">혼합 희토류 용액<\/text><path d=\"M310 75 L328 75\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt5)\"/><rect x=\"307\" y=\"27\" width=\"26\" height=\"14\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"320\" y=\"37\" font-size=\"10\" text-anchor=\"middle\">용액<\/text><rect x=\"330\" y=\"44\" width=\"135\" height=\"62\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--alert);fill-opacity:.12;stroke:var(--alert)\" stroke-width=\"1.4\"/><text x=\"398\" y=\"72\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">분리·정제<\/text><text x=\"398\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">SX 100~200단<\/text><path d=\"M465 75 L483 75\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt5)\"/><rect x=\"457\" y=\"27\" width=\"36\" height=\"14\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"475\" y=\"37\" font-size=\"10\" text-anchor=\"middle\">산화물<\/text><rect x=\"485\" y=\"44\" width=\"135\" height=\"62\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"552\" y=\"72\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">금속화<\/text><text x=\"552\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">NdPr·Dy·Tb 금속<\/text><path d=\"M620 75 L638 75\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt5)\"/><rect x=\"617\" y=\"27\" width=\"26\" height=\"14\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"630\" y=\"37\" font-size=\"10\" text-anchor=\"middle\">합금<\/text><rect x=\"640\" y=\"44\" width=\"135\" height=\"62\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"708\" y=\"72\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">자석 제조<\/text><text x=\"708\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">NdFeB 소결<\/text><path d=\"M775 75 L793 75\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt5)\"/><rect x=\"772\" y=\"27\" width=\"26\" height=\"14\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"785\" y=\"37\" font-size=\"10\" text-anchor=\"middle\">자석<\/text><rect x=\"795\" y=\"44\" width=\"135\" height=\"62\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"862\" y=\"72\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">수요<\/text><text x=\"862\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">EV·로봇·방산<\/text><text x=\"20\" y=\"140\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\">중국 점유율 (단계별, 영구자석 공급망 기준)<\/text><rect x=\"20\" y=\"158\" width=\"135\" height=\"14\" rx=\"3\" fill=\"var(--surface)\" stroke=\"none\"/><rect x=\"20\" y=\"158\" width=\"135\" height=\"14\" rx=\"3\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><rect x=\"20\" y=\"158\" width=\"78\" height=\"14\" rx=\"3\" fill=\"currentColor\" style=\"fill:var(--warn)\" fill-opacity=\".85\"/><text x=\"88\" y=\"192\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">58%<\/text><text x=\"242\" y=\"172\" font-size=\"12\" text-anchor=\"middle\" opacity=\".6\">—<\/text><rect x=\"330\" y=\"158\" width=\"135\" height=\"14\" rx=\"3\" fill=\"var(--surface)\" stroke=\"none\"/><rect x=\"330\" y=\"158\" width=\"135\" height=\"14\" rx=\"3\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><rect x=\"330\" y=\"158\" width=\"120\" height=\"14\" rx=\"3\" fill=\"currentColor\" style=\"fill:var(--alert)\" fill-opacity=\".85\"/><text x=\"398\" y=\"192\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">89%<\/text><rect x=\"485\" y=\"158\" width=\"135\" height=\"14\" rx=\"3\" fill=\"var(--surface)\" stroke=\"none\"/><rect x=\"485\" y=\"158\" width=\"135\" height=\"14\" rx=\"3\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><rect x=\"485\" y=\"158\" width=\"122\" height=\"14\" rx=\"3\" fill=\"currentColor\" style=\"fill:var(--alert)\" fill-opacity=\".85\"/><text x=\"552\" y=\"192\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">90%<\/text><rect x=\"640\" y=\"158\" width=\"135\" height=\"14\" rx=\"3\" fill=\"var(--surface)\" stroke=\"none\"/><rect x=\"640\" y=\"158\" width=\"135\" height=\"14\" rx=\"3\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><rect x=\"640\" y=\"158\" width=\"124\" height=\"14\" rx=\"3\" fill=\"currentColor\" style=\"fill:var(--alert)\" fill-opacity=\".85\"/><text x=\"708\" y=\"192\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">92%<\/text><text x=\"862\" y=\"172\" font-size=\"12\" text-anchor=\"middle\" opacity=\".6\">—<\/text><rect x=\"20\" y=\"220\" width=\"290\" height=\"60\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"165\" y=\"247\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">비중국 채굴<\/text><text x=\"165\" y=\"263\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">미국 16% · 미얀마 12% · 호주 7%<\/text><rect x=\"330\" y=\"220\" width=\"290\" height=\"60\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--alert);fill-opacity:.12;stroke:var(--alert)\" stroke-width=\"1.4\"/><text x=\"475\" y=\"247\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">중희토류 정제 Dy 98% · Tb 99%<\/text><text x=\"475\" y=\"263\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">회수율 중국 99.5% vs 서방 95~97%<\/text><rect x=\"640\" y=\"220\" width=\"290\" height=\"60\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"785\" y=\"247\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">고온 자석엔 Dy·Tb 8~12% 첨가<\/text><text x=\"785\" y=\"263\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">자석 원가의 30~50%<\/text><text x=\"480\" y=\"312\" font-size=\"12\" text-anchor=\"middle\">광산 증가에도 분리·금속화·인증 미비 시 유효 공급 불변<\/text><\/svg>", "cap": "**중국 점유율은 채굴 58% → 분리 89% → 금속 90% → 자석 92%로 하류로 갈수록 올라가고, 중희토류(Dy 98%·Tb 99%)에서 사실상 독점이 됩니다.** 중국은 100~200단 연속 라인과 30년 이상 운전 경험으로 회수율 99.5%(서방 95~97%)를 확보했고, 희토류 1톤당 산성폐수 20만L·방사성 폐기물을 감당하는 환경비용을 사회화했습니다. 광산을 새로 열어도 분리·금속화·자석·고객 인증이 따라오지 않으면 '유효 공급'은 늘지 않습니다."}, {"t": "steps", "items": [{"h": "채굴 — 경암과 점토", "meta": ["바스트네사이트·모나자이트", "이온흡착형 점토(IAC)"], "p": "경희토류는 주로 경암 광상(마운틴패스·바이윈어보·Mt Weld)에서, 중희토류는 중국 남부·미얀마의 이온흡착형 점토에서 나옵니다. 원소를 골라 캘 수 없어 경희토류 과잉과 중희토류 부족이 동시에 생깁니다.", "chk": "마운틴패스 정광의 NdPr 함유율 15.7%, 중희토류는 1.8%에 불과(그중 Dy·Tb 4%)."}, {"h": "선광·침출", "meta": ["혼합 희토류 용액"], "p": "광석을 농축한 뒤 산으로 녹여 여러 희토류가 섞인 용액을 만듭니다. 이 단계의 환경 부담(독성가스·산성폐수·토륨)이 비중국 원가의 20~25%를 차지합니다.", "chk": "인허가·폐기물 처리 계획이 사업 일정의 최대 변수."}, {"h": "분리·정제 (SX)", "meta": ["Mix-Settler 100~200단", "P507 추출제"], "p": "용액을 유기 추출제와 섞었다 가라앉히는 과정을 계단식으로 연결해 원소별로 조금씩 분리합니다. 설계보다 운전 노하우가 순도·수율을 좌우합니다.", "chk": "중국은 분리 기술·장비·인력까지 이중용도 수출통제(2025-10)로 묶었습니다."}, {"h": "금속화·합금", "meta": ["산화물 → 금속", "NdPr·Dy·Tb"], "p": "산화물을 전해·환원해 금속으로 만들고 철·붕소와 합금합니다. 비중국 금속화 역량이 가장 얇은 구간입니다.", "chk": "LS에코에너지 Dy·Tb 금속화(2027 목표) 등 국내 진입 시도."}, {"h": "자석 제조", "meta": ["분말 3~3.5μm", "자장 성형·1,080℃ 소결"], "p": "합금을 미세 분말로 만들어 자장 속에서 성형·소결·가공·코팅·착자합니다. 고온 EV 모터용은 Dy·Tb를 8~12% 첨가하거나 입계확산으로 사용량을 줄입니다.", "chk": "고객(자동차 OEM) 인증 단계와 Dy·Tb의 비중국 장기계약 여부."}]}, {"t": "table", "cols": ["항목", "디스프로슘(Dy)", "테르븀(Tb)", "사마륨(SmCo)"], "rows": [["스핀-궤도 결합", "매우 강함", "가장 강함", "—"], ["첨가 효과", "보자력·고온 자화 유지 향상", "Dy보다 강한 자화 방향 고정", "퀴리온도 자체를 약 700~850℃로 상승"], ["실무 용도", "일반 NdFeB 보자력 강화", "고온·고이방성 고급 자석", "고온 내열 자석(방산·항공)"], ["단점", "자화 세기 감소", "희귀·고가(Nd 대비 약 20배)", "가공성·가격 불리"]], "title": "NdFeB 자석에 첨가하는 희토류의 역할"}]}, {"h": "⑥ 리튬은 두 갈래 — 염호와 경암", "blocks": [{"t": "grid", "cols": 2, "items": [{"h": "염호(염수)형", "p": ["지하 염수를 증발시키거나 직접추출(DLE)로 리튬을 뽑아 탄산·수산화리튬을 만듭니다. 원료를 자체 조달해 가격 상승 시 영업레버리지가 크고 현금원가가 낮습니다.", "포스코아르헨티나 1공장 C1 원가 $5,391/LCE톤(1Q26), 2026년 3월 가동률 70%로 첫 월간 흑자. 아르헨티나 RIGI는 법인세를 35→25%로 낮췄습니다."], "tag": "확인"}, {"h": "경암(스포듀민·레피돌라이트)형", "p": ["광석을 SC6(산화리튬 6%) 정광으로 만든 뒤 주로 중국 전환공장에서 화학제품으로 바꿉니다. 중국 탄산리튬 생산의 50% 이상이 이 경로입니다.", "정광 가격이 제품보다 빨리 오르면 전환 마진이 줄어 감산 압력이 됩니다(2026년 상반기 스포듀민 +68% vs 탄산리튬 +34%). 짐바브웨는 2027-01부터 정광 수출을 전면 금지합니다."], "tag": "확인"}]}, {"t": "callout", "text": "리튬 가격이 장기한계비용(LRMC, 약 $12,000/t)을 밑돌면 고원가 경암 공급이 먼저 퇴출되며 바닥이 형성됩니다. 2025년 6월 $8,100 저점 이후 CATL 젠샤워 광산 중단·짐바브웨 규제·ESS 수요로 2026년 1월 $23,000까지 반등한 경로가 이 원리를 보여줍니다.", "title": "가격 바닥은 원가 커브가 형성"}]}, {"h": "⑦ 특수합금 — 진공용해에서 적층제조까지", "note": "니켈에 크롬·코발트·몰리브덴·알루미늄·티타늄·레늄을 정밀 배합해 1,000℃ 가까운 온도에서도 형태를 유지하게 만든 소재입니다. 공정 자체보다 '인증'이 진입장벽입니다.", "blocks": [{"t": "chain", "items": [{"no": "01", "name": "원료 배합(Ni+Cr·Co·Re)"}, {"no": "02", "name": "VIM 진공 1차 용해"}, {"no": "03", "name": "ESR·VAR 재용해"}, {"no": "04", "name": "단조·압연 / 가스분무 분말"}, {"no": "05", "name": "정밀주조·적층제조"}, {"no": "06", "name": "엔진 부품 인증"}]}, {"t": "p", "text": "항공엔진 터빈 블레이드·디스크, 데이터센터용 가스터빈 Hot Section, 로켓엔진 연소실이 주 수요처입니다. 글로벌 초합금 시장은 45.3만톤(2021)에서 98.9만톤(2031E, CAGR 8.3%)으로 커질 전망이고 수요의 52%가 항공우주, 27%가 산업용 가스터빈입니다(GMI). 신규 공장 건설에 18~36개월, 가스터빈·엔진 회전체 인증에 24~48개월이 추가로 걸려 제트엔진 리드타임이 최대 60주로 늘어난 공급자 우위 시장이 유지됩니다."}, {"t": "p", "text": "판가는 Base Price(가공·인증 가치) + Surcharge(니켈·코발트 연동)로 구성돼 원재료 변동은 고객에게 넘어갑니다. 적층제조(AM)가 원재료비 구조를 어떻게 바꾸는지는 07 딥다이브 '특수합금' 편의 도식을 참고합니다."}]}]}, "metal": {"title": "금속 사전", "h2": "금속 사전 — 47개 품목", "en": "Metals Dictionary", "lede": "금속의 가격은 '어디서 누가 만들고(공급 구조), 무엇이 값을 정하는가(가격 결정 변수)'로 거의 설명됩니다. 이 사전은 철강재·원료·특수합금·비철·귀금속·희소금속·희토류·배터리 금속을 같은 틀로 정리해, 뉴스에 나온 품목이 **밸류체인 어디에 있고 중국 의존도가 얼마이며 최근 가격이 어디까지 왔는지**를 30초 안에 확인하도록 만들었습니다.", "sections": [{"h": "사전 활용법 — 여섯 칸의 동일 순서 반복", "blocks": [{"t": "brief", "items": [{"k": "밸류체인 위치", "v": "원료에서 최종 제품까지 어느 단계인지. 02 공정 백과 도식과 대조합니다."}, {"k": "공급 구조", "v": "생산국·기업 집중도와 중국 점유율. 수출통제 대상 여부는 칩(태그)으로 표시했습니다."}, {"k": "가격 결정 변수", "v": "가격을 움직이는 1차 변수. 스프레드형(철강)인지 병목형(비철)인지 정책형(희토류)인지가 드러납니다."}, {"k": "최근 가격·지표", "v": "자료에 나온 최신 수치와 시점. 수치가 없으면 '없음'이라고 적었습니다 — 추정해 채우지 않았습니다."}, {"k": "체크포인트", "v": "딜 검토 때 이 품목에 노출된 기업에 던질 질문."}]}]}, {"h": "품목 사전", "blocks": [{"t": "dict", "placeholder": "품목·원소·기  stroke-width=\"1.4\" marker-end=\"url(#a-mt7)\"/><rect x=\"493\" y=\"222\" width=\"42\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"514\" y=\"233\" font-size=\"11\" text-anchor=\"middle\">원가 층<\/text><rect x=\"570\" y=\"180.39999999999998\" width=\"110\" height=\"119.60000000000001\" rx=\"2\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"625\" y=\"245\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">원료 46<\/text><rect x=\"570\" y=\"50.39999999999998\" width=\"110\" height=\"130.0\" rx=\"2\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"625\" y=\"120\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">스프레드 50<\/text><text x=\"625\" y=\"318\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">판가 구성<\/text><line x1=\"560\" y1=\"300\" x2=\"690\" y2=\"300\" stroke=\"currentColor\" stroke-opacity=\".4\" stroke-width=\"1\"/><text x=\"625\" y=\"30\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">판가 ≈ 96만원/t<\/text><text x=\"625\" y=\"46\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">(5월 말 열연 유통가 96~98만원)<\/text><rect x=\"730\" y=\"80\" width=\"180\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"820\" y=\"105\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">스프레드에서<\/text><text x=\"820\" y=\"121\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">고정비·탄소비용 차감<\/text><rect x=\"730\" y=\"190\" width=\"180\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--ok);fill-opacity:.12;stroke:var(--ok)\" stroke-width=\"1.4\"/><text x=\"820\" y=\"215\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--ok)\">판매량↑ → 고정비 분산<\/text><text x=\"820\" y=\"231\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">영업레버리지<\/text><path d=\"M682 110 L728 108\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt7)\"/><path d=\"M820 136 L820 188\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt7)\"/><rect x=\"823\" y=\"156\" width=\"53\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"826\" y=\"167\" font-size=\"11\" text-anchor=\"start\">물량 효과<\/text><text x=\"460\" y=\"356\" font-size=\"12\" text-anchor=\"middle\">2H26 가정(철광석 $95·원료탄 $260) 기준 — 스프레드는 1H 대비 약 +5만원 확대<\/text><\/svg>", "cap": "**업계 가정(철광석 $95·원료탄 $260)에서 2H26 투입원가는 톤당 약 46만원, 스프레드는 약 50만원으로 1H 대비 5만원 넓어집니다.** 이 50만원에서 고정비·탄소비용을 빼야 영업이익이 되므로, 판매량이 늘어 고정비가 분산되는 구간에서 이익률이 매출보다 빠르게 개선됩니다. 판가 쪽 레버는 무역구제, 원가 쪽 레버는 원료 하향 안정이라는 점이 2026년 '상저하고' 논리의 전부입니다."}, {"t": "mods", "open": 1, "items": [{"name": "고로 롤마진(스프레드)", "formula": "고로 스프레드 = 열연(판재) 판가 − (철광석 약 1.5~1.6t + 원료탄 약 0.7~0.8t) × 톤당 단가 × 환율", "paras": ["고로사는 철광석·원료탄을 사서 판재를 판매합니다. 원료 투입 원단위는 업계 통상 근사치이며, 제품 믹스(자동차강판·전기강판 비중)와 판매량(고정비 흡수)이 실제 이익률을 가릅니다. 원료가는 국제가에 연동되지만 판가는 지역별 수입 경쟁에 좌우되므로, 2026년처럼 무역구제로 판가가 원료와 따로 오르면 스프레드가 확대됩니다. 반대로 원료가 급등 시 조선·자동차향 계약가는 포뮬러로 1~2분기 후행 반영됩니다."], "fields": [{"k": "민감도", "v": "판매량 증가는 고정비 분산으로 이익률을 매출 증가율보다 크게 개선(영업레버리지). 업계 추정으로는 2H26 투입원가 톤당 46만원(철광석 $95·원료탄 $260 가정)에서 스프레드가 1H 대비 +5만원 확대된 약 50만원을 제시"}, {"k": "사례", "v": "한국 열연-철광석 스프레드: 3Q25 $420 → 4Q25 $388 → 1Q26 $384 → 2Q26(6/16) $450/톤. 중국은 3Q25 $303 → 4Q25 $288로 한국보다 낮음(Metal Bulletin·스틸데일리, 확인)"}], "pill": "고로"}, {"name": "전기로 스크랩 스프레드", "formula": "철근 스프레드 = 철근 유통가 − 철스크랩 단가 × 1.0~1.2t (− 전력비·전극봉)", "paras": ["전기로는 스크랩을 녹여 철근·형강을 만듭니다. 고로와 달리 배치(batch) 공정이라 하루 차지 수·조업일을 줄여 감산하기 쉽고 감가상각이 많이 진행돼 고정비가 낮습니다. 따라서 봉형강 가격은 수요보다 제강사의 공급 조절(감산·설비폐쇄·수출)에 더 민감하게 반응합니다."], "fields": [{"k": "민감도", "v": "가동률이 56%에서 86%로 올라갈 경우(수출 증가+구조조정 20~25% 감축 가정) 고정비 부담이 크게 줄어든다는 업계 추정. 스크랩 가격 급등기에는 판가 전가 시차만큼 스프레드가 축소"}, {"k": "사례", "v": "철근 유통가 2025.11 66만원 → 2026.02 75만원(+14%), 스프레드 27만원 → 35만원(+30%)(스틸데일리, 확인)"}], "pill": "전기로"}]}]}, {"h": "TC/RC — 정광 희소 시 수수료 마이너스 전환", "tag": "확인", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 940 400\" role=\"img\" aria-label=\"정광이 귀해지면 TC가 0 아래로 떨어져 제련소의 수수료 수입이 사라지고, 이익은 Free Metal과 부산물로 옮겨간다\"><defs><marker id=\"a-mt8\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"20\" y=\"40\" width=\"170\" height=\"70\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"105\" y=\"72\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">광산<\/text><text x=\"105\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">정광 4t (품위 25%)<\/text><rect x=\"385\" y=\"40\" width=\"180\" height=\"70\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"475\" y=\"72\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">제련소<\/text><text x=\"475\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">구리 1t 회수<\/text><rect x=\"750\" y=\"40\" width=\"170\" height=\"70\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"835\" y=\"72\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">시장·수요가<\/text><text x=\"835\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">LME 가격 100%<\/text><path d=\"M190 58 L383 58\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt8)\"/><rect x=\"252\" y=\"40\" width=\"70\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"287\" y=\"51\" font-size=\"11\" text-anchor=\"middle\">정광 4t 인도<\/text><path d=\"M383 94 L192 94\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\" marker-end=\"url e=\"11\" text-anchor=\"middle\" opacity=\".75\">회수율 − payable<\/text><text x=\"353\" y=\"250\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">구조적<\/text><rect x=\"476\" y=\"174\" width=\"210\" height=\"58\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"581\" y=\"200\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">③ 부산물<\/text><text x=\"581\" y=\"216\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">황산·금·은·희소금속<\/text><text x=\"581\" y=\"250\" font-size=\"11\" text-anchor=\"middle\" style=\"fill:var(--accent)\">구조적·가격 변동<\/text><rect x=\"704\" y=\"174\" width=\"210\" height=\"58\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"809\" y=\"200\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">④ 메탈게인<\/text><text x=\"809\" y=\"216\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">판가·원가 시차<\/text><text x=\"809\" y=\"250\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">일시적<\/text><text x=\"20\" y=\"285\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\">구리 벤치마크 TC ($/t)<\/text><rect x=\"40\" y=\"306.4\" width=\"44\" height=\"73.60000000000001\" rx=\"2\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"62\" y=\"301\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">92<\/text><text x=\"62\" y=\"395\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">2015<\/text><rect x=\"120\" y=\"309.6\" width=\"44\" height=\"70.4\" rx=\"2\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"142\" y=\"305\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">88<\/text><text x=\"142\" y=\"395\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">2023<\/text><rect x=\"200\" y=\"316.0\" width=\"44\" height=\"64.0\" rx=\"2\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"222\" y=\"311\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">80<\/text><text x=\"222\" y=\"395\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">2024<\/text><rect x=\"280\" y=\"363.0\" width=\"44\" height=\"17.0\" rx=\"2\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"302\" y=\"358\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">21.25<\/text><text x=\"302\" y=\"395\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">2025<\/text><text x=\"382\" y=\"375\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">0<\/text><text x=\"382\" y=\"395\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">2026<\/text><line x1=\"30\" y1=\"380\" x2=\"440\" y2=\"380\" stroke=\"currentColor\" stroke-opacity=\".4\" stroke-width=\"1\"/><rect x=\"500\" y=\"300\" width=\"420\" height=\"70\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--alert);fill-opacity:.12;stroke:var(--alert)\" stroke-width=\"1.4\"/><text x=\"710\" y=\"332\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">현물 TC −$227.5/t (2026-08-14)<\/text><text x=\"710\" y=\"348\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">황산 고가가 마이너스 TC를 지탱, 감산 지연<\/text><\/svg>", "cap": "**TC는 광산이 제련소에 주는 가공비라, 정광이 부족하면 제련소끼리 정광을 사려고 경쟁하면서 0 아래로 떨어집니다.** 벤치마크 TC는 2015년 $92에서 2026년 $0이 됐고 현물은 −$227.5까지 내려갔습니다. 수수료가 사라진 제련소가 계속 돌아가는 이유는 ②Free Metal과 ③부산물(특히 황산·금·은) 때문이며, 따라서 제련사 실적은 TC가 아니라 부산물 가격과 회수율로 읽어야 합니다."}, {"t": "mods", "open": 1, "items": [{"name": "비철 제련사 이익 방정식", "formula": "제련 이익 = TC/RC(수수료) + Free Metal[(실제 회수율 − payable 비율) × 금속가] + 부산물(금·은·황산·희소금속) + 지역 프리미엄 + 메탈게인(판가·원가 시차)", "paras": ["제련사는 광산에서 정광을 사서 금속을 판매합니다. 정광 대금은 함유 금속가의 일정 비율(payable: 아연 85%, 연 95%, 동 96%)에서 TC/RC를 뺀 값인데, 실제 회수율이 payable보다 높으면 그 차이(Free Metal)가 원가 없는 매출이 됩니다. 구리 TC가 0달러가 된 지금은 수수료 수입이 사라졌고 부산물과 Free Metal이 이익의 대부분입니다. 과거 아연 벤치마크 TC와 제련사 이익률의 상관계수는 2007~2018년 +0.85였으나 2019~2023년 −0.14로 설명력이 사라졌습니다."], "fields": [{"k": "민감도", "v": "금·은 가격 급등은 일회성 메탈게인과 구조적 부산물 이익을 동시에 만듭니다. 한 분석은 1Q26 제련사 실적을 Metal Gain(일시적), Free Metal(구조적), 귀금속 판매량(일부 지속), 희소금속(구조적이나 가격 변동)으로 분해할 것을 권고"}, {"k": "사례", "v": "고려아연 1Q26 연결 영업이익 7,460억원(YoY +175%), 별도 OPM 16.1%, 별도 매출 중 금·은 65% 초과, 희소금속 GPM 74.3%. LS MnM은 영업이익의 약 80%가 부산물 기여로 추정(추정)"}], "pill": "제련"}, {"name": "광산 마진(현금원가 커브)", "formula": "광산 이익 = (금속가 − AISC 또는 C1 현금원가) × 판매량, C1 = 채굴·노무·운송 직접현금원가 − 부산물 크레딧", "paras": ["광산은 가격 수용자(price taker)입니다. 품위가 낮아질수록 같은 구리를 얻기 위해 더 많은 광석·에너지·물이 필요해 원가 곡선이 위로 이동합니다. 금속 가격은 장기적으로 한계 광산의 현금원가(바닥)와 신규 광산을 유인하는 가격(Incentive Price, 구리 $10,000~12,000/t) 사이에서 움직인다는 것이 '금속가격 사이클' 프레임입니다."], "fields": [{"k": "민감도", "v": "공급 차질기엔 가격 레버리지가 극대화: Southern Copper 1Q26 구리 현금원가가 부산물 차감 후 파운드당 −$0.11(전년 +$0.77), 영업이익률 58.3%. 반대로 황산 가격 급등은 SX-EW 광산 원가를 올림(Antofagasta 원가의 약 5%)"}, {"k": "사례", "v": "남미 주요 광산 품위 2000년 1.2~1.3% → 2025년 0.6%, 광산 건설비 톤당 $8,000~10,000(10년 전) → $15,000~20,000(확인)"}], "pill": "광산"}]}, {"t": "table", "cols": ["요인", "1Q26에 작동한 내용", "지속성 판단"], "rows": [["Metal Gain", "금·은 가격 급등, 판가·원가 시차", "일시적"], ["Free Metal", "payable과 회수율 차이", "구조적"], ["귀금속 판매량", "은 판매량 증가, 고품위 원료", "일부 지속"], ["희소금속·부산물", "희소금속, 황산, 부산물 회수", "구조적이나 가격 변동"], ["환율·자회사", "우호적 환율, 자회사 실적 개선", "변동성 존재"]], "title": "제련사 분기 실적 분해 틀 (1Q26 사례)"}]}, {"h": "래깅과 메탈게인 — 일회성 이익을 걸러내라", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 920 340\" role=\"img\" aria-label=\"가공업체는 3개월 전에 산 구리를 지금 가격에 팔기 때문에 상승기엔 메탈게인, 하락기엔 메탈로스가 생긴다\"><defs><marker id=\"a-mt9\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><line x1=\"80\" y1=\"290\" x2=\"880\" y2=\"290\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1\"/><line x1=\"80\" y1=\"290\" x2=\"80\" y2=\"40\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1\"/><text x=\"84\" y=\"36\" font-size=\"11\" text-anchor=\"start\" opacity=\".75\">구리 가격<\/text><text x=\"876\" y=\"310\" font-size=\"11\" text-anchor=\"end\" opacity=\".75\">시간<\/text><path d=\"M80 262 C 200 240, 250 215, 300 200 S 420 120, 480 110 S 560 82, 600 88 S 680 120, 720 140 S 820 205, 880 222\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" style=\"stroke:var(--accent)\"/><line x1=\"300\" y1=\"200\" x2=\"480\" y2=\"200\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/><rect x=\"472\" y=\"110\" width=\"16\" height=\"90\" style=\"fill:var(--ok)\" fill=\"currentColor\" fill-opacity=\".35\"/><text x=\"300\" y=\"222\" font-size=\"11\" text-anchor=\"middle\">① 매입(재고 입고)<\/text><text x=\"390\" y=\"190\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">② 가공 약 3개월<\/text><text x=\"496\" y=\"150\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--ok)\">③ 판매 → 메탈게인<\/text><line x1=\"600\" y1=\"88\" x2=\"720\" y2=\"88\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/><rect x=\"712\" y=\"88\" width=\"16\" height=\"52\" style=\"fill:var(--alert)\" fill=\"currentColor\" fill-opacity=\".35\"/><text x=\"600\" y=\"76\" font-size=\"11\" text-anchor=\"middle\">매입<\/text><text x=\"736\" y=\"124\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--alert)\">판매 → 메탈로스(역래깅)<\/text><circle cx=\"300\" cy=\"200\" r=\"4\" fill=\"currentColor\"/><circle cx=\"480\" cy=\"110\" r=\"4\" fill=\"currentColor\"/><circle cx=\"600\" cy=\"88\" r=\"4\" fill=\"currentColor\"/><circle cx=\"720\" cy=\"140\" r=\"4\" fill=\"currentColor\"/><rect x=\"120\" y=\"60\" width=\"230\" height=\"50\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"235\" y=\"82\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">풍산 1Q26 영업이익 902억원<\/text><text x=\"235\" y=\"98\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">중 메탈게인 약 700억원(추정)<\/text><text x=\"480\" y=\"328\" font-size=\"12\" text-anchor=\"middle\">가공마진(정상 이익)과 메탈게인 분리 필요 — 사이클 고점 실적에 멀티플 적용 오류 방지<\/text><\/svg>", "cap": "**가공업체 이익 중 메탈게인은 구리 가격이 오르는 동안만 생기고 방향이 바뀌면 같은 크기의 손실로 돌아옵니다.** 풍산 1Q26 영업이익의 약 78%가 메탈게인으로 추정된 사례처럼, 가격 상승기 실적에 P/E를 그대로 곱하면 공모가가 사이클 고점에 맞춰집니다. 전선사는 에스컬레이션 조항으로 원가를 넘기므로 래깅이 작고, 수주잔고의 마진이 본질입니다."}, {"t": "mods", "items": [{"name": "가공업체(신동·전선) 이익", "formula": "가공 이익 = 가공비(롤마진) × 물량 + 메탈게인(구리가 상승 × 재고일수) − 헤지 파생손익, 전선은 에스컬레이션으로 원가 연동", "paras": ["신동·황동봉 업체는 구리를 사서 가공 판매하는데 입고와 판매 사이 약 3개월 시차가 있어 구리 가격이 오르면 저가 재고가 고가 판가에 팔려 이익이 늘어납니다(래깅 효과). 이는 일회성이라 하락 반전 시 반대로 손실이 됩니다. 전선사는 계약에 원자재 연동(에스컬레이션) 조항이 있어 구리가 변동을 고객에게 넘기고 수주잔고의 마진이 본질입니다."], "fields": [{"k": "민감도", "v": "구리 가격 상승기 가공업체 이익에는 재고평가이익이 섞이므로 하반기 메탈 이익을 보수적으로 제외하고 정상 이익을 추정하는 방식이 쓰입니다. 원화 강세는 원화 환산 메탈게인을 희석"}, {"k": "사례", "v": "풍산 1Q26 연결 영업이익 902억원 중 메탈게인 약 700억원(추정). 대창 상반기 영업이익 462억원으로 2025년 연간(515억원)에 근접, 헤지 파생손실은 금융비용 반영"}], "pill": "가공"}, {"name": "특수합금 Base + Surcharge", "formula": "판가 = 기본단가(Base Price, 가공·인증 가치) + Surcharge(니켈·코발트 등 원재료 변동분 연동)", "paras": ["특수합금사는 원재료 변동을 Surcharge로 고객에게 그대로 넘기고, 기본단가에서 가공 마진을 법니다. 제트엔진 리드타임이 60주 이상으로 늘어난 공급자 우위 시장이라 기본단가 인상과 믹스 개선이 동시에 일어납니다. 신규 진입에는 공장 건설 18~36개월과 가스터빈 Hot Section·엔진 회전체 인증 24~48개월이 추가로 필요합니다."], "fields": [{"k": "민감도", "v": "원재료 급변동 시 Surcharge 반영 시차만큼 일시 마진 변동. 신규 공장은 인증 전 고정비만 발생하는 램프업 적자 구간이 존재"}, {"k": "사례", "v": "Carpenter SAO 부문 Surcharge 제외 영업이익률 30.5%, EBITDA 마진 36.0%(FY4Q25), ATI HPMC EBITDA 마진 23.7%(2Q25). 2020~25 이익 CAGR Carpenter 67%·ATI 35%(회사 IR, 확인)"}], "pill": "특수합금"}]}]}, {"h": "거래소 재고와 지역 프리미엄 — 재고는 '위치'가 관건", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 360\" role=\"img\" aria-label=\"미국 관세 기대가 COMEX 프리미엄을 만들면 실물이 미국 창고로 이동해 LME 재고가 줄고 시장이 실제보다 타이트해 보인다\"><defs><marker id=\"a-mt10\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"20\" y=\"40\" width=\"160\" height=\"62\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"100\" y=\"68\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">관세 기대<\/text><text x=\"100\" y=\"84\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">정련동 232조 검토<\/text><path d=\"M180 71 L208 71\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt10)\"/><rect x=\"210\" y=\"40\" width=\"160\" height=\"62\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"290\" y=\"68\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">COMEX 프리미엄<\/text><text x=\"290\" y=\"84\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">COMEX &gt; LME<\/text><path d=\"M370 71 L398 71\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt10)\"/><rect x=\"400\" y=\"40\" width=\"160\" height=\"62\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"480\" y=\"68\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">실물 이동<\/text><text x=\"480\" y=\"84\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">비미국 창고 → 미국<\/text><path d=\"M560 71 L588 71\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt10)\"/><rect x=\"590\" y=\"40\" width=\"160\" height=\"62\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"670\" y=\"68\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">재고 편중<\/text><text x=\"670\" y=\"84\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">COMEX↑ · LME↓<\/text><path d=\"M750 71 L778 71\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" marker-end=\"url(#a-mt10)\"/><rect x=\"780\" y=\"40\" width=\"160\" height=\"62\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--warn);fill-opacity:.12;stroke:var(--warn)\" stroke-width=\"1.4\"/><text x=\"860\" y=\"68\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">타이트 착시<\/text><text x=\"860\" y=\"84\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">가격 변동성 확대<\/text><rect x=\"60\" y=\"170\" width=\"220\" height=\"64\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"170\" y=\"199\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">LME 창고<\/text><text x=\"170\" y=\"215\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">아시아·유럽<\/text><rect x=\"370\" y=\"170\" width=\"220\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"480\" y=\"199\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">COMEX 창고<\/text><text x=\"480\" y=\"215\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">미국<\/text><rect x=\"680\" y=\"170\" width=\"220\" height=\"64\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"790\" y=\"199\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">SHFE 창고<\/text><text x=\"790\" y=\"215\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">중국<\/text><path d=\"M280 192 L368 192\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" marker-end=\"url(#a-mt10)\" style=\"stroke:var(--accent)\"/><rect x=\"297\" y=\"174\" width=\"53\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"324\" y=\"185\" font-size=\"11\" text-anchor=\"middle\" style=\"fill:var(--accent)\">차익 물량<\/text><path d=\"M368 214 L282 214\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".65\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-mt10)\"/><rect x=\"265\" y=\"246\" width=\"119\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"324\" y=\"257\" font-size=\"11\" text-anchor=\"middle\">관세 확정·무산 시 역류<\/text><text x=\"790\" y=\"258\" font-size=\"11\" text-anchor=\"middle\" opacity=\".8\">on-warrant 1.9만→29만t<\/text><text x=\"790\" y=\"274\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">(2026-02, 약 15배)<\/text><rect x=\"60\" y=\"290\" width=\"400\" height=\"52\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"260\" y=\"313\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">3대 거래소 합산 124만t (2026-03, 23년 최고)<\/text><text x=\"260\" y=\"329\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">재고는 총량보다 위치가 가격 결정<\/text><rect x=\"500\" y=\"290\" width=\"400\" height=\"52\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" style=\"fill:var(--warn);fill-opacity:.12;stroke:var(--warn)\" stroke-width=\"1.4\"/><text x=\"700\" y=\"313\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">미국 알루미늄 프리미엄 $832 → $2,470/t<\/text><text x=\"700\" y=\"329\" font-size=\"11\" text-anchor=\"middle\" opacity=\".75\">관세 이전 → 2026-03<\/text><\/svg>", "cap": "**3대 거래소 재고가 23년 최고(124만톤)인데도 LME가 타이트해 보이는 것은 재고가 관세를 앞둔 미국(COMEX)으로 이동했기 때문입니다.** 재고의 총량보다 위치가 스프레드와 변동성을 만들고, 관세가 확정되거나 무산되면 재고가 역류하며 반대 방향 충격이 옵니다. 알루미늄도 관세로 미국 프리미엄이 톤당 $832에서 $2,470으로 뛰었습니다."}, {"t": "p", "text": "LME 가격이 올라도 한국 가공업체의 원가는 LME에 지역 프리미엄(양산 프리미엄 등)을 더한 값입니다. 선물 곡선이 콘탱고(원월물이 비쌈)로 바뀌면 재고 보유 유인이 생겨 현물 긴장이 풀렸다는 신호이고, 백워데이션(근월물이 비쌈)은 현물 부족 신호입니다. 2026년 4월 구리 조정은 재고 증가와 콘탱고 전환이 겹친 결과였습니다."}]}, {"h": "그 밖의 이익 방정식 — 리튬·희토류·강관·탄소", "blocks": [{"t": "mods", "items": [{"name": "리튬 생산자 마진", "formula": "리튬 영업이익 = (LCE 판가 − C1 현금원가 − 감가상각·로열티) × 판매량, 광석형은 (탄산리튬가 − 스포듀민 원가 − 전환비)", "paras": ["염호형은 원료를 자체 조달해 가격 상승 시 영업레버리지가 크고, 광석 전환형은 스포듀민 매입가에 따라 마진이 결정됩니다. 가격이 장기한계비용(LRMC, 약 $12,000/t)을 밑돌면 고원가 공급이 퇴출되며 바닥이 형성됩니다. 아르헨티나 RIGI(법인세 35→25%, 외화보유 허용)처럼 제도가 세후 현금흐름을 바꾸기도 합니다."], "fields": [{"k": "민감도", "v": "업계는 POSCO 리튬사업의 목표 달성 조건으로 리튬가 $20,000/t 이상, 아르헨티나 가동률 95%·C1 $5,500, 광석 정제 OPM 9~10%를 제시. 리튬가 $25/kg 지지 시 2028년 리튬사업 영업이익 약 5,179억원(OPM 19%) 추정"}, {"k": "사례", "v": "포스코아르헨티나 1공장 C1 $5,391/LCE톤(1Q26, 가동률 97% 월 기준), 2026년 3월 가동률 70%로 첫 월간 흑자. 2025년 리튬사업 영업손실 약 4,400억원(회사 자료, 확인)"}], "pill": "리튬"}, {"name": "희토류 가격하한·오프테이크 모델", "formula": "정부 보장 수익 = max(시장가, 하한가 $110/kg) × NdPr 판매량 − (시장가 > 하한 시 초과분의 30% 정부 환수) + 자석 10년 100% 오프테이크 + 최소 EBITDA 보장", "paras": ["중국은 경쟁자가 등장하면 증산·덤핑으로 가격을 떨어뜨려 퇴출시켜 왔습니다(Molycorp 파산 2015). 미국은 이 경제성 문제를 정부가 메우는 구조를 만들었습니다: 미 국방부가 MP Materials에 4억달러 우선주(지분 약 15%), 1.5억달러 대출, NdPr 하한 $110/kg(10년), 10X 자석공장 전량구매와 최소 EBITDA 1.4억달러를 보장했습니다. 이 모델은 Lynas USA(약 96백만달러 LOI), USA Rare Earth(최대 15.8억달러 LOI)로 확장됐습니다."], "fields": [{"k": "민감도", "v": "하한가가 시장가(2025.10 약 $57/kg)의 약 2배라 사실상 이익 바닥이 정책으로 고정. 대신 정권 교체·예산 변동이 최대 리스크"}, {"k": "사례", "v": "MP Materials 2025년 순이익 940만달러로 흑자전환(가격하한 효과), 1Q26 NdPr 생산 917톤(+63%), 판매 1,006톤(+117%)(회사 공시, 확인)"}], "pill": "희토류"}, {"name": "수출 강관(OCTG) 채산성", "formula": "대미 수출 마진 ≈ 미국 OCTG 판가 − 국내 열연 원가 − 조관·나사 가공비 − 운임 − 232조 관세(50%) ± 원/달러 효과", "paras": ["강관사는 열연을 사서 유정관을 만들어 미국에 판매합니다. 50% 관세는 수출 채산성을 깎지만, 동시에 저가 수입재를 막아 미국 내 OCTG 가격을 올리는 효과가 있습니다. 미국 현지 생산능력을 가진 업체는 관세 없이 미국 판가를 누립니다. 수요는 리그 수(유가 3개월 후행)와 DUC 재고 소진 속도가 결정합니다."], "fields": [{"k": "민감도", "v": "2020년 이후 원유 리그 수의 유가 반응계수 5.92 대비 2026년 1.79로 둔화(E&P 자본규율). 원화 강세·3분기 비수기는 일시 감익 요인"}, {"k": "사례", "v": "북미 OCTG P110 현물 숏톤당 $2,625(2026.09 첫째 주, 2주 +10%, 연초 대비 +31.4%). 세아제강 2Q26 영업이익률 7.1%(추정, 확인)"}], "pill": "강관"}, {"name": "탄소비용(K-ETS·CBAM)", "formula": "K-ETS 비용 = max(0, 실제 배출량 − 무상할당량 − 이월분) × 배출권가 / CBAM 비용 ≈ EU향
