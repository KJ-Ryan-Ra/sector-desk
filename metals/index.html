<title>철강·비철금속 리서치 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --ground:#FBFAF7; --surface:#FFFFFF; --raised:#F3F4F0; --sunken:#EFF1EC;
  --line:#E0E4DC; --line-strong:#C9D0C6;
  --ink:#17211F; --ink-2:#3A4744; --ink-3:#55625D; --ink-4:#626F6A;
  --accent:#A04E2A; --accent-soft:color-mix(in srgb,var(--accent) 10%,transparent); --accent-line:color-mix(in srgb,var(--accent) 34%,transparent);
  --ok:#1D7A5C; --warn:#8A6300; --alert:#A2304A; --dim:#55625D;
  --shadow:0 1px 2px rgba(23,33,31,.06),0 8px 24px -12px rgba(23,33,31,.18);
  --rail:252px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0C1116; --surface:#131A21; --raised:#1A232B; --sunken:#0F161C;
    --line:#253039; --line-strong:#33424E;
    --ink:#DCE5EA; --ink-2:#BCCAD2; --ink-3:#9DAEB9; --ink-4:#8DA0AB;
    --accent:#E3906A; --ok:#3DB08E; --warn:#D2A63A; --alert:#D9738A; --dim:#9DAEB9;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0C1116; --surface:#131A21; --raised:#1A232B; --sunken:#0F161C;
  --line:#253039; --line-strong:#33424E;
  --ink:#DCE5EA; --ink-2:#BCCAD2; --ink-3:#9DAEB9; --ink-4:#8DA0AB;
  --accent:#E3906A; --ok:#3DB08E; --warn:#D2A63A; --alert:#D9738A; --dim:#9DAEB9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;line-height:1.3;letter-spacing:-.011em}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
b{font-weight:600;color:var(--ink)}

.shell{display:flex;min-height:100vh;align-items:flex-start}
.rail{width:var(--rail);flex:0 0 var(--rail);position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brand .mark{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--accent);font-weight:500;display:flex;align-items:center;gap:7px;line-height:1.4}
.brand .mark::before{content:"";width:7px;height:7px;background:var(--accent);border-radius:50%;flex:none}
.brand h1{font-size:18px;margin-top:9px;letter-spacing:-.02em;font-weight:700}
.brand .sub{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.5}
.nav{flex:1;overflow-y:auto;padding:10px 10px 20px}
.nav-group{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.15em;color:var(--ink-4);padding:14px 10px 6px;text-transform:uppercase}
.nav button{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-family:inherit;font-size:13.5px;line-height:1.4}
.nav button:hover{background:var(--raised);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button .k{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);flex:none;width:16px}
.nav button[aria-current="true"] .k{color:var(--accent)}
.desks{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px}
.desks .dl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-4);width:100%;padding:2px 4px 4px}
.desks a{font-size:12px;text-decoration:none;color:var(--ink-3);border:1px solid var(--line);border-radius:14px;padding:3px 9px;white-space:nowrap}
.desks a:hover{color:var(--accent);border-color:var(--accent-line)}
.desks a.cur{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);pointer-events:none}
.railfoot{padding:12px 16px;border-top:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}

.main{flex:1;min-width:0;padding:0 0 96px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:11px 40px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.legend .li{display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.legend .sw{width:9px;height:9px;border-radius:2px;flex:none}
.stamps{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.stamp{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);white-space:nowrap}
.tsw{display:inline-flex;gap:2px;padding:2px;background:var(--sunken);border:1px solid var(--line);border-radius:7px}
.tsb{padding:4px 9px;border:0;border-radius:5px;background:transparent;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:11px;cursor:pointer}
.tsb[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.pane{display:none;padding:34px 40px 0;max-width:1220px}
.pane.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pane.on{animation:none}}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;font-weight:500}
.pane > h2{font-size:29px;margin-top:8px;letter-spacing:-.025em;font-weight:700}
.lede{color:var(--ink-2);font-size:15.5px;max-width:74ch;margin-top:11px;line-height:1.72}
.sec{margin-top:44px}
.sec > h3{font-size:17.5px;display:flex;align-items:center;gap:11px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.sec > h3::before{content:"";width:3px;height:15px;background:var(--accent);border-radius:2px;flex:none}
.note{color:var(--ink-2);font-size:14px;line-height:1.72;margin-top:12px;max-width:78ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.card h4{font-size:14.5px;margin-bottom:8px}
.card p{font-size:13.5px;color:var(--ink-2);line-height:1.68}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kg{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.kg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kg{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px;display:flex;flex-direction:column;gap:5px}
.kpi .lab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.kpi .val{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;color:var(--accent)}
.kpi .cap{font-size:11.5px;color:var(--ink-3);line-height:1.5}

.tag{display:inline-flex;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 7px;border-radius:4px;border:1px solid;white-space:nowrap;vertical-align:middle}
.t-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 34%,transparent);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.t-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 34%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.t-alert{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 34%,transparent);background:color-mix(in srgb,var(--alert) 10%,transparent)}
.t-dim{color:var(--ink-3);border-color:var(--line-strong);background:var(--raised)}
.t-acc{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-2);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--raised);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.62}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--raised)}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
td.tk{font-family:"IBM Plex Mono",monospace;color:var(--ink-3);font-size:12.5px;white-space:nowrap}
td.nm{font-weight:600;white-space:nowrap}
.tcap{font-size:13.5px;font-weight:600;margin:22px 0 8px}
.tnote{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);margin-top:8px;line-height:1.6}

.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:14px 17px;border-radius:0 8px 8px 0;font-size:14.5px;color:var(--ink-2);line-height:1.76;max-width:88ch}

.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 6px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink-3);border-radius:20px;padding:5px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ground);font-weight:500}
.search{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 13px;font-family:inherit;font-size:14px}
.search:focus{border-color:var(--accent);outline:none}
select.search{max-width:200px}
.count{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}

/* chain */
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 2px 10px;margin-top:16px}
.fnode{flex:0 0 150px;background:var(--sunken);border:1px solid var(--line-strong);border-radius:9px;padding:10px 12px;font-size:13px}
.fnode .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--accent)}
.fnode .t{font-weight:600;line-height:1.35;margin-top:2px}
.farr{flex:0 0 22px;display:grid;place-items:center;color:var(--ink-4);font-size:14px}
.vc{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:14px}
.vcx{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px;border-top:2px solid var(--accent)}
.vcx .r{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--accent);margin-bottom:5px}
.vcx h4{font-size:14px;margin-bottom:5px}
.vcx p{font-size:13.2px;color:var(--ink-2);line-height:1.66}
.vcx .co{font-size:12px;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.6}

/* modules */
.mods{display:grid;gap:10px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mod > summary{padding:14px 18px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mod > summary::-webkit-details-marker{display:none}
.mod > summary::after{content:"+";margin-left:auto;font-family:"IBM Plex Mono",monospace;color:var(--ink-4);font-size:16px}
.mod[open] > summary::after{content:"−"}
.mod > summary:hover{background:var(--raised)}
.mname{font-size:15px;font-weight:600}
.men{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-4)}
.mod .body{padding:4px 18px 18px;border-top:1px solid var(--line)}
.mod dl{margin:0}
.mod dt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4);margin:14px 0 4px}
.mod dd{margin:0;font-size:14.3px;color:var(--ink-2);line-height:1.74;max-width:86ch}
.pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 7px;border-radius:3px;background:var(--raised);border:1px solid var(--line);color:var(--ink-3)}
.dplede{font-size:15.5px;color:var(--ink);line-height:1.78;margin:16px 0 4px;padding:2px 0 2px 14px;border-left:3px solid var(--accent);max-width:84ch;font-weight:450}
.dpn p{margin-top:12px;font-size:14.5px;color:var(--ink-2);line-height:1.84;max-width:82ch}
.dpul{margin:10px 0 0;padding-left:18px}
.dpul li{font-size:14px;color:var(--ink-2);line-height:1.74;margin-bottom:8px;max-width:84ch}
.dpkr{margin-top:18px;padding:13px 16px;background:var(--sunken);border:1px solid var(--line);border-radius:9px;font-size:14px;color:var(--ink-2);line-height:1.72}
.dpkr .l{color:var(--accent);font-weight:600;margin-right:6px}
.formula{font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;padding:10px 13px;margin-top:10px;color:var(--ink);line-height:1.6;white-space:pre-wrap}

/* bars */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.chart h4{font-size:14.5px}
.chart .u{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.bar{display:grid;grid-template-columns:minmax(90px,34%) 1fr 72px;gap:10px;align-items:center}
.bar .bl{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.bar .bt{position:relative;height:12px;background:var(--sunken);border-radius:3px;border:1px solid var(--line)}
.bar .bf{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:2px}
.bar .bf.neg{background:var(--alert)}
.bar .bf.est{background:repeating-linear-gradient(135deg,var(--accent) 0 4px,color-mix(in srgb,var(--accent) 55%,transparent) 4px 7px)}
.bar .bf.neg.est{background:repeating-linear-gradient(135deg,var(--alert) 0 4px,color-mix(in srgb,var(--alert) 55%,transparent) 4px 7px)}
.bar .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink-4)}
.bar .bv{font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.chart .cn{font-size:12px;color:var(--ink-3);margin-top:12px;line-height:1.6;padding-top:10px;border-top:1px solid var(--line)}

/* timeline */
.tl{margin-top:18px;border-left:1px solid var(--line-strong);margin-left:6px}
.tli{position:relative;padding:0 0 20px 22px}
.tli::before{content:"";position:absolute;left:-5px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--dim)}
.tli.pos::before{border-color:var(--ok)} .tli.neg::before{border-color:var(--alert)}
.tli .d{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.tli h4{font-size:14.5px;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tli p{font-size:13.8px;color:var(--ink-2);margin-top:4px;line-height:1.7;max-width:84ch}
.bb{list-style:none;margin:10px 0 0;padding:0}
.bb li{font-size:13.8px;color:var(--ink-2);line-height:1.66;padding:8px 0;border-bottom:1px dashed var(--line)}
.bb li:last-child{border-bottom:0}

.ck li{list-style:none;display:flex;gap:9px;align-items:flex-start;font-size:13.8px;color:var(--ink-2);line-height:1.62;padding:6px 0}
.ck{margin:6px 0 0;padding:0}
.ck input{margin-top:4px;accent-color:var(--accent);flex:none}
.more{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-family:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
.more:hover{border-color:var(--accent);color:var(--accent)}
.evt{display:grid;grid-template-columns:104px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.evt .d{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.evt .n{font-size:14px;font-weight:600}
.evt .m{font-size:13px;color:var(--ink-3);margin-top:2px;line-height:1.55}
.evt.past .d{color:var(--ink-4)}
.cloud{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

@media (max-width:900px){
  .desks{display:none}
  .shell{flex-direction:column}
  .rail{position:static;width:100%;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{display:flex;overflow-x:auto;padding:8px;gap:4px}
  .nav-group{display:none}
  .nav button{width:auto;white-space:nowrap}
  .nav button .k{display:none}
  .desks{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px}
.desks .dl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-4);width:100%;padding:2px 4px 4px}
.desks a{font-size:12px;text-decoration:none;color:var(--ink-3);border:1px solid var(--line);border-radius:14px;padding:3px 9px;white-space:nowrap}
.desks a:hover{color:var(--accent);border-color:var(--accent-line)}
.desks a.cur{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);pointer-events:none}
.railfoot{display:none}
  .topbar{padding:10px 16px}
  .pane{padding:24px 16px 0}
  .pane > h2{font-size:24px}
  .bar{grid-template-columns:1fr 60px}
  .bar .bl{grid-column:1/-1}
  .evt{grid-template-columns:1fr;gap:2px}
}
</style>

<div class="shell">
<aside class="rail">
  <div class="brand">
    <div class="mark" id="b-eng"></div>
    <h1 id="b-title"></h1>
    <div class="sub" id="b-sub"></div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="desks" id="desks"></div>
  <div class="railfoot" id="foot"></div>
</aside>
<main class="main">
  <div class="topbar">
    <div class="legend">
      <span class="li"><span class="sw" style="background:var(--ok)"></span>확인 (실적·실측)</span>
      <span class="li"><span class="sw" style="background:var(--warn)"></span>추정 (전망)</span>
      <span class="li"><span class="sw" style="background:var(--alert)"></span>미확인 (원문 불일치)</span>
    </div>
    <div class="stamps">
      <span class="stamp" id="cut"></span>
      <div class="tsw" role="group" aria-label="화면 테마">
        <button class="tsb" data-t="dark" aria-pressed="false">다크</button>
        <button class="tsb" data-t="light" aria-pressed="false">라이트</button>
      </div>
    </div>
  </div>
  <div id="panes"></div>

비탄력성과 태양광·AI 산업수요(60% 이상)로 급등했다. 국내에서는 제련 부산물로 은을 대량 생산하는 제련사의 이익 구조를 바꿨다.", "driver": "달러·실질금리, 은 리스 레이트, SGE-COMEX 스프레드, ETF 흐름, 태양광 설치량", "cycle": "2025년 은 +161%, 2026년 1월 온스당 100달러 돌파 후 전쟁 국면에서 조정. 금은비율 약 40(역사 평균 70)", "kr": "고려아연, LS MnM(비상장)"}, {"name": "희토류·핵심광물", "desc": "희토류(NdPr·Dy·Tb), 희소금속(갈륨·게르마늄·인듐·안티모니·텅스텐), 리튬·니켈·코발트를 포함한다. 문제는 매장량이 아니라 중국이 쥔 분리·정제·자석 공정과 반복되는 수출통제이며, 미국은 가격하한·지분투자·비축으로 비중국 공급망을 국가 주도로 재건 중이다.", "driver": "중국 수출허가·쿼터, 미국 가격하한(NdPr $110/kg)·Project Vault, 역외 가격 프리미엄, 리튬 재고·자원국 수출통제", "cycle": "가격 사이클보다 정책·지정학 이벤트 사이클. 리튬은 2025년 중반 바닥 후 ESS 수요로 계단식 반등", "kr": "POSCO홀딩스, 포스코인터내셔널, 고려아연, LS에코에너지, 제이에스링크, 성림첨단산업"}, {"name": "특수합금·소재", "desc": "니켈계 초내열합금(항공엔진·가스터빈·로켓), 항공용 알루미늄, 전기강판·알루미늄박 등 인증이 필요한 고부가 소재. 제트엔진 리드타임 60주 이상, 신규 진입에 공장 18~36개월+인증 24~48개월이 걸리는 공급자 우위 시장이다.", "driver": "항공기 인도·엔진 MRO, 가스터빈(데이터센터 전력) 수주, 우주 발사 횟수, 니켈 Surcharge", "cycle": "경기보다 항공·방산·발전 설비 사이클. 업종 내 멀티플 서열 철강 < 리튬·구리 < 특수합금", "kr": "세아베스틸지주, 에이치브이엠, 스피어, 태웅, 삼아알미늄"}], "howto": [{"title": "처음 배울 때 순서", "body": "01 산업 지도에서 '철강=스프레드, 비철=공급병목' 이분법을 먼저 잡고, 03 수익 구조의 롤마진·TC/RC·Free Metal 공식을 손으로 한 번 계산해 본다. 그다음 05 딥다이브의 '중국 구조조정 2016 vs 반내권', 'TC 붕괴와 제련 경제학', '희토류 밸류체인 병목' 세 편을 읽고, 04 핵심 지표에서 주간으로 볼 지표 5개(중국 조강·수출, 국내 열연 유통가, 구리 현물 TC, 탄산리튬, NdPr 역외가)를 골라 두면 된다."}, {"title": "딜 검토할 때", "body": "금속 기업 IPO·메자닌 검토 시 먼저 이익이 '가격(메탈게인·래깅)'에서 나오는지 '구조(부산물 회수·인증·수주잔고)'에서 나오는지 분해한다(07 사이클, 09 밸류에이션). 희토류·자석·특수합금처럼 정책 옵션가치로 높은 멀티플이 붙는 영역은 10 체크포인트의 '정부 계약이 실제 집행 단계인가, MOU 단계인가', '고객 인증 완료 여부' 질문을 반드시 통과시켜야 한다. 11 유니버스에서 동종 상장사의 사업 포인트를 비교해 피어셋을 잡는다."}, {"title": "숫자를 인용하기 전에", "body": "금속 가격은 기준(LME 3개월물·현물, COMEX, SHFE, 중국 내수가, 역외가)에 따라 수십 % 차이가 난다. 특히 희토류는 중국 내수가와 역외가가 수배~수십 배 벌어져 있고(산화이트륨 $18 vs $270/kg), 구리 수급 전망은 ICSG가 6개월 만에 '15만t 부족'에서 '9.6만t 과잉'으로 바꿨다. 인용 시 시점·거래소·출처를 반드시 붙이고, 태그가 '추정'이면 리포트 전망치, '미확인'이면 원문 간 불일치가 있다는 뜻이다."}, {"title": "이 자료의 한계", "body": "국내 증권사 철강·비철 리포트 35건(2025-10-13 ~ 2026-09-18, 에너지 폴더의 구리·강관·희토류 리포트 3건 포함)을 재구성했다. 발간 주체 특성상 국내 상장사 관점과 업황 개선 쪽 톤 국 감산·수출규제·ESS 수요로 3배 가까이 반등했다.", "chain": "염수/스포듀민 정광 → 황산·인산리튬 → 정제 → 탄산·수산화리튬 → 양극재·LFP → EV·ESS 셀", "driver": "ESS 출하(2025년 315GWh → 2026E 450~750GWh), CATL 젠샤워 광산 가동, 짐바브웨 정광 수출금지(2027.01), 중국 광물자원법·VAT 환급 폐지", "check": "C1 원가(포스코아르헨티나 1Q26 $5,391/LCE톤) 대비 판가, 가동률 램프업, 기관별 수요 전망 편차(최대 3배)", "kr": "POSCO홀딩스(포스코아르헨티나·포스코필바라리튬솔루션), 포스코퓨처엠"}, {"group": "리튬·배터리금속", "name": "스포듀민 정광", "en": "Spodumene Concentrate (SC6)", "what": "산화리튬 6% 품위의 경암형 리튬 정광으로 중국 탄산리튬 생산의 50% 이상이 이를 원료로 한다. 원석 가격이 제품보다 빨리 오르면 정제업체 마진이 줄어 감산 압력이 된다.", "chain": "호주·브라질·짐바브웨 광산 → SC6 정광 → 중국 전환공장 → 리튬 화합물", "driver": "짐바브웨 수출 규제(글로벌 정광의 약 8~10%), 호주 휴면광산 재가동", "check": "탄산리튬-스포듀민 스프레드(2026년 상반기 스포듀민 +68% vs 탄산리튬 +34%)", "kr": "POSCO홀딩스(MinRes 중간지주 30%, 연 27만톤 오프테이크)"}, {"group": "리튬·배터리금속", "name": "황산니켈·MHP", "en": "Nickel Sulfate / MHP", "what": "니켈 광석을 고압산침출해 만든 중간재(MHP)로 배터리용 황산니켈을 생산한다. 미국 세액공제의 비PFE(비중국) 요건(2030년 25% → 2033년 50%)으로 비중국 니켈 밸류체인 가치가 커졌다.", "chain": "니켈 광석 → HPAL → MHP → 황산니켈 → 전구체 → 하이니켈 양극재", "driver": "인도네시아 RKAB 쿼터(2026년 −31%), 미국 OBBBA 비PFE 요건", "check": "인니 제련소 인수(LS MnM 78%, 2026.11) 이후 원료 조달·양산 일정(2026말~2027초)", "kr": "LS(LS MnM·LLBS)"}, {"group": "리튬·배터리금속", "name": "우라늄(옐로케이크)", "en": "U3O8 / LEU·HALEU", "what": "우라늄 정광으로 변환·농축을 거쳐 원전 연료가 된다. 러시아산 수입금지(2028.01 전면)와 SMR용 HALEU(5~19.75%) 수요로 세 번째 상승 사이클이 거론된다.", "chain": "광산 → 옐로케이크 → 변환 → 농축(LEU/HALEU) → 연료 가공", "driver": "원전 신증설·수명연장(미국 2050년 400GW 목표), 러시아산 금지, 황산(습식 채굴) 조달", "check": "농축 역량 편중(HALEU는 Tenex 사실상 독점)", "kr": "국내 직접 연관 상장사 제한적(해외 Cameco)"}], "economics": {"lede": "금속 기업은 '무엇을 사서 무엇을 파느냐'에 따라 돈 버는 공식이 완전히 다르다. 철강사는 원료와 제품 사이 스프레드, 제련사는 수수료+회수 초과분+부산물, 광산은 가격과 원가의 차이, 가공업체는 가공비+재고 시차, 특수소재는 인증이 만든 가격결정력으로 번다. 2025~26년에는 여기에 **관세·탄소비용·정부 가격하한**이라는 제도 변수가 공식 안으로 들어왔다.", "models": [{"name": "고로 롤마진(스프레드)", "formula": "고로 스프레드 = 열연(판재) 판가 − (철광석 약 1.5~1.6t + 원료탄 약 0.7~0.8t) × 톤당 단가 × 환율", "explain": "고로사는 철광석·원료탄을 사서 판재를 판다. 원료 투입 원단위는 업계 통상 근사치이며, 제품 믹스(자동차강판·전기강판 비중)와 판매량(고정비 흡수)이 실제 이익률을 가른다. 원료가는 국제가에 연동되지만 판가는 지역별 수입 경쟁에 좌우되므로, 2026년처럼 무역구제로 판가가 원료와 따로 오르면 스프레드가 확대된다. 반대로 원료가 급등 시 조선·자동차향 계약가는 포뮬러로 1~2분기 후행 반영된다.", "sensitivity": "판매량 증가는 고정비 분산으로 이익률을 매출 증가율보다 크게 개선(영업레버리지). 리포트는 2H26 투입원가 톤당 46만원(철광석 $95·원료탄 $260 가정)에서 스프레드가 1H 대비 +5만원 확대된 약 50만원을 제시", "example": "한국 열연-철광석 스프레드: 3Q25 $420 → 4Q25 $388 → 1Q26 $384 → 2Q26(6/16) $450/톤. 중국은 3Q25 $303 → 4Q25 $288로 한국보다 낮음(Metal Bulletin·스틸데일리, 확인)"}, {"name": "전기로 스크랩 스프레드", "formula": "철근 스프레드 = 철근 유통가 − 철스크랩 단가 × 1.0~1.2t (− 전력비·전극봉)", "explain": "전기로는 스크랩을 녹여 철근·형강을 만든다. 고로와 달리 배치(batch) 공정이라 하루 차지 수·조업일을 줄여 감산하기 쉽고 감가상각이 많이 진행돼 고정비가 낮다. 그래서 봉형강 가격은 수요보다 제강사의 공급 조절(감산·설비폐쇄·수출)에 더 민감하게 반응한다.", "sensitivity": "가동률이 56%에서 86%로 올라갈 경우(수출 증가+구조조정 20~25% 감축 가정) 고정비 부담이 크게 줄어든다는 리포트 추정. 스크랩 가격 급등기에는 판가 전가 시차만큼 스프레드가 축소", "example": "철근 유통가 2025.11 66만원 → 2026.02 75만원(+14%), 스프레드 27만원 → 35만원(+30%)(스틸데일리, 확인)"}, {"name": "비철 제련사 이익 방정식", "formula": "제련 이익 = TC/RC(수수료) + Free Metal[(실제 회수율 − payable 비율) × 금속가] + 부산물(금·은·황산·희소금속) + 지역 프리미엄 + 메탈게인(판가·원가 시차)", "explain": "제련사는 광산에서 정광을 사서 금속을 판다. 정광 대금은 함유 금속가의 일정 비율(payable: 아연 85%, 연 95%, 동 96%)에서 TC/RC를 뺀 값인데, 실제 회수율이 payable보다 높으면 그 차이(Free Metal)가 원가 없는 매출이 된다. 구리 TC가 0달러가 된 지금은 수수료 수입이 사라졌고 부산물과 Free Metal이 이익의 대부분이다. 과거 아연 벤치마크 TC와 제련사 이익률의 상관계수는 2007~2018년 +0.85였으나 2019~2023년 −0.14로 설명력이 사라졌다.", "sensitivity": "금·은 가격 급등은 일회성 메탈게인과 구조적 부산물 이익을 동시에 만든다. 리포트는 1Q26 제련사 실적을 Metal Gain(일시적), Free Metal(구조적), 귀금속 판매량(일부 지속), 희소금속(구조적이나 가격 변동)으로 분해할 것을 권고", "example": "고려아연 1Q26 연결 영업이익 7,460억원(YoY +175%), 별도 OPM 16.1%, 별도 매출 중 금·은 65% 초과, 희소금속 GPM 74.3%. LS MnM은 영업이익의 약 80%가 부산물 기여로 추정(리포트 추정)"}, {"name": "광산 마진(현금원가 커브)", "formula": "광산 이익 = (금속가 − AISC 또는 C1 현금원가) × 판매량, C1 = 채굴·노무·운송 직접현금원가 − 부산물 크레딧", "explain": "광산은 가격 수용자(price taker)다. 품위가 낮아질수록 같은 구리를 얻기 위해 더 많은 광석·에너지·물이 필요해 원가 곡선이 위로 이동한다. 금속 가격은 장기적으로 한계 광산의 현금원가(바닥)와 신규 광산을 유인하는 가격(Incentive Price, 구리 $10,000~12,000/t) 사이에서 움직인다는 것이 '금속가격 사이클' 프레임이다.", "sensitivity": "공급 차질기엔 가격 레버리지가 극대화: Southern Copper 1Q26 구리 현금원가가 부산물 차감 후 파운드당 −$0.11(전년 +$0.77), 영업이익률 58.3%. 반대로 황산 가격 급등은 SX-EW 광산 원가를 올림(Antofagasta 원가의 약 5%)", "example": "남미 주요 광산 품위 2000년 1.2~1.3% → 2025년 0.6%, 광산 건설비 톤당 $8,000~10,000(10년 전) → $15,000~20,000(리포트 정리, 확인)"}, {"name": "가공업체(신동·전선) 이익", "formula": "가공 이익 = 가공비(롤마진) × 물량 + 메탈게인(구리가 상승 × 재고일수) − 헤지 파생손익, 전선은 에스컬레이션으로 원가 연동", "explain": "신동·황동봉 업체는 구리를 사서 가공 판매하는데 입고와 판매 사이 약 3개월 시차가 있어 구리 가격이 오르면 저가 재고가 고가 판가에 팔려 이익이 늘어난다(래깅 효과). 이는 일회성이라 하락 반전 시 반대로 손실이 된다. 전선사는 계약에 원자재 연동(에스컬레이션) 조항이 있어 구리가 변동을 고객에게 넘기고 수주잔고의 마진이 본질이다.", "sensitivity": "구리 가격 상승기 가공업체 이익에는 재고평가이익이 섞이므로 리포트는 하반기 메탈 이익을 보수적으로 제외하고 정상 이익을 추정하는 방식을 소개. 원화 강세는 원화 환산 메탈게인을 희석", "example": "풍산 1Q26 연결 영업이익 902억원 중 메탈게인 약 700억원(리포트 추정). 대창 상반기 영업이익 462억원으로 2025년 연간(515억원)에 근접, 헤지 파생손실은 금융비용 반영"}, {"name": "특수합금 Base + Surcharge", "formula": "판가 = 기본단가(Base Price, 가공·인증 가치) + Surcharge(니켈·코발트 등 원재료 변동분 연동)", "explain": "특수합금사는 원재료 변동을 Surcharge로 고객에게 그대로 넘기고, 기본단가에서 가공 마진을 번다. 제트엔진 리드타임이 60주 이상으로 늘어난 공급자 우위 시장이라 기본단가 인상과 믹스 개선이 동시에 일어난다. 신규 진입에는 공장 건설 18~36개월과 가스터빈 Hot Section·엔진 회전체 인증 24~48개월이 추가로 필요하다.", "sensitivity": "원재료 급변동 시 Surcharge 반영 시차만큼 일시 마진 변동. 신규 공장은 인증 전 고정비만 발생하는 램프업 적자 구간이 존재", "example": "Carpenter SAO 부문 Surcharge 제외 영업이익률 30.5%, EBITDA 마진 36.0%(FY4Q25), ATI HPMC EBITDA 마진 23.7%(2Q25). 2020~25 이익 CAGR Carpenter 67%·ATI 35%(회사 IR, 확인)"}, {"name": "리튬 생산자 마진", "formula": "리튬 영업이익 = (LCE 판가 − C1 현금원가 − 감가상각·로열티) × 판매량, 광석형은 (탄산리튬가 − 스포듀민 원가 − 전환비)", "explain": "염호형은 원료를 자체 조달해 가격 상승 시 영업레버리지가 크고, 광석 전환형은 스포듀민 매입가에 따라 마진이 결정된다. 가격이 장기한계비용(LRMC, 약 $12,000/t)을 밑돌면 고원가 공급이 퇴출되며 바닥이 형성된다. 아르헨티나 RIGI(법인세 35→25%, 외화보유 허용)처럼 제도가 세후 현금흐름을 바꾸기도 한다.", "sensitivity": "리포트는 POSCO 리튬사업의 목표 달성 조건으로 리튬가 $20,000/t 이상, 아르헨티나 가동률 95%·C1 $5,500, 광석 정제 OPM 9~10%를 제시. 리튬가 $25/kg 지지 시 2028년 리튬사업 영업이익 약 5,179억원(OPM 19%) 추정", "example": "포스코아르헨티나 1공장 C1 $5,391/LCE톤(1Q26, 가동률 97% 월 기준), 2026년 3월 가동률 70%로 첫 월간 흑자. 2025년 리튬사업 영업손실 약 4,400억원(회사 자료, 확인)"}, {"name": "희토류 가격하한·오프테이크 모델", "formula": "정부 보장 수익 = max(시장가, 하한가 $110/kg) × NdPr 판매량 − (시장가 > 하한 시 초과분의 30% 정부 환수) + 자석 10년 100% 오프테이크 + 최소 EBITDA 보장", "explain": "중국은 경쟁자가 등장하면 증산·덤핑으로 가격을 떨어뜨려 퇴출시켜 왔다(Molycorp 파산 2015). 미국은 이 경제성 문제를 정부가 메우는 구조를 만들었다: 미 국방부가 MP Materials에 4억달러 우선주(지분 약 15%), 1.5억달러 대출, NdPr 하한 $110/kg(10년), 10X 자석공장 전량구매와 최소 EBITDA 1.4억달러를 보장했다. 이 모델은 Lynas USA(약 96백만달러 LOI), USA Rare Earth(최대 15.8억달러 LOI)로 확장됐다.", "sensitivity": "하한가가 시장가(2025.10 약 $57/kg)의 약 2배라 사실상 이익 바닥이 정책으로 고정. 대신 정권 교체·예산 변동이 최대 리스크", "example": "MP Materials 2025년 순이익 940만달러로 흑자전환(가격하한 효과), 1Q26 NdPr 생산 917톤(+63%), 판매 1,006톤(+117%)(회사 공시, 확인)"}, {"name": "수출 강관(OCTG) 채산성", "formula": "대미 수출 마진 ≈ 미국 OCTG 판가 − 국내 열연 원가 − 조관·나사 가공비 − 운임 − 232조 관세(50%) ± 원/달러 효과", "explain": "강관사는 열연을 사서 유정관을 만들어 미국에 판다. 50% 관세는 수출 채산성을 깎지만, 동시에 저가 수입재를 막아 미국 내 OCTG 가격을 올리는 효과가 있다. 미국 현지 생산능력을 가진 업체는 관세 없이 미국 판가를 누린다. 수요는 리그 수(유가 3개월 후행)와 DUC 재고 소진 속도가 결정한다.", "sensitivity": "2020년 이후 원유 리그 수의 유가 반응계수 5.92 대비 2026년 1.79로 둔화(E&P 자본규율). 원화 강세·3분기 비수기는 일시 감익 요인", "example": "북미 OCTG P110 현물 숏톤당 $2,625(2026.09 첫째 주, 2주 +10%, 연초 대비 +31.4%). 세아제강 2Q26 영업이익률 7.1%(리포트 추정, 확인)"}, {"name": "탄소비용(K-ETS·CBAM)", "formula": "K-ETS 비용 = max(0, 실제 배출량 − 무상할당량 − 이월분) × 배출권가 / CBAM 비용 ≈ EU향 수출량 × 내재배출(tCO2/t) × (EU ETS가 − 국내 탄소가격) × (1 − 무상할당 비율)", "explain": "고로는 톤당 2.0~2.3tCO2, 전기로는 약 0.5tCO2를 배출해 고로 비중이 높을수록 탄소비용이 크다(한국 고로 비중 72%). K-ETS 제4기(2026~30)는 할당총량을 2026년 11% 줄이고 이후 연 3.5%씩 축소해 POSCO·현대제철이 할당 초과 구간에 진입한다. CBAM은 2026년부터 비용이 발생하지만 초기 3년 무상할당 90% 이상으로 충격이 제한되고, 2029년 이후 무상할당 축소가 가팔라지며 2035년 전면 폐지된다.", "sensitivity": "리포트는 원/유로 1,600원, 톤당 2tCO2, 탄소가격 80유로 가정 시 한국 CBAM 연간 비용 약 8,200억원(POSCO 약 3,700억원), 전면 도입 시 최대 1.9조원(관세율 환산 최대 29%)을 제시. 국내 배출권 톤당 1만원 기준 POSCO 연간 구매비용은 약 500억원 수준", "example": "EU CBAM 인증서 가격 1Q26 75.3유로/톤 확정. EU ETS 2020년초 20유로 → 약 80유로. 국내 KAU 약 1만원/톤(한국거래소·EU 집행위, 확인)"}]}, "indicators": [{"group": "수급", "name": "중국 조강 생산(월간·누적 YoY)", "def": "중국 월간 조강 생산량과 전년 대비 증감률. 감산 정책의 실제 이행을 보여주는 가장 직접적인 실물지표", "where": "중국 국가통계국, CISA(순별 일평균 은 2016년 8억톤에서 2019년 9.9억톤으로 오히려 늘었다는 평가가 있다. 당시 국내 고로사 P/B는 0.6~0.8배까지 재평가됐다.", "2025년 이후의 '반내권(反內卷)'은 합법 설비의 실제 생산량과 설비 교체를 규칙으로 묶는다. 2026년 5월 18일 개정된 설비 치환 규정은 치환비율을 전국 1.5:1로 통일하고 승인 유효기간을 24개월로 명확히 했으며, M&A에는 1.25:1 우대비율을 주고 기업 간 생산능력 지표 거래는 2년 유예 후(2028년 5월) 폐지한다. 여기에 초저배출 개조 미완료 설비(약 2억톤)에 대한 전기·수도요금 차등, 2026년 1월 수출허가제, 철강업 전국 ETS 편입이 겹쳐 '버티지 못하는 회사부터' 퇴출시키는 구조다.", "리포트들의 공통 결론은 '업황 추가 악화를 막는 방어 장치'라는 것이다. 설비가 폐쇄되지 않고 잉여로 남는 한 수요 회복 시 공급이 빠르게 늘 수 있고, OECD는 신규 증설이 폐쇄 물량을 상쇄해 중국 생산능력이 2028년까지 최대 3,860만톤 순증할 수 있다고 경고한다. 반면 40년 이상 노후 고로 약 1.8억톤이 1.5:1로 치환되면 장기 공급과잉률이 30%에서 15~20%로 낮아질 잠재력도 있다. 또 2026년 4월 중국 철강업계가 흑자 전환하자 자율감산 원칙(삼정삼불요)에서 이탈하는 죄수의 딜레마가 재현돼, 실질 감산 속도는 제한적이라는 시각이 우세하다."], "table": {"cols": ["구분", "1차 공급측 개혁(2016~2018)", "반내권 구조조정(2025~)"], "rows": [["방식", "지방정부 행정명령식 설비 폐쇄", "치환비율·환경·에너지 기준으로 자연 퇴출"], ["통제 대상", "생산'능력'(불법 설비 퇴출)", "합법 설비의 생산'량'과 설비 교체"], ["수요 환경", "강한 글로벌 수요+부동산 호황", "부동산 장기 침체, 내수 보통 이하"], ["가격 경로", "V자 급등, 업계 전반 이익 레벨업", "바닥 다지기+완만한 회복, 대형·국유사 중심 차별화"], ["핵심 장치", "감산 기한·물량 하달", "1.5:1 치환, 24개월 유효기간, M&A 1.25:1, 지표거래 폐지(2028.05), 수출허가제, ETS"], ["국내 철강 시사점", "고로사 P/B 0.6~0.8배 재평가", "동일 폭 리레이팅 어려움, 고부가·저탄소·대형사 선별"]]}, "bullets": ["중국 국유기업이 조강 생산의 약 63%를 차지해 정책 실행력의 기반이 됨(국유 초저배출 개조 96% vs 민영 63%)", "CR10(상위 10사 집중도) 2024년 51%로 목표 60~70%에 미달 → M&A 우대가 집중도 상승 수단", "14차 5개년 목표 대비 전기로 비중 약 10.4%(목표 15%), 스크랩 비중 20.8%(목표 30%)로 미달", "15차 5개년(2026~30)은 총량 감산 수치 없이 '신품질 생산력'·고급강 확대에 방점", "확인 지표: 월간 조강·순수출 역성장 지속, 실제 설비 폐쇄·M&A 건수"], "kr": "POSCO홀딩스·현대제철의 판재 스프레드 회복 폭과 밸류에이션 저점 통과 여부가 중국 구조조정의 실제 이행 강도에 달려 있다. IPO 관점에서 국내 철강 피어의 멀티플이 2015년식으로 재평가될 것이라는 가정은 보수적으로 다뤄야 한다."}, {"group": "철강 사이클·통상", "title": "보호무역이 만든 철강 가격의 지역 분절화", "period": "2025.06~2026.09", "lede": "과거에는 중국 가격이 곧 글로벌 가격이었지만, 미국 50% 관세·EU 쿼터 축소·한국 반덤핑으로 철강 가격이 지역별로 따로 움직이는 '뉴노멀'이 자리 잡았다.", "body": ["미국은 2025년 2월 232조 철강·알루미늄 관세를 25%로 재개한 뒤 국내 가격 상승으로 효과가 상쇄되자 6월 50%로 인상했고, 한국산에 적용되던 쿼터제도 폐지했다. 파생상품 관세는 매년 1·5·9월 정기적으로 대상을 넓히는 시스템으로 설계돼 1차(2025.08) 신청 467개 중 407개(90%)가 승인됐고, 2차에는 688개 품목이 접수됐으며 2026년 4월 6일 파생제품 확대가 발효됐다. 그 결과 미국 열연 유통가는 톤당 900달러 중반까지 올랐고 Nucor·Steel Dynamics 주가는 2026년 +56~58%를 기록했다.", "EU는 2026년 6월 만료되는 세이프가드를 대체해 7월부터 무관세 쿼터를 2024년 대비 47% 줄인 1,830만~1,835만톤으로 축소하고 초과분 관세를 25%에서 50%로 올렸으며, 원산지를 실제 쇳물 생산국으로 보는 Melt & Pour 규정을 10월 시행한다. 한국의 EU 쿼터 소진율은 이미 90%(2025년 3분기)였고, 한국 전용쿼터는 207만톤으로 기존보다 줄었다. 여기에 2026년 1월 CBAM 비용 부과가 겹친다.", "중국 가격은 1분기 횡보 후 4월부터 제품별 1~7% 오르는 데 그쳤고, 한국·동남아·인도는 중국산 수입 규제로 그 중간에서 반등했다. 한국은 1H26 열연·철근 유통가가 약 20% 올라 한중 열연 가격차가 $101(2025.11)에서 $141(2026.06)로 벌어졌다. 리포트들은 국내 철강사 실적을 중국 가격만으로 추정하면 오판할 수 있다고 경고한다.", "지역 분절은 수출에도 비대칭 효과를 낸다. 한국의 미국향 철강 수출은 2026년 5월 누적 물량 +56%(ASP −23%)로 오히려 늘었는데, 증가분 64만톤 중 42만톤이 철근이었다. 반면 EU향은 2025년 물량 −8%·ASP −5%로 이미 위축됐고 7월 TRQ 강화로 추가 감소가 예상된다. 결국 보호시장 안에 생산기반(현지화)을 가진 기업에 수혜가 집중되는 구조다."], "table": {"cols": ["지역", "주요 제도", "2025~26 가격 반응"], "rows": [["미국", "232조 50%(2025.06), 파생상품 정기 확대, 국가별 쿼터 폐지", "열연 톤당 900달러 중반, 최고 수준 형성"], ["EU", "TRQ 무관세 쿼터 −47%, 초과분 50%(2026.07), Melt & Pour(10월), CBAM(2026.01)", "역내 가격 상승, 역외 수출 여력 축소"], ["한국", "후판·열연 반덤핑+MIP, 도금재 잠정 AD, 봉강 조사, 조강국 확인", "1H26 열연·철근 유통가 약 +20%"], ["중국", "수출허가제(2026.01), 치환 규정(2026.05)", "4월 이후 제품별 +1~7%에 그침"], ["동남아·인도", "중국산 수입 규제", "내수가 반등"]]}, "bullets": ["중국산 철강재에 대한 전 세계 반덤핑 건수 약 190건(2020년 약 173건, WTO)", "한국 철강 수출 비중: 미국 14.8%, EU 12.3%, 일본 11.2%", "한국 대미 수출 2025년 −8.2%(ASP −6.5%), 에너지용 강관은 6월 이후 급감(연간 −11%)", "EU 초과관세 50%는 사실상 물량·가격 동시 제약", "리포트는 2026년 하반기 미국 정치환경 변화로 관세 완화 가능성도 언급"], "kr": "관세 장벽 안의 현지 생산(현대제철·포스코 루이지애나 전기로, 세아제강 미국 법인, 넥스틸 텍사스)이 '관세 회피 옵션'으로 가치가 커졌다. 국내 기업 실사 시 지역별 매출·생산 믹스를 가격 분절 관점에서 분해해야 한다."}, {"group": "철강 사이클·통상", "title": "한국형 무역구제의 확산: H형강에서 열연·도금재·봉강까지", "period": "2025.04~2026.09", "lede": "한국 정부의 반덤핑·가격약속(MIP)·조강국 확인이 판재 전반으로 확산되며 국내 판가가 중국과 디커플링됐다.", "body": ["한국 무역구제의 효과를 보여주는 선례는 2015년 중국산 H형강 반덤핑이다. 관세 부과 후 중국산 수입은 73.7만톤(2014)에서 2.2만톤(2018)으로 급감했고 수입 유통가는 62만원에서 74만원으로 올랐다. 2025~26년에는 이 방식이 후판(2025.08 최종, 27.91~34.10%), 열연(2025.09 잠정 28~33%, 2026.02 최종 판정, 2026.06.23부터 MIP 병행), 도금·컬러강판(2026.06 잠정 최고 33.67%), 특수강 봉강(2026.05 조사 개시)으로 확산됐다.", "효과는 품목별로 다르게 나타났다. 열연은 중국산 수입 비중이 2Q25 64.7%에서 1H26 11.9%로 급감했고, 가격약속으로 수입 오퍼가 자체가 올라갔다. 무역위원회는 가격약속 이행 시 국산 열연 출하가 약 100만톤 늘고 점유율이 8.9%p 오를 것으로 봤다. 후판은 수입량이 오히려 늘었지만(2026.5 누적 +31.6%) 중국산 오퍼가가 원화 약 100만원으로 국내 수입 유통가(95만원)를 웃돌게 됐다.", "가격 효과에는 시차가 있다. 관세가 부과돼도 이미 들어온 저가 수입재 재고가 소진돼야 유통가가 오르는데, 열연은 2025년 9월 관세 후 재고 소진을 거쳐 2026년 1분기부터 가격이 올랐다. 열연은 냉연·도금·강관의 기초 소재라 열연 가격 상승은 다운스트림 전반으로 전이되고, 철강재는 무거워 국내 생산의 약 60%가 내수로 팔리므로 내수가 개선의 수혜가 크다.", "우회로 차단도 병행된다. 2026년 수입 철강 신고 시 품질검사증명서(MTC) 제출 의무화와 조강국(Melted and Poured) 확인 대상을 냉연·도금·형강·봉강·선재·STS·특수강 등 사실상 전 품목으로 넓히는 작업이 진행 중이다. 다만 리포트들은 반덤핑과 MIP가 '판가 하단 지지'일 뿐 구조적 해법은 아니며, 제3국 경유 우회수출과 MIP 분기 재산정 결과를 계속 점검해야 한다고 지적한다."], "table": {"cols": ["품목", "대상국", "조치·세율", "진행"], "rows": [["H형강", "중국", "반덤핑 28.23~32.72%(2015)", "2021.03 재심 후 5년 재부과"], ["스테인리스 평판압연", "중국·인니·대만", "반덤핑", "2025.05 재심 후 5년 재부과"], ["스테인리스 후판", "중국", "AD 21.62%", "2025.09 확정, 2030.09까지"], ["탄소강·합금강 후판", "중국", "27.91~34.10%(9개사 가격약속)", "2025.08 최종판정, 5년"], ["열연", "중국·일본", "중국 28.16~33.10%, 일본 31.58~33.57% + MIP(중국 6개 그룹·일본 3개사)", "2026.02 최종판정, 2026.06.23부터 5년"], ["아연·아연합금 도금 냉연(GI·컬러)", "중국", "잠정 22.34~33.67%", "2026.06.12 잠정, 10월 최종 예정"], ["봉강(STS 제외)", "중국", "덤핑 조사", "2026.05.07 개시, 예비 9~10월, 최종 2027.02 예정"]]}, "bullets": ["가격약속 대상(일본 3개사+중국 6개 그룹)이 한국 열연 수입의 약 81%", "국내 봉강 수입의 90.7%가 중국산, 단가 22.5% 낮음", "2026.5 누적 중국산 특수강봉강 수입 −94.0%(조사 개시 효과)", "국내 열연 유통가 연초 80 → 5월 말 96~98만원(+20%)", "관세 발효 시점과 판가 반영 사이 1~2분기 시차 존재"], "kr": "POSCO홀딩스·현대제철(열연·후판), KG스틸(도금재), 세아베스틸지주(봉강)가 직접 영향권이다. 반덤핑 판정 일정은 해당 기업 공모·메자닌의 실적 가정에 들어가는 핵심 이벤트다."}, {"group": "철강 사이클·통상", "title": "철근: 5년 내리막 끝의 수출 급증과 구조조정 1순위", "period": "2026.01~2026.09", "lede": "만성 과잉이던 국내 철근이 미국 데이터센터향 수출 급증과 정부의 구조조정 1순위 지정이 맞물려 수급 개선 국면에 들어섰다.", "body": ["국내 철근은 생산능력 1,170만~1,230만톤(9개사) 대비 2025년 수요 687만톤, 생산 702만톤으로 가동률이 56~57%에 불과하다. 철근 내수 판매는 2021년 1,028만톤에서 2024년 756만톤으로 줄었고, 2025년 착공면적은 −12.2%, 건설투자는 265조원(−9.7%, IMF 이후 최대 낙폭)으로 수요 회복은 아직 뚜렷하지 않다. 준공 후 미분양이 늘고 있어 근본적 수요 반등에는 시간이 더 필요하다는 것이 공통된 시각이다.", "변화는 수출에서 왔다. 2024년 3.9만톤에 불과하던 철근 수출이 2025년 15.5만톤, 2026년 1월 11.8만톤, 2월 13만톤(역대 최대, 이 중 미국 11만톤·푸에르토리코 1.5만톤)으로 급증했다. 배경은 국내외 가격차 확대(미국 내 가격 900달러 초중반 vs 한국산 수출가 톤당 약 541달러), 미국 데이터센터발 봉형강 수요(연간 약 100만톤 추가 추정), 그리고 기존 미국향 수출국의 관세·AD/CVD다(멕시코 AD 20.6%, 알제리 예비 AD 127%, 이집트 예비 CVD 30%, 중국 AD 133%).", "공급 측에서는 정부가 2025년 11월 '철강산업 고도화 방안'에서 철근을 구조조정 1순위 품목으로 지정했고, 현대제철이 2026년 1월 인천공장 철근 설비(연 75~80만톤, 국내 생산의 약 10%)를 폐쇄했다. 리포트는 감축 규모를 생산능력의 20~25%(240~300만톤)로 추정하며, 수출과 구조조정이 맞물리면 가동률이 56%에서 86%까지 개선될 수 있다고 본다. K-스틸법(2026.06.17 시행)은 감산·가동률 조정을 공정거래법상 담합 예외로 인정해 이를 제도적으로 뒷받침한다.", "전기로 철근은 고로·석유화학 같은 연속공정과 달리 배치식이라 차지 수와 조업일만 조정해도 감산이 쉽고, 감가상각이 많이 진행돼 고정비 부담도 낮다. 따라서 봉형강 가격은 수요보다 공급 조절에 민감하게 반응하며, 실제로 철근 유통가는 2025년 11월 66만원에서 2026년 2월 75만원으로, 스프레드는 27만원에서 35만원으로 뛰었다. 남은 과제는 잉여인력 문제로, 신사업이 있는 대형사는 전환배치가 가능하지만 순수 철근업체는 대응 수단이 마땅치 않다."], "table": {"cols": ["항목", "수치", "시점·출처"], "rows": [["국내 철근 생산능력", "1,170만~1,230만톤", "2025, 한국철강협회·업계(원문 간 차이, 미확인)"], ["철근 수요/명목소비", "687만톤 / 666만톤(−14%)", "2025, 한국철강협회"], ["가동률", "56~57%", "2025, 리포트 추정"], ["철근 수출", "3.9만(2024) → 15.5만(2025) → 월 13만톤(2026.02)", "무역통계"], ["미국향 월평균 수출", "9.2만톤(2026.4 누적, 전년 1,300톤)", "SteelDaily·Bloomberg"], ["구조조정 감축 추정", "생산능력의 20~25%(240~300만톤)", "리포트 추정"], ["수출+구조조정 시 가동률", "56% → 86%", "리포트 추정(Capa 930만 vs 수요 800만톤 가정)"]]}, "bullets": ["현대제철 철근 시장점유율 27%, 인천공장 가동중단으로 선제 대응", "대한제강(연 240만톤)·한국철강 등 순수 철근업체는 수출 수혜와 고용 부담이 공존", "미국 내 한국산 철근 수입이 급증하면 RTAC의 AD/CVD 제소 가능성", "철근 유통가 상승이 건설사 가격 저항으로 이어질 위험", "2026년 월평균 수출 10만톤 유지 여부가 핵심 추적 지표"], "kr": "현대제철, 동국제강, 대한제강, 한국철강이 직접 대상이다. 순수 철근업체의 경우 자사주(대한제강 약 25%) 활용 등 자본정책 이슈도 함께 봐야 한다."}, {"group": "철강 사이클·통상", "title": "2026 탄소 규제 대전환: K-ETS 제4기와 EU CBAM", "period": "2025.11~2026.09", "lede": "2026년은 국내 배출권 할당이 11% 줄고 EU CBAM 비용 부과가 시작되는 해로, 고로 비중 72%의 한국 철강에 탄소가 새 원가 항목으로 들어왔다.", "body": ["K-ETS는 기업에 배출권을 할당하고 실제 배출량과 정산하는 제도로 5년 단위로 운영되며 2026년 제4기(2026~30)가 시작됐다. 제1~3기 연평균 할당량은 5.6~5.8억톤으로 과도했고 유상할당 비중은 약 2%에 불과해 배출권 가격이 톤당 약 1만원에서 횡보했다. 제4기는 총량을 5.0억톤(−11%)으로 줄이고 2027~30년 연평균 3.5%씩 추가 축소하며, 시장안정화 예비분(MSR)을 총량에 포함하고 발전부문 유상할당을 2030년 50%까지 올린다.", "철강은 무역집약도가 높아 사실상 100% 무상할당을 받아왔지만, 발전 외 부문 총량이 약 14% 줄면서 POSCO(최근 3년 평균 배출 7,100만톤, 할당 7,691만톤)의 2026년 할당은 약 6,600만톤으로 추정돼 부족 구간에 들어선다. 이월분 1,041만톤으로 약 2년을 버틸 수 있어 실제 구매는 2028년 이후로 추정되고, 현대제철은 2026년부터 연 300만톤 이상 부족이 예상된다. POSCO와 현대제철 고로 배출이 철강금속 업종 총배출(1억1,524만톤)의 84%를 차지한다.", "대응 수단은 전기로다. 고로(톤당 2.0~2.3tCO2)보다 전기로(약 0.5tCO2)의 탄소집약도가 1.5 가량 낮아, POSCO는 광양 250만톤 전기로(2026년 6월 준공)를 고로 용선과 합탕해 300만톤 이상, 현대제철은 유휴 전기로 재가동으로 150만톤 감축이 가능하다. 다만 자동차강판·후판 등 고급강을 합탕 쇳물로 만들어야 하는 품질·원가 과제가 있다. 장기적으로는 POSCO의 수소환원제철(HyREX, 데모플랜트 1.3조원·연 30만톤, 2030년 상용기술 목표)이 핵심이며, 경제성에는 kg당 2,000원 이하 수소가 필요하다.", "EU CBAM은 철강·알루미늄·비료·시멘트·전기·수소 수입품의 내재 탄소에 EU ETS 가격 상당의 비용을 부과한다. 2025년 9월 개정으로 연 50톤 이하 소량 면제, 인증서 예치 의무 완화가 반영됐고 초기 3년 무상할당이 90% 이상이라 단기 충격은 제한적이다. 그러나 2029년부터 무상할당이 가파르게 줄고 2035년 전면 폐지되며, 리포트는 한국 CBAM 비용을 연 약 8,200억원(POSCO 약 3,700억원), 전면 도입 시 최대 1.9조원으로 추정한다. 역설적으로 저탄소 전환이 빠른 국내 업체에는 고탄소 경쟁국(중국·인도) 대비 반사 수혜 가능성도 제시된다."], "table": {"cols": ["구분", "K-ETS 제4기", "EU CBAM"], "rows": [["시행", "2026~2030", "2026.01 비용 부과 시작(인증서 구매는 2027년, 원문 간 2월·5월 표기 차이)"], ["총량/범위", "5.0억톤(−11%), 이후 연 −3.5%", "철강·알루미늄·비료·시멘트·전기·수소"], ["무상할당", "철강은 무상할당 유지하나 총량 축소", "초기 3년 90% 이상 → 2029년부터 급감 → 2035 폐지"], ["가격", "KAU 약 1만원/톤", "EU ETS 약 80유로, 인증서 1Q26 75.3유로"], ["한국 철강 비용 추정", "POSCO 연 약 500억원(현 가격, 2028년 이후)", "연 약 8,200억원, 전면 도입 시 최대 1.9조원"]]}, "bullets": ["2024년 국내 배출 5억6,562만톤(−1.7%), 상위 10개사가 53%", "ArcelorMittal 유럽 탄소집약도 1.8 → 2030년 1.35tCO2/t 목표", "중국도 2025년 철강을 전국 ETS에 편입(2027년 2단계 벤치마크·유상할당)", "수소환원제철 본예타 통과 총 8.1천억원(국비 3.1천억원)", "정부 로드맵: 고로→전기로 전환(2026~35), 수소환원제철 15기(2036~50)"], "kr": "POSCO홀딩스·현대제철의 배출권 부족 규모와 전기로 합탕 품질은 향후 원가와 밸류에이션 할인율을 결정하는 장기 변수다. 탄소 다배출 제조업 IPO 시 할당량·이월분·CBAM 노출을 반드시 확인해야 한다."}, {"group": "철강 사이클·통상", "title": "공급과잉 시대의 생존 전략: 고부가 믹스와 해외 상공정", "period": "2026.05~2026.09", "lede": "글로벌 과잉설비가 2028년 7.45억톤으로 커지는 가운데 국내 철강사의 해법은 범용재 축소·고부가 믹스·관세장벽 뒤 현지 일관생산·신사업 자본 재배치로 수렴한다.", "body": ["OECD는 2026년 6월 글로벌 과잉설비 전망을 2025년 6.4억톤에서 2028년 7.45억톤으로 상향했다. 2026~28년 수요 증가분은 3,400만톤인데 생산능력은 최대 1.39억톤 늘 수 있고, 증설의 약 60%가 아시아(중국 최대 3,860만톤, 인도 3,180만톤)에서 나온다. ASEAN은 2025~30년 생산이 연 8.5% 늘어 수요(3.5%)를 크게 웃돈다. 글로벌 철강 수요는 2026년 17.2억톤 정체, 2027년 17.6억톤(+2.2%)이며 증가분의 41.7%를 인도가 차지한다.", "이 과잉은 지역별로 불균등하게 작용한다. 인도·미국·인도네시아는 자국 중심 정책으로 수입재 진입이 어렵고 현지 철강사 영업이익률이 한국(4~5%)의 2~3배(인도 10~14%, 미국 12~18%, 인니 7~15%)다. 그래서 포스코는 하공정 위주 해외 진출 공식을 버리고 인도(JSW 합작 오디샤 600만톤, 총 10.7조원), 미국(루이지애나 250~270만톤 전기로, 58억달러, 현대제철 50%·현대차 15%·기아 15%·포스코 20%), 인니(PT.KP 확장)에서 상공정 완결형 체제를 만들어 2031년 해외 조강 1,000만톤을 목표로 한다.", "국내에서는 범용재(건설용 철근·형강·일반 후판)에 대한 투자를 줄이고 자동차강판·전기강판·에너지강재·방산/원전/전력향 특수강에 자본을 집중한다. 자동차강판은 생산량의 약 20%지만 수익 기여는 훨씬 크고, AI 인프라향 '특화강 패키지'(송전탑·배터리 케이스·서버랙용 고내식 도금·압력용기 후판) 판매를 2025년 38만톤에서 2028년 52만톤, 2030년 100만톤으로 늘리는 계획이 제시됐다. 현대제철도 데이터센터·송전철탑·ESS 인클로저향 강재를 2030년까지 누적 100만톤 판매 목표로 한다.", "마지막 축은 신사업으로의 자본 재배치다. 포스코그룹은 2026년 7월 CEO Investor Day에서 철강을 '산업자원'으로, 리튬·희토류를 '전략자원'으로, LNG·신재생을 '에너지자원'으로 재정의한 트리플 코어를 선언하고 2026~28년 29.1조원(성장투자 16.7조원)을 배정했다. 그룹 매출 내 철강 비중을 51%에서 35%로 낮추고 2028년 PBR 1.0배 이상을 목표로 하며, 상장 자회사 지분을 50%까지 낮춰 약 3.6조원을 확보(90% 재투자, 10% 자사주)한다. 세아베스틸지주도 본업 현금을 미국 특수합금(SST)에 재배치하는 같은 구조다."], "table": {"cols": ["거점", "형태·규모", "투자·지분", "일정"], "rows": [["인도 오디샤", "JSW 50:50 일관제철소 600만톤", "총 10.7조원(자본 1.6조+차입 3.7조)", "2026.04 본계약, 현지 마진 15% 전후"], ["미국 루이지애나", "전기로 일관제철소 250~270만톤", "58억달러, 현대제철 50%·현대차 15%·기아 15%·포스코 20%", "2029 상업생산 목표"], ["인도네시아", "PT.KP 확장 300만톤, STS 상공정", "냉연·도금 고도화", "2025 턴어라운드, 2028 STS 상공정"], ["포스코 해외 조강 목표", "1,000만톤", "해외 철강 성장투자 6.7조원", "2031"]]}, "bullets": ["인도 철강 수요 1.47억톤(2024) → 2.4~2.6억(2035) → 3.42억톤(2045) 전망, 1인당 소비 103kg(세계 215kg)", "미국 전기로사 영업이익률 Nucor 12%·STLD 10.3%(1Q26) vs 고로사 마진 압박", "포스코그룹 2035 매출 187조·영업이익 13.1조원 목표", "리스크: 자회사 지분 출회 오버행, PRS 사후정산 손실, 대규모 CAPEX 대비 현금흐름", "현대제철 루이지애나는 자금조달 구조가 관건으로 지적됨"], "kr": "POSCO홀딩스, 현대제철, 세아베스틸지주. 지주사의 자회사 지분 유동화(블록딜·EB·PRS)는 ECM 실무와 직결되는 이슈로, 할인율·정산 리스크·유통주식 확대 효과를 같이 봐야 한다."}, {"group": "구리·제련", "title": "구리 공급 병목: 광산 연쇄 사고·품위 하락·17년 리드타임", "period": "2025.05~2026.09", "lede": "2025년 세계 최대급 광산들이 연달아 멈추면서 구리 공급의 구조적 취약성이 드러났고, 리포트들은 이를 '슈퍼사이클'이 아닌 '가격 하단의 레벨업'으로 규정한다.", "body": ["2025년 5월 콩고 Kamoa-Kakula(지진·지하수 유입), 7월 칠레 El Teniente(지진 갱도 붕괴), 9월 인도네시아 Grasberg(대규모 토사 유입, 불가항력 선언)가 잇따라 멈췄다. Grasberg는 2026년 생산 전망이 77만톤에서 36만톤으로 반토막 났고 2H26 가동률 65%, 2027년 중반 80%, 2027년 말 완전 정상화(일부는 2028년 초까지 지연 가능)가 제시됐다. Kamoa-Kakula는 2026년 가이던스를 29~31만톤으로 거듭 낮췄다.", "사고만의 문제가 아니다. 글로벌 정광 생산의 약 42%를 차지하는 주요 9개사의 2025년 합산 생산은 958.6만톤으로 가이던스 중간값 대비 −4.8%였고 9개사 모두 가이던스를 달성하지 못했다. 2026년에도 주요 광산 생산은 1Q −4.6%, 2Q −5.6%(YoY)였고 Codelco −11%, Anglo American은 품위 저하로 가이던스를 70~76만톤으로 낮췄다. 칠레 Cochilco는 2026년 칠레 생산 전망을 560만톤에서 527만톤으로 내렸다.", "구조적 원인은 세 가지다. 첫째 품위: 남미 주요 광산 품위는 2000년 1.2~1.3%에서 2025년 0.6%로 반토막 났고 BHP는 1.02%에서 2027년 0.7%로 떨어질 전망이라, 같은 구리를 얻는 데 에너지 집약도가 120~150% 늘었다. 둘째 리드타임: 신규 광산의 발견부터 생산까지 평균 17년(15.5~24.1년, 미국은 약 29~32년)이 걸리고, 최근 발견 자산의 70% 이상이 기존 광산 인근 확장(브라운필드)이다. 셋째 투자: 글로벌 구리 탐사예산은 2012년 47억달러에서 2024년 30억달러로 줄었고 광산 건설비는 톤당 $8,000~10,000에서 $15,000~20,000으로 올랐다.", "리포트들은 이것이 수요 폭증에 의한 슈퍼사이클이 아니라, 공급 병목과 통제로 가격의 '바닥'이 구조적으로 높아진 것이라고 해석한다. 신규 공급을 끌어내는 인센티브 가격이 톤당 $10,000~12,000이어서 이 수준이 실질적 하방으로 작동하고, LME 구리는 2025년 초 약 $9,000에서 연말 약 $13,000, 2026년 3분기 현물 $14,912까지 올랐다. 반대로 Grasberg 정상화가 빨라지거나 스크랩 규제가 완화되면 병목이 풀리는 하방 리스크도 명확하다."], "table": {"cols": ["광산(국가)", "연간 CAPA(kt)", "2025 연초 가이던스(kt)", "2025 실제(kt)", "원인"], "rows": [["Grasberg(인도네시아)", "770", "680", "460", "산사태·토사 유입(2025.09)"], ["El Teniente(칠레)", "430", "370", "310", "지진 갱도 붕괴(2025.07)"], ["Kamoa-Kakula(콩고)", "600", "520~580", "389", "지진·지하수 유입(2025.05)"], ["Quebrada Blanca(칠레)", "316", "230~270", "190", "테일링 댐 고도화 지연"]]}, "bullets": ["주요 9사 2025년 생산 958.6만톤(YoY −4.0%, 가이던스 대비 −4.8%)", "ICSG 2026년 광산 생산 증가율 2.4% → 1.6%로 하향, 리포트 자체 추정 1.0%", "Cobre Panamá(세계 공급 1~2%) 재가동 여부 미정", "Kamoa-Kakula 2028년 연 50만톤 이상 회복, Oyu Tolgoi 2028~36 연평균 50만톤 체제가 중기 공급 증가 요인", "DRC 2026년 8월 구리·코발트 정광 수출 제한"], "kr": "국내에는 구리 광산이 없어 정광 부족은 제련사(고려아연·LS MnM)의 원료 조달 비용으로, 구리가 상승은 신동·전선(풍산·대창·LS전선·대한전선)의 메탈게인·판가로 전이된다."}, {"group": "구리·제련", "title": "TC/RC 붕괴와 제련업의 생존 모델: 부산물 경제", "period": "2024.04~2026.09", "lede": "구리 제련수수료가 2026년 사상 처음 0달러, 현물은 톤당 −227.5달러까지 떨어지면서 제련소는 수수료가 아니라 금·은·황산·희소금속 회수로 돈을 버는 '부산물 경제'로 넘어갔다.", "body": ["TC/RC는 광산이 정광을 팔 때 제련·정련 대가로 대금에서 차감해 주는 수수료다. 정광 4톤(품위 25%)으로 전기동 1톤을 만든다면 TC×4톤이 제련소 마진이 된다. 정광이 귀해지면 제련소끼리 원료 확보 경쟁을 하며 TC가 낮아지고, 심하면 제련소가 웃돈을 주는 마이너스가 된다. 벤치마크 TC는 2015년 $92, 2024년 $80에서 2025년 $21.25, 2026년 $0으로 추락했다.", "원인은 수급 불균형이다. 최근 5년 중국 1차 제련능력은 43%(320만톤) 늘었지만 세계 정광 생산은 11%(약 200만톤) 증가에 그쳤고, 2020~25년 중국 정련능력은 83% 늘어 글로벌 정련의 약 50%(960만톤 이상)를 차지하는데 원료 자급률은 30% 미만이다. 제련소 가동률은 중국 약 85%, 중국 외 70% 미만이며, 일본 미쓰비시머티리얼즈는 오나하마 제련소(연 23만톤) 정광 처리를 1년간 중단했고 Glencore PASAR는 약 20만톤을 감산했다.", "그런데도 2026년 상반기 중국 정련동 생산이 늘어난 이유는 부산물이다. 호르무즈 봉쇄와 중국의 황산 수출 중단으로 황산 가격이 457위안에서 2,105위안까지 올라, 중국 Yunnan Copper처럼 황산이 매출의 1%지만 매출총이익의 10% 이상을 차지하는 구조가 제련소를 지탱했다. 금·은 가격 급등도 같은 역할을 했다. 제련사 이익과 TC의 상관관계가 약해진 것은 국내도 마찬가지로, 고려아연은 TC 사상 최저 환경에서 1Q26 사상 최대급 이익을 냈다.", "TC와 구리 가격은 역상관이다. 둘 다 '정광 부족'이라는 공통 원인의 결과이기 때문에 1988~2025년 TC 하락과 구리가 상승이 동시에 나타날 확률은 72.2%(2013~25년 92.3%, Fisher exact test p=0.017)였다. 40년간 유지된 연간 벤치마크 계약도 현물과의 괴리(2000~23년 평균 약 $12 → 2024~25년 약 $90)가 커지면서 Antofagasta 등이 현물지수 연동(하한 포함) 방식을 일부 도입했고, 2026년 4분기 2027년 협상에서 추가 하락과 계약 구조 변화가 핵심 쟁점이다. 중국 제련소 구매연합(CSPT)은 2026년 가동률 10% 이상 감축(정광 수요 약 100만톤 축소)에 합의했다."], "table": {"cols": ["연도", "벤치마크 TC($/t)", "비고"], "rows": [["2015", "92", "정상 수준"], ["2023", "88", ""], ["2024", "80", "4월부터 현물 TC 마이너스 진입"], ["2025", "21.25", "전년 대비 −58.75, 현물 저점 약 −$50"], ["2026", "0", "사상 최저, 현물 −$45(연말) → −$227.5(2026-08-14)"], ["2027(협상 예정)", "추가 하락 유력(리포트 판단)", "고정 vs 현물지수 연동 비중이 쟁점"]]}, "bullets": ["제련 이익원: TC/RC → Free Metal·귀금속·황산·희소금속으로 이동", "독립 제련소 퇴출·수직계열화 메이저(BHP·Rio·Freeport) 수혜의 양극화", "Aurubis: 총마진 중 TC/RC 비중 14% → 6%로 낮아졌으나 Metal result·황산으로 방어", "Boliden 1Q26 광산 EBIT +133% vs 제련 +28%", "리스크: 부산물 가격 하락 시 제련 감산 가속 → 정련동 공급 추가 감소"], "kr": "LS MnM(정광 구매 기반 전통 제련, TC 약세 직접 노출, 2Q25부터 전기동 부문 3개 분기 적자를 부산물로 방어)과 고려아연(부산물·재활용 원료 기반 저원가 구조)의 차이가 선명하다. 구리 증설(고려아연 2025년 습식 3.3만톤 → 2028년 약 15만톤)은 원료 확보력이 관건이다."}, {"group": "구리·제련", "title": "황·황산 병목: 제련소엔 호재, 습식 광산엔 악재", "period": "2026.03~2026.09", "lede": "호르무즈 봉쇄로 중동 황 공급이 막히고 중국이 황산 수출을 끊으면서, 구리 공급 병목이 광산·제련에 이어 '황산'이라는 세 번째 경로로 확산됐다.", "body": ["구리를 만드는 방법은 두 가지다. 황화광을 선광·용융하는 건식제련과, 저품위 산화광을 황산으로 녹여 용매추출·전해채취로 바로 전기동을 만드는 습식제련(SX-EW)이다. SX-EW는 세계 정련동의 약 1/5(약 17%), 칠레의 약 21%, 콩고의 약 80%를 차지해 황산이 광산의 핵심 투입재다.", "중동은 세계 황 생산의 약 24%를 차지하고 전 세계 해상 황 교역의 절반이 호르무즈를 지난다. 2026년 3월 이란 전쟁 이후 카타르산 황은 톤당 890달러(+243% YoY)로 올랐고, 중국은 비료용 수요를 지키기 위해 1~4월 약 70만톤 쿼터 운영 후 5월부터 전자급을 제외한 황산 수출을 사실상 중단했다(5월 11.7만톤 → 6월 980톤). 칠레는 황산 수입의 37%를 중국에 의존해 왔고 3월 중국산 수입이 0톤이 됐으며, 콩고는 연 130~140만톤의 황을 대부분 중동에서 수입한다.", "영향은 비대칭이다. Antofagasta는 황산이 생산원가의 약 5%로 2Q 현금원가가 6% 올랐고, Capstone은 Mantoverde(SX-EW)에서 황산 사용 20만톤·전기동 생산 5,000톤을 줄였다. 리포트들은 SX-EW 황산 물류 차질에 따른 구리 생산 차질을 약 12.5만톤으로 추정한다. 반면 황산을 부산물로 파는 건식 제련소에는 수익원이 돼, 중국 제련소가 마이너스 TC에도 정광을 사들이며 감산이 지연되는 효과를 냈다.", "그래서 황산 가격은 구리 수급의 숨은 스위치다. 황산이 높으면 제련소가 버티며 정련동 공급이 유지되고, 꺾이면 제련 감산이 가속돼 정련동 공급이 줄어든다. 2026년 8월 중순 중국 98% 황산은 1,941위안으로 고점(7월초 2,105위안)에서 소폭 내려왔고, 동시에 중국의 허위 세금계산서 단속(역발행 한도 개인당 연 500만 위안)으로 공식 유통 가능한 동스크랩이 줄어 제련 원료가 추가로 부족해졌다. 8월 중국 전기동 생산은 YoY 감소로 추정된다."], "table": null, "bullets": ["SX-EW 비중: 세계 정련동 약 1/5, 칠레 약 21%, 콩고 약 80%", "중국 황산 457위안(2025초) → 1,782(4월초) → 2,105(7월초) → 1,941위안(8월 중순)", "황 공급의 중동 비중 약 24%, 해상 교역의 절반이 호르무즈 통과", "동스크랩 규제는 스크랩이 정광 부족을 완충하던 경로를 약화", "황산은 인산비료 원료라 식량안보 정책과도 연결"], "kr": "고려아연·LS MnM은 황산을 부산물로 판매하는 쪽이라 황산 강세의 수혜 측면이 있다(LS MnM 황산 부문 영업이익 4Q25 169억 → 1Q26 253억원). 반대로 우라늄·니켈 습식 공정에도 황산이 필요해 원가 전이가 넓게 퍼진다."}, {"group": "구리·제련", "title": "구리 수요의 새 축과 미국 관세: 데이터센터·전력망·국방·비축", "period": "2025.08~2026.09", "lede": "구리는 중국 건설경기의 선행지표('닥터 코퍼')에서 전력망·AI 데이터센터·전동화·안보와 연결된 전략 자산으로 재평가됐고, 미국 관세가 거래소 간 재고와 가격을 흔드는 변수로 더해졌다.", "body": ["데이터센터 1MW에 약 27톤의 구리가 들어가며(MS 시카고 81MW에 약 2,177톤), 글로벌 데이터센터 용량이 2024년 67GW에서 2030년 163GW로 늘면 누적 약 260만톤, 연 약 43만톤(2025년 전기동 생산의 약 1.8%)의 추가 수요가 생긴다. 데이터센터 구리 수요는 연 50만톤에서 2040년 250만톤으로 늘 전망이다. 특히 AI 학습·금융 데이터센터는 전력·냉각 경로를 완전히 이중화(Tier IV, 2N)해 구리 집약도가 40톤/MW 이상으로 올라가고, 랙 전력밀도(7kW → 100kW 이상) 상승으로 두꺼운 버스바가 필수가 된다. 광통신(CPO) 대체 우려는 최대 21만톤(전체 수요의 0.5~0.7%)으로 미미하다.", "전력망은 더 큰 축이다. 글로벌 그리드 투자는 2025년 처음 4,700억달러를 넘었고(미국 약 1,150억), 중국 국가전력망공사는 2026~30년 약 4조 위안(직전 5개년 대비 +40%)을 투자한다. 미국은 송전선의 70%가 25년 이상 노후됐고 지중 케이블은 km당 19.5~27톤의 구리를 쓴다. 해상풍력은 MW당 4.9톤, 태양광 2.3톤, BESS 1.7톤이 필요하며, BEV는 대당 83kg 이상으로 내연기관(20~25kg)의 3~4배다. 대형 전력변압기 리드타임은 12~14개월에서 36~48개월(일부 5년)로 늘었다.", "국방·비축 수요는 가격 비탄력적이다. 155mm 포탄 1발에 약 0.5kg의 구리가 들고 소화기 탄약 케이스는 황동(구리 70%)이다. 미국 국방비축(NDS)은 국방 소요량의 약 40%만 충당 가능하고, 2026년 2월 발표된 Project Vault(EXIM 대출 100억달러+민간 20억달러, 60종 핵심광물 약 60일치)는 실물 매입 방식이라 파생상품이 아닌 실제 수요를 만든다. 한국 조달청도 구리 포함 61일분 비축을 검토 중이다.", "미국은 2025년 8월 232조로 구리 반제품·고함량 구리제품에 50% 관세를 부과하고 정광·전기동·스크랩은 제외했다. 상무부는 정련동에 2027년 15%, 2028년 30% 관세를 권고했으나 대통령은 2026년 6월 30일까지 재검토를 지시했고 8월 말까지 최종 결정이 나오지 않았다. 관세 기대로 COMEX 프리미엄이 형성되며 물량이 미국으로 이동해 COMEX 재고는 급증하고 LME·SHFE 재고는 줄었으며, 2026년 3월 3대 거래소 합산 재고가 124만톤(23년 최고)인데도 가격이 오르는 기현상이 나타났다. 관세가 확정되든 무산되든 재고 역류로 가격 변동성이 커질 수 있다."], "table": {"cols": ["수요처", "구리 원단위", "출처·비고"], "rows": [["AI 데이터센터", "약 27톤/MW(Tier IV 40톤/MW 이상)", "업계 추정·MS 시카고 사례"], ["해상풍력 / 태양광 / BESS", "4.9 / 2.3 / 1.7톤/MW", "S&P Global"], ["지중 송전 케이블", "19.5~27.0톤/km", "리포트 정리"], ["BEV / PHEV / HEV / ICE", "83 이상 / 60 / 40 / 20~25kg/대", "GlobalData 등"], ["155mm 포탄", "약 0.5kg/발", "리포트 추정"]]}, "bullets": ["2035년 글로벌 구리 수요 4,270만톤(현재 대비 +24%) 전망", "운송 부문 구리 수요 260만톤(2025) → 630만톤(2040)", "재생에너지 부문 향후 10년 추가 200만톤(WoodMac)", "미국 정련동 관세 확정 여부가 연말까지 COMEX-LME 스프레드의 핵심 변수", "한국산 황동봉 대미 수출 6월 누적 −60%(232조 파생품 관세)"], "kr": "LS전선(해저·HVDC·부스덕트), 대한전선(수주잔고 약 4조원), 대창(동 선재·황동봉), 풍산(신동), LS ELECTRIC(전력기기)이 이 수요 축에 연결된다. 전선사는 에스컬레이션으로 구리 원가를 전가하므로 잔고의 믹스가 본질이다."}, {"group": "귀금속·희소금속", "title": "은(銀) 급등의 구조: 부산물 공급과 첨단 산업 수요", "period": "2025.01~2026.06", "lede": "은은 2025년 161% 올라 2026년 1월 온스당 100달러를 돌파했는데, 투기만이 아니라 부산물 공급의 비탄력성·산업수요 60% 이상·중국 정련 병목이 겹친 결과라는 해석이 제시됐다.", "body": ["은 공급의 약 60%는 구리·납·아연·금 광산의 부산물이라, 주산물 생산이 늘지 않으면 은 가격이 올라도 공급이 늘지 않는다. 광산 생산은 2016년 정점 이후 감소 중이고 2025~30년 연 0.9% 감소가 예상되며, 최대 생산국 멕시코는 광업권을 50년에서 30년으로 줄이고 노천광을 제한한 광업법 개정(2023)으로 연 2.9% 감소가 전망된다. 탐사부터 생산까지 10년 이상 걸려 고가격이 즉시 공급으로 이어지지 않는다.", "수요는 산업용이 60%를 넘는다. 태양광은 2026년 설치 665GW(IEA) 전망에 TOPCon·HJT 셀이 PERC보다 패널당 은을 20~50% 더 써서, 셀당 은 함량을 70% 이상 줄인 절감 기술(Thrifting)을 설치량 증가가 압도한다. EV는 대당 25~50g으로 내연기관(15~28g)보다 많고, 은-탄소 복합층 전고체 배터리가 상용화되면 100kWh 팩당 약 1kg이 필요하다는 추정도 있다. 2021~25년 누적 8.2억온스 부족에 이어 2026년 이후 연 1.5~2억온스 부족이 예상된다(Metal Focus는 2026년 4,630만온스 부족).", "지정학이 가격을 분절시켰다. 중국은 광산 생산 비중은 12~13%에 불과하지만 남미 정광을 수입해 고순도로 가공하는 정련을 장악했고, 2026년 1월 1일부터 수출 쿼터를 더 엄격한 허가제(허가 기업 44개사)로 바꿨다. 그 결과 상하이금거래소(SGE) 실물가가 COMEX보다 온스당 10~11달러 높게 형성됐고, 미국은 정련 은의 80%를 수입하며 2025년 11월 은을 핵심광물로 지정했다.", "금융 억제는 가격을 꺾지 못했다. CME는 2025년 12월 세 차례 증거금을 계약당 2만에서 3.25만달러로 올리고 2026년 1월 13일 비례증거금 9%를 도입했지만, 리스 레이트 급등과 관세 우려로 실물 인도가 가속됐고 증거금 인상은 숏 포지션에도 부담을 줘 숏커버를 부를 수 있다. 1월 15일 미국의 핵심광물 관세 유예 발표로 하루 3% 급락했다가 회복한 사례처럼 정책 변동성은 크다. 한편 금은비율이 약 40(역사적 평균 70)까지 내려와 은의 상대적 고평가와 추가 급등 여력 제한을 지적하는 시각도 있다."], "table": {"cols": ["셀 기술", "PERC 대비 은 사용량", "비고"], "rows": [["PERC", "기준", "기존 주력"], ["TOPCon", "+20~50%", "차세대 고효율"], ["HJT", "+20~50%(최대)", "저온 은 페이스트"]]}, "bullets": ["은 전도성: 구리 대비 +5.8%, 금 대비 +39.4%", "SLV ETF 169일 연속 자금 유입(2026.01)", "2025년 은 산업용 수요 6.65억온스(YoY 감소, Silver Institute)", "은 광산주는 온스당 80달러 이상에서 수익성 급개선(판가−AISC)", "2Q26 미국-이란 전쟁 이후 귀금속 가격 조정"], "kr": "고려아연은 연 약 2,000톤(글로벌 공급의 약 5.7%)의 은을 팔아 2025년 매출 비중에서 은(32.3%)이 아연(26.0%)을 넘어섰다. LS MnM도 LBMA 인증 정련소를 보유한다. 은 가격 민감도와 1Q26 메탈게인의 일회성 여부가 제련사 이익 추정의 핵심이다."}, {"group": "귀금속·희소금속", "title": "부산물 희소금속과 '다금속 회수 플랫폼'의 가치", "period": "2025.10~2026.08", "lede": "인듐·안티모니·비스무스·갈륨·게르마늄 같은 희소금속은 독립 광산이 아니라 아연·연·구리 제련의 부산물로만 나오기 때문에, 이를 회수하는 제련사는 핵심광물 공급망의 전략 거점이 된다.", "body": ["희소금속은 지각 함량이 적어서가 아니라 추출·제련이 어렵거나 매장이 편중돼 공급망 리스크가 큰 금속을 정책적으로 묶은 개념이다(한국 35종, 미국 60종, EU 34종 지정). 대부분 모금속 제련 부산물로만 회수돼 가격이 올라도 모금속 생산이 늘지 않으면 공급이 늘지 않는다. 미국 USGS는 2025년 핵심광물 목록에 구리·은·납 등 전통 금속까지 포함시켜, 기준이 '희귀함'에서 '끊기면 산업이 흔들리는 금속'으로 넓어졌다.", "2025년 희소금속 가격 급등은 수요 폭발이 아니라 중국 수출통제의 결과였다. 같은 해 비스무스 +270%, 안티모니 +144%, 게르마늄 +106%가 오른 반면 구리 +6%, 아연 +3%에 그쳐 산업금속과 경로가 갈렸다. 2026년 상반기 미국 창고의 게르마늄 등 가격은 중국 내수 대비 약 130% 프리미엄을 형성했고, 미국의 갈륨·인듐 수입의존도는 100%, 비스무스·안티모니는 92%·91%다.", "수요 측에서는 AI가 새 동력이다. 게르마늄은 실리콘 포토닉스 광검출기(Ge-on-Si)에서 통신파장대 수광을 담당해 대체 불가능하고, 인듐인(InP) 기판은 1.6T 광모듈이 800G 대비 3배 이상 면적을 요구해 'HBM 다음 병목'으로 불린다. 갈륨은 800V DC 데이터센터 전력 아키텍처의 GaN 전력반도체, 텅스텐·몰리브덴은 3D NAND·로직 배선에 쓰인다. 실리콘 포토닉스·CPO는 InP를 대체하는 게 아니라 InP 광원을 전제로 한 보완 플랫폼이라 확산될수록 InP 수요도 늘어난다.", "제련사 입장에서는 부산물 회수가 이익을 TC 등락에서 분리시키는 별도 이익 축이다. 고려아연은 Fumer 설비로 부산물을 기화시켜 금속별 응고 온도 차이로 회수하는데, 3Q25 희소금속 매출 1,270억원(GPM 84%)이 별도 매출총이익의 약 36%를 차지했고 안티모니 수율은 약 70%에서 90%로 올랐다. 희소금속 GPM은 1Q24 43% → 2025년 80%대 → 1Q26 74.3%(안티모니 가격 약세)로 움직였고, 매출 비중 1.9%로 매출총이익의 7.4%를 만든다. 리포트는 이를 희토류 퓨어플레이도 일반 제련사도 아닌 '다금속 회수 플랫폼'으로 규정하며 SOTP 분리 평가의 근거로 삼는다."], "table": {"cols": ["금속", "주요 용도", "회수 출처", "중국 공급 비중", "美 수입의존도"], "rows": [["안티모니", "난연재 49%, 납축전지·탄약 40%", "연 정광·폐납축전지", "약 36%(광산)", "91%"], ["인듐", "ITO·디스플레이, InP·반도체", "아연(섬아연석) 부산물", "약 70%(정련)", "100%"], ["비스무스", "화학·의약·무독성 납 대체", "연·아연 제련 부산물", "약 82~88%(정련)", "92%"], ["갈륨", "화합물반도체(IC 73%, 광전자 26%)", "보크사이트·아연 부산물", "약 99%(저순도 1차)", "100%"], ["게르마늄", "광섬유, 적외선 광학, 반도체", "아연·연-아연-동 황화광 부산물", "약 53%(정련)", "50% 초과"]]}, "bullets": ["2025년 글로벌 생산(추정): 갈륨 900톤, 게르마늄 145톤, 인듐 1,100톤, 탄탈럼 2,500톤", "Teck Trail(캐나다) Ge·Sb·Ga 증설에 캐나다 정부 최대 4억 캐나다달러 지원", "Alcoa Wagerup 갈륨 연 100톤(세계 수요 약 10%), 호주 정부 최대 2억달러, 2026.07 FID", "국내 첨단산업 희소금속 31종 중 16종이 중국 수입 의존(2024)", "리스크: 모금속 수요 정체 시 부산물 공급도 정체"], "kr": "고려아연(게르마늄 1,400억원·갈륨 557억원 투자, 2028년 정상가동 목표, 록히드마틴 게르마늄 장기공급 MOU)과 LS MnM(게르마늄)이 국내 대표 회수 거점이다. 비중국 공급 확대 속도가 '탈중국 프리미엄'의 지속 기간을 결정한다."}, {"group": "귀금속·희소금속", "title": "중국 수출통제의 진화: 쿼터에서 허가제, 흐름(Flow)에서 축적(Stock)으로", "period": "2010.09~2026.09", "lede": "중국의 자원 통제는 물량을 조절하는 가역적 수단에서 장비·기술·인력까지 막는 비가역적 수단으로 진화하고 있어, 유예 합의가 나와도 공급망 재편 수요는 사라지지 않는다.", "body": ["중국은 2007년 수출쿼터 라이선스를 도입했고, 2010년 9월 센카쿠 분쟁 때 대일 희토류 통관을 사실상 중단해 사흘 만에 선장 석방을 얻어내며 자원을 처음 지정학 카드로 썼다. 당시 희토류 가격은 6~28배(네오디뮴 톤당 1.5만 → 25만달러) 폭등했다. 이후 WTO 패소(2014, 2016)로 쿼터·수출세를 폐지하고 허가제로 전환하면서 통제의 무게중심이 국경에서 국내(쿼터·국유기업 통합)로 이동했다.", "2020년 수출통제법 제정으로 명분이 '자원 보전'에서 '국가안보'로 바뀌었다. 이후 2023년 7월 갈륨·게르마늄, 10월 흑연, 2024년 8월 안티모니·초경질 재료, 12월 갈륨·게르마늄·안티모니 대미 수출 금지, 2025년 2월 텅스텐·텔루륨·비스무스·몰리브덴·인듐, 4월 희토류 7종(Sm·Gd·Tb·Dy·Lu·Sc·Y)과 자석, 10월 5종(Ho·Er·Tm·Eu·Yb) 추가로 12종 확대가 이어졌다. 2025년 4월 조치 직후 5월 자석 수출이 급감해 Ford 시카고 공장 등 미국·유럽·일본 완성차 라인이 멈췄고, 글로벌 완성차 생산 차질까지 약 2개월이 걸렸다.", "2025년 10월 9일 조치는 질적으로 달랐다. 중국산 희토류가 0.1% 이상 포함되거나 중국 원천기술을 쓴 해외 제품에도 허가를 요구하는 역외적용(미국 FDPR과 유사)과 함께, 제련·분리 장비, 자석 제조 기술, 공정 파라미터·시뮬레이션 데이터, 해외 생산을 지원하는 중국 인력까지 통제 대상에 넣었다. 물량 통제는 해제하면 즉시 회복되지만(가역적) 기술·역량 통제는 시간이 갈수록 격차가 누적된다(비가역적)는 점에서 구조적으로 다른 위협이다.", "2025년 11월 미중 정상 합의(펜타닐 관세 10%p 인하 ↔ 희토류 통제 1년 유예)로 일부 조치가 정지됐지만, 허가제와 군사용도 금지는 유지되고 12월부터 군사용 희토류 수출신청은 전면 거부됐다. 2026년 1월에는 대일 희토류 수출 추가 규제가 나왔고, 대미 갈륨·게르마늄·안티모니 금수 유예와 희토류 통제 유예는 2026년 11월 종료 예정이다. 리포트들은 통제가 협상 카드로 반복 가능하다는 점 자체가 공급망 재편 수요를 영구화한다고 본다."], "table": {"cols": ["시점", "조치"], "rows": [["2010.09", "센카쿠 분쟁 중 대일 희토류 통관 중단(첫 무기화)"], ["2014·2016", "WTO 패소 → 쿼터·수출세 폐지, 허가제 전환"], ["2020.10", "수출통제법 제정(명분: 자원 → 안보)"], ["2023.07", "갈륨·게르마늄 수출통제"], ["2023.10", "흑연 수출통제"], ["2024.08", "안티모니·초경질 재료"], ["2024.12", "갈륨·게르마늄·안티모니 대미 수출 금지"], ["2025.02", "텅스텐·텔루륨·비스무스·몰리브덴·인듐 수출허가"], ["2025.04", "중희토류 7종(Sm·Gd·Tb·Dy·Lu·Sc·Y)·자석 수출허가"], ["2025.10", "Ho·Er·Tm·Eu·Yb 추가 12종, 역외적용·장비·기술·인력 통제"], ["2025.11", "미중 합의로 일부 1년 유예(허가제·군사용도 금지 유지)"], ["2026.01", "은 수출 허가제 전환, 대일 희토류 추가 규제"], ["2026.11", "대미 금수·희토류 통제 유예 종료 예정"]]}, "bullets": ["IEA: 전면 통제 시 비중국 하류산업 연 매출 위험 약 6.5조달러(미국·유럽 각 1.5조달러 이상)", "중국 희토류 자석 국가 추적 시스템(2024~25)으로 최종 용도 실시간 파악", "중국 수출금지·제한 기술목록에 희토류 추출·분리·자석 제조기술 추가", "자원보유국 확산: 인니 니켈(2014), 짐바브웨 리튬, 콩고 코발트, 남아공 크롬, 가봉 망간(2029 예고)", "2026년 9월 미중 계열사 확장 규칙 유예 종료 예정(역외통제 재개 가능)"], "kr": "국내 자석·반도체·배터리 소재 기업의 원료 조달처 중 중국산 비중과 수출허가 취득 현황은 실사에서 반드시 확인할 항목이다. 비중국 회수·정제 역량(고려아연, 포스코인터내셔널, LS에코에너지)의 전략 가치가 커지는 배경이다."}, {"group": "희토류·자석", "title": "희토류 밸류체인: 병목은 채굴이 아니라 분리·정제와 자석", "period": "2025.10~2026.07", "lede": "중국의 희토류 지배력은 채굴(약 60%)보다 분리·정제(91%)와 영구자석(94%) 단계로 갈수록 견고해지며, 그 원천은 매장량이 아니라 수십 년의 용매추출 운전 경험과 사회화된 환경비용이다.", "body": ["희토류는 란탄족 15개 원소와 스칸듐·이트륨을 합친 17개 원소로, 4f 전자의 강한 스핀-궤도 결합 덕분에 0.1~1%만 첨가해도 자석·광학·촉매 특성을 극적으로 바꾼다. 매장량 자체는 적지 않지만(세계 약 1.2~1.3억톤, 중국 48.4%) 란탄족 수축으로 원소 간 화학적 성질이 거의 같아 분리가 극도로 어렵다. 경희토류(La~Eu)는 부존량이 많고, 중희토류(Gd~Lu, Y)는 희소하고 분리가 어려워 훨씬 비싸다.", "분리는 산에 녹인 희토류 용액을 P507 등 추출제가 든 유기상과 섞어 원소별로 조금씩 나누는 용매추출(SX)을 수십~수백 단 연결해 이뤄진다. 경희토류는 10~20단이면 되지만 중희토류는 100~200단 이상이 필요하다. 추출제와 산은 표준화돼 누구나 구할 수 있지만, 중국은 30년 넘게 100개 이상의 SX 라인을 산업 규모로 운전하며 회수율 99.5%(서방 95~97%), 고농도 원료 투입(250~300g/L vs 100~150g/L), 산 소비 60% 절감 등 운전 노하우를 축적했다.", "환경비용도 결정적이다. 희토류 1톤 생산 시 폐가스 약 9,600~12,000㎥(황산 포함 독성가스 약 6만㎥라는 추정도 있음), 산성폐수 75㎥~20만L, 토륨 등 방사성 잔류물 약 1톤이 나온다. 1980년대 이후 선진국이 환경 문제로 제련시설을 닫는 동안 중국은 이 비용과 주민 반발을 국가가 떠안았고, 호주·캐나다는 폐기물 처리비가 총원가의 20~25%에 이른다. 미국 Mountain Pass가 2002년 폐광한 이유도 중국 바이윈어보의 저가 공세와 환경 정화 비용이었다.", "그래서 탈중국의 핵심은 광산이 아니라 미드스트림과 다운스트림이다. 서방이 광산을 늘려도 분리·금속화·합금·분말·소결·가공·코팅·고객인증까지 다단 공정이 이어지지 않으면 시장이 쓸 수 있는 '유효 공급'은 늘지 않는다. 중국 외 중희토류 정제 비용은 2029년에도 중국의 5~7배로 추정되고, 서방의 중희토류 대중 의존도는 2024년 99%에서 2030년에도 91%로 예상된다(CRU)."], "table": {"cols": ["단계", "중국 점유율", "주요 비중국 대안"], "rows": [["매장", "48.4%", "베트남·브라질·러시아·호주"], ["채굴", "58~70%(연도·출처별 차이)", "미국 Mountain Pass(약 11.5~16%), 호주 Mt Weld, 미얀마 12%"], ["분리·정제", "89~91%(중희토류 98~99%)", "말레이시아 Lynas(7%), 프랑스 Solvay(약 1%)"], ["금속·자성합금", "90~92%", "일본 7%, 베트남"], ["영구자석", "94%", "일본 Shin-Etsu, MP Materials(1,000톤), 에스토니아 Neo"]]}, "bullets": ["중국 희토류 특허 약 4,000여 건(미·일의 약 8배)", "NdPr 손익분기: 중국 약 $50/kg vs 해외 설비 1/4은 $100/kg 이상", "북방희토 대비 Lynas 산화물 원가 25~35% 높음", "중국 쿼터 증가율: 2021~23 +20%대 → 2024 +4~6% → 2025 비공개", "원료가 아닌 제품 전략: LREE 산화물 수출은 두고 HREE·자석 완제품으로 통제"], "kr": "한국은 희토류~영구자석 공급망이 사실상 전무해, 정제는 해외에 두고 자석만 국내에서 만드는 일본식 분업과 동맹 기반 조달이 현실적 경로로 제시된다. 제이에스링크·성림첨단산업(자석), LS에코에너지(금속화), 포스코인터내셔널(원료·분리정제), 고려아연(폐자석 리사이클)이 각 단계에 포진한다."}, {"group": "희토류·자석", "title": "미국식 국가자본주의: MP Materials 모델과 서방 공급망 재건", "period": "2025.07~2026.07", "lede": "미국은 희토류를 국가안보 문제로 격상하고 지분투자·가격하한·전량구매·저리대출을 결합한 패키지로 민간 투자의 가격 리스크를 정부가 흡수하는 모델을 만들었다.", "body": ["트럼프 2기 통상정책은 무역적자 해소보다 경제안보(재산업화, 대중 절연)를 목표로 하며, 정부가 인텔·MP Materials·Lithium Americas(DOE 5%)·Trilogy Metals(10%+워런트) 등 개별 기업 지분을 직접 취득하는 '미국식 국가자본주의'로 전환하고 있다. 법적 근거는 1950년 국방물자생산법(DPA), 국방수권법(NDAA), IRA 45X(제조원가 10% 세액공제), 그리고 2025년 7월 OBBBA의 국방부 핵심광물 자금(직접 75억달러: 비축 20억+산업기반기금 50억+신용 5억)이다.", "상징적 사례가 2025년 7월 미 국방부(전쟁부)-MP Materials 계약이다. 4억달러 전환우선주(지분 최대 약 15%), 1.5억달러 중희토류 분리 대출, NdPr 가격하한 $110/kg(10년, 당시 시장가 약 $57), 10X 자석공장 10년 100% 오프테이크와 최소 EBITDA 1.4억달러 보장을 묶었다. 시장가가 하한을 넘으면 초과분의 30%를 국방부가 환수한다. MP는 2025년 순이익 흑자로 전환했고 Apple(5억달러, 선급금 2억달러)·GM과 상업 공급계약도 맺었으며, 자석 생산능력을 1,000톤에서 2028~29년 1만톤으로 늘린다.", "이 모델은 확장 중이다. Lynas USA는 텍사스 Seadrift 중희토류 분리시설(비용환급 약 2.58억달러, 환경허가 이슈로 협상)과 NdPr $110 하한이 적용된 약 96백만달러 산화물 공급 LOI를, USA Rare Earth는 상무부 CHIPS로부터 최대 15.8억달러(보조금 2.77억+대출 13억달러, 정부지분 8~16%) LOI를 받았다. G7은 2026년 1월 희토류 가격하한 시장개입을 공식화했고, 2026년 2월 55개국이 참여하는 FORGE(기존 MSP 재출범)는 동맹국 참조가격과 덤핑물량 조정관세를 도입한다. 2026년 2월 Project Vault는 핵심광물 60일치 비축을 민관 계약형으로 추진한다.", "한계도 뚜렷하다. Mountain Pass 정광은 NdPr이 15.7%지만 중희토류는 1.8%(그중 Dy/Tb 4%)에 불과해 고등급 자석용 Dy·Tb를 외부에서 조달해야 하고, MP의 NdPr 산화물 생산은 2025년 3분기에도 풀가동(분기 약 1,500톤)에 못 미쳤다. Energy Fuels의 Dy 산화물 파일럿 생산은 약 29kg(2025)에 그쳤다. 결국 서방은 채굴 대비 분리·정제·자석 역량이 절대적으로 부족해 완전한 자립까지 다년이 걸리며, 정권 교체 시 정책 지속성이 최대 리스크다."], "table": {"cols": ["기업/프로젝트", "지원 내용", "진행"], "rows": [["MP Materials(Mountain Pass·10X)", "우선주 4억$, 대출 1.5억$, NdPr $110 하한, 10년 오프테이크, 최소 EBITDA 1.4억$", "2025 흑자전환, 자석 1만톤 2028~29"], ["Lynas USA(Seadrift, 텍사스)", "비용환급 약 2.58억$, 산화물 LOI 약 96백만$(하한 $110)", "HRE 분리 Phase1 진행, 환경허가 협상"], ["USA Rare Earth(Round Top·오클라호마 자석)", "CHIPS 최대 15.8억$ LOI, 정부지분 8~16%", "자석 1,200톤 → 4,800~5,000톤 계획, Serra Verde 약 28억$ 인수"], ["Critical Metals(그린란드 Tanbreez)", "EXIM 대출 자격, 지분 인수 논의", "중희토류 비중 약 30%"], ["Project Vault", "EXIM 100억$ + 민간 20억$", "60종 핵심광물 60일치 비축(2026.02 발표)"]]}, "bullets": ["MP Materials 1Q26 NdPr 생산 917톤(+63%)·판매 1,006톤(+117%)", "MP 정광은 과거 중국 Shenghe에 판매하다 2025년 7월 중단", "EU CRMA: 2030년 역내 채굴 10%·가공 40%·재활용 25%·단일국 의존 65% 이하", "일본은 2010년 이후 JOGMEC·소지쯔가 Lynas에 2.5억달러 투자해 대중 의존도 90% → 60%대", "밸류에이션: MP EV/EBITDA 58배, PSR 약 40배 — 정책이 보강한 현금흐름 하단의 옵션가치"], "kr": "포스코인터내셔널은 미국 ReElement와 연 6,000톤 분리정제 공장(2027년 4분기 시범생산, 2028 양산)을 추진하고 북미·유럽 완성차와 비중국 원료 영구자석 장기계약(약 9,000억원·2,600억원)을 맺었다. 한미 핵심광물 협력 프레임워크(2026.04)가 국내 기업의 미국 가치사슬 편입 통로다."}, {"group": "희토류·자석", "title": "희토류 수요의 2차 파도: EV에서 로봇·방산으로", "period": "2025.12~2026.05", "lede": "희토류 수요는 EV·풍력의 설치기반 위에, 관절마다 모터가 붙는 로봇과 대체 불가능한 방산·우주 용도가 얹히며 경기보다 기술 보급률에 민감한 구조로 바뀌고 있다.", "body": ["희토류 시장은 중량이 아닌 가치 기준으로 영구자석(NdFeB) 비중이 압도적이다. 2024년 세계 희토류 수요는 약 9만톤(IEA), EV 모터용은 37kt(+32%)에서 2025년 43kt로 늘었고 EV 1대 구동모터에 NdFeB 약 1~2kg이 들어간다. 2025년 세계 전기차 판매는 2,000만대를 넘어 신차의 23.5%를 차지했다. 고온 EV 모터용 자석에는 Dy·Tb가 8~12% 첨가되며, 이 두 원소가 자석 원가의 30~50%를 차지한다.", "로봇은 EV의 연장이 아니라 '모터 개수'가 늘어나는 시장이다. EV는 대당 구동모터 중심이지만 로봇은 관절 수만큼 액추에이터가 분산 탑재된다. Tesla Optimus는 액추에이터 28개(회전 14, 선형 14)에 NdFeB 약 3.5kg이 들어갈 것으로 추정되고, 휴머노이드 1억대 보급 시 NdPr 수요가 10~20만톤이라는 추정도 있다. 휴머노이드는 이미 연간 50만대 설치·가동 400만대 이상인 산업용 로봇 설치기반 위에 얹히는 새 폼팩터이며, 부품원가 40% 절감 시 2035년 140만대·380억달러 시장이 제시됐다.", "특히 로봇 손가락은 희토류 대체가 어렵다. 어깨·팔꿈치 모터(10~50cm)는 페라이트로 설계 대체가 가능하지만, 손가락 관절의 지름 5~10mm 마이크로 모터는 고토크·저중량을 동시에 만족하는 NdFeB가 사실상 유일하다. 장시간 작동 시 열이 누적돼 효율이 10~20% 떨어지고 탈자 위험이 생기는데, Dy 1~5% 첨가로 보자력이 2~3배 강화돼 휴머노이드 희토류 수요 중 Dy 비중이 20~30%에 이른다.", "방산·우주에서는 특정 원소에 묶인 영역이 많다. 미사일 핀 구동기는 유압에서 희토류 자석 전기기계식 액추에이터(EMA)로 전환됐고, F-35 1대에 희토류 약 417kg이 들어간다. 군용 고출력 레이저의 95%가 Yb 파이버 레이저인데 Yb 산화물의 99%가 중국산이며 ASML EUV 광원 펌프 레이저도 Yb에 의존한다. 위성 간 광통신은 Er 도핑 증폭기(EDFA), AESA 레이더 T/R 모듈은 Y·Gd·Sm·Nd·Dy를 쓰고, SmCo 자석(퀴리온도 700~850℃)은 미사일·항공엔진·소나에 쓰인다. 중국이 2025년 통제한 12개 원소는 대부분 이 무기체계 소재와 겹친다."], "table": {"cols": ["항목", "Dy", "Tb", "Sm(SmCo)"], "rows": [["스핀-궤도 결합", "매우 강함", "가장 강함", "-"], ["첨가 효과", "보자력·고온 자화 유지", "Dy보다 강한 자화방향 고정", "퀴리온도 약 700~850℃로 상승"], ["실무 용도", "일반 NdFeB 보자력 강화", "고온·고이방성 고급 자석", "방산·항공 고온 자석"], ["단점", "자화세기 감소", "희귀·고가(Nd의 약 20배)", "가공성·가격 불리"]]}, "bullets": ["SH등급 자석 1톤에 Dy 약 42kg 필요(추정)", "Dy·Tb 저감(입계확산·HDDR)과 재활용 확대는 중희토류 프리미엄 완화 요인", "희토류 가격 급등 시 페라이트 부분 대체 확대(완전 대체는 어려움)", "휴머노이드 상업화 지연 시 2차 수요 파동 시점도 지연", "중국 Sanhua가 Optimus 선형 액추에이터 약 70% 공급 예상"], "kr": "국내 로봇·액추에이터·방산 업체(한화시스템 레이저 대공무기 '천광', 현대로템 UGV)의 자석·희토류 조달 안정성이 원가와 양산 일정의 핵심 변수다. 페라이트 대체 수혜 영역에는 유니온머티리얼·삼화전자가 있다."}, {"group": "리튬·특수합금·강관", "title": "리튬 바닥 통과: 공급 쇼크·정책 전환·ESS 수요", "period": "2025.06~2026.09", "lede": "리튬은 2025년 6월 톤당 약 8,100달러에서 바닥을 찍고 중국의 자원안보 정책 전환, 자원국 수출통제, ESS 수요 급증으로 약 3배 반등했으며, 리포트들은 단기 박스권 후 2027년 구조적 공급부족 진입 가능성을 제시한다.", "body": ["금속가격은 ①초과수요 ②신규 공급 증가 ③초과공급(고원가 업체 파산) ④초과공급 해소의 4단계로 순환하며 저점은 현금원가 수준에서 형성된다. 리튬은 2023~25년 남미 저비용 공급 확대로 초과공급 국면을 겪었고, 2024~1H25 톤당 약 1만달러 안팎에서 장기한계비용(LRMC 약 $12,000)을 밑돌며 바닥을 다졌다. 2025년 하반기부터 중국 재고 급감, CATL 젠샤워 광산 중단 장기화, 정책 변화가 트리거가 됐다.", "공급 측 쇼크는 중국과 아프리카에서 동시에 나왔다. CATL 젠샤워 광산(세계 생산의 약 3%)은 2025년 8월 조업허가 만료로 멈췄고 2026년 6월 허가를 받았지만 환경영향평가 미완료로 미가동 상태다. 이춘시 광산 생산 중단 규모는 연 28만톤(중국 전체의 12~15%)으로 거론되고, 2024년 11월 개정·2025년 7월 시행된 광물자원법은 리튬을 전략광물로 지정하고 승인권을 자연자원부로 일원화했다. 짐바브웨(글로벌 공급의 약 7~10%)는 2026년 2월 원광·정광 수출을 무기한 중단했다가 4월 쿼터제(정광 수출세 10%)로 완화했고 2027년 1월 정광 수출 전면 금지를 예고했다.", "수요는 EV에서 ESS로 무게가 옮겨갔다. 중국은 2025년 6월 신설 신재생 발전소의 전력 판매를 고정가격에서 시장가격으로 바꿔 저장 후 고가 판매의 차익 유인을 만들었고, ESS 저장용량 목표를 2027년 180GW로 제시했다. 글로벌 ESS 출하는 2025년 315GWh에서 2026년 450~750GWh로 늘 전망이며 BNEF는 6개월 만에 2026년 ESS 설치 전망을 360GWh에서 459GWh로 올렸다. 여기에 배터리 수출 증치세 환급 축소(2026.04 9% → 6%, 2027.01 폐지)를 앞둔 선구매가 2026년 1월 탄산리튬 선물을 9% 끌어올렸다.", "기관별 전망의 괴리가 크다는 점은 주의해야 한다. IEA는 보수적 시나리오에서도 2030년 리튬 수요(Li 기준)가 53.1만톤으로 2024년 대비 159% 늘고 평균 규모 광산 55곳이 추가로 필요하다고 보지만, LCE 기준 2030년 수요는 Albemarle 280만~360만톤, BMI 355만톤, BNEF 300만톤 등으로 편차가 크다. 공급 측에서도 BMI의 2030년 증분 211만톤 중 점토리튬·DLE·국유화 분쟁 등 고위험 프로젝트가 많아 20% 이상이 실현되지 않을 수 있다는 분석이 제시됐다. 탄산리튬은 5월 중순 19.2만위안(+198% YoY) 이후 6월말 16만위안, 9월 수산화리튬 약 $18,000~20,000로 조정됐다."], "table": {"cols": ["기관", "기준연도 수요", "2030년 전망"], "rows": [["IEA(Li 기준, 보수적)", "20.5만톤(2024)", "53.1만톤"], ["Albemarle(LCE)", "160만톤(2025)", "280만~360만톤"], ["BMI(LCE)", "158만톤(2025)", "355만톤"], ["Lithium Harvest(LCE)", "110만톤(2024)", "300만~370만톤"], ["BNEF(LCE)", "120만톤(2024)", "300만톤"]]}, "bullets": ["탄산리튬 $8,100(2025.06) → $23,000(2026.01), 스포듀민 스폿 600 → 2,500호주달러(+316%)", "짐바브웨 2027년 공급차질 시나리오: Bull 6~9만톤, Base 3~6만톤, Bear 1~3만톤 LCE", "2025년 글로벌 리튬 수요 146만톤 LCE(+23%), ESS +60%", "나트륨이온배터리(CATL·BYD 양산)는 대형 ESS·저가 EV에서 잠재 대체재", "리스크: CATL 광산 조기 재가동·짐바브웨 쿼터 유지 시 가격 조정"], "kr": "POSCO홀딩스는 아르헨티나 염호(1공장 2.5만톤, 2026.03 첫 월간 흑자, 2공장 2026.10 준공), 광양 수산화리튬 4.3만톤, MinRes 중간지주 30%(연 27만톤 정광 오프테이크)로 염수·광석·DLE 3원화 전략을 추진하며, 리튬 캐파를 9.3만톤에서 2033년 17.3만톤으로 늘릴 계획이다."}, {"group": "리튬·특수합금·강관", "title": "특수합금: 공급자 우위 시장과 적층제조(AM)의 개화", "period": "2025.10~2026.09", "lede": "항공엔진·가스터빈·우주 발사체 수요가 동시에 늘지만 청정용해 설비와 인증 장벽 때문에 공급이 따라가지 못해, 특수합금은 철강 업종 안에서 가장 높은 멀티플을 받는 고수익 니치가 됐다.", "body": ["초합금은 니켈·티타늄·코발트·철 기반으로 초고온·고압에서 크리프(고온 장시간 하중에 의한 영구 변형)와 산화를 견디는 소재다. 글로벌 시장은 2021년 45.3만톤에서 2031년 98.9만톤(CAGR +8.3%, GMI)으로 성장이 전망되며 수요의 52%가 항공우주, 27%가 산업용 가스터빈, 지역별로는 북미가 41%다. 미국이 세계 특수합금 수요의 약 40%를 차지한다.", "공급 제약은 진입장벽에서 온다. VIM → VAR 또는 VIM → ESR → VAR 같은 청정용해 설비가 필요하고, 공장 건설에 18~36개월, 가스터빈 Hot Section·엔진 회전체 인증에 24~48개월이 추가로 걸린다. 그 결과 Carpenter의 제트엔진 리드타임은 2024~25년 60~65주 이상으로 고착됐고 ATI의 엔진 Hot Section 디스크 리드타임도 1년 이상이다. 2020~25년 Carpenter SAO 영업이익과 ATI HPMC EBITDA는 매출 성장(13%·16%)을 크게 웃도는 연 67%·35%로 늘었고 항공우주·방산 매출 비중은 60%대로 높아졌다.", "수요는 세 갈래다. 항공은 운항 여객기 2.47만대에 2044년까지 신규 인도 4.3만대(Airbus)가 전망되고, LEAP·GTF 차세대 엔진은 특수합금 사용량이 2배 이상이며 엔진 애프터마켓 수요는 역사적 평균의 2배 속도다. 가스터빈은 AI 데이터센터 전력 공백을 메우는 LNG 복합발전 수요로 Siemens Energy 수주잔고가 1,579억달러(사상 최대)로 늘었고 8월 14GW 주문의 60%가 데이터센터향이었다. 우주는 미국 FAA 상업 우주 운항이 FY2015 14건에서 FY2025 204건으로 늘었다.", "성장의 새 축은 적층제조(AM)다. 금속 AM 분말 수요는 2020년 4,650톤에서 2025년 17,770톤으로 연 31% 늘었고, 니켈계 초내열 분말합금 수요는 2020년 1,030톤에서 2030년 4,095톤(연 23%)으로 전망된다. 절삭가공은 1kg 부품에 약 20kg의 소재가 필요하지만 AM은 약 1.2kg이면 돼, 분말 가격이 밀프로덕트의 2배여도 원재료비가 약 88% 절감된다. GE Aerospace LEAP 연료노즐 팁은 20개 부품을 1개로 통합해 무게 −25%, 내구성 5배, 제조비용 −30%를 달성했고, MRO에서는 DED 공법으로 손상 부위만 복원하는 재생수리가 상용화됐다."], "table": {"cols": ["기업", "지표", "수치", "시점"], "rows": [["Carpenter(SAO)", "Surcharge 제외 영업이익률 / EBITDA 마진", "30.5% / 36.0%", "FY4Q25"], ["ATI(HPMC)", "EBITDA 마진 / 수주잔고", "23.7% / 41억달러(사상 최대)", "2Q25 / 1Q26"], ["세아베스틸지주", "특수합금 생산능력(국내+미국 SST)", "4,000 + 6,000 = 10,000톤", "2026"], ["에이치브이엠", "생산능력(1공장 → 서산 2공장 포함)", "2,400 → 15,600톤", "2025 증설 중"], ["스피어", "SpaceX 장기공급계약", "10.5억달러(2025.07~2035.12)", "공시"]]}, "bullets": ["업종 내 멀티플 서열: 철강(EV/EBITDA 약 6.5배) < 신동(8.7배)·리튬 < 특수합금(약 25.3배)", "니켈 50% 이상 특수합금 대미 상호관세 15%(가격 전가 가능)", "CMC(세라믹 복합재)는 무게 1/3·내열 20% 우수한 보완재지만 전면 대체는 어려움", "리스크: 항공기 제조 병목·파업, 신규 공장 인증·수율 지연, 소수 고객 의존", "Boeing 월 38대 제한(42대 가능성), Airbus 2027년 월 75대 목표"], "kr": "세아베스틸지주의 SST(텍사스 Temple, 2026년 6월 준공, 모합금 46종·분말합금 14종, 2027년 상업생산 목표)와 세아항공방산소재(1Q26 OPM 20%), 에이치브이엠, 스피어, 태웅(대형단조)이 국내 노출 기업이다. 특수합금 기업 IPO에서는 인증(NADCAP·고객 품질인증) 완료 여부와 초기 수율이 멀티플의 전제다."}, {"group": "리튬·특수합금·강관", "title": "에너지강관(OCTG)과 호르무즈: 유가·관세·해상풍력의 교차점", "period": "2026.03~2026.09", "lede": "이란 전쟁과 호르무즈 통항 차질로 유가가 오르고 미국 시추가 저점을 지나며, 50% 관세 속에서도 미국 OCTG 가격이 올라 국내 강관사의 수출 채산성이 회복되고 있다.", "body": ["2026년 미국-이스라엘의 이란 공격 이후 호르무즈 해협 통항 리스크가 현실화됐다. 미 중부사령부는 4월 말까지 봉쇄로 6,900만배럴의 원유가 팔리지 못했다고 밝혔고, UAE 해상유전 차질(합산 약 −193만b/d 추정)과 미국 전략비축유 주간 712만배럴 방출(러-우 전쟁 이후 최대)이 이어졌다. 9월 초에는 보복 공격이 재격화돼 호르무즈 통과 원자재 운반선이 평시 125척에서 일평균 약 10척으로 급감했고 사우디 우회 수출로(홍해·동서 파이프라인)도 위협받았다. WTI는 7월초 68.6달러에서 9월 91.5달러로 올랐고 EIA는 2026년 평균 전망을 86.8달러로 상향했다.", "과거 오일쇼크와 비교하면 이번 충격은 고점 도달이 0~1개월로 가장 빨랐다. 2차 오일쇼크는 고점까지 33개월, 기준가 복귀까지 52개월이 걸렸지만 걸프전·러-우전쟁은 각각 5·4개월 만에 복귀했다. 리포트는 생산능력 파괴가 아니라 '수출 병목'형 충격이라 발생과 소멸이 모두 빠를 수 있다고 해석하며, EIA·IEA도 2027년 공급과잉 전환을 전망한다.", "미국 시추는 느리게 반응한다. 원유 리그 수는 5월 408개 저점에서 9월 450개로 회복했지만, 2020년 이후 리그 수의 유가 반응계수는 5.92에서 2026년 1.79로 크게 둔화됐다. 대형 E&P가 자본규율로 CapEx를 보수적으로 운용하고(ConocoPhillips 약 +2% 상향), 미국 원유 생산은 DUC 재고 소진에 기대 왔다. DUC는 7월 4,935개로 감소폭이 둔화돼 시추·완결 활동이 활발함을 시사한다.", "가격은 관세가 떠받친다. 50% 232조 관세와 제3국 AD/CVD로 저가 수입재가 막히면서 북미 OCTG P110 현물가는 9월 첫째 주 숏톤당 $2,625로 2주 새 +10%, 연초 대비 +31.4% 올랐다. 국내 강관사는 판매량보다 가격 상승분의 판가 반영과 수출 수익성에 주목할 시점이며, 3분기는 비수기·환율 하락·미국향 물량 감소로 일시 감익 후 4분기부터 이익 확장이 예상된다. 중장기로는 알래스카 LNG(가스관 약 1,300km, 1단계 X70 라인파이프 약 70~72.5만톤), 영국 AR7(8.44GW, 고정식 97.7%)·Dogger Bank South(3.0GW, 모노파일 113~200개), 국내 신안우이 해상풍력이 대구경 강관 수요처다."], "table": {"cols": ["사례", "고점 도달", "고점 대비 −20%", "기준가 복귀"], "rows": [["1차 오일쇼크", "3개월", "-", "-"], ["2차 오일쇼크", "33개월", "4개월", "52개월"], ["걸프전", "1개월", "2개월", "5개월"], ["러-우 전쟁", "3개월", "3개월", "4개월"], ["미-이란(호르무즈)", "0~1개월", "진행 중", "진행 중"]]}, "bullets": ["세아제강 미국 생산능력 Welded 116.2만톤·Seamless 118만톤, 넥스틸 텍사스 7.2만톤", "캐나다, 한국산 OCTG에 반덤핑 13.6%(5년) 부과", "국내 유정관 수출 2Q26 13.3만톤(−0.1%), 송유관 11.7만톤(+40.1%)", "알래스카 LNG는 예비 공급계약(Corinth Pipeworks, Europipe)으로 국내 직접 수혜가 제한될 수 있음", "북미 LNG 수출용량 11.4Bcf/d(2024초) → 28.7Bcf/d(2029) 전망"], "kr": "세아제강·세아제강지주(세아윈드 영국 모노파일, 2Q26 NVE 충당금 1,100억원), 넥스틸, 휴스틸이 직접 노출된다. 강관 업종은 유가(WTI)와 PBR의 상관관계가 높아 유가 가정이 밸류에이션의 출발점이다."}], "market": {"lede": "철강은 '수요 정체 + 설비 과잉 + 지역별 관세'라는 삼중 구조 속에서 가격이 지역별로 분절됐고, 비철은 '광산·제련·황산의 연쇄 병목 + 전력화·안보 수요 + 거래소 재고의 지역 편중'으로 가격 하단이 올라갔다. 아래 차트는 리포트들이 인용한 원출처 수치를 재구성한 것으로, 전망치는 '추정' 태그로 구분했다.", "bars": [{"title": "2026E 지역별 철강 수요 증감률", "unit": "% YoY", "note": "WSA 단기전망(2026.04) 기준. 증가분 대부분이 비중국(인도·ASEAN·MENA). 2025년 중국 수요는 −7.1%로 8억톤 하회(확인)", "items": [{"l": "글로벌", "v": 0.3, "tag": "추정"}, {"l": "중국", "v": -1.5, "tag": "추정"}, {"l": "인도", "v": 7.4, "tag": "추정"}, {"l": "미국", "v": 1.7, "tag": "추정"}, {"l": "한국", "v": 0.3, "tag": "추정"}, {"l": "MENA", "v": -4.5, "tag": "추정"}]}, {"title": "구리 벤치마크 TC 추이", "unit": "$/톤", "note": "광산-중국 제련소 연간 협상 수수료. 2026년 사상 최초 0달러, 현물 TC는 2026-08-14 −$227.5. 원출처 Codelco·CRU", "items": [{"l": "2015", "v": 92, "tag": "확인"}, {"l": "20 ", "how": "적정 P/B = (ROE − g) / (COE − g). COE는 무위험이자율+베타×시장위험프리미엄. 과거 유사 업황 구간(스프레드·판매량이 비슷한 시기)의 PBR 중간값을 적용하거나 12개월 선행 PBR 밴드의 하단·평균 회귀를 본다.", "band": "국내 고로사 12M Fwd P/B 0.2~0.5배(2026, 역사적 저점권). POSCO홀딩스 0.4~0.5배(2분기 일시 0.6~0.7배), 현대제철 0.19~0.3배(20년 중앙값 0.4배). 2015년 말 중국 구조개혁 발표 당시 0.6~0.8배. 글로벌 철강사 평균 PBR 약 1.0배, PER 12.8배(2026E). 리포트 추정·Bloomberg", "pitfalls": "ROE가 1~3%대로 낮아 PBR 할인이 '저평가'가 아니라 '정당한 할인'일 수 있다. 2015년과 달리 중국 부동산 회복 가시성이 낮아 동일 폭 리레이팅 가정은 위험하며, 자회사 손실(건설·리튬 램프업)이 연결 ROE를 왜곡한다."}, {"name": "업종 상대 PBR 디스카운트", "when": "지수 변동성이 둔화되며 저PBR 업종이 반등하는 '키 맞추기' 국면, 업종 전체의 저평가 정도를 판단할 때", "how": "업종 PBR과 코스피 PBR의 괴리율을 역사 평균과 비교해 괴리 해소 여지를 가늠한다.", "band": "철강 업종 PBR 0.44배, 코스피(1.5배) 대비 약 70% 할인(2026.02). KRX 철강 지수 PBR 0.68배, 할인율 67%(2026.06) vs 2008년 이후 평균 33%. 리포트 추정", "pitfalls": "PBR이 37% 올라도 0.6배에 불과할 정도로 절대 수준이 낮지만, 괴리 해소는 실적(스프레드) 확인이 전제다. 시점별로 수치가 달라 인용 시 기준일을 명시해야 한다."}, {"name": "사업부별 SOTP(EV/EBITDA 합산)", "when": "철강+리튬, 신동+방산, 제련+전선+전력기기처럼 이종 사업을 겸영하는 기업과 지주사", "how": "사업부별 차기 EBITDA에 해당 업종 피어 EV/EBITDA를 적용해 합산하고, 상장 자회사는 시가에 할인, 순차입금을 차감한다. 사업형 지주사는 NAV에 30~50% 할인을 적용한다.", "band": "2027년 EV/EBITDA 피어 평균: 글로벌 철강 약 6.5배, 구리 가공(신동) 약 8.7배, 특수합금(Carpenter·ATI) 약 25.3배, 글로벌 리튬 평균 약 6.8배(2028 EBITDA 기준), 방산은 방산 피어에 20% 할인. Bloomberg 컨센서스(리포트 인용)", "pitfalls": "사업부 분리 공시가 불충분하면 EBITDA 배분이 자의적이 된다. 지주사 할인율(중복상장 규제, 유통주식 비율)과 자회사 지분 유동화(PRS·EB)의 정산 리스크가 NAV를 크게 흔든다."}, {"name": "리튬 사업가치(EV/EBITDA·PSR·원가 커브)", "when": "지주사 내 리튬 자회사, 램프업 중 적자인 신규 광산·정제 사업", "how": "정상 가동 연도(예: 2028E) EBITDA에 글로벌 리튬 피어 멀티플을 적용하거나 미래 매출×피어 PSR로 산정하고, 리튬 가격 시나리오(LCE $20,000·25,000/t)별 민감도를 붙인다. C1 원가 대비 판가 마진이 지속 가능성의 기준이다.", "band": "글로벌 리튬 업종 평균 PBR 약 2.4배(2026E). POSCO 리튬 사업가치 리포트 추정 2030년 8조원·2035년 11조원(가격 가정 의존). 리튬 가격 $25/kg 지지 시 2028년 리튬 영업이익 약 5,179억원 추정", "pitfalls": "가격 가정 하나로 가치가 수 배 변한다. 자원국의 정부 몫 확대(칠레 SQM 2031년부터 영업이익의 85%) 같은 제도 변화, 기관별 수요 전망 편차(최대 3배)를 반드시 시나리오로 반영해야 한다."}, {"name": "정책 옵션가치(EV/Sales·PSR) — 희토류·희소금속", "when": "매출·이익이 아직 작지만 배타적 공급 지위와 정부 가격하한·오프테이크가 있는 비중국 희토류·자석·희소금속 기업", "how": "현재 이익이 아닌 정책이 보강한 미래 현금흐름의 하단(가격하한·구매보장)을 선반영해 EV/Sales·PSR로 평가한다. 유사 거래 멀티플(예: USA Rare Earth의 영국 금속 제조사 인수 EV/Sales 19배)에 보수적 할인을 적용한다.", "band": "글로벌 광산사 평균 PBR 2.1~2.3배 대비 희토류 기업 100% 이상 프리미엄. 리포트 추정", "pitfalls": "Molycorp는 2010~11년 가격 10배 급등기에 주가가 10배 오른 뒤 가격 90% 하락으로 2015년 파산했다. 현물 가격보다 가격하한·구매계약 같은 하방 장치의 존재와 집행 단계(MOU vs 실계약), 정권 교체 리스크를 먼저 봐야 한다."}, {"name": "P/E(방산·특수합금 신사업)", "when": "탄약 등 방산 부문, 순이익 가시성이 생긴 특수합금 신공장", "how": "목표 연도 순이익에 피어 P/E를 적용하되, 제품 한정·납기 변동성·램프업 리스크를 할인으로 반영한다.", "band": "특수합금 신사업: 글로벌 특수합금 피어 PER 대비 약 20% 할인 적용 예시(2028E 순이익 기준). 신동+방산 겸영 기업 P/E 7.8~15배로 K-방산 피어(약 21.6배) 대비 47~76% 할인(2026년 시점별). 리포트 추정", "pitfalls": "방산 사업 분할·매각 등 지배구조 불확실성, 선적 차질·수락시험 지연에 따른 매출 이연이 할인을 정당화한다. 신공장은 인증 획득 전 이익이 없어 P/E 적용 시점이 너무 이르면 과대평가된다."}, {"name": "제련사 SOTP와 ROE-PBR", "when": "아연·연·구리 제련사처럼 본업(TC·Free Metal)과 부산물·희소금속·해외 신규 거점이 섞인 기업", "how": "본업은 ROE 대비 PBR(역사적으로 ROE 10% 시기 최고 PBR 약 1.8배)로, 희소금속·해외 제련소 거점은 별도 옵션가치로 분리해 합산한다. 이익 급증기에는 EV/EBITDA 압축 여부를 본다.", "band": "2026-06 기준 P/E 20.8배, P/B 2.1배. 리포트 추정", "pitfalls": "1Q26 이익의 상당 부분이 금·은 가격 급등과 판가·원가 시차(일회성)에서 나왔다. 연 5조원대 CAPEX(2027~28E)와 차입 증가, 경영권 분쟁에 따른 유통물량 이슈가 멀티플을 흔든다."}, {"name": "신동·가공업체 PBR vs ROE(정상 이익 기준)", "when": "구리 가격에 이익이 즉시 반응하는 신동·황동봉·동 선재 업체", "how": "메탈게인·재고평가이익을 제외한 정상 이익 기준 ROE와 PBR을 비교하고, 과거 최대 실적기 PBR 밴드와 대조한다.", "band": "리포트 추정", "pitfalls": "가격 하락 반전 시 역래깅으로 이익이 급감한다. 헤지 파생손익이 금융비용으로 잡혀 영업이익과 순이익이 괴리될 수 있다."}, {"name": "유가 연동 PBR — 에너지 강관", "when": "OCTG·라인파이프 등 미국 시추 활동에 연동되는 강관사", "how": "WTI와 PBR의 높은 상관관계를 이용해 유가 가정에 따라 적정 PBR을 설정하고, 해외 법인·해상풍력 자회사는 SOTP로 별도 가산한다.", "band": "WTI 배럴당 80달러 유지 전제 시 적정 PBR 약 0.4배 적용 예시. 해상풍력 자회사는 유럽 해상풍력 업종 멀티플 적용. 리포트 추정", "pitfalls": "유가-리그 반응계수가 둔화(5.92 → 1.79)돼 유가가 올라도 물량 효과가 약할 수 있다. 해상풍력 자회사의 일회성 충당금(1,100억원)처럼 초기 단계 자회사가 현금을 소모한다."}], "notes": ["IPO 피어 선정 시 '금속'으로 묶지 말고 이익 원천별로 나눠야 한다: 범용 철강(PBR 0.2~0.5배), 신동·가공(EV/EBITDA 약 8.7배), 리튬(피어 PBR 약 2.4배), 특수합금(EV/EBITDA 약 25배), 희토류·자석(EV/Sales 기반 옵션가치
