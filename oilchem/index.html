 이상 장기화 가능", "read": "달러로 원료를 사는 정유·화학·비료 체인에서 환율은 곧 원가. 화학사 회사채 스프레드 축소는 자본비용 하락 → PBR 정상화의 선행 경로."}], "deep": [{"group": "정유 수급", "title": "원유는 남고 제품은 모자란다 — 전쟁 전에 이미 시작된 정유 업사이클", "period": "2025.11~2026.03", "lede": "2025년 가을 모든 리포트가 합의한 한 문장은 '원유는 공급 과잉이지만 석유제품은 타이트하다'였고, 이 비대칭이 호르무즈 봉쇄 이전부터 정제마진의 바닥을 끌어올리고 있었다.", "body": ["2026년 원유 수급 전망은 기관을 가리지 않고 공급 과잉이었다. 수요 증가에서 공급 증가를 뺀 순수요가 EIA -174만b/d, IEA -173만b/d, OPEC -261만b/d로 모두 마이너스였고, OPEC+는 2025년 4월부터 자발적 감산을 되돌리며 288만b/d를 증산했다. 해상에 떠 있는 원유가 COVID-19 수준을 넘고 미국-중국 VLCC 운임이 2023년 이후 최고로 오른 것은 수요처를 못 찾은 원유가 쌓이고 있다는 실물 신호였다. 그래서 2026년 유가 전망은 WTI 50~60달러대, EIA는 49달러까지 제시했다.", "그런데 정유는 정반대였다. 정제마진의 레벨은 원유가 아니라 '제품 수요 증가 대비 정제설비 순증설'로 결정되는데, 2025년 글로벌 정제설비는 폐쇄가 신규를 웃돌아 37만b/d 순감소했고 2026년 순증설도 55~110만b/d(기관별)로 수요 증가 100~120만b/d에 못 미쳤다. 미국·유럽 노후 설비 폐쇄(Valero Benicia 등), 나이지리아 단고테 RFCC 반복 정지, 우크라이나 드론 공격으로 러시아 정제량이 약 10% 줄어든 것이 겹쳤다. WoodMac은 2035년까지 세계 정제능력의 22%(1,840만b/d)가 폐쇄 위험에 있다고 봤다.", "여기에 제도 변화가 제품 쪽을 더 조였다. EU는 2026년 1월 21일부터 러시아 원유로 인도·터키 등 제3국에서 만든 정제품까지 수입을 금지했다. 유럽 경유 수입에서 러시아산은 2022년 48.4%에서 2024년 5.6%로 줄었고 그 빈자리를 중동(약 44~45%)·미국·인도가 채웠는데, 우회 정제품 경로까지 막히면서 경유 수입의 최대 18~19%가 흔들릴 수 있었다. 중국은 정제능력 상한(2,000만b/d), 수출 증치세 환급 축소(13→9%), 연료유 관세 인상(1→3%)으로 Teapot을 압박해 경유 수출을 2023년 대비 절반으로 줄였다.", "결과적으로 복합정제마진은 2025년 10월 약 14달러, 11월 15~20달러로 러-우 전쟁 특수기를 빼면 역사적 고점권에 올랐고, 전쟁 직전인 2026년 1~2월 평균도 9.1달러로 과거 평균(2010~25년, 2022 제외) 5.8달러를 크게 웃돌았다. 즉 호르무즈 봉쇄는 '업사이클을 만든' 사건이 아니라 이미 타이트하던 제품 시장에 불을 붙인 증폭기였다는 점이 이 섹터를 이해하는 출발점이다."], "table": {"cols": ["구분", "2025", "2026E", "2027E", "2028E", "출처"], "rows": [["정제설비 순증설(만b/d)", "-37 ~ +39", "55~110", "5~62", "0~20", "Thai Oil·BNEF·IEA·EIA·S-Oil(기관별 상이)"], ["석유 수요 증가(만b/d)", "+103~113", "+77~138(전쟁 전)", "-", "-", "EIA·IEA·OPEC(2025-10 기준)"], ["원유 순수요(만b/d)", "-", "-173 ~ -261", "-", "-", "EIA·IEA·OPEC"], ["복합정제마진($/bbl)", "5.5~6.5(연평균)", "6.6~7(전쟁 전 전망)", "-", "-", "리포트 추정(2025-11)"]]}, "bullets": ["정제마진은 유가가 아니라 원유-제품 가격차 — 유가가 내려도 제품가 하락이 제한되면 마진은 오른다", "2025~2030 누적 정제 증설 170만b/d vs 수요 증가 310만b/d(S-Oil 제시)", "국내 정유사 등경유 수율 50% 초과로 중간유분 강세의 직접 수혜 구조", "리스크는 러-우 종전(러시아 설비 복귀·제재 완화) — 단, 중국의 할인 원유 이점 축소가 상쇄한다는 반론", "전쟁 전 연평균 마진 전망은 6.6~7달러로 '10달러 넘는 현재는 오버슈팅'이라는 신중론도 공존"], "kr": "S-Oil·SK이노베이션·GS칼텍스·HD현대오일뱅크는 전쟁 전부터 이익 체력이 올라가던 구간이었다. 실사 시 2025년 하반기~2026년 1~2월 마진(재고효과 제외)을 '전쟁 이전 기준선'으로 따로 잡아두면 전쟁 프리미엄을 분리하기 쉽다."}, {"group": "원유·지정학", "title": "호르무즈 봉쇄 해부 — 물량, 우회로, 그리고 정상화 시차", "period": "2026.02~2026.09", "lede": "이번 충격의 본질은 물량 자체의 감소가 아니라 특정 해협을 지나는 흐름이 막힌 '경로의 위기'이며, 원유는 우회로로 먼저 풀리고 제품·LNG·화학 원료는 훨씬 늦게 풀린다.", "body": ["2026년 2월 28일 미국·이스라엘의 이란 공격(Operation Epic Fury) 후 혁명수비대가 유조선을 공격하며 호르무즈 해협이 사실상 봉쇄됐다. 호르무즈는 세계 원유 물동량의 약 20%(해상 기준 약 30%), LNG의 약 20%, 해상 납사 물동량의 약 37%, 항공유 23%, 경유 10%가 지나는 길목이다. 사우디 East-West 파이프라인(얀부)과 UAE ADCOP(푸자이라)의 추가 여력은 약 260만b/d로 봉쇄 물량의 13%에 불과했고, 3월 OPEC 산유량은 전월비 29% 급감한 2,097만b/d로 사상 최대 감소를 기록했다.", "첫 주 가격 반응은 러-우 전쟁보다 빨랐다. WTI +35.6%(90.9달러), Dubai +41%(100.4달러), 싱가포르 복합정제마진 +20.6달러(33.3달러), 유럽 디젤 선물 +54%, JKM +94%, 납사 +22%가 한 주 만에 나타났다. 원유보다 경유가 더 오른 이유는 러시아 제재 이후 유럽 경유 공급원이 중동으로 바뀌어 있었기 때문이다. Ras Tanura(55만b/d) 화재, Ruwais(92.2만b/d) 드론 공격, 카타르 Ras Laffan LNG 피해(수출능력의 약 17%)가 이어졌고, Dubai는 3월 23일 170달러로 정점을 찍었다.", "원유는 비교적 빨리 우회 경로를 찾았다. 사우디 동서 송유관(최대 700만b/d), UAE 푸자이라 송유관(150~180만b/d), 선박 간 환적(STS)으로 걸프 원유 수출은 7월 전쟁 전의 약 60%까지 회복했고, 호르무즈 직접 통항은 8월 2.0백만b/d(전쟁 전의 11%)에 그쳤는데도 사우디 OSP는 9월 -2.0달러로 떨어졌다. IEA 전략비축유 공조 방출(일 약 360만b/d)도 공백을 메웠다. Dubai는 7월 1일 66.3달러로 전쟁 전(2월 평균 68.3) 수준에 복귀했다.", "하지만 정상화는 선형이 아니다. 완전히 멈춘 유정은 부식·왁스 문제로 재가동에 2~5주, 대형 정유소는 구조 손상이 없어도 10~15일이 걸리고, VLCC 왕복 항차가 38~45일이라 봉쇄가 40일을 넘으면 병목이 반복된다. 리포트 추정으로는 봉쇄 해제 후 중동 대기 물량 투입 약 30일, 한국 정유·화학 정상화 약 75일, 해외 정제유 공급 정상화 86~96일, 해외 플라스틱 공급 105~115일이 필요하다. 게다가 8월 휴전 직후 재폐쇄 선언, UAE-이란 교역 중단(8/19), 9월 후티의 모카항 장악과 동서 송유관 가동 중단으로 우회로의 물리적 한계까지 드러나며 Dubai는 9월 11일 123.7달러로 재급등했다."], "table": {"cols": ["지표", "전쟁 전", "피크", "최근(2026-08~09)"], "rows": [["Dubai($/bbl)", "68.3(2월 평균)", "170(3/23)", "88.4(8월) → 123.7(9/11)"], ["호르무즈 통항(백만b/d)", "약 18", "-", "4.8(7월) → 2.0(8월)"], ["복합정제마진($/bbl)", "약 10(4Q25)", "87(4월)", "34.0(8월), 3Q 누적 33.9"], ["사우디 OSP AL($/bbl)", "0.0(3월)", "+19.5(5월)", "-2.0(9·10월)"], ["아시아(중국 제외) 크래커 가동률", "83%(2월)", "57%(5월)", "-"], ["OECD 재고(억 배럴)", "28.3(2월)", "-", "26(5월, 2014년 이후 최저)"]]}, "bullets": ["Logistics shock(경로 차단)는 경로가 풀리면 공급이 복귀하지만, 설비 피해는 그렇지 않다", "중국 원유 수입의 약 50%가 중동·이란 의존 — 항해일수 감안 시 3월 말 이후 영향 집중", "한국 정부 비축유 약 7개월치, 정유사 가용 재고 40~50일(추정) — 가동률 하향 시작점을 가늠", "봉쇄 1~2주가 골든타임, 2주 이상이면 글로벌 공장 가동 중단이 시작된다는 초기 경고", "9월 후티·동서 송유관 차질은 '원유는 돌릴 수 있다'는 전제의 한계를 확인시킨 2차 충격"], "kr": "국내 정유사는 원유 재고·비축유로 버티며 비중동 원유 비중을 늘렸고(중동 70%→52%), NCC는 납사의 약 25%가 중동산이라 물류 후순위 리스크에 노출됐다. 딜 검토 시 저장능력·터미널·선복·보험 조달력(FOB-CIF 관리 능력)이 원가 경쟁력의 일부라는 점을 체크한다."}, {"group": "원유·지정학", "title": "벤치마크의 분절 — 단일 유가에서 세 개의 유가로", "period": "2026.03~2026.09", "lede": "전쟁은 원유·가스·제품·화학 원료의 가격을 지역·원료·계약 형태별로 쪼갰고, 같은 '유가 상승'이 기업마다 정반대의 손익으로 전달됐다.", "body": ["전쟁 전 원유 가격 질서는 Brent·WTI가 기준이고 아시아 고유황 원유인 Dubai가 그보다 싸게 거래되는 구조였다. 전쟁 후 Dubai가 Brent·WTI보다 비싸지는 역전이 일어났다. 아시아 정유설비는 API 28~33도, 황 1.5~2.5%의 중동 중질유에 맞춰져 있어 경질·저유황인 WTI·Brent로 대체하면 공정 전환 비용과 수율 저하가 불가피하고, 이 '강제 수요'가 Dubai 프리미엄의 하방을 받쳤다. 즉 WTI는 미국의 공급 풍요, Dubai는 아시아의 실물 부족, Brent는 금융시장의 평균 기대를 반영하는 세 개의 가격이 됐다.", "Dubai 벤치마크 자체도 흔들렸다. 평가 유종에서 이란산이 빠지고 오만·무르반 화물 이동이 불확실해지며 가격결정에 참여하는 물량이 급감했고, Cash Dubai와 선물의 차이가 2월 평균 +0.92달러에서 3월 평균 +37.66달러로 벌어졌다. 이는 2020년 WTI 마이너스 유가처럼 벤치마크의 실물 대표성 문제로, Dubai 강세를 곧바로 정유사 재고평가이익이나 마진 개선으로 연결하면 과대 해석이 될 수 있다. 실제 그 유종을 보유하고 제때 도착해야 이익이 된다.", "도착원가도 독립된 가격축이 됐다. 호르무즈 전쟁보험료는 화물가액 대비 0.01~0.05%에서 0.5~1.0% 이상으로 뛰어 VLCC 1척(화물 약 2억달러)당 100~200만달러가 추가됐고, 중동-아시아 VLCC 운임은 약 600% 올랐다. 봉쇄 중 추가 운송비는 배럴당 3~5달러, VLCC 체선료는 하루 10만달러 이상으로 추정됐다. FOB가 내려가도 선복·보험이 없으면 수입국은 혜택을 못 누린다. 가스에서는 JKM +60%, TTF +53%인데 Henry Hub는 0%였는데, 이는 유가가 오르면 Permian 수반가스가 함께 늘어 미국 가스가 오히려 안정되는 구조 때문이다.", "리포트들은 왜곡이 세 단계로 풀린다고 정리했다. 1단계 금융·벤치마크(수주~2개월: 현물-선물 스프레드, 보험료), 2단계 실물·물류(2~6개월: 운임, 정제마진 양극화, 석화 스프레드), 3단계 구조·정책(12개월 이상 또는 비가역: 나프타 대 에탄 원가 격차, LNG 계약 철학, LPG 민생 배분, 중국 수출통제). 1·2단계 해소는 트레이딩 이익 실현의 신호이고, 3단계 왜곡의 잔존이 밸류에이션 리레이팅·디레이팅의 근거가 된다는 것이 핵심이다."], "table": {"cols": ["왜곡 항목", "조기 휴전 시", "장기 교착 시", "비가역성"], "rows": [["Dubai 현물-선물", "2~4주", "2~3개월", "A 가역, B/C 벤치마크 재설계"], ["WTI/Brent/Dubai 괴리", "1~2개월", "3~4개월", "부분 가역(대체유 장기계약 잔존)"], ["석화 스프레드", "3~4개월", "6개월 이상", "일부 나프타 크래커 비가역 폐쇄"], ["정제마진 양극화", "3~5개월", "6개월 이상", "부분 가역(항공유 구조적 타이트)"], ["FOB-CIF 스프레드", "보험 2~4주, 운임 2~3개월", "-", "보험 선행 해소"], ["LPG 배분", "가격 2~3개월, 정책 12개월+", "정책 영구화 가능", "정책 비가역"], ["JKM vs Henry Hub", "6개월", "3~5년(라스라판 복구)", "C에서 비가역"], ["나프타 vs 에탄", "-", "-", "비가역(구조 전환 기점)"]]}, "bullets": ["원화 이중 증폭: 유가 상승 × 원화 약세가 곱셈으로 원화 원가를 올린다", "LNG 장기계약은 가격 공식은 지켜도 불가항력 시 물량은 깨진다 — 신규 계약에서 목적지 유연성·대체 공급원 조항 강화", "제재 원유 할인 축소·역전은 제재국 수익 증가라는 역설과 제재 실효성 약화를 낳았다", "화학 제품가 상승이 수요 회복형인지 원료 부족형 '방어적 인상'인지 구분해야 한다"], "kr": "국내 정유 4사의 장기계약 비중, 고도화 비율, 원유 저장·터미널 인프라(울산·여수·온산·대산·인천)가 차별화 요인이다. 한국은 G7 선박만 이용 가능하고 이란 직구매·원화 결제가 불가해 달러·합법 대체 소싱 능력이 곧 경쟁력이었다."}, {"group": "정유 수급", "title": "한국 정유 = 석유제품 시장의 스윙 프로듀서", "period": "2026.03~2026.09", "lede": "봉쇄 국면에서 중동·아시아·태평양을 통틀어 석유제품을 수출할 수 있었던 나라는 사실상 한국뿐이었고, 이 구조가 정유 설비를 '에너지 안보 자산'으로 재정의했다.", "body": ["세계 1~4위 정제설비 보유국은 모두 수출 여력이 막혔다. 중국은 3월 5일 국영 정유사에 휘발유·경유 수출 즉시 중단을 지시했고, 미국은 제품 재고가 급감(휘발유 9년 밴드 하단, 등경유 21년 최저)했으며, 러시아는 드론 피격으로 해상 제품 수출이 5월 189만 → 7월 107만b/d로 43% 줄었고, 인도는 생산 대비 수출 비중이 19%에 불과해 내수 우선 정책을 택했다. 싱가포르를 빼면 일본·태국 등 나머지 아시아는 대부분 순수입국이다.", "반면 한국은 원유 수입량 대비 정제유 수출 비율이 1996년 21%에서 2010년 37%, 2025년 47%로 높아졌고, 화학·윤활유까지 합치면 생산의 60~70%를 수출한다. 정제 사업 수출 비중은 GS칼텍스 70%, HD현대오일뱅크 60%, S-Oil 55%, SK에너지 50%다. 가동률이 60%대로 떨어져도 내수 부족 문제가 작아 남는 물량을 고마진 수출로 돌릴 수 있는 구조다.", "수요처도 산유국이다. 호주는 한국 석유제품 수출 1위 상대국으로 LNG 공급 보장을 카드로 제품 안정 공급을 요구했고, 미국은 4위로 올라섰으며 2025년 대미 수출은 +15%로 사상 최대였다. 미국은 원유는 풍부하지만 정제능력이 2020년 고점 대비 약 5% 줄어 항공유 수입의 68%(서부 해안은 85%)를 한국산에 의존한다. 미국 국내 운송을 대체할 Jones Act 선박은 40척에 불과하다. 원유를 가진 나라도 정제능력이 병목이라는 뜻이다.", "이 구조는 두 가지 함의가 있다. 첫째, 제품 공급 협상력이 원유·LNG 우선 조달 협상 카드가 될 수 있어 정유 설비에 전략 자산 프리미엄을 부여할 수 있다는 논리다. 둘째, 한국 정유사는 생산의 약 1/3을 국제가격에 수출(휘발유·경유·항공유 수출/석유제품 생산 2026년 1~7월 32.9%, 2012~26 평균 31.6%)해 마진이 손익에 직접 반영되고, 내수 최고가격제 영향(판매량의 약 15%)은 제한적이다."], "table": {"cols": ["국가(정제능력 순위)", "봉쇄 국면 상황", "수출 여력"], "rows": [["중국(1)", "3/5 휘발유·경유 수출 중단 명령, 7월 쿼터 확대(휘발유 중심)", "제한"], ["미국(2)", "재고 급감, 가동률 97%대, 11주 이상 95% 초과", "제한"], ["러시아(3)", "반복 피격으로 정제처리량 약 30% 감소, 휘발유·항공유 수출 제한", "감소"], ["인도(4)", "생산 대비 수출 19%, 내수 우선 정책", "제한"], ["한국(5)", "내수 약 40%, 생산의 약 60% 수출", "스윙 프로듀서"]]}, "bullets": ["한국 미국향 석유제품 수출의 80%가 항공유", "미국 휘발유 수입 중 한국산 8%", "호주: 한국 석유제품 수출 1위국, 원유·LNG를 담보로 제품 공급 요청", "4월 아시아 정유사 연쇄 화재·폭발 — 익숙하지 않은 원유 투입과 관련 가능성 제기"], "kr": "S-Oil·SK이노베이션·GS칼텍스·HD현대오일뱅크의 국가별 수출 포트폴리오와 호주·미국 장기 공급 계약 여부가 확인 포인트. GS칼텍스는 수출 비중 1위(70%), HD현대오일뱅크는 고도화율 1위다."}, {"group": "정유 수급", "title": "마진은 사상 최고, 가동률은 60%대 — 설계원유와 경질유 병목", "period": "2026.04~2026.07", "lede": "중동 중질유에 최적화된 한국 정유설비에 미국산 경질유를 35~40%까지 넣으면 공학적 병목이 생겨, 역대 최고 마진을 온전히 물량으로 바꾸지 못했다.", "body": ["호르무즈 봉쇄로 한국 정유사의 원유 투입 중 중동산 비중은 평시 약 69%에서 3월 65%, 4~5월 약 49%로 줄고, 미국산은 17%에서 22%, 36%로 사상 최대가 됐다. 정부는 비중동 원유 도입 시 운임 초과분의 25%를 환급해 이를 뒷받침했다. 원유 도입량은 2025년 월평균(8,571만 배럴) 대비 3월 92%, 4월 57%까지 떨어졌다가 5월 계약분 87%로 회복했다.", "문제는 설비다. CDU는 설계 원유 성상에 맞춰져 있어 경질유를 과도하게 넣으면 증기가 폭발적으로 늘어 탑 상부 배관·응축기 병목에서 압력이 치솟고, 여름철엔 냉각 효율까지 떨어진다. 하부에서는 잔사유가 부족해 펌프 최소유량 문제가 생기고, 설계 압력을 넘으면 인터록·플레어로 설비가 멈춘다. 정유사는 결국 원유 투입량을 줄여 가동률을 희생했다. 한국 평균 가동률은 3월 86.8% → 4월 71.3% → 5~6월 66.3%로 추정됐고, 회사별로는 SK에너지 약 62%, S-Oil 약 70%로 차이가 났다.", "경질유는 휘발유·납사 수율을 높이고 경유·항공유·잔사유 수율을 낮춘다. 잔사유가 줄면 RFCC·수첨분해 같은 수조원짜리 고도화 설비의 원료가 부족해 정유소 전체의 복잡도 수익이 훼손된다. 셰일 혁명으로 이미 경질유 비중이 높아진 세계에서 중동 중·중질유 공급까지 끊기며 글로벌 중질유 부족이 증폭됐고, 이것이 휘발유 대비 경유 마진 격차(2Q26E 휘발유 23.3 vs 경유 55.1달러)를 러-우 사태 때보다 크게 벌린 원인이다.", "그래서 스팟 마진과 실제 이익 사이에 간극이 생긴다. 스팟 정제마진에 OSP 프리미엄(5~6월 15~19달러), 장거리 운송비, 보험료, 블렌딩·가동률 손실을 반영하면 실질 마진은 스팟보다 낮다(SK에너지 대체 원유 수송분 약 20%에 배럴당 약 5달러 추가 비용 추정). 역으로 아람코 계약 물량을 동서 송유관·얀부항으로 받은 S-Oil은 유종·가동률·중간유분 수율 변화가 상대적으로 작아 이 병목을 덜 겪었다. 일본(중동 의존 약 90%, 노후 설비)은 5~6월 가동률이 60% 미만으로 더 나빴다."], "table": {"cols": ["회사", "3월", "4월", "5~6월", "비고"], "rows": [["SK에너지", "82%", "68%", "62%", "휘발유 생산 비중 증가로 마진 수혜 제한"], ["GS칼텍스", "85%", "70%", "65%", "수출 비중 70%"], ["S-Oil", "92%", "75%", "70%", "아람코 원유 얀부 경유 조달"], ["HD현대오일뱅크", "88%", "72%", "68%", "고도화율 1위, 고효율 코커"], ["한국 평균", "86.8%", "71.3%", "66.3%", "리포트 추정"]]}, "bullets": ["원유 바스켓·Assay 운영 능력(60년간 러시아·아프리카·북미 원유 투입 경험)이 가동 유지의 차별화 요인", "같은 50만b/d CDU라도 설계와 다른 원유를 넣으면 산출량이 16만~40만b/d로 줄 수 있다", "고도화율 높은 설비는 싼 중질·고유황 원유로 원가를 낮추는 옵션을 가진다", "단기 대응은 블렌딩, 중장기는 설비 개조로 중동 의존도를 구조적으로 낮출 수 있다"], "kr": "실사 질문: 설계 원유(Design Crude Slate) 대비 현재 투입 성상 차이와 가동률 영향, 원유 공급 계약 구조(지분 관계·장기계약)가 유종·물량을 보장하는지, 휘발유 대 경유 생산 비중과 고도화 설비 가동률이 유지되는지."}, {"group": "정유 수급", "title": "정제마진의 새 바닥 논쟁 — 평균 회귀(10달러)인가, 레벨업(19~30달러)인가", "period": "2026.05~2026.09", "lede": "종전·휴전 이후 정제마진이 어디서 바닥을 형성하느냐를 두고 리포트 시각이 갈렸고, 그 차이는 결국 '설비 복구 속도'와 '재고 재축적 기간'에 대한 가정 차이다.", "body": ["신중론(2026년 7월)은 평균 회귀를 주장했다. 복합정제마진의 20년 평균은 10.2달러이며 2006~2019년 9.82달러, 2020년~2026년 2월 9.75달러로 평균이 거의 같다. 코로나·러-우·이란 전쟁이 만든 것은 구조 변화가 아니라 변동성 확대(표준편차 2.9 → 5.5)라는 해석이다. 중동 피해 설비 대부분은 6월 중순 이후 정상 가동 중이고 3~6개월 이상 복구가 필요한 곳은 바레인 Bapco(41만b/d, 글로벌 수요의 0.4%) 정도라 수급 영향이 제한적이며, 6월 마진 29.4달러와 OSP 15.5달러가 둘 다 평균 회귀하면 OSP 반영 실질 마진은 약 5달러 낮아진다는 논리였다.", "강세론(2026년 5~9월)은 레벨업을 주장했다. 원유는 파이프라인·환적으로 우회할 수 있지만 피격된 정제설비는 우회할 방법이 없고, 복구에는 전력·수소·탈황·저장시설 정상화가 함께 필요하다. 러시아·중동 가동 차질 설비는 명목 685만b/d(글로벌의 6.6%)이고 7월 글로벌 정제처리량은 전년보다 500만b/d 적었다. OECD 재고는 2014년 이후 최저, 미국 중간유분 재고는 역대 최저이며 아람코는 정상화 후 재고 보충에 최대 18개월이 걸린다고 봤다. 설비가 복구돼도 초기 증산분은 재고 재축적에 먼저 흡수돼 마진 정상화는 공급 회복보다 느리다.", "숫자로는 강세론이 3분기까지 맞았다. 8월 복합정제마진은 34.0달러로 2016~25 평균의 4.8배, 2022년 호황의 2.6배였고, 3Q26 누적 평균은 33.9달러였다. 미국 걸프 디젤 마진은 8월 17일 사상 처음 100달러를 넘었고 미국 3-2-1 크랙도 약 71달러로 사상 최고였다. 다만 9월 초에는 후티 사태로 유가가 재급등하며 원유 원가가 먼저 올라 단기 마진이 21.3달러까지 눌리는 장면도 나왔다 — 유가 급등이 오히려 마진을 압박하는 구간이 존재한다.", "리포트별 2H26~2027 경로 전망은 다음과 같이 흩어져 있다. 비교의 핵심은 '고점'이 아니라 '2027년 정상 수준'이며, 이 값이 정유 밸류에이션(정상 이익·ROE·FCF)의 기준이 된다. 하방 리스크는 호르무즈 정상화 자체보다 러시아·중동 정제설비의 조기 복구와 재고 재축적 가속이다."], "table": {"cols": ["발행", "시각", "2H26 마진", "2027 마진", "근거"], "rows": [["2026-05", "상방", "26달러", "-", "중동 정상화 9~12개월, OECD 재고 최저, 순증설 급감"], ["2026-05", "초호황 후 쿨다운", "10~15달러(연간)", "-", "정유 수급률 88.2%, 걸프 설비 복구 12~18개월"], ["2026-05", "재평가", "15~20달러", "-", "피해 설비(약 5%) > 순증설(연 0.6%)"], ["2026-07", "평균 회귀", "하향 안정", "약 10달러 수렴", "20년 평균 10.2, 중동 설비 대부분 복구"], ["2026-08", "레벨업", "약 30달러", "약 19달러", "685만b/d 차질, 역대 최저 재고, 18개월 재축적"], ["2026-09", "병목 프리미엄", "3Q 33.9(실적)", "-", "설비는 옮길 수 없다, 재고가 정상화 속도 결정"]]}, "bullets": ["피격 설비 규모 ≠ 실제 공급 공백(중동 실제 약 300만b/d) — 헤드라인 수치로 과대·과소 추정 금지", "중간유분 계절성: 8월 하순~11월 중순 정기보수·수확·난방유 비축으로 강세 경향", "미국 정유 가동률 97%대 장기화 → 정비 지연·허리케인 리스크", "러시아 항공유(2026-11)·휘발유(2027-01) 수출 제한 종료 일정"], "kr": "국내 정유사 이익 추정 시 2H26와 2027년 마진 가정이 10~30달러로 세 배 차이 난다. IPO·메자닌 검토라면 여러 시나리오(10/19/30달러)별 FCF를 따로 보여주는 것이 합리적이다."}, {"group": "정유 수급", "title": "최고가격제와 보상 — 정책이 만든 정유 할인", "period": "2026.03~2026.09", "lede": "전쟁 중 도입된 석유제품 최고가격제는 이익 규모보다 '정책 불확실성'이라는 할인 요인으로 정유주 주가를 눌렀고, 보상 규모는 '원가+적정 마진'이라는 기준 해석에 달려 있다.", "body": ["정부는 2026년 3월 13일 보통휘발유·자동차/선박 경유·실내등유의 공급가 상한을 정한 최고가격제를 시행했다(1차 3/13~26, 2분기 3~4차). 1차 기간 평균 유가는 약 150달러였고 2분기 3~4차 기간은 약 100달러 수준이었다. 한국 경유 소비자가는 2/23 대비 4/20 +25.4%로 조사 대상 40개국 중 34위였는데, 이는 상한제로 국내 가격이 안정된 만큼 정유사가 내수 역마진을 떠안았다는 뜻이다(베트남 +141.6%, 필리핀 +118.4%, 미국 +41.8%, 일본 +9.6%).", "상한제 대상은 주유소·가정용 휘발유·경유·등유로 판매량의 약 15%에 불과하고 산업용·수출은 국제가 기준으로 팔 수 있어 이익 훼손은 제한적이라는 평가가 많았다. 그럼에도 S-Oil은 전쟁 직후 상한가를 기록한 뒤 5월 상한제 우려로 상승분 대부분을 반납했고, 정유 2사 합산 시총은 연초 27.0조원에서 32.9조원(+22%)으로 KOSPI(+76~90%)를 크게 밑돌았다. 이익 급증에도 정책 리스크가 밸류에이션을 억제한 셈이다.", "기회손실 규모는 MOPS로 역산할 수 있다. 국내 세전 공급가는 직전 주 MOPS 변동률과 환율의 함수(상관계수 0.95)라 제도가 없었을 때의 가격을 추정할 수 있고, 3/13~6/20 휘발유·경유 기회손실은 약 4.7조원(SK에너지 1.35조, S-Oil 1.25조 등 4사 모두 1조원 이상)으로 업계 주장(4월 말 3조원, 5월 말 4조원 초과)과 비슷했다. 경유가 가격 차도 크고 소비량도 휘발유보다 약 50% 많아 손실의 대부분을 차지했다.", "그러나 정부는 6월 18일 손실보전 고시안에서 MOPS 반영 불가, '원가+적정 마진' 보상 원칙을 확정하고 최고액정산위원회를 구성했다. 정유사 가격 담합 수사도 진행 중이라 시장가 기반 보상 가능성은 더 낮아졌다. 신청 마감은 8월 29일이고 이후 회계법인 검증·심의(가장 오래 걸리는 단계)를 거쳐 보수적으로 4분기 반영이 예상된다. 보상금은 과거 실적 보상이자 일회성이라 주가 영향은 제한적이지만, 제도 종료와 기준 확정 자체가 할인 요인 해소 조건이다."], "table": {"cols": ["시점", "절차"], "rows": [["2026-03-13", "최고가격제 시행(휘발유·경유·실내등유)"], ["3~6월", "시행, 정유사 원가·판매자료 축적"], ["2026-06-18", "손실보전 고시안 행정예고(MOPS 반영 불가, 원가+적정 마진)"], ["6월 말", "고시안 확정, 최고액정산위원회 출범"], ["~2026-08-29", "정유사 보상 신청 마감"], ["이후", "회계법인 검증·정산위원회 심의 → 산업부 장관 확정·지급(4Q 예상)"]]}, "bullets": ["재고평가 방식(선입선출 vs 총평균)에 따라 같은 분기 이익이 회사별로 달라 보이는 착시", "국내 납사 수출 제한(판매량의 약 3%)과 납사 매점매석 금지(3/27~)도 병행된 정책 개입", "보상금 회수율 = 최종 보상금 ÷ MOPS 기반 기회손실(약 4.7조원)로 판단"], "kr": "SK에너지·GS칼텍스·S-Oil·HD현대오일뱅크의 3Q/4Q 실적 변동 요인. 정책 개입 구간에서는 스프레드보다 규제 시작·해제 시점이 더 중요한 변수가 된다."}, {"group": "정유 수급", "title": "그룹III 윤활기유 — 과점 시장에서 한 라인이 멈추면 생기는 일", "period": "2025.11~2026.09", "lede": "윤활기유는 정유 감익을 완충하는 두 번째 현금창출 축이며, 연료 마진이 높을수록 오히려 공급이 줄어드는 독특한 구조를 가진다.", "body": ["그룹III 기유는 점도지수 120 이상의 고급 윤활기유로 고급 엔진오일 원료다. 글로벌 수요 약 600만톤을 SK엔무브(150만톤), S-Oil(약 120만톤), Shell Pearl GTL(약 120만톤) 3사가 약 65% 점유한다. 전쟁 전에도 제한적 공급과 양호한 수요로 그룹III-HSFO 스프레드가 유지되는 안정적 이익원이었다.", "3월 이란이 카타르 Ras Laffan 에너지 인프라를 공격하며 Pearl GTL의 #2 라인이 피해를 입었고 완전 복구에 약 1년이 걸릴 수 있다. Pearl GTL은 그룹III 시장의 약 20%이고 그 절반 이상이 차질을 빚었다. 미국 독립 윤활유 제조사 협회(ILMA)가 API와 에너지부에 긴급 구제를 요청할 정도로 수급이 경색됐고, 국내 기유 수출가는 2월 864달러에서 6월 1,865달러로 두 배 넘게 올랐다.", "구조적으로도 연료 강세가 기유를 조인다. VGO는 윤활기유와 디젤·항공유의 공통 원료라 연료 마진이 높으면 VGO를 기유에 넣는 기회비용이 커지고, 정제설비가 정상 가동해도 기유 공급은 따라 늘지 않는다. 기유는 고객 인증 때문에 공급처 전환이 어렵고 계약가 조정도 느려, 부족이 길어지면 가격이 뒤늦게 크게 오른다. 중질유 부족으로 중질 원료가 모자란 것도 겹쳤다.", "결과는 이익으로 확인됐다. 국내 4사 2Q26 윤활 영업이익은 1.71조원으로 분기 최대였고(SK이노베이션 6,919억원, S-Oil 4,774억원, GS칼텍스 3,576억원, HD현대오일뱅크 1,814억원), S-Oil 윤활 이익은 1Q 1,666억원에서 2Q 약 3,961억원(추정)으로 뛰었다. Pearl GTL #1 라인은 하반기, #2 라인은 2027년 1~2분기 정상화가 예상돼 가격은 점차 안정되겠지만 공급자가 적어 속도가 느리다. GS칼텍스는 그룹II 주력이라 수혜 폭이 상대적으로 작다."], "table": {"cols": ["회사", "2Q26 정유 OP", "2Q26 윤활 OP", "특징"], "rows": [["S-Oil", "5,324억원", "4,774억원", "그룹III 대형 공급사, 샤힌 보유"], ["GS칼텍스", "2.20조원", "3,576억원", "그룹II 주력, 수출 비중 70%"], ["HD현대오일뱅크", "1.28조원", "1,814억원", "고도화율 1위"], ["SK이노베이션", "1.21조원", "6,919억원", "세계 최대 그룹III 캐파(SK엔무브)"], ["합계", "5.23조원", "1.71조원", "DART 사업보고서"]]}, "bullets": ["그룹III 3사 과점(약 65%) — 한 공장 차질만으로 가격·스프레드 급등", "기유 가격은 연료보다 후행하지만 조정 폭이 크다", "SK엔무브는 SK온에 흡수합병되어 SK이노베이션 연결로 반영", "Pearl GTL 조기 복구는 윤활 이익 급감 리스크"], "kr": "SK이노베이션(SK엔무브)·S-Oil의 윤활 이익이 모회사 현금흐름을 지지. 실사 시 기유 매출 비중, 고객 계약 가격이 연료 마진 상승을 얼마나 따라왔는지, Pearl GTL 복구 일정 대비 이익 지속 기간을 확인."}, {"group": "석유화학 구조", "title": "중국발 공급 과잉의 구조 — 감유증화, 자급률, 그리고 Spillover", "period": "2025.09~2026.05", "lede": "석유화학 불황의 원인은 수요가 아니라 중국이며, 중국은 석유화학을 에너지 안보·고용의 전략 산업으로 재정의해 불황에도 증설과 가동을 멈추지 않는다.", "body": ["전쟁 전 리포트들이 공통으로 강조한 역설은 '수요 개선과 유가 하락이 이미 함께 나타났는데도 업황이 4년째 부진하다'는 것이었다. 중국 에틸렌 수요는 2023년 14.2%, 2025년 8월 누적 10.4% 늘었고 PE·PP도 두 자릿수 성장했다. 유가·납사도 2022년 고점 이후 매년 내렸다. 그런데 에틸렌-납사 스프레드는 2021년 401달러에서 2022년 235달러로 떨어진 뒤 손익분기 아래에 머물렀다. 중국이 가동률을 올리지 않고도 신규 설비로 생산을 늘려, 2025년 1~8월 에틸렌 생산이 5년 전의 두 배를 넘었기 때문이다.", "중국의 증설은 오히려 가속됐다. 2025~30년 중국 에틸렌 증설 전망치는 1년 새 1,943만톤에서 2,782만톤으로 43% 늘었고 PE·PP 전망치도 73%, 36% 올랐다. 중국 에틸렌 능력은 2025년 5,975만톤에서 2030년 8,664만톤(일부 전망 1억톤 내외)으로 커지고, 글로벌 신규 에틸렌 증설에서 중국 비중은 2025년 81%, 2026년 66%, 2027년 59%다. 그 결과 중국 자급률은 PE 72%, PP 100%, ABS 93%, PVC 118%에 이르러 수입국에서 수출국으로 바뀌었고, 중국 수요 회복이 한국 수출 회복으로 이어지지 않게 됐다.", "뿌리는 연료 수요 정점이다. 운송용 연료는 석유 수요의 약 45%인데 중국은 2025년에 정점을 지났다(가솔린 -6%, 디젤 -5%). 정유사는 남는 원유를 나프타 수율 상향(COTC, 감유증화)으로 메워 중국 정제 수율 중 나프타가 2022년 8%에서 2025년 상반기 11%가 됐다. 범용 과잉이 심해지자 정부가 스페셜티 전환을 독려하면서 과잉이 '연료 → 범용 → 스페셜티'로 번지는 Spillover가 생겼고, 한국이 수익을 내던 POE가 중국 진입으로 무너진 것이 사례다.", "중국의 구조조정(반내권)은 기대만큼 공급을 줄이지 못한다는 것이 다수 시각이다. 20년 이상 노후 에틸렌 설비는 약 694~700만톤(중국의 약 12%)인데 이를 전부 닫아도 1년 증설분(연 734만톤)보다 작고, 자급률이 에틸렌 109%·PE 76%로 태양광·배터리(200% 이상)만큼 폐쇄 압력이 강하지 않다. 국영사가 폐쇄를 결정한 설비도 264만톤(4%)으로, 노후 NCC를 닫고 더 큰 에탄·복합피드 크래커로 대체하는 '고도화' 성격이 강하다. 한국에 중요한 것은 중국의 총량 감소보다 덤핑성 수출 압력이 줄어드는지다."], "table": {"cols": ["항목", "2022년 상반기 전망", "2025년 상반기 전망"], "rows": [["2027년 중국 에틸렌 능력", "5,947만톤", "7,692만톤"], ["능력 CAGR(2022~27)", "+4.9%", "+11.1%"], ["2027년 에틸렌 수요", "5,624만톤", "6,031만톤"], ["수요 CAGR(2022~27)", "+6.1%", "+7.8%"], ["2027년 가동률", "94.6%", "78.4%"]]}, "bullets": ["화학 사이클 3요소: 중국 수요(글로벌 화학 수요의 53%), 유가(원료), 공급(증설)", "사이클의 변형 — 중국 설비는 국가 지원·낮은 금융비용으로 마진이 무너져도 가동, 바닥이 '깊어지기'보다 '길어진다'", "중국 화학업체 정부보조금 104.6억위안(2024), Hengli 순이익의 25%가 보조금", "한·중 원가율 괴리 약 10%p(3Q25 Rongsheng 87.8%·Hengli 83.6% vs 롯데케미칼 96.3%·대한유화 93.3%) — 할인 러시아산 원료 영향", "중국 15차 5개년 계획: CTO/MTO·4만b/d 이하 소형 정제설비 폐쇄, 2026년부터 에틸렌 신규 허가 제한"], "kr": "국내 범용 NCC(롯데케미칼·LG화학·대한유화·여천NCC)는 E&P 통합이 불가해 원가 열위. 반면 비석유계 원료(KCC 실리콘, 유니드 칼륨, 롯데정밀화학 셀룰로스)나 글로벌 과점(SK케미칼 Copolyester) 제품은 구조적 변화에 강하다는 평가."}, {"group": "석유화학 구조", "title": "원가 곡선의 분절 — 나프타 vs 에탄 vs 석탄", "period": "2025.11~2026.09", "lede": "전쟁은 석유화학의 원가 곡선을 전체적으로 위로 올리는 동시에 원료 진영 간 격차를 벌렸고, 한국 NCC는 그 곡선의 오른쪽 끝에 서 있다.", "body": ["전쟁 전에는 NCC에 우호적인 변화가 있었다. 2025년 10월 납사/에탄 배수가 4.5~4.6배로 2015~17년 호황기 수준까지 내려왔고, Oil/Gas Ratio도 2023~24년 31~35배에서 2025년 2월 약 17배로 낮아졌다(10~15배면 NCC와 ECC 원가가 비슷). 유가 약세·가스 강세 조합이 한국 NCC의 구조적 원가 열위를 줄여주고 있었고, 일부 리포트는 2026년 화학제품 합산 스프레드 +17% 개선을 전망했다.", "전쟁은 이를 뒤집었다. 2월 → 4월 원료 가격은 아시아 납사 +72%(617.5 → 1,062.8달러/톤), 미국 에탄 -8%, 중국 석탄 +10%로 진영별로 완전히 갈렸다. 전쟁 후 에탄 기반 에틸렌 원가는 톤당 400~500달러인데 나프타 기반은 1,000달러를 넘는 구간도 있었다. 납사-에탄 스프레드는 2015~25 평균 446달러에서 4월 963달러, 8월에도 674달러였다. 납사 체인은 유가와 물류·보험 리스크를 동시에 떠안지만, 에탄은 미국 셰일가스 부산물로 지역 리스크가 낮기 때문이다.", "원가 곡선 상향 평준화도 나타났다. 카타르 LNG 차질로 NGL(에탄·프로판) 공급이 줄어 저가 원료였던 LPG·에탄의 상대 우위도 약해졌고, 전략비축유 재매입과 인프라 복구 시차 때문에 유가가 80~90달러로 안정돼도 원가 하단은 과거보다 높을 가능성이 크다. 곡선 우측의 유럽 노후 설비(가동률 72%, 평균 연식 45년)와 중동 원료에 의존하는 일본·동남아·중국 MTO/PDH(PDH 가동률 47%)가 먼저 가동률을 낮추고, 북미 ECC(에탄 87%)와 중국 CTO가 공백을 메웠다.", "중국은 대체 루트를 가진 것이 결정적이었다. 중국 PVC의 70%, MEG의 40%, PE의 10%가 석탄 기반이고 PE의 또 10%는 에탄 기반이라, 납사가 오를수록 이 설비들이 가동률을 올려 판가 전가를 막았다. 3월 중국 PVC·가성소다 수출은 사상 최대, PE는 전월비 약 2배, 4월 MEG는 5배 이상 늘었다. 중동 설비 타격에도 PE·MEG·PVC-납사 마진이 전쟁 전과 비슷하거나 더 나빴던 이유다. 더 나아가 Satellite·Wanhua·SP Chemicals·Sinopec 등은 노후 NCC를 닫고 에탄 전소·복합피드 크래커로 신설·개조 중이어서, 종전 후 유가가 내려가도 한·일 나프타 크래커의 열위가 고착될 수 있다."], "table": {"cols": ["지역/공정", "원료 구조", "전쟁 후 포지션"], "rows": [["북미 ECC", "에탄 87%", "원가 우위, 공급 공백 최대 수혜(Dow·LYB 가이던스 상향)"], ["중동 크래커", "에탄·LPG", "NGL 감소, 설비 60~70% 셧다운"], ["유럽 NCC", "납사·LPG, 노후 설비", "고에너지 비용, 셧다운·구조조정 가속"], ["중국 CTO", "석탄", "가동률 하단 지지, 범용 수출 확대"], ["중국 MTO·PDH", "메탄올·프로판(중동 의존)", "원가 부담, PDH 가동률 47%"], ["한국 NCC", "납사 85%", "상반기 원가 열위, 원료 정상화 후 역내 공백 수혜 여지"], ["일본·동남아", "납사, 중동 원료 의존", "감산·셧다운 현실화"]]}, "bullets": ["가격 하단은 비용 곡선 상단의 고원가 설비가 결정 — 유럽 영구 퇴장이 한국 단독 감축보다 큰 레버", "제품 선별 3기준: 중국 석탄·에탄으로 못 만드는 제품, 증설 사이클이 끝난 제품, 수요 증가율이 높은 제품", "미국 에틸렌 캐파 2014→2024 +63%, PE 수출 약 +200% — 셰일 ECC가 만든 구조", "중국 에탄 수입 2026년 4월까지 누적 346.2만톤"], "kr": "국내 NCC(여천NCC·롯데케미칼·LG화학·대한유화·한화토탈에너지스)는 에틸렌 스프레드보다 원료 체계 전환 가능성(MFC·HPC·에탄 도입)이 핵심 판단 기준. 나프타 크래커 기반 업체는 최악 시나리오에서 이익가치가 아니라 자산가치 기준으로 평가될 수 있다."}, {"group": "석유화학 구조", "title": "화학의 전쟁 손익 — 이익은 났지만 마진은 아니었다", "period": "2026.03~2026.09", "lede": "2026년 상반기 국내 화학사의 흑자는 제품 마진 개선이 아니라 원가 인식 시차(래깅)에서 나왔고, 되돌림 이후 남은 것은 '이익'이 아니라 '적자 축소'였다.", "body": ["전쟁 직후 화학은 단기 원가 충격을 맞았다. 공격 직후(2/27→3/3) 납사가 15% 오를 때 에틸렌은 7.8% 오르는 데 그쳐 스프레드가 오히려 축소됐다. 최근 4년 대규모 증설로 공급 과잉 상태라 원료 상승분을 즉시 전가하지 못했기 때문이다. 게다가 업황 부진으로 가동률을 낮게 유지해온 아시아 NCC의 납사 재고는 2~3주치에 불과했고, 여천NCC(90%대 → 65~68%, 불가항력), 대한유화(80 → 75%), LG화학·롯데케미칼(단계적 감산), 인도네시아 Chandra Asri, 싱가포르 PCS 등이 연쇄 감산했다.", "그런데 분기 실적은 반대로 나왔다. 2월 대비 4월 제품가는 에틸렌 97%, PS 57%, PP 54% 급등했지만 원료 납사가 72% 올라 범용 수지는 모두 원료 상승률을 밑돌았고, 3월 스팟 스프레드는 에틸렌 164달러, PE 113달러, PP 84달러로 연중 최저였다. 그러나 국내 업체는 1~2개월 전 매입한 납사를 투입하므로 3월 에틸렌 1개월 래깅 스프레드는 575달러로 폭발했다. 1Q26 국내 화학 11개사 합산 영업이익은 0.55조원(2025년 분기 평균 -0.20조원)으로 2021년 2분기 이후 처음 전원 흑자였고, 순수화학 커버리지 합산도 6,110억원으로 흑자 전환했다.", "되돌림은 빨랐다. 납사가 4월 1,062.8달러에서 6월 711.9달러로 33% 떨어지자 래깅 스프레드는 4월 310 → 5월 41 → 6월 -59달러로 반전했고, 역래깅 부담은 3분기로 이연됐다. 부타디엔은 167% 급등 후 41% 하락했다. 3Q26 에틸렌 래깅 스프레드는 185달러로 2016~25 평균(369달러)의 절반이다. 정유가 과거 평균의 4.8배 마진을 누릴 때 화학은 0.5배였던 셈이다. 같은 원유에서 출발해도 밸류체인 위치에 따라 이익이 정반대로 갈렸다.", "그래도 남은 개선이 있다. 부타디엔 스프레드(4Q25 324 → 3Q26 513달러)와 MEG 스프레드(126 → 144달러)가 좋아져 에틸렌에 배부되는 원가가 줄고 NCC 손익분기점이 낮아졌다. 그래서 범용 NCC는 '흑자 전환 시점'보다 '적자 축소 속도'로 봐야 한다는 결론이 나온다. 또 납사 급락 국면에서 PE·PP 스팟 스프레드는 473~500달러로 확대돼, 모노머를 사서 쓰는 다운스트림은 오히려 유리했다. 원료 노출이 낮은 체인(스판덱스: 석탄 BDO)은 스프레드가 확대됐다."], "table": {"cols": ["항목", "4Q25(전쟁 전)", "3Q26", "비고"], "rows": [["에틸렌 1M 래깅 스프레드($/t)", "163", "185", "2016~25 평균 369의 절반"], ["부타디엔 스프레드($/t)", "324", "513", "부산물 상승 → 에틸렌 원가 배부 감소"], ["MEG 스프레드($/t)", "126", "144", "-"], ["에틸렌 래깅 월별($/t)", "-", "3월 575 / 4월 310 / 5월 41 / 6월 -59", "래깅 → 역래깅 반전"], ["국내 화학 합산 영업이익", "2025 분기 평균 -0.20조", "1Q26 +0.55조", "재고효과 소멸 시 3Q부터 다수 적자 전환 예상"]]}, "bullets": ["방어적 가격 인상(원료 부족) vs 수요 회복형 인상 — 전자는 가격은 오르고 물량은 줄어 매출·이익이 동시에 감소할 수 있다", "에틸렌 스프레드는 이번 국면에서 수요 바로미터가 아니라 '공급 접근성 바로미터'로 변질", "1Q26 11개사 전원 흑자는 2021년 2분기 이후 처음이지만 대부분 재고효과", "일본은 납사 60% 이상 수입, 조달 구조의 약 40%가 중동 직접 노출"], "kr": "롯데케미칼·대한유화(범용 NCC)는 적자 축소 국면, 금호석유화학(C4)은 2분기 래깅 이익 후 3분기 역래깅, 효성티앤씨(스판덱스)는 스프레드 확대. 실사에서 분기 화학 실적 개선이 스팟 마진 개선인지 래깅 효과인지 반드시 분리한다."}, {"group": "석유화학 구조", "title": "공급 과잉에서 공급 재편으로? — 분쟁권 설비와 증설 지연의 상방 논리", "period": "2026.05~2026.06", "lede": "전쟁이 화학의 4년 공급 과잉 사이클을 조기에 끝낼 수 있다는 상방 논리와, 중국 대체 공급과 2027년 대규모 증설로 회복이 지연된다는 신중론이 5~6월에 정면으로 맞섰다.", "body": ["상방 논리의 출발점은 Dow의 분석이다. 글로벌 에틸렌·PE 설비의 약 50%가 호르무즈 봉쇄의 직·간접 영향권에 있고, 영향권 설비는 2026년 신규 증설 대비 에틸렌 기준 6배, PE 기준 5배 이상이며, 발표된 신규 증설 프로젝트의 약 75%가 분쟁권(중동)에 위치한다. 1Q26에는 중동 설비의 60~70%를 포함해 글로벌 에틸렌 설비의 약 20%가 셧다운됐다. 중동은 글로벌 에틸렌 능력의 약 14~16%(3,700만톤)이고 폴리머 수출의 약 25%를 차지한다. 이란 에틸렌 설비 510만톤(글로벌 2.4%)이 피격됐다.", "여기에 유럽 구조조정 가속(발표 물량 에틸렌 약 500~600만톤, 글로벌 2.3~2.8%)과 수요 측 리스타킹 신호가 더해졌다. 중국 PPI는 41개월 마이너스 끝에 2026년 3월 +0.3%로 전환했고 PPI는 화학 재고 사이클을 2~3개월 선행한다. 바이어들이 가격보다 공급 확보 리스크를 우선하며 안전재고를 쌓았고(Argus), 중국 부동산 화이트리스트·미분양 매입도 전방 수요를 지지했다. Dow·LyondellBasell은 2026~27년 가이던스를 상향했다. 이 시각은 '공급 과잉 → 공급 재편'으로 전환됐다고 본다.", "신중론은 숫자의 착시를 지적한다. 2026년 글로벌 에틸렌 순증설 전망은 6개월 새 768만톤에서 510만톤으로, 2027년은 1,691만톤에서 1,335만톤으로 줄었지만, 이는 한국 NCC의 잠정 가동 중단(-267만톤)과 중국 증설 연기(-607만톤, 이 중 373만톤은 2028~29년으로 이연) 때문이다. 한국 구조조정은 영구 폐쇄가 아닌 가동 중단이 많아 재가동될 수 있고, 연기는 공급 소멸이 아니다. 2027년 PE 순증설(1,131만톤)은 여전히 수요 증가(395만톤)의 약 3배다.", "여기에 앞 주제에서 본 중국 석탄·ECC 대체 루트와 래깅 착시가 겹친다. 그래서 같은 시점에 '하방보다 상방'(순수화학 2Q26 합산 1조원 전망)과 '5년 넘는 하락 사이클 지속'(2021년 3월 고점 이후 5년 2개월)이 동시에 나왔다. 9월까지의 실적(3Q 래깅 스프레드 185달러)은 신중론에 가까웠지만, 제품별로는 상방 논리가 맞은 체인(합성고무·스판덱스·MDI)도 있었다. 결론은 범용 전체가 아니라 제품 체인을 선별하라는 것이다."], "table": {"cols": ["제품", "2026 순증설", "2026 수요 증가", "코멘트(2026-05 기준)"], "rows": [["에틸렌", "510만톤(+2.2%)", "-", "2027년 1,335만톤, 2028년까지 부담"], ["PE", "474만톤(+3.1%)", "370만톤", "2027년 1,131만톤으로 급증"], ["프로필렌", "467만톤(+2.6%)", "348만톤", "2026년분이 2027년(815만톤)으로 연기"], ["PP", "328만톤(+2.7%)", "266만톤", "2027~28년 부담 증가"], ["MEG", "263만톤(+4.3%)", "92만톤", "2027~28년 증설 감소"], ["부타디엔", "69만톤(+3.5%)", "44만톤", "공급 부담 지속(단, NCC 감산 시 반전)"], ["ABS", "144만톤(+8.2%)", "40만톤", "2027년부터 증설 거의 없음"], ["PVC", "188만톤(+2.9%)", "-", "2027년 265만톤, 석탄계 폐쇄 변수"], ["BPA", "72만톤(+6.1%)", "28만톤", "2027년 저점 후 회복"], ["TDI", "2.5만톤(+0.7%)", "연 약 9만톤", "2026~27년 개선"]]}, "bullets": ["통계상 순증설 감소가 실질 공급 감소를 과대평가할 수 있다(가동 중단·연기 ≠ 폐쇄)", "호황기 가동률(2021년 86.7%, 2018년 90.2%) 회복에 필요한 추가 폐쇄 2,198~3,337만톤", "이미 발표된 폐쇄 약 4,000만톤(2022~25, 유럽 2,421만톤)으로도 부족, 85% 회복에 2,260만톤 추가 필요", "중국 이구환신 예산 2025년 3,000억 → 2026년 2,500억위안, 자동차 보조금 비율제 전환으로 저가차 수요 위축"], "kr": "국내 NCC(납사 85%)는 원료 조달 정상화 후 유럽·일본·동남아 공급 공백의 역내 수혜 여지가 있다는 시각과, 한국 잠정 중단 NCC의 재가동으로 효과가 약해진다는 시각이 공존한다. 딜 검토 시 에틸렌 증설 하향분 중 영구 폐쇄와 연기를 구분해 가정해야 한다."}, {"group": "구조조정·재편", "title": "한국 NCC 구조조정 지도 — 대산 → 여수 → 울산", "period": "2025.08~2026.09", "lede": "정부는 에틸렌 270~370만톤 감축을 목표로 산단 단위 통합을 유도했고, 가장 쉬운 대산부터 가장 어려운 울산 순으로 진행되고 있다.", "body": ["2025년 8월 정부와 업계는 국내 에틸렌 능력의 18~25%(리포트에 따라 21~28%)인 270~370만톤을 자율 감축하기로 하고, 10대 석화기업에 연말까지 사업재편 계획 제출을 요구했다. 충분한 계획을 낸 기업에만 금융(만기 연장·이자 유예·정책금융)·세제·R&D 지원과 규제 완화를 약속했다. 석유화학경쟁력특별법이 발의됐고 여수·서산·포항이 산업위기 선제대응지역(~2027-08-27)으로 지정됐다. 기업활력법은 소규모 분할·합병 절차 간소화, 지주회사 규제 3~5년 유예, 양도차익 과세이연(3년 이연 후 3년 분할), 등록면허세 50% 감면 등을 제공한다.", "대산(478만톤: 한화토탈 153, LG화학 130, 롯데케미칼 110, HD현대케미칼 85)이 1호다. 롯데케미칼이 대산 NCC를 물적분할해 HD현대케미칼과 합병하고 지분을 50:50으로 맞추는 공동사업재편계획을 2025년 11월 26일 신청했고, 110만톤 Box-up과 2026년 9월 통합법인 출범이 예정됐다. 통합에는 약 1.2조원 유상증자와 약 1조원 자산손상이 수반될 것으로 추정됐고 공헌이익 개선은 약 1,000억원으로 제시됐다. LG화학-한화토탈 합작 가능성도 거론된다.", "여수(627만톤, 일부 자료 642만톤: 여천NCC 229, LG화학 200, 롯데케미칼 123, GS칼텍스 75)는 가장 큰 단지이자 1979년 완공된 여천NCC 1호기 등 노후 설비가 많다. 여천NCC는 3공장(에틸렌 76만톤)을 무기한 가동 중지했고, 여천NCC와 롯데케미칼 여수의 통합(123만톤 Box-up, 2026년 12월 통합법인)이 추진되며, LG화학 NCC2의 GS칼텍스 매각·'나프타 동맹'은 자산가치·지분 문제로 진전이 더뎠다. 한화·DL의 YNCC 합작 유지 여부도 관전 포인트다.", "울산(356만톤: S-Oil 200(샤힌 포함), 대한유화 90, SK지오센트릭 66)은 가장 어렵다. 국내 최초 NCC인 SK지오센트릭 설비가 가장 노후화됐지만, 샤힌 180만톤 신규 가동으로 범용 공급 압박이 오히려 커지고 SK지오센트릭-대한유화 합작 논의(대한유화의 66만톤 인수 타진 보도)가 난항이어서 2027년 하반기로 예상된다. 결국 이번 재편의 성패는 발표 규모가 아니라 다운스트림 동반 감축과 불가역성(영구 폐쇄·JV)에 달려 있다."], "table": {"cols": ["단지", "NCC 규모", "구조조정 방향", "시점"], "rows": [["대산", "478만톤", "롯데케미칼 대산+HD현대케미칼 통합(50:50), 110만톤 Box-up, LG화학-한화토탈 합작 가능성", "2026-09 통합법인(예정)"], ["여수", "627만톤", "여천NCC+롯데케미칼 여수 통합(123만톤 Box-up), 여천NCC 3공장 가동 중지, LG화학-GS칼텍스 합작 검토", "2026-12 통합법인(예정)"], ["울산", "356만톤", "SK지오센트릭-대한유화 합작 검토(가장 어려움), 샤힌 180만톤 신규 가동", "2027년 하반기(예상)"]]}, "bullets": ["에틸렌은 내수 비중 약 80%이나 PE·PP는 약 40% — 에틸렌 370만톤을 줄여도 PE 가동률은 75.8%에 그침", "국내 에틸렌 명목가동률 79.1% → 감축 시 85.1~92.9%(샤힌 반영)", "국내 범용 과잉(내수 기준 잉여): 에틸렌 442.9만톤, PE 465.0만톤, PP 246.2만톤", "롯데케미칼 에틸렌 475만 → 260만톤(2027년 초), 손익 약 9,800억원 개선·차입금 약 3조원 축소 추정", "한국 감축 270~370만톤 = 글로벌 캐파의 1.2~1.7% — 한국 단독으로는 글로벌 가격을 바꾸기 어렵다"], "kr": "롯데케미칼, LG화학, 한화솔루션(여천NCC), DL(DL케미칼), 대한유화, HD현대(HD현대케미칼), SK이노베이션(SK지오센트릭), S-Oil이 직접 이해관계자. 딜·실사에서 통합법인 지분 구조, 유상증자·손상차손 규모, 원료 배정 계약 변경을 확인해야 한다."}, {"group": "구조조정·재편", "title": "불가역성의 경제학 — 고정비, 부산물, 그리고 배급화", "period": "2026.01", "lede": "구조조정의 가치는 '얼마나 줄였는가'가 아니라 '비용 구조를 얼마나 되돌릴 수 없게 바꿨는가'에서 나오며, 첫 가격 반응은 에틸렌이 아니라 부산물에서 온다.", "body": ["다운사이클의 진짜 고통은 변동비가 아니라 가동률 하락 시 치솟는 톤당 고정비다. 100만톤 NCC의 고정 Opex는 정상 가동 시 현금원가의 8~15%지만, 가동률이 90%에서 70%로 떨어지면 톤당 38~64달러, 50%면 100~180달러의 스프레드가 추가로 필요하다. 감산은 변동비만 줄이고 스팀·전력·폐수·부두 기본요금은 남는다. 박스업은 재가동 옵션을 유지하는 대가로 부식방지·관리비가 든다. 영구 폐쇄부터 정기보수 사이클에서 빠지며 고정비가 구조적으로 낮아지고, JV·자산 이전은 같은 산단에서 중복 운영하던 교대조·정비·구매·안전 체계와 공용 인프라를 통합해 가장 큰 절감을 만든다.", "그래서 시장은 감산 뉴스에 반응해도 밸류에이션 프리미엄은 되돌릴 수 없는 비용 재설계에만 붙는다. 전이 순서는 운영 → 현금 → 신용 → PBR이다: 비가역 공급 축소 → 스프레드 저점 상승 → 가격 규율 → 손익분기 하향 → FCF·레버리지·신용 개선 → PBR 정상화. PBR은 가장 후행하며, 손상차손으로 장부가가 줄어 생기는 기계적 PBR 상승은 착시다. 대형 통합사는 고정비 절대액이 커 구조조정 집행 시 EBITDA 민감도가 비선형적으로 크다는 역설적 옵션 가치도 있다.", "부산물 경로가 첫 파도다. 한국은 에틸렌 생산의 나프타 의존도가 매우 높아 구조조정의 실질 타깃이 나프타 크래커이고, 에틸렌 270~370만톤을 줄이면 프로필렌 130~170만톤, C4 80~110만톤, PyGas 200~270만톤이 함께 사라진다. 프로필렌은 FCC·PDH·OCU·CTO/MTO 등 대체 경로가 많아 조건부로만 타이트해지지만, 부타디엔은 대체 생산 경제성이 낮고 크래커가 멈추면 BD 추출 설비의 실효 처리능력까지 흔들려 체감 공급 감소가 더 크다. BTX는 정유 리포밍이 보완해 벤젠은 민감하나 PX는 둔감하다.", "다운스트림은 폐쇄보다 '배급화'가 먼저 온다. 에틸렌 감축이 18~25%에 이르면 크래커는 외부 판매를 줄이고 내부·장기계약·파이프라인 물량을 우선 보호한다. 유도체 공장의 생존 조건이 스프레드에서 원료 접근권으로 바뀌고, 다운스트림 구조조정은 계약 변경 → 저가동 → 범용 축소 → JV → 영구화 순서로 진행된다. 범용 PS·MEG는 고객 락인이 약해 먼저 줄고, 고객 승인 기반 ABS·컴파운딩·EO 스페셜티는 방어 여지가 있다. PVC는 염소-가성소다 밸런스 때문에 산단 단위 통합 재편으로 조정된다."], "table": {"cols": ["방식", "성격", "고정비 효과", "한계/비용"], "rows": [["감산", "운영 조정", "변동비만 감소, 톤당 고정비 오히려 상승", "업황 반등 시 즉시 공급 복귀"], ["박스업(유휴화)", "옵션 유지", "변동비·일부 인력 감소", "부식방지·관리비 등 옵션 유지비"], ["영구 폐쇄", "불가역 절감 시작", "정기보수 사이클 이탈, 규제 의무 축소", "손상차손·철거·위약금 일시 비용"], ["자산 이전/JV", "콤플렉스 재설계", "중복 조직·정비·공용 인프라 제거", "이해관계 조정·공정위·인허가 난이도"]]}, "bullets": ["2026 상반기 '배급화의 시작' → 2026 하반기~2027 '불가역성의 확정' → 2027~2028 '전력비·원료믹스 재설계'", "NCC 전기료 비중 5~6%(과거 3%대), 전력 직접구매·분산특구로 조달 구조를 바꾸는 기업만 원가 절감", "경쟁 축의 이동: 나프타를 싸게 사는 것 → 정유 부산물을 싸게 화학 원료로 바꾸는 것(MFC·HPC)", "기업결합 심사 3개월 단축의 시간가치(차입 5조원·금리 5%) 약 625억원 — 절차 속도도 가치", "모니터링: 비가역 공급 축소 누적, Capex/감가상각 1배 이하 수렴, 순차입금/EBITDA 정점 통과, 회사채 스프레드"], "kr": "금호석유화학 등 BD 유도체 생산능력이 큰 업체가 부산물 타이트화에 노출도가 크다. 롯데케미칼 대산 JV·여수 통합이 불가역성 확정 사례의 시금석이며, 실사에서는 폐쇄가 인허가 말소·해체·정기보수 계획 제외 등 복구 불가 수준으로 완결됐는지 확인해야 한다."}, {"group": "구조조정·재편", "title": "샤힌 프로젝트 — 원유를 화학으로 바로 바꾸는 설비의 경제성", "period": "2025.11~2026.09", "lede": "S-Oil 샤힌은 저가 원료 내부 조달로 톤당 40~80달러 원가 우위를 노린 세계 최초 TC2C 상업 설비지만, 범용 약세 국면에 완공돼 초기 수익은 손익분기 내외로 전망된다.", "body": ["샤힌은 Arab Light 등 원유 약 2만b/d와 정유 중질유분 약 2.6만b/d를 TC2C(Thermal Crude to Chemicals)에 넣어 납사·LPG를 만들고, 이를 180만톤급 스팀크래커에 투입해 에틸렌 180만톤, PE 132만톤, 프로필렌 77만톤 등을 생산하는 초대형 석유화학 설비다. COTC 4.6만b/d가 포함돼 정제능력은 약 71만b/d(기존 65만+4.6만)가 된다. 원재료는 납사 44%, 원유·부산물(LCO·off gas) 56%로 구성돼 납사 부족 국면에서 원료 다변화 효과가 있다. 적자 품목이던 LCO(2021년 중국 소비세 부과로 수출길 막힘)를 화학 원료로 전환하는 의미도 있다.", "일정은 공정률 85.6%(2025-11) → EPC 95%(2026-03, 설계 97.1%·구매 99.7%·건설 89.8%) → 2026년 6월 기계적 준공 → 3분기 합성수지, 4분기 NCC 시운전 → 2027년 초 상업가동·COTC 가동 순이다. 총 투자비는 약 9.3~10조원(리포트별 상이), 풀가동 시 매출 약 5조원이다. 세계 최초 상업화 설비(FOAK)라 시운전 리스크가 크며, 램프업 3개월 지연 시 EBITDA 약 2,000억원 감소가 추정됐다. 초기 가동률 가정은 2027년 1분기 40%, 연간 66%다.", "경제성의 핵심은 원가다. Heavy Oil·Off가스 등 저가 원료를 자체 정유공정에서 조달해 나프타 기반 NCC보다 톤당 40~80달러 싸다. 감가상각비는 9.5조원/20년 기준 톤당 약 100달러(연 약 3,000억원, 2027년부터 인식)이고, 과거 10년 평균 스프레드를 적용하면 매출 약 4.3조원, 영업이익 약 4,000억원이 가능하다는 추정이 있다. 반면 2022년 FID 당시 기대 IRR은 16.4%(2027년 납사 스프레드 530~550달러/톤 가정)였는데, 에틸렌·PE 약세가 2027년에도 이어지면 2027년 OPM은 손익분기 내외라는 신중론도 있다.", "국내 수급 관점에서는 양날의 검이다. 울산 단지에 에틸렌 180만톤이 새로 들어와 구조조정 중인 국내 범용 공급을 늘리고, 에틸렌 58만톤을 외부에 어떻게 팔지가 과제로 지적됐다. 감축 대상 포함 여부와 가동률을 두고 정부 협의가 필요하다는 시각도 있었다. 반면 이란 에틸렌 설비 타격과 아시아 NCC 구조조정은 샤힌 가동 시점의 업황에 우호적이고, 대규모 CAPEX(2026년 2.1조원 → 2027년 0.5조원) 종료로 FCF와 배당 여력이 커진다는 점은 정유사 리레이팅 경로(투자 정점 통과 → 배당성향 회복)와 맞닿아 있다."], "table": {"cols": ["항목", "내용", "출처/성격"], "rows": [["생산능력", "에틸렌 180만톤, PE 132만톤, 프로필렌 77만톤, COTC 4.6만b/d", "회사 공시"], ["투자비", "약 9.3~10조원", "리포트별 상이(미확인)"], ["원료 구성", "납사 44%, 원유·부산물(LCO·off gas) 56%", "회사 자료"], ["원가 우위", "나프타 NCC 대비 톤당 40~80달러", "리포트 추정"], ["감가상각", "연 약 3,000억원(2027년~), 톤당 약 100달러", "리포트 추정"], ["FID 기대 IRR", "16.4%(납사 스프레드 530~550$/t 가정)", "S-Oil(2022)"], ["평균 업황 가정 이익", "매출 약 4.3조, 영업이익 약 4,000억원", "리포트 추정(과거 10년 평균 스프레드)"], ["초기 가동률", "2027년 1Q 40%, 연간 66%", "리포트 추정"]]}, "bullets": ["정유사의 화학 투자(저부가 원료 활용)는 화학사의 에틸렌 증설보다 사이클 분산 효과가 크다는 평가", "과거 RUC/ODC 초기 가동 이슈 사례 — 램프업 곡선은 준공률이 아니라 가동률 상승 속도가 결정", "S-Oil 매출 비중(2024): 정유 79%, 석유화학 13%, 윤활 9% → 석유화학 25%로 확대 목표", "샤힌 Capex 종료 후 배당성향 20% → 2027년 30% 수준 복귀 기대"], "kr": "S-Oil 샤힌의 가동률·스프레드·감가상각 추이는 국내 정유사 화학 투자 성과의 대표 사례이자 울산 NCC 구조조정의 변수다. 대형 프로젝트 실사 시 FID 가정 스프레드와 현재 스프레드의 차이, 외부 판매처 확보, 램프업 리스크를 점검한다."}, {"group": "다운스트림·스페셜티", "title": "합성고무·NB라텍스 — 구조조정을 먼저 끝낸 체인의 턴어라운드", "period": "2025.09~2026.09", "lede": "합성고무는 범용 석유화학과 반대로 공급이 줄어온 드문 제품군이고, 중국 석탄·에탄 대체 루트가 없어 NCC 감산이 오히려 호재가 된다.", "body": ["합성고무는 2011~15년 대규모 증설 이후 2016년부터 설비 폐쇄가 이어져 글로벌 SBR 능력이 2015년 말 510만톤에서 2025년 말 437만톤으로 약 14% 줄었고 예정된 증설이 없다. 그래서 전쟁 전 '지속될 겨울'을 말한 리포트들도 합성고무만큼은 스프레드가 과거 평균을 웃도는 예외로 분류했다. 천연고무와는 대체·보완 관계라 가격이 같이 움직이는데, 천연고무는 최근 5년 수요 +3.7%, 생산 +1.8%로 5년 연속 공급 부족이었고 동남아 소농이 팜오일·두리안으로 작물을 바꾸고 있다.", "EU 산림벌채규정(EUDR)이 여기에 기름을 붓는다. 고무를 포함한 7대 품목을 EU로 수입하려면 원산지 좌표와 산림 파괴 없는 생산을 입증해야 하고, 위반 시 판매 차단·폐기·매출 최대 4% 과징금이 부과된다. 천연고무 수출의 70% 이상이 동남아, 수입의 20% 이상이 EU라 인증 비용·시간이 천연고무 공급을 더 줄인다. 2026년에는 천연고무 가격이 10년 내 최고를 기록했다.", "NB라텍스는 사이클이 한 박자 늦었다. 2021~24년 증설 부담과 코로나 때 쌓인 미국 장갑 재고로 2025년 상반기까지 회복이 더뎠지만, 가동률이 50~60%에서 75~80%로 정상화됐다. 미국은 중국산 장갑 관세를 2025년 1월 7.5% → 50%, 2026년 1월 의료용 니트릴 장갑 100%로 올렸고, 미국 장갑 수입에서 중국산은 39%에서 1% 미만, 동남아산은 56%에서 94%로 바뀌었다. 동남아 장갑 제조국(말레이시아 67%, 태국 63%, 베트남 61%)은 NB라텍스를 한국산에 의존한다. Top Glove 가동률은 58%에서 89%로 올랐고 한국 NBL 수출가는 3월 870달러에서 4월 1,580달러(+82%)로 뛰었다.", "전쟁은 원료 측면에서도 우호적이었다. NCC 가동 축소로 BD가 부족해지며 BD가 NBL에 우선 배정되고 SBR 가동률이 줄었다. 다만 역방향 리스크도 크다. BD는 2025년 12월 892 → 2026년 4월 2,381 → 8월 1,413달러로 급등락해 2분기 래깅 이익 후 6월 이후 원료·제품가 동반 하락의 역래깅이 왔다. 관세발 NBL 마진(700~900달러/톤) 급등은 중국산 우회 덤핑 등으로 시차를 두고 안정될 수 있어 구조적이지 않다는 신중론도 있다. 국내 NCC 감산으로 BD를 수입해야 하는 부담이 구조화될 수 있다는 지적도 함께 봐야 한다."], "table": {"cols": ["지표", "과거", "최근", "출처"], "rows": [["글로벌 SBR 능력", "510만톤(2015말)", "437만톤(2025말E)", "산업자료"], ["NB라텍스 글로벌 가동률", "50~60%(2024초)", "75~80%(2025-11)", "산업자료"], ["미국 중국산 장갑 관세", "7.5%", "50%(2025-01) → 100%(2026-01, 의료용 니트릴)", "US ITC·USTR"], ["미국 장갑 수입 중 동남아산", "56%(2024)", "94%(2025)", "US ITC"], ["Top Glove 가동률", "58%", "89%", "Top Glove"], ["한국 NBL 수출가($/t)", "870(2026-03)", "1,580(4월) → 1,633(5월)", "KITA"], ["부타디엔($/t)", "892(2025-12)", "2,381(4월) → 1,413(8월)", "시장 데이터"]]}, "bullets": ["NBL 마진 = NBL − 0.4×BD − 0.12×AN(1개월 래깅)", "역내 NB라텍스 경쟁사(Synthomer·Zeon) 설비 폐쇄 진행", "합성고무는 고객 인증·품질이 진입장벽이라 공급사 교체가 드물다", "대만 Nantex 4월 매출 YoY +47%(2022년 3월 이후 최대) — 동종 업계 확인 지표", "훼손 신호: 합성고무 신규 증설 발표, EUDR 연기·완화, BD 급락 시 판가 동반 하락"], "kr": "금호석유화학(NB라텍스 세계 1위 약 94.6만톤·점유율 약 25%, NB라텍스 매출의 80% 이상 동남아향, SSBR·EPDM 증설, 금호미쓰이화학 MDI 지분법). 2026E 영업이익 전망은 리포트별 4,382~4,700억원, 2H26 약 2,432억원(반기 기준 2022년 이후 최대 추정)으로 제시됐다."}, {"group": "다운스트림·스페셜티", "title": "섬유소재 체인 — 스판덱스, 타이어코드, 아라미드", "period": "2025.11~2026.09", "lede": "원료가 석유가 아니거나(스판덱스), 수요가 '본수'가 아니라 '본당 탑재량'으로 크는(타이어코드) 섬유소재는 범용 석화와 다른 사이클을 탄다.", "body": ["스판덱스는 PTMG(비중 약 80%)와 MDI(약 20%)로 만드는 고탄성 섬유인데, PTMG 원료인 BDO가 중국 석탄 기반이라 이번 전쟁의 원료 이슈에서 비켜나 있었다. 2021~25년 공급 과잉(중국 가동률 2022년 66%) 이후 신규 증설이 2025년 16만톤에서 2026년 7만톤으로 줄고 일부 중국 업체가 파산하는 가운데 수요는 연 9~10% 늘어, 2026년 가격 상승 사이클에 들어섰다. 중국 스판덱스 40D 가격은 2월 3,410달러에서 8월 4,230달러로 올랐고, 원료 PTMEG·BDO 상승은 6~10%에 그친 반면 판가가 24% 올라 원료 대비 스프레드가 29% 확대됐다. 9월 11일 가동률 82%, 재고일수 43.2일로 가동률 상승과 재고 감소가 동시에 확인됐다. 단기 리스크는 폴리에스터 감산(중국 PTA 가동률 60% 초반)에 따른 원단 수요다.", "타이어코드 수요는 '타이어 판매 본수 × 본당 탑재량'이다. 글로벌 SUV 침투율은 2009년 17%에서 2025년 51%로 올랐고 SUV 타이어의 타이어코드 투입량은 세단의 약 1.5배다. EV는 배터리 무게와 순간 토크 때문에 폭이 넓고 고강성인 타이어가 필요해 벨트 투입면적 약 1.3배, 캡플라이 약 1.6배로 늘고 캡플라이에 나일론·아라미드 하이브리드가 들어간다. 그래서 타이어 수요 +1.5~2.0%(CAGR) 대비 타이어코드는 +2.6~3.1%로 0.5~1.0%p 웃돈다는 추정이다. 한국타이어 OE 매출 중 EV 타이어 비중은 2021년 5%에서 2025년 29%가 됐다.", "공급은 과점이다. PET 타이어코드는 HS효성첨단소재 48%, 코오롱인더스트리 13%, Indorama 13%로 상위 3사가 74%, 한국 기업이 61%를 점유하고, 자동차 안전 기준 때문에 새 소재를 쓰려면 2~3년의 로드테스트가 필요해 증설이 제한된다. 시장의 75%인 RE(교체용)는 2022~25년 연 1% 미만 성장으로 이연 수요가 쌓였고, 2022년 이후 판매된 EV의 첫 교체 주기(4년)가 2026년에 시작된다. 포뮬라 가격 구조로 원료(PTA·MEG) 변동은 전가되므로 스프레드가 수익성을 좌우한다.", "아라미드는 2024년 증설 경쟁으로 공급이 수요를 약 20% 웃돌며 약세였지만, 신규 증설은 태광산업 3,500톤 정도이고 EV 타이어 캡플라이, 미국 BEAD(424억달러) 광케이블, 유럽 방위비(ReArm Europe) 세 수요가 2026~27년 동시에 작동할 수 있다는 시각이다. 글로벌 공급 약 15.2만톤(메타+파라)에서 DuPont(33%)은 사업을 Arclin에 약 18억달러에 매각하기로 했다. 탄소섬유는 중국(캐파 약 48%)과 비중국 시장이 분리돼 있고 중국 내수 가격은 가동할수록 손실이 나는 수준이다."], "table": {"cols": ["부위", "세단용", "EV·SUV용", "영향"], "rows": [["카카스", "일반 PET", "고부가 PET", "ASP 상승"], ["벨트", "트윈 스틸", "트윈 스틸(면적 확대)", "투입면적 약 1.3배"], ["캡플라이", "나일론", "나일론+아라미드 하이브리드(1:1)", "투입면적 약 1.6배, 아라미드 신규 수요"]]}, "bullets": ["스판덱스 글로벌 1위 효성티앤씨 점유율 약 30%, 중국 1위 Huafon 대비 EV/EBITDA 할인 거래", "EV 타이어 판가 +28%, 수명 +33%, EV용 타이어코드 판가 프리미엄 30~50%(추정)", "PET 타이어코드 스프레드는 3~5년 주기, 다운사이클은 길어야 2년", "리스크: 유럽 저가 소형 EV 확산으로 일반 타이어 채택, BEAD 집행 지연, 아라미드·탄소섬유 중국발 과잉 장기화"], "kr": "효성티앤씨(스판덱스), HS효성첨단소재(PET 타이어코드 48%·탄소섬유·아라미드·실리콘 음극재 진출), 코오롱인더스트리(타이어코드 13%·아라미드 1.53만톤·mPPO), 태광산업(아라미드), 한국타이어앤테크놀로지(전방)."}, {"group": "다운스트림·스페셜티", "title": "비석유계·스페셜티로의 탈출 — 생존 조건과 전환의 단계", "period": "2025.10~2026.09", "lede": "석유 수요 정점 이후 과잉이 스페셜티까지 번지는 시대에 살아남는 화학사는 석유계 원료를 쓰지 않거나, 중국이 따라오기 어려운 과점·인증 장벽을 가진 곳이다.", "body": ["첫째 유형은 원료가 나프타가 아닌 기업이다. 메탈실리콘 기반 유기실리콘(KCC-모멘티브, 실리콘 매출 비중 2018년 11% → 2025년 47%), 펄프 기반 셀룰로스 에테르(롯데정밀화학, 식의약용 이익률이 산업용의 3배 이상), 염화칼륨 전해 기반 칼륨계(유니드, 수산화칼륨 점유율 33%로 2위 Occidental 15%의 두 배)가 해당한다. 무기화학은 나프타를 쓰지 않아 석유 수요 변화에 따른 공급 과잉에서 자유롭고, 유니드는 염화칼륨을 전량 캐나다에서 조달해 중동 차질 영향도 작았다. 무기화학과 유기화학(NCC)의 수익성 격차는 전기차 개화와 함께 벌어졌다는 것이 리포트의 근거다.", "둘째 유형은 석유계 원료를 쓰지만 글로벌 소수 업체만 존재하는 제품을 가진 기업이다. SK케미칼의 Copolyester는 Eastman과 양분하는 과점 구조로 10% 후반 이익률을 내고, 미-중 관세로 Eastman의 중국 판매가 차질을 빚으며 중국 점유율이 3Q25 42%로 올랐다. 이수스페셜티케미컬의 TDM(합성고무 분자량 조절제)은 Arkema·Chevron Phillips와 함께 세계 3사 과점이다. 에폭시(국도화학·롯데정밀화학 ECH)와 MDI(금호미쓰이화학)는 2021~24년 증설 이후 공급 부담이 완화되는 사이클에 들어섰다.", "셋째는 기존 역량의 인접 확장이다. 좋은 소재 기업은 새로운 기술에서 갑자기 나오기보다 기존 공정·설비·품질 체계가 인접 고부가 영역으로 확장될 때 성공 확률이 높다. 이수스페셜티는 황화수소 취급 경험을 전고체 배터리 원료 황화리튬(40톤 → 150톤, 세계 최초 연속 공정 상업화, 500톤 로드맵)으로, PKC는 염소·인계 화학과 고순도 정제 역량을 전해질 원료 PCl3·PCl5 국산화(새만금 1공장 PCl3 2만톤·PCl5 9천톤, 황린 베트남 조달로 탈중국)와 반도체 전구체 리사이클로, 율촌화학은 필름·합지·코팅 역량을 ESS용 183μm 고성형 파우치 필름(단독 승인 지위)으로 연결했다. 각각 '표준 선점이 멀티플이 되는 단계', '국산화가 숫자가 되는 단계', '양산화가 숫자가 되는 단계'를 대표한다.", "다만 스페셜티도 안전지대는 아니다. 중국 정부가 범용 과잉 이후 전자화학품·고성능 폴리올레핀·특수고무 등 고부가 제품 육성을 명시하면서(2025-09 석유화학 안정성장 방안), POE처럼 수익성 좋던 제품이 중국 진입으로 2~3년 만에 무너진 사례가 있다. 그래서 스페셜티 전환 기업은 본업 캐시카우가 신사업 Capex를 지탱하는지(단순 테마주와의 구분), 고객 인증 락인이 실제 계약으로 전환됐는지, 중국과의 기술 격차가 몇 년인지를 함께 봐야 한다. 2026년 화학 시총 상승의 대부분도 한화솔루션(태양광), SKC(유리기판), KCC(자사주·투자자산), OCI(반도체 소재, +104%) 등 석유화학 밖에서 나왔다."], "table": {"cols": ["구분", "이수스페셜티케미컬", "PKC", "율촌화학"], "rows": [["기존 역량", "정밀화학·황화수소 취급(TDM 과점)", "염소/인계 화학·고순도 정제(CA)", "필름·합지·극박코팅·라미네이션"], ["신사업", "황화리튬, D-Sol(폐배터리 용매추출 희석제)", "PCl3·PCl5 전해질 원료, 반도체 전구체 리사이클", "배터리 파우치 필름, 폴더블·반도체 필름"], ["단계", "표준 선점 → 멀티플", "국산화 → 실적", "양산화 → 실적"], ["시간축", "장기(2027~2029)", "단기(2026 시제품)", "단중기(2026 2Q 양산)"], ["핵심 변수", "전고체 상용화·고객 인증", "설비 완공·인증·탈중국 규제", "북미 ESS 증설·가동률"]]}, "bullets": ["공정재(소모성 소재)는 금속 가격이 아닌 전방 설비 가동률에 연동돼 시황 민감도가 낮다", "품질 일관성(대규모 양산에서의 낮은 불량률)도 반응기만큼 강력한 진입장벽", "소재 인증 Lock-in: 한번 인증되면 재인증 비용·공급망 전환 리스크로 수년간 고착", "KCC 보유 상장 투자자산 2024말 2.8조 → 2026-05 8.0조원 vs 시가총액 약 4.9조원"], "kr": "KCC, 롯데정밀화학, 유니드, SK케미칼, 국도화학, 이수스페셜티케미컬, PKC, 율촌화학, OCI(석탄화학·반도체용 인산·과산화수소). IPO 실사에서는 매출 중 석유계 원료 의존 비중, 중국 진입 가능성, 인증 단계별 매출 인식 시점이 핵심."}, {"group": "원유·지정학", "title": "1%짜리 부자재가 100%를 멈춘다 — 병목, 배분, 그리고 전이 경로", "period": "2026.03~2026.09", "lede": "결핍이 임계점을 넘으면 가격이 아니라 '배분'이 물량을 정하고, 정유 차질은 화학을 건너 금속·식품 산업으로 번졌다.", "body": ["원가 비중과 공급망 영향력은 비례하지 않는다. 원가 1%짜리 부자재도 ① 규격 고정으로 대체 불가 ② 재고 부족 ③ 공급처 변경에 인증·승인 시간 필요 ④ 단일 지역·항로 조달이라는 네 조건이 동시에 겹치면 생산 100%를 멈출 수 있다. 부족이 임계점을 넘으면 가격이 배분 기능을 잃고 정부·기업이 우선순위를 정해 물량을 나눈다. 한국은 3월 27일부터 납사 매점매석을 금지하고 정유사 수출 물량을 내수로 돌리는 수급조정을 시행했으며, 이후 에틸렌·프로필렌 등 기초유분으로 확대하고 의료용 소재(주사기 1개월, 바늘 3개월분)를 우선 배정했다. 중국은 4월 10일 황산 수출을 전면 금지했다.", "황 경로가 대표적이다. 황은 원유 정제·가스 정화의 순수 부산물이라 정유·가스가 돌지 않으면 생산되지 않고, 중동이 세계 해상 황 교역의 47%를 차지해 봉쇄는 황 공급 절반의 차단과 같았다. 쿠웨이트 KPC 7월 황 판매가는 950달러/톤(2022년 고점 490달러)으로 사상 최고, 미국 걸프 황산은 155달러에서 400달러로 158% 뛰었다. 니켈 HPAL은 니켈 1톤에 황산 25~30톤을 써서 황 100달러 상승 시 니켈 판가의 4.3~5.2%에 해당하는 원가가 추가되고, 황산이 MHP 현금원가에서 차지하는 비중은 35~40%에서 65~70%로 커졌다. 칠레 Codelco의 현금원가도 파운드당 최소 0.10달러 올랐다.", "비료와 식품으로도 번졌다. 호르무즈는 글로벌 요소 수출의 35%가 지나는 길목이고, 중국은 인산비료 8월까지 원칙적 수출 중단·요소 신규 쿼터 미발행 등으로 비료 수출을 50~80% 제한했다. 요소는 4월 850달러/톤을 넘어 전쟁 전 대비 약 80% 올랐다. 파종 시기를 놓치면 한 해 수확이 영향받는 비탄력적 수요라 상방 탄력이 컸고, 비료 투입 감소는 6~12개월 시차로 2027년 작황에 반영될 수 있다.", "납사 경로는 포장재로 이어졌다. 포장재는 식품 원가의 약 10%(라면은 20~25%)인데 국내 비닐 포장지는 40~50%, 편의점 봉투 납품 단가는 최대 39% 올랐고, 계열 포장재사를 둔 농심조차 납사 비축분이 3개월에서 1개월로 줄었다. 일본 Calbee는 인쇄잉크 조달 차질로 주력 14개 품목 포장을 흑백으로 바꿨다. 방습 코팅·식품 안전 승인 때문에 소재 전환은 느려 실제 대응은 필름을 얇게 하고 품목을 줄이는 방식이었다. 가동이 가능했던 수지·필름·컨버터 업체는 판가와 물량을 동시에 확보했다. 부산물 가격은 이번 사이클에서 대부분 반납돼 '구조적 부족'이 아니라 '병목의 좌표'로 읽어야 한다는 것이 결론이다."], "table": {"cols": ["주체", "조치", "유형", "시점"], "rows": [["한국 정부", "납사 수급조정(정유사 수출→내수 전환), 매점매석 금지", "물량 배분", "2026-03~"], ["한국 정부", "기초유분 확대 + 의료용 소재 우선 공급·비축", "물량 배분", "2026 상반기"], ["중국", "황산 수출 전면 금지·쿼터 폐지(4/10)", "수출 통제", "2026-04"], ["중국", "청정유 수출쿼터 유지 후 7월 완화", "수출 통제", "2026-07"], ["중국", "인산비료 수출 원칙적 중단(~8월), 요소 신규 쿼터 미발행", "수출 통제", "2026-03~"], ["미국 EPA", "여름철 휘발유 규제 조기 완화(8/20)", "규제 완화", "2026-08"], ["인도", "석유제품 자국 공급 우선", "내수 우선", "2026 지속"]]}, "bullets": ["공급망 위험 7요소(생산국 집중·정련 집중·물리적 병목·수출통제·가용재고·대체재·신규공급 리드타임) 평가, 22개 원자재 평균 3.65점", "포장 인쇄 색상 축소·주문 상한·거래처별 배분 같은 현장 신호가 가격 통계보다 선행", "정책 개입 구간에서는 스프레드보다 규제 시작·해제 시점이 더 중요한 변수", "2027년 포장재·수지 공급계약 갱신에서는 납사 하락으로 수요측 협상력이 작동할 전망"], "kr": "고려아연(온산 황산 연 148만톤, 황산 50달러 상승 시 연 약 725억원 이익 개선, 전력·LNG 차감 후 약 380억원 추정)처럼 황산을 자체 생산하는 제련사는 외부 황 구매 업체와 원가 구조가 반대다. 율촌화학 등 포장재 업체와 식품사 간 손익도 정반대로 갈렸다."}, {"group": "구조조정·재편", "title": "투자 결정은 숫자로 돌아온다 — 지난 10년 정유화학 투자의 ROIC", "period": "2026.06", "lede": "정유화학은 한 사이클의 이익으로 다음 사이클을 투자하는데, 지난 10년 이익이 향한 배터리와 범용 에틸렌은 아직 ROIC 회복을 보여주지 못했다.", "body": ["중후장대 산업은 7~10년 한 사이클에서 번 이익으로 다음 사이클 설비에 투자하고, 그 성과는 완공·가동 후 ROIC로 돌아온다. 정유는 EV 확산에 따른 수송연료 수요 감소, 화학은 NCC 원가 열위와 공급 과잉이라는 숙제 때문에 지난 사이클 이익을 다른 방향으로 투자했다. SK이노베이션은 지난 9년 누적 CAPEX 42.9조원 중 약 70%를 배터리에, LG화학은 양극재에 약 4~5조원, 롯데케미칼은 미국 ECC(약 3조원)·인도네시아 라인(약 5.7조원)·동박사 인수(약 2.7조원)에 투자했다.", "에틸렌 투자는 2010년대 중국 수요 성장 기대(당시 수요 CAGR 3.6~4.2%)를 바탕으로 했지만 현재 전망은 2.5~3.4%로 낮아졌고, 2022년 하반기 이후 범용 약세가 지속되며 회수가 지연됐다. LG화학 여수 NCC 80만톤 증설(약 2.6조원), 여천NCC 34만톤(약 0.9조원), 대한유화 온산 80 → 90만톤(약 1,600억원)이 모두 이 범주다. 다만 정유사의 화학 투자(RUC/ODC, 샤힌, GS칼텍스 MFC 약 2.7조원, HD현대 HPC 약 3.4조원)는 부생가스·잔사유 같은 저부가 원료를 활용한 밸류체인 확장이라 화학사 증설보다 상대적으로 합리적이라는 평가다.", "배터리는 더 어렵다. EV 판매 성장률(1~4월 누적)은 2025년 28%에서 2026년 4%로 둔화됐고, 가성비 시장에서 중국산 각형(LFP)이 점유율을 넓혀 각형 비중이 81%가 됐으며, 파우치 탑재 OEM은 상위 5개사(현대기아·VW·GM·Daimler·Ford)가 81%로 집중돼 있다. ESS 배터리 시장은 중국 업체 점유율이 90%를 넘는다. SK이노베이션은 4Q25 약 5.0조원의 자산손상을 인식했고 SK온 2026년 Capa를 240GWh에서 179GWh로 조정했다. 삼성SDI의 글로벌 각형 점유율도 2020년 12%에서 2025년 3%로 떨어졌다.", "밸류에이션 함의는 명확하다. ROIC-WACC(ROIC Spread)가 음(-)이면 투자가 가치를 훼손하는 것이고, ROE가 0 내외이며 추가 자산손상 가능성이 있으면 PBR 1배 이하가 정당화된다. 2026년 정유 실적은 2022년처럼 양호하지만 지속 가능성은 낮고, 일회성 이익을 밸류에이션에 그대로 반영하기 어렵다. 반면 HD현대는 조선·전력기기 계열사 호황으로 지주 ROIC가 개선됐다. Commodity에서 Specialty로의 전환은 유럽·일본 선진 화학사가 거친 경로지만 대형 M&A보다 자체 역량 축적이 선행돼야 한다는 시각이다."], "table": {"cols": ["회사", "투자 내용", "완공", "CAPEX"], "rows": [["롯데케미칼", "미국 ECC 100만톤(에탄 기반)", "2019", "약 3조원"], ["롯데케미칼", "인도네시아 라인 NCC 100만톤 Complex", "2025", "약 5.7조원"], ["LG화학", "여수 NCC 에틸렌 80만톤 증설", "2021", "약 2.6조원(다운스트림 포함)"], ["여천NCC", "여수 제2사업장 에틸렌 34만톤 증설", "2021", "약 0.9조원"], ["대한유화", "온산 NCC 80→90만톤", "2022말", "약 1,600억원"], ["S-Oil", "RUC/ODC + 샤힌(TC2C, 에틸렌 180만톤)", "2018 / 2026", "약 5조원 / 약 9.3조원"], ["GS칼텍스", "MFC 에틸렌 약 75만톤", "-", "약 2.7조원"], ["HD현대오일뱅크", "HPC(롯데케미칼 합작) 에틸렌 85만톤", "-", "약 3.4조원"], ["SK이노베이션", "SK지오센트릭 폐플라스틱 공정", "2027 목표", "누적 약 5조원"]]}, "bullets": ["같은 에틸렌 투자라도 투자 주체(정유사형 vs 화학사형)에 따라 경제성이 다르다", "", "주요 OEM의 EV·배터리 관련 자산손상 규모 회사별 약 8.2~32조원", "정유사 프리미엄의 원천은 과거 높은 배당성향 — 투자 종료 후 배당성향 회복이 출발점"], "kr": "SK이노베이션·LG화학·롯데케미칼의 투자 대비 ROIC 추적이 핵심. IPO·ECM 관점에서는 공모자금 사용처(CAPEX)가 과거 사이클의 실패 패턴(범용 증설·수요 과대 추정)과 겹치지 않는지, 완공 설비의 ROIC가 WACC를 넘는지 확인한다."}, {"group": "원유·지정학", "title": "원유 패권 재편 — UAE 탈퇴, 비OPEC 공급, WTI-Dubai 재역전", "period": "2026.03~2026.09", "lede": "호르무즈 사태 이후 수입국 다변화, OPEC 균열, 미국 중심 공급 재편이 겹쳐 중동산 원유의 가격 결정력이 약해지고, 이는 셰일 붐 15년의 역상으로 아시아 정유사에 원가 우위를 줄 수 있다.", "body": ["수요 측에서는 아시아의 다변화가 확인됐다. 한국 원유 수입의 중동 비중은 2022~25년 평균 약 70%에서 2026년 4월 52%(약 50%)로 급락했고 미국(15 → 25%), 호주·브라질(각 2 → 5%), 캐나다(0 → 3%)가 늘었다. 태국 Thai Oil은 중동 의존도를 90% 이상에서 35%로 낮추고 서아프리카 40%·남미 10%로 바꿨다. 캐나다 TMX와 알래스카 원유는 태평양을 통해 약 10일이면 아시아에 도달해(중동 16일, 미국 걸프 24일) 운송 측면의 경쟁력도 있다.", "공급 측에서는 OPEC 결속이 흔들렸다. OPEC 점유율은 2017년 40%에서 약 32~33%로 떨어져 감산이 유가 상승으로 이어지지 않게 됐고, 사우디 재정균형유가(2025년 92달러, 2026년 87달러)를 크게 밑도는 유가에서 감산을 지속하기 어려웠다. 2026년 5월 생산량 340만b/d의 UAE(이란 제외 시 OPEC 실질 3위, 산유 비중 약 12%)가 사우디 감산 정책에 대한 불만으로 OPEC·OPEC+를 탈퇴했고, 생산능력을 485만에서 500만b/d로 늘릴 계획이다. 풀가동 시 추가 공급 여력은 약 150만b/d(글로벌 소비의 약 1.5%)다. 매장량 1위지만 생산 21위(약 90만b/d)인 베네수엘라는 2026년 1월 마두로 체포 이후 석유법 개정과 OFAC 일반 라이선스(GL 46~50)로 개방되며 OPEC 이탈 후보로 거론된다.", "증산 주도권은 비OPEC으로 넘어가고 있다. 가이아나(2021년 12만 → 2027년 120만b/d 전망), 브라질 Pre-Salt, 나미비아·앙골라·나이지리아 심해(개발비 10년 새 배럴당 14 → 8달러, BEP 43달러), 캐나다 TMX(89 → 119만b/d), 알래스카(Pikka 2026년 생산 개시, Willow 2029년)가 새 공급원이다. 반면 미국 셰일은 리그·DUC가 12~15년 래 최저이고 Permian 증분이 둔화돼 Oxy는 생산 정점을 2027~31년으로 봤다. 라틴아메리카가 2025년 발견 매장량의 38%를 차지했다.", "이 흐름은 WTI 상대 강세, Dubai 상대 약세, 아시아향 OSP 하향 안정으로 이어진다. 아시아 정유사는 0.5~1배에 머물렀다. 호르무즈 정상화 후 약 15~16년 만의 WTI-Dubai 재역전이 오면 셰일 붐 때 미국 정유사가 받던 리레이팅이 한국에서 재현될 수 있다는 논리다. 반론도 있다 — OSP의 장기 마이너스는 셰일처럼 통제 불가능한 경쟁자와 점유율 싸움을 할 때만 나타났고, UAE 증산은 정치적 조율이 가능해 그 수준은 아니라는 판단이다(2026-07)."], "table": {"cols": ["국가/지역", "기존(2022~25)", "2026년 4월"], "rows": [["중동", "약 70%", "52%(약 50%)"], ["미국", "15%", "25%"], ["호주", "2%", "5%"], ["브라질", "2%", "5%"], ["캐나다", "0%", "3%"]]}, "bullets": ["사우디 OSP 마이너스는 20년간 2008년·2015~17년·2020년 세 번뿐 — 2014년 말 전환이 정유 업사이클 출발점", "아람코는 계열(Dedicated) 정유사 판매 비중을 2021년 43% → 2025년 53%로 확대", "WTI 할증기(2000~2010) S-Oil 마진이 Valero보다 약 2%p 높았다", "미국 전략비축유 2억 8,970만 배럴(1982년 이후 최저) — 재충전 수요가 유가 하단 지지", "중국: 15차 5개년 원유 생산 2억톤 유지, 비축유 약 9억 배럴로 확대, 2025~26년 1.7억 배럴 비축 설비 증설"], "kr": "S-Oil·SK이노베이션·GS칼텍스·HD현대오일뱅크의 원유 조달 원가와 도입선 다변화가 종전 후에도 유지되는지가 핵심. 사우디산 비중이 높은 S-Oil은 OSP 하락 효과를 가장 직접 받고, 다변화 역량이 큰 회사는 WTI-Dubai 구조 변화의 수혜를 받는다."}], "market": {"lede": "시장·수급 탭은 이번 사이클을 숫자로 요약한다. 정유는 원유 가격이 전쟁 전으로 돌아간 뒤에도 정제마진이 과거 평균의 3~5배로 유지됐고, 화학은 래깅 착시가 걷히자 에틸렌 스프레드가 평균의 절반으로 내려앉았다. 같은 원유 충격이 원가 인식 시차·설비 병목·원료 진영에 따라 정반대로 전달된 과정을 차트와 표로 확인한다.", "bars": [{"title": "싱가포르 복합정제마진 경로", "unit": "$/bbl", "note": "장기 평균·전쟁 전후 실적과 리포트 전망(2H26·2027)을 함께 표시. 4월 고점은 Pe E", "631만톤(+4.1%)", "474만톤(+3.1%)", "1,131만톤(전 1,388만)"], ["프로필렌", "803만톤(+4.5%)", "467만톤(+2.6%)", "815만톤"], ["PP", "411만톤(+3.5%)", "328만톤(+2.7%)", "-"], ["MEG", "317만톤(+5.1%)", "263만톤(+4.3%)", "-"], ["ABS", "105만톤(+5.7%)", "144만톤(+8.2%)", "거의 없음"], ["MDI", "5만톤(+0.7%)", "38만톤(+3.4%)", "-"], ["TDI", "3만톤(+0.7%)", "2.5만톤(+0.7%)", "-"]], "note": "S&P Global Platts(2025-11), 리포트 추정(2026-05). 에틸렌 하향분의 대부분은 한국 가동 중단(-267만톤)과 중국 연기(-607만톤)"}, {"title": "지역별 에틸렌 구조조정 현황", "cols": ["지역", "규모(글로벌 캐파 대비)", "주요 내용", "시기"], "rows": [["한국", "270~370만톤(1.2~1.7%)", "NCC 자율 감축, 대산·여수·울산 통합", "2026~27"], ["중국", "노후 약 700만톤 중 최대 610만톤(1.5~3.0%)", "20년 이상 설비 폐쇄·개조, CTO/MTO·소형 정제 폐쇄, 에틸렌 신규 허가 제한", "2026~2030(2029년 말 폐쇄 기한)"], ["일본", "140만톤(0.6~1.0%)", "Maruzen, Idemitsu·Mitsui, ENEOS 크래커 폐쇄", "2026~27"], ["유럽", "약 500~600만톤(2.3~2.8%)", "Dow Bohlen·Schkopau, TotalEnergies Antwerp, SABIC, LyondellBasell 등", "2023~2027"]], "note": "ICIS, 한국석유화학협회, 언론 종합, 리포트 추정"}]}, "cycle": {"lede": "2025년 가을 연간전망 시즌의 합의는 '정유는 봄, 화학은 겨울'이었다. 원유는 OPEC+ 증산으로 남아돌지만 정제설비 순증설이 수요에 못 미쳐 정제마진은 강하고, 석유화학은 수요와 원가가 좋아져도 중국발 증설 때문에 4년째 불황이라는 진단이었다. 2026년 2월 28일 미-이 전쟁과 호르무즈 봉쇄는 이 구도를 뒤집지 않고 **양극단으로 증폭**시켰다 — 정유는 사상 최고 마진의 초호황, 화학은 원료 조달 차질과 래깅 착시. 이후 7월 원유가 전쟁 전 가격으로 돌아가며 '평균 회귀' 논쟁이 붙었지만, 3분기 데이터는 원유와 제품의 정상화 속도가 다르다는 '병목' 해석을 지지했다.", "now": "2026년 9월 현재 정유는 '공급 병목형 호황의 2막'이다. 원유 조달 위험은 우회로(동서 송유관·푸자이라·STS)로 상당 부분 완화돼 사우디 OSP가 -2.0달러까지 내려왔지만, 피격 정제설비(명목 685만b/d)와 역대 최저 재고 때문에 3Q26 누적 복합정제마진이 33.9달러(과거 평균의 약 4.8배)로 유지되고 있다. 다만 9월 후티의 모카항 장악과 동서 송유관 중단으로 Dubai가 123.7달러로 재급등해 원유 원가가 먼저 오르며 단기 마진이 압박받는 구간이 나타났다. 화학은 래깅 착시가 걷히고 에틸렌 래깅 스프레드가 평균의 절반(185달러)에 머무는 '적자 축소' 국면으로, 대산·여수 통합 등 구조조정의 불가역성 확정과 다운스트림 선별(합성고무·스판덱스·MDI)이 관전 포인트다.", "timeline": [{"date": "2025-08", "title": "국내 NCC 270~370만톤 감축 자율협약", "body": "정부가 에틸렌 능력의 약 18~25% 감축과 연말까지 사업재편안 제출을 요구하고 금융·세제 지원을 연계했다. 시장은 반등을 기대했지만 '잉여설비 수준'이라는 회의론도 컸다.", "tone": "중립"}, {"date": "2025-09", "title": "'기대와 달리 차가운 현실' — 화학 4년째 불황 진단", "body": "수요 개선과 유가 하락이 이미 나타났는데도 중국 에틸렌 증설 전망이 1년 새 43% 늘어 스프레드가 개선되지 않는다는 진단. 업사이클은 유가가 30~40달러 바닥에서 반등할 때만 왔다는 과거 패턴 제시. 중국은 9/26 석유화학 안정성장 방안 발표.", "tone": "부정"}, {"date": "2025-10", "title": "정제마진 연중 최고(약 14달러), 감유증화의 Spillover 경고", "body": "러시아 설비 피격·단고테 차질로 복합정제마진이 급등. 한편 중국 COTC로 과잉이 연료→범용→스페셜티로 번진다는 경고가 나왔다. 미중 정상회담으로 관세 휴전.", "tone": "중립"}, {"date": "2025-11", "title": "연간전망 시즌: 정유 강세 합의, 화학은 '겨울' vs '터널 탈출'로 분열", "body": "정유는 순증설(55~110만b/d)이 수요 증가에 못 미치고 EU 제3국 정제품 금지로 업사이클 합의(복합마진 15~20달러). 화학은 '지속될 겨울'과 '바닥 탈출·구조조정 원년' 시각이 공존. 11/26 롯데케미칼·HD현대케미칼 대산 사업재편 승인 신청(국내 1호).", "tone": "중립"}, {"date": "2026-01", "title": "구조조정의 작동 원리 — '감산이 아니라 불가역성'", "body": "EU의 러시아 원유 기반 제3국 정제품 수입 금지 발효(1/21), 미국의 베네수엘라 마두로 체포(1/3). 국내 구조조정의 가치는 영구 폐쇄·JV 등 불가역성에서 나오고 첫 가격 반응은 부타디엔에서 올 것이라는 분석.", "tone": "중립"}, {"date": "2026-02", "title": "전쟁 직전: 1~2월 복합마진 9.1달러, Dubai 68달러", "body": "전쟁 이전에도 정제마진이 과거 평균(5.8달러)을 크게 웃돌던 '이미 타이트한' 상태. 2/28 미국·이스라엘의 이란 공격(Operation Epic Fury)으로 호르무즈가 사실상 봉쇄됐다.", "tone": "중립"}, {"date": "2026-03", "title": "호르무즈 봉쇄 1주차: WTI +35.6%, 정제마진 +20.6달러", "body": "Dubai 100달러 돌파, 복합정제마진 33.3달러(3년 8개월 래 최대), 유럽 디젤 +54%, 납사 +22%. 3/4 여천NCC 불가항력, 3/5 중국 제품 수출 금지, 3/13 국내 최고가격제 시행, 3/23 Dubai 170달러 고점. 정유 단기 수혜 vs 화학 원가 충격.", "tone": "긍정"}, {"date": "2026-03", "title": "'원유는 공급 우위, 제품은 타이트' — 물류 충격과 설비 충격의 구분", "body": "이번 유가 급등은 물류 충격이라 경로가 풀리면 원유는 하향 안정되지만, 제품은 순증설 급감(2027년 5만b/d)과 설비 피격으로 지속가능 레벨이 올라간다는 분석. 중국 PPI 41개월 만에 +0.3% 전환.", "tone": "긍정"}, {"date": "2026-04", "title": "정제마진 사상 최고 87달러, K-정유 수출 슈퍼사이클", "body": "중동·아시아 정제 공급 10~15% 감소 속에 한국이 사실상 유일한 수출 가능 공급자로 부각. 원유 도입량 57%까지 급감, 아시아 납사 1,062.8달러 고점. '전쟁의 본질은 접근성의 재가격화'라는 프레임 등장.", "tone": "긍정"}, {"date": "2026-05", "title": "하반기 전망: '하방보다 상방' vs '정유 초호황·석화 회복 지연'", "body": "UAE OPEC 탈퇴, OSP 19.5달러 고점, 아시아 크래커 가동률 57%. 정유는 종전 후에도 26달러 안팎 마진이 유지된다는 전망과 K-에너지 재평가론. 화학은 분쟁권 증설 75%를 근거로 한 상방론과, 5년 넘는 하락 사이클·중국 석탄/ECC 대체 공급을 근거로 한 신중론이 충돌.", "tone": "긍정"}, {"date": "2026-06", "title": "마진은 최고, 가동률은 60%대 — 이익의 질 논쟁", "body": "경질유 대체 업부별 EV/EBITDA와 보유 지분 NAV 할인을 더하는 방식을 쓴다. 핵심 원칙은 두 가지다 — 재고효과·래깅으로 부풀려진 분기 이익이 아니라 사이클을 지난 '정상 이익'에 멀티플을 적용할 것, 그리고 밸류에이션 프리미엄은 되돌릴 수 없는 구조 변화(설비 폐쇄·원가 구조·배당 정책)에만 붙인다는 것.", "methods": [{"name": "P/B-ROE(적정 PBR 역산)", "when": "경기순환 업종 전반(정유·화학 중소형·타이어코드). ROE와 PBR의 상관이 높을 때.", "how": "적정 P/B = (ROE − g) ÷ (COE − g). ROE는 10개년(지주사 5개년) 가중평균, g는 30년 국고채 90일 평균, COE는 무위험수익률 + 베타 × 시장위험프리미엄. 또는 과거 ROE-P/B 회귀식에 예상 ROE를 대입.", "band": "정유 업종 12MF PBR: 과거 업사이클 평균 약 1.7배, 2017년 고점 약 2.3배, 2026년 하반기 약 1.2~1.4배. 국내 화학 평균 2025년 약 0.4배(역대 최저) — 리포트 인용(Bloomberg 등)", "pitfalls": "호황 1~2년의 ROE를 장기 평균으로 착각하면 과대평가된다. 손상차손으로 자본이 줄어 생기는 기계적 PBR 상승은 착시. 저 PBR 자체는 공급 과잉 장기화 국면에서 반등 근거가 되지 못한다."}, {"name": "12MF PBR 밴드와 이익 추이 중첩", "when": "사이클 위치(바닥·회복·고점) 판단. 정유는 정제마진, 화학은 스프레드·가동률과 함께.", "how": "12개월 선행 PBR 차트에 영업이익 추이를 겹쳐 이익 턴어라운드 초기에 PBR 리레이팅이 동반되는지 본다. 재고평가이익을 제외한 정제마진 기반 이익으로 평가.", "band": "SK이노베이션 0.7~1.8배(금융위기 0.7, 정유 폐쇄 사이클 1.8, 배터리 기대기 1.6). 금호석유화학 12MF 약 0.6배(과거 호황기 하단 0.9배, 10년 최저 평균 0.8배 하회). 국내/중국 화학 PBR 괴리율 -45.4%(2025-11, 중국 평균 2.03배). GS 등 지주사 0.4~0.8배 — 리포트 인용", "pitfalls": "밴드 하단은 '싸다'가 아니라 '시장이 영속기업 가정을 의심한다'는 뜻일 수 있다(한국 NCC). 최고가격제 같은 정책 리스크가 밴드를 구조적으로 낮출 수 있다."}, {"name": "사이클 국면별 EV/EBITDA(사업부별 합산)", "when": "정유·화학·윤활을 함께 가진 복합 정유사, 부문별 성격이 다른 화학사.", "how": "사이클과 무관한 '평균 EBITDA'(과거 평균 이익률 × 예상 매출)에 업황 판단 멀티플을 곱해 사업부 가치를 합산하고 순차입금을 차감. 정유는 글로벌 피어, 화학은 국내 피어 평균 EV/EBITDA를 쓰고 다운사이클엔 멀티플 하단에서 추가 할인(예: 10%).", "band": "정유 바닥 3.5x·평균 6.5x·호황 8.5x·초호황 9.5x, 석유화학 바닥 3.5x·평균 6.5x·호황 8.5x, 윤활유 바닥 9.0x·평균 10.3x·호황 11.5x — 리포트 방법론(2026-05)", "pitfalls": "초호황 EBITDA에 초호황 멀티플을 곱하는 이중 계상. 윤활유처럼 과점 사업은 정유와 같은 멀티플을 적용하면 과소평가될 수 있다."}, {"name": "Sum-of-the-Parts + 보유 지분 NAV 할인", "when": "상장 자회사·투자자산 비중이 큰 지주형 화학사(LG화학·SK케미칼·KCC), 정유 지주사(GS·HD현대), 배터리를 가진 SK이노베이션.", "how": "본업 사업부 가치 + 상장 자회사 지분가치 × (1 − 할인율) + 투자자산 − 순차입금. 할인율은 일반 지주 60~70%, 중복상장 사업회사 90%대까지.", "band": "리포트 적용 할인율: LG화학의 LGES 지분 60~75%(2026-05 기준 73%), SK케미칼의 SK바이오사이언스 95%. KCC 보유 상장 투자자산 8.0조원 vs 시가총액 약 4.9조원(2026-05).", "pitfalls": "유동화 계획 번복(KCC 2025년 9월 철회 사례) 시 할인 축소 논리가 무너진다. 할인율은 지분 유동화·자사주 소각·상법 개정 등 '실행'이 확인될 때만 줄어든다."}, {"name": "글로벌 피어 상대 비교(원가 구조 기반)", "when": "아시아 정유사의 구조적 리레이팅 여부 판단, 북미 ECC vs 아시아 NCC 비교.", "how": "미국 정유사(Valero·Marathon·Phillips 66)와 아시아 정유사(ENEOS·Thai Oil·Reliance·한국 4사)의 PBR 격차를 원유 원가 격차(WTI vs Dubai+OSP)로 설명하고, 원가 구조 변화 시 격차 축소 폭을 추정.", "band": "셰일 붐 15년간 WTI 약 6달러 할인이 격차의 근본 원인 — Bloomberg(2026-05)", "pitfalls": "WTI-Dubai 재역전은 가설 단계이며, OSP 장기 마이너스는 셰일급 통제 불가 경쟁자가 있을 때만 나타났다는 반론이 있다."}, {"name": "ROIC-WACC(투자 성과 검증)", "when": "대규모 CAPEX 이후(배터리·범용 에틸렌·샤힌) 리레이팅 근거 검증, IPO 공모자금 사용처 평가.", "how": "완공 설비의 ROIC를 WACC와 비교. ROIC Spread가 음(-)이면 투자가 가치를 훼손하는 것이며, ROE 0 내외·추가 손상 가능성이 있으면 과거 3년 평균 PBR 대비 할인 적용.", "band": "배터리 투자 비중이 큰 기업은 2026년 이후 음(-) 추정. 샤힌 FID 기대 IRR 16.4% vs 2027년 OPM BEP 내외 전망 — 리포트 추정(2026-06)", "pitfalls": "일회성 정제마진 급등 이익으로 ROIC가 일시 개선돼 보이는 착시. 투자 주체(정유사형 vs 화학사형)에 따라 같은 에틸렌 투자도 경제성이 다르다."}, {"name": "단계별 스페셜티 밸류에이션", "when": "범용에서 스페셜티로 전환 중인 중소형 화학사·소재사.", "how": "국산화·양산화가 실적으로 확인되는 단계는 이익 추정 기반(PER·EV/EBITDA), 차세대 표준 선점 단계는 장기 멀티플 재평가(옵션 가치). 소재 비중이 커지면 반도체·배터리 소재 피어 PBR을 할인 적용.", "band": "리포트 기준 시가총액(2026-03): 이수스페셜티 약 2.75조, PKC 약 3,070억, 율촌화학 약 5,880억원. 신사업(예: mPPO) 영업이익 × 20배 적용 사례", "pitfalls": "본업 캐시카우 없이 신사업 기대만 있는 '테마주'와 구분해야 한다. 고객 인증 지연·경쟁사 진입이 멀티플을 즉시 되돌린다."}], "notes": ["IPO·밸류에이션 기준 연도 선택이 결정적이다: 2026년은 정유 초호황·화학 래깅 이익이 섞인 비정상 연도라, 2026년 실적에 피어 멀티플을 곱하면 정유는 과대, 화학은 방향이 불분명해진다. 2027년 정상 이익(정제마진 10/19/30달러 시나리오)과 재고효과 제거 이익을 함께 제시하는 것이 합리적이다.", "공모 구조와 사이클 타이밍: 정유 PBR이 업사이클 평균(1.7배)보다 낮은 1.2~1.4배에 머문 이유는 정책 불확실성(최고가격제)과 이익 지속성 의심이다. 에너지 관련 IPO·블록딜은 정책 해소 시점과 피크아웃 신호(피격 설비 복구·재고 정상화)를 함께 고려해야 한다.", "화학 IPO는 범용 비중과 비석유·스페셜티 비중을 분리해 서로 다른 피어군을 적용해야 한다. 2026년 화학 시총 상승의 대부분은 석유화학 밖(태양광·반도체 소재·자산가치·주주환원)에서 나왔다.", "구조조정 참여 기업은 유상증자·손상차손(대산 통합 약 1.2조원 증자·약 1조원 손상 추정)과 과세이연·정책금융 조건이 ECM 이벤트(증자·메자닌·자산 유동화)를 만든다. 기업활력법 승인과 통합법인 지분 구조를 선행 확인한다.", "지주 할인·NAV 할인 축소는 상법 개정 발효(2026 하반기)와 자사주 소각·지분 유동화(PRS·EB) 실행이 트리거다. 교환사채·PRS 구조는 할인 라인 정상화 예상(1~2분기)", "why": "그룹III 윤활기유 고마진 종료 시점", "type": "시장"}, {"date": "2027-06", "event": "중간유분 강세 전망 기간 종료 시점(상반기)·SPR 재충전 수요", "why": "정유 마진 정상화 속도와 원유 수요 하단", "type": "시장"}, {"date": "2027-08-27", "event": "여수·서산·포항 산업위기 선제대응지역 지정 종료", "why": "구조조정 지원 기간 만료 시점", "type": "정책"}, {"date": "2027-09", "event": "울산 NCC 구조조정 예상(하반기)", "why": "SK지오센트릭·대한유화 합작 여부, 샤힌과 겹친 공급 압박", "type": "정책"}, {"date": "2027-12", "event": "Dow Bohlen(51만톤)·TotalEnergies Antwerp(55만톤) 크래커 폐쇄", "why": "유럽 에틸렌 공급 감소, 가격 바닥 상승 요인", "type": "프로젝트"}, {"date": "2028", "event": "중국 SPC·SP Chemicals 등 복합피드·에탄 크래커 가동", "why": "중국 원가 경쟁력 제고, 한·일 NCC 열위 고착 위험", "type": "프로젝트"}, {"date": "2029", "event": "중국 20년 이상 노후 석유화학 설비 폐쇄 명령 기한(연말)", "why": "노후 에틸렌 약 700만톤의 실제 폐쇄·개조 확인", "type": "정책"}, {"date": "2030", "event": "중국 에틸렌 능력 8,664만톤(2025년 5,975만톤) 전망", "why": "과잉 공급 장기화 가늠 — 폐쇄보다 신설이 큰 구조", "type": "시장"}], "glossary": [{"term": "복합정제마진", "en": "Complex Refining Margin", "def": "고도화 설비를 갖춘 표준 정유소 기준으로 제품 가중평균가에서 원유가와 운영비를 뺀 이익 지표. 주로 싱가포르 기준($/bbl).", "group": "정유·원유"}, {"term": "크랙 스프레드", "en": "Crack Spread", "def": "개별 석유제품 가격에서 원유 가격을 뺀 값. 제품별 정제 수익성을 나타낸다(예: 경유-Dubai).", "group": "정유·원유"}, {"term": "3-2-1 크랙", "en": "3-2-1 Crack Spread", "def": "원유 3배럴로 휘발유 2배럴과 디젤 1배럴을 만든다고 가정한 미국식 정제마진 지표.", "group": "정유·원유"}, {"term": "상압증류탑", "en": "CDU (Crude Distillation Unit)", "def": "원유를 끓는점 차이로 LPG·납사·휘발유·등경유·잔사유로 나누는 1차 정제 설비. 정제능력의 기준 단위.", "group": "정유·원유"}, {"term": "고도화율", "en": "Upgrading Ratio", "def": "CDU 능력 대비 RFCC·수첨분해·코커 등 중질유 분해 설비 능력의 비율. 높을수록 싼 중질유로 비싼 경질 제품을 만든다.", "group": "정유·원유"}, {"term": "잔사유 유동층 접촉분해", "en": "RFCC", "def": "상압잔사유를 촉매로 분해해 휘발유·LPG·프로필렌·LCO를 만드는 고도화 설비.", "group": "정유·원유"}, {"term": "유동접촉분해", "en": "FCC (Fluid Catalytic Cracking)", "def": "중질유(VGO 등)를 촉매로 분해해 휘발유 등 경질 제품을 만드는 설비. 프로필렌 부산물을 낸다.", "group": "정유·원유"}, {"term": "수첨분해", "en": "HCR / HYC (Hydrocracker)", "def": "수소를 첨가해 중질유를 경유·항공유 등 중간유분으로 분해하는 고도화 설비.", "group": "정유·원유"}, {"term": "코커", "en": "Coker", "def": "가장 무거운 잔사유를 열분해해 경질유와 코크스로 바꾸는 설비. 초중질 원유 처리 능력을 좌우한다.", "group": "정유·원유"}, {"term": "경질순환유", "en": "LCO (Light Cycle Oil)", "def": "RFCC에서 나오는 방향족이 많은 중간유분. 중국 소비세 부과로 수출길이 막혀 적자 품목이 됐다.", "group": "정유·원유"}, {"term": "감압경유", "en": "VGO (Vacuum Gas Oil)", "def": "감압증류 유분으로 윤활기유·FCC·수첨분해의 공통 원료. 연료 마진이 높으면 기유 생산의 기회비용이 커진다.", "group": "정유·원유"}, {"term": "경질유분·중간유분·중질유분", "en": "Light Ends / Middle Distillates / Heavy Ends", "def": "끓는점별 유분 구분. 경질은 LPG·납사·휘발유, 중간은 등유·경유·항공유, 중질은 중유·아스팔트.", "group": "정유·원유"}, {"term": "API 비중", "en": "API Gravity", "def": "미국석유협회의 원유 밀도 지표. 높을수록 가볍다. 32도 이상 경질, 22.3~32도 중간(Medium), 22.3도 미만 중질.", "group": "정유·원유"}, {"term": "Sweet / Sour", "en": "Sweet / Sour Crude", "def": "황 함량 0.5% 미만이면 Sweet(저유황), 이상이면 Sour(고유황). 중동 원유 주류는 Medium-Sour.", "group": "정유·원유"}, {"term": "설계 원유", "en": "Design Crude Slate", "def": "정유 설비가 최적 운전되도록 설계된 기준 원유 성상. 다른 원유를 넣으면 처리량·수율이 떨어진다.", "group": "정유·원유"}, {"term": "원유 성상 분석", "en": "Crude Assay", "def": "원유의 API·황 함량·수율 등을 분석한 데이터. 원유 블렌딩과 제품 믹스 최적화의 기초.", "group": "정유·원유"}, {"term": "래깅 효과", "en": "Lagging Effect", "def": "원료 도입과 제품 판매 사이 시차로 생기는 손익. 원료 가격 상승기엔 이익, 하락기엔 손실(역래깅).", "group": "정유·원유"}, {"term": "역래깅", "en": "Negative Lagging", "def": "원료 가격 하락기에 과거 고가 원료(또는 고OSP)가 원가로 잡혀 마진이 줄어드는 현상.", "group": "정유·원유"}, {"term": "재고평가손익", "en": "Inventory Valuation Gain/Loss", "def": "보유 원유·제품 재고의 가격 변동에 따른 회계상 손익. 선입선출법은 한꺼번에, 총평균법은 분산 반영된다.", "group": "정유·원유"}, {"term": "공식판매가격", "en": "OSP (Official Selling Price)", "def": "사우디 아람코 등 중동 산유국이 매월 지역별로 고시하는 원유 판매 프리미엄/할인(Dubai 대비). 약 1개월 뒤 원가에 반영.", "group": "정유·원유"}, {"term": "두바이유", "en": "Dubai Crude", "def": "중동산 원유 가격의 기준 유종. 아시아 정유사 도입 원가의 벤치마크.", "group": "정유·원유"}, {"term": "현물-선물 스프레드", "en": "Cash-Futures Spread", "def": "현물과 선물 가격 차이. 양(+)으로 클수록 즉시 인도 물량이 귀하다는 뜻(백워데이션). 전쟁 중 Dubai 3월 평균 +37.66달러.", "group": "정유·원유"}, {"term": "티팟", "en": "Teapot", "def": "중국 산둥성 중심의 독립계 소형 정유사. 정제처리량의 약 30%, 제재국 원유의 주요 구매자.", "group": "정유·원유"}, {"term": "감유증화", "en": "减油增化", "def": "석유제품(연료) 생산은 줄이고 화학제품 생산을 늘리는 중국 정책.", "group": "정유·원유"}, {"term": "원유-화학 직접 전환", "en": "COTC (Crude Oil to Chemicals)", "def": "원유를 연료가 아닌 화학 원료로 최대한 전환하는 정유·화학 통합 공정.", "group": "정유·원유"}, {"term": "스윙 프로듀서", "en": "Swing Producer", "def": "공급 여력을 조절해 시장 수급 공백을 메우는 공급자. 원유에서는 사우디, 석유제품에서는 한국이 거론됐다.", "group": "정유·원유"}, {"term": "그룹III 기유", "en": "Group III Base Oil", "def": "API 분류상 점도지수 120 이상의 고순도 윤활기유. 고급 엔진오일 원료.", "group": "정유·원유"}, {"term": "가스-액체 전환", "en": "GTL (Gas to Liquids)", "def": "천연가스를 합성해 액체 연료·윤활기유를 생산하는 공정. Shell Pearl GTL이 대표.", "group": "정유·원유"}, {"term": "지속가능항공유", "en": "SAF (Sustainable Aviation Fuel)", "def": "폐식용유·바이오 원료 등으로 만든 항공유.", "group": "정유·원유"}, {"term": "체선료", "en": "Demurrage", "def": "선박이 약정 기간을 넘겨 대기할 때 용선자가 내는 비용. 봉쇄 중 VLCC 하루 10만달러 이상.", "group": "정유·원유"}, {"term": "초대형 원유운반선", "en": "VLCC", "def": "약 200만 배럴을 싣는 원유 운반선. 중동-아시아 왕복 38~45일.", "group": "정유·원유"}, {"term": "선박 간 환적", "en": "STS (Ship-to-Ship)", "def": "해상에서 선박 간 화물을 옮겨 싣는 방식. 봉쇄 우회 수단으로 활용됐다.", "group": "정유·원유"}, {"term": "본선인도 / 운임보험료포함 인도", "en": "FOB / CIF", "def": "FOB는 선적항 인도, CIF는 운임·보험료 포함 도착항 인도 조건. 전쟁 중 FOB-CIF 스프레드가 독립 가격축이 됐다.", "group": "정유·원유"}, {"term": "셰일 신규정 단가", "en": "Shale Breakeven", "def": "미국 셰일 신규 유정의 손익분기 유가(약 64~65달러). 유가가 이 아래로 가면 시추가 정체된다.", "group": "정유·원유"}, {"term": "시추 후 미완결 유정", "en": "DUC (Drilled but Uncompleted)", "def": "시추는 끝났지만 생산을 시작하지 않은 대기 유정. 소진되면 셰일 생산 증분이 둔화된다.", "group": "정유·원유"}, {"term": "재정균형유가", "en": "Fiscal Breakeven Oil Price", "def": "산유국 재정수지를 균형으로 만드는 유가. 사우디 2025년 92달러, 2026년 87달러(IMF).", "group": "정유·원유"}, {"term": "전략비축유", "en": "SPR (Strategic Petroleum Reserve)", "def": "정부가 보유한 비상용 원유. 방출 후 재충전 수요가 유가 하단을 지지한다.", "group": "정유·원유"}, {"term": "정유 수급률", "en": "Refining Utilization (Demand/Capacity)", "def": "글로벌 석유 수요를 유효 정제능력으로 나눈 값. 평균 약 82%, 고점 83.7%를 넘으면 마진이 비선형 상승.", "group": "정유·원유"}, {"term": "순증설", "en": "Net Capacity Addition", "def": "신규 증설 용량에서 폐쇄·가동중단 용량을 뺀 값. 수요 증가보다 작으면 가동률과 마진이 오른다.", "group": "정유·원유"}, {"term": "MOPS", "en": "Mean of Platts Singapore", "def": "Platts가 산정하는 싱가포르 석유제품 평균 가격. 국내 정유사 공급가의 기준.", "group": "정유·원유"}, {"term": "CERAWeek", "en": "CERAWeek by S&P Global", "def": "매년 휴스턴에서 열리는 세계 최대 에너지 업계 행사. 2026년 화두는 에너지 안보.", "group": "정유·원유"}, {"term": "나프타 분해설비", "en": "NCC (Naphtha Cracking Center)", "def": "납사를 열분해해 에틸렌·프로필렌·C4·BTX를 생산하는 석유화학 기초 설비.", "group": "석유화학 공정·제품"}, {"term": "에탄 분해설비", "en": "ECC (Ethane Cracking Center)", "def": "셰일가스 부산물인 에탄을 원료로 주로 에틸렌을 생산하는 설비. 북미·중동의 원가 우위 원천.", "group": "석유화학 공정·제품"}, {"term": "석탄·메탄올 올레핀", "en": "CTO / MTO", "def": "석탄 또는 메탄올에서 에틸렌·프로필렌을 만드는 중국식 공정.", "group": "석유화학 공정·제품"}, {"term": "프로판 탈수소", "en": "PDH (Propane Dehydrogenation)", "def": "프로판에서 수소를 떼어 프로필렌을 생산하는 공정.", "group": "석유화학 공정·제품"}, {"term": "혼합원료 크래커", "en": "MFC (Mixed Feed Cracker)", "def": "나프타 외 LPG·정제가스 등 여러 원료를 투입할 수 있는 크래커(GS칼텍스).", "group": "석유화학 공정·제품"}, {"term": "중질원료 석유화학 설비", "en": "HPC (Heavy-feed Petrochemical Complex)", "def": "정유 잔사유·탈황중질유를 원료로 쓰는 석유화학 콤플렉스(HD현대케미칼).", "group": "석유화학 공정·제품"}, {"term": "원유 열분해 화학 전환", "en": "TC2C (Thermal Crude to Chemicals)", "def": "원유를 열분해해 석유화학 원료를 직접 얻는 공정. S-Oil 샤힌에 세계 최초 상업 적용.", "group": "석유화학 공정·제품"}, {"term": "올레핀 전환 설비", "en": "OCU (Olefin Conversion Unit)", "def": "에틸렌과 부텐을 반응시켜 프로필렌을 만드는 메타세시스 설비.", "group": "석유화학 공정·제품"}, {"term": "기초유분", "en": "Basic Petrochemicals", "def": "에틸렌·프로필렌·부타디엔·BTX 등 석유화학 최상류 제품.", "group": "석유화학 공정·제품"}, {"term": "C4 유분", "en": "C4 Fraction", "def": "탄소 4개 유분. 부타디엔·부텐 등을 포함하며 NCC 수율 약 8.7~10%.", "group": "석유화학 공정·제품"}, {"term": "분해가솔린", "en": "PyGas (Pyrolysis Gasoline)", "def": "크래커에서 나오는 방향족이 풍부한 분해가솔린. BTX 원료.", "group": "석유화학 공정·제품"}, {"term": "BTX", "en": "Benzene·Toluene·Xylene", "def": "리포머·크래커에서 나오는 방향족 기초유분.", "group": "석유화학 공정·제품"}, {"term": "개질유", "en": "Reformate", "def": "중질납사를 개질한 고옥탄·방향족 유분. 휘발유 블렌딩 또는 PX·벤젠 원료로 쓰인다.", "group": "석유화학 공정·제품"}, {"term": "파라자일렌 / 고순도 테레프탈산", "en": "PX / PTA", "def": "PX는 PTA의 원료, PTA는 MEG와 함께 폴리에스터·PET를 만든다.", "group": "석유화학 공정·제품"}, {"term": "모노에틸렌글리콜", "en": "MEG", "def": "에틸렌 산화로 만드는 폴리에스터 원료. 중국 능력의 약 40%가 석탄 기반.", "group": "석유화학 공정·제품"}, {"term": "폴리에틸렌 / 폴리프로필렌", "en": "PE / PP", "def": "에틸렌·프로필렌을 중합한 최대 범용 합성수지. 포장재·자동차·가전 소재.", "group": "석유화학 공정·제품"}, {"term": "염소-알칼리 공정", "en": "CA (Chlor-Alkali)", "def": "소금물 전기분해로 염소·가성소다·수소를 생산하는 공정. 전력비가 원가 핵심.", "group": "석유화학 공정·제품"}, {"term": "NCC 스프레드", "en": "NCC Spread", "def": "나프타 1톤을 분해해 나오는 제품 가중 가치에서 원료비를 뺀 값. 에틸렌+0.58×프로필렌+… − 나프타.", "group": "석유화학 공정·제품"}, {"term": "래깅 스프레드", "en": "Lagging Spread", "def": "제품가격에서 1~2개월 전 원료 가격을 뺀 스프레드. 실제 투입 원가 기준 손익에 가깝다.", "group": "석유화학 공정·제품"}, {"term": "비용 곡선", "en": "Cost Curve", "def": "설비를 생산 원가 순으로 줄 세운 곡선. 가격은 한계 설비 원가에서 결정되고 우측 고원가 설비가 먼저 가동을 줄인다.", "group": "석유화학 공정·제품"}, {"term": "박스업", "en": "Box-up / Mothballing", "def": "재가동 가능성을 남기고 질소 봉입 등으로 설비를 유휴화·봉인하는 구조조정 방식.", "group": "석유화학 공정·제품"}, {"term": "배급화", "en": "Allocation / Rationing", "def": "원료 감축 시 크래커가 외부판매를 줄이고 내부·장기계약 물량을 우선 보호하는 현상. 유도체 공장의 생존 조건이 원료 접근권이 된다.", "group": "석유화학 공정·제품"}, {"term": "램프업", "en": "Ramp-up", "def": "신규 설비가 기계적 준공 후 설계 수율·가동률에 도달하기까지의 기간.", "group": "석유화학 공정·제품"}, {"term": "세계 최초 상업화 설비", "en": "FOAK (First-of-a-Kind)", "def": "처음 상업화되는 설비로 시운전 리스크가 크다.", "group": "석유화학 공정·제품"}, {"term": "Oil/Gas Ratio", "en": "Oil to Gas Price Ratio", "def": "유가를 가스 가격으로 나눈 비율. 10~15배면 NCC와 ECC 원가가 비슷하다.", "group": "석유화학 공정·제품"}, {"term": "불가항력", "en": "Force Majeure (FM)", "def": "통제 불가능한 사유로 계약상 공급 의무 이행을 면제받는 선언. 여천NCC·카타르에너지 등이 선언했다.", "group": "석유화학 공정·제품"}, {"term": "화학적 재활용", "en": "CR (Chemical Recycling)", "def": "폐플라스틱을 화학적으로 분해해 원료로 재생하는 방식.", "group": "석유화학 공정·제품"}, {"term": "부타디엔", "en": "BD (Butadiene)", "def": "NCC C4 유분에서 추출하는 합성고무 원료. 대체 생산 경제성이 낮아 NCC 감산 시 가장 먼저 타이트해진다.", "group": "합성고무·섬유·스페셜티"}, {"term": "스티렌부타디엔고무 / 부타디엔고무", "en": "SBR / BR", "def": "타이어·신발 밑창용 범용 합성고무.", "group": "합성고무·섬유·스페셜티"}, {"term": "용액중합 SBR", "en": "SSBR (Solution SBR)", "def": "연비와 접지력이 좋아 EV·고성능 타이어에 쓰이는 고기능 SBR.", "group": "합성고무·섬유·스페셜티"}, {"term": "니트릴 부타디엔 라텍스", "en": "NB Latex (NBL)", "def": "BD와 아크릴로니트릴로 만드는 니트릴 장갑 원료.", "group": "합성고무·섬유·스페셜티"}, {"term": "에틸렌프로필렌디엔고무", "en": "EPDM", "def": "내후성이 우수한 특수 합성고무. 자동차 실링·전선·방수시트용.", "group": "합성고무·섬유·스페셜티"}, {"term": "열가소성 가황 엘라스토머", "en": "TPV", "def": "EPDM과 PP를 섞어 고무와 플라스틱 성질을 함께 가진 소재.", "group": "합성고무·섬유·스페셜티"}, {"term": "분자량 조절제", "en": "TDM (Tertiary Dodecyl Mercaptan)", "def": "SBR·NBR·NB라텍스 중합 시 분자량을 조절하는 황화합물 첨가제. 세계 3사 과점.", "group": "합성고무·섬유·스페셜티"}, {"term": "스판덱스", "en": "Spandex (Elastane)", "def": "PTMG와 MDI로 만드는 고탄성 폴리우레탄 섬유.", "group": "합성고무·섬유·스페셜티"}, {"term": "BDO / PTMG", "en": "1,4-Butanediol / PTMEG", "def": "스판덱스의 주원료(BDO)와 중간원료(PTMG). 중국 BDO는 석탄 기반.", "group": "합성고무·섬유·스페셜티"}, {"term": "타이어코드", "en": "Tire Cord", "def": "타이어 골격을 형성하는 섬유·강선 보강재(PET·나일론·스틸·아라미드).", "group": "합성고무·섬유·스페셜티"}, {"term": "카카스 / 캡플라이", "en": "Carcass / Cap Ply", "def": "카카스는 타이어 기본 골격층, 캡플라이는 벨트 위에서 고속 주행 시 벨트 이탈을 막는 보강층.", "group": "합성고무·섬유·스페셜티"}, {"term": "OE / RE", "en": "Original / Replacement Equipment", "def": "신차 장착용(약 25%) / 교체용(약 75%) 타이어.", "group": "합성고무·섬유·스페셜티"}, {"term": "파라아라미드", "en": "Para-aramid", "def": "강철 5배 강도의 고강도 방향족 폴리아미드 섬유(Kevlar 등). 방탄·타이어·광케이블용.", "group": "합성고무·섬유·스페셜티"}, {"term": "MDI / TDI", "en": "Methylene / Toluene Diisocyanate", "def": "경질·연질 폴리우레탄 핵심 원료. MDI 경질폼은 LNG선 보냉재에 쓰인다.", "group": "합성고무·섬유·스페셜티"}, {"term": "폴리우레탄폼", "en": "PUF (Polyurethane Foam)", "def": "LNG선 화물창 보냉재의 핵심 단열 소재.", "group": "합성고무·섬유·스페셜티"}, {"term": "에피클로로히드린", "en": "ECH (Epichlorohydrin)", "def": "에폭시 수지 원료인 염소계 중간재. 프로필렌 또는 글리세린으로 생산.", "group": "합성고무·섬유·스페셜티"}, {"term": "비스페놀A", "en": "BPA", "def": "페놀·아세톤으로 만드는 에폭시·PC 원료.", "group": "합성고무·섬유·스페셜티"}, {"term": "DMC(실록산)", "en": "Dimethylcyclosiloxane", "def": "메탈실리콘에서 만드는 유기실리콘 기초 중간재.", "group": "합성고무·섬유·스페셜티"}, {"term": "Copolyester(PETG)", "en": "PET Glycol-modified", "def": "CHDM을 공중합한 투명·내화학성 변성 폴리에스터. 화장품 용기·가전용.", "group": "합성고무·섬유·스페셜티"}, {"term": "폴리올레핀 엘라스토머", "en": "POE", "def": "메탈로센 촉매 기반 고부가 폴리올레핀. 중국 진입으로 수익성이 무너진 스페셜티 사례.", "group": "합성고무·섬유·스페셜티"}, {"term": "황화리튬", "en": "Li2S (Lithium Sulfide)", "def": "황화물계 전고체 배터리 고체전해질의 핵심 원료.", "group": "합성고무·섬유·스페셜티"}, {"term": "육불화인산리튬", "en": "LiPF6", "def": "리튬이온 배터리 전해액의 대표 전해질염. 중국이 생산의 약 95%.", "group": "합성고무·섬유·스페셜티"}, {"term": "4M 승인", "en": "Man·Machine·Material·Method", "def": "생산 조건 변경 시 고객사가 요구하는 품질 승인 절차.", "group": "합성고무·섬유·스페셜티"}, {"term": "고압 산침출", "en": "HPAL", "def": "저품위 니켈 광석을 고온·고압 황산으로 녹이는 습식제련. 니켈 1톤에 황산 25~30톤 사용.", "group": "합성고무·섬유·스페셜티"}, {"term": "용매추출-전해채취", "en": "SX-EW", "def": "산화동광을 황산으로 침출해 구리를 분리·전해하는 습식제련.", "group": "합성고무·섬유·스페셜티"}, {"term": "단기 에너지 전망", "en": "STEO", "def": "EIA가 매월 발표하는 단기 에너지 수급·가격 전망.", "group": "가격·수급 지표"}, {"term": "원유 순수요", "en": "Net Demand (Demand − Supply)", "def": "수요 증가 전망에서 공급 증가 전망을 뺀 수급 과부족. 마이너스면 공급 과잉.", "group": "가격·수급 지표"}, {"term": "공선 비중", "en": "Ballaster Ratio", "def": "화물 없이 이동하는 유조선 비중. 낮아지면 운임이 오른다.", "group": "가격·수급 지표"}, {"term": "월드스케일", "en": "WS (Worldscale)", "def": "유조선 운임을 표준 운임 대비 지수로 표시하는 단위.", "group": "가격·수급 지표"}, {"term": "ARA", "en": "Amsterdam-Rotterdam-Antwerp", "def": "유럽 석유제품 재고 허브.", "group": "가격·수급 지표"}, {"term": "고유황 중유", "en": "HSFO", "def": "고유황 연료유. 선박·발전용.", "group": "가격·수급 지표"}, {"term": "생산자물가지수", "en": "PPI", "def": "생산자 판매가격 변동. 중국 PPI는 화학 재고 사이클을 2~3개월 선행한다.", "group": "가격·수급 지표"}, {"term": "재고 사이클(리스타킹)", "en": "Restocking", "def": "다운스트림이 재고를 줄이다가 가격 바닥·공급 불안 인식 시 다시 쌓는 흐름.", "group": "가격·수급 지표"}, {"term": "12개월 선행 PBR", "en": "12MF PBR", "def": "12개월 선행 순자산 대비 시가총액 배수. 사이클 위치 판단에 쓰인다.", "group": "가격·수급 지표"}, {"term": "사우디 계약가격", "en": "CP (Contract Price)", "def": "사우디 아람코가 매월 고시하는 아시아향 LPG(프로판·부탄) 기준가격.", "group": "가격·수급 지표"}, {"term": "반내권", "en": "Anti-Involution (反內卷)", "def": "과잉 경쟁(내권)을 억제하려는 중국의 산업 구조조정 기조.", "group": "정책·규제·지정학"}, {"term": "이구환신", "en": "以旧换新", "def": "중국의 노후 가전·자동차 교체 보조금 정책. ABS·PS 수요 지표.", "group": "정책·규제·지정학"}, {"term": "증치세 환급", "en": "VAT Rebate (China)", "def": "중국 부가가치세의 수출 시 환급. 정제품 13→9%, PVC 13%는 2026-04 폐지.", "group": "정책·규제·지정학"}, {"term": "최고가격제", "en": "Price Ceiling", "def": "정부가 휘발유·경유·실내등유 공급가 상한을 정한 제도(2026-03-13 시행).", "group": "정책·규제·지정학"}, {"term": "가격상한제(러시아)", "en": "Price Cap", "def": "G7·EU가 러시아산 원유 해상운송 서비스 제공 조건으로 설정한 가격 상한(60 → 47.6달러).", "group": "정책·규제·지정학"}, {"term": "그림자 선단", "en": "Shadow Fleet", "def": "제재를 회피해 러시아·이란 원유를 운송하는 노후·비공식 유조선단.", "group": "정책·규제·지정학"}, {"term": "OFAC 일반 라이선스", "en": "OFAC GL (General License)", "def": "미국 재무부 해외자산통제국이 제재 대상 거래를 일반적으로 허용하는 면허.", "group": "정책·규제·지정학"}, {"term": "EU 산림벌채규정", "en": "EUDR", "def": "고무 등 7대 품목의 EU 유통 시 산림 파괴 없는 공급망 입증을 요구하는 규정.", "group": "정책·규제·지정학"}, {"term": "탄소국경조정제도", "en": "CBAM", "def": "EU가 수입품의 내재 탄소배출량에 비용을 부과하는 제도(2026-01 본격 시행).", "group": "정책·규제·지정학"}, {"term": "기업활력법", "en": "기업활력제고특별법", "def": "사업재편 승인 기업에 분할·합병 절차 간소화와 세제·규제 특례를 주는 법.", "group": "정책·규제·지정학"}, {"term": "우려 외국기관 / 금지 외국기관", "en": "FEOC / PFE", "def": "미국 세액공제에서 배제되는 중국 등 우려국 관련 공급망 주체.", "group": "정책·규제·지정학"}, {"term": "비우려국 원자재 비율", "en": "MACR", "def": "미국 세액공제 요건인 비FEOC(비PFE) 부품·원자재 원가 비중.", "group": "정책·규제·지정학"}, {"term": "OBBBA", "en": "One Big Beautiful Bill Act", "def": "미국 세제·에너지 법안. 중국산 부품 규제 조항 포함.", "group": "정책·규제·지정학"}, {"term": "반덤핑·상계관세", "en": "AD/CVD", "def": "덤핑 수출과 정부 보조금에 대응해 부과하는 관세.", "group": "정책·규제·지정학"}, {"term": "호르무즈 해협", "en": "Strait of Hormuz", "def": "페르시아만과 오만만을 잇는 해협. 세계 원유 물동량 약 20%, LNG 약 20%, 해상 납사 약 37%가 통과.", "group": "정책·규제·지정학"}, {"term": "페트로달러", "en": "Petrodollar", "def": "원유 대금을 달러로 결제하던 미-사우디 체제. 2024년 협정 종료.", "group": "정책·규제·지정학"}, {"term": "사업부별 가치합산", "en": "Sum-of-the-Parts (SOTP)", "def": "사업부별 가치를 합산하고 순차입금을 차감해 기업가치를 산정하는 방법.", "group": "재무·밸류에이션"}, {"term": "NAV 할인율", "en": "NAV Discount", "def": "보유 지분·자산가치를 시장이 할인해 반영하는 비율. 지주 60~70%, 중복상장 90%대.", "group": "재무·밸류에이션"}, {"term": "가격수익스왑", "en": "PRS (Price Return Swap)", "def": "주식 가격 변동을 상대방과 교환하는 파생계약. 자회사 지분 유동화에 활용(LG화학의 LGES 지분).", "group": "재무·밸류에이션"}, {"term": "투하자본이익률 / 가중평균자본비용", "en": "ROIC / WACC", "def": "영업 투하자본 대비 세후 영업이익률 / 자본의 요구수익률. ROIC−WACC가 음이면 가치 훼손.", "group": "재무·밸류에이션"}, {"term": "P/B-ROE 모델", "en": "Justified P/B", "def": "적정 P/B = (ROE − g) ÷ (COE − g). 경기순환 업종 적정 PBR 산정.", "group": "재무·밸류에이션"}, {"term": "JKM / TTF / Henry Hub", "en": "LNG·가스 벤치마크", "def": "동북아 LNG 현물 / 유럽(네덜란드) 가스 / 미국 천연가스 기준가격.", "group": "가스·에너지"}, {"term": "천연가스액", "en": "NGL (Natural Gas Liquids)", "def": "가스전에서 나오는 에탄·프로판·부탄 등 액체 탄화수소.", "group": "가스·에너지"}, {"term": "에탄 운반선", "en": "VLEC (Very Large Ethane Carrier)", "def": "에탄 전용 초대형 운반선. 중국 ECC 전환에 수반되는 투자.", "group": "가스·에너지"}, {"term": "LNG Slope", "en": "LNG Slope", "def": "유가연동 LNG 장기계약에서 유가에 곱하는 계수(예: 12%).", "group": "가스·에너지"}, {"term": "수반가스", "en": "Associated Gas", "def": "Permian 셰일 원유 생산 시 함께 나오는 가스. 유가 상승 시 미국 가스 공급도 늘어 가격이 안정된다.", "group": "가스·에너지"}, {"term": "계통한계가격", "en": "SMP (System Marginal Price)", "def": "전력 도매시장 시간대별 한계가격. LNG 가격에 연동돼 민간 발전사 이익을 좌우한다.", "group": "가스·에너지"}, {"term": "부유식 LNG 생산설비", "en": "FLNG", "def": "해상 가스전 위에서 가스를 생산·액화·저장하는 선박형 설비.", "group": "가스·에너지"}, {"term": "부유식 원유 생산·저장·하역설비", "en": "FPSO", "def": "심해 원유를 생산·저장·하역하는 해양플랜트.", "group": "가스·에너지"}], "sources": {"orig": ["IEA(Oil Market Report·WEO)", "EIA(STEO·주간 재고)", "OPEC", "Saudi Aramco(OSP)", "S&P Global Platts(MOPS·에틸렌 수급)", "ICIS", "IHS", "Argus", "Petronet(한국석유공사)", "Bloomberg", "Kpler", "Vortexa", "Reuters", "Wood Mackenzie", "BNEF", "Rystad Energy", "Thai Oil", "IIR", "FACTS Global Energy·Energy Aspects", "Datastream", "Baltic Exchange", "KITA(한국무역협회)", "KOSIS", "관세청·TRASS", "한국석유화학협회(KPIA)", "산업통상자원부", "중국 해관총서", "중국 국가통계국", "NDRC·MIIT(중국 발개위·공업정보화부)", "BAIINFO", "Mysteel", "CCFGroup·Cischem", "WIND·CEIC", "Eurostat·CEFIC", "ANRPC", "US ITC·USTR", "IMF·OECD", "GlobalPetroPrices", "각사 공시(DART)"], "notes": ["정제마진 고점 수치가 원문마다 다르다: 4월 사상 최고 87달러(Petronet 복합마진, 일중·주간 고점 성격), 전쟁 직후 최고 90달러, 4월 월평균 39달러(싱가폴, Datastream) — 지표 정의(국내 복합 vs 싱가포르, 스팟 vs 월평균)를 확인한 뒤 인용해야 한다.", "사우디 OSP 월 표기가 1개월씩 어긋난다: 대부분 리포트는 5월 19.5·6월 15.5·9월 -2.0달러(적용월 기준)로, 한 리포트(2026-07)는 4월 19.5·5월 15.5·6월 9.5달러로 표기했다. 발표월·선적월 차이로 추정되며 7월 값(9.5달러)은 미확인으로 처리했다.", "정제설비 순증설 전망은 같은 2026년에도 55~110만b/d, 2025년은 -37~+39만b/d로 기관·시점별 편차가 크다. 중동 정제 피해도 280만(파손)·340만(차질)·594만(중동+아시아 차질)·685만b/d(러시아+중동 명목) 등 정의가 달라 범위로 표기했다.", "국내 에틸렌 능력은 약 1,280만톤(KPIA)~1,460만톤(샤힌 포함)으로, 여수 단지는 627만톤과 642만톤으로 자료마다 다르다. 감축 목표 270~370만톤의 비중도 18~25% 또는 21~28%로 분모에 따라 다르다.", "리포트의 기업 이익 전망(예: S-Oil 2026E 영업이익 2.3조~4.4조원)은 발행 시점(전쟁 전·후)에 따라 크게 달라 본 데스크에서는 추세 설명에만 제한적으로 인용했고, 종목별 가격 목표·매매 의견은 제외했다.", "2026년 3월 이후 수치는 주 단위로 급변했고, 일부 표의 복구 일정·가동률은 리포트 추정치다. 2026-09-16 이후 상황(후티 사태 전개, 3Q 실적)은 반영되지 않았다."]}, "desks": [{"key": "hc", "name": "헬스케어", "url": "https://kj-ryan-ra.github.io/healthcare-desk/"}, {"key": "oilchem", "name": "정유·화학", "url": "../oilchem/"}, {"key": "transition", "name": "에너지전환", "url": "../transition/"}, {"key": "power", "name": "전력인프라", "url": "../power/"}, {"key": "nuclear", "name": "원전", "url": "../nuclear/"}, {"key": "metals", "name": "철강·비철", "url": "../metals/"}], "reports": [{"date": "2025-09-30", "tone": "부정", "topic": "", "thesis": ""}, {"date": "2025-10-02", "tone": "부정", "topic": "", "thesis": ""}, {"date": "2025-11-12", "tone": "긍정", "topic": "", "thesis": ""}, {"date": "2025-11-13", "tone": "중립", "topic": "", "thesis": ""}, {"date": "2025-11-13", "tone": "긍정", "topic": "", "thesis": ""}, {"date": "2025-11-17", "tone": "부정", "topic": "", "thesis": ""}, {"date": "2025-11-19", "tone": "긍정", "topic": "", "thesis": ""}, {"date": "2025-11-19", "tone": "중립", "topic": "", "thesis": ""}, {"date": "2025-11-26", "tone": "긍정", "topic": "", "thesis": ""}, {"date": "2025-12-03", "tone": "중립", "topic": "", "thesis": ""}, {"date": "2026-01-06", "tone": "중립", "topic": "", "thesis": ""}, {"date": "2026-03-09", "tone": "중립", "topic": "", "thesis": ""}, {"date": "2026-03-09", $('#cut').textContent=`DATA CUT ${M.cut}`;

 ['데스크 도구',[['chk','체크포인트'],['uni','커버리지 유니버스'],['cal','이벤트 캘린더'],['fact','수치 DB'],['gl','용어 사전'],['src','출처·데이터 품질']]]

let nav='',panes='',n=0;const NUM={};
TABS.forEach(([g,items])=>{nav+=`<div class="nav-group">${g}</div>`;items.forEach(([id,name])=>{n++;const k=String(n).padStart(2,'0');NUM[id]=k;nav+=`<button data-p="${id}"><span class="k">${k}</span>${name}</button>`;panes+=`<section class="pane" id="p-${id}"></section>`;});});
$('#nav').innerHTML=nav;$('#panes').innerHTML=panes;
const head=(id,en,title,lede)=>`<div class="eyebrow">${NUM[id]} — ${en}</div><h2>${title}</h2>${lede?`<p class="lede">${md(lede)}</p>`:''}`;
const table=(cols,rows)=>`<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function chips(el,groups,cb,label='전체'){el.innerHTML=[label,...groups].map((g,i)=>`<button class="chip" aria-pressed="${i===0}" data-g="${esc(i?g:'')}">${esc(g)}</button>`).join('');el.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;el.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b.dataset.g);});}
const uniq=a=>[...new Set(a.filter(Boolean))];

/* 01 map */

 let h=head('map','Industry Map',M.title.replace(' 리서치 데스크','')+' 산업 지도',m.lede);

(function(){const I=D.indicators;

/* 06 market */
(function(){const K=D.market;
 const fmt=v=>{const a=Math.abs(v);return (a>=1000?v.toLocaleString('ko-KR',{maximumFractionDigits:0}):a>=100?v.toFixed(0):a>=10?(+v.toFixed(1)).toString():(+v.toFixed(2)).toString());};
 const bars=b=>{const vs=b.items.map(i=>+i.v);const mx=Math.max(...vs,0),mn=Math.min(...vs,0);const span=(mx-mn)||1;const z=(-mn)/span*100;
  return `<div class="chart"><h4>${esc(b.title)}</h4><div class="u">단위 ${esc(b.unit)} · 빗금 = 추정</div><div class="bars">${b.items.map(i=>{const v=+i.v;const w=Math.abs(v)/span*100;const left=v>=0?z:z-w;return `<div class="bar"><span class="bl">${esc(i.l)}</span><span class="bt">${mn<0?`<span class="zero" style="left:${z}%"></span>`:''}<span class="bf${v<0?' neg':''}${i.tag==='추정'?' est':''}" style="left:${left}%;width:${Math.max(w,.6)}%"></span></span><span class="bv">${fmt(v)}</span></div>`;}).join('')}</div>${b.note?`<div class="cn">${md(b.note)}</div>`:''}</div>`;};
 $('#p-mkt').innerHTML=head('mkt','Market & Supply-Demand','시장·수급',K.lede)+`<div class="sec"><h3>차트</h3><div class="grid g2" style="margin-top:16px">${K.bars.map(bars).join('')}</div></div><div class="sec"><h3>비교표</h3>${K.tables.map(t=>`<div class="tcap">${esc(t.title)}</div>${table(t.cols,t.rows)}${t.note?`<div class="tnote">${md(t.note)}</div>`:''}`).join('')}</div>`;})();

(function(){const C=D.cycle;
 $('#p-cyc').innerHTML=head('cyc','Cycle & Narrative','사이클·내러티브',C.lede)+`<div class="sec"><h3>지금 어디에 있나</h3><div class="callout" style="margin-top:14px">${md(C.now)}</div></div>
 <div class="sec"><h3>업황 인식의 변화</h3><p class="note">리포트 발행 시점별로 시장 인식이 어떻게 움직였는지 날짜순으로 정리했다. 점 색은 당시 업황 톤이다.</p><div class="tl">${C.timeline.map(t=>`<div class="tli ${t.tone==='긍정'?'pos':t.tone==='부정'?'neg':''}"><div class="d">${esc(t.date)}</div><h4>${esc(t.title)} ${tone(t.tone)}</h4><p>${md(t.body)}</p></div>`).join('')}</div></div>

(function(){const P=D.policy.slice().sort((a,b)=>String(b.when).localeCompare(String(a.when)));

 const draw=g=>{const L=P.filter(x=>!g||x.region===g);$('#pol-t').innerHTML=`<div class="tw"><table><thead><tr><th>시점</th><th>지역</th><th>정책·이벤트</th><th>내용</th><th>산업 경로</th><th>상태</th></tr></thead><tbody>${L.map(x=>`<tr><td class="tk">${esc(x.when)}</td><td><span class="pill">${esc(x.region)}</span></td><td class="nm" style="white-space:normal;min-width:140px">${esc(x.name)}</td><td>${md(x.what)}</td><td>${md(x.impact)}</td><td>${st(x.status)}</td></tr>`).join('')}</tbody></table></div>`;};
