<title>정유·화학 리서치 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --ground:#FBFAF7; --surface:#FFFFFF; --raised:#F3F4F0; --sunken:#EFF1EC;
  --line:#E0E4DC; --line-strong:#C9D0C6;
  --ink:#17211F; --ink-2:#3A4744; --ink-3:#55625D; --ink-4:#626F6A;
  --accent:#2F5D8A; --accent-soft:color-mix(in srgb,var(--accent) 10%,transparent); --accent-line:color-mix(in srgb,var(--accent) 34%,transparent);
  --ok:#1D7A5C; --warn:#8A6300; --alert:#A2304A; --dim:#55625D;
  --shadow:0 1px 2px rgba(23,33,31,.06),0 8px 24px -12px rgba(23,33,31,.18);
  --rail:252px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0C1116; --surface:#131A21; --raised:#1A232B; --sunken:#0F161C;
    --line:#253039; --line-strong:#33424E;
    --ink:#DCE5EA; --ink-2:#BCCAD2; --ink-3:#9DAEB9; --ink-4:#8DA0AB;
    --accent:#77A7D8; --ok:#3DB08E; --warn:#D2A63A; --alert:#D9738A; --dim:#9DAEB9;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0C1116; --surface:#131A21; --raised:#1A232B; --sunken:#0F161C;
  --line:#253039; --line-strong:#33424E;
  --ink:#DCE5EA; --ink-2:#BCCAD2; --ink-3:#9DAEB9; --ink-4:#8DA0AB;
  --accent:#77A7D8; --ok:#3DB08E; --warn:#D2A63A; --alert:#D9738A; --dim:#9DAEB9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;line-height:1.3;letter-spacing:-.011em}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
b{font-weight:600;color:var(--ink)}

.shell{display:flex;min-height:100vh;align-items:flex-start}
.rail{width:var(--rail);flex:0 0 var(--rail);position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brand .mark{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--accent);font-weight:500;display:flex;align-items:center;gap:7px;line-height:1.4}
.brand .mark::before{content:"";width:7px;height:7px;background:var(--accent);border-radius:50%;flex:none}
.brand h1{font-size:18px;margin-top:9px;letter-spacing:-.02em;font-weight:700}
.brand .sub{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.5}
.nav{flex:1;overflow-y:auto;padding:10px 10px 20px}
.nav-group{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.15em;color:var(--ink-4);padding:14px 10px 6px;text-transform:uppercase}
.nav button{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-family:inherit;font-size:13.5px;line-height:1.4}
.nav button:hover{background:var(--raised);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button .k{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);flex:none;width:16px}
.nav button[aria-current="true"] .k{color:var(--accent)}
.desks{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px}
.desks .dl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-4);width:100%;padding:2px 4px 4px}
.desks a{font-size:12px;text-decoration:none;color:var(--ink-3);border:1px solid var(--line);border-radius:14px;padding:3px 9px;white-space:nowrap}
.desks a:hover{color:var(--accent);border-color:var(--accent-line)}
.desks a.cur{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);pointer-events:none}
.railfoot{padding:12px 16px;border-top:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}

.main{flex:1;min-width:0;padding:0 0 96px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:11px 40px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.legend .li{display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.legend .sw{width:9px;height:9px;border-radius:2px;flex:none}
.stamps{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.stamp{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);white-space:nowrap}
.tsw{display:inline-flex;gap:2px;padding:2px;background:var(--sunken);border:1px solid var(--line);border-radius:7px}
.tsb{padding:4px 9px;border:0;border-radius:5px;background:transparent;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:11px;cursor:pointer}
.tsb[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.pane{display:none;padding:34px 40px 0;max-width:1220px}
.pane.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pane.on{animation:none}}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;font-weight:500}
.pane > h2{font-size:29px;margin-top:8px;letter-spacing:-.025em;font-weight:700}
.lede{color:var(--ink-2);font-size:15.5px;max-width:74ch;margin-top:11px;line-height:1.72}
.sec{margin-top:44px}
.sec > h3{font-size:17.5px;display:flex;align-items:center;gap:11px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.sec > h3::before{content:"";width:3px;height:15px;background:var(--accent);border-radius:2px;flex:none}
.note{color:var(--ink-2);font-size:14px;line-height:1.72;margin-top:12px;max-width:78ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.card h4{font-size:14.5px;margin-bottom:8px}
.card p{font-size:13.5px;color:var(--ink-2);line-height:1.68}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kg{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.kg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kg{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px;display:flex;flex-direction:column;gap:5px}
.kpi .lab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.kpi .val{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;color:var(--accent)}
.kpi .cap{font-size:11.5px;color:var(--ink-3);line-height:1.5}

.tag{display:inline-flex;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 7px;border-radius:4px;border:1px solid;white-space:nowrap;vertical-align:middle}
.t-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 34%,transparent);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.t-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 34%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.t-alert{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 34%,transparent);background:color-mix(in srgb,var(--alert) 10%,transparent)}
.t-dim{color:var(--ink-3);border-color:var(--line-strong);background:var(--raised)}
.t-acc{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-2);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--raised);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.62}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--raised)}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
td.tk{font-family:"IBM Plex Mono",monospace;color:var(--ink-3);font-size:12.5px;white-space:nowrap}
td.nm{font-weight:600;white-space:nowrap}
.tcap{font-size:13.5px;font-weight:600;margin:22px 0 8px}
.tnote{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);margin-top:8px;line-height:1.6}

.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:14px 17px;border-radius:0 8px 8px 0;font-size:14.5px;color:var(--ink-2);line-height:1.76;max-width:88ch}

.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 6px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink-3);border-radius:20px;padding:5px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ground);font-weight:500}
.search{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 13px;font-family:inherit;font-size:14px}
.search:focus{border-color:var(--accent);outline:none}
select.search{max-width:200px}
.count{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}

/* chain */
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 2px 10px;margin-top:16px}
.fnode{flex:0 0 150px;background:var(--sunken);border:1px solid var(--line-strong);border-radius:9px;padding:10px 12px;font-size:13px}
.fnode .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--accent)}
.fnode .t{font-weight:600;line-height:1.35;margin-top:2px}
.farr{flex:0 0 22px;display:grid;place-items:center;color:var(--ink-4);font-size:14px}
.vc{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:14px}
.vcx{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px;border-top:2px solid var(--accent)}
.vcx .r{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--accent);margin-bottom:5px}
.vcx h4{font-size:14px;margin-bottom:5px}
.vcx p{font-size:13.2px;color:var(--ink-2);line-height:1.66}
.vcx .co{font-size:12px;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.6}

/* modules */
.mods{display:grid;gap:10px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mod > summary{padding:14px 18px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mod > summary::-webkit-details-marker{display:none}
.mod > summary::after{content:"+";margin-left:auto;font-family:"IBM Plex Mono",monospace;color:var(--ink-4);font-size:16px}
.mod[open] > summary::after{content:"−"}
.mod > summary:hover{background:var(--raised)}
.mname{font-size:15px;font-weight:600}
.men{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-4)}
.mod .body{padding:4px 18px 18px;border-top:1px solid var(--line)}
.mod dl{margin:0}
.mod dt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4);margin:14px 0 4px}
.mod dd{margin:0;font-size:14.3px;color:var(--ink-2);line-height:1.74;max-width:86ch}
.pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 7px;border-radius:3px;background:var(--raised);border:1px solid var(--line);color:var(--ink-3)}
.dplede{font-size:15.5px;color:var(--ink);line-height:1.78;margin:16px 0 4px;padding:2px 0 2px 14px;border-left:3px solid var(--accent);max-width:84ch;font-weight:450}
.dpn p{margin-top:12px;font-size:14.5px;color:var(--ink-2);line-height:1.84;max-width:82ch}
.dpul{margin:10px 0 0;padding-left:18px}
.dpul li{font-size:14px;color:var(--ink-2);line-height:1.74;margin-bottom:8px;max-width:84ch}
.dpkr{margin-top:18px;padding:13px 16px;background:var(--sunken);border:1px solid var(--line);border-radius:9px;font-size:14px;color:var(--ink-2);line-height:1.72}
.dpkr .l{color:var(--accent);font-weight:600;margin-right:6px}
.formula{font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;padding:10px 13px;margin-top:10px;color:var(--ink);line-height:1.6;white-space:pre-wrap}

/* bars */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.chart h4{font-size:14.5px}
.chart .u{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.bar{display:grid;grid-template-columns:minmax(90px,34%) 1fr 72px;gap:10px;align-items:center}
.bar .bl{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.bar .bt{position:relative;height:12px;background:var(--sunken);border-radius:3px;border:1px solid var(--line)}
.bar .bf{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:2px}
.bar .bf.neg{background:var(--alert)}
.bar .bf.est{background:repeating-linear-gradient(135deg,var(--accent) 0 4px,color-mix(in srgb,var(--accent) 55%,transparent) 4px 7px)}
.bar .bf.neg.est{background:repeating-linear-gradient(135deg,var(--alert) 0 4px,color-mix(in srgb,var(--alert) 55%,transparent) 4px 7px)}
.bar .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink-4)}
.bar .bv{font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.chart .cn{font-size:12px;color:var(--ink-3);margin-top:12px;line-height:1.6;padding-top:10px;border-top:1px solid var(--line)}

/* timeline */
.tl{margin-top:18px;border-left:1px solid var(--line-strong);margin-left:6px}
.tli{position:relative;padding:0 0 20px 22px}
.tli::before{content:"";position:absolute;left:-5px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--dim)}
.tli.pos::before{border-color:var(--ok)} .tli.neg::before{border-color:var(--alert)}
.tli .d{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.tli h4{font-size:14.5px;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tli p{font-size:13.8px;color:var(--ink-2);margin-top:4px;line-height:1.7;max-width:84ch}
.bb{list-style:none;margin:10px 0 0;padding:0}
.bb li{font-size:13.8px;color:var(--ink-2);line-height:1.66;padding:8px 0;border-bottom:1px dashed var(--line)}
.bb li:last-child{border-bottom:0}

.ck li{list-style:none;display:flex;gap:9px;align-items:flex-start;font-size:13.8px;color:var(--ink-2);line-height:1.62;padding:6px 0}
.ck{margin:6px 0 0;padding:0}
.ck input{margin-top:4px;accent-color:var(--accent);flex:none}
.more{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-family:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
.more:hover{border-color:var(--accent);color:var(--accent)}
.evt{display:grid;grid-template-columns:104px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.evt .d{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.evt .n{font-size:14px;font-weight:600}
.evt .m{font-size:13px;color:var(--ink-3);margin-top:2px;line-height:1.55}
.evt.past .d{color:var(--ink-4)}
.cloud{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

@media (max-width:900px){
  .desks{display:none}
  .shell{flex-direction:column}
  .rail{position:static;width:100%;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{display:flex;overflow-x:auto;padding:8px;gap:4px}
  .nav-group{display:none}
  .nav button{width:auto;white-space:nowrap}
  .nav button .k{display:none}
  .desks{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px}
.desks .dl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-4);width:100%;padding:2px 4px 4px}
.desks a{font-size:12px;text-decoration:none;color:var(--ink-3);border:1px solid var(--line);border-radius:14px;padding:3px 9px;white-space:nowrap}
.desks a:hover{color:var(--accent);border-color:var(--accent-line)}
.desks a.cur{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);pointer-events:none}
.railfoot{display:none}
  .topbar{padding:10px 16px}
  .pane{padding:24px 16px 0}
  .pane > h2{font-size:24px}
  .bar{grid-template-columns:1fr 60px}
  .bar .bl{grid-column:1/-1}
  .evt{grid-template-columns:1fr;gap:2px}
}
</style>

<div class="shell">
<aside class="rail">
  <div class="brand">
    <div class="mark" id="b-eng"></div>
    <h1 id="b-title"></h1>
    <div class="sub" id="b-sub"></div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="desks" id="desks"></div>
  <div class="railfoot" id="foot"></div>
</aside>
<main class="main">
  <div class="topbar">
    <div class="legend">
      <span class="li"><span class="sw" style="background:var(--ok)"></span>확인 (실적·실측)</span>
      <span class="li"><span class="sw" style="background:var(--warn)"></span>추정 (전망)</span>
      <span class="li"><span class="sw" style="background:var(--alert)"></span>미확인 (원문 불일치)</span>
    </div>
    <div class="stamps">
      <span class="stamp" id="cut"></span>
      <div class="tsw" role="group" aria-label="화면 테마">
        <button class="tsb" data-t="dark" aria-pressed="false">다크</button>
        <button class="tsb" data-t="light" aria-pressed="false">라이트</button>
      </div>
    </div>
  </div>
  <div id="panes"></div>

rgin": "고객 인증 락인, 비석유계 원료, 글로벌 과점에서 오는 판가 전가력", "kr": "국도화학, KCC, 롯데정밀화학, 유니드, SK케미칼, 이수스페셜티케미컬, OCI"}, {"no": "10", "name": "전방 산업", "role": "운송·항공·물류 연료, 타이어, 포장재, 섬유, 가전·자동차·건자재, 의료용 장갑", "margin": "소비자가 전가력, 정부 가격 개입(최고가격제), 재고 사이클", "kr": "한국타이어앤테크놀로지, 율촌화학, 농심, 국내 항공·물류사"}], "segments": [{"name": "원유·가스(업스트림)", "desc": "원유·가스를 생산하거나 조달·트레이딩하는 영역. 국내에는 순수 대형 E&P가 없고 정유·상사·가스공사가 해외 광구 지분과 LNG 직도입으로 참여한다. 이 데스크에서는 유가·OSP·가스가격이 하류 전체의 원가를 정하는 '입구 변수'로 다룬다.", "driver": "OPEC+ 증산·감산, 미국 셰일 생산단가와 리그 수, 호르무즈 통항, 사우디 OSP, JKM·Henry Hub", "cycle": "지정학 충격에 가장 먼저·크게 반응하고 가장 먼저 되돌려진다. 이번 사이클에서 원유는 우회로·증산으로 6개월 안에 전쟁 전 가격대로 복귀했다가 9월 재차 급등했다.", "kr": "SK이노베이션(E&P·LNG), 포스코인터내셔널, 한국가스공사, SK가스, E1"}, {"name": "정유", "desc": "원유를 연료·납사·윤활기유로 바꾸는 장치산업. 한국은 세계 5위 정제능력(4사 합산 CDU 약 311만b/d)에 생산의 약 60%를 수출하는 제품 시장의 스윙 프로듀서다. 이익은 복합정제마진, 래깅·OSP 효과, 재고평가손익으로 나눠 봐야 한다.", "driver": "글로벌 정제설비 순증설 vs 수요 증가, 중간유분 재고, 중국 수출쿼터·감유증화, 러시아·중동 설비 피격, OSP", "cycle": "증설 사이클과 폐쇄 사이클이 13~35개월 주기로 교대. 2025년 하반기 순증설 둔화로 업사이클에 진입했고 전쟁으로 초호황(4월 87달러)으로 증폭, 2H26에도 30달러 안팎이 유지됐다.", "kr": "S-Oil, SK이노베이션, GS(GS칼텍스), HD현대(HD현대오일뱅크)"}, {"name": "범용 석유화학(NCC·PE·PP 등)", "desc": "납사 크래커(NCC)에서 에틸렌·프로필렌을 만들고 PE·PP·PVC·MEG 등 범용 수지로 가공하는 영역. 2021년 3월 고점 이후 5년 넘게 다운사이클이며 원인은 수요가 아니라 중국 중심의 공급 과잉이다. 한국은 납사 비중 85%로 에탄(북미 87%)·석탄(중국) 대비 원가 곡선 우측에 있다.", "driver": "에틸렌-납사 스프레드(BEP 220~300달러/톤), 글로벌 에틸렌 가동률, 중국 증설·자급률, 납사/에탄 배수, 구조조정 폐쇄량", "cycle": "고점이 흐려지고 저점이 길어지는 '긴 바닥'형으로 변형. 과거 업사이클은 유가가 30~40달러 바닥에서 반등할 때 왔다. 전쟁 중 1Q26 흑자는 래깅 효과였고 3Q26 래깅 스프레드는 평균의 절반.", "kr": "LG화학, 롯데케미칼, 대한유화, 한화솔루션, 여천NCC(비상장), HD현대케미칼(비상장), SK지오센트릭(비상장)"}, {"name": "방향족·합섬(PX·PTA)", "desc": "BTX, 특히 PX→PTA→폴리에스터 체인. 글로벌 PX의 60~70%를 정유사가 생산해 정유와 화학의 경계에 있다. 한국은 PX 약 1,000만톤 능력으로 절반을 수출하며 그중 80%가 중국향이다.", "driver": "PX-납사 마진, 휘발유 마진(개질유 경합), 중국 PTA 증설과 가동률, 중국 PX 증설", "cycle": "2024년 이후 PX 증설이 일단락되어 올레핀보다 가동률 회복이 빠르다는 평가. 다만 중국 PTA 가동률이 전쟁 후 60% 초반으로 떨어지며 폴리에스터 수요 변수가 커졌다.", "kr": "SK이노베이션, S-Oil, GS칼텍스, 한화토탈에너지스, HD현대케미칼, 롯데케미칼"}, {"name": "합성고무·타이어코드", "desc": "C4에서 추출한 부타디엔(BD)으로 SBR·BR·NB라텍스를 만들고, PET·나일론·아라미드로 타이어 보강재를 만드는 영역. 합성고무는 2016년 이후 설비가 줄어든 드문 제품이고 중국 석탄·에탄 대체 루트가 없어 NCC 감산이 오히려 호재가 된다.", "driver": "BD 가격·공급, 천연고무 가격(EUDR), 니트릴 장갑 가동률·미국 관세, SUV·EV 믹스와 RE 타이어 교체 주기", "cycle": "NB라텍스는 2021~24년 증설 부담 후 2025년 바닥, 2026년 장갑 재고 소진과 관세(100%)로 급반등했다. 다만 BD 가격 급락 시 역래깅 부담이 따라온다.", "kr": "금호석유화학, LG화학, HS효성첨단소재, 코오롱인더스트리, 태광산업"}, {"name": "스페셜티·정밀화학", "desc": "원료가 석유가 아니거나(실리콘·셀룰로스·칼륨), 과점·인증 장벽이 있는 제품(에폭시·MDI·Copolyester·TDM·전지소재)을 다루는 영역. 중국 과잉이 '연료→범용→스페셜티'로 번지는 Spillover 위험과 탈중국 공급망 프리미엄이 동시에 작동한다.", "driver": "증설 사이클 종료 여부, 원료 대체 루트(중국 석탄화학), 고객 인증, 탈중국 규제(OBBBA·FEOC), 전방(반도체·배터리·건설)", "cycle": "제품별로 사이클이 제각각이라 업종이 아닌 체인 단위로 본다. 2026년에는 MDI(Sadara 중단)·에폭시·스판덱스가 개선, PVC·가성소다는 중국 석탄계 수출로 부담.", "kr": "국도화학, KCC, 롯데정밀화학, 유니드, SK케미칼, 효성티앤씨, 이수스페셜티케미컬, OCI, 율촌화학"}], "howto": [{"title": "처음 배울 때 순서", "body": "01 산업 지도에서 원유→정유→크래커→다운스트림 흐름과 하위섹터를 익힌 뒤, 03 수익 구조에서 정제마진·NCC 스프레드·래깅 효과의 공식을 먼저 손에 익힌다. 이어 04 핵심 지표에서 복합정제마진·OSP·에틸렌 스프레드·가동률을 '어디서 보고 어떻게 읽는지' 확인하고, 07 사이클 탭의 타임라인으로 2025년 가을 '정유 강세·화학 겨울'이 2026년 호르무즈 봉쇄로 어떻게 뒤집혔는지 따라가면 전체 그림이 잡힌다. 모르는 약어는 13 용어 사전에서 찾는다."}, {"title": "딜 검토할 때", "body": "대상 회사가 밸류체인 어디(03 원가 곡선상 위치)에 있는지부터 정한다 — 전환 설비를 가졌는지, 원료를 어디서 사는지(중동 납사·원유 의존도), 판가를 전가할 수 있는지, 충격 뒤에도 살아남는지가 이번 사이클의 네 가지 구분 기준이었다. 이후 05 딥다이브의 관련 주제, 09 밸류에이션의 사이클 멀티플 밴드, 10 체크포인트의 질문 목록을 실사 질의서로 옮겨 쓰고, 11 유니버스에서 국내 비교기업을 고른다."}, {"title": "숫자를 인용하기 전에", "body": "분기 이익은 반드시 재고평가손익·래깅 효과를 분리한 뒤 인용한다(1Q26 정유 2사 이익 2.8조원 중 1.4조원이 재고평가이익). 정제마진은 스팟인지 OSP 반영 1개월 래깅인지, 싱가포르 복합인지 국내 복합인지 지표 정의를 확인해야 한다(같은 4월에 87달러·39달러가 동시에 인용된다). 전망치는 발행 시점이 전쟁 전(2025.11)인지 후(2026.05 이후)인지에 따라 부호까지 바뀌므로 asof를 함께 적는다."}, {"title": "이 자료의 한계", "body": "근거는 2025-09-30부터 2026-09-16까지 발행된 국내 증권사 정유·화학 리포트 28건과 그 인용 원출처다. 리포트는 발행 시점의 시장 컨센서스와 커버리지 종목 중심의 시각을 반영하며, 전쟁 이후 수치는 주 단위로 급변해 같은 지표도 리포트마다 다르다(불일치는 '미확인'으로 표기). 원문 데이터를 독립적으로 재검증하지 않았고 개별 종목에 대한 가격 목표나 매매 의견은 의도적으로 제외했다. 2026년 9월 말 이후 호르무즈·후티 상황은 반영되지 않았다."}]}, "products": [{"group": "원유·연료제품", "name": "원유(벤치마크·성상)", "en": "Crude Oil (Dubai/WTI/Brent)", "what": "정유의 원료이자 석유화학 원가의 출발점. 가격은 Dubai(아시아·중동 고유황), WTI(미국 경질), Brent(대서양) 세 벤치마크로 매겨지고, 성상은 API 비중(가벼움)과 황 함량으로 나뉜다. 아시아 정유설비는 API 28~33도, 황 1.5~2.5%의 중동 Medium-Sour에 맞춰 설계돼 있다.", "chain": "유전 → 수출터미널(호르무즈·얀부·푸자이라) → VLCC → 정유소 CDU", "driver": "OPEC+ 증산·감산, 미국 셰일 생산(신규정 단가 약 64~65달러), 호르무즈 통항, 재고(OECD 재고 1억 배럴 감소당 약 15달러 상승 경험칙)", "check": "대상 정유사의 원유 도입선별 비중(중동·미국·기타), 장기계약 커버율, 설계원유 대비 실제 투입 성상 차이를 확인한다. 이번 전쟁에서 한국 정유사 중동 비중은 약 69~70%에서 49~52%로 떨어졌다.", "kr": "S-Oil, SK이노베이션, GS칼텍스, HD현대오일뱅크"}, {"group": "원유·연료제품", "name": "중간유분(경유·등유·항공유)", "en": "Middle Distillates (Diesel/Kero/Jet)", "what": "끓는점이 중간대인 유분으로 물류·산업·항공·난방 연료다. 중질유에서 수율이 높고 재고 버퍼가 얇아 공급 차질 시 가격이 가장 먼저 튄다. 국내 정유사는 등경유 합산 수율이 50%를 넘어 이 제품군의 마진이 이익을 좌우한다.", "chain": "원유 → CDU(경유 28.5~31%, 등유·항공유 8.5~10%) → 수첨탈황·수첨분해 → 경유/항공유", "driver": "유럽의 대러 제재(경유 수입의 중동 비중 약 44~45%), 중동·러시아 설비 피격, 미국·유럽 재고, 8월 하순~11월 계절성", "check": "제품별 크랙(경유-Dubai, 항공유-Dubai)과 수출 채널(호주·미국 서부 항공유 계약)을 확인한다. 2026년 8월 싱가포르 경유 마진 71.3달러, 미국 걸프 디젤 마진은 사상 처음 100달러를 넘었다.", "kr": "S-Oil, SK이노베이션(SK에너지), GS칼텍스, HD현대오일뱅크"}, {"group": "원유·연료제품", "name": "휘발유", "en": "Gasoline", "what": "수송용 경질유분. 중국 전기차 침투율이 45~49%를 넘으며 중국 휘발유 수요가 역성장하기 시작했고, 경질유(미국산) 투입이 늘면 휘발유 수율이 오른다. 이번 사이클에서 휘발유는 경유보다 마진 강세가 약했다.", "chain": "원유 → CDU(24~26.5%) → 개질(리포머)·RFCC → 블렌딩 → 휘발유", "driver": "중국 수출쿼터(7월 완화 시 휘발유 중심 수출 경쟁), 미국 재고·드라이빙 시즌, EPA 여름철 규제 완화", "check": "경질유 대체 투입으로 휘발유 생산 비중이 늘어난 정유사는 중간유분 강세 수혜가 제한된다. 휘발유 대비 경유 마진 격차(2Q26E 23.3 vs 55.1달러)를 같이 본다.", "kr": "정유 4사"}, {"group": "원유·연료제품", "name": "납사(나프타)", "en": "Naphtha", "what": "원유 정제로 나오는 경질유분으로 NCC의 주원료이자 휘발유 블렌딩 원료다. 국내 NCC는 납사의 절반을 국내 정유사에서, 절반을 수입하며 수입분의 약 50%가 중동산이다(전체의 약 25%). 아시아 납사 수입의 중동 의존도는 약 80%다.", "chain": "원유·컨덴세이트 → 정유 CDU(10~12%) → 납사 → NCC", "driver": "중동 수출(해상 납사 물동량의 약 37%가 호르무즈 통과), 아시아 NCC 가동률, 휘발유와의 경합", "check": "대상 화학사의 납사 조달처별 비중과 대체 조달 단가, 저장 일수(아시아 NCC 평균 2~3주)를 본다. 아시아 납사는 2월 617.5 → 4월 1,062.8 → 8월 789.8달러/톤으로 움직였다.", "kr": "정유 4사(공급), LG화학·롯데케미칼·대한유화·여천NCC(수요)"}, {"group": "원유·연료제품", "name": "LPG(프로판·부탄)", "en": "Liquefied Petroleum Gas", "what": "가정·수송 연료이자 PDH와 혼합원료 크래커의 원료. 아시아 기준가는 사우디 CP다. 전쟁 국면에서 여러 나라가 LPG를 석화 원료보다 민생용에 우선 배분하는 '정책재화'로 바뀌었다.", "chain": "가스전·정유 → LPG → 가정·수송 / PDH(프로필렌) / MFC", "driver": "사우디 CP, LNG 대비 상대가격, 정부 배분 정책", "check": "PDH·MFC 원가 구조가 배분 정책으로 바뀔 수 있는지, LPG/LNG 겸용 발전 설비의 연료 선택권(옵셔널리티)을 확인한다.", "kr": "SK가스, E1, GS칼텍스(MFC)"}, {"group": "원유·연료제품", "name": "LNG", "en": "Liquefied Natural Gas", "what": "천연가스를 영하 162도로 액화해 선박으로 옮기는 연료. 카타르가 세계 수출의 약 20%이며 Ras Laffan 피해로 수출능력의 약 17%(연 약 1,280~1,300만톤)가 훼손돼 복구에 최대 5년이 걸린다. NGL(에탄·프로판) 공급 감소로 화학 원료 원가에도 번졌다.", "chain": "가스전 → 액화 → LNG선 → 재기화 → 발전·도시가스(→ SMP)", "driver": "JKM·TTF·Henry Hub 괴리, 장기계약 불가항력, 미국 LNG 수출(3월 사상 최대 1,170만톤)", "check": "장기계약의 불가항력·목적지 유연성 조항, 현물 의존도. 장기계약은 가격만 보호하고 물량은 보호하지 못할 수 있다.", "kr": "한국가스공사, SK이노베이션(SK E&S), 포스코인터내셔널, SK가스"}, {"group": "원유·연료제품", "name": "그룹III 윤활기유", "en": "Group III Base Oil", "what": "점도지수 120 이상의 고급 윤활기유로 고급 엔진오일 원료다. 글로벌 수요 약 600만톤을 SK엔무브(150만톤)·S-Oil·Shell Pearl GTL(각 약 120만톤) 3사가 약 65% 점유하는 과점이라 한 공장만 멈춰도 가격이 급등한다.", "chain": "원유 → 진공증류(VGO)·수첨 미전환유 → 수첨분해·이성화 → 그룹III 기유 → 엔진오일", "driver": "Pearl GTL #2 라인 복구(2027년 1~2분기 예상), VGO를 연료와 나눠 쓰는 기회비용, 고객 인증", "check": "기유 매출 비중과 계약가 조정 주기. 국내 기유 수출가는 2월 864 → 6월 1,865달러/톤으로 두 배 넘게 올랐고 2Q26 4사 윤활 이익은 1.71조원이었다.", "kr": "SK이노베이션(SK엔무브), S-Oil, GS칼텍스(그룹II 주력)"}, {"group": "원유·연료제품", "name": "황·황산", "en": "Sulfur / Sulfuric Acid", "what": "황은 원유 정제·가스 정화의 순수 부산물이라 정유·가스가 돌아야만 나온다. 중동이 세계 해상 황 교역의 47%를 차지해 봉쇄는 황 공급 절반의 차단과 같았다. 황산은 구리 SX-EW·니켈 HPAL·인산비료·반도체 세정에 들어간다.", "chain": "원유·가스 → 탈황 → 황 → 황산 → 습식제련·비료", "driver": "정제 가동, 중국 황산 수출 금지(2026-04-10), 제련 부산물 황산 공급", "check": "원가 1%짜리 부자재가 생산 100%를 멈출 수 있는지(규격 고정·저재고·인증·단일조달) 점검한다. 쿠웨이트 황 7월 950달러/톤, 미국 걸프 황산 155 → 400달러.", "kr": "고려아연(제련 부산물 황산), 정유 4사(황 생산)"}, {"group": "정유·크래커 설비", "name": "상압증류탑(CDU)", "en": "Crude Distillation Unit", "what": "원유를 끓는점 차이로 LPG·납사·휘발유·등경유·잔사유로 나누는 1차 정제 설비로 정제능력의 기준 단위다. 설계 원유 성상에 최적화돼 있어 다른 원유를 넣으면 처리량이 줄어든다(예: 아시아 50만b/d 설비에 미국 경질유만 넣으면 16만b/d).", "chain": "원유 투입 → CDU → 2차 고도화 설비(RFCC·HCR·코커·탈황)", "driver": "글로벌 순증설·폐쇄, 가동률(평시 약 90%), 설계 원유 적합성", "check": "설계 원유 대비 경질유 투입 비중이 높을 때 증기 과부하·탑 압력 상승·잔사유 부족 등 공학적 병목이 생긴다. 한국 평균 가동률은 3월 86.8% → 5~6월 66.3%로 떨어졌다.", "kr": "SK이노베이션(울산 84만+인천 27.5만b/d), GS칼텍스(80만), S-Oil(67.7만), HD현대오일뱅크(52만)"}, {"group": "정유·크래커 설비", "name": "고도화 설비(RFCC·수첨분해·코커)", "en": "Upgrading Units (RFCC/HCR/Coker)", "what": "상압잔사유 같은 무거운 유분을 촉매·수소·열로 분해해 휘발유·경유·항공유 등 경질 제품으로 바꾸는 2차 설비. CDU 대비 이 능력의 비율이 고도화율이며 높을수록 싼 중질·고유황 원유를 넣어 비싼 제품을 뽑을 수 있다.", "chain": "상압·감압 잔사유 → RFCC(휘발유·프로필렌·LCO) / HCR(경유·항공유) / 코커(경질유+코크스)", "driver": "중질유 가용성과 잔사유 양, 경질-중질 원유 가격차(베네수엘라유는 5년 평균 Dubai 대비 약 17달러 할인)", "check": "고도화율 순위(HD현대오일뱅크 > GS칼텍스 > …)와 잔사유 부족 시 고도화 설비 가동률. 경질유 대체 투입은 수조원짜리 고도화 설비를 놀게 만든다.", "kr": "HD현대오일뱅크(고효율 코커), GS칼텍스, S-Oil, SK이노베이션"}, {"group": "정유·크래커 설비", "name": "나프타 분해설비(NCC)", "en": "Naphtha Cracking Center", "what": "납사를 약 800℃ 이상에서 열분해해 에틸렌·프로필렌·C4(부타디엔)·PyGas(BTX)를 동시에 만드는 석유화학 기초 설비. 단순 수율 가정은 에틸렌 29%, 프로필렌 13.5%, C4 8.7%, PyGas 21.2%(다른 리포트는 31/16/10/23%)로 부산물이 많은 것이 특징이다.", "chain": "원유 → 정유(납사) → NCC → 에틸렌·프로필렌·BD·BTX → 다운스트림", "driver": "에틸렌-납사 스프레드, 납사 조달, 가동률과 고정비, 부산물 가격", "check": "외부판매 비중, 부산물(BD·MEG) 스프레드 기여, 손익분기 가동률, 설비 연식(한국 20년 이상 노후 비중 78%).", "kr": "LG화학, 롯데케미칼, 대한유화, 여천NCC, 한화토탈에너지스, SK지오센트릭, HD현대케미칼, GS칼텍스, S-Oil"}, {"group": "정유·크래커 설비", "name": "에탄 분해설비(ECC)", "en": "Ethane Cracking Center", "what": "셰일가스의 부산물인 에탄을 분해해 거의 에틸렌만 만드는 설비. 북미 크래커는 원료의 84~87%가 에탄이고, 중국도 미국산 에탄을 수입해 ECC 비중을 약 10~15%로 늘리고 있다. 전쟁 후 에탄 기반 에틸렌 원가는 톤당 400~500달러, 납사 기반은 1,000달러를 넘는 구간도 있었다.", "chain": "셰일가스 → 에탄 분리 → (VLEC 해상운송) → ECC → 에틸렌 → PE·MEG", "driver": "Henry Hub·에탄 가격, Oil/Gas Ratio(10~15배면 NCC와 비슷, 2023~24년 31~35배), 에탄 운반선·터미널", "check": "경쟁사의 ECC·복합피드 전환 일정(Wanhua·Satellite·SP Chemicals 등)과 부산물이 거의 없어 유도체 포트폴리오를 재설계해야 한다는 점.", "kr": "롯데케미칼(LC USA ECC, 약 3조원 투자). 국내 직접 설비는 없음"}, {"group": "정유·크래커 설비", "name": "석탄·메탄올 올레핀(CTO/MTO)", "en": "Coal/Methanol to Olefins", "what": "석탄을 가스화해 메탄올을 거쳐 에틸렌·프로필렌을 만드는 중국 특화 공정. 중국 CTO/MTO 설비는 약 770만톤(중국의 13%). 중국 PVC의 70%, MEG의 40%, PE의 10%가 석탄 기반이라 유가가 오를수록 이 설비가 가동률을 올려 아시아 판가 상단을 누른다.", "chain": "석탄 → 가스화 → 메탄올 → MTO → 에틸렌·프로필렌 (또는 카바이드 → PVC)", "driver": "석탄 가격(전쟁 중 +10%에 그침), 메탄올 수입(MTO는 이란·중동 의존), 중국 구조조정(CTO/MTO 폐쇄 대상)", "check": "대상 제품에 중국 석탄·에탄 대체 루트가 있는지가 판가 전가력을 가른다. 있는 제품(PVC·MEG·PE)은 납사 상승을 전가하지 못했다.", "kr": "해당 없음(중국 설비). 국내 OCI는 제철 부산물 기반 석탄화학(CTC)"}, {"group": "정유·크래커 설비", "name": "프로판 탈수소(PDH)", "en": "Propane Dehydrogenation", "what": "프로판에서 수소를 떼어 프로필렌만 만드는 설비로 프로필렌-프로판 스프레드 단일 베팅 구조다. 중국 PDH는 중동산 LPG 의존이 높아 전쟁 후 가동률이 47%까지 떨어졌다.", "chain": "프로판(LPG) → PDH → 프로필렌 → PP·AN·PO", "driver": "사우디 CP, 프로필렌 가격, LPG 민생 배분 정책", "check": "구조조정 우선순위가 높은 공정(소프트 감산 → 장기 정지 → 비통합 설비 영구 폐쇄 경로).", "kr": "SK가스(PDH), 효성화학, SK어드밴스드(비상장)"}, {"group": "정유·크래커 설비", "name": "혼합원료·중질원료 크래커(MFC·HPC)", "en": "Mixed Feed Cracker / Heavy-feed Petrochemical Complex", "what": "정유사형 올레핀 설비. MFC는 납사 외 LPG·정제가스를 섞어 넣을 수 있는 원료 선택권이 핵심 자산이고, HPC는 잔사유·탈황중질유 할인을 석유화학 원가 우위로 바꾼다. 경쟁 축을 '나프타를 싸게 사는 것'에서 '정유 부산물을 싸게 화학 원료로 바꾸는 것'으로 옮겼다.", "chain": "정유 부생가스·LPG·중질유분 → MFC/HPC → 에틸렌·프로필렌 → 다운스트림", "driver": "에틸렌 스프레드, 원료 믹스 경제성, 정유 가동률", "check": "정유사의 화학 투자(저부가 원료 활용)는 화학사의 에틸렌 증설보다 사이클 분산 효과가 있다는 평가. 투자 대비 ROIC를 확인한다.", "kr": "GS칼텍스(MFC 에틸렌 약 75만톤, 약 2.7조원), HD현대케미칼(HPC 85만톤, 약 3.4조원)"}, {"group": "정유·크래커 설비", "name": "원유-화학 직접 전환(TC2C·COTC)", "en": "Thermal Crude to Chemicals / Crude Oil to Chemicals", "what": "원유와 정유 중질유분을 열분해해 납사·LPG를 만들고 곧바로 스팀크래커에 넣는 공정. 중국은 COTC로 연료를 줄이고 화학을 늘리는 감유증화를 구현하고, 국내에서는 S-Oil 샤힌 프로젝트가 세계 최초 TC2C 상업 설비(FOAK)다.", "chain": "원유(Arab Light 등)+중질유분 → TC2C → 납사·LPG → 스팀크래커(에틸렌 180만톤) → PE·PP", "driver": "에틸렌·PE 스프레드, 원료 내부조달 원가 우위(톤당 40~80달러), 램프업 속도, 감가상각(연 약 3,000억원)", "check": "초기 가동률 가정(2027년 1분기 40%, 연 66%), 에틸렌 외부 판매처, FID 당시 IRR(16.4%, 납사 스프레드 530~550달러 가정) 대비 현재 스프레드.", "kr": "S-Oil(샤힌, 총 약 9.3~10조원)"}, {"group": "올레핀·범용수지", "name": "에틸렌", "en": "Ethylene", "what": "가장 기초적인 올레핀이자 석유화학 공급량의 기준 단위. PE·MEG·PVC·SM으로 이어진다. 에틸렌-납사 스프레드는 NCC 수익성의 대표 지표로 2021년 401달러에서 2022년 235달러로 떨어진 뒤 손익분기(220~300달러) 아래에 머물렀다.", "chain": "납사/에탄/석탄 → 크래커 → 에틸렌 → PE·MEG·PVC·SM", "driver": "글로벌 순증설(2027년 최대 1,335~1,690만톤), 폐쇄(연 250~380만톤), 중국 자급률(109% → 2027E 128%), 가동률", "check": "스팟 스프레드와 1개월 래깅 스프레드를 분리한다. 3Q26 래깅 스프레드 185달러는 과거 평균(369달러)의 절반이다.", "kr": "LG화학, 롯데케미칼, 대한유화, 여천NCC, 한화토탈에너지스, HD현대케미칼, SK지오센트릭, S-Oil"}, {"group": "올레핀·범용수지", "name": "프로필렌", "en": "Propylene", "what": "크래커 부산물 외에 정유 FCC·PDH·OCU·CTO/MTO 등 대체 공급원이 많은 기초유분. 그래서 NCC 감축의 가격 효과가 부타디엔보다 약하게 나타난다(조건부 타이트).", "chain": "납사/프로판/정유 FCC → 프로필렌 → PP·AN·PO·아크릴산", "driver": "정유 마진, 프로판 가격, 중국 PDH·MTO 증설(2022~2026 공급 초과)", "check": "대상 회사 프로필렌의 원천(크래커·RFCC·PDH)과 외부판매 비중.", "kr": "S-Oil, 효성화학, 대한유화, SK어드밴스드, LG화학"}, {"group": "올레핀·범용수지", "name": "폴리에틸렌(PE)", "en": "Polyethylene (HDPE/LDPE/LLDPE)", "what": "포장재·필름·파이프에 쓰이는 최대 범용 수지. 2027년 글로벌 순증설(1,131~1,388만톤)이 수요 증가(373~395만톤)의 약 3배로 예정된 가장 부담 큰 제품이다. 국내 PE는 내수 비중이 40% 안팎이라 에틸렌보다 내수 기준 잉여가 크다.", "chain": "에틸렌 → 중합 → HDPE·LDPE·LLDPE → 필름·포장재·파이프", "driver": "중국 PE 능력 증가율(2025년 20%, 2026E 19%), 중동·미국 ECC 저가 제품, 유럽 수입 확대", "check": "국내 PE 명목가동률(2025-09 65.7%), 에틸렌 감축 시에도 PE 가동률은 69.5~75.8%에 그친다는 점 — 다운스트림 동반 감축 여부.", "kr": "LG화학, 롯데케미칼, 대한유화, 한화솔루션"}, {"group": "올레핀·범용수지", "name": "폴리프로필렌(PP)", "en": "Polypropylene", "what": "프로필렌 기반 범용 수지로 자동차 부품·가전·포장에 쓰인다. 중국 자급률이 100%에 이르러 수출국으로 전환했다.", "chain": "프로필렌 → PP → 자동차·가전·포장", "driver": "중국 PP 증설(2026E 13%), 프로필렌 공급원 다변화", "check": "유럽 한국산 PP 수입 비중(11.0% → 14.8%)처럼 유럽 폐쇄의 반사 수혜가 실제로 나타나는지.", "kr": "롯데케미칼, 대한유화, 효성화학, LG화학"}, {"group": "올레핀·범용수지", "name": "EO/MEG", "en": "Ethylene Oxide / Mono Ethylene Glycol", "what": "에틸렌을 산화해 만드는 EO와 폴리에스터 원료 MEG. 중국 MEG 능력은 2019년 1,100만톤에서 2026년 3,306만톤으로 세 배가 됐고 40%가 석탄 기반이라 범용 MEG는 원료 배정에서 가장 먼저 밀린다. EO 기반 계면활성제 같은 스페셜티 하류가 있으면 방어된다.", "chain": "에틸렌 → EO → MEG(폴리에스터) / 계면활성제·글리콜에테르", "driver": "중국 석탄계 MEG 가동률(4월 수출 5배 이상 급증), 폴리에스터 가동률", "check": "MEG 스프레드(3Q26 144달러)는 NCC 손익분기점을 낮추는 부산물 요인으로도 본다.", "kr": "롯데케미칼, LG화학, 대한유화"}, {"group": "올레핀·범용수지", "name": "PVC·가성소다", "en": "PVC / Caustic Soda", "what": "소금 전기분해(Chlor-Alkali)로 염소와 가성소다가 함께 나오고, 염소는 에틸렌과 결합해 EDC→VCM→PVC가 된다. 염소-가성소다 밸런스가 얽혀 있어 단독 폐쇄보다 산단 단위로 재편된다. 중국 PVC는 석탄 카바이드 기반이 73%(연 2,430만톤)다.", "chain": "소금 → 전해 → 염소+가성소다 / 에틸렌+염소 → EDC → VCM → PVC", "driver": "중국 건설 경기, 중국 PVC 수출 환급(13%) 폐지(2026-04-01) 전 밀어내기, 인도 수요, 전력비", "check": "석탄계 대체 루트가 커 납사 상승 전가가 어려운 대표 제품. 전력비가 원가의 핵심.", "kr": "LG화학, 한화솔루션, 롯데정밀화학"}, {"group": "올레핀·범용수지", "name": "SM·ABS·PS", "en": "Styrene Monomer / ABS / PS", "what": "에틸렌과 벤젠으로 만든 SM에서 PS·ABS가 나온다. ABS는 가전·자동차 외장재로 고객 승인 기반이라 방어 여지가 있고, 범용 PS는 락인이 약해 먼저 줄어든다. 국내 SM 능력은 2019년 고점(334만톤) 대비 28% 이상 줄었다.", "chain": "에틸렌+벤젠 → EB → SM → PS·ABS(+AN·BD) → 컴파운딩", "driver": "중국 이구환신(가전 교체 보조금), 2026년 ABS 순증설(105~144만톤)을 끝으로 대규모 증설 종료", "check": "ABS 수급은 2027년부터 증설 공백으로 개선 전망. 중국 소매판매(가전) 지표로 선행 확인.", "kr": "LG화학, 롯데케미칼, 금호석유화학"}, {"group": "방향족·합섬원료", "name": "BTX(벤젠·톨루엔·자일렌)", "en": "Benzene/Toluene/Xylene", "what": "리포머와 크래커 PyGas에서 나오는 방향족 기초유분. 에틸렌 감축 시 PyGas(200~270만톤)도 줄지만 정유 리포밍이라는 보완 경로가 있어 벤젠은 민감하고 PX는 상대적으로 둔감하다.", "chain": "납사 → 리포머/NCC → BTX → SM(벤젠)·PX(자일렌)·TDI(톨루엔)", "driver": "휘발유 마진(개질유 경합), 중국 증설(벤젠 2025년 14%)", "check": "개질유를 휘발유 블렌딩과 방향족 중 어디로 보낼지의 선택이 PX 공급을 좌우한다.", "kr": "S-Oil, SK이노베이션, GS칼텍스, HD현대케미칼, 한화토탈에너지스"}, {"group": "방향족·합섬원료", "name": "파라자일렌(PX)→PTA→폴리에스터", "en": "Paraxylene / PTA / Polyester", "what": "PX는 PTA를 거쳐 폴리에스터 섬유·PET병·타이어코드의 원료가 된다. 글로벌 PX의 60~70%를 정유사가 생산한다. 중국은 PX 4,300만톤 능력에 수요 4,800만톤으로 약 1,000만톤을 순수입하고, 한국 PX(약 1,000만톤) 수출의 80%가 중국향이다.", "chain": "중질납사 → 개질 → PX → PTA(+MEG) → 폴리에스터 → 섬유·PET·타이어코드", "driver": "PX-납사 마진(2025-12 254달러, 2025년 평균 211달러), 중국 PTA 가동률(전쟁 후 60% 초반), 중국 PX 증설(2026E 15%)", "check": "PX 마진 100달러 개선 시 연간 영업이익 증가: SK이노베이션 약 3,700억원, S-Oil 약 2,400억원(리포트 추정).", "kr": "SK이노베이션(290~330만톤), S-Oil(160~190만톤), GS칼텍스, 한화토탈에너지스, HD현대케미칼"}, {"group": "합성고무·섬유소재", "name": "부타디엔(BD)", "en": "Butadiene", "what": "NCC C4 유분에서만 사실상 나오는 합성고무 원료. 에틸렌은 ECC·CTO, 프로필렌은 PDH로 대체되지만 BD는 대체 생산 경제성이 낮고 끓는점 -4.4℃라 저장도 어렵다. 그래서 NCC 구조조정의 첫 가격 반응이 BD에서 나타난다.", "chain": "납사 → NCC → C4 → BD 추출 → SBR·BR·NB라텍스·ABS", "driver": "NCC 가동률, 한국 에틸렌 감축 연동 C4 감소(80~110만톤), 합성고무 수요", "check": "BD 가격 변동이 매우 크다(2025-12 892 → 2026-04 2,381 → 8월 1,413달러/톤). BD 스프레드(3Q26 513달러)는 NCC 손익분기를 낮춘다.", "kr": "LG화학, 롯데케미칼, 여천NCC(생산), 금호석유화학(수요)"}, {"group": "합성고무·섬유소재", "name": "SBR·BR·SSBR", "en": "Styrene Butadiene Rubber / Butadiene Rubber / Solution SBR", "what": "타이어·신발 밑창용 범용 합성고무와 EV·고성능 타이어용 용액중합 SBR. 2011~15년 증설 후 2016년부터 폐쇄가 이어져 글로벌 SBR 능력이 510만톤에서 437만톤으로 약 14% 줄었고 예정된 증설이 없다.", "chain": "BD(+SM) → 유화·용액중합 → SBR/BR/SSBR → 타이어", "driver": "천연고무 가격(10년 내 최고, EUDR), 타이어 수요, BD 원가", "check": "천연고무와 대체·보완 관계로 가격이 같이 움직인다. 신규 증설 발표가 나오는지가 차별화 논리의 훼손 신호.", "kr": "금호석유화학(SSBR 3.5만톤·EPDM 7만톤 증설), LG화학"}, {"group": "합성고무·섬유소재", "name": "NB라텍스(NBL)", "en": "Nitrile Butadiene Latex", "what": "BD와 아크릴로니트릴(AN)로 만드는 니트릴 장갑 원료. 동남아 장갑 제조국(말레이시아·태국·베트남)은 NB라텍스의 61~80%를 한국에서 수입한다. 마진 공식은 NBL − 0.4×BD − 0.12×AN(1개월 래깅).", "chain": "BD+AN → NB라텍스 → 니트릴 장갑(동남아) → 미국·유럽 의료·산업용", "driver": "미국 중국산 장갑 관세(7.5% → 50% → 100%), 장갑업체 가동률(Top Glove 58% → 89%), BD 가격", "check": "한국 NBL 수출가 3월 870 → 4월 1,580 → 5월 1,633달러/톤. 관세발 마진(700~900달러) 급등이 구조적인지, 중국산 우회 덤핑으로 안정화되는지.", "kr": "금호석유화학(글로벌 1위, 약 94.6만톤·점유율 약 25%)"}, {"group": "합성고무·섬유소재", "name": "EPDM", "en": "Ethylene Propylene Diene Monomer", "what": "에틸렌·프로필렌·디엔 공중합 특수고무로 자동차 실링·전선·방수시트에 쓰인다. EPDM과 PP를 섞으면 열가소성 가황 엘라스토머(TPV)가 된다.", "chain": "에틸렌+프로필렌+디엔 → EPDM → TPV·자동차 부품", "driver": "자동차·건설 수요, 유럽 자급률 하락", "check": "고부가 믹스 개선 효과와 신규 증설분의 가동률.", "kr": "금호석유화학(금호폴리켐)"}, {"group": "합성고무·섬유소재", "name": "스판덱스", "en": "Spandex (Elastane)", "what": "PTMG(비중 약 80%)와 MDI(약 20%)로 만드는 고탄성 폴리우레탄 섬유. 원료 BDO가 중국 석탄 기반이라 유가 충격에 중립적이다. 2021~25년 공급 면 프로필렌 기반 ECH가 반사 수혜를 입는다.", "chain": "벤젠·프로필렌 → 페놀/아세톤 → BPA + ECH(프로필렌/글리세린+염소) → 에폭시 수지", "driver": "2021~24년 증설 이후 공급 부담 완화, 유럽 공급 차질, ECH-프로필렌 스프레드(3Q25 992달러, +46% QoQ)", "check": "유럽 에폭시 공급 차질 대체 효과가 수출 물량·판가로 실제 확인되는지.", "kr": "국도화학, 롯데정밀화학(ECH), 금호석유화학(금호P&B 페놀·BPA), KCC"}, {"group": "스페셜티·정밀화학", "name": "유기실리콘", "en": "Silicone (Siloxane)", "what": "메탈실리콘에서 DMC(실록산)를 거쳐 실리콘 오일·고무·수지·실란트를 만든다. 원료가 석유가 아니어서 석유 수요 변화에 따른 과잉에서 비교적 자유롭다.", "chain": "메탈실리콘+메탄올/염산 → MCS → DMC → 실리콘 오일·고무·수지", "driver": "메탈실리콘 가격(중국 에너지 이중통제), DMC-메탈실리콘 스프레드, 스페셜티 믹스", "check": "Dow·Wacker·Shin-Etsu 등 피어 EBITDA 마진 턴어라운드와 판가 인상 여부. 이란 메탄올 차질이 중국 유기실리콘 공급에 주는 영향.", "kr": "KCC(모멘티브, 실리콘 매출 비중 약 46~47%)"}, {"group": "스페셜티·정밀화학", "name": "셀룰로스 에테르", "en": "Cellulose Ether (HPMC/HEMC)", "what": "펄프를 화학 치환해 만든 건설·의약·식품용 첨가제. 식의약용은 산업용보다 영업이익률이 3배 이상 높고 원가 전가력이 크며 수요 변동성이 낮다.", "chain": "펄프 → 셀룰로스 → 에테르화 → 건축용·식의약용", "driver": "식의약용 비중, 증설(1.2 → 1.8만톤)", "check": "증설분의 가동률과 이익 기여 시점.", "kr": "롯데정밀화학"}, {"group": "스페셜티·정밀화학", "name": "수산화칼륨·탄산칼륨", "en": "Potassium Hydroxide / Potassium Carbonate", "what": "염화칼륨 수용액을 전기분해해 만드는 무기화학 제품으로 비료·식품·배터리·반도체 세정에 쓰인다. 나프타를 쓰지 않고 원가가 전력·염 중심이라 석유계 충격에 거의 노출되지 않는다.", "chain": "염화칼륨(KCl) → 전해 → KOH(+염소·수소) → (+CO2) 탄산칼륨", "driver": "염화칼륨 가격, 전력비, 중국 수요와 업계 재편, 비료 가격", "check": "KOH-KCl 스프레드(수출입 통계). 국내 가성칼륨 3월 초 수출가 894달러/톤(+17.8%).", "kr": "유니드(KOH 글로벌 1위, 점유율 33%, 능력 81 → 90만톤)"}, {"group": "스페셜티·정밀화학", "name": "Copolyester(PETG·PCTG)", "en": "Copolyester", "what": "PET에 CHDM 같은 제3의 글리콜을 공중합한 투명·내화학성 변성 폴리에스터로 화장품 용기·가전·시트에 쓰인다. 글로벌 생산자가 소수(Eastman 등)인 과점 시장이다.", "chain": "PTA+MEG+CHDM → PETG → 화장품 용기·가전·의료", "driver": "고부가 용도 비중(57% → 62%), 미-중 관세에 따른 Eastman 중국 판매 차질, 재활용(CR) 제품 채택", "check": "중국 점유율(3Q25 42%)과 이익률(10% 후반) 유지 여부.", "kr": "SK케미칼"}, {"group": "스페셜티·정밀화학", "name": "전지소재 원료(황화리튬·PCl3/PCl5)", "en": "Li2S / Phosphorus Chlorides", "what": "황화리튬은 황화물계 전고체 배터리 고체전해질의 핵심 원료로 배터리급 생산자가 극소수다. PCl3·PCl5는 전해질염 LiPF6(중국 생산 약 95%)의 원료로 국내는 전량 수입해왔다. 기존 정밀화학 역량의 인접 확장 사례다.", "chain": "황화수소·리튬 → 황화리튬 → 고체전해질 / 황린+염소 → PCl3·PCl5 → LiPF6 → 전해액", "driver": "전고체 상용화(휴머노이드·EV), 고객 인증, 탈중국 규제(OBBBA)", "check": "배치→연속 공정 스케일업의 품질 안정화, 샘플 테스트의 정식 인증 전환, 대규모 Capex 재무 부담.", "kr": "이수스페셜티케미컬(40 → 150톤, 500톤 로드맵), PKC(새만금 PCl3 2만톤·PCl5 9천톤), 동화일렉트로라이트, 엔켐, 솔브레인"}, {"group": "스페셜티·정밀화학", "name": "TDM(분자량 조절제)", "en": "Tertiary Dodecyl Mercaptan", "what": "SBR·NBR·NB라텍스 중합 시 분자량을 조절하는 황화합물 첨가제로 세계 3사(이수스페셜티·Arkema·Chevron Phillips)가 과점한다. 원가 비중은 작지만 대체가 어려운 대표적 공정재다.", "chain": "황화합물 → TDM → 합성고무 중합", "driver": "합성고무·라텍스 수요", "check": "캐시카우 사업의 안정성이 신사업 Capex를 지탱하는지.", "kr": "이수스페셜티케미컬(2 → 3만톤), 금호석유화학(수요처)"}], "economics": {"lede": "정유와 석유화학은 모두 '투입물과 산출물의 가격 차이 × 물량 − 고정비'로 돈을 벌지만, 그 가격 차이를 결정하는 수급이 다르다. 정유는 원유가 남아도 정제설비가 모자라면 마진이 벌어지고, 화학은 원료가 싸져도 설비가 넘치면 스프레드가 안 벌어진다. 분기 실적에는 여기에 원가 인식 시차(래깅)와 재고평가손익이라는 회계적 변동이 겹치므로, 아래 공식들로 '본업 마진'과 '시차 효과'를 분리해서 읽어야 한다.", "models": [{"name": "복합정제마진과 정유 이익 분해", "formula": "정유 영업이익 ≈ (스팟 복합정제마진 + 래깅 효과 + OSP 효과) × 정제 처리량 − 고정비 + 재고평가손익", "explain": "복합정제마진은 고도화 설비를 갖춘 표준 정유소가 원유 1배럴로 만드는 휘발유·등경유·항공유·납사·중유의 가중 가치에서 원유가와 운영비를 뺀 값이다(주로 싱가포르 기준). 국내 정유사는 원유를 도입하는 데 약 1개월이 걸려, 유가 상승기엔 싸게 산 원유가 비싼 제품으로 팔리는 래깅 이익이, 하락기엔 역래깅이 생긴다. OSP 효과는 사우디 공식판매가 프리미엄 변동이고, 재고평가손익은 보유 재고의 회계상 평가 차이다. 선입선출법(S-Oil 등)은 유가 하락 시 재고손실이 한꺼번에, 총평균법(GS칼텍스 등)은 분산돼 반영돼 같은 업황에서도 회사별 분기 이익 모양이 다르다.", "sensitivity": "정유는 고정비 비중이 커서 마진 상승분 대부분이 이익으로 간다. 국내 4사 합산 정제능력 약 311만b/d 기준 가동률 80%면 연 약 9억 배럴을 처리하므로 복합마진 1달러 변화가 연간 이익 약 1조원 규모로 움직인다(단순 환산, 리포트 계산 아님).", "example": "1Q26 국내 정유 2사 정유부문 영업이익 2.8조원 중 1.4조원이 재고평가이익이었다. 재고손익 제외 배럴당 마진 이익은 1Q26 43.1달러, 2Q26 30.2달러로 2021~25년 분기 평균(6~15달러)을 크게 웃돌았다."}, {"name": "정유 수급: 순증설 vs 수요 증가", "formula": "정유 수급률 = 글로벌 석유 수요 ÷ 유효 정제능력 / 순증설 = 신규 증설 − 폐쇄·가동중단", "explain": "정제마진의 레벨은 원유 수급이 아니라 '제품 수요 증가 대비 정제설비 순증설'로 결정된다. 순증설이 수요 증가(연 100~120만b/d)보다 작으면 가동률이 오르고 마진이 벌어진다. 2025년은 설비가 오히려 37만b/d 순감소했고, 2026년 순증설 전망은 기관별로 55~110만b/d, 2027년은 5만b/d, 2028년은 사실상 0이다. 수급률은 평균 약 82%, 고점권 83.7%인데 전쟁으로 2026년 88.2%까지 오른다는 추정이 나왔고, 수급률이 고점을 넘으면 마진은 비선형적으로 상승한다.", "sensitivity": "피격·가동중단 설비(러시아·중동 합산 명목 685만b/d, 글로벌의 6.6%)는 연간 순증설의 수 배다. 다만 실제 시장에서 사라진 제품량은 원유 투입 감소 → 내수 우선 배분 → 수출 감소 → 재고 인출을 차감해 중동 기준 약 300만b/d로 좁혀진다.", "example": "2026년 1~2월(전쟁 전) 복합정제마진 9.1달러는 과거 평균(2010~25년, 2022 제외) 5.8달러를 이미 크게 웃돌았다. 전쟁 후 2H26 전망은 26~30달러, 2027년 19달러(전쟁 전 4Q25 약 10달러)."}, {"name": "원유 조달 원가: OSP와 WTI-Dubai 스프레드", "formula": "실제 도입 원가 = Dubai(벤치마크) + OSP(프리미엄/할인) + 운임·보험(FOB→CIF) / 원가 경쟁력 = WTI − (Dubai + OSP)", "explain": "사우디 아람코는 매달 지역별 OSP를 고시하고, 이 값은 약 1개월 뒤 원가에 반영된다. 공급 과잉기에는 점유율을 위해 OSP를 내리고, 타이트하면 올린다. 2014년 말 OSP 마이너스 전환은 과거 정유 업사이클의 출발점이었고, 20년 동안 마이너스였던 시기는 2008년(4개월), 2015~17년(36개월 중 28개월), 2020년(3개월)뿐이다. 셰일 붐 15년간 WTI는 Dubai+OSP 대비 약 6달러 쌌고 이것이 미국 정유사 PBR 2~4배의 원천이었다. 미국 셰일 정점과 비중동 공급 확대로 이 할인이 해소·역전되면 아시아 정유사의 원가 우위가 된다.", "sensitivity": "평균 회귀 시나리오에서 정제마진이 19달러, OSP가 14달러 내려가면 OSP 반영 실질 마진은 약 5달러 낮아진다. 고OSP(5월 19.5, 6월 15.5)가 제품가 하락기에 투입되면 역래깅으로 분기 이익이 급감한다.", "example": "사우디 Arab Light 아시아향 OSP: 2025-11 +2.2 → 2026-03 0.0 → 4월 +2.5 → 5월 +19.5 → 6월 +15.5 → 9·10월 -2.0달러(2020년 6월 이후 최저)."}, {"name": "NCC 스프레드와 손익분기", "formula": "NCC 스프레드 = (에틸렌 + 0.58×프로필렌 + 0.33×부타디엔/2 + 0.38×벤젠 + 0.22×톨루엔 + 0.15×자일렌) − 나프타 / EBITDA = 스프레드 × 판매량 − 현금 고정비", "explain": "나프타 1톤을 분해하면 에틸렌 외에 프로필렌·C4·BTX가 함께 나오므로, NCC 수익성은 에틸렌 한 제품이 아니라 제품 슬레이트 전체의 가치로 본다. 대표 지표인 에틸렌-납사 스프레드는 평균 약 369~400달러/톤, 손익분기는 220~300달러로 제시된다(리포트마다 상이). 부산물(부타디엔·MEG) 가격이 오르면 에틸렌에 배부되는 원가가 줄어 손익분기점이 낮아지므로, 에틸렌 스프레드가 약해도 '적자 축소'가 먼저 나타날 수 있다.", "sensitivity": "100만톤 NCC 기준 가동률이 90%에서 70%로 떨어지면 톤당 38~64달러, 50%면 100~180달러의 스프레드가 추가로 필요하다(고정비 역레버리지).", "example": "에틸렌-납사 스프레드 2021년 401달러 → 2022년 235달러 → 2025년 약 200달러(손익분기 하회). 3Q26 기준 부타디엔 스프레드 513달러(4Q25 324), MEG 144달러(126)로 부산물이 개선된 반면 에틸렌 래깅 스프레드는 185달러."}, {"name": "원료 진영별 원가 곡선", "formula": "가격 하단 = 수요를 채우는 마지막(한계) 설비의 현금원가 / NCC 상대 경쟁력 ∝ 1 ÷ (납사 가격 ÷ 에탄 가격)", "explain": "세계 에틸렌 설비를 원가 순으로 세우면 북미·중동 ECC(에탄), 중국 CTO(석탄)가 왼쪽, 한국·일본·유럽 NCC(납사)가 오른쪽에 선다. 가격은 곡선 오른쪽 끝의 고원가 설비가 정하므로, 유럽 노후 설비가 영구 퇴장하면 가격 바닥이 올라간다. 납사/에탄 배수가 낮을수록(유가 약세·가스 강세) NCC의 열위가 줄어든다. 이번 전쟁은 곡선을 전체적으로 위로 올리면서(원가 곡선 상향 평준화) 원료 진영 간 격차를 오히려 벌렸다.", "sensitivity": "Oil/Gas Ratio가 10~15배면 미국 ECC와 아시아 NCC 원가가 비슷하고, 2023~24년 31~35배일 때 미국 PE 수출이 사상 최대를 기록했다. 납사-에탄 스프레드는 2015~25 평균 446달러에서 2026년 4월 963달러, 8월 674달러로 확대됐다.", "example": "2월 → 4월 원료 가격: 아시아 납사 617.5 → 1,062.8달러/톤(+72%), 미국 에탄 109.3 → 100.2(-8%), 중국 석탄 101.5 → 111.2(+10%). 전쟁 전(2025-10) 납사/에탄 배수는 4.5~4.6배로 2015~17 호황기 수준이었다."}, {"name": "화학의 래깅 효과: 스팟 vs 1개월 래깅 스프레드", "formula": "래깅 스프레드(t) = 제품가격(t) − 나프타(t−1개월) / 래깅 효과 = 래깅 스프레드 − 스팟 스프레드", "explain": "국내 NCC는 1~2개월 전에 매입한 납사를 투입하므로 손익에는 스팟이 아니라 래깅 스프레드가 반영된다. 원료 급등기엔 싼 재고 덕에 스프레드가 회계적으로 커지고, 원료 하락기엔 비싼 재고를 넣어 역래깅이 생긴다. 이것이 '화학사 분기 실적이 업황과 반대로 움직이는' 이유이며, 과거 업사이클이 유가 바닥 반등기에만 온 것도 원가 전가와 긍정적 래깅·재고평가이익이 겹쳤기 때문이다.", "sensitivity": "유가 국면별: 저유가→상승(바닥 반등)은 원가 전가+긍정적 래깅으로 업사이클, 고유가→하락은 스프레드 확대 가능하나 역래깅, 저유가·하락은 제품가 동반 하락으로 부진 지속.", "example": "에틸렌 1개월 래깅 스프레드 2026년 3월 575 → 4월 310 → 5월 41 → 6월 -59달러/톤. 같은 3월 스팟 스프레드는 에틸렌 164, PE 113, PP 84달러로 연중 최저였다. 1Q26 국내 화학 11개사 합산 영업이익 0.55조원(2025년 분기 평균 -0.20조원) 흑자는 대부분 이 효과였다."}, {"name": "고정비 레버리지와 구조조정의 불가역성", "formula": "판매량 = 능력 × 가동률 × 수율 / 톤당 고정비 = 현금 고정비 ÷ 판매량 / 절감 강도: 감산 → 박스업 → 영구 폐쇄 → 자산 이전·JV 순으로 커짐", "explain": "NCC 고정 Opex는 정상 가동(85~95%) 시 현금원가의 8~15%지만 가동률이 떨어지면 체감 15~25%로 커진다. 감산은 변동비만 줄이고 스팀·전력·폐수·부두 기본요금은 남는다. 박스업은 재가동 옵션 대가로 관리비가 든다. 영구 폐쇄부터 정기보수 사이클에서 빠지며 고정비가 구조적으로 낮아지고, JV·자산 이전은 같은 산단의 중복 조직·정비·공용 인프라를 제거해 가장 큰 절감을 만든다. 그래서 밸류에이션 프리미엄은 '얼마나 줄였나'가 아니라 '되돌릴 수 없게 바꿨나'에 붙는다.", "sensitivity": "NCC 전기료는 매출원가의 5~6%(과거 3%대)이며 kWh당 5~15원 변화가 공장 생존성을 가른다. 전력 직접구매 시 절감 시나리오 10~60원/kWh(리포트 추정).", "example": "롯데케미칼은 대산 분할·HD현대케미칼 합병(110만톤 Box-up), 여수 여천NCC 통합, 말레이 타이탄 매각으로 에틸렌 능력을 475만톤에서 260만톤으로 줄이며 약 9,800억원 손익 개선과 약 3조원 차입금 축소 효과가 추정됐다."}, {"name": "부산물 체인: 부타디엔과 합성고무", "formula": "C4 감소량 ≈ 에틸렌 감축량 × (8.7/29) / NBL 스팟 마진 = NB라텍스 − 0.4×부타디엔 − 0.12×아크릴로니트릴", "explain": "에틸렌 270~370만톤을 줄이면 단순 수율로 프로필렌 130~170만톤, C4 80~110만톤, PyGas 200~270만톤이 함께 사라진다. 프로필렌은 대체 공급원이 많아 조건부로만 타이트해지지만 부타디엔은 대체 생산 경제성이 낮아 가장 먼저 가격이 반응한다. 따라서 NCC 구조조정의 첫 수혜는 BD 유도체(SBR·BR·NB라텍스) 업체로 향할 수 있고, 반대로 BD를 외부에서 사는 업체는 원료 부담이 구조화된다.", "sensitivity": "BD 가격은 2025-12 892 → 2026-04 2,381 → 8월 1,413달러/톤으로 변동해, 합성고무 업체는 2분기 래깅 이익 후 3분기 역래깅을 겪는다. 판가 방어 여부가 구조적 개선의 관건.", "example": "NB라텍스 동남아 부족 국면 마진 700~900달러/톤(2026-05). 한국 NBL 수출가 3월 870 → 4월 1,580달러/톤(+82%)."}, {"name": "윤활기유의 원료 기회비용", "formula": "기유 공급 유인 ∝ (기유 가격 − VGO 가치) − (연료 크랙 × 연료 수율)", "explain": "VGO(감압경유)는 윤활기유와 디젤·항공유의 공통 원료다. 연료 마진이 높으면 VGO를 기유에 넣는 기회비용이 커져, 정제설비가 정상 가동해도 기유 공급은 늘지 않는다. 기유는 고객 인증 때문에 공급처 전환이 어렵고 계약가 조정이 느려, 부족이 길어지면 가격이 '늦게, 그러나 크게' 오른다. 3사 과점(약 65%)이라 한 공장(Pearl GTL #2)만 멈춰도 가격이 두 배가 됐다.", "sensitivity": "Pearl GTL #1 라인 하반기, #2 라인 2027년 1~2분기 정상화가 예상돼 윤활 고마진은 2027년 상반기까지 이어진다는 추정.", "example": "국내 기유 수출가 2월 864 → 6월 1,865달러/톤. 2Q26 윤활 영업이익: SK이노베이션 6,919억원, S-Oil 4,774억원, GS칼텍스 3,576억원, HD현대오일뱅크 1,814억원(합산 1.71조원)."}, {"name": "가격 개입의 비용: 최고가격제 기회손실", "formula": "기회손실 = Σ(주간) [추정 공급가(MOPS 변동률, 환율) − 상한 가격] × 내수 판매량 / 추정-실제 공급가 상관계수 0.95", "explain": "국내 정유사의 세전 공급가는 직전 주 싱가포르 제품가(MOPS) 변동률과 환율의 함수라, 제도가 없었을 때의 가격을 역산할 수 있다. 2026년 3월 13일 시행된 최고가격제는 보통휘발유·경유·실내등유만 대상이고 이는 판매량의 약 15%라 이익 훼손은 제한적이지만, 경유는 가격 차가 크고 소비량이 휘발유보다 약 50% 많아 손실 대부분을 차지했다. 정부는 MOPS가 아닌 '원가+적정 마진' 기준으로 보상하기로 해 회수율이 핵심 변수다.", "sensitivity": "주간 기회손실은 첫 주 1,540억원 → 이후 5주 평균 5,600억원 → 6월 1천억원대. 보상금은 일회성이라 주가 영향은 제한적이라는 판단.", "example": "3/13~6/20 휘발유·경유 기회손실 약 4.7조원(SK에너지 1.35조, S-Oil 1.25조 등 4사 모두 1조원 이상) — 리포트 추정. 보상 신청 마감 8월 29일, 보수적으로 4분기 반영."}]}, "indicators": [{"group": "가격", "name": "싱가포르 복합정제마진", "def": "싱가포르 제품 가중평균가(휘발유·등경유·항공유·납사·BC·LPG) − Dubai − 운영비. 국내 정유 업황의 대표 지표", "where": "Petronet(한국석유공사), S&P Global Platts, Datastream", "level": "20년 평균 10.2달러, 2025-10 약 14, 2025-11 15~20, 2026년 1~2월 9.1, 4월 사상 최고 87(월평균 39로 보는 자료도 있음), 6월 29.4, 8월 34.0, 3Q26 누적 33.9(2026-09-11)", "read": "10달러 이상 지속은 업사이클, 20달러 이상은 초호황권. 손익분기는 약 4~4.5달러. 단기 급등
