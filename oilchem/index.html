 $('#p-fact').innerHTML=head('fact','Figures Database','수치 DB',`리포트 ${D.reports.length}건에서 뽑은 수치 ${F.length.toLocaleString()}개를 한곳에 모았다. 검색해서 쓰되, 인용할 때는 **시점·원출처·태그**를 함께 옮길 것.`)+`<div class="tools"><input class="search" id="f-q" placeholder="키워드 (예: 마진, 캐파, 2027)"><span class="count" id="f-c"></span></div><div class="chips" id="f-ch"></div><div id="f-t"></div><button class="more" id="f-m" hidden>더 보기</button>`;
 let g='',q='',lim=200;const draw=()=>{const L=F.filter(x=>(!g||x.tag===g)&&(!q||(x.k+' '+x.v+' '+x.unit+' '+x.src+' '+x.topic+' '+x.asof).toLowerCase().includes(q)));$('#f-c').textContent=L.length.toLocaleString()+'개';
 $('#f-t').innerHTML=`<div class="tw"><table><thead><tr><th>항목</th><th>값</th><th>단위</th><th>시점</th><th>원출처</th><th>태그</th><th>리포트 주제 · 발행</th></tr></thead><tbody>${L.slice(0,lim).map(x=>`<tr><td style="min-width:220px">${esc(x.k)}</td><td class="num"><b>${esc(x.v)}</b></td><td class="tk">${esc(x.unit)}</td><td class="tk">${esc(x.asof)}</td><td style="font-size:12.5px;color:var(--ink-3)">${esc(x.src)}</td><td>${tag(x.tag)}</td><td style="font-size:12.5px;color:var(--ink-3);min-width:160px">${esc(x.topic)} · ${esc(x.date)}</td></tr>`).join('')}</tbody></table></div>`;$('#f-m').hidden=L.length<=lim;};
 chips($('#f-ch'),['확인','추정','미확인'],x=>{g=x;lim=200;draw();});$('#f-q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();lim=200;draw();});$('#f-m').addEventListener('click',()=>{lim+=300;draw();});draw();})();

/* 14 glossary */
(function(){const G=D.glossary.slice().sort((a,b)=>a.term.localeCompare(b.term,'ko'));
 $('#p-gl').innerHTML=head('gl','Glossary','용어 사전',`${G.length}개 용어. 리포트를 읽다 막히는 약어와 업계 표현을 모았다.`)+`<div class="tools"><input class="search" id="g-q" placeholder="용어 검색"><span class="count" id="g-c"></span></div><div class="chips" id="g-ch"></div><div id="g-t"></div>`;
 let g='',q='';const draw=()=>{const L=G.filter(x=>(!g||x.group===g)&&(!q||(x.term+x.en+x.def).toLowerCase().includes(q)));$('#g-c').textContent=L.length+'개';
 $('#g-t').innerHTML=`<div class="tw"><table><thead><tr><th>용어</th><th>영문·약어</th><th>정의</th><th>분류</th></tr></thead><tbody>${L.map(x=>`<tr><td class="nm">${esc(x.term)}</td><td class="tk">${esc(x.en)}</td><td style="min-width:320px">${md(x.def)}</td><td style="font-size:12px;color:var(--ink-3);white-space:nowrap">${esc(x.group)}</td></tr>`).join('')}</tbody></table></div>`;};
 chips($('#g-ch'),uniq(G.map(x=>x.group)),x=>{g=x;draw();});$('#g-q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();draw();});draw();})();

/* 15 sources */
(function(){const S=D.sources,R=D.reports.slice().sort((a,b)=>b.date.localeCompare(a.date));
 const tc={};R.forEach(r=>tc[r.tone]=(tc[r.tone]||0)+1);
 $('#p-src').innerHTML=head('src','Sources & Data Quality','출처·데이터 품질',`증권사 산업 리포트 ${R.length}건(${R[R.length-1].date} ~ ${R[0].date})을 재구성했다. 발행사·작성자·종목 의견은 전부 지웠고, 수치에 딸린 원출처 기관만 남겼다.`)+`
 <div class="sec"><h3>데이터 품질 주의</h3><ul class="bb">${S.notes.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div>
 <div class="sec"><h3>인용된 원출처 기관</h3><div class="cloud">${S.orig.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></div>
 ${M.public?'':`<div class="sec"><h3>리포트 인덱스</h3><p class="note">발행일·주제·업황 톤만 남겼다. 톤 분포: 긍정 ${tc['긍정']||0} · 중립 ${tc['중립']||0} · 부정 ${tc['부정']||0}.</p><div style="margin-top:14px">${table(['#','발행일','주제','톤','핵심 주장'],R.map((r,i)=>[String(R.length-i),r.date,'**'+r.topic+'**',r.tone,r.thesis]))}</div></div>`}`+(M.public?`<div class="sec"><h3>근거 자료</h3><p class="note">톤 분포: 긍정 ${tc['긍정']||0} · 중립 ${tc['중립']||0} · 부정 ${tc['부정']||0}. 공개판에서는 개별 리포트 목록을 싣지 않았다.</p></div>`:'');})();

/* nav + theme */
const show=id=>{if(!document.getElementById('p-'+id))id='map';document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+id));document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.p===id));};
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;show(b.dataset.p);try{history.replaceState(null,'','#'+b.dataset.p)}catch(_){}window.scrollTo(0,0);});
show((location.hash||'#map').slice(1));
const root=document.documentElement;const setT=t=>{root.setAttribute('data-theme',t);document.querySelectorAll('.tsb').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));try{localStorage.setItem('desk-theme',t)}catch(_){}};
document.querySelectorAll('.tsb').forEach(b=>b.addEventListener('click',()=>setT(b.dataset.t)));
try{const t=localStorage.getItem('desk-theme');if(t)setT(t);}catch(_){}
})();
</script>
