\" opacity=\"0.78\">서방 생산 1톤 미만<\/text><path d=\"M480 130 L480 164\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--warn)\" marker-end=\"url(#a-fue1-warn)\"/><rect x=\"586\" y=\"164\" width=\"168\" height=\"52\" rx=\"8\" style=\"fill:var(--warn);fill-opacity:.10;stroke:var(--warn)\" stroke-width=\"1.3\"/><text x=\"670\" y=\"185.875\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">TRISO·금속연료<\/text><text x=\"670\" y=\"203.125\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.78\">4세대 SMR·핵잠<\/text><path d=\"M564 190 L586 190\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--warn)\" marker-end=\"url(#a-fue1-warn)\"/><text x=\"16\" y=\"262\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--accent)\">후행 주기 (Back-end)<\/text><path d=\"M860 130 L860 280\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-fue1)\"/><rect x=\"871.71\" y=\"200.5\" width=\"26.58\" height=\"14.5\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"885\" y=\"211\" font-size=\"10.5\" text-anchor=\"middle\">방출<\/text><rect x=\"776\" y=\"280\" width=\"168\" height=\"52\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"860\" y=\"302.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">사용후핵연료<\/text><text x=\"860\" y=\"318.6\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.78\">원전 내 수조 냉각<\/text><rect x=\"586\" y=\"280\" width=\"168\" height=\"52\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"670\" y=\"302.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">건식저장(CASK)<\/text><text x=\"670\" y=\"318.6\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.78\">Holtec 점유 약 45%<\/text><path d=\"M776 306 L754 306\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-fue1)\"/><rect x=\"396\" y=\"280\" width=\"168\" height=\"52\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-dasharray=\"4 4\"/><text x=\"480\" y=\"302.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">파이로프로세싱<\/text><text x=\"480\" y=\"318.6\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.78\">고준위 약 1/20로<\/text><path d=\"M586 306 L564 306\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-fue1)\"/><rect x=\"537.98\" y=\"340.5\" width=\"74.04\" height=\"14.5\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"575\" y=\"351\" font-size=\"10.5\" text-anchor=\"middle\" style=\"fill:var(--alert)\">협정 개정 필요<\/text><path d=\"M480 280 L480 248 L640 248 L640 216\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-fue1)\"/><rect x=\"507.545\" y=\"232.5\" width=\"104.91\" height=\"14.5\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"560\" y=\"243\" font-size=\"10.5\" text-anchor=\"middle\">고속로 연료로 재활용<\/text><rect x=\"16\" y=\"280\" width=\"356\" height=\"64\" rx=\"8\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"194\" y=\"308.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">미국 400GW 달성 시 필요한 증설(2024 말 대비)<\/text><text x=\"194\" y=\"324.6\" font-size=\"11.5\" text-anchor=\"middle\" opacity=\"0.78\">채굴 44배 · 변환 11배 · 농축 15배 · 연료제조 3배<\/text><text x=\"480\" y=\"376\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.7\">원출처: WNA, DOE, EIA. 러시아 비중은 농축능력 기준<\/text><\/svg>", "cap": "**결론: 연료주기에서 병목은 채광이 아니라 변환·농축이다. 미국이 400GW를 달성하려면 채굴 44배·변환 11배·농축 15배를 늘려야 하고, 상업 변환시설은 1곳뿐이다.** 앞단(Front-end)은 원자로 착공보다 수년 먼저 장기계약으로 묶이고, 뒷단(Back-end)은 사용후핵연료를 수조→건식저장으로 옮기는 구조다. 재처리(파이로프로세싱)는 고준위 폐기물을 약 1/20로 줄이고 회수물을 고속로 연료로 쓰는 경로지만 한국은 협정 개정이 전제다."}, {"t": "steps", "items": [{"h": "채광·정광 (U3O8)", "meta": ["캐나다·카자흐 등 소수국 집중", "미국 채굴 1980년 대비 −99.6%"], "p": "광산에서 캔 우라늄을 옐로케이크(U3O8)로 정제한다. 미국 생산은 2023년 5만 → 2024년 67.7만 파운드로 늘었지만 여전히 미미하고, 우라늄은 99% 이상 수입이다. 2025-11 미국 핵심광물 목록에 우라늄이 추가됐다.", "chk": "국내 직접 상장사는 없다(포스코인터내셔널 트레이딩, 해외 Cameco)."}, {"h": "변환 (UF6)", "meta": ["Rosatom 2.5만 · Orano·ConverDyn 각 1.5만 · Cameco 1.25만 · CNNC 1.2만 tU/년"], "p": "U3O8을 원심분리가 가능한 기체 육불화우라늄(UF6)으로 바꾼다. 미국 상업 변환시설은 Metropolis Works 1곳(연 7,000tU)뿐이다. 2022년 러시아 공급 차질 때 전환비가 천연 UF6 가격의 10%에서 20% 이상으로 뛰었다.", "chk": "변환은 농축보다 덜 주목받지만 가장 먼저 가격이 튄 병목이다."}, {"h": "농축 (SWU)", "meta": ["약 6,000만 SWU/년 ≈ 대형원전 410GW분", "러시아 약 45%"], "p": "원심분리기 캐스케이드로 U-235 비율을 3~5%(LEU)로 높인다. 작업량 단위는 SWU(분리작업단위). 미국 농축 자립도는 25~30%이고 러시아산 LEU 의존도는 약 24%(390만 SWU, 2023)였다. 한수원은 매년 원전 연료비 2조원 이상 중 5천억원 이상을 농축 비용으로 쓴다.", "chk": "러시아산 우라늄 수입금지 전면 효력 2028-01. 대체 공급원 확보 속도가 관전 포인트."}, {"h": "성형가공 (연료집합체)", "meta": ["노형별 설계 종속", "국내 한전원자력연료(비상장)"], "p": "농축 UF6를 다시 UO2 분말로 바꿔 펠릿·연료봉·집합체로 만든다. 4세대는 TRISO 입자연료(Xe-100·Kairos)나 금속연료(Natrium·Aurora)를 쓴다. 노형별 설계에 종속돼 장기 공급계약이 일반적이다.", "chk": "TRISO 연료공장(X-energy·BWXT 등) 완공 일정이 4세대 SMR 착공과 연동된다."}, {"h": "후행 주기 (사용후핵연료)", "meta": ["수조 → 건식저장(CASK)", "고준위 핵심기술 130개 중 확보 22개(2026)"], "p": "원자로에서 꺼낸 연료는 원전 내 수조에서 식힌 뒤 콘크리트·특수강 용기에 담아 건식저장한다(Holtec HI-STORM 글로벌 점유율 약 45%). 파이로프로세싱은 500~650℃ 용융염에서 전기화학적으로 우라늄·초우라늄을 회수하는 건식 재처리로, 한국은 한미 협정 개정이 선행돼야 한다.", "chk": "국내 저장시설 포화 — 세아베스틸지주(CASK)가 소재 측 연결점. 부피 감축 폭은 1/20과 1/5로 집계가 갈린다."}]}]}, {"h": "농축은 러시아가 45% — 서방 설비만으로는 계획의 3분의 1", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 300\" role=\"img\" aria-label=\"글로벌 농축능력의 약 45%가 러시아에 있어, 러시아를 빼면 서방 설비는 증설을 더해도 신규 원전 계획의 3분의 1만 감당한다\"><defs><marker id=\"a-swu1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-swu1-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--accent)\"/><\/marker><marker id=\"a-swu1-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--ok)\"/><\/marker><marker id=\"a-swu1-warn\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--warn)\"/><\/marker><marker id=\"a-swu1-alert\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--alert)\"/><\/marker><\/defs><text x=\"16\" y=\"26\" font-size=\"12.5\" text-anchor=\"start\" font-weight=\"600\">우라늄 농축능력 약 6,000만 SWU/년 (2025, WNA)<\/text><rect x=\"80\" y=\"40\" width=\"358\" height=\"40\" rx=\"3\" style=\"fill:var(--alert);fill-opacity:.10;stroke:var(--alert)\" stroke-width=\"1.3\"/><text x=\"260\" y=\"58\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">Rosatom<\/text><text x=\"260\" y=\"74\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.8\">2,700만<\/text><rect x=\"440\" y=\"40\" width=\"231.333\" height=\"40\" rx=\"3\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"556.667\" y=\"58\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">Urenco<\/text><text x=\"556.667\" y=\"74\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.8\">1,750만<\/text><rect x=\"673.333\" y=\"40\" width=\"98\" height=\"40\" rx=\"3\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"723.333\" y=\"58\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">Orano<\/text><text x=\"723.333\" y=\"74\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.8\">750만<\/text><rect x=\"773.333\" y=\"40\" width=\"84.6667\" height=\"40\" rx=\"3\" style=\"fill:var(--warn);fill-opacity:.10;stroke:var(--warn)\" stroke-width=\"1.3\"/><text x=\"816.667\" y=\"58\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">CNNC<\/text><text x=\"816.667\" y=\"74\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.8\">650만<\/text><rect x=\"860\" y=\"40\" width=\"11.3333\" height=\"40\" rx=\"3\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><rect x=\"734.2\" y=\"90.5\" width=\"148.8\" height=\"14.5\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"880\" y=\"101\" font-size=\"10.5\" text-anchor=\"end\">CNNC 650만 · Centrus 100만<\/text><path d=\"M870 82 L870 90\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.4\"/><text x=\"80\" y=\"118\" font-size=\"11\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--alert)\">러시아 약 45%<\/text><text x=\"16\" y=\"156\" font-size=\"12.5\" text-anchor=\"start\" font-weight=\"600\">원전 가동 가능 규모로 환산 (대형원전 GW)<\/text><text x=\"262\" y=\"189\" font-size=\"11.5\" text-anchor=\"end\">현재 전세계 농축능력<\/text><rect x=\"272\" y=\"172\" width=\"512.5\" height=\"26\" rx=\"3\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"792.5\" y=\"189\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"600\">약 410GW분<\/text><text x=\"262\" y=\"227\" font-size=\"11.5\" text-anchor=\"end\">서방(Urenco·Orano·Centrus) 증설 포함<\/text><rect x=\"272\" y=\"210\" width=\"200\" height=\"26\" rx=\"3\" style=\"fill:var(--warn);fill-opacity:.10;stroke:var(--warn)\" stroke-width=\"1.3\"/><text x=\"480\" y=\"227\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"600\">최대 160GW분<\/text><text x=\"262\" y=\"265\" font-size=\"11.5\" text-anchor=\"end\">신규 계획 (미국 300GW 포함)<\/text><rect x=\"272\" y=\"248\" width=\"593.75\" height=\"26\" rx=\"3\" style=\"fill:var(--alert);fill-opacity:.10;stroke:var(--alert)\" stroke-width=\"1.3\"/><text x=\"873.75\" y=\"265\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"600\">475GW 필요<\/text><text x=\"480\" y=\"294\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.75\">업계 추정(WNA 기반). 러시아 제외 시 추가로 현재 규모에 준하는 농축 설비가 필요하다는 결론<\/text><\/svg>", "cap": "**결론: 러시아를 빼면 Urenco·Orano·Centrus가 증설해도 대형원전 최대 160GW분밖에 안 되고, 미국 300GW를 포함한 신규 475GW 계획을 감당하려면 현재 규모에 준하는 농축 설비가 새로 필요하다.** 농축은 원자로보다 수년 먼저 장기계약으로 확보돼야 하므로, 원전 착공 속도는 결국 서방 농축 증설 속도에 묶인다. 한미 협정 개정 시 한수원의 농축 내재화 논리가 여기서 나온다."}, {"t": "table", "cols": ["기업(국가)", "변환(톤U/년)", "농축(SWU/년)", "비고"], "rows": [["Rosatom/Tenex(러시아)", "25,000", "2,700만", "HALEU 상업 공급 사실상 독점"], ["Urenco(영·독·네)", "-", "1,750만", "미국 Urenco USA 운영"], ["Orano(프랑스)", "15,000", "750만", "EDF 연료 공급"], ["CNNC(중국)", "12,000", "650만", "다른 집계 8,900톤SWU(2030E 1.7만) — 미확인"], ["ConverDyn(미국)", "15,000", "-", "Metropolis Works 운영"], ["Cameco(캐나다)", "12,500", "-", "WH 지분 보유"], ["Centrus(미국)", "-", "100만", "서방 유일 HALEU 생산"]], "title": "우라늄 변환·농축 공급자", "note": "원출처 WNA(2025). CNNC 농축능력은 서울대 집계와 단위·수치가 달라 범위로 인용"}, {"t": "callout", "text": "미국 우라늄 수입 중 러시아산 비중은 16.5%(2020)에서 3.6%(2024)로 줄었지만, 러시아산 LEU(농축 서비스) 의존도는 약 24%였다. 우라늄 원광보다 **농축 서비스**가 끊기기 어렵다는 점이 핵심이다.", "title": "원광보다 농축이 탈러시아의 난관", "tone": "warn"}]}, {"h": "LEU·HALEU·HEU — 농축도가 교체주기와 규제선을 정한다", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 262\" role=\"img\" aria-label=\"농축도는 연료 교체 주기와 비확산 규제를 동시에 결정하고, 한미 협정의 20% 선이 HALEU와 HEU를 가른다\"><defs><marker id=\"a-asy1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-asy1-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--accent)\"/><\/marker><marker id=\"a-asy1-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--ok)\"/><\/marker><marker id=\"a-asy1-warn\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--warn)\"/><\/marker><marker id=\"a-asy1-alert\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--alert)\"/><\/marker><\/defs><rect x=\"40\" y=\"70\" width=\"78\" height=\"36\" rx=\"3\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"80\" y=\"93\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">천연<\/text><rect x=\"120\" y=\"70\" width=\"178\" height=\"36\" rx=\"3\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"210\" y=\"93\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">LEU<\/text><rect x=\"300\" y=\"70\" width=\"218\" height=\"36\" rx=\"3\" style=\"fill:var(--warn);fill-opacity:.10;stroke:var(--warn)\" stroke-width=\"1.3\"/><text x=\"410\" y=\"93\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">HALEU<\/text><rect x=\"520\" y=\"70\" width=\"238\" height=\"36\" rx=\"3\" style=\"fill:var(--alert);fill-opacity:.10;stroke:var(--alert)\" stroke-width=\"1.3\"/><text x=\"640\" y=\"93\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">HEU<\/text><rect x=\"760\" y=\"70\" width=\"158\" height=\"36\" rx=\"3\" style=\"fill:var(--alert);fill-opacity:.10;stroke:var(--alert)\" stroke-width=\"1.3\"/><text x=\"840\" y=\"93\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">무기급 수준<\/text><text x=\"120\" y=\"60\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">0.7%<\/text><text x=\"300\" y=\"60\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">5%<\/text><text x=\"520\" y=\"60\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">20%<\/text><text x=\"760\" y=\"60\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">90%<\/text><path d=\"M520 38 L520 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--alert)\"/><path d=\"M520 66 L520 126\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--alert)\" stroke-dasharray=\"5 4\"/><rect x=\"446.38\" y=\"20\" width=\"147.24\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"520\" y=\"31\" font-size=\"11\" text-anchor=\"middle\" style=\"fill:var(--alert)\">123협정: 20% 이상 농축 금지<\/text><text x=\"80\" y=\"132\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">천연우라늄<\/text><text x=\"80\" y=\"149\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.8\">U-235 약 0.7%<\/text><text x=\"210\" y=\"132\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">대형 경수로<\/text><text x=\"210\" y=\"149\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.8\">APR1400·AP1000<\/text><text x=\"210\" y=\"166\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.8\">프랑스 핵잠 K15 &lt;6%<\/text><text x=\"410\" y=\"132\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">4세대 SMR<\/text><text x=\"410\" y=\"149\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.8\">Natrium·Xe-100(15.5%)<\/text><text x=\"410\" y=\"166\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.8\">K-SSN 구상 15~19.75%<\/text><text x=\"640\" y=\"132\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">HEU 구간<\/text><text x=\"640\" y=\"149\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.8\">20% 이상 — 비확산 규제<\/text><text x=\"840\" y=\"132\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">미·영 핵잠<\/text><text x=\"840\" y=\"149\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.8\">S9G 93%+ · PWR2 90%+<\/text><rect x=\"40\" y=\"196\" width=\"420\" height=\"50\" rx=\"8\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"250\" y=\"217.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">천연우라늄 투입량(제품 1kg당)<\/text><text x=\"250\" y=\"233.6\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.78\">LEU 약 10kg  ·  HALEU 최대 50kg<\/text><rect x=\"480\" y=\"196\" width=\"440\" height=\"50\" rx=\"8\" style=\"fill:var(--warn);fill-opacity:.10;stroke:var(--warn)\" stroke-width=\"1.3\"/><text x=\"700\" y=\"217.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">HALEU 공급<\/text><text x=\"700\" y=\"233.6\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.78\">상업 대량공급 사실상 러시아 · Centrus 2024년 900kg 납품<\/text><\/svg>", "cap": "**결론: 농축도가 높을수록 연료를 오래 쓰지만(미국 핵잠 93%+로 33년+ 무교체), 20%를 넘으면 비확산 규제 대상이 된다. 한미 협정의 20% 선이 한국이 쓸 수 있는 연료의 상한이다.** HALEU(5~20%)는 1kg 생산에 천연우라늄이 최대 50kg(LEU는 약 10kg) 들어 원료 소모가 크고, 상업 대량 공급은 사실상 러시아뿐이다. 4세대 SMR과 한국형 핵잠 구상(15~19.75%)이 모두 이 구간에 몰려 있다."}, {"t": "table", "cols": ["구분", "연료 농축도", "열출력", "연료교체 주기"], "rows": [["미국 S9G(버지니아급)", ">93% HEU", "~210MWt", "33년+"], ["영국 PWR2", ">90% HEU", "~150MWt", "25년+"], ["프랑스 K15", "<6% LEU", "150MWt", "약 10년"], ["한국 i-SMR/선박용 SMR", "<20%(HALEU)", "70MWt(목표)", "장주기 목표(가상설계 47년)"]], "title": "핵잠·SMR 원자로의 농축도와 교체주기", "note": "원출처 세종연구소"}]}, {"h": "HALEU 수급 — 4세대 SMR 운전 규모의 상한선", "blocks": [{"t": "kpis", "items": [{"lab": "2030년대 미국 HALEU 수요", "val": "연 50톤+", "cap": "vs DOE 시범생산 1톤 미만. 원출처 DOE", "tag": "추정"}, {"lab": "Centrus DOE 납품", "val": "900kg", "cap": "2024년, 서방 첫 HALEU 생산(2023-10 개시)", "tag": "확인"}, {"lab": "HALEU 연방 재정", "val": "약 34억달러", "cap": "IRA 약 7억 + 2024 예산 27억. LEU·HALEU 확대 27억(2026-01)", "tag": "확인"}, {"lab": "50MTU로 돌릴 수 있는 SMR", "val": "Xe-100 약 80기", "cap": "1기 연 0.67MTU 소요 → 약 8GW(2035). 업계 추정", "tag": "추정"}]}, {"t": "table", "cols": ["단계", "시점", "생산능력", "운전 가능 규모(Xe-100 환산)"], "rows": [["DOE Phase 3", "~2026", "0.9MTU/년", "약 1기 11개월"], ["캐스케이드 120기", "2030", "6MTU/년", "약 10기(800MW)"], ["120기 라인 복수", "2035", "최대 50MTU/년", "약 80기(8GW)"]], "title": "Centrus HALEU 증설 로드맵", "note": "원출처 Centrus Energy, DOE, ORNL"}, {"t": "p", "text": "이 숫자가 뜻하는 것은 단순하다. 빅테크가 발표한 4세대 SMR 계약(Amazon-X-energy 5GW, Meta-TerraPower 8기 등)을 모두 합쳐도, 2035년 서방 HALEU로 돌릴 수 있는 규모는 최대 8GW 안팎이다. 그래서 4세대 SMR 관련 딜에서는 원자로 인허가만큼 **연료 조달 계약**이 확보됐는지가 중요하다."}]}, {"h": "가격 지표 읽는 법 — 원자료에 없는 것과 있는 것", "blocks": [{"t": "callout", "text": "이 데스크의 원자료에는 우라늄 현물·장기계약 가격과 SWU 가격 시계열이 없다. 가격을 인용해야 할 때는 WNA·업계 가격지 원출처를 별도로 확인하고, 여기서는 **구조 지표**(전환비 비중, 러시아 의존도, 한수원 농축비)로 방향을 읽는다.", "title": "우라늄·SWU 가격은 별도 확인 필요", "tone": "warn"}, {"t": "table", "cols": ["지표", "정의", "최근 수준(자료 기준)", "읽는 법"], "rows": [["HALEU 생산능력", "미국·서방 HALEU 연간 생산·납품", "Centrus 0.9MTU(2026까지) → 6MTU(2030) → 최대 50MTU(2035) 계획. 2030년대 수요 연 50톤+", "4세대 SMR 상업운전 가능 규모의 상한. 50MTU ≈ Xe-100 약 80기(8GW)"], ["우라늄 변환·농축 가격(SWU)", "UF6 전환 비용과 농축 서비스 단가", "전환비가 천연 UF6 가격의 10%(2021말) → 20%+(2022말)", "병목 심화 시 원전 연료비와 농축 투자 유인 상승, 한수원 농축 내재화 논리 강화"], ["미국 러시아산 우라늄 의존도", "미국 우라늄·LEU 수입 중 러시아산 비중", "우라늄 수입 16.5%(2020) → 3.6%(2024), 러시아산 LEU 의존도 약 24%", "2028-01 수입금지 전면 발효 전 대체 공급원 확보 속도 확인"], ["한수원 연료비·농축비", "연간 원전 연료비 중 농축 비용", "연료비 2조원+ / 농축비 5천억원+(2025)", "협정 개정 시 내재화 가능 규모 — 한전 연결 이익과 충당부채에 영향"], ["미국 연료주기 증설 배수", "400GW 달성에 필요한 단계별 증설", "채굴 44 / 변환 11 / 농축 15 / 연료제조 3배", "원자로 목표 대비 연료 공급망 준비도"]], "title": "연료 지표 사전"}]}, {"h": "한국 연결점 — 협정이 열려야 사업이 된다", "blocks": [{"t": "grid", "items": [{"h": "한수원 농축 내재화", "p": "연 농축비 5천억원+를 내부화할 수 있는 옵션. 한미 협정 개정(20% 미만 농축 허용)이 전제이며, 미국이 한국에 농축 공동 투자를 제안한 것으로 알려졌다. 한수원-Centrus 농축 투자 MOU(2025-08).", "tag": "추정"}, {"h": "포스코인터내셔널", "p": "Centrus HALEU 오프테이크 트레이딩, 우라늄 트레이딩. 3단계 협력 시나리오(북미·유럽 대형원전 → 북미 SMR → 우라늄 시장)의 연료 쪽 연결점이다."}, {"h": "한전원자력연료(비상장)", "p": "APR1400 연료 성형가공. HALEU 연료 제조 협력 여지가 팩트시트(민간 농축·재처리 절차 지지) 이후 거론된다."}, {"h": "후행 주기", "p": "세아베스틸지주(CASK 소재), 한국원자력연구원(파이로프로세싱 R&D, 비상장 기관). 재처리 포함 토탈패키지는 로사톰의 신흥국 수주 모델이다."}], "cols": 2}]}]}, "supply": {"title": "공급망·주기기 지도", "h2": "공급망·주기기 지도 — 누가 무엇을 만드나", "en": "Supply Chain Map", "lede": "원전 한 기에는 단조강 4,000톤 이상, 단조품 200개 이상이 들어간다. 그중 **원자로압력용기·증기발생기 같은 압력경계 기기는 전 세계 5~6개국만 만들 수 있고**, 러·중을 빼면 미국·유럽이 실제로 쓸 수 있는 주기기 CAPA는 연 15기 수준이다. 이 탭은 발전소를 기기 단위로 쪼개 누가 만드는지 지도로 그리고, 진입장벽 구조와 WH 연합·팀코리아의 수익 구조 차이, 국내 상장사 매핑까지 정리한다.", "sections" "/><text x=\"873\" y=\"176.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">전력 케이블<\/text><text x=\"873\" y=\"192.6\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">대한전선·일진<\/text><rect x=\"514\" y=\"226\" width=\"426\" height=\"46\" rx=\"8\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"727\" y=\"253.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">시공 EPC — 현대건설·삼성물산·대우건설 / Bechtel<\/text><rect x=\"12\" y=\"300\" width=\"300\" height=\"62\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"162\" y=\"318.25\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">설계<\/text><text x=\"162\" y=\"335.5\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">APR: 한수원·한전기술 / AP: WH<\/text><text x=\"162\" y=\"352.75\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">AP1000 종합설계 외주 가능성<\/text><rect x=\"330\" y=\"300\" width=\"300\" height=\"62\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"480\" y=\"326.875\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">핵연료<\/text><text x=\"480\" y=\"344.125\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">APR: 한전원자력연료 / AP: WH<\/text><rect x=\"648\" y=\"300\" width=\"300\" height=\"62\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"798\" y=\"326.875\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">정비·시운전<\/text><text x=\"798\" y=\"344.125\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">한전KPS · 일진파워 · 우진엔텍<\/text><text x=\"480\" y=\"22\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.75\">강조 테두리 = 원전 사업비 비중이 큰 주기기(사업비의 20~30%)<\/text><\/svg>", "cap": "**결론: 한국은 원자로 건물(주기기·계측제어)부터 터빈 건물(T/G·복수기·변압기·케이블), 설계·연료·정비까지 공급망 전 칸에 상장사가 있는 드문 나라다. 다만 AP1000에서는 RCP(Curtiss-Wright)·T/G(도시바·GE)·I&C(Emerson)가 미국·일본 몫이라 노형에 따라 칸이 비는 곳이 생긴다.** 강조 테두리는 사업비 비중이 큰 주기기(사업 style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"288\" y=\"301\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"600\">연 5세트<\/text><rect x=\"676\" y=\"216\" width=\"268\" height=\"96\" rx=\"8\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"810\" y=\"243.48\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">수요 측 압력<\/text><text x=\"810\" y=\"260.04\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">2050 목표 → 연 30~34GW 신규 필요<\/text><text x=\"810\" y=\"276.6\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">최근 5년 착공 연 5~10기<\/text><text x=\"810\" y=\"293.16\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">→ 기존 업체 증설로 대응될 가능성<\/text><\/svg>", "cap": "**결론: 대형 프레스(설비)·원자력 인증(기술)·제작 레퍼런스라는 3중 장벽 때문에, 원전 수요 확대는 경쟁 심화가 아니라 기존 소수 공급자의 가격·조건 협상력 강화로 이어진다.** 두산의 1.7만톤 프레스 설치에만 3년이 걸렸고, 미국이 초대형 단조 설비를 새로 갖추려면 최소 10년과 10기 이상 발주가 필요하다는 분석이다. 2050 목표에 필요한 연 30~34GW 착공 대비 실질 CAPA가 부족할수록 장납기 품목 선발주와 가격 협상력이 커진다."}, {"t": "table", "cols": ["국가/기업", "주기기 제작", "단조 CAPA", "비고"], "rows": [["한국(두산에너빌리티)", "가능", "13,000·17,000톤 프레스, 최대 잉곳 540톤", "팀코리아·WH 양쪽 공급, 연 5세트"], ["일본(MHI·Toshiba / JSW)", "제한적", "JSW 14,000톤 2기·최대 650톤 잉곳(단조 전문)", "후쿠시마 이후 제작 공백"], ["중국(SEC·CFHI·DEC)", "가능(5~6기)", "국영기업 산하", "자국 우선, 수출 제한"], ["러시아(AEM-Atommash)", "가능", "12,000·15,000톤", "유럽향 수출 사실상 불가"], ["프랑스(Framatome/Le Creusot)", "가능", "11,300·9,000톤", "EDF 물량 위주"], ["인도(L&T·BHEL)", "일부 품목", "자체 CAPA", "NPCIL 중심"]], "title": "글로벌 원전 기자재·단조 CAPA", "note": "원출처 각 사, WNA, 업계 자료 종합. 두산 연 5세트는 업계 추정"}, {"t": "p", "text": "① 설비투자 장벽. 용접 개소를 줄이려 기자재는 최대한 일체형·대형화된다. RPV는 70~100톤급 단조품 약 7개로 구성되고 터빈 샤프트는 약 200톤 일체형이다. 100톤급 잉곳엔 1만톤, 수백 톤급엔 1.5만톤 이상 프레스가 필요한데, 1.5만톤급을 가진 나라는 한국·일본·중국·러시아·인도 정도다. 두산의 1.7만톤 프레스 설치에만 3년이 걸렸고, 미국이 초대형 단조 설비를 새로 갖추려면 최소 10년과 10기 이상의 발주 물량이 필요하다는 분석이다."}, {"t": "p", "text": "② 기술·노하우 장벽. 단조는 업체·노형·프로젝트마다 설계가 달라지는 다품종 소량생산이라 정형화가 어렵다. ASME N-stamp 같은 시설 단위 원자력 인증이 필요하고, 미국에서는 인증 업체 수 자체가 줄어 '인증 품질로 일정 내 생산 가능한 물량'이 제약이다."}]}, {"h": "미국이 못 만드는 것 — 병목은 대형 압력경계 기기", "blocks": [{"t": "table", "cols": ["부품", "미국 내 역량", "주요 공급 기업"], "rows": [["RPV(대형, AP1000급)", "해외 의존(일본·한국·이탈리아)", "두산에너빌리티, 일본제강소"], ["RPV(SMR급)", "다수 미국 기업 가능", "North American Forgemasters, BWXT, 두산"], ["증기발생기/가압기", "일부 역량, 대개 해외 의존", "BWXT, Holtec, 두산, Framatome"], ["증기터빈 발전기", "대부분 독일·프랑스 조달", "Siemens Energy, Framatome"], ["발전소 주변압기", "상당, 해외 조달 가능", "GE Vernova, Siemens Energy, ABB"], ["열교환기", "특정 시설로 제한", "BWXT, SPX Technologies"], ["대구경 밸브·펌프", "다수 미국 기업 가능", "Crane, Curtiss-Wright, Flowserve"]], "title": "미국 원전 핵심 기자재의 자국 생산 역량", "note": "원출처 Nuclear Scaling Initiative, 에너지경제연구원"}, {"t": "callout", "text": "AP1000급 대형 RPV는 미국 내 생산이 불가능해 일본·한국·이탈리아에 의존하고, 증기터빈발전기는 주로 독일·프랑스에서 조달한다. 반면 SMR급 RPV와 대구경 밸브·펌프는 미국 업체도 가능하다. 즉 **미국 원전 재건에서 한국 기자재의 협상력은 대형원전일수록 크고, SMR에서는 상대적으로 작다.** 미국 가동 AP1000 6기 중 4기(건설 중단 VC Summer 포함 8기 중 6기)에 한국 업체 주기기가 들어갔다.", "title": "대형원전일수록 한국 기자재의 자리가 크다"}]}, {"h": "WH 연합 vs 팀코리아 — 같은 원전, 다른 수익 구조", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 372\" role=\"img\" aria-label=\"같은 원전이라도 WH 연합에서는 한국 기업이 벤더로 일부만 맡고, 팀코리아에서는 설계·주기기·시공·정비를 모두 가져간다\"><defs><marker id=\"a-mdl1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-mdl1-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--accent)\"/><\/marker><marker id=\"a-mdl1-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--ok)\"/><\/marker><marker id=\"a-mdl1-warn\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 \" opacity=\"0.78\">두산 기당 2~3조<\/text><rect x=\"728\" y=\"202\" width=\"104\" height=\"50\" rx=\"8\" fill=\"var(--surface)\" style=\"stroke:var(--accent)\" stroke-width=\"1.6\"/><text x=\"780\" y=\"223.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">시공<\/text><text x=\"780\" y=\"239.6\" font-size=\"10\" text-anchor=\"middle\" opacity=\"0.78\">EPC의 30~40%<\/text><rect x=\"838\" y=\"202\" width=\"104\" height=\"50\" rx=\"8\" fill=\"var(--surface)\" style=\"stroke:var(--accent)\" stroke-width=\"1.6\"/><text x=\"890\" y=\"223.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">정비<\/text><text x=\"890\" y=\"239.6\" font-size=\"10\" text-anchor=\"middle\" opacity=\"0.78\">한전KPS<\/text><path d=\"M720 166 L720 184\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\"/><path d=\"M560 184 L890 184\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\"/><path d=\"M560 184 L560 202\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-mdl1)\"/><path d=\"M670 184 L670 202\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-mdl1)\"/><path d=\"M780 184 L780 202\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-mdl1)\"/><path d=\"M890 184 L890 202\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-mdl1)\"/><rect x=\"508\" y=\"270\" width=\"434\" height=\"78\" rx=\"8\" style=\"fill:var(--ok);fill-opacity:.10;stroke:var(--ok)\" stroke-width=\"1.3\"/><text x=\"725\" y=\"296.25\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">중위험·안정수익<\/text><text x=\"725\" y=\"313.5\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">리스크가 팀 안에서 분산, 에스컬레이션 조항 기대<\/text><text x=\"725\" y=\"330.75\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">수출 가능 지역은 WH 합의로 제한(북미·EU 대부분 불가)<\/text><\/svg>", "cap": "**결론: 주계약자가 누구냐에 따라 한국 기업의 몫이 달라진다. WH 연합에서 두산은 RPV·SG 위주로 기당 4~5천억원, 팀코리아에서는 전 품목으로 기당 2~3조원을 가져간다.** 건설사는 반대로 WH 연합에서 EPC 금액의 50~55%를 맡아 몫이 크지만, LSTK라면 원가 충격을 단독 흡수해야 한다. 팀코리아는 몫은 30~40%로 작지만 리스크가 블록 안에서 분산된다. 양쪽 공급망에 모두 참여하는 업체(두산·현대건설)가 WH 지재권 합의 이후 상대적으로 유리해졌다."}, {"t": "table", "cols": ["항목", "WH 연합(AP1000)", "팀코리아(APR1400/1000)"], "rows": [["주계약·통제", "WH가 라이선스·인허가·설계 통제", "한수원 주계약, 국내 기업 분할 배분"], ["건설사 몫", "EPC 금액의 50~55%", "EPC 금액의 30~40%"], ["리스크", "고위험·고수익(리스크공유형 논의 중)", "중위험·안정수익(에스컬레이션 기대)"], ["두산 주기기", "RPV·SG 위주, 기당 4~5천억원(1조원 가정도 존재)", "전 품목, 기당 2~3조원"], ["한전기술", "종합설계 일부 외주 가능성", "종합설계+원자로계통설계"], ["RCP·T/G", "Curtiss-Wright·도시바/GE", "두산"], ["I&C", "Emerson·Honeywell", "한전기술·국산 MMIS"], ["대표 사례", "Vogtle, Kozloduy 7·8, Fermi Matador", "바라카 1~4, 두코바니 5·6"]], "note": "원출처 언론보도, 업계 추정. 두산 AP1000 기당 1.0조원 가정은 미확인"}, {"t": "p", "text": "현대건설은 양쪽에 모두 발을 걸친 유일한 국내 EPC로 평가된다(한수원 APR1400 국내·중동, WH AP1000 불가리아 FEED·Fermi FEED, Holtec SMR-300). 삼성물산은 NuScale·GVH SMR과 루마니아, 대우건설은 두코바니 시공 주간사로 팀코리아 쪽 무게가 크다."}]}, {"h": "국내 상장사 매핑 — 칸별 기업과 매출이 나는 시점", "blocks": [{"t": "table", "cols": ["밸류체인 칸", "국내 기업(상장 위주)", "매출 인식 시점", "먼저 확인할 것"], "rows": [["설계(AE·NSSS)", "한전기술", "착공 약 3.3년 전부터 초중반", "노형(APR이면 계통+종합, AP면 종합 일부), 동시 수행 인력 CAPA"], ["주기기·단조", "두산에너빌리티, 태웅(소재), 세아베스틸지주(특수강·CASK)", "착공 전 LLI 선발주 → 제작 5~7년", "WH향 vs 팀코리아향 범위, SMR 모듈 확정 계약 전환"], ["보조기기(BOP)", "비에이치아이, 에너지엔(비상장)", "착공 후 1~4년 발주", "ASME N·NPT 인증, 팀코리아·WH 양쪽 벤더 등록"], ["계측제어(I&C)", "우진(ICI), 우리기술(DCS), 한전기술(MMIS)", "신규 + 2~5년 교체 반복", "교체 대상 원전 수, SMR 탑재 여부(모듈당 ICI 12개)"], ["전기설비", "HD현대일렉트릭, 효성중공업, LS ELECTRIC, 일진전기, 대한전선", "착공 후 중후반", "원전용 Q-Class 인증(HD현대일렉 국내 최초), 초고압 변압기 슬롯"], ["시공·EPC·PM", "현대건설, 삼성물산, 대우건설, DL이앤씨, GS건설, 한미글로벌(PM)", "착공 후 S커브(3~5년차 급증)", "계약 구조(LSTK vs Cost-plus), 컨소시엄 지분율, 전문인력"], ["정비·LTO·해체", "한전KPS, 일진파워, 우진엔텍, 금양그린파워", "시운전 이후 40~60년", "반복계약 비중(한전KPS 약 72%), 해외 LTO 수주"], ["연료", "포스코인터내셔널(트레이딩), 한전원자력연료(비상장)", "장기계약", "HALEU 오프테이크, 협정 개정"], ["유틸리티·디벨로퍼", "한국전력(한수원 100%·한전기술 53%·한전KPS 51%)", "요금·이용률 / SPC 지분", "원가가산 여부, 지분 규모"], ["SMR 투자·파트너", "SK㈜·SK이노베이션(TerraPower), DL이앤씨(X-energy), 삼성물산(NuScale·GVH), 현대건설(Holtec)", "파트너 FOAK 착공 이후", "MOU·지분투자 → 확정 EPC 전환 여부"]], "note": "회사별 상세는 15 커버리지 유니버스. 사실 기반 매핑이며 추천이 아니다"}, {"t": "bullets", "items": ["착공 후 1~4년 순차 발주", "BOP 1기당 약 1~1.5천억원(업계 추정)", "ICI: APR1400 약 60개 vs NuScale 모듈당 12개", "우진: 교체 대상 원전 15기 → 2028년 18~20기, 신한울 3·4 ICI 신규 납품 2028년 개시", "미·일 원전 협력 강화는 리스크이지만, 도시바·GE-Hitachi·MHI와 장기 협력 이력이 있는 국내 중소형 벤더에는 기회가 될 수 있다는 시각도 있다(비에이치아이는 도시바와 협력해 Vogtle 복수기 납품)."]}]}]}, "econ": {"title": "경제성·수주 읽기", "h2": "원전 경제성·수주 뉴스 읽기", "en": "Reading the Economics", "lede": "원전은 **연료비는 싸고 건설비는 비싼** 발전원이다. 가동 원전의 한계비용은 30~38달러/MWh에 불과하지만 신규 원전 발전원가의 약 72%가 투자비라서, 경제성은 '얼마나 싸게 빌려 얼마나 빨리 짓느냐'로 결정된다. 그래서 원전 뉴스는 기술 용어보다 **금융·공기·계약 구조**로 읽어야 한다. 이 탭은 임상 데이터를 읽는 순서처럼 원전 수주 뉴스를 읽는 6단계, 핵심 공식, 지표 사전, 자주 나오는 오독을 정리한다.", "sections": [{"h": "원전 뉴스를 읽는 순서 6단계", "blocks": [{"t": "steps", "items": [{"h": "무엇이 체결됐나 — 문서의 단계", "meta": ["MOU·LOI", "FEED", "EPC 본계약", "FID"], "p": "MOU·LOI는 구속력이 없고, FEED(기본설계)는 1~2년짜리 준비 용역이며, EPC 본계약과 발주처의 FID(최종투자결정)가 있어야 수주잔고가 된다. 2026-09 현재 미국 대형원전 FID는 0이다.", "chk": "'최대 N기', '최대 N GW' 표현은 상한이지 확정 물량이 아니다."}, {"h": "노형과 주계약자", "meta": ["AP1000 vs APR1400", "WH vs 한수원"], "p": "노형이 한국 기업의 공급 범위를 정한다. AP1000이면 설계·RCP·T/G·I&C가 미국·일본 몫이고, APR1400이면 설계·주기기 전 품목·정비가 한국 몫이다.", "chk": "대미투자 원전 프로젝트는 노형과 한국 기업 역할(주계약 vs 벤더)이 아직 미확정이다."}, {"h": "금액의 기준", "meta": ["OCC vs 총사업비", "1기 vs 2기", "환율 가정"], "p": "건설비가 금융비용을 뺀 OCC인지 IDC 포함 총사업비인지, 1기인지 2기인지, 달러/kW인지 억원/MW인지 확인한다. 일부 추정은 환율 1,400~1,500원/달러나 체코 단가(9,285달러/kW)를 전용한 가정을 쓰기도 한다.", "chk": "Vogtle 3·4 사업비는 140→300억달러+와 130→350억달러로 집계가 갈린다."}, {"h": "우리 기업의 몫", "meta": ["시공 33%", "주기기 22~23%", "설계 5~6%", "정비 약 2%"], "p": "총액에 배분 비율과 컨소시엄 지분율을 곱해야 기업 매출이 된다. WH 연합이면 건설사 몫이 EPC의 50~55%, 팀코리아면 30~40%다.", "chk": "두산 AP1000 주기기 기당 4~5천억원 vs 1.0조원처럼 가정 차이가 두 배 이상인 경우가 많다."}, {"h": "인식 시점", "meta": ["설계: 착공 전", "주기기: 5~7년", "EPC: S커브", "정비: 상업운전 후"], "p": "같은 수주도 밸류체인 위치에 따라 매출 인식이 5~10년 차이 난다. 공모 기준연도 실적과 미래 이익의 정합성을 볼 때 가장 먼저 확인할 항목이다.", "chk": "13 밸류에이션 탭의 수주-매출 시차 도식 참고."}, {"h": "계약 구조와 리스크", "meta": ["LSTK vs Cost-plus", "에스컬레이션"], "p": "원전 비용초과 확률은 90%+, 초과 시 평균 100% 이상이다. 확정총액(LSTK)이면 원가 초과를 EPC가 떠안고, 원가가산이면 발주처가 부담한다.", "chk": "한전은 바라카 손실 경험 이후 미국 참여 시 원가가산 구조를 전제로 한다."}]}]}, {"h": "공기가 곧 원가 — OCC와 IDC", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 312\" role=\"img\" aria-label=\"공기가 5년에서 10년으로 늘면 건설중이자 비중이 18.7%에서 32.4%로 뛰어, 원전 경쟁력은 기술보다 약속한 공기를 지키는 능력에서 나온다\"><defs><marker id=\"a-idc1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-idc1-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--accent)\"/><\/marker><marker id=\"a-idc1-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--ok)\"/><\/marker><marker id=\"a-idc1-warn\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--warn)\"/><\/marker><marker id=\"a-idc1-alert\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--alert)\"/><\/marker><\/defs><text x=\"16\" y=\"26\" font-size=\"12.5\" text-anchor=\"start\" font-weight=\"600\">총 건설비 = OCC(순수 건설비) + IDC(건설중이자) — 자본비용 7% 가정<\/text><text x=\"188\" y=\"70\" font-size=\"12.5\" text-anchor=\"end\" font-weight=\"600\">공기 5년<\/text><rect x=\"200\" y=\"44\" width=\"567.1\" height=\"40\" rx=\"3\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"484.55\" y=\"69\" font-size=\"12\" text-anchor=\"middle\">OCC 81.3%<\/text><rect x=\"769.1\" y=\"44\" width=\"130.9\" height=\"40\" rx=\"3\" style=\"fill:var(--alert);fill-opacity:.10;stroke:var(--alert)\" stroke-width=\"1.3\"/><text x=\"834.55\" y=\"69\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">IDC 18.7%<\/text><text x=\"188\" y=\"128\" font-size=\"12.5\" text-anchor=\"end\" font-weight=\"600\">공기 10년<\/text><rect x=\"200\" y=\"102\" width=\"471.2\" height=\"40\" rx=\"3\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"436.6\" y=\"127\" font-size=\"12\" text-anchor=\"middle\">OCC 67.6%<\/text><rect x=\"673.2\" y=\"102\" width=\"226.8\" height=\"40\" rx=\"3\" style=\"fill:var(--alert);fill-opacity:.10;stroke:var(--alert)\" stroke-width=\"1.3\"/><text x=\"786.6\" y=\"127\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">IDC 32.4%<\/text><path d=\"M769.1 86 L673.2 102\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--alert)\" marker-end=\"url(#a-idc1-alert)\"/><rect x=\"589.2\" y=\"86\" width=\"47.8\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"634\" y=\"97\" font-size=\"11\" text-anchor=\"end\" style=\"fill:var(--alert)\">+13.7%p<\/text><text x=\"16\" y=\"196\" font-size=\"12.5\" text-anchor=\"start\" font-weight=\"600\">신규 원전 LCOE 구성 — 자본비용이 약 3분의 2<\/text><rect x=\"200\" y=\"212\" width=\"327\" height=\"40\" rx=\"3\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"364.5\" y=\"237\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">자본 환급 47%<\/text><rect x=\"529\" y=\"212\" width=\"138\" height=\"40\" rx=\"3\" style=\"fill:var(--alert);fill-opacity:.10;stroke:var(--alert)\" stroke-width=\"1.3\"/><text x=\"599\" y=\"237\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">건설중이자 20%<\/text><rect x=\"669\" y=\"212\" width=\"229\" height=\"40\" rx=\"3\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"784.5\" y=\"237\" font-size=\"12\" text-anchor=\"middle\">O&amp;M·연료 등 33%<\/text><text x=\"188\" y=\"237\" font-size=\"12.5\" text-anchor=\"end\" font-weight=\"600\">LCOE<\/text><text x=\"480\" y=\"290\" font-size=\"11.5\" text-anchor=\"middle\" opacity=\"0.85\">자본비용 5%→10%면 LCOE 2배 이상 · Vogtle 3·4는 7년 지연으로 사업비 2배 이상<\/text><\/svg>", "cap": "**결론: 공기가 5년에서 10년으로 늘면 건설중이자(IDC) 비중이 18.7%에서 32.4%로 뛰고, 자본비용이 5%에서 10%로 오르면 원전 LCOE는 2배 이상이 된다.** 원전 비용의 약 3분의 2가 자본환급과 건설중이자라서, 원전 EPC의 경쟁력은 기술보다 '약속한 공기 안에 끝내는 능력(On time, On budget)'으로 평가된다. 최근 연속 건설 레퍼런스가 가장 중요한 자격 증빙인 이유다."}, {"t": "mods", "open": 1, "items": [{"name": "균등화발전원가(LCOE)와 자본비용 지배 구조", "lede": "LCOE는 설비 수명 전체 비용의 현재가치를 총발전량으로 나눈 값이다. 원전은 초기 투자비가 압도적이고 연료비 비중이 작아 할인율(r)과 공기에 극도로 민감하다. 반대로 한 번 지어지면 부하율 90%대로 싸게 돌아가 가동 10년 후 LCOE는 절반 수준까지 떨어진다(IEA 71.2→36.0달러/MWh). 그래서 기존 원전의 재가동·수명연장이 신규 건설보다 먼저 경제성을 인정받는다.", "formula": "LCOE = Σ(건설비+운영비+연료비+해체비)_t/(1+r)^t ÷ Σ발전량_t/(1+r)^t  |  원전 비용 구성 ≈ 자본환급 47% + 건설중이자 20% + O&M·연료 나머지", "fields": [{"k": "민감도", "v": "자본비용 5%→10%로 오르면 원전 LCOE는 2배 이상. 공기 5년→10년이면 IDC 비중 약 18.7%→32.4%(자본비용 7% 가정)."}, {"k": "숫자 사례", "v": "Lazard 원전 LCOE 79~220달러/MWh vs 가동 원전 한계비용 30~38달러/MWh(2025). IEA 글로벌 평균 신규 원전 90, 재가동 60달러/MWh. EIA 2031년 신규 원전 LCOE(PTC 포함) 88달러, PTC 제외 환산 약 120달러/MWh(업계 추정). MS-Constellation TMI 재가동 PPA 110~120달러/MWh(언론)."}]}, {"name": "OCC와 IDC: 공기가 곧 원가", "lede": "OCC는 '하룻밤에 짓는다고 가정한' 건설 단가(달러/kW)이고, IDC는 공사 기간 동안 쌓이는 이자다. 공기가 늘면 IDC가 비선형으로 불어나 총 건설비의 12~54%(평균 약 46%)까지 커진다. 그래서 원전 EPC의 경쟁력은 기술보다 '약속한 공기 안에 끝내는 능력(On time, On budget)'으로 평가되고, 최근 연속 건설 레퍼런스가 가장 중요한 자격 증빙이 된다.", "formula": "총 건설비 = OCC(Overnight Construction Cost, 금융비용 제외 순수 건설비) + IDC(Interest During Construction)  |  IDC ≈ OCC × 자본비용 × 공기 × 투입 곡선", "fields": [{"k": "민감도", "v": "Vogtle 3·4처럼 7년 지연되면 사업비가 2배 이상. 반대로 NRC가 인허가 기한을 강제하면(자본비용 7% 가정) kW당 최대 800달러 상승 억제(AEI)."}, {"k": "숫자 사례", "v": "한국 원전 건설 역사 전반의 OCC 절감률 약 50%(Lovering et al. 2016). 신한울 1·2 건설단가 2,587달러/kW, 중국 산먼 1·2 3,154달러/kW(IAEA PRIS). 건설비 억원/MW: 신월성 1·2 37, 신고리 5·6 44, 바라카 약 76, Olkiluoto 3 약 112, Flamanville 3 136, Vogtle 3·4 205(업계 추정)."}]}]}]}, {"h": "반복해야 싸진다 — FOAK에서 NOAK으로", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 352\" role=\"img\" aria-label=\"미국 FOAK 추정 단가는 한국·중국이 반복 건설로 달성한 실적의 2~4배이며, 같은 설계를 반복해야만 NOAK 단가로 내려온다\"><defs><marker id=\"a-lrn1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-lrn1-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--accent)\"/><\/marker><marker id=\"a-lrn1-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--ok)\"/><\/marker><marker id=\"a-lrn1-warn\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--warn)\"/><\/marker><marker id=\"a-lrn1-alert\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--alert)\"/><\/marker><\/defs><path d=\"M100 290 L900 290\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.4\"/><path d=\"M100 290 L100 34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.4\"/><text x=\"92\" y=\"294\" font-size=\"10.5\" text-anchor=\"end\" opacity=\"0.7\">0<\/text><text x=\"92\" y=\"244\" font-size=\"10.5\" text-anchor=\"end\" opacity=\"0.7\">2,000<\/text><path d=\"M100 240 L900 240\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"92\" y=\"194\" font-size=\"10.5\" text-anchor=\"end\" opacity=\"0.7\">4,000<\/text><path d=\"M100 190 L900 190\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"92\" y=\"144\" font-size=\"10.5\" text-anchor=\"end\" opacity=\"0.7\">6,000<\/text><path d=\"M100 140 L900 140\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"92\" y=\"94\" font-size=\"10.5\" text-anchor=\"end\" opacity=\"0.7\">8,000<\/text><path d=\"M100 90 L900 90\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"92\" y=\"44\" font-size=\"10.5\" text-anchor=\"end\" opacity=\"0.7\">10,000<\/text><path d=\"M100 40 L900 40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"92\" y=\"24\" font-size=\"11\" text-anchor=\"start\" opacity=\"0.8\">달러/kW<\/text><text x=\"160\" y=\"308\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.75\">1호기<\/text><text x=\"330\" y=\"308\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.75\">2호기<\/text><text x=\"500\" y=\"308\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.75\">4호기<\/text><text x=\"670\" y=\"308\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.75\">8호기<\/text><text x=\"840\" y=\"308\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.75\">16호기<\/text><text x=\"900\" y=\"328\" font-size=\"11\" text-anchor=\"end\" opacity=\"0.75\">같은 설계 반복 건설 순번 (로그 축)<\/text><rect x=\"146\" y=\"40\" width=\"28\" height=\"100\" rx=\"3\" style=\"fill:var(--alert);fill-opacity:.10;stroke:var(--alert)\" stroke-width=\"1.3\"/><rect x=\"179\" y=\"52.5\" width=\"133.6\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"182\" y=\"63.5\" font-size=\"11\" text-anchor=\"start\" style=\"fill:var(--alert)\">DOE FOAK 6,000~10,000<\/text><path d=\"M160 90 C 300 150 520 185 840 202.5\" fill=\"none\" stroke-width=\"2.2\" style=\"stroke:var(--accent)\" stroke-dasharray=\"7 5\"/><rect x=\"477.935\" y=\"143.5\" width=\"164.13\" height=\"14.5\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"560\" y=\"154\" font-size=\"10.5\" text-anchor=\"middle\" style=\"fill:var(--accent)\">개념 곡선(학습효과) — 수치 아님<\/text><path d=\"M100 200 L900 200\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--warn)\" stroke-dasharray=\"5 4\"/><path d=\"M100 211.15 L900 211.15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.5\" stroke-dasharray=\"5 4\"/><path d=\"M100 225.325 L900 225.325\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--ok)\" stroke-dasharray=\"5 4\"/><rect x=\"785.02\" y=\"184\" width=\"117.98\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"900\" y=\"195\" font-size=\"11\" text-anchor=\"end\" style=\"fill:var(--warn)\">DOE NOAK 목표 3,600<\/text><rect x=\"599.98\" y=\"215.15\" width=\"103.02\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"700\" y=\"226.15\" font-size=\"11\" text-anchor=\"end\">중국 산먼 1·2 3,154<\/text><rect x=\"752.02\" y=\"229.325\" width=\"150.98\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"900\" y=\"240.325\" font-size=\"11\" text-anchor=\"end\" style=\"fill:var(--ok)\">한국 신한울 1·2 2,587 (실적)<\/text><rect x=\"372\" y=\"50\" width=\"250\" height=\"56\" rx=\"8\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"497\" y=\"74.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">Vogtle 4호기<\/text><text x=\"497\" y=\"90.6\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">3호기 대비 공정효율 +30% · 비용 −20%<\/text><path d=\"M420 106 L336 137.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-lrn1)\"/><rect x=\"680\" y=\"50\" width=\"216\" height=\"56\" rx=\"8\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"788\" y=\"74.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">AEI 제언<\/text><text x=\"788\" y=\"90.6\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">10번째 단계 FOAK 대비 최대 −40%<\/text><\/svg>", "cap": "**결론: DOE가 제시한 미국 FOAK 단가(6,000~10,000달러/kW)는 한국 신한울 1·2 실적(2,587달러/kW)의 2~4배이며, 같은 설계를 끊김 없이 반복한 나라만 비용을 낮췄다.** 학습효과는 산업 전체가 아니라 특정 기업·특정 설계 단위로 작동한다. 노형이 5개 이상 난립한 미국은 학습이 쌓이지 않았고(역학습), Vogtle 4호기가 3호기 대비 비용 20% 절감으로 반복의 효과를 증명했다. 누가 가장 비싼 첫 호기를 사느냐(다섯 번째 고객 문제)가 발주 교착의 본질이다."}, {"t": "mods", "items": [{"name": "FOAK→NOAK 학습곡선과 Fleet 경제학", "lede": "같은 설계를 반복하면 설계 변경·재작업이 사라지고 숙련도·벌크 발주 효과가 쌓여 비용과 공기가 줄어든다. 단 학습효과는 산업 전체가 아니라 '특정 기업·특정 설계' 단위로 작동하기 때문에, 노형이 5개 이상 난립한 미국은 학습이 쌓이지 않았고(역학습) 단일 표준(OPR1000·APR1400)을 고정한 한국과 CPR-1000을 대량 반복한 중국만 비용을 낮췄다. '누가 가장 비싼 첫 호기를 사느냐(다섯 번째 고객 문제)'가 발주 교착의 본질이고, 그래서 정부 주도로 5~10기를 한 프로그램으로 묶는 Fleet 발주가 해법으로 제시된다.", "formula": "호기당 비용_N ≈ 비용_FOAK × (1 − 학습률)^log2(N)  |  DOE: FOAK 6,000~10,000 → NOAK 3,600달러/kW", "fields": [{"k": "민감도", "v": "Vogtle 4호기는 3호기 대비 공정효율 30% 개선·비용 20% 절감(DOE). BWRX-300 후속호기 30% 절감 목표. TerraPower는 7~8호기 이후 20~30% 절감 기대. AEI: 볼륨 라이선싱으로 10번째 단계에서 FOAK 대비 최대 40%, 5기 묶음 발주로 원자로당 최대 25% 절감."}, {"k": "숫자 사례", "v": "중국 kW당 건설비 6,150→1,540달러(AEI 인용), 2000년대 중후반 2,000~2,500, HPR1000 도입 후 2,500~3,000달러/kWe. OECD/NEA는 6기 이상 반복 건설을 시리즈 효과 조건으로 제시."}]}, {"name": "SMR 경제성 수렴 시나리오", "lede": "SMR은 공장 제작 비중이 높아 대형원전보다 학습효과가 크게 나타날 수 있지만, 지금은 FOAK 단계라 kW당 비용이 대형원전보다 높다. 경제성 판단의 핵심은 몇 호기째에 대형원전 수준으로 수렴하느냐이며, 빅테크는 전력 확보 속도(Time-to-Power)의 기회비용 때문에 초기 고비용을 감수한다.", "formula": "SMR 1GW 환산 투자비_N = FOAK 투자비 × (1 − 학습효과)  vs  대형원전 1GW 평균 13.7조원(2021~2025 가동분)", "fields": [{"k": "민감도", "v": "TerraPower 1호기 1GW 환산 약 17.5조원 → 학습효과 20% 13.6조, 30% 11.9조원(환율 1,500원 가정). 호주 CSIRO 2030년 SMR LCOE 230~382A$/MWh. SMR 발전단가 대형원전 대비 약 1.5배 언급."}, {"k": "숫자 사례", "v": "i-SMR 목표 3,500달러/kWe 이하, 모듈 공기 24개월. NuScale CFPP 목표가 58→89달러/MWh로 올라 취소(2023). 대형원전 호기당 6~10조원 vs SMR 약 3조원(업계 추정)."}]}]}, {"t": "table", "cols": ["구분", "1GW 기준 투자비", "비고"], "rows": [["2021~2025 상업가동 대형원전 평균", "13.7조원", "추가 하락 여지 제한(업계 추정)"], ["TerraPower 실증 #1", "약 17.5조원", "345MW 총 40억달러"], ["TerraPower #7~8(학습효과 20%)", "13.6조원", "가정"], ["TerraPower #7~8(학습효과 30%)", "11.9조원", "가정"]], "title": "SMR은 몇 호기째에 대형원전과 같아지나", "note": "업계 추정, 환율 1,500원/달러 가정"}]}, {"h": "참여사의 돈 — 배분·계약·레버리지·금융", "blocks": [{"t": "mods", "items": [{"name": "해외 원전 1기의 공급망 매출 배분", "lede": "수주 뉴스를 기업별 매출로 번역하는 틀이다. 팀코리아 모델에서는 한수원이 주계약자로 전면에 서고 설계·주기기·시공을 국내 기업에 분할 배분한다. WH 모델에서는 WH가 설계·핵심계통을 쥐고 나머지 EPC를 외부 건설사가 맡아 건설사 몫이 EPC 금액의 50~55%로 커지지만 두산의 주기기 범위는 RPV·SG 위주로 줄어든다. 국내 신규 원전은 설계가 착공 약 3.3년 전 발주되고 착공~상업운전은 평균 6.9년이다.", "formula": "총사업비 ≈ 시공(EPC) 33% + 주기기 22~23% + 설계 5~6% + 시운전 정비 약 2% + 기타 37%(바라카 기준)", "fields": [{"k": "민감도", "v": "노형이 APR1400이면 한전기술은 원자로계통설계(기당 약 0.2조)+종합설계(0.6조)를 모두 수행해 AP1000 대비 수주액이 약 2~3배. 두산은 팀코리아향 기당 2~3조원 vs WH향 4,000~5,000억원(일부 추정은 기당 1.0조원까지 상향 — 미확인)."}, {"k": "숫자 사례", "v": "바라카(22.6조원): 현대건설 3.7조, 삼성물산 2.8조, 두산 약 2.5조, 한전기술 약 1.1조, 한전KPS 시운전 정비 약 4,900억원(사업비의 2.2%) 후 연 150억원 장기정비. 두코바니(약 26조원): 두산 5조6,401억원(22%), 한전기술 종합설계 약 1.2조+원자로계통설계 3,735억원(추정치별 1.1~1.6조로 상이)."}]}, {"name": "EPC 계약 구조와 마진", "lede": "원전 비용초과 발생 확률은 90%를 넘고 초과 시 평균 100% 이상(화력·재생 40~60%)이라 계약 구조가 EPC의 생사를 가른다. Vogtle에서 WH는 LSTK 손실로 2017년 파산했고, 팬데믹 원자재 급등(2020~22년 두바이유 +397%, 철광석 +158%) 이후 미국 EPC들은 Cost-plus·리스크 공유형으로 이동했다. 한국전력은 UAE 바라카 손실 경험 때문에 미국 참여 시 원가가산 구조를 전제로 한다.", "formula": "LSTK(확정총액): 이익 = 계약가 − 실제원가 (원가초과 전액 EPC 부담)  |  Cost-plus: 이익 = 실제원가 × 이윤율  |  목표가격: 절감·초과분 공유", "fields": [{"k": "민감도", "v": "해외 도급은 국내 공공공사(GPM 10% 내외)보다 높은 마진 가능(업계 추정). 에스컬레이션 조항 유무가 중위험·안정수익 모델 여부를 결정."}, {"k": "숫자 사례", "v": "한전 해외사업 손실 전(2010~2017) 순이익률 6~7%. 미국 AP1000 2기 순공사비 207억달러 가정(체코 단가 9,285달러/kW 적용) 시 한수원 EPC 약 174억달러(83.9%), 두산 RV·SG 5~6억+T/G 7억달러, 한전기술 종합설계 3.9억달러(업계 추정)."}]}, {"name": "설계사의 영업레버리지", "lede": "원전 설계는 인력 투입형이라 원가의 대부분이 고정 인건비다. 신규 수주가 끊기면 이익률이 한 자릿수로 떨어지고, 여러 프로젝트가 동시에 설계 피크 구간(건설기간 초중반)에 들어서면 이익률이 급등한다. 설계 매출은 통상 계약금액의 5~6%, 약 10년 공사기간 중 초중반에 몰린다.", "formula": "영업이익 = 설계용역 매출 − (인건비 고정비 40~60%+ 비중) → 매출 증가분의 상당 부분이 이익으로 전환", "fields": [{"k": "민감도", "v": "2010~2012년 대형원전 4곳 동시 매출 구간 3년 평균 영업이익률 23% vs 2025E 약 6%."}, {"k": "숫자 사례", "v": "한전기술 2025년 매출 5,188억원(원자력 67%, 원자로 18%, 신사업 15%). 설계인력 2,000명으로 최대 8기 동시 수행(과거), 기존 인력으로 최대 12기 가능 언급. WH 설계인력 4,000~5,000명 vs 필요 프로젝트 20기+ → AP1000 종합설계 외주 가능성(기당 약 0.3조원)."}]}, {"name": "Bankability: 누가 돈을 대느냐", "lede": "원전의 흥망은 기술보다 금융 구조가 결정해 왔다. 1960~80년대 서구 황금기는 수익률 규제(비용초과도 요금으로 8~10% 이윤과 함께 회수)가 원전을 '보증된 현금흐름'으로 만들었기 때문이고, 1990년대 전력자유화(FERC Order 888, 영국 Electricity Act)로 요금 전가가 막히자 원전은 Non-Bankable 자산이 됐다. 2020년대에는 영국 RAB(건설 중 요금 회수), 미국 LPO·EDF 대출, 정부-WH 성과연동 파트너십, Fermi America 같은 시장형 IPO, 빅테크 장기 PPA가 Bankability 복원 시도다.", "formula": "프로젝트 가치 = 장기 확정 현금흐름(요금·PPA·CfD) − 건설 리스크(비용초과·지연) × 리스크 부담 주체  |  RAB: 건설 중 허용수익 = 규제자산 × 허용수익률", "fields": [{"k": "민감도", "v": "초장기 CfD 도입 시 자본조달원가 MWh당 최대 50달러 인하(AEI 제언). DOE 대출이 첫 5~10기에 '거의 확실히' 제공된다는 언급(2026-04) 자체가 FOAK 리스크 흡수 신호."}, {"k": "숫자 사례", "v": "Sizewell C 380억파운드, 영국 정부 지분 44.9%(2025-07 FID). 미 정부-WH: 분배금 175억달러 초과분의 20% 정부 몫, 2029-01 이전 기업가치 300억달러 시 IPO 요구권. EDF: 프로젝트(2기)당 WH·유틸리티 각 5억달러 선출자. 글로벌 인프라펀드 AUM 1.5조달러, dry powder 3,600억달러(Preqin 2024)."}]}]}]}, {"h": "한국전력 이익 방정식 — SMP·요금·원전 이용률", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 340\" role=\"img\" aria-label=\"한전 이익은 LNG가 정하는 SMP와 정부가 정하는 요금의 차이로 결정되며, 가장 싼 원전 전력을 더 많이 살수록 구입단가가 내려간다\"><defs><marker id=\"a-kep1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-kep1-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--accent)\"/><\/marker><marker id=\"a-kep1-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerW ze=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">이익 민감도 (업계 추정, 연간)<\/text><text x=\"767\" y=\"230\" font-size=\"11.5\" text-anchor=\"middle\" opacity=\"0.78\">요금 1% → 약 +9,250억원<\/text><text x=\"767\" y=\"251\" font-size=\"11.5\" text-anchor=\"middle\" opacity=\"0.78\">유가 1% → 약 −1,080억원<\/text><text x=\"767\" y=\"272\" font-size=\"11.5\" text-anchor=\"middle\" opacity=\"0.78\">원전 이용률 1%p → +1,840억~4,600억원(범위 큼)<\/text><text x=\"480\" y=\"330\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.8\">유가 급등기마다 요금 인상이 늦어 대규모 적자(2Q21~2Q23 9개 분기) — 7차례 인상 후 2025년 영업이익 13.5조원<\/text><\/svg>", "cap": "**결론: 한전은 LNG가 정하는 SMP로 사서 정부가 정하는 요금으로 팔기 때문에, 유가 급등기에는 적자가 나고 원전 이용률이 오를수록 구입단가가 내려간다.** 2025년 정산단가는 원자력 79원, LNG 384.6원/kWh로 약 5배 차이다. 유가는 LNG를 거쳐 3~5개월 뒤 SMP에 반영되고 요금 인상은 더 늦다. 원전 이용률 민감도는 추정치별로 1%p당 1,840억~4,600억원으로 범위가 커 단일값 인용을 피한다."}, {"t": "mods", "items": [{"name": "한전 이익 방정식: SMP·요금·원전 이용률", "lede": "한전은 가장 비싼 한계 발전기(대부분 LNG)의 변동비로 결정되는 SMP로 전력을 사고, 정부가 정하는 요금으로 판다. 유가→LNG→SMP로 3~5개월 후행 반영되고 요금 인상은 늦기 때문에 유가 급등기마다 대규모 적자가 난다(2Q21~2Q23 9개 분기 적자). 원전은 정산단가가 가장 싸서(2025년 79원 vs LNG 384.6원/kWh) 이용률이 오를수록 비싼 LNG 구입이 줄어든다.", "formula": "한전 영업이익 ≈ 판매량 × (판매단가 − 구입단가) − 송배전 비용  |  구입단가 ≈ SMP(한계발전기 = 대부분 LNG) × 비중 + 원전·석탄 정산단가", "fields": [{"k": "민감도", "v": "추정치별: 원전 이용률 1%p당 연 영업이익 +1,840억~+4,600억원(범위 큼, 미확인), 요금 1%당 +9,250억원, 유가 1%당 −1,080억원, 유가 1달러당 −1,310억원."}, {"k": "숫자 사례", "v": "7차례 요금 인상으로 평균 판가 108→170원/kWh, 2025년 영업이익 13.5조원. 2026년 1분기 원전 이용률 71.0%·영업이익 3.8조원. 2026년 목표 이용률 89%(한수원) vs 시장 추정 75~85%로 상이."}]}]}]}, {"h": "지표 사전 — 무엇을, 어디서, 어떻게 읽나", "blocks": [{"t": "table", "cols": ["분류", "지표", "정의", "어디서", "최근 수준(자료 기준)", "읽는 법"], "rows": [["정책·인허가", "미국 대형원전 FID 누적 규모", "AP1000 프로젝트별 최종투자결정 금액 누계", "Westinghouse·Cameco 공시, DOE, 유틸리티 IRP", "2026-03 기준 0(발주 구조 준비 단계). 2029-01 이전 800억달러가 정부 지분참여권 발효 조건", "첫 FID(가설상 2027년, 2기 단위)가 나오면 주기기·EPC 수주가 숫자로 인식되기 시작. 지연될수록 정책 목표 신뢰도 하락"], ["정책·인허가", "NRC 인허가 마일스톤", "설계인증(DC)·표준설계승인(SDA)·건설허가(CP)·통합허가(COL)·운영허가 취득 현황", "NR 출자) 충족 여부가 착공 가능성을 가른다"], ["금융", "글로벌 원전주 상대주가·ETF 구성", "OKLO·Centrus·NuScale·Cameco·BWXT 주가, 원자력 ETF 상위 구성 비중", "Bloomberg, 각 ETF", "OKLO YTD +649%, Centrus +500%, 두산 +386%(2025-10). 서구 ETF 상위 우라늄 60~100%(2026-02)", "뉴스 중심 랠리에서 착공·수주 실체 중심으로 요구가 이동하는지, 건설·제작 기업 편입이 늘어나는지"], ["금융", "가스터빈 수주잔고·잔여 슬롯", "GEV·Siemens Energy·MHI 수주잔고와 연도별 납품 가능 슬롯", "각 사 IR", "GEV 2030년까지 잔여 10GW(2026-04), 신규 주문 인도 2030년 이후, 리드타임 5~7년(두산 2~3년)", "가스터빈 병목이 클수록 원전·SMR이 데이터센터 전원으로 앞당겨질 유인"], ["실적·수주", "EPC 재무체력", "자본총계·수주잔고·미회수 비율", "회사 공시", "현대건설 별도 자본 7.1조·잔고 69.7조, 대우건설 자본 3.5조·잔고 50.6조, 삼성물산 별도 자본 29.5조(2025)", "1기 80억~140억달러 프로젝트의 원가 충격을 흡수할 수 있는지"]], "note": "수준은 자료 발행 시점(2025-10~2026-09) 기준"}]}, {"h": "자주 나오는 오독 7가지", "blocks": [{"t": "grid", "items": [{"h": "'MOU = 수주'로 읽는다", "p": "빅테크·SMR 계약 다수가 구속력 없는 협약이다(ENTRA1-TVA 최대 72기, Oklo-Switch 12GW 등). 확정 EPC·주기기 계약, FID가 나와야 잔고가 된다."}, {"h": "미국 400GW를 발주 물량으로 읽는다", "p": "400GW·10기 착공은 행정명령 목표다. 2040년 미국 원전 설치 전망은 약 80GW(대형 12+SMR 57)로 목표에 크게 못 미친다는 추정도 있다."}, {"h": "건설비 기준을 섞는다", "p": "OCC와 총사업비, 1기와 2기, 달러/kW와 억원/MW가 섞이면 두세 배 차이가 난다. 신한울 1·2 2,587달러/kW(OCC)와 Vogtle 205억원/MW(누적 건설비)는 같은 잣대가 아니다."}, {"h": "AP1000 수주도 팀코리아 수혜와 같다고 본다", "p": "노형이 AP1000이면 한전기술 설계·한전KPS 정비·두산 T/G 수혜가 크게 줄어든다. 주기기는 노형 무관 수혜, 설계·정비는 APR 채택 시에만 수혜라는 구분이 필요하다."}, {"h": "수주 금액을 올해 매출로 읽는다", "p": "주기기는 5~7년, EPC는 S커브, 정비는 상업운전 이후 인식된다. 두코바니 착공은 2029년, 5호기 상업운전은 2038년 목표다."}, {"h": "SMR이 대형원전보다 싸다고 본다", "p": "FOAK 단계 SMR은 1GW 환산 약 17.5조원으로 대형원전 평균 13.7조원보다 비싸다. 빅테크는 싸서가 아니라 전력 확보 속도(Time-to-Power) 때문에 초기 고비용을 감수한다."}, {"h": "한 추정의 민감도·단가를 사실로 인용한다", "p": "원전 이용률 1%p 민감도(1,840억~4,600억원), 한수원-WH 기당 대가(1.75억 vs 6.65억달러), 한전KPS 체르나보다(3,500억 vs 4,850억원)처럼 원문 간 수치가 다르다. 범위로 인용한다."}], "numbered": true}]}]}, "reg": {"title": "규제·인허가", "h2": "규제·인허가 — 허가 하나가 주가 이벤트다", "en": "Regulation & Licensing", "lede": "원전은 설계 인증, 건설허가, 운영허가, 계속운전 허가가 모두 **정부 결정**이라, 인허가 마일스톤 하나하나가 수주·착공 시점을 앞당기거나 미룬다. 미국은 NRC 절차를 행정명령(18개월 기한)·ADVANCE Act·Part 53으로 빠르게 고치는 중이고, 한국은 원안위의 계속운전 심사, SMR 특별법, 그리고 한미 원자력협정 개정이 동시에 움직인다. 이 탭은 인허가 경로와 제도 변화, 이벤트가 어느 기업에 어떤 경로로 전달되는지 정리한다.", "sections": [{"h": "NRC 인허가 3경로 — 설계를 먼저 인증받을까, 건설·운영을 따로 받을까", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 372\" role=\"img\" aria-label=\"미국 인허가는 설계를 먼저 인증받느냐, 건설과 운영을 따로 받느냐, 새 기술중립 규칙을 쓰느냐로 경로가 갈리며 각 단계가 주가 이벤트다\"><defs><marker id=\"a-nrc1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-nrc1-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--accent)\"/><\/marker><marker id=\"a-nrc1-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--ok)\"/><\/marker><marker id=\"a-nrc1-warn\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--warn)\"/><\/marker><marker id=\"a-nrc1-alert\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--alert)\"/><\/marker><\/defs><text x=\"480\" y=\"22\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">행정명령: 신규 18개월 · 계속운전 12개월 기한 / ADVANCE Act: 통합허가 25개월 내 결정<\/text><rect x=\"12\" y=\"40\" width=\"158\" height=\"64\" rx=\"8\" fill=\"var(--surface)\" style=\"stroke:var(--accent)\" stroke-width=\"1.6\"/><text x=\"91\" y=\"67.71\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">Part 50<\/text><text x=\"91\" y=\"85.65\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.78\">2단계<\/text><rect x=\"192\" y=\"46\" width=\"172\" height=\"40\" rx=\"8\" style=\"fill:var(--accent);fill-opacity:.12;str cols": ["프로젝트", "경로", "마일스톤(자료 기준)", "국내 연결"], "rows": [["APR1400", "Part 52 DC·SDA", "2018~2019 비미국 노형 최초 인증", "한전기술·한수원"], ["AP1000", "Part 52 DC", "설계인증 2046년까지 연장", "두산·현대건설"], ["NuScale VOYGR", "Part 52 DC·SDA", "DC(50MW)·SDA(77MW) 보유", "두산·삼성물산"], ["TerraPower Natrium", "Part 50 CP", "2026-03-04 건설승인, OL 신청 2027 하반기", "SK·한수원·두산"], ["X-energy Xe-100", "Part 50 CP", "CP 결정 2026년 말 예상", "두산·DL이앤씨"], ["Holtec SMR-300", "Part 50 CP", "CP Part 2 제출 2027 중반", "현대건설"], ["Oklo Aurora", "DOE 실증 → NRC", "2022 COL 반려, 2026-05 PDC 승인", "한수원 제휴"], ["Fermi Matador(AP1000 4기)", "Part 52 COL", "COLA 최종 신청·결과 2026-12 목표", "현대건설(FEED)·한수원·삼성물산"], ["TVA Clinch River BWRX-300", "건설허가 신청", "DOE First Mover", "삼성물산"]], "title": "NRC 인허가 마일스톤 트래커", "note": "원출처 NRC, 각 사. 2026-09 이후 결과는 별도 확인"}]}, {"h": "제도 가속 장치 — 행정명령·ADVANCE Act·Part 53·세액공제", "blocks": [{"t": "table", "cols": ["제도", "시점", "내용", "산업 경로", "상태"], "rows": [["원자력 행정명령 4건(산업기반 재건·NRC 개혁·DOE 시험로·국가안보 첨단로)", "2025-05", "2050년 400GW, 2030년 대형원전 10기 착공·기존 원전 5GW 증강, NRC 신규 인허가 18개월·계속운전 12개월, 시험로 3기 2026-07 임계, 군기지 첨단로(2028-09), 2029년까지 123협정 20건.", "미국 신규 발주 파이프라인 형성의 출발점. 다만 기자재 공급망 복원 정책이 비어 있어 동맹국 EPC·주기기 수요로 연결", "시행"], ["NRC 10 CFR Part 53", "2026-04", "첨단원전·SMR용 기술중립·성능·위험정보 기반 선택형 허가. 공장 연료 장전, 원격 운영, FOAK 허가정보 반복 활용. 최종규칙 2026-03 확정, 4월 말 발효.", "후속 SMR 인허가 기간·비용 대폭 축소, NOAK 반복 건설 유리", "시행"], ["NRC Part 57(마이크로리액터)", "2026-04", "동일설계 다수기 일괄승인, DOE·DoD 실증데이터 활용, 허가 전 일부 공사 허용.", "Oklo·Radiant·Aalo 등 초소형 원자로 업체 직접 수혜", "논의"], ["ADVANCE Act", "2024-07", "인허가 수수료 감면, 선도 프로젝트 지원, 통합허가 25개월 내 결정, OECD 국가 법인 소유 제한 완화, 러·중산 핵연료 제한.", "발주·규제·공급망·금융 조건 동시 개선(단가를 바로 낮추진 않음)", "시행"], ["IRA·OBBBA 원전 세액공제(45U·45Y)", "2025-07", "IRA로 원전 PTC 편입(2022). OBBBA는 풍력·태양광 공제를 단축했지만 원전 45U를 2032년까지 유지, 2032년 착공분까지 10년 PTC, 2033년부터 축소·2035년 이후 착공분 미적용.", "착공 시점에 따라 원전 LCOE 약 30달러/MWh 차이 → 2032년 전 착공 유인", "시행"], ["DOE ARDP·First Mover·Reactor Pilot", "2025-12", "ARDP(2020~)는 TerraPower·X-energy 비용 50% 분담(Kemmerer 최대 20억달러). First Mover로 Palisades·Clinch River 선정(TVA·Holtec 8억달러, Palisades 최대 4억달러). Reactor Pilot 첨단로 3기 2026-07 임계 목표.", "SMR을 R&D에서 '짓는 산업'으로 전환, 국내 파트너 EPC 수주 가시화", "시행"], ["러시아산 우라늄 수입금지법", "2024-05", "러시아산 LEU 수입 전면 금지, 대체 공급원 부족 시 한시 면제. 2028-01 전면 효력.", "러시아산 수입비중 16.5%→3.6%(2020→2024), 캐나다산 대체·서방 농축 증설 유인", "시행"], ["DOE UPRISE(출력증강·재가동)", "2026-03", "기존 원전 출력 증강·폐쇄 원전 재가동으로 2027년 2.5GW, 2029년 5GW 추가. 대출 여력 2,890억달러 활용.", "공급망·운영 역량 유지, 정비·개보수 수요", "시행"]], "note": "원출처 백악관, NRC, DOE, 업계 자료 종합"}, {"t": "callout", "text": "AEI는 인허가 기한 강제화만으로 kW당 최대 800달러(자본비용 7% 가정), 소급 설계변경 제한으로 kW당 680~1,130달러, 착공 전 설계 성숙도 70% 의무화로 kW당 최대 2,500달러와 4년을 줄일 수 있다고 추정했다. 규제는 원가의 일부가 아니라 원가의 구조다.", "title": "규제 개혁은 곧 원가 절감"}]}, {"h": "한국 규제 — 원안위·계속운전·SMR 특별법", "blocks": [{"t": "grid", "items": [{"h": "계속운전 심사", "p": "국내 2030년 전 허가 만료 7기(고리 2~4, 한빛 1·2, 월성 2, 한울 1). 고리 2호기는 2023-04 만료 후 2026-04 재가동, 고리 3·4호기는 2026-12-30 재가동 예정이다. 심사 지연 시 석탄·LNG가 대체해 한전 구입비가 오른다.", "tag": "확인"}, {"h": "SMR 특별법·규제 로드맵", "p": "2026-02 SMR 특별법 통과로 SMR을 국가전략산업으로 규정하고, 2030년까지 위험도·성과기반 인허가 체계를 구축한다. i-SMR은 2026-03 표준설계인가 신청 접수, 2028 인가 목표.", "tag": "확인"}, {"h": "해체 승인", "p": "고리 1호기 2025-06-26 원안위 해체 승인 — 국내 첫 상업 원전 해체. 2037년 완전해체·부지복원 목표.", "tag": "확인"}, {"h": "전력수급기본계획", "p": "11차(2025-02): 대형 2기·SMR 1기, 2038 원전 비중 35.2%. 12차: 초안 10월경·확정 12월 목표, 계속운전 9기·신규 2기 검토.", "tag": "추정"}], "cols": 2}]}, {"h": "한미 원자력협정과 핵잠 — 연료를 어디서 구하느냐의 문제", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 340\" role=\"img\" aria-label=\"핵잠 연료를 어디서 구하느냐가 한미 원자력협정 개정 범위를 정하고, 그 결과가 농축 내재화·재처리·SMR 수출이라는 민간 사업 기회로 이어진다\"><defs><marker id=\"a-k12\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-k12-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--accent)\"/><\/marker><mar acity:.10;stroke:var(--ok)\" stroke-width=\"1.3\"/><text x=\"800\" y=\"292.875\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">i-SMR·해양 SMR<\/text><text x=\"800\" y=\"310.125\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.78\">핵잠 원자로 = 해양 트랙레코드<\/text><path d=\"M480 226 L480 270\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--ok)\" marker-end=\"url(#a-k12-ok)\"/><path d=\"M460 226 L160 270\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--ok)\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-k12-ok)\"/><path d=\"M500 226 L800 270\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--ok)\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-k12-ok)\"/><rect x=\"419.25\" y=\"242.5\" width=\"121.5\" height=\"14.5\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"480\" y=\"253\" font-size=\"10.5\" text-anchor=\"middle\" style=\"fill:var(--ok)\">개정 시 열리는 민간 사업<\/text><\/svg>", "cap": "**결론: 한국형 핵잠의 연료 조달 경로(미국 공급·국내 20% 미만 농축·제3국)가 협정 개정 범위를 정하고, 개정의 부산물로 농축 내재화·재처리 포함 토탈패키지 수출·해양 SMR 트랙레코드라는 민간 사업이 열린다.** 현행 2015년 협정은 20% 이상 농축과 군사 전용을 금지하고 농축·재처리를 건별 승인하는데 승인 사례가 없다. 2025-11 팩트시트가 민간 농축·재처리 절차 지지를 명문화하면서 협상 문이 열렸지만, 실적 반영까지는 시차가 매우 길다."}, {"t": "bullets", "items": ["2025-10 경주 APEC에서 K-SSN 건조 승인, 2025-11 팩트시트에 연료 조달 협력·민간 농축·재처리 절차 지지 명문화", "2026-01-09 범정부 한미원자력협력 TF 출범, 2026-06-02 서울 1차·7월 워싱턴 2차 핵잠 실무협의", "경로: 123협정(평화적 이용) 개정 또는 원자력법 91조 별도협정(군사용) + IAEA 14조 특별안전조치로 NPT 논란 회피", "국내 연결점: 한국전력·한수원(농축·재처리), 한전기술(i-SMR·SMART), 두산에너빌리티(원자로), 포스코인터내셔널(농축 트레이딩), 한화오션·HD현대중공업(선체), 효성중공업(추진전동기)"]}]}, {"h": "이벤트 → 주가 영향 매트릭스", "blocks": [{"t": "table", "cols": ["이벤트", "1차 전달 대상", "전달 경로", "확인할 것"], "rows": [["미국 첫 AP1000 FID", "주기기(두산), EPC(현대건설), 설계(한전기술)", "LLI 발주 → 잔고 전환 → 제작 매출", "노형·SPC 지분, 원가가산 여부, 한국 역할"], ["대미투자 원전 프로젝트 선정", "한국전력·한수원, 팀코리아 전반", "SPC 지분·EPC·벤더 우선권", "노형(AP1000 vs APR1400), 기수, 주계약 여부"], ["NRC 건설허가(SMR)", "파트너 주기기·EPC(두산·DL이앤씨·현대건설·삼성물산)", "착공 → 모듈 주기기 발주", "구속력 있는 PPA·연료 조달 동반 여부"], ["NRC 인허가 반려·지연", "해당 SMR 파트너", "착공 순연 → 매출 이연", "NuScale CFPP·Oklo COL 반려 선례"], ["해외 대형원전 사업자 선정(사우디·체코 테믈린·UAE 후속)", "설계(한전기술) > 주기기 > 시공 > 정비", "설계 즉시 레버리지 → 순차 인식", "경쟁 구도(EDF·WH·Rosatom), 금융 조건"], ["12차 전기본 신규 원전 명시", "한전기술, 두산, BOP·계측 벤더, 한전KPS", "설계 발주 2027~28 → 내수 가시성", "기수·SMR 포함 여부"], ["계속운전 허가·재가동", "한국전력, 한전KPS", "이용률 ↑ → 구입비 ↓, 정비 매출", "재가동 시점, 이용률 목표 89% 대비"], ["한미 협정 개정 진전", "한국전력(한수원), 포스코인터내셔널, 한전기술", "농축 내재화·토탈패키지", "허용 범위(20% 미만 농축, 재처리)"], ["WH 지재권·협력 협정 변경", "팀코리아 전용 vs 양쪽 공급 업체", "수출 가능 지역 변화", "북미·유럽 단독 진출 가능 여부"], ["미국 정책 교체·중간선거", "원전 밸류체인 전반", "정책 연속성 리스크 vs 착공 성과 압박", "2026-11 결과와 에너지 정책 기조"]], "note": "방향·강도는 과거 관찰과 업계 서술 기반의 경로 정리이며, 개별 종목 판단이 아니다"}]}]}, "deep": {"title": "딥다이브 라이브러리", "en": "Deep-Dive Library", "lede": "시장 자료에서 반복해 나온 핵심 논리 19편을 주제별로 묶었다. 각 카드는 **한 문장 결론(리드) → 원리와 숫자 → 비교표 → 요점 → 국내 연결점** 순서다. 처음 공부할 때는 '미국은 왜 못 짓나' → 'Bankability의 50년' → 'Fleet이 건설비를 낮춘다' → '3중 진입장벽' → 'WH 연합 vs 팀코리아' 순서로 읽으면 2025~2026 사이클의 논리가 한 줄로 이어진다.", "sections": [{"h": "미국 원전 재건 — 미국이 왜 못 짓게 됐고, 무엇으로 다시 지으려 하는지 — 발주·금융·유틸리티의 구조", "blocks": [{"t": "mods", "items": [{"name": "미국은 왜 원전을 못 짓게 됐나: 30년 공백과 5가지 구조적 원인", "pill": "2025.10~2026.06", "lede": "세계 최대 원전국 미국의 문제는 수요나 기술이 아니라, 설계·PM·EPC·핵심기자재를 한 체계로 묶어 반복 수행하는 구조가 해체됐다는 데 있다.", "paras": ["미국은 1970~1990년 20년간 90기를 상업가동시킨 원전 강국이었다. 1973~1978년에는 매년 5~8기가 새로 가동됐다. 그러나 1979년 TMI 사고 이후 규제가 강화되고 1970년대 후반 이후 120기 이상의 건설 계획이 취소됐으며, 1996년 Watts Bar 1호기 이후 Vogtle 3호기(2023)까지 약 27년간 신규 원전 가동이 끊겼다. 1978년 이후 착공해 상업운전까지 완료한 원전은 Vogtle 3·4 두 기뿐이다.", "이 공백 동안 밸류체인이 무너졌다. B&W·Combustion Engineering·Bethlehem Steel 등이 원전에서 이탈하거나 파산하며 초대형 단조·압력용기 제작 역량은 일본·한국·유럽으로 넘어갔다. 그 결과 Vogtle 3·4에서도 RPV·SG는 두산에너빌리티, 단조는 일본제강소, 터빈발전기는 도시바, 복수기는 비에이치아이가 공급했다. 사업비는 약 140억달러에서 300억달러 이상(다른 집계는 130억→350억달러)으로 2배 넘게 늘고 7년 이상 지연됐으며, 설계사 Westinghouse는 2017년 파산보호를 신청했다.", "AEI는 원인을 다섯 가지로 정리한다. ① 건설 중 소급규제(Backfitting): 1976~1987년 비용 상승분의 72%가 엔지니어링·규제검토 같은 간접비였다. ② 설계 다양성: 학습곡선은 특정 기업·설계 단위로만 작동하는데 미국은 5개 이상 노형이 혼재했다. ③ 공급망 효율성 부족: 중국은 국산화로 부품을 수입품 대비 약 50% 싸게 조달했다. ④ 기술 복잡성 증가. ⑤ 권한 분산: EDF·한수원·중국 국영사처럼 통합된 조직이 없었다.", "Vogtle 자체의 실패 요인도 같은 그림이다. DOE 분석상 미확정 설계로 착공했고, 시공성 검토·통합 일정계획이 부족했으며, 시공 중 라이선스 수정요청이 약 200건에 달했다. 비경험 하도급의 모듈 제작, 품질통제 붕괴, 숙련인력 부족이 겹쳤다. 다만 4호기는 3호기 대비 공정효율 30% 개선·비용 20% 절감을 기록해, 반복하면 나아진다는 점도 동시에 증명했다.", "결론적으로 미국 원전 부활의 병목은 '돈'보다 '수행 체계'다. 업계는 스리마일 이후 미국 원전의 건설비·공기가 사고 이전 대비 각각 2.8배·2.2배로 늘었다는 연구를 인용하며, 한국이 KSNP로 단일 설계를 고정해 OCC를 약 50% 낮춘 유일한 사례라는 점을 대비시킨다."], "table": {"cols": ["AEI 진단 요인", "내용", "대비 사례"], "rows": [["소급규제(Backfitting)", "건설 중 새 안전요구 소급 적용, 1976~87년 비용 상승분 72%가 간접비", "소급 제한 법제화 시 kW당 680~1,130달러 절감 추정"], ["설계 다양성", "노형 5개+ 혼재로 학습효과 미축적", "한국 KSNP 단일 설계 반복"], ["공급망 효율성", "국산 공급망 부재·재작업", "중국 국산화로 부품 약 50% 저렴"], ["기술 복잡성", "세대 전환 때마다 비용 상승", "일본·한국은 안정적 플랫폼 유지"], ["권한 분산", "다수 공급사·구매자·규제기관", "EDF·한수원·중국 국영사 통합 조직"]]}, "bullets": ["미국 가동 원전 94기, 평균 연령 43.7년(2025, WNISR)", "Vogtle 3·4 사업비 140억→300억달러+(또는 130억→350억달러, 집계 차이), 7년+ 지연", "1978년 이후 착공~가동 완료 2기뿐", "AEI 10대 정책 제언: 인허가 기한 강제, NEPA 패스트트랙, 앵커 발주 5~10기, 설계 성숙도 70% 의무화, 초장기 CfD 등"], "kr": "업계는 공백의 각 칸(설계·주기기·EPC·PM)에 한전기술·두산에너빌리티·현대건설·한미글로벌 등을 대입하며, 한국의 연속 건설 경험과 KOPEC(현 한전기술) 숙련인력 보존이 미국의 벤치마크로 반복 언급된다."}, {"name": "정부주도 Fleet 발주의 설계도: 행정명령 → 800억달러 → EDF → FID", "pill": "2025.05~2026.06", "lede": "아무도 가장 비싼 첫 호기를 사지 않으려는 교착을 정부가 8~10기 묶음 발주와 금융 리스크 인수로 풀려는 것이 2025~2026년 미국 정책의 요체다.", "paras": ["2025년 5월 트럼프 행정부는 원자력 행정명령 4건을 발표했다. 핵심은 2050년 원전 400GW(현재 약 100GW의 4배), 2030년까지 대형원전 10기 착공과 기존 원전 5GW 증강, NRC 신규 인허가 18개월·계속운전 12개월 기한, DOE 시험로 3기 2026년 7월 임계 목표, 군사시설 첨단원자로 배치, 2029년까지 123협정 20건 추진이다. 목표는 거창하지만 원전 기자재 공급망 복원에 대한 구체 정책은 비어 있다는 평가가 따랐다.", "첫 물량은 2025년 10월 28일 미 상무부·Westinghouse·Brookfield·Cameco의 전략적 파트너십이다. 정부가 최소 800억달러 규모 AP1000(8~10기)·AP300 건설에 금융주선·인허가·장납기품목(LTI) 선주문 단기금융을 지원하고, 대가로 분배금 175억달러 초과분의 20%와 2029년 1월 이전 기업가치 300억달러 도달 시 IPO 요구권·지분 매수 워런트를 갖는다. 정부가 규제자를 넘어 성과연동형 투자자가 된 첫 사례이며, 발효 조건(2029-01 이전 누적 800억달러 FID) 자체가 반복 발주를 전제한다.", "2026년 6월에는 DOE 산하 EDF(Energy Dominance Financing)가 175억달러 조건부 대출 약정을 발표했다. 5개 적격 프로젝트(원자로 10기)의 장납기 품목 구매를 지원해 착공을 최대 3년 앞당기겠다는 것인데, 프로젝트(2기)당 WH와 유틸리티가 각 5억달러, 총 10억달러를 먼저 출자해야 한다. WH는 최대 5개 전력회사와 고정가격 장주기 부품 조달 파트너십을 추진하며 7개사와 LOI를 맺었다. 정부가 최대 800억달러로 최대 10기를 직접 보유하는 방안, 첫 5~10기에 DOE 대출이 '거의 확실히' 제공된다는 언급(2026-04)도 나왔다.", "한 추정은 이를 바탕으로 2026년 중 정부·유틸리티·해외 파트너·빅테크가 참여하는 SPC 발주 구조가 만들어지고, 2027년~2029년 1월 사이 AP1000 8~10기(누적 800억달러) FID가 부지당 2기 단위로 순차 진행될 수 있다는 가설을 제시했다(공식 계획 아님). 정부 발주는 목표가 아니라 가격·공기 기준을 만드는 마중물이며, 진짜 목표는 민간이 다시 원전을 선택하는 '산업화' 단계라는 해석이다.", "DOE는 이미 2024년 9월 Commercial Liftoff 보고서에서 단일 노형 5~10기 확정 발주를 상업화 첫 필수 단계로 규정했다. EFI 컨소시엄 3요건(동일 설계 5~10기 구매 확약, 지식 공유, 위험·수익 공유 계약)이 실제 발주 구조에 반영되는지가 점검 틀이다."], "table": {"cols": ["단계", "시점", "내용", "상태(자료 기준)"], "rows": [["행정명령 4건", "2025-05-23", "400GW·10기 착공·NRC 18개월", "시행"], ["DOE Liftoff", "2024-09", "단일 노형 5~10기 확정 발주 필요", "보고서"], ["정부-WH 파트너십", "2025-10-28", "800억달러+, 20% 이익공유, IPO 요구권", "체결"], ["First Mover SMR", "2025-12", "Palisades·Clinch River 선정", "선정"], ["EDF 대출", "2026-06", "175억달러, 10기, 3년 단축", "약정 발표"], ["SPC 구조 구체화", "2026", "정부·유틸리티·해외 파트너·빅테크", "가설"], ["첫 FID", "2027~2029-01", "AP1000 8~10기 순차", "가설"], ["10기 착공 시한", "2030", "행정명령 목표", "목표"]]}, "bullets": ["DOE 추정 상업화 최소 발주: 단일 노형 5~10기", "EDF: 프로젝트당 사전 출자 10억달러가 착공의 관문", "첫 FID는 부지당 2기 단위로 시차를 두고 진행될 가능성", "11월 중간선거(2026) 전 착공 성과 압박 → 첫 삽을 뜰 수행 파트너의 협상력 상승"], "kr": "FID가 시작되면 두산에너빌리티(주기기 LLI), 한전기술(종합설계 외주), 현대건설(EPC), 한국전력(SPC 지분·디벨로퍼)의 수주가 숫자로 인식되기 시작한다는 것이 공통된 시나리오다.", "svg": "<svg viewBox=\"0 0 960 262\" role=\"img\" aria-label=\"미국은 행정명령·800억달러·EDF 대출로 돈의 통로를 깔았지만 SPC와 첫 FID는 아직 가설이며, 이 두 칸이 한국 수주의 관문이다\"><defs><marker id=\"a-flt1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-flt1-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><
