le\" font-weight=\"600\">SPC 구성<\/text><text x=\"166\" y=\"194.65\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.78\">2026 · 정부·유틸리티·해외·빅테크<\/text><rect x=\"330\" y=\"150\" width=\"300\" height=\"62\" rx=\"8\" style=\"fill:var(--warn);fill-opacity:.10;stroke:var(--warn)\" stroke-width=\"1.3\"/><text x=\"480\" y=\"176.71\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">첫 FID (2기 단위)<\/text><text x=\"480\" y=\"194.65\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.78\">2027~2029-01 · 누적 800억<\/text><rect x=\"644\" y=\"150\" width=\"300\" height=\"62\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"794\" y=\"176.71\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">10기 착공<\/text><text x=\"794\" y=\"194.65\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.78\">2030 행정명령 시한<\/text><path d=\"M316 51 L330 51\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-flt1)\"/><path d=\"M630 51 L644 51\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-flt1)\"/><path d=\"M794 82 L794 116 L166 116 L166 150\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-flt1)\"/><rect x=\"343.02\" y=\"101\" width=\"273.96\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"480\" y=\"112\" font-size=\"11\" text-anchor=\"middle\" style=\"fill:var(--warn)\">관문: 프로젝트(2기)당 WH·유틸리티 각 5억달러 선출자<\/text><path d=\"M316 181 L330 181\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--warn)\" marker-end=\"url(#a-flt1-warn)\"/><path d=\"M630 181 L644 181\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-flt1)\"/><text x=\"16\" y=\"246\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--ok)\">■ 시행<\/text><text x=\"90\" y=\"246\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--warn)\">■ 가설(공식 계획 아님)<\/text><text x=\"270\" y=\"246\" font-size=\"11.5\" text-anchor=\"start\" opacity=\"0.85\">□ 목표 — 한국 수혜: 두산 LLI · 한전기술 종합설계 외주 · 현대건설 EPC · 한전 SPC 지분<\/text><\/svg>", "cap": "**결론: 돈의 통로(행정명령·800억달러 파트너십·EDF 175억달러)는 이미 깔렸지만, SPC 구성과 첫 FID는 공식 계획이 아닌 가설이다. 이 두 칸이 한국 수주가 숫자로 바뀌는 관문이다.** EDF는 프로젝트(2기)당 WH·유틸리티가 각 5억달러를 먼저 출자해야 하므로, 누가 이 선출자를 감당하느냐가 첫 FID의 조건이다."}, {"name": "미국 유틸리티는 왜 자본을 안 넣나: SPC·디벨로퍼 공백과 한전의 자리", "pill": "2026.02~2026.09", "lede": "정책 지원이 넘쳐도 Vogtle 트라우마와 비용초과 리스크 분담 장치가 없으면 발주는 없고, 그 빈자리가 한국전력·한수원의 진입로다.", "paras": ["Vogtle 3·4는 7년 지연·2배 비용으로 끝났고 V.C. Summer 2·3은 건설 중 포기됐다. 주 공공서비스위원회(PSC)와 투자자 모두 공기 지연·비용초과를 최대 위험으로 꼽는다. 듀크는 IRP에 2037년 대형원전·SMR을 넣었지만 비용초과 보호장치를 요구하고, AEP는 SMR 조기부지허가(ESP)에만 참여하며, PSEG·서던은 신규 원전에 자기자본 투입 계획이 없다고 선을 긋는다. 넥스트에라는 기존 부지 6GW SMR 가능성을 말하면서도 재무 리스크 최소화를 전제로 한다.", "원전 사업은 발주·자금조달을 맡는 SPC(정부·유틸리티), 설계·조달·시공의 EPC, 원자로 노형 공급사로 나뉜다. 미국은 SPC로 들어올 유틸리티가 FOAK 비용·재무 리스크 때문에 빠지고, EPC를 주도해야 할 WH는 설계는 가능하나 PM 역량이 부족하다. 제작 단계에선 두산 외 원자로 제작사가 제한적이고, 시공은 Vogtle 외 경험이 사실상 전무하며 배관공·용접공 같은 기초인력도 모자란다.", "여기서 '디벨로퍼 모델'이 제안된다. 한국전력이 부지·인허가·자금조달·PM부터 완공까지 총괄하고, 일본은 대미투자 자금(JBIC 등 후순위 채권)으로 LPO와 결합해 민간 선순위 자본을 끌어들이며, 한국 원전산업은 EPC·기자재·설계를 맡는 구도다. 한전은 공기업의 높은 신용등급에 따른 낮은 조달금리를 강점으로, 미국 12기 수행 시 수주잔고 180조원(기당 15조원 이상 가정)이라는 추정까지 나왔다. 다만 업계는 원가가산·리스크 분담 구조가 전제되지 않은 무리한 참여를 경계한다.", "국내 체계도 정리됐다. 2026년 5월 감사원이 한전·한수원 수출 이원화의 중복을 지적한 뒤, 해외 대형원전은 한전(대외협상·지분투자)과 한수원(건설·운영, EPC)이 공동 수행하고 체코·필리핀·i-SMR은 기존 체계를 유지하는 방향으로 개편됐다. 한전은 2,000억달러 대미투자펀드의 미국 원전기업 투자 후보 숏리스트 작업에 착수한 것으로 알려졌다.", "일본은 경쟁자라기보다 자금줄이라는 판단이 우세하다. 일본은 10년 5,500억달러 대미투자 중 전력부문 최대 3,320억달러, AP1000·SMR과 BWRX-300에 각 1,000억달러를 배정했지만, 마지막 신규 원전이 2009년 도마리 3호기이고 MHI 원전 인력은 4,400명으로 사고 전 5,000명에 못 미치며 원자력 기업의 70% 이상이 인력난을 겪는다."], "table": {"cols": ["유틸리티", "입장", "요구 조건"], "rows": [["듀크에너지", "IRP에 2037년 대형원전·SMR 포함, 실행은 신중", "비용초과 보호장치, 리스크 분담"], ["AEP", "인디애나·버지니아 SMR ESP 참여", "자본 보호, 신용지표 안전장치"], ["PSEG", "규제자산 범위 내 협조", "신규 원전 자기자본 투입 계획 없음"], ["서던(조지아파워)", "정책 지지", "추가 투자에는 선을 그음"], ["넥스트에라", "기존 부지 6GW SMR 가능", "재무 리스크 최소화"]]}, "bullets": ["재가동·수명연장: 적극 / 신규 대형원전: 자본 투입 거부", "구도: 자금(일본) + 디벨로퍼(한전) + EPC·기자재·설계(한국)", "한전 해외사업 손실 전(2010~2017) 순이익률 6~7%", "2026-09 한미 대미투자 원전 MOU(최대 8기 논의) 추진 보도 — 구체 사항 미정"], "kr": "한국전력은 PBR-ROE 틀에서 '글로벌 종합 유틸리티' 재평가 논리가 제시되지만, 계약이 원가가산인지·지분 규모가 얼마인지 확인 전까지는 가설이다."}, {"name": "40년 만의 원전 사이클: 수요를 만드는 네 가지 패턴", "pill": "2025.10~2026.05", "lede": "원전 발주 붐은 에너지 안보 위기와 장기 전력수요 성장이라는 두 패턴을 따라 반복돼 왔고, 2020년대에는 AI 데이터센터와 노후 원전 교체 수요가 겹쳐 서구 기준 40년 만의 사이클을 만든다.", "paras": ["패턴 1은 에너지 안보다. 1973년 1차 오일쇼크로 유가가 5개월 만에 3~4배 뛰자 1974~1976년 3년간 119건의 원전이 착공됐고, 프랑스는 Messmer Plan으로 56기를 지었다. 2022년 러-우 전쟁으로 유럽 산업용 전기요금이 2019년 대비 약 65% 오르자 EU가 원자력을 Taxonomy에 넣고 독일마저 반원전 기조를 재검토했다. 2026년 2~3월 미국·이스라엘의 이란 공습과 호르무즈 봉쇄는 에너지 트릴레마의 무게중심을 환경성에서 안보성으로 더 옮겼고, 전쟁 중에도 부셰르·자포리자 원전에서 방사능 유출이 없었다는 점이 '원전의 역설'로 거론됐다.", "패턴 2는 장기 전력수요 성장이다. 2000년대 중국 성장과 PC 보급으로 글로벌 전력수요 성장률이 2.5%(1992~2001)에서 4.2%(2002~2007)로 뛰자 2005~2010년 착공이 늘었다. 2020년대에는 AI 데이터센터가 이 역할을 한다. 2024년 전력수요 성장률 4.4%, 2023~2030년 연평균 3.7%가 전망되고, 데이터센터 전력소비는 2024년 415TWh에서 2030년 1,281TWh(IEA)로 늘 전망이다. 미국 연간 전력소비는 2022년부터 4,000TWh를 넘었다.", "새 패턴은 교체 수요다. 가동 원자로 416기 중 165기(약 40%)가 설계수명 40년을 넘겼고, 수명연장을 하더라도 2045년까지 순차 폐쇄가 불가피하다. 착공~완공이 평균 10년이라 2025~2035년이 발주 적기라는 논리다. 2050년까지 연평균 30~34GW 신규 원전이 필요하다는 추정도 여기서 나온다.", "전망치는 매년 올라가고 있다. IAEA 2050년 전망은 561~992GW(2025-09, 2021년 대비 Low +42%, High +25%), IEA는 650~1,000GW(2022년 대비 약 23% 상향), 국가 목표 반영 시 1,262GW다. IEA는 2035년 원전 설비 전망을 WEO2024 대비 7.4% 올리고 재생은 2.9% 낮췄다. 2024~2050년 원전 누적 투자는 1.7~2.9조달러, 그중 신규 대형원전 61~73%, SMR 17~33%, 수명연장 6~10%다.", "시장의 서사는 '2025년은 기대가 주가를 이끈 해, 2026년은 수주·착공이 현실화되는 해'로 요약된다. 다만 2026년 9월 시점 자료로는 미국 대형원전 FID와 SMR 착공이 여전히 대부분 예정·가설 단계라는 점이 사이클의 검증 과제다."], "table": {"cols": ["패턴", "과거 사례", "2020년대 대응"], "rows": [["에너지 안보", "1973 오일쇼크 → 1974~76 착공 119건", "2022 러-우 전쟁, 2026 호르무즈 봉쇄"], ["장기 전력수요", "2000년대 중국 성장(성장률 4.2%)", "AI 데이터센터(2024 성장률 4.4%)"], ["교체 수요", "-", "40년 초과 165기, 2045년까지 순차 폐쇄"], ["금융 복원", "1960~80년대 수익률 규제", "RAB·LPO·EDF·빅테크 PPA"]]}, "bullets": ["데이터센터 전력: 415TWh(2024) → 1,281TWh(2030E, IEA)", "IAEA 2050 전망 561~992GW, 매년 상향", "2024~2050 원전 투자 1.7~2.9조달러(IEA)", "원전 생애주기 탄소 12gCO2eq/kWh(IPCC), 부하율 92.3%(미국 2024)"], "kr": "세 패턴이 동시에 겹치는 것이 서구 기준 40년 만이라는 점이 국내 원전 밸류체인 리레이팅의 핵심 근거로 쓰였다."}]}]}, {"h": "경제성·금융 — 원전을 짓게 만드는 것은 기술이 아니라 금융과 반복 건설이다", "blocks": [{"t": "mods", "items": [{"name": "원전의 흥망을 가른 것은 기술이 아니라 금융: Bankability의 50년", "pill": "2025.11~2026.06", "lede": "원전은 제도적으로 보증된 현금흐름이 있을 때 지어졌고 없어지자 멈췄다. 2020년대의 변화는 그 보증 장치를 다양한 방식으로 복원하는 과정이다.", "paras": ["1960~1980년대 미국·영국의 원전 황금기는 수익률 규제(Rate-of-Return Regulation) 덕분이었다. 수직통합 독점 유틸리티는 공사비가 오르거나 착공이 늦어져도 요금 인상으로 투자비와 적정 이윤(통상 8~10%)을 회수할 수 있었고, 은행·투자자는 이를 보증된 현금흐름으로 보고 돈을 댔다.", "1990년대 전력 자유화가 이 구조를 깼다. 영국 Electricity Act(1989), 미국 FERC Order 888(1996)로 요금 규제가 사라지고 판매가격이 경쟁시장에 노출되자 비용초과·지연을 요금으로 넘길 수 없게 됐다. 원전은 높은 초기투자·장기회수·정치 리스크 때문에 Non-Bankable 자산으로 재분류됐고 신규 건설은 사실상 중단됐다. 셰일가스 이후 가스가격 급락은 북부 원전의 조기 폐쇄(Vermont Yankee, Palisades 등)까지 불렀다.", "2020년대에는 방식은 달라도 목적이 같은 시도가 동시다발로 나타났다. 영국은 2022년 Nuclear Energy (Financing) Act로 RAB 모델을 도입해 건설 중에도 허용수익으로 비용을 선회수하게 했고, Sizewell C(380억파운드, 정부 지분 44.9%)가 첫 사례다. 미국은 LPO·EDF 대출, 정부-WH 성과연동 파트너십, IRA·OBBBA 원전 세액공제(45U·45Y, 2032년 착공분까지 PTC)로 대응했다. Fermi America는 2025년 10월 나스닥·런던 동시 상장으로 6.8억달러를 조달(상장 후 총 납입자본 약 10억달러)한 시장형 모델이다.", "수요 측에서는 빅테크 PPA가 새로운 보증 장치가 됐다. MS-Constellation TMI 1호기(Crane) 재가동 20년 PPA, Meta-Constellation Clinton 20년 PPA, Amazon-Talen 1.9GW, Meta의 원전 6.5GW 확보 목표 등이 대표적이다. 시장은 원전 Bankability 회복이 2026년 투자 판단의 핵심 축이라고 결론짓는다.", "대기 자금도 있다. 글로벌 인프라펀드 AUM은 2016년 5,400억달러에서 2024년 1.5조달러로 커졌고 미투자 대기자금(dry powder)만 3,600억달러다. 원전이 Bankable 자산으로 재평가되면 유입 가능한 잠재 자금 규모를 시사한다."], "table": {"cols": ["구분", "영국 RAB", "Fermi America", "미 정부-WH 파트너십"], "rows": [["도입", "2022 Nuclear Energy (Financing) Act", "2025-10 나스닥·런던 상장", "2025-10 전략적 협약"], ["구조", "공사비를 요금으로 전가·회수 보장", "IPO로 민간 자본 직접 조달", "정부 금융·보증 + 민간 기술·운영"], ["자본 출처", "요금+정부+민간", "기관·연기금·개인", "정부 + Brookfield·Cameco"], ["대표 프로젝트", "Sizewell C(380억파운드)", "Project Matador(최대 11GW)", "AP1000 8~10기(800억달러)"]]}, "bullets": ["1960~80년대: 규제된 요금 회수 → 금융 황금기", "1990년대: 자유화 → 요금 회수 불가 → Non-Bankable", "2020년대: RAB·LPO·EDF·성과연동 투자·IPO·빅테크 PPA로 복원 시도", "AEI 제언: 초장기 CfD로 자본조달원가 MWh당 최대 50달러 인하"], "kr": "IPO·ECM 관점에서 Fermi America 사례는 원전 인프라가 상장 시장에서 직접 자금을 조달한 선례이며, 한국전력은 한수원을 통한 SPC 지분 참여로 금융 측면의 파트너가 될 수 있다는 시각이 제시된다.", "svg": "<svg viewBox=\"0 0 960 250\" role=\"img\" aria-label=\"원전은 요금으로 비용 회수가 보장될 때 지어졌고 자유화로 보증이 사라지자 멈췄으며, 2020년대는 그 보증을 다른 장치로 복원하는 과정이다\"><defs><marker id=\"a-bnk1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-bnk1-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--accent)\"/><\/marker><marker id=\"a-bnk1-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--ok)\"/><\/marker><marker id=\"a-bnk1-warn\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--warn)\"/><\/marker><marker id=\"a-bnk1-alert\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--alert)\"/><\/marker><\/defs><path d=\"M40 180 L930 180\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.4\"/><text x=\"60\" y=\"198\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.75\">1960<\/text><text x=\"300\" y=\"198\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.75\">1980<\/text><text x=\"440\" y=\"198\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.75\">1990s<\/text><text x=\"640\" y=\"198\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.75\">2010<\/text><text x=\"800\" y=\"198\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.75\">2020s<\/text><path d=\"M60 70 C 200 60, 300 70, 380 90 S 470 160, 560 165 S 700 162, 740 150 S 840 90, 920 70\" fill=\"none\" stroke-width=\"2.4\" style=\"stroke:var(--accent)\"/><text x=\"930\" y=\"60\" font-size=\"11\" text-anchor=\"end\" style=\"fill:var(--accent)\">Bankability(개념)<\/text><rect x=\"60\" y=\"100\" width=\"250\" height=\"48\" rx=\"8\" style=\"fill:var(--ok);fill-opacity:.10;stroke:var(--ok)\" stroke-width=\"1.3\"/><text x=\"185\" y=\"120.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">수익률 규제 — 황금기<\/text><text x=\"185\" y=\"136.6\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">비용초과도 요금으로 8~10% 회수<\/text><rect x=\"372\" y=\"16\" width=\"220\" height=\"48\" rx=\"8\" style=\"fill:var(--alert);fill-opacity:.10;stroke:var(--alert)\" stroke-width=\"1.3\"/><text x=\"482\" y=\"36.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">전력 자유화<\/text><text x=\"482\" y=\"52.6\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">1989 영국 · 1996 FERC 888<\/text><path d=\"M482 64 L470 118\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--alert)\" marker-end=\"url(#a-bnk1-alert)\"/><rect x=\"606\" y=\"64\" width=\"176\" height=\"46\" rx=\"8\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"694\" y=\"83.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">Non-Bankable<\/text><text x=\"694\" y=\"99.6\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">신규 건설 중단·조기폐쇄<\/text><rect x=\"700\" y=\"208\" width=\"240\" height=\"38\" rx=\"8\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"820\" y=\"230.96\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">RAB·LPO·EDF·WH 지분·IPO·빅테크 PPA<\/text><path d=\"M830 208 L850 96\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--accent)\" marker-end=\"url(#a-bnk1-c)\"/><\/svg>", "cap": "**결론: 원전은 요금으로 비용 회수가 보장될 때만 지어졌다. 자유화로 보증이 사라지자 멈췄고, 2020년대의 RAB·정부 대출·지분 참여·IPO·빅테크 PPA는 모두 그 보증을 다른 방식으로 복원하려는 장치다.** 곡선은 개념도이며 수치가 아니다."}, {"name": "Fleet이 건설비를 낮춘다: 프랑스·중국·미국·한국 비교와 '파트너 5요건'", "pill": "2025.11~2026.03", "lede": "동일 설계를 끊김 없이 반복 건설한 국가만이 원전 건설비를 안정시켰고, 2000년 이후 실적으로 보면 '많이·잘·꾸준히·해외에서도·우방국'을 모두 충족하는 나라는 한국뿐이라는 비교가 나온다.", "paras": ["프랑스는 1970~1990년대 EDF 주도로 900·1,300·1,500MWe급 PWR을 사실상 하나의 Fleet으로 지어 실질 건설비를 안정시켰다(Messmer Plan으로 1974~1991년 56기 착공). 그러나 1990년대 이후 신규 건설이 멈추자 공급망·숙련인력·학습효과가 해체됐고, 2000년대 EPR(Flamanville 3, 공기 17년)에서 대규모 비용초과로 이어졌다. Fleet은 유지될 때만 효과가 있다는 교훈이다.", "중국은 1970~90년대 CANDU·프랑스 PWR·VVER이 혼재한 도입기를 거친 뒤 2000년대 CPR-1000을 국가 표준으로 삼아 수십 기를 동시·반복 건설했고, 오버나이트 코스트를 2,000~2,500달러/kWe까지 낮췄다. 3세대 HPR1000 도입 후에도 기존 공급망을 유지해 2,500~3,000달러/kWe를 지켰다. 반면 미국은 WH·GE·B&W·CE가 서로 다른 설계를 공급해 Fleet 효과가 없었다.", "2000년 이후 착공·완공 실적(IAEA PRIS)으로 보면 중국 52기, 한국 13기, 러시아 12기, 인도 9기, 일본 4기다. 한국 평균 시공기간은 7.5년, 신한울 1·2 건설단가 2,587달러/kW로 중국 산먼 1·2(3,154)·러시아 레닌그라드 2(2,634)·일본 도마리 3(2,887)·인도 카크라파르 3(3,356)보다 낮다. 2010~2024년 완공은 한국 12기·중국 52기·러시아 11기·인도 5기이며 일본은 2009년 이후 없다.", "해외 시공 경험은 한국(UAE 4기)·중국(파키스탄 5기)·러시아(벨라루스 2기 등)만 있고, 중국·러시아는 미국과 패권 경쟁 관계라 지정학 조건에서 빠진다. 그래서 미국의 핵심 파트너 자격이 한국으로 좁혀진다는 논리다. 2015~2024년 상업운전 원전의 착공~첫 계통연결 공기도 바라카 1~4 8~9년, 새울 1·2 8~9년, 신한울 1·2 10~11년으로 Vogtle 11~12년, EPR 17~18년과 대비된다.", "다만 이 비교는 국내 시장의 시각이며, 중국의 공기(6.0년)와 물량은 한국을 압도한다는 점, 한국도 탈원전기 공사 지연을 겪었다는 점은 함께 봐야 한다."], "table": {"cols": ["구분", "한국", "중국", "러시아", "일본", "인도"], "rows": [["2000년 이후 착공·완공", "13", "52", "12", "4", "9"], ["평균 시공기간(년)", "7.5", "6.0", "8.9", "4.5", "8.3"], ["대표 시공비(USD/kW)", "2,587(신한울1·2)", "3,154(산먼1·2)", "2,634(레닌그라드2)", "2,887(도마리3)", "3,356(카크라파르3)"], ["2010~2024 완공", "12기", "52기", "11기", "없음(2009 이후)", "5기"], ["국외 시공", "UAE 4기", "파키스탄 5기", "벨라루스 2기 등", "없음", "없음"], ["지정학", "미국 우방", "패권 경쟁", "패권 경쟁", "미국 우방", "미국 우방"]]}, "bullets": ["프랑스: Fleet 유지 시 안정, 단절 시(EPR) 급등", "중국: 단일노형 대량 반복으로 가장 뚜렷한 비용 하락", "미국: 다종 설계로 학습 미형성, Vogtle 4호기만 학습효과 실증(공정 30%↑, 비용 20%↓, 시운전 마일스톤 38~76% 단축)", "현대건설: 최근 10년 중·러 제외 완공 23기 중 8기 시공, 국내 20기·해외 4기 완공"], "kr": "팀코리아(한수원·한전기술·두산에너빌리티·현대건설·삼성물산·대우건설) 전반의 논거이며, 국내 원전 컨소시엄은 주간사 51~60%·비주간사 40~49%의 공동이행 구조라 수혜가 여러 건설사로 확산된다."}]}]}, {"h": "공급망·기자재 — 누가 만들 수 있고, 수혜가 어떤 순서로 퍼지는가", "blocks": [{"t": "mods", "items": [{"name": "원전 기자재의 3중 진입장벽: 왜 수요가 늘어도 공급자는 늘지 않나", "pill": "2025.12~2026.05", "lede": "대형 프레스·인증·레퍼런스라는 3중 장벽 때문에 원전 수요 확대는 경쟁 심화가 아니라 기존 소수 공급자의 협상력 강화로 이어진다.", "paras": ["① 설비투자 장벽. 용접 개소를 줄이려 기자재는 최대한 일체형·대형화된다. RPV는 70~100톤급 단조품 약 7개로 구성되고 터빈 샤프트는 약 200톤 일체형이다. 100톤급 잉곳엔 1만톤, 수백 톤급엔 1.5만톤 이상 프레스가 필요한데, 1.5만톤급을 가진 나라는 한국·일본·중국·러시아·인도 정도다. 두산의 1.7만톤 프레스 설치에만 3년이 걸렸고, 미국이 초대형 단조 설비를 새로 갖추려면 최소 10년과 10기 이상의 발주 물량이 필요하다는 분석이다.", "② 기술·노하우 장벽. 단조는 업체·노형·프로젝트마다 설계가 달라지는 다품종 소량생산이라 정형화가 어렵다. ASME N-stamp 같은 시설 단위 원자력 인증이 필요하고, 미국에서는 인증 업체 수 자체가 줄어 '인증 품질로 일정 내 생산 가능한 물량'이 제약이다.", "③ 레퍼런스 장벽. 원전 설계·운영사는 제작 경험이 없는 업체에 주문하지 않는다. 그 결과 대형원전 주기기를 패키지로 만들 수 있는 나라는 5~6개국이고, 글로벌 CAPA 연 30~40기 중 러·중을 빼면 미국·유럽이 실제로 쓸 수 있는 물량은 연 약 15기, 두산은 연 5세트 수준으로 추정된다. 러시아 AEM-Atommash는 유럽 수출이 사실상 불가하고, 프랑스 Framatome은 EDF 물량 위주, 일본은 자체 주단조 CAPA 없이 후쿠시마 이후 10년 이상 제작 공백이 있다.", "미국 내 역량을 품목별로 보면 AP1000급 대형 RPV는 해외(일본·한국·이탈리아) 의존, SMR급 RPV는 North American Forgemasters·BWXT 등 미국 업체도 가능, SG·가압기는 대개 해외 의존, 증기터빈발전기는 주로 독일·프랑스 조달, 대구경 밸브·펌프는 Crane·Curtiss-Wright·Flowserve 등 미국 내 공급 가능하다. 즉 병목은 대형 압력경계 기기에 집중된다.", "수요 측 압박도 크다. 2050 목표를 채우려면 연 30~34GW 신규 원전이 필요한데 최근 5년 착공은 연 5~10기 수준이다. 착공이 늘기 시작하면 CAPA 증설은 신규 진입보다 기존 업체 증설로 대응될 가능성이 높다는 것이 시장의 결론이다."], "table": {"cols": ["국가/기업", "주기기 제작", "단조 CAPA", "비고"], "rows": [["한국(두산에너빌리티)", "가능", "13,000·17,000톤 프레스, 최대 잉곳 540톤", "팀코리아·WH 양쪽 공급, 연 5세트"], ["일본(MHI·Toshiba / JSW)", "제한적", "JSW 14,000톤 2기·최대 650톤 잉곳(단조 전문)", "후쿠시마 이후 제작 공백"], ["중국(SEC·CFHI·DEC)", "가능(5~6기)", "국영기업 산하", "자국 우선, 수출 제한"], ["러시아(AEM-Atommash)", "가능", "12,000·15,000톤", "유럽향 수출 사실상 불가"], ["프랑스(Framatome/Le Creusot)", "가능", "11,300·9,000톤", "EDF 물량 위주"], ["인도(L&T·BHEL)", "일부 품목", "자체 CAPA", "NPCIL 중심"]]}, "bullets": ["3세대 원전 1기: 단조강 4,000톤+, 단조품 200개+", "미·유럽 실질 주기기 CAPA 연 약 15기(업계 추정)", "미국 가동 AP1000 6기 중 4기(건설 중단 VC Summer 포함 8기 중 6기)에 한국 업체 주기기 납품", "ASME N-stamp 인증 업체 감소가 미국 내 추가 병목"], "kr": "두산에너빌리티는 제강·단조부터 주기기 최종 제작까지 단일 법인에 내재화한 소수 업체이자 AP1000 주기기 공급 경험을 가진 국내 유일 업체로 부각된다. 태웅(SMR 소재)·세아(특수강)가 소재 측 연결점이다."}, {"name": "수혜의 확산 경로: 주기기 → 보조기기 → 계측·소재", "pill": "2025.11~2026.05", "lede": "원전 사이클 초기에는 주기기·EPC 대형주만 움직이지만, 착공이 시작되면 1~4년에 걸쳐 BOP·계측·제어·전기설비 중소형 벤더로 발주가 순차 확산된다.", "paras": ["원전 건설은 EPC 계약·부지 준비(공정률 약 3%) → 건설 인허가·굴착(17%) → 첫 원자로 콘크리트 타설(22%) → RPV 설치(65%) → 원자로·터빈 아일랜드 완공(85%) → 운전허가·상업운전 순으로 진행된다. 주기기와 단조 소재는 착공 전부터 기술 제공사·디벨로퍼와 협력해 장납기 품목으로 선발주되지만, 보조기기 사업자 선정은 착공과 주기기 제작이 시작된 뒤 기자재별로 1~4년에 걸쳐 이뤄진다.", "그래서 시장은 착공 전부터 주기기·EPC에 먼저 주목하고, 보조기기 벤더는 실제 착공 뉴스가 나와야 반응하는 시차가 생긴다. 2026년에는 Fermi 대형원전, NuScale·TerraPower SMR 착공이 예정돼 보조기기 발주 본격화가 기대됐다(실제 착공 여부는 확인 필요).", "대표 품목과 규모 감각은 다음과 같다. BOP(복수기·급수가열기 등)는 원전 1기당 약 1~1.5천억원, 비에이치아이는 신한울 3·4 원자력 보조기기 약 1,500억원을 수주해 2026~2029년 분산 인식한다. 노내계측기(ICI)는 원전 수주의 약 40%를 차지하는 품목이며 2~5년마다 교체된다. 우리기술은 2016년 원전 DCS를 국산화했고 신한울 3·4 공급으로 원전 매출이 2025년 약 260억원에서 2026년 약 750억원으로 늘 것으로 추정됐다.", "SMR은 계측기 업체에 특히 유리하다. APR1400에는 ICI가 약 60개, NuScale 77MW 모듈에는 12개가 들어가 MW당 탑재량이 훨씬 많다. 미국 Mirion은 X-energy 등 SMR 개발사로부터 2024년부터 계측기를 수주해 약 3.5억달러 파이프라인을 보유했다.", "미·일 원전 협력 강화는 한국 밸류체인에 리스크이지만, 일부 국내 중소형 벤더는 도시바·GE-Hitachi·MHI 등 일본 밸류체인과 장기 협력 이력이 있어 오히려 기회가 될 수 있다는 시각도 있다(비에이치아이는 도시바와 협력해 Vogtle 복수기를 납품)."], "table": {"cols": ["공정률", "마일스톤", "주요 발주"], "rows": [["3%", "EPC 계약, 부지 준비, 조달 시작", "주기기 LLI·단조(착공 전 선발주)"], ["17%", "건설 인허가, 굴착", "토목·시공"], ["22%", "첫 원자로 콘크리트 타설", "보조기기 선정 개시"], ["65%", "RPV 설치", "BOP·계측제어 본격 납품"], ["85%", "원자로/터빈 아일랜드 완공", "전기·제어 통합"], ["98~100%", "운전허가, 상업운전", "시운전 정비 → 경상정비"]]}, "bullets": ["착공 후 1~4년 순차 발주", "BOP 1기당 약 1~1.5천억원(업계 추정)", "ICI: APR1400 약 60개 vs NuScale 모듈당 12개", "우진: 교체 대상 원전 15기 → 2028년 18~20기, 신한울 3·4 ICI 신규 납품 2028년 개시"], "kr": "비에이치아이(BOP·HRSG), 우진(ICI), 우리기술(DCS), 태웅(소재), HD현대일렉트릭·효성중공업·LS ELECTRIC(원전용 변압기·주제어반)이 확산 경로의 대표 기업이다."}, {"name": "WH 연합 vs 팀코리아: 같은 원전, 다른 수익 구조", "pill": "2026.03~2026.06", "lede": "누가 주계약자냐에 따라 한국 건설사·설계사·주기기사의 매출 규모와 위험이 완전히 달라진다.", "paras": ["WH 연합 모델은 WH가 라이선스·인허가·설계와 핵심 계통을 통제하고 나머지 EPC를 외부 건설사가 맡는다. 건설사 몫은 EPC 금액의 50~55%로 크지만, LSTK형이면 원가 충격을 단독 흡수해야 하는 고위험·고수익 구조다. 대표 사례는 Vogtle, 불가리아 Kozloduy 7·8, Fermi Matador, 핀란드 Fortum, 폴란드 Lubiatowo다.", "팀코리아 모델은 한수원이 주계약자로 전면에 서고 설계(한전기술)·주기기(두산)·시공(국내 건설사)을 분할 배분하는 수직통합형이다. 건설사 몫은 EPC 금액의 30~40%로 작지만 리스크가 블록 안에서 분산된다. 바라카 초도 EPC 22조원 중 현대건설 3.7조, 삼성물산 2.8조, 두산 약 2.5조였다. 에스컬레이션 조항이 들어가면 중위험·안정수익 모델이 된다는 추정이다.", "주기기사에게도 차이가 크다. 두산은 팀코리아향이면 RPV·SG·가압기·RCP·T/G까지 전 품목(기당 2~3조원, 두코바니는 약 5.6조원/2기)을 공급하지만, WH향이면 RPV·SG 위주로 기당 4,000~5,000억원 수준이다. 한 추정은 두코바니 단가를 반영해 미국 AP1000 주기기 기당 계약금을 0.5조원에서 1.0조원으로 올려 잡았고, 또 다른 추정은 AP1000 2기 기준 RV·SG 5~6억달러+T/G 7억달러로 추정해 가정 차이가 크다.", "설계사도 마찬가지다. APR1400이면 한전기술이 원자로계통설계(기당 약 0.2조)와 종합설계(약 0.6조)를 모두 하지만, AP1000이면 원자로 설계는 WH가 하고 종합설계 일부 외주(기당 약 0.3조원, 보수적 2기 3.9억달러)만 가능하다. 반대로 AP1000 공급망에 두산 T/G가 없었다는 점(Vogtle은 도시바)은 노형 선택이 두산 수혜 범위도 가른다는 뜻이다.", "현대건설은 양쪽에 모두 발을 걸친 유일한 국내 EPC로 평가된다(한수원 APR1400 국내·중동, WH AP1000 불가리아 FEED·Fermi FEED, Holtec SMR-300). 삼성물산은 NuScale·GVH SMR과 루마니아, 대우건설은 두코바니 시공 주간사로 팀코리아 쪽 무게가 크다."], "table": {"cols": ["항목", "WH 연합(AP1000)", "팀코리아(APR1400/1000)"], "rows": [["주계약·통제", "WH가 라이선스·인허가·설계 통제", "한수원 주계약, 국내 기업 분할 배분"], ["건설사 몫", "EPC 금액의 50~55%", "EPC 금액의 30~40%"], ["리스크", "고위험·고수익(리스크공유형 논의 중)", "중위험·안정수익(에스컬레이션 기대)"], ["두산 주기기", "RPV·SG 위주, 기당 4~5천억원(1조원 가정도 존재)", "전 품목, 기당 2~3조원"], ["한전기술", "종합설계 일부 외주 가능성", "종합설계+원자로계통설계"], ["RCP·T/G", "Curtiss-Wright·도시바/GE", "두산"], ["I&C", "Emerson·Honeywell", "한전기술·국산 MMIS"], ["대표 사례", "Vogtle, Kozloduy 7·8, Fermi Matador", "바라카 1~4, 두코바니 5·6"]]}, "bullets": ["노형 확정 전까지 설계·정비는 APR1400 채택 시에만 수혜, 주기기는 노형 무관 수혜라는 구분", "WH-한수원 지재권 합의로 활동 지역이 사실상 양분 → 양쪽 공급망에 모두 참여하는 업체가 상대 유리", "두산 AP1000 주기기 기당 단가: 4~5천억원 vs 1.0조원 가정(미확인)"], "kr": "딜 검토 시 대상 기업의 수주가 팀코리아향인지 WH향인지, 공급 범위가 전 품목인지 일부인지를 먼저 확인해야 매출 추정의 오차가 줄어든다."}]}]}, {"h": "한국 밸류체인·정책 — 팀코리아의 자리, 지재권의 대가, 국내 정책과 한전", "blocks": [{"t": "mods", "items": [{"name": "한수원-WH 지재권 분쟁: 시장 분할과 기당 대가", "pill": "2025.10~2026.06", "lede": "APR1400의 뿌리인 CE System 80 기술을 둘러싼 분쟁은 2025~2026년 합의로 봉합됐지만, 대가는 수출 지역 분할과 기당 로열티·기자재 구매였다.", "paras": ["1979년 TMI 이후 경영난에 처한 Combustion Engineering(CE)이 1989년 한국에 원자로 핵심기술을 이전했고, 한국은 System 80 기반으로 OPR1000(1995)과 APR1400(2001)을 개발했다. 그런데 CE 원자력사업부가 ABB를 거쳐 1999년 WH에 인수되면서 지재권이 넘어갔고, WH는 2009년 UAE 수주 직후부터 체코 두코바니 국면까지 반복적으로 문제를 제기했다. 직접 소송에선 한국이 방어했지만 실질적으로는 협상으로 대가를 치르는 구조가 반복됐다.", "2025년 1월 공개된 합의 내용(언론 보도)에 따르면 한국형 원전 수출 시 기당 로열티와 기자재·용역 구매를 WH에 지급해야 한다. 다만 수치 해석이 추정치마다 다르다. 한 추정은 로열티를 UAE 1.75억달러→체코 6.65억달러로, 로열티+기자재를 UAE 7.25억→체코 8.4억달러로 제시하고, 다른 추정들은 '기술사용료 1.75억달러 + 기자재·용역 계약 6.5억달러(50년 계약)'로 제시한다. 둘을 같은 사실의 다른 집계로 볼지 확인이 필요하다.", "더 중요한 것은 시장 분할이다. 2026년 1월 글로벌 협력 협정으로 북미(미·캐·멕), 체코를 제외한 EU, 영국, 일본, 우크라이나는 팀코리아 단독 수출 불가 지역이 됐고, 수출 가능 지역은 체코·동남아·중앙아시아·중동(튀르키예·UAE·사우디)·남미·아프리카다. SMR 수출 시에도 WH의 기술자립 검증을 통과해야 한다. 그 결과 한수원은 네덜란드·슬로베니아 입찰에서 하차했고, 체코 외 유럽 수주 가시성은 낮아졌다는 평가가 나온다.", "업계는 이 합의를 '불리하지만 감내 가능한 선택'으로 본다. 미국이 대형원전 재건에 나선 상황에서 미국 기업 WH와의 관계 설정이 필수이고, APR1400이 미국에서 채택되면 WH는 기당 기술료와 기자재 계약으로 무위험 수익을 얻어 기업가치와 미 정부 몫(초과이익 20%)이 함께 커지므로 수용 유인이 있다는 논리다. 또 APR+가 WH 의존 마지막 핵심기술(RCP·MMIS·설계핵심코드)을 자립하면 문제가 구조적으로 해소될 수 있다.", "투자 관점의 함의는, 팀코리아 전용 업체는 접근 가능한 시장이 줄었고 팀코리아와 WH 양쪽 공급망에 모두 참여하는 주기기·EPC 업체가 상대적으로 유리해졌다는 것이다."], "table": {"cols": ["구분", "UAE BNPP 1~4", "체코 두코바니 5·6"], "rows": [["로열티(기술사용료)", "1.75억달러(약 2,400억원)", "6.65억달러(약 9,300억원) — 타 집계 1.75억달러"], ["로열티+기자재 구매", "7.25억달러(약 1조원)", "8.4억달러(약 1.17조원) — 타 집계 기자재·용역 6.5억달러 별도"], ["전체 계약 중 WH 관련", "46억달러(약 6.4조원) 중 상당 비중", "85억달러(약 13조원) 중 상당 비중"], ["수출 제한", "-", "북미·EU(체코 제외)·영국·일본·우크라이나 단독 불가"]]}, "bullets": ["지재권 이전 경로: CE → ABB → WH(1999)", "2025-01 합의 공개, 2026-01 글로벌 협력 협정", "수치 해석이 추정치마다 달라 '미확인'으로 인용 권장", "APR+ 상용화 시 구조적 해소 가능"], "kr": "한전기술(APR+ 개발 주관)과 한수원(수출 계약 주체)이 직접 당사자이고, 두산에너빌리티는 WH·팀코리아 양쪽 공급자라는 위치 때문에 합의의 상대적 수혜자로 거론된다."}, {"name": "팀코리아 해외 파이프라인과 경쟁 구도: 연 1건 페이스가 가능한가", "pill": "2025.10~2026.09", "lede": "체코 이후 팀코리아의 다음 수주는 사우디·튀르키예·베트남·UAE 후속·체코 테믈린에 걸려 있고, 경쟁자는 지역에 따라 EDF·WH(서방형) 또는 Rosatom·중국(신흥국)이다.", "paras": ["한국은 미국·프랑스·중국·러시아와 함께 원전 설계·EPC·O&M을 모두 자체 수행하는 세계 5개국 중 하나다. 중국은 자국 집중이라 수출 경쟁이 제한적이고, 러시아는 안보 리스크, 프랑스·미국은 최근 대형 프로젝트에서 공기 지연·비용초과를 겪어 한국이 유럽·중동 신규 입찰에서 경쟁력이 있다는 평가다. 다만 러시아는 2011년 이후 26기를 수출하는 등 누적 53기 수출 실적이 있고, 이집트 El Dabaa처럼 사업비 300억달러의 85%(약 255억달러)를 차관으로 대는 금융 패키지로 신흥국에서 강하다.", "후보 프로젝트는 체코 테믈린(2GW, 두코바니 후속으로 유력하나 EDF·WH 입찰 가능성도), 사우디 두와이힌(2.4GW·약 140억달러, 2027년경 사업자 선정 예정이었으나 한전기술 실적 추정에서 2030년으로 연기 반영), 튀르키예 시노프(4.8GW, 2025-11 협력 MOU), 베트남 닌투언(2.4GW, 2026-01 일본 협력 종료 후 러시아·한국 양강), 아르메니아 메차모르(1GW), UAE 바라카 5~8호기(2027~2028 선정 기대) 등이다.", "업계 추정 시나리오는 APR1400 기준 2026 사우디 2기 → 2028 한국 2기 → 2029 UAE·체코 각 2기 → 2030 사우디 2기(베트남·튀르키예 각 2기 가능성)이며, 팀코리아 단독 수출 가능 지역의 향후 15년 잔여 착공 필요 용량은 약 130GW, 한미 동반 진출 시 2050년까지 466GW(약 7,000조원)로 추산된다. IEA 전망 기반으로 개도국(EMDE) 대형원전 입찰은 연 3~8기, 그중 팀코리아 1~2기 수주가 가능하다는 추정도 있다.", "리스크는 반복된 입찰 지연이다. 체코 테믈린·사우디 두와이힌 일정은 여러 차례 밀렸고, 폴란드 퐁트누프 사업은 정권 교체로 보류됐으며 한수원은 폴란드 제2원전에서 철수했다. 수출 목표 10기(2030) 중 체코 2기를 빼면 8기가 남았다.", "결국 팀코리아의 가치는 '연 1건' 수주 페이스가 유지되는지로 검증된다. 수주 공백이 길어지면 설계사(한전기술)의 고정비 레버리지가 역으로 작동하고, 수주가 몰리면 인력 CAPA(현대건설 900명·대우건설 350명)가 병목이 된다."], "table": {"cols": ["국가", "프로젝트", "규모", "현황(자료 기준)"], "rows": [["체코", "Temelin 3·4", "2GW", "두코바니 후속 옵션, EDF·WH 경쟁 가능성"], ["사우디", "Duwaiheen", "2.4GW·약 140억달러", "BAFO 단계, 선정 시점 2027→2030 연기 반영"], ["튀르키예", "Sinop", "4.8GW", "2025-11 한-튀르키예 협력 MOU"], ["베트남", "Ninh Thuan 2", "2.4GW", "일본 협력 종료(2026-01), 러·한 양강"], ["UAE", "바라카 5~8", "-", "2027~2028 사업자 선정 기대"], ["아르메니아", "Metsamor", "1GW", "미·러·프·한과 협상"], ["네덜란드·슬로베니아", "Borssele·Krsko", "각 최대 3.3GW", "한수원 하차, EDF·WH 2파전"]]}, "bullets": ["원전 EPC/O&M 토털 기술 보유국: 미·프·중·러·한 5개국", "러시아 누적 원자로 수출 53기, 차관 패키지 경쟁력", "팀코리아 단독 가능 지역 잔여 약 130GW(15년, 업계 추정)", "한미 동반 시 2050년 466GW·약 7,000조원(업계 추정, 실질 경쟁자는 프랑스)"], "kr": "후속 수주의 1차 수혜 순서는 설계(한전기술, 수주 즉시 레버리지) → 주기기(두산) → 시공(주간사 건설사) → 정비(한전KPS, 준공 후)로 시차가 난다."}, {"name": "원전 1기가 만드는 국내 공급망 매출 지도", "pill": "2025.11~2026.03", "lede": "해외 원전 사업비를 쪼개면 주기기 22~23%, 설계 5~6%, 시운전 정비 약 2%가 국내 상장사 몫으로 떨어지고, 시간축으로는 설계 → 주기기 → 시공 → 정비 순서로 매출이 인식된다.", "paras": ["UAE 바라카(22.6조원)의 배분은 건설 33%, 주기기 23%, 설계 5%, 시운전 2%, 기타 37%였다. 체코 두코바니(약 26조원, 4,000억 코루나)에서도 두산에너빌리티가 주기기·터빈발전기로 5조6,401억원(약 22%)을 확보했고, 한전기술은 종합설계 약 1.2조원과 원자로계통설계 3,735억원을 확보한 것으로 정리된다(추정치별 1.1~1.6조원으로 상이).", "한전KPS는 바라카에서 시운전 정비·가동전검사로 약 4,900억원(사업비의 2.2%)을 받은 뒤 연 150억원 규모 장기 정비계약을 이어갔다. 같은 비율을 두코바니에 적용하면 시운전 정비 약 5,600억원, 장기 정비 연 180억원 안팎이 추정된다. 한전KPS의 원전 1기당 총 수주는 약 1조원(40~60년 누적)으로 추산된다.", "국내 신규 원전은 착공 약 3.3년 전에 설계가 발주되고 착공~상업운전은 평균 6.9년이다. 국내 설계사는 사업비의 6~8%(새울·신한울 평균 7,200억원)를 수주해 왔다. 따라서 11차 전기본의 신규 대형 2기(2037~2038 상업운전 목표)는 설계 발주가 2027~2028년으로 예상된다.", "원전 설계 매출은 약 10년 공사기간 중 초중반 설계인력 집중 구간에 몰리고, 주기기는 제작 5~7년에 걸쳐, EPC는 바라카 기성률 패턴상 착공 초기 작다가 3~5년차에 급증하는 S커브를 그린다. 정비 매출은 상업운전 이후에야 발생하므로 수주 뉴스에 대한 주가 반응 강도도 설계 > 주기기 > 시공 > 정비 순이라는 관찰이 있다.", "미국 AP1000 가정은 구조가 다르다. 2기 순공사비 207억달러(체코 단가 9,285달러/kW 적용) 가정 시 한수원이 1차 계통 EP를 제외한 EPC를 맡으면 약 174억달러(83.9%), 두산 RV·SG 5~6억달러와 T/G 7억달러(각 약 2.7~2.8%·3.4%), 한전기술 종합설계 약 3.9억달러(1.9%)로 추정됐다."], "table": {"cols": ["참여사", "바라카(22.6조원)", "두코바니(약 26조원)", "미국 AP1000 2기 가정(207억달러)"], "rows": [["시공/EPC", "33%(현대 3.7조·삼성 2.8조)", "대우건설 주간사(금액 미확인)", "한수원 EPC 약 174억달러(83.9%)"], ["주기기", "23%(두산 약 2.5조)", "두산 5.64조(22%)", "두산 RV·SG 5~6억 + T/G 7억달러"], ["설계", "5%(한전기술 약 1.1조)", "종합 약 1.2조 + 계통 3,735억원", "종합설계 3.9억(최대 5.8~6.5억)달러"], ["시운전 정비", "2.2%(한전KPS 약 4,900억)", "약 5,600억원 추정", "-"], ["장기 정비", "연 150억원", "연 180억원 안팎 추정", "-"]]}, "bullets": ["설계 발주: 착공 약 3.3년 전", "착공~상업운전: 국내 평균 6.9년", "해외 설계용역: 사업비의 5~6%, 국내 6~8%", "한전KPS: 원자로 1기당 연 약 200억원+ 매출 추정"], "kr": "딜·실사에서 수주 금액을 연도별 매출로 풀 때 이 비율과 시차를 기본 가정으로 쓰되, 각 사 공시 계약금액과 인식 스케줄로 교차 확인해야 한다."}, {"name": "핵추진잠수함과 123협정: 선체·원자로는 있고, 남은 병목은 연료와 협정", "pill": "2025.10~2026.07", "lede": "K-SSN 승인은 무기 획득보다 원자로·연료주기 문제를 전면에 끌어올렸다는 점이 핵심이며, 그 해법 과정이 국내 농축·재처리·SMR 산업의 문을 연다.", "paras": ["2025년 10월 경주 APEC 계기 트럼프 대통령이 한국 핵추진잠수함 건조를 승인했고, 11월 한미 공동 팩트시트에 건조 승인·연료 조달 협력과 민간 농축·재처리 절차 지지가 명문화됐다. 2026년 6월 2~3일 서울에서 첫 실무협의, 7월 워싱턴에서 2차 협의가 열렸다. 별도로 2026-01-09 외교부 주도 한미원자력협력 범정부 TF가 출범해 평화적·상업적 목적의 농축·재처리 역량 확보를 목표로 협정 개정안을 논의 중이다.", "한국은 KSS-III(국산화율 약 76~80%)로 대형 잠수함 선체·AIP·VLS 통합 역량을, SMART·i-SMR로 소형 일체형 원자로 역량을 갖췄다. 국방부가 '연료만 있으면 된다'고 할 만큼 남은 과제는 연료다. K-SSN 구상은 4,000~5,000톤급+, 일체형 경수로 1기, 열출력 70~150MWt, 15~19.75% HALEU, 2030년대 중반 이후 최소 4척, 척당 1.5~2조원(KSS-III 1.1~1.2조원, 쉬프랑급 1.7조원 참고)이다.", "제도 경로는 세 갈래다. 2015년 개정 123협정은 평화적 이용에 한정해 20% 이상 농축과 미국산 핵물질의 군사 전용을 금지한다. 따라서 ① 미국 공급(원자력법 91조에 따른 대통령 승인·의회 검토를 거친 별도 군사용 협정), ② 국내 20% 미만 농축, ③ 제3국 조달 중 하나가 필요하다. 한국은 20% 이하 HALEU를 쓰는 방향을 밝혔고, IAEA INFCIRC/153 14조(비금지 군사활동에 대한 특별안전조치)로 호주 AUKUS처럼 NPT 논란을 피할 수 있다.", "산업적 파급이 크다. 팩트시트의 민간 농축·재처리 지지로 파이로프로세싱 실증(고준위폐기물 1/20 감축 추정)과 HALEU 연료 제조 협력의 여지가 생겼다. 협정이 개정되면 한수원의 농축 내재화, 러시아 로사톰처럼 재처리까지 포함한 토탈패키지 원전 수출이 가능해질 수 있다. 해양 환경에서 검증된 핵잠 원자로는 i-SMR 수출과 원자력 추진 상선(BANDI 등)의 트랙레코드가 될 수 있다.", "다만 조선업 관점의 직접 수혜는 제한적이라는 시각이 우세하다. 핵잠은 내수 사업이고 핵연료 반출 규제로 수출이 불가하다. 조선의 촉매는 오히려 캐나다 CPSP(8~12척, 건조 약 30조·수명주기 약 60조원, 평가의 50%가 현지 MRO) 같은 재래식 잠수함 수출이라는 분석이다."], "table": {"cols": ["구분", "연료 농축도", "열출력", "연료교체 주기"], "rows": [["미국 S9G(버지니아급)", ">93% HEU", "~210MWt", "33년+"], ["영국 PWR2", ">90% HEU", "~150MWt", "25년+"], ["프랑스 K15", "<6% LEU", "150MWt", "약 10년"], ["한국 i-SMR/선박용 SMR", "<20%(HALEU)", "70MWt(목표)", "장주기 목표(가상설계 47년)"]]}, "bullets": ["LEU <5% / HALEU 5~20% / HEU 20%+ — 농축도는 성능보다 교체주기를 좌우", "123협정(평화적 이용) vs 91조(군사용 별도협정)", "IAEA 14조 특별안전조치가 NPT 논란 회피 경로", "고준위 R&D 핵심기술 130개 중 확보 22개(2026)", "한국 국방비 GDP 대비 3.5% 목표(2035, 한미 합의)"], "kr": "한국전력·한수원(농축·재처리·토탈패키지), 한전기술(i-SMR·SMART 설계), 두산에너빌리티(원자로), 포스코인터내셔널(농축 트레이딩), 한화오션·HD현대중공업(선체), 효성중공업(추진전동기)이 연결된다."}, {"name": "재가동·수명연장·해체: 신규 건설보다 먼저 커지는 시장", "pill": "2025.10~2026.06", "lede": "가동 원전의 절반 가까이가 40년을 넘기면서, 재가동·계속운전(LTO)·해체가 신규 원전보다 싸고 빠른 공급 수단이자 먼저 열리는 정비 시장이 됐다.", "paras": ["재가동의 상징은 미국 미시간 Palisades(805MW PWR)다. 1971년 가동, 2022년 폐쇄 후 Holtec이 인수해 미국 원자력 역사상 최초의 '폐쇄 원전 재가동'을 추진했다. DOE 15.2억달러 대출보증(2025-09까지 약 5.8억 집행), 미시간주 3억달러 보조금, NRC Restart Panel과 20회 이상 공청회를 거쳐 2025-07 재가동 승인, 8월 해체→운영 상태로 전환했고 2025-12 상업운전 재개를 목표로 했다(달성 여부는 자료에 없음). Constellation의 TMI 1호기(Crane) 재가동은 DOE 10억달러 대출과 MS 20년 PPA로 추진되며 목표가 2028→2027년으로 당겨졌다. NextEra도 Duane Arnold(600MW급) 재가동을 검토한다.", "Holtec의 전략은 재가동을 SMR로 가는 디딤돌로 쓰는 것이다. 1986년 열교환기·압력용기 제작사로 출발해 1990년대 건식저장 HI-STORM(1997 NRC 인증, 글로벌 점유율 약 45%·미국 70%)으로 성장했고, 2010년대 Oyster Creek·Pilgrim·Palisades·Indian Point를 인수해 미국 대형원전 해체의 약 50%를 수행했다. 재가동에서 쌓은 규제기관 신뢰·지역사회 지지·정부자금·PPA 현금흐름을 Palisades 부지 100에이커의 SMR-300 2기로 연결하고, 부족한 대형 EPC 역량은 현대건설로 보완한다.", "수명연장은 더 큰 시장이다. IAEA 기준 500~1,100달러/kW, 1.4GW급 1기당 1~2조원이며 신규 건설 대비 총비용을 50% 이상 줄인다. 미국 94기 중 86기가 60년, 9기가 80년 운전 인가를 받았고, 프랑스 EDF는 56기 40→60년 연장(Grand Carénage)에 490~550억유로 이상을 쓴다. 캐나다 Darlington CANDU 전면 개보수는 기당 23억달러, Point Lepreau 14억 캐나다달러다. DOE UPRISE는 출력증강·재가동으로 2027년 2.5GW, 2029년 5GW 추가를 목표로 한다.", "해체는 초기 단계 시장이다. 2025-05 기준 가동원전 416기 중 30년 이상이 278기(68%)이고, 영구정지 218기 중 해체 완료는 미·독·일·스페인의 23기(약 10%)뿐이다. 1기당 권장 해체비용 7.5억~12.5억달러(1~1.8조원) 기준 세계 해체시장은 현재 200~350조원, 2050년(잠재 대상 492기) 500~900조원으로 추산된다. 해체는 준비 2년→사용후핵연료 반출 5년→해체 6년→부지복원 2년의 약 15년 사업이다.", "국내에서는 고리 1호기가 2025-06-26 원안위 해체 승인을 받아 2037년 완전해체를 목표로 하고, 월성 1호기도 절차를 준비 중이다. 설계수명 2030년 이전 완료 원전까지 합하면 10~15년간 약 13조원 해체 수요가 추정된다. 계속운전 쪽은 고리 2호기가 허가 지연 끝에 2026년 4월 재가동됐고, 고리 3·4호기는 2026-12 재가동 예정, 2030년 전 허가 만료 원전이 7기다."], "table": {"cols": ["프로젝트", "내용", "비용"], "rows": [["캐나다 Point Lepreau", "연료채널 교체·주요 설비 개보수", "C$1.4B(약 $1.1B)/기"], ["프랑스 EDF(56기)", "40→60년 연장(Grand Carénage)", "€49~55B+"], ["캐나다 Darlington", "CANDU 전면 개보수", "$2.3B/기"], ["루마니아 Cernavodă 1", "CANDU refurbishment", "약 €1.5B(2.8조원)/기"], ["일반 LTO(NEA)", "주요 설비 교체+안전성 업그레이드", "약 $1~2B"], ["해체(권장)", "제염·해체·부지복원", "$0.75~1.25B/기"]]}, "bullets": ["LTO: 500~1,100달러/kW, 1기 1~2조원, 40~60년 구간 집중", "미국 60년 인가 86기·80년 9기(94기 중)", "영구정지 218기 중 해체 완료 23기", "국내 해체시장 10~15년 약 13조원(업계 추정)", "원전 LTO는 OEM 폐쇄형 일상정비와 달리 외부 경쟁입찰 병행"], "kr": "한전KPS(루마니아 체르나보다 1호기 설비개선 4,850억원 — 3,500억원 집계도 있음, 2027 하반기 착수), 한전기술(해체종합설계), 현대건설(Holtec 파트너), 한미글로벌(체르나보다 PM)이 연결된다."}, {"name": "국내 원전 정책과 한국전력: 11차·12차 전기본, 이용률, 그리고 유가", "pill": "2025.10~2026.09", "lede": "국내 원전은 신규 대형 2기·SMR 1기(11차)에서 12차 전기본의 추가 반영 여부로 논점이 옮겨갔고, 한전 이익은 요금·유가와 함께 원전 이용률에 좌우된다.", "paras": ["11차 전력수급기본계획(2025-02 확정)은 2038년까지 1,400MW급 대형원전 2기와 SMR 1기(i-SMR 175MW×4), 노후 석탄 28기(약 14.1GW)의 LNG 전환을 담았고 원전 발전비중 목표는 35.2%다. 재검토 끝에 원전 계획이 유지됐고 대형 2기는 APR1400으로 2037~2038년 준공 목표, 설계 발주는 2027~2028년으로 예상된다. 국내 원전은 운영 26기(26.05GW), 건설 중 4기(새울 3·4, 신한울 3·4), 영구정지 2기(고리 1, 월성 1)다.", "12차 전기본(2026~2040)은 2026년 하반기 수립 중이다. 3대 메가프로젝트(AI 데이터센터 18.4GW 등)로 2040 목표수요가 158.4~165.0GW로 약 27GW 상향됐고, 추가 전력량 260TWh 중 재생 목표로 110TWh가 부족해 원전 9기 계속운전과 SMR 등 신규 원전 2기가 제시됐다. 학회들은 2039~2040년 운영 목표 신규 대형원전 2~4기·SMR 2~4기 반영을 제언했다. 초안은 10월경, 확정은 12월 목표다.", "한전 이익 구조에서 원전은 가장 싼 전원이다. 2025년 정산단가는 원자력 79원, LNG 384.6원/kWh이고, SMP 결정 구간의 83~90% 이상이 LNG라 유가가 3~5개월 후행해 구입전력비를 흔든다. 2Q21~2Q23 9개 분기 누적 47.5조원 적자 후 7차례 요금 인상(판가 108→170원/kWh)과 유가 안정으로 2025년 영업이익 13.5조원까지 회복했지만, 2026년 호르무즈 쇼크(유가 100달러+, JKM +50%)로 3분기부터 감익이 예상됐다.", "원전 이용률 민감도는 추정치마다 1%p당 연 영업이익 1,840억~4,600억원으로 범위가 넓다. 2025년 81.0%, 1Q26 71.0%, 2026년 목표 89%(한수원) vs 시장 추정 75~85%로 편차가 크며, 새울 3호기(2026 상업운전)·4호기, 고리 2~4호기 계속운전 재가동이 개선 요인이다. 유가 급등기에는 정비 중 원전 6기 조기 가동으로 이용률을 60% 후반에서 80%로 올리는 대응도 나왔다.", "한전의 원전 관련 가치는 국내 이익 방어(이용률)와 해외(UAE 바라카 지분 18% 지분법, 대미 원전 디벨로퍼·SPC 지분, 우라늄 농축 내재화)로 나뉜다. 한편 1H26 CAPEX 9.6조원이 영업현금흐름 8.5조원을 웃돌고 2028년 사채발행 한도(200%) 충족이 과제라, 대규모 해외 지분투자 여력은 재무구조와 함께 봐야 한다."], "table": {"cols": ["호기", "용량", "준공/상업운전(자료 기준)"], "rows": [["새울 3호기", "1,400MW", "2026-02 준공, 2026 상업운전(8월 예상 집계도)"], ["새울 4호기", "1,400MW", "2026-11 준공, 2027 상반기 상업운전 예상"], ["신한울 3호기", "1,400MW", "2032-10~12 목표"], ["신한울 4호기", "1,400MW", "2033-10~12 목표"], ["신규 대형 2기(11차)", "각 1,400MW", "2037~2038 상업운전, 설계 발주 2027~28"], ["i-SMR 1기(11차)", "700MW(175×4)", "2030년경 착공 목표"]]}, "bullets": ["11차: 대형 2기 + SMR 1기, 원전 비중 2038년 35.2%", "12차: 목표수요 158.4~165.0GW, 계속운전 9기·신규 2기 검토(초안 10월, 확정 12월 목표)", "정산단가 원자력 79 vs LNG 384.6원/kWh(2025)", "한전 원전 이용률 1%p 민감도: 1,840억~4,600억원(추정치별 상이)"], "kr": "국내 신규 원전 반영은 한전기술(설계), 두산에너빌리티(주기기), 우진·우리기술·비에이치아이(BOP·계측), 한전KPS(정비)의 내수 가시성을 동시에 높인다."}]}]}, {"h": "SMR·연료주기 — SMR의 현실과 연료 병목", "blocks": [{"t": "mods", "items": [{"name": "SMR 노형 지도: 3.5세대 경수로형이 먼저, 4세대는 연료가 관건", "pill": "2025.10~2026.06", "lede": "SMR은 하나의 시장이 아니라 냉각재·연료·인허가 단계가 다른 여러 설계의 경쟁이며, 2026~2030년은 FOAK 실증 구간이다.", "paras": ["3.5세대는 물을 냉각재로 쓰는 PWR·BWR 기반으로 기존 LEU 연료와 공급망·규제를 이어받는다(NuScale VOYGR, GVH BWRX-300, Holtec SMR-300, 한국 i-SMR, 중국 ACP100). 4세대는 소듐(Natrium, Aurora)·헬륨(Xe-100)·용융염(KP-FHR) 등 비수 냉각재를 써 고온·저압 운전과 연료 효율이 강점이지만 대부분 HALEU가 필요하다. 업계는 착공 가능한 3.5세대를 먼저 '복귀의 상징'으로 짓고, 4세대는 인허가·HALEU 공급망을 병행 정비하는 투 트랙을 미국의 전략으로 본다.", "인허가 진척은 편차가 크다. NuScale은 미국 SMR 중 유일하게 NRC 설계인증(50MW)·표준설계승인(77MW)을 보유하고, TerraPower는 2026-03 차세대 원자로 최초 NRC 건설승인을 받았다. BWRX-300은 캐나다 Darlington에서 2025년 착공했고 TVA가 미국 건설허가를 신청했다. X-energy는 건설허가 심사 중(2026년 말 결정)이며 TRISO 연료공장을 짓고 있다. Kairos Hermes는 비상업 실증로 건설승인, Oklo는 2022년 COL 반려 후 DOE 실증으로 선회해 2026-05 PDC 보고서 승인을 받았다.", "제도는 빨라지고 있다. NRC Part 53(기술중립·위험정보 기반 선택형 허가)이 2026년 3~4월 확정·발효돼 공장 연료 장전, FOAK 허가정보 반복 활용 등을 허용하고, 마이크로리액터용 Part 57이 제안됐다. DOE는 First Mover 부지로 Palisades(Holtec)·Clinch River(TVA BWRX-300)를 선정했고, TVA·Holtec에 8억달러를 지원했다.", "수요 쪽은 빅테크가 끌고 있다. Amazon-X-energy 2039년까지 5GW(최대 64기), Google-Kairos 500MW(2030 첫 가동), Meta-TerraPower 최대 8기, ENTRA1-TVA NuScale 최대 6GW(72기), Oklo-Switch 12GW MOU 등이다. 다만 다수가 구속력 없는 협약이라는 점이 반복 지적된다.", "한국 기업 연결은 노형별로 갈린다. 두산은 NuScale·X-energy·TerraPower 3사 모두의 주기기 파운드리, 현대건설은 Holtec, 삼성물산은 NuScale·GVH, DL이앤씨는 X-energy(CI 표준설계), SK는 TerraPower, 한수원은 X-energy·TerraPower·Oklo와 제휴한다."], "table": {"cols": ["노형", "개발사", "냉각재/연료", "출력", "인허가·일정(자료 기준)", "국내 연결"], "rows": [["VOYGR", "NuScale", "물/LEU", "77MW×최대 12", "NRC SDA 보유, 루마니아 FID, 상업운전 2030 목표", "두산, 삼성물산"], ["BWRX-300", "GE Vernova Hitachi", "물(BWR)/LEU", "300MW", "Darlington 착공(2025), 2029말~2030 운전", "삼성물산, 태웅"], ["SMR-300", "Holtec", "물/LEU(<4.95%)", "300MW×2", "Palisades, CP 절차·착공 순연", "현대건설"], ["Natrium", "TerraPower", "소듐/HALEU 금속", "345(최대 500)MW", "NRC CP 2026-03, 2031 상업운전 목표", "SK, 한수원, HD현대, 두산"], ["Xe-100", "X-energy", "헬륨/TRISO(15.5%)", "80MW×4", "CP 결정 2026년 말 예상", "두산, DL이앤씨, 한수원"], ["KP-FHR", "Kairos", "용융염/TRISO", "50~75MW", "Hermes 비상업 건설승인, 2029 완공", "-"], ["Aurora", "Oklo", "소듐/HALEU", "75MW", "COL 반려 후 DOE 실증 2027~28", "한수원 제휴"], ["i-SMR", "한수원", "물/LEU", "170~175MW×4", "표준설계인가 2028 목표", "한전기술, 두산"]]}, "bullets": ["3.5세대: 공급망·규제 연속성 / 4세대: 고온·효율, HALEU 필요", "Part 53 확정(2026-03~04), Part 57 제안(2026-04)", "빅테크 계약 다수가 MOU 수준 → 구속력 확인 필수", "SMR은 2030년 이후 일부 모델로 수렴 전망"], "kr": "두산에너빌리티는 노형 경쟁의 승자가 누구든 주기기를 공급하는 '파운드리' 위치라는 점이 강조되며, 건설사는 파트너 노형의 성패에 수혜가 연동된다."}, {"name": "SMR 경제성의 현실: FOAK 비용, NuScale의 교훈, 그리고 학습효과 가정", "pill": "2025.12~2026.06", "lede": "SMR은 지금 대형원전보다 kW당 비싸며, 경제성은 7~8호기 이후 학습효과가 가정대로 나오는지에 달려 있다.", "paras": ["TerraPower Kemmerer #1은 345MW에 총 40억달러로, 1GW 환산 약 17~17.5조원이다(환율 1,500원 가정). 2021~2025년 상업가동한 대형원전 평균 13.7조원/GW보다 20~30% 비싸다. 회사는 7~8번째 원자로 조립 전후 20~30% 학습효과를 기대하며, 그러면 13.6조원(20%)~11.9조원(30%)으로 대형원전 수준에 근접한다. 약 3년 건설기간을 고려하면 2034~2035년에 대형원전 수준 투자비로 가동하는 구조가 이론상 가능하다는 계산이다.", "초기 프로젝트의 실패 사례도 분명하다. NuScale의 UAMPS CFPP는 목표 전력가격이 2021년 58달러에서 2023년 89달러/MWh로 오르며 수요자 이탈로 취소됐다. 선도자 불이익을 피하려면 구매자·건설자가 수요를 묶어 평균가로 다수 호기를 발주하는 컨소시엄 접근(보잉 787 첫 50대 판매와 유사)이 필요하다는 지적이다. 캐나다 BWRX-300 Darlington 1호기 승인 건설비는 61억(+공통인프라 16억) 캐나다달러, 4기 총사업비 약 209억 CAD(약 150억달러)이며 후속호기 30% 절감을 목표로 한다.", "다른 추정들도 범위가 넓다. 호주 CSIRO는 2030년 SMR LCOE를 230~382A$/MWh로 보고, 한 추정은 SMR 발전단가가 대형원전의 약 1.5배라고 본다. 반면 i-SMR은 3,500달러/kWe 이하·모듈 공기 24개월·원자로용기 제작기간 48→24개월을 목표로 하고, 두산은 RV 제작기간 17→3개월 단축(PM-HIP·전자빔 용접)을 준비 중이다. 대형원전 호기당 6~10조원 vs SMR 약 3조원이라는 비교는 총액 기준이지 kW당 기준이 아니라는 점에 유의해야 한다.", "제도·세제는 경제성의 큰 변수다. OBBBA에서 2032년까지 착공한 원전은 10년간 PTC를 받지만 2033년부터 축소, 2035년 이후 착공분은 미적용이라 착공 시점에 따라 LCOE가 약 30달러/MWh 달라진다. EIA는 2031년 신규 원전 LCOE를 PTC 포함 88달러로 보지만 PTC 제외 시 약 120달러로 환산된다.", "그럼에도 빅테크가 SMR에 돈을 대는 이유는 Time-to-Power다. 데이터센터는 2년이면 짓지만 계통 연결은 3~7년이 걸리고, 가스터빈은 5년 이상 대기다. 이 기회비용이 FOAK 프리미엄을 감수하게 만든다. 원전 기반 PPA 가격(110~120달러/MWh)이 SMR 경제성의 현실적 비교 기준으로 제시된다."], "table": {"cols": ["구분", "1GW 기준 투자비", "비고"], "rows": [["2021~2025 상업가동 대형원전 평균", "13.7조원", "추가 하락 여지 제한(업계 추정)"], ["TerraPower 실증 #1", "약 17.5조원", "345MW 총 40억달러"], ["TerraPower #7~8(학습효과 20%)", "13.6조원", "가정"], ["TerraPower #7~8(학습효과 30%)", "11.9조원", "가정"], ["BWRX-300 Darlington 1호기", "61억 CAD(+16억 공통인프라)/300MW", "후속호기 30% 절감 목표"], ["i-SMR 목표", "3,500달러/kWe 이하", "설계 목표"]]}, "bullets": ["NuScale CFPP: 58→89달러/MWh로 상승 후 취소(2023)", "SMR 학습효과는 공장 제작 비중이 높아 대형원전보다 클 수 있다는 전망", "PTC 착공 기한(2032) 전후로 LCOE 약 30달러/MWh 차이", "Oklo 등 매출 없는 SMR 업체는 인허가 마일스톤이 밸류의 주 변수(2026E PSR 극단적)"], "kr": "국내 SMR 관련 기업의 실적은 FOAK 발주가 확정 계약으로 바뀌는 시점에만 인식되므로, MOU·지분투자 단계의 기대와 구분해 봐야 한다."}, {"name": "데이터센터 전원 경쟁에서 원전의 자리: 가스터빈·SOFC·SMR의 시간표", "pill": "2025.11~2026.09", "lede": "데이터센터 부하는 수요가 아니라 24시간 전원의 공급 속도에 묶여 있으며, 단기엔 가스·연료전지, 2030년 이후엔 원전·SMR이 다음 계단을 만든다.", "paras": ["데이터센터는 24시간 일정 부하라 재생+ESS만으로는 대응이 어렵고, 규모가 MW에서 GW로 커지면 부하변동의 절대량과 계통 탈락 충격이 발전기 1기 정지 수준이 된다(같은 20% 변동도 300MW는 60MW, 1GW는 200MW). 계통대기는 2023년 2.6TW 정점, 2024년 2.3TW이고 2000~2019년 접속신청 중 실제 상업운전 도달은 19%뿐이다(Berkeley Lab). DOE Section 202 긴급명령(PJM), 16개 주 데이터센터 모라토리엄 법안 등 규제도 BTM(자가발전) 유인을 키운다.", "미국 디스패처블 전원 생산능력은 향후 10년 연평균 약 27GW(가스터빈 20·원자로 5·연료전지 2GW)로 추정되는데 피크 부하는 2028년 이후 연 33GW 이상 늘어 구조적 부족이 예상된다. 가스터빈 3사(약 70% 과점)는 신규 주문 인도를 2030년 이후로 제시하고 GEV의 2030년까지 잔여 슬롯은 10GW다. 그래서 데이터센터 부하는 2028년까지 연 13GW, 2030년까지 연 17GW, 2030년 이후 원전·SMR이 가세하며 연 20GW 이상으로 계단식으로 늘 것이라는 시나리오가 제시된다.", "단기 기저전원으로는 SOFC(Bloom Energy, 효율 55~65%, 블록당 250~325kW, 설치 1~2년)가 현실적 레퍼런스이고, 가스복합은 1GW 기준 연 연료비가 Henry Hub 3/5/7달러에서 1.8/2.2/3.1억달러로 가격 변동성이 크다. 2030년대 이후에는 규모 확장성(2~10개 모듈로 GW급), 낮은 연료비, 회전 관성에 따른 전력품질에서 SMR이 우위라는 논리다. Bloom 설문상 100% 온사이트 발전 데이터센터 비중 전망은 2024년 1%에서 2025년 33%(2030년 말)로 뛰었다.", "현실적 모델은 '가스 먼저, 원전 나중(Gas + Nuclear)'이다. Blue Energy는 GE Vernova 가스터빈과 BWRX-300을 결합해 비원자력 구간을 먼저 지어 가스로 전력을 공급하고 이후 원자로를 추가하며(NRC가 3월 관련 기술보고서 승인), Oklo-Liberty Energy도 같은 구조다. Fermi Matador는 가스 6GW(2027)+5GW, 대형원전 4.4GW(2032), 태양광+ESS 1.6GW로 구성된다. 초기 가스발전 현금흐름이 원전 금융조달에도 유리하다.", "IEA는 데이터센터 공급 전력 중 원전이 2024년 70TWh에서 2035년 240TWh로 늘 것으로 본다. 다만 대형원전은 6~7년, SMR은 3~5년이 걸려 2030년 전에는 기여가 제한적이고, 2040년 미국 원전 추가는 약 80GW(대형 12+SMR 57GW)로 400GW 목표에 크게 못 미친다는 추정도 있다."], "table": {"cols": ["항목", "SOFC 연료전지", "가스터빈(OCGT/CCGT)", "SMR"], "rows": [["상용화", "운영 중", "운영 중(슬롯 부족)", "실증(2030 전후)"], ["설치기간", "1~2년", "1~4년(+인도 대기 5년+)", "약 2~3년(상용화 후), 3~5년"], ["계통 관성", "없음(인버터)", "있음", "있음"], ["연료", "가스·수소(비용 부담)", "가스(가격 변동)", "우라늄(연료비 낮음)"], ["모듈 규모", "250~325kW", "수십~수백 MW", "77~345MW"], ["GW급 확장", "수천 개 모듈", "다수 기", "2~10개 모듈"], ["역할", "중기 기저", "브리지·유연성", "장기 기저"]]}, "bullets": ["데이터센터 신청 잔고 590~641GW, 향후 10년 연결 가능 약 30%", "1GW 가스복합 연 연료비 1.8~3.1억달러(HH $3~7)", "IEA: 데이터센터 공급 원전 70→240TWh(2024→2035)", "On-site 발전 계획 비중 약 27~30%(Cleanview 90GW)"], "kr": "두산에너빌리티는 가스터빈(리드타임 2~3년 vs 경쟁사 5~7년)과 원전·SMR을 동시에 가진 드문 업체로, 이 시간표 양쪽에 노출돼 있다. SK이노베이션·SK에코플랜트(Bloom SOFC)도 연결점이다.", "svg": "<svg viewBox=\"0 0 960 262\" role=\"img\" aria-label=\"데이터센터 전원은 설치가 빠른 연료전지가 먼저, 가스터빈은 2030년 이후 인도, SMR은 2030년 전후, 대형원전은 2030년대 중반으로 시간표가 갈린다\"><defs><marker id=\"a-dcp1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-dcp1-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--accent)\"/><\/marker><marker id=\"a-dcp1-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--ok)\"/><\/marker><marker id=\"a-dcp1-warn\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--warn)\"/><\/marker><marker id=\"a-dcp1-alert\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--alert)\"/><\/marker><\/defs><text x=\"210\" y=\"30\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.75\">2026<\/text><path d=\"M210 38 L210 224\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"350\" y=\"30\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.75\">2028<\/text><path d=\"M350 38 L350 224\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"490\" y=\"30\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.75\">2030<\/text><path d=\"M490 38 L490 224\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"630\" y=\"30\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.75\">2032<\/text><path d=\"M630 38 L630 224\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"770\" y=\"30\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.75\">2034<\/text><path d=\"M770 38 L770 224\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"910\" y=\"30\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.75\">2036<\/text><path d=\"M910 38 L910 224\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"198\" y=\"69\" font-size=\"12\" text-anchor=\"end\" font-weight=\"600\">SOFC 연료전지<\/text><rect x=\"210\" y=\"50\" width=\"140\" height=\"28\" rx=\"4\" style=\"fill:var(--ok);fill-opacity:.10;stroke:var(--ok)\" stroke-width=\"1.3\"/><text x=\"218\" y=\"69\" font-size=\"10.5\" text-anchor=\"start\">설치 1~2년 · 중기 기저<\/text><text x=\"198\" y=\"113\" font-size=\"12\" text-anchor=\"end\" font-weight=\"600\">가스터빈<\/text><rect x=\"210\" y=\"94\" width=\"350\" height=\"28\" rx=\"4\" style=\"fill:var(--warn);fill-opacity:.10;stroke:var(--warn)\" stroke-width=\"1.3\"/><text x=\"218\" y=\"113\" font-size=\"10.5\" text-anchor=\"start\">신규 주문 인도 2030년 이후 · 리드타임 5~7년<\/text><text x=\"198\" y=\"157\" font-size=\"12\" text-anchor=\"end\" font-weight=\"600\">SMR<\/text><rect x=\"420\" y=\"138\" width=\"490\" height=\"28\" rx=\"4\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"428\" y=\"157\" font-size=\"10.5\" text-anchor=\"start\">2029~31 초도호기 · 2035 HALEU 기준 최대 8GW<\/text><text x=\"198\" y=\"201\" font-size=\"12\" text-anchor=\"end\" font-weight=\"600\">대형원전<\/text><rect x=\"700\" y=\"182\" width=\"210\" height=\"28\" rx=\"4\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"708\" y=\"201\" font-size=\"10.5\" text-anchor=\"start\">지금 착공해도 2030년대 중반 운전<\/text><text x=\"480\" y=\"250\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.85\">재생에너지는 Hourly Matching 80%까지 경제적, 99%면 비용 50%+ 상승 — 24시간 무탄소 기저전원 공백이 SMR 수요의 근거<\/text><\/svg>", "cap": "**결론: AI 데이터센터 전원 경쟁에서 원전·SMR은 2030년 이후의 장기 기저전원이고, 그 전까지는 연료전지와 (슬롯이 남은) 가스터빈이 공백을 메운다.** 가스터빈 신규 주문 인도가 2030년 이후로 밀린 것이 SMR 시간표를 앞당기는 유인이다. 수치는 자료 발행 시점 기준."}, {"name": "원전 확대의 진짜 병목: 변환·농축·HALEU", "pill": "2025.11~2026.06", "lede": "원자로를 지어도 연료가 없으면 못 돌린다. 러시아를 빼면 서방 농축 능력은 현재 가동 원전을 겨우 감당하는 수준이고, HALEU는 사실상 러시아 독점이다.", "paras": ["핵연료는 채굴(U3O8) → 변환(UF6) → 농축(SWU) → 성형가공 순서로 만들어진다. 1GW 원자로 1년 가동에 우라늄 약 170MTU와 약 14만 SWU가 든다. 글로벌 농축 능력 약 6,000만 SWU(대형원전 약 410GW분) 중 Rosatom/Tenex가 약 2,700만(45%)이고 Urenco 1,750만, Orano 750만, CNNC 650만, Centrus 100만 SWU다(WNA). 다른 집계(서울대)는 Rosatom 27,100·Urenco 17,900·Orano 7,500·CNNC 8,900톤SWU/년(CNNC 2030E 17,000)으로 제시한다.", "Urenco·Orano·Centrus 증설을 더해도 서방 농축은 대형원전 최대 약 160GW분이라, 미국 300GW를 포함한 신규 475GW 계획을 감당하려면 현재 규모에 맞먹는 추가 설비가 필요하다는 계산이다. 변환도 병목이어서 2022년 러시아 공급 차질 때 전환비가 천연 UF6 가격의 10%에서 20% 이상으로 뛰었다. 미국 상업 변환시설은 Metropolis Works 한 곳(연 7,000tU)이고 농축 자립도는 25~30%다. 400GW를 위해서는 채굴 44배, 변환 11배, 농축 15배, 연료제조 3배 증설이 필요하다는 인용도 있다.", "HALEU는 더 심하다. 5~19.75% 농축으로 4세대 SMR과 장주기 핵잠 노심에 쓰이며, 1kg 생산에 천연우라늄이 최대 50kg(LEU 약 10kg) 든다. 상업 대량공급은 사실상 러시아뿐이고, 서방에선 Centrus가 2023-10 미국 최초로 생산해 2024년 DOE에 900kg을 납품했다. Centrus는 캐스케이드 120기로 2030년 6MTU, 복수 라인으로 2035년 최대 50MTU를 목표로 한다. Xe-100 1기 연 연료 소요 약 0.67MTU 기준, 50MTU면 약 80기(8GW) 운전이 가능하다는 계산이다. 2030년대 미국 HALEU 수요는 연 50톤 이상, DOE 시범생산은 1톤 미만이다.", "정책 대응은 다층적이다. 미국은 러시아산 우라늄 수입금지법(2024-05 제정, 2028-01 전면 발효)으로 러시아산 수입비중을 16.5%(2020)에서 3.6%(2024)로 낮췄고, DOE는 LEU·HALEU 생산 확대에 27억달러(총 HALEU 관련 약 34억달러)를 투입하며 HALEU 조건부 공급 승인, 첨단 핵연료 파일럿, DPA 컨소시엄을 운영한다. 미국 우라늄 생산은 2023년 5만에서 2024년 67.7만 파운드로 늘었다.", "한국에는 연결고리가 두 개다. 한수원은 연간 원전 연료비 2조원 이상 중 5천억원 이상을 농축에 쓰는데, 한미 원자력협정 개정으로 농축이 허용되면 내재화해 한전 연결 이익과 충당부채를 개선할 수 있다. 또 2025-08 한수원·포스코인터내셔널·Centrus 3자 MOU로 미국 신규 원심분리기 공장 공동투자와 농축우라늄 오프테이크 트레이딩이 추진되고 있다."], "table": {"cols": ["기업(국가)", "변환(톤U/년)", "농축(SWU/년)"], "rows": [["Rosatom/Tenex(러시아)", "25,000", "2,700만"], ["Orano(프랑스)", "15,000", "750만"], ["Urenco(영·독·네)", "-", "1,750만"], ["ConverDyn(미국)", "15,000", "-"], ["Cameco(캐나다)", "12,500", "-"], ["CNNC(중국)", "12,000", "650만"], ["Centrus(미국)", "-", "100만"]]}, "bullets": ["1GW·1년: 우라늄 170MTU + 14만 SWU", "러시아 농축 점유 약 45%, 미국 농축 자립도 25~30%", "HALEU: Centrus 0.9 → 6 → 50MTU(2026→2030→2035)", "미국 러시아산 우라늄 수입금지 전면 발효 2028-01", "4세대 SMR 2035년 최대 8GW 운전 가능(업계 추정, ORNL 연료 소요 기반)"], "kr": "포스코인터내셔널(Centrus 오프테이크), 한국전력(한수원 농축 내재화 가능성)이 직접 연결점이며, 한미 원자력협정 개정 협상과 한 묶음으로 움직인다."}]}]}]}, "market": {"title": "시장 규모·수급", "en": "Market Size & Supply-Demand", "lede": "원전 시장은 **용량(GW)과 파이프라인(기수)**으로 읽는다. 글로벌 가동 용량은 약 376~398GW, 2050년 전망은 561~1,017GW로 넓게 퍼져 있다. 공급 측에서는 주기기·단조 CAPA(미·유럽 실질 연 15기)와 연료(농축·HALEU)가 착공 속도의 상한을 정한다. 한국 밸류체인이 실제로 접근할 수 있는 시장은 중·러 물량과 WH 합의 제한 지역을 뺀 부분이라는 점이 이 탭의 핵심이다.", "sections": [{"h": "용량과 전망 — 지금의 1.5~2.7배가 목표치", "blocks": [{"t": "bars", "charts": [{"title": "국가별 원전 설비용량 Top5", "unit": "GW", "note": "2025-07 기준. 원출처 IAEA. 발전량(2024, TWh)은 미국 782·중국 418·프랑스 364·러시아 202·한국 179", "items": [{"l": "미국", "v": 97, "tag": "확인"}, {"l": "프랑스", "v": 63, "tag": "확인"}, {"l": "중국", "v": 55.3, "tag": "확인"}, {"l": "러시아", "v": 26.8, "tag": "확인"}, {"l": "한국", "v": 25.6, "tag": "확인"}]}, {"title": "2050년 글로벌 원전 용량 전망", "unit": "GW", "note": "현재는 2025-09 IAEA PRIS 가동 용량. IAEA(2025-09), IEA WEO2024 시나리오, 국가 목표 반영치는 업계 추정", "items": [{"l": "현재(2025-09)", "v": 376, "tag": "확인"}, {"l": "IAEA Low", "v": 561, "tag": "추정"}, {"l": "IEA STEPS", "v": 647, "tag": "추정"}, {"l": "IEA APS", "v": 874, "tag": "추정"}, {"l": "IAEA High", "v": 992, "tag": "추정"}, {"l": "IEA NZE", "v": 1017, "tag": "추정"}, {"l": "국가목표 반영", "v": 1262, "tag": "추정"}]}]}, {"t": "p", "text": "IAEA의 2050 전망은 2021년 대비 Low +42%·High +25% 상향됐고, IEA 전망도 2022년 대비 약 23% 올라갔다. 매년 전망이 올라가는 것 자체가 정책·수요 모멘텀의 방증이지만, 목표 달성에는 연 30~34GW 신규 착공이 필요해 최근 5년 평균(연 5~10기)과 큰 격차가 있다."}], "tag": "추정"}, {"h": "접근 가능 시장 — 파이프라인 480GW 중 한국 몫은 일부", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 330\" role=\"img\" aria-label=\"글로벌 파이프라인 480GW 중 팀코리아가 단독으로 들어갈 수 있는 시장은 WH 합의와 중·러 자국 시장을 뺀 일부다\"><defs><marker id=\"a-acc1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-acc1-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--accent)\"/><\/marker><marker id=\"a-acc1-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\ 요는 역사적으로 **에너지 안보·장기 전력수요·교체 수요·금융 복원**이 겹칠 때 폭발했다. 2020년대는 러-우 전쟁과 호르무즈 봉쇄, AI 데이터센터, 40년 넘은 165기, 그리고 RAB·정부 대출·빅테크 PPA가 동시에 나타난 서구 기준 40년 만의 국면이다. 이 탭은 사이클의 현재 위치를 먼저 짚고, 6개 테마를 드라이버·확인 신호·국내 연결로 나눠 본다.", "sections": [{"h": "지금 어디에 있나 — 실체 검증 국면", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 290\" role=\"img\" aria-label=\"원전 사이클은 정책 기대에서 금융 장치를 거쳐 실체 검증 국면에 와 있고, 첫 FID·착공이 나와야 멀티플이 아니라 이익이 주가를 끌기 시작한다\"><defs><marker id=\"a-cyc1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-cyc1-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--accent)\"/><\/marker><marker id=\"a-cyc1-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--ok)\"/><\/marker><marker id=\"a-cyc1-warn\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--warn)\"/><\/marker><marker id=\"a-cyc1-alert\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--alert)\"/><\/marker><\/defs><polygon points=\"12,40 180,40 196,92 180,144 12,144\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"100\" y=\"70\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">① 정책 기대<\/text><text x=\"100\" y=\"88\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.8\">2025-05~10<\/text><text x=\"100\" y=\"108\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.85\">행정명령 4건<\/text><text x=\"100\" y=\"124\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.85\">800억달러 ><text x=\"860\" y=\"88\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.8\">착공 후 1~4년<\/text><text x=\"860\" y=\"108\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.85\">BOP·계측·전기<\/text><text x=\"860\" y=\"124\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.85\">정비·LTO 반복<\/text><polygon points=\"392,26 408,26 400,36\" style=\"fill:var(--accent)\"/><rect x=\"386.22\" y=\"10\" width=\"27.56\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"400\" y=\"21\" font-size=\"11\" text-anchor=\"middle\" style=\"fill:var(--accent)\">지금<\/text><rect x=\"12\" y=\"168\" width=\"560\" height=\"50\" rx=\"8\" style=\"fill:var(--warn);fill-opacity:.10;stroke:var(--warn)\" stroke-width=\"1.3\"/><text x=\"292\" y=\"188.875\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">주가 동인: 기대가 멀티플을 움직인다<\/text><text x=\"292\" y=\"206.125\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.78\">리레이팅의 약 90%가 멀티플 기여(12MF EV/EBITDA 기준 추정)<\/text><rect x=\"588\" y=\"168\" width=\"360\" height=\"50\" rx=\"8\" style=\"fill:var(--ok);fill-opacity:.10;stroke:var(--ok)\" stroke-width=\"1.3\"/><text x=\"768\" y=\"188.875\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">주가 동인: 이익 추정이 가능해진다<\/text><text x=\"768\" y=\"206.125\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.78\">프로젝트별 EV/EBITDA·P/B<\/text><path d=\"M572 193 L588 193\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-cyc1)\"/><text x=\"480\" y=\"250\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">확인 신호: 미국 첫 AP1000 FID · SPC 지분구조 · 대미투자 원전 선정 · Palisades/Fermi/코즐로두이 EPC 본계약<\/text><text x=\"480\" y=\"272\" font-size=\"11.5\" text-anchor=\"middle\" style=\"fill:var(--alert)\">되돌림 신호: FID 지연 · LSTK 손실 · SMR FOAK 비용 초과 · 정책 교체<\/text><\/svg>", "cap": "**결론: 2026년 9월은 정책·금융 장치는 갖춰졌지만 미국 대형원전 FID는 아직 0인 '실체 검증 대기' 국면이다. 이 구간에서는 기대가 멀티플을 움직이고, 첫 FID·착공이 나와야 이익 추정이 주가를 끌기 시작한다.** 국내 원전주 리레이팅의 약 90%가 멀티플 기여로 추정되는 만큼, 확인 신호와 되돌림 신호를 같이 추적한다."}, {"t": "callout", "text": "2026년 9월 현재는 **정책·금융 장치는 갖춰졌지만 미국 대형원전 FID는 아직 0인 '실체 검증 대기' 국면**이다. EDF 175억달러와 대미투자특별법으로 돈의 통로는 열렸고, Part 53 발효와 TerraPower 건설승인으로 SMR 인허가 경로도 선명해졌다. 반면 SPC 지분 구조, AP1000 vs APR1400 노형, 한국 기업의 역할(주계약 vs 벤더), Palisades·Fermi·코즐로두이의 실제 착공·EPC 체결은 자료상 여전히 '예정'이다. 국내에서는 12차 전기본의 원전 반영과 한미 원자력협정 협상이 다음 이벤트다.", "title": "현재 국면 요약"}]}, {"h": "① 미국 원전 재건 — 정부가 첫 호기의 리스크를 사준다", "blocks": [{"t": "grid", "items": [{"h": "드라이버", "p": "400GW·10기 착공 목표, 2029-01 누적 800억달러 FID 조건, 2026-11 중간선거 전 착공 성과 압박, DOE '첫 5~10기 대출 거의 확실' 언급(2026-04)."}, {"h": "확인 신호", "p": "SPC 지분 구조와 첫 FID(가설 2027~2029-01, 2기 단위), EDF 5개 프로젝트의 10억달러 선출자 충족, 유틸리티의 자기자본 투입 여부.", "tag": "추정"}, {"h": "국내 연결", "p": "두산에너빌리티(주기기 LLI), 한전기술(AP1000 종합설계 외주 가능성, 기당 약 0.3조원), 현대건설(Fermi FEED·불가리아), 한국전력(디벨로퍼·SPC 지분 후보)."}], "cols": 3}], "note": "30년 공백으로 설계·주기기·EPC·숙련인력이 모두 비어 있는 미국이, 행정명령(2025-05) → 정부-WH 800억달러 파트너십(2025-10) → EDF 175억달러 대출(2026-06)로 FOAK 리스크를 정부가 흡수하는 Fleet 발주 구조를 만들고 있다."}, {"h": "② 팀코리아 해외 수출 — 연 1건 페이스가 유지되나", "blocks": [{"t": "grid", "items": [{"h": "드라이버", "p": "공기·단가 레퍼런스(바라카 8~9년, 신한울 2,587달러/kW), 한전·한수원 수출체계 정리(2026-05), 에너지 안보 수요."}, {"h": "확인 신호", "p": "사우디 두와이힌 선정 일정(2027 → 2030 연기 반영 전망도), UAE 바라카 5~8 선정(2027~28), 두코바니 시공 본계약·현지 참여율.", "tag": "추정"}, {"h": "국내 연결", "p": "수혜 순서는 설계(한전기술) → 주기기(두산) → 시공(주간사 건설사) → 정비(한전KPS). 수주 공백이 길면 설계사 고정비 레버리지가 역으로 작동한다."}], "cols": 3}], "note": "체코 두코바니(약 26조원, 2025-06) 이후 다음 수주는 사우디·체코 테믈린·튀르키예·베트남·UAE 후속에 걸려 있다. WH 협정으로 수출 가능 지역이 정해졌고, 경쟁자는 서방형 시장에선 EDF·WH, 신흥국에선 Rosatom·중국이다."}, {"h": "③ SMR·빅테크 — 전력 확보 속도가 비용을 이긴다", "blocks": [{"t": "grid", "items": [{"h": "드라이버", "p": "Amazon-X-energy 5GW, Meta 원전 6.5GW, Google-Kairos 500MW, 가스터빈 신규 주문 인도 2030년 이후, Part 53 발효(2026-04)."}, {"h": "확인 신호", "p": "Darlington BWRX-300 비용·일정(1호기 61억 CAD), TerraPower OL 신청(2027 하반기), Xe-100 CP(2026 말), 구속력 있는 PPA 전환.", "tag": "추정"}, {"h": "국내 연결", "p": "두산(NuScale·X-energy·TerraPower 주기기 파운드리, SMR 전용공장 2028), 현대건설(Holtec), 삼성물산(NuScale·GVH), DL이앤씨(X-energy), SK(TerraPower)."}], "cols": 3}], "note": "AI 데이터센터가 24시간 무탄소 기저전원을 찾으면서 빅테크가 SMR PPA·지분투자로 초기 수요를 묶고 있다. 3.5세대(BWRX-300·NuScale·SMR-300)가 먼저, 4세대(Natrium·Xe-100)는 연료가 관건이다."}, {"h": "④ 연료주기·한미 협정·핵잠 — 정책 이벤트형 옵션", "blocks": [{"t": "grid", "items": [{"h": "드라이버", "p": "팩트시트의 민간 농축·재처리 지지 명문화(2025-11), 범정부 TF(2026-01), 핵잠 실무협의(2026-06·07), DOE LEU·HALEU 27억달러."}, {"h": "확인 신호", "p": "협정 개정 범위(20% 미만 농축·재처리), 91조 별도협정, Centrus 증설 경로(2030 6MTU).", "tag": "추정"}, {"h": "국내 연결", "p": "한국전력(한수원 농축비 연 5천억원+ 내재화), 포스코인터내셔널(Centrus 오프테이크), 한화오션·HD현대중공업(선체), 효성중공업(추진전동기)."}], "cols": 3}], "note": "러시아 의존 탈피(우라늄 수입금지 2028-01)와 HALEU 병목, 한국형 핵잠 승인(2025-10)이 한미 원자력협정 개정 논의로 합쳐졌다. 개정되면 농축 내재화·재처리·토탈패키지 수출이라는 새 영역이 열린다."}, {"h": "⑤ 계속운전·재가동·해체·정비 — 신규 사이클과 독립적인 반복 매출", "blocks": [{"t": "grid", "items": [{"h": "드라이버", "p": "DOE UPRISE(2029년까지 5GW 출력증강·재가동), 국내 7기 허가 만료, 글로벌 CANDU 개보수."}, {"h": "확인 신호", "p": "고리 3·4 재가동(2026-12-30), 체르나보다 1 착수(2027 하반기), 고리 1 해체 진척."}, {"h": "국내 연결", "p": "한전KPS(반복계약 약 72%, 체르나보다 4,850억원), 우진(ICI 교체), 우진엔텍·일진파워·금양그린파워, 한전기술(해체설계)."}], "cols": 3}], "note": "가동 원전의 약 40%(165기)가 설계수명 40년을 넘었다. 계속운전은 신규 대비 총비용을 50% 이상 줄여 빅테크 PPA(TMI·Clinton)와 재가동(Palisades)이 먼저 나왔고, 해체는 영구정지 218기 중 23기만 끝났다."}, {"h": "⑥ 국내 원전 정책·한국전력 — 이용률과 유가의 줄다리기", "blocks": [{"t": "grid", "items": [{"h": "드라이버", "p": "12차 전기본(초안 10월·확정 12월 목표), 원전 이용률(2025 81.0% → 1Q26 71.0%, 목표 89%), 유가·SMP."}, {"h": "확인 신호", "p": "신규 원전 기수·SMR 반영, 설계 발주 시점(2027~28), 이용률 회복.", "tag": "추정"}, {"h": "국내 연결", "p": "한국전력, 한전기술·두산·BOP 벤더(내수 발주), 한전KPS(정비 호기 수)."}], "cols": 3}], "note": "11차 전기본(대형 2기·SMR 1기)에 이어 12차에서 계속운전 9기·신규 2기가 검토된다. 한전은 원전 이용률이 요금 다음의 이익 변수이고, 2026-03 호르무즈 쇼크는 유가를 통해 원가를 밀어 올렸다."}, {"h": "연대기 — 2025-05 행정명령부터 2026-09까지", "blocks": [{"t": "timeline", "items": [{"date": "2025-05", "title": "트럼프 원자력 행정명령 4건", "body": "2050년 400GW, 2030년 대형원전 10기 착공, NRC 18개월 기한. 30년 침체 미국 원전의 재건 선언으로 원전 테마가 단기 스토리에서 구조적 모멘텀으로 전환.", "tone": "긍정"}, {"date": "2025-06", "title": "체코 두코바니 5·6호기 본계약", "body": "팀코리아가 EDF를 제치고 약 26조원 계약. UAE 이후 첫 대형 수출이자 국내 원전 밸류체인 리레이팅의 출발점. 고리 1호기 해체 승인도 같은 달.", "tone": "긍정"}, {"date": "2025-08", "title": "한미 원전 MOU 패키지", "body": "한수원·두산-X-energy·AWS SMR, 한수원·삼성물산-Fermi 대형원전, 한수원-Centrus 농축 투자 MOU. 한수원-WH 지재권 합의로 수출 지역 제한이 알려지며 논란 병행.", "tone": "중립"}, {"date": "2025-10", "title": "미 정부-WH 800억달러 파트너십·현대건설 Fermi FEED", "body": "AP1000 8~10기 지원과 이익공유·IPO 요구권. 현대건설이 Fermi America AP1000 4기 FEED를 수주하고 Fermi가 나스닥에 상장. OKLO·Centrus 등 글로벌 원전주 2차 랠리.", "tone": "긍정"}, {"date": "2025-10", "title": "K-SSN 승인과 한미 팩트시트(11월)", "body": "핵추진잠수함 건조 승인, 팩트시트에 민간 농축·재처리 절차 지지 명문화. 123협정 개정 논의가 원전 연료주기 이슈로 확장.", "tone": "긍정"}, {"date": "2025-11", "title": "'2026 현실화 원년' 전망과 3,500억달러 대미투자", "body": "시장은 Bankability·Fleet·Execution 프레임으로 2026년 착공 가시화를 전망. 한미 관세 합의로 3,500억달러 대미투자(한국 벤더 우선권) 확정.", "tone": "긍정"}, {"date": "2025-12", "title": "DOE SMR First Mover 부지 선정", "body": "Palisades(Holtec·현대건설)와 Clinch River(TVA BWRX-300) 선정, TVA·Holtec 8억달러 지원. 두산 체코 주기기 5.64조원 계약 공시.", "tone": "긍정"}, {"date": "2026-01", "title": "한미원자력협력 TF 출범·WH 글로벌 협정", "body": "범정부 TF가 협정 개정 논의 착수. 한수원-WH 협정으로 팀코리아 단독 수출 불가 지역(북미·EU·영국·일본·우크라이나) 확정. DOE LEU·HALEU 27억달러 투자.", "tone": "중립"}, {"date": "2026-02", "title": "이란 공습·SMR 특별법 통과", "body": "2월 말 미·이스라엘의 이란 공습으로 지정학 리스크 확대. 국내 SMR 특별법 통과, 새울 3호기 준공.", "tone": "중립"}, {"date": "2026-03", "title": "호르무즈 봉쇄·TerraPower 건설승인·대미투자특별법", "body": "유가 100~120달러로 한전·가스공사 원가 충격 예고. 반면 NRC가 TerraPower Natrium 건설승인, Part 53 최종규칙 확정, 대미투자특별법 통과로 원전 안보 프리미엄 부각.", "tone": "중립"}, {"date": "2026-04", "title": "Part 53 발효·DOE '첫 5~10기 대출 거의 확실'", "body": "첨단원전 인허가 체계 발효, Part 57 제안. DOE가 신규 원전 정부 보유 검토와 대출 제공 의지를 표명. 일본 가시와자키·가리와 6호기 14년 만에 재가동.", "tone": "긍정"}, {"date": "2026-05", "title": "한전·한수원 수출체계 개편과 '청구서' 우려", "body": "해외 대형원전은 한전 투자·한수원 EPC로 정리. 중간선거 전 동맹국 대미투자 압박 예상. Oklo PDC 승인으로 NRC 심사 단축 확인. 원전주는 금리·AI CapEx 우려로 조정 후 회복.", "tone": "중립"}, {"date": "2026-06", "title": "DOE EDF 175억달러·핵잠 1차 실무협의", "body": "대형원전 10기 착공 최대 3년 단축 목표의 대출 약정, 프로젝트당 10억달러 선출자 조건. 한미전략투자공사 출범, 12차 전기본 신규 원전 논의 시작.", "tone": "긍정"}, {"date": "2026-07", "title": "핵잠 2차 협의·DOE 시험로 임계 목표 시한", "body": "워싱턴 2차 실무협의로 연료 조달·제도 정비 구체화 여부가 관전 포인트. DOE Reactor Pilot 3기 임계 목표 시한(7-04).", "tone": "중립"}, {"date": "2026-08", "title": "12차 전기본 수요 재전망", "body": "2040 목표수요 158.4~165.0GW로 상향, 원전 9기 계속운전·신규 2기 검토안 제시. 원전 규모는 미확정.", "tone": "긍정"}, {"date": "2026-09", "title": "대미투자 원전 MOU 추진 보도", "body": "미국 내 원전 최대 8기 건설 논의 MOU 추진(9-18) 보도, 구체 사항 미정. 12차 전기본 초안(10월경) 앞두고 원전 의제 토론회.", "tone": "중립"}]}]}, {"h": "상방 논리 vs 하방 논리", "blocks": [{"t": "proscons", "bull": ["**공급 과점의 협상력**: 대형 주기기·단조를 만들 수 있는 나라는 5~6개국이고 미·유럽 실질 CAPA는 연 15기 수준이라, 착공이 늘면 기존 소수 공급자(두산 등)의 가격·조건 협상력이 커진다.", "**미국 수행 체계 공백**: SPC 자본·주기기·EPC·숙련인력이 모두 부족해 동맹국 파트너가 사실상 필수이고, 최근 완공 레퍼런스·재무체력·우방국 요건을 동시에 충족하는 나라가 한국으로 좁혀진다.", "**금융 장치 완비**: 800억달러 파트너십, EDF 175억달러, LPO, 3,500억달러 대미투자, 일본 자금까지 FOAK 리스크를 정부·동맹이 흡수하는 구조가 갖춰졌다.", "**수요 패턴 중첩**: 에너지 안보(호르무즈), AI 데이터센터 기저전력, 노후 원전 교체가 동시에 겹쳐 IAEA·IEA 전망이 매년 상향된다.", "**수혜 확산**: 착공 후 1~4년에 걸쳐 BOP·계측·전기설비·정비로 발주가 확산되고, LTO·해체 시장이 신규 건설과 독립적으로 커진다.", "**연료주기 옵션**: 한미 원자력협정 개정 시 농축 내재화·재처리·토탈패키지 수출이라는 새 사업 영역이 열린다."], "bear": ["**FID 지연**: 2026년 9월까지 미국 대형원전 FID는 0이며, SPC 선출자(10억달러) 조건·유틸리티 자본 투입 거부로 2030년 10기 착공 목표가 미달될 수 있다.", "**노형·역할 불확실성**: AP1000으로 수렴하면 한국의 설계·정비·T/G 참여 범위가 제한되고, WH 지재권 합의로 북미·유럽 단독 진출이 막혀 있다.", "**비용초과 재현**: 원전 비용초과 발생 확률 90%+, 초과율 평균 100%+. 30년 공백의 미국 현장·인력에서 Vogtle이 반복되면 LSTK 참여사는 손실(바라카 선례).", "**SMR 상업화 지연**: FOAK 비용(NuScale CFPP 취소), HALEU 공급 부족(DOE 시범 1톤 미만), 빅테크 계약의 비구속성.", "**밸류에이션 선반영**: 국내 원전주 PER 10→85배·PBR 1→4.5배 리레이팅(2025~26)으로 기대가 먼저 반영돼 있고, 금리·AI CapEx 우려에 조정 폭이 크다.", "**정책 리스크**: 미국 행정부 교체·중간선거, 한국 정권별 원전 정책 변화, 해외 입찰 반복 지연(사우디·체코 테믈린·폴란드)."], "lt": "상방 논리", "rt": "하방 논리"}]}, {"h": "다음에 볼 것", "blocks": [{"t": "bullets", "items": ["미국 첫 AP1000 FID와 SPC 지분 구조(한국전력·한수원 참여 여부, 원가가산 계약 여부)", "대미투자 원전 프로젝트 선정(노형·기수·한국 기업 역할)과 WH-한전 역무 조정 결과", "Palisades SMR-300· t-weight=\"600\">종합설계 (한전기술)<\/text><rect x=\"226.4\" y=\"58\" width=\"431.6\" height=\"26\" rx=\"4\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"232.4\" y=\"76\" font-size=\"10.5\" text-anchor=\"start\">착공 3.3년 전 발주, 초중반 집중<\/text><text x=\"180\" y=\"115\" font-size=\"11.5\" text-anchor=\"end\" font-weight=\"600\">주기기 (두산)<\/text><rect x=\"294\" y=\"98\" width=\"364\" height=\"26\" rx=\"4\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"300\" y=\"116\" font-size=\"10.5\" text-anchor=\"start\">LLI 선발주 · 제작 5~7년<\/text><text x=\"180\" y=\"155\" font-size=\"11.5\" text-anchor=\"end\" font-weight=\"600\">시공 EPC (건설사)<\/text><rect x=\"398\" y=\"138\" width=\"358.8\" height=\"26\" rx=\"4\" fill=\"var(--surface)\" style=\"stroke:var(--accent)\" stroke-width=\"1.6\"/><text x=\"404\" y=\"156\" font-size=\"10.5\" text-anchor=\"start\">S커브 — 3~5년차 급증<\/text><text x=\"180\" y=\"195\" font-size=\"11.5\" text-anchor=\"end\" font-weight=\"600\">보조기기·I&amp;C<\/text><rect x=\"450\" y=\"178\" width=\"260\" height=\"26\" rx=\"4\" style=\"fill:var(--warn);fill-opacity:.10;stroke:var(--warn)\" stroke-width=\"1.3\"/><text x=\"456\" y=\"196\" font-size=\"10.5\" text-anchor=\"start\">착공 후 1~4년 순차 발주<\/text><text x=\"180\" y=\"235\" font-size=\"11.5\" text-anchor=\"end\" font-weight=\"600\">정비 (한전KPS 등)<\/text><rect x=\"725.6\" y=\"218\" width=\"218.4\" height=\"26\" rx=\"4\" style=\"fill:var(--ok);fill-opacity:.10;stroke:var(--ok)\" stroke-width=\"1.3\"/><text x=\"731.6\" y=\"236\" font-size=\"10.5\" text-anchor=\"start\">시운전 정비 → 40~60년<\/text><polygon points=\"944.0,218 954.0,231 944.0,244\" style=\"fill:var(--ok)\"/><text x=\"480\" y=\"322\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">주가 반응 강도(관찰): 설계 &gt; 주기기 &gt; 시공 &gt; 정비 — 매출 인식이 빠를수록 수주 뉴스에 민감<\/text><\/svg>", "cap": "**결론: 같은 원전 수주라도 설계사는 착공 3.3년 전부터, 정비사는 상업운전(착공 후 약 6.9년) 이후에야 매출이 난다. 그래서 공모 기준연도 실적만으로는 가치를 설명할 수 없고, 장기 이익 할인(SOTP·DCF)이나 잔고 배수가 쓰인다.** 주가 반응 강도가 설계 > 주기기 > 시공 > 정비 순이라는 관찰도 이 시차와 같은 방향이다."}, {"t": "p", "text": "착공 전에는 뉴스플로우와 기대가 멀티플을 움직이고, 착공 후에야 EV/EBITDA·P/B의 프로젝트별 추정이 가능해진다. 원전 관련 IPO의 에쿼티 스토리가 '확정 수주·착공 일정'으로 기대를 실체로 바꾸는 과정을 보여줘야 하는 이유다."}]}, {"h": "방법론 카드 8종", "blocks": [{"t": "mods", "open": 1, "items": [{"name": "부문별 가치합산(SOTP) — 장기 EBITDA 기준", "fields": [{"k": "언제 쓰나", "v": "대형원전·SMR·가스터빈 등 여러 사업을 가진 주기기사, 자회사 지분이 큰 지주형 기업"}, {"k": "어떻게", "v": "2030년(일부 2031E) 부문별 EBITDA 또는 영업이익에 글로벌 피어 EV/EBITDA를 적용하고 WACC로 할인, 자회사 지분가치를 더한다. 원전 부문엔 원전 피어, 가스터빈은 GE Vernova 가스터빈 부문 등과 비교."}, {"k": "밴드·레퍼런스", "v": "글로벌 원전·발전기자재 피어 EV/EBITDA 2026E 평균 약 38.7배(2026-03 전후), 이후 30배대 중후반→30배 수준으로 하락(2026-06). 국내 원전 피어 평균 약 16배 기준 언급도 존재 — 시점·표본 차이로 미확인"}, {"k": "함정", "v": "장기 수주 파이프라인 가정(X-energy·NuScale 각 102기, WH 17기 등)이 가치의 대부분을 결정. 피어 멀티플 변화가 국내 기업 가치에 그대로 전이된다."}]}, {"name": "Price/Backlog·EV/Backlog", "fields": [{"k": "언제 쓰나", "v": "수주와 매출 인식 시차가 긴 원전·가스터빈 기자재, EPC"}, {"k": "어떻게", "v": "시가총액 또는 EV를 수주잔고(또는 장기 2035년 잔고 전망)로 나눠 과거 호황기와 비교."}, {"k": "밴드·레퍼런스", "v": "EV/Backlog 2006~2010년 인프라 호황기 최고 1.32배(당시 4~6% 저마진 EPC 위주). 현재는 주기기·SMR 비중 확대로 두 자릿수 마진·구조적 쇼티지 근거의 할증 논리"}, {"k": "함정", "v": "잔고의 질(팀코리아향 전 품목 vs WH향 일부, 확정 vs MOU)과 마진 차이를 보정하지 않으면 왜곡"}]}, {"name": "Historical PER·EV/EBITDA 밴드(설계·정비)", "fields": [{"k": "언제 쓰나", "v": "순수 상장 피어가 없는 원전 설계사·정비사(WH·Rosatom 비상장, EDF·CNNP는 종합기업)"}, {"k": "어떻게", "v": "자체 과거 원전 모멘텀 국면별 멀티플 히스토리와 박스권 평균을 함께 본다."}, {"k": "밴드·레퍼런스", "v": ""}, {"k": "함정", "v": "과거 고점은 기대감(한미 원전 협력)이 동인, 현재는 실제 수주 확정 여부가 다르다. 설계사는 고정비 레버리지로 이익 추정 변동폭이 큼"}]}, {"name": "PBR·PER 역사적 비교(건설·EPC)", "fields": [{"k": "언제 쓰나", "v": "원전 EPC 건설사"}, {"k": "어떻게", "v": "12M Fwd P/E·P/B를 2007~2010년 해외수주 호황기와 비교, 원전 부문엔 원전 피어 배수를 별도 적용."}, {"k": "밴드·레퍼런스", "v": "UAE 수주 국면(2009~10) PER 10→20배·PBR 1.5→2.5배 vs 2025~26 원전주 PER 10→85배·PBR 1→4.5배. 건설사 EV/EBITDA 2010~12 평균 약 11배, 원전 가시성에 따라 PBR 4배 정당화 논리도 제시"}, {"k": "함정", "v": "중동 플랜트 붐은 출혈경쟁으로 한국 EPC가 먼저 하락. 원전이 LNG EPC(Technip 고점 P/B 5배)처럼 과점 사이클이 될지는 검증 전"}]}, {"name": "PBR-ROE(유틸리티)", "fields": [{"k": "언제 쓰나", "v": "한국전력 등 규제 유틸리티"}, {"k": "어떻게", "v": "과거 PBR-ROE 회귀식에 선행 ROE를 대입, 또는 적정투자보수율을 목표 ROE로 사용. 해외 유틸리티(NextEra·Duke·Iberdrola) 대비 할인율 점검."}, {"k": "밴드·레퍼런스", "v": "한전 Forward P/B 역사적 평균 0.38배, 저점 0.15배, 고점 약 0.8배, 현재 약 0.5배(글로벌 평균 1.72배 대비 60%+ 할인). 원가회수율 131% 시 1.0배+ 재평가 논리(2016년 107%가 과거 고점)"}, {"k": "함정", "v": "할인의 본질은 비용 회수의 예측 불확실성. 원가 하락으로 실적은 회복돼도 멀티플은 회수구조 신뢰 회복이 필요"}]}, {"name": "DCF·DDM(사업 성격별)", "fields": [{"k": "언제 쓰나", "v": "설계사(DDM), 주기기사(DCF), 연료전지(EV/Sales)"}, {"k": "어떻게", "v": "원전 밸류체인 내 사업 성격에 따라 방법론을 달리 적용. 지주형은 NAV 할인율."}, {"k": "밴드·레퍼런스", "v": "추정치별 상이(수치 밴드 없음)"}, {"k": "함정", "v": "원전 수주 단가 가정(예: 미국 대형원전 1기당 설계 5,000억원)이 가치 변동의 핵심"}]}, {"name": "PSR·인허가 마일스톤(상업화 이전 SMR)", "fields": [{"k": "언제 쓰나", "v": "매출이 거의 없는 SMR 개발사(Oklo·NuScale 등)"}, {"k": "어떻게", "v": "실적이 아니라 라이선스 확보와 상업화 진입 순서를 선반영. 피어 평균 대비 PSR 비교."}, {"k": "밴드·레퍼런스", "v": "Oklo 2026E PSR 수천 배 수준으로 NuScale·X-energy 평균 대비 크게 높음(2026-06)"}, {"k": "함정", "v": "인허가 지연·FOAK 비용 초과 시 급락. NuScale CFPP 취소 사례"}]}, {"name": "크로스 섹터 비교(방산·우라늄)", "fields": [{"k": "언제 쓰나", "v": "방산·우라늄 본업 기업이 원전으로 전방을 넓힐 때"}, {"k": "어떻게", "v": "원전 피어 멀티플로의 이동 여부를 판단. Cameco는 WH 지분가치로 우라늄 가격과 괴리된 재평가."}, {"k": "밴드·레퍼런스", "v": "원전 기업 vs 방산 기업 밸류에이션 약 3배 격차(2026-05, Bloomberg). 해외 SMR 계측 업체 PER 47배 vs 국내 계측기 약 18배"}, {"k": "함정", "v": "원전 매출 비중이 작으면 피어 멀티플 적용 근거가 약함"}]}]}]}, {"h": "섹터 주가 드라이버 — 무엇이 멀티플을 움직였나", "blocks": [{"t": "table", "cols": ["드라이버", "방향", "전달 경로", "관찰 사례(자료 기준)"], "rows": [["정책 이벤트(행정명령·파트너십)", "멀티플 확장", "미국 발주 파이프라인 기대", "OKLO YTD +649%, Centrus +500%, 두산 +386%(2025-10)"], ["해외 수주 확정", "멀티플 → 이익", "잔고 전환", "체코 본계약(2025-06) 이후 원전 2차 테마"], ["글로벌 피어 멀티플", "동조", "피어 배수 전이", "원전·발전기자재 피어 EV/EBITDA 2026E 약 38.7배 → 30배 수준(2026-06)"], ["금리·AI CapEx 우려", "멀티플 축소", "할인율·수요 기대", "2026-05 조정 후 회복"], ["FID·착공 지연", "멀티플 축소", "기대 이연", "미국 FID 0(2026-09)"], ["유가·SMP(한전)", "이익 변동", "구입단가", "호르무즈 봉쇄(2026-03) 유가 100~120달러"], ["원전 이용률(한전)", "이익 변동", "LNG 대체", "1Q26 71.0% → 목표 89%"], ["ETF 편입 구성", "수급", "우라늄 편중 → 건설·제작 편입 확대 여부", "서구 원자력 ETF 상위 우라늄 60~100%(2026-02)"]], "note": "원출처 Bloomberg, 각 ETF, 업계 자료 종합"}, {"t": "callout", "text": "2025~26년 국내 원전주는 PER 10→85배, PBR 1→4.5배로 리레이팅됐고, 그 약 90%가 이익이 아니라 멀티플 기여로 추정된다(12MF EV/EBITDA 기준). UAE 수주 국면(2009~10)의 PER 10→20배·PBR 1.5→2.5배와 비교하면 기대가 훨씬 앞서 있다.", "title": "리레이팅의 대부분은 멀티플", "tone": "warn"}]}, {"h": "IPO·자본시장 동향과 ECM 시사점", "blocks": [{"t": "bullets", "items": ["**착공이 방법론을 바꾼다**: 착공 전엔 뉴스플로우·기대가 멀티플을 움직이고, 착공 후에야 EV/EBITDA·P/B의 프로젝트별 추정이 가능해진다. 원전 IPO 에쿼티 스토리는 확정 수주·착공 일정으로 '기대→실체' 전환을 보여주는 것이 핵심이다.", "**피어 선정 기준**: 원전 노출도(매출 비중), 해외 시공·납품 레퍼런스, 팀코리아/WH 공급망 양쪽 참여 여부가 핵심. BOP·계측 업체는 주기기 업체 배수에 할인을 적용하는 관행이 있고, BWXT·Curtiss-Wright·Mirion 같은 미국 원자력 부품사가 글로벌 비교군으로 쓰인다.", "**수주-매출 시차를 공모가에 반영**: 보조기기는 착공 후 1~4년, 정비는 준공 후 매출이 난다. 공모 기준연도 실적과 미래 이익 할인율의 정합성이 수요예측에서 가장 먼저 질문받는다.", "**리레이팅 이력의 함정**: 2025~26년 원전주 리레이팅의 약 90%가 멀티플 기여(12MF EV/EBITDA 기준)로 추정된다. 피어 멀티플이 30배대 중후반→30배로 내려온 것처럼 피어 변동이 공모가 밴드에 직접 전이된다.", "**리스크 공시 포인트**: WH 지재권 합의에 따른 수출 지역 제한, LSTK vs Cost-plus 계약 구조, MOU와 확정계약의 구분, HALEU 등 연료 조달, ASME N-stamp·Q-Class 인증 유지 여부를 투자위험요소에 명확히 적어야 한다."]}, {"t": "grid", "items": [{"h": "원전 인프라의 직접 상장 선례", "p": "Fermi America가 2025-10 나스닥·런던 동시 상장으로 6.8억달러를 조달했다(상장 후 총 납입자본 약 10억달러). AP1000 4기를 포함한 최대 11GW 에너지 캠퍼스(Project Matador)를 시장 자금으로 추진하는 모델이다."}, {"h": "정부 지분 참여와 IPO 요구권", "p": "미 정부는 WH 기업가치가 2029-01 이전 300억달러에 도달하면 IPO를 요구할 수 있다. 원전 설계사의 상장 가능성은 글로벌 피어 배수의 기준점을 바꿀 수 있는 변수다."}, {"h": "공모 구조 체크", "p": "피어는 원전 노출도(매출 비중)·해외 레퍼런스·팀코리아/WH 양쪽 참여 여부로 고르고, 비원전 사업(화력·HRSG·풍력 등)의 사이클 차이를 분리한다. 수주-매출 시차와 할인율의 정합성이 수요예측의 첫 질문이다."}, {"h": "투자위험요소 공시 포인트", "p": "WH 지재권에 따른 수출 지역 제한, LSTK vs Cost-plus 계약 구조, MOU와 확정계약의 구분, HALEU 등 연료 조달, ASME N-stamp·Q-Class 인증 유지."}], "cols": 2}]}]}, "check": {"title": "체크포인트", "h2": "체크포인트 — 원전 딜 검토 체크리스트", "en": "Due Diligence Checkpoints", "lede": "원전 관련 기업의 딜을 볼 때 가장 흔한 실수는 **정책 목표와 MOU를 수주로, 수주 금액을 매출로** 읽는
