<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>원전 리서치 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --ground:#FBFAF7; --surface:#FFFFFF; --raised:#F3F4F0; --sunken:#EFF1EC;
  --line:#E0E4DC; --line-strong:#C9D0C6;
  --ink:#17211F; --ink-2:#3A4744; --ink-3:#55625D; --ink-4:#626F6A;
  --accent:#6A3E9E; --accent-soft:color-mix(in srgb,var(--accent) 10%,transparent); --accent-line:color-mix(in srgb,var(--accent) 34%,transparent);
  --ok:#1D7A5C; --warn:#8A6300; --alert:#A2304A; --dim:#55625D;
  --shadow:0 1px 2px rgba(23,33,31,.06),0 8px 24px -12px rgba(23,33,31,.18);
  --rail:252px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0C1116; --surface:#131A21; --raised:#1A232B; --sunken:#0F161C;
    --line:#253039; --line-strong:#33424E;
    --ink:#DCE5EA; --ink-2:#BCCAD2; --ink-3:#9DAEB9; --ink-4:#8DA0AB;
    --accent:#B592E3; --ok:#3DB08E; --warn:#D2A63A; --alert:#D9738A; --dim:#9DAEB9;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0C1116; --surface:#131A21; --raised:#1A232B; --sunken:#0F161C;
  --line:#253039; --line-strong:#33424E;
  --ink:#DCE5EA; --ink-2:#BCCAD2; --ink-3:#9DAEB9; --ink-4:#8DA0AB;
  --accent:#B592E3; --ok:#3DB08E; --warn:#D2A63A; --alert:#D9738A; --dim:#9DAEB9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;line-height:1.3;letter-spacing:-.011em}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
b{font-weight:600;color:var(--ink)}

.shell{display:flex;min-height:100vh;align-items:flex-start}
.rail{width:var(--rail);flex:0 0 var(--rail);position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brand .mark{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--accent);font-weight:500;display:flex;align-items:center;gap:7px;line-height:1.4}
.brand .mark::before{content:"";width:7px;height:7px;background:var(--accent);border-radius:50%;flex:none}
.brand h1{font-size:18px;margin-top:9px;letter-spacing:-.02em;font-weight:700}
.brand .sub{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.5}
.nav{flex:1;overflow-y:auto;padding:10px 10px 20px}
.nav-group{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.15em;color:var(--ink-4);padding:14px 10px 6px;text-transform:uppercase}
.nav button{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-family:inherit;font-size:13.5px;line-height:1.4}
.nav button:hover{background:var(--raised);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button .k{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);flex:none;width:16px}
.nav button[aria-current="true"] .k{color:var(--accent)}
.desks{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px}
.desks .dl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-4);width:100%;padding:2px 4px 4px}
.desks a{font-size:12px;text-decoration:none;color:var(--ink-3);border:1px solid var(--line);border-radius:14px;padding:3px 9px;white-space:nowrap}
.desks a:hover{color:var(--accent);border-color:var(--accent-line)}
.desks a.cur{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);pointer-events:none}
.railfoot{padding:12px 16px;border-top:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}

.main{flex:1;min-width:0;padding:0 0 96px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:11px 40px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.legend .li{display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.legend .sw{width:9px;height:9px;border-radius:2px;flex:none}
.stamps{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.stamp{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);white-space:nowrap}
.tsw{display:inline-flex;gap:2px;padding:2px;background:var(--sunken);border:1px solid var(--line);border-radius:7px}
.tsb{padding:4px 9px;border:0;border-radius:5px;background:transparent;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:11px;cursor:pointer}
.tsb[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.pane{display:none;padding:34px 40px 0;max-width:1220px}
.pane.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pane.on{animation:none}}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;font-weight:500}
.pane > h2{font-size:29px;margin-top:8px;letter-spacing:-.025em;font-weight:700}
.lede{color:var(--ink-2);font-size:15.5px;max-width:74ch;margin-top:11px;line-height:1.72}
.sec{margin-top:44px}
.sec > h3{font-size:17.5px;display:flex;align-items:center;gap:11px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.sec > h3::before{content:"";width:3px;height:15px;background:var(--accent);border-radius:2px;flex:none}
.note{color:var(--ink-2);font-size:14px;line-height:1.72;margin-top:12px;max-width:78ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.card h4{font-size:14.5px;margin-bottom:8px}
.card p{font-size:13.5px;color:var(--ink-2);line-height:1.68}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kg{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.kg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kg{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px;display:flex;flex-direction:column;gap:5px}
.kpi .lab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.kpi .val{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;color:var(--accent)}
.kpi .cap{font-size:11.5px;color:var(--ink-3);line-height:1.5}

.tag{display:inline-flex;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 7px;border-radius:4px;border:1px solid;white-space:nowrap;vertical-align:middle}
.t-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 34%,transparent);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.t-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 34%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.t-alert{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 34%,transparent);background:color-mix(in srgb,var(--alert) 10%,transparent)}
.t-dim{color:var(--ink-3);border-color:var(--line-strong);background:var(--raised)}
.t-acc{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-2);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--raised);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.62}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--raised)}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
td.tk{font-family:"IBM Plex Mono",monospace;color:var(--ink-3);font-size:12.5px;white-space:nowrap}
td.nm{font-weight:600;white-space:nowrap}
.tcap{font-size:13.5px;font-weight:600;margin:22px 0 8px}
.tnote{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);margin-top:8px;line-height:1.6}

.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:14px 17px;border-radius:0 8px 8px 0;font-size:14.5px;color:var(--ink-2);line-height:1.76;max-width:88ch}

.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 6px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink-3);border-radius:20px;padding:5px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ground);font-weight:500}
.search{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 13px;font-family:inherit;font-size:14px}
.search:focus{border-color:var(--accent);outline:none}
select.search{max-width:200px}
.count{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}

/* chain */
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 2px 10px;margin-top:16px}
.fnode{flex:0 0 150px;background:var(--sunken);border:1px solid var(--line-strong);border-radius:9px;padding:10px 12px;font-size:13px}
.fnode .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--accent)}
.fnode .t{font-weight:600;line-height:1.35;margin-top:2px}
.farr{flex:0 0 22px;display:grid;place-items:center;color:var(--ink-4);font-size:14px}
.vc{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:14px}
.vcx{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px;border-top:2px solid var(--accent)}
.vcx .r{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--accent);margin-bottom:5px}
.vcx h4{font-size:14px;margin-bottom:5px}
.vcx p{font-size:13.2px;color:var(--ink-2);line-height:1.66}
.vcx .co{font-size:12px;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.6}

/* modules */
.mods{display:grid;gap:10px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mod > summary{padding:14px 18px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mod > summary::-webkit-details-marker{display:none}
.mod > summary::after{content:"+";margin-left:auto;font-family:"IBM Plex Mono",monospace;color:var(--ink-4);font-size:16px}
.mod[open] > summary::after{content:"−"}
.mod > summary:hover{background:var(--raised)}
.mname{font-size:15px;font-weight:600}
.men{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-4)}
.mod .body{padding:4px 18px 18px;border-top:1px solid var(--line)}
.mod dl{margin:0}
.mod dt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4);margin:14px 0 4px}
.mod dd{margin:0;font-size:14.3px;color:var(--ink-2);line-height:1.74;max-width:86ch}
.pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 7px;border-radius:3px;background:var(--raised);border:1px solid var(--line);color:var(--ink-3)}
.dplede{font-size:15.5px;color:var(--ink);line-height:1.78;margin:16px 0 4px;padding:2px 0 2px 14px;border-left:3px solid var(--accent);max-width:84ch;font-weight:450}
.dpn p{margin-top:12px;font-size:14.5px;color:var(--ink-2);line-height:1.84;max-width:82ch}
.dpul{margin:10px 0 0;padding-left:18px}
.dpul li{font-size:14px;color:var(--ink-2);line-height:1.74;margin-bottom:8px;max-width:84ch}
.dpkr{margin-top:18px;padding:13px 16px;background:var(--sunken);border:1px solid var(--line);border-radius:9px;font-size:14px;color:var(--ink-2);line-height:1.72}
.dpkr .l{color:var(--accent);font-weight:600;margin-right:6px}
.formula{font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;padding:10px 13px;margin-top:10px;color:var(--ink);line-height:1.6;white-space:pre-wrap}

/* bars */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.chart h4{font-size:14.5px}
.chart .u{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.bar{display:grid;grid-template-columns:minmax(90px,34%) 1fr 72px;gap:10px;align-items:center}
.bar .bl{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.bar .bt{position:relative;height:12px;background:var(--sunken);border-radius:3px;border:1px solid var(--line)}
.bar .bf{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:2px}
.bar .bf.neg{background:var(--alert)}
.bar .bf.est{background:repeating-linear-gradient(135deg,var(--accent) 0 4px,color-mix(in srgb,var(--accent) 55%,transparent) 4px 7px)}
.bar .bf.neg.est{background:repeating-linear-gradient(135deg,var(--alert) 0 4px,color-mix(in srgb,var(--alert) 55%,transparent) 4px 7px)}
.bar .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink-4)}
.bar .bv{font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.chart .cn{font-size:12px;color:var(--ink-3);margin-top:12px;line-height:1.6;padding-top:10px;border-top:1px solid var(--line)}

/* timeline */
.tl{margin-top:18px;border-left:1px solid var(--line-strong);margin-left:6px}
.tli{position:relative;padding:0 0 20px 22px}
.tli::before{content:"";position:absolute;left:-5px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--dim)}
.tli.pos::before{border-color:var(--ok)} .tli.neg::before{border-color:var(--alert)}
.tli .d{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.tli h4{font-size:14.5px;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tli p{font-size:13.8px;color:var(--ink-2);margin-top:4px;line-height:1.7;max-width:84ch}
.bb{list-style:none;margin:10px 0 0;padding:0}
.bb li{font-size:13.8px;color:var(--ink-2);line-height:1.66;padding:8px 0;border-bottom:1px dashed var(--line)}
.bb li:last-child{border-bottom:0}

.ck li{list-style:none;display:flex;gap:9px;align-items:flex-start;font-size:13.8px;color:var(--ink-2);line-height:1.62;padding:6px 0}
.ck{margin:6px 0 0;padding:0}
.ck input{margin-top:4px;accent-color:var(--accent);flex:none}
.more{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-family:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
.more:hover{border-color:var(--accent);color:var(--accent)}
.evt{display:grid;grid-template-columns:104px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.evt .d{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.evt .n{font-size:14px;font-weight:600}
.evt .m{font-size:13px;color:var(--ink-3);margin-top:2px;line-height:1.55}
.evt.past .d{color:var(--ink-4)}
.cloud{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

@media (max-width:900px){
  .desks{display:none}
  .shell{flex-direction:column}
  .rail{position:static;width:100%;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{display:flex;overflow-x:auto;padding:8px;gap:4px}
  .nav-group{display:none}
  .nav button{width:auto;white-space:nowrap}
  .nav button .k{display:none}
  .desks{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px}
.desks .dl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-4);width:100%;padding:2px 4px 4px}
.desks a{font-size:12px;text-decoration:none;color:var(--ink-3);border:1px solid var(--line);border-radius:14px;padding:3px 9px;white-space:nowrap}
.desks a:hover{color:var(--accent);border-color:var(--accent-line)}
.desks a.cur{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);pointer-events:none}
.railfoot{display:none}
  .topbar{padding:10px 16px}
  .pane{padding:24px 16px 0}
  .pane > h2{font-size:24px}
  .bar{grid-template-columns:1fr 60px}
  .bar .bl{grid-column:1/-1}
  .evt{grid-template-columns:1fr;gap:2px}
}
/* ===== v2 blocks ===== */
.fig{margin:18px 0 0;padding:16px 14px 14px;background:var(--sunken);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.fig svg{display:block;width:100%;min-width:560px;height:auto;color:var(--ink-2)}
.fig svg text{fill:currentColor;font-family:inherit}
.fig figcaption{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2);line-height:1.74;max-width:86ch}
.sec .blk{margin-top:16px}
.callout.w{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.callout.r{border-left-color:var(--alert);background:color-mix(in srgb,var(--alert) 7%,transparent)}
.stage{display:grid;grid-template-columns:26px 1fr;gap:0 15px}
.stage .col{position:relative}
.stage .col::before{content:"";position:absolute;left:12px;top:6px;bottom:-6px;width:1px;background:var(--line)}
.stage:last-child .col::before{display:none}
.stage .dot{width:25px;height:25px;border-radius:50%;border:1px solid var(--accent-line);background:var(--surface);color:var(--accent);font-family:"IBM Plex Mono",monospace;font-size:11px;display:grid;place-items:center;position:relative;z-index:1;font-weight:500}
.stage .content{padding-bottom:22px}
.stage h4{font-size:15px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.stage .meta{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 8px}
.stage p{font-size:13.8px;color:var(--ink-2);line-height:1.68;max-width:80ch}
.stage .chk{font-size:12.8px;color:var(--ink-3);margin-top:7px;padding-left:12px;border-left:2px solid var(--line);line-height:1.6}
.stage .chk b{color:var(--accent);font-weight:500}
.dcard .dfl{display:flex;flex-wrap:wrap;gap:6px;padding-top:12px}

46 L352 346\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--accent)\" marker-end=\"url(#a-map1-c)\"/><path d=\"M480 346 L520 346\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--accent)\" marker-end=\"url(#a-map1-c)\"/><rect x=\"150.71\" y=\"325.5\" width=\"26.58\" height=\"14.5\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"164\" y=\"336\" font-size=\"10.5\" text-anchor=\"middle\" style=\"fill:var(--accent)\">자금<\/text><rect x=\"318.71\" y=\"325.5\" width=\"26.58\" height=\"14.5\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"332\" y=\"336\" font-size=\"10.5\" text-anchor=\"middle\" style=\"fill:var(--accent)\">계약<\/text><rect x=\"486.71\" y=\"325.5\" width=\"26.58\" height=\"14.5\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"500\" y=\"336\" font-size=\"10.5\" text-anchor=\"middle\" style=\"fill:var(--accent)\">발주<\/text><rect x=\"700\" y=\"316\" width=\"124\" height=\"60\" rx=\"8\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"762\" y=\"342.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">정비·LTO·해체<\/text><text x=\"762\" y=\"358.6\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.78\">40~60년 반복<\/text><path d=\"M762 276 L762 316\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-map1)\"/><rect x=\"778.44\" y=\"290\" width=\"27.12\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"792\" y=\"301\" font-size=\"11\" text-anchor=\"middle\">O&amp;M<\/text><path d=\"M902 92 L902 410 L248 410 L248 376\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--accent)\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-map1-c)\"/><rect x=\"438.9\" y=\"404\" width=\"272.2\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"575\" y=\"415\" font-size=\"11\" text-anchor=\"middle\" style=\"fill:var(--accent)\">전력 판매수익(PPA·요금) — 수십 년에 걸쳐 투자 회수<\/text><\/svg>", "cap": "**결론: 원전 밸류체인에서 매출이 가장 먼저·크게 잡히는 곳은 발주처-주계약자 바로 아래의 설계·주기기·시공이고, 정비는 상업운전 이후 수십 년에 걸쳐 나온다.** 연료와 기자재는 발전소 한 점으로 모이지만, 돈은 금융(정부 대출·RAB·PPA) → 발주처 → 주계약자(한수원 또는 WH)를 거쳐 벤더로 내려간다. 바라카 기준 벤더 몫은 시공 33%·주기기 23%·설계 5%·시운전 정비 2%였다. 그래서 '누가 주계약자냐'가 국내 기업 몫의 크기를 정한다."}, {"t": "p", "text": "원전 밸류체인은 '연료 → 설계 → 단조·주기기 → 보조기기 → 시공(EPC) → 운영(유틸리티) → 정비·수명연장 → 해체·사용후핵연료'로 이어진다. 업스트림(농축·단조·주기기)일수록 과점·진입장벽이 높아 협상력이 크고, 다운스트림(정비·운영)일수록 매출은 작지만 수십 년 반복된다."}, {"t": "cards", "items": [{"r": "01", "h": "우라늄 채굴·정광(U3O8)", "p": "광산에서 우라늄 광석을 캐 옐로케이크로 정제", "co": "**마진 원천** 우라늄 현물·장기계약 가격. 채굴은 캐나다·카자흐스탄 등 소수국 집중, 미국 채굴은 1980년 대비 99.6% 이상 감소\n**국내** 직접 상장사 없음(Cameco 등 해외). 포스코인터내셔널(트레이딩)"}, {"r": "02", "h": "변환·농축(LEU·HALEU)", "p": "U3O8→UF6 변환 후 원심분리로 U-235 농도를 3~5%(LEU) 또는 5~20%(HALEU)로 높임", "co": "**마진 원천** SWU 가격. Rosatom·Urenco·Orano·CNNC·Centrus 과점, 러시아 배제 시 공급 부족으로 가격 결정력 확대\n**국내** 한수원(비상장, Centrus 투자 MOU), 포스코인터내셔널(오프테이크)"}, {"r": "03", "h": "핵연료 성형가공", "p": "농축 우라늄을 펠릿·연료봉·집합체(또는 TRISO·금속연료)로 제작", "co": "**마진 원천** 노형별 설계 종속, 장기 공급계약\n**국내** 한전원자력연료(비상장)"}, {"r": "04", "h": "원자로 설계·종합설계(AE)", "p": "원자로계통(NSSS) 설계와 터빈·보조계통을 잇는 발전소 종합설계", "co": "**마진 원천** 사업비의 5~8% 설계용역. 인건비 고정비 비중이 높아 수주 증가 시 영업레버리지 큼\n**국내** 한전기술"}, {"r": "05", "h": "초대형 단조·소재", "p": "잉곳 제강 후 1만~1.7만톤 프레스로 RPV·SG 쉘, 터빈 샤프트 단조", "co": "**마진 원천** 대형 프레스 보유 5~6개국 과점. 신규 진입에 10년 이상\n**국내** 두산에너빌리티(내재화), 태웅, 세아베스틸지주(특수강·CASK)"}, {"r": "06", "h": "주기기(NSSS·T/G)", "p": "원자로압력용기·증기발생기·가압기·냉각재펌프·터빈발전기 제작", "co": "**마진 원천** 원전 사업비의 20~30%(주기기 전체 기준 40~50% 추정도 존재). 미·유럽 실질 CAPA 연 15기 수준\n**국내** 두산에너빌리티"}, {"r": "07", "h": "보조기기(BOP)·계측제어·전기", "p": "복수기·급수가열기·열교환기, MMIS·DCS·ICI 계측기, 주변압기·주제어반", "co": "**마진 원천** 착공 후 1~4년에 순차 발주. 1기당 1~1.5천억원(BOP). ICI 등은 2~5년 교체 수요\n**국내** 비에이치아이, 우진, 우리기술, HD현대일렉트릭, 효성중공업, LS ELECTRIC, 일진전기"}, {"r": "08", "h": "시공·EPC·PM", "p": "부지·토목·기기 설치·배관·시운전 통합 수행", "co": "**마진 원천** 계약 구조(LSTK vs Cost-plus)가 손익을 좌우. 해외는 국내 공공공사보다 마진 높음\n**국내** 현대건설, 삼성물산, 대우건설, DL이앤씨, GS건설, 한미글로벌(PM)"}, {"r": "09", "h": "발전·운영(유틸리티)", "p": "원전 소유·운영, 전력 판매·PPA", "co": "**마진 원천** 한계비용 30~38달러/MWh로 낮고 부하율 90%대. 한국은 SMP·요금 구조가 이익 결정\n**국내** 한국전력(한수원 모회사)"}, {"r": "10", "h": "정비·수명연장(LTO)·해체", "p": "경상·계획예방정비, 60~80년 계속운전 개보수, 영구정지 후 제염·해체", "co": "**마진 원천** 40~60년 반복 매출. LTO 1기당 1~2조원, 해체 1기당 1~1.8조원\n**국내** 한전KPS, 우진엔텍, 일진파워, 금양그린파워"}]}]}, {"h": "하위 섹터 8개 — 같은 원전주라도 돈 버는 시점이 다르다", "blocks": [{"t": "grid", "items": [{"h": "대형원전(APR1400·AP1000)", "p": ["1GW 이상 가압경수로가 주력이다. 미국은 Westinghouse AP1000으로 수렴 중이고 한국은 APR1400(체코는 APR1000)으로 UAE·체코를 수주했다. 공기 8~12년, 1기 80억~140억달러 규모로 실적 가시성은 크지만 FID까지 시간이 오래 걸린다."], "list": ["**드라이버** 미국 FID(2027~2029 가설), 대미 투자 선정, WH-한수원 역할 조정, 팀코리아 후속 수주", "**사이클** 발주 → 설계·주기기(착공 전) → 시공 S커브(3~5년차 매출 급증). 40년 만의 건설 사이클 초입", "**국내** 한국전력, 두산에너빌리티, 한전기술, 현대건설, 삼성물산, 대우건설"]}, {"h": "SMR·첨단원자로", "p": ["300MWe 이하 모듈형 원자로. 물을 쓰는 3.5세대(NuScale·BWRX-300·SMR-300·i-SMR)와 소듐·헬륨·용융염을 쓰는 4세대(Natrium·Xe-100·KP-FHR·Aurora)로 나뉜다. 2026~2030년은 FOAK 실증 구간이며 상업 가동은 2030년 전후부터다."], "list": ["**드라이버** NRC 인허가(Part 53), 빅테크 PPA의 구속력, HALEU 공급, FOAK 비용", "**사이클** 기대 선반영 → 인허가·착공 마일스톤 → FOAK 비용 검증 → NOAK 전환(7~8호기 이후)", "**국내** 두산에너빌리티(파운드리), 현대건설(Holtec), 삼성물산(NuScale·GVH), DL이앤씨(X-energy), 한전기술(i-SMR), SK이노베이션(TerraPower)"]}, {"h": "핵연료주기(우라늄·변환·농축·HALEU)", "p": ["채굴→변환→농축→성형가공으로 이어지는 연료 공급망. 러시아가 농축 능력의 약 45%를 가져 탈러시아 시 병목이 심하고, 4세대 SMR과 핵잠수함에 필요한 HALEU는 사실상 러시아 독점이다."], "list": ["**드라이버** 러시아산 우라늄 수입금지(2028-01 전면), DOE HALEU 예산, 한미 원자력협정 개정(농축)", "**사이클** 원자로 착공보다 수년 선행하는 장기계약 사이클. 원자로 확대 속도의 상한을 정함", "**국내** 포스코인터내셔널, 한국전력(한수원 농축 내재화 가능성)"]}, {"h": "주기기·보조기기 공급망", "p": ["원자로압력용기·증기발생기 등 주기기와 복수기·계측제어·전기설비 등 보조기기. 대형 단조·ASME N-stamp·레퍼런스라는 3중 장벽 때문에 수요가 늘어도 신규 진입이 어렵고 기존 업체 협상력이 커진다."], "list": ["**드라이버** 착공 기수, 노형(AP1000 vs APR1400), 단조 CAPA, SMR 모듈 주문 확정", "**사이클** 주기기는 착공 전 LLI 선발주, 보조기기는 착공 후 1~4년 순차 발주 → 수혜가 대형주에서 중소형 벤더로 확산", "**국내** 두산에너빌리티, 비에이치아이, 우진, 우리기술, 태웅, HD현대일렉트릭, 효성중공업"]}, {"h": "시공·EPC·설계", "p": ["원전 종합설계와 시공. 미국은 1996년 이후 27년 공백으로 EPC 역량이 사실상 Bechtel 중심으로 축소됐고, 최근 완공 레퍼런스·재무체력·동맹국 요건을 동시에 충족하는 한국 EPC 3사가 대안으로 거론된다."], "list": ["**드라이버** EPC 계약 구조(Cost-plus 여부), 인력 CAPA, FEED→EPC 전환", "**사이클** FEED(1~2년) → EPC 본계약 → 기성률 S커브", "**국내** 현대건설, 삼성물산, 대우건설, DL이앤씨, GS건설, 한전기술, 한미글로벌"]}, {"h": "운영·정비·수명연장·해체", "p": ["가동 원전의 경상·계획예방정비, 60~80년 계속운전(LTO) 개보수, 영구정지 원전 해체. 가동 원전의 절반 가까이가 40년 이상이라 신규 건설보다 먼저 커지는 시장이다."], "list": ["**드라이버** 계속운전 인허가, 가동률, 해외 LTO·해체 수주", "**사이클** 신규 원전과 무관하게 반복 매출. 해외 수주 민감도는 낮고 배당 성격", "**국내** 한전KPS, 우진(교체 계측기), 우진엔텍, 일진파워, 금양그린파워"]}, {"h": "유틸리티·전력구매(PPA)", "p": ["원전을 소유·운영하며 전력을 파는 사업자. 미국은 빅테크 PPA로 기존 원전의 가치가 재평가됐고(재가동·수명연장), 한국전력은 원전 이용률이 요금 다음으로 큰 이익 변수다."], "list": ["**드라이버** PPA 가격(110~120달러/MWh 사례), PJM 용량가격, 한국 SMP·원전 이용률", "**사이클** 전력 부족 국면에서 기존 원전 자산가치 상승, 재가동·출력증강 우선", "**국내** 한국전력"]}, {"h": "한미 원자력 협정·핵잠수함", "p": ["한미 원자력협정(123협정) 개정 여부가 국내 농축·재처리 권한, 핵추진잠수함 연료 조달, 연료주기 포함 토탈패키지 수출 가능성을 동시에 결정한다. 2025-11 팩트시트로 협상 문이 열렸다."], "list": ["**드라이버** 협정 개정·91조 별도협정, IAEA 14조 특별안전조치, 한미 실무협의", "**사이클** 정책 이벤트형. 실적 반영까지 시차가 매우 김", "**국내** 한국전력(한수원), 한전기술, 두산에너빌리티, 포스코인터내셔널, 한화오션, HD현대중공업"]}]}], "note": "대형원전·SMR은 수주 이벤트형, 연료주기는 장기계약형, 정비·LTO는 반복 매출형, 유틸리티는 요금·이용률형이다. 딜 검토 때 대상 기업이 어느 칸인지부터 확정한다."}, {"h": "이 도구의 사용법", "blocks": [{"t": "grid", "items": [{"h": "처음 배울 때 순서", "p": ["02 노형 백과에서 가압경수로의 3개 루프와 APR1400·AP1000·SMR의 차이를 먼저 익힌다. 03 라이프사이클로 '설계 → 건설 → 운영 → 해체'에서 누가 언제 돈을 버는지 잡고, 06 경제성 읽기에서 OCC·IDC·FOAK/NOAK 세 개념을 익히면 원전 뉴스의 절반이 풀린다.", "그다음 04 핵연료 주기와 05 공급망 지도로 병목(농축·단조)을 보고, 08 딥다이브의 '미국은 왜 못 짓나'와 10 테마 탭으로 사이클의 흐름을 연결한다."]}, {"h": "딜 검토할 때", "p": ["15 커버리지 유니버스와 05 공급망 지도에서 대상 기업의 칸(설계·주기기·BOP·EPC·정비)을 먼저 확정한다. 14 체크포인트의 5분 스캔으로 ① 팀코리아향인지 WH향인지 ② MOU인지 확정계약인지 ③ ASME N-stamp·레퍼런스 ④ 매출 인식 시점을 확인한다.", "11 프로젝트 트래커로 수주 뉴스의 단계(FEED·EPC·FID)를 대조하고, 13 밸류에이션의 방법론 매칭 표와 수주-매출 시차 도식으로 공모 기준연도의 정합성을 점검한다."]}, {"h": "숫자를 인용하기 전에", "p": ["원전 숫자는 기준이 제각각이다. 건설비가 OCC인지 총사업비인지, 1기인지 2기인지, 달러/kW인지 억원/MW인지 확인한다. 미국 400GW·10기는 정책 목표이지 확정 발주가 아니다.", "시장의 수주 추정치는 기당 단가 가정에 따라 두 배 이상 달라진다. 18 출처 탭의 '수치 상충 경고'와 본문의 확인·추정 태그를 먼저 본다."]}, {"h": "이 자료의 한계", "p": ["2025.09~2026.09 국내외 산업 분석 자료·통계·기업 공시를 바탕으로 원전 관련 내용을 종합했다. 국내 자료 특성상 한국 밸류체인에 우호적인 시각이 지배적이다.", "미국 FID 일정·SPC 구조는 대부분 가설이고, Palisades 재가동·Fermi·코즐로두이 EPC 체결 여부 등 2026년 하반기 이후 사실은 별도 확인이 필요하다. 우라늄 현물·SWU 가격 시계열은 원자료에 없다."]}]}]}]}, "reactor": {"title": "노형 백과", "h2": "노형 백과 — 원자로를 알아야 수혜 범위가 보인다", "en": "Reactor Encyclopedia", "lede": "원전주의 수혜 범위는 **노형이 정한다.** 같은 '미국 원전 10기'라도 AP1000이면 한국은 주기기 일부와 시공을, APR1400이면 설계·주기기 전 품목·정비까지 가져간다. SMR도 물을 쓰는 3.5세대는 기존 공급망을 이어받고, 소듐·헬륨을 쓰는 4세대는 HALEU 연료가 있어야 돌아간다. 이 탭은 원자로가 열을 전기로 바꾸는 원리에서 시작해 대형·SMR·4세대 노형 22종을 검색 가능한 카드로 정리한다.", "sections": [{"h": "원자로는 물을 끓이는 방식만 다르다 — 가압경수로의 3개 루프", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"가압경수로는 방사성 1차 냉각수와 터빈을 돌리는 2차 증기를 증기발생기에서 분리한다\"><defs><marker id=\"a-pwr1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-pwr1-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--accent)\"/><\/marker><marker id=\"a-pwr1-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--ok)\"/><\/marker><marker id=\"a-pwr1-warn\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--warn)\"/><\/marker><marker id=\"a-pwr1-alert\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--alert)\"/><\/marker><\/defs><rect x=\"16\" y=\"30\" width=\"440\" height=\"318\" rx=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-dasharray=\"4 rx=\"3\" fill=\"var(--sunken)\"/><text x=\"226\" y=\"171\" font-size=\"10.5\" text-anchor=\"middle\" style=\"fill:var(--alert)\">고온 1차수<\/text><path d=\"M210 134 L210 150\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--alert)\"/><path d=\"M282 290 L242 290\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--alert)\" marker-end=\"url(#a-pwr1-alert)\"/><path d=\"M202 290 L160 290\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--alert)\" marker-end=\"url(#a-pwr1-alert)\"/><rect x=\"192.905\" y=\"308.5\" width=\"56.19\" height=\"14.5\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"221\" y=\"319\" font-size=\"10.5\" text-anchor=\"middle\" style=\"fill:var(--alert)\">저온 1차수<\/text><path d=\"M332 90 L332 64 L560 64 L560 90\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--accent)\" marker-end=\"url(#a-pwr1-c)\"/><rect x=\"418.91\" y=\"48.5\" width=\"102.18\" height=\"14.5\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"470\" y=\"59\" font-size=\"10.5\" text-anchor=\"middle\" style=\"fill:var(--accent)\">증기(2차, 비방사성)<\/text><rect x=\"500\" y=\"90\" width=\"120\" height=\"64\" rx=\"8\" fill=\"var(--surface)\" style=\"stroke:var(--accent)\" stroke-width=\"1.6\"/><text x=\"560\" y=\"118.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">터빈<\/text><text x=\"560\" y=\"134.6\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.78\">고압·저압<\/text><rect x=\"660\" y=\"90\" width=\"110\" height=\"64\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"715\" y=\"118.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">발전기<\/text><text x=\"715\" y=\"134.6\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.78\">회전 → 전기<\/text><path d=\"M620 122 L660 122\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\"/><rect x=\"810\" y=\"90\" width=\"134\" height=\"64\" rx=\"8\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-pwr1)\"/><path d=\"M700 278 L620 278\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-pwr1)\"/><rect x=\"649.3\" y=\"235\" width=\"21.4\" height=\"14\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"660\" y=\"245\" font-size=\"10\" text-anchor=\"middle\">3차<\/text><text x=\"16\" y=\"372\" font-size=\"11.5\" text-anchor=\"start\" style=\"fill:var(--alert)\">■ 1차 계통: 노심 열을 운반, 방사성 — 격납건물 밖으로 나가지 않는다<\/text><text x=\"16\" y=\"392\" font-size=\"11.5\" text-anchor=\"start\" style=\"fill:var(--accent)\">■ 2차 계통: 증기발생기에서 만든 깨끗한 증기로 터빈 구동<\/text><text x=\"560\" y=\"392\" font-size=\"11.5\" text-anchor=\"start\" opacity=\"0.8\">■ 3차 계통: 복수기 폐열을 바다·대기로 배출<\/text><\/svg>", "cap": "**결론: 가압경수로는 방사성 1차 계통을 격납건물 안에 가두고 증기발생기에서 깨끗한 2차 증기를 만든다. 그래서 1차 계통 기기(RPV·SG·RCP·가압기)가 가장 비싸고 진입장벽이 높다.** 노심에서 데운 1차 냉각수는 높은 압력 때문에 끓지 않은 채 증기발생기로 가서 열만 넘기고 RCP로 돌아온다. 2차측 물은 증기가 되어 터빈을 돌린 뒤 복수기에서 다시 물이 되고, 복수기 폐열은 바다·냉각탑으로 버려진다. 한국·미국·프랑스 주력 노형이 모두 이 구조다."}, {"t": "p", "text": "원전을 처음 볼 때 기억할 것은 '핵분열은 열원일 뿐이고 나머지는 화력발전소와 같다'는 점이다. 터빈·발전기·복수기·변압기는 화력·가스복합과 기술이 겹쳐 경쟁이 다극화돼 있고, 원자로압력용기·증기발생기처럼 방사성 1차 계통을 담는 압력경계 기기만 원자력 인증(ASME N-stamp)과 초대형 단조가 필요하다. 그래서 같은 원전 기자재라도 1차 계통 기기의 마진과 협상력이 가장 크다."}, {"t": "grid", "items": [{"h": "1차 계통 (Nuclear Island)", "p": "원자로압력용기(500톤+ 단조강, 70~100톤급 단조품 약 7개), 증기발생기(800톤+, U-tube 수천 개, PWR 1기에 2~4개), 가압기, 원자로냉각재펌프. 방사성 경계라 인증·레퍼런스 장벽이 가장 높다.", "tag": "진입장벽 최고"}, {"h": "2차 계통 (Turbine Island)", "p": "증기터빈·발전기, 복수기, 급수가열기·급수펌프. 화력과 기술이 겹친다. APR1400은 두산, AP1000(Vogtle)은 도시바가 T/G를 공급했다 — 노형이 T/G 수혜를 가른다."}, {"h": "계측제어·전기", "p": "MMIS·DCS(운전원-설비 연결), 노내계측기 ICI(2~5년 교체 소모품), 주변압기(GSU)·주제어반. 원전용 Q-Class 등 별도 인증이 필요하다."}, {"h": "3차 계통·부지", "p": "복수기 폐열을 바다·냉각탑으로 버린다. 대형원전이 해안에 몰리는 이유이며, 부지면적은 APR1400 기준 573㎡/MW, SMR은 단위출력당 그 절반 수준이다."}], "cols": 2}]}, {"h": "냉각재·감속재·연료 조합이 노형을 가른다", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 330\" role=\"img\" aria-label=\"원자로 방식은 냉각재·감속재·연료 조합으로 갈리고, 루프 수가 적을수록 단순하지만 방사성 증기가 터빈까지 간다\"><defs><marker id=\"a-typ1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-typ1-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--accent)\"/><\/marker><marker id=\"a-typ1-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--ok)\"/><\/marker><marker id=\"a-typ1-warn\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--warn)\"/><\/marker><marker id=\"a-typ1-alert\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--alert)\"/><\/marker><\/defs><rect x=\"12\" y=\"8\" width=\"228\" height=\"314\" rx=\"10\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"126\" y=\"32\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">가압경수로 PWR<\/text><rect x=\"36\" y=\"48\" width=\"180\" height=\"34\" rx=\"8\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"126\" y=\"69.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">원자로<\/text><rect x=\"36\" y=\"102\" width=\"180\" height=\"34\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"126\" y=\"123.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">증기발생기<\/text><path d=\"M126 82 L126 102\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-typ1)\"/><rect x=\"36\" y=\"156\" width=\"180\" height=\"34\" rx=\"8\" fill=\"var(--surface)\" style=\"stroke:var(--accent)\" stroke-width=\"1.6\"/><text x=\"126\" y=\"177.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">터빈<\/text><path d=\"M126 136 L126 156\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-typ1)\"/><text x=\"126\" y=\"270\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.85\">경수 감속·냉각, LEU 3~5%<\/text><text x=\"126\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.85\">1·2차 분리 — 한·미·프 주력<\/text><text x=\"126\" y=\"306\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">APR1400·AP1000·i-SMR<\/text><rect x=\"249\" y=\"8\" width=\"228\" height=\"314\" rx=\"10\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"363\" y=\"32\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">비등경수로 BWR<\/text><rect x=\"273\" y=\"48\" width=\"180\" height=\"34\" rx=\"8\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"363\" y=\"69.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">원자로(물이 끓음)<\/text><rect x=\"273\" y=\"102\" width=\"180\" height=\"34\" rx=\"8\" fill=\"var(--surface)\" style=\"stroke:var(--accent)\" stroke-width=\"1.6\"/><text x=\"363\" y=\"123.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">터빈<\/text><path d=\"M363 82 L363 102\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-typ1)\"/><text x=\"363\" y=\"270\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.85\">증기발생기 없이 직접 사이클<\/text><text x=\"363\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.85\">구조 단순, 터빈 방사성<\/text><text x=\"363\" y=\"306\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">BWRX-300·ABWR<\/text><rect x=\"486\" y=\"8\" width=\"228\" height=\"314\" rx=\"10\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"600\" y=\"32\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">가압중수로 PHWR<\/text><rect x=\"510\" y=\"48\" width=\"180\" height=\"34\" rx=\"8\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"600\" y=\"69.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">칼란드리아<\/text><rect x=\"510\" y=\"102\" width=\"180\" height=\"34\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"600\" y=\"123.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">증기발생기<\/text><path d=\"M600 82 L600 102\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-typ1)\"/><rect x=\"510\" y=\"156\" width=\"180\" height=\"34\" rx=\"8\" fill=\"var(--surface)\" style=\"stroke:var(--accent)\" stroke-width=\"1.6\"/><text x=\"600\" y=\"177.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">터빈<\/text><path d=\"M600 136 L600 156\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-typ1)\"/><text x=\"600\" y=\"270\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.85\">중수 감속, 천연우라늄 가능<\/text><text x=\"600\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.85\">압력관 교체형 개보수<\/text><text x=\"600\" y=\"306\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">월성·체르나보다(CANDU)<\/text><rect x=\"723\" y=\"8\" width=\"228\" height=\"314\" rx=\"10\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"837\" y=\"32\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">4세대 SFR·HTGR<\/text><rect x=\"747\" y=\"48\" width=\"180\" height=\"34\" rx=\"8\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"837\" y=\"69.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">원자로<\/text><rect x=\"747\" y=\"102\" width=\"180\" height=\"34\" rx=\"8\" style=\"fill:var(--warn);fill-opacity:.10;stroke:var(--warn)\" stroke-width=\"1.3\"/><text x=\"837\" y=\"123.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">소듐·헬륨 루프<\/text><path d=\"M837 82 L837 102\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-typ1)\"/><rect x=\"747\" y=\"156\" width=\"180\" height=\"34\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"837\" y=\"177.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">열저장·SG<\/text><path d=\"M837 136 L837 156\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-typ1)\"/><rect x=\"747\" y=\"210\" width=\"180\" height=\"34\" rx=\"8\" fill=\"var(--surface)\" style=\"stroke:var(--accent)\" stroke-width=\"1.6\"/><text x=\"837\" y=\"231.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">터빈·공정열<\/text><path d=\"M837 190 L837 210\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-typ1)\"/><text x=\"837\" y=\"270\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.85\">비수 냉각재, 고온·저압<\/text><text x=\"837\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.85\">대부분 HALEU·TRISO 필요<\/text><text x=\"837\" y=\"306\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">Natrium·Xe-100<\/text><\/svg>", "cap": "**결론: 루프 수가 줄면 설비가 단순해지고(BWR), 물 대신 소듐·헬륨을 쓰면 고온·저압 운전이 가능해지지만(4세대) 대부분 HALEU 연료가 필요해진다.** PWR은 1·2차 분리로 안전성과 공급망 연속성이 강점이고, BWR은 증기발생기가 없어 단순하지만 터빈까지 방사성 증기가 간다. PHWR(CANDU)은 중수로 천연우라늄을 쓰는 대신 압력관 교체형 대형 개보수가 필요하다. 4세대는 열저장·공정열까지 확장되지만 연료 공급망이 아직 없다."}, {"t": "table", "cols": ["구분", "냉각재", "감속재", "연료", "특징", "대표 노형"], "rows": [["가압경수로 PWR", "경수(고압)", "경수", "LEU 3~5%", "1·2차 분리, 글로벌 운영 원전의 약 71%(313기)", "APR1400·AP xt><text x=\"300\" y=\"285.55\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">BOP·I&amp;C 벤더(착공 후 1~4년)<\/text><rect x=\"414\" y=\"246\" width=\"342\" height=\"56\" rx=\"8\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"585\" y=\"270.37\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">한전KPS·일진파워·우진엔텍(정비)<\/text><text x=\"585\" y=\"285.55\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">우진(ICI 2~5년 교체)·한전기술(LTO)<\/text><rect x=\"764\" y=\"246\" width=\"164\" height=\"56\" rx=\"8\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"846\" y=\"270.37\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">한전기술(해체설계)<\/text><text x=\"846\" y=\"285.55\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">한전KPS(제염)<\/text><text x=\"480\" y=\"324\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.7\">축척 비례 아님 — 단계 순서와 매출 발생 위치를 보여주는 개념도<\/text><\/svg>", "cap": "**결론: 원전의 돈은 건설 10년에 몰리고 운영 60~80년에 나눠 회수되며, 설계사는 착공 전에, 정비사는 상업운전 후에 매출이 난다.** 대형원전 1기 건설비는 80억~140억달러로 전체 라이프사이클 비용의 대부분이고, 정비는 1기당 연 200억원+로 작지만 40~60년 반복된다. 계속운전(LTO) 1~2조원과 해체 1~1.8조원은 신규 건설과 무관하게 발생하는 별도 시장이다."}, {"t": "steps", "items": [{"h": "부지·인허가·설계", "meta": ["착공 약 3.3년 전 설계 발주", "설계 사업비 5~8%", "한전기술·WH"], "p": "부지 확보와 환경영향평가, 건설허가(또는 통합허가) 신청과 함께 종합설계·원자로계통설계가 먼저 발주된다. 국내 설계사는 사업비의 6~8%(새울·신한울 평균 7,200억원), 해외는 5~6%를 수주해 왔다. 주기기·단조 같은 장납기 품목(LLI)도 이 단계에서 선발주된다.", "chk": "11차 전기본 신규 대형 2기(2037~38 상업운전)의 설계 발주는 2027~2028년이 예상 시점이다."}, {"h": "EPC 건설", "meta": ["국내 평균 6.9년", "대형 1기 80억~140억달러", "발전원가의 약 72%가 투자비"], "p": "첫 원자로 콘크리트 타설이 '착공'이다. 이후 RPV 설치(공정률 65%) → 원자로·터빈 아일랜드 완공(85%) → 운전허가로 이어진다. EPC 기성은 초기에 작다가 3~5년차에 급증하는 S커브를 그린다. 공기가 늘면 건설중이자(IDC)가 비선형으로 불어나 총 건설비의 12~54%까지 커진다.", "chk": "공기 비교: 바라카·새울 8~9년, 신한울 1·2 10~11년, Vogtle 3·4 11~12년, EPR 17~18년(착공~첫 계통연결)."}, {"h": "시운전·상업운전", "meta": ["시운전 정비 사업비 약 2%", "한전KPS"], "p": "준공 직전부터 시운전 정비·가동전검사가 들어간다. 바라카에서 한전KPS는 약 4,900억원(사업비의 2.2%)을 받은 뒤 연 150억원 규모 장기 정비계약으로 이어갔다. 이 비율을 두코바니에 적용하면 시운전 정비 약 5,600억원, 장기 정비 연 180억원 안팎이 추정된다.", "chk": "정비 매출은 상업운전 이후에야 발생하므로 해외 수주 뉴스에 대한 주가 민감도가 가장 낮다."}, {"h": "운영·계속운전(LTO)", "meta": ["설계수명 40~60년 → 60~80년", "LTO 1.4GW급 1~2조원", "500~1,100달러/kW"], "p": "경상정비(상시 점검)와 12~24개월 주기의 계획예방정비가 반복된다. 설계수명 이후 계속운전을 위한 개보수는 신규 건설 대비 총비용을 50% 이상 줄인다. 미국은 94기 중 86기가 60년, 9기가 80년 운전 인가를 받았고, 폐쇄 원전 재가동(Palisades·Crane)도 같은 맥락이다.", "chk": "국내 2030년 전 허가 만료 7기(고리 2~4, 한빛 1·2, 월성 2, 한울 1)의 계속운전 일정이 한전 이용률과 정비 매출을 좌우한다."}, {"h": "영구정지·해체", "meta": ["약 15년", "1기 1~1.8조원(7.5억~12.5억달러)"], "p": "영구정지 전 준비(2년) → 사용후핵연료 반출(5년) → 해체(6년) → 부지복원(2년) 순서다. 영구정지 218기 중 해체 완료는 23기(약 10%)뿐이라 잠재 시장이 크다. 고리 1호기는 2025-06 해체 승인을 받아 2037년 완료가 목표다.", "chk": "고리 1호기 실적이 해외 해체 레퍼런스로 연결되는지(한전기술 해체종합설계, 한전KPS 제염)."}]}]}, {"h": "공정률 S커브와 발주 타이밍 — 수혜는 순서대로 온다", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 372\" role=\"img\" aria-label=\"주기기는 착공 전에 선발주되고 보조기기는 첫 콘크리트 이후 1~4년에 걸쳐 발주되므로 수혜는 대형주에서 중소형 벤더로 순차 확산된다\"><defs><marker id=\"a-scv1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-scv1-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--accent)\"/><\/marker><marker id=\"a-scv1-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--ok)\"/><\/marker><marker id=\"a-scv1-warn\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--warn)\"/><\/marker><marker id=\"a-scv1-alert\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--alert)\"/><\/marker><\/defs><path d=\"M90 250 L920 250\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.4\" marker-end=\"url(#a-scv1)\"/><path d=\"M90 250 L90 28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.4\" marker-end=\"url(#a-scv1)\"/><text x=\"82\" y=\"254\" font-size=\"10.5\" text-anchor=\"end\" opacity=\"0.7\">0%<\/text><text x=\"82\" y=\"201.5\" font-size=\"10.5\" text-anchor=\"end\" opacity=\"0.7\">25%<\/text><path d=\"M90 197.5 L900 197.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"82\" y=\"149\" font-size=\"10.5\" text-anchor=\"end\" opacity=\"0.7\">50%<\/text><path d=\"M90 145 L900 145\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"82\" y=\"96.5\" font-size=\"10.5\" text-anchor=\"end\" opacity=\"0.7\">75%<\/text><path d=\"M90 92.5 L900 92.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"82\" y=\"44\" font-size=\"10.5\" text-anchor=\"end\" opacity=\"0.7\">100%<\/text><path d=\"M90 40 L900 40\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"82\" y=\"22\" font-size=\"11\" text-anchor=\"start\" opacity=\"0.8\">공정률<\/text><text x=\"916\" y=\"268\" font-size=\"11\" text-anchor=\"end\" opacity=\"0.8\">시간 →<\/text><path d=\"M90 250 L120 243.7 L250 214.3 L330 203.8 L600 113.5 L740 71.5 L860 40\" fill=\"none\" stroke-width=\"2.4\" style=\"stroke:var(--accent)\" stroke-linejoin=\"round\"/><circle cx=\"120\" cy=\"243.7\" r=\"4.5\" fill=\"var(--surface)\" style=\"stroke:var(--accent)\" stroke-width=\"2\"/><rect x=\"109\" y=\"223.7\" width=\"120.18\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"112\" y=\"234.7\" font-size=\"11\" text-anchor=\"start\">3% EPC 계약·조달 시작<\/text><circle cx=\"250\" cy=\"214.3\" r=\"4.5\" fill=\"var(--surface)\" style=\"stroke:var(--accent)\" stroke-width=\"2\"/><rect x=\"158.48\" y=\"194.3\" width=\"86.52\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"242\" y=\"205.3\" font-size=\"11\" text-anchor=\"end\">17% 인허가·굴착<\/text><circle cx=\"330\" cy=\"203.8\" r=\"4.5\" fill=\"var(--surface)\" style=\"stroke:var(--accent)\" stroke-width=\"2\"/><rect x=\"335\" y=\"209.8\" width=\"86.3\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"338\" y=\"220.8\" font-size=\"11\" text-anchor=\"start\">22% 첫 콘크리트<\/text><circle cx=\"600\" cy=\"113.5\" r=\"4.5\" fill=\"var(--surface)\" style=\"stroke:var(--accent)\" stroke-width=\"2\"/><rect x=\"518.6\" y=\"95.5\" width=\"76.4\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"592\" y=\"106.5\" font-size=\"11\" text-anchor=\"end\">65% RPV 설치<\/text><circle cx=\"740\" cy=\"71.5\" r=\"4.5\" fill=\"var(--surface)\" style=\"stroke:var(--accent)\" stroke-width=\"2\"/><rect x=\"637.92\" y=\"53.5\" width=\"97.08\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"732\" y=\"64.5\" font-size=\"11\" text-anchor=\"end\">85% 아일랜드 완공<\/text><circle cx=\"860\" cy=\"40\" r=\"4.5\" fill=\"var(--surface)\" style=\"stroke:var(--accent)\" stroke-width=\"2\"/><rect x=\"776.62\" y=\"20\" width=\"78.38\" height=\"15\" rx=\"3\" fill=\"var(--sunken)\"/><text x=\"852\" y=\"31\" font-size=\"11\" text-anchor=\"end\">100% 상업운전<\/text><rect x=\"90\" y=\"272\" width=\"236\" height=\"30\" rx=\"8\" style=\"fill:var(--accent);fill-opacity:.12;stroke:var(--accent)\" stroke-width=\"1.4\"/><text x=\"208\" y=\"290.96\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">주기기·단조 LLI 선발주(착공 전)<\/text><rect x=\"330\" y=\"308\" width=\"266\" height=\"30\" rx=\"8\" style=\"fill:var(--warn);fill-opacity:.10;stroke:var(--warn)\" stroke-width=\"1.3\"/><text x=\"463\" y=\"326.96\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">보조기기 업체 선정 — 착공 후 1~4년<\/text><rect x=\"600\" y=\"272\" width=\"136\" height=\"30\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"668\" y=\"290.96\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">BOP·계측제어 납품<\/text><rect x=\"740\" y=\"308\" width=\"156\" height=\"30\" rx=\"8\" style=\"fill:var(--ok);fill-opacity:.10;stroke:var(--ok)\" stroke-width=\"1.3\"/><text x=\"818\" y=\"326.96\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">시운전 정비 → 경상정비<\/text><\/svg>", "cap": "**결론: 시장은 착공 전부터 주기기·EPC 대형주에 먼저 반응하고, 보조기기 벤더는 실제 착공(첫 콘크리트) 뉴스가 나와야 움직인다.** 주기기와 단조 소재는 착공 전 장납기 품목으로 선발주되지만, 보조기기 사업자 선정은 착공 이후 기자재별로 1~4년에 걸쳐 이뤄진다. 그래서 중소형 BOP·계측 기업의 딜을 볼 때는 '어느 프로젝트가 언제 착공했는가'가 매출 추정의 출발점이다."}, {"t": "table", "cols": ["공정률", "마일스톤", "주요 발주"], "rows": [["3%", "EPC 계약, 부지 준비, 조달 시작", "주기기 LLI·단조(착공 전 선발주)"], ["17%", "건설 인허가, 굴착", "토목·시공"], ["22%", "첫 원자로 콘크리트 타설", "보조기기 선정 개시"], ["65%", "RPV 설치", "BOP·계측제어 본격 납품"], ["85%", "원자로/터빈 아일랜드 완공", "전기·제어 통합"], ["98~100%", "운전허가, 상업운전", "시운전 정비 → 경상정비"]], "title": "공정률 마일스톤과 주요 발주", "note": "원출처 IAEA, WNA, 업계 자료 종합"}, {"t": "p", "text": "대표 규모 감각: BOP(복수기·급수가열기 등)는 원전 1기당 약 1~1.5천억원, 비에이치아이는 신한울 3·4 원자력 보조기기 약 1,500억원을 수주해 2026~2029년 분산 인식한다. 노내계측기(ICI)는 2~5년마다 교체되는 소모품 성격이라 신규 원전과 가동 원전 양쪽에서 수요가 나온다(우진: 교체 대상 15기 → 2028년 18~20기, 신한울 3·4 신규 납품 2028년 개시)."}]}, {"h": "EPC 계약의 돈 흐름 — 22.6조원이 어떻게 쪼개지나", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"바라카 22.6조원은 주계약자 한국전력을 거쳐 시공 33%·주기기 23%·설계 5%·시운전 정비 2%로 쪼개져 국내 상장사 매출이 됐다\"><defs><marker id=\"a-epc1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-epc1-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--accent)\"/><\/marker><marker id=\"a-epc1-ok\" e\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--accent)\" marker-end=\"url(#a-epc1-c)\"/><rect x=\"776\" y=\"200\" width=\"172\" height=\"62\" rx=\"8\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"862\" y=\"226.71\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">기타 37%<\/text><text x=\"862\" y=\"244.65\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.78\">BOP·전기·계측·부지<\/text><path d=\"M102 262 L102 300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-epc1)\"/><rect x=\"16\" y=\"300\" width=\"172\" height=\"58\" rx=\"8\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"102\" y=\"325.205\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">현장 하도급·인력<\/text><text x=\"102\" y=\"341.075\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">컨소시엄 주간사 51~60%<\/text><path d=\"M292 262 L292 300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-epc1)\"/><rect x=\"206\" y=\"300\" width=\"172\" height=\"58\" rx=\"8\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"292\" y=\"325.205\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">단조·소재 내재화<\/text><text x=\"292\" y=\"341.075\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">부품·가공 협력사<\/text><path d=\"M482 262 L482 300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-epc1)\"/><rect x=\"396\" y=\"300\" width=\"172\" height=\"58\" rx=\"8\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"482\" y=\"325.205\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">설계 인력 고정비<\/text><text x=\"482\" y=\"341.075\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">수주 증가 시 레버리지<\/text><path d=\"M672 262 L672 300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-epc1)\"/><rect x=\"586\" y=\"300\" width=\"172\" height=\"58\" rx=\"8\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"672\" y=\"325.205\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">상업운전 후 장기정비<\/text><text x=\"672\" y=\"341.075\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">연 150억원 계약<\/text><path d=\"M862 262 L862 300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-epc1)\"/><rect x=\"776\" y=\"300\" width=\"172\" height=\"58\" rx=\"8\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"862\" y=\"325.205\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">중소형 벤더<\/text><text x=\"862\" y=\"341.075\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">착공 후 1~4년 순차 발주<\/text><text x=\"480\" y=\"388\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.8\">비율은 바라카 기준(언론보도·업계 종합). 두코바니(약 26조원)에서 두산 주기기·터빈 5조6,401억원 ≈ 22%로 비슷했다<\/text><\/svg>", "cap": "**결론: 해외 원전 수주 금액을 국내 기업 매출로 번역할 때 기본 비율은 시공 33%·주기기 22~23%·설계 5~6%·시운전 정비 약 2%다.** 팀코리아 모델에서는 한국전력(현재는 한전·한수원 공동 체계)이 주계약자로 서고 설계·주기기·시공을 국내 기업에 분할 배분한다. 나머지 37%는 BOP·전기·계측·부지 등으로, 중소형 벤더의 몫이 여기서 나온다. 두코바니에서도 두산 주기기·터빈이 약 22%로 비슷했다."}, {"t": "table", "cols": ["참여사", "바라카(22.6조원)", "두코바니(약 26조원)", "미국 AP1000 2기 가정(207억달러)"], "rows": [["시공/EPC", "33%(현대 3.7조·삼성 2.8조)", "대우건설 주간사(금액 미확인)", "한수원 EPC 약 174억달러(83.9%)"], ["주기기", "23%(두산 약 2.5조)", "두산 5.64조(22%)", "두산 RV·SG 5~6억 + T/G 7억달러"], ["설계", "5%(한전기술 약 1.1조)", "종합 약 1.2조 + 계통 3,735억원", "종합설계 3.9억(최대 5.8~6.5억)달러"], ["시운전 정비", "2.2%(한전KPS 약 4,900억)", "약 5,600억원 추정", "-"], ["장기 정비", "연 150억원", "연 180억원 안팎 추정", "-"]], "title": "프로젝트별 공급망 매출 배분", "note": "바라카·두코바니는 언론보도·공시, 미국 AP1000 2기 가정은 체코 단가 9,285달러/kW를 적용한 업계 추정"}, {"t": "p", "text": "미국 AP1000 가정은 구조가 다르다. 2기 순공사비 207억달러 가정 시 한수원이 1차 계통 EP를 제외한 EPC를 맡으면 약 174억달러(83.9%), 두산 RV·SG 5~6억달러와 T/G 7억달러, 한전기술 종합설계 약 3.9억달러(1.9%)로 추정됐다. 즉 '누가 EPC를 쥐느냐'에 따라 한국 몫이 수 퍼센트에서 80%대까지 달라진다."}]}, {"h": "계약 구조가 손익을 가른다 — LSTK냐 Cost-plus냐", "blocks": [{"t": "table", "cols": ["구조", "이익 공식", "원가 초과 부담", "대표 사례·시사점"], "rows": [["LSTK(확정총액 일괄)", "계약가 − 실제원가", "EPC가 전액 부담", "Vogtle에서 WH가 LSTK 손실로 2017년 파산보호. 한전은 바라카 손실 경험 이후 원가가산 구조를 전제"], ["Cost-plus(원가가산)", "실제원가 × 이윤율", "발주처 부담", "팬데믹 원자재 급등(2020~22 두바이유 +397%, 철광석 +158%) 이후 미국 EPC들이 이동"], ["목표가격(Target Price)", "목표 대비 절감·초과 공유", "공유", "리스크 공유형 — WH 연합에서 논의 중"], ["에스컬레이션 조항", "물가·원자재 연동 조정", "부분 전가", "팀코리아 모델의 '중위험·안정수익' 전제"]], "note": "원전 비용초과 발생 확률 90%+, 초과 시 평균 100% 이상(화력·재생 40~60%). 해외 도급은 국내 공공공사(GPM 10% 내외)보다 높은 마진 가능(업계 추정)"}, {"t": "callout", "text": "국내 원전 시공은 주간사 51~60%·비주간사 40~49%의 공동이행 컨소시엄 구조라 한 프로젝트의 수혜가 여러 건설사로 나뉜다. 바라카는 현대 55%·삼성 45%, 신한울 1·2(구 신울진)는 현대 55%·두산 35%·포스코 10%였다. 딜 검토 때는 수주 총액이 아니라 지분율 반영 금액으로 본다.", "title": "컨소시엄 지분율을 반드시 곱하라"}, {"t": "table", "cols": ["프로젝트", "컨소시엄"], "rows": [["UAE 바라카 1~4", "현대(55%), 삼성(45%)"], ["신고리 3·4(구)", "삼성(51%), 두산(39%), 한화(10%)"], ["신고리 5·6(구)", "현대(45%), SK(30%), GS(25%)"], ["신울진 1·2(구, 현 신한울)", "현대(55%), 두산(35%), 포스코(10%)"], ["신한울 3·4", "현대, 두산 등"], ["울진 5·6(구)", "현대(50.2%), DL(35.8%), SK(14%)"]], "title": "국내 건설사 원전 시공 컨소시엄 이력(일부)", "note": "원출처 한국수력원자력, 각 사"}]}, {"h": "계속운전·재가동·해체 — 신규 건설보다 먼저 커지는 시장", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 250\" role=\"img\" aria-label=\"가동 원전의 약 40%가 설계수명 40년을 넘어, 신규 건설보다 계속운전 개보수와 해체 시장이 먼저 커진다\"><defs><marker id=\"a-lto1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-lto1-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style \" marker-end=\"url(#a-lto1)\"/><rect x=\"614\" y=\"12\" width=\"330\" height=\"52\" rx=\"8\" style=\"fill:var(--ok);fill-opacity:.10;stroke:var(--ok)\" stroke-width=\"1.3\"/><text x=\"779\" y=\"34.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">신규 대비 총비용 50%+ 절감<\/text><text x=\"779\" y=\"50.6\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">미국 94기 중 86기 60년·9기 80년 인가<\/text><rect x=\"614\" y=\"90\" width=\"330\" height=\"52\" rx=\"8\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"779\" y=\"112.04\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">잠재 해체시장<\/text><text x=\"779\" y=\"128.6\" font-size=\"10.5\" text-anchor=\"middle\" opacity=\"0.78\">2025년 200~350조 → 2050년 500~900조원<\/text><path d=\"M560 38 L614 38\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"stroke:var(--ok)\" marker-end=\"url(#a-lto1-ok)\"/><path d=\"M560 116 L614 116\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-opacity=\"0.55\" marker-end=\"url(#a-lto1)\"/><rect x=\"16\" y=\"172\" width=\"928\" height=\"60\" rx=\"8\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"480\" y=\"197.875\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"600\">국내 연결점<\/text><text x=\"480\" y=\"215.125\" font-size=\"11\" text-anchor=\"middle\" opacity=\"0.78\">한전KPS 체르나보다 1호기 설비개선(4,850억원, 2027 하반기 착수) · 고리 1호기 해체(2025-06 승인, 2037 완료 목표) · 국내 2030년 전 허가 만료 7기<\/text><\/svg>", "cap": "**결론: 신규 원전 착공은 정책·금융이 풀려야 하지만, 40년 넘은 165기의 계속운전과 영구정지 218기의 해체는 이미 정해진 수요다.** 계속운전은 신규 대비 총비용을 50% 이상 줄여 빅테크·유틸리티가 먼저 선택하고, 해체는 2050년까지 잠재 500~900조원 규모로 추산된다. 정비·개보수 기업의 매출은 해외 신규 수주 사이클과 독립적으로 움직인다."}, {"t": "table", "cols": ["프로젝트", "내용", "비용"], "rows": [["캐나다 Point Lepreau", "연료채널 교체·주요 설비 개보수", "C$1.4B(약 $1.1B)/기"], ["프랑스 EDF(56기)", "40→60년 연장(Grand Carénage)", "€49~55B+"], ["캐나다 Darlington", "CANDU 전면 개보수", "$2.3B/기"], ["루마니아 Cernavodă 1", "CANDU refurbishment", "약 €1.5B(2.8조원)/기"], ["일반 LTO(NEA)", "주요 설비 교체+안전성 업그레이드", "약 $1~2B"], ["해체(권장)", "제염·해체·부지복원", "$0.75~1.25B/기"]], "title": "글로벌 LTO·해체 비용 사례", "note": "원출처 NB Power, Reuters, OPG, OECD NEA, IAEA. 체르나보다 단가는 집계에 따라 €1.5B·2.8조원으로 표기"}, {"t": "table", "cols": ["발전소", "용량(MW)", "허가 만료", "재가동(예상)"], "rows": [["고리 2호기", "650", "2023-04", "2026-04-04"], ["고리 3호기", "950", "2024-09", "2026-12-30"], ["고리 4호기", "950", "2025-08", "2026-12-30"], ["한빛 1호기", "950", "2025-12", "2027-03-31"], ["한빛 2호기", "950", "2026-09", "-"], ["월성 2호기", "700", "2026-11", "-"], ["한울 1호기", "950", "2027-12", "-"]], "title": "국내 계속운전 대상 원전 재가동 일정", "note": "원출처 한국수력원자력. 12차 전기본 검토안은 원전 9기 계속운전"}]}]}, "fuel": {"title": "핵연료 주기", "h2": "핵연료 주기 — 원자로보다 먼저 막히는 곳", "en": "Nuclear Fuel Cycle", "lede": "원자로를 지어도 연료가 없으면 못 돌린다. 1GW 원전 1년 가동에는 **우라늄 170MTU와 14만 SWU**가 들어가는데, 그 사이의 변환·농축은 러시아 Rosatom을 포함한 5~7개 기업이 과점한다. 글로벌 농축능력의 약 45%가 러시아에 있고, 4세대 SMR과 핵잠에 필요한 HALEU는 사실상 러시아 독점이다. 그래서 연료주기는 **원자로 확대 속도의 상한**이자, 한미 원자력협정 개정과 묶인 한국의 새 사업 영역이다.", "sections": [{"h": "연료가 원자로에 들어가기까지 — 채광에서 사용후핵연료까지", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 386\" role=\"img\" aria-label=\"핵연료는 채광→변환→농축→성형가공을 거쳐 장전되고, 변환·농축은 소수 과점이라 원자로보다 먼저 병목이 된다\"><defs><marker id=\"a-fue1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-fue1-c\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--accent)\"/><\/marker><marker id=\"a-fue1-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--ok)\"/><\/marker><marker id=\"a-fue1-warn\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 1
