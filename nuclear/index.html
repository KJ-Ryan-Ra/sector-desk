자로·기술"}, {"term": "핵증기공급계통", "en": "NSSS", "def": "원자로·증기발생기·냉각재펌프·가압기·I&C 등 원자로를 중심으로 한 1차 계통.", "group": "원자로·기술"}, {"term": "보조기기 / 발전소 부속설비", "en": "BOP", "def": "원자로계통 외 복수기·열교환기·배관·밸브·전기설비 등. 종합설계 영역을 뜻하기도 한다.", "group": "원자로·기술"}, {"term": "원자로압력용기", "en": "RPV", "def": "핵분열이 일어나는 원자로 본체 용기. 500톤 이상 단조강 구조물.", "group": "원자로·기술"}, {"term": "증기발생기", "en": "SG", "def": "1차 계통 열로 2차 계통 증기를 만드는 U-tube 열교환기(800톤 이상).", "group": "원자로·기술"}, {"term": "원자로냉각재펌프", "en": "RCP", "def": "1차 냉각수를 순환시키는 펌프. APR+ 자립 대상 핵심기술 중 하나.", "group": "원자로·기술"}, {"term": "터빈발전기", "en": "T/G", "def": "증기로 회전력을 만들어 전기로 바꾸는 2차 계통 설비.", "group": "원자로·기술"}, {"term": "복수기", "en": "Condenser", "def": "터빈 배기증기를 물로 응축하는 BOP 설비.", "group": "원자로·기술"}, {"term": "계측제어 시스템", "en": "MMIS", "def": "원전 운전원과 설비를 잇는 계측제어·인터페이스 시스템.", "group": "원자로·기술"}, {"term": "분산제어시스템", "en": "DCS", "def": "MMIS의 핵심 제어기로 냉각재펌프 등 설비를 감시·제어.", "group": "원자로·기술"}, {"term": "노내계측기", "en": "ICI", "def": "원자로 내부 중성자속을 측정하는 계측기. 2~5년마다 교체. APR1400 약 60개, NuScale 모듈 12개.", "group": "원자로·기술"}, {"term": "단조", "en": "Forging", "def": "잉곳을 가열 후 대형 프레스로 압력을 가해 조직을 치밀하게 만드는 가공. RPV·SG·샤프트에 필수.", "group": "원자로·기술"}, {"term": "열에너지 저장", "en": "TES", "def": "열을 저장했다 필요 시 발전에 쓰는 시스템. Natrium은 용융염을 사용해 345→500MW 부하추종.", "group": "원자로·기술"}, {"term": "계통 관성", "en": "Inertia", "def": "회전기의 운동에너지로 주파수 급변을 완충하는 성질. 원전·가스터빈은 있고 태양광·연료전지·ESS는 없다.", "group": "원자로·기술"}, {"term": "냉각재 상실사고", "en": "LOCA", "def": "원자로 냉각재가 유출되는 사고 유형.", "group": "원자로·기술"}, {"term": "노심손상빈도", "en": "CDF", "def": "노심이 손상될 확률 지표. SMR은 대형원전보다 수 자릿수 낮게 설계.", "group": "원자로·기술"}, {"term": "비상계획구역", "en": "EPZ", "def": "원전 비상 대응 구역. 대형원전 반경 약 16km, SMR(SMART 기준) 반경 300m.", "group": "원자로·기술"}, {"term": "국제원자력사고등급", "en": "INES", "def": "IAEA의 원전 사고 심각도 0~7등급 분류.", "group": "원자로·기술"}, {"term": "브라운필드 SMR", "en": "Brownfield SMR", "def": "퇴역 석탄·원전 부지에 SMR을 지어 송전망·냉각수·인허가 경험을 재활용하는 전략. 사업비 15~30% 절감 기대.", "group": "원자로·기술"}, {"term": "APR1400", "en": "Advanced Power Reactor 1400", "def": "한국형 1,400MWe 가압경수로. 비미국 노형 최초 NRC DC·SDA 보유.", "group": "노형"}, {"term": "APR1000", "en": "APR1000", "def": "APR1400을 유럽 요건에 맞춘 1GW급 노형. 체코 두코바니 채택.", "group": "노형"}, {"term": "APR+", "en": "APR Plus", "def": "WH 의존 핵심기술(RCP·MMIS·설계코드)까지 100% 자립한 차세대 한국형 노형(개발 중).", "group": "노형"}, {"term": "OPR1000/KSNP", "en": "Optimized Power Reactor 1000", "def": "1990년대 한국표준형 1,000MWe 원전. 단일 설계 반복으로 비용 하락의 기반.", "group": "노형"}, {"term": "AP1000", "en": "Westinghouse AP1000", "def": "WH 3세대+ PWR(약 1,117MWe). 미국 대형원전 표준으로 수렴 중.", "group": "노형"}, {"term": "AP300", "en": "Westinghouse AP300", "def": "AP1000 기술 기반 WH의 SMR. 800억달러 파트너십 대상 포함.", "group": "노형"}, {"term": "i-SMR", "en": "innovative SMR", "def": "한수원 주도 혁신형 SMR. 모듈 170~175MWe, 2028 표준설계인가 목표.", "group": "노형"}, {"term": "SMART", "en": "System-integrated Modular Advanced ReacTor", "def": "한국원자력연구원 330MWt 일체형 소형원자로. 2012년 세계 최초 표준설계인가.", "group": "노형"}, {"term": "BANDI", "en": "BANDI-60", "def": "한전기술의 60MWe 해상부유식 SMR. 분산전원·해수담수화 틈새시장 목표.", "group": "노형"}, {"term": "System 80", "en": "CE System 80", "def": "옛 Combustion Engineering의 PWR 설계. OPR1000·APR1400의 기술 뿌리로 WH 지재권 분쟁의 원인.", "group": "노형"}, {"term": "EPR", "en": "European Pressurized Reactor", "def": "EDF·Framatome의 1,600MWe급 노형. Flamanville 3·Olkiluoto 3에서 공기 17~18년.", "group": "노형"}, {"term": "VVER-1200", "en": "VVER-1200", "def": "Rosatom의 러시아형 PWR. 안보상 서방 진출 제한.", "group": "노형"}, {"term": "HPR1000(화룽1호)", "en": "Hualong One", "def": "중국 3세대 PWR. 기존 공급망 유지로 2,500~3,000달러/kWe 안정.", "group": "노형"}, {"term": "CPR-1000", "en": "CPR-1000", "def": "2000년대 중국 표준 노형. 대량 반복 건설로 2,000~2,500달러/kWe 달성.", "group": "노형"}, {"term": "Natrium", "en": "Natrium", "def": "TerraPower의 SFR+용융염 저장 설계(345MWe, 최대 500MWe).", "group": "노형"}, {"term": "Xe-100", "en": "Xe-100", "def": "X-energy 헬륨냉각 고온가스로(80MWe×4).", "group": "노형"}, {"term": "BWRX-300", "en": "BWRX-300", "def": "GE Vernova Hitachi 300MWe 비등경수로 SMR.", "group": "노형"}, {"term": "VOYGR", "en": "NuScale VOYGR", "def": "NuScale 77MWe 모듈 최대 12기 SMR 발전소.", "group": "노형"}, {"term": "SMR-300", "en": "Holtec SMR-300", "def": "Holtec 300MWe 3.5세대 PWR SMR. Palisades 2기 FOAK.", "group": "노형"}, {"term": "ACP100", "en": "Linglong One", "def": "중국 CNNC 육상 SMR. 2026년 세계 최초 상업운전 목표.", "group": "노형"}, {"term": "저농축우라늄", "en": "LEU", "def": "U-235 3~5% 미만 농축. 기존 경수로 연료.", "group": "핵연료"}, {"term": "고순도 저농축우라늄", "en": "HALEU", "def": "U-235 5~19.75% 농축. 4세대 SMR·장주기 핵잠 연료. 상업 공급은 사실상 러시아 독점.", "group": "핵연료"}, {"term": "고농축우라늄", "en": "HEU", "def": "U-235 20% 이상. 미·영 핵잠은 90%+. 핵확산 규제 대상.", "group": "핵연료"}, {"term": "옐로케이크", "en": "U3O8", "def": "채굴·정제한 우라늄 정광.", "group": "핵연료"}, {"term": "육불화우라늄", "en": "UF6", "def": "가열 시 기체가 되어 원심분리 농축이 가능한 우라늄 화합물. 변환 공정의 산출물.", "group": "핵연료"}, {"term": "분리작업단위", "en": "SWU", "def": "우라늄 농축 작업량의 표준 단위. 1GW 1년 가동에 약 14만 SWU.", "group": "핵연료"}, {"term": "우라늄 금속톤", "en": "MTU", "def": "우라늄 금속 기준 톤 단위. 1GW 1년에 약 170MTU.", "group": "핵연료"}, {"term": "삼중피복입자연료", "en": "TRISO", "def": "우라늄 커널을 탄소·탄화규소 다층으로 감싼 세라믹 입자 연료. 고온가스로·용융염로용.", "group": "핵연료"}, {"term": "원심분리 캐스케이드", "en": "Centrifuge Cascade", "def": "원심분리기를 직렬·병렬로 연결한 농축 설비 단위. Centrus는 120기로 2030년 6MTU 목표.", "group": "핵연료"}, {"term": "용액채광", "en": "ISR", "def": "지하 광체에 용액을 주입해 우라늄을 녹여 회수하는 채광 방식.", "group": "핵연료"}, {"term": "파이로프로세싱", "en": "Pyroprocessing", "def": "500~650℃ 용융염에서 전기화학적으로 사용후핵연료의 우라늄·초우라늄을 회수하는 건식 재처리.", "group": "핵연료"}, {"term": "건식저장용기", "en": "Dry Cask / CASK", "def": "사용후핵연료를 자연대류 냉각·차폐하며 부지 내 저장하는 특수강·콘크리트 용기.", "group": "핵연료"}, {"term": "HI-STORM", "en": "HI-STORM", "def": "Holtec의 건식저장 시스템 브랜드(1997 NRC 인증, 글로벌 점유율 약 45%).", "group": "핵연료"}, {"term": "미국 원자력규제위원회", "en": "NRC", "def": "미국 원전 인허가·규제 기관.", "group": "인허가·규제"}, {"term": "설계인증", "en": "DC (Design Certification)", "def": "10 CFR Part 52에 따른 노형 설계 사전 인증. 대형 PWR 중 AP1000·APR1400이 유지.", "group": "인허가·규제"}, {"term": "표준설계승인", "en": "SDA", "def": "NRC 표준설계승인. NuScale 77MW, APR1400 보유.", "group": "인허가·규제"}, {"term": "건설허가", "en": "CP (Construction Permit)", "def": "Part 50 절차의 원자로 건설 허가.", "group": "인허가·규제"}, {"term": "통합허가", "en": "COL (Combined License)", "def": "Part 52의 건설·운영 통합 허가.", "group": "인허가·규제"}, {"term": "통합허가 신청", "en": "COLA", "def": "COL 신청 서류. Fermi America가 Part 2까지 제출.", "group": "인허가·규제"}, {"term": "조기부지허가", "en": "ESP (Early Site Permit)", "def": "설계 확정 전 부지 적합성을 먼저 승인받는 절차.", "group": "인허가·규제"}, {"term": "제한작업허가", "en": "LWA", "def": "본 허가 전 일부 부지·기초 공사를 허용하는 NRC 단계.", "group": "인허가·규제"}, {"term": "10 CFR Part 50/52", "en": "Part 50/52", "def": "Part 50은 건설·운영허가 분리, Part 52는 설계인증 후 통합허가.", "group": "인허가·규제"}, {"term": "10 CFR Part 53", "en": "Part 53", "def": "기술중립·성능·위험정보 기반 첨단원전 선택형 허가 체계. 2026-04 발효.", "group": "인허가·규제"}, {"term": "10 CFR Part 57", "en": "Part 57", "def": "마이크로리액터 전용 간소화 허가 체계(2026-04 제안).", "group": "인허가·규제"}, {"term": "외국인 소유·통제·지배 제한", "en": "FOCD", "def": "NRC의 원전 사업주 외국인 지배 제한 규정. 동맹국 공급망 선호의 근거.", "group": "인허가·규제"}, {"term": "소급규제", "en": "Backfitting", "def": "건설·운영 중 원전에 새 안전요구를 소급 적용하는 NRC 관행. 미국 비용 폭등 원인.", "group": "인허가·규제"}, {"term": "국가환경정책법", "en": "NEPA", "def": "개별 프로젝트마다 환경영향평가(EIS)를 요구하는 미국 법.", "group": "인허가·규제"}, {"term": "ADVANCE Act", "en": "ADVANCE Act", "def": "2024-07 미국 원전 인허가 가속·수수료 감면·러중 연료 제한 법.", "group": "인허가·규제"}, {"term": "ASME N-stamp", "en": "ASME Nuclear stamp", "def": "안전 관련 원자력 부품 제조 권한을 부여하는 시설 단위 인증.", "group": "인허가·규제"}, {"term": "Q-Class", "en": "Q-Class", "def": "원전 안전등급 기자재 공급 자격 인증.", "group": "인허가·규제"}, {"term": "일반설계평가", "en": "GDA", "def": "영국 원전 노형 설계 평가 절차. Rolls-Royce SMR 진행 중.", "group": "인허가·규제"}, {"term": "계속운전 / 장기운전", "en": "LTO (Long-Term Operation)", "def": "설계수명 이후 60~80년 운전과 이를 위한 개보수.", "group": "인허가·규제"}, {"term": "재가동", "en": "Restart", "def": "영구정지(해체) 상태 원전을 운영 상태로 되돌리는 것. Palisades가 미국 최초.", "group": "인허가·규제"}, {"term": "균등화발전원가", "en": "LCOE", "def": "수명 전체 비용의 현재가치를 총발전량으로 나눈 값.", "group": "경제·금융"}, {"term": "순수 건설비", "en": "OCC / Overnight Cost", "def": "금융비용을 제외하고 하룻밤에 짓는다고 가정한 건설 단가(달러/kW).", "group": "경제·금융"}, {"term": "건설 중 이자", "en": "IDC", "def": "건설 기간 금융비용. 공기 지연에 가장 민감하며 총 건설비의 12~54%.", "group": "경제·금융"}, {"term": "초도호기 / 반복호기", "en": "FOAK / NOAK", "def": "특정 설계의 첫 건설과 반복 건설 이후 호기. NOAK로 갈수록 학습효과로 비용 하락.", "group": "경제·금융"}, {"term": "Fleet 발주·건설", "en": "Fleet Order / Fleet Build", "def": "동일 설계를 연속 발주·반복 건설해 비용·공기를 안정화하는 전략.", "group": "경제·금융"}, {"term": "학습곡선 / 역학습", "en": "Learning Curve", "def": "반복 건설로 단가가 내려가는 효과. 미국은 규제·설계변경으로 오히려 상승(역학습).", "group": "경제·금융"}, {"term": "Bankability", "en": "Bankability", "def": "프로젝트가 충분한 현금흐름으로 금융 조달을 유치할 수 있는 능력.", "group": "경제·금융"}, {"term": "규제자산기반 모델", "en": "RAB", "def": "규제기관 승인 허용수익률로 건설 중에도 비용을 요금으로 선회수하는 영국식 원전 금융.", "group": "경제·금융"}, {"term": "차액결제계약", "en": "CfD", "def": "일정 기간 전력 판매가격을 보장하는 계약. 초장기 CfD로 자본비용 인하 제언.", "group": "경제·금융"}, {"term": "수익률 규제", "en": "Rate-of-Return Regulation", "def": "비용초과도 요금으로 8~10% 이윤과 함께 회수하게 한 과거 미·영 제도.", "group": "경제·금융"}, {"term": "최종투자결정", "en": "FID", "def": "사업주가 자금조달과 착공을 확정하는 단계.", "group": "경제·금융"}, {"term": "특수목적법인", "en": "SPC", "def": "대형 프로젝트의 발주·자금조달을 전담하는 법인.", "group": "경제·금융"}, {"term": "대출프로그램국", "en": "LPO", "def": "미국 DOE 에너지 인프라 대출보증 조직.", "group": "경제·금융"}, {"term": "에너지 지배력 금융", "en": "EDF (Energy Dominance Financing)", "def": "DOE 신설 금융조직. 2026-06 원자력 공급망 175억달러 대출 약정. (프랑스전력 EDF와 구분)", "group": "경제·금융"}, {"term": "지분참여권", "en": "PI (Participation Interest)", "def": "미 정부가 WH 파트너십에서 확보한 수익참여·지분 권리. 누적 800억달러 FID 시 발효.", "group": "경제·금융"}, {"term": "첨단원자로 실증 프로그램", "en": "ARDP", "def": "DOE가 SMR 설계·인허가·건설·HALEU 비용을 50% 분담하는 프로그램.", "group": "경제·금융"}, {"term": "생산세액공제", "en": "PTC (45U·45Y)", "def": "발전량 기반 세액공제. OBBBA로 원전은 2032년 착공분까지 유지.", "group": "경제·금융"}, {"term": "OBBB법", "en": "One Big Beautiful Bill", "def": "IRA 보조금을 수정한 2025년 미국 법. 원전 우대 유지, 풍력·태양광 단축.", "group": "경제·금융"}, {"term": "장납기 품목", "en": "LTI / LLI", "def": "리드타임이 긴 주요 기자재(RPV·SG 등). 선주문 자금이 필요.", "group": "경제·금융"}, {"term": "전력구매계약", "en": "PPA", "def": "발전량을 장기간 정해진 조건으로 구매하는 계약.", "group": "경제·금융"}, {"term": "다섯 번째 고객 문제", "en": "Fifth Customer Problem", "def": "모두가 비싼 첫 호기를 피하고 후속 호기만 사려 해 아무도 발주하지 않는 교착.", "group": "경제·금융"}, {"term": "설계·조달·시공", "en": "EPC", "def": "설계·조달·시공 일괄 수행.", "group": "계약·EPC"}, {"term": "확정총액 일괄계약", "en": "LSTK", "def": "EPC가 고정가로 설계~시공을 일괄 책임지고 원가초과를 흡수하는 계약.", "group": "계약·EPC"}, {"term": "원가가산 계약", "en": "Cost-plus", "def": "실제 원가에 이윤을 더해 받는 계약. 미국 원전 EPC에서 일반화 추세.", "group": "계약·EPC"}, {"term": "기본설계", "en": "FEED", "def": "EPC 본계약 전 사업비·범위를 확정하는 전단 엔지니어링.", "group": "계약·EPC"}, {"term": "종합설계", "en": "AE (Architect Engineering)", "def": "원자로계통 외 터빈·보조계통을 연결하는 발전소 전체 설계.", "group": "계약·EPC"}, {"term": "통합 프로젝트 수행", "en": "IPD", "def": "발주처·개발사·EPC가 인센티브를 공유하는 관리 모델.", "group": "계약·EPC"}, {"term": "디벨로퍼 모델", "en": "Developer Model", "def": "부지·인허가·자금·PM부터 완공까지 총괄 책임지는 사업 방식. 한전의 미국 역할로 거론.", "group": "계약·EPC"}, {"term": "최종 제안 요청", "en": "BAFO", "def": "입찰 최종 후보에게 최선의 제안을 요구하는 단계.", "group": "계약·EPC"}, {"term": "팀코리아", "en": "Team Korea", "def": "한전·한수원·한전기술·한전원자력연료·두산·건설사가 구성하는 원전 수출 컨소시엄.", "group": "계약·EPC"}, {"term": "주간사 / 비주간사", "en": "Lead / Non-lead", "def": "국내 원전 주설비공사 공동이행 구조(주간사 51~60%, 비주간사 40~49%). 10년 내 준공 실적이 대표사 자격.", "group": "계약·EPC"}, {"term": "사전착수지시", "en": "ATP (Authorization to Proceed)", "def": "본계약 전 일부 업무 착수 지시. 정산 매출 발생.", "group": "계약·EPC"}, {"term": "부하율 / 이용률", "en": "Load / Capacity Factor", "def": "설치용량 대비 실제 평균 출력 비율. 미국 원전 92.3%(2024).", "group": "운영·전력시장"}, {"term": "에너지 가용률", "en": "EAF", "def": "IAEA PRIS 기준 원전 에너지 가용률. 2024년 글로벌 82~83%.", "group": "운영·전력시장"}, {"term": "계획예방정비", "en": "Planned Outage", "def": "12~24개월 주기로 가동을 멈추고 분해점검하는 정비. 건당 매출 최대.", "group": "운영·전력시장"}, {"term": "경상정비", "en": "Routine Maintenance", "def": "가동 중 상시 점검·즉시 조치. 건당 작지만 비중 최대.", "group": "운영·전력시장"}, {"term": "기저전원", "en": "Baseload", "def": "24시간 일정 출력, 날씨 무관, 낮은 발전단가의 발전원.", "group": "운영·전력시장"}, {"term": "디스패처블 전원", "en": "Dispatchable generation", "def": "급전 지시에 따라 출력을 조절할 수 있는 발전원(원전·가스·연료전지).", "group": "운영·전력시장"}, {"term": "계량기 뒤 발전", "en": "BTM (Behind-the-Meter)", "def": "계통을 거치지 않는 수요지 자가발전. 반대는 FTM.", "group": "운영·전력시장"}, {"term": "계통대기", "en": "Interconnection Queue", "def": "송전망 접속 승인을 기다리는 설비. 미국 2.3TW(2024).", "group": "운영·전력시장"}, {"term": "에너지 비상경보", "en": "EEA", "def": "북미 계통운영자 전력수급 비상 단계. EEA-3는 순환정전 직전.", "group": "운영·전력시장"}, {"term": "계통한계가격", "en": "SMP", "def": "한국 전력시장에서 마지막 발전기 변동비로 정해지는 도매가격. 대부분 LNG가 결정.", "group": "운영·전력시장"}, {"term": "용량시장 경매", "en": "PJM BRA", "def": "PJM 발전용량 경매. 2026-27년 329.2달러/MW-day로 급등.", "group": "운영·전력시장"}, {"term": "통합자원계획", "en": "IRP", "def": "미국 유틸리티가 규제당국에 제출하는 장기 전원 구성 계획.", "group": "운영·전력시장"}, {"term": "공공서비스위원회", "en": "PSC", "def": "미국 주 단위 전력요금·투자 승인 기관.", "group": "운영·전력시장"}, {"term": "해체", "en": "Decommissioning", "def": "영구정지 후 제염·해체·부지복원까지 약 15년 과정.", "group": "운영·전력시장"}, {"term": "전력수급기본계획", "en": "전기본", "def": "한국 정부의 2년 주기 장기 전원 구성 계획. 11차(2025-02), 12차(2026 수립 중).", "group": "운영·전력시장"}, {"term": "123협정", "en": "Section 123 Agreement", "def": "미국 원자력법 123조 기반 양자 원자력 협력 협정. 한미 2015년 개정본은 20% 이상 농축·군사 전용 금지.", "group": "정책·외교"}, {"term": "원자력법 91조", "en": "AEA Section 91", "def": "군사 목적 핵물질 이전 조항. 대통령 승인·의회 검토의 별도 협정 필요.", "group": "정책·외교"}, {"term": "IAEA 특별안전조치(14조)", "en": "INFCIRC/153 Para.14", "def": "비핵국이 함정 추진 등 비금지 군사활동에 핵물질을 쓸 때 안전조치를 유예하는 조항.", "group": "정책·외교"}, {"term": "한미 원자력 고위급위원회", "en": "MLC", "def": "현행 협정하 농축·재처리 건별 승인 협의체(승인 사례 없음).", "group": "정책·외교"}, {"term": "공동 설명자료", "en": "JFS (Joint Fact Sheet)", "def": "한미 정상회담 공동 팩트시트. 2025-11 핵잠·농축·재처리 지지 명문화.", "group": "정책·외교"}, {"term": "한국형 핵추진잠수함", "en": "K-SSN", "def": "HALEU 일체형 경수로 기반 핵잠 구상(4,000~5,000톤급+).", "group": "정책·외교"}, {"term": "MASGA / MANUGA", "en": "Make American Shipbuilding/Nuclear Great Again", "def": "한국의 대미 조선·원자력 협력 투자 패키지.", "group": "정책·외교"}, {"term": "EU 녹색분류체계", "en": "EU Taxonomy", "def": "친환경 경제활동 분류. 2022년 원자력 포함.", "group": "정책·외교"}, {"term": "산업·기술 혜택", "en": "ITB", "def": "캐나다 방산 조달 시 계약금액 100%를 자국 경제활동으로 환원하는 제도.", "group": "정책·외교"}, {"term": "에너지 트릴레마", "en": "Energy Trilemma", "def": "안보성·형평성·환경성의 세 가치. 2022년 이후 안보성으로 무게 이동.", "group": "정책·외교"}, {"term": "UPRISE", "en": "DOE UPRISE", "def": "기존 원전 출력증강·재가동으로 2029년까지 약 5GW 추가하는 DOE 이니셔티브.", "group": "정책·외교"}, {"term": "First Mover", "en": "DOE SMR First Mover", "def": "DOE가 미국 최초 SMR 착공 후보로 선정한 부지(Palisades·Clinch River).", "group": "정책·외교"}, {"term": "CPSP", "en": "Canadian Patrol Submarine Project", "def": "캐나다 차기 잠수함 8~12척 사업. 한화오션·TKMS 결선.", "group": "정책·외교"}, {"term": "착공(첫 콘크리트)", "en": "First Nuclear Concrete", "def": "원자로 건물 기초에 첫 안전등급 콘크리트를 타설하는 시점. 공정률 약 22%에 해당하며, 보조기기 발주가 이 시점 이후 1~4년에 걸쳐 시작된다.", "group": "계약·EPC"}, {"term": "공정률 마일스톤", "en": "Construction Milestones", "def": "EPC 계약(3%) → 인허가·굴착(17%) → 첫 콘크리트(22%) → RPV 설치(65%) → 아일랜드 완공(85%) → 상업운전. 발주·매출 인식 시점 추정의 기준.", "group": "계약·EPC"}, {"term": "ITAAC", "en": "Inspections, Tests, Analyses and Acceptance Criteria", "def": "Part 52 통합허가(COL) 원전이 건설 완료 후 운전 전에 충족해야 하는 검사·시험·분석·수용기준.", "group": "인허가·규제"}, {"term": "원자력 인증 3중 장벽", "en": "Nuclear Supply Barriers", "def": "대형 프레스(설비)·원자력 인증(기술)·제작 레퍼런스의 세 진입장벽. 수요 증가가 신규 진입이 아닌 기존 공급자 협상력 강화로 이어지는 이유.", "group": "원자로·기술"}, {"term": "전환비", "en": "Conversion Price", "def": "U3O8을 UF6로 바꾸는 변환 서비스 가격. 2022년 천연 UF6 가격의 10%에서 20% 이상으로 급등했다.", "group": "핵연료"}, {"term": "원가회수율", "en": "Cost Recovery Ratio", "def": "전기요금 수입이 발전·구입 원가를 얼마나 회수하는지의 비율. 한전 PBR 재평가 논리에서 131% 시 1.0배+ 제시(2016년 107%가 과거 고점).", "group": "운영·전력시장"}], "facts": [], "desks": [{"key": "hub", "name": "전체", "url": "../index.html"}, {"key": "hc", "name": "헬스케어", "url": "../healthcare/index.html"}, {"key": "oilchem", "name": "정유·화학", "url": "../oilchem/index.html"}, {"key": "transition", "name": "에너지전환", "url": "../transition/index.html"}, {"key": "power", "name": "전력인프라", "url": "../power/index.html"}, {"key": "nuclear", "name": "원전", "url": "../nuclear/index.html"}, {"key": "metals", "name": "철강·비철", "url": "../metals/index.html"}]}</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const TAGC={'확인':'t-ok','추정':'t-warn','미확인':'t-alert','구자료':'t-dim'};
const tag=t=>!t?'':`<span class="tag ${TAGC[t]||'t-acc'}">${esc(t)}</span>`;
const tone=t=>t==='긍정'?'<span class="tag t-ok">긍정</span>':t==='부정'?'<span class="tag t-alert">부정</span>':'<span class="tag t-dim">중립</span>';
const uniq=a=>[...new Set(a.filter(Boolean))];
const M=D.meta;
document.title=M.short+' 리서치 데스크';
$('#b-eng').textContent=M.eng;$('#b-title').textContent=M.short;$('#b-sub').innerHTML=esc(M.subtitle)+(M.owner?`<br>${esc(M.owner)}`:'');
$('#foot').textContent=M.version;$('#cut').textContent='DATA CUT '+M.cut;$('#upd').textContent=M.updated?('UPDATED '+M.updated):'';
$('#desks').innerHTML='<div class="dl">SECTOR DESKS</div>'+(D.desks||[]).map(x=>`<a href="${esc(x.url)}"${/^https?:/.test(x.url)?' target="_blank" rel="noopener"':''}${x.key===M.key?' class="cur"':''}>${esc(x.name)}</a>`).join('');

let uid=0;
function chips(el,groups,cb,label='전체'){el.innerHTML=[label,...groups].map((g,i)=>`<button class="chip" aria-pressed="${i===0}" data-g="${esc(i?g:'')}">${esc(g)}</button>`).join('');el.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;el.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b.dataset.g);});}
const tableH=(cols,rows,cls='')=>`<div class="tw"><table class="${cls}"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' style="font-weight:600;color:var(--ink)"':''}>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const fmt=v=>{const a=Math.abs(v);return a>=1000?v.toLocaleString('ko-KR',{maximumFractionDigits:0}):a>=100?v.toFixed(0):a>=10?(+v.toFixed(1)).toString():(+v.toFixed(2)).toString();};
const barChart=b=>{const vs=b.items.map(i=>+i.v);const mx=Math.max(...vs,0),mn=Math.min(...vs,0);const span=(mx-mn)||1;const z=(-mn)/span*100;
 return `<div class="chart"><h4>${esc(b.title)}</h4><div class="u">단위 ${esc(b.unit)} · 빗금 = 추정</div><div class="bars">${b.items.map(i=>{const v=+i.v;const w=Math.abs(v)/span*100;const left=v>=0?z:z-w;return `<div class="bar"><span class="bl">${esc(i.l)}</span><span class="bt">${mn<0?`<span class="zero" style="left:${z}%"></span>`:''}<span class="bf${v<0?' neg':''}${i.tag==='추정'?' est':''}" style="left:${left}%;width:${Math.max(w,.6)}%"></span></span><span class="bv">${fmt(v)}</span></div>`;}).join('')}</div>${b.note?`<div class="cn">${md(b.note)}</div>`:''}</div>`;};
const dl=fields=>`<dl>${(fields||[]).map(f=>`<dt>${esc(f.k)}</dt><dd>${md(f.v)}</dd>`).join('')}</dl>`;

/* ---------- block renderers ---------- */
const B={
 p:b=>`<p class="note">${md(b.text)}</p>`,
 callout:b=>`<div class="callout ${b.tone==='warn'?'w':b.tone==='alert'?'r':''}">${b.title?`<b>${esc(b.title)}</b><br>`:''}${md(b.text)}</div>`,
 kpis:b=>`<div class="grid kg">${b.items.map(k=>`<div class="kpi"><span class="lab">${esc(k.lab)}</span><span class="val"${k.tag==='추정'?' style="color:var(--warn)"':k.tag==='미확인'?' style="color:var(--alert)"':''}>${esc(k.val)}</span><span class="cap">${md(k.cap)} ${tag(k.tag)}</span></div>`).join('')}</div>`,
 chain:b=>`<div class="flow">${b.items.map((c,i)=>(i?'<div class="farr">→</div>':'')+`<div class="fnode"><div class="n">${esc(c.no||'')}</div><div class="t">${esc(c.name)}</div></div>`).join('')}</div>`,
 cards:b=>`<div class="vc">${b.items.map(c=>`<div class="vcx"><div class="r">${esc(c.r||'')}</div><h4>${esc(c.h)}</h4><p>${md(c.p)}</p>${c.co?`<div class="co">${md(c.co)}</div>`:''}</div>`).join('')}</div>`,
 grid:b=>`<div class="grid ${b.cols===3?'g3':'g2'}">${b.items.map((c,i)=>`<div class="gcard"><h4>${b.numbered?`<span class="num-h">${i+1}</span>`:''}${esc(c.h)} ${c.tag?tag(c.tag):''}</h4>${(Array.isArray(c.p)?c.p:[c.p]).filter(Boolean).map(x=>`<p>${md(x)}</p>`).join('')}${c.list?`<ul>${c.list.map(x=>`<li>${md(x)}</li>`).join('')}</ul>`:''}</div>`).join('')}</div>`,
 table:b=>`${b.title?`<div class="tcap">${esc(b.title)}</div>`:''}${tableH(b.cols,b.rows)}${b.note?`<div class="tnote">${md(b.note)}</div>`:''}`,
 figure:b=>`<figure class="fig">${b.svg}${b.cap?`<figcaption>${md(b.cap)}</figcaption>`:''}</figure>`,
 steps:b=>`<div style="margin-top:6px">${b.items.map((s,i)=>`<div class="stage"><div class="col"><div class="dot">${esc(s.n||i+1)}</div></div><div class="content"><h4>${esc(s.h)}</h4>${s.meta&&s.meta.length?`<div class="meta">${s.meta.map(m=>`<span class="pill">${esc(m)}</span>`).join('')}</div>`:''}<p${s.meta&&s.meta.length?'':' style="margin-top:6px"'}>${md(s.p)}</p>${s.chk?`<div class="chk"><b>체크</b> ${md(s.chk)}</div>`:''}</div></div>`).join('')}</div>`,
 mods:b=>`<div class="mods">${b.items.map((x,i)=>`<details class="mod"${b.open&&i<b.open?' open':''}><summary><span class="mname">${esc(x.name)}</span>${x.en?`<span class="men">${esc(x.en)}</span>`:''}${x.pill?`<span class="pill">${esc(x.pill)}</span>`:''}${x.tag?tag(x.tag):''}</summary><div class="body">${x.lede?`<p class="dplede">${md(x.lede)}</p>`:''}${x.formula?`<div class="formula">${esc(x.formula)}</div>`:''}${(x.paras||[]).length?`<div class="dpn">${x.paras.map(p=>`<p>${md(p)}</p>`).join('')}</div>`:''}${x.fields?dl(x.fields):''}${x.table?`<div style="margin-top:14px">${tableH(x.table.cols,x.table.rows)}</div>`:''}${x.svg?`<figure class="fig">${x.svg}${x.cap?`<figcaption>${md(x.cap)}</figcaption>`:''}</figure>`:''}${(x.bullets||[]).length?`<ul class="dpul">${x.bullets.map(t=>`<li>${md(t)}</li>`).join('')}</ul>`:''}${x.kr?`<div class="dpkr"><span class="l">국내 연결점</span>${md(x.kr)}</div>`:''}</div></details>`).join('')}</div>`,
 bullets:b=>`<ul class="bb">${b.items.map(x=>`<li>${md(x)}</li>`).join('')}</ul>`,
 bars:b=>`<div class="grid g2">${b.charts.map(barChart).join('')}</div>`,
 timeline:b=>`<div class="tl">${b.items.map(t=>`<div class="tli ${t.tone==='긍정'?'pos':t.tone==='부정'?'neg':''}"><div class="d">${esc(t.date)}</div><h4>${esc(t.title)} ${t.tone?tone(t.tone):''}</h4><p>${md(t.body)}</p></div>`).join('')}</div>`,
 proscons:b=>`<div class="grid g2"><div class="card"><h4 style="color:var(--ok)">${esc(b.lt||'상방')}</h4><ul class="bb">${b.bull.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div><div class="card"><h4 style="color:var(--alert)">${esc(b.rt||'하방')}</h4><ul class="bb">${b.bear.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div></div>`,
 checklist:b=>`<div class="grid g2">${b.groups.map(a=>`<div class="card"><h4>${esc(a.area)}</h4><ul class="ck">${a.items.map(t=>{uid++;return `<li><input type="checkbox" id="ck${uid}"><label for="ck${uid}">${md(t)}</label></li>`;}).join('')}</ul></div>`).join('')}</div>`,
 brief:b=>`<div class="brief">${b.items.map(x=>`<div class="bi"><div class="k">${esc(x.k)}</div><p>${md(x.v)}</p></div>`).join('')}</div>`,
 dict:b=>{uid++;const id='dx'+uid;setTimeout(()=>{const L=b.items;let g='',q='';const draw=()=>{const R=L.filter(x=>(!g||x.group===g)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));document.getElementById(id+'c').textContent=R.length+'개';
   document.getElementById(id+'l').innerHTML=R.map(x=>`<details class="mod dcard"><summary><span class="mname">${esc(x.name)}</span>${x.en?`<span class="men">${esc(x.en)}</span>`:''}<span class="pill">${esc(x.group)}</span>${x.tag?tag(x.tag):''}</summary><div class="body">${x.tags&&x.tags.length?`<div class="dfl">${x.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div>`:''}${x.lede?`<p class="dplede">${md(x.lede)}</p>`:''}${dl(x.fields)}${x.table?`<div style="margin-top:14px">${tableH(x.table.cols,x.table.rows)}</div>`:''}${x.note?`<div class="dnote">${md(x.note)}</div>`:''}</div></details>`).join('');};
   chips(document.getElementById(id+'h'),uniq(L.map(x=>x.group)),x=>{g=x;draw();});document.getElementById(id+'q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();draw();});draw();},0);
   return `<div class="tools"><input class="search" id="${id}q" placeholder="${esc(b.placeholder||'검색')}"><span class="count" id="${id}c"></span></div><div class="chips" id="${id}h"></div><div class="mods" id="${id}l"></div>`;}
};
const renderBlocks=bs=>(bs||[]).map(b=>{const f=B[b.t];return f?`<div class="blk">${f(b)}</div>`:`<div class="blk"><div class="callout r">알 수 없는 블록: ${esc(b.t)}</div></div>`;}).join('');
const secH=s=>`<div class="sec"><h3>${esc(s.h)}${s.tag?' '+tag(s.tag):''}</h3>${s.note?`<p class="note">${md(s.note)}</p>`:''}${renderBlocks(s.blocks)}</div>`;

/* ---------- special tabs ---------- */
const SPECIAL={
 universe:(t)=>{const U=D.universe.slice().sort((a,b)=>(b.n||0)-(a.n||0));setTimeout(()=>{let g='',q='',m='';const kr=x=>/KOSPI|KOSDAQ|KONEX/.test(x.mkt);const nl=x=>/비상장|기타/.test(x.mkt);
  const draw=()=>{const L=U.filter(x=>(!g||x.seg===g)&&(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!m||(m==='KR'?kr(x):m==='NL'?nl(x):!kr(x)&&!nl(x))));$('#uni-c').textContent=L.length+'개사';
  $('#uni-t').innerHTML=`<div class="tw"><table><thead><tr><th>기업</th><th>시장</th><th>코드</th><th>하위섹터</th><th>사업</th><th>핵심 포인트</th><th>언급</th></tr></thead><tbody>${L.map(x=>`<tr><td class="nm">${esc(x.name)}</td><td><span class="pill">${esc(x.mkt)}</span></td><td class="tk">${esc(x.code)}</td><td style="font-size:12.5px;color:var(--ink-3);min-width:110px">${esc(x.seg)}</td><td style="min-width:220px">${md(x.biz)}</td><td style="min-width:280px">${md(x.point)}</td><td class="num">${x.n||''}</td></tr>`).join('')}</tbody></table></div>`;};
  chips($('#uni-ch'),uniq(U.map(x=>x.seg)),x=>{g=x;draw();});$('#uni-q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();draw();});$('#uni-m').addEventListener('change',e=>{m=e.target.value;draw();});draw();},0);
  return `<div class="tools"><input class="search" id="uni-q" placeholder="기업·사업 검색"><select class="search" id="uni-m"><option value="">전체 시장</option><option value="KR">국내(KOSPI·KOSDAQ)</option><option value="GL">해외</option><option value="NL">비상장·기타</option></select><span class="count" id="uni-c"></span></div><div class="chips" id="uni-ch"></div><div id="uni-t"></div>`;},
 calendar:(t)=>{const C=D.calendar.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));const cut=M.cut;const up=C.filter(x=>String(x.date)>=cut.slice(0,String(x.date).length)),past=C.filter(x=>!up.includes(x)).reverse();
  const row=(x,p)=>`<div class="evt${p?' past':''}"><div class="d">${esc(x.date)}</div><div><div class="n">${esc(x.event)} <span class="pill">${esc(x.type)}</span></div><div class="m">${md(x.why)}</div></div></div>`;
  return `<div class="grid g2" style="margin-top:20px;align-items:start"><div class="card"><h4>예정 (${up.length})</h4>${up.map(x=>row(x)).join('')}</div><div class="card"><h4>지나간 핵심 이벤트 (${past.length})</h4>${past.map(x=>row(x,1)).join('')}</div></div>`;},
 facts:(t)=>{if(M.public)return `<div class="callout" style="margin-top:18px">공개판에서는 원수치 데이터베이스를 제외했다. 핵심 수치는 각 탭 안에 확인·추정 태그와 함께 들어 있다.</div>`;const F=D.facts;setTimeout(()=>{let g='',q='',lim=200;const draw=()=>{const L=F.filter(x=>(!g||x.tag===g)&&(!q||(x.k+' '+x.v+' '+x.unit+' '+x.src+' '+x.asof).toLowerCase().includes(q)));$('#f-c').textContent=L.length.toLocaleString()+'개';
  $('#f-t').innerHTML=`<div class="tw"><table><thead><tr><th>항목</th><th>값</th><th>단위</th><th>시점</th><th>원출처</th><th>태그</th><th>발행</th></tr></thead><tbody>${L.slice(0,lim).map(x=>`<tr><td style="min-width:240px">${esc(x.k)}</td><td class="num"><b>${esc(x.v)}</b></td><td class="tk">${esc(x.unit)}</td><td class="tk">${esc(x.asof)}</td><td style="font-size:12.5px;color:var(--ink-3)">${esc(x.src)}</td><td>${tag(x.tag)}</td><td class="tk">${esc(x.date)}</td></tr>`).join('')}</tbody></table></div>`;$('#f-m').hidden=L.length<=lim;};
  chips($('#f-ch'),['확인','추정','미확인'],x=>{g=x;lim=200;draw();});$('#f-q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();lim=200;draw();});$('#f-m').addEventListener('click',()=>{lim+=300;draw();});draw();},0);
  return `<div class="tools"><input class="search" id="f-q" placeholder="키워드 (예: 마진, 캐파, 2027)"><span class="count" id="f-c"></span></div><div class="chips" id="f-ch"></div><div id="f-t"></div><button class="more" id="f-m" hidden>더 보기</button>`;},
 glossary:(t)=>{const G=D.glossary.slice().sort((a,b)=>a.term.localeCompare(b.term,'ko'));setTimeout(()=>{let g='',q='';const draw=()=>{const L=G.filter(x=>(!g||x.group===g)&&(!q||(x.term+x.en+x.def).toLowerCase().includes(q)));$('#g-c').textContent=L.length+'개';
  $('#g-t').innerHTML=`<div class="tw"><table><thead><tr><th>용어</th><th>영문·약어</th><th>정의</th><th>분류</th></tr></thead><tbody>${L.map(x=>`<tr><td class="nm">${esc(x.term)}</td><td class="tk">${esc(x.en)}</td><td style="min-width:320px">${md(x.def)}</td><td style="font-size:12px;color:var(--ink-3);white-space:nowrap">${esc(x.group)}</td></tr>`).join('')}</tbody></table></div>`;};
  chips($('#g-ch'),uniq(G.map(x=>x.group)),x=>{g=x;draw();});$('#g-q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();draw();});draw();},0);
  return `<div class="tools"><input class="search" id="g-q" placeholder="용어 검색"><span class="count" id="g-c"></span></div><div class="chips" id="g-ch"></div><div id="g-t"></div>`;}
};

/* ---------- build nav + panes ---------- */
let nav='',panes='',n=0;const NUM={};
D.nav.forEach(gr=>{nav+=`<div class="nav-group">${esc(gr.group)}</div>`;gr.tabs.forEach(id=>{const t=D.tabs[id];if(!t)return;n++;const k=String(n).padStart(2,'0');NUM[id]=k;nav+=`<button data-p="${id}"><span class="k">${k}</span>${esc(t.title)}</button>`;panes+=`<section class="pane" id="p-${id}"></section>`;});});
$('#nav').innerHTML=nav;$('#panes').innerHTML=panes;
Object.keys(NUM).forEach(id=>{const t=D.tabs[id];let h=`<div class="eyebrow">${NUM[id]} — ${esc(t.en||'')}</div><h2>${esc(t.h2||t.title)}</h2>${t.lede?`<p class="lede">${md(t.lede)}</p>`:''}`;
 if(t.special&&SPECIAL[t.special]){h+=`${(t.sections||[]).filter(s=>s.before).map(secH).join('')}`+SPECIAL[t.special](t)+(t.sections||[]).filter(s=>!s.before).map(secH).join('');}
 else h+=(t.sections||[]).map(secH).join('');
 document.getElementById('p-'+id).innerHTML=h;});

const show=id=>{if(!document.getElementById('p-'+id))id=Object.keys(NUM)[0];document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+id));document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.p===id));};
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;show(b.dataset.p);try{history.replaceState(null,'','#'+b.dataset.p)}catch(_){}window.scrollTo(0,0);});
show((location.hash||'#').slice(1));
const root=document.documentElement;const setT=t=>{root.setAttribute('data-theme',t);document.querySelectorAll('.tsb').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));try{localStorage.setItem('desk-theme',t)}catch(_){}};
document.querySelectorAll('.tsb').forEach(b=>b.addEventListener('click',()=>setT(b.dataset.t)));
try{const t=localStorage.getItem('desk-theme');if(t)setT(t);}catch(_){}
})();
</script>

</html>
