<title>전력인프라·유틸리티 리서치 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --ground:#FBFAF7; --surface:#FFFFFF; --raised:#F3F4F0; --sunken:#EFF1EC;
  --line:#E0E4DC; --line-strong:#C9D0C6;
  --ink:#17211F; --ink-2:#3A4744; --ink-3:#55625D; --ink-4:#626F6A;
  --accent:#3B4DB0; --accent-soft:color-mix(in srgb,var(--accent) 10%,transparent); --accent-line:color-mix(in srgb,var(--accent) 34%,transparent);
  --ok:#1D7A5C; --warn:#8A6300; --alert:#A2304A; --dim:#55625D;
  --shadow:0 1px 2px rgba(23,33,31,.06),0 8px 24px -12px rgba(23,33,31,.18);
  --rail:252px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0C1116; --surface:#131A21; --raised:#1A232B; --sunken:#0F161C;
    --line:#253039; --line-strong:#33424E;
    --ink:#DCE5EA; --ink-2:#BCCAD2; --ink-3:#9DAEB9; --ink-4:#8DA0AB;
    --accent:#8D9CEB; --ok:#3DB08E; --warn:#D2A63A; --alert:#D9738A; --dim:#9DAEB9;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0C1116; --surface:#131A21; --raised:#1A232B; --sunken:#0F161C;
  --line:#253039; --line-strong:#33424E;
  --ink:#DCE5EA; --ink-2:#BCCAD2; --ink-3:#9DAEB9; --ink-4:#8DA0AB;
  --accent:#8D9CEB; --ok:#3DB08E; --warn:#D2A63A; --alert:#D9738A; --dim:#9DAEB9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;line-height:1.3;letter-spacing:-.011em}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
b{font-weight:600;color:var(--ink)}

.shell{display:flex;min-height:100vh;align-items:flex-start}
.rail{width:var(--rail);flex:0 0 var(--rail);position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brand .mark{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--accent);font-weight:500;display:flex;align-items:center;gap:7px;line-height:1.4}
.brand .mark::before{content:"";width:7px;height:7px;background:var(--accent);border-radius:50%;flex:none}
.brand h1{font-size:18px;margin-top:9px;letter-spacing:-.02em;font-weight:700}
.brand .sub{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.5}
.nav{flex:1;overflow-y:auto;padding:10px 10px 20px}
.nav-group{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.15em;color:var(--ink-4);padding:14px 10px 6px;text-transform:uppercase}
.nav button{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-family:inherit;font-size:13.5px;line-height:1.4}
.nav button:hover{background:var(--raised);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button .k{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);flex:none;width:16px}
.nav button[aria-current="true"] .k{color:var(--accent)}
.desks{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px}
.desks .dl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-4);width:100%;padding:2px 4px 4px}
.desks a{font-size:12px;text-decoration:none;color:var(--ink-3);border:1px solid var(--line);border-radius:14px;padding:3px 9px;white-space:nowrap}
.desks a:hover{color:var(--accent);border-color:var(--accent-line)}
.desks a.cur{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);pointer-events:none}
.railfoot{padding:12px 16px;border-top:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}

.main{flex:1;min-width:0;padding:0 0 96px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:11px 40px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.legend .li{display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.legend .sw{width:9px;height:9px;border-radius:2px;flex:none}
.stamps{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.stamp{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);white-space:nowrap}
.tsw{display:inline-flex;gap:2px;padding:2px;background:var(--sunken);border:1px solid var(--line);border-radius:7px}
.tsb{padding:4px 9px;border:0;border-radius:5px;background:transparent;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:11px;cursor:pointer}
.tsb[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.pane{display:none;padding:34px 40px 0;max-width:1220px}
.pane.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pane.on{animation:none}}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;font-weight:500}
.pane > h2{font-size:29px;margin-top:8px;letter-spacing:-.025em;font-weight:700}
.lede{color:var(--ink-2);font-size:15.5px;max-width:74ch;margin-top:11px;line-height:1.72}
.sec{margin-top:44px}
.sec > h3{font-size:17.5px;display:flex;align-items:center;gap:11px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.sec > h3::before{content:"";width:3px;height:15px;background:var(--accent);border-radius:2px;flex:none}
.note{color:var(--ink-2);font-size:14px;line-height:1.72;margin-top:12px;max-width:78ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.card h4{font-size:14.5px;margin-bottom:8px}
.card p{font-size:13.5px;color:var(--ink-2);line-height:1.68}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kg{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.kg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kg{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px;display:flex;flex-direction:column;gap:5px}
.kpi .lab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.kpi .val{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;color:var(--accent)}
.kpi .cap{font-size:11.5px;color:var(--ink-3);line-height:1.5}

.tag{display:inline-flex;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 7px;border-radius:4px;border:1px solid;white-space:nowrap;vertical-align:middle}
.t-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 34%,transparent);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.t-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 34%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.t-alert{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 34%,transparent);background:color-mix(in srgb,var(--alert) 10%,transparent)}
.t-dim{color:var(--ink-3);border-color:var(--line-strong);background:var(--raised)}
.t-acc{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-2);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--raised);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.62}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--raised)}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
td.tk{font-family:"IBM Plex Mono",monospace;color:var(--ink-3);font-size:12.5px;white-space:nowrap}
td.nm{font-weight:600;white-space:nowrap}
.tcap{font-size:13.5px;font-weight:600;margin:22px 0 8px}
.tnote{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);margin-top:8px;line-height:1.6}

.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:14px 17px;border-radius:0 8px 8px 0;font-size:14.5px;color:var(--ink-2);line-height:1.76;max-width:88ch}

.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 6px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink-3);border-radius:20px;padding:5px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ground);font-weight:500}
.search{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 13px;font-family:inherit;font-size:14px}
.search:focus{border-color:var(--accent);outline:none}
select.search{max-width:200px}
.count{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}

/* chain */
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 2px 10px;margin-top:16px}
.fnode{flex:0 0 150px;background:var(--sunken);border:1px solid var(--line-strong);border-radius:9px;padding:10px 12px;font-size:13px}
.fnode .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--accent)}
.fnode .t{font-weight:600;line-height:1.35;margin-top:2px}
.farr{flex:0 0 22px;display:grid;place-items:center;color:var(--ink-4);font-size:14px}
.vc{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:14px}
.vcx{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px;border-top:2px solid var(--accent)}
.vcx .r{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--accent);margin-bottom:5px}
.vcx h4{font-size:14px;margin-bottom:5px}
.vcx p{font-size:13.2px;color:var(--ink-2);line-height:1.66}
.vcx .co{font-size:12px;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.6}

/* modules */
.mods{display:grid;gap:10px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mod > summary{padding:14px 18px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mod > summary::-webkit-details-marker{display:none}
.mod > summary::after{content:"+";margin-left:auto;font-family:"IBM Plex Mono",monospace;color:var(--ink-4);font-size:16px}
.mod[open] > summary::after{content:"−"}
.mod > summary:hover{background:var(--raised)}
.mname{font-size:15px;font-weight:600}
.men{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-4)}
.mod .body{padding:4px 18px 18px;border-top:1px solid var(--line)}
.mod dl{margin:0}
.mod dt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4);margin:14px 0 4px}
.mod dd{margin:0;font-size:14.3px;color:var(--ink-2);line-height:1.74;max-width:86ch}
.pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 7px;border-radius:3px;background:var(--raised);border:1px solid var(--line);color:var(--ink-3)}
.dplede{font-size:15.5px;color:var(--ink);line-height:1.78;margin:16px 0 4px;padding:2px 0 2px 14px;border-left:3px solid var(--accent);max-width:84ch;font-weight:450}
.dpn p{margin-top:12px;font-size:14.5px;color:var(--ink-2);line-height:1.84;max-width:82ch}
.dpul{margin:10px 0 0;padding-left:18px}
.dpul li{font-size:14px;color:var(--ink-2);line-height:1.74;margin-bottom:8px;max-width:84ch}
.dpkr{margin-top:18px;padding:13px 16px;background:var(--sunken);border:1px solid var(--line);border-radius:9px;font-size:14px;color:var(--ink-2);line-height:1.72}
.dpkr .l{color:var(--accent);font-weight:600;margin-right:6px}
.formula{font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;padding:10px 13px;margin-top:10px;color:var(--ink);line-height:1.6;white-space:pre-wrap}

/* bars */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.chart h4{font-size:14.5px}
.chart .u{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.bar{display:grid;grid-template-columns:minmax(90px,34%) 1fr 72px;gap:10px;align-items:center}
.bar .bl{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.bar .bt{position:relative;height:12px;background:var(--sunken);border-radius:3px;border:1px solid var(--line)}
.bar .bf{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:2px}
.bar .bf.neg{background:var(--alert)}
.bar .bf.est{background:repeating-linear-gradient(135deg,var(--accent) 0 4px,color-mix(in srgb,var(--accent) 55%,transparent) 4px 7px)}
.bar .bf.neg.est{background:repeating-linear-gradient(135deg,var(--alert) 0 4px,color-mix(in srgb,var(--alert) 55%,transparent) 4px 7px)}
.bar .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink-4)}
.bar .bv{font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.chart .cn{font-size:12px;color:var(--ink-3);margin-top:12px;line-height:1.6;padding-top:10px;border-top:1px solid var(--line)}

/* timeline */
.tl{margin-top:18px;border-left:1px solid var(--line-strong);margin-left:6px}
.tli{position:relative;padding:0 0 20px 22px}
.tli::before{content:"";position:absolute;left:-5px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--dim)}
.tli.pos::before{border-color:var(--ok)} .tli.neg::before{border-color:var(--alert)}
.tli .d{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.tli h4{font-size:14.5px;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tli p{font-size:13.8px;color:var(--ink-2);margin-top:4px;line-height:1.7;max-width:84ch}
.bb{list-style:none;margin:10px 0 0;padding:0}
.bb li{font-size:13.8px;color:var(--ink-2);line-height:1.66;padding:8px 0;border-bottom:1px dashed var(--line)}
.bb li:last-child{border-bottom:0}

.ck li{list-style:none;display:flex;gap:9px;align-items:flex-start;font-size:13.8px;color:var(--ink-2);line-height:1.62;padding:6px 0}
.ck{margin:6px 0 0;padding:0}
.ck input{margin-top:4px;accent-color:var(--accent);flex:none}
.more{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-family:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
.more:hover{border-color:var(--accent);color:var(--accent)}
.evt{display:grid;grid-template-columns:104px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.evt .d{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.evt .n{font-size:14px;font-weight:600}
.evt .m{font-size:13px;color:var(--ink-3);margin-top:2px;line-height:1.55}
.evt.past .d{color:var(--ink-4)}
.cloud{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

@media (max-width:900px){
  .desks{display:none}
  .shell{flex-direction:column}
  .rail{position:static;width:100%;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{display:flex;overflow-x:auto;padding:8px;gap:4px}
  .nav-group{display:none}
  .nav button{width:auto;white-space:nowrap}
  .nav button .k{display:none}
  .desks{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px}
.desks .dl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-4);width:100%;padding:2px 4px 4px}
.desks a{font-size:12px;text-decoration:none;color:var(--ink-3);border:1px solid var(--line);border-radius:14px;padding:3px 9px;white-space:nowrap}
.desks a:hover{color:var(--accent);border-color:var(--accent-line)}
.desks a.cur{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);pointer-events:none}
.railfoot{display:none}
  .topbar{padding:10px 16px}
  .pane{padding:24px 16px 0}
  .pane > h2{font-size:24px}
  .bar{grid-template-columns:1fr 60px}
  .bar .bl{grid-column:1/-1}
  .evt{grid-template-columns:1fr;gap:2px}
}
</style>

<div class="shell">
<aside class="rail">
  <div class="brand">
    <div class="mark" id="b-eng"></div>
    <h1 id="b-title"></h1>
    <div class="sub" id="b-sub"></div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="desks" id="desks"></div>
  <div class="railfoot" id="foot"></div>
</aside>
<main class="main">
  <div class="topbar">
    <div class="legend">
      <span class="li"><span class="sw" style="background:var(--ok)"></span>확인 (실적·실측)</span>
      <span class="li"><span class="sw" style="background:var(--warn)"></span>추정 (전망)</span>
      <span class="li"><span class="sw" style="background:var(--alert)"></span>미확인 (원문 불일치)</span>
    </div>
    <div class="stamps">
      <span class="stamp" id="cut"></span>
      <div class="tsw" role="group" aria-label="화면 테마">
        <button class="tsb" data-t="dark" aria-pressed="false">다크</button>
        <button class="tsb" data-t="light" aria-pressed="false">라이트</button>
      </div>
    </div>
  </div>
  <div id="panes"></div>

role": "UPS·BBU·BESS·PCS, 800VDC 정류기·SST·SSCB, 온사이트 발전 연계", "margin": "전력밀도 상승에 따른 MW당 콘텐츠 증가(Eaton MW당 약 290만→340만달러), 표준 선점 업체가 가격 결정", "kr": "삼성SDI, LG에너지솔루션, LS ELECTRIC, 서진시스템, 비나텍, 한중엔시에스"}, {"no": "10", "name": "정비·수명연장(O&M)", "role": "원전·화력 계획예방정비, 원전 계속운전(LTO) 개보수, 해외 원전 정비", "margin": "반복 계약 기반 안정 이익, 고배당(한전KPS 평균 배당성향 약 53~65%)", "kr": "한전KPS, 일진파워"}], "segments": [{"name": "변압기·차단기(초고압·배전)", "desc": "송전망의 전압을 올리고 내리는 초고압 변압기(154~765kV)와 GIS·차단기·리액터, 그리고 수요지 인근의 배전변압기·배전반을 만든다. 2022년 초고압 송전이 먼저 호황에 들어갔고 2025년부터 AI 데이터센터 배전이 두 번째 사이클로 겹쳤다. 한국 업체는 빠른 납기와 선제 증설로 미국 수입시장 점유율을 끌어올렸다.", "driver": "미국 유틸리티 CAPEX·765kV 송전망, 데이터센터 블록 증설, 리드타임과 판가(PPI), 증설 완공 시점(Q)", "cycle": "수주는 1~5년 뒤 매출로 전환되는 장기 사이클. 과거 2000년대 슈퍼사이클 후 2008년 과잉 CAPA로 붕괴한 경험 때문에 업체들이 보수적으로 증설 중", "kr": "HD현대일렉트릭, 효성중공업, LS ELECTRIC, 일진전기, 산일전기, 제룡전기"}, {"name": "전선·해저케이블·HVDC", "desc": "초고압 지중·해저 케이블과 HVDC 케이블, 이를 바다에 까는 포설선과 시공까지 묶은 턴키 사업이다. 상위 4개사가 해저케이블의 약 85%를 차지하는 과점이며, 해상풍력·국가 간 연계선·서해안 HVDC 에너지고속도로가 수요를 만든다. 매출은 구리값에 출렁이므로 수주잔고와 마진으로 봐야 한다.", "driver": "해상풍력 설치량·입찰, HVDC 프로젝트 발주(서해안 8GW, 유럽 TSO 프레임워크), 포설선 확보, 구리 가격", "cycle": "프로젝트형이라 연도별 변동이 크고 공장·포설선 증설에 3~4년이 걸린다. 잔고/매출 5년 이상(유럽 3사 5.4년)이면 공급 과잉 우려가 낮다", "kr": "대한전선, LS전선(비상장), LS에코에너지, LS마린솔루션, 가온전선, 일진전기"}, {"name": "AIDC 전력(800VDC·UPS·ESS)", "desc": "AI 랙 전력밀도가 10kW에서 1MW로 커지면서 데이터센터 내부 전력 구조(415V AC→800V DC), 무정전·저장(BBU·UPS·BESS), 온사이트 연계 설비가 새 시장이 됐다. 1GW 캠퍼스는 50MW 블록 20개가 반복 발주되는 구조라 중압 변압기·배전반·정류 모듈 수요가 누적된다.", "driver": "빅테크 CAPEX, 랙당 kW(Rubin/Rubin Ultra), 800VDC 표준화 일정(2027년 상용화), 온사이트 발전 비중, NERC 신뢰도 표준", "cycle": "데이터센터 착공 전환율에 연동된 단주기. 2026년은 착공 지연 우려가 컸고 2H26~2027이 800VDC 공급망 발주·초기 상용화 구간", "kr": "LS ELECTRIC, 산일전기, 가온전선, 삼성SDI, LG에너지솔루션, 서진시스템, 비나텍, 한중엔시에스"}, {"name": "발전설비(가스터빈·엔진·연료전지)", "desc": "데이터센터의 24시간 부하를 받쳐줄 수 있는 디스패처블 전원(가스터빈·원전·연료전지·엔진)을 만드는 산업이다. 가스터빈 3사의 2030년까지 잔여 슬롯이 거의 소진돼 중속엔진·연료전지 같은 온사이트 대체 전원이 부상했다. 원전은 이 데스크에서는 전원 믹스와 기자재 수요 관점으로만 다룬다(노형·연료는 원전 데스크).", "driver": "가스터빈 슬롯·리드타임(4~6년)·가격(2027년 약 600달러/kW 전망), 데이터센터 온사이트 비중, 대미 원전 투자, SMR 인허가", "cycle": "발전소 건설계획 증가가 2~3년 뒤 변압기·차단기 발주로 이어지는 선행 사이클. 가스터빈 증설분은 2028년 이후 출하", "kr": "두산에너빌리티, HD현대중공업, 두산퓨얼셀, 비에이치아이, 한전기술, 한전KPS, 씨에스윈드"}, {"name": "국내 유틸리티(한전·가스공사·지역난방·발전)", "desc": "한전(송배전·판매 독점), 한국가스공사(LNG 도입·도매), 지역난방공사(열·전기), 발전 자회사와 민간 발전사로 구성된다. 요금이 정부 규제를 받아 원가 변동과 요금 조정 사이의 시차가 이익을 좌우하고, 밸류에이션은 PBR-ROE와 배당으로 본다. 2026년에는 호르무즈 쇼크 원가 충격과 12차 전기본 송변전 투자 부담이 동시에 걸려 있다.", "driver": "유가·JKM·환율→SMP(3~6개월 시차), 원전 이용률, 전기·가스 요금 조정, 사채한도, 미수금", "cycle": "원가 하락기에는 한전 증익·민간 발전사 감익, 원가 급등기에는 반대인 제로섬 구조. 요금 인상은 선거 일정에 좌우", "kr": "한국전력, 한국가스공사, 지역난방공사, SK가스, E1, SGC에너지, SK이터닉스"}, {"name": "미국 유틸리티·전력시장", "desc": "미국은 7개 ISO/RTO가 분절 운영하고 주 규제기관이 요금을 승인하는 투자자소유 유틸리티(IOU)가 망을 소유한다. 데이터센터 부하 계약이 유틸리티 CAPEX를 매 분기 끌어올리고, FERC·NERC·주 정부 규칙이 ‘누가 망 비용을 내는가’를 바꾸며 BTM(온사이트)과 FTM(계통) 수요의 순서를 결정한다.", "driver": "유틸리티 계약부하(AEP·Dominion·Duke), 5개년 CAPEX, PJM 용량가격, FERC Order 2023·Co-location·Large Load 규칙, 765kV 승인", "cycle": "규제위원회 승인을 거친 5년 계획이라 관성이 크고 빅테크 분기 가이던스보다 긴 주기로 움직인다", "kr": "직접 상장사는 없음 — 국내 초고압 변압기·배전·전선 업체의 최대 고객(효성중공업 HICO, HD현대일렉트릭 앨라배마, LS ELECTRIC MCM 등)"}], "howto": [{"title": "처음 배울 때 순서", "body": "01 산업 지도로 네 층(발전·송변전·배전·유틸리티)을 먼저 잡고, 02 제품 백과에서 초고압 변압기·GIS·HVDC·800VDC·가스터빈을 읽는다. 이어 03 수익 구조의 ‘전력기기 P×Q’와 ‘한전 SMP 구조’ 두 모델을 이해하면 05 딥다이브(765kV, 800VDC, 한전 원가 구조)가 쉽게 읽힌다. 마지막으로 07 사이클 타임라인으로 2025.10~2026.09 동안 시장 인식이 어떻게 바뀌었는지 확인한다."}, {"title": "딜 검토할 때", "body": "전력기기·전선 IPO라면 10 체크포인트의 ‘수주잔고의 지역·ASP·인도시점 구성’과 ‘증설의 병목 공정(건조·시험)’부터 확인하고, 09 밸류에이션의 PER-EPS 성장률·SOTP 관행으로 피어를 고른다. 특수변압기처럼 1년 계약 제품은 잔고가 작아도 가격 재협상이 빠르니 대형 변압기와 같은 잣대로 비교하지 않는다. 유틸리티·에너지 딜은 03의 총괄원가·미수금 구조와 08 정책 워치(사채한도, 12차 전기본)를 먼저 본다."}, {"title": "숫자를 인용하기 전에", "body": "모든 수치에 시점과 원출처가 붙어 있다. ‘미국 DC 계통연계 부하’는 유틸리티 16사/18사 집계 기준과 분기가 섞여 있으니 같은 기준끼리만 비교하고, ‘원전 이용률 1%p당 한전 이익’ 같은 민감도는 리포트마다 1,840억~4,600억원으로 달라 범위로 인용한다. 태그가 ‘추정’이면 리포트 전망치, ‘미확인’이면 원문 간 불일치가 있는 숫자다."}, {"title": "이 자료의 한계", "body": "근거는 2025-10-14부터 2026-09-21까지 발간된 국내 산업 리포트 37건이다. 리포트 톤은 대부분 업황 PAFC)", "en": "Solid Oxide / Phosphoric Acid Fuel Cell", "what": "천연가스·수소를 전기화학 반응으로 직접 DC 전력으로 바꾸는 발전 장치다. SOFC는 효율 50~60%로 높고 주문 후 50~90일 내 설치가 가능하나 고온·희토류(스칸듐) 소재가 필요하고, PAFC는 효율 40~43%지만 저렴하고 스택 수명이 길다. DC를 직접 만들어 800VDC와 궁합이 좋고 ITC 30%(2032년까지)가 적용된다.", "chain": "연료 → 개질 → 스택 → DC 출력 → 특수변압기·배전반 → 데이터센터", "driver": "온사이트 발전 수요, Bloom Energy CAPA(1GW→2GW, 2026말), ITC", "check": "실제 생산량 vs CAPA, 벤더 고객 집중(Bloom 의존도), LTSA 직접 수행 여부", "kr": "두산퓨얼셀(PAFC 232MW / SOFC 50MW), Bloom 공급망: LS ELECTRIC·산일전기·비나텍·코세스·서진시스템·한선엔지니어링"}, {"group": "발전설비", "name": "원전 주기기·BOP(전원 믹스 관점)", "en": "Nuclear Main Components / Balance of Plant", "what": "원자로압력용기·증기발생기·터빈발전기(주기기)와 복수기·급수가열기·주변압기·계측제어(BOP)다. 이 데스크에서는 원전을 ‘24시간 무탄소 기저전원’과 ‘변압기·BOP 전기설비 수요원’으로만 본다. 대형 RPV에는 1.4만톤 이상 프레스·500톤 이상 잉곳이 필요해 미국은 한국·일본·이탈리아에 의존한다.", "chain": "주단조 → 주기기 → EPC → 운영·정비·LTO(원자로·연료 상세는 원전 데스크)", "driver": "미국 400GW 목표·대형원전 10기 착공, 대미투자 3,500억달러, 국내 신규 대형 2기·SMR", "check": "팀코리아향인지 Westinghouse향인지, 원전용 변압기(Q-Class) 인증, BOP 기당 수주 규모(1~1.5천억원)", "kr": "두산에너빌리티, 한전기술, 한전KPS, 비에이치아이, HD현대일렉트릭(원전용 Q-Class), 효성중공업(원전용 345kV 변압기)"}, {"group": "발전설비", "name": "풍력 타워·베어링·하부구조물", "en": "Wind Tower / Bearing / Foundation", "what": "나셀과 블레이드를 받치는 타워, 블레이드 각도·나셀 방향을 돌리는 피치·요 베어링, 해상 터빈을 고정하는 모노파일·자켓이다. 디벨로퍼→터빈 OEM→기자재 순으로 발주가 이어져 터빈사 수주가 6개월~1년 선행한다.", "chain": "후판·단조링 → 타워·베어링·하부구조물 → 터빈 OEM → 디벨로퍼", "driver": "터빈 판가 30~50% 회복, 영국 AR7·대만 LCR 폐지, 미국 세액공제 기한 전 설치 러시", "check": "고객 집중도(GEV·Vestas), 미국 법인 마진, 지배구조 변수", "kr": "씨에스윈드, 씨에스베어링, SK오션플랜트"}, {"group": "연료·원자재", "name": "발전용 LNG", "en": "Liquefied Natural Gas for Power", "what": "영하 162도로 액화해 선박으로 들여오는 천연가스로, 국내 SMP를 결정하는 한계발전기 연료다(결정 비중 83~90%). 가스공사 도입분은 대부분 유가(JCC) 연동 장기계약이라 유가가 5~6개월 뒤 SMP에 반영되고, 현물은 JKM으로 거래된다.", "chain": "가스전 → 액화 → LNG선 → 재기화 터미널 → 가스공사 평균/개별요금제 → LNG 복합발전 → SMP", "driver": "브렌트·JCC(시차), JKM, 환율, 장기계약 포트폴리오(카타르 19.5%), 호르무즈 통항", "check": "유가 연동 비중·시차, 중동 경유 물량, 직도입 여부", "kr": "한국가스공사, SK가스(울산GPS·KET), SK이노베이션 E&S, GS EPS(비상장)"}, {"group": "연료·원자재", "name": "LPG(프로판·부탄)", "en": "Liquefied Petroleum Gas", "what": "수송·산업·석유화학(PDH)·발전 연료로 쓰이는 액화석유가스다. LNG보다 단기 대체 조달이 쉬워 LNG 급등기에는 두 연료 가격 괴리가 벌어지고, 겸용 발전소가 차익을 얻는다(울산GPS가 2021~2023년 가동됐다면 약 1.2조원 추정).", "chain": "산유국 수출(CP)·미국 프로판 → 수입·저장 → 유통·산업·발전", "driver": "사우디 CP·미국 프로판 가격, LNG 대비 상대가격, 국내 판가 동결 여부", "check": "중동 조달 비중(SK가스 30% 미만), 실물·파생 손익 인식 시차", "kr": "SK가스, E1"}, {"group": "연료·원자재", "name": "방향성 전기강판(GOES)", "en": "Grain-Oriented Electrical Steel", "what": "규소를 넣고 결정 방향을 정렬해 철손을 줄인 강판으로 변압기 철심의 핵심 소재다. EV 모터용 무방향성(NOES)과 열간압연을 공유하고 배치식 고온 소둔이 필요해 철강사의 증산 유인이 낮다. 비중국 공급처는 Cleveland-Cliffs·POSCO·Nippon Steel·JFE 등 약 6곳이다.", "chain": "열연 → 냉연 → 탈탄·고온 소둔 → 절연코팅 → 변압기 철심", "driver": "변압기 증설, EV 모터 NOES 수요와의 라인 경합", "check": "변압기 업체의 GOES 조달 계약·재고, 관세 영향", "kr": "POSCO홀딩스(전기강판 연산 약 83만톤, 최근 증설분은 NOES)"}, {"group": "연료·원자재", "name": "구리(전기동)", "en": "Refined Copper (LME)", "what": "전선 원가의 약 50~60%, 변압기 권선의 주재료다. 전선 판가는 구리 가격 연동(에스컬레이션) 조항으로 조정돼 매출은 구리값에 부풀지만 이익은 믹스가 결정한다. 미국은 구리 순수 품목 50%, 함량 15% 초과 파생상품 25% 관세를 부과한다.", "chain": "정광 → 제련 → 전기동 → Cu-Rod·CTC → 전선·변압기 권선", "driver": "광산 공급 차질, 데이터센터·전력망 수요, 미국 232조 관세", "check": "고정가 계약 비중, 매출 증가 중 구리 효과와 물량 효과 분리", "kr": "LS(LS MnM), 대한전선·LS전선(수요처)"}], "economics": {"lede": "같은 전력 인프라 사이클이라도 돈이 들어오는 방식은 업종마다 정반대다. 전력기기·전선·발전설비는 고객 CAPEX가 ‘수주→잔고→매출’로 먼저 내려오고 공급자 우위에서 가격(P)과 물량(Q)이 함께 오르는 구조인 반면, 한전·가스공사 같은 규제 유틸리티는 투자·차입이 먼저 나가고 요금으로 나중에 회수한다. 아래 모델은 각 업종의 이익 공식과 민감도를 리포트 수치로 정리한 것이다.", "models": [{"name": "전력기기 이익 = P × Q × 믹스 (수주-매출 시차 모델)", "formula": "매출(t) ≈ Σ 과거 수주(t−리드타임) × 인도 시점 단가 / 영업이익률 = f(북미·초고압 비중, 판가 인상, 가동률, 증설 고정비)", "explain": "전력기기는 수주 후 제작·인도까지 초고압 3~5년, 데이터센터 배전 6개월~2년이 걸린다. 따라서 오늘의 매출과 마진은 2~3년 전 수주 단가를 반영하고, 오늘의 수주는 2028~2030년 실적을 결정한다. 공급자 우위 국면에서는 판가(P)가 먼저 오르고(이미 주가에 반영), 이후에는 증설 완공 시점에 따른 물량(Q) 성장이 기업 간 실적 기울기를 가른다. 가동률이 이미 95~108%라 CAPA가 성장 상단을 정한다.", "sensitivity": "공장 가동률 100% 전후 구간에서는 신규 수주가 늘어도 매출은 CAPA만큼만 증가하고, 초과 수요는 판가·납기 연장으로 흡수된다. 증설 효과는 유형자산 증가 후 약 2년 뒤(업계 전체 2027년 하반기) 반영된다는 추정이 있다.", "example": "국내 전력기기 3사 평균 OPM 2022년 5.3% → 2025년 15.2%(각사 공시). HD현대일렉트릭 4Q25 OPM 27.6%, 산일전기 4Q25 38.7%. 1Q26 변압기 5사 신규수주 8.5조원(YoY +54%), 잔고 34.5조원(+37%)."}, {"name": "관세·원자재 비용 전가 구조", "formula": "실질 관세부담 = 상호관세율 × 매출가 + Section 232 세율 × 금속 성분가치 − 고객 전가분(CO·PO 환입, 에스컬레이션)", "explain": "2025년 미국 상호관세 15%는 제품 전체에, Section 232 철강·알루미늄 50%는 금속 성분가치(8~12%)에만 붙어 초고압 변압기의 매출가 대비 실질 부담은 15~21%로 추정됐다. 그러나 공급자 우위라 초고압은 대부분, 배전반은 신규수주 100%가 고객에게 전가됐고 기존 계약은 변경계약(CO)으로 시차를 두고 환입됐다. 2026년 4월 IEEPA 관세 위헌 판결로 환급 절차가 시작됐고, 232조는 금속함량 기준에서 전체 통관가액 기준으로 바뀌며 대형변압기 실효세율이 28.7%→15.0%로 낮아졌다.", "sensitivity": "중저압 전력기기는 원가 중 원재료 약 10%, 부품 약 25%라 구리·은 급등의 직접 영향이 작다. 원자재 급등 시 국내 3월·해외 4월처럼 판가 인상으로 1~2분기 시차를 두고 상쇄된다.", "example": "효성중공업 1Q26 관세 비용 인식 170억원, 운송 중 재고로 영업이익 약 400억원 이연. 배전변압기 232 실효세율 34.9%→25.0%(2026-04, EIA)."}, {"name": "한전 영업이익 = 판매수입 − (연료비 + 구입전력비) − 고정비", "formula": "판매수입 = 판매량 × 규제 요금(기본+전력량+기후환경+연료비조정 ±5원/kWh) / 구입전력비 ≈ 구입량 × SMP(+용량요금·정산비용)", "explain": "한전은 발전사로부터 SMP로 전력을 사서 정부가 정한 요금으로 판다. 영업비용의 40% 이상이 구입전력비이고 SMP는 대부분 LNG 발전기가 결정하므로, 유가가 LNG 도입가를 거쳐 3~6개월 뒤 한전 비용을 흔든다. 요금은 정부가 물가·선거를 고려해 결정하고 연료비 연동제는 분기 ±5원/kWh로 폭이 좁아, 원가 급등기에 적자가 쌓인다(2Q21~2Q23 누적 47.5조원 적자). 원전 이용률이 오르면 가장 싼 전원(정산단가 약 79원/kWh)이 LNG(약 385원)를 밀어내 비용이 준다.", "sensitivity": "리포트별 민감도: SMP 1원/kWh↑ → 연 영업이익 약 −3,210억원, 유가 1달러↑ → 약 −1,310억원, 환율 10원↑ → 약 −1,750억원, 원전 이용률 1%p↑ → +1,840억원 / +2,900억원 / 약 +4,600억원으로 리포트마다 추정치 편차가 크다(미확인). 요금 1% 인상 시 약 +9,250억원.", "example": "평균 판매단가 108원(2021) → 170원/kWh(2025), 매출 60.7조원 → 97.4조원. 2025년 연결 영업이익 13.5조원. 호르무즈 쇼크로 2H26 영업이익 약 0.8조원(−89.5%) 추정(리포트)."}, {"name": "SMP 결정 구조와 원가 전달 시차", "formula": "SMP(시간대) = 급전 순서상 마지막 발전기의 변동비 / LNG 연료비단가 ≈ f(JCC×유가연동비중, JKM, 환율) → SMP → 한전 구입단가", "explain": "전력거래소는 변동비가 싼 원자력→석탄→LNG 순으로 발전기를 돌리고, 그 시간 마지막 발전기의 변동비를 모든 발전기에 지급한다(CBP 시장). 2025년 SMP 결정 구간의 약 83%(다른 리포트는 약 90%)가 LNG였다. 가스공사 도입 LNG는 일본 원유 통관가격(JCC) 연동 장기계약이 많아 통관·평균 산정 시차로 유가가 5~6개월 뒤 반영되고, 공급 차질기에는 현물 프리미엄 때문에 선물 기준 추정이 SMP를 과소평가한다. 재생에너지는 계통 수요를 차감해 SMP 상단을 낮춘다(제주는 SMP 0 빈번).", "sensitivity": "유연탄·LNG가 동시에 급등한 2022년과 달리 2026년은 유가 위주 상승이라 SMP 상단이 제한된다는 분석. SMP 상한제는 직전 3개월 평균이 120개월 상위 10%일 때 120개월 평균의 150%로 정산가격을 제한(2026년 발동 시 약 166.55원/kWh 추정).", "example": "SMP 연초 100~110원 → 6월 약 130원 → 8월 월평균 148.4원/kWh, 9/2 일평균 167.91원(전력거래소). 2025년 정산단가: 평균 124.5, 원자력 79, LNG 384.6원/kWh."}, {"name": "총괄원가 규제 (한전·가스공사·지역난방)", "formula": "총괄원가 = 적정원가(연료·구입전력·인건비·감가상각) + 적정투자보수(요금기저 × 적정투자보수율[WACC]) / 원가회수율 = 판매수입 ÷ 총괄원가", "explain": "송배전망·가스 주배관은 자연독점이라 정부가 사업영역을 보장하는 대신 요금을 규제한다. 이익은 판매량보다 ‘어떤 자산을 요금기저로 인정받고 어떤 보수율을 받는가’로 결정된다. 문제는 원칙상 원가 보상이지만 실제로는 물가·산업정책으로 요금이 관리돼 회수율이 100%를 밑도는 기간이 길다는 점이다. 가스공사는 원료비가 요금보다 높으면 손실이 아닌 ‘미수금’ 자산으로 쌓아 회계이익은 안정적이나 현금은 이미 나가 차입이 늘어난다.", "sensitivity": "금리가 내리면 적정투자보수율이 낮아져 규제 이익이 줄고, 요금기저가 커지면 보수는 늘지만 그만큼 차입이 선행된다. 한전 송배전 WACC는 과거 4~5%대로 발전자회사(7~8%)보다 낮게 책정됐고 최근 3% 초반으로 제시된다.", "example": "가스공사 2026 요금기저 21.7조원 × 적정투자보수율 5.38% ≈ 국내 도매 투자보수 약 1.17조원. 민수용 미수금 1.8조(2021) → 14.0조(2024) → 13.5조원(2Q26). 한전 원가회수율 118%(2025E) → 131%(2027E) 추정, 역사적 고점 107%(2016)."}, {"name": "전선·해저케이블 = 구리 패스스루 + 가공·시공 부가가치", "formula": "매출 ≈ 물량 × (구리 가격 연동 판가 + 가공마진) / 해상풍력 1GW 케이블 시장 ≈ 건설비 7조원 × 해저송전망 18~20% × 송전 45% × (케이블 55% / 시공 45%)", "explain": "전선은 원가에 마진을 붙여 파는 구조라 매출이 구리 가격에 연동되고, 초고압 케이블 원가의 약 50~60%가 구리다. 실제 수요는 매출이 아니라 수주잔고와 EBITDA 마진 추세로 판단해야 한다. 전압이 높을수록, 지중→해저로 갈수록 접속재·설계·시공·포설선까지 부가가치가 붙어 경쟁 단위가 ‘생산 톤수’에서 ‘턴키 수행 능력’으로 바뀐다.", "sensitivity": "구리 급등기에는 판매가-원가 시차로 단기 수익성이 흔들리고 고정가 계약 비중이 높으면 마진이 압박된다. 미국 구리 관세가 초고압 케이블까지 확대되면 판가 기준 관세율이 15.1%→34.0%로 오르는 시나리오가 제시됐다(현재는 제외).", "example": "국내 해상풍력 1GW당 케이블 자재+포설 약 8,000억원(자재 60:포설 40), 대만·베트남 약 6,000억원/GW. 안마해상풍력(532MW) 케이블 계약 총액 4,527억원. 2035년 25GW 목표 기준 해저송전 시장 15조원(케이블 8.3조·시공 6.7조, 리포트 추정)."}, {"name": "데이터센터 전력기기 MW당 콘텐츠 모델", "formula": "1GW 캠퍼스 = 1MW 랙 1,000개 × PUE 1.3 → 인입 1.3GW(역률 0.95 기준 약 1,368MVA) = 50MW 블록 × 20회 반복 / 블록당 N+1 중압 변압기 2~4대, 배전반 12~20면, (800VDC 시) 10MW 정류 모듈 5식", "explain": "AI 데이터센터는 40~60MW 전력 블록을 반복 증설하는 방식이라 1GW당 중압 변압기 40~80대, 배전반 240~400면, 정류 모듈 약 100식이 누적 발주된다. 여기에 N+1·2N 이중화가 MW당 설비 투입량을 2~3배 늘리고, 800VDC 전환은 기존 설비를 없애기보다 전력전자 층을 추가한다. 글로벌 업체들은 MW당 매출 기회를 늘리는 방향(냉각·전력 통합)으로 가이던스를 올리고 있다.", "sensitivity": "블록당 공급 패키지 50억~150억원 가정 시 1GW당 내부 배전 1,000억~3,000억원(리포트 추정). 50MW 데이터센터 MW당 투자비는 N 구조 2.1백만달러 vs 2(N+1) 7.0백만달러(BNEF).", "example": "Schneider MW당 매출 기회 120만→330만달러(~2030E), Vertiv 800VDC 전환 시 MW당 TAM 300만~350만달러, Eaton 290만→340만달러. Bloom향 국내 확인 수주 합산 약 3,900억원(LS ELECTRIC 3,190억 + 산일전기 약 750억)."}, {"name": "가스터빈 = 장비(슬롯) + LTSA ‘프린터-잉크’", "formula": "사업가치 ≈ 신규 장비 판매(슬롯 × 단가) + 설치 기반 × 20~30년 서비스(고온부품 7~8년 주기 교체)", "explain": "가스터빈은 장비 판매 자체보다 설치 후 수십 년 이어지는 장기서비스계약(LTSA)이 수익의 핵심이다. 공급 부족기에는 ‘장비 확보 → 프로젝트 진행’ 순서로 바뀌어 발전사업자가 예약금(약 2,500만달러)을 내고 2030년 슬롯을 선점한다. 수주잔고에 확정 계약과 슬롯 예약(SRA)이 섞여 있어 잔고의 질을 따로 봐야 한다.", "sensitivity": "대형 가스터빈 가격은 2019년 대비 약 200% 올라 2027년 말 약 600달러/kW 전망(Wood Mackenzie). 복합화력 건설비는 Mill Creek 5→6 기준 1,427→2,194달러/kW(+54%).", "example": "GE Vernova 가스터빈 잔고 100GW(확정 44 + 슬롯예약 56, 1Q26), 2030년까지 잔여 슬롯 약 10GW. 글로벌 4사 생산능력 약 50GW → 2028년 약 80GW."}, {"name": "미국 규제 유틸리티 = Rate Base × 허용 ROE", "formula": "허용 수익 = 요금기저(순투자자산) × 허용 ROE(자기자본분) + 운영비·감가상각 회수 → CAPEX 증가 = 요금기저 증가 = 이익 증가", "explain": "미국 IOU는 지역 독점권 대신 투자비·운영비·자본비용을 반영한 요금안을 주 규제위원회에 승인받는다. 따라서 장기 투자계획이 곧 요금 인상과 이익 성장의 근거가 되고, 한국과 달리 회수 경로의 예측 가능성이 높아 밸류에이션 할인이 작다. 유틸리티 CAPEX는 규제 승인을 거친 5년 이상 계획이라 관성이 크고, 이것이 전력기기 수주의 가장 확실한 선행 변수다.", "sensitivity": "데이터센터 대형 부하 1GW당 약 20억달러 CAPEX 필요(NextEra), 그중 송전은 1억(PPL)~2.5억달러(FirstEnergy). 요금 부담이 가계로 전가되면 주민 반대·모라토리엄이 강해져 대형 부하에 비용을 직접 물리는 규칙(BYOP, SB6)으로 이어진다.", "example": "AEP 2026~2030 CAPEX 720억→780억달러, Dominion 501억→647억달러, Duke 2030년까지 1,030억달러(+18%). 미국 IOU 합산 CAPEX 1,980억(2025) → 2,780억달러(2030E, S&P Global)."}, {"name": "온사이트 발전 TCO vs 계통 요금", "formula": "온사이트 경제성 = (계통 요금 + 망 이용료 + 접속 지연의 기회비용) − (온사이트 LCOE + 이중화 비용 − ITC)", "explain": "GPU를 선투자한 데이터센터는 계통 연결이 늦으면 자산이 놀기 때문에 전력은 비용이 아니라 ‘가동 개시 일정 변수’가 됐다. 온사이트 발전은 계통을 대체하기보다 가동 시점을 앞당기는 하이브리드 전략이며, 연료전지 I
