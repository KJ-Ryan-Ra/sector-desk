 14.2조원(민수용 13.5조원, 2Q26)", "read": "여러 분기 연속 순감소하고 차입금이 함께 줄어야 PBR 할인 축소. 요금 동결 시 재증가"}, {"group": "정책·시장", "name": "PJM 용량경매 청산가·예비율", "def": "3년 뒤 공급용량 경매 가격과 확보 예비율", "where": "PJM", "level": "2027/28 $333.44/MW-day(상한), 예비율 14.8%, 부족분 6.6GW(2025-12)", "read": "상한 청산·예비율 저하는 공급 부족과 정책 개입 가능성. 신규 발전소·전력기기 투자 유인"}, {"group": "정책·시장", "name": "765kV 승인 마일 수", "def": "ERCOT·MISO·SPP·PJM의 765kV 노선 승인·계획 누적", "where": "ERCOT, MISO, SPP, PUCT", "level": "승인 약 4,561마일, 계획 포함 약 6,000~6,360마일(2026-02)", "read": "200~250마일당 변전소 1개, 변전소당 6~9대 가정으로 변압기 수요 역산(약 120~310대)"}, {"group": "정책·시장", "name": "국내 12차 전기본·송변전 투자비", "def": "2040 수요 전망과 후속 장기 송변전설비계획 투자비", "where": "12차 전기본 총괄위원회, 한국전력", "level": "2040 최대전력 158.4~165.0GW(8월 재전망), 11차 송변전 72.8조원 → 12차 미발표(115조원 이상 추정)", "read": "115조원 이상 확정 시 민간 BT 시장(약 35조원) 가시화, 국내 전력기기·전선 수주 기간 연장"}, {"group": "밸류에이션", "name": "전력기기 Forward PER vs EPS 성장률", "def": "국내외 전력기기 선행 PER과 향후 3년 EPS 증가율 비교", "where": "Bloomberg, FactSet 컨센서스", "level": "빅3 고점 PER 53.6배(2026-05), 국내외 '26/'27/'28 PER 33~42/28~32/24~25배(6월말), 국내 EPS 증가율 해외 대비 +4~12%p", "read": "EPS 추정치가 유지·상향되는데 주가가 빠지면 멀티플 조정. 컨센서스 하향 전환이 펀더멘털 훼손 신호"}], "deep": [{"group": "송변전 기기", "title": "초고압 변압기 부족은 왜 증설로 쉽게 풀리지 않는가", "period": "2025.11~2026.09", "lede": "모든 제작사가 증설 중인데도 리드타임이 줄지 않는 이유는 GOES·숙련 권선공·건조·시험이라는 물리적 병목과, 과거 사이클 붕괴를 경험한 업체들의 보수적 증설 기조 때문이다.", "body": ["초고압 변압기는 고객 사양(정격전압·임피던스·안전 규격)에 맞춘 주문생산품이다. 철심→권선→중신 조립→진공건조→고전압 시험의 연속 공정을 거치는데, 실제 생산능력은 가장 느린 공정(주로 건조·시험)이 결정한다. 권선은 수작업이라 3년 이상 경력자가 필요하고 숙련공 양성에는 4~5년이 걸리며, 건조는 절연지 열화 때문에 시간을 줄일 수 없다. 공장 신설에는 최대 3년, 권선기·코어 테이블 같은 특수장비 조달에만 최대 2년이 걸린다(DOE·업계).", "소재도 병목이다. 원가의 약 25%를 차지하는 방향성 전기강판(GOES)과 CTC 구리선은 해외 의존도가 높고, GOES는 EV 모터용 무방향성 강판(NOES)과 열간압연 라인을 공유해 철강사가 수익성이 더 좋은 NOES를 두고 GOES를 증산할 유인이 약하다. 비중국 GOES 공급처는 약 6곳이며, POSCO의 최근 증설 30만톤도 전량 NOES다. 인건비가 원가의 약 36%이고 미국 제조업체의 89%가 숙련공 확보에 어려움을 겪었다(DOE 2020).", "수요 쪽은 계속 앞서간다. 리포트 추정으로 미국은 피크 부하가 연 33GW 이상 늘고 기저발전 1GW를 345kV에 연계하는 데 600MVA 변압기 최대 6대가 필요해, 연 210~300대(600MVA 기준)의 신규 수요가 나온다. 반면 주요 제작사의 미국 공급 가능 물량은 증설을 반영해도 연 140~220대다. 지멘스 에너지는 경쟁사 증설을 모두 반영해도 5년 뒤 수요의 약 10%를 채우지 못한다고 봤고, Rystad·PTR은 2030년 변압기 수요가 생산능력을 28% 초과한다고 추정한다.", "공급자들이 서두르지 않는 이유는 역사에 있다. 2000년대 초 슈퍼사이클 뒤 2008년 급락기에 과잉 CAPA가 저가수주 경쟁을 낳았고, ABB 전력사업부의 Hitachi 매각, Mitsubishi Electric 멤피스 공장의 효성 매각, HD현대일렉트릭의 2018~2019년 적자 같은 구조조정이 이어졌다. 그래서 지금은 선급금 요구, 인도 가능 물량만 수주, 슬롯 예약 계약 같은 공급자 우위 관행이 자리 잡았고 주요 증설은 2027~2028년에야 가동된다.", "주의할 점은 모든 전압대가 똑같이 부족하지는 않다는 것이다. 2026년에는 일부 배전용 변압기 납기가 개선됐다는 언급도 나왔다. 반대로 765kV에 생산 슬롯이 우선 배정되면 300~500kV 공급이 빠듯해지는 간접 효과가 있어, 병목은 전압이 높을수록 심하고 오래 간다."], "table": {"cols": ["전압 등급", "리드타임", "주요 제작 가능 업체", "병목 상황"], "rows": [["765kV 이상(UHV)", "48~60개월", "Hitachi Energy, Siemens Energy, GE Vernova, HD현대일렉트릭, 효성중공업", "제작 가능 10곳 미만(북미 공급 기준 5곳 내외), 가장 극심"], ["345~500kV(EHV)", "36~48개월", "상위 업체 + LS ELECTRIC, Mitsubishi, TBEA", "데이터센터·송전 핵심, 2027년까지 슬롯 마감 다수"], ["115~230kV(HV)", "24~36개월", "상위 업체 + Virginia Transformer, WEG, 일진전기", "상위 등급 병목의 낙수로 지연"], ["69kV 미만(MV·배전)", "12~20개월", "Eaton, Schneider 등 다수", "조달 용이하나 구리·강판 부족 영향"]]}, "bullets": ["리드타임: 2년(3년 전) → 최대 5년, 지금 주문하면 2029~2030년 인도", "미국 대형 변압기 수입 의존도 82%(2019, DOE), 초고압 자급률 약 20%", "변압기 수요 산식: 기저 1GW = 600MVA×3대×2(승압·감압) = 6대, 재생에너지 대체 시 최대 5배", "주요 증설 가동: HD현대 2027년, 효성 멤피스 2026말·2028말, Hitachi 미국 2028년, Siemens 샬럿 2027년", "전압대별로 병목 강도가 다르므로 ‘변압기’ 한 단어로 묶지 말 것"], "kr": "HD현대일렉트릭·효성중공업·LS ELECTRIC·일진전기가 수혜 중심이며, 실사 시에는 증설이 건조·시험 공정과 숙련 인력까지 늘렸는지, GOES 조달 계약이 있는지를 함께 봐야 한다(소재 측 연결: POSCO홀딩스)."}, {"group": "송변전 기기", "title": "765kV: 수십 년 잠들었던 미국 초고압 시장이 깨어나다", "period": "2026.02~2026.08", "lede": "765kV는 손실 절감보다 ‘회선 수’를 줄여 인허가 병목을 푸는 해법이며, 공급자가 5곳 내외라 2027년부터 한국 업체의 제품 믹스를 한 단계 끌어올릴 수 있다.", "body": ["전력 P=V×I이므로 같은 전력을 보낼 때 전압을 높이면 전류가 줄고, 선로 열손실(I²R)은 전압 제곱에 반비례해 준다. AEP 자료에서 단일 회선 50마일 기준 송전능력은 345kV 약 1,170MW, 765kV 약 6,630MW이고 300마일에서도 390MW 대 2,210MW로 5배 이상 격차가 유지된다. 5GW를 100마일 보내려면 345kV는 12회선, 765kV는 2회선이면 된다(MISO). 즉 765kV의 진짜 가치는 통행권(ROW)·토지보상·환경평가라는 인허가 병목을 1/5~1/6로 줄이는 데 있다.", "미국은 1960~70년대 500kV 중심 표준화가 끝나 765kV 장비 조달이 어렵고, 인허가에 최대 7년, 7개 RTO가 분절 운영되며, 2022년 이전에는 GW급 집중 부하가 없어 투자 유인이 약했다. 345kV 이상 신규 송전선은 2010~14년 연평균 1,700마일에서 2020~23년 350마일로 줄었다. AI 데이터센터가 특정 권역에 GW 단위 부하를 몰아넣으면서 경제성 계산이 뒤집혔고, 2025년 4월 텍사스 PUCT가 345kV 확장안 대신 765kV 신설안(퍼미안 분지)을 채택한 것이 공식 출발점이 됐다.", "파이프라인은 승인 기준 약 4,561마일, 계획 포함 약 6,000마일 이상이다. ERCOT STEP(약 2,400~2,468마일, 약 330억달러), MISO Tranche 2.1(765kV 약 1,800마일, 전체 약 218억달러), SPP ITP(85억달러 포트폴리오), PJM·오하이오 765kV 등이 2029~2034년 가동을 목표로 한다. 리포트는 200~250마일당 변전소 1개, 변전소당 2~3 Bank×단상 3대, 예비기 10~15%를 가정해 765kV 변압기 잠재수요를 약 120~310대(평균 약 200대)로 역산했고, 대당 70~140억원이면 변압기만 수조원 시장이다.", "발주 타이밍은 인허가에 달려 있다. 텍사스 Howard–Solstice(약 370마일)는 2026년 2월 CCN 신청, 가을 노선 확정, 2026 하반기~2028년 토지보상, 2028 하반기 착공, 2030 하반기 준공 일정이라 역산하면 주요 기자재 발주는 2026~2027년이다. Quanta는 4Q25에 765kV 본격 수주를 2027년 하반기로 봤으나 1Q26에 첫 765kV가 잔고에 반영돼 타임라인이 6~12개월 앞당겨졌다.", "공급 측은 극도로 좁다. 765kV 변압기를 상업 생산할 수 있는 기업은 세계 5곳 내외이고, 미국 내 765kV 변압기 공장은 효성중공업 멤피스가 유일하다. 효성은 미국에 누적 설치된 765kV 대형 변압기의 약 50%를 공급했고, HD현대일렉트릭은 텍사스 765kV 변압기·리액터 24대(2,580억원)를 단일 최대 계약으로 따냈다. 765kV 변전소는 변압기·리액터·800kV GCB/GIS를 패키지로 요구하므로, 차단기까지 현지 공급할 수 있는 업체가 유리하다."], "table": {"cols": ["항목", "765kV", "500kV", "345kV"], "rows": [["단일회선 50마일 송전능력", "약 6,630MW", "-", "약 1,170MW"], ["열적 한계", "6,625MVA", "-", "1,793MVA"], ["350km·3GW 손실률(리포트 시뮬레이션)", "2.88%", "7.78%", "20.69%"], ["ROW 폭", "200~250ft", "130~160ft", "120~150ft"], ["100마일당 손실", "0.5~1%", "1~2%", "2~4%"], ["도체 구성", "4~6도체 번들", "3도체 번들", "2도체 번들"]]}, "bullets": ["765kV 1회선 ≈ 345kV 5~6회선(3회선으로 보는 리포트도 있음)", "ERCOT 765kV 확장 효과: 연간 소비자 비용 약 2.29억달러 절감, 손실 560GWh/년 감소", "잠재수요 산식 = 변전소 수 × Bank 수 × 단상 3대 + 예비기", "지금까지 이익을 끌어올린 것이 ‘지역 믹스(북미)’였다면 2027년부터는 ‘제품 믹스(765kV)’가 더해진다", "리스크: 토지보상·인허가 지연 시 발주 후퇴, Siemens 샬럿·Hitachi 증설 후 경쟁 심화"], "kr": "효성중공업(멤피스·Quanta JV 차단기로 765kV 패키지)과 HD현대일렉트릭(울산 생산, 앨라배마 2공장 765kV)이 직접 수혜이고, 슬롯이 765kV로 이동하면 300~500kV 수급이 빠듯해져 일진전기·LS ELECTRIC에 간접 기회가 생긴다."}, {"group": "송변전 기기", "title": "송전 → 배전으로 번진 두 번째 사이클", "period": "2026.03~2026.09", "lede": "2022년 초고압 송전에서 시작된 호황 위에 2025년부터 데이터센터 배전이라는 짧은 납기·반복 수요 사이클이 겹쳤고, 배전기기는 변압기 사이클을 약 2년 후행하는 경향이 있다.", "body": ["미국 전력 소비는 2007~2021년 정체를 깨고 2022년 4,000TWh를 넘은 뒤 AI 데이터센터·전기화·리쇼어링으로 구조적 증가 국면에 들어섰다. 순서는 전력수요 급증 → 발전 CAPA·송전망 투자 → 전력기기 신규주문 급증(2020년부터) → 약 1년 후행한 PPI 급등(2021년부터)이었다. 이 과정에서 초고압 변압기·GIS가 가장 먼저 호황에 진입했다.", "중저압 배전(배전반·배전변압기·차단기)은 최종 수요처 건설과 함께 움직이기 때문에 3~4년 늦게, 하이퍼스케일러가 AI 데이터센터 발주를 본격화한 2025년에야 호황에 들어섰다. 미국 데이터센터 전기장비 시장은 2025년 200억달러에서 2030년 650억달러로 커질 전망이다(Wood Mackenzie). 미국 현지 중소 업체는 주거용 중심이라 산업용 급증 수요를 감당하지 못했고, 그 공백에 산업용 배전에 강한 한국 업체가 들어갔다.", "배전 사업의 특징은 속도와 반복성이다. 배전반은 수주~납품 6~10개월, 차단기·개폐기는 대리점 판매 양산품이라 증설 후 매출까지 리드타임이 거의 없고 교체 주기도 짧다. 게다가 데이터센터·반도체 팹은 N+1·2N 이중화로 같은 용량 대비 배전기기 수요가 2~3배로 증폭된다. 빅테크에서 레퍼런스를 쌓은 뒤 콜로케이션 업체, 가스발전 마이크로그리드, 한국 기업의 미국 공장으로 고객이 넓어지는 중이다.", "그래서 업체별 제품 믹스가 실적 모멘텀 시점을 가른다. 송전 중심 업체는 성장 강도가 정상화되는 반면 배전 비중이 큰 업체는 2026년 성장률이 반등하는 ‘U자형’ 차별화가 나타날 수 있다. 다만 800VDC가 본격화되면 UPS·PDU 같은 기존 AC 배전기기의 기능이 축소될 수 있어, 배전 업체의 장기 수혜는 DC 제품(SST·DC 배전반·SSCB)으로 얼마나 빨리 전환하느냐에 달려 있다는 양면적 시각도 있다."], "table": null, "bullets": ["LS ELECTRIC 2Q26 배전반 신규수주 1조 410억원, 1H26 수주 3.17조원(+117%), 약 45%가 데이터센터", "HD현대일렉트릭 빅테크와 약 1.1조원 초고압·배전 장기공급계약(2027~2028 납품), 데이터센터 수주 비중 1.8%(2025) → 16.0%(2027E)", "배전 사이클은 변압기 사이클을 약 2년 후행한다는 분석", "데이터센터향 중저압 리드타임 18~24개월 → 24~30개월 전망"], "kr": "배전 비중이 큰 LS ELECTRIC(청주·유타)과 배전으로 진입하는 HD현대일렉트릭(청주 배전캠퍼스), 패드마운트·특수변압기의 산일전기가 두 번째 사이클의 직접 연결점이다."}, {"group": "송변전 기기", "title": "관세는 왜 마진을 훼손하지 못했나: 공급자 우위의 증거", "period": "2025.10~2026.07", "lede": "HS 코드와 금속 성분 비중에 따라 실질 관세는 0~21%로 갈렸지만, 공급 부족 국면에서 고객이 비용을 대부분 떠안으면서 관세는 오히려 가격 결정력을 확인시킨 사건이 됐다.", "body": ["2025년 미국은 보편관세 10%(EO 14257)를 대체해 상호관세 15%(EO 14302)를 제품 전체에, Section 232 철강·알루미늄 50%를 금속 성분가치(8~12%)에만 부과했다. 그 결과 초고압 변압기와 알루미늄 케이블의 매출가 대비 실질 부담은 15~21%, 232 비대상인 배전변압기·GIS·배전반은 15%, FOB 조건으로 납품하는 ESS용 특수변압기는 제조사 부담이 사실상 없었다(리포트 추정).", "그런데도 마진이 무너지지 않은 이유는 전가다. 2025년 하반기부터 리드타임이 긴 초고압 변압기·데이터센터 전력기기는 고객이 관세 비용을 사실상 100% 부담하는 구조가 자리 잡았다. 신규 계약은 판가에 반영하고, 기존 계약은 변경계약(CO)·구매주문(PO) 확정 시 환입했으며, 2028년 이후 계약에는 에스컬레이션 조항이 들어갔다. Schneider·Hitachi·ABB·르그랑 같은 글로벌 업체도 가격 인상과 현지 생산으로 관세를 상쇄했다고 밝혔다.", "2026년에는 제도가 두 번 바뀌었다. 4월 연방대법원이 IEEPA 근거 상호관세를 위헌으로 판결해 4월 20일부터 환급 절차가 시작됐고, 국내 업체가 인식한 관세 비용 일부가 3Q26 전후 환입될 수 있다. 같은 달 232조가 금속함량 기준에서 전체 과세가격 기준으로 바뀌며 대형변압기 관세가 50%→15%(2027년 12월까지), 배전변압기가 50%→25%로 조정돼 실효세율은 각각 28.7%→15.0%, 34.9%→25.0%로 낮아졌다(EIA 계산).", "남은 변수는 현지 생산과 새 규제다. 케이블 등 파생제품의 관세 기준이 전체 통관가액으로 바뀌면서 미국 현지 공장을 가진 업체가 상대적으로 유리해졌고, 2026년 8월 행정명령은 69kV 이상 계통의 외국산 전력기기 중 안보 위험 거래를 DOE가 제한할 수 있게 했다(세부 기준 120일 내). 이는 신규 수요보다 진입장벽과 현지 생산 프리미엄을 강화하는 쪽으로 작용한다."], "table": {"cols": ["품목(HS)", "2025.10 적용 관세", "실질 부담·전가", "주요 기업"], "rows": [["초고압변압기(8504.23)", "상호 15% + 232 철강", "약 15~21%, 대부분 전가", "HD현대일렉트릭, 효성중공업, 일진전기, LS ELECTRIC"], ["배전·저압변압기(8504.21~22)", "상호 15%(232 비대상)", "15% 명목", "산일전기"], ["GIS(8535.21)", "상호 15%(232 비대상)", "전가율 높아 미미", "효성중공업"], ["배전반(8537.20)", "상호 15%(232 비대상)", "신규수주 100% 전가", "LS ELECTRIC"], ["알루미늄 도체 케이블(8544.60)", "상호 15% + 232 알루미늄", "30~50% 전가", "대한전선"], ["ESS용 특수변압기", "FOB 조건", "실질 부담 없음", "산일전기"]]}, "bullets": ["2026-04 232 개편: 대형변압기 실효 28.7%→15.0%, 배전변압기 34.9%→25.0%", "2026-04-20 상호관세 환급 절차 개시(IEEPA 위헌)", "구리 품목관세: 순수 구리 50%, 함량 15% 초과 파생상품 25%(초고압 케이블은 현재 제외)", "관세 이슈의 본질: 공급자 우위 여부를 판별하는 리트머스 시험지"], "kr": "앨라배마(HD현대일렉트릭)·멤피스(효성중공업)·유타(LS ELECTRIC)·LSCUS(가온전선)처럼 미국 현지 거점을 가진 업체가 관세·외국산 제한 규제에서 상대 우위이며, 실사 시 관세 전가 조항과 환급 인식 시점을 확인해야 한다."}, {"group": "송변전 기기", "title": "국내 전력기기 증설 로드맵: 가격(P)에서 물량(Q)으로", "period": "2026.02~2026.09", "lede": "판가 상승은 이미 주가에 반영됐고, 2026~2028년 실적 기울기는 누가 언제 증설을 완공해 출하를 늘리느냐(Q)가 가른다.", "body": ["국내 업체는 호황 진입 2년 만인 2024년부터 이례적으로 강한 단계별 증설에 나섰다. 기존 공장을 넓히는 브라운필드는 12~20개월로 빠르지만 규모가 작고, 신규 부지의 그린필드는 21~31개월로 크다. 국내 업체들은 생산능력을 대수나 MVA가 아니라 ‘연간 매출 환산 금액’으로 소통하는 경우가 많아 증설을 곧바로 매출 증분으로 연결해 추정할 수 있지만, 환율·판가에 따라 달라진다는 점을 주의해야 한다.", "증설 강도는 회사마다 다르다. 효성중공업은 멤피스를 2억→4억(2026말)→6~7억달러(2028말)로 늘리고 창원에 HVDC 변압기·GIS 수출 공장을 지으며 중공업 CAPEX를 2025년 2,000억원대 중반에서 2026년 약 6,000억원으로 늘렸다. LS ELECTRIC은 부산 초고압 변압기 CAPA를 연매출 2,000억원에서 6,000~7,000억원으로 키웠고(2025-12 완료), 미국 유타 배전반을 500억→3,000억원대→7,000억원 이상(2030말)으로 확대한다. HD현대일렉트릭은 울산·앨라배마 그린필드 2차(연 +3,000억원, 2027년 기여)와 청주 중저압 차단기(연 1,300만대, 2배)를 진행하지만 현재 매출 대비 증설 강도는 빅3 중 가장 약하다는 평가를 받았다.", "중소형사는 더 공격적이다. 산일전기는 안산 2공장으로 CAPA를 약 2배 늘렸고 제3공장 부지를 확보해 2028년 154kV 초고압 변압기 양산을 추진하며 2028년까지 최대 1.2조원 캐파를 계획한다. 일진전기는 홍성 초고압 변압기 공장 증설로 변압기 CAPA를 2,200억원(2024)에서 5,000억원(2026 연환산)으로 늘렸고, 대한전선은 당진 해저 2공장(해저 CAPA 약 5배)·베트남 400kV 공장·CLV 2척으로 2027년 가동을 준비한다.", "증설의 함정도 있다. 리포트는 업계 유형자산이 2025년 하반기부터 늘었고 실제 생산까지 약 2년이 걸린다고 가정해 업계 전체 공급 증가를 2027년 하반기로 본다. 램프업 과정에서 고정비·인건비가 먼저 늘어 단기 마진이 하락할 수 있고(이튼 사례), 케이블 업체는 증설 비용·램프업 기간을 반영해 중장기 이익 추정을 6~14% 하향한 사례도 있다."], "table": {"cols": ["기업", "증설 내용", "규모(연매출 CAPA 기준)", "가동·기여 시점"], "rows": [["효성중공업", "멤피스 1차(브라운필드)·2차(그린필드)", "2억 → 4억 → 6~7억달러", "2026말 / 2028말"], ["효성중공업", "창원 HVDC 변압기 공장", "6,000억원(투자 2,538억원)", "2027년 준공 목표"], ["효성중공업", "창원 GIS 수출 공장 / Quanta JV 차단기", "3,400억원 / 미국 현지 GCB", "2026 하반기 / 2026-10"], ["LS ELECTRIC", "부산 초고압 변압기(+LS파워솔루션)", "2,000억 → 6,000~7,000억원", "2025-12 완료"], ["LS ELECTRIC", "미국 유타 배전반·배전기기", "500억 → 3,000억대 → 7,000억원+", "2027~2028 / 2030말"], ["HD현대일렉트릭", "울산 신공장·앨라배마 2공장", "+3,000억원(앨라배마 CAPA +50%)", "2027년(앨라배마 1H27 준공)"], ["HD현대일렉트릭", "청주 중저압 차단기", "1,000억 → 2,500억 → 5,000억원", "2026 / 2030"], ["산일전기", "안산 2공장 / 154kV 신공장", "5,000억(2025) → 8,000억(2027) → 최대 1.2조원", "2028 154kV 양산"], ["일진전기", "홍성 초고압 변압기", "2,200억 → 5,000억원", "2026 효과 본격화"], ["대한전선", "당진 해저 2공장·베트남 400kV·CLV", "해저 CAPA 약 5배", "2027 가동"]]}, "bullets": ["P-growth: 판가 인상 / Q-growth: 증설로 출하 물량 증가 — 사이클 장기화 국면에서는 Q가 차별화 요인", "양산형 배전기기(차단기)는 증설 후 매출 리드타임이 거의 없고, 수주형(변압기·배전반)은 인도까지 시차", "증설 발표 시점(2025년 1월·7월) 이후 국내 3사 주가 기울기가 가팔라졌다는 관찰", "2027년 하반기 업계 동시 증설 물량이 가격·마진 압박 요인이 될 수 있다는 bear 논리"], "kr": "IPO·실사 대상 기업은 ‘증설 발표–완공–가동률 100% 도달’ 타임라인과 증분 매출 가이던스를 분리해 검증하고, 증설이 병목 공정을 실제로 늘렸는지 확인해야 한다."}, {"group": "송변전 기기", "title": "2026년 5~8월 주가 조정 분해: 업황인가 수급인가", "period": "2026.06~2026.08", "lede": "5월 7일 고점 이후 국내 전력인프라 주가는 최대 58.3% 빠졌지만 같은 기간 이익 추정치는 올라가, 하락 전체가 EPS가 아닌 멀티플 축소로 설명된다.", "body": ["주가는 EPS×PER로 분해할 수 있다. 이익 추정치가 오르는데 주가가 빠졌다면 하락은 멀티플 축소다. 리포트들은 26F/27F 매출·영업이익 컨센서스가 주가 피크 이후에도 상향됐고, 1Q26 변압기 5사 신규수주가 역대 최고였다는 점을 들어 이번 조정이 피크아웃 신호가 아니라고 봤다. 수요 둔화라면 신규수주와 잔고가 함께 꺾여야 하는데 데이터는 반대였다.", "멀티플 축소의 원인은 세 갈래다. 글로벌로는 약 1,300억달러·75건의 미국 데이터센터 프로젝트 중단 보도와 42개 주 533건 이상의 모라토리엄 관련 조치, 그리고 레버리지 AI 펀드(Situational Awareness)의 마진콜·7월 30일 블록딜 청산이 있었다. 국내에서는 5월 27일 반도체 단일종목 레버리지 ETF 출시 이후 AI 테마 자금이 삼성전자·SK하이닉스로 쏠렸고, 전력기기 ETF(5월 초 YTD +160%대)가 고점 대비 약 50% 조정받았다.", "ETF 바스켓 환매는 유동성이 낮은 종목에서 충격을 키웠다. 운용사는 환매가 나오면 구성종목을 비중대로 팔아야 하는데, 예컨대 가온전선은 유동비율 18.29%에 주요 ETF 익스포저가 유통시총의 48.8%였다. Bloom Energy를 매개로 LS ELECTRIC·산일전기·비나텍·코세스도 AI 펀드 청산의 수급 충격을 함께 받았다.", "반대편에서는 수요 지표가 견조했다. 하이퍼스케일러 자금조달 채널이 엔비디아 컴퓨트 파이낸싱(5,000억달러+), SEC의 데이터센터 유동화증권 무조치 해석, BofA 인프라 금융(2,500억달러)으로 넓어졌고, 2Q26에 국내 빅3가 모두 연간 수주 가이던스를 올렸다. 인허가 중단의 명분이 ‘전기요금’이라는 점은 오히려 발전·송배전 증설의 정치적 정당성을 높인다는 해석이다."], "table": {"cols": ["기업", "기존 2026 수주 가이던스", "상향 후", "배경"], "rows": [["HD현대일렉트릭", "42억달러", "52억달러", "숙련인력 확보로 증산, 배전·회전기기 추가, 빅테크 1.1조원 계약"], ["효성중공업(중공업)", "8.4조원", "12.0조원", "765kV 물량, 1Q26 최대 수주 4.2조원"], ["LS ELECTRIC", "약 4조원", "6~6.5조원", "빅테크 직수주, 국내외 데이터센터"]]}, "bullets": ["판별 지표: 신규수주·잔고·북미 비중·마진 흐름이 꺾였는가", "빅테크 직납 비중이 높은 업체는 AI CAPEX 우려 국면에 할인, 유틸리티 비중이 높은 업체는 이익 가시성이 높다", "외국인은 국내 전력기기 멀티플을 GEV·VRT·ETN 등 미국 피어와 비교해 매긴다", "컨센서스는 1월·4월 실적 시즌 전후 계단식으로 상향되는 패턴"], "kr": "IPO 공모가 산정 시 피어 멀티플 선정 시점이 2026년 5월 고점이냐 8월 저점이냐에 따라 결과가 크게 달라지므로, EPS 추정치 흐름과 멀티플 변동을 분리해 설명하는 것이 중요하다."}, {"group": "AIDC 전력", "title": "800VDC: 전류·구리·손실의 산수와 수혜 체인", "period": "2026.01~2026.09", "lede": "랙 전력이 120kW에서 1MW로 커지는 동안 50V를 유지하면 손실이 약 70배로 불어나기 때문에, 데이터센터 내부 배전은 800V 직류로 바뀔 수밖에 없다.", "body": ["출발점은 옴의 법칙이다. 같은 전력에서 전압을 높이면 전류가 줄고, 필요한 구리 단면적은 전류에, 손실은 전류 제곱에 비례한다. 50V 기준 120kW 랙은 2.4kA, 600kW는 12kA, 1MW는 20kA가 흐르고 손실은 120kW 대비 600kW에서 약 25배, 1MW에서 약 70배가 된다(리포트 가정). 800V로 올리면 1MW 랙 전류는 약 1,250A로 줄어든다. NVIDIA는 54V로 1MW 랙을 유지하면 구리 버스바가 최대 200kg, 파워 셸프가 64U를 차지한다고 설명한다.", "기존 구조는 13.8kV 수전 → 480V AC UPS/PDU → 415V AC → 랙 내 PSU(AC-DC) → 48/54V로 여러 번 변환하며 단계마다 2~5% 손실이 난다(서버 100MWh에 망에서 120~130MWh 요구). 800VDC는 중전압 AC를 시설 단계의 정류기나 SST로 한 번에 DC로 바꿔 DC 분전반·버스덕트로 랙까지 보낸다. 같은 구리 단면적으로 415V AC 대비 157% 더 많은 전력을 보낼 수 있고, 구리는 최대 45%, 변환·열 손실은 약 5% 줄어든다(NVIDIA).", "전환은 단계적이다. 1단계는 기존 AC를 유지하고 랙 옆 사이드카에서 LV 정류기로 DC를 만드는 과도기, 2~3단계는 PDU 앞단 정류와 BESS를 결합한 하이브리드, 최종 단계는 SST·MV 정류기가 중전압 AC를 800VDC로 직변환하는 구조다. 로드맵상 2025년 청사진·PoC, 1H26 레퍼런스 디자인(GTC·COMPUTEX), 2H26 공급망 발주, 2027년 Rubin Ultra/Kyber 초기 상용화다. Google/OCP의 ±400VDC와 NVIDIA의 800VDC는 경쟁보다 공존 가능성이 높아 OCP Diablo 400 사양은 두 경로를 모두 담았다.", "가치 이동은 네 곳에서 일어난다. 전력반도체(SiC는 AC-DC·SST, GaN은 DC-DC; 랙당 콘텐츠 약 1.5만→10만달러+), 전력 시스템(정류기·DC 버스웨이·DC 분전반·SST·SSCB), DC 기반 현장발전(연료전지 300~800V DC 출력), 에너지 버퍼(중앙정류기가 단일 실패지점이 되므로 대용량 ESS 직결 필수)다. 반면 범용 PSU·MOSFET 박스는 가격 경쟁이 심해질 수 있고, UPS·PDU 등 기존 AC 배전기기는 기능이 축소될 수 있다.", "남은 과제는 비용·표준·보호·안전이다. DC 배전은 아직 국제 규격이 없고, 직류는 전류가 0을 지나지 않아 차단이 어렵다. 규격이 없는 시장은 먼저 안전·효율 솔루션을 내는 쪽이 표준이 될 수 있어 레퍼런스가 약한 업체에도 기회지만, 칩 업체와 설계 단계부터 협력한 글로벌 업체(ABB·Eaton·Schneider·Vertiv 등 30여 개 파트너)가 표준을 선점하면 후발 업체 진입이 어려워진다."], "table": {"cols": ["세대", "출시", "랙당 전력", "배전 구조"], "rows": [["Ampere", "2020", "10kW", "415V AC + PSU"], ["Hopper", "2022", "40kW", "415V AC + PSU"], ["Blackwell(GB200 NVL72)", "2024", "120~132kW", "AC + 48/54V 버스바"], ["Blackwell Ultra(GB300)", "2025", "140~150kW", "사이드카 과도기"], ["Rubin(Vera Rubin NVL72)", "2026", "190~230kW", "하이브리드"], ["Rubin Ultra(Kyber)", "2027~2028", "600kW~1MW+", "800VDC(MV 정류기/SST)"]]}, "bullets": ["100kW 배전 시 전류 800V DC 125A vs 415V AC 241A, 손실 약 1/3.72(리포트 계산)", "변화가 큰 지점: 전력반도체, 전력 시스템(정류기·SST·SSCB), DC 현장발전(연료전지·ESS·슈퍼캐퍼시터)", "전압 무관 반복 BOM: MLCC·폴리머 캡·인덕터·전류센싱 / 800V에서 중요도 상승: SSCB·핫스왑·절연·HVDC 커넥터", "확인 포인트: 협력사 수주·백로그에 800VDC 항목이 별도로 잡히는가(2H26부터)"], "kr": "LS ELECTRIC(천안 DC 팩토리, LG유플러스 파주 AIDC 국내 첫 800V DC 적용 예정), 효성중공업(22.9kV SST), 삼성전기·삼화콘덴서(반복 BOM), 비나텍(슈퍼캐퍼시터)이 국내 연결점이나, front-end 정류기·보호 반도체는 해외 업체 중심이라 국내 직접 수혜는 제한적이라는 평가도 있다."}, {"group": "AIDC 전력", "title": "AI 1GW의 전력기기 수요 모델: 상단은 용량, 하단은 반복", "period": "2026.03~2026.09", "lede": "1GW 데이터센터는 초고압 변압기 한 대의 문제가 아니라, 전압 단계별 설비 누적 + 50MW 블록 20회 반복 발주 + 전력전자 계층 추가의 합이다.", "body": ["1MW 랙 1,000개면 IT 부하 1GW, PUE 1.3이면 인입 전력 1.3GW, 역률 0.95 기준 설비 용량은 약 1,368MVA다. 765→345→138kV→중압으로 내려오는 지점마다 변압기·차단 설비가 중첩되며, 250MW급 설계는 100kV 이상에서 수전해 전용 변전소를 거쳐 34.5kV 중전압으로 캠퍼스 내부에 배전한다. 데이터센터 자체가 하나의 전력 계통이 되는 셈이다.", "하단은 반복이다. AI 캠퍼스는 40~60MW 블록을 반복 증설하는데, 50MW는 역률 0.95 기준 약 52~53MVA로 30MVA급 중압 변압기 2~3대(N+1)로 설계 가능한 경계다. 블록당 중압 변압기 3대, 배전반 12~20면을 가정하면 1GW당 변압기 약 60기(40~80), 배전반 240~400면이 누적되고, 800VDC가 결합되면 블록당 10MW 정류 모듈 5개, 1GW당 약 100식이 추가된다. 기존 설비를 지우는 것이 아니라 층을 더하는 구조다.", "빅테크 CAPEX가 국내 업체에 내려오는 길은 네 갈래다. ①계통 상단(345~765kV 송전·변전: 초고압 변압기·리액터·GIS/GCB), ②데이터센터 접속 구간(인입 변전소·단거리 송전선·중압 배전), ③내부 전기실(MV 배전반·VCB·BCP·UPS 연계·정류 모듈), ④온사이트 발전(SOFC·가스터빈·ESS 주변 배전·특수변압기)이다. 그 사이에 유틸리티·발전사업자·디벨로퍼·EPC가 끼어 있으므로, 특정 빅테크와 특정 국내 업체를 일대일로 짝짓기보다 프로젝트별 전력 조달 구조를 봐야 한다.", "리포트는 확인된 수주를 GW당 단가로 환산해 민감도를 만들었다. Bloom향 확인 수주를 초기 배치 1.2GW로 나누면 LS ELECTRIC 약 2,658억원/GW, 산일전기 약 419~625억원/GW이고, 내부 배전은 블록당 50억~150억원 가정 시 1GW당 1,000억~3,000억원이다. 전량 수주를 뜻하지는 않으며 벤더 배분·공급 범위·인증·CAPA에 따라 실제 수주는 달라진다.", "MW당 콘텐츠도 커진다. 랙 밀도 상승은 변압기·개폐장치·UPS·버스웨이의 정격과 수량을 함께 끌어올리고, 캠퍼스 규모가 10~25MW에서 GW급으로 커지며, 이중화(2N 사업자는 N 구조보다 장애 보고 가능성이 최대 64% 낮다는 2026년 조사)와 액체냉각 전원이 더해진다. 사이클의 본질은 물량 증가와 함께 고전압·고차단용량 제품 비중 상승이다."], "table": {"cols": ["구간", "핵심 설비", "수요 성격", "국내 연결"], "rows": [["상단 EHV/UHV", "765kV 변압기·리액터·GIS/GCB", "용량 누적·전압 상향, 슬롯 경쟁", "HD현대일렉트릭, 효성중공업"], ["중단 HV/MV 수전", "수전 변압기·GIS·보호계전·전압안정", "시스템 단위 인입, 패키지 역량", "LS ELECTRIC, 일진전기, 산일전기"], ["하단 MV 반복", "MV 변압기·배전반·케이블·버스덕트", "40~60MW 블록 반복 발주", "LS ELECTRIC, 가온전선"], ["전력전자·품질", "정류기·PCS·STATCOM·특수변압기", "온사이트·ESS·DC 계층 추가", "LS ELECTRIC, 산일전기, 효성중공업"], ["전선·HVDC(별도 축)", "고전압 전선·해저·HVDC", "송전망·해상풍력 프로젝트", "대한전선, 일진전기"]]}, "bullets": ["블록이 80~100MW로 커지면 차단기 정격·보호계전 등급과 접속 승인 리스크 상승", "Google: 청정 PPA·유틸리티 계통 → 초고압 / AWS·xAI: 내부 전기실 / Oracle·AEP·Nebius: Bloom SOFC / Meta·Microsoft: 송전·변전소 증설", "데이터센터 1MW IT당 배전설비 투자 약 140만달러(BNEF), 향후 5년 글로벌 DC 배전기기 시장 약 1,105억달러(리포트 추정)", "미국 데이터센터 평균 규모 약 80MW(2025) → 약 400MW(2029E, FERC)"], "kr": "국내 AIDC(18.4GW 목표)도 같은 구조로 ‘민간 직접 설비 → 계통접속 → 국가 Grid’ 순으로 발주될 가능성이 높아 LS ELECTRIC·가온전선이 먼저, HD현대일렉트릭·효성중공업·대한전선이 뒤에 확인될 것이라는 분석이다."}, {"group": "AIDC 전력", "title": "정책은 ‘절차’만 줄인다: BTM이 먼저, FTM은 2028년부터", "period": "2025.12~2026.09", "lede": "미국 계통연계 61개월 중 정책이 줄일 수 있는 것은 절차 45개월뿐이라, 물리 병목을 우회하는 계량기 뒤(BTM) 자체발전이 먼저 커지고 계통(FTM) 신규 발전은 2028년 이후 늘어나는 2단계 수요 구조가 예상된다.", "body": ["미국 신규 발전원은 접속신청(IR) → 계통영향평가 스터디 → 계통연계계약(IA) → 건설 → 상업운전(COD)을 거치며 2025년 기준 IR→COD 61개월이 걸린다. 이 중 IR→IA 절차가 45개월(중앙값), IA→COD 건설이 31개월이다(LBNL). FERC Order 2023(선착순 폐지·클러스터 스터디·철회 위약금)과 PJM RRI·MISO/SPP ERAS 같은 패스트트랙은 절차 구간을 줄일 수 있지만 건설과 초고압 변압기·가스터빈(리드타임 최소 5년) 같은 물리 병목은 건드리지 못한다.", "반면 BTM은 계통 인허가 자체를 건너뛴다. PJM Co-location Order(2025.12)는 발전소 직결 대형부하에 표준 송전서비스·요금 체계를 만들어 약 2년 걸리던 인허가를 2~3개월로 줄였다. BTM 데이터센터는 초고압 변압기가 필요 없고 부지 내 배전변압기·배전반과 자체발전 출력 변동을 흡수할 ESS만 있으면 가동할 수 있다. 미국 데이터센터 BTM 발표는 약 90GW(59건, 92%가 2025년 이후 발표)지만 상업운전은 약 2GW에 그친 초기 단계다.", "규제는 대형 부하에 비용을 직접 물리는 방향으로 모였다. FERC는 Talen-AWS 원전 직연결 증량안을 비용 전가 이유로 거부했고, 텍사스 SB6는 75MW 이상 부하에 송배전 비용 직접 부담·비상시 공급 차단·자체 백업 발전 가동을 의무화했으며, 2026년 3월 백악관 Ratepayer Protection Pledge로 빅테크 7곳이 필요한 전력을 직접 생산·조달하기로 했다. 6월 FERC Large Load Show Cause Order는 Co-location을 전국 RTO로 확대하고, NERC 연산부하 신뢰도 표준(12월 제출 기한)은 순간부하 대응을 법적 의무로 만들어 2H27 이후 안정용 대형 ESS를 사실상 의무화할 수 있다.", "2028년 전후에는 두 번째 물결이 온다. Order 2023으로 정리된 클러스터(PJM 전환물량 140GW, 신규 신청 220GW)가 IA를 통과하면 IA 체결 후 미준공 발전원 549GW(태양광 256·ESS 161·풍력 76·가스 45GW) 중심으로 태양광+ESS FTM 연결과 초고압 변압기·차단기·초고압 케이블 발주가 늘어난다. 리포트는 AIDC 수요가 공급을 압도해 BTM과 FTM이 서로 잠식하기보다 누적될 것으로 본다.", "그래서 미국 노출도 기준 수혜 강도는 2028년 이전에는 배전망 > ESS > 송전망 > 태양광 순으로 제시되며, 이후 순위가 바뀔 수 있다. 송전 기자재 업체에게 정책 완화는 급성장 요인이라기보다 가격결정력·수주잔고 방어력 강화 요인으로 작용한다."], "table": {"cols": ["정책", "구분", "시행·효과 시점", "산업 영향"], "rows": [["Order 2023", "공급측(FERC)", "2023.11 발효 → 2028년 효과", "FTM 태양광+ESS·송전 기자재 수요 증가"], ["발전 패스트트랙(RRI·ERAS·EIT)", "공급측(RTO)", "2025.2~2027말 일몰", "대부분 가스발전 → 가스터빈·초고압변압기"], ["Co-location Order", "수요측(PJM)", "2025.12 확정", "BTM 데이터센터 → ESS·배전 즉시 수요"], ["Large Load Show Cause Order", "수요측(전 RTO)", "2026.6 발령, 2027 확정", "자체발전+ESS 비중 확대"], ["NERC 신뢰도 표준(RD26-7)", "수요측", "2026.12 제출, 2H27 효과", "안정용 대형 ESS 의무화"], ["DOE SPARK", "재정", "2026~", "재도체화(가공선) 중심, 지중선 영향 제한"]]}, "bullets": ["2025말~2028: 가스발전+ESS·연료전지 BTM → ESS·배전반·배전변압기·버스덕트·MV 케이블·특수변압기", "2028~: 태양광+ESS FTM → 태양광 모듈·초고압변압기·차단기·초고압케이블·UPS/BBU", "IR→IA만 줄고 IA→COD가 그대로면 물리 병목 지속 신호", "카니발라이제이션 우려: FTM 연결이 쉬워지면 BTM ESS 탑재량이 줄 수 있다는 반론"], "kr": "BTM 단계에서는 LS ELECTRIC(배전), 산일전기(특수변압기), 가온전선(버스덕트), LG에너지솔루션·삼성SDI(ESS)가 먼저 반응하고, 2028년 이후 FTM 단계에서 초고압 변압기·초고압 케이블·한화솔루션(태양광)으로 수요가 이동한다는 시계열 틀이다."}, {"group": "AIDC 전력", "title": "데이터센터 착공 지연의 네 가지 원인과 ERCOT로의 이동", "period": "2026.06~2026.08", "lede": "지연은 수요 부족이 아니라 병목의 문제이며, 원인별로 풀리는 시점이 다르고 그 사이 업계는 텍사스와 자체 발전으로 우회로를 찾고 있다.", "body": ["하이퍼스케일러 CAPEX는 2026년 4사 약 6,790억달러(+81%)로 계속 상향됐지만 실제 착공·가동은 크게 밀렸다. 2025년 계획 9.1GW 중 5.8GW만 가동됐고(36% 지연), 2026년 가동 예정 16.2GW 중 실제 건설 중인 것은 약 5GW이며 25%는 전력 수급 계획조차 없다(Sightline Climate). 2024~2026.1 발표 프로젝트 148GW 중 건설 중 21GW, 운영 12GW에 그친다.", "원인은 네 가지로 나뉜다. ①계통 접속 지연(버지니아 100MW 이상 전력공급 대기 3~4년 → 4~7년), ②변압기 등 전력기기 병목(리드타임 최대 4~5년), ③주민 반대(지역 반대로 지연·중단된 프로젝트 약 1,500억달러, 버지니아 반대 여론 24% → 59%, 62건 제한 규제 시행), ④PJM 등 규칙 공백이다. 계통 접속과 정책은 Order 2023·PJM 신규 규칙·SB6가 정착되면 6개월~1년 뒤 개선되고, 변압기 병목은 주요 업체 증설이 끝나는 2028년 전후 일부 완화, 주민 반대는 요금 전가 방지 제도가 완충한다는 시간표다.", "우회로 첫째는 입지 이동이다. ERCOT는 접속을 먼저 허용하고 혼잡 시 출력 제한으로 관리하며 공사 범위가 로컬망에 그쳐 계통 연결에 3~4년이면 되지만, 13개 주의 PJM은 그리드 전체 안정성을 우선 검토해 6년 이상 걸린다. 그 결과 텍사스 개발 파이프라인은 22.5GW로 다른 주의 약 3배이고, ERCOT 대형부하 접속요청은 약 410GW(DC 87%)에 달한다.", "둘째는 자체 발전과 Co-location이다. 전체 계획 용량의 약 27~30%(Cleanview 90GW)가 자체발전을 계획하고, 미국 계획·건설 중 가스발전 252GW 중 약 100GW가 데이터센터 온사이트향이다. 현재는 가스엔진·항공기 파생형 터빈이 주력이지만 캠퍼스가 GW급이 되면 대형 가스터빈·원전까지 검토된다. 재생에너지 출력제한으로 버려지는 전력을 싸게 받는 Co-location도 텍사스에서 확산 중이다. 장기적으로는 kg당 발사비가 200달러 수준이 되면 우주 데이터센터 인프라가 지상보다 싸질 수 있다는 계산까지 나왔다.", "투자 사이클 순서로 보면 빈 부지에는 전력 인프라가 가장 먼저, 건물·냉각이 다음, 서버가 마지막에 들어간다. 따라서 발전·전력기기 수주가 먼저 오르고 반도체 실적이 뒤따르며, 착공 지연 우려 국면에서는 전력 인프라가 반도체 대비 상대 조정을 받는다. 착공 전환율 상승과 PJM 규칙 승인(2H26 예상)이 재가속 신호다."], "table": {"cols": ["RTO", "2024 대기(GW)", "2025 대기(GW)", "증감"], "rows": [["CAISO", "273", "192", "-30%"], ["ERCOT", "346", "408", "+18%"], ["ISO-NE", "46", "15", "-68%"], ["MISO", "448", "382", "-15%"], ["NYISO", "78", "69", "-12%"], ["PJM", "211", "161", "-24%"]]}, "bullets": ["2010~2019 접속 신청 중 2024년 실제 운영 비중 13%(LBNL) — 신청량은 잠재수요일 뿐", "텍사스 SB6: 75MW 이상 부하 송배전비 직접 부담·비상시 차단·자체 백업 의무", "Fermi America Matador: 가스 6GW(2027)+5GW, 대형원전 4.4GW(2032), 태양광+ESS 1.6GW 계획", "PJM Co-location·BYOP 규칙 FERC 최종 승인 2H26 예상"], "kr": "두산에너빌리티(가스·스팀터빈), HD현대중공업(중속엔진), OCI홀딩스(텍사스 발전 자산·비중국 폴리실리콘), 온사이트 주변 배전의 LS ELECTRIC·산일전기가 우회로 수요의 국내 연결점이다."}, {"group": "AIDC 전력", "title": "온사이트 발전원 경쟁: 가스터빈·중속엔진·SOFC·PAFC", "period": "2025.12~2026.09", "lede": "가스터빈이 막힌 사이 단기 온사이트 시장은 빠른 확장성·부하추종·낮은 MW당 단가를 갖춘 중속엔진과, 고효율·저배출·DC 출력의 연료전지가 나눠 가질 가능성이 높다.", "body": ["온사이트 하이브리드 전원의 기본 구성은 가스터빈(100~300MW 선가동)이 베이스로드를 맡고, SOFC(5~20MW 모듈)·가스엔진·BESS(50~200MW)·울트라커패시터 같은 부하추종이 빠른 소용량 전원과 전력품질 설비를 조합하는 것이다. 계통은 필요 전력의 5~10% 백업으로 역할이 바뀔 수 있다. 중요한 점은 온사이트가 계통을 대체하는 것이 아니라 가동 시점과 계통 연결 시점을 분리하는 전략이라 초고압 수요를 줄이지 않는다는 것이다.", "초기 시장은 Bloom Energy의 SOFC와 Caterpillar 고속엔진(1.5MW 병렬)이 열었다. Bloom은 주문 후 90일 내 설치(Oracle향 55일)를 앞세워 AEP 1GW, Oracle 최대 2.8GW 계약을 확보했고 CAPA를 2026년 말 2GW로 두 배 늘린다. 1Q26 제품 매출 +208%, 2026 매출 가이던스 34~38억달러로 상향했다. SOFC는 효율 50~60%, DC를 직접 생산하고 무효전력 공급·폐열 냉각(흡수식 냉동기)까지 가능하지만 MW당 35~40억원으로 비싸고 스칸듐 등 희토류 소재 리스크가 있다.", "중속엔진은 선박용 4행정 엔진을 병렬 배치해 500MW~1GW급 전원을 빠르게 구축한다. 효율 약 45~50%, 부하추종이 매우 우수해 GPU 학습량·냉각부하에 따라 변동하는 AI 데이터센터에 적합하고, MW당 10~24억원으로 저렴하며 선박·발전 시장에서 검증된 AS 체계가 있다. Wärtsilä는 2025년 7월 첫 데이터센터 수주 이후 누적 2.4GW, HD현대중공업은 684MW(20MW급 33기, 6,271억원)를 따냈다. 1GW 데이터센터에는 10MW급 100기 이상 또는 20MW급 50기 이상이 필요하다.", "PAFC는 효율 40~43%로 낮지만 운전 안정성과 저소음·저배출로 도심형·보조전원에 맞고 희토류를 쓰지 않는다. 다만 두산퓨얼셀은 미국 판매가 HyAxiom(㈜두산 판매법인) 경유라 LTSA를 직접 하지 않아 수익성 상한이 있고, 초기 스택 품질 이슈로 장기 내구성 확인이 필요하다는 지적이 있다. 리포트는 2030년 말 데이터센터 전력의 약 33%가 온사이트로 공급되고 온사이트 시장이 약 60GW(연 12~15GW 설비 수요)가 될 것으로 추정했다.", "경제성은 계통 요금과의 비교로 판단한다. 미국 상업용 전기요금 13~14센트/kWh 대비 복합가스 LCOE 약 8.1센트, Bloom PPA 약 9.9센트이며, OBBBA로 연료전지 ITC 30%(2032년까지)·ESS ITC 30%(2035년 말까지)가 유지됐다. 이중화·탄소비용을 감안해도 온사이트 비용이 계통 연결 비용과 큰 차이가 없어 채택이 늘고 있다."], "table": {"cols": ["항목", "중속엔진", "SOFC", "PAFC", "소형 가스터빈"], "rows": [["핵심 포지션", "대용량·단기 전력난 대응", "고효율·친환경 프리미엄", "열병합 강점", "열병합·보조전원"], ["전기효율", "약 45~50%+", "50~60%", "40~43%", "25~40%"], ["부하추종성", "매우 우수", "보통~낮음", "낮음", "보통"], ["MW당 가격(추정)", "10~24억원", "35~40억원", "25~30억원", "-"], ["배출·소음", "CO2·NOx, 소음 큼", "낮음", "낮음", "CO2·NOx"], ["대형 AI DC 적합도", "높음", "높음", "중간", "중간"], ["도심 입지 적합성", "낮음~보통", "높음", "높음", "보통"]]}, "bullets": ["미국 확정 온사이트 발전원 비중: 가스터빈 55%, 연료전지 38%, 가스엔진 4%, 태양광 3%(2025, Bloom Energy)", "2030년 100% 온사이트 전원 사용 예상 DC 비중 27%(2025.4) → 33%(2025.11 설문)", "선두 업체 멀티플 프리미엄이 후발주자로 확산되는 패턴: GE Vernova → Caterpillar → FTAI", "리스크: 천연가스 가격·공급 변동 시 연료전지 리드타임 우위 희석, 중속엔진 부상에 따른 연료전지 경쟁"], "kr": "HD현대중공업(엔진)·HD현대마린솔루션(AS)·HD현대일렉트릭(발전기) 그룹 체인, 두산퓨얼셀(PAFC/SOFC), Bloom 공급망(LS ELECTRIC 배전 패키지 3,190억원, 산일전기 특수변압기 약 750억원, 비나텍 슈퍼캐퍼시터 180억원, 코세스 장비 367억원, 한선엔지니어링 모듈 700억원, 서진시스템 플러밍 모듈)이 연결점이다."}, {"group": "AIDC 전력", "title": "ESS를 배터리가 아닌 전력기기로 보기", "period": "2026.03~2026.09", "lede": "ESS는 재생에너지 간헐성 보완재에서 데이터센터 BTM 핵심 인프라로 격상됐고, 배터리는 화학이 아니라 담당 시간축과 설치 위치로 나눠 봐야 수혜를 판단할 수 있다.", "body": ["AI 데이터센터는 추론·학습 피크로 수십 MW를 수 초 간격으로 오르내리는데(Power Swing), 망 접속 허가 기준은 평균이 아닌 최대 피크다. ESS가 피크를 깎으면 접속 승인이 쉬워지고, 800VDC 구조에서는 중앙정류기가 단일 실패지점이 되므로 DC 버스에 대용량 ESS를 직결해 중앙 UPS 역할을 맡긴다. Google은 파워 쉐이핑으로 전력 변동폭을 약 50% 줄였다고 밝혔다.", "시간축으로 나누면 sub-ms~ms는 커패시터 셸프, 수 초~수십 초는 BBU(랙), 1~15분은 UPS(전기실), 0.5~4시간은 BTM BESS(캠퍼스 피크저감), 4~8시간 이상은 FTM BESS(계통 서비스)가 담당한다. 서로 대체재가 아니라 보완재다. BBU는 출력밀도·응답속도가 중요해 NCM/NCA 원통형 셀을 쓰지만 랙 밖 사이드카로 빠지면 LFP로 바뀔 수 있고, UPS·BESS는 안전·비용 면에서 LFP가 표준이 되고 있다.", "성장률은 높다. 북미 ESS 신규 설치는 2025~2030년 연 28.9%, 그중 데이터센터향 BTM ESS는 연 약 60% 성장이 추정되고(리포트 추정), 데이터센터용 리튬 BESS 배터리 출하는 15GWh(2025) → 69GWh(2027E) → 300GWh(2030E)로 전망된다(GGII). 미준공 IA ESS 161GW는 약 400GWh에 해당한다.", "다만 가치 배분은 셀보다 시스템·부품 쪽에 유리할 수 있다. 북미 셀 생산능력은 IRA 투자로 충분하고 EV 부진분을 ESS가 상쇄하는 구도라, 가치가 협상력을 가진 부품·시스템 업체와 수용가 맞춤 SI(소프트웨어 GPM 80% 상회)로 이동한다는 시각이다. FEOC·OBBBA·ITC로 블록화된 시장에서 CHARGE Act(2026.2 발의)가 원격 모니터링 소프트웨어까지 규제하면 비중국 제조 역량과 자체 운용 소프트웨어를 가진 업체가 유리해진다.", "한국 내수도 새 축이 생겼다. 12차 전기본 기준 재생에너지 236GW를 지어도 피크 실효용량이 부족해 태양광·풍력 연계 ESS 약 220GWh(연 약 15.6GWh 배터리 수요)가 필요하다는 추정이 나왔고, ESS 중앙계약시장 1·2차 누적 6.8GWh(삼성SDI 56%, SK온 25%, LGES 19%)가 이미 발주됐다. 평가 기준이 가격에서 국내 공급망 기여로 이동하며 국내 LFP 양극재·전해액·분리막 생태계가 미국 PFE 규제 대응 후방 기지가 된다."], "table": {"cols": ["구분", "역할", "지속시간", "핵심 스펙", "후보 화학"], "rows": [["BBU(랙/서버)", "순간정전·전환 브릿지", "ms~수십 초", "초고출력, ms 응답", "NCM/NCA 원통형, (랙 외부 시) LFP"], ["UPS(모듈/룸)", "발전기 인계 전 가교", "1~15분", "고신뢰, 핫스왑", "LFP 확대, VRLA 레거시"], ["BTM BESS(캠퍼스)", "피크저감·요금절감·DR", "0.5~4시간", "RTE, LCOE, EMS", "LFP/LMFP, Na-ion"], ["FTM BESS(계통)", "주파수조정·에너지 시프팅", "4~8시간+", "그리드코드, 장기 보증", "LFP, LTO, Iron-Air 가능성"]]}, "bullets": ["UPS 요구 런타임: 하이퍼스케일 1~2분, 클라우드 약 5분, 금융 10~15분", "BESS 냉각은 2026년 액랭으로 본격 전환(셀 간 온도편차 2~3°C 이내)", "Fluence 데이터센터향 파이프라인 36GWh, 1Q26 신규수주의 72%가 미국향", "국내 셀 3사 LFP ESS 캐파 5GWh 미만, 10GWh당 CAPEX 약 1.5조원"], "kr": "셀(삼성SDI·LG에너지솔루션·SK온), 시스템·부품(서진시스템 인클로저, 한중엔시에스 냉각, 신성에스티 히트싱크·버스바), 소재(엘앤에프·포스코퓨처엠 LFP 양극재), PCS·배전(LS ELECTRIC), 개발(SK이터닉스)로 이어지는 체인이다."}, {"group": "전선·HVDC", "title": "해저케이블: 과점·포설선·아시아 시장 구조", "period": "2025.10~2026.09", "lede": "상위 4개사가 약 85%를 차지하는 과점 속에 수요가 빨라지면서 대형 포설선과 턴키 역량이 수주·가격 결정력을 가르고, 아시아는 한국 업체의 과점 시장이 되고 있다.", "body": ["해저케이블은 고도의 기술과 장기 신뢰성 기반 거래가 필요해 진입장벽이 높다. 일본 내수를 제외하면 상위 4개사가 글로벌의 약 85%를 차지하고(IEA), 유럽 3사(NKT·Prysmian·Nexans)가 HVDC 케이블 생산슬롯의 약 3분의 2를 점유해 2030년까지 수주를 채웠다. 선두 업체는 2028~2029년 물량을 이미 확보해 잔고를 캐파에 맞춰 조절하는 선별 수주로 가격 결정력을 유지한다. 케이블 조달 리드타임은 1~2년에서 2~3년으로 늘었다(IEA).", "경쟁의 핵심 설비는 포설선이다. 개발사는 책임 소재를 분명히 하려고 케이블 자재와 포설을 턴키로 맡기려 하므로 포설선이 없는 업체는 불리하다(Sumitomo는 포설선이 없어 자재만 납품). 상위 제조사는 모두 1만 톤급 이상 DP3 CLV를 보유·건조 중이며(NKT Eleonora 23,000톤, Prysmian Alessandro Volta 19,000톤, Nexans Electra 13,500톤), 벨기에 Jan De Nul은 28,000톤급까지 확보했다. 미국은 존스법 때문에 자국적 CLV가 1~2척뿐이라 외국 고사양 선박과 미국적 바지의 협업이 필수다.", "아시아(중국 제외) 해상풍력 케이블 발주는 2025년 0.7조원에서 2032년 4.4조원(CAGR +29.5%)으로 커질 것으로 추정됐다. 유럽은 2025~30년 신규 해상풍력 51.4GW로 아시아의 약 6배이고 연평균 해저케이블 TAM 약 100억유로에 비해 유럽 3사 매출은 56억유로에 불과해, 빅4가 아시아로 캐파를 돌릴 유인이 작다. 그 사이 국내 업체는 아시아에 2조원 이상(대한전선 1.12조원, LS전선·LS마린 0.995조원)을 투자해 합산 점유율 약 73%의 과점이 예상된다.", "한국 시장(아시아 수요의 약 50%)은 두 가지 규제로 사실상 국내 업체 100%다. 2025년부터 풍력 입찰에 핵심자원 공급망 안보지표가 생겨 중국산 케이블 사용 프로젝트가 탈락하고, 선박법 제6조(카보타지)로 외국 국적 포설선 진입이 어렵다. 대만은 LS전선이 라운드2 전 프로젝트에 납품했지만 NKT-Walsin 대만 공장이 2027년 가동되면 경쟁이 심해지고, 베트남은 LS에코에너지가 페트로베트남 자회사 PTSC와 JV를 추진한다.", "국내 전선업의 차별화는 결국 턴키·해외 현지화다. LS전선은 TenneT(약 2.5조원)·National Grid 프레임워크로 동해 공장 물량이 2031년까지 찼고 미국 버지니아 공장(6.81억달러, 1Q28 양산)을 짓고 있다. 대한전선은 당진 해저 2공장(640kV HVDC, 2027 가동)·CLV 2척·대한오션웍스 인수로 턴키를 갖췄고 2026년 6월 국내 첫 500kV HVDC를 수주했다. 매출은 구리값에 출렁이므로 수주잔고·EBITDA 마진으로 봐야 한다."], "table": {"cols": ["보유사", "선박", "톤급", "DP", "취항"], "rows": [["Jan De Nul", "Fleeming Jenkin / William Thomson", "28,000", "DP3", "2026~2027"], ["NKT", "Eleonora", "23,000", "DP3", "2027"], ["Prysmian", "Alessandro Volta", "19,000", "DP3", "2027"], ["Nexans", "Electra", "13,500", "DP3", "2026"], ["LS마린솔루션", "신조(Tersan 건조)", "13,000", "DP3", "2028"], ["LS마린솔루션", "세계로 / GL2030(증설)", "8,300 / 7,000", "DP2", "운영 / 2026"], ["대한전선", "PALOS 등 2척", "4,400급", "-", "운영"]]}, "bullets": ["해상풍력 케이블 4개 파트: 내부망 자재·포설, 외부망 자재·포설", "국내 1GW당 케이블 자재+포설 약 8,000억원, 안마해상풍력(532MW) 계약 총액 4,527억원", "NKT-Walsin 대만 공장 가동 시 국내 업체 대만 점유율 60% → 20% 하락 가능성(리포트)", "유럽 3사 평균 book-to-bill 5.4년(2Q25) — 5년 이상이면 증설 후에도 공급 과잉 우려 낮음"], "kr": "LS전선(비상장, 모회사 LS)·LS마린솔루션(포설)·LS에코에너지(베트남)·가온전선(내부망 진출 계획)의 LS 체인과 대한전선(당진·CLV)이 아시아 과점의 주체다."}, {"group": "전선·HVDC", "title": "서해안 HVDC 에너지고속도로: 10년짜리 연속 발주", "period": "2025.10~2026.09", "lede": "호남은 남고 수도권은 모자라는 구조를 해저 HVDC로 잇는 8GW·약 1,070km 사업이 2030·2036·2038년 준공으로 이어져, 2028~2038년 국내 해저케이블·변환설비 수요의 기반이 된다.", "body": ["출발점은 지역 간 전력 불균형이다. 2023년 수도권 전력자급률은 65.4%, 호남은 129.4%이고 수도권은 전력수요의 44%를 쓰지만 발전설비는 23%에 불과하다. 호남→수도권 육상 345kV 선로가 2개뿐이라 한전은 2024년 9월 호남 전 변전소를 계통관리변전소로 지정하고 신규 발전 접속을 2032년까지 제한했으며, 육상 송전선은 평균 70개월씩 지연됐다(북당진-신탕정 345kV 150개월, 동해안-신가평 HVDC 66개월).", "제11차 장기송변전계획은 서해안 HVDC를 2개 노선 655km에서 4개 구간 약 1,070km(편도)·8GW로 늘렸다. 한전 추정 사업비는 약 12조원이지만 1단계(새만금-서화성, 왕복 440km, 2.8조원: 컨버터 1.0·변전소 0.6·송전 1.2조원)를 기준으로 단순 환산한 것이어서, 2·3단계 구간이 더 긴 점을 반영해 길이 비례로 환산하면 13.6조원이 된다. 리포트마다 7.9조원(정부 초기 발표), 약 11조원(1단계 사업비 추정), 12~13.6조원으로 숫자가 다르니 기준을 확인해야 한다.", "발주 일정은 해저케이블 특성상 앞당겨진다. 해저케이블은 경로 조사·생산·포설에 4~5년이 걸려 2026년 해저케이블 사업자 선정, 2027년 변환설비(CTR 국산화 포함) 사업자 선정, 2028년 포설 시작, 2030년 1단계 준공이 목표다(30대 선도프로젝트 지정으로 1년 단축). 2028년 포설에 맞춰 국내 13,000톤급 CLV가 취항할 예정이고, 해외 대형 프로젝트(베트남-싱가포르 2030~2033년 시공 추정)는 국내 1·2단계 사이 공백기에 배치될 수 있다.", "정책 축도 ‘목표 선언’에서 ‘집행’으로 바뀌었다. 전력망특별법(2025.9)은 약 35개 인허가 일괄 처리·예타 면제·주민 보상 확대로 345kV 건설기간을 약 13년에서 9년으로 줄이는 것을 목표로 하고, 국민성장펀드(150조원)는 저리 대출을, 해상풍력특별법(2026.3)은 정부 주도 계획입지로 개발 리드타임을 10년에서 6.5년으로 줄이는 것을 목표로 한다. 2026년 8월 개정으로 민간이 송전망을 지어 한전에 넘기는 BT 방식도 2029년 말까지 허용됐다.", "기술적으로는 HVDC가 송전 용량 400MW 이상, 거리 40~100km 이상(해저)에서 HVAC보다 경제적이다. 국내 HVDC는 주로 전류형(LCC)이었으나 최근 프로젝트는 전압형(VSC)이 채택되고 있어 글로벌 Top-tier와의 기술 제휴 여부가 변환설비 수주 경쟁 구도를 좌우한다. 동해안 HVDC(EP1 4GW)는 대부분 지상·지중, 서해안은 대부분 해저라는 차이도 있다."], "table": {"cols": ["단계", "구간", "편도/왕복 길이", "용량", "준공", "사업비"], "rows": [["1단계", "새만금-서화성", "220/440km", "2GW", "2030", "2.8조원(한전)"], ["2단계", "신해남-당진", "290/580km", "2GW", "2036", "3.69조원(길이 환산)"], ["3단계", "신해남-서인천", "350/700km", "2GW", "2038", "4.45조원(길이 환산)"], ["3단계", "새만금-영흥", "210/420km", "2GW", "2038", "2.67조원(길이 환산)"], ["합계", "4개 구간", "약 1,070km(편도)", "8GW", "-", "12조원(한전) / 13.6조원(환산)"]]}, "bullets": ["국내 HVDC 송전선로 492 → 3,818C-km(2023→2038, 약 6.8배)", "HVDC 케이블 km당 약 60억원(자재 35억·포설 25억) 추정", "LS ELECTRIC 동해안 HVDC CTR 40대 5,610억원, LS전선 완도-제주 3연계 90km 2,300억원 수주 이력", "HVDC 변환용 변압기 국산화 R&D 약 1,200억원(2025~2027)", "리스크: 사업자 선정·경과지(해저 vs 육상) 결정 지연, 사업비 변동"], "kr": "LS전선·LS마린솔루션(외부망 턴키), 대한전선(500kV HVDC 첫 수주), LS ELECTRIC(CTR·GE Vernova VSC 합작), 효성중공업(창원 HVDC 변압기 공장)이 핵심 수혜 후보이며, 1998년 해남-제주 이후 국내 HVDC는 전량 국내 업체가 수주했다."}, {"group": "발전·전원믹스", "title": "공급이 수요를 정한다: 데이터센터 부하의 3단계 증가", "period": "2025.11~2026.06", "lede": "데이터센터 수요는 넘치지만 실제 연결 가능한 부하는 가스터빈·원전 같은 24/7 디스패처블 전원과 EPC 인력의 공급 속도가 결정하며, 그 계단은 2028년과 2030년이다.", "body": ["데이터센터는 24시간 일정 부하가 필요해 재생에너지+ESS로 대응하기 어렵다. 재생에너지는 피크 실효용량이 낮아(PJM 고정형 태양광 ELCC 8~12%) 퇴출되는 석탄 1GW를 대체하려면 명목 10GW 이상이 필요하고, EPA 탄소 규제로 기저전원은 퇴출되고 있다. 리포트 추정으로 미국 디스패처블 발전원의 향후 10년 생산능력은 연 약 27GW(가스터빈 20·원자로 5·연료전지 2GW 등, 최대 32GW)인데 피크 부하는 2028년 이후 연 33GW 이상 늘어 공급을 앞지른다.", "가스터빈이 1차 병목이다. 3사 과점에 2025년 말 주문 110GW 대비 제조능력 60~70GW, GE Vernova의 2030년까지 잔여 슬롯은 약 10GW이고 신규 대형 주문의 인도는 2030년 이후로 제시된다. 4사(GEV·Siemens·MHI·두산) 생산능력이 약 50GW에서 2028년 약 80GW로 늘면 데이터센터 부하 증가도 연 15GW에서 20GW 이상으로 한 단계 올라설 수 있다. EPC도 병목이다. 북미 발전 EPC 업체는 10년 전 11개에서 4개로 줄었고 1GW 가스발전소는 공사 피크 시 최대 900명이 필요하다.", "그래서 부하는 계단식으로 는다. 리포트는 2028년까지 연 13GW(기존망·은퇴 예정 발전원 활용), 2030년까지 연 17GW(선확보 가스터빈·증설), 2030년 이후 연 20GW 이상(대형원전·SMR 가세)으로 추정한다. 구속력 계약 부하 158~168GW 중 2030년까지 가동 가능한 물량은 약 93GW(60%)이고, 향후 10년 연결 가능한 데이터센터는 신청 잔고의 약 30%에 그칠 것이라는 계산이다.", "역설적으로 이 병목이 전력기기 수요의 가시성을 늘린다. 유틸리티는 2031~2032년 납기 변압기를 선발주하고 가스터빈 제작사와 2031~2035년 인도분을 논의하고 있다. 또 데이터센터 부하 증가분 100을 가정하면 발전은 증가분 전부를 설비로 받아내지만 송전·배전으로 갈수록 기존 설비 활용 여지가 있어 신규 투자 비율이 낮아지므로, 성장 잠재력은 발전(원전+가스터빈) > 전선 > 전력기기 순이라는 서열도 제시됐다(밸류에이션 할인 폭은 반대로 전선 > 전력기기 > 발전).", "BYOP(Bring Your Own Power)와 ‘Gas + Nuclear’ 모델은 이 병목의 부산물이다. 데이터센터는 2~3년이면 짓지만 계통 연결은 7년 이상 걸려, 부지 내 가스발전(1~4년)으로 먼저 전력을 확보하고 이후 SMR(3~5년)로 무탄소 기저전원을 보강하는 하이브리드가 등장했다(Blue Energy: GE 가스터빈+BWRX-300). 최종 수요는 같아도 가스터빈과 SMR 설비 발주가 모두 발생해 발전 설비 투자 강도가 높아진다."], "table": {"cols": ["단계", "기간", "연간 데이터센터 부하 증가", "공급원"], "rows": [["1단계", "~2028", "약 13GW/년", "기존망 + 은퇴 예정 발전원 활용"], ["2단계", "~2030", "약 17GW/년", "선확보 가스터빈 + 제작사 증설(4사 약 80GW)"], ["3단계", "2030~", "20GW+/년", "대형원전(공기 6~7년)·SMR(3~5년) 가세"]]}, "bullets": ["가스터빈 리드타임 2~3년 → 4~6년, 가격 2027년 말 약 600달러/kW 전망", "글로벌 개발 중 가스발전 약 1,000GW 중 70% 이상이 터빈 공급사 미정(GEM)", "미국 신규 가스발전 계획: 2026~2030년 연 8.0/10.5/15.8/12.5/18.1GW(EIA)", "초고압 변압기 부족은 구조적, 발전원 부족은 SMR 대량생산·HALEU 확대로 중장기 해소 가능성이 있다는 대비"], "kr": "두산에너빌리티(가스터빈·스팀터빈·원전·SMR 모두 노출된 국내 유일 업체, 1Q26 가스터빈 10기·해외 누적 12기), HD현대중공업(엔진), 비에이치아이(HRSG)가 발전 설비 병목의 국내 연결점이다."}, {"group": "발전·전원믹스", "title": "원전의 전원 믹스 역할: 안보 프리미엄과 전력설비 수요", "period": "2025.11~2026.09", "lede": "호르무즈 쇼크로 에너지 트릴레마의 무게중심이 안보성으로 옮겨가며 연료 의존도가 낮은 24시간 기저전원으로서 원전이 재평가됐고, 이는 계통 연계용 변압기·BOP 전기설비 수요로 이어진다(노형·연료 상세는 원전 데스크).", "body": ["원전의 전원 믹스 가치는 세 가지다. 첫째 가동률: 재생에너지 설비이용률 20~30% 대비 원전은 글로벌 부하율 82~83%(2024)다. 둘째 한계비용: 신규 원전 LCOE는 79~220달러/MWh로 높지만 가동 중 원전의 한계비용은 30~38달러/MWh로 매우 낮아 전력시장에서 가장 먼저 급전된다. 셋째 안보: 한국처럼 주변국과 대규모 인터커넥션이 없는 섬 전력망(에너지 수입의존도 80% 이상, 석탄+가스 50% 이상)은 외부 충격을 내부에서 흡수해야 해 연료비 비중이 낮은 기저전원의 가치가 크다.", "국내 유틸리티 손익으로 보면 원전은 한전의 가장 큰 비용 완충 장치다. 2025년 정산단가는 원자력 79원/kWh, LNG 384.6원/kWh로 약 5배 차이가 나고, 원전 이용률 1%p 상승은 한전 연 영업이익을 약 1,840억~4,600억원 개선하는 것으로 추정된다(리포트별 편차). 새울 3·4호기 준공, 고리 2호기 계속운전 재가동(2026.4), 고리 3·4호기(2026.12)·한빛 1호기(2027.3) 재가동이 원전 발전 비중을 32%(2026E)에서 37%(2027E)로 높일 것으로 전망된다.", "세계적으로는 원전·가스 비중 상향이 뚜렷하다. IEA WEO2025는 2035년 원전 설비 전망을 +7.4%, 가스 +6.4% 올리고 재생에너지는 −2.9% 낮췄으며, 이베리아 반도 대정전 이후 간헐성이 부각됐다. 미국은 2050년 400GW(2024년 100GW), 2030년까지 대형원전 10기 착공을 목표로 하고, 유럽은 벨기에 탈원전법 폐지·스페인 폐쇄 철회·이탈리아 재도입 등으로 회귀 중이다. 한국은 12차 전기본에서 원전 9기 계속운전과 신규 원전 2기 검토가 제시됐다.", "전력설비 관점에서 원전 1기는 발전기 승압 변압기(GSU)·주변압기·주제어반·345kV 이상 계통 연계 설비를 요구한다. HD현대일렉트릭은 국내 최초 원전용 Q-Class를 획득했고 효성중공업은 원전용 345kV 변압기를 개발했으며, 원전 BOP(복수기·급수가열기·펌프·밸브·케이블·계측제어)는 1기당 약 1~1.5천억원 수주 규모로 추정된다. 장거리 대용량 원전 전력을 보내려면 765kV·HVDC 같은 초고압 송전이 필요하다는 점도 송변전 수요와 연결된다(APR1400 2기 전력을 350km 보내는 경제적 전압 약 956kV 계산).", "기존 원전의 수명연장(LTO)도 설비 수요원이다. 미국 가동 94기 중 86기가 60년, 9기가 80년 운전 인가를 받았고, LTO는 신규 건설 대비 총비용을 50% 이상 절감하며 1기당 10~20억달러(500~1,100달러/kW)가 40~60년 구간에 집중 투입된다. 반면 원전 경제성은 공기와 금리에 민감해 공기가 5년에서 10년으로 늘면 건설중 이자(IDC) 비중이 18.7%에서 32.4%로 커지고, 자본비용이 5%에서 10%로 오르면 LCOE가 2배 이상이 된다."], "table": {"cols": ["발전원", "건설기간", "탄소배출(gCO2/kWh)", "LCOE(달러/MWh)", "특성"], "rows": [["태양광", "1~4년", "0", "60", "변동"], ["육상풍력", "2~5년", "0", "50", "변동"], ["해상풍력", "3~7년", "0", "110", "변동"], ["원전(신규)", "5~15년", "0", "90", "급전 가능"], ["원전(재가동)", "2~5년", "0", "60", "급전 가능"], ["석탄화력", "3~6년", "960", "80", "급전 가능"], ["가스 복합화력", "2~4년", "390", "80", "급전 가능"], ["가스 단순화력", "1~3년", "620", "220", "급전 가능"], ["전력망 연결", "3~7년 이상", "-", "-", "-"]]}, "bullets": ["원전 발전비중 32%(2026E) → 37%(2027E) 전망(리포트)", "11차 전기본: 대형 원전 2기·SMR 1기 신규, 노후 석탄 28기(약 14.1GW) LNG 전환", "빅테크 원전 PPA는 기존 원전 재활용 중심(Constellation 클린턴 1.1GW, 스리마일섬 재가동)", "원전 확대의 실질 제약: 전환·농축(러시아 제외 시 농축 능력 부족), 대형 RPV 단조"], "kr": "한국전력(원전 이용률이 이익 변수), 두산에너빌리티(주기기·터빈), 한전기술(설계), 한전KPS(정비·LTO), HD현대일렉트릭·효성중공업(원전용 변압기)이 전원 믹스 변화의 연결점이다."}, {"group": "발전·전원믹스", "title": "풍력 정상화: 설치량은 늘었는데 왜 돈을 못 벌었고 무엇이 바뀌었나", "period": "2026.04~2026.08", "lede": "최저가 경매와 고금리·공급망 충격이 밸류체인 이익을 빨아들였지만 터빈 판가·경매 제도·금리가 동시에 정상화되며, 터빈사 수주가 6개월~1년 시차로 국내 기자재 발주로 번질 국면이다.", "body": ["풍력은 디벨로퍼가 입찰·PPA로 전력 판매가를 먼저 확정하고 그 안에서 터빈·기자재·공사비를 회수하는 구조다. 유럽이 FiT에서 경쟁입찰로 넘어가며 무보조금·네거티브 비딩이 확산되자 낮은 판매가가 터빈·기자재 가격 인하 압력으로 전가됐고, 금리 상승과 원자재·물류비 급등이 겹쳐 2023년 영국 AR5 해상풍력 전면 유찰, Ørsted의 미국 Ocean Wind 1·2 중단(약 40억달러 손상)이 발생했다.", "이후 정상화가 진행됐다. 터빈 ASP는 저점 대비 30~50% 높은 수준에서 유지되고 Vestas(Power Solutions EBIT 마진 10.4%)·Nordex(EBITDA 10.3%)는 두 자릿수 마진, SGRE는 15개 분기 만에 흑자 전환했다. 영국은 AR7에서 예산 2배·상한가 인상(약 £113/MWh)·CfD 20년·계획 단계 입찰 허용·Clean Industry Bonus를 도입해 약 8.2~8.4GW를 낙찰시켰고, 독일은 주별 국토 2% 풍력 부지 의무화로 육상 인허가가 사상 최대(20.8GW)를 기록했다.", "수요도 반등했다. 2025년 글로벌 풍력 신규 설치는 165GW(+40%)로 사상 최대였고, 미국은 PTC·ITC 기한(2026.7.4 착공 또는 2027년 말 상업운전) 전 설치 러시로 7GW(+71%)를 기록했다. 세액공제 종료 후에도 미국 육상풍력은 연 10GW 내외가 유지되고 Full-Repowering 수요가 2029년 3GW로 늘 전망이다(Wood Mackenzie). 다만 미국 해상풍력은 트럼프 행정부의 임대 중단·공사 중단 명령으로 2027년 이후 불확실성이 크다.", "아시아에서는 대만이 라운드 3-3에서 현지화 규제(LCR) 평가를 사실상 폐지해 한국 하부구조물·타워·케이블 업체의 기회가 커졌고, 한국은 해상풍력특별법(2026.3)·2035년까지 연 4GW+ 입찰 로드맵(2030년까지 28GW 우선입찰)으로 공급망 가시성을 높였다. 그러나 국내 해상풍력 설치는 2024년 261MW에 불과하고 특별법 기반 기자재 발주는 2029년 이후 본격화될 가능성이 높다는 신중론도 있다."], "table": {"cols": ["항목", "변경 전", "영국 AR7"], "rows": [["경매 예산", "9억 파운드", "18억 파운드"], ["해상풍력 상한가격", "약 £102/MWh", "약 £113/MWh(2026년 가격)"], ["CfD 계약기간", "15년", "20년"], ["입찰 자격", "인허가 상당 수준 완료 필요", "계획 단계 프로젝트도 허용"], ["평가", "최저가 중심", "공급망 기여·실행 가능성 등 비가격 요소 확대"]]}, "bullets": ["풍력 밸류체인은 디벨로퍼 → 터빈 OEM → 기자재(타워·베어링·하부구조물) 순 후행", "미국 타워 경쟁사 철수(Broadwind)·축소(Arcosa)", "풍력 기자재 업체는 글로벌 터빈사 PER에 40~50% 할인을 적용하는 관행", "리스크: 2028년 이후 미국 세액공제 종료, 고금리 FID 지연, 유럽 경매 유찰 재발"], "kr": "씨에스윈드(타워·하부구조물, 글로벌 터빈 4사 고객), 씨에스베어링(GEV 86% → Vestas·Enercon 다변화), SK오션플랜트(대만 하부구조물 점유율 약 44%, 독일 BalWin5 해상변전소 자켓), 해저케이블 업체가 연결점이다."}, {"group": "유틸리티·요금", "title": "한전 이익은 왜 유가에 흔들리나: SMP 구조와 호르무즈 쇼크", "period": "2025.11~2026.09", "lede": "한전은 가장 비싼 한계발전기(대부분 LNG)의 변동비로 전력을 사고 정부가 정한 요금으로 팔기 때문에, 유가와 요금 결정의 시차가 이익을 좌우하며 2026년은 원가 하락기에서 원가 충격기로 급반전한 해였다.", "body": ["2025년 말까지는 원가 하락기였다. 브렌트가 1월 78달러에서 10월 64달러로 내렸고, 가스공사의 고가 중동 장기계약(카타르 492만톤·오만 406만톤)이 2024년 말 만료되며 11월 발전용 가스요금이 15.6원/MJ(YoY −21.1%), 9월 SMP가 YoY −18.7%를 기록했다. 리포트들은 2026년 한전 구입전력비가 34.7조원에서 30.3조원으로 줄어 영업이익이 약 18조원대로 늘 것으로 봤고, 7차례 요금 인상으로 평균 판가가 108원에서 170원/kWh로 올라 ‘유가 완충력’이 커졌다는 평가가 많았다.", "2026년 2월 말 미국·이스라엘의 이란 공습과 3월 호르무즈 해협 통항 통제로 상황이 뒤집혔다. 브렌트는 2월 69달러에서 4월 평균 101.5달러(한때 120달러), 두바이유 3월 고점 139달러, JKM은 1월 약 10달러에서 3월 최대 22달러로 뛰었고 환율도 1,400원대 후반이었다. 국내 LNG는 대부분 JCC 연동이라 5~6개월(다른 추정은 3~5개월) 시차로 SMP에 반영되므로, 한전 원가 충격은 3분기부터 시작돼 4분기에 피크를 맞고 4분기 영업적자 가능성까지 제기됐다(2H26 영업이익 약 0.8조원, −89.5% 추정).", "이번 충격이 2022년과 다른 점도 있다. 2022년에는 유가·아시아 LNG·미국 LNG·유연탄이 동시에 급등해 SMP 상한제 없이는 자본잠식이 가능했지만, 이번에는 유가 위주 상승이라 원가 충격이 상대적으로 작다. 한국은 조달처를 미국·호주로 다변화하고 하이브리드 산식을 늘려 중동 물량 비중을 30% 이상에서 20% 수준으로 낮췄다. 역설적으로 한전 매출이 100조원에 근접해 적자 폭이 제한되는 만큼 ‘버틸 수 있어서 요금이 안 오른다’는 시각도 나왔다.", "정책 비용은 조금씩 쌓이고 있다. 발전용 유연탄 개별소비세 환원(39.1→46원/kg), 4차 배출권 유상할당 확대(발전 15%→50%, KAU 연초 대비 +62.5%), 산업용 계절·시간대 요금 개편(약 0.5조원 인하 효과), 기후환경요금 9.0원/kWh 동결이 겹친다. SMP 상한제는 발동 조건(3개월 평균 약 165원/kWh) 근접 시 상한가 약 166.55원으로 추정돼 한전·발전사 모두 영향이 제한적이라는 평가다.", "하반기 이후 경로는 유가 하락 속도가 결정한다. 5월 미중 정상회담에서 양국이 해협 군사화에 반대하고 UAE가 OPEC·OPEC+에서 탈퇴(5.1 발효)해 독자 증산을 예고하면서 지정학 프리미엄의 점진 소멸과 유가 우하향(기본 70~80달러) 시나리오가 제시됐다. 원전 비중 회복(2027년 37%)과 재생에너지 확대가 SMP 상단을 낮춰 원가회수율이 2027년 131%(역사적 고점 107%)까지 오를 수 있다는 낙관론과, 요금 인상 가능성이 낮아 연말 실적 바닥을 확인한 뒤 접근해야 한다는 신중론이 공존한다."], "table": {"cols": ["주체", "원가 하락기(2025 하반기)", "원가 급등기(2026 호르무즈)", "경로"], "rows": [["한국전력", "유리", "불리(3Q 반영·4Q 피크)", "SMP → 구입전력비(비용의 40% 이상)"], ["지역난방공사", "유리", "중립~불리", "열요금은 민수용 요금 연동, 원료는 발전용 요금"], ["한국가스공사", "중립 이하", "해외이익↑·미수금↑", "해외 자원개발 유가 연동 vs 민수용 요금 동결"], ["민간 발전사(직도입·바이오매스)", "불리", "유리", "SMP 상승 대비 원료 단가 안정 시 스프레드 확대"], ["LPG 겸용 발전(울산GPS)", "-", "유리", "LNG-LPG 괴리 + SMP 상승 이중 효과"]]}, "bullets": ["리포트 추정 민감도: SMP 1원↑ −3,210억, 유가 1달러↑ −1,310억, 환율 10원↑ −1,750억, 원전 이용률 1%p↑ +1,840억~+4,600억원", "연료비조정요금은 3Q22부터 +5원/kWh 상한 유지(15분기 이상)", "SMP: 연초 100~110원 → 8월 148.4원 → 9/2 일평균 167.91원/kWh", "한전 누적 적자 47.5조원(2Q21~2Q23) → 이후 누적 이익 23.8조원(3Q23~3Q25)"], "kr": "한국전력이 원가 충격의 1차 흡수자이고, 같은 사건에서 SK가스(울산GPS)·SGC에너지(우드칩 바이오매스)·직도입 LNG 발전사는 반사이익 쪽에 선다."}, {"group": "유틸리티·요금", "title": "호르무즈 봉쇄와 동아시아 LNG 리스크: 누가 가격을 교란하는가", "period": "2026.03~2026.06", "lede": "LNG 가격을 끌어올리는 것은 공급 차질 자체보다 대체 물량을 급히 구해야 하는 구매자의 규모이며, 이번에는 유럽이 아니라 한·중·일이 그 진원지가 될 수 있었다.", "body": ["러-우 전쟁이 교과서다. 2021년 유럽은 가스 수입의 46%를 러시아에 의존했고 LNG 비중은 20%에 불과했다. 러시아가 수출을 제한하자 유럽은 2021년 하반기부터 LNG 선매입에 나섰고 2022년 LNG 수입이 74BCM에서 123BCM으로 67% 늘었다. LNG는 액화·수송 설비 제약으로 대부분 장기계약에 묶여 현물 물량이 적기 때문에, 이 추가 수요가 JKM을 반기 평균 9.4달러(1H21)에서 39.0달러(2H22)까지 끌어올렸다.", "이후 유럽은 러시아 비중을 13%, 중동 비중을 4%대로 낮추고 가스발전량도 467TWh에서 367TWh로 줄였다. 이번 봉쇄에서 유럽이 잃을 중동 물량은 약 11BCM으로 미국·노르웨이로 대체 가능한 수준이다. 반면 한·중·일은 중동산 LNG 비중이 각각 약 20%·30%·10%로, 봉쇄가 장기화되면 약 4,000만톤(55BCM)을 대체 조달해야 하는데 이는 과거 유럽이 대체한 약 70BCM에 근접한다. 카타르 LNG 수출의 약 93%가 호르무즈를 지나고 이는 세계 LNG 거래량의 약 20%다.", "이번 위기의 성격도 달랐다. 1973 금수·1979 혁명·1990 걸프전이 생산자의 공급 결정이었다면 2026년은 자원은 있으나 해상 이동로 자체가 군사적으로 차단된 ‘물류 봉쇄형’이었다. 3월 20일 하루 통과 선박이 2척까지 줄었고, 전쟁위험보험료는 선박가치의 0.5%에서 1% 이상으로, VLCC 운임은 사상 최고로 올라 유가보다 보험료·운임이 먼저 움직였다. 우회 파이프라인은 원유 중심이라 LNG·정제제품은 대체 수단이 거의 없었고, 카타르 라스라판 LNG 트레인 14개 중 2개가 완파돼 완전 복구에 최대 5년이 걸린다.", "국내 기업별 이익 경로는 갈렸다. LNG가 LPG보다 비싸질수록 LNG·LPG 겸용 발전소(SK가스 울산GPS)는 SMP 상승과 원가 우위를 동시에 누리고(러-우 전쟁기 2년 가동 가정 시 차익 약 1.2조원 추정), 가스공사는 유가 연동 해외 자원개발 이익이 늘지만 민수용 미수금도 함께 늘어난다. 실제로는 JKM이 6월물 약 17달러로 안정되고 중국 LNG 수입이 약 10% 줄어 아시아 수요 압력은 예상보다 완화됐다."], "table": {"cols": ["기간", "JKM 반기 평균(달러/mmbtu)", "배경"], "rows": [["2021 상반기", "9.4", "전쟁 전 정상 수준"], ["2021 하반기", "26.2", "러시아 수출 제한 우려로 유럽 LNG 선매입"], ["2022 상반기", "29.0", "전쟁 발발, 유럽 LNG 수입 급증"], ["2022 하반기", "39.0", "러시아 PNG 급감, 유럽 LNG 수입 123BCM"], ["2026년 3월", "약 15(고점 22)", "호르무즈 봉쇄"]]}, "bullets": ["한국 LNG 도입국 비중: 호주 32%, 말레이시아 16%, 카타르 15%, 미국 9%, 오만 4%(KITA)", "가스공사 장기계약 3,135만톤 중 카타르 610만톤(19.5%)", "IEA 전략비축유 4억배럴 방출 합의, 원유 공급 차질 규모 역사상 최대(약 13%)", "통항 정상화 판단 지표: 일별 통항 선박 수, 전쟁위험보험료율 0.5% 복귀"], "kr": "한국가스공사(미수금·해외이익), 한국전력(SMP), SK가스(울산GPS·LPG 조달처 중 중동 30% 미만)·E1이 직접 연결되며, 에너지 안보 가치가 원전·전력망 투자 논리를 강화했다."}, {"group": "유틸리티·요금", "title": "가스공사: 이익 정상화와 재무 정상화는 다르다", "period": "2025.11~2026.09", "lede": "해외 LNG가 이익 체력을 올렸지만 14조원대 민수용 미수금의 현금 회수 없이는 차입과 금융비용이 줄지 않으며, 용도별로 분리된 미수금은 민수용 요금 인상 외에 해법이 없다.", "body": ["가스공사의 국내 도매사업은 총괄원가 규제다. 요금은 원료비(LNG 도입가·환율 연동)+공급비(저장·기화·수송 비용과 투자보수)로 구성되고, 규제이익은 LNG 가격이 아니라 공급비에서 나온다(2026 요금기저 21.7조원 × 적정투자보수율 5.38% ≈ 1.17조원). 원료비 연동제로 요금이 정해지지만 정부가 민수용 인상을 유보하면 원가와 요금 차이가 손실이 아닌 ‘미수금’ 자산으로 쌓인다.", "미수금은 회계와 현금을 분리시킨다. 정산자산으로 인식돼 손익은 보호되지만 LNG 대금은 이미 현금으로 나가 차입으로 메워진 상태다. 민수용 미수금은 2020년 1,941억원에서 2021년 1.8조원, 2024년 14.0조원으로 70배 넘게 불었고 2Q26 13.5조원(총 원료비 미수금 14.2조원)이다. 사채 잔액 27조원, 이자발생부채 36조원 이상, 연간 이자비용 약 1.2조원이며 도시가스사업법상 부채비율 400% 기준도 이미 넘었다. 발전·산업용 요금을 올려도 해당 부문 미수금만 회수될 뿐 민수용은 줄지 않는다는 점이 한전(단일 손익 구조)과의 결정적 차이다.", "반대편에서는 해외 사업이 이익 레버리지를 키운다. GLNG·Prelude는 과거 손상차손으로 장부가가 각각 약 0.9조·0.7조원까지 낮아져 손익분기 유가도 내려갔고, LNG Canada(지분 5%, 2025.6 상업생산)는 1H26 영업이익 1,430억원이라는 새 이익원이 됐다. 해외사업 영업이익은 2025년 3,093억원에서 2026년 5,890억원, 해외 비중은 14.7%에서 26.2%(2027E)로 높아질 전망이다. 2022년 고유가기에는 해외 영업이익이 6,032억원(OPM 30.3%)이었다.", "재무 정상화 경로는 미수금 순감소 → 영업현금흐름 개선 → 차입금 감소 → 이자비용 감소 → 배당여력 → PBR 할인 축소 순이다. 리포트 추정으로 민수용 미수금 13.4조원을 2028년 말까지 전액 회수하려면 원료비 대비 +9.2원/MJ, 절반이면 +4.6원/MJ 가산이 필요하다. 2026년 5월 민수용 요금이 동결돼 3분기부터 미수금이 다시 늘 전망이고, 석유공사와의 에너지자원공사 통합 시 부실 승계 범위가 새로운 불확실성이다."], "table": {"cols": ["회수 시나리오(2028년 말까지)", "회수 규모", "원료비 대비 필요 인상"], "rows": [["①", "13.4조원(전액)", "+9.2원/MJ"], ["②", "6.7조원", "+4.6원/MJ"], ["③", "4.5조원", "+3.1원/MJ"]]}, "bullets": ["총차입금 40.6조(2024) → 36.5조원(2025)", "해외 지분: LNG Canada 5%, 모잠비크 Area 4 10%, GLNG 15%, Prelude 10%, 미얀마 8.5%", "금리 하락 시 적정투자보수율이 낮아져 규제이익 감소", "밸류 판단: 해외사업이 EPS를, 미수금 현금화가 멀티플을 움직인다"], "kr": "한국가스공사 단독 이슈지만, 발전용 LNG 수요 경로(12차 전기본의 LNG 역할)와 도시가스 요금 정책이 지역난방공사·도시가스사(삼천리 등)에도 파급된다."}, {"group": "유틸리티·요금", "title": "송변전 115조원 시대의 한전 재무: 사채한도·BT·가치 전달 시차", "period": "2026.05~2026.09", "lede": "12차 전기본 수요 상향으로 송변전 투자비가 72.8조원에서 115조원 이상으로 늘 수 있지만, 규제 유틸리티는 투자·차입이 먼저 나가고 요금 회수가 뒤따르기 때문에 같은 인프라 사이클에서 전력기기와 정반대의 현금 흐름을 겪는다.", "body": ["2026년 8월 12차 전기본 수요 재전망은 2040년 최대전력을 158.4~165.0GW, 소비량을 847.3~885.1TWh로 4월 잠정안 대비 약 27GW 올렸다. 반도체(첨단산업) 추가 수요가 4GW에서 24.6GW로, AI 데이터센터가 4GW에서 11.9GW로 커진 결과다. 10차→11차에서 최대수요가 11.3GW 늘 때 송변전 투자비가 16.3조원(1GW당 약 1.44조원) 늘었던 비율을 적용하면 12차 송변전 투자비는 114.8~124.3조원이 된다(리포트 추정).", "문제는 재원이다. 한전 별도 연간 투자비 10~11조원 중 송전은 약 5조원이고, 1H26에 이미 CAPEX 9.6조원이 영업현금흐름 8.5조원을 넘었다. 사채 잔액은 71.5조원(2Q26)인데 2022년 한전법 개정으로 자본금+적립금의 5배로 늘린 한도가 2027년 말 2배로 환원되면 22~23조원 초과발행 상태가 되고, 필요한 자본확충은 최소 10~11조원이지만 2027년 예산 한전 출자는 0.5조원에 불과하다. 법 개정으로 한도를 단계적으로 낮출 가능성이 높다는 시각과, 요금 정상화 없는 연장은 조달 시점 이연에 불과하다는 시각이 맞선다.", "민간 BT(Build-Transfer)가 부족분을 메운다. 2026년 8월 국가기간 전력망 특별법 개정으로 민간도 전력망을 지어 준공 즉시 한전에 넘기는 방식이 2029년 말까지 허용됐고, 리포트는 2040년까지 민간 BT 시장을 약 35조원(34.8~44.3조원, 연 2~3조원)으로 추정한다. BT는 한전에게 일시불 투자를 장기 할부로 바꿔 단기 현금 부담을 덜지만, 민간의 높은 조달금리·요구마진(두 자릿수 근접) 때문에 양수 후 장기 비용은 커지고 결국 요금기저 증가 요인이 된다. 전기요금 선납(삼성 20조·SK하이닉스 5조원 제안), 국민성장펀드 인프라금융도 거론된다.", "그래서 AI 전력수요를 한전의 성장으로 평가하려면 자산 증가와 함께 FCF와 차입금의 방향을 확인해야 한다. 전력기기 업체는 한전·데이터센터의 CAPEX가 장비 발주로 전환되는 순간 잔고와 매출 가시성이 생기지만, 한전은 송전선·변전소를 먼저 짓고 가동 자산의 비용과 보수가 요금에 반영돼야 현금으로 회수한다. 이자비용은 2025년 4.3조원에서 2028년 5.2조원으로 늘 것으로 추정되고, 국내 유틸리티 할인의 본질은 투자 규모가 아니라 회수 과정의 예측 불확실성이다.", "전력기기 업체에게도 국내 Grid는 양면적이다. 국내 초고압 전력망 투자에 대응할 수 있는 업체는 제한적(HD현대일렉트릭·효성중공업·일진전기·LS ELECTRIC 등)이라 수주 집중이 가능하지만, 국내 한전향 물량이 북미 고마진 슬롯을 대체하면 이익률이 희석될 수 있다. 리포트는 국내 Grid·AIDC를 북미를 대체하는 이익축이 아니라 수주 사이클의 기간과 상단을 늘리는 두 번째 수요축으로 본다."], "table": {"cols": ["항목", "12차 당초안(2040)", "재전망(2026-08)"], "rows": [["반도체(첨단산업) 추가 수요", "4GW", "24.6GW"], ["AI 데이터센터 추가 수요", "4GW", "11.9GW"], ["2040 목표수요", "131.8~138.2GW", "158.4~165.0GW"], ["2040 전력소비량", "657.6~694.1TWh", "847.3~885.1TWh"], ["송변전 투자비(리포트 추정)", "11차 72.8조원", "114.8~124.3조원"]]}, "bullets": ["11차 송변전 72.8조원 = 발전연계 50.7조 + 첨단산업 공급 22.0조원", "2038년 송전선 61,183C-km(2023년 대비 1.7배), 변전소 1,297개", "2027 예산 전력분야 1조 5,489억원: 한전 출자 5,000억, 송전단 ESS 5,724억, 수요유치형 변전소 658억원", "전력기기: CAPEX→수주→잔고→EPS / 유틸리티: CAPEX→요금기저→요금 반영→현금흐름"], "kr": "한국전력의 재무 경로와 함께, 국내 Grid 발주 순서(민간 AIDC 직접설비 → 계통접속 → 국가 Grid)에 따라 LS ELECTRIC·가온전선이 먼저, HD현대일렉트릭·효성중공업·일진전기·대한전선이 뒤에 수혜를 확인할 것이라는 분석이다. BT 시장은 송전망 시공 건설사에도 새 기회다."}, {"group": "유틸리티·요금", "title": "지역별 차등요금제(LMP): 전력산업 구조개편의 신호탄", "period": "2025.11~2026.06", "lede": "전국 단일 SMP에서 지역별 한계가격으로 바뀌면 비수도권 저가 전력만큼 한전 구입단가가 내려가고, 숨어 있던 송전·혼잡 비용이 드러나 규제 독립·시장 개방·투자보수 재정립으로 이어질 수 있다.", "body": ["LMP(Locational Marginal Price)는 에너지 한계비용 + 송전혼잡비용 + 송전손실비용으로 구성된 노드별 도매가격이다. 전력 부족·혼잡 지역은 비싸고 발전 과잉 지역은 싸져 발전소와 수요처 입지에 가격 신호를 준다. 한국은 서울 전력자급률이 10% 초반, 수도권 약 65%인 반면 충남·강원은 150% 이상이라 원거리 송전과 혼잡비용이 크다. 현행 단일 SMP 체계는 송전제약 추가 비용을 전국에 분산 정산(Uplift)해 이 비용이 가려져 있다.", "리포트의 산식은 단순하다. 단일 SMP 110원/kWh로 A·B 두 지역 각 400MW를 정산하면 8,800만원이지만, LMP로 A=80원·B=110원이면 7,600만원으로 준다. 비수도권 발전 비중이 높은 한국 구조상 도매 LMP만으로 한전 평균 구입단가가 내려가며, 리포트는 10원/kWh당 약 1.5조원 감소를 추정했다. 경기연구원 모델은 수도권 평균 LMP 약 134원, 비수도권 80원대 후반을 제시했지만 재생에너지 30% 가정 연구에서는 격차가 약 10원으로 줄어 추정 편차가 크다.", "파급은 요금을 넘어 구조로 간다. 한전은 지역별 원가·손익을 산정해야 하고, 정부가 특정 지역 요금을 낮게 유지하려면 재정 지원이나 별도 회계가 필요해진다. 망 운영 투명성을 위해 KPX 개편과 ISO 독립 운영, 송전망 규제의 수익상한제 전환, 혼잡수입의 망 투자 재원화가 거론되며, 시장 구조는 한전이 망·기본공급을 맡고 민간 소매사업자가 진입하는 ‘통신 알뜰폰 모델’(시나리오 A)이 가장 현실적이라는 평가다. 이는 국내 유틸리티를 선진국 규제 유틸리티 모델에 수렴시켜 밸류에이션 할인을 줄이는 요인으로 해석된다.", "일정은 정치에 달려 있다. 분산에너지 특별법 제45조가 법적 근거이고, 2026년 2월 연구용역 결과를 거쳐 연내 도매 노달가격, 2027년 이후 소매요금 지역 원가 반영(수도권·비수도권·제주 3개 권역 거론)이 검토됐으며, 2026년 하반기에는 발전소-수요지 거리에 따라 kWh당 10~20원 차이를 두는 방안이 연내 확정 목표로 제시됐다. 수도권 요금 인상 반발, 기존 설비 소급 적용 논란, 한국 계통 특성상 노드 가격이 2~3개 권역으로 수렴해 입지 신호가 약할 가능성이 리스크다."], "table": {"cols": ["항목", "미국(주요 RTO)", "한국"], "rows": [["도매가격", "노드별 LMP(혼잡·손실 반영)", "전국 단일 SMP"], ["계통 운영", "ISO/RTO 독립 운영", "KPX(산업부 산하)"], ["송전망 소유", "다수 민간 TO", "한전 독점"], ["소매시장", "민간 소매사업자 경쟁", "한전 단일 판매, 정부 승인 요금"], ["규제", "FERC + 주 공공요금위원회", "산업부 + 전기위원회, 정치 영향 강함"]]}, "bullets": ["PJM(1998 노달, 5분 실시간 LMP+용량시장), ERCOT(2010 zonal→nodal, 에너지 온리, 상한 9,000달러/MWh)", "송전 전력량요금(수요지역 기준) 수도권 2.44원 vs 비수도권 1.42원/kWh", "분산에너지 특화지역(제주·전남·부산·경기)과 RE100 산단이 민간 직거래 테스트베드", "혼잡렌트 = 노드 간 가격차 × 송전량 → 망 투자 회수 재원 가능"], "kr": "한국전력(구입단가 하락·구조개편 수혜/분할 논의 불확실성), 비수도권 민간 LNG·재생 발전사(SMP 하락 노출), 전력다소비 업종의 지방 이전 유인이 연결점이다."}, {"group": "유틸리티·요금", "title": "공기업 배당 사이클: 배당과 차입금은 별개다", "period": "2025.11~2026.06", "lede": "공기업 배당은 FCF나 차입금이 아니라 별도 당기순이익 기준으로 기재부 배당협의체가 정하기 때문에, 세수 결손기에 실적이 좋아지면 배당성향이 가이드라인(25~40%)으로 회귀할 유인이 크다.", "body": ["정부 출자기관 배당 가이드라인은 2014년 도입돼 배당성향을 2015년 25%에서 2020년 40%까지 올렸고, 2022년 40%를 2026년까지 유지하는 것으로 알려졌다. 핵심은 배당이 별도 순이익에 연동된다는 점이다. 2021 회계연도 가스공사는 비현금 손상차손 환입 5,513억원이 포함된 순이익 기준으로 배당성향 39.38%를 집행했고, 부채비율 400% 기준 위반 상태에서도 제재가 없었다.", "정부 쪽 유인도 있다. 2023~2025년 세수 결손은 56.4조·30.8조·12.5조원(예상)이었고 선거가 거의 매년 있어 증세가 어렵다. 최근 정부 배당수입은 국책은행 3사가 57~72%를 차지했지만 2016년에는 한전 단독이 29.7%였다. 배당소득 분리과세 논의에서 배당성향 25~40%가 요건으로 거론돼 공기업 배당성향의 하한선으로 작용할 수 있다.", "2025년 초 재개된 배당성향은 한전 16.4%, 가스공사 16.0%, 지역난방 21.4%로 가이드라인에 못 미쳤다. 리포트는 실적 개선기에 40%가 적용되면 지역난방 약 11%, 한전 약 5.6%의 배당수익률이 산출된다고 봤다. 가이드라인 하회 사례는 2015 한전, 2016~2017 한전기술, 2021 가스공사 등 4회뿐이다.", "다만 2026년 들어 기대는 낮아졌다. 2025 사업연도 배당에서 배당성향 상향 기대가 이미 꺾였고, 한전은 차입금 상환 부담(연결 연 약 29조원)과 사채한도 규제로 주주환원이 제한적이며 전년 배당이 1조원을 밑돌았다. 호르무즈 원가 충격으로 2026년 이익이 줄면 DPS도 EPS를 따라 줄어든다. 한전KPS처럼 이미 배당성향이 높은(약 53~65%) 기업은 안정 이익이 밸류 하단을 지지한다."], "table": {"cols": ["기업", "배당성향(2024 사업연도)", "40% 가정 배당수익률(리포트)"], "rows": [["한국전력", "16.4%", "약 5.6%"], ["한국가스공사", "16.0%", "-"], ["지역난방공사", "21.4%", "약 11.1%"], ["한전KPS", "약 65%", "-"]]}, "bullets": ["배당협의체 결과는 매년 2월 전후 결산 배당 공시로 확인", "한국발전공사법안(발전 5사 통폐합) 통과 시 한전은 5사 배당(8,748.5억원) 현금흐름 상실", "2026년 원가 충격으로 한전 ROE 전망이 22%(2025.11) → 5.2%(2026.5)로 급변 — 같은 지표도 발간 시점에 따라 크게 달라짐(미확인 아님, 전제 변화)"], "kr": "한국전력·지역난방공사·한국가스공사·한전KPS의 배당 투자 논리이며, 공기업 IPO·블록딜 검토 시 배당성향 가이드라인과 별도 순이익 연동 구조를 전제로 삼아야 한다."}], "market": {"lede": "수급의 핵심은 ‘수요는 계약으로 확정돼 가는데 공급은 물리적으로 묶여 있다’는 것이다. 미국 유틸리티 CAPEX와 데이터센터 구속력 부하는 매 분기 늘고, 초고압 변압기·가스터빈·해저케이블은 리드타임과 슬롯으로 공급이 제한된다. 국내 쪽은 SMP와 발전원별 정산단가 격차가 한전 손익을, 12차 전기본이 국내 Grid 발주 규모를 정한다.", "bars": [{"title": "미국 주요 유틸리티 중장기 CAPEX 계획 추이", "unit": "억달러", "note": "주요 유틸리티 5개년 설비투자 계획 합계(2020~2024 연말 기준, 4Q25·1Q26 분기 기준). 미국 유틸리티 IR, 리포트 집계", "items": [{"l": "2020", "v": 3878, "tag": "확인"}, {"l": "2021", "v": 4574, "tag": "확인"}, {"l": "2022", "v": 5008, "tag": "확인"}, {"l": "2023", "v": 5760, "tag": "확인"}, {"l": "2024", "v": 6722, "tag": "확인"}, {"l": "4Q25", "v": 8217, "tag": "확인"}, {"l": "1Q26", "v": 8427, "tag": "확인"}]}, {"title": "미국 데이터센터 구속력 계약(진행 단계) 부하", "unit": "GW", "note": "ESA 등 구속력 계약 기준. 3Q25는 16개사 집계라 기준이 다름(미확인). 미국 유틸리티 16~18사, 리포트 집계", "items": [{"l": "4Q24", "v": 71, "tag": "확인"}, {"l": "2Q25", "v": 101, "tag": "확인"}, {"l": "3Q25", "v": 136, "tag": "미확인"}, {"l": "4Q25", "v": 168, "tag": "확인"}, {"l": "1Q26", "v": 181, "tag": "확인"}]}, {"title": "엔비디아 GPU 세대별 랙당 전력밀도", "unit": "kW/rack", "note": "엔비디아 발표 기준. Rubin(2026)·Rubin Ultra(2027~2028)는 계획치", "items": [{"l": "Ampere(2020)", "v": 10, "tag": "확인"}, {"l": "Hopper(2022)", "v": 40, "tag": "확인"}, {"l": "Blackwell(2024)", "v": 120, "tag": "확인"}, {"l": "Blackwell Ultra(2025)", "v": 150, "tag": "확인"}, {"l": "Rubin(2026)", "v": 200, "tag": "추정"}, {"l": "Rubin Ultra ], "note": "한국전력 11차 장기송변전설비계획, 리포트 길이 비례 환산"}, {"title": "지역별 전력망 투자 성장축", "cols": ["지역", "핵심 동인", "규모·지표"], "rows": [["미국", "DC·제조업 신규부하", "2030년까지 장거리 송전용량 +16%, 신규 송전선 약 7,500마일, 연 5,000마일 필요 vs 2025년 780마일"], ["유럽", "노후망 현대화·재생 연계", "2040년까지 약 1.2조유로(배전 7,300억·송전 4,770억)"], ["중국", "신규망·UHV 직류", "State Grid 2026~30 최대 4조위안(+40%)"], ["인도", "비화석 900GW 연계", "송전선 13.75만 c-km, 변전 82.76만 MVA"], ["한국", "발전·수요지 불일치 해소", "2038년 송전선 61,183c-km, 변전소 1,297개, 약 72.8조원"]], "note": "미국 DOE, EU 집행위원회, State Grid, 인도 CEA, 한국전력(리포트 정리)"}]}, "cycle": {"lede": "리포트 발간 기간(2025.10~2026.09) 동안 업황 인식은 ‘구조적 공급 부족 확신(2025 4Q) → 765kV·800VDC로 두 번째 성장축 확인(2026 1Q) → 호르무즈 쇼크로 유틸리티와 장비의 운명이 갈림(2026 2Q) → 수급 로테이션으로 주가 급락, 그러나 수주 가이던스 상향(2026 3Q)’ 순으로 움직였다. 전력기기 업황 톤은 일관되게 긍정적이었고, 유틸리티 톤은 원가 방향에 따라 긍정→부정→중립으로 흔들렸다.", "now": "2026년 9월 현재 전력기기는 ‘업황은 견조, 멀티플은 조정 후 재평가 대기’ 국면이다. 5월 고점 대비 최대 58% 하락에도 빅3가 모두 2Q에 연간 수주 가이던스를 올렸고(HD현대 52억달러, 효성 12조원, LS 6~6.5조원) 미국 유틸리티 CAPEX와 계약부하는 계속 상향 중이다. 공급 측에서는 2027년 하반기 업계 증설 물량이 본격 출하되는 시점이 다음 분기점이며, 국내에서는 12차 전기본 확정(12월 목표)과 송변전 투자비 발표가 두 번째 수요축을 가시화할 트리거다. 한전·가스공사는 호르무즈 원가 충격이 3Q부터 반영되는 실적 바닥 구간이다.", "timeline": [{"date": "2025-10", "title": "구조적 장기 사이클 확신, 관세는 전가", "body": "한국 초고압 변압기의 미국 수입 점유율이 13%→18%로 오르고 주요 5사 잔고가 +30% 늘었다. 미국향 실질 관세부담은 15~21%로 추정됐지만 판가 전가로 실적 영향은 제한적이라는 판단이 자리 잡았다.", "tone": "긍정"}, {"date": "2025-10", "title": "아시아 해저케이블 개화·서해안 HVDC 기대", "body": "아시아 해상풍력 케이블 발주가 2032년 4.4조원(CAGR +29.5%)으로 커지고 국내 업체가 약 73%를 과점할 것이라는 전망이 제시됐다. 전력망특별법 시행(2025.9)으로 정책이 목표에서 집행으로 이동했다.", "tone": "긍정"}, {"date": "2025-11", "title": "원가 하락기의 공기업 배당 사이클", "body": "브렌트 하락과 고가 중동 LNG 계약 만료로 SMP가 구조적 약세에 들어서며 한전 2026년 영업이익 약 18조원대 전망이 나왔다. 배당성향 가이드라인(25~40%) 회귀 기대가 유틸리티 논리의 중심이었다.", "tone": "긍정"}, {"date": "2025-11", "title": "디스패처블 전원·초고압 변압기 공급 부족 장기화", "body": "미국 피크 부하가 연 33GW 이상 늘지만 디스패처블 생산능력은 연 약 27GW, 초고압 변압기 필요량 연 210~300대 vs 공급 140~220대라는 수급 갭 모델이 제시됐다. 밸류에이션보다 이익 성장의 지속성이 핵심이라는 프레임이 확산됐다.", "tone": "긍정"}, {"date": "2025-12", "title": "AIDC 가용성 확보가 중저압·직류 수요를 연다", "body": "Tier III/IV 이중화, 온사이트 하이브리드 전원, 800V DC 배전이 동시에 확산되며 수요가 초고압 교류에서 중저압·직류로 확장된다는 인식이 생겼다. PJM 2027/28 용량경매가 상한가로 청산돼 발전 부족 신호가 켜졌다.", "tone": "긍정"}, {"date": "2026-01", "title": "Time-to-Power와 800VDC 상용화 로드맵", "body": "전력 공급 시점이 데이터센터의 최대 경쟁 변수가 되고, Rubin Ultra 1MW 랙과 800VDC 전환(2027 초기 상용화)이 새 제품 수요와 진입장벽을 만든다는 분석이 나왔다. 트럼프 행정부 비상전력 경매로 빅테크가 발전소 비용을 부담하는 구도가 시작됐다.", "tone": "긍정"}, {"date": "2026-02", "title": "765kV 초대형 변압기 시장 재개", "body": "승인·계획 765kV 노선 4,500~6,000마일에서 변압기 약 200대 잠재수요가 역산되며, 가격(P) 이후 물량(Q)과 제품 믹스가 차별화 요인이라는 프레임이 등장했다. 미국 계획 발전소가 1년 만에 150GW→250GW로 늘어 ‘2차 사이클’로 명명됐다.", "tone": "긍정"}, {"date": "2026-03", "title": "호르무즈 봉쇄, 유틸리티 원가 충격 경고", "body": "2월 말 이란 공습과 3월 호르무즈 통항 통제로 유가가 100달러를 넘고 JKM이 22달러까지 뛰었다. 동아시아가 LNG 가격 교란의 진원지가 될 수 있다는 경고와 함께 한전·가스공사 실적 전망이 급격히 하향됐다.", "tone": "부정"}, {"date": "2026-03", "title": "BTM으로 이동하는 수용가, ESS·SOFC 부상", "body": "FERC·ISO가 대형 부하에 망 비용과 자체 전원을 요구하며 데이터센터가 계량기 뒤(BTM)로 이동한다는 분석이 나왔다. Ratepayer Protection Pledge(3.4)로 빅테크 자체 발전이 정치적 약속이 됐다.", "tone": "긍정"}, {"date": "2026-04", "title": "1Q26 실적 미스에도 수주 폭증, 관세 위헌 판결", "body": "원자재·운송 중 재고 등으로 영업이익은 컨센서스를 밑돌았지만 효성 신규수주 +107% 등 전례 없는 수주가 나왔다. 연방대법원 상호관세 위헌 판결로 환급 절차가 개시되고 232조 개편으로 대형변압기 실효세율이 28.7%→15.0%로 낮아졌다.", "tone": "긍정"}, {"date": "2026-04", "title": "전쟁이 에너지 전환에 ‘안보’ 가치를 더하다", "body": "원전·초고압 전력망·중속엔진·연료전지·북미 LNG가 안보형 투자로 재평가됐다. HD현대중공업이 데이터센터 발전용 중속엔진 684MW를 수주하며 가스터빈 병목의 대체 시장이 실증됐다.", "tone": "긍정"}, {"date": "2026-05", "title": "전력인프라 주가 고점(5/7) 후 급락", "body": "전력기기 ETF가 YTD +160%대까지 오른 뒤 반도체 레버리지 ETF 출시·AI 펀드 청산·미국 데이터센터 모라토리엄 보도로 약 50% 조정받았다. 같은 달 유틸리티는 ‘버틸 수 있어서 요금이 안 오른다’는 부정적 톤이 나왔다.", "tone": "부정"}, {"date": "2026-05", "title": "공급이 수요를 정한다: 발전 > 전선 > 전력기기", "body": "데이터센터 부하 증가 속도의 상한을 가스터빈·원전 공급이 결정한다는 서열론이 제시됐다. 미중 정상회담과 UAE의 OPEC 탈퇴로 유가 우하향 시나리오가 부상했다.", "tone": "중립"}, {"date": "2026-06", "title": "조정은 수급, 펀더멘털은 강화", "body": "1Q26 변압기 5사 수주 8.5조원(+54%)·잔고 34.5조원(+37%)을 근거로 조정이 피크아웃이 아니라는 반론이 나왔다. 미국 데이터센터 착공 지연(2026년 예정 16.2GW 중 약 5GW만 건설 중)은 2026년이 정점이라는 시간표가 제시됐다.", "tone": "긍정"}, {"date": "2026-07", "title": "수주 가이던스 연쇄 상향과 계통연계 데이터 반론", "body": "HD현대일렉트릭(7/6)·효성중공업(7/31)·LS ELECTRIC이 연간 수주 가이던스를 20~50% 상향했다. 미국 계통연계 신청 데이터로 보면 전력기기 수요가 2028년까지 연 22% 성장한다는 선행지표 분석이 피크아웃 우려를 반박했다.", "tone": "긍정"}, {"date": "2026-08", "title": "12차 전기본 수요 +27GW 상향, 멀티플 조정 분해", "body": "3대 메가프로젝트 반영으로 2040 목표수요가 158.4~165.0GW로 올라 국내 송변전 투자 115조원대가 거론됐다. 주가 하락이 전부 멀티플 축소였다는 분해와 함께 저점 논리가 확산됐고, 전력망 특별법 개정으로 민간 BT가 허용됐다.", "tone": "긍정"}, {"date": "2026-08", "title": "미국 정책은 절차만 줄인다: BTM 먼저, FTM 2028", "body": "FERC Large Load·NERC 표준 등 미국 규제 완화의 시계열을 정리하며 2028년 이전 배전·ESS, 이후 송전·태양광 순의 수요 구도가 제시됐다. 외국산 전력기기 제한 행정명령(8/26)은 현지 생산 프리미엄을 강화했다.", "tone": "긍정"}, {"date": "2026-09", "title": "규제 유틸리티의 회수 구조를 따로 봐야", "body": "같은 인프라 사이클에서 전력기기는 수주로 먼저, 유틸리티는 투자·차입 후 회수로 늦게 가치가 전달된다는 구분이 강조됐다. 한전 1H26 CAPEX가 영업현금흐름을 넘어 FCF·차입금 확인이 리레이팅 조건으로 제시됐다.", "tone": "중립"}, {"date": "2026-09", "title": "MW당 콘텐츠 상승과 전환속도의 싸움", "body": "사이클의 본질은 공급제약과 MW당 설비가치 상승이며, 기업 성과는 수주잔고→CAPA→출하→고부가 믹스→이익의 전환속도에서 갈린다는 정리가 나왔다. 국내 6사 잔고는 HD현대 12.3조원·대한전선 4조원 돌파 등 최대치를 경신했다.", "tone": "긍정"}], "bull": ["수요 가시성이 2030년대 초반까지 확보됐다: 미국 유틸리티 CAPEX 8,427억달러(1Q26)가 매 분기 상향되고, 2031~2032년 납기 변압기·2031~2035년 인도 가스터빈이 이미 논의되고 있다.", "공급은 물리적으로 묶여 있다: GOES·숙련 권선공·건조·시험 병목과 과거 사이클 학습효과로 증설이 보수적이며, 765kV 공급자는 5곳 내외, 가스터빈 2030년까지 잔여 슬롯 약 10GW다.", "수요가 다층화됐다: 송전(765kV) → 배전(데이터센터 블록 반복) → DC(800VDC·SST) → 온사이트(엔진·연료전지·ESS)로 수요 계층이 계속 추가돼 한 축이 둔화돼도 다른 축이 받친다.", "두 번째 수요축(국내 Grid): 12차 전기본 +27GW 상향, 송변전 115조원대, 3대 메가프로젝트·AIDC 18.4GW가 북미 이후의 수주 기간을 늘린다.", "가격 결정력이 증명됐다: 관세·원자재 비용이 대부분 고객에게 전가됐고 국내 3사 OPM이 5.3%(2022)→15.2%(2025)로 올랐으며, 수주 가이던스가 연중 20~50% 상향됐다.", "안보 프리미엄: 호르무즈 쇼크가 원전·초고압 전력망·공급망 다변화 투자를 ‘선택’에서 ‘안보 필수’로 바꿨다."], "bear": ["공급 과잉 전환: 2027년 하반기 업계 동시 증설 물량(HD현대·효성·Hitachi·Prolec GE·Siemens)이 출하되면 리드타임 단축과 판가 정점, 과거 2008년식 저가수주 재현 가능성.", "데이터센터 착공 지연·AI CAPEX 조정: 모라토리엄(42개 주 533건 이상), 주민 반대, 빅테크 자금조달 약화 시 장기 프레임 계약이 확정 발주로 전환되지 않을 위험. 계통연계 신청은 과거 40% 이  사업은 첫 매출 연도 이익에 멀티플을 적용하고 할인한다.", "band": "", "pitfalls": "피어 멀티플이 수개월 새 크게 움직여 SOTP 결과가 피어 주가에 과도하게 민감하다. 전력기기 이익 비중이 높아질수록 순수 전력기기 멀티플에 가까워진다는 논리(건설 겸영 기업)는 비전력 부문 리스크(PF 우발채무 등)를 가릴 수 있다."}, {"name": "P/B-ROE(고ROE 전력기기·전선)", "when": "초고ROE가 지속된다고 가정하는 전력기기, 글로벌 피어 P/B로 평가하는 초고압·해저 전선", "how": "지속가능 ROE(전력기기 60~70%대 가정 사례)와 자기자본비용으로 적정 P/B를 역산하거나, Prysmian 등 글로벌 전선 피어 평균 P/B를 적용한다. 전선은 매출이 구리 가격에 부풀므로 P/S는 쓰지 않는다.", "band": "초고ROE 가정 시 implied P/B 두 자릿수(2026-08), 국내 전선 3사 26년 P/E 27.4배·코스피 대비 2.6배 할증(2025-10), 해외 전선사 2028년 EV/EBITDA 평균 15배 내외(2026-05), 글로벌 상위 전선사 2026년 EV/EBITDA 약 12.5배(상단)~6.9배(할인) 양극화", "pitfalls": "ROE 지속성 가정 하나로 가치가 크게 움직인다. 전선업은 대형 프로젝트 매출 인식 시차로 연도별 이익 변동이 커서 수주잔고·EBITDA 마진 추세를 함께 봐야 한다."}, {"name": "PBR-ROE와 원가회수율(규제 유틸리티)", "when": "한국전력·한국가스공사·지역난방공사 같은 총괄원가 규제 공기업", "how": "과거 PBR과 ROE의 회귀식에 선행 ROE를 대입하거나, 적정투자보수율(목표 ROE)과 자기자본비용(예: 베타 0.45, 무위험 3.0%, 시장위험프리미엄 6.0%)으로 적정 PBR을 산출한다. 한전 PBR은 원가회수율(판매수입÷총괄원가)과 동행해 왔다.", "band": "한전 Forward P/B 역사적 평균 0.38배·적자 구간 저점 0.15배·고점 약 0.6~0.8배, 2025-11 약 0.54배(글로벌 유틸리티 평균 1.72배 대비 60% 이상 할인). 원가회수율 역사적 고점 107%(2016) vs 2027E 131% 추정 시 1.0배 이상 재평가 논리(리포트). 가스공사 PBR 0.3배·PER 약 5배(2025P), 지역난방 0.4~0.5배", "pitfalls": "원가 하락으로 이익이 늘어도 다음 원가 상승기에 미회수 비용이 재발할 수 있으면 높은 ROE를 장기 수익성으로 인정받기 어렵다(할인의 본질은 회수 예측 불확실성). 같은 한전 ROE가 2025-11 22%에서 2026-05 5.2%로 바뀌었듯 원가 전제에 극도로 민감하다."}, {"name": "배당수익률(공기업·고배당 정비사)", "when": "배당 가이드라인이 있는 정부 출자기관, 배당성향이 높은 한전KPS", "how": "별도 순이익 × 배당성향(가이드라인 25~40%) ÷ 시가총액으로 배당수익률을 산출하고 저PBR 해소 논리와 결합한다. 공기업 배당은 FCF·차입금이 아니라 별도 순이익에 연동된다는 점이 전제다.", "band": "배당성향 40% 가정 시 지역난방 약 11.1%, 한전 약 5.6%(2025-11 리포트 추정). 2024 사업연도 실제 배당성향 한전 16.4%·가스공사 16.0%·지역난방 21.4%, 한전KPS 약 53~65%.", "pitfalls": "정부 배당 결정은 세수·부채 여론에 좌우되고 2026년 원가 충격으로 이익이 급감하면 DPS도 따라 준다. 한전은 차입금 상환(연결 연 약 29조원)과 사채한도로 환원 여력이 제한된다."}, {"name": "EV/Backlog·Price/Backlog(장기 수주산업)", "when": "원전 주기기·가스터빈처럼 수주와 매출 인식 사이 시차가 긴 발전설비 업체", "how": "기업가치를 수주잔고(또는 장기 2035년 잔고 전망)로 나눠 과거 인프라 호황기와 비교한다. 수주·생산능력·공급망 병목 기대가 멀티플을 결정하는 구간에서
