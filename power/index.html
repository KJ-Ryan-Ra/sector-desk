, {"term": "GSU(발전기 승압 변압기)", "en": "Generator Step-Up Transformer", "def": "발전기 출력 전압을 송전 전압으로 올리는 변압기. 발전소 신설·원전·가스발전 계통연계 수요와 직결된다.", "group": "송변전 기기"}, {"term": "Bank(변압기 뱅크)", "en": "Transformer Bank", "def": "단상 변압기 3대를 묶어 3상 변환을 수행하는 단위. 765kV 변전소는 보통 2~3 Bank로 구성돼 변전소당 6~9대가 필요하다.", "group": "송변전 기기"}, {"term": "권선·철심·중신", "en": "Winding / Core / Core & Coil Assembly", "def": "변압기 코일(권선), 자기회로를 이루는 강판 구조물(철심), 둘을 결합하는 조립 공정(중신). 권선은 수작업이라 숙련공이 병목이다.", "group": "송변전 기기"}, {"term": "방향성 전기강판", "en": "GOES", "def": "결정 방향을 정렬해 철손을 줄인 변압기 철심용 강판. EV 모터용 무방향성(NOES)과 라인을 공유해 증산 유인이 낮다.", "group": "원자재"}, {"term": "무방향성 전기강판", "en": "NOES", "def": "모든 방향으로 자기 특성이 균일한 강판으로 모터·발전기 철심에 쓰인다.", "group": "원자재"}, {"term": "CTC(연속전위권선)", "en": "Continuously Transposed Conductor", "def": "대형 변압기 권선에 쓰이는 특수 구리선. GOES와 함께 변압기 원가의 약 25%를 차지한다.", "group": "원자재"}, {"term": "MVA / GVA", "en": "Mega / Giga Volt-Ampere", "def": "변압기 등 전력설비 용량 단위(전압×전류). 1GW 데이터센터는 역률 0.95 기준 약 1,368MVA 설비가 필요하다.", "group": "기초 개념"}, {"term": "역률", "en": "Power Factor", "def": "유효전력(kW)을 피상전력(kVA)으로 나눈 값. 높을수록 같은 설비로 더 많은 유효전력을 쓴다.", "group": "기초 개념"}, {"term": "임피던스", "en": "Impedance", "def": "교류 회로에서 전류 흐름을 방해하는 총 저항. 변압기 주문 사양의 핵심 항목이라 제품이 표준화되기 어렵다.", "group": "기초 개념"}, {"term": "I²R 손실", "en": "Joule Loss", "def": "전선 저항에서 열로 사라지는 손실로 전류 제곱에 비례한다. 같은 전력이면 전압을 높일수록 전류가 줄어 손실이 급감한다 — 765kV와 800VDC의 공통 원리.", "group": "기초 개념"}, {"term": "GIS(가스절연개폐장치)", "en": "Gas Insulated Switchgear", "def": "차단기·단로기·모선을 절연가스로 채운 금속 외함에 넣은 변전소 개폐·보호 설비. 부지가 작아 도심에 적합하다.", "group": "송변전 기기"}, {"term": "GCB / VCB", "en": "Gas / Vacuum Circuit Breaker", "def": "GCB는 절연가스로 아크를 소호하는 고압 차단기(765kV 변전소에 800kV급), VCB는 진공 속에서 아크를 끄는 중압 차단기(데이터센터 전기실).", "group": "송변전 기기"}, {"term": "SF6(육불화황)", "en": "Sulfur Hexafluoride", "def": "GIS 절연가스로 쓰이는 강력한 온실가스. EU F-gas 규정이 전압대별로 2026~2032년 단계적으로 신규 사용을 제한한다.", "group": "정책"}, {"term": "리액터", "en": "Shunt Reactor", "def": "장거리 초고압 송전선의 무효전력을 흡수해 전압을 안정시키는 설비. 765kV 변전소 패키지에 포함된다.", "group": "송변전 기기"}, {"term": "STATCOM", "en": "Static Synchronous Compensator", "def": "전력전자로 무효전력을 빠르게 공급·흡수해 계통 전압을 안정시키는 장치. 재생에너지·AI 부하 급변 대응.", "group": "송변전 기기"}, {"term": "HVDC(초고압직류송전)", "en": "High Voltage Direct Current", "def": "교류를 직류로 바꿔 장거리·해저로 보낸 뒤 다시 교류로 바꾸는 방식. 400MW 이상·해저 40~100km 이상에서 교류보다 경제적이다.", "group": "전선·HVDC"}, {"term": "LCC / VSC", "en": "Line / Voltage Source Converter", "def": "HVDC 변환 방식. 전류형(LCC)은 대용량 실적, 전압형(VSC, IGBT 기반)은 제어 유연성으로 해상풍력·재생 연계에 유리하다.", "group": "전선·HVDC"}, {"term": "CTR(변환용 변압기)", "en": "Converter Transformer", "def": "HVDC 변환소에서 교류-직류 변환에 쓰이는 특수 변압기. 국내는 500kV급 국산화 R&D가 진행 중이다.", "group": "전선·HVDC"}, {"term": "KAPES", "en": "Korea Alstom Power Electronics Systems", "def": "한전과 Alstom이 2012년 설립한 HVDC 전문 합작사(Alstom은 이후 GE에 인수). 동해안 HVDC 변환설비를 주관했다.", "group": "전선·HVDC"}, {"term": "내부망 / 외부망", "en": "Inter-array / Export Cable", "def": "내부망은 풍력터빈↔해상변전소(66~132kV), 외부망은 해상변전소↔육상변전소(154~230kV 이상) 케이블. 외부망이 금액·난이도가 더 크다.", "group": "전선·HVDC"}, {"term": "CLV / CLB", "en": "Cable Laying Vessel / Barge", "def": "해저케이블 포설선. CLV는 자항식, CLB는 예인선이 필요한 바지형이다. 적재 톤수가 한 번에 포설할 수 있는 길이를 정한다.", "group": "전선·HVDC"}, {"term": "DP 등급", "en": "Dynamic Positioning", "def": "선박 동적위치제어 신뢰도 등급(DP1~DP3). 대형 HVDC 포설에는 DP3가 요구된다.", "group": "전선·HVDC"}, {"term": "VCV 타워", "en": "Vertical Continuous Vulcanization", "def": "초고압·해저 케이블 절연층을 연속 가교하는 수직 압출 설비. 높이가 곧 생산 캐파다.", "group": "전선·HVDC"}, {"term": "카보타지", "en": "Cabotage", "def": "자국 연안 운송을 자국 선박에 한정하는 규정. 한국 선박법 제6조로 외국 포설선 진입이 어려워 국내 해저케이블 시장이 국내 업체 중심이 된다.", "group": "정책"}, {"term": "존스법", "en": "Jones Act", "def": "미국 항구 간 해상운송을 미국 건조·소유·선원·국적 선박으로 제한하는 법. 미국 포설 역량 부족의 원인.", "group": "정책"}, {"term": "에스컬레이션 조항", "en": "Escalation Clause", "def": "구리·철·절연유 등 원자재 가격 변동을 판매가에 연동하는 계약 조항. 전선·변압기 마진 방어 수단이다.", "group": "계약·재무"}, {"term": "Book-to-bill / 잔고 커버리지", "en": "Backlog Coverage", "def": "수주잔고를 직전 연간 매출로 나눈 배수. 초고압 업체 약 3.7배(2025), 유럽 전선 3사 5.4년.", "group": "계약·재무"}, {"term": "슬롯 예약 계약", "en": "SRA, Slot Reservation Agreement", "def": "가스터빈 등 장납기 설비의 미래 생산 슬롯을 예약금으로 선점하는 계약. 정식 발주 전 단계라 잔고의 질을 따로 봐야 한다.", "group": "계약·재무"}, {"term": "LTSA", "en": "Long-Term Service Agreement", "def": "발전설비 장기 유지보수 계약. 가스터빈은 설치 후 20~30년 고온부품 교체 등 서비스 매출이 핵심(프린터-잉크 모델).", "group": "계약·재무"}, {"term": "LTA", "en": "Long-Term Agreement", "def": "전력청 등과 수년간 물량·가격을 정한 장기 공급 약정(예: 일진전기 미국 에너지기업 4,318억원).", "group": "계약·재무"}, {"term": "선급금", "en": "Down Payment", "def": "발주 시 선지급하는 계약금. 공급자 우위 시장의 대표 신호다.", "group": "계약·재무"}, {"term": "브라운필드 / 그린필드", "en": "Brownfield / Greenfield", "def": "기존 시설 확장(12~20개월, 소규모) vs 신규 부지 신축(21~31개월, 대규모) 증설 방식.", "group": "계약·재무"}, {"term": "P-growth / Q-growth", "en": "Price / Quantity Growth", "def": "판가 상승에 의한 성장 vs 증설로 출하 물량이 늘어난 성장. 사이클 장기화 국면에서는 Q가 기업 간 차이를 만든다.", "group": "계약·재무"}, {"term": "FOB", "en": "Free On Board", "def": "선적항에서 인도 시 책임이 이전되는 무역 조건. 수입 관세는 수입자가 부담해 제조사 관세 부담이 없다.", "group": "계약·재무"}, {"term": "상호관세 / IEEPA", "en": "Reciprocal Tariff / International Emergency Economic Powers Act", "def": "무역불균형국에 부과한 미국 관세(한국 15%)와 그 법적 근거. 2026년 4월 연방대법원이 위헌 판결해 환급 절차가 시작됐다.", "group": "정책"}, {"term": "Section 232", "en": "Trade Expansion Act Sec. 232", "def": "국가안보 사유로 철강·알루미늄·구리와 파생제품에 부과하는 미국 관세. 2026년 4월 금속함량→전체 과세가격 기준으로 바뀌었다.", "group": "정책"}, {"term": "PPI(생산자물가지수)", "en": "Producer Price Index", "def": "생산자 판매가격 지수. 미국 변압기·개폐기 PPI는 2021년 초 대비 약 +70%로 판가 추세의 공개 대용지표(인도 시점 가격이라 후행).", "group": "지표"}, {"term": "리드타임", "en": "Lead Time", "def": "주문부터 인도까지 기간. 초고압 변압기 3~5년, 데이터센터 배전 6개월~2년, 가스터빈 4~6년, 해저케이블 5년 이상.", "group": "지표"}, {"term": "디스패처블 전원", "en": "Dispatchable Generation", "def": "급전 지시에 따라 출력을 즉시 조절할 수 있는 발전원(가스·원전·연료전지). 데이터센터 24/7 부하를 받칠 수 있는 공급의 한계다.", "group": "발전"}, {"term": "ELCC(유효부하수용능력)", "en": "Effective Load Carrying Capability", "def": "간헐성 전원이 계통 안정성을 해치지 않고 감당할 수 있는 부하 비율. PJM 고정형 태양광 8~12%.", "group": "발전"}, {"term": "피크기여도(실효용량)", "en": "Capacity Credit", "def": "설비용량 중 최대수요 시간대에 실제 기여하는 비율. 11차 전기본 기준 태양광 14.3%, 풍력 2.4%.", "group": "발전"}, {"term": "덕커브", "en": "Duck Curve", "def": "태양광 확대로 낮 시간 순수요가 급감하고 일몰 후 급증하는 부하곡선. 장주기 ESS 수요의 원천.", "group": "발전"}, {"term": "가스복합화력(GTCC/CCGT)", "en": "Combined Cycle Gas Turbine", "def": "가스터빈 배기열로 HRSG에서 증기를 만들어 증기터빈을 추가로 돌리는 방식(효율 약 60%). 단순사이클은 건설이 빠르지만 효율이 낮다.", "group": "발전"}, {"term": "HRSG(배열회수보일러)", "en": "Heat Recovery Steam Generator", "def": "가스터빈 배기가스의 폐열로 증기를 만드는 복합화력 핵심 설비.", "group": "발전"}, {"term": "항공기 파생형 터빈", "en": "Aeroderivative Turbine", "def": "제트엔진 기반 소형 가스터빈. 설치가 빠르지만 용량이 수~수십 MW로 데이터센터 온사이트 초기 전원에 쓰인다.", "group": "발전"}, {"term": "중속엔진", "en": "Medium-speed Engine", "def": "선박용 4행정 가스엔진(10~20MW급)을 병렬 배치한 발전 설비. 부하추종이 뛰어나고 MW당 단가가 낮다.", "group": "발전"}, {"term": "SOFC / PAFC", "en": "Solid Oxide / Phosphoric Acid Fuel Cell", "def": "고체산화물(효율 50~60%, 고온, 희토류 필요) / 인산형(효율 40~43%, 저렴·장수명) 연료전지. 모두 DC를 직접 생산한다.", "group": "발전"}, {"term": "부하추종", "en": "Load Following", "def": "전력 수요 변화에 맞춰 출력을 빠르게 조절하는 능력. AI 데이터센터 전원 적합도의 핵심 기준.", "group": "발전"}, {"term": "Bridge power", "en": "Bridge Power", "def": "계통 연결 전까지 데이터센터에 임시로 전력을 공급하는 전원(연료전지·엔진·소형 가스터빈).", "group": "AIDC 전력"}, {"term": "BTM / FTM", "en": "Behind / Front of the Meter", "def": "계량기 뒤(수용가 부지 내 자체 발전·ESS) vs 계량기 앞(유틸리티 계통의 발전·송배전). BTM은 배전기기·ESS, FTM은 송전 기자재 수요를 만든다.", "group": "AIDC 전력"}, {"term": "On-site 발전", "en": "On-site Generation", "def": "데이터센터가 부지 내 가스터빈·엔진·연료전지로 직접 전력을 확보하는 방식. 미국 DC 파이프라인의 약 27~30%가 계획.", "group": "AIDC 전력"}, {"term": "Co-location(병설)", "en": "Co-location", "def": "발전소와 데이터센터를 같은 부지·인접 입지에 두고 직접 전력을 받는 모델. PJM Co-location Order로 제도화.", "group": "AIDC 전력"}, {"term": "BYOP", "en": "Bring Your Own Power", "def": "대형 수요처가 스스로 전력·송전 비용을 부담하거나 자체 발전원을 확보하도록 하는 정책 기조(텍사스 SB6 등).", "group": "AIDC 전력"}, {"term": "Time-to-Power", "en": "Time-to-Power", "def": "데이터센터가 부지 확보 후 실제 전력을 공급받기까지의 시간. 가격보다 납기·표준화가 경쟁력이 되는 이유.", "group": "AIDC 전력"}, {"term": "AIDC", "en": "AI Data Center", "def": "GPU 가속기 중심의 대규모 AI 학습·추론용 고밀도 데이터센터.", "group": "AIDC 전력"}, {"term": "랙당 전력밀도", "en": "Rack Power Density", "def": "서버 랙 1개가 소비하는 전력. 범용 약 10kW → Blackwell 120kW → Rubin Ultra 약 1MW로 상승.", "group": "AIDC 전력"}, {"term": "PUE", "en": "Power Usage Effectiveness", "def": "데이터센터 총 전력 ÷ IT 장비 전력. Google 1.09, 업계 평균 1.56. PUE 1.3이면 IT 1GW당 인입 1.3GW.", "group": "AIDC 전력"}, {"term": "Tier III / IV", "en": "Uptime Tier", "def": "N+1(가용성 99.982%) / 2N 이상(99.995%) 이중화 데이터센터 등급. 같은 용량 대비 배전기기 수요를 2~3배 늘린다.", "group": "AIDC 전력"}, {"term": "N+1 / 2N", "en": "Redundancy", "def": "예비 설비 1개 추가 / 전체 시스템을 두 세트로 구축하는 이중화 방식.", "group": "AIDC 전력"}, {"term": "화이트룸 / 그레이룸", "en": "White Space / Gray Space", "def": "서버가 놓이는 IT 공간 / UPS·변압기·배전반 등 전기·기계 설비 공간.", "group": "AIDC 전력"}, {"term": "전력 블록", "en": "Power Block", "def": "AI 캠퍼스를 40~60MW 단위로 반복 증설하는 설계 단위. 1GW = 50MW 블록 약 20개.", "group": "AIDC 전력"}, {"term": "Load Swing / Power Swing", "en": "Load Swing", "def": "수천 개 GPU가 동기화돼 연산·통신을 반복하며 수 초 간격으로 수십 MW씩 급등락하는 부하. ESS·STATCOM 수요의 원천.", "group": "AIDC 전력"}, {"term": "Ride-through", "en": "Ride-through", "def": "계통 사고로 전압·주파수가 흔들릴 때 설비가 끊기지 않고 일정 시간 버텨야 하는 의무(ERCOT 75MW 이상 부하).", "group": "AIDC 전력"}, {"term": "800VDC", "en": "800 Volt Direct Current", "def": "데이터센터 내부를 800V 직류로 랙까지 배전하는 NVIDIA 주도 아키텍처. 구리 최대 45%·변환 손실 약 5% 절감.", "group": "AIDC 전력"}, {"term": "±400VDC / 사이드카", "en": "±400VDC Sidecar", "def": "Google/OCP가 EV 공급망 부품을 활용해 랙 옆 전원 전담 랙에서 ±400V DC를 공급하는 경로. 800VDC와 공존 가능.", "group": "AIDC 전력"}, {"term": "SST(반도체 변압기)", "en": "Solid-State Transformer", "def": "전력반도체와 고주파 변압기로 감압과 AC→DC 정류를 한 장비에서 수행하는 차세대 변압기.", "group": "AIDC 전력"}, {"term": "SSCB(반도체 차단기)", "en": "Solid-State Circuit Breaker", "def": "반도체 소자로 고장 전류를 빠르게 끊는 차단기. 직류 보호의 필수 기기.", "group": "AIDC 전력"}, {"term": "정류기 / 정류 셸프", "en": "Rectifier / Rectifier Shelf", "def": "교류를 직류로 바꾸는 장치 / 랙 밖에서 AC를 HVDC로 정류하는 전원 플랫폼.", "group": "AIDC 전력"}, {"term": "PSU / PDU", "en": "Power Supply / Distribution Unit", "def": "서버 전원공급장치(AC→저전압 DC) / 랙 단위 전력 분배 장치. 800VDC 전환 시 기능이 축소·통합될 수 있다.", "group": "AIDC 전력"}, {"term": "UPS / BBU", "en": "Uninterruptible Power Supply / Battery Backup Unit", "def": "정전 시 발전기 인계까지(1~15분) 전력을 대는 장치 / 랙 내 ms~수십 초 순간정전 백업 배터리.", "group": "AIDC 전력"}, {"term": "버스덕트(버스웨이)", "en": "Busway / Bus Duct", "def": "금속 케이스 내부 판형 도체로 대전류를 분배해 케이블을 대체하는 설비. 플러그인 박스로 랙 교체가 쉽다.", "group": "AIDC 전력"}, {"term": "패드마운트 변압기", "en": "Pad-mounted Transformer", "def": "지상 콘크리트 패드 위에 설치하는 밀폐형 배전변압기. 신재생·BESS·데이터센터 현장에 널리 쓰인다.", "group": "송변전 기기"}, {"term": "특수변압기", "en": "Special-purpose Transformer", "def": "인버터·PCS·연료전지·정류기에 맞춰 고조파를 견디도록 설계한 변압기. 1년 단위 계약이 많다.", "group": "송변전 기기"}, {"term": "SiC / GaN", "en": "Silicon Carbide / Gallium Nitride", "def": "와이드밴드갭 전력반도체. SiC는 고전압(AC-DC·SST), GaN은 고주파(DC-DC)에 강하다.", "group": "AIDC 전력"}, {"term": "PCS(전력변환장치)", "en": "Power Conversion System", "def": "ESS·연료전지의 DC를 AC로 바꾸거나 전압·주파수를 계통에 맞추는 설비.", "group": "저장"}, {"term": "BESS", "en": "Battery Energy Storage System", "def": "MWh급 배터리 저장 시스템. BTM은 피크저감(0.5~4시간), FTM은 계통 서비스(4~8시간+). 구축비의 60~70%가 배터리.", "group": "저장"}, {"term": "ESS 중앙계약시장", "en": "Central Contract Market for ESS", "def": "국내 정부 주관 장주기 ESS 계약시장. 1·2차 누적 6.8GWh, 평가 기준이 가격에서 국내 공급망 기여로 이동 중.", "group": "저장"}, {"term": "FEOC / PFE", "en": "Foreign Entity of Concern / Prohibited Foreign Entity", "def": "미국 세액공제에서 조달이 제한되는 우려·금지 외국기관(주로 중국계). 비중국 ESS 공급망의 근거.", "group": "정책"}, {"term": "AMPC(45X)", "en": "Advanced Manufacturing Production Credit", "def": "미국 내 배터리·태양광 부품 생산량 비례 세액공제.", "group": "정책"}, {"term": "ITC / PTC", "en": "Investment / Production Tax Credit", "def": "투자비 기준 / 발전량 기준 미국 세액공제. 연료전지 ITC 30%(2032), ESS ITC 30%(2035말), 태양광·풍력은 2026.7.4 착공 기한.", "group": "정책"}, {"term": "OBBBA", "en": "One Big Beautiful Bill Act", "def": "2025년 7월 통과한 미국 세제 법안. IRA 재생에너지 세액공제 기한을 앞당기고 연료전지·ESS ITC는 유지했다.", "group": "정책"}, {"term": "CHARGE Act", "en": "CHARGE Act", "def": "원격 모니터링 기능을 가진 중국 통제 법인 기술의 ESS 수입을 금지하는 미국 법안(2026.2 발의).", "group": "정책"}, {"term": "ISO / RTO", "en": "Independent System Operator / Regional Transmission Organization", "def": "미국 광역 전력계통·도매시장 운영 주체(PJM, MISO, SPP, CAISO, ERCOT, NYISO, ISO-NE).", "group": "미국 전력시장"}, {"term": "PJM", "en": "PJM Interconnection", "def": "미국 동부 13개 주를 관할하는 최대 RTO. 용량시장과 노달 LMP를 운영하며 계통 연결에 6년 이상 걸린다.", "group": "미국 전력시장"}, {"term": "ERCOT", "en": "Electric Reliability Council of Texas", "def": "텍사스 단일 주 계통 운영기구. 접속을 먼저 허용하고 혼잡 시 출력 제한으로 관리해 연결이 3~4년으로 빠르다. 에너지 온리 시장.", "group": "미국 전력시장"}, {"term": "MISO / SPP", "en": "Midcontinent ISO / Southwest Power Pool", "def": "미국 중부·남부 계통 운영기관. 각각 Tranche 2.1·ITP로 765kV 백본을 승인했다.", "group": "미국 전력시장"}, {"term": "FERC", "en": "Federal Energy Regulatory Commission", "def": "미국 연방에너지규제위원회. 도매 전력시장·송전망 접속 규칙(Order 2023·1920·Co-location 등)을 만든다.", "group": "미국 전력시장"}, {"term": "NERC", "en": "North American Electric Reliability Corporation", "def": "북미 전력계통 신뢰도 표준 제정 기관. FERC 승인 시 법적 구속력이 생긴다(위반 시 최대 100만달러/일).", "group": "미국 전력시장"}, {"term": "PUCT / CCN", "en": "Public Utility Commission of Texas / Certificate of Convenience and Necessity", "def": "텍사스 공공유틸리티위원회와 송전선 건설 필요성 인가. CCN 확정 후 토지보상·기자재 조달로 넘어간다.", "group": "미국 전력시장"}, {"term": "STEP", "en": "Strategic Transmission Expansion Plan", "def": "ERCOT의 765kV 중심 전략 송전 확장 계획(약 2,400~2,468마일, 약 330억달러).", "group": "미국 전력시장"}, {"term": "IOU", "en": "Investor-Owned Utility", "def": "민간 투자자가 소유한 미국 규제 전력회사. 주 규제위원회 승인을 받아 투자비를 요금으로 회수한다.", "group": "미국 전력시장"}, {"term": "ESA / LOA", "en": "Electric Service Agreement / Letter of Agreement", "def": "유틸리티와 대형 수요처 간 구속력 있는 최종 전력공급계약 / 그 이전 단계 합의서.", "group": "미국 전력시장"}, {"term": "Take-or-Pay", "en": "Take-or-Pay Contract", "def": "사용 여부와 무관하게 약정 물량 대금을 지불하는 계약. 유틸리티가 투기적 데이터센터 수요를 거르는 장치.", "group": "미국 전력시장"}, {"term": "계약부하", "en": "Contracted Load", "def": "유틸리티가 대형 수요처와 공급을 약정한 미래 부하(GW). CAPEX가 예산이라면 계약부하는 장비 발주의 선행지표.", "group": "미국 전력시장"}, {"term": "계통연계(Interconnection) 단계", "en": "IR → Study → IA → COD", "def": "접속신청(IR) → 계통영향 스터디 → 계통연계계약(IA/ISA) → 건설 → 상업운전(COD). 미국 평균 61개월.", "group": "미국 전력시장"}, {"term": "클러스터 스터디", "en": "Cluster Study (Order 2023)", "def": "선착순 개별심사 대신 준비된 프로젝트를 묶어 한 번에 심사하는 방식. 철회 위약금으로 투기성 신청을 거른다.", "group": "미국 전력시장"}, {"term": "용량시장 / 용량경매", "en": "Capacity Market / Auction", "def": "약 3년 뒤 필요한 공급 가능 용량(MW)을 미리 경매로 확보하는 시장. PJM 2027/28 청산가 $333.44/MW-day(상한).", "group": "미국 전력시장"}, {"term": "ROW(통행권)", "en": "Right-of-Way", "def": "송전선 건설·운영을 위한 토지 통과 권리와 통로 폭. 765kV는 같은 전력 기준 ROW를 크게 줄인다.", "group": "미국 전력시장"}, {"term": "GETs / Reconductoring / DLR", "en": "Grid Enhancing Technologies", "def": "기존 선로 용량을 늘리는 기술군. 전선 교체(50~100%, 3~4년), 동적 송전용량(20~30%, 1~2년), 전압 상향(100~200%, 4~7년).", "group": "미국 전력시장"}, {"term": "Rate Base(요금기저)", "en": "Rate Base", "def": "요금 산정 시 투자보수 대상으로 인정되는 순투자자산. CAPEX→요금기저→감가상각·보수→요금 반영 순으로 가치가 전달된다.", "group": "규제·요금"}, {"term": "총괄원가", "en": "Total Cost of Service", "def": "적정원가 + 적정투자보수(요금기저 × 적정투자보수율). 한국 공공요금 산정의 원칙.", "group": "규제·요금"}, {"term": "적정투자보수율", "en": "Allowed Rate of Return (WACC)", "def": "요금기저에 곱하는 허용 수익률. 한전 3% 초반, 가스공사 5.38%(2026).", "group": "규제·요금"}, {"term": "원가회수율", "en": "Cost Recovery Ratio", "def": "판매수입 ÷ 총괄원가. 100% 미만이면 미회수가 쌓인다. 한전 PBR과 동행해 왔다(역사적 고점 107%, 2016).", "group": "규제·요금"}, {"term": "SMP(계통한계가격)", "en": "System Marginal Price", "def": "시간대별 마지막 급전 발전기의 변동비로 정해지는 전력 도매가격. 국내는 LNG가 결정하는 비중이 83~90%.", "group": "국내 전력시장"}, {"term": "CBP(변동비 반영 시장)", "en": "Cost Based Pool", "def": "발전기 변동비를 기준으로 급전·가격을 정하는 한국 전력시장 방식.", "group": "국내 전력시장"}, {"term": "제로섬(한전 vs 발전사)", "en": "Zero-sum Structure", "def": "발전사 매출이 한전의 비용이라 SMP 상승은 발전사 증익·한전 감익, 하락은 그 반대가 되는 구조.", "group": "국내 전력시장"}, {"term": "연료비조정요금", "en": "Fuel Cost Pass-through", "def": "실적연료비와 기준연료비 차이를 분기 ±5원/kWh 범위에서 요금에 반영하는 항목. 3Q22부터 +5원 상한 유지.", "group": "국내 전력시장"}, {"term": "기후환경요금", "en": "Climate & Environment Charge", "def": "RPS 7.7·ETS 1.1·석탄감축 0.2원으로 구성된 kWh당 9.0원 요금 항목. 2023년 1월 이후 동결.", "group": "국내 전력시장"}, {"term": "SMP 상한제(긴급정산상한가격)", "en": "SMP Cap", "def": "직전 3개월 평균 SMP가 120개월 상위 10%이면 120개월 평균의 150%로 정산가격을 제한하는 한시 제도.", "group": "국내 전력시장"}, {"term": "직접전력구매제도", "en": "Direct Power Purchase", "def": "3만kVA 이상 사용자가 한전을 거치지 않고 전력시장에서 SMP로 직접 사는 제도. 의무존속기간 1→3년.", "group": "국내 전력시장"}, {"term": "LMP(지역별 한계가격)", "en": "Locational Marginal Price", "def": "에너지 한계비용 + 송전혼잡비용 + 송전손실비용으로 구성된 노드별 도매가격. 국내 지역별 차등요금제의 기반.", "group": "국내 전력시장"}, {"term": "혼잡렌트", "en": "Congestion Rent", "def": "송전제약 시 부하 지불액이 발전기 수령액을 초과하는 부분(노드 간 가격차 × 송전량). 망 투자 재원이 될 수 있다.", "group": "국내 전력시장"}, {"term": "전력자급률", "en": "Regional Self-sufficiency", "def": "지역 발전량 ÷ 지역 소비량. 서울 10% 초반, 수도권 약 65%, 호남 약 129%.", "group": "국내 전력시장"}, {"term": "계통관리변전소", "en": "Grid-managed Substation", "def": "계통 포화로 신규 발전 접속이 제한된 변전소(호남·제주·영남 등 205개소). 출력제어 조건부 접속 시 예외 허용.", "group": "국내 전력시장"}, {"term": "전력수급기본계획(전기본)", "en": "Basic Plan for Electricity Supply and Demand", "def": "정부가 2년 주기로 수립하는 15년 단위 전력 수요·설비 계획. 확정 후 6개월 내 장기 송변전설비계획이 나온다.", "group": "국내 전력시장"}, {"term": "장기 송변전설비계획", "en": "Long-term Transmission Plan", "def": "전기본에 맞춰 한전이 세우는 송전선로·변전소 확충·재원 계획. 11차 72.8조원(2024~2038).", "group": "국내 전력시장"}, {"term": "BT(건설 후 양도)", "en": "Build-Transfer", "def": "민간이 전력망을 지어 준공 즉시 한전에 소유권을 넘기는 방식. 전력망특별법 특례로 2029년 말까지 허용.", "group": "국내 전력시장"}, {"term": "사채발행한도", "en": "Bond Issuance Cap", "def": "공사법상 자본금+적립금 대비 사채 발행 배수 제한. 한전 5배 한시 한도가 2027년 말 2배로 환원 예정.", "group": "규제·요금"}, {"term": "원료비 미수금", "en": "Regulated Under-recovery", "def": "가스 원료비가 요금보다 높을 때 손실이 아닌 자산으로 계상한 차액. 회계이익은 보호되나 현금은 이미 지출돼 차입이 늘어난다.", "group": "규제·요금"}, {"term": "평균요금제 / 개별요금제", "en": "Average / Individual Tariff", "def": "가스공사 전체 도입 평균단가로 공급 / 발전사별 개별 계약 단가로 공급하는 발전용 가스 요금제.", "group": "규제·요금"}, {"term": "배당협의체", "en": "Dividend Council", "def": "기획재정부가 정부 출자기관 배당을 결정하는 협의 기구. 별도 순이익 기준, 가이드라인 25~40%.", "group": "규제·요금"}, {"term": "RPS / REC", "en": "Renewable Portfolio Standard / Certificate", "def": "발전사에 재생에너지 공급 비율을 의무화하고 인증서로 이행하는 제도. 2027년 경쟁입찰로 대체 예정.", "group": "국내 전력시장"}, {"term": "CHPS", "en": "Clean Hydrogen Portfolio Standard", "def": "RPS에서 수소 발전을 분리한 청정수소 발전 입찰 구매 제도.", "group": "국내 전력시장"}, {"term": "배출권 유상할당", "en": "Auctioned Emission Allowance", "def": "배출권 중 경매로 사야 하는 비율. 발전 부문 15%(2026) → 50%(2030). 연료비단가에 포함돼 SMP 상승 요인.", "group": "국내 전력시장"}, {"term": "JKM", "en": "Japan Korea Marker", "def": "동북아 도착 기준 LNG 현물 가격(달러/mmbtu). 장기계약 외 추가 물량 가격이라 수급 충격에 민감하다.", "group": "연료"}, {"term": "JCC", "en": "Japan Crude Cocktail", "def": "일본 원유 평균 통관가격. 아시아 유가연동 LNG 장기계약의 벤치마크로 현물 대비 5~6개월 시차가 있다.", "group": "연료"}, {"term": "Henry Hub", "en": "Henry Hub", "def": "미국 천연가스 기준 가격. JKM과의 격차가 미국산 LNG 수출 경제성을 보여준다.", "group": "연료"}, {"term": "BCM / mmbtu", "en": "Billion Cubic Meters / Million BTU", "def": "천연가스 부피 단위(10억 입방미터) / 열량 기준 가격 단위.", "group": "연료"}, {"term": "FLNG", "en": "Floating LNG", "def": "해상에서 가스를 생산·액화·저장하는 부유식 설비(Prelude, Coral 등).", "group": "연료"}, {"term": "Dated Brent", "en": "Dated Brent", "def": "북해 브렌트 실물 현물 가격 평가치. 공급 차질기에 선물보다 높아지는 현물 프리미엄이 SMP 과소추정의 원인.", "group": "연료"}, {"term": "호르무즈 해협", "en": "Strait of Hormuz", "def": "UAE·오만과 이란 사이의 해협으로 세계 해상 원유 수송의 약 20%, 카타르 LNG 수출의 약 93%가 지난다.", "group": "연료"}, {"term": "LCOE(균등화발전원가)", "en": "Levelized Cost of Electricity", "def": "설비 수명 기간 총비용을 총발전량으로 나눈 단가. 원전 79~220달러/MWh(Lazard), 복합가스 약 8센트/kWh.", "group": "발전"}, {"term": "FOAK / NOAK", "en": "First / Nth-of-a-Kind", "def": "최초 호기와 반복 건설 호기. 반복될수록 비용이 낮아져야 하지만 서구 원전은 FOAK가 반복되는 악순환을 겪었다.", "group": "발전"}, {"term": "IDC(건설중 이자)", "en": "Interest During Construction", "def": "건설 기간 금융비용. 원전 공기 5→10년 시 비중 18.7%→32.4%(금리 7% 가정).", "group": "발전"}, {"term": "LTO(수명연장)", "en": "Long-Term Operation", "def": "설계수명 이후 개보수를 거쳐 계속 운전하는 것. 1기당 10~20억달러, 신규 건설 대비 총비용 50% 이상 절감.", "group": "발전"}, {"term": "BOP", "en": "Balance of Plant", "def": "발전소 주기기 외 보조 설비(복수기·급수가열기·주변압기·계측제어 등). 원전 1기당 약 1~1.5천억원 규모.", "group": "발전"}, {"term": "SMR", "en": "Small Modular Reactor", "def": "300MW 이하 모듈형 원자로. 공장 제작·현장 설치와 부하추종이 가능해 데이터센터 전원 후보로 거론된다(상세는 원전 데스크).", "group": "발전"}, {"term": "HALEU", "en": "High-Assay Low-Enriched Uranium", "def": "농축도 5~19.75%의 4세대 원자로 연료. 상업 공급이 러시아에 편중돼 SMR 확산의 병목.", "group": "발전"}, {"term": "CfD", "en": "Contract for Difference", "def": "기준가격과 시장가격 차이를 정산하는 발전 계약. 영국 해상풍력 AR7은 20년으로 연장.", "group": "발전"}, {"term": "EPC / SPC", "en": "Engineering·Procurement·Construction / Special Purpose Company", "def": "설계·조달·시공 일괄 수행 / 대형 프로젝트의 발주·자금조달 전담 특수목적법인.", "group": "계약·재무"}, {"term": "Cost-plus / LSTK", "en": "Cost-plus / Lump Sum Turn Key", "def": "실비에 이윤을 더해 정산(원가 리스크 작음) / 총액확정 일괄도급(비용 초과 리스크를 시공사가 짐).", "group": "계약·재무"}, {"term": "SOTP", "en": "Sum of the Parts", "def": "사업부별 가치를 합산해 기업가치를 산정하는 방법. 전력기기+건설, 원전+가스터빈 기업에 쓰인다.", "group": "밸류에이션"}, {"term": "Forward PER", "en": "12m Forward P/E", "def": "향후 12개월 예상 이익 기준 주가수익비율. 전력기기 빅3 고점 53.6배(2026-05).", "group": "밸류에이션"}, {"term": "네오클라우드", "en": "Neocloud", "def": "GPU 임대에 특화된 신생 클라우드 사업자(CoreWeave, Nebius 등). 데이터센터 유동화증권·컴퓨트 파이낸싱으로 조달 여건 개선.", "group": "AIDC 전력"}, {"term": "전기화", "en": "Electrification", "def": "교통·난방·산업공정이 석유·가스에서 전기로 전환되는 흐름. 최종 에너지 중 전기 비중 약 21%(IEA).", "group": "기초 개념"}, {"term": "전기국가", "en": "Electro-state", "def": "에너지 공급을 전기·국내 생산 재생에너지 중심으로 전환한 국가 모델. 탈탄소가 아닌 안보 논리로 정당화된다.", "group": "기초 개념"}, {"term": "에너지 트릴레마", "en": "Energy Trilemma", "def": "안보성·형평성·환경성의 세 가치. 러-우 전쟁과 호르무즈 쇼크로 무게중심이 안보성으로 이동했다.", "group": "기초 개념"}, {"term": "섬 전력망", "en": "Island Grid", "def": "주변국과 대규모 연계선이 없어 내부 수급만으로 균형을 맞춰야 하는 계통(한국·일본·대만).", "group": "기초 개념"}, {"term": "MASGA / MANUGA", "en": "Make American Shipbuilding / Nuclear Great Again", "def": "한국의 대미 투자 협력 패키지(조선·원자력). 대미투자 3,500억달러의 원전 부문 연결 고리.", "group": "정책"}], "sources": {"orig": ["IEA(WEO2025·Electricity 2026)", "EIA(Form 860M·STEO)", "FERC", "NERC", "LBNL(Queued Up)", "U.S. DOE", "PJM", "ERCOT", "MISO", "SPP", "PUCT", "CAISO·NYISO·ISO-NE", "AEP·Duke·Dominion·NextEra 등 미국 유틸리티 IR", "EEI", "S&P Global", "Wood Mackenzie", "BloombergNEF", "Bloomberg", "USITC·US Census·Global Trade Atlas", "FRED(BLS PPI)", "관세청 TRASS", "한국무역협회(KITA)", "한국전력", "전력거래소(KPX·EPSIS)", "산업통상자원부", "기후에너지환경부", "12차 전력수급기본계획 총괄위원회", "한국가스공사", "한국수력원자력", "IAEA(PRIS)", "WNA", "Lazard", "OECD NEA", "NVIDIA·Open Compute Project", "Bloom Energy 설문", "Cleanview·Sightline Climate", "GWEC·WindEurope", "Energy-charts", "Platts", "IMF", "Data Center Watch", "Mordor Intelligence", "Rystad Energy·PTR Inc", "CBRE"], "notes": ["미국 데이터센터 계통연계 부하는 리포트마다 집계 기업 수(16사·18사)와 분기가 달라 136GW(3Q25, 16사 진행 단계)와 168·181GW(18사 구속력 계약)를 같은 시계열로 이어 붙이면 안 된다. 신청 단계도 544GW(3Q25)·590GW(4Q25, 신청+진행 가능성)·641GW(1Q26)로 정의가 조금씩 다르다.", "한전 이익 민감도는 리포트별로 크게 다르다: 원전 이용률 1%p당 +1,840억·+2,900억·약 +4,600억원, SMP 반영 시차 3~5개월 vs 5~6개월. 전제(유가·환율·발전믹스)가 다르므로 범위로 인용해야 한다. 한전 2026E ROE도 22%(2025-11)에서 5.2%(2026-05)로 호르무즈 쇼크 전후 전제가 완전히 바뀌었다.", "효성중공업 수주잔고는 반기보고서 공시 23.83조원과 경영관리 기준 약 17.5조원이 병존한다. 효성 1H26 신규수주를 원문이 ‘7,500억원’으로 표기했으나 가이던스 대비 비율로 볼 때 약 7.5조원의 오기로 판단했다(추정). 2025-10 발간 리포트의 커버리지 6사 3Q25 영업이익 합산(요약 2,371억원 vs 기업별 합산 약 6,234억원)도 원문 불일치다.", "서해안 HVDC 사업비는 7.9조원(정부 초기 발표, 620km), 약 11조원(1단계 사업비 추정), 12조원(한전 11차 계획), 13.6조원(길이 비례 환산)으로 기준이 제각각이다. LS ELECTRIC 부산 초고압 CAPA도 6,000억원과 7,000억원(LS파워솔루션 포함 여부) 표기가 혼재한다.", "초고압 변압기 리드타임은 ‘제작 기간(약 18~24개월)’과 ‘주문~인도(3~5년, 슬롯 대기 포함)’가 다른 개념으로 쓰였고, ‘765kV 공급 가능 업체 5곳 내외(북미 공급 기준)’와 ‘초고압 제작 가능 업체 10곳 미만(전 세계)’도 범위가 다르다. 미국 변압기 수입 중 한국 비중은 18%(2025 YTD, 초고압)·17.7%(2025, 전체)·약 20%(10MVA 초과 액체식)로 품목 정의에 따라 다르다.", "본 데스크의 수치는 리포트 발간 시점의 추정·가이던스가 다수 포함돼 있다(태그 ‘추정’). 회사 가이던스는 연중 여러 차례 상향됐으므로(HD현대 42→52억달러 등) 딜 시점의 최신 공시로 재확인해야 한다. 원전 노형·핵연료 상세는 원전 데스크를 참조한다."]}, "desks": [{"key": "hc", "name": "헬스케어", "url": "https://kj-ryan-ra.github.io/healthcare-desk/"}, {"key": "oilchem", "name": "정유·화학", "url": "../oilchem/"}, {"key": "transition", "name": "에너지전환", "url": "../transition/"}, {"key": "power", "name": "전력인프라", "url": "../power/"}, {"key": "nuclear", "name": "원전", "url": "../nuclear/"}, {"key": "metals", "name": "철강·비철", "url": "../m <script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const tag=t=>!t?'':`<span class="tag ${t==='확인'?'t-ok':t==='추정'?'t-warn':t==='미확인'?'t-alert':'t-dim'}">${esc(t)}</span>`;
const tone=t=>t==='긍정'?'<span class="tag t-ok">긍정</span>':t==='부정'?'<span class="tag t-alert">부정</span>':'<span class="tag t-dim">중립</span>';
const M=D.meta;
document.title=M.title.replace(' 리서치 데스크','')+' 리서치 데스크';
$('#b-eng').textContent=M.eng; $('#b-title').textContent=M.short||M.title; $('#b-sub').textContent=M.subtitle;
$('#foot').textContent=`${M.version} · 리포트 ${D.reports.length}건`;
$('#desks').innerHTML='<div class="dl">SECTOR DESKS</div>'+(D.desks||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener"${x.key===M.key?' class="cur"':''}>${esc(x.name)}</a>`).join('');
$('#cut').textContent=`DATA CUT ${M.cut}`;

const TABS=[
 ['기초 체계',[['map','산업 지도'],['prod','제품·기술 백과'],['econ','수익 구조'],['ind','핵심 지표'],['deep','딥다이브 라이브러리']]],
 ['시장 · 자본',[['mkt','시장·수급'],['cyc','사이클·내러티브'],['pol','정책·지정학 워치'],['val','밸류에이션']]],
 ['데스크 도구',[['chk','체크포인트'],['uni','커버리지 유니버스'],['cal','이벤트 캘린더'],['fact','수치 DB'],['gl','용어 사전'],['src','출처·데이터 품질']]]
];
let nav='',panes='',n=0;const NUM={};
TABS.forEach(([g,items])=>{nav+=`<div class="nav-group">${g}</div>`;items.forEach(([id,name])=>{n++;const k=String(n).padStart(2,'0');NUM[id]=k;nav+=`<button data-p="${id}"><span class="k">${k}</span>${name}</button>`;panes+=`<section class="pane" id="p-${id}"></section>`;});});
$('#nav').innerHTML=nav;$('#panes').innerHTML=panes;
const head=(id,en,title,lede)=>`<div class="eyebrow">${NUM[id]} — ${en}</div><h2>${title}</h2>${lede?`<p class="lede">${md(lede)}</p>`:''}`;
const table=(cols,rows)=>`<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function chips(el,groups,cb,label='전체'){el.innerHTML=[label,...groups].map((g,i)=>`<button class="chip" aria-pressed="${i===0}" data-g="${esc(i?g:'')}">${esc(g)}</button>`).join('');el.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;el.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b.dataset.g);});}
const uniq=a=>[...new Set(a.filter(Boolean))];

/* 01 map */
(function(){const m=D.map;
 let h=head('map','Industry Map',M.title.replace(' 리서치 데스크','')+' 산업 지도',m.lede);
 h+=`<div class="sec"><h3>한눈에 보는 좌표</h3><div class="grid kg" style="margin-top:16px">${m.kpis.map(k=>`<div class="kpi"><span class="lab">${esc(k.lab)}</span><span class="val">${esc(k.val)}</span><span class="cap">${md(k.cap)} ${tag(k.tag)}</span></div>`).join('')}</div></div>`;
 h+=`<div class="sec"><h3>밸류체인</h3><p class="note">${md(m.chain_note)} 각 카드 하단은 <b>그 단계에서 돈이 벌리는 방식</b>이다.</p><div class="flow">${m.chain.map((c,i)=>(i?'<div class="farr">→</div>':'')+`<div class="fnode"><div class="n">${esc(c.no)}</div><div class="t">${esc(c.name)}</div></div>`).join('')}</div>
 <div class="vc">${m.chain.map(c=>`<div class="vcx"><div class="r">${esc(c.no)}</div><h4>${esc(c.name)}</h4><p>${md(c.role)}</p><div class="co"><b>마진 원천</b> ${md(c.margin)}<br><b>국내</b> ${md(c.kr)}</div></div>`).join('')}</div></div>`;
 h+=`<div class="sec"><h3>하위 섹터</h3><div class="grid g2" style="margin-top:16px">${m.segments.map(s=>`<div class="card"><h4>${esc(s.name)}</h4><p>${md(s.desc)}</p><p style="margin-top:9px"><b>핵심 변수</b> ${md(s.driver)}</p><p style="margin-top:5px"><b>사이클</b> ${md(s.cycle)}</p><p style="margin-top:5px;color:var(--ink-3)"><b>국내</b> ${md(s.kr)}</p></div>`).join('')}</div></div>`;
 h+=`<div class="sec"><h3>이 도구의 사용법</h3><div class="grid g2" style="margin-top:16px">${m.howto.map(x=>`<div class="card"><h4>${esc(x.title)}</h4><p>${md(x.body)}</p></div>`).join('')}</div></div>`;
 $('#p-map').innerHTML=h;})();

/* 02 products */
(function(){const P=D.products;
 $('#p-prod').innerHTML=head('prod','Products & Technology','제품·기술 백과','이 산업에서 거래되는 제품·기술·설비를 하나씩 풀었다. 각 항목을 펼치면 **무엇인가 → 밸류체인 위치 → 가격 결정 변수 → 체크포인트 → 국내 기업** 순으로 나온다.')+`<div class="tools"><input class="search" id="prod-q" placeholder="제품·기술 검색"><span class="count" id="prod-c"></span></div><div class="chips" id="prod-ch"></div><div class="mods" id="prod-l"></div>`;
 let g='',q='';const draw=()=>{const L=P.filter(p=>(!g||p.group===g)&&(!q||JSON.stringify(p).toLowerCase().includes(q)));$('#prod-c').textContent=L.length+'개';
 $('#prod-l').innerHTML=L.map(p=>`<details class="mod"><summary><span class="mname">${esc(p.name)}</span><span class="men">${esc(p.en)}</span><span class="pill">${esc(p.group)}</span></summary><div class="body"><dl><dt>무엇인가</dt><dd>${md(p.what)}</dd><dt>밸류체인 위치</dt><dd class="mono" style="font-size:13px">${md(p.chain)}</dd><dt>가격·수요 결정 변수</dt><dd>${md(p.driver)}</dd><dt>체크포인트</dt><dd>${md(p.check)}</dd><dt>국내 관련 기업</dt><dd>${md(p.kr)}</dd></dl></div></details>`).join('');};
 chips($('#prod-ch'),uniq(P.map(p=>p.group)),x=>{g=x;draw();});$('#prod-q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();draw();});draw();})();

/* 03 econ */
(function(){const E=D.economics;
 $('#p-econ').innerHTML=head('econ','Unit Economics','수익 구조',E.lede)+`<div class="mods" style="margin-top:22px">${E.models.map((x,i)=>`<details class="mod"${i<2?' open':''}><summary><span class="mname">${esc(x.name)}</span></summary><div class="body"><div class="formula">${esc(x.formula)}</div><dl><dt>설명</dt><dd>${md(x.explain)}</dd><dt>민감도</dt><dd>${md(x.sensitivity)}</dd><dt>실제 수치 예시</dt><dd>${md(x.example)}</dd></dl></div></details>`).join('')}</div>`;})();

/* 04 indicators */
(function(){const I=D.indicators;

/* 06 market */
(function(){const K=D.market;
 const fmt=v=>{const a=Math.abs(v);return (a>=1000?v.toLocaleString('ko-KR',{maximumFractionDigits:0}):a>=100?v.toFixed(0):a>=10?(+v.toFixed(1)).toString():(+v.toFixed(2)).toString());};
 const bars=b=>{const vs=b.items.map(i=>+i.v);const mx=Math.max(...vs,0),mn=Math.min(...vs,0);const span=(mx-mn)||1;const z=(-mn)/span*100;
  return `<div class="chart"><h4>${esc(b.title)}</h4><div class="u">단위 ${esc(b.unit)} · 빗금 = 추정</div><div class="bars">${b.items.map(i=>{const v=+i.v;const w=Math.abs(v)/span*100;const left=v>=0?z:z-w;return `<div class="bar"><span class="bl">${esc(i.l)}</span><span class="bt">${mn<0?`<span class="zero" style="left:${z}%"></span>`:''}<span class="bf${v<0?' neg':''}${i.tag==='추정'?' est':''}" style="left:${left}%;width:${Math.max(w,.6)}%"></span></span><span class="bv">${fmt(v)}</span></div>`;}).join('')}</div>${b.note?`<div class="cn">${md(b.note)}</div>`:''}</div>`;};
 $('#p-mkt').innerHTML=head('mkt','Market & Supply-Demand','시장·수급',K.lede)+`<div class="sec"><h3>차트</h3><div class="grid g2" style="margin-top:16px">${K.bars.map(bars).join('')}</div></div><div class="sec"><h3>비교표</h3>${K.tables.map(t=>`<div class="tcap">${esc(t.title)}</div>${table(t.cols,t.rows)}${t.note?`<div class="tnote">${md(t.note)}</div>`:''}`).join('')}</div>`;})();

/* nav + theme */
const show=id=>{if(!document.getElementById('p-'+id))id='map';document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+id));document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.p===id));};
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;show(b.dataset.p);try{history.replaceState(null,'','#'+b.dataset.p)}catch(_){}window.scrollTo(0,0);});
show((location.hash||'#map').slice(1));
const root=document.documentElement;const setT=t=>{root.setAttribute('data-theme',t);document.querySelectorAll('.tsb').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));try{localStorage.setItem('desk-theme',t)}catch(_){}};
document.querySelectorAll('.tsb').forEach(b=>b.addEventListener('click',()=>setT(b.dataset.t)));
try{const t=localStorage.getItem('desk-theme');if(t)setT(t);}catch(_){}
})();
