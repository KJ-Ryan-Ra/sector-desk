 도구이지 수주 전망이 아니다.", "title": "딜 관점", "tone": "warn"}]}, {"h": "가이던스 상향 트래커(2026)", "blocks": [{"t": "table", "cols": ["기업", "연초 가이던스", "상향 가이던스", "상향 시점", "상향 근거"], "rows": [["HD현대일렉트릭", "42.22억달러", "51.9~52억달러", "2026-07-06", "숙련인력 확보로 증산, 배전·회전기기 추가, 빅테크 1.1조원 계약"], ["효성중공업(중공업)", "8.36~8.4조원", "12.0조원", "2026-07-31", "765kV 물량 잔고 반영, 1Q26 최대 수주 4.2조원"], ["LS ELECTRIC", "3.9~4.1조원", "6.0~6.5조원", "2Q26", "빅테크 직수주, 국내외 데이터센터(1H26 DC 수주 1.2조원+ 추정)"], ["산일전기", "7,000억원", "-", "-", "하반기 데이터센터·전력망 수주 회복 기대"]], "note": "회사 공시·IR. 1Q26 달성률은 HD현대 43%, 효성 약 50%, LS 27~28%, 산일 26%였다."}]}, {"h": "Bloom향 특수변압기 수주 민감도(산일전기)", "blocks": [{"t": "table", "cols": ["Bloom 설치 용량", "Project A 단가 기준", "Project A+B 단가 기준"], "rows": [["100MW", "약 42억원", "약 63억원"], ["1GW", "약 419억원", "약 625억원"], ["2GW(2026말 CAPA)", "약 838억원", "약 1,250억원"], ["2.8GW(Oracle 계약)", "약 1,173억원", "약 1,750억원"], ["5GW(잠재 CAPA)", "약 2,096억원", "약 3,125억원"]], "note": "리포트 추정(확인 단가 기준). 고객 집중도(상위 4개사 약 90%)와 1년 계약 구조를 함께 본다."}], "tag": "추정"}, {"h": "해외 피어 수주 좌표", "blocks": [{"t": "table", "cols": ["기업(부문)", "신규수주·잔고", "비고"], "rows": [["GE Vernova(Electrification)", "1Q26 신규 71억달러(+110%), 그중 데이터센터 24억달러", "Prolec GE 인수 효과 포함. Electrification 잔고 300억 → 600억달러(2028 목표)"], ["GE Vernova(가스터빈)", "잔고 100GW(확정 44 + 슬롯예약 56)", "2030년까지 잔여 슬롯 약 10GW"], ["ABB(Electrification)", "1Q26 신규 66억달러(+51%)", "북미 데이터센터 수주 세 자릿수 성장"], ["Siemens Energy(Grid Technology)", "잔고 420억유로(2021~25년 4배)", "FY26 매출 성장 가이던스 19~21% → 25~27%"], ["Vertiv", "백로그 150억달러(+109%), B/B 약 2.9배", "4Q25"], ["Prysmian(송전)", "잔고 약 170억유로", "2025말. 유럽 3사가 HVDC 슬롯의 약 2/3"]], "note": "각 사 발표(리포트 인용). 해외 피어의 수주 가이던스 변화는 국내 업체 멀티플에 직접 전이된다."}]}]}, "theme": {"title": "테마·사이클", "en": "Themes & Cycle", "h2": "테마·사이클 — 여섯 개의 사이클이 겹쳐 있다", "lede": "‘전력 인프라 슈퍼사이클’은 하나의 사이클이 아니다. 초고압 송전, 데이터센터 배전, 온사이트 발전, 800VDC, 국내 Grid, 그리고 원가에 흔들리는 유틸리티까지 **속도와 방향이 다른 여섯 개의 사이클이 겹쳐 있다.** 어느 층이 먼저 오고 어느 층이 공급 증가와 부딪히는지를 구분해야 같은 ‘전력주’ 안에서 기업별 기울기를 설명할 수 있다. 이 탭은 하위 섹터별 현재 위치 → 1년간 인식 변화 → 상방·하방 논리 → 다음 체크 순서로 읽는다.", "sections": [{"h": "지금 어디에 있나 — 업황은 견조, 멀티플은 재평가 대기", "blocks": [{"t": "callout", "text": "2026년 9월 현재 전력기기는 ‘업황은 견조, 멀티플은 조정 후 재평가 대기’ 국면이다. 5월 고점 대비 최대 58% 하락에도 빅3가 모두 2Q에 연간 수주 가이던스를 올렸고(HD현대 52억달러, 효성 12조원, LS 6~6.5조원) 미국 유틸리티 CAPEX와 계약부하는 계속 상향 중이다. 공급 측에서는 2027년 하반기 업계 증설 물량이 본격 출하되는 시점이 다음 분기점이며, 국내에서는 12차 전기본 확정(12월 목표)과 송변전 투자비 발표가 두 번째 수요축을 가시화할 트리거다. 한전·가스공사는 호르무즈 원가 충격이 3Q부터 반영되는 실적 바닥 구간이다.", "title": "2026년 9월 현재"}, {"t": "figure", "svg": "<svg viewBox=\"0 0 920 360\" role=\"img\" aria-label=\"이번 사이클은 수요 층이 차례로 덧붙는 구조이며, 2027년 하반기 증설 물량이 반대편에 있다\"><line x1=\"260\" y1=\"34\" x2=\"260\" y2=\"312\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><text x=\"260\" y=\"330\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.7\">2022<\/text><line x1=\"332\" y1=\"34\" x2=\"332\" y2=\"312\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><text x=\"332\" y=\"330\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.7\">2023<\/text><line x1=\"404\" y1=\"34\" x2=\"404\" y2=\"312\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><text x=\"404\" y=\"330\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.7\">2024<\/text><line x1=\"476\" y1=\"34\" x2=\"476\" y2=\"312\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><text x=\"476\" y=\"330\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.7\">2025<\/text><line x1=\"548\" y1=\"34\" x2=\"548\" y2=\"312\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><text x=\"548\" y=\"330\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.7\">2026<\/text><line x1=\"620\" y1=\"34\" x2=\"620\" y2=\"312\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><text x=\"620\" y=\"330\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.7\">2027<\/text><line x1=\"692\" y1=\"34\" x2=\"692\" y2=\"312\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><text x=\"692\" y=\"330\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.7\">2028<\/text><line x1=\"764\" y1=\"34\" x2=\"764\" y2=\"312\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><text x=\"764\" y=\"330\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.7\">2029<\/text><line x1=\"836\" y1=\"34\" x2=\"836\" y2=\"312\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><text x=\"836\" y=\"330\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.7\">2030<\/text><text x=\"250\" y=\"56\" font-size=\"11.5\" text-anchor=\"end\" font-weight=\"600\">초고압 송전(북미 765·345kV)<\/text><rect x=\"260\" y=\"40\" width=\"619.1999999999935\" height=\"22\" rx=\"3\" style=\"fill:var(--accent);fill-opacity:0.4\"/><text x=\"250\" y=\"90\" font-size=\"11.5\" text-anchor=\"end\" font-weight=\"600\">765kV 제품 믹스<\/text><rect x=\"620\" y=\"74\" width=\"259.19999999999345\" height=\"22\" rx=\"3\" style=\"fill:var(--accent);fill-opacity:0.4\"/><text x=\"250\" y=\"124\" font-size=\"11.5\" text-anchor=\"end\" font-weight=\"600\">데이터센터 배전 블록<\/text><rect x=\"476\" y=\"108\" width=\"403.19999999999345\" height=\"22\" rx=\"3\" style=\"fill:var(--accent);fill-opacity:0.4\"/><text x=\"250\" y=\"158\" font-size=\"11.5\" text-anchor=\"end\" font-weight=\"600\">온사이트·BTM(ESS·SOFC·엔진)<\/text><rect x=\"540.8000000000065\" y=\"142\" width=\"338.3999999999869\" height=\"22\" rx=\"3\" style=\"fill:var(--accent);fill-opacity:0.4\"/><text x=\"250\" y=\"192\" font-size=\"11.5\" text-anchor=\"end\" font-weight=\"600\">800VDC·SST 상용화<\/text><rect x=\"620\" y=\"176\" width=\"259.19999999999345\" height=\"22\" rx=\"3\" style=\"fill:var(--accent);fill-opacity:0.22\"/><rect x=\"620\" y=\"176\" width=\"259.19999999999345\" height=\"22\" rx=\"3\" fill=\"none\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\" style=\"stroke:var(--accent)\"/><text x=\"250\" y=\"226\" font-size=\"11.5\" text-anchor=\"end\" font-weight=\"600\">FTM 재가속(Order 2023)<\/text><rect x=\"692\" y=\"210\" width=\"187.19999999999345\" height=\"22\" rx=\"3\" style=\"fill:var(--accent);fill-opacity:0.22\"/><rect x=\"692\" y=\"210\" width=\"187.19999999999345\" height=\"22\" rx=\"3\" fill=\"none\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\" style=\"stroke:var(--accent)\"/><text x=\"250\" y=\"260\" font-size=\"11.5\" text-anchor=\"end\" font-weight=\"600\">국내 Grid(12차 전기본)<\/text><rect x=\"620\" y=\"244\" width=\"259.19999999999345\" height=\"22\" rx=\"3\" style=\"fill:var(--accent);fill-opacity:0.22\"/><rect x=\"620\" y=\"244\" width=\"259.19999999999345\" height=\"22\" rx=\"3\" fill=\"none\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\" style=\"stroke:var(--accent)\"/><text x=\"250\" y=\"294\" font-size=\"11.5\" text-anchor=\"end\" font-weight=\"600\" style=\"fill:var(--alert)\">업계 증설 물량 출하<\/text><rect x=\"656.0\" y=\"278\" width=\"223.19999999999345\" height=\"22\" rx=\"3\" style=\"fill:var(--alert);fill-opacity:0.4\"/><text x=\"879.1999999999935\" y=\"20\" font-size=\"10.5\" text-anchor=\"end\" fill-opacity=\"0.7\">점선 테두리 = 리포트 전망<\/text><\/svg>", "cap": "**결론: 이번 사이클은 하나의 수요가 아니라 층이 계속 덧붙는 구조다.** 초고압 송전(2022~) 위에 데이터센터 배전(2025~)과 온사이트·ESS가 얹히고, 765kV 제품 믹스·800VDC(2027~), 미국 FTM 재가속(2028~), 국내 Grid가 차례로 예고돼 있다. 반대편에는 2027년 하반기부터 본격화될 업계 동시 증설 물량이 있으므로, 다음 국면의 관건은 새로 붙는 층이 늘어난 공급을 흡수하느냐다. 시작 시점은 리포트가 제시한 시점을 단순화한 것이다."}], "note": "리포트 발간 기간(2025.10~2026.09) 동안 전력기기 업황 톤은 일관되게 긍정적이었고, 유틸리티 톤은 원가 방향에 따라 긍정→부정→중립으로 흔들렸다."}, {"h": "① 변압기·차단기 — 가격(P)의 시대에서 물량(Q)과 765kV 믹스의 시대로", "blocks": [{"t": "p", "text": "송전망의 전압을 올리고 내리는 초고압 변압기(154~765kV)와 GIS·차단기·리액터, 그리고 수요지 인근의 배전변압기·배전반을 만든다. 2022년 초고압 송전이 먼저 호황에 들어갔고 2025년부터 AI 데이터센터 배전이 두 번째 사이클로 겹쳤다. 한국 업체는 빠른 납기와 선제 증설로 미국 수입시장 점유율을 끌어올렸다."}, {"t": "brief", "items": [{"k": "수요 동인", "v": "미국 유틸리티 CAPEX·765kV 송전망, 데이터센터 블록 증설, 리드타임과 판가(PPI), 증설 완공 시점(Q)"}, {"k": "사이클 성격", "v": "수주는 1~5년 뒤 매출로 전환되는 장기 사이클. 과거 2000년대 슈퍼사이클 후 2008년 과잉 CAPA로 붕괴한 경험 때문에 업체들이 보수적으로 증설 중"}, {"k": "지금(2026-09)", "v": "빅3가 2Q26에 수주 가이던스를 20~50% 올렸고(HD현대 52억달러·효성 12조원·LS 6~6.5조원) 가동률은 95~108%다. 다음 분기점은 2027년 하반기 업계 증설 물량 출하와 765kV 발주(2026~2027)의 속도다."}, {"k": "국내 연결", "v": "HD현대일렉트릭, 효성중공업, LS ELECTRIC, 일진전기, 산일전기, 제룡전기"}]}]}, {"h": "② 전선·해저케이블·HVDC — 매출이 아니라 잔고와 포설선으로 본다", "blocks": [{"t": "p", "text": "초고압 지중·해저 케이블과 HVDC 케이블, 이를 바다에 까는 포설선과 시공까지 묶은 턴키 사업이다. 상위 4개사가 해저케이블의 약 85%를 차지하는 과점이며, 해상풍력·국가 간 연계선·서해안 HVDC 에너지고속도로가 수요를 만든다. 매출은 구리값에 출렁이므로 수주잔고와 마진으로 봐야 한다."}, {"t": "brief", "items": [{"k": "수요 동인", "v": "해상풍력 설치량·입찰, HVDC 프로젝트 발주(서해안 8GW, 유럽 TSO 프레임워크), 포설선 확보, 구리 가격"}, {"k": "사이클 성격", "v": "프로젝트형이라 연도별 변동이 크고 공장·포설선 증설에 3~4년이 걸린다. 잔고/매출 5년 이상(유럽 3사 5.4년)이면 공급 과잉 우려가 낮다"}, {"k": "지금(2026-09)", "v": "대한전선 잔고가 4조원을 넘었고(2026-06), 서해안 HVDC 해저케이블 사업자 선정(2026)과 변환설비 선정(2027)이 다음 이벤트다. 유럽 3사는 2030년까지 HVDC 슬롯을 채웠다."}, {"k": "국내 연결", "v": "대한전선, LS전선(비상장), LS에코에너지, LS마린솔루션, 가온전선, 일진전기"}]}]}, {"h": "③ AIDC 전력 — 착공 속도가 단주기를, 800VDC가 다음 제품을 정한다", "blocks": [{"t": "p", "text": "AI 랙 전력밀도가 10kW에서 1MW로 커지면서 데이터센터 내부 전력 구조(415V AC→800V DC), 무정전·저장(BBU·UPS·BESS), 온사이트 연계 설비가 새 시장이 됐다. 1GW 캠퍼스는 50MW 블록 20개가 반복 발주되는 구조라 중압 변압기·배전반·정류 모듈 수요가 누적된다."}, {"t": "brief", "items": [{"k": "수요 동인", "v": "빅테크 CAPEX, 랙당 kW(Rubin/Rubin Ultra), 800VDC 표준화 일정(2027년 상용화), 온사이트 발전 비중, NERC 신뢰도 표준"}, {"k": "사이클 성격", "v": "데이터센터 착공 전환율에 연동된 단주기. 2026년은 착공 지연 우려가 컸고 2H26~2027이 800VDC 공급망 발주·초기 상용화 구간"}, {"k": "지금(2026-09)", "v": "2026년 가동 예정 16.2GW 중 약 5GW만 건설 중이라는 착공 지연 우려가 있고, 800VDC는 2H26 공급망 발주·2027년 초기 상용화 구간이다. LS ELECTRIC 1H26 신규수주의 약 45%가 데이터센터다."}, {"k": "국내 연결", "v": "LS ELECTRIC, 산일전기, 가온전선, 삼성SDI, LG에너지솔루션, 서진시스템, 비나텍, 한중엔시에스"}]}]}, {"h": "④ 발전설비 — 가스터빈 슬롯이 데이터센터 성장의 상한이다", "blocks": [{"t": "p", "text": "데이터센터의 24시간 부하를 받쳐줄 수 있는 디스패처블 전원(가스터빈·원전·연료전지·엔진)을 만드는 산업이다. 가스터빈 3사의 2030년까지 잔여 슬롯이 거의 소진돼 중속엔진·연료전지 같은 온사이트 대체 전원이 부상했다. 원전은 이 데스크에서는 전원 믹스와 기자재 수요 관점으로만 다룬다(노형·연료는 원전 데스크)."}, {"t": "brief", "items": [{"k": "수요 동인", "v": "가스터빈 슬롯·리드타임(4~6년)·가격(2027년 약 600달러/kW 전망), 데이터센터 온사이트 비중, 대미 원전 투자, SMR 인허가"}, {"k": "사이클 성격", "v": "발전소 건설계획 증가가 2~3년 뒤 변압기·차단기 발주로 이어지는 선행 사이클. 가스터빈 증설분은 2028년 이후 출하"}, {"k": "지금(2026-09)", "v": "GEV 잔고 100GW, 2030년까지 잔여 슬롯 약 10GW(1Q26). 두산에너빌리티 1Q26 가스터빈 10기 수주, HD현대중공업 중속엔진 684MW 수주로 대체 전원 시장이 실증됐다."}, {"k": "국내 연결", "v": "두산에너빌리티, HD현대중공업, 두산퓨얼셀, 비에이치아이, 한전기술, 한전KPS, 씨에스윈드"}]}]}, {"h": "⑤ 국내 유틸리티 — 원가 방향이 톤을, 회수 구조가 멀티플을 정한다", "blocks": [{"t": "p", "text": "한전(송배전·판매 독점), 한국가스공사(LNG 도입·도매), 지역난방공사(열·전기), 발전 자회사와 민간 발전사로 구성된다. 요금이 정부 규제를 받아 원가 변동과 요금 조정 사이의 시차가 이익을 좌우하고, 밸류에이션은 PBR-ROE와 배당으로 본다. 2026년에는 호르무즈 쇼크 원가 충격과 12차 전기본 송변전 투자 부담이 동시에 걸려 있다."}, {"t": "brief", "items": [{"k": "수요 동인", "v": "유가·JKM·환율→SMP(3~6개월 시차), 원전 이용률, 전기·가스 요금 조정, 사채한도, 미수금"}, {"k": "사이클 성격", "v": "원가 하락기에는 한전 증익·민간 발전사 감익, 원가 급등기에는 반대인 제로섬 구조. 요금 인상은 선거 일정에 좌우"}, {"k": "지금(2026-09)", "v": "호르무즈 원가 충격이 3Q부터 반영되는 실적 바닥 구간(4Q26 피크 예상)이고, 2027년 말 사채한도 일몰과 12차 전기본 송변전 투자비가 다음 변수다."}, {"k": "국내 연결", "v": "한국전력, 한국가스공사, 지역난방공사, SK가스, E1, SGC에너지, SK이터닉스"}]}]}, {"h": "⑥ 미국 유틸리티·전력시장 — 규제 승인 5년 계획이 모든 발주의 선행지표다", "blocks": [{"t": "p", "text": "미국은 7개 ISO/RTO가 분절 운영하고 주 규제기관이 요금을 승인하는 투자자소유 유틸리티(IOU)가 망을 소유한다. 데이터센터 부하 계약이 유틸리티 CAPEX를 매 분기 끌어올리고, FERC·NERC·주 정부 규칙이 ‘누가 망 비용을 내는가’를 바꾸며 BTM(온사이트)과 FTM(계통) 수요의 순서를 결정한다."}, {"t": "brief", "items": [{"k": "수요 동인", "v": "유틸리티 계약부하(AEP·Dominion·Duke), 5개년 CAPEX, PJM 용량가격, FERC Order 2023·Co-location·Large Load 규칙, 765kV 승인"}, {"k": "사이클 성격", "v": "규제위원회 승인을 거친 5년 계획이라 관성이 크고 빅테크 분기 가이던스보다 긴 주기로 움직인다"}, {"k": "지금(2026-09)", "v": "주요 18사 5개년 CAPEX 8,427억달러(1Q26), 구속력 DC 부하 181GW로 매 분기 상향 중이다. FERC Large Load 규칙(2027 확정)과 11월 중간선거가 정책 변수다."}, {"k": "국내 연결", "v": "직접 상장사는 없음 — 국내 초고압 변압기·배전·전선 업체의 최대 고객(효성중공업 HICO, HD현대일렉트릭 앨라배마, LS ELECTRIC MCM 등)"}]}]}, {"h": "⑦ 2025.10~2026.09 — 시장 인식은 이렇게 바뀌었다", "blocks": [{"t": "timeline", "items": [{"date": "2025-10", "title": "구조적 장기 사이클 확신, 관세는 전가", "body": "한국 초고압 변압기의 미국 수입 점유율이 13%→18%로 오르고 주요 5사 잔고가 +30% 늘었다. 미국향 실질 관세부담은 15~21%로 추정됐지만 판가 전가로 실적 영향은 제한적이라는 판단이 자리 잡았다.", "tone": "긍정"}, {"date": "2025-10", "title": "아시아 해저케이블 개화·서해안 HVDC 기대", "body": "아시아 해상풍력 케이블 발주가 2032년 4.4조원(CAGR +29.5%)으로 커지고 국내 업체가 약 73%를 과점할 것이라는 전망이 제시됐다. 전력망특별법 시행(2025.9)으로 정책이 목표에서 집행으로 이동했다.", "tone": "긍정"}, {"date": "2025-11", "title": "원가 하락기의 공기업 배당 사이클", "body": "브렌트 하락과 고가 중동 LNG 계약 만료로 SMP가 구조적 약세에 들어서며 한전 2026년 영업이익 약 18조원대 전망이 나왔다. 배당성향 가이드라인(25~40%) 회귀 기대가 유틸리티 논리의 중심이었다.", "tone": "긍정"}, {"date": "2025-11", "title": "디스패처블 전원·초고압 변압기 공급 부족 장기화", "body": "미국 피크 부하가 연 33GW 이상 늘지만 디스패처블 생산능력은 연 약 27GW, 초고압 변압기 필요량 연 210~300대 vs 공급 140~220대라는 수급 갭 모델이 제시됐다. 밸류에이션보다 이익 성장의 지속성이 핵심이라는 프레임이 확산됐다.", "tone": "긍정"}, {"date": "2025-12", "title": "AIDC 가용성 확보가 중저압·직류 수요를 연다", "body": "Tier III/IV 이중화, 온사이트 하이브리드 전원, 800V DC 배전이 동시에 확산되며 수요가 초고압 교류에서 중저압·직류로 확장된다는 인식이 생겼다. PJM 2027/28 용량경매가 상한가로 청산돼 발전 부족 신호가 켜졌다.", "tone": "긍정"}, {"date": "2026-01", "title": "Time-to-Power와 800VDC 상용화 로드맵", "body": "전력 공급 시점이 데이터센터의 최대 경쟁 변수가 되고, Rubin Ultra 1MW 랙과 800VDC 전환(2027 초기 상용화)이 새 제품 수요와 진입장벽을 만든다는 분석이 나왔다. 트럼프 행정부 비상전력 경매로 빅테크가 발전소 비용을 부담하는 구도가 시작됐다.", "tone": "긍정"}, {"date": "2026-02", "title": "765kV 초대형 변압기 시장 재개", "body": "승인·계획 765kV 노선 4,500~6,000마일에서 변압기 약 200대 잠재수요가 역산되며, 가격(P) 이후 물량(Q)과 제품 믹스가 차별화 요인이라는 프레임이 등장했다. 미국 계획 발전소가 1년 만에 150GW→250GW로 늘어 ‘2차 사이클’로 명명됐다.", "tone": "긍정"}, {"date": "2026-03", "title": "호르무즈 봉쇄, 유틸리티 원가 충격 경고", "body": "2월 말 이란 공습과 3월 호르무즈 통항 통제로 유가가 100달러를 넘고 JKM이 22달러까지 뛰었다. 동아시아가 LNG 가격 교란의 진원지가 될 수 있다는 경고와 함께 한전·가스공사 실적 전망이 급격히 하향됐다.", "tone": "부정"}, {"date": "2026-03", "title": "BTM으로 이동하는 수용가, ESS·SOFC 부상", "body": "FERC·ISO가 대형 부하에 망 비용과 자체 전원을 요구하며 데이터센터가 계량기 뒤(BTM)로 이동한다는 분석이 나왔다. Ratepayer Protection Pledge(3.4)로 빅테크 자체 발전이 정치적 약속이 됐다.", "tone": "긍정"}, {"date": "2026-04", "title": "1Q26 실적 미스에도 수주 폭증, 관세 위헌 판결", "body": "원자재·운송 중 재고 등으로 영업이익은 컨센서스를 밑돌았지만 효성 신규수주 +107% 등 전례 없는 수주가 나왔다. 연방대법원 상호관세 위헌 판결로 환급 절차가 개시되고 232조 개편으로 대형변압기 실효세율이 28.7%→15.0%로 낮아졌다.", "tone": "긍정"}, {"date": "2026-04", "title": "전쟁이 에너지 전환에 ‘안보’ 가치를 더하다", "body": "원전·초고압 전력망·중속엔진·연료전지·북미 LNG가 안보형 투자로 재평가됐다. HD현대중공업이 데이터센터 발전용 중속엔진 684MW를 수주하며 가스터빈 병목의 대체 시장이 실증됐다.", "tone": "긍정"}, {"date": "2026-05", "title": "전력인프라 주가 고점(5/7) 후 급락", "body": "전력기기 ETF가 YTD +160%대까지 오른 뒤 반도체 레버리지 ETF 출시·AI 펀드 청산·미국 데이터센터 모라토리엄 보도로 약 50% 조정받았다. 같은 달 유틸리티는 ‘버틸 수 있어서 요금이 안 오른다’는 부정적 톤이 나왔다.", "tone": "부정"}, {"date": "2026-05", "title": "공급이 수요를 정한다: 발전 > 전선 > 전력기기", "body": "데이터센터 부하 증가 속도의 상한을 가스터빈·원전 공급이 결정한다는 서열론이 제시됐다. 미중 정상회담과 UAE의 OPEC 탈퇴로 유가 우하향 시나리오가 부상했다.", "tone": "중립"}, {"date": "2026-06", "title": "조정은 수급, 펀더멘털은 강화", "body": "1Q26 변압기 5사 수주 8.5조원(+54%)·잔고 34.5조원(+37%)을 근거로 조정이 피크아웃이 아니라는 반론이 나왔다. 미국 데이터센터 착공 지연(2026년 예정 16.2GW 중 약 5GW만 건설 중)은 2026년이 정점이라는 시간표가 제시됐다.", "tone": "긍정"}, {"date": "2026-07", "title": "수주 가이던스 연쇄 상향과 계통연계 데이터 반론", "body": "HD현대일렉트릭(7/6)·효성중공업(7/31)·LS ELECTRIC이 연간 수주 가이던스를 20~50% 상향했다. 미국 계통연계 신청 데이터로 보면 전력기기 수요가 2028년까지 연 22% 성장한다는 선행지표 분석이 피크아웃 우려를 반박했다.", "tone": "긍정"}, {"date": "2026-08", "title": "12차 전기본 수요 +27GW 상향, 멀티플 조정 분해", "body": "3대 메가프로젝트 반영으로 2040 목표수요가 158.4~165.0GW로 올라 국내 송변전 투자 115조원대가 거론됐다. 주가 하락이 전부 멀티플 축소였다는 분해와 함께 저점 논리가 확산됐고, 전력망 특별법 개정으로 민간 BT가 허용됐다.", "tone": "긍정"}, {"date": "2026-08", "title": "미국 정책은 절차만 줄인다: BTM 먼저, FTM 2028", "body": "FERC Large Load·NERC 표준 등 미국 규제 완화의 시계열을 정리하며 2028년 이전 배전·ESS, 이후 송전·태양광 순의 수요 구도가 제시됐다. 외국산 전력기기 제한 행정명령(8/26)은 현지 생산 프리미엄을 강화했다.", "tone": "긍정"}, {"date": "2026-09", "title": "규제 유틸리티의 회수 구조를 따로 봐야", "body": "같은 인프라 사이클에서 전력기기는 수주로 먼저, 유틸리티는 투자·차입 후 회수로 늦게 가치가 전달된다는 구분이 강조됐다. 한전 1H26 CAPEX가 영업현금흐름을 넘어 FCF·차입금 확인이 리레이팅 조건으로 제시됐다.", "tone": "중립"}, {"date": "2026-09", "title": "MW당 콘텐츠 상승과 전환속도의 싸움", "body": "사이클의 본질은 공급제약과 MW당 설비가치 상승이며, 기업 성과는 수주잔고→CAPA→출하→고부가 믹스→이익의 전환속도에서 갈린다는 정리가 나왔다. 국내 6사 잔고는 HD현대 12.3조원·대한전선 4조원 돌파 등 최대치를 경신했다.", "tone": "긍정"}]}], "note": "확신(2025 4Q) → 두 번째 성장축 확인(2026 1Q) → 호르무즈로 유틸리티와 장비의 운명이 갈림(2026 2Q) → 수급 로테이션 급락에도 가이던스 상향(2026 3Q)."}, {"h": "⑧ 상방과 하방 — 같은 사실의 두 가지 해석", "blocks": [{"t": "proscons", "bull": ["수요 가시성이 2030년대 초반까지 확보됐다: 미국 유틸리티 CAPEX 8,427억달러(1Q26)가 매 분기 상향되고, 2031~2032년 납기 변압기·2031~2035년 인도 가스터빈이 이미 논의되고 있다.", "공급은 물리적으로 묶여 있다: GOES·숙련 권선공·건조·시험 병목과 과거 사이클 학습효과로 증설이 보수적이며, 765kV 공급자는 5곳 내외, 가스터빈 2030년까지 잔여 슬롯 약 10GW다.", "수요가 다층화됐다: 송전(765kV) → 배전(데이터센터 블록 반복) → DC(800VDC·SST) → 온사이트(엔진·연료전지·ESS)로 수요 계층이 계속 추가돼 한 축이 둔화돼도 다른 축이 받친다.", "두 번째 수요축(국내 Grid): 12차 전기본 +27GW 상향, 송변전 115조원대, 3대 메가프로젝트·AIDC 18.4GW가 북미 이후의 수주 기간을 늘린다.", "가격 결정력이 증명됐다: 관세·원자재 비용이 대부분 고객에게 전가됐고 국내 3사 OPM이 5.3%(2022)→15.2%(2025)로 올랐으며, 수주 가이던스가 연중 20~50% 상향됐다.", "안보 프리미엄: 호르무즈 쇼크가 원전·초고압 전력망·공급망 다변화 투자를 ‘선택’에서 ‘안보 필수’로 바꿨다."], "bear": ["공급 과잉 전환: 2027년 하반기 업계 동시 증설 물량(HD현대·효성·Hitachi·Prolec GE·Siemens)이 출하되면 리드타임 단축과 판가 정점, 과거 2008년식 저가수주 재현 가능성.", "데이터센터 착공 지연·AI CAPEX 조정: 모라토리엄(42개 주 533건 이상), 주민 반대, 빅테크 자금조달 약화 시 장기 프레임 계약이 확정 발주로 전환되지 않을 위험. 계통연계 신청은 과거 40% 이상 철회됐다.", "800VDC의 양날: DC 전환이 UPS·PDU 등 기존 AC 배전기기 수량을 줄이고, 칩 업체와 협력한 글로벌 업체가 표준을 선점하면 국내 업체 진입이 어려워질 수 있다.", "밸류에이션 부담과 수급 변동성: 고점 PER 53.6배를 경험했고 ETF·레버리지 펀드 수급에 펀더멘털 무관한 급등락이 반복될 수 있다.", "국내 유틸리티의 회수 리스크: 요금 동결 지속 시 한전 적자 재발·사채한도 초과, 가스공사 미수금 재누적, BT 방식의 장기 비용 전가. 국내 한전향 물량이 북미 고마진 슬롯을 대체하면 전력기기 마진 희석.", "정책 반전: 미국 관세(232·122·301조) 재변경, 중간선거 이후 재생에너지·해상풍력 정책, Section 232 태양광 조치, 외국산 전력기기 제한 규정의 적용 범위."], "lt": "상방 논리", "rt": "하방 논리"}]}, {"h": "⑨ 다음 분기에 확인할 것", "blocks": [{"t": "bullets", "items": ["미국 유틸리티 5개년 CAPEX와 계약부하가 다음 분기에도 상향되는가(AEP·Dominion·Duke, 3Q26 실적).", "초고압 변압기 리드타임과 미국 변압기 PPI가 2027년 증설 완공 이후에도 유지되는가 — 단축이 시작되면 판가 정점 신호.", "12차 전기본 확정(12월 목표)과 후속 장기 송변전설비계획 투자비가 115조원 이상으로 나오는가, 한전 사채한도 일몰 대응(법 개정 vs 요금).", "800VDC·SST의 첫 상업 수주: 2H26 공급망 백로그에 800VDC 항목이 잡히는가, 효성 SST 2027 수주·LS ELECTRIC 파주 AIDC 적용.", "미국 데이터센터 착공 전환율과 PJM Co-location·BYOP 규칙의 FERC 승인(2H26), 11월 중간선거 이후 모라토리엄 방향.", "유가·JKM의 하향 안정 속도와 SMP — 한전 4Q26 실적 바닥 확인 여부, 가스공사 민수용 요금 조정."]}]}]}, "policy": {"title": "정책·지정학 워치", "en": "Policy & Geopolitics Watch", "h2": "정책·지정학 워치 — 규칙이 수요의 순서를 정한다", "lede": "전력 산업에서 정책은 수요의 크기보다 **순서와 비용 부담 주체**를 바꾼다. 미국 F xt><text x=\"460\" y=\"320\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.7\">IA 체결 후 미준공 발전원 549GW(태양광 256·ESS 161·풍력 76·가스 45GW)<\/text><\/svg>", "cap": "**결론: 미국 규제 완화는 ‘절차’를 줄일 뿐 ‘물리’를 줄이지 못한다.** Order 2023·패스트트랙은 IR→IA 스터디 구간을 줄이지만, IA 이후의 건설과 초고압 변압기·가스터빈의 장납기는 그대로다. 그래서 계통 인허가를 건너뛰는 BTM(병설·자체발전)이 먼저 커지고 배전·ESS가 먼저 수혜를 보며, 송전 기자재는 2028년 전후 FTM 클러스터가 IA를 통과할 때 두 번째 물결을 맞는다. 송전 업체에게 정책 완화는 급성장보다 가격결정력·잔고 방어력 요인이다."}, {"t": "mods", "items": [{"name": "FERC Order 2023(계통연계 절차 개혁)", "pill": "미국 · 2023-11", "fields": [{"k": "내용", "v": "선착순 개별심사를 폐지하고 준비된 프로젝트를 클러스터로 동시 심사, 예치금 인상·철회 위약금 도입. 2024.4 개정, 각 RTO 발효 후 약 3년 뒤 지연 페널티"}, {"k": "산업 영향", "v": "투기적 신청 정리(2025년 대기열 −7%), 2027~2028년 이후 FTM 신규 발전원 연결과 송전 기자재 발주 가속"}, {"k": "상태", "v": "시행"}]}, {"name": "발전 패스트트랙(PJM RRI·MISO/SPP ERAS·PJM EIT)", "pill": "미국 · 2025-02", "fields": [{"k": "내용", "v": "진척도 높은 대형 발전 프로젝트를 정규 클러스터와 별도로 신속 심사. EIT는 250MW 이상·연 10건·10개월 내 IA 목표, 2027년 말 일몰. 선정 물량의 약 69%가 가스발전"}, {"k": "산업 영향", "v": "가스터빈·초고압 변압기·차단기 발주 앞당김(PJM RRI 51건·9.3GW)"}, {"k": "상태", "v": "시행"}]}, {"name": "PJM Co-location Order", "pill": "미국 · 2025-12", "fields": [{"k": "내용", "v": "발전소 직결 대형부하에 순 인출량 기준 신규 송전서비스 3종을 신설해 병설 방식을 제도화. 앞서 Talen-AWS 직연결 증량안은 비용 전가 이유로 거부"}, {"k": "산업 영향", "v": "BTM 데이터센터 인허가를 약 2년→2~3개월로 단축, ESS·배전기기 즉시 수요"}, {"k": "상태", "v": "시행"}]}, {"name": "FERC Large Load Show Cause Order", "pill": "미국 · 2026-06", "fields": [{"k": "내용", "v": "6개 RTO 전체에 대형부하 접속절차·비용배분·병설 규칙 정비를 요구, 60일 내 정당성 입증 또는 개선안 제출 명령. 2027년 중 확정 예상"}, {"k": "산업 영향", "v": "Co-location 전국 확대, AIDC의 계통 무임승차 제한으로 자체발전+ESS 비중 확대. 하이퍼스케일러가 송전단 발주 주체로 참여할 여지"}, {"k": "상태", "v": "예정"}]}, {"name": "NERC 연산부하 신뢰도 표준(RD26-7)", "pill": "미국 · 2026-12", "fields": [{"k": "내용", "v": "FERC가 NERC에 데이터센터 등 연산부하의 강제 신뢰도 표준·등록 기준을 2026.12.31까지 제출하도록 명령. 순간부하 대응·ride-through가 법적 의무가 될 수 있음(위반 시 최대 100만달러/일)"}, {"k": "산업 영향", "v": "2H27 이후 안정용 대형 ESS 사실상 의무화"}, {"k": "상태", "v": "예정"}]}, {"name": "텍사스 SB6(대형 부하 규칙)", "pill": "미국 · 2025-06 ke-width=\"1\"/><text x=\"600.0\" y=\"190.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">수주-매출 시차 3년+?<\/text><text x=\"600.0\" y=\"206.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">원전 주기기·가스터빈<\/text><line x1=\"410\" y1=\"190\" x2=\"478\" y2=\"194\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw18)\"/><text x=\"444.0\" y=\"186\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.85\">예<\/text><rect x=\"480\" y=\"234\" width=\"240\" height=\"44\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"600.0\" y=\"252.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">사업부가 이질적인가?<\/text><text x=\"600.0\" y=\"268.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">전력기기+건설·희토류 등<\/text><line x1=\"600\" y1=\"216\" x2=\"600\" y2=\"232\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw18)\"/><text x=\"606\" y=\"228\" font-size=\"10\" text-anchor=\"start\" fill-opacity=\"0.85\">아니오<\/text><rect x=\"480\" y=\"296\" width=\"240\" height=\"44\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"600.0\" y=\"314.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">P/B · EV/EBITDA<\/text><text x=\"600.0\" y=\"330.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">구리로 부푼 매출 → P/S 금지<\/text><line x1=\"410\" y1=\"305\" x2=\"478\" y2=\"316\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw18)\"/><rect x=\"760\" y=\"172\" width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--accent)\"/><text x=\"840.0\" y=\"190.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">EV/Backlog + PER<\/text><text x=\"840.0\" y=\"206.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">잔고의 질이 할증 한계<\/text><line x1=\"720\" y1=\"194\" x2=\"758\" y2=\"194\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw18)\"/><text x=\"739.0\" y=\"188\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.85\">예<\/text><rect x=\"760\" y=\"234\" width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--accent)\"/><text x=\"840.0\" y=\"252.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">SOTP<\/text><text x=\"840.0\" y=\"268.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">부문 EV/EBITDA 합산<\/text><line x1=\"720\" y1=\"250\" x2=\"758\" y2=\"250\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw18)\"/><text x=\"739.0\" y=\"244\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.85\">예<\/text><rect x=\"760\" y=\"296\" width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--accent)\"/><text x=\"840.0\" y=\"314.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">PER vs EPS 성장률<\/text><text x=\"840.0\" y=\"330.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">PEG식 글로벌 비교<\/text><path d=\"M 600 278 V 290 H 740 V 318 H 758\" fill=\"none\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw18)\"/><text x=\"730\" y=\"286\" font-size=\"10\" text-anchor=\"middle\" fill-opacity=\"0.85\">아니오<\/text><text x=\"470\" y=\"368\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\" fill-opacity=\"0.85\">어느 방법이든 마지막 점검: 피어 멀티플 시점(2026-05 고점 vs 08 조정기 40% 이상 차이)과 EPS·멀티플 변화의 분리<\/text><\/svg>", "cap": "**결론: 이 데스크 안에는 성장주와 규제 가치주가 섞여 있어 방법론 선택이 곧 결론을 바꾼다.** 첫 질문은 ‘요금이 규제되는가’다—규제 유틸리티는 PBR-ROE와 배당으로, 비규제 성장 기업은 이익 유무·수주 시차·사업부 구성에 따라 EV/Sales, EV/Backlog, SOTP, PER-EPS 성장률로 나뉜다. 전선은 매출이 구리 가격에 부풀어 P/S를 쓰지 않는다. 트리는 리포트에서 반복된 관행을 정리한 것이며 개별 기업 가치 판단이 아니다."}]}, {"h": "방법론별 심화 — 언제 쓰고, 어디서 틀리나", "blocks": [{"t": "mods", "open": 1, "items": [{"name": "PER vs EPS 성장률(PEG식 상대 비교)", "fields": [{"k": "언제 쓰나", "v": "초고압 변압기·배전기기 등 이익이 나는 전력기기 업체를 글로벌 피어(GE Vernova·Siemens Energy·Hitachi·ABB·Eaton·Schneider)와 비교할 때"}, {"k": "어떻게", "v": "차년도~3년 뒤(2026~2028F) Forward PER을 국내외로 나란히 놓고, 향후 3년 EPS 증가율 격차로 할증·할인을 설명한다. 증설 효과가 온기 반영되는 2028~2029년 실적 기준 PER 하락폭이 큰 기업을 상대적으로 싸다고 본다."}, {"k": "리포트 인용 밴드", "v": "국내 EPS 증가율은 해외 대비 +4~12%p(리포트별)"}, {"k": "함정", "v": "리포트마다 피어 구성·기준연도가 달라 같은 시점에도 PER이 22~61배로 벌어진다. 국내 할증이 벌어진 뒤(2026-05)에는 ‘EPS 성장률만으로 할증을 설명하기 어렵다’는 반론이 나왔다. 멀티플은 외국인이 미국 피어(GEV·VRT·ETN) 주가에 연동해 매기므로 미국 피어 변동이 그대로 전이된다."}]}, {"name": "SOTP(부문별 EV/EBITDA 합산)", "fields": [{"k": "언제 쓰나", "v": "전력기기+건설(효성중공업), 전선+희토류·해저(LS에코에너지), 원전·가스터빈·SMR(두산에너빌리티)처럼 사업부 성격이 다른 기업"}, {"k": "어떻게", "v": "목표 연도(차기 연도 또는 2027~2030년) 부문별 EBITDA에 부문 피어 EV/EBITDA를 적용하고, 증설 중인 공장 가치·종속/관계사 지분가치를 더한 뒤 순차입금을 뺀다. 해저케이블처럼 첫 매출이 먼 사업은 첫 매출 연도 이익에 멀티플을 적용하고 할인한다."}, {"k": "리포트 인용 밴드", "v": ""}, {"k": "함정", "v": "피어 멀티플이 수개월 새 크게 움직여 SOTP 결과가 피어 주가에 과도하게 민감하다. 전력기기 이익 비중이 높아질수록 순수 전력기기 멀티플에 가까워진다는 논리(건설 겸영 기업)는 비전력 부문 리스크(PF 우발채무 등)를 가릴 수 있다."}]}, {"name": "P/B-ROE(고ROE 전력기기·전선)", "fields": [{"k": "언제 쓰나", "v": "초고ROE가 지속된다고 가정하는 전력기기, 글로벌 피어 P/B로 평가하는 초고압·해저 전선"}, {"k": "어떻게", "v": "지속가능 ROE(전력기기 60~70%대 가정 사례)와 자기자본비용으로 적정 P/B를 역산하거나, Prysmian 등 글로벌 전선 피어 평균 P/B를 적용한다. 전선은 매출이 구리 가격에 부풀므로 P/S는 쓰지 않는다."}, {"k": "리포트 인용 밴드", "v": "초고ROE 가정 시 implied P/B 두 자릿수(2026-08), 국내 전선 3사 26년 P/E 27.4배·코스피 대비 2.6배 할증(2025-10), 해외 전선사 2028년 EV/EBITDA 평균 15배 내외(2026-05), 글로벌 상위 전선사 2026년 EV/EBITDA 약 12.5배(상단)~6.9배(할인) 양극화"}, {"k": "함정", "v": "ROE 지속성 가정 하나로 가치가 크게 움직인다. 전선업은 대형 프로젝트 매출 인식 시차로 연도별 이익 변동이 커서 수주잔고·EBITDA 마진 추세를 함께 봐야 한다."}]}, {"name": "PBR-ROE와 원가회수율(규제 유틸리티)", "fields": [{"k": "언제 쓰나", "v": "한국전력·한국가스공사·지역난방공사 같은 총괄원가 규제 공기업"}, {"k": "어떻게", "v": "과거 PBR과 ROE의 회귀식에 선행 ROE를 대입하거나, 적정투자보수율(목표 ROE)과 자기자본비용(예: 베타 0.45, 무위험 3.0%, 시장위험프리미엄 6.0%)으로 적정 PBR을 산출한다. 한전 PBR은 원가회수율(판매수입÷총괄원가)과 동행해 왔다."}, {"k": "리포트 인용 밴드", "v": "한전 Forward P/B 역사적 평균 0.38배·적자 구간 저점 0.15배·고점 약 0.6~0.8배, 2025-11 약 0.54배(글로벌 유틸리티 평균 1.72배 대비 60% 이상 할인). 원가회수율 역사적 고점 107%(2016) vs 2027E 131% 추정 시 1.0배 이상 재평가 논리(리포트). 가스공사 PBR 0.3배·PER 약 5배(2025P), 지역난방 0.4~0.5배"}, {"k": "함정", "v": "원가 하락으로 이익이 늘어도 다음 원가 상승기에 미회수 비용이 재발할 수 있으면 높은 ROE를 장기 수익성으로 인정받기 어렵다(할인의 본질은 회수 예측 불확실성). 같은 한전 ROE가 2025-11 22%에서 2026-05 5.2%로 바뀌었듯 원가 전제에 극도로 민감하다."}]}, {"name": "배당수익률(공기업·고배당 정비사)", "fields": [{"k": "언제 쓰나", "v": "배당 가이드라인이 있는 정부 출자기관, 배당성향이 높은 한전KPS"}, {"k": "어떻게", "v": "별도 순이익 × 배당성향(가이드라인 25~40%) ÷ 시가총액으로 배당수익률을 산출하고 저PBR 해소 논리와 결합한다. 공기업 배당은 FCF·차입금이 아니라 별도 순이익에 연동된다는 점이 전제다."}, {"k": "리포트 인용 밴드", "v": "배당성향 40% 가정 시 지역난방 약 11.1%, 한전 약 5.6%(2025-11 리포트 추정). 2024 사업연도 실제 배당성향 한전 16.4%·가스공사 16.0%·지역난방 21.4%, 한전KPS 약 53~65%."}, {"k": "함정", "v": "정부 배당 결정은 세수·부채 여론에 좌우되고 2026년 원가 충격으로 이익이 급감하면 DPS도 따라 준다. 한전은 차입금 상환(연결 연 약 29조원)과 사채한도로 환원 여력이 제한된다."}]}, {"name": "EV/Backlog·Price/Backlog(장기 수주산업)", "fields": [{"k": "언제 쓰나", "v": "원전 주기기·가스터빈처럼 수주와 매출 인식 사이 시차가 긴 발전설비 업체"}, {"k": "어떻게", "v": "기업가치를 수주잔고(또는 장기 2035년 잔고 전망)로 나눠 과거 인프라 호황기와 비교한다. 수주·생산능력·공급망 병목 기대가 멀티플을 결정하는 구간에서 쓴다."}, {"k": "리포트 인용 밴드", "v": "2006~2010년 인프라 호황기 EV/Backlog 최고 1.32배(당시 저마진 4~6% EPC 위주). 대표 기자재사 2024년 이후 주가 상승의 약 90%가 밸류 리레이팅 기여(12MF EV/EBITDA 기준). 원전주 PER 10→85배·PBR 1→4.5배(2025~26) vs UAE 수주기 PER 10→20배(2009~10)"}, {"k": "함정", "v": "잔고에 슬롯 예약(SRA)이 섞이면 잔고의 질이 달라진다(GEV 100GW 중 확정 44GW). 고마진 서비스 비중·후발 주자 여부가 피어 대비 할증 한계로 작용한다."}]}, {"name": "EV/Sales(연료전지·초기 성장 전력전자)", "fields": [{"k": "언제 쓰나", "v": "적자이거나 이익 가시화 전인 연료전지·전력반도체 업체"}, {"k": "어떻게", "v": "Bloom Energy·Ceres Power·Plug Power 등 피어 평균 EV/Sales와 비교하고, 데이터센터 공급 개시 시 피어 그룹을 데이터센터 전력 솔루션 업체로 교체한다. CAPA 대비 시가총액으로 성장 프리미엄을 가늠하기도 한다."}, {"k": "리포트 인용 밴드", "v": "EV/Sales 2026E Bloom Energy 14배, Ceres Power 10배, 두산퓨얼셀 5.5배(2025-11~2026-01). Navitas 12MF EV/EBITDA 81.2배 vs 피어 14.0배"}, {"k": "함정", "v": "매출 대비 가치라 수익성·CAPEX 부담 차이를 놓친다(그래서 PSR 대신 EV/Sales를 쓴다). 선두 업체 프리미엄이 후발주자로 확산되는 패턴(GEV→Caterpillar→FTAI)에 기대면 과열 구간을 오판할 수 있다."}]}, {"name": "시가총액 = EPS × PER 분해(주가 조정 진단)", "fields": [{"k": "언제 쓰나", "v": "주가 급락 국면에서 펀더멘털 훼손인지 멀티플·수급 조정인지 가를 때"}, {"k": "어떻게", "v": "시가총액 변화율을 이익 추정치(EPS) 변화와 멀티플(PER) 변화로 나눈다. EPS 추정치가 유지·상향되는데 주가가 빠졌다면 멀티플 조정이며, 이후 실적이 주가를 결정하는 구간으로 전환된다."}, {"k": "리포트 인용 밴드", "v": "2026-05-07 고점 이후 전력인프라 주가 최대 −58.3%, 같은 기간 26F/27F 매출·영업이익 컨센서스 상향 → 하락 전부가 멀티플 축소(2026-08). 4사 합산 영업이익 컨센서스 연초 대비 '26 +7%, '27 +13%(2026-06)"}, {"k": "함정", "v": "컨센서스 자체가 후행해서 하향될 수 있다. 다만 유틸리티 CAPEX가 규제 승인 5년 계획이라 관성이 크고 장기공급계약 중심이라 추정치 후행 하향 가능성이 낮다는 논리가 함께 제시됐다."}]}]}]}, {"h": "섹터 주가 드라이버 — 무엇이 멀티플을 움직였나", "blocks": [{"t": "grid", "cols": 3, "items": [{"h": "미국 피어 연동", "p": "외국인은 국내 전력기기 멀티플을 미국 피어(GEV·VRT·ETN) 주가에 연동해 매긴다. 미국 피어의 가이던스·주가 변동이 그대로 전이된다."}, {"h": "수주 가이던스", "p": "1Q 달성률과 연중 상향이 EPS 추정치의 방향을 정한다. 2026년 빅3 모두 20~50% 상향했다."}, {"h": "증설 타이밍", "p": "증설 발표 시점(2025년 1월·7월) 이후 국내 3사 주가 기울기가 가팔라졌다는 관찰. 반대로 업계 증설 물량 출하(2027 하반기)는 판가 정점 우려를 부른다."}, {"h": "수급·유동성", "p": "전력기기 ETF가 YTD +160%대까지 오른 뒤 레버리지 ETF 출시·AI 펀드 청산으로 약 50% 조정받았다. 펀더멘털 무관한 급등락이 반복될 수 있다."}, {"h": "정책·관세", "p": "관세 위헌 판결·232 개편·외국산 제한 EO가 현지 생산 프리미엄을 바꾼다. 중간선거 이후 정책 방향도 변수다."}, {"h": "유틸리티 원가", "p": "유가·JKM·환율 → SMP 3~6개월 시차. 원가 방향이 한전·가스공사 ROE 전제를 통째로 바꾼다(한전 2026E ROE 22%→5.2%)."}]}, {"t": "figure", "svg": "<svg viewBox=\"0 0 920 250\" role=\"img\" aria-label=\"같은 CAPEX라도 전력기기는 수주로 먼저, 유틸리티는 요금으로 늦게 가치가 도착한다\"><defs><marker id=\"a-pw19-accent\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--accent)\"/><\/marker><marker id=\"a-pw19\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><text x=\"20\" y=\"26\" font-size=\"12\" text-anchor=\" "0.6\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-pw19)\"/><rect x=\"470\" y=\"40\" width=\"190\" height=\"52\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"565.0\" y=\"62.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">수주잔고<\/text><text x=\"565.0\" y=\"78.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">1~5년 가시성<\/text><rect x=\"470\" y=\"150\" width=\"190\" height=\"52\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--warn)\"/><text x=\"565.0\" y=\"172.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">요금 반영<\/text><text x=\"565.0\" y=\"188.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">정부·규제기관<\/text><line x1=\"660\" y1=\"66\" x2=\"693\" y2=\"66\" stroke-width=\"1.3\" style=\"stroke:var(--accent)\" marker-end=\"url(#a-pw19-accent)\"/><line x1=\"660\" y1=\"176\" x2=\"693\" y2=\"176\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-pw19)\"/><rect x=\"695\" y=\"40\" width=\"190\" height=\"52\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"790.0\" y=\"62.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">매출·EPS<\/text><text x=\"790.0\" y=\"78.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">인도 시점<\/text><rect x=\"695\" y=\"150\" width=\"190\" height=\"52\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"790.0\" y=\"172.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">현금흐름<\/text><text x=\"790.0\" y=\"188.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">수년에 걸쳐<\/text><text x=\"20\" y=\"136\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--warn)\">규제 유틸리티 — 투자가 먼저 나가고 가치는 늦게 도착<\/text><text x=\"460\" y=\"236\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\" fill-opacity=\"0.85\">한전 1H26 CAPEX 9.6조원 &gt; 영업현금흐름 8.5조원 — 자산이 늘어도 FCF·차입금 방향을 확인해야 리레이팅 조건 충족<\/text><\/svg>", "cap": "**결론: AI 전력수요는 두 업종에 같은 뉴스지만 도착 시간이 다르다.** 전력기기는 고객 CAPEX가 수주 공시로 즉시 확인되고 잔고로 1~5년 가시성이 생기지만, 한전은 송전선·변전소를 먼저 짓고(차입) 가동 자산이 요금기저에 들어가 요금에 반영돼야 현금으로 돌아온다. 그래서 같은 12차 전기본 상향이 전력기기에는 멀티플 할증 근거가, 한전에는 사채한도·자본확충 부담이 된다."}, {"t": "callout", "text": "2026-05-07 고점 이후 전력인프라 주가는 최대 −58.3% 하락했지만 같은 기간 26F/27F 매출·영업이익 컨센서스는 상향돼, 하락 전부가 멀티플 축소였다는 분해가 제시됐다(2026-08). 4사 합산 영업이익 컨센서스는 연초 대비 ’26 +7%, ’27 +13%였다(2026-06). EPS 추정치 흐름과 멀티플 변화를 분리하는 것이 조정 국면 진단의 출발점이다.", "title": "주가 조정 분해"}]}, {"h": "IPO·자본시장 동향과 ECM 시사점", "blocks": [{"t": "bullets", "items": ["IPO 피어 선정: 초고압 변압기는 GEV·Siemens Energy·Hitachi, 배전·데이터센터는 ABB·Eaton·Schneider·Vertiv, 특수변압기는 Fortune Electric·Shihlin·DAIHEN, 전선은 Prysmian·Nexans·NKT·Sumitomo·Hengtong이 리포트에서 반복 사용됐다. 특수변압기·버스덕트처럼 직접 비교 대상이 부족하면 국내 초고압 업체 또는 미국 배전기기 업체 평균 P/E를 쓰는 관행이 있다.", "리드타임이 1년 이하인 제품(특수변압기)은 계약 불안정성과 무관하게 경쟁사 대비 멀티플이 낮게 형성되는 경향이 있고, 시가총액이 작은 업체는 성장성·수익성이 우수해도 소형주 디스카운트를 받는다 — 중소형 전력기기 IPO의 공모가 할인 논리로 쓰일 수 있다.", "공모 시점의 피어 멀티플 선택이 결과를 크게 바꾼다. 2026년 5월 고점(빅3 PER 53.6배)과 8월 조정기 멀티플은 40% 이상 차이가 나므로, EPS 추정치 흐름과 멀티플 변화를 분리해 증권신고서 밸류에이션 근거를 설명해야 한다.", "수주산업은 ‘잔고의 질’이 가치다: 확정 계약 vs 슬롯 예약, 북미·765kV·GIS 등 고마진 비중, 인도 시점 분포, 에스컬레이션·관세 전가 조항을 실사에서 숫자로 확인해야 멀티플 할증을 방어할 수 있다.", "공기업·규제 유틸리티 관련 딜(지분 매각·자회사 IPO·BT SPC)은 총괄원가 회수 구조, 사채한도, 배당 가이드라인, 요금 결정의 정치성이 할인율의 본질이라는 점을 전제로 한다.", "비상장 핵심 자회사의 가치 반영이 반복 쟁점이다. LS전선(해저 OPM 18%, 부스덕트 OPM 16%대)·LS MnM은 지주 구조 안에서 가치가 온전히 반영되지 않았다는 시각이 있어, 자회사 IPO나 지분 거래 시 글로벌 전선·동제련 피어 P/B와 지주 할인율이 쟁점이 된다.", "국가 전략산업화 국면의 멀티플 재평가 사례로 2차전지(상장 당시 EV/EBITDA 51.4배, 소재 3사 2020~23년 평균 29.5배)가 참고로 인용됐다. 전력기기 공모 밸류 논리에서 ‘구조적 성장 스토리’를 정성적 할증으로 반영할 때의 비교 사례다.", "증설 재원 조달: 일진전기는 2023년부터 유상증자 자금으로 초고압 변압기·전선 설비를 증설해 2025년 준공했다(증분 매출 약 4,130억원, 2023년 산정). 전선·포설선 투자는 유상증자·차입·정책금융(국민성장펀드) 중 조달 경로와 가동 시점을 함께 확인해야 한다.", "수급 이벤트: 2026년 5~8월 조정은 반도체 레버리지 ETF 출시·AI 펀드 블록딜 청산·모라토리엄 보도 등 수급 요인이 컸고, 중소형 전력기기는 2대 주주 블록딜 이후 수급 불확실성이 해소되는 패턴도 관찰됐다. 공모 시점의 오버행(기존 주주 보호예수 해제 일정)을 같은 틀로 점검한다.", "Westinghouse는 미 정부가 2029년 1월 전 기업가치 300억달러 도달 시 IPO 요구권을 확보한 상태로, 원전·전력 기자재 밸류 체인의 해외 대형 상장 이벤트가 될 수 있다."]}, {"t": "callout", "text": "전력기기 공모 밸류에이션의 핵심 방어 논리는 ‘잔고의 질’이다. 확정 계약 vs 슬롯 예약, 북미·765kV·GIS 등 고마진 비중, 인도 시점 분포, 에스컬레이션·관세 전가 조항을 실사에서 숫자로 확인해 증권신고서에 적어야 멀티플 할증을 방어할 수 있다. 피어 멀티플은 2026-05 고점과 08 조정기 사이에 40% 이상 차이가 나므로 기준 시점 선택의 근거를 함께 기재한다.", "title": "ECM 체크", "tone": "warn"}]}]}, "check": {"title": "체크포인트", "en": "Due Diligence Checkpoints", "h2": "체크포인트 — 5분 스캔, 세부 체크, 레드플래그", "lede": "딜 검토의 첫 5분은 ‘이 회사가 전압 계단의 어디에서, 어떤 계약 구조로 돈을 버는가’를 확정하는 데 쓴다. 기업 유형이 정해지면 봐야 할 숫자와 레드플래그가 자동으로 따라온다. 아래 순서는 5분 스캔 → 기업 유형별 첫 질문 → 세부 체크리스트 → 공통 레드플래그다.", "sections": [{"h": "5분 스캔 — 어느 회사든 이 다섯 칸부터", "blocks": [{"t": "brief", "items": [{"k": "1분 · 위치", "v": "어느 전압 계단(765/345/154kV·22.9kV·랙)의 어떤 기기인가? 02 전력망 구조의 계층표에 올려 놓는다."}, {"k": "2분 · 계약", "v": "장기 슬롯인가, 1년 계약인가, 반복 PO인가, 턴키인가? 가격 재협상 주기와 에스컬레이션 조항은?"}, {"k": "3분 · 잔고", "v": "잔고/매출 배수, 지역·고객 구성, 확정 vs 예약, 인도 연도 분포."}, {"k": "4분 · 생산능력", "v": "가동률, 증설 완공 시점, 병목 공정(권선·건조·시험·포설선)이 함께 늘었나."}, {"k": "5분 · 밸류 기준", "v": "12 밸류에이션의 매칭 표에서 방법론과 피어를 정하고, 피어 멀티플의 기준 시점을 기록한다."}]}]}, {"h": "기업 유형별 첫 질문", "blocks": [{"t": "table", "cols": ["유형", "먼저 볼 숫자", "핵심 질문", "대표 레드플래그"], "rows": [["초고압 변압기·GIS", "잔고(지역·전압·인도 연도), 신규 수주 단가, 가동률", "증설이 건조·시험·권선 인력까지 늘렸나?", "잔고 증가가 슬롯 예약 위주, 신규 단가 하락"], ["배전·DC 전력기기", "DC 수주 비중, 고객 수·반복성, 미국 공장 가동 시점", "빅테크 직발주인가 EPC 경유인가?", "단일 고객 의존, UL 인증 미확보"], ["특수변압기", "고객 집중도, 연간 계약 단가, 초고압 확장 일정", "업황 반전 시 1년 계약의 방어력은?", "상위 고객 90% 집중, 재가격 하락"], ["전선·해저케이블", "잔고/매출, EBITDA 마진, 포설선 일정", "턴키(케이블+시공) 수행이 가능한가?", "매출 성장 대부분이 구리 효과, 포설선 외부 의존"], ["800VDC·SST·전력전자", "디자인윈→PoC→RFP 단계, 인증, 백로그 반영", "전압 경로와 무관한 반복 BOM인가?", "PoC 단계 제품이 매출 추정에 반영"], ["발전설비·온사이트", "확정 vs 슬롯 예약, LTSA 수행 주체, 반복 수주", "데이터센터 수주가 일회성인가?", "판매 채널 경유로 서비스 매출 없음"], ["규제 유틸리티", "원가회수율, FCF·차입금, 미수금, 사채한도", "원가가 요금  유틸리티(한전·가스공사)", "items": ["유가·JKM 변동이 SMP와 판매단가에 몇 개월 시차로 반영되며, 요금 조정 계획은 있는가?", "원가 변화가 일정한 기준과 시차로 요금에 반영되는 체계(연료비 연동제·원료비 연동제)가 작동하는가?", "Grid 투자 확대 속에서 한전채 순발행과 이자발생부채가 줄기 시작했는가(FCF 방향)?", "2027년 말 사채한도 일몰에 대한 법 개정·자본확충·요금 조정 중 어떤 경로가 나오는가?", "가스공사 민수용 미수금이 여러 분기 연속 순감소하는가?", "12차 전기본 확정 후 장기 송변전 투자비와 한전 자체 조달 비중, BT 양수가격(적정 수익률) 산정 방식은?"]}, {"area": "수요 선행지표 검증", "items": ["미국 유틸리티 5개년 CAPEX와 계약부하가 다음 분기에도 상향되는가?", "계통연계 신청 GW 중 위약 조건(ESA·LOA·Take-or-Pay)이 걸린 비중과 IA 체결 후 착공 비중은?", "발표된 데이터센터 용량 중 부지·전력공급 확정·EPC 선정·기자재 발주 단계에 진입한 물량은 얼마인가?", "국내 AIDC의 전력조달 방식·계통접속·장비 공급사가 국내 상장사로 선정되는가?", "국내 한전향 물량 확대가 증설 CAPA를 채우는지, 기존 북미 고마진 슬롯을 대체하는지?"]}]}], "note": "체크 표시는 저장되지 않는다(새로고침 시 초기화). 실사 질의서 초안으로 옮겨 쓰는 용도다."}, {"h": "공통 레드플래그", "blocks": [{"t": "callout", "text": "아래 항목 중 두 개 이상이 겹치면 공모 밸류의 할증 논리를 다시 세워야 한다.", "title": "레드플래그", "tone": "alert"}, {"t": "bullets", "items": ["잔고 증가의 대부분이 슬롯 예약·프레임 계약이고 확정 PO 비중을 공개하지 않는다.", "증설 공시가 공장 면적·투자액만 있고 건조로·시험설비·숙련 인력 계획이 없다.", "신규 수주 단가가 기존 잔고 단가보다 낮아지기 시작했다 — 판가 정점 신호.", "리드타임 단축과 미국 변압기 PPI 둔화가 동시에 나타난다.", "단일 고객(예: Bloom Energy) 의존과 1년 계약이 겹쳐 있다.", "전선 매출 성장의 대부분이 구리 가격 효과이고 물량·믹스는 정체다.", "800VDC·SST 매출이 PoC 단계인데 사업계획 매출에 반영돼 있다.", "관세·원자재 에스컬레이션 조항이 없거나 고정가 계약 비중이 높다.", "공모 밸류 피어 멀티플이 2026-05 고점 기준이고 기준 시점 선택 근거가 없다.", "(유틸리티) 요금 인상·사채한도 법 개정을 정부 발표 없이 가정했다."]}]}, {"h": "증권신고서·실사 보고서에 적을 때", "blocks": [{"t": "bullets", "items": ["수주잔고는 **공시 기준과 경영관리 기준**을 구분해 적는다(효성중공업 23.83조원 vs 약 17.5조원 사례).", "가동률은 산식(생산실적 ÷ 생산능력, 대수·MVA·금액 중 무엇인지)을 명시한다. 국내 업체는 CAPA를 연간 매출 환산 금액으로 소통하는 경우가 많아 환율·판가에 따라 달라진다.", "가이던스는 기준환율(예: HD현대일렉트릭 1,350원)과 발표 시점을 함께 적고, 연중 상향 이력을 표시한다.", "리드타임은 ‘제작 기간(약 18~24개월)’과 ‘주문~인도(3~5년)’를 구분한다.", "미국 데이터센터 부하·유틸리티 CAPEX는 집계 기업 수(16사·18사)와 분기를 맞춰 인용한다."]}]}]}, "universe": {"title": "커버리지 유니버스", "en": "Coverage Universe", "special": "universe", "lede": "리포트에 등장한 국내외 기업 90곳을 하위 섹터별로 정리했다. ‘언급’은 이 데스크 근거 리포트 37건 중 해당 기업이 다뤄진 횟수로, 리포트의 관심도를 보여줄 뿐 기업 평가가 아니다. 칩으로 하위 섹터를, 드롭다운으로 국내·해외·비상장을 거른다.", "sections": [{"h": "읽는 법", "blocks": [{"t": "p", "text": "국내 상장사는 기업이 전압 계단의 어디에 있는지(02 전력망 구조), 어떤 기기를 만드는지(03 기기 백과), 최근 어떤 계약을 땄는지(09 수주 트래커)와 함께 본다. 해외 기업은 대부분 국내 기업의 고객(미국 유틸리티·Bloom Energy)이거나 밸류에이션 피어(GE Vernova·Siemens Energy·Hitachi·ABB·Eaton·Schneider·Vertiv·Prysmian)다."}], "before": true}]}, "cal": {"title": "이벤트 캘린더", "en": "Event Calendar", "special": "calendar", "lede": "데이터 컷(2026-09-28) 기준 예정 일정과 지나간 핵심 이벤트다. 정책(전기본·FERC·NERC·관세), 프로젝트(증설 완공·HVDC·765kV 노선), 실적 시즌이 섞여 있다. 날짜가 월 단위인 일정은 원문이 월까지만 제시한 경우다. 아래 ‘ECM 관점 연간 운용’은 이 일정들을 딜 일정과 어떻게 맞출지 정리했다.", "sections": [{"h": "ECM 관점 연간 운용", "blocks": [{"t": "grid", "cols": 2, "items": [{"h": "1~2월 — 가이던스의 계절", "p": "전년 4Q 실적과 연간 수주·매출 가이던스가 나온다. 공모 밸류에이션의 기준 EPS가 사실상 정해지는 시기라, 연초 공모는 가이던스 보수성(1Q 달성률 관행)까지 감안해 추정해야 한다.", "list": ["미국 유틸리티 4Q 실적·5개년 CAPEX 갱신", "국내 연료비조정요금(1Q) 발표"]}, {"h": "4~5월 — 첫 달성률 확인", "p": "1Q 실적에서 수주 가이던스 달성률이 처음 확인된다. 2026년에는 1Q 이익 미스와 수주 폭증이 동시에 나왔고, 5월 초 섹터 고점 이후 급락이 이어졌다. 수요예측 일정이 이 구간이면 피어 변동성에 주의한다.", "list": ["미국 유틸리티 1Q CAPEX·계약부하", "관세 정책 변경(2026-04 선례)"]}, {"h": "7~8월 — 상향과 반기보고서", "p": "2Q 실적과 함께 가이던스 상향이 몰리고(2026년 HD현대 7/6, 효성 7/31), 8월 중순 반기보고서로 가동률·생산능력·잔고가 공시된다. 비교 기업 데이터가 가장 풍부해지는 시점이라 증권신고서 작성에 유리하다.", "list": ["12차 전기본 수요 재전망(2026-08 선례)", "전력망특별법 등 국회 일정"]}, {"h": "10~12월 — 정책 집중 구간", "p": "3Q 실적 후 12월에 전기본 확정·NERC 표준 제출·미국 관세 조치 시행 등 정책 이벤트가 몰린다. 한전·가스공사는 원가 충격이 4Q에 피크를 맞는 해가 많아, 유틸리티 관련 딜은 연말 실적 바닥 확인 이후가 안전하다.", "list": ["미국 중간선거(2026-11-03)", "연료비조정요금(1Q 적용분) 발표"]}]}, {"t": "callout", "text": "분기마다: 연료비조정요금 발표(적용 분기 직전), 전력거래소 월간 SMP, 관세청 월간 수출입(특대형 변압기 HS 8504.23), 미국 BLS 변압기 PPI. 이 네 가지는 분기 실적 전에 방향을 미리 알려 주는 월간 지표다.", "title": "상시 모니터링"}]}]}, "fact": {"title": "수치 DB", "en": "Figures Database", "special": "facts", "lede": "근거 리포트 37건에서 추출한 수치를 한 곳에 모았다. 키워드로 검색하고 확인·추정·미확인 태그로 거른다. 모든 수치에 시점과 원출처가 붙어 있으므로, 인용 전에는 반드시 시점을 확인하고 같은 기준(집계 기업 수·분기·단위)끼리만 비교한다."}, "gloss": {"title": "용어 사전", "en": "Glossary", "special": "glossary", "lede": "전력망·기기·데이터센터·전력시장·규제·계약 용어 150여 개다. 검색창에 한글·영문·약어 어느 것을 넣어도 찾을 수 있고, 칩으로 분류를 거른다. 처음 보는 약어가 나오면 여기서 먼저 찾는다."}, "src": {"title": "출처·데이터 품질", "en": "Sources & Data Quality", "h2": "출처·데이터 품질 — 숫자를 쓰기 전에 읽는 페이지", "lede": "이 데스크의 수치는 국내 산업 리포트 37건(2025-10-14~2026-09-21)이 인용한 원출처 데이터와 리포트 자체 추정으로 이뤄져 있다. 아래에 원출처 기관, 데이터를 쓸 때의 주의점, 리포트 간 수치가 엇갈리는 대표 사례를 정리했다. 딜 문서에 인용할 때는 원출처와 시점을 병기하고, 회사 수치는 최신 공시로 재확인한다.", "sections": [{"h": "원출처 기관", "blocks": [{"t": "p", "text": "리포트가 인용한 1차 데이터 출처다. 미국 계통·수요는 EIA·FERC·NERC·LBNL·ISO/RTO와 유틸리티 IR, 국내 전력시장은 한국전력·전력거래소·산업부·12차 전기본 총괄위원회, 무역은 관세청·KITA·USITC, 시장 전망은 Wood Mackenzie·BNEF·S&P Global·Mordor Intelligence가 중심이다."}, {"t": "bullets", "items": ["IEA(WEO2025·Electricity 2026), EIA(Form 860M·STEO), FERC, NERC, LBNL(Queued Up), U.S. DOE, PJM, ERCOT", "MISO, SPP, PUCT, CAISO·NYISO·ISO-NE, AEP·Duke·Dominion·NextEra 등 미국 유틸리티 IR, EEI, S&P Global, Wood Mackenzie", "BloombergNEF, Bloomberg, USITC·US Census·Global Trade Atlas, FRED(BLS PPI), 관세청 TRASS, 한국무역협회(KITA), 한국전력, 전력거래소(KPX·EPSIS)", "산업통상자원부, 기후에너지환경부, 12차 전력수급기본계획 총괄위원회, 한국가스공사, 한국수력원자력, IAEA(PRIS), WNA, Lazard", "OECD NEA, NVIDIA·Open Compute Project, Bloom Energy 설문, Cleanview·Sightline Climate, GWEC·WindEurope, Energy-charts, Platts, IMF", "Data Center Watch, Mordor Intelligence, Rystad Energy·PTR Inc, CBRE"]}]}, {"h": "데이터 품질 주의", "blocks": [{"t": "bullets", "items": ["미국 데이터센터 계통연계 부하는 리포트마다 집계 기업 수(16사·18사)와 분기가 달라 136GW(3Q25, 16사 진행 단계)와 168·181GW(18사 구속력 계약)를 같은 시계열로 이어 붙이면 안 된다. 신청 단계도 544GW(3Q25)·590GW(4Q25, 신청+진행 가능성)·641GW(1Q26)로 정의가 조금씩 다르다.", "한전 이익 민감도는 리포트별로 크게 다르다: 원전 이용률 1%p당 +1,840억·+2,900억·약 +4,600억원, SMP 반영 시차 3~5개월 vs 5~6개월. 전제(유가·환율·발전믹스)가 다르므로 범위로 인용해야 한다. 한전 2026E ROE도 22%(2025-11)에서 5.2%(2026-05)로 호르무즈 쇼크 전후 전제가 완전히 바뀌었다.", "효성중공업 수주잔고는 반기보고서 공시 23.83조원과 경영관리 기준 약 17.5조원이 병존한다. 효성 1H26 신규수주를 원문이 ‘7,500억원’으로 표기했으나 가이던스 대비 비율로 볼 때 약 7.5조원의 오기로 판단했다(추정). 2025-10 발간 리포트의 커버리지 6사 3Q25 영업이익 합산(요약 2,371억원 vs 기업별 합산 약 6,234억원)도 원문 불일치다.", "서해안 HVDC 사업비는 7.9조원(정부 초기 발표, 620km), 약 11조원(1단계 사업비 추정), 12조원
