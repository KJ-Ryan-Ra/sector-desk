<title>전력인프라·유틸리티 리서치 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --ground:#FBFAF7; --surface:#FFFFFF; --raised:#F3F4F0; --sunken:#EFF1EC;
  --line:#E0E4DC; --line-strong:#C9D0C6;
  --ink:#17211F; --ink-2:#3A4744; --ink-3:#55625D; --ink-4:#626F6A;
  --accent:#3B4DB0; --accent-soft:color-mix(in srgb,var(--accent) 10%,transparent); --accent-line:color-mix(in srgb,var(--accent) 34%,transparent);
  --ok:#1D7A5C; --warn:#8A6300; --alert:#A2304A; --dim:#55625D;
  --shadow:0 1px 2px rgba(23,33,31,.06),0 8px 24px -12px rgba(23,33,31,.18);
  --rail:252px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0C1116; --surface:#131A21; --raised:#1A232B; --sunken:#0F161C;
    --line:#253039; --line-strong:#33424E;
    --ink:#DCE5EA; --ink-2:#BCCAD2; --ink-3:#9DAEB9; --ink-4:#8DA0AB;
    --accent:#8D9CEB; --ok:#3DB08E; --warn:#D2A63A; --alert:#D9738A; --dim:#9DAEB9;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0C1116; --surface:#131A21; --raised:#1A232B; --sunken:#0F161C;
  --line:#253039; --line-strong:#33424E;
  --ink:#DCE5EA; --ink-2:#BCCAD2; --ink-3:#9DAEB9; --ink-4:#8DA0AB;
  --accent:#8D9CEB; --ok:#3DB08E; --warn:#D2A63A; --alert:#D9738A; --dim:#9DAEB9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;line-height:1.3;letter-spacing:-.011em}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
b{font-weight:600;color:var(--ink)}

.shell{display:flex;min-height:100vh;align-items:flex-start}
.rail{width:var(--rail);flex:0 0 var(--rail);position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brand .mark{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--accent);font-weight:500;display:flex;align-items:center;gap:7px;line-height:1.4}
.brand .mark::before{content:"";width:7px;height:7px;background:var(--accent);border-radius:50%;flex:none}
.brand h1{font-size:18px;margin-top:9px;letter-spacing:-.02em;font-weight:700}
.brand .sub{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.5}
.nav{flex:1;overflow-y:auto;padding:10px 10px 20px}
.nav-group{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.15em;color:var(--ink-4);padding:14px 10px 6px;text-transform:uppercase}
.nav button{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-family:inherit;font-size:13.5px;line-height:1.4}
.nav button:hover{background:var(--raised);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button .k{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);flex:none;width:16px}
.nav button[aria-current="true"] .k{color:var(--accent)}
.desks{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px}
.desks .dl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-4);width:100%;padding:2px 4px 4px}
.desks a{font-size:12px;text-decoration:none;color:var(--ink-3);border:1px solid var(--line);border-radius:14px;padding:3px 9px;white-space:nowrap}
.desks a:hover{color:var(--accent);border-color:var(--accent-line)}
.desks a.cur{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);pointer-events:none}
.railfoot{padding:12px 16px;border-top:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}

.main{flex:1;min-width:0;padding:0 0 96px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:11px 40px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.legend .li{display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.legend .sw{width:9px;height:9px;border-radius:2px;flex:none}
.stamps{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.stamp{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);white-space:nowrap}
.tsw{display:inline-flex;gap:2px;padding:2px;background:var(--sunken);border:1px solid var(--line);border-radius:7px}
.tsb{padding:4px 9px;border:0;border-radius:5px;background:transparent;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:11px;cursor:pointer}
.tsb[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.pane{display:none;padding:34px 40px 0;max-width:1220px}
.pane.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pane.on{animation:none}}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;font-weight:500}
.pane > h2{font-size:29px;margin-top:8px;letter-spacing:-.025em;font-weight:700}
.lede{color:var(--ink-2);font-size:15.5px;max-width:74ch;margin-top:11px;line-height:1.72}
.sec{margin-top:44px}
.sec > h3{font-size:17.5px;display:flex;align-items:center;gap:11px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.sec > h3::before{content:"";width:3px;height:15px;background:var(--accent);border-radius:2px;flex:none}
.note{color:var(--ink-2);font-size:14px;line-height:1.72;margin-top:12px;max-width:78ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.card h4{font-size:14.5px;margin-bottom:8px}
.card p{font-size:13.5px;color:var(--ink-2);line-height:1.68}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kg{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.kg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kg{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px;display:flex;flex-direction:column;gap:5px}
.kpi .lab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.kpi .val{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;color:var(--accent)}
.kpi .cap{font-size:11.5px;color:var(--ink-3);line-height:1.5}

.tag{display:inline-flex;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 7px;border-radius:4px;border:1px solid;white-space:nowrap;vertical-align:middle}
.t-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 34%,transparent);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.t-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 34%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.t-alert{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 34%,transparent);background:color-mix(in srgb,var(--alert) 10%,transparent)}
.t-dim{color:var(--ink-3);border-color:var(--line-strong);background:var(--raised)}
.t-acc{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-2);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--raised);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.62}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--raised)}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
td.tk{font-family:"IBM Plex Mono",monospace;color:var(--ink-3);font-size:12.5px;white-space:nowrap}
td.nm{font-weight:600;white-space:nowrap}
.tcap{font-size:13.5px;font-weight:600;margin:22px 0 8px}
.tnote{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);margin-top:8px;line-height:1.6}

.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:14px 17px;border-radius:0 8px 8px 0;font-size:14.5px;color:var(--ink-2);line-height:1.76;max-width:88ch}

.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 6px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink-3);border-radius:20px;padding:5px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ground);font-weight:500}
.search{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 13px;font-family:inherit;font-size:14px}
.search:focus{border-color:var(--accent);outline:none}
select.search{max-width:200px}
.count{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}

/* chain */
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 2px 10px;margin-top:16px}
.fnode{flex:0 0 150px;background:var(--sunken);border:1px solid var(--line-strong);border-radius:9px;padding:10px 12px;font-size:13px}
.fnode .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--accent)}
.fnode .t{font-weight:600;line-height:1.35;margin-top:2px}
.farr{flex:0 0 22px;display:grid;place-items:center;color:var(--ink-4);font-size:14px}
.vc{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:14px}
.vcx{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px;border-top:2px solid var(--accent)}
.vcx .r{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--accent);margin-bottom:5px}
.vcx h4{font-size:14px;margin-bottom:5px}
.vcx p{font-size:13.2px;color:var(--ink-2);line-height:1.66}
.vcx .co{font-size:12px;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.6}

/* modules */
.mods{display:grid;gap:10px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mod > summary{padding:14px 18px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mod > summary::-webkit-details-marker{display:none}
.mod > summary::after{content:"+";margin-left:auto;font-family:"IBM Plex Mono",monospace;color:var(--ink-4);font-size:16px}
.mod[open] > summary::after{content:"−"}
.mod > summary:hover{background:var(--raised)}
.mname{font-size:15px;font-weight:600}
.men{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-4)}
.mod .body{padding:4px 18px 18px;border-top:1px solid var(--line)}
.mod dl{margin:0}
.mod dt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4);margin:14px 0 4px}
.mod dd{margin:0;font-size:14.3px;color:var(--ink-2);line-height:1.74;max-width:86ch}
.pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 7px;border-radius:3px;background:var(--raised);border:1px solid var(--line);color:var(--ink-3)}
.dplede{font-size:15.5px;color:var(--ink);line-height:1.78;margin:16px 0 4px;padding:2px 0 2px 14px;border-left:3px solid var(--accent);max-width:84ch;font-weight:450}
.dpn p{margin-top:12px;font-size:14.5px;color:var(--ink-2);line-height:1.84;max-width:82ch}
.dpul{margin:10px 0 0;padding-left:18px}
.dpul li{font-size:14px;color:var(--ink-2);line-height:1.74;margin-bottom:8px;max-width:84ch}
.dpkr{margin-top:18px;padding:13px 16px;background:var(--sunken);border:1px solid var(--line);border-radius:9px;font-size:14px;color:var(--ink-2);line-height:1.72}
.dpkr .l{color:var(--accent);font-weight:600;margin-right:6px}
.formula{font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;padding:10px 13px;margin-top:10px;color:var(--ink);line-height:1.6;white-space:pre-wrap}

/* bars */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.chart h4{font-size:14.5px}
.chart .u{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.bar{display:grid;grid-template-columns:minmax(90px,34%) 1fr 72px;gap:10px;align-items:center}
.bar .bl{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.bar .bt{position:relative;height:12px;background:var(--sunken);border-radius:3px;border:1px solid var(--line)}
.bar .bf{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:2px}
.bar .bf.neg{background:var(--alert)}
.bar .bf.est{background:repeating-linear-gradient(135deg,var(--accent) 0 4px,color-mix(in srgb,var(--accent) 55%,transparent) 4px 7px)}
.bar .bf.neg.est{background:repeating-linear-gradient(135deg,var(--alert) 0 4px,color-mix(in srgb,var(--alert) 55%,transparent) 4px 7px)}
.bar .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink-4)}
.bar .bv{font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.chart .cn{font-size:12px;color:var(--ink-3);margin-top:12px;line-height:1.6;padding-top:10px;border-top:1px solid var(--line)}

/* timeline */
.tl{margin-top:18px;border-left:1px solid var(--line-strong);margin-left:6px}
.tli{position:relative;padding:0 0 20px 22px}
.tli::before{content:"";position:absolute;left:-5px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--dim)}
.tli.pos::before{border-color:var(--ok)} .tli.neg::before{border-color:var(--alert)}
.tli .d{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.tli h4{font-size:14.5px;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tli p{font-size:13.8px;color:var(--ink-2);margin-top:4px;line-height:1.7;max-width:84ch}
.bb{list-style:none;margin:10px 0 0;padding:0}
.bb li{font-size:13.8px;color:var(--ink-2);line-height:1.66;padding:8px 0;border-bottom:1px dashed var(--line)}
.bb li:last-child{border-bottom:0}

.ck li{list-style:none;display:flex;gap:9px;align-items:flex-start;font-size:13.8px;color:var(--ink-2);line-height:1.62;padding:6px 0}
.ck{margin:6px 0 0;padding:0}
.ck input{margin-top:4px;accent-color:var(--accent);flex:none}
.more{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-family:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
.more:hover{border-color:var(--accent);color:var(--accent)}
.evt{display:grid;grid-template-columns:104px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.evt .d{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.evt .n{font-size:14px;font-weight:600}
.evt .m{font-size:13px;color:var(--ink-3);margin-top:2px;line-height:1.55}
.evt.past .d{color:var(--ink-4)}
.cloud{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

@media (max-width:900px){
  .desks{display:none}
  .shell{flex-direction:column}
  .rail{position:static;width:100%;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{display:flex;overflow-x:auto;padding:8px;gap:4px}
  .nav-group{display:none}
  .nav button{width:auto;white-space:nowrap}
  .nav button .k{display:none}
  .desks{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px}
.desks .dl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-4);width:100%;padding:2px 4px 4px}
.desks a{font-size:12px;text-decoration:none;color:var(--ink-3);border:1px solid var(--line);border-radius:14px;padding:3px 9px;white-space:nowrap}
.desks a:hover{color:var(--accent);border-color:var(--accent-line)}
.desks a.cur{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);pointer-events:none}
.railfoot{display:none}
  .topbar{padding:10px 16px}
  .pane{padding:24px 16px 0}
  .pane > h2{font-size:24px}
  .bar{grid-template-columns:1fr 60px}
  .bar .bl{grid-column:1/-1}
  .evt{grid-template-columns:1fr;gap:2px}
}
/* ===== v2 blocks ===== */
.fig{margin:18px 0 0;padding:16px 14px 14px;background:var(--sunken);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.fig svg{display:block;width:100%;min-width:560px;height:auto;color:var(--ink-2)}
.fig svg text{fill:currentColor;font-family:inherit}
.fig figcaption{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2);line-height:1.74;max-width:86ch}
.sec .blk{margin-top:16px}
.callout.w{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.callout.r{border-left-color:var(--alert);background:color-mix(in srgb,var(--alert) 7%,transparent)}
.stage{display:grid;grid-template-columns:26px 1fr;gap:0 15px}
.stage .col{position:relative}
.stage .col::before{content:"";position:absolute;left:12px;top:6px;bottom:-6px;width:1px;background:var(--line)}
.stage:last-child .col::before{display:none}
.stage .dot{width:25px;height:25px;border-radius:50%;border:1px solid var(--accent-line);background:var(--surface);color:var(--accent);font-family:"IBM Plex Mono",monospace;font-size:11px;display:grid;place-items:center;position:relative;z-index:1;font-weight:500}
.stage .content{padding-bottom:22px}
.stage h4{font-size:15px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.stage .meta{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 8px}
.stage p{font-size:13.8px;color:var(--ink-2);line-height:1.68;max-width:80ch}
.stage .chk{font-size:12.8px;color:var(--ink-3);margin-top:7px;padding-left:12px;border-left:2px solid var(--line);line-height:1.6}
.stage .chk b{color:var(--accent);font-weight:500}
.dcard .dfl{display:flex;flex-wrap:wrap;gap:6px;padding-top:12px}
.dnote{margin-top:12px;padding-left:13px;border-left:2px solid var(--line);font-size:12.8px;color:var(--ink-3);line-height:1.66}

>전기요금(규제)<\/text><path d=\"M 470 363 H 330 V 253\" fill=\"none\" stroke-width=\"1.3\" style=\"stroke:var(--accent)\" marker-end=\"url(#a-pw1-accent)\"/><text x=\"400\" y=\"356\" font-size=\"10.5\" text-anchor=\"middle\" style=\"fill:var(--accent)\">SMP·정산금<\/text><path d=\"M 270 253 V 410 H 95 V 253\" fill=\"none\" stroke-width=\"1.3\" style=\"stroke:var(--accent)\" marker-end=\"url(#a-pw1-accent)\"/><text x=\"182\" y=\"403\" font-size=\"10.5\" text-anchor=\"middle\" style=\"fill:var(--accent)\">연료비(JCC·JKM)<\/text><line x1=\"700\" y1=\"425\" x2=\"730\" y2=\"425\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\"/><text x=\"736\" y=\"429\" font-size=\"10.5\" text-anchor=\"start\" fill-opacity=\"0.8\">설비·전력<\/text><line x1=\"800\" y1=\"425\" x2=\"830\" y2=\"425\" stroke-width=\"1.3\" style=\"stroke:var(--accent)\"/><text x=\"836\" y=\"429\" font-size=\"10.5\" text-anchor=\"start\" style=\"fill:var(--accent)\">돈<\/text><\/svg>", "cap": "**결론: 같은 전력 사이클이라도 돈이 도착하는 순서가 정반대다.** 전력기기·전선 업체는 오른쪽(수용가·유틸리티)에서 내려오는 CAPEX를 발주로 먼저 받아 수주잔고로 쌓고, 한전·IOU 같은 계통 사업자는 망을 먼저 짓고(차입 선행) 요금으로 수년에 걸쳐 회수한다. 그래서 장비 업체는 PER·EPS 성장률로, 유틸리티는 PBR-ROE·원가회수율로 평가한다."}, {"t": "p", "text": "전력 밸류체인은 ‘원자재 → 발전설비 → 연료 → 발전 → 송변전 기기·전선 → 계통 운영·판매 → 배전·수용가 설비 → 정비’ 순으로 흐른다. 지금 사이클의 이익은 공급자가 적고 리드타임이 긴 단계(초고압 변압기·가스터빈·해저케이블)에 가장 크게 몰리고, 요금이 규제되는 단계(한전·가스공사)는 원가 충격을 떠안는 구조다."}, {"t": "cards", "items": [{"r": "01", "h": "원자재·핵심 소재", "p": "방향성 전기강판(GOES)·연속전위권선(CTC) 구리선·절연유·구리·SiC/GaN 전력반도체 공급", "co": "**마진 원천** 소재 과점과 증산 유인 부족(GOES는 NOES와 라인 경합). 변압기 원가의 약 25%가 GOES·CTC\n**국내** POSCO홀딩스, 삼성전기, LS(LS MnM·LS아이앤디 보유)"}, {"r": "02", "h": "발전설비 제조", "p": "대형 가스터빈·스팀터빈·HRSG·원전 주기기·중속엔진·연료전지 제작", "co": "**마진 원천** 3사 과점(GE Vernova·Siemens Energy·MHI 약 70%)과 슬롯 예약, 설치 후 20~30년 LTSA 서비스 매출\n**국내** 두산에너빌리티, HD현대중공업, 두산퓨얼셀, 비에이치아이"}, {"r": "03", "h": "연료 조달·도매", "p": "LNG 장기계약·현물 도입, 저장·기화·주배관 공급, LPG 수입", "co": "**마진 원천** 가스공사는 총괄원가 규제(요금기저×적정투자보수율), LPG사는 트레이딩·연료 스프레드\n**국내** 한국가스공사, SK가스, E1"}, {"r": "04", "h": "발전사업", "p": "원전(한수원)·석탄·LNG(발전자회사·민간 IPP)·집단에너지·재생에너지 발전 후 전력시장 판매", "co": "**마진 원천** SMP와 자기 연료비의 차이. 한전과 제로섬 관계(원가 급등기 발전사 유리, 하락기 한전 유리)\n**국내** 한국전력(한수원·발전자회사), 지역난방공사, SK이터닉스, SGC에너지, SK가스(울산GPS)"}, {"r": "05", "h": "송변전 기기", "p": "초고압 변압기·리액터·GIS/GCB·HVDC 변환용 변압기(CTR)·STATCOM 제작", "co": "**마진 원천** 공급자 우위: 판가 인상·관세 전가·선급금·장기 슬롯. 국내 3사 평균 OPM 2022년 5.3%→2025년 15.2%\n**국내** HD현대일렉트릭, 효성중공업, LS ELECTRIC, 일진전기, 산일전기"}, {"r": "06", "h": "전선·해저케이블·시공", "p": "초고압 지중·해저·HVDC 케이블 제조와 포설선(CLV) 기반 턴키 시공", "co": "**마진 원천** 구리 가격은 판가에 연동(에스컬레이션)하고 가공·시공 부가가치가 이익. 전압이 높을수록, 턴키일수록 마진↑\n**국내** 대한전선, LS전선(비상장), LS에코에너지, LS마린솔루션, 가온전선, 일진전기"}, {"r": "07", "h": "계통 운영·송배전·판매", "p": "한국은 한전이 송전·배전·판매 독점, 미국은 ISO/RTO가 계통·시장 운영하고 규제 유틸리티가 망 소유", "co": "**마진 원천** 총괄원가(적정원가+요금기저×보수율). 한국은 정부 요금 결정·연료비 연동 제한으로 회수 불확실성이 할인 요인\n**국내** 한국전력"}, {"r": "08", "h": "배전·수용가 전력기기", "p": "배전반·배전변압기(패드마운트)·특수변압기·중저압 차단기·버스덕트", "co": "**마진 원천** 단납기(6개월~1년) 반복 매출, 데이터센터 이중화(N+1·2N)로 MW당 투입량 증가\n**국내** LS ELECTRIC, 산일전기, HD현대일렉트릭, 가온전선, 제룡전기"}, {"r": "09", "h": "데이터센터 내부 전력·저장", "p": "UPS·BBU·BESS·PCS, 800VDC 정류기·SST·SSCB, 온사이트 발전 연계", "co": "**마진 원천** 전력밀도 상승에 따른 MW당 콘텐츠 증가(Eaton MW당 약 290만→340만달러), 표준 선점 업체가 가격 결정\n**국내** 삼성SDI, LG에너지솔루션, LS ELECTRIC, 서진시스템, 비나텍, 한중엔시에스"}, {"r": "10", "h": "정비·수명연장(O&M)", "p": "원전·화력 계획예방정비, 원전 계속운전(LTO) 개보수, 해외 원전 정비", "co": "**마진 원천** 반복 계약 기반 안정 이익, 고배당(한전KPS 평균 배당성향 약 53~65%)\n**국내** 한전KPS, 일진파워"}]}], "note": "밸류체인을 전력(kWh)의 흐름으로만 보면 절반만 보인다. 설비는 위에서 아래로 납품되고, 돈은 수용가의 요금과 유틸리티의 CAPEX로 거꾸로 올라간다."}, {"h": "여섯 개 하위 섹터 — 같은 사이클 안에서 속도가 다르다", "blocks": [{"t": "grid", "cols": 2, "items": [{"h": "변압기·차단기(초고압·배전)", "p": ["송전망의 전압을 올리고 내리는 초고압 변압기(154~765kV)와 GIS·차단기·리액터, 그리고 수요지 인근의 배전변압기·배전반을 만든다. 2022년 초고압 송전이 먼저 호황에 들어갔고 2025년부터 AI 데이터센터 배전이 두 번째 사이클로 겹쳤다. 한국 업체는 빠른 납기와 선제 증설로 미국 수입시장 점유율을 끌어올렸다."], "list": ["**동인** 미국 유틸리티 CAPEX·765kV 송전망, 데이터센터 블록 증설, 리드타임과 판가(PPI), 증설 완공 시점(Q)", "**사이클** 수주는 1~5년 뒤 매출로 전환되는 장기 사이클. 과거 2000년대 슈퍼사이클 후 2008년 과잉 CAPA로 붕괴한 경험 때문에 업체들이 보수적으로 증설 중", "**국내** HD현대일렉트릭, 효성중공업, LS ELECTRIC, 일진전기, 산일전기, 제룡전기"]}, {"h": "전선·해저케이블·HVDC", "p": ["초고압 지중·해저 케이블과 HVDC 케이블, 이를 바다에 까는 포설선과 시공까지 묶은 턴키 사업이다. 상위 4개사가 해저케이블의 약 85%를 차지하는 과점이며, 해상풍력·국가 간 연계선·서해안 HVDC 에너지고속도로가 수요를 만든다. 매출은 구리값에 출렁이므로 수주잔고와 마진으로 봐야 한다."], "list": ["**동인** 해상풍력 설치량·입찰, HVDC 프로젝트 발주(서해안 8GW, 유럽 TSO 프레임워크), 포설선 확보, 구리 가격", "**사이클** 프로젝트형이라 연도별 변동이 크고 공장·포설선 증설에 3~4년이 걸린다. 잔고/매출 5년 이상(유럽 3사 5.4년)이면 공급 과잉 우려가 낮다", "**국내** 대한전선, LS전선(비상장), LS에코에너지, LS마린솔루션, 가온전선, 일진전기"]}, {"h": "AIDC 전력(800VDC·UPS·ESS)", "p": ["AI 랙 전력밀도가 10kW에서 1MW로 커지면서 데이터센터 내부 전력 구조(415V AC→800V DC), 무정전·저장(BBU·UPS·BESS), 온사이트 연계 설비가 새 시장이 됐다. 1GW 캠퍼스는 50MW 블록 20개가 반복 발주되는 구조라 중압 변압기·배전반·정류 모듈 수요가 누적된다."], "list": ["**동인** 빅테크 CAPEX, 랙당 kW(Rubin/Rubin Ultra), 800VDC 표준화 일정(2027년 상용화), 온사이트 발전 비중, NERC 신뢰도 표준", "**사이클** 데이터센터 착공 전환율에 연동된 단주기. 2026년은 착공 지연 우려가 컸고 2H26~2027이 800VDC 공급망 발주·초기 상용화 구간", "**국내** LS ELECTRIC, 산일전기, 가온전선, 삼성SDI, LG에너지솔루션, 서진시스템, 비나텍, 한중엔시에스"]}, {"h": "발전설비(가스터빈·엔진·연료전지)", "p": ["데이터센터의 24시간 부하를 받쳐줄 수 있는 디스패처블 전원(가스터빈·원전·연료전지·엔진)을 만드는 산업이다. 가스터빈 3사의 2030년까지 잔여 슬롯이 거의 소진돼 중속엔진·연료전지 같은 온사이트 대체 전원이 부상했다. 원전은 이 데스크에서는 전원 믹스와 기자재 수요 관점으로만 다룬다(노형·연료는 원전 데스크)."], "list": ["**동인** 가스터빈 슬롯·리드타임(4~6년)·가격(2027년 약 600달러/kW 전망), 데이터센터 온사이트 비중, 대미 원전 투자, SMR 인허가", "**사이클** 발전소 건설계획 증가가 2~3년 뒤 변압기·차단기 발주로 이어지는 선행 사이클. 가스터빈 증설분은 2028년 이후 출하", "**국내** 두산에너빌리티, HD현대중공업, 두산퓨얼셀, 비에이치아이, 한전기술, 한전KPS, 씨에스윈드"]}, {"h": "국내 유틸리티(한전·가스공사·지역난방·발전)", "p": ["한전(송배전·판매 독점), 한국가스공사(LNG 도입·도매), 지역난방공사(열·전기), 발전 자회사와 민간 발전사로 구성된다. 요금이 정부 규제를 받아 원가 변동과 요금 조정 사이의 시차가 이익을 좌우하고, 밸류에이션은 PBR-ROE와 배당으로 본다. 2026년에는 호르무즈 쇼크 원가 충격과 12차 전기본 송변전 투자 부담이 동시에 걸려 있다."], "list": ["**동인** 유가·JKM·환율→SMP(3~6개월 시차), 원전 이용률, 전기·가스 요금 조정, 사채한도, 미수금", "**사이클** 원가 하락기에는 한전 증익·민간 발전사 감익, 원가 급등기에는 반대인 제로섬 구조. 요금 인상은 선거 일정에 좌우", "**국내** 한국전력, 한국가스공사, 지역난방공사, SK가스, E1, SGC에너지, SK이터닉스"]}, {"h": "미국 유틸리티·전력시장", "p": ["미국은 7개 ISO/RTO가 분절 운영하고 주 규제기관이 요금을 승인하는 투자자소유 유틸리티(IOU)가 망을 소유한다. 데이터센터 부하 계약이 유틸리티 CAPEX를 매 분기 끌어올리고, FERC·NERC·주 정부 규칙이 ‘누가 망 비용을 내는가’를 바꾸며 BTM(온사이트)과 FTM(계통) 수요의 순서를 결정한다."], "list": ["**동인** 유틸리티 계약부하(AEP·Dominion·Duke), 5개년 CAPEX, PJM 용량가격, FERC Order 2023·Co-location·Large Load 규칙, 765kV 승인", "**사이클** 규제위원회 승인을 거친 5년 계획이라 관성이 크고 빅테크 분기 가이던스보다 긴 주기로 움직인다", "**국내** 직접 상장사는 없음 — 국내 초고압 변압기·배전·전선 업체의 최대 고객(효성중공업 HICO, HD현대일렉트릭 앨라배마, LS ELECTRIC MCM 등)"]}]}], "note": "같은 ‘전력 인프라’라도 수주에서 매출까지 걸리는 시간, 가격을 정하는 주체, 사이클을 흔드는 변수가 모두 다르다. 하위 섹터별 현재 국면과 심화는 10 테마·사이클에서 다룬다."}, {"h": "이 도구의 사용법", "blocks": [{"t": "grid", "cols": 2, "numbered": true, "items": [{"h": "처음 배울 때 순서", "p": "01 산업 지도로 네 층(발전·송변전·배전·유틸리티)과 돈의 방향을 먼저 잡고, 02 전력망 구조에서 전압 계단(765→345→154→22.9kV)과 AC·HVDC의 차이를 익힌다. 03 기기 백과에서 초고압 변압기·GIS·HVDC·800VDC·가스터빈을 검색해 읽고, 04 수주·실적 읽기로 ‘수주→잔고→매출’ 구조를 이해하면 05 AIDC 전력과 06 유틸리티 요금·회수 구조가 쉽게 읽힌다. 마지막으로 10 테마·사이클에서 2025.10~2026.09 시장 인식이 어떻게 바뀌었는지 확인하고, 궁금한 주제는 07 딥다이브에서 골라 읽는다."}, {"h": "딜 검토할 때", "p": "전력기기·전선 IPO라면 13 체크포인트의 ‘기업 유형별 5분 스캔’으로 위치(전압 계단)와 계약 구조를 확정하고, 세부 체크리스트의 ‘수주잔고의 질’과 ‘증설 병목 공정’을 먼저 본다. 이어 12 밸류에이션의 방법론 매칭 표로 피어와 멀티플 기준 시점을 고르고, 09 수주 트래커에서 비교 가능한 계약의 대당·GW당 단가를 확인한다. 특수변압기처럼 1년 계약 제품은 잔고가 작아도 재가격이 빠르니 대형 변압기와 같은 잣대로 비교하지 않는다. 유틸리티·에너지 딜은 06의 총괄원가·미수금 구조와 11 정책 워치(사채한도·12차 전기본)부터 본다."}, {"h": "숫자를 인용하기 전에", "p": "모든 수치에 시점과 원출처가 붙어 있고, 원자료는 16 수치 DB에서 검색할 수 있다. ‘미국 DC 계통연계 부하’는 유틸리티 16사/18사 집계 기준과 분기가 섞여 있으니 같은 기준끼리만 비교하고, ‘원전 이용률 1%p당 한전 이익’ 같은 민감도는 리포트마다 1,840억~4,600억원으로 달라 범위로 인용한다. 태그가 ‘추정’이면 리포트 전망치, ‘미확인’이면 원문 간 불일치가 있는 숫자다. 기준이 엇갈리는 대표 수치는 18 출처·데이터 품질의 상충 표에 모아 두었다."}, {"h": "이 자료의 한계", "p": "근거는 2025-10-14부터 2026-09-21까지 발간된 국내 산업 리포트 37건이다. 리포트 톤은 대부분 업황에 긍정적(긍정 31건, 중립 5건, 부정 1건)이라 상승 논리 쪽으로 편향될 수 있으며, 공급 과잉·가격 하락 시나리오는 10 테마·사이클의 하방 항목과 13 체크포인트 레드플래그로 따로 정리했다. 회사 공시·가이던스는 시점이 지나면 바뀌므로(HD현대일렉트릭 수주 가이던스 42→52억달러 등) 딜 시점에는 최신 공시로 재확인해야 한다. 원전 노형·핵연료 상세는 원전 데스크, 재생에너지 기술은 에너지전환 데스크를 본다."}]}]}]}, "grid": {"title": "전력망 구조", "en": "Grid Architecture", "h2": "전력망 구조 — 전압 계단을 따라가면 수요가 보인다", "lede": "전력기기 수요를 이해하는 가장 빠른 길은 전기가 발전소에서 콘센트까지 가는 동안 **전압이 몇 번 바뀌는지** 세어 보는 것이다. 전압이 바뀌는 곳마다 변압기가, 끊고 이어야 하는 곳마다 차단기·GIS가, 멀리 보내야 하는 구간마다 전선·HVDC가 들어간다. 765kV가 왜 부활했는지, 서해안은 왜 해저 직류인지, 데이터센터는 왜 초고압 설비를 직접 사는지가 모두 이 계단 구조에서 나온다.", "sections": [{"h": "전기는 한 번 올라갔다가 세 번 이상 내려온다", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 940 405\" role=\"img\" aria-label=\"전압은 발전소에서 한 번 크게 올라가고 수요지로 오며 여러 번 내려가며, 계단마다 변압기가 들어간다\"><defs><marker id=\"a-pw2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"6\" y=\"30\" width=\"118\" height=\"54\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"65.0\" y=\"53.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">발전소<\/text><text x=\"65.0\" y=\"69.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">원전·석탄·LNG<\/text><line x1=\"124\" y1=\"57\" x2=\"139\" y2=\"57\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw2)\"/><rect x=\"141\" y=\"30\" width=\"118\" height=\"54\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--accent)\"/><text x=\"200.0\" y=\"53.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">승압 변압기<\/text><text x=\"200.0\" y=\"69.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">GSU<\/text><line x1=\"259\" y1=\"57\" x2=\"274\" y2=\"57\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw2)\"/><rect x=\"276\" y=\"30\" width=\"118\" height=\"54\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"335.0\" y=\"53.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">초고압 송전<\/text><text x=\"335.0\" y=\"69.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">765·345kV<\/text><line x1=\"394\" y1=\"57\" x2=\"409\" y2=\"57\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw2)\"/><rect x=\"411\" y=\"30\" width=\"118\" height=\"54\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--accent)\"/><text x=\"470.0\" y=\"53.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">변전소<\/text><text x=\"470.0\" y=\"69.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">345→154kV<\/text><line x1=\"529\" y1=\"57\" x2=\"544\" y2=\"57\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw2)\"/><rect x=\"546\" y=\"30\" width=\"118\" height=\"54\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--accent)\"/><text x=\"605.0\" y=\"53.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">배전 변전소<\/text><text x=\"605.0\" y=\"69.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">154→22.9kV<\/text><line x1=\"664\" y1=\"57\" x2=\"679\" y2=\"57\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw2)\"/><rect x=\"681\" y=\"30\" width=\"118\" height=\"54\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--accent)\"/><text x=\"740.0\" y=\"53.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">배전 변압기<\/text><text x=\"740.0\" y=\"69.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">22.9kV→380V<\/text><line x1=\"799\" y1=\"57\" x2=\"814\" y2=\"57\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw2)\"/><rect x=\"816\" y=\"30\" width=\"118\" height=\"54\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"875.0\" y=\"53.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">수용가<\/text><text x=\"875.0\" y=\"69.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">가정·상가<\/text><line x1=\"58\" y1=\"150\" x2=\"930\" y2=\"150\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.18\" stroke-dasharray=\"5 4\"/><text x=\"52\" y=\"154\" font-size=\"11\" text-anchor=\"end\" fill-opacity=\"0.8\">765kV<\/text><line x1=\"58\" y1=\"180\" x2=\"930\" y2=\"180\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.18\" stroke-dasharray=\"5 4\"/><text x=\"52\" y=\"184\" font-size=\"11\" text-anchor=\"end\" fill-opacity=\"0.8\">345kV<\/text><line x1=\"58\" y1=\"214\" x2=\"930\" y2=\"214\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.18\" stroke-dasharray=\"5 4\"/><text x=\"52\" y=\"218\" font-size=\"11\" text-anchor=\"end\" fill-opacity=\"0.8\">154kV<\/text><line x1=\"58\" y1=\"254\" x2=\"930\" y2=\"254\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.18\" stroke-dasharray=\"5 4\"/><text x=\"52\" y=\"258\" font-size=\"11\" text-anchor=\"end\" fill-opacity=\"0.8\">22.9kV<\/text><line x1=\"58\" y1=\"290\" x2=\"930\" y2=\"290\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.18\" stroke-dasharray=\"5 4\"/><text x=\"52\" y=\"294\" font-size=\"11\" text-anchor=\"end\" fill-opacity=\"0.8\">380V<\/text><text x=\"52\" y=\"122\" font-size=\"11\" text-anchor=\"end\" font-weight=\"600\" fill-opacity=\"0.8\">전압<\/text><path d=\"M 65 234 H 200 V 150 H 470 V 214 H 605 V 254 H 740 V 290 H 920\" fill=\"none\" stroke-width=\"2.4\" style=\"stroke:var(--accent)\"/><path d=\"M 200 180 H 470\" fill=\"none\" stroke-width=\"1.4\" stroke=\"currentColor\" stroke-opacity=\"0.5\" stroke-dasharray=\"5 4\"/><text x=\"335\" y=\"174\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.75\">345kV 경로<\/text><text x=\"335\" y=\"144\" font-size=\"10.5\" text-anchor=\"middle\" style=\"fill:var(--accent)\">장거리·대용량 = 765kV<\/text><circle cx=\"200\" cy=\"150\" r=\"4.5\" style=\"fill:var(--accent)\"/><circle cx=\"470\" cy=\"214\" r=\"4.5\" style=\"fill:var(--accent)\"/><circle cx=\"605\" cy=\"254\" r=\"4.5\" style=\"fill:var(--accent)\"/><circle cx=\"740\" cy=\"290\" r=\"4.5\" style=\"fill:var(--accent)\"/><text x=\"214\" y=\"200\" font-size=\"10.5\" text-anchor=\"start\" style=\"fill:var(--accent)\">승압<\/text><text x=\"478\" y=\"232\" font-size=\"10.5\" text-anchor=\"start\" style=\"fill:var(--accent)\">강압 ①<\/text><text x=\"613\" y=\"272\" font-size=\"10.5\" text-anchor=\"start\" style=\"fill:var(--accent)\">강압 ②<\/text><text x=\"748\" y=\"280\" font-size=\"10.5\" text-anchor=\"start\" style=\"fill:var(--accent)\">강압 ③<\/text><text x=\"72\" y=\"228\" font-size=\"10.5\" text-anchor=\"start\" fill-opacity=\"0.75\">발전 전압<\/text><path d=\"M 145 318 V 326 H 529 V 318\" fill=\"none\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.5\"/><path d=\"M 544 318 V 326 H 928 V 318\" fill=\"none\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.5\"/><text x=\"337\" y=\"346\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">송전 계통 — 한전(한국) · 송전 유틸리티(미국)<\/text><text x=\"337\" y=\"368\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.8\">국내 변전소 765kV 8 · 345kV 122 · 154kV 788개소(2024)<\/text><text x=\"337\" y=\"388\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.8\">송변전 손실률 1.57%(2024, 한국전력)<\/text><text x=\"736\" y=\"346\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">배전 계통 — 배전변압기·배전반·계량<\/text><text x=\"736\" y=\"368\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.8\">배전 손실률 1.98%(2024, 한국전력)<\/text><text x=\"736\" y=\"388\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.8\">미국 33년 넘은 배전변압기 약 55%(DOE)<\/text><\/svg>", "cap": "**결론: 전력기기 수요는 ‘전압 계단의 수 × 계단당 설비’다.** 전압은 발전소 승압 변압기에서 한 번 크게 올라갔다가 수요지로 다가가며 세 번 이상 내려가고, 계단마다 변압기·차단기·GIS가 들어간다. 이번 사이클에서 가장 비싸고 느린 계단은 맨 위(765·345kV)이고, 데이터센터처럼 154~345kV로 직접 수전하는 대형 수용가가 늘수록 위쪽 계단의 설비가 수요지 바로 앞에 추가된다."}, {"t": "grid", "cols": 2, "numbered": true, "items": [{"h": "발전 — 전기를 만든다", "p": "원전·석탄·LNG·재생에너지 발전소가 전기를 만든다. 발전기 출력 전압은 송전하기엔 낮아서 발전소 바로 옆 **승압 변압기(GSU)**가 송전 전압으로 올린다. 기저발전 1GW를 345kV 망에 연계하는 데 600MVA급 변압기가 승압 3대·감압 3대, 최대 6대 필요하다는 것이 리포트의 수요 산식이다."}, {"h": "송전 — 멀리, 많이 옮긴다", "p": "한국은 765kV·345kV·154kV, 미국은 115~765kV가 송전이다. 전압이 높을수록 같은 전력의 전류가 줄어 손실과 필요한 선로 수가 줄어든다. 송전망은 한국은 한전, 미국은 규제 유틸리티(IOU)가 소유하고 ISO/RTO가 운영한다."}, {"h": "변전 — 계단을 내려간다", "p": "송전 변전소는 345→154kV처럼 전압을 한 단계씩 낮추고, 고장 시 회로를 끊는 GIS·차단기, 무효전력을 조절하는 리액터·STATCOM이 함께 설치된다. 국내 변전소는 765kV 8개소, 345kV 122개소, 154kV 788개소다(2024, 한국전력)."}, {"h": "배전 — 나눠서 보낸다", "p": "배전 변전소에서 22.9kV로 낮춘 전기를 배전선으로 나누고, 주상·패드마운트 배전변압기가 380/220V로 마지막 강압을 한다. 데이터센터·반도체 공장 같은 대형 수용가는 154~345kV로 직접 수전해 캠퍼스 안에서 스스로 배전하므로, 사실상 ‘작은 계통’을 하나 더 짓는 셈이다."}]}]}, {"h": "전압 계층표 — 등급마다 기기·업체·병목이 다르다", "blocks": [{"t": "table", "cols": ["전압 등급", "한국에서의 역할", "미국에서의 역할", "핵심 기기", "변압기 리드타임", "국내 공급사"], "rows": [["765kV", "초고압 송전 간선(변전소 8개소, 2024)", "북미 교류 최고 전압 — ERCOT·MISO·SPP·PJM 신규 백본", "단상 변압기 3대 = 1 Bank, 리액터, 800kV GCB·GIS 패키지", "48~60개월", "효성중공업(멤피스), HD현대일렉트릭"], ["345kV (미국 345~500kV)", "주력 송전망(변전소 122개소)", "EHV 송전·데이터센터 인입", "초고압 변압기·GIS·차단기", "36~48개월", "HD현대일렉트릭, 효성중공업, LS ELECTRIC, 일진전기"], ["154kV (미국 115~230kV)", "지역 송전·대형 수용가 수전(변전소 788개소)", "HV 송전", "변압기·GIS", "24~36개월", "위 업체 + 산일전기(154kV 2028 양산 목표)"], ["22.9kV (미국 4.2~34.5kV)", "배전망", "배전·데이터센터 캠퍼스 중압(34.5kV), 준송전 34.5~69kV", "배전변압기·배전반·VCB", "12~20개월(69kV 미만)", "LS ELECTRIC, 산일전기, 제룡전기, HD현대일렉트릭"], ["저압·랙 전원", "380/220V 수용가", "415V AC → 800V DC 전환 중", "분전반·UPS·PDU·버스웨이·정류기", "배전반 수주→매출 6~10개월", "LS ELECTRIC, 가온전선, 삼성SDI·LG에너지솔루션(BBU)"]], "note": "국내 변전소 수는 한국전력(2024), 미국 전압 구분은 리포트 인용. 리드타임은 2026년 업계 기준 주문→인도이며 배전반은 수주→매출 기간이다."}, {"t": "callout", "text": "기업을 볼 때 ‘변압기 회사’라는 말만으로는 아무것도 알 수 없다. **어느 전압 계단의 제품을, 몇 년 납기로, 누구에게 파는가**를 먼저 확정해야 리드타임·계약 구조·마진이 따라서 정해진다.", "title": "읽는 법"}]}, {"h": "송전 전압을 올리는 이유 — 손실보다 통행권", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 900 330\" role=\"img\" aria-label=\"같은 전력을 765kV로 보내면 345kV 대비 회선 수와 0\" y=\"212\" font-size=\"12\" text-anchor=\"end\" font-weight=\"600\">345kV<\/text><rect x=\"550\" y=\"194\" width=\"290.0\" height=\"28\" rx=\"3\" style=\"fill:var(--alert);fill-opacity:0.35\"/><text x=\"846.0\" y=\"213\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\">20.69%<\/text><text x=\"480\" y=\"268\" font-size=\"11\" text-anchor=\"start\" fill-opacity=\"0.8\">단일 회선 50마일 송전능력(AEP)<\/text><text x=\"480\" y=\"288\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"600\">345kV 약 1,170MW vs 765kV 약 6,630MW<\/text><\/svg>", "cap": "**결론: 765kV의 진짜 가치는 효율보다 ‘통행권’이다.** 전압을 두 배 이상 올리면 같은 전력의 전류가 줄고 손실은 전류 제곱으로 줄어, 5GW를 100마일 보내는 데 345kV는 12회선·765kV는 2회선이면 된다. 부지 보상·환경평가 대상이 1/5~1/6로 줄어드는 셈이라, GW급 데이터센터 부하가 몰린 텍사스가 2025년 4월 345kV 확장안 대신 765kV를 택했다."}, {"t": "p", "text": "경제적 송전전압은 보낼 전력과 거리에 비례해 커진다. 손실률은 대략 ‘전력 × 단위저항 × 거리 ÷ (전압² × 역률)’로 근사되므로, 거리가 길고 용량이 클수록 높은 전압이 유리하다. 리포트의 APR1400 2기 전력(약 3GW)을 350km 보내는 사례에서는 경제적 전압이 약 956kV로 계산돼 765kV가 투자비 대비 손실 측면에서 유리했고, 100km 이내에서도 154kV는 손실이 최대 45%까지 커질 수 있어 장거리 대용량에는 최소 345kV가 필요하다는 분석이 제시됐다."}, {"t": "table", "cols": ["항목", "765kV", "500kV", "345kV"], "rows": [["단일회선 50마일 송전능력", "약 6,630MW", "-", "약 1,170MW"], ["열적 한계", "6,625MVA", "-", "1,793MVA"], ["350km·3GW 손실률(리포트 시뮬레이션)", "2.88%", "7.78%", "20.69%"], ["ROW 폭", "200~250ft", "130~160ft", "120~150ft"], ["100마일당 손실", "0.5~1%", "1~2%", "2~4%"], ["도체 구성", "4~6도체 번들", "3도체 번들", "2도체 번들"]], "title": "765kV vs 500kV vs 345kV 비교", "note": "AEP·MISO 자료와 리포트 시뮬레이션. 손실률은 350km·3GW 가정."}, {"t": "p", "text": "송전 용량을 늘리는 길은 두 가지다. 기존 345kV 선로를 500kV로 올리면 단순 계산상 용량이 약 1.45배, 조건에 따라 2~3배까지 늘고 3년 이내에 가능하다. 도체만 고성능으로 바꾸는 재도체화(Reconductoring)는 3~4년, 기상 조건에 따라 허용 전류를 실시간으로 올리는 DLR은 1~2년이면 된다. 반면 신규 선로는 환경영향평가·주민 반대로 5~15년(미국 신규 송전선 7년 이상)이 걸리지만 재생에너지·데이터센터 입지가 바뀌었기 때문에 중장기로는 필수다."}]}, {"h": "교류(AC)와 직류(HVDC) — 무엇을 언제 쓰나", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 900 340\" role=\"img\" aria-label=\"HVDC는 변환소 고정비가 크지만 거리당 비용이 낮아 해저는 수십 km, 육상은 수백 km부터 교류보다 싸진 "0.75\" stroke-dasharray=\"5 4\"/><text x=\"338\" y=\"118\" font-size=\"11\" text-anchor=\"start\" fill-opacity=\"0.85\">AC 해저<\/text><line x1=\"212\" y1=\"196\" x2=\"212\" y2=\"300\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.45\" stroke-dasharray=\"5 4\"/><circle cx=\"212\" cy=\"197\" r=\"4.5\" style=\"fill:var(--accent)\"/><text x=\"218\" y=\"250\" font-size=\"11\" text-anchor=\"start\" font-weight=\"600\">해저 손익분기<\/text><text x=\"218\" y=\"266\" font-size=\"10.5\" text-anchor=\"start\" fill-opacity=\"0.8\">40~100km·400MW 이상<\/text><line x1=\"632\" y1=\"170\" x2=\"632\" y2=\"300\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.45\" stroke-dasharray=\"5 4\"/><circle cx=\"632\" cy=\"170\" r=\"4.5\" style=\"fill:var(--accent)\"/><text x=\"638\" y=\"250\" font-size=\"11\" text-anchor=\"start\" font-weight=\"600\">육상 손익분기<\/text><text x=\"638\" y=\"266\" font-size=\"10.5\" text-anchor=\"start\" fill-opacity=\"0.8\">약 684km(리포트 인용)<\/text><line x1=\"150\" y1=\"170\" x2=\"96\" y2=\"202\" stroke-width=\"1.3\" style=\"stroke:var(--accent)\" marker-end=\"url(#a-pw4-accent)\"/><text x=\"154\" y=\"166\" font-size=\"10.5\" text-anchor=\"start\" style=\"fill:var(--accent)\">변환소 고정비<\/text><\/svg>", "cap": "**결론: HVDC는 ‘고정비 대 거리비’의 교환이다.** 양 끝 변환소(변환용 변압기·밸브)라는 큰 고정비를 먼저 내는 대신 km당 비용과 손실이 낮아, 해저는 40~100km(400MW 이상)만 넘어도, 육상 가공선은 수백 km를 넘어야 교류보다 싸진다. 서해안 에너지고속도로(해저 약 1,070km·8GW)가 HVDC이고, 수혜가 케이블·포설선과 함께 변환설비(CTR)에도 걸리는 이유다."}, {"t": "table", "cols": ["항목", "교류(HVAC)", "직류(HVDC)"], "rows": [["전압 변환", "변압기로 쉽게 올리고 내림", "양 끝 변환소(변환용 변압기 CTR + 밸브) 필요"], ["적합 구간", "대부분의 송전·배전", "장거리 대용량, 해저, 국가 간 연계, 원거리 해상풍력"], ["경제성 역전 거리", "-", "해저 40~100km·400MW 이상, 육상 가공선 약 684km(리포트 인용)"], ["방식", "-", "전류형(LCC): 대용량 실적 / 전압형(VSC): 제어 유연성, 해상풍력·재생 연계로 확대"], ["핵심 기기", "변압기·GIS·차단기·리액터·가공선·지중케이블", "CTR·변환밸브·HVDC 케이블(320~640kV)·포설선"], ["국내 사례", "345·765kV 교류망", "동해안 HVDC(EP1 4GW, 대부분 지상·지중), 서해안 HVDC 8GW(대부분 해저)"], ["국내 업체", "변압기 3사·일진전기·대한전선", "LS ELECTRIC(동해안 CTR 40대 5,610억원, GE Vernova와 VSC 합작), 효성중공업(창원 HVDC 변압기 공장), 대한전선·LS전선(케이블)"]], "note": "리포트 정리. 경제성 역전 거리는 용량·지형·케이블 종류에 따라 달라지는 개념적 기준이다."}, {"t": "p", "text": "HVDC는 변환 방식에 따라 두 갈래다. 전류형(LCC)은 사이리스터 밸브를 쓰며 대용량 장거리 송전 실적이 많고, 전압형(VSC)은 IGBT 기반이라 무효전력을 스스로 제어할 수 있어 약한 계통·해상풍력·재생에너지 연계에 유리하다. 국내는 KAPES(한전-Alstom 합작, 현 GE 계열)를 통한 LCC 경험이 있고 최근 프로젝트는 VSC가 채택되는 추세라, **글로벌 Top-tier와의 기술 제휴 여부가 변환설비 수주 경쟁의 핵심**이다. 변환용 변압기(CTR) 국산화 R&D에는 약 1,200억원(2025~2027)이 투입된다."}]}, {"h": "망 투자는 세 갈래로 온다 — 확장·교체·고도화", "blocks": [{"t": "grid", "cols": 3, "items": [{"h": "확장", "p": "신규 발전원·대형 부하를 잇는 신규 선로·변전소. 미국 765kV 백본, 한국 서해안 HVDC·11차 장기송변전계획(2038년 송전선 61,183C-km·변전소 1,297개), 데이터센터 인입 변전소가 여기에 속한다.", "list": ["미국 장거리 송전용량 2030년까지 +16%, 연 5,000마일 필요 vs 2025년 780마일(DOE)", "국내 HVDC 송전선로 492 → 3,818C-km(2023→2038)"]}, {"h": "교체", "p": "수명을 다한 설비의 갱신. 확장 수요가 둔화돼도 꾸준히 남는 바닥 수요다.", "list": ["미국 100MVA 초과 대형 변압기 중 30년 이상 약 2만 대", "미국 33년 넘은 배전변압기 약 55%(약 4천만 대, DOE)", "EU 배전망 40년 이상 노후 비중 약 40%"]}, {"h": "고도화", "p": "기존 망의 용량·신뢰성·친환경성 향상. 재도체화·DLR 같은 GETs, 디지털 보호, SF6-Free 개폐장치 전환이 대표적이다.", "list": ["EU F-gas: SF6 신규 개폐장치 24kV 이하 2026 → 145kV 초과 2032 단계 금지", "글로벌 송배전기기 시장 중 교체·고도화 비중 58.4%(2025, Mordor Intelligence)"]}]}, {"t": "callout", "text": "세 갈래는 원인과 시점이 달라 동시에 끝나지 않는다. 데이터센터발 확장 수요가 꺾이더라도 교체·고도화가 바닥을 받쳐 준다는 것이 ‘과거 사이클과 다르다’는 주장의 근거이고, 반대로 확장 수요가 가격을 끌어올린 부분은 되돌려질 수 있다."}]}, {"h": "한국 전력망의 구조적 문제 — 발전은 남·동쪽, 수요는 수도권", "blocks": [{"t": "kpis", "items": [{"lab": "수도권 전력자급률", "val": "65.4%", "cap": "2023. 수도권은 전력수요의 44%를 쓰지만 발전설비는 23%", "tag": "확인"}, {"lab": "호남 전력자급률", "val": "129.4%", "cap": "2023. 호남→수도권 육상 345kV 선로는 2개뿐", "tag": "확인"}, {"lab": "육상 송전선 평균 지연", "val": "70개월", "cap": "북당진-신탕정 345kV 150개월, 동해안-신가평 HVDC 66개월", "tag": "확인"}, {"lab": "호남 신규 발전 접속 제한", "val": "~2032", "cap": "2024년 9월 호남 전 변전소 계통관리변전소 지정", "tag": "확인"}]}, {"t": "p", "text": "발전소는 원전이 있는 동해안과 재생에너지가 있는 호남에, 수요는 수도권과 반도체 클러스터에 몰려 있다. 육상 송전선은 주민 반대로 평균 70개월씩 지연됐고, 그 결과 호남은 신규 발전소를 지어도 계통에 연결할 수 없는 상태가 됐다. 전력망특별법(2025.9)의 인허가 일괄 처리, 해저로 우회하는 서해안 HVDC, 민간이 짓고 한전에 넘기는 BT 방식(2026.8 개정)이 모두 이 병목을 풀기 위한 수단이다. 반도체·AI 데이터센터 수요를 반영한 12차 전기본 재전망(2040 최대전력 158.4~165.0GW)은 이 불균형을 더 키운다."}]}, {"h": "자주 나오는 오독 5가지 — 전력망 편", "blocks": [{"t": "grid", "cols": 2, "numbered": true, "items": [{"h": "“변압기가 부족하다”", "p": "전압 등급마다 다르다. 765kV는 제작 가능 업체가 10곳 미만이라 48~60개월이지만 배전급은 12~20개월이고 일부는 납기 개선 언급도 나왔다. 수혜 강도와 지속 기간을 등급별로 나눠야 한다."}, {"h": "“765kV 수혜 = 변압기 업체”", "p": "765kV 변전소는 변압기·리액터·800kV GCB/GIS·보호제어를 패키지로 요구한다. 차단기까지 현지 공급할 수 있는 업체(효성·Quanta JV 차단기)가 유리하고, 리액터 대수도 따로 계산해야 한다."}, {"h": "“HVDC = 해저케이블”", "p": "서해안 1단계 사업비 2.8조원 중 컨버터(변환설비)가 1.0조원, 변전소 0.6조원, 송전 1.2조원이다. 케이블·포설선뿐 아니라 CTR·밸브를 누가 가져가는지가 사업비의 큰 몫을 가른다."}, {"h": "“송전 투자 = 지중케이블 수요”", "p": "북미 100kV 이상 송전망 중 지중선은 약 1%에 불과하다(Con Edison 60.8% vs Xcel 0.3%). 지중은 도심·연안에 한정돼 북미에서 전선 수주가 변압기보다 1~2년 늦게 늘었다."}, {"h": "“송전망 지연 = 수요 감소”", "p": "지연은 수요가 사라진 것이 아니라 물리적 병목의 신호다. 병목이 길수록 공급자의 가격 결정력과 잔고 방어력은 오히려 강해진다. 반대로 대기열 감소가 취소 때문인지 연결 완료 때문인지는 구분해야 한다."}]}]}]}, "equip": {"title": "기기 백과", "en": "Equipment Encyclopedia", "h2": "기기 백과 — 어느 계단의 무엇을, 몇 년 납기로 만드는가", "lede": "초고압 변압기와 배전반은 둘 다 ‘전력기기’로 불리지만 리드타임(3~5년 vs 6~10개월), 계약 방식(장기 슬롯 vs 반복 PO), 원가 구조(전기강판·숙련공 vs 부품 조립)가 완전히 다르다. 이 탭은 송변전·배전·전력전자·전선·발전설비·소재 32종을 역할·리드타임·원가·수요 동인·국내 기업으로 정리한 사전이다. 기업을 볼 때는 **‘무엇을 만드는가’보다 ‘어느 전압 계단의 무엇을, 몇 년 납기로, 어떤 계약으로 파는가’**를 먼저 묻는다.", "sections": [{"h": "변압기는 어떻게 만들어지나 — 공정이 곧 병목이다", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 920 300\" role=\"img\" aria-label=\"초고압 변압기 생산능력은 권선 인력과 건조·시험 공정이 결정한다\"><defs><marker id=\"a-pw5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"10\" y=\"30\" width=\"112\" height=\"54\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"66.0\" y=\"53.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">소재 입고<\/text><text x=\"66.0\" y=\"69.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">GOES·CTC·절연유<\/text><line x1=\"122\" y1=\"57\" x2=\"138\" y2=\"57\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw5)\"/><rect x=\"140\" y=\"30\" width=\"112\" height=\"54\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"196.0\" y=\"53.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">철심 적층<\/text><text x=\"196.0\" y=\"69.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">전기강판<\/text><line x1=\"252\" y1=\"57\" x2=\"268\" y2=\"57\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw5)\"/><rect x=\"270\" y=\"30\" width=\"112\" height=\"54\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--warn)\"/><text x=\"326.0\" y=\"53.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">권선<\/text><text x=\"326.0\" y=\"69.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">수작업<\/text><line x1=\"382\" y1=\"57\" x2=\"398\" y2=\"57\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw5)\"/><rect x=\"400\" y=\"30\" width=\"112\" height=\"54\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"456.0\" y=\"53.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">중신 조립<\/text><text x=\"456.0\" y=\"69.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">철심+권선<\/text><line x1=\"512\" y1=\"57\" x2=\"528\" y2=\"57\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw5)\"/><rect x=\"530\" y=\"30\" width=\"112\" height=\"54\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--alert)\"/><text x=\"586.0\" y=\"53.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">진공건조<\/text><text x=\"586.0\" y=\"69.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">절연지 수분 제거<\/text><line x1=\"642\" y1=\"57\" x2=\"658\" y2=\"57\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw5)\"/><rect x=\"660\" y=\"30\" width=\"112\" height=\"54\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--alert)\"/><text x=\"716.0\" y=\"53.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">고전압 시험<\/text><text x=\"716.0\" y=\"69.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">형식·출하 시험<\/text><line x1=\"772\" y1=\"57\" x2=\"788\" y2=\"57\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw5)\"/><rect x=\"790\" y=\"30\" width=\"112\" height=\"54\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"846.0\" y=\"53.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">운송·설치<\/text><text x=\"846.0\" y=\"69.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">100~400톤<\/text><path d=\"M 270 92 V 104 H 372 V 92\" fill=\"none\" stroke-width=\"1.3\" style=\"stroke:var(--warn)\"/><text x=\"321\" y=\"122\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">숙련 3년+ · 양성 4~5년<\/text><path d=\"M 530 92 V 104 H 762 V 92\" fill=\"none\" stroke-width=\"1.3\" style=\"stroke:var(--alert)\"/><text x=\"646\" y=\"122\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">시간 단축 불가 → 공장 CAPA를 결정<\/text><text x=\"460\" y=\"160\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.8\">공장 신설 최대 3년 · 권선기·코어 테이블 등 특수장비 조달 최대 2년(DOE·업계)<\/text><text x=\"10\" y=\"212\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\">원가<\/text><text x=\"10\" y=\"228\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\">구성<\/text><rect x=\"70\" y=\"198\" width=\"207.5\" height=\"36\" rx=\"0\" style=\"fill:var(--accent);fill-opacity:0.28\"/><text x=\"173.75\" y=\"221\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">GOES·CTC 약 25%<\/text><rect x=\"277.5\" y=\"198\" width=\"298.8\" height=\"36\" rx=\"0\" style=\"fill:var(--warn);fill-opacity:0.28\"/><text x=\"426.9\" y=\"221\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">인건비 약 36%<\/text><rect x=\"576.3\" y=\"198\" width=\"323.7\" height=\"36\" rx=\"0\" fill=\"var(--raised)\"/><text x=\"738.15\" y=\"221\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">기타 자재·경비 약 39%<\/text><rect x=\"70\" y=\"198\" width=\"830\" height=\"36\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"70\" y=\"262\" font-size=\"11\" text-anchor=\"start\" fill-opacity=\"0.8\">GOES는 EV 모터용 무방향성 강판(NOES)과 열연 라인을 공유해 철강사의 증산 유인이 약하고, 비중국 공급처는 약 6곳이다.<\/text><text x=\"70\" y=\"282\" font-size=\"10.5\" text-anchor=\"start\" fill-opacity=\"0.65\">기타 39%는 전체에서 두 항목을 뺀 잔여치(리포트 비중 기준 역산).<\/text><\/svg>", "cap": "**결론: 변압기 공장의 실제 생산능력은 가장 느린 공정이 정한다.** 사람 손이 필요한 권선과, 절연지 열화 때문에 시간을 줄일 수 없는 진공건조·고전압 시험이 병목이다. 원가의 약 25%가 소재(GOES·CTC), 약 36%가 인건비라 소재 조달과 숙련 인력이 동시에 풀려야 한다. 증설 공시를 볼 때는 ‘공장 면적’이 아니라 건조로·시험설비·권선 인력이 함께 늘었는지를 확인해야 리드타임 단축 여부를 판단할 수 있다."}, {"t": "p", "text": "초고압 변압기는 고객 사양(정격전압·임피던스·안전 규격)에 맞춘 주문생산품이라 완전 자동화가 불가능하다. 철심을 쌓고 권선을 감아 조립한 ‘중신’을 진공 건조로에서 말린 뒤 고전압 시험을 통과해야 출하되는데, 건조는 절연지 열화 때문에 시간을 줄일 수 없고 시험설비는 한 번에 한 대씩만 쓸 수 있다. 미국 초고압 변압기 자급률은 약 20%(배전 약 50%, Wood Mackenzie)이고, 미국 제조업체의 89%가 숙련공 확보에 어려움을 겪었다(DOE 2020)."}]}, {"h": "리드타임 사다리 — 전압이 높을수록 줄이 길다", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 880 280\" role=\"img\" aria-label=\"데이터센터는 18~24개월이면 지어지지만 345kV 이상 변압기는 3~5년이 걸린다\"><text x=\"20\" y=\"24\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\">전압 등급별 변압기 리드타임(주문→인도, 2026 업계)<\/text><rect x=\"362\" y=\"40\" width=\"54\" height=\"200\" rx=\"0\" style=\"fill:var(--accent);fill-opacity:0.13\"/><text x=\"389\" y=\"256\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">AI DC 건설 18~24개월<\/text><text x=\"190\" y=\"68\" font-size=\"12\" text-anchor=\"end\" font-weight=\"600\">765kV 이상<\/text><rect x=\"632\" y=\"50\" width=\"108\" height=\"26\" rx=\"4\" style=\"fill:var(--alert);fill-opacity:0.45\"/><text x=\"686.0\" y=\"68\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">48~60개월<\/text><text x=\"748\" y=\"68\" font-size=\"10.5\" text-anchor=\"start\" fill-opacity=\"0.75\">제작 가능 10곳 미만<\/text><text x=\"190\" y=\"114\" font-size=\"12\" text-anchor=\"end\" font-weight=\"600\">345~500kV<\/text><rect x=\"524\" y=\"96\" width=\"108\" height=\"26\" rx=\"4\" style=\"fill:var(--warn);fill-opacity:0.45\"/><text x=\"578.0\" y=\"114\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">36~48개월<\/text><text x=\"640\" y=\"114\" font-size=\"10.5\" text-anchor=\"start\" fill-opacity=\"0.75\">2027년까지 슬롯 마감 다수<\/text><text x=\"190\" y=\"160\" font-size=\"12\" text-anchor=\"end\" font-weight=\"600\">115~230kV<\/text><rect x=\"416\" y=\"142\" width=\"108\" height=\"26\" rx=\"4\" fill=\"var(--raised)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"470.0\" y=\"160\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">24~36개월<\/text><text x=\"532\" y=\"160\" font-size=\"10.5\" text-anchor=\"start\" fill-opacity=\"0.75\">상위 등급 병목의 낙수<\/text><text x=\"190\" y=\"206\" font-size=\"12\" text-anchor=\"end\" font-weight=\"600\">69kV 미만(배전)<\/text><rect x=\"308\" y=\"188\" width=\"72\" height=\"26\" rx=\"4\" fill=\"var(--raised)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"344.0\" y=\"206\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">12~20개월<\/text><text x=\"388\" y=\"206\" font-size=\"10.5\" text-anchor=\"start\" fill-opacity=\"0.75\">조달 용이<\/text><line x1=\"200\" y1=\"238\" x2=\"200\" y2=\"244\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.5\"/><text x=\"200\" y=\"272\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.7\">0<\/text><line x1=\"308\" y1=\"238\" x2=\"308\" y2=\"244\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.5\"/><text x=\"308\" y=\"272\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.7\">12<\/text><line x1=\"416\" y1=\"238\" x2=\"416\" y2=\"244\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.5\"/><line x1=\"524\" y1=\"238\" x2=\"524\" y2=\"244\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.5\"/><text x=\"524\" y=\"272\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.7\">36<\/text><line x1=\"632\" y1=\"238\" x2=\"632\" y2=\"244\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.5\"/><text x=\"632\" y=\"272\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.7\">48<\/text><line x1=\"740\" y1=\"238\" x2=\"740\" y2=\"244\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.5\"/><text x=\"740\" y=\"272\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.7\">60<\/text><line x1=\"200\" y1=\"240\" x2=\"740\" y2=\"240\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.5\"/><text x=\"746\" y=\"272\" font-size=\"10.5\" text-anchor=\"start\" fill-opacity=\"0.7\">개월<\/text><\/svg>", "cap": "**결론: 병목과 가격 결정력은 사다리 꼭대기에 몰린다.** 데이터센터는 18~24개월이면 완공되지만 그 전력을 받을 345kV 이상 변압기는 3~5년이 걸린다. 765kV에 생산 슬롯이 우선 배정되면 300~500kV 공급까지 빠듯해지는 간접 효과도 있어, ‘변압기 부족’을 한 단어로 묶지 말고 전압 등급별로 읽어야 한다. 배전급은 이미 납기 개선 언급이 나온 반면 초고압은 증설 완공(2027~2028) 이후에도 유지되는지가 관건이다."}, {"t": "table", "cols": ["전압 등급", "리드타임", "주요 제작 가능 업체", "병목 상황"], "rows": [["765kV 이상(UHV)", "48~60개월", "Hitachi Energy, Siemens Energy, GE Vernova, HD현대일렉트릭, 효성중공업", "제작 가능 10곳 미만(북미 공급 기준 5곳 내외), 가장 극심"], ["345~500kV(EHV)", "36~48개월", "상위 업체 + LS ELECTRIC, Mitsubishi, TBEA", "데이터센터·송전 핵심, 2027년까지 슬롯 마감 다수"], ["115~230kV(HV)", "24~36개월", "상위 업체 + Virginia Transformer, WEG, 일진전기", "상위 등급 병목의 낙수로 지연"], ["69kV 미만(MV·배전)", "12~20개월", "Eaton, Schneider 등 다수", "조달 용이하나 구리·강판 부족 영향"]], "title": "전압 등급별 리드타임과 공급자", "note": "업계·DOE·Wood Mackenzie·Hitachi Energy 코멘트(리포트 정리, 2026)."}]}, {"h": "기기 사전 — 32종", "blocks": [{"t": "dict", "placeholder": "기기·업체 검색 (예: 765kV, SST, 포설선, 산일전기)", "items": [{"name": "초고압 전력변압기", "en": "EHV Power Transformer (HS 8504.23, 10,000kVA 초과)", "group": "송변전 기기", "tags": ["초고압·송전"], "fields": [{"k": "역할", "v": "발전소에서 만든 전기를 송전 전압(154~765kV)으로 올리고, 변전소에서 다시 내리는 대형 변압기다. 고객 사양(정격전압·임피던스)마다 설계가 달라 완전 자동화가 불가능하고 권선 공정에 3~5년 경력 숙련공이 필요하다. 미국 초고압 변압기 자급률은 약 20%로 80%를 수입한다(Wood Mackenzie)."}, {"k": "밸류체인 위치", "v": "GOES·CTC 구리선·절연유 → 철심·권선 → 중신 조립 → 진공건조 → 고전압 시험 → 발전소 GSU·변전소"}, {"k": "리드타임·계약", "v": "주문→인도 3~5년(765kV 48~60개월, 345~500kV 36~48개월). 순수 제작 기간은 약 18~24개월이고 나머지는 슬롯 대기"}, {"k": "원가 구조", "v": "GOES·CTC 약 25%, 인건비 약 36%(DOE). 숙련 권선공 3년 이상 경력 필요"}, {"k": "수요 동인", "v": "미국 유틸리티 송전 CAPEX, 노후 교체(100MVA 초과 30년 이상 약 2만 대), 발전소 계통연계, 관세·현지 생산, 리드타임(3~5년)"}, {"k": "딜 체크포인트", "v": "잔고 중 북미·765kV 비중과 인도 연도, 신규 수주 단가가 기존 잔고 대비 높은지, 증설이 건조·시험 공정까지 늘렸는지, 에스컬레이션·관세 전가 조항"}, {"k": "국내 기업", "v": "HD현대일렉트릭, 효성중공업, LS ELECTRIC, 일진전기, 산일전기(154kV 2028년 진출)"}]}, {"name": "765kV 특초고압 변압기·리액터", "en": "765kV Transformer & Shunt Reactor", "group": "송변전 기기", "tags": ["초고압·송전"], "fields": [{"k": "역할", "v": "북미 교류 송전의 최고 전압인 765kV 변전소에 들어가는 단상 변압기(3대가 1 Bank)와 장거리 선로 무효전력을 흡수하는 리액터다. 대당 약 70~140억원, 중량 100~400톤이며 북미에 공급 가능한 업체는 5곳 내외다. 전용 라인이 아니라 기존 대형 공장의 생산 슬롯을 배정해 만들기 때문에 765kV 수요가 늘면 300~500kV 공급까지 빠듯해진다."}, {"k": "밸류체인 위치", "v": "765kV 송전선 → 종단 변전소(765/345kV 변압기+리액터+800kV GCB/GIS 패키지) → 345kV 지역망"}, {"k": "리드타임·계약", "v": "48~60개월. 대당 약 70~140억원, 중량 100~400톤"}, {"k": "원가 구조", "v": "전용 라인이 아니라 대형 공장 생산 슬롯을 배정 — 765kV가 늘면 300~500kV 공급이 줄어든다"}, {"k": "수요 동인", "v": "ERCOT STEP·MISO Tranche 2.1·SPP ITP·PJM 765kV 승인(승인 약 4,561마일), 데이터센터 대형 부하"}, {"k": "딜 체크포인트", "v": "765kV 누적 공급 레퍼런스와 형식시험 설비, 미국 현지 생산 가능 리 연동(에스컬레이션)"}, {"k": "수요 동인", "v": "광산 공급 차질, 데이터센터·전력망 수요, 미국 232조 관세"}, {"k": "딜 체크포인트", "v": "고정가 계약 비중, 매출 증가 중 구리 효과와 물량 효과 분리"}, {"k": "국내 기업", "v": "LS(LS MnM), 대한전선·LS전선(수요처)"}]}, {"name": "중저압 차단기(ACB·MCCB·VCB)", "en": "Low/Medium-voltage Circuit Breaker", "group": "배전·데이터센터", "tags": ["배전·중저압"], "fields": [{"k": "역할", "v": "배전반·분전반 안에서 고장 전류를 끊어 설비와 사람을 보호하는 기기다. 고객 사양마다 설계하는 변압기와 달리 양산형 제품이라, 증설하면 곧바로 출하와 매출로 이어진다. 데이터센터 배전반 수요와 이중화(N+1·2N)가 늘면 배전반 1면당 들어가는 차단기 수도 함께 늘어난다."}, {"k": "밸류체인 위치", "v": "접점·차단부 → 차단기 → 배전반·분전반 → 데이터센터·공장"}, {"k": "리드타임·계약", "v": "양산형 — 증설 후 매출 리드타임이 거의 없음"}, {"k": "수요 동인", "v": "데이터센터·공장 배전반 수요, 이중화 설계, 리쇼어링"}, {"k": "딜 체크포인트", "v": "증설 CAPA(대수·매출 환산)와 가동률, 배전반 사업 내재화 비율, 양산 품질 인증"}, {"k": "국내 기업", "v": "HD현대일렉트릭(청주 중저압 차단기 연 1,300만대로 2배, 매출 CAPA 1,000억 → 2,500억(2026) → 5,000억원(2030)), LS ELECTRIC"}]}, {"name": "슈퍼커패시터(울트라커패시터)", "en": "Supercapacitor", "group": "저장·전력전자", "tags": ["DC·전력전자"], "fields": [{"k": "역할", "v": "전극 표면에 전하를 저장해 매우 짧은 시간에 큰 전력을 넣고 빼는 저장 소자다. 배터리보다 저장 에너지는 작지만 응답이 빠르고 수명이 길어, 연료전지 온사이트 전원과 AI 랙의 ms 단위 순간 부하 변동을 메우는 데 쓰인다. 온사이트 하이브리드 전원 구성에서 가스터빈·SOFC·BESS와 함께 전력품질 설비로 조합된다."}, {"k": "밸류체인 위치", "v": "전극 소재·셀 → 모듈 → SOFC·ESS·랙 전원"}, {"k": "수요 동인", "v": "온사이트 하이브리드 전원, AI 부하 급변(Power Swing), 800VDC 에너지 버퍼"}, {"k": "딜 체크포인트", "v": "단일 고객(Bloom Energy) 의존도, 후속 발주 여부, 셀 CAPA"}, {"k": "국내 기업", "v": "비나텍(Bloom Energy 슈퍼커패시터 180억원 계약, 2025-05)"}]}]}], "note": "그룹 칩으로 거르거나 기업명·약어로 검색한다. 리드타임·원가 항목은 리포트에 근거가 있는 기기만 채웠다."}, {"h": "기기군별 계약 구조 — 이익의 성격이 다르다", "blocks": [{"t": "table", "cols": ["기기군", "리드타임", "계약 방식", "가격 재협상", "이익의 성격", "대표 국내 기업"], "rows": [["초고압 변압기", "3~5년", "장기 슬롯·선급금·에스컬레이션", "인도 시점 단가 — 2~3년 전 수주가 오늘 마진", "고단가·장기 가시성", "HD현대일렉트릭, 효성중공업, LS ELECTRIC, 일진전기"], ["특수변압기", "1년 계약", "연간 계약, FOB 납품 다수", "매년 — 호황기 빠른 인상", "고마진(산일전기 OPM 약 38%)·변동성", "산일전기"], ["배전반·차단기", "6~10개월", "반복 PO, 프레임 계약", "수시", "단납기 볼륨, 수주가 곧 실적", "LS ELECTRIC, HD현대일렉트릭, 제룡전기"], ["해저·HVDC 케이블", "4~5년(프로젝트)", "자재+포설 턴키, 구리 연동", "프로젝트 단위", "잔고/매출 5년+(유럽 3사), 연도별 변동 큼", "대한전선, LS전선(비상장), LS에코에너지"], ["가스터빈", "최대 6년", "슬롯 예약(SRA) + LTSA", "신규 슬롯마다", "장비 + 20~30년 서비스(프린터-잉크)", "두산에너빌리티"], ["800VDC·SST", "PoC→RFP", "디자인윈·파일럿", "표준 미확정", "옵션 가치 — 매출 인식 전", "LS ELECTRIC, 효성중공업"]], "note": "리포트 정리. 같은 ‘수주 증가’라도 기기군에 따라 매출 인식 시점과 마진 변동성이 다르다."}, {"t": "callout", "text": "IPO 피어를 고를 때 가장 흔한 실수는 기기군이 다른 회사를 한 묶음으로 비교하는 것이다. 1년 계약 특수변압기 업체는 잔고가 작아도 재가격이 빠르고, 장기 슬롯 대형 변압기 업체는 잔고가 커도 오늘의 마진이 2~3년 전 단가에 묶여 있다.", "title": "딜 관점", "tone": "warn"}]}]}, "order": {"title": "수주·실적 읽기", "en": "Reading Orders & Earnings", "h2": "수주·실적 읽기 — 잔고가 실적이 되는 속도를 재라", "lede": "전력기기의 이번 분기 실적은 이번 분기에 결정되지 않는다. **2~3년 전에 받은 수주의 단가와 오늘의 생산능력**이 결정한다. 그래서 이 섹터의 실적 읽기는 ‘신규 수주 → 잔고 → CAPA → 출하 → 믹스 → 이익’으로 이어지는 전환 속도를 재는 일이다. 이 탭은 분기 실적과 수주 공시를 읽는 순서, 업종별 이익 공식, 지표 사전, 그리고 자주 틀리는 해석 7가지를 정리한다.", "sections": [{"h": "수주는 탱크에 쌓이고 밸브만큼만 빠져나간다", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 920 330\" role=\"img\" aria-label=\"수주는 잔고에 쌓였다가 생산능력만큼만 매출로 빠져나가며, 제품마다 빠져나가는 속도가 다르다\"><defs><marker id=\"a-pw7\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"20\" y=\"70\" width=\"190\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--accent)\"/><text x=\"115.0\" y=\"90.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">신규 수주<\/text><text x=\"115.0\" y=\"106.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">단가 P × 물량 Q<\/text><text x=\"115.0\" y=\"122.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">1Q26 5사 8.5조원<\/text><line x1=\"210\" y1=\"102\" x2=\"298\" y2=\"102\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw7)\"/><text x=\"254.0\" y=\"96\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.85\">계약<\/text><rect x=\"300\" y=\"40\" width=\"210\" height=\"220\" rx=\"4\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><rect x=\"301\" y=\"110\" width=\"208\" height=\"149\" rx=\"0\" style=\"fill:var(--accent);fill-opacity:0.18\"/><text x=\"405\" y=\"72\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">수주잔고<\/text><text x=\"405\" y=\"92\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.75\">지역·전압·ASP·인도 연도<\/text><text x=\"405\" y=\"176\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"700\" style=\"fill:var(--accent)\">34.5조원<\/text><text x=\"405\" y=\"196\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.8\">변압기 5사, 1Q26(+37%)<\/text><line x1=\"510\" y1=\"205\" x2=\"558\" y2=\"205\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw7)\"/><rect x=\"560\" y=\"175\" width=\"140\" height=\"60\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--warn)\"/><text x=\"630.0\" y=\"193.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">CAPA 밸브<\/text><text x=\"630.0\" y=\"209.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">가동률 95~108%<\/text><text x=\"630.0\" y=\"225.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">(1H26)<\/text><rect x=\"750\" y=\"50\" width=\"160\" height=\"54\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"830.0\" y=\"73.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">배전반·차단기<\/text><text x=\"830.0\" y=\"89.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">수주→매출 6~10개월<\/text><line x1=\"700\" y1=\"205\" x2=\"748\" y2=\"77\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw7)\"/><rect x=\"750\" y=\"140\" width=\"160\" height=\"54\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"830.0\" y=\"163.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">특수변압기<\/text><text x=\"830.0\" y=\"179.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">1년 계약·매년 재가격<\/text><line x1=\"700\" y1=\"205\" x2=\"748\" y2=\"167\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw7)\"/><rect x=\"750\" y=\"230\" width=\"160\" height=\"54\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"830.0\" y=\"253.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">초고압 변압기<\/text><text x=\"830.0\" y=\"269.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">인도까지 3~5년<\/text><line x1=\"700\" y1=\"205\" x2=\"748\" y2=\"257\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw7)\"/><text x=\"830\" y=\"30\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" fill-opacity=\"0.85\">매출 인식<\/text><text x=\"460\" y=\"292\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\" fill-opacity=\"0.9\">잔고/매출 ≈ 3.7배(초고압 업체, 2025) — 오늘의 매출은 2~3년 전 수주 단가, 오늘의 수주는 2028~2030 실적<\/text><text x=\"460\" y=\"314\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">가동률이 100% 전후면 초과 수요는 매출이 아니라 판가 인상·납기 연장으로 흡수된다<\/text><\/svg>", "cap": "**결론: 수주산업의 실적은 ‘잔고에 무엇이 쌓였나’와 ‘밸브가 얼마나 열리나’로 결정된다.** 잔고의 단가·지역·인도 연도가 미래 마진을, 가동률과 증설 완공 시점이 매출 성장 속도를 정한다. 같은 ‘수주 증가’라도 배전반(6~10개월)은 곧바로 매출이 되고 초고압(3~5년)은 2029~2030년 실적이 되므로, 수주 발표를 매출 추정에 옮길 때는 제품별 인식 속도를 분리해야 한다."}, {"t": "p", "text": "공급자 우위 국면에서는 판가(P)가 먼저 오르고, 이후에는 증설 완공 시점에 따른 물량(Q) 성장이 기업 간 실적 기울기를 가른다. 국내 전력기기 3사 평균 영업이익률은 2022년 5.3%에서 2025년 15.2%로 올랐는데(각사 공시), 이는 2022~2023년에 받은 고단가 수주가 2024~2025년에 매출로 인식된 결과다. 지금 받는 수주는 2028~2030년 실적이 되므로, **수주 단가가 기존 잔고 대비 유지·상승하는지**가 향후 마진의 가장 직접적인 선행지표다."}]}, {"h": "분기 실적 읽는 순서 6단계", "blocks": [{"t": "steps", "items": [{"h": "신규 수주와 가이던스 달성률", "meta": ["분기 기준 25%", "1Q26 효성 49.8% · HD현대 43%"], "p": "분기 누적 신규 수주를 회사 연간 가이던스로 나눈다. 1분기에 25%를 크게 넘으면 연중 상향 가능성이 높다. 2026년에는 1Q 달성률이 높았던 빅3가 모두 2Q에 가이던스를 20~50% 올렸다(HD현대 42→52억달러, 효성 8.4→12.0조원, LS 4→6~6.5조원).", "chk": "상향분을 가격(P)과 물량(Q)으로 나눈다. 슬롯이 이미 차 있으면 상향은 대부분 P다."}, {"h": "수주의 구성 — 지역·전압·고객", "meta": ["북미 비중 HD현대 73% · 효성 77%(1Q26)"], "p": "같은 1조원이라도 북미 765kV와 국내 배전은 마진과 인도 시점이 다르다. 데이터센터향은 빅테크 직발주인지, 유틸리티·마이크로그리드·EPC를 거친 2차 발주인지에 따라 반복성과 협상력이 달라진다.", "chk": "지역별·제품별·고객 유형별 비중과 고객 집중도(상위 고객 비중)를 확인한다."}, {"h": "잔고의 질 — 확정 vs 예약, 인도 연도", "meta": ["GEV 가스터빈 100GW 중 확정 44GW"], "p": "확정 계약(PO)과 슬롯 예약·프레임 계약이 섞이면 잔고의 질이 달라진다. 인도 연도가 2031~2032년까지 퍼져 있으면 가시성은 길지만 그만큼 오늘의 판가 인상이 늦게 반영된다. 효성중공업처럼 공시 잔고(23.83조원)와 경영관리 기준(약 17.5조원)이 병존하는 경우도 있다.", "chk": "잔고 분해표(확정/예약, 인도 연도, 에스컬레이션 조항 유무)를 요청한다."}, {"h": "생산능력과 가동률", "meta": ["1H26 가동률 95~108%"], "p": "가동률이 100% 전후면 CAPA가 성장 상단이다. 증설 효과는 유형자산 증가 후 약 2년 뒤(업계 전체 2027년 하반기) 반영된다는 추정이 있고, 램프업 초기에는 고정비·인건비가 먼저 늘어 마진이 일시적으로 낮아질 수 있다(Eaton 1Q26 증설비용으로 마진 가이던스 하향).", "chk": "증설이 건조·시험 공정과 숙련 인력까지 늘렸는지, 증분 매출 CAPA와 가동 시점을 확인한다."}, {"h": "마진 분해 — 판가·믹스·원자재·환율", "meta": ["HD현대 가이던스 환율 1,350원"], "p": "영업이익률 변화를 과거 고단가 수주 효과, 지역·제품 믹스(북미·765kV), 원자재·관세 비용의 시차, 환율로 나눈다. 원재료 하락이 아니라 믹스·판가에서 나온 마진이어야 지속성이 있다.", "chk": "가이던스 기준환율과 실제 환율 차이를 분리하면 실질 성장률은 얼마인가?"}, {"h": "현금 — 선수금·재고·운전자본", "meta": ["운송 중 재고", "선급금"], "p": "공급자 우위 관행(선급금, 인도 가능 물량만 수주)은 운전자본을 가볍게 만든다. 반대로 운송 중 재고가 쌓이면 이익 인식이 이연되고(효성 1Q26 약 400억원), 관세 비용은 먼저 나간다.", "chk": "선수금·재고·영업현금흐름의 회수 속도와 선급금 조건을 확인한다."}]}]}, {"h": "업종별 이익 공식 — 같은 인프라, 다른 돈벌이", "blocks": [{"t": "mods", "open": 1, "items": [{"name": "전력기기 이익 = P × Q × 믹스 (수주-매출 시차 모델)", "formula": "매출(t) ≈ Σ 과거 수주(t−리드타임) × 인도 시점 단가 / 영업이익률 = f(북미·초고압 비중, 판가 인상, 가동률, 증설 고정비)", "paras": ["전력기기는 수주 후 제작·인도까지 초고압 3~5년, 데이터센터 배전 6개월~2년이 걸린다. 따라서 오늘의 매출과 마진은 2~3년 전 수주 단가를 반영하고, 오늘의 수주는 2028~2030년 실적을 결정한다. 공급자 우위 국면에서는 판가(P)가 먼저 오르고(이미 주가에 반영), 이후에는 증설 완공 시점에 따른 물량(Q) 성장이 기업 간 실적 기울기를 가른다. 가동률이 이미 95~108%라 CAPA가 성장 상단을 정한다."], "fields": [{"k": "민감도", "v": "공장 가동률 100% 전후 구간에서는 신규 수주가 늘어도 매출은 CAPA만큼만 증가하고, 초과 수요는 판가·납기 연장으로 흡수된다. 증설 효과는 유형자산 증가 후 약 2년 뒤(업계 전체 2027년 하반기) 반영된다는 추정이 있다."}, {"k": "리포트 사례", "v": "국내 전력기기 3사 평균 OPM 2022년 5.3% → 2025년 15.2%(각사 공시). HD현대일렉트릭 4Q25 OPM 27.6%, 산일전기 4Q25 38.7%. 1Q26 변압기 5사 신규수주 8.5조원(YoY +54%), 잔고 34.5조원(+37%)."}], "pill": "전력기기"}, {"name": "관세·원자재 비용 전가 구조", "formula": "실질 관세부담 = 상호관세율 × 매출가 + Section 232 세율 × 금속 성분가치 − 고객 전가분(CO·PO 환입, 에스컬레이션)", "paras": ["2025년 미국 상호관세 15%는 제품 전체에, Section 232 철강·알루미늄 50%는 금속 성분가치(8~12%)에만 붙어 초고압 변압기의 매출가 대비 실질 부담은 15~21%로 추정됐다. 그러나 공급자 우위라 초고압은 대부분, 배전반은 신규수주 100%가 고객에게 전가됐고 기존 계약은 변경계약(CO)으로 시차를 두고 환입됐다. 2026년 4월 IEEPA 관세 위헌 판결로 환급 절차가 시작됐고, 232조는 금속함량 기준에서 전체 통관가액 기준으로 바뀌며 대형변압기 실효세율이 28.7%→15.0%로 낮아졌다."], "fields": [{"k": "민감도", "v": "중저압 전력기기는 원가 중 원재료 약 10%, 부품 약 25%라 구리·은 급등의 직접 영향이 작다. 원자재 급등 시 국내 3월·해외 4월처럼 판가 인상으로 1~2분기 시차를 두고 상쇄된다."}, {"k": "리포트 사례", "v": "효성중공업 1Q26 관세 비용 인식 170억원, 운송 중 재고로 영업이익 약 400억원 이연. 배전변압기 232 실효세율 34.9%→25.0%(2026-04, EIA)."}], "pill": "관세·원자재"}, {"name": "전선·해저케이블 = 구리 패스스루 + 가공·시공 부가가치", "formula": "매출 ≈ 물량 × (구리 가격 연동 판가 + 가공마진) / 해상풍력 1GW 케이블 시장 ≈ 건설비 7조원 × 해저송전망 18~20% × 송전 45% × (케이블 55% / 시공 45%)", "paras": ["전선은 원가에 마진을 붙여 파는 구조라 매출이 구리 가격에 연동되고, 초고압 케이블 원가의 약 50~60%가 구리다. 실제 수요는 매출이 아니라 수주잔고와 EBITDA 마진 추세로 판단해야 한다. 전압이 높을수록, 지중→해저로 갈수록 접속재·설계·시공·포설선까지 부가가치가 붙어 경쟁 단위가 ‘생산 톤수’에서 ‘턴키 수행 능력’으로 바뀐다."], "fields": [{"k": "민감도", "v": "구리 급등기에는 판매가-원가 시차로 단기 수익성이 흔들리고 고정가 계약 비중이 높으면 마진이 압박된다. 미국 구리 관세가 초고압 케이블까지 확대되면 판가 기준 관세율이 15.1%→34.0%로 오르는 시나리오가 제시됐다(현재는 제외)."}, {"k": "리포트 사례", "v": "국내 해상풍력 1GW당 케이블 자재+포설 약 8,000억원(자재 60:포설 40), 대만·베트남 약 6,000억원/GW. 안마해상풍력(532MW) 케이블 계약 총액 4,527억원. 2035년 25GW 목표 기준 해저송전 시장 15조원(케이블 8.3조·시공 6.7조, 리포트 추정)."}], "pill": "전선"}, {"name": "가스터빈 = 장비(슬롯) + LTSA ‘프린터-잉크’", "formula": "사업가치 ≈ 신규 장비 판매(슬롯 × 단가) + 설치 기반 × 20~30년 서비스(고온부품 7~8년 주기 교체)", "paras": ["가스터빈은 장비 판매 자체보다 설치 후 수십 년 이어지는 장기서비스계약(LTSA)이 수익의 핵심이다. 공급 부족기에는 ‘장비 확보 → 프로젝트 진행’ 순서로 바뀌어 발전사업자가 예약금(약 2,500만달러)을 내고 2030년 슬롯을 선점한다. 수주잔고에 확정 계약과 슬롯 예약(SRA)이 섞여 있어 잔고의 질을 따로 봐야 한다."], "fields": [{"k": "민감도", "v": "대형 가스터빈 가격은 2019년 대비 약 200% 올라 2027년 말 약 600달러/kW 전망(Wood Mackenzie). 복합화력 건설비는 Mill Creek 5→6 기준 1,427→2,194달러/kW(+54%)."}, {"k": "리포트 사례", "v": "GE Vernova 가스터빈 잔고 100GW(확정 44 + 슬롯예약 56, 1Q26), 2030년까지 잔여 슬롯 약 10GW. 글로벌 4사 생산능력 약 50GW → 2028년 약 80GW."}], "pill": "발전설비"}]}]}, {"h": "관세는 마진이 아니라 시차였다", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 900 300\" role=\"img\" aria-label=\"공급자 우위 시장에서 관세는 마진이 아니라 시차의 문제였다\"><defs><marker id=\"a-pw8\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-pw8-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--ok)\"/><\/marker><\/defs><text x=\"20\" y=\"26\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"600\" fill-opacity=\"0.9\">232조 실효세율(2026-04 개편): 대형변압기 28.7%→15.0% · 배전변압기 34.9%→25.0%<\/text><rect x=\"20\" y=\"110\" width=\"200\" height=\"70\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"120.0\" y=\"133.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">미국 관세<\/text><text x=\"120.0\" y=\"149.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">상호관세 15%(제품 전체)<\/text><text x=\"120.0\" y=\"165.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">+ 232조(철강·구리 파생)<\/text><rect x=\"330\" y=\"110\" width=\"210\" height=\"70\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--warn)\"/><text x=\"435.0\" y=\"133.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">국내 제조사<\/text><text x=\"435.0\" y=\"149.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">관세 비용 선인식<\/text><text x=\"435.0\" y=\"165.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">운송 중 재고 손익 이연<\/text><rect x=\"660\" y=\"50\" width=\"220\" height=\"60\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--ok)\"/><text x=\"770.0\" y=\"76.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--ok)\">신규 수주<\/text><text x=\"770.0\" y=\"92.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">판가에 대부분 전가<\/text><rect x=\"660\" y=\"190\" width=\"220\" height=\"60\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"770.0\" y=\"216.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">기존 잔고<\/text><text x=\"770.0\" y=\"232.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">변경계약(CO·PO)으로 환입<\/text><line x1=\"220\" y1=\"145\" x2=\"328\" y2=\"145\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw8)\"/><text x=\"274.0\" y=\"138\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.85\">통관 시 납부<\/text><line x1=\"540\" y1=\"130\" x2=\"658\" y2=\"82\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw8)\"/><text x=\"590\" y=\"96\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.85\">즉시 전가<\/text><line x1=\"540\" y1=\"162\" x2=\"658\" y2=\"218\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw8)\"/><text x=\"606\" y=\"224\" font-size=\"11\" text-anchor=\"end\" fill-opacity=\"0.85\">1~2분기 시차<\/text><path d=\"M 120 182 V 272 H 435 V 184\" fill=\"none\" stroke-width=\"1.3\" style=\"stroke:var(--ok)\" marker-end=\"url(#a-pw8-ok)\"/><text x=\"278\" y=\"265\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--ok)\">IEEPA 위헌 판결 → 환급 절차(2026-04-20~)<\/text><text x=\"770\" y=\"285\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.75\">예: 효성 1Q26 관세 비용 170억원<\/text><\/svg>", "cap": "**결론: 관세는 이번 사이클에서 마진을 훼손하지 못했고, 분기 실적에 ‘시차’로만 나타났다.** 신규 수주는 판가에 바로 붙고, 기존 잔고는 변경계약으로 1~2분기 늦게 환입되며, 2026년 4월 IEEPA 위헌 판결 이후에는 환급까지 생겼다. 따라서 분기 영업이익이 관세 비용으로 컨센서스를 밑돌면 ‘전가 실패’가 아니라 ‘인식 시점 차이’인지부터 확인한다(효성 1Q26: 관세 170억원·운송 중 재고로 약 400억원 이연)."}, {"t": "table", "cols": ["항목", "2025 체계", "2026-04 이후"], "rows": [["상호관세", "15%(제품 전체, IEEPA 근거)", "연방대법원 위헌 판결 → 4월 20일부터 환급 절차, 이후 122·301·232조로 관세 유지"], ["232조 과세 기준", "금속 성분가치(8~12%)에만 50%", "전체 통관가액 기준으로 전환"], ["대형변압기 실효세율", "28.7%", "15.0%(2027년 12월까지)"], ["배전변압기 실효세율", "34.9%", "25.0%"], ["초고압 케이블", "구리 관세 제외", "확대 시 판가 기준 15.1% → 34.0% 시나리오(리포트)"]], "note": "리포트 정리(EIA·미국 행정명령). 초고압 변압기의 매출가 대비 실질 부담은 2025년 15~21%로 추정됐다."}]}, {"h": "지표 사전 — 무엇을 보고 어떻게 읽나", "blocks": [{"t": "table", "cols": ["지표", "정의", "최근 수준", "읽는 법", "어디서 보나"], "rows": [["미국 유틸리티 중장기 CAPEX 합계", "주요 IOU 18개사가 분기 실적에서 제시하는 향후 5년 설비투자 계획 합계", "8,427억달러(1Q26, QoQ +2.2%) / 4Q25 8,217억달러(+22% YoY)", "매 분기 상향이 이어지는 한 송배전 기자재 사이클 축소를 논하기 이르다. 증가율 둔화·하향 전환은 수요 피크 신호", "각 사 IR(AEP·Duke·Dominion·Xcel 등), EEI·S&P Global 집계"], ["데이터센터 계통연계 부하(구속력/신청)", "유틸리티가 공시하는 데이터센터 부하 중 ESA 등 구속력 계약(진행 단계)과 신청 단계 합계", "구속력 71(4Q24)→101(2Q25)→168(4Q25)→181GW(1Q26) / 신청 641GW(1Q26)", "구속력 부하의 증가율과 신청 대비 전환율(약 25~30%) 상승이 CAPEX 추가 상향의 선행 신호. 집계 기업 수가 리포트마다 달라 같은 기준끼리만 비교", "미국 유틸리티 16~18개사 IR(리포트 집계)"], ["유틸리티 계약부하(Contracted load)", "개별 유틸리티가 대형 고객과 공급을 약정한 미래 부하(GW)", "AEP 28GW(3Q25)→56(4Q25)→63~69GW(1H26), Dominion 약 51GW, Duke 7.6GW(1Q26)", "CAPEX는 예산, 계약부하는 장비 발주의 선행지표. 증가 속도가 둔화되면 1~2년 뒤 발주 둔화", "AEP·Duke·Dominion·FPL 분기 실적"], ["하이퍼스케일러 CAPEX", "Alphabet·Meta·Amazon·Microsoft(+Oracle) 연간 설비투자", "2026E 4사 약 6,790억달러(+81% YoY, 2026-06), 2027E 8,000억달러 이상 추정", "상향 지속 시 전력 인프라 원천 수요 유지. 다만 문제는 수요가 아니라 착공 속도라는 점을 착공 전환율과 함께 확인", "각 사 가이던스, Bloomberg 컨센서스"], ["데이터센터 착공 전환율", "발표·계획 용량 대비 실제 건설 중 용량 비율", "2026년 가동 예정 16.2GW 중 약 5GW만 건설 중, 2025년 계획 9.1GW 중 5.8GW 가동(36% 지연)", "전환율 상승이 발전·전력기기 신규 주문 재가속의 선행 신호. 지연 원인(접속·변압기·주민·정책)을 구분해 해소 시점 판단", "Sightline Climate, CBRE, Wood Mackenzie"], ["EIA 계획 발전소 용량(Form 860M)", "EIA 월간 발전기 전수조사 기반 향후 계획 발전 용량", "약 150GW → 250GW(2024 하반기~2025), 2026 계획 88.1GW vs 2025 실제 54.9GW", "발전소 건설계획 증가는 2~3년 뒤 변압기·차단기 발주로 이어지는 선행지표", "EIA"]], "title": "수요·CAPEX"}, {"t": "table", "cols": ["지표", "정의", "최근 수준", "읽는 법", "어디서 보나"], "rows": [["초고압 변압기 리드타임", "신규 주문부터 인도까지 기간", "765kV 48~60개월, 345~500kV 36~48개월, 평균 변압기 50주(2021)→120주(2024), 대형 130주+(2025)", "리드타임이 줄기 시작하면 공급 부족 완화=판가 정점 신호. 증설 완공(2027~2028) 이후에도 유지되는지가 핵심", "업계·DOE·Wood Mackenzie·히타치 에너지 코멘트"], ["미국 계통연계 대기열·소요기간", "IR 제출 후 IA 체결 전 발전원 용량과 IR→IA, IA→COD 중앙값", "대기열 2,600GW(2023말)→2,061GW(2025), IR→COD 61개월(절차 45 + 건설 31), 연간 연결 완료 약 52~53GW", "대기열 감소가 취소 때문인지 IA 전환 때문인지 구분. IR→IA만 줄고 IA→COD가 그대로면 물리 병목 지속", "LBNL Queued Up, FERC"], ["가스터빈 수주잔고·잔여 슬롯", "GE Vernova·Siemens Energy·MHI 잔고(GW)와 연도별 납품 가능 슬롯", "GEV 100GW(확정 44+SRA 56), 2030년까지 잔여 약 10GW / Siemens 87GW / MHI 확정 33GW(1Q26)", "잔여 슬롯이 줄고 납기가 2030년대로 밀릴수록 중속엔진·연료전지 등 온사이트 대체 수요와 원전 수요 확대", "각 사 실적 발표"], ["국내 전력기기 공장 가동률", "생산능력 대비 생산실적", "효성 중공업 104.5%, 일진 중전기 108%, HD현대 국내 95.1%·미국 88.8%(1H26)", "100% 전후면 CAPA가 성장 상단. 증설 완공 시점이 물량 성장의 분기점", "각 사 반기보고서"], ["미국 변압기·개폐기 PPI", "미국 노동통계국 생산자물가지수 중 변압기·스위치기어 품목(FRED)", "2021년 초 대비 약 +70%, 2023년 이후 둔화 후 2025년 말부터 약 +5% YoY 재상승, 개폐기·배전반 2025년 약 +10%", "인도 시점 가격을 반영하는 후행지표. 신규 주문이 PPI를 약 1년 선행하므로 계통연계·수주와 함께 봐야 한다", "FRED/BLS"], ["한국 특대형 변압기 수출액·단가", "HS 8504.23(10,000kVA 초과) 월별 수출액과 USD/kg 단가", "2025년 전력망용(8504.22+23) 수출 19.57억달러(+43%), 2026년 4·5월 특대형 +41.5%/+23.3%, 10MVA 이상 5월 누적 +33%·미국향 +55%", "전체 수출이 둔화돼도 특대형 성장·단가 상승이 유지되면 수요가 아니라 CAPA·납기 문제로 해석. 분기 실적의 월간 선행지표", "관세청 TRASS, KITA"], ["미국 변압기 수입액·국가별 비중", "HS 8504.21~23 수입액과 멕시코·한국 등 비중", "2025년 98억달러(+22%), 멕시코 32.3%·한국 17.7%, 1Q26 −9% YoY", "수입이 줄면서 납기가 길어지면 공급 병목, 납기가 짧아지면 수요 둔화", "US Census, USITC, Global Trade Atlas"]], "title": "공급·병목·가격"}, {"t": "table", "cols": ["지표", "정의", "최근 수준", "읽는 법", "어디서 보나"], "rows": [["국내 전력기기 신규수주·수주잔고", "HD현대일렉트릭·효성중공업·LS ELECTRIC·산일전기·일진전기(+대한전선) 합산", "1Q26 5사 신규 8.5조원(+54%)·잔고 34.5조원(+37%), 6사 잔고 38.3조원", "주가 조정 시 수요 둔화인지 수급 문제인지 가르는 1차 지표. 잔고의 지역·ASP·인도 시점 구성까지 확인", "각 사 분기 공시"], ["연간 수주 가이던스 달성률", "분기 누적 신규수주 ÷ 회사 연간 가이던스", "1Q26 효성 49.8%, HD현대 43%, LS 26.7%, 산일 26% → 2Q에 3사 모두 상향", "분기 25%를 크게 넘으면 상향 가능성. 상향 폭을 물량(Q)과 가격(P)으로 나눠 해석", "각 사 IR"], ["수주잔고/매출 배수(Backlog coverage)", "수주잔고를 연간 매출로 나눈 값", "초고압 업체 약 3.7배(2025), HD현대일렉트릭 약 3배(2026.6), 유럽 전선 3사 book-to-bill 5.4년", "3년 이상이면 실적 가시성이 높다. 단 특수변압기(1년 계약)처럼 제품 구조가 다른 기업은 따로 비교", "각 사 공시"], ["전력기기 Forward PER vs EPS 성장률", "국내외 전력기기 선행 PER과 향후 3년 EPS 증가율 비교", "빅3 고점 PER 53.6배(2026-05), 국내외 '26/'27/'28 PER 33~42/28~32/24~25배(6월말), 국내 EPS 증가율 해외 대비 +4~12%p", "EPS 추정치가 유지·상향되는데 주가가 빠지면 멀티플 조정. 컨센서스 하향 전환이 펀더멘털 훼손 신호", "Bloomberg, FactSet 컨센서스"]], "title": "실적·밸류에이션"}], "note": "국내 유틸리티 지표는 06 유틸리티 탭, 정책·시장 지표는 08 시장·수급 탭에 있다."}, {"h": "수주 공시에서 자주 나오는 오독 7가지", "blocks": [{"t": "grid", "cols": 2, "numbered": true, "items": [{"h": "“수주 금액 = 내년 매출”", "p": "초고압은 인도까지 3~5년, 배전반은 6~10개월이다. 2026년 수주의 상당 부분은 2028~2031년 매출이며, 1Q26 효성 수주의 납기는 북미 2031년·노르웨이 2032년이었다."}, {"h": "“잔고가 크면 무조건 좋다”", "p": "2008년 과잉 CAPA 시기의 저가 수주 잔고는 이후 적자의 원인이 됐다. 잔고는 크기보다 단가·확정 비중·에스컬레이션 조항이 가치다. 공시 기준과 관리 기준이 다른 경우도 있다."}, {"h": "“가이던스 상향 = 물량 증가”", "p": "생산 슬롯이 이미 차 있으면 가이던스 상향은 대부분 가격(P)이다. 물량(Q) 상향은 증설 완공과 숙련 인력 확보가 확인될 때만 가능하다."}, {"h": "“분기 이익 미스 = 전가 실패”", "p": "1Q26 국내 전력기기는 영업이익이 컨센서스를 밑돌았지만 원인은 운송 중 재고·관세 비용 시차·일회성 성과급이었다. 같은 분기 효성 신규 수주는 +107%였다."}, {"h": "“전선 매출 증가 = 수요 증가”", "p": "전선 판가는 구리 가격에 연동돼 매출이 구리값에 부풀어 오른다. 매출 증가를 구리 효과와 물량 효과로 나누고, 수요 판단은 잔고와 EBITDA 마진 추세로 한다."}, {"h": "“잔고가 작으면 가시성이 낮다”", "p": "특수변압기(1년 계약)는 잔고가 작지만 매년 가격을 다시 정해 호황기 마진이 높다(산일전기 OPM 약 38%). 대형 변압기와 같은 잔고/매출 잣대로 비교하면 안 된다."}, {"h": "“수출·수입 둔화 = 수요 둔화”", "p": "미국 변압기 수입은 1Q26 −9%였지만 특대형 수출 단가와 10MVA 이상 미국향 수출은 늘었다. 납기가 길어지면서 수입이 줄면 공급 병목, 납기가 짧아지면서 줄면 수요 둔화다."}]}]}, {"h": "가이던스와 실적의 좌표(2026)", "blocks": [{"t": "table", "cols": ["기업", "연초 가이던스", "1Q26 수주(달성률)", "상향 가이던스", "1H26 수주·잔고"], "rows"
