이 놀기 때문에 초고압 수전·내부 배전·온사이트 발전·저장을 한꺼번에 산다. 랙 전력이 10kW(2020)에서 1MW(2027~2028 계획)로 커지면서 데이터센터 내부 전력 구조까지 415V AC에서 800V DC로 바뀌고 있다. 이 탭은 1GW 캠퍼스를 따라 전력기기 수요가 어디서, 몇 번 생기는지를 계단별로 쪼갠다.", "sections": [{"h": "랙 전력밀도 100배 — 모든 변화의 출발점", "blocks": [{"t": "bars", "charts": [{"title": "엔비디아 GPU 세대별 랙당 전력밀도", "unit": "kW/rack", "note": "엔비디아 발표 기준. Rubin(2026)·Rubin Ultra(2027~2028)는 계획치", "items": [{"l": "Ampere(2020)", "v": 10, "tag": "확인"}, {"l": "Hopper(2022)", "v": 40, "tag": "확인"}, {"l": "Blackwell(2024)", "v": 120, "tag": "확인"}, {"l": "Blackwell Ultra(2025)", "v": 150, "tag": "확인"}, {"l": "Rubin(2026)", "v": 200, "tag": "추정"}, {"l": "Rubin Ultra(2028)", "v": 1000, "tag": "추정"}]}]}, {"t": "table", "cols": ["세대", "출시", "랙당 전력", "배전 구조"], "rows": [["Ampere", "2020", "10kW", "415V AC + PSU"], ["Hopper", "2022", "40kW", "415V AC + PSU"], ["Blackwell(GB200 NVL72)", "2024", "120~132kW", "AC + 48/54V 버스바"], ["Blackwell Ultra(GB300)", "2025", "140~150kW", "사이드카 과도기"], ["Rubin(Vera Rubin NVL72)", "2026", "190~230kW", "하이브리드"], ["Rubin Ultra(Kyber)", "2027~2028", "600kW~1MW+", "800VDC(MV 정류기/SST)"]], "title": "GPU 세대별 랙 전력과 배전 구조", "note": "엔비디아 발표·리포트 정리. Rubin Ultra(Kyber)는 계획치."}, {"t": "p", "text": "랙 전력이 커지면 같은 전압에서 전류가 비례해 늘고 손실은 전류 제곱으로 늘어난다. 50V 기준 1MW 랙에는 약 20,000A가 흐르고, 54V로 1MW를 유지하면 구리 버스바가 최대 200kg, 파워 셸프가 64U를 차지한다(NVIDIA). 이 물리적 한계가 800VDC 전환과 SST·SSCB 같은 새 기기 수요를 만든 직접 원인이다."}]}, {"h": "1GW 캠퍼스의 전력 체인 — 상단은 용량, 하단은 반복", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 940 430\" role=\"img\" aria-label=\"1GW AI 캠퍼스는 초고압 수전 설비 한 세트와 50MW 블록 20개의 반복 발주로 구성된다\"><defs><marker id=\"a-pw9\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-pw9-accent\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(-  x=\"660\" y=\"100\" width=\"250\" height=\"48\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"785.0\" y=\"120.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">MV 배전반 12~20면<\/text><text x=\"785.0\" y=\"136.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">VCB·보호계전<\/text><line x1=\"785\" y1=\"148\" x2=\"785\" y2=\"162\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw9)\"/><rect x=\"660\" y=\"164\" width=\"250\" height=\"48\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"785.0\" y=\"184.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">UPS·BBU·ESS<\/text><text x=\"785.0\" y=\"200.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">ms~분 단위 백업<\/text><line x1=\"785\" y1=\"212\" x2=\"785\" y2=\"226\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw9)\"/><rect x=\"660\" y=\"228\" width=\"250\" height=\"48\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"785.0\" y=\"248.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">PDU·버스웨이<\/text><text x=\"785.0\" y=\"264.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">→ 1MW 랙 × 50<\/text><path d=\"M 610 60 C 630 60 640 60 657 60\" fill=\"none\" stroke-width=\"1.3\" style=\"stroke:var(--accent)\" marker-end=\"url(#a-pw9-accent)\"/><rect x=\"20\" y=\"330\" width=\"900\" height=\"88\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"470\" y=\"356\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">IT 1GW(1MW 랙 1,000개) × PUE 1.3 = 인입 1.3GW ≈ 1,368MVA(역률 0.95)<\/text><text x=\"470\" y=\"380\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">1GW 누적 발주: 중압 변압기 40~80대 · 배전반 240~400면 · (800VDC 시) 10MW 정류 모듈 약 100식<\/text><text x=\"470\" y=\"402\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.8\">미국 DC 평균 규모 약 80MW(2025) → 약 400MW(2029E, FERC) — 블록 수가 늘수록 하단 반복 수요가 커진다<\/text><\/svg>", "cap": "**결론: AI 캠퍼스의 전력기기 수요는 두 겹이다.** 위쪽은 GW급 용량을 받아내는 초고압 수전 설비(한 번, 크게), 아래쪽은 50MW 블록마다 되풀이되는 중압 변압기·배전반·UPS(여러 번, 반복)다. 그래서 초고압 업체는 ‘캠퍼스 용량’에, 배전 업체는 ‘블록 수’에 레버리지가 걸리고, 800VDC가 오면 기존 설비를 지우기보다 정류 모듈이라는 층이 더해진다."}, {"t": "table", "cols": ["구간", "핵심 설비", "수요 성격", "국내 연결"], "rows": [["상단 EHV/UHV", "765kV 변압기·리액터·GIS/GCB", "용량 누적·전압 상향, 슬롯 경쟁", "HD현대일렉트릭, 효성중공업"], ["중단 HV/MV 수전", "수전 변압기·GIS·보호계전·전압안정", "시스템 단위 인입, 패키지 역량", "LS ELECTRIC, 일진전기, 산일전기"], ["하단 MV 반복", "MV 변압기·배전반·케이블·버스덕트", "40~60MW 블록 반복 발주", "LS ELECTRIC, 가온전선"], ["전력전자·품질", "정류기·PCS·STATCOM·특수변압기", "온사이트·ESS·DC 계층 추가", "LS ELECTRIC, 산일전기, 효성중공업"], ["전선·HVDC(별도 축)", "고전압 전선·해저·HVDC", "송전망·해상풍력 프로젝트", "대한전선, 일진전기"]], "title": "구간별 설비와 국내 연결", "note": "리포트 정리. 특정 빅테크와 국내 업체를 일대일로 짝짓기보다 프로젝트별 전력 조달 구조를 봐야 한다."}, {"t": "mods", "items": [{"name": "데이터센터 전력기기 MW당 콘텐츠 모델", "formula": "1GW 캠퍼스 = 1MW 랙 1,000개 × PUE 1.3 → 인입 1.3GW(역률 0.95 기준 약 1,368MVA) = 50MW 블록 × 20회 반복 / 블록당 N+1 중압 변압기 2~4대, 배전반 12~20면, (800VDC 시) 10MW 정류 모듈 5식", "paras": ["AI 데이터센터는 40~60MW 전력 블록을 반복 증설하는 방식이라 1GW당 중압 변압기 40~80대, 배전반 240~400면, 정류 모듈 약 100식이 누적 발주된다. 여기에 N+1·2N 이중화가 MW당 설비 투입량을 2~3배 늘리고, 800VDC 전환은 기존 설비를 없애기보다 전력전자 층을 추가한다. 글로벌 업체들은 MW당 매출 기회를 늘리는 방향(냉각·전력 통합)으로 가이던스를 올리고 있다."], "fields": [{"k": "민감도", "v": "블록당 공급 패키지 50억~150억원 가정 시 1GW당 내부 배전 1,000억~3,000억원(리포트 추정). 50MW 데이터센터 MW당 투자비는 N 구조 2.1백만달러 vs 2(N+1) 7.0백만달러(BNEF)."}, {"k": "리포트 사례", "v": "Schneider MW당 매출 기회 120만→330만달러(~2030E), Vertiv 800VDC 전환 시 MW당 TAM 300만~350만달러, Eaton 290만→340만달러. Bloom향 국내 확인 수주 합산 약 3,900억원(LS ELECTRIC 3,190억 + 산일전기 약 750억)."}], "pill": "모델"}]}]}, {"h": "800VDC — 전류·구리·손실의 산수", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 940 345\" role=\"img\" aria-label=\"800VDC는 흩어진 교류-직류 변환을 시설 단계의 정류기 한 곳으로 모아 전류 1.4\" style=\"stroke:var(--warn)\"/><text x=\"535.0\" y=\"62.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">랙 PSU<\/text><text x=\"535.0\" y=\"78.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">AC→DC<\/text><line x1=\"600\" y1=\"66\" x2=\"618\" y2=\"66\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw10)\"/><rect x=\"620\" y=\"40\" width=\"130\" height=\"52\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"685.0\" y=\"62.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">48/54V 버스바<\/text><text x=\"685.0\" y=\"78.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">랙 내부<\/text><line x1=\"750\" y1=\"66\" x2=\"768\" y2=\"66\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw10)\"/><rect x=\"770\" y=\"40\" width=\"130\" height=\"52\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"835.0\" y=\"70.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">GPU<\/text><text x=\"470\" y=\"112\" font-size=\"11\" text-anchor=\"middle\" style=\"fill:var(--warn)\">단계마다 2~5% 손실 → 서버 100MWh에 망에서 120~130MWh 필요<\/text><text x=\"20\" y=\"150\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--accent)\">800VDC: 시설 단계에서 한 번 정류해 직류로 보낸다<\/text><rect x=\"20\" y=\"164\" width=\"130\" height=\"52\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"85.0\" y=\"186.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">13.8~35kV AC<\/text><text x=\"85.0\" y=\"202.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">중압 수전<\/text><rect x=\"170\" y=\"164\" width=\"130\" height=\"52\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--accent)\"/><text x=\"235.0\" y=\"186.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">정류기 / SST<\/text><text x=\"235.0\" y=\"202.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">AC→800V DC<\/text><rect x=\"390\" y=\"164\" width=\"130\" height=\"52\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--accent)\"/><text x=\"455.0\" y=\"186.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">DC 배전반<\/text><text x=\"455.0\" y=\"202.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">800V 버스웨이<\/text><rect x=\"610\" y=\"164\" width=\"130\" height=\"52\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"675.0\" y=\"186.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">랙 DC-DC<\/text><text x=\"675.0\" y=\"202.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">800→48/12V<\/text><rect x=\"790\" y=\"164\" width=\"130\" height=\"52\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"855.0\" y=\"194.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">GPU<\/text><line x1=\"150\" y1=\"190\" x2=\"168\" y2=\"190\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw10)\"/><line x1=\"300\" y1=\"190\" x2=\"388\" y2=\"190\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw10)\"/><line x1=\"520\" y1=\"190\" x2=\"608\" y2=\"190\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw10)\"/><line x1=\"740\" y1=\"190\" x2=\"788\" y2=\"190\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw10)\"/><rect x=\"390\" y=\"262\" width=\"130\" height=\"48\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--ok)\"/><text x=\"455.0\" y=\"282.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--ok)\">ESS 버퍼<\/text><text x=\"455.0\" y=\"298.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">단일 실패지점 보완<\/text><line x1=\"455\" y1=\"260\" x2=\"455\" y2=\"218\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw10)\" marker-start=\"url(#a-pw10)\"/><rect x=\"170\" y=\"262\" width=\"130\" height=\"48\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--ok)\"/><text x=\"235.0\" y=\"282.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--ok)\">SSCB<\/text><text x=\"235.0\" y=\"298.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">DC 고장전류 차단<\/text><line x1=\"235\" y1=\"260\" x2=\"235\" y2=\"218\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw10)\"/><rect x=\"580\" y=\"240\" width=\"340\" height=\"90\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"750\" y=\"262\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">100kW 전류: 415V AC 241A → 800V DC 125A<\/text><text x=\"750\" y=\"284\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">구리 최대 −45% · 변환·열 손실 약 5% 절감(NVIDIA)<\/text><text x=\"750\" y=\"306\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.85\">1MW 랙 전류: 50V 약 20,000A → 800V 약 1,250A<\/text><\/svg>", "cap": "**결론: 800VDC는 ‘변환을 한 곳으로 모으는’ 설계 변경이다.** 전압을 올리면 같은 전력의 전류가 줄어 구리·발열이 줄고, UPS·PSU에 흩어져 있던 변환 손실이 시설 단계의 정류기(최종적으로 SST) 한 곳으로 모인다. 대신 그 한 곳이 단일 실패지점이 되므로 대용량 ESS 버퍼와 직류 고장전류를 끊는 SSCB가 새 필수품이 되고, 기존 AC UPS·PDU는 기능이 줄어든다. 수혜와 피해가 같은 데이터센터 안에서 동시에 생긴다는 점이 핵심이다."}, {"t": "steps", "items": [{"h": "과도기 — 사이드카 LV 정류기", "meta": ["2025 청사진·PoC", "Blackwell Ultra"], "p": "기존 415V AC 배전을 유지하고 랙 옆 사이드카에서 저압 정류기로 DC를 만든다. 기존 UPS·PDU가 그대로 남아 있어 수요 이동이 작다."}, {"h": "하이브리드 — PDU 앞단 정류 + BESS", "meta": ["1H26 레퍼런스 디자인(GTC·COMPUTEX)"], "p": "정류를 PDU 앞단으로 옮기고 BESS를 결합한다. DC 분전반·DC 버스웨이·SSCB 같은 DC 보호 기기가 처음 필요해진다."}, {"h": "공급망 발주", "meta": ["2H26"], "p": "협력사 수주 백로그에 800VDC 항목이 별도로 잡히기 시작하는 시점이다. 국내 업체에게는 디자인윈 → PoC → 정식 RFP 중 어디까지 왔는지가 확인 포인트다.", "chk": "IR 자료·공시에서 800VDC 관련 수주가 별도 항목으로 나오는가"}, {"h": "최종 — MV 정류기·SST 직변환", "meta": ["2027 Rubin Ultra/Kyber 초기 상용화"], "p": "중전압 AC(13.8~35kV)를 시설 단계에서 SST 또는 MV 정류기로 한 번에 800V DC로 바꾼다. 17.5MW 블록은 3.5MW 정류기 5대(5-to-make-4)로 구성된다(NVIDIA 레퍼런스)."}]}, {"t": "proscons", "lt": "가치가 커지는 곳", "rt": "가치가 줄거나 경쟁이 심해지는 곳", "bull": ["전력반도체: SiC(AC-DC·SST), GaN(DC-DC) — 랙당 약 1.5만 → 10만달러 이상(Infineon)", "전력 시스템: 정류기·DC 버스웨이·DC 분전반·SST·SSCB", "DC 기반 현장발전: 연료전지(300~800V DC 출력)·태양광 직결", "에너지 버퍼: 중앙 정류기 단일 실패지점을 보완하는 대용량 ESS", "전압 무관 반복 BOM: MLCC·폴리머 캡·인덕터·전류센싱"], "bear": ["UPS·PDU 등 기존 AC 배전기기: 기능 축소 가능", "범용 PSU·MOSFET 박스: 가격 경쟁 심화 가능", "후발 업체: 칩 업체와 설계 단계부터 협력한 30여 개 글로벌 파트너(ABB·Eaton·Schneider·Vertiv 등)가 표준을 선점할 위험", "DC 배전 국제 규격 부재 — 인증·안전 규제 리스크"]}, {"t": "callout", "text": "Google/OCP의 ±400VDC와 NVIDIA의 800VDC는 경쟁보다 공존 가능성이 높아 OCP Diablo 400 사양은 두 경로를 모두 담았다. 규격이 없는 시장은 먼저 안전·효율 솔루션을 내는 쪽이 표준이 될 수 있어, 레퍼런스가 약한 업체에도 기회가 열려 있다.", "title": "표준 경쟁"}]}, {"h": "저장은 화학이 아니라 담당 시간으로 본다", "blocks": [{"t": "table", "cols": ["구분", "역할", "지속시간", "핵심 스펙", "후보 화학"], "rows": [["BBU(랙/서버)", "순간정전·전환 브릿지", "ms~수십 초", "초고출력, ms 응답", "NCM/NCA 원통형, (랙 외부 시) LFP"], ["UPS(모듈/룸)", "발전기 인계 전 가교", "1~15분", "고신뢰, 핫스왑", "LFP 확대, VRLA 레거시"], ["BTM BESS(캠퍼스)", "피크저감·요금절감·DR", "0.5~4시간", "RTE, LCOE, EMS", "LFP/LMFP, Na-ion"], ["FTM BESS(계통)", "주파수조정·에너지 시프팅", "4~8시간+", "그리드코드, 장기 보증", "LFP, LTO, Iron-Air 가능성"]], "title": "데이터센터 저장 장치의 시간축", "note": "리포트 정리. 서로 대체재가 아니라 보완재다."}, {"t": "p", "text": "AI 데이터센터는 추론·학습 피크로 수십 MW를 수 초 간격으로 오르내리는데(Power Swing), 망 접속 허가 기준은 평균이 아닌 최대 피크다. ESS가 피크를 깎으면 접속 승인이 쉬워지고, 800VDC에서는 중앙 UPS 역할까지 맡는다. 그래서 ESS를 ‘배터리’가 아니라 ‘접속 승인을 앞당기는 전력기기’로 보는 시각이 나왔고, NERC 연산부하 신뢰도 표준(2026년 말 제출)이 순간부하 대응을 의무화하면 2H27 이후 안정용 대형 ESS가 사실상 필수가 된다."}]}, {"h": "온사이 \"226.66666666666669\" x2=\"840\" y2=\"226.66666666666669\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"82\" y=\"177.33333333333334\" font-size=\"10.5\" text-anchor=\"end\" fill-opacity=\"0.7\">40%<\/text><line x1=\"90\" y1=\"173.33333333333334\" x2=\"840\" y2=\"173.33333333333334\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"82\" y=\"124.0\" font-size=\"10.5\" text-anchor=\"end\" fill-opacity=\"0.7\">50%<\/text><line x1=\"90\" y1=\"120.0\" x2=\"840\" y2=\"120.0\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"82\" y=\"70.66666666666669\" font-size=\"10.5\" text-anchor=\"end\" fill-opacity=\"0.7\">60%<\/text><line x1=\"90\" y1=\"66.66666666666669\" x2=\"840\" y2=\"66.66666666666669\" stroke-width=\"1\" stroke=\"currentColor\" stroke-opacity=\"0.12\" stroke-dasharray=\"5 4\"/><text x=\"840\" y=\"318\" font-size=\"11\" text-anchor=\"end\" fill-opacity=\"0.8\">MW당 설비가격(억원, 추정) →<\/text><text x=\"82\" y=\"30\" font-size=\"11\" text-anchor=\"end\" fill-opacity=\"0.8\">전기효율<\/text><rect x=\"256.66666666666663\" y=\"120.0\" width=\"233.33333333333337\" height=\"26.666666666666657\" rx=\"3\" style=\"fill:var(--accent);fill-opacity:0.4\"/><rect x=\"256.66666666666663\" y=\"120.0\" width=\"233.33333333333337\" height=\"26.666666666666657\" rx=\"3\" fill=\"none\" stroke-width=\"1.4\" style=\"stroke:var(--accent)\"/><rect x=\"673.3333333333334\" y=\"66.66666666666669\" width=\"83.33333333333326\" height=\"53.333333333333314\" rx=\"3\" style=\"fill:var(--ok);fill-opacity:0.4\"/><rect x=\"673.3333333333334\" y=\"66.66666666666669\" width=\"83.33333333333326\" height=\"53.333333333333314\" rx=\"3\" fill=\"none\" stroke-width=\"1.4\" style=\"stroke:var(--ok)\"/><rect x=\"506.6666666666667\" y=\"157.33333333333334\" width=\"83.33333333333331\" height=\"16.0\" rx=\"3\" style=\"fill:var(--warn);fill-opacity:0.4\"/><rect x=\"506.6666666666667\" y=\"157.33333333333334\" width=\"83.33333333333331\" height=\"16.0\" rx=\"3\" fill=\"none\" stroke-width=\"1.4\" style=\"stroke:var(--warn)\"/><text x=\"373.3333333333333\" y=\"110.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">중속엔진<\/text><text x=\"373.3333333333333\" y=\"166.66666666666666\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.85\">부하추종 매우 우수 · GW급 빠른 구축<\/text><text x=\"715.0\" y=\"56.666666666666686\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--ok)\">SOFC<\/text><text x=\"650.6666666666666\" y=\"88.0\" font-size=\"10.5\" text-anchor=\"end\" fill-opacity=\"0.85\">DC 직접 출력<\/text><text x=\"650.6666666666666\" y=\"104.0\" font-size=\"10.5\" text-anchor=\"end\" fill-opacity=\"0.85\">주문 후 50~90일 설치<\/text><text x=\"548.3333333333334\" y=\"193.33333333333334\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.85\">PAFC — 희토류 미사용·열병합<\/text><text x=\"548.3333333333334\" y=\"149.33333333333334\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">PAFC<\/text><text x=\"106.66666666666667\" y=\"216.0\" font-size=\"10.5\" text-anchor=\"start\" fill-opacity=\"0.7\">소형 가스터빈: 효율 25~40%, 가격 미기재<\/text><\/svg>", "cap": "**결론: 온사이트 전원은 ‘싸고 빠르게 크게’(중속엔진)와 ‘비싸지만 효율·DC·친환경’(SOFC)으로 갈린다.** 어느 쪽이든 계통을 대체하기보다 계통 연결 전까지 가동 시점을 앞당기는 다리 역할이라 초고압 수요를 없애지 않는다. 대신 발전원마다 특수변압기·배전반·ESS·슈퍼커패시터 같은 주변 전력기기 수요를 새로 만들고, 연료전지 ITC 30%(2032년까지)가 경제성을 받친다. 수치는 리포트 추정 범위다."}, {"t": "table", "cols": ["항목", "중속엔진", "SOFC", "PAFC", "소형 가스터빈"], "rows": [["핵심 포지션", "대용량·단기 전력난 대응", "고효율·친환경 프리미엄", "열병합 강점", "열병합·보조전원"], ["전기효율", "약 45~50%+", "50~60%", "40~43%", "25~40%"], ["부하추종성", "매우 우수", "보통~낮음", "낮음", "보통"], ["MW당 가격(추정)", "10~24억원", "35~40억원", "25~30억원", "-"], ["배출·소음", "CO2·NOx, 소음 큼", "낮음", "낮음", "CO2·NOx"], ["대형 AI DC 적합도", "높음", "높음", "중간", "중간"], ["도심 입지 적합성", "낮음~보통", "높음", "높음", "보통"]], "title": "온사이트 발전원 비교", "note": "리포트 추정. MW당 가격은 원화 환산 추정치."}, {"t": "mods", "items": [{"name": "온사이트 발전 TCO vs 계통 요금", "formula": "온사이트 경제성 = (계통 요금 + 망 이용료 + 접속 지연의 기회비용) − (온사이트 LCOE + 이중화 비용 − ITC)", "paras": ["GPU를 선투자한 데이터센터는 계통 연결이 늦으면 자산이 놀기 때문에 전력은 비용이 아니라 ‘가동 개시 일정 변수’가 됐다. 온사이트 발전은 계통을 대체하기보다 가동 시점을 앞당기는 하이브리드 전략이며, 연료전지 ITC 30%(2032년까지)·ESS ITC 30%(2035년 말까지)가 경제성을 보강한다."], "fields": [{"k": "민감도", "v": "미국 상업용 전기요금 13~14센트/kWh, 산업용 약 10센트 대비 복합가스 LCOE 약 8.1센트, Bloom PPA 약 9.9센트(2025, 리포트 추정). 이중화·탄소비용을 감안해도 계통 연결비용과 큰 차이가 없다."}, {"k": "리포트 사례", "v": "2030년까지 온사이트 일부 보유 예상 데이터센터 13% → 38%, 100% 충당 1% → 27%(Bloom Energy 설문, 2024.4→2025.4). 미국 DC 파이프라인 중 자체발전 계획 약 90GW(약 27%, Cleanview)."}], "pill": "경제성"}]}]}, {"h": "빅테크 CAPEX가 국내 업체에 내려오는 네 갈래", "blocks": [{"t": "grid", "cols": 2, "numbered": true, "items": [{"h": "계통 상단 — 345~765kV 송전·변전", "p": "유틸리티가 대형 부하를 받기 위해 짓는 초고압 설비. 데이터센터 대형 부하 1GW당 약 20억달러 CAPEX가 필요하고(NextEra) 그중 송전은 1억~2.5억달러다.", "list": ["HD현대일렉트릭, 효성중공업"]}, {"h": "접속 구간 — 인입 변전소·중압 배전", "p": "데이터센터 부지까지 전력을 끌어오는 인입 변전소·단거리 송전선·중압 배전. 시스템 단위 인입과 패키지 역량이 중요하다.", "list": ["LS ELECTRIC, 일진전기, 산일전기"]}, {"h": "내부 전기실 — MV 배전반·UPS·정류 모듈", "p": "50MW 블록마다 반복되는 MV 변압기·배전반·VCB·BCP·UPS 연계. 데이터센터 1MW IT당 배전설비 투자는 약 140만달러다(BNEF).", "list": ["LS ELECTRIC(국내 DC 배전 점유율 60~70%), 가온전선(버스덕트)"]}, {"h": "온사이트 발전 — SOFC·엔진·ESS 주변", "p": "온사이트 발전원 주변의 특수변압기·배전반·ESS·슈퍼커패시터. Bloom향 국내 확인 수주는 합산 약 3,900억원(LS ELECTRIC 3,190억 + 산일전기 약 750억)이다.", "list": ["LS ELECTRIC, 산일전기, 비나텍, 서진시스템, HD현대중공업(중속엔진)"]}]}, {"t": "bullets", "items": ["**Google** 청정 PPA·유틸리티 계통 중심 → 초고압 수요", "**AWS·xAI** 내부 전기실 중심 → 배전반·UPS", "**Oracle·AEP·Nebius** Bloom SOFC 온사이트 → 특수변압기·배전 패키지", "**Meta·Microsoft** 송전·변전소 증설 → 초고압·접속 구간", "미국 데이터센터 평균 규모 약 80MW(2025) → 약 400MW(2029E, FERC) — 블록 수와 수전 전압이 함께 커진다"]}]}, {"h": "착공 지연 — 수요가 아니라 속도의 문제", "blocks": [{"t": "kpis", "items": [{"lab": "2026년 가동 예정 DC", "val": "16.2GW", "cap": "그중 실제 건설 중 약 5GW, 25%는 전력 수급 계획 없음(Sightline Climate)", "tag": "확인"}, {"lab": "2025년 계획 대비 가동", "val": "5.8 / 9.1GW", "cap": "36% 지연", "tag": "확인"}, {"lab": "하이퍼스케일러 4사 CAPEX", "val": "약 $679B", "cap": "2026E, +81% YoY(2026-06)", "tag": "추정"}, {"lab": "온사이트 자체발전 계획", "val": "약 90GW", "cap": "미국 DC 파이프라인의 약 27%(Cleanview)", "tag": "확인"}]}, {"t": "p", "text": "지연의 원인은 ①계통 접속(버지니아 100MW 이상 대기 3~4년 → 4~7년), ②변압기 등 전력기기 병목, ③주민 반대(지연·중단 프로젝트 약 1,500억달러), ④PJM 등 규칙 공백의 네 가지다. 우회로는 접속이 빠른 ERCOT로의 입지 이동(텍사스 파이프라인 22.5GW, 다른 주의 약 3배)과 자체 발전·병설이다. 빈 부지에는 전력 인프라가 가장 먼저 들어가고 건물·냉각, 서버 순이므로, 착공 지연 우려 국면에서는 전력 인프라가 반도체 대비 먼저 조정을 받고 착공 전환율이 오르면 먼저 반등한다."}, {"t": "callout", "text": "착공 전환율(발표 용량 대비 건설 중 용량)과 PJM Co-location·BYOP 규칙의 FERC 최종 승인(2H26 예상)이 재가속 신호다. 상세는 07 딥다이브의 ‘데이터센터 착공 지연의 네 가지 원인’ 카드를 본다.", "title": "재가속 신호"}]}, {"h": "AIDC 전력에서 자주 나오는 오독 5가지", "blocks": [{"t": "grid", "cols": 2, "numbered": true, "items": [{"h": "“온사이트 발전이 늘면 초고압 수요가 준다”", "p": "온사이트는 계통을 대체하기보다 가동 시점과 계통 연결 시점을 분리하는 전략이다. 결국 계통에 연결되고, 계통은 필요 전력의 5~10% 백업으로 역할이 바뀔 뿐이다."}, {"h": "“800VDC는 전력기기 전체에 호재”", "p": "DC 전환은 정류기·SST·SSCB·ESS에는 호재지만 UPS·PDU 같은 AC 배전기기 수량은 줄일 수 있다. 기업별 제품 구성으로 순효과를 계산해야 한다."}, {"h": "“빅테크 발표 용량 = 국내 업체 수주”", "p": "프로젝트마다 전력 조달·계통 접속·장비 발주 주체(유틸리티·디벨로퍼·EPC)가 달라 발표 용량이 국내 상장사 수주로 그대로 이어지지 않는다."}, {"h": "“배터리는 화학으로 고른다”", "p": "BBU(ms~수십 초), UPS(1~15분), BTM BESS(0.5~4시간)처럼 담당 시간축과 설치 위치가 수혜를 정한다. 같은 LFP라도 BBU와 BESS는 다른 시장이다."}, {"h": "“GW당 단가 × 발표 GW = 매출”", "p": "Bloom향 확인 수주를 초기 배치 1.2GW로 나눈 GW당 단가(LS ELECTRIC 약 2,658억원)는 민감도 도구일 뿐이다. 벤더 배분·공급 범위·인증·CAPA에 따라 실제 수주는 달라진다."}]}]}]}, "utility": {"title": "유틸리티 요금·회수", "en": "Utility Tariffs & Cost Recovery", "h2": "유틸리티 요금·규제 회수 구조 — 이익은 원가와 요금의 속도 차이다", "lede": "한전·가스공사·지역난방공사의 실적은 판매량보다 **원가가 요금에 얼마나 빨리, 얼마나 온전히 반영되는가**로 결정된다. 비용은 유가→LNG→SMP를 거쳐 3~6개월 뒤 시장 속도로 들어오고, 수입은 정부가 물가·선거를 고려해 정하는 요금으로 들어온다. 미국 규제 유틸리티와 같은 ‘요금기저 × 허용수익률’ 공식을 쓰면서도 한국 유틸리티가 PBR 0.3~0.6배에 머무는 이유가 이 회수 구조에 있다.", "sections": [{"h": "한전 손익은 두 개의 속도로 움직인다", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 940 410\" role=\"img\" aria-label=\"한전의 비용은 시장이 정하고 46\" y=\"134\" font-size=\"10.5\" text-anchor=\"start\" style=\"fill:var(--ok)\">구입단가↓<\/text><text x=\"840\" y=\"236\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.8\">정산단가 원자력 79 vs<\/text><text x=\"840\" y=\"252\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.8\">LNG 384.6원/kWh(2025)<\/text><text x=\"20\" y=\"150\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--ok)\">수입 — 정부가 정한다<\/text><rect x=\"20\" y=\"164\" width=\"300\" height=\"50\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--warn)\"/><text x=\"170.0\" y=\"185.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">요금 결정 = 정부(물가·선거 고려)<\/text><text x=\"170.0\" y=\"201.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">연료비조정요금 분기 ±5원/kWh<\/text><line x1=\"170\" y1=\"214\" x2=\"170\" y2=\"262\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw12)\"/><text x=\"176\" y=\"242\" font-size=\"10.5\" text-anchor=\"start\" fill-opacity=\"0.85\">인가<\/text><rect x=\"20\" y=\"264\" width=\"300\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"170.0\" y=\"284.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">판매수입<\/text><text x=\"170.0\" y=\"300.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">판매량 × 규제 요금<\/text><text x=\"170.0\" y=\"316.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">평균 판매단가 108원(2021) → 170원(2025)<\/text><rect x=\"470\" y=\"284\" width=\"230\" height=\"58\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--accent)\"/><text x=\"585.0\" y=\"309.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">한전 영업이익<\/text><text x=\"585.0\" y=\"325.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">= 판매수입 − 구입전력비 − 고정비<\/text><line x1=\"320\" y1=\"300\" x2=\"468\" y2=\"306\" stroke-width=\"1.3\" style=\"stroke:var(--ok)\" marker-end=\"url(#a-pw12-ok)\"/><text x=\"394.0\" y=\"296\" font-size=\"11\" text-anchor=\"middle\" style=\"fill:var(--ok)\">+ 수입<\/text><path d=\"M 840 256 V 313 H 702\" fill=\"none\" stroke-width=\"1.3\" style=\"stroke:var(--alert)\" marker-end=\"url(#a-pw12-alert)\"/><text x=\"772\" y=\"306\" font-size=\"11\" text-anchor=\"middle\" style=\"fill:var(--alert)\">− 비용<\/text><text x=\"470\" y=\"372\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.85\">리포트 민감도(연 영업이익): SMP 1원/kWh↑ 약 −3,210억 · 유가 1달러↑ 약 −1,310억 · 환율 10원↑ 약 −1,750억<\/text><text x=\"470\" y=\"394\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.85\">원전 이용률 1%p↑ +1,840억~+4,600억(리포트별 상이) · 요금 1%↑ 약 +9,250억<\/text><\/svg>", "cap": "**결론: 한전의 이익은 ‘시장 속도로 움직이는 비용’과 ‘정책 속도로 움직이는 수입’의 차이다.** 유가 충격은 3~6개월 뒤 SMP를 거쳐 구입전력비로 들어오는데, 요금은 분기 ±5원/kWh 연동과 정부 결정으로만 움직인다. 그래서 원가 급등기(2021~2023)에는 누적 47.5조원 적자가, 하락기(2023~2025)에는 급격한 흑자가 났고, 호르무즈 쇼크가 반영되는 2026년 하반기가 다시 비용 쪽이 앞서는 구간이다. 원전 이용률은 이 구조에서 가장 싼 완충재다."}, {"t": "mods", "open": 1, "items": [{"name": "한전 영업이익 = 판매수입 − (연료비 + 구입전력비) − 고정비", "formula": "판매수입 = 판매량 × 규제 요금(기본+전력량+기후환경+연료비조정 ±5원/kWh) / 구입전력비 ≈ 구입량 × SMP(+용량요금·정산비용)", "paras": ["한전은 발전사로부터 SMP로 전력을 사서 정부가 정한 요금으로 판다. 영업비용의 40% 이상이 구입전력비이고 SMP는 대부분 LNG 발전기가 결정하므로, 유가가 LNG 도입가를 거쳐 3~6개월 뒤 한전 비용을 흔든다. 요금은 정부가 물가·선거를 고려해 결정하고 연료비 연동제는 분기 ±5원/kWh로 폭이 좁아, 원가 급등기에 적자가 쌓인다(2Q21~2Q23 누적 47.5조원 적자). 원전 이용률이 오르면 가장 싼 전원(정산단가 약 79원/kWh)이 LNG(약 385원)를 밀어내 비용이 준다."], "fields": [{"k": "민감도", "v": "리포트별 민감도: SMP 1원/kWh↑ → 연 영업이익 약 −3,210억원, 유가 1달러↑ → 약 −1,310억원, 환율 10원↑ → 약 −1,750억원, 원전 이용률 1%p↑ → +1,840억원 / +2,900억원 / 약 +4,600억원으로 리포트마다 추정치 편차가 크다(미확인). 요금 1% 인상 시 약 +9,250억원."}, {"k": "리포트 사례", "v": "평균 판매단가 108원(2021) → 170원/kWh(2025), 매출 60.7조원 → 97.4조원. 2025년 연결 영업이익 13.5조원. 호르무즈 쇼크로 2H26 영업이익 약 0.8조원(−89.5%) 추정(리포트)."}], "pill": "한전"}, {"name": "SMP 결정 구조와 원가 전달 시차", "formula": "SMP(시간대) = 급전 순서상 마지막 발전기의 변동비 / LNG 연료비단가 ≈ f(JCC×유가연동비중, JKM, 환율) → SMP → 한전 구입단가", "paras": ["전력거래소는 변동비가 싼 원자력→석탄→LNG 순으로 발전기를 돌리고, 그 시간 마지막 발전기의 변동비를 모든 발전기에 지급한다(CBP 시장). 2025년 SMP 결정 구간의 약 83%(다른 리포트는 약 90%)가 LNG였다. 가스공사 도입 LNG는 일본 원유 통관가격(JCC) 연동 장기계약이 많아 통관·평균 산정 시차로 유가가 5~6개월 뒤 반영되고, 공급 차질기에는 현물 프리미엄 때문에 선물 기준 추정이 SMP를 과소평가한다. 재생에너지는 계통 수요를 차감해 SMP 상단을 낮춘다(제주는 SMP 0 빈번)."], "fields": [{"k": "민감도", "v": "유연탄·LNG가 동시에 급등한 2022년과 달리 2026년은 유가 위주 상승이라 SMP 상단이 제한된다는 분석. SMP 상한제는 직전 3개월 평균이 120개월 상위 10%일 때 120개월 평균의 150%로 정산가격을 제한(2026년 발동 시 약 166.55원/kWh 추정)."}, {"k": "리포트 사례", "v": "SMP 연초 100~110원 → 6월 약 130원 → 8월 월평균 148.4원/kWh, 9/2 일평균 167.91원(전력거래소). 2025년 정산단가: 평균 124.5, 원자력 79, LNG 384.6원/kWh."}], "pill": "SMP"}]}]}, {"h": "SMP는 평균이 아니라 마지막 발전기가 정한다", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 880 330\" role=\"img\" aria-label=\"마지막으로 켜진 LNG 발전기의 변동비가 SMP가 되어 모든 발전기에 지급된다\"><defs><marker id=\"a-pw13-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--ok)\"/><\/marker><\/defs><line x1=\"80\" y1=\"290\" x2=\"840\" y2=\"290\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.55\"/><line x1=\"80\" y1=\"290\" x2=\"80\" y2=\"30\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.55\"/><text x=\"840\" y=\"312\" font-size=\"11\" text-anchor=\"end\" fill-opacity=\"0.8\">누적 발전량(급전 순서) →<\/text><text x=\"74\" y=\"26\" font-size=\"11\" text-anchor=\"end\" fill-opacity=\"0.8\">변동비<\/text><rect x=\"80\" y=\"280\" width=\"110\" height=\"10\" rx=\"0\" fill=\"var(--raised)\"/><line x1=\"80\" y1=\"280\" x2=\"190\" y2=\"280\" stroke-width=\"1.6\" stroke=\"currentColor\" stroke-opacity=\"0.7\"/><text x=\"135.0\" y=\"278\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">재생<\/text><rect x=\"190\" y=\"250\" width=\"190\" height=\"40\" rx=\"0\" style=\"fill:var(--ok);fill-opacity:0.28\"/><line x1=\"190\" y1=\"250\" x2=\"380\" y2=\"250\" stroke-width=\"1.6\" stroke=\"currentColor\" stroke-opacity=\"0.7\"/><text x=\"285.0\" y=\"278\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">원자력<\/text><rect x=\"380\" y=\"200\" width=\"160\" height=\"90\" rx=\"0\" fill=\"var(--raised)\"/><line x1=\"380\" y1=\"200\" x2=\"540\" y2=\"200\" stroke-width=\"1.6\" stroke=\"currentColor\" stroke-opacity=\"0.7\"/><text x=\"460.0\" y=\"278\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">석탄<\/text><rect x=\"540\" y=\"128\" width=\"130\" height=\"162\" rx=\"0\" style=\"fill:var(--accent);fill-opacity:0.28\"/><line x1=\"540\" y1=\"128\" x2=\"670\" y2=\"128\" stroke-width=\"1.6\" stroke=\"currentColor\" stroke-opacity=\"0.7\"/><text x=\"605.0\" y=\"278\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">LNG<\/text><rect x=\"670\" y=\"88\" width=\"130\" height=\"202\" rx=\"0\" style=\"fill:var(--accent);fill-opacity:0.28\"/><line x1=\"670\" y1=\"88\" x2=\"800\" y2=\"88\" stroke-width=\"1.6\" stroke=\"currentColor\" stroke-opacity=\"0.7\"/><text x=\"735.0\" y=\"278\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">LNG(고효율 외)<\/text><line x1=\"80\" y1=\"128\" x2=\"640\" y2=\"128\" stroke-width=\"2\" style=\"stroke:var(--accent)\" stroke-dasharray=\"5 4\"/><text x=\"90\" y=\"120\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--accent)\">SMP = 한계발전기(LNG) 변동비<\/text><line x1=\"640\" y1=\"40\" x2=\"640\" y2=\"290\" stroke-width=\"1.8\" style=\"stroke:var(--alert)\"/><text x=\"646\" y=\"52\" font-size=\"11\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--alert)\">그 시간의 수요<\/text><line x1=\"285\" y1=\"130\" x2=\"285\" y2=\"248\" stroke-width=\"1.3\" style=\"stroke:var(--ok)\" marker-end=\"url(#a-pw13-ok)\" marker-start=\"url(#a-pw13-ok)\"/><text x=\"292\" y=\"176\" font-size=\"10.5\" text-anchor=\"start\" style=\"fill:var(--ok)\">원전이 받는<\/text><text x=\"292\" y=\"192\" font-size=\"10.5\" text-anchor=\"start\" style=\"fill:var(--ok)\">차익<\/text><text x=\"130\" y=\"262\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.7\">≈0<\/text><text x=\"460\" y=\"170\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.75\">재생이 늘면 계단 전체가 오른쪽으로 밀려<\/text><text x=\"460\" y=\"186\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\"0.75\">SMP를 정하는 발전기가 싸진다<\/text><\/svg>", "cap": "**결론: 전력 도매가격은 평균 원가가 아니라 ‘마지막 발전기’가 정한다.** 싼 발전기부터 돌리고 그 시간의 수요를 채우는 마지막 발전기—2025년 기준 약 83~90%가 LNG—의 변동비를 모든 발전기에 지급한다. 그래서 LNG 가격이 SMP를, SMP가 한전 구입비를 정하고, 원전 이용률이 오르거나 재생에너지가 늘면 비싼 LNG가 계단 밖으로 밀려나 SMP 상단이 내려간다(2025 정산단가 원자력 79·평균 124.5·LNG 384.6원/kWh). 그림의 계단 높이는 개념도다."}, {"t": "bars", "charts": [{"title": "2025년 국내 연료원별 전력 정산단가", "unit": "원/kWh", "note": "전력거래소. 원전과 LNG의 약 5배 격차가 원전 이용률 민감도의 원천", "items": [{"l": "평균", "v": 124.5, "tag": "확인"}, {"l": "원자력", "v": 79, "tag": "확인"}, {"l": "LNG", "v": 384.6, "tag": "확인"}]}, {"title": "SMP(육지) 2026년 추이", "unit": "원/kWh", "note": "전력거래소. 연초 값은 100~110원 범위의 중간값, 9/2는 일평균", "items": [{"l": "연초", "v": 105, "tag": "확인"}, {"l": "6월", "v": 130, "tag": "확인"}, {"l": "8월 평균", "v": 148.4, "tag": "확인"}, {"l": "9/2 일평균", "v": 167.91, "tag": "확인"}]}]}, {"t": "p", "text": "SMP 상한제는 직전 3개월 평균 SMP가 과거 120개월 상위 10%에 들면 정산가격을 120개월 평균의 150%로 제한하는 장치로, 2026년 발동 시 상한가는 약 166.55원/kWh로 추정됐다. 리포트는 LNG 연료비단가 상단을 환율 1,480원·브렌트 100달러·JKM 16달러에서 168원/kWh, 1,500원·115달러·20달러에서 200원/kWh로 시나리오화했다. 유연탄·LNG가 동시에 급등한 2022년과 달리 2026년은 유가 위주 상승이라 SMP 상단이 제한된다는 분석이 있다."}]}, {"h": "전기요금은 네 조각이고, 조각마다 움직이는 속도가 다르다", "blocks": [{"t": "table", "cols": ["요금 항목", "내용", "조정 방식·현황"], "rows": [["기본요금", "계약전력(kW) 기준 고정 부과", "정부 요금 조정 시 변경"], ["전력량요금", "사용량(kWh) × 단가, 계절·시간대 차등", "2026-04-16 개편: 경부하 +5.1원, 최대부하 평균 −15.4원(산업용 실질 약 0.5조원 인하)"], ["기후환경요금", "RPS 7.7원 + ETS 1.1원 + 석탄 감축 0.2원 = 9.0원/kWh", "2023-01 이후 동결"], ["연료비조정요금", "기준연료비 대비 실적연료비(3개월 평균) 변동 반영", "분기 ±5원/kWh 한도, 3Q22부터 +5원 상한 15분기 이상 유지"]], "note": "한국전력·리포트 정리. 최종 요금 결정은 정부(기재부 협의 후 주무부처)가 내린다."}, {"t": "p", "text": "송전·배전 이용요금도 따로 있다. 송전 전력량요금은 수요지역 기준 수도권 2.44원·비수도권 1.42원/kWh, 배전 전력량요금은 저압 11.33원·고압 3.05원/kWh다. 주택·일반용 요금을 kWh당 약 10원 올리면 한전 평균 판매단가가 약 4원/kWh 오르고 영업이익이 약 2.5조원 개선된다는 리포트 추정이 있다. 지역별 차등요금제(LMP)가 도입되면 발전소-수요지 거리에 따라 kWh당 10~20원 차등이 검토되고 있다."}]}, {"h": "총괄원가 vs Rate Base — 같은 공식, 다른 회수", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 920 300\" role=\"img\" aria-label=\"미국과 한국 유틸리티는 같은 요금기저 공식을 쓰지만 한국은 요금 결정 단계에서 회수 고리가 끊긴다\"><defs><marker id=\"a-pw14\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><marker id=\"a-pw14-alert\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--alert)\"/><\/marker><marker id=\"a-pw14-ok\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" style=\"fill:var(--ok)\"/><\/marker><\/defs><text x=\"20\" y=\"30\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--ok)\">미국 IOU — 주 규제위원회가 승인하는 회수 경로<\/text><rect x=\"20\" y=\"44\" width=\"160\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"100.0\" y=\"68.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">설비투자 CAPEX<\/text><text x=\"100.0\" y=\"84.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">5개년 계획<\/text><rect x=\"20\" y=\"184\" width=\"160\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"100.0\" y=\"208.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">설비투자 CAPEX<\/text><text x=\"100.0\" y=\"224.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">송변전·주배관<\/text><line x1=\"180\" y1=\"72\" x2=\"198\" y2=\"72\" stroke-width=\"1.3\" stroke =\"540\" y1=\"72\" x2=\"558\" y2=\"72\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw14)\"/><line x1=\"540\" y1=\"212\" x2=\"558\" y2=\"212\" stroke-width=\"1.3\" style=\"stroke:var(--alert)\" marker-end=\"url(#a-pw14-alert)\"/><rect x=\"560\" y=\"44\" width=\"160\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"640.0\" y=\"68.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">요금안 승인<\/text><text x=\"640.0\" y=\"84.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">주 규제위원회<\/text><rect x=\"560\" y=\"184\" width=\"160\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--warn)\"/><text x=\"640.0\" y=\"208.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">요금 = 정부 결정<\/text><text x=\"640.0\" y=\"224.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">물가·선거 고려<\/text><line x1=\"720\" y1=\"72\" x2=\"738\" y2=\"72\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw14)\"/><line x1=\"720\" y1=\"212\" x2=\"738\" y2=\"212\" stroke-width=\"1.3\" stroke=\"currentColor\" stroke-opacity=\"0.6\" marker-end=\"url(#a-pw14)\"/><rect x=\"740\" y=\"44\" width=\"160\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--ok)\"/><text x=\"820.0\" y=\"68.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--ok)\">이익·배당 ↑<\/text><text x=\"820.0\" y=\"84.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">예측 가능<\/text><rect x=\"740\" y=\"184\" width=\"160\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--warn)\"/><text x=\"820.0\" y=\"208.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">차입↑ · 미수금<\/text><text x=\"820.0\" y=\"224.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">원가회수율 &lt;100% 구간<\/text><path d=\"M 820 102 V 128 H 100 V 102\" fill=\"none\" stroke-width=\"1.3\" style=\"stroke:var(--ok)\" stroke-dasharray=\"5 4\" marker-end=\"url(#a-pw14-ok)\"/><text x=\"460\" y=\"146\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--ok)\">CAPEX 증가 = 요금기저 증가 = 이익 증가 → 밸류에이션 할인 작음<\/text><text x=\"20\" y=\"170\" font-size=\"12\" text-anchor=\"start\" font-weight=\"600\" style=\"fill:var(--warn)\">한국 한전·가스공사 — 총괄원가(적정원가 + 요금기저 × 보수율)<\/text><text x=\"585\" y=\"262\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">✕ 고리 단절<\/text><text x=\"460\" y=\"290\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\" fill-opacity=\"0.9\">할인의 본질은 투자 규모가 아니라 회수 경로의 예측 불확실성<\/text><\/svg>", "cap": "**결론: 공식은 같고 ‘요금을 누가 정하느냐’가 다르다.** 미국 IOU는 5개년 CAPEX가 주 규제위원회 승인을 거쳐 요금기저·허용 ROE로 이어져 투자 계획이 곧 이익 성장 근거가 된다. 한국은 같은 총괄원가 공식을 쓰지만 요금을 정부가 물가·선거를 고려해 정하는 단계에서 고리가 끊겨, 원가 급등기에는 한전 적자·가스공사 미수금으로 쌓인다. 한국 유틸리티의 PBR 할인(한전 역사적 평균 약 0.38배)은 이 회수 불확실성의 가격이다."}, {"t": "mods", "items": [{"name": "총괄원가 규제 (한전·가스공사·지역난방)", "formula": "총괄원가 = 적정원가(연료·구입전력·인건비·감가상각) + 적정투자보수(요금기저 × 적정투자보수율[WACC]) / 원가회수율 = 판매수입 ÷ 총괄원가", "paras": ["송배전망·가스 주배관은 자연독점이라 정부가 사업영역을 보장하는 대신 요금을 규제한다. 이익은 판매량보다 ‘어떤 자산을 요금기저로 인정받고 어떤 보수율을 받는가’로 결정된다. 문제는 원칙상 원가 보상이지만 실제로는 물가·산업정책으로 요금이 관리돼 회수율이 100%를 밑도는 기간이 길다는 점이다. 가스공사는 원료비가 요금보다 높으면 손실이 아닌 ‘미수금’ 자산으로 쌓아 회계이익은 안정적이나 현금은 이미 나가 차입이 늘어난다."], "fields": [{"k": "민감도", "v": "금리가 내리면 적정투자보수율이 낮아져 규제 이익이 줄고, 요금기저가 커지면 보수는 늘지만 그만큼 차입이 선행된다. 한전 송배전 WACC는 과거 4~5%대로 발전자회사(7~8%)보다 낮게 책정됐고 최근 3% 초반으로 제시된다."}, {"k": "리포트 사례", "v": "가스공사 2026 요금기저 21.7조원 × 적정투자보수율 5.38% ≈ 국내 도매 투자보수 약 1.17조원. 민수용 미수금 1.8조(2021) → 14.0조(2024) → 13.5조원(2Q26). 한전 원가회수율 118%(2025E) → 131%(2027E) 추정, 역사적 고점 107%(2016)."}], "pill": "한국"}, {"name": "미국 규제 유틸리티 = Rate Base × 허용 ROE", "formula": "허용 수익 = 요금기저(순투자자산) × 허용 ROE(자기자본분) + 운영비·감가상각 회수 → CAPEX 증가 = 요금기저 증가 = 이익 증가", "paras": ["미국 IOU는 지역 독점권 대신 투자비·운영비·자본비용을 반영한 요금안을 주 규제위원회에 승인받는다. 따라서 장기 투자계획이 곧 요금 인상과 이익 성장의 근거가 되고, 한국과 달리 회수 경로의 예측 가능성이 높아 밸류에이션 할인이 작다. 유틸리티 CAPEX는 규제 승인을 거친 5년 이상 계획이라 관성이 크고, 이것이 전력기기 수주의 가장 확실한 선행 변수다."], "fields": [{"k": "민감도", "v": "데이터센터 대형 부하 1GW당 약 20억달러 CAPEX 필요(NextEra), 그중 송전은 1억(PPL)~2.5억달러(FirstEnergy). 요금 부담이 가계로 전가되면 주민 반대·모라토리엄이 강해져 대형 부하에 비용을 직접 물리는 규칙(BYOP, SB6)으로 이어진다."}, {"k": "리포트 사례", "v": "AEP 2026~2030 CAPEX 720억→780억달러, Dominion 501억→647억달러, Duke 2030년까지 1,030억달러(+18%). 미국 IOU 합산 CAPEX 1,980억(2025) → 2,780억달러(2030E, S&P Global)."}], "pill": "미국"}]}, {"t": "table", "cols": ["유틸리티", "핵심 수치"], "rows": [["AEP", "계약부하 28GW(3Q25) → 56GW(4Q25) → 63~69GW(2026), CAPEX 720억 → 780억달러, 765kV 망의 약 90% 운영"], ["Dominion", "데이터센터 계약 약 51GW(2026-03), CAPEX 501억 → 647억달러(+30%)"], ["Duke", "누적 데이터센터 계약 7.6GW, 후기단계 15.4GW, 2030년까지 CAPEX 1,030억달러(+18%)"], ["NextEra/FPL", "대형부하 전망 6 → 8GW, 대형부하 1GW당 약 20억달러 CAPEX"], ["CenterPoint", "CAPEX 330억달러(~2030) → 655억달러+(~2035)"], ["FirstEnergy", "2035년 피크 48GW 이상(2025년 33GW), 데이터센터 1GW당 송전 2.5억달러"]], "title": "미국 유틸리티별 데이터센터·CAPEX 코멘트(1H26)", "note": "각 사 분기 실적·IR(리포트 인용)"}]}, {"h": "가스공사 — 미수금이 손익과 현금을 갈라놓는다", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 900 290\" role=\"img\" aria-label=\"가스공사 미수금은 손익을 보호하지만 현금은 이미 나가 차입으로 메워진다\"><defs><marker id=\"a-pw23\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"20\" y=\"110\" width=\"180\" height=\"60\" rx=\"6\" fill=\"var(--surface)\" stroke-width=\"1.4\" style=\"stroke:var(--alert)\"/><text x=\"110.0\" y=\"136.32\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">원료비(LNG 도입가)<\/text><text x=\"110.0\" y=\"152.32\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\"0.75\">&gt; 민수용 요금<\/text><rect x=\"290\" y=\"40\" width=\"220\" height=\"56\" rx=
