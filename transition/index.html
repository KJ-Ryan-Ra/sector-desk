: "저장·전력품질"}, {"term": "슈퍼커패시터", "en": "Supercapacitor / EDLC", "def": "전극 표면에 이온을 물리적으로 붙여 저장하는 고출력·장수명 장치(LS머트리얼즈는 울트라커패시터로 부름).", "group": "저장·전력품질"}, {"term": "LiC", "en": "Lithium-ion Capacitor", "def": "커패시터와 리튬이온 배터리의 중간 성격 하이브리드 커패시터.", "group": "저장·전력품질"}, {"term": "CBU", "en": "Capacitor Bank Unit", "def": "커패시터를 묶어 랙·전력버스의 순간 전력 변동을 흡수하는 장치.", "group": "저장·전력품질"}, {"term": "UPS / BBU", "en": "Uninterruptible Power Supply / Battery Backup Unit", "def": "무정전 전원장치와 서버랙 단위 백업 배터리.", "group": "저장·전력품질"}, {"term": "VFI", "en": "Voltage and Frequency Independent", "def": "외부 전압·주파수 변동과 무관하게 출력을 유지하는 온라인 UPS 특성.", "group": "저장·전력품질"}, {"term": "THD", "en": "Total Harmonic Distortion", "def": "고조파 왜곡률. AIDC는 3% 이하 지향.", "group": "저장·전력품질"}, {"term": "PUE", "en": "Power Usage Effectiveness", "def": "데이터센터 전체 전력 ÷ IT 전력.", "group": "저장·전력품질"}, {"term": "800VDC", "en": "800-volt direct current", "def": "데이터센터 랙에 800V 직류로 전력을 공급하는 차세대 배전 방식.", "group": "저장·전력품질"}, {"term": "SST", "en": "Solid-State Transformer", "def": "전력반도체 기반 변압기. AC-DC 변환을 통합해 DC 배전에 활용.", "group": "저장·전력품질"}, {"term": "Peak shaving", "en": "Peak shaving", "def": "순간 최대 부하를 저장장치로 깎아 상위 설비 부담을 줄이는 운영.", "group": "저장·전력품질"}, {"term": "관성", "en": "Inertia", "def": "회전 발전기가 가진 운동에너지로 주파수 급변을 늦추는 계통 특성. 인버터 전원에는 없음.", "group": "저장·전력품질"}, {"term": "STATCOM", "en": "Static Synchronous Compensator", "def": "무효전력을 보상해 계통 전압을 안정화하는 전력전자 설비.", "group": "저장·전력품질"}, {"term": "SOFC", "en": "Solid Oxide Fuel Cell", "def": "고체산화물 전해질 고온형 연료전지. 발전용·데이터센터 주력.", "group": "연료전지·수소"}, {"term": "PAFC", "en": "Phosphoric Acid Fuel Cell", "def": "인산형 중온 연료전지. 1세대 발전용, 열병합 적합.", "group": "연료전지·수소"}, {"term": "PEMFC", "en": "Polymer Electrolyte Membrane Fuel Cell", "def": "고분자 전해질 저온형 연료전지. 수송·건물용 주력.", "group": "연료전지·수소"}, {"term": "MCFC", "en": "Molten Carbonate Fuel Cell", "def": "용융탄산염 고온형 연료전지. 유틸리티급 발전용.", "group": "연료전지·수소"}, {"term": "개질", "en": "Reforming", "def": "천연가스 등에서 수소를 뽑아내는 공정.", "group": "연료전지·수소"}, {"term": "LTSA", "en": "Long-Term Service Agreement", "def": "연료전지 납품 후 스택 교체·유지보수를 포함하는 장기 서비스 계약.", "group": "연료전지·수소"}, {"term": "수소 색상 구분", "en": "Brown/Grey/Blue/Green Hydrogen", "def": "원료·생산방식별 구분. 그레이(가스 개질 10tCO2/tH2), 블루(개질+CCUS 1~4), 그린(수전해 0).", "group": "연료전지·수소"}, {"term": "HPS / CHPS", "en": "(Clean) Hydrogen Portfolio Standard", "def": "국내 수소발전 입찰시장. 일반수소와 청정수소 발전시장으로 구분.", "group": "연료전지·수소"}, {"term": "HALEU", "en": "High-Assay Low-Enriched Uranium", "def": "U-235 5~20% 농축 우라늄. 4세대 SMR·우주 원자로 연료.", "group": "연료전지·수소"}, {"term": "FSP", "en": "Fission Surface Power", "def": "NASA·DOE의 달 표면 100kWe급 소형 원자로 프로젝트(2030 목표).", "group": "연료전지·수소"}, {"term": "Henry Hub", "en": "Henry Hub", "def": "미국 루이지애나 천연가스 가격 기준 허브.", "group": "가스·LNG"}, {"term": "JKM", "en": "Japan Korea Marker", "def": "Platts 동아시아 LNG 현물 가격 지표.", "group": "가스·LNG"}, {"term": "TTF", "en": "Title Transfer Facility", "def": "네덜란드 가상 가스 허브, 유럽 가격 기준.", "group": "가스·LNG"}, {"term": "JCC", "en": "Japan Crude Cocktail", "def": "일본 원유 통관 가격. 아시아 유가연동 LNG 계약의 기준.", "group": "가스·LNG"}, {"term": "액화수수료", "en": "Liquefaction Fee", "def": "미국 LNG 가격 공식(115%×HH+수수료+운임) 중 설비 투자 회수분. 장기 $2.25~3.50.", "group": "가스·LNG"}, {"term": "FOB / DES", "en": "Free On Board / Delivered Ex-Ship", "def": "선적항 인도(운송은 구매자) / 하역항 인도(목적지 고정) 조건.", "group": "가스·LNG"}, {"term": "SPA", "en": "Sale and Purchase Agreement", "def": "LNG 장기 매매계약.", "group": "가스·LNG"}, {"term": "불가항력", "en": "Force Majeure", "def": "통제 불가 사유로 계약 이행 의무를 면제받는 조항.", "group": "가스·LNG"}, {"term": "BOG", "en": "Boil-Off Gas", "def": "운송 중 기화로 손실되는 LNG.", "group": "가스·LNG"}, {"term": "FLNG", "en": "Floating LNG", "def": "해상 가스전 위에서 생산·액화·저장하는 부유식 설비.", "group": "가스·LNG"}, {"term": "수반가스", "en": "Associated Gas", "def": "셰일 원유 생산 시 함께 나오는 가스. 유가 상승 시 미국 가스 공급을 늘림.", "group": "가스·LNG"}, {"term": "반출입업", "en": "Natural Gas Import-Export Business", "def": "보세구역 LNG를 통관 없이 해외에 재판매할 수 있는 등록 사업.", "group": "가스·LNG"}, {"term": "PNG", "en": "Pipeline Natural Gas", "def": "파이프라인으로 기체 상태로 수입하는 천연가스.", "group": "가스·LNG"}, {"term": "LPG / CP", "en": "Liquefied Petroleum Gas / Contract Price", "def": "프로판·부탄 연료와 사우디아람코 LPG 공시가격.", "group": "가스·LNG"}, {"term": "VLGC", "en": "Very Large Gas Carrier", "def": "LPG 대형 운반선.", "group": "가스·LNG"}, {"term": "CPO", "en": "Crude Palm Oil", "def": "팜열매 과육에서 착유한 조팜유.", "group": "바이오·팜"}, {"term": "FFB", "en": "Fresh Fruit Bunch", "def": "팜나무에서 수확하는 신선 팜열매 송이.", "group": "바이오·팜"}, {"term": "OER", "en": "Oil Extraction Rate", "def": "FFB 대비 회수되는 CPO 비율(말레이 약 19.7%).", "group": "바이오·팜"}, {"term": "PKO", "en": "Palm Kernel Oil", "def": "팜열매 씨앗에서 짠 라우릭계 기름. 계면활성제 원료.", "group": "바이오·팜"}, {"term": "PFAD", "en": "Palm Fatty Acid Distillate", "def": "팜유 정제 부산물 지방산. SAF 원료 후보.", "group": "바이오·팜"}, {"term": "POME", "en": "Palm Oil Mill Effluent", "def": "착유 공장 고농도 유기 폐액. 바이오가스 원료.", "group": "바이오·팜"}, {"term": "FAME / B40·B50", "en": "Fatty Acid Methyl Ester", "def": "에스테르화 바이오디젤과 경유 혼합 비율(40%·50%) 의무.", "group": "바이오·팜"}, {"term": "SAF", "en": "Sustainable Aviation Fuel", "def": "지속가능항공유.", "group": "바이오·팜"}, {"term": "HEFA", "en": "Hydroprocessed Esters and Fatty Acids", "def": "유지를 수소화해 SAF를 만드는 주력 공정.", "group": "바이오·팜"}, {"term": "UCO", "en": "Used Cooking Oil", "def": "폐식용유. HEFA 원료.", "group": "바이오·팜"}, {"term": "EUDR", "en": "EU Deforestation Regulation", "def": "산림훼손과 무관함을 실사·좌표로 증명해야 EU 판매를 허용하는 규제.", "group": "바이오·팜"}, {"term": "NDPE / RSPO", "en": "No Deforestation, No Peat, No Exploitation / Roundtable on Sustainable Palm Oil", "def": "산림·이탄지·착취 금지 원칙과 지속가능 팜유 인증 협의체.", "group": "바이오·팜"}, {"term": "Nucleus / Plasma", "en": "Nucleus estate / Plasma smallholder", "def": "인니 기업 핵심 농장과 계약 소농 농장 구조.", "group": "바이오·팜"}, {"term": "OBBBA", "en": "One Big Beautiful Bill Act", "def": "2025.7 미국 감세법. IRA 청정에너지 세액공제를 축소·재편.", "group": "정책·제도"}, {"term": "IRA", "en": "Inflation Reduction Act", "def": "2022 미국 인플레이션감축법. 청정에너지 세액공제의 원형.", "group": "정책·제도"}, {"term": "ITC(48E)", "en": "Investment Tax Credit", "def": "청정에너지 설비 투자비의 6~50%를 공제하는 투자세액공제.", "group": "정책·제도"}, {"term": "PTC(45Y)", "en": "Production Tax Credit", "def": "발전량에 비례하는 생산세액공제.", "group": "정책·제도"}, {"term": "AMPC(45X)", "en": "Advanced Manufacturing Production Credit", "def": "미국 내 부품 생산량당 세액공제(셀 $35/kWh, 태양광 셀 약 4센트/W 등).", "group": "정책·제도"}, {"term": "DCA", "en": "Domestic Content Adder", "def": "미국산 부품 비중 요건 충족 시 ITC +10%p.", "group": "정책·제도"}, {"term": "FEOC / PFE", "en": "Foreign Entity of Concern / Prohibited Foreign Entity", "def": "세액공제를 제한하는 중국 등 우려국 관련 기업 규정.", "group": "정책·제도"}, {"term": "MACR", "en": "Material Assistance Cost Ratio", "def": "전체 직접원가 중 PFE에서 유래하지 않은 비용 비율.", "group": "정책·제도"}, {"term": "UFLPA", "en": "Uyghur Forced Labor Prevention Act", "def": "신장 강제노동 연계 제품의 미국 반입 금지법.", "group": "정책·제도"}, {"term": "AD/CVD", "en": "Anti-Dumping / Countervailing Duty", "def": "반덤핑관세와 상계관세.", "group": "정책·제도"}, {"term": "Section 232", "en": "Trade Expansion Act Section 232", "def": "국가안보를 이유로 수입 제한·관세를 부과하는 미국 조항.", "group": "정책·제도"}, {"term": "Section 301 / 122", "en": "Trade Act Sections 301 / 122", "def": "불공정무역 보복 관세(301)와 국제수지 방어용 임시 관세(122).", "group": "정책·제도"}, {"term": "CHARGE Act", "en": "CHARGE Act", "def": "중국 기술 ESS 수입 금지 법안(2026.2 발의).", "group": "정책·제도"}, {"term": "RPS / REC", "en": "Renewable Portfolio Standard / Certificate", "def": "재생에너지 공급의무화 제도와 공급인증서. 2027년부터 신규 REC 발급 중단.", "group": "정책·제도"}, {"term": "REC 가중치", "en": "REC multiplier", "def": "RPS에서 발전원별 인증서 배수. 연료전지는 과거 2.0.", "group": "정책·제도"}, {"term": "CfD", "en": "Contract for Difference", "def": "기준가격과 시장가 차이를 정산하는 장기 가격보장 계약.", "group": "정책·제도"}, {"term": "OREC", "en": "Offshore Renewable Energy Certificate", "def": "미국 주정부가 해상풍력 발전량에 부여하는 인증서.", "group": "정책·제도"}, {"term": "REPowerEU", "en": "REPowerEU", "def": "러시아 화석연료 의존 탈피를 위한 EU 전략.", "group": "정책·제도"}, {"term": "NZIA / CBAM", "en": "Net-Zero Industry Act / Carbon Border Adjustment Mechanism", "def": "EU 청정기술 역내 제조 강화 규정과 탄소국경조정제도.", "group": "정책·제도"}, {"term": "반내권", "en": "Anti-involution", "def": "중국의 과잉 출혈경쟁 억제 정책.", "group": "정책·제도"}, {"term": "분산에너지 특별법", "en": "Distributed Energy Act", "def": "지역 분산전원·BESS 확대를 제도화한 국내 법. 분산에너지 사업자 500MW 한도.", "group": "정책·제도"}, {"term": "LCOE", "en": "Levelized Cost of Electricity", "def": "설비 수명 동안 총비용 ÷ 총발전량.", "group": "금융·밸류에이션"}, {"term": "LCOS", "en": "Levelized Cost of Storage", "def": "저장장치 생애 비용 ÷ 총 방전량.", "group": "금융·밸류에이션"}, {"term": "WACC", "en": "Weighted Average Cost of Capital", "def": "가중평균자본비용. 신재생 LCOE의 핵심 변수.", "group": "금융·밸류에이션"}, {"term": "FID", "en": "Final Investment Decision", "def": "자금조달 후 착공을 확정하는 최종투자결정.", "group": "금융·밸류에이션"}, {"term": "PF", "en": "Project Finance", "def": "프로젝트 현금흐름을 담보로 한 차입. 해상풍력 부채비율 70~80%.", "group": "금융·밸류에이션"}, {"term": "DSCR", "en": "Debt Service Coverage Ratio", "def": "현금흐름 ÷ 원리금. PF 대출 한도 결정 지표.", "group": "금융·밸류에이션"}, {"term": "NTP", "en": "Notice to Proceed", "def": "공사 착수 승인. 개발 단계 구분 기준.", "group": "금융·밸류에이션"}, {"term": "IPP", "en": "Independent Power Producer", "def": "발전소를 보유·운영하며 전력을 판매하는 독립 발전사업자.", "group": "금융·밸류에이션"}, {"term": "YieldCo", "en": "Yield Company", "def": "운영 발전 자산 현금흐름을 배당으로 돌려주는 운영 중심 IPP.", "group": "금융·밸류에이션"}, {"term": "CAFD / FFO", "en": "Cash Available for Distribution / Funds From Operations", "def": "배당 가능 현금과 순이익+감가상각 등 영업현금흐름. 디벨로퍼 평가 기준.", "group": "금융·밸류에이션"}, {"term": "P/FFO", "en": "Price to FFO", "def": "FFO 대비 시가총액. 글로벌 인프라 디벨로퍼 평균 약 13배.", "group": "금융·밸류에이션"}, {"term": "Book-to-bill", "en": "Book-to-bill ratio", "def": "수주 ÷ 매출. 1 초과 시 잔고 증가.", "group": "금융·밸류에이션"}, {"term": "PPA", "en": "Power Purchase Agreement", "def": "발전사업자와 수요자 간 장기 전력구매계약.", "group": "전력시장·계통"}, {"term": "BTM / FTM", "en": "Behind / Front of the Meter", "def": "계량기 안쪽(수요처 부지 자가발전)과 계통을 거친 공급.", "group": "전력시장·계통"}, {"term": "Co-location", "en": "Co-location", "def": "발전소와 대형 부하(데이터센터)를 같은 부지에 두고 직접 연결하는 방식.", "group": "전력시장·계통"}, {"term": "IR / IA / COD", "en": "Interconnection Request / Agreement / Commercial Operation Date", "def": "계통 연결 신청·계약·상업운전 개시.", "group": "전력시장·계통"}, {"term": "ELCC", "en": "Effective Load Carrying Capability", "def": "피크 시점 자원이 실제 기여하는 용량 비율(태양광 단독 7% vs +ESS 41%, CAISO).", "group": "전력시장·계통"}, {"term": "피크기여도·실효용량", "en": "Capacity Credit", "def": "설비용량 중 최대수요 시간대에 계통에 기여하는 비율(국내 태양광 14.3%, 풍력 2.4%).", "group": "전력시장·계통"}, {"term": "덕 커브 / 캐니언 커브", "en": "Duck / Canyon Curve", "def": "태양광 확대로 낮 순부하가 급감하고 저녁에 급증하는 부하곡선(0 이하면 캐니언).", "group": "전력시장·계통"}, {"term": "둥켈플라우테", "en": "Dunkelflaute", "def": "태양광·풍력이 동시에 급감하는 어두운 무풍 기간.", "group": "전력시장·계통"}, {"term": "SMP", "en": "System Marginal Price", "def": "국내 전력시장 계통한계가격. 2025년 83%를 LNG가 결정.", "group": "전력시장·계통"}, {"term": "LOLH / NUSE", "en": "Loss of Load Hours / Normalized Unserved Energy", "def": "공급 부족 연간 시간과 미공급 에너지 비율. 계통 신뢰도 지표.", "group": "전력시장·계통"}, {"term": "PJM", "en": "PJM Interconnection", "def": "미국 동부 13개 주 전력망 운영기관, 미국 최대 전력시장.", "group": "전력시장·계통"}, {"term": "ISO / RTO", "en": "Independent System / Regional Transmission Operator", "def": "미국 지역 전력망 운영기관(ERCOT·MISO·CAISO 등).", "group": "전력시장·계통"}, {"term": "TSO", "en": "Transmission System Operator", "def": "대규모 송전망 운영기관(TenneT 등).", "group": "전력시장·계통"}, {"term": "HVDC", "en": "High Voltage Direct Current", "def": "초고압 직류 송전. 장거리·해저 대용량에 유리.", "group": "전력시장·계통"}, {"term": "Order 2023", "en": "FERC Order No. 2023", "def": "계통연계 심사를 '준비된 순서'·클러스터 방식으로 바꾼 FERC 규칙.", "group": "전력시장·계통"}, {"term": "BYOG", "en": "Bring Your Own Generation", "def": "대형 수요자가 신규 전원을 직접 확보하도록 하는 원칙.", "group": "전력시장·계통"}, {"term": "VPP / DR", "en": "Virtual Power Plant / Demand Response", "def": "분산자원을 묶은 가상발전소와 수요반응.", "group": "전력시장·계통"}, {"term": "출력제어 조건부 접속", "en": "Curtailment-conditioned Interconnection", "def": "계통 포화 지역에서 ESS 동반 설치 조건으로 접속을 허용하는 제도.", "group": "전력시장·계통"}, {"term": "Build-Transfer(BT)", "en": "Build-Transfer", "def": "민간이 송전망을 짓고 완공 후 한전에 이관하는 방식(전력망 3법).", "group": "전력시장·계통"}, {"term": "ACC", "en": "Aggregate Capability Constraint", "def": "태양광+ESS 합산 출력을 계통 접속점 한도 안으로 묶어 같은 연결 용량에 더 많은 설비를 붙이는 규칙(CAISO 실증).", "group": "전력시장·계통"}, {"term": "SATOA", "en": "Storage As Transmission-Only Asset", "def": "저장 자원을 송전 보강 수단으로 인정하는 제도(ISO-NE, FERC 승인).", "group": "전력시장·계통"}, {"term": "Physical Work Test", "en": "Physical Work Test", "def": "물리적 공사 착수로 착공을 인정하는 기준. 2025.9.2 이후 착공분은 5% 비용 세이프하버 없이 이 기준만 인정(1.5MW 이하 태양광 예외).", "group": "정책·제도"}, {"term": "5% Safe Harbor", "en": "5% Safe Harbor", "def": "총비용의 5% 이상 지출로 착공을 인정하던 기준. IRS Notice 2025-42로 폐지.", "group": "정책·제도"}, {"term": "크레딧 양도", "en": "Transferability", "def": "세액공제를 제3자에게 팔아 현금화하는 제도. 풍력은 OBBBA로 2027년까지로 단축.", "group": "정책·제도"}, {"term": "45U", "en": "Zero-emission Nuclear PTC", "def": "기존 원전 발전량에 주는 생산세액공제. OBBBA 이후 2032년까지 유지.", "group": "정책·제도"}, {"term": "계통관리변전소", "en": "Grid-constrained Substation", "def": "계통 포화로 신규 재생에너지 접속을 관리하는 변전소. 2024.9 205곳 지정, 출력제어 조건부 접속 시 예외.", "group": "전력시장·계통"}, {"term": "Ratepayer Protection Pledge", "en": "Ratepayer Protection Pledge", "def": "빅테크 7곳이 필요 전력을 직접 생산·조달하겠다고 한 서약(2026.3).", "group": "전력시장·계통"}, {"term": "제번스의 역설", "en": "Jevons Paradox", "def": "효율이 좋아져 단위 비용이 내려가면 사용량이 더 늘어 총소비가 증가하는 현상. AI 전력 수요 논리에 쓰인다.", "group": "저장·전력품질"}, {"term": "액화수수료(암묵적)", "en": "Implied Liquefaction Fee", "def": "스팟 판매가에서 HH 연동 원가를 뺀 값. 장기계약 수수료 $2.25~3.50 대비 스팟은 $6 이상으로 확대(2026).", "group": "가스·LNG"}], "facts": [], "desks": [{"key": "hub", "name": "전체", "url": "../index.html"}, {"key": "hc", "name": "헬스케어", "url": "../healthcare/index.html"}, {"key": "oilchem", "name": "정유·화학", "url": "../oilchem/index.html"}, {"key": "transition", "name": "에너지전환", "url": "../transition/index.html"}, {"key": "power", "name": "전력인프라", "url": "../power/index.html"}, {"key": "nuclear", "name": "원전", "url": "../nuclear/index.html"}, {"key": "metals", "name": "철강·비철", "url": "../metals/index.html"}]}</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const TAGC={'확인':'t-ok','추정':'t-warn','미확인':'t-alert','구자료':'t-dim'};
const tag=t=>!t?'':`<span class="tag ${TAGC[t]||'t-acc'}">${esc(t)}</span>`;
const tone=t=>t==='긍정'?'<span class="tag t-ok">긍정</span>':t==='부정'?'<span class="tag t-alert">부정</span>':'<span class="tag t-dim">중립</span>';
const uniq=a=>[...new Set(a.filter(Boolean))];
const M=D.meta;
document.title=M.short+' 리서치 데스크';
$('#b-eng').textContent=M.eng;$('#b-title').textContent=M.short;$('#b-sub').innerHTML=esc(M.subtitle)+(M.owner?`<br>${esc(M.owner)}`:'');
$('#foot').textContent=M.version;$('#cut').textContent='DATA CUT '+M.cut;$('#upd').textContent=M.updated?('UPDATED '+M.updated):'';
$('#desks').innerHTML='<div class="dl">SECTOR DESKS</div>'+(D.desks||[]).map(x=>`<a href="${esc(x.url)}"${/^https?:/.test(x.url)?' target="_blank" rel="noopener"':''}${x.key===M.key?' class="cur"':''}>${esc(x.name)}</a>`).join('');

let uid=0;
function chips(el,groups,cb,label='전체'){el.innerHTML=[label,...groups].map((g,i)=>`<button class="chip" aria-pressed="${i===0}" data-g="${esc(i?g:'')}">${esc(g)}</button>`).join('');el.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;el.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b.dataset.g);});}
const tableH=(cols,rows,cls='')=>`<div class="tw"><table class="${cls}"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' style="font-weight:600;color:var(--ink)"':''}>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const fmt=v=>{const a=Math.abs(v);return a>=1000?v.toLocaleString('ko-KR',{maximumFractionDigits:0}):a>=100?v.toFixed(0):a>=10?(+v.toFixed(1)).toString():(+v.toFixed(2)).toString();};
const barChart=b=>{const vs=b.items.map(i=>+i.v);const mx=Math.max(...vs,0),mn=Math.min(...vs,0);const span=(mx-mn)||1;const z=(-mn)/span*100;
 return `<div class="chart"><h4>${esc(b.title)}</h4><div class="u">단위 ${esc(b.unit)} · 빗금 = 추정</div><div class="bars">${b.items.map(i=>{const v=+i.v;const w=Math.abs(v)/span*100;const left=v>=0?z:z-w;return `<div class="bar"><span class="bl">${esc(i.l)}</span><span class="bt">${mn<0?`<span class="zero" style="left:${z}%"></span>`:''}<span class="bf${v<0?' neg':''}${i.tag==='추정'?' est':''}" style="left:${left}%;width:${Math.max(w,.6)}%"></span></span><span class="bv">${fmt(v)}</span></div>`;}).join('')}</div>${b.note?`<div class="cn">${md(b.note)}</div>`:''}</div>`;};
const dl=fields=>`<dl>${(fields||[]).map(f=>`<dt>${esc(f.k)}</dt><dd>${md(f.v)}</dd>`).join('')}</dl>`;

/* ---------- block renderers ---------- */
const B={
 p:b=>`<p class="note">${md(b.text)}</p>`,
 callout:b=>`<div class="callout ${b.tone==='warn'?'w':b.tone==='alert'?'r':''}">${b.title?`<b>${esc(b.title)}</b><br>`:''}${md(b.text)}</div>`,
 kpis:b=>`<div class="grid kg">${b.items.map(k=>`<div class="kpi"><span class="lab">${esc(k.lab)}</span><span class="val"${k.tag==='추정'?' style="color:var(--warn)"':k.tag==='미확인'?' style="color:var(--alert)"':''}>${esc(k.val)}</span><span class="cap">${md(k.cap)} ${tag(k.tag)}</span></div>`).join('')}</div>`,
 chain:b=>`<div class="flow">${b.items.map((c,i)=>(i?'<div class="farr">→</div>':'')+`<div class="fnode"><div class="n">${esc(c.no||'')}</div><div class="t">${esc(c.name)}</div></div>`).join('')}</div>`,
 cards:b=>`<div class="vc">${b.items.map(c=>`<div class="vcx"><div class="r">${esc(c.r||'')}</div><h4>${esc(c.h)}</h4><p>${md(c.p)}</p>${c.co?`<div class="co">${md(c.co)}</div>`:''}</div>`).join('')}</div>`,
 grid:b=>`<div class="grid ${b.cols===3?'g3':'g2'}">${b.items.map((c,i)=>`<div class="gcard"><h4>${b.numbered?`<span class="num-h">${i+1}</span>`:''}${esc(c.h)} ${c.tag?tag(c.tag):''}</h4>${(Array.isArray(c.p)?c.p:[c.p]).filter(Boolean).map(x=>`<p>${md(x)}</p>`).join('')}${c.list?`<ul>${c.list.map(x=>`<li>${md(x)}</li>`).join('')}</ul>`:''}</div>`).join('')}</div>`,
 table:b=>`${b.title?`<div class="tcap">${esc(b.title)}</div>`:''}${tableH(b.cols,b.rows)}${b.note?`<div class="tnote">${md(b.note)}</div>`:''}`,
 figure:b=>`<figure class="fig">${b.svg}${b.cap?`<figcaption>${md(b.cap)}</figcaption>`:''}</figure>`,
 steps:b=>`<div style="margin-top:6px">${b.items.map((s,i)=>`<div class="stage"><div class="col"><div class="dot">${esc(s.n||i+1)}</div></div><div class="content"><h4>${esc(s.h)}</h4>${s.meta&&s.meta.length?`<div class="meta">${s.meta.map(m=>`<span class="pill">${esc(m)}</span>`).join('')}</div>`:''}<p${s.meta&&s.meta.length?'':' style="margin-top:6px"'}>${md(s.p)}</p>${s.chk?`<div class="chk"><b>체크</b> ${md(s.chk)}</div>`:''}</div></div>`).join('')}</div>`,
 mods:b=>`<div class="mods">${b.items.map((x,i)=>`<details class="mod"${b.open&&i<b.open?' open':''}><summary><span class="mname">${esc(x.name)}</span>${x.en?`<span class="men">${esc(x.en)}</span>`:''}${x.pill?`<span class="pill">${esc(x.pill)}</span>`:''}${x.tag?tag(x.tag):''}</summary><div class="body">${x.lede?`<p class="dplede">${md(x.lede)}</p>`:''}${x.formula?`<div class="formula">${esc(x.formula)}</div>`:''}${(x.paras||[]).length?`<div class="dpn">${x.paras.map(p=>`<p>${md(p)}</p>`).join('')}</div>`:''}${x.fields?dl(x.fields):''}${x.table?`<div style="margin-top:14px">${tableH(x.table.cols,x.table.rows)}</div>`:''}${x.svg?`<figure class="fig">${x.svg}${x.cap?`<figcaption>${md(x.cap)}</figcaption>`:''}</figure>`:''}${(x.bullets||[]).length?`<ul class="dpul">${x.bullets.map(t=>`<li>${md(t)}</li>`).join('')}</ul>`:''}${x.kr?`<div class="dpkr"><span class="l">국내 연결점</span>${md(x.kr)}</div>`:''}</div></details>`).join('')}</div>`,
 bullets:b=>`<ul class="bb">${b.items.map(x=>`<li>${md(x)}</li>`).join('')}</ul>`,
 bars:b=>`<div class="grid g2">${b.charts.map(barChart).join('')}</div>`,
 timeline:b=>`<div class="tl">${b.items.map(t=>`<div class="tli ${t.tone==='긍정'?'pos':t.tone==='부정'?'neg':''}"><div class="d">${esc(t.date)}</div><h4>${esc(t.title)} ${t.tone?tone(t.tone):''}</h4><p>${md(t.body)}</p></div>`).join('')}</div>`,
 proscons:b=>`<div class="grid g2"><div class="card"><h4 style="color:var(--ok)">${esc(b.lt||'상방')}</h4><ul class="bb">${b.bull.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div><div class="card"><h4 style="color:var(--alert)">${esc(b.rt||'하방')}</h4><ul class="bb">${b.bear.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div></div>`,
 checklist:b=>`<div class="grid g2">${b.groups.map(a=>`<div class="card"><h4>${esc(a.area)}</h4><ul class="ck">${a.items.map(t=>{uid++;return `<li><input type="checkbox" id="ck${uid}"><label for="ck${uid}">${md(t)}</label></li>`;}).join('')}</ul></div>`).join('')}</div>`,
 brief:b=>`<div class="brief">${b.items.map(x=>`<div class="bi"><div class="k">${esc(x.k)}</div><p>${md(x.v)}</p></div>`).join('')}</div>`,
 dict:b=>{uid++;const id='dx'+uid;setTimeout(()=>{const L=b.items;let g='',q='';const draw=()=>{const R=L.filter(x=>(!g||x.group===g)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));document.getElementById(id+'c').textContent=R.length+'개';
   document.getElementById(id+'l').innerHTML=R.map(x=>`<details class="mod dcard"><summary><span class="mname">${esc(x.name)}</span>${x.en?`<span class="men">${esc(x.en)}</span>`:''}<span class="pill">${esc(x.group)}</span>${x.tag?tag(x.tag):''}</summary><div class="body">${x.tags&&x.tags.length?`<div class="dfl">${x.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div>`:''}${x.lede?`<p class="dplede">${md(x.lede)}</p>`:''}${dl(x.fields)}${x.table?`<div style="margin-top:14px">${tableH(x.table.cols,x.table.rows)}</div>`:''}${x.note?`<div class="dnote">${md(x.note)}</div>`:''}</div></details>`).join('');};
   chips(document.getElementById(id+'h'),uniq(L.map(x=>x.group)),x=>{g=x;draw();});document.getElementById(id+'q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();draw();});draw();},0);
   return `<div class="tools"><input class="search" id="${id}q" placeholder="${esc(b.placeholder||'검색')}"><span class="count" id="${id}c"></span></div><div class="chips" id="${id}h"></div><div class="mods" id="${id}l"></div>`;}
};
const renderBlocks=bs=>(bs||[]).map(b=>{const f=B[b.t];return f?`<div class="blk">${f(b)}</div>`:`<div class="blk"><div class="callout r">알 수 없는 블록: ${esc(b.t)}</div></div>`;}).join('');
const secH=s=>`<div class="sec"><h3>${esc(s.h)}${s.tag?' '+tag(s.tag):''}</h3>${s.note?`<p class="note">${md(s.note)}</p>`:''}${renderBlocks(s.blocks)}</div>`;

/* ---------- special tabs ---------- */
const SPECIAL={
 universe:(t)=>{const U=D.universe.slice().sort((a,b)=>(b.n||0)-(a.n||0));setTimeout(()=>{let g='',q='',m='';const kr=x=>/KOSPI|KOSDAQ|KONEX/.test(x.mkt);const nl=x=>/비상장|기타/.test(x.mkt);
  const draw=()=>{const L=U.filter(x=>(!g||x.seg===g)&&(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!m||(m==='KR'?kr(x):m==='NL'?nl(x):!kr(x)&&!nl(x))));$('#uni-c').textContent=L.length+'개사';
  $('#uni-t').innerHTML=`<div class="tw"><table><thead><tr><th>기업</th><th>시장</th><th>코드</th><th>하위섹터</th><th>사업</th><th>핵심 포인트</th><th>언급</th></tr></thead><tbody>${L.map(x=>`<tr><td class="nm">${esc(x.name)}</td><td><span class="pill">${esc(x.mkt)}</span></td><td class="tk">${esc(x.code)}</td><td style="font-size:12.5px;color:var(--ink-3);min-width:110px">${esc(x.seg)}</td><td style="min-width:220px">${md(x.biz)}</td><td style="min-width:280px">${md(x.point)}</td><td class="num">${x.n||''}</td></tr>`).join('')}</tbody></table></div>`;};
  chips($('#uni-ch'),uniq(U.map(x=>x.seg)),x=>{g=x;draw();});$('#uni-q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();draw();});$('#uni-m').addEventListener('change',e=>{m=e.target.value;draw();});draw();},0);
  return `<div class="tools"><input class="search" id="uni-q" placeholder="기업·사업 검색"><select class="search" id="uni-m"><option value="">전체 시장</option><option value="KR">국내(KOSPI·KOSDAQ)</option><option value="GL">해외</option><option value="NL">비상장·기타</option></select><span class="count" id="uni-c"></span></div><div class="chips" id="uni-ch"></div><div id="uni-t"></div>`;},
 calendar:(t)=>{const C=D.calendar.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));const cut=M.cut;const up=C.filter(x=>String(x.date)>=cut.slice(0,String(x.date).length)),past=C.filter(x=>!up.includes(x)).reverse();
  const row=(x,p)=>`<div class="evt${p?' past':''}"><div class="d">${esc(x.date)}</div><div><div class="n">${esc(x.event)} <span class="pill">${esc(x.type)}</span></div><div class="m">${md(x.why)}</div></div></div>`;
  return `<div class="grid g2" style="margin-top:20px;align-items:start"><div class="card"><h4>예정 (${up.length})</h4>${up.map(x=>row(x)).join('')}</div><div class="card"><h4>지나간 핵심 이벤트 (${past.length})</h4>${past.map(x=>row(x,1)).join('')}</div></div>`;},
 facts:(t)=>{if(M.public)return `<div class="callout" style="margin-top:18px">공개판에서는 원수치 데이터베이스를 제외했다. 핵심 수치는 각 탭 안에 확인·추정 태그와 함께 들어 있다.</div>`;const F=D.facts;setTimeout(()=>{let g='',q='',lim=200;const draw=()=>{const L=F.filter(x=>(!g||x.tag===g)&&(!q||(x.k+' '+x.v+' '+x.unit+' '+x.src+' '+x.asof).toLowerCase().includes(q)));$('#f-c').textContent=L.length.toLocaleString()+'개';
  $('#f-t').innerHTML=`<div class="tw"><table><thead><tr><th>항목</th><th>값</th><th>단위</th><th>시점</th><th>원출처</th><th>태그</th><th>발행</th></tr></thead><tbody>${L.slice(0,lim).map(x=>`<tr><td style="min-width:240px">${esc(x.k)}</td><td class="num"><b>${esc(x.v)}</b></td><td class="tk">${esc(x.unit)}</td><td class="tk">${esc(x.asof)}</td><td style="font-size:12.5px;color:var(--ink-3)">${esc(x.src)}</td><td>${tag(x.tag)}</td><td class="tk">${esc(x.date)}</td></tr>`).join('')}</tbody></table></div>`;$('#f-m').hidden=L.length<=lim;};
  chips($('#f-ch'),['확인','추정','미확인'],x=>{g=x;lim=200;draw();});$('#f-q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();lim=200;draw();});$('#f-m').addEventListener('click',()=>{lim+=300;draw();});draw();},0);
  return `<div class="tools"><input class="search" id="f-q" placeholder="키워드 (예: 마진, 캐파, 2027)"><span class="count" id="f-c"></span></div><div class="chips" id="f-ch"></div><div id="f-t"></div><button class="more" id="f-m" hidden>더 보기</button>`;},
 glossary:(t)=>{const G=D.glossary.slice().sort((a,b)=>a.term.localeCompare(b.term,'ko'));setTimeout(()=>{let g='',q='';const draw=()=>{const L=G.filter(x=>(!g||x.group===g)&&(!q||(x.term+x.en+x.def).toLowerCase().includes(q)));$('#g-c').textContent=L.length+'개';
  $('#g-t').innerHTML=`<div class="tw"><table><thead><tr><th>용어</th><th>영문·약어</th><th>정의</th><th>분류</th></tr></thead><tbody>${L.map(x=>`<tr><td class="nm">${esc(x.term)}</td><td class="tk">${esc(x.en)}</td><td style="min-width:320px">${md(x.def)}</td><td style="font-size:12px;color:var(--ink-3);white-space:nowrap">${esc(x.group)}</td></tr>`).join('')}</tbody></table></div>`;};
  chips($('#g-ch'),uniq(G.map(x=>x.group)),x=>{g=x;draw();});$('#g-q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();draw();});draw();},0);
  return `<div class="tools"><input class="search" id="g-q" placeholder="용어 검색"><span class="count" id="g-c"></span></div><div class="chips" id="g-ch"></div><div id="g-t"></div>`;}
};

/* ---------- build nav + panes ---------- */
let nav='',panes='',n=0;const NUM={};
D.nav.forEach(gr=>{nav+=`<div class="nav-group">${esc(gr.group)}</div>`;gr.tabs.forEach(id=>{const t=D.tabs[id];if(!t)return;n++;const k=String(n).padStart(2,'0');NUM[id]=k;nav+=`<button data-p="${id}"><span class="k">${k}</span>${esc(t.title)}</button>`;panes+=`<section class="pane" id="p-${id}"></section>`;});});
$('#nav').innerHTML=nav;$('#panes').innerHTML=panes;
Object.keys(NUM).forEach(id=>{const t=D.tabs[id];let h=`<div class="eyebrow">${NUM[id]} — ${esc(t.en||'')}</div><h2>${esc(t.h2||t.title)}</h2>${t.lede?`<p class="lede">${md(t.lede)}</p>`:''}`;
 if(t.special&&SPECIAL[t.special]){h+=`${(t.sections||[]).filter(s=>s.before).map(secH).join('')}`+SPECIAL[t.special](t)+(t.sections||[]).filter(s=>!s.before).map(secH).join('');}
 else h+=(t.sections||[]).map(secH).join('');
 document.getElementById('p-'+id).innerHTML=h;});

const show=id=>{if(!document.getElementById('p-'+id))id=Object.keys(NUM)[0];document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+id));document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.p===id));};
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;show(b.dataset.p);try{history.replaceState(null,'','#'+b.dataset.p)}catch(_){}window.scrollTo(0,0);});
show((location.hash||'#').slice(1));
const root=document.documentElement;const setT=t=>{root.setAttribute('data-theme',t);document.querySelectorAll('.tsb').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));try{localStorage.setItem('desk-theme',t)}catch(_){}};
document.querySelectorAll('.tsb').forEach(b=>b.addEventListener('click',()=>setT(b.dataset.t)));
try{const t=localStorage.getItem('desk-theme');if(t)setT(t);}catch(_){}
})();
</script>

</html>
