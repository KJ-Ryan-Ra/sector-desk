ty=\".85\">미국 태양광 PPA 5년간 2배+ (LevelTen)<\/text><text x=\"30\" y=\"312\" font-size=\"11\" fill-opacity=\".85\">재계약 시 +$14~40/MWh (NextEra)<\/text><text x=\"335\" y=\"26\" font-size=\"12\" font-weight=\"600\">② CfD — 정부가 차액을 정산<\/text><line x1=\"350\" y1=\"220\" x2=\"610\" y2=\"220\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.2\"/><line x1=\"350\" y1=\"54\" x2=\"350\" y2=\"220\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.2\"/><text x=\"610\" y=\"236\" font-size=\"10.5\" text-anchor=\"end\" fill-opacity=\".7\">시간<\/text><text x=\"354\" y=\"64\" font-size=\"10.5\" fill-opacity=\".7\">도매가<\/text><path d=\"M350 140 L350 186 L380 166 L410 140 Z\" fill-opacity=\".28\" stroke=\"currentColor\" stroke-opacity=\"0\" stroke-width=\"1.4\" style=\"fill:var(--ok)\"/><path d=\"M410 140 L440 110 L470 98 L495 140 Z\" fill-opacity=\".28\" stroke=\"currentColor\" stroke-opacity=\"0\" stroke-width=\"1.4\" style=\"fill:var(--warn)\"/><path d=\"M495 140 L525 172 L555 192 L580 140 Z\" fill-opacity=\".28\" stroke=\"currentColor\" stroke-opacity=\"0\" stroke-width=\"1.4\" style=\"fill:var(--ok)\"/><path d=\"M580 140 L610 118 L610 140 Z\" fill-opacity=\".28\" stroke=\"currentColor\" stroke-opacity=\"0\" stroke-width=\"1.4\" style=\"fill:var(--warn)\"/><path d=\"M350 186 L380 166 L410 140 L440 110 L470 98 L495 140 L525 172 L555 192 L580 140 L610 118\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".8\" stroke-width=\"1.6\"/><line x1=\"350\" y1=\"140\" x2=\"610\" y2=\"140\" stroke=\"currentColor\" stroke-opacity=\".95\" stroke-width=\"2\" style=\"stroke:var(--accent)\"/><line x1=\"530\" y1=\"66\" x2=\"548\" y2=\"66\" stroke=\"currentColor\" stroke-opacity=\".95\" stroke-width=\"2\" style=\"stroke:var(--accent)\"/><text x=\"552\" y=\"70\" font-size=\"10.5\" font-weight=\"600\" style=\"fill:var(--accent)\">행사가(낙찰가)<\/text><text x=\"455\" y=\"86\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">발전사 → 환급<\/text><text x=\"530\" y=\"208\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--ok)\">정부 → 차액 지급<\/text><text x=\"335\" y=\"272\" font-size=\"11\" fill-opacity=\".85\">영국 AR7: 해상 상한 £102→113/MWh<\/text><text x=\"335\" y=\"292\" font-size=\"11\" fill-opacity=\".85\">계약 15→20년 · 예산 9억→18억 파운드<\/text><text x=\"335\" y=\"312\" font-size=\"11\" fill-opacity=\".85\" style=\"fill:var(--accent)\">→ 매출 변동성↓ = 요구수익률↓<\/text><text x=\"650\" y=\"26\" font-size=\"12\" font-weight=\"600\">③ 한국 — RPS에서 계약시장으로<\/text><rect x=\"665\" y=\"44\" width=\"250\" height=\"44\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"790\" y=\"62\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">RPS (의무공급)<\/text><text x=\"790\" y=\"78\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">SMP + REC 현물 = 가격 변동<\/text><line x1=\"790\" y1=\"90\" x2=\"790\" y2=\"118\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr9)\"/><text x=\"798\" y=\"108\" font-size=\"10.5\" fill-opacity=\".85\">신재생법 개정 2026.8<\/text><rect x=\"665\" y=\"120\" width=\"250\" height=\"44\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--accent)\"/><text x=\"790\" y=\"138\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">경쟁입찰 계약시장<\/text><text x=\"790\" y=\"154\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">장기 고정가 · 2027년 개시<\/text><line x1=\"790\" y1=\"166\" x2=\"790\" y2=\"194\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr9)\"/><text x=\"798\" y=\"184\" font-size=\"10.5\" fill-opacity=\".85\">신규 REC 발급 중단 2027<\/text><rect x=\"665\" y=\"196\" width=\"250\" height=\"44\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"790\" y=\"214\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">REC 현물시장 폐지<\/text><text x=\"790\" y=\"230\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">2029년 말<\/text><text x=\"650\" y=\"272\" font-size=\"11\" fill-opacity=\".85\">기업 PPA 170~180원/kWh vs 입찰 상한가<\/text><text x=\"650\" y=\"292\" font-size=\"11\" fill-opacity=\".85\">→ 격차가 크면 사업자는 PPA로 이동<\/text><text x=\"650\" y=\"312\" font-size=\"11\" fill-opacity=\".85\">RPS 이행비용 587억(2012)→4.4조원(2025)<\/text><\/svg>", "cap": "세 계약은 모두 **도매가격 변동 위험을 누가 지느냐**를 정한다. PPA는 구매자가 고정가를 보장하고, CfD는 시장가가 행사가보다 낮으면 정부가 차액을 메우고 높으면 발전사가 환급한다. 한국은 SMP+REC(변동)의 RPS에서 장기 고정가 계약시장으로 넘어가 사업자의 요구수익률이 낮아질 여지가 생겼다. 다만 입찰 상한가가 기업 PPA(170~180원/kWh)보다 낮으면 사업자는 PPA로 이동한다."}, {"t": "table", "cols": ["구조", "가격 결정", "가격 위험 부담", "기간", "수치·사례"], "rows": [["기업·유틸리티 PPA", "구매자와 고정가 협상", "구매자", "10~20년", "미국 기업 청정에너지 PPA 29.5GW 중 태양광 66%(2025, BNEF)"], ["CfD(차액결제)", "경매 낙찰 행사가", "정부(차액 정산)", "영국 AR7 15→20년", "AR7 해상 상한 £102→113/MWh, 낙찰 8.4GW"], ["RPS + REC(한국)", "SMP + REC 현물", "발전사업자", "변동", "RPS 이행비용 587억원(2012)→4.4조원(2025)"], ["경쟁입찰 계약시장(한국)", "입찰 장기 고정가", "제도(장기 계약)", "장기(2027 개시)", "신규 REC 2027 발급 중단, 현물시장 2029말 폐지"], ["머천트(도매 판매)", "SMP·도매가", "발전사업자", "없음", "SMP 결정 비중 LNG 83%(2025) — 가스값에 연동"]], "title": "수익 계약 구조 비교"}]}, {"h": "세액공제 계산 — ITC·PTC·AMPC가 이익에 들어가는 길", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 390\" role=\"img\" aria-label=\"미국 보조금은 제조사(AMPC)와 발전 사업자(ITC·PTC)로 나뉘어 흐르며 둘 다 PFE·MACR 관문을 통과해야 한다\"><defs><marker id=\"a-tr10\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><text x=\"30\" y=\"24\" font-size=\"12\" font-weight=\"600\" style=\"fill:var(--accent)\">제조 단계 — 45X AMPC<\/text><text x=\"930\" y=\"24\" font-size=\"12\" text-anchor=\"end\" font-weight=\"600\" style=\"fill:var(--accent)\">발전 단계 — 48E ITC · 45Y PTC<\/text><rect x=\"30\" y=\"42\" width=\"370\" height=\"50\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"215\" y=\"64\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">미국 내 생산<\/text><text x=\"215\" y=\"78\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">셀·모듈·배터리·인버터·타워<\/text><line x1=\"215\" y1=\"94\" x2=\"215\" y2=\"118\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr10)\"/><rect x=\"30\" y=\"120\" width=\"370\" height=\"50\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--warn)\"/><text x=\"215\" y=\"142\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">관문: PFE · MACR<\/text><text x=\"215\" y=\"156\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">비중국 비율: 태양광 부품 50%→85%, 배터리 60%→85%<\/text><line x1=\"215\" y1=\"172\" x2=\"215\" y2=\"196\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr10)\"/><rect x=\"30\" y=\"198\" width=\"370\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--accent)\"/><text x=\"215\" y=\"222\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">AMPC 수취(생산량 비례)<\/text><text x=\"215\" y=\"238\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">셀 $0.04/W · 모듈 $0.07/W · 배터리 셀 $35/kWh<\/text><line x1=\"150\" y1=\"256\" x2=\"125\" y2=\"290\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr10)\"/><line x1=\"280\" y1=\"256\" x2=\"305\" y2=\"290\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr10)\"/><rect x=\"30\" y=\"292\" width=\"180\" height=\"50\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"120\" y=\"314\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">제조사 이익<\/text><text x=\"120\" y=\"328\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">영업이익에 직접 가산<\/text><rect x=\"220\" y=\"292\" width=\"180\" height=\"50\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"310\" y=\"314\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">고객과 공유<\/text><text x=\"310\" y=\"328\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">ESS 판가 인하로 반영<\/text><text x=\"30\" y=\"368\" font-size=\"11\" style=\"fill:var(--alert)\">풍력 부품 2027년 말 종료 · 전체 2033년 폐지<\/text><rect x=\"560\" y=\"42\" width=\"370\" height=\"50\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"745\" y=\"64\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">발전 프로젝트 CAPEX<\/text><text x=\"745\" y=\"78\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">모듈·배터리 구매 + EPC<\/text><line x1=\"745\" y1=\"94\" x2=\"745\" y2=\"118\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr10)\"/><rect x=\"560\" y=\"120\" width=\"116\" height=\"50\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--warn)\"/><text x=\"618\" y=\"142\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">착공 기한<\/text><text x=\"618\" y=\"156\" font-size=\"10\" text-anchor=\"middle\" fill-opacity=\".78\">태양광·풍력 2026.7.4<\/text><rect x=\"687\" y=\"120\" width=\"116\" height=\"50\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--warn)\"/><text x=\"745\" y=\"142\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">임금·도제(PWA)<\/text><text x=\"745\" y=\"156\" font-size=\"10\" text-anchor=\"middle\" fill-opacity=\".78\">충족 30% / 미충족 6%<\/text><rect x=\"814\" y=\"120\" width=\"116\" height=\"50\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--warn)\"/><text x=\"872\" y=\"142\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">PFE · MACR<\/text><text x=\"872\" y=\"156\" font-size=\"10\" text-anchor=\"middle\" fill-opacity=\".78\">ESS 55%→75%<\/text><line x1=\"745\" y1=\"172\" x2=\"745\" y2=\"196\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr10)\"/><rect x=\"560\" y=\"198\" width=\"370\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--accent)\"/><text x=\"745\" y=\"222\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">ITC 30% (또는 PTC $/MWh)<\/text><text x=\"745\" y=\"238\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">국산 부품 가산(DCA) +10%p · 에너지 커뮤니티 +10%p<\/text><line x1=\"680\" y1=\"256\" x2=\"655\" y2=\"290\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr10)\"/><line x1=\"810\" y1=\"256\" x2=\"835\" y2=\"290\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr10)\"/><rect x=\"560\" y=\"292\" width=\"180\" height=\"50\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"650\" y=\"314\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">공제액 양도<\/text><text x=\"650\" y=\"328\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">세금 대신 현금화<\/text><rect x=\"750\" y=\"292\" width=\"180\" height=\"50\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"840\" y=\"314\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">자기 사용<\/text><text x=\"840\" y=\"328\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">프로젝트 IRR 상승<\/text><text x=\"930\" y=\"368\" font-size=\"11\" text-anchor=\"end\" style=\"fill:var(--alert)\">태양광·풍력은 2027년 말 준공분까지 · ESS는 2033년까지 유지<\/text><line x1=\"558\" y1=\"67\" x2=\"402\" y2=\"67\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\" style=\"stroke:var(--accent)\" marker-end=\"url(#a-tr10)\"/><text x=\"480\" y=\"52\" font-size=\"10.5\" text-anchor=\"middle\" style=\"fill:var(--accent)\">DCA 가산 위해<\/text><text x=\"480\" y=\"86\" font-size=\"10.5\" text-anchor=\"middle\" style=\"fill:var(--accent)\">미국산 구매<\/text><text x=\"480\" y=\"102\" font-size=\"10.5\" text-anchor=\"middle\" style=\"fill:var(--accent)\">= 판가 프리미엄<\/text><\/svg>", "cap": "미국 보조금은 두 갈래로 흐른다. **제조사는 AMPC(45X)**를 생산량에 비례해 받아 영업이익에 더하고, **발전 사업자는 ITC(48E)나 PTC(45Y)**를 받아 IRR을 높이거나 양도해 현금화한다. 둘 다 PFE·MACR 관문을 통과해야 하며, 발전 사업자가 국산 부품 가산(DCA +10%p)을 받으려고 미국산을 사면서 제조사 판가에 프리미엄이 얹힌다."}, {"t": "mods", "items": [{"name": "ITC(48E) — 설비비에 비례", "en": "Investment Tax Credit", "formula": "ITC = 적격 설비비(CAPEX) × [기본 6% 또는 PWA 충족 30%] (+ 국산 부품 DCA 10%p, 에너지 커뮤니티 10%p)", "paras": ["준공 시점에 설비비의 일정 비율을 법인세에서 한 번에 공제한다. 임금·도제(PWA) 요건을 충족하면 30%, 미충족이면 6%다. 태양광·ESS처럼 CAPEX가 크고 이용률이 낮은 설비는 ITC가, 이용률이 높은 설비는 발전량 비례 PTC가 유리한 경우가 많다.", "OBBBA 이후 태양광·풍력은 2026.7.4 전 착공(4년 내 준공) 또는 2027년 말 전 준공분만 받을 수 있고, ESS는 2033년까지 유지되되 PFE·MACR 관문이 붙었다. 연료전지는 2026.1.1 착공분부터 배출 요건 없이 30%(보너스 가산은 미적용)다."], "fields": [{"k": "예시 계산", "v": "ESS 시스템가 $250~300/kWh × 30% = **$75~90/kWh** — 중국산 셀로 MACR에 미달하면 이 금액을 통째로 잃는다."}, {"k": "프리미엄 연결", "v": "DCA(+10%p)를 받으려면 미국산 부품을 써야 해, 발전 사업자가 미국산 모듈에 약 10% 또는 $0.10/W 이상 웃돈을 낼 유인이 생긴다(업계 추정)."}]}, {"name": "PTC(45Y) — 발전량에 비례", "en": "Production Tax Credit", "formula": "PTC = 발전량(MWh) × 단위 공제액($/MWh) × 공제 기간", "paras": ["설비비가 아니라 실제 발전량에 공제가 붙어 이용률이 높은 풍력에 유리하다. 공제액은 발전 실적이 쌓이는 만큼 매년 발생하므로 프로젝트 현금흐름을 평탄하게 만든다. ITC와 PTC는 택일이다.", "원전은 45U(기존 원전, 2032년 유지)와 45Y(2033년 착공분 100%)로 별도 트랙이 남았다."], "fields": [{"k": "확인할 것", "v": "프로젝트가 ITC·PTC 중 무엇을 택했는지, 공제액을 직접 쓰는지 양도(현금화)하는지에 따라 IRR과 세후 현금흐름이 달라진다."}]}, {"name": "AMPC(45X) — 제조사의 생산 보조금", "en": "Advanced Manufacturing Production Credit", "formula": "AMPC = 미국 내 생산·판매량 × 부품별 단가 (셀 약 $0.04/W, 모듈 약 $0.07/W, 배터리 셀 $35/kWh 등)", "paras": ["발전 사업자가 아니라 **제조사**가 받는다. 생산량에 비례하므로 공장 가동률이 곧 공제액이고, 영업이익에 직접 더해진다. 시장은 AMPC 포함 이익과 제외 이익을 구분해 본다.", "OBBBA는 AMPC를 유지하되 2033년 폐지(풍력 부품은 2027년 말 종료)로 정했고, PFE 관문(태양광 부품 비중국 비율 50%→85%, 배터리 60%→85%)을 붙였다. ESS 셀 AMPC는 고객과 일부를 나누는 것이 관행이라 실질 판가를 낮추는 데 쓰인다."], "fields": [{"k": "예시 계산", "v": "배터리 셀 10GWh를 미국에서 생산하면 $35/kWh × 10,000,000kWh = **$3.5억** (단순 계산). 한화솔루션 AMPC는 2026년 약 9,027억원, 2027년 약 1.2조원으로 추정됐다(업계 추정)."}, {"k": "프리미엄 상한", "v": "미국 셀 제조사는 셀 AMPC(약 $0.04/W) × 폴리 1kg당 셀 출력(400~500W) ≈ **$16~20/kg**까지 비중국 폴리에 웃돈을 줄 수 있다. 비중국 폴리 약 $17/kg vs 중국산 $6~7/kg(2026.3)과 정합한다."}]}], "open": 1}]}, {"h": "디벨로퍼와 IPP — 같은 발전소, 다른 돈", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 340\" role=\"img\" aria-label=\"디벨로퍼는 위험이 가장 높은 앞단에서 개발이익을, IPP는 준공 후 장기 계약 현금흐름을 가져간다\"><defs><marker id=\"a-tr11\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"20\" y=\"200\" width=\"118\" height=\"40\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"79\" y=\"224\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">부지 확보<\/text><line x1=\"140\" y1=\"220\" x2=\"152\" y2=\"220\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr11)\"/><rect x=\"154\" y=\"200\" width=\"118\" height=\"40\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"213\" y=\"224\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">인허가<\/text><line x1=\"274\" y1=\"220\" x2=\"286\" y2=\"220\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr11)\"/><rect x=\"288\" y=\"200\" width=\"118\" height=\"40\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--accent)\"/><text x=\"347\" y=\"224\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">계통 연결권<\/text><line x1=\"408\" y1=\"220\" x2=\"420\" y2=\"220\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr11)\"/><rect x=\"422\" y=\"200\" width=\"118\" height=\"40\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"481\" y=\"224\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">PPA·PF<\/text><line x1=\"542\" y1=\"220\" x2=\"554\" y2=\"220\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr11)\"/><rect x=\"556\" y=\"200\" width=\"118\" height=\"40\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"615\" y=\"224\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">착공(NTP)<\/text><line x1=\"676\" y1=\"220\" x2=\"688\" y2=\"220\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr11)\"/><rect x=\"690\" y=\"200\" width=\"118\" height=\"40\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"749\" y=\"224\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">준공(COD)<\/text><line x1=\"810\" y1=\"220\" x2=\"822\" y2=\"220\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr11)\"/><rect x=\"824\" y=\"200\" width=\"118\" height=\"40\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"883\" y=\"224\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">운영 20~30년<\/text><path d=\"M79 170 L213 153 L347 121 L481 97 L615 86 L749 64 L883 52\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".95\" stroke-width=\"2.2\" style=\"stroke:var(--accent)\"/><path d=\"M79 55 L213 72 L347 103 L481 125 L615 136 L749 162 L883 170\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".9\" stroke-width=\"2\" stroke-dasharray=\"5 3\" style=\"stroke:var(--alert)\"/><circle cx=\"79\" cy=\"170\" r=\"4\" stroke=\"currentColor\" stroke-opacity=\".3\" style=\"fill:var(--accent)\"/><circle cx=\"213\" cy=\"153\" r=\"4\" stroke=\"currentColor\" stroke-opacity=\".3\" style=\"fill:var(--accent)\"/><circle cx=\"347\" cy=\"121\" r=\"4\" stroke=\"currentColor\" stroke-opacity=\".3\" style=\"fill:var(--accent)\"/><circle cx=\"481\" cy=\"97\" r=\"4\" stroke=\"currentColor\" stroke-opacity=\".3\" style=\"fill:var(--accent)\"/><circle cx=\"615\" cy=\"86\" r=\"4\" stroke=\"currentColor\" stroke-opacity=\".3\" style=\"fill:var(--accent)\"/><circle cx=\"749\" cy=\"64\" r=\"4\" stroke=\"currentColor\" stroke-opacity=\".3\" style=\"fill:var(--accent)\"/><circle cx=\"883\" cy=\"52\" r=\"4\" stroke=\"currentColor\" stroke-opacity=\".3\" style=\"fill:var(--accent)\"/><text x=\"87\" y=\"186\" font-size=\"11\" font-weight=\"600\" style=\"fill:var(--accent)\">자산 가치<\/text><text x=\"59\" y=\"45\" font-size=\"11\" font-weight=\"600\" style=\"fill:var(--alert)\">사업 위험<\/text><line x1=\"548\" y1=\"36\" x2=\"548\" y2=\"290\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><text x=\"548\" y=\"30\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">매각 시점: 디벨로퍼 → IPP·빅테크<\/text><path d=\"M20 256 V262 H540 V256\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\"/><text x=\"280\" y=\"282\" font-size=\"11\" text-anchor=\"middle\">디벨로퍼: 개발이익(MW당 매각) · 인도 기준 매출 → 분기 변동 큼<\/text><path d=\"M556 256 V262 H942 V256\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\"/><text x=\"749\" y=\"282\" font-size=\"11\" text-anchor=\"middle\">IPP: PPA 현금흐름 · CAFD·FFO로 평가<\/text><text x=\"20\" y=\"314\" font-size=\"11\" style=\"fill:var(--accent)\">매각 가정 태양광 약 1억원/MW · ESS 약 1.5억원/MW (업계 추정)<\/text><text x=\"940\" y=\"314\" font-size=\"11\" text-anchor=\"end\" style=\"fill:var(--accent)\">무차입 수익률 11~13% (Enlight, 2025) · 재계약 +$14~40/MWh<\/text><text x=\"940\" y=\"332\" font-size=\"10\" text-anchor=\"end\" fill-opacity=\".6\">곡선은 개념도(축척 아님)<\/text><\/svg>", "cap": "프로젝트 가치는 부지→인허가→**계통 연결권**→PPA·PF를 지나며 계단식으로 오르고 위험은 내려간다. 디벨로퍼는 착공 직전(ready-to-build)에 팔아 개발이익을 얻고(태양광 약 1억원/MW, ESS 약 1.5억원/MW 매각 가정, 업계 추정), IPP는 준공 후 20~30년 운영 현금흐름을 가져간다. 개발 완료 부지가 희소해지며 Alphabet의 Intersect 인수(47.5억달러) 같은 빅테크 직접 인수가 나왔다."}, {"t": "table", "cols": ["유형", "사업 영역", "수익 구조", "위험/수익 특성", "예시"], "rows": [["디벨로퍼", "초기 개발(그린필드)", "개발 완료 후 매각, 현금 회수·재투자", "고수익·고위험", "OCI Energy, Recurrent Energy, Apex, Intersect, 삼성물산"], ["운영 중심 IPP(YieldCo)", "개발·건설 완료 자산 운영", "저위험 자산 인수 후 발전 수익", "안정성", "Clearway Energy, NextEra Energy"], ["통합형 IPP", "개발+건설+운영", "개발이익+운영 수익", "수익성·안정성 균형", "Brookfield Renewable, Enlight, Invenergy"]], "title": "미국 재생에너지 개발·운영 사업 모델", "note": "각 사"}]}, {"h": "IRR 민감도 — 무엇이 1%p를 움직이나", "blocks": [{"t": "table", "cols": ["변수", "방향", "크기(추정 수치)", "읽는 법"], "rows": [["금리(WACC)", "↑ → LCOE↑·IRR↓", "WACC 4.2%→10% 시 해상풍력 LCOE $105→163/MWh(Lazard)", "자본비형 전원의 1순위 변수"], ["PF 금리", "↓ → IRR↑", "100bp 하락 시 해상풍력 IRR +1.5~2.0%p, FID 6~12개월 앞당김(업계 추정)", "PF 부채비율 70~80%라 레버리지 큼"], ["판매단가(PPA)", "↑ → IRR↑", "미국 태양광 PPA 5년간 2배+, 재계약 +$14~40/MWh", "운영 IPP는 추가 투자 없이 수익 상승"], ["설치비", "↑ → IRR↓", "미국 태양광 설치비 2025 +14% YoY(IRENA·SEIA)", "관세·인건비가 원가를 올림"], ["이용률·출력제어", "↓ → IRR↓", "정성(계통 포화 지역 출력제어 상시화)", "국내 호남·제주 리스크"], ["공기 지연", "↑ → IRR↓", "국내 풍력 인허가 평균 71개월", "특별법 전후 개발기간 비교 필요"], ["연료비(비교: 가스)", "±25% → 가스 LCOE ±10%(Lazard)", "재생에너지는 연료비 민감도 0", "가스 대비 가격 확정성의 근거"]], "title": "IRR 민감도 — 무엇이 1%p를 움직이나"}, {"t": "table", "cols": ["단계", "1차 영향", "사업자 대응", "확인지표"], "rows": [["운영 중", "자산가치 하락·차환비용 상승", "만기 연장, 고정금리 유지, 지분 매각", "고정금리 비중, 물가연동"], ["FID·PF 완료", "NAV·기대 ROE 하락", "공사 지속, CAPEX 절감, 추가 헤지", "손상차손, 공정률"], ["계약 확보·FID 이전", "대출가능액 감소, 자기자본 증가", "FID 지연, 파트너 유치, 재협상", "PF 종결, IRR, farm-down"], ["신규 입찰", "요구 낙찰가 상승", "고가 입찰 또는 포기", "상한가, 계약기간, 물가연동"], ["기자재 발주", "확정발주 전환 지연", "생산계획 조정, 수주 선별", "확정수주, book-to-bill"]], "title": "금리 상승이 프로젝트 단계별로 번지는 경로", "note": "업계 자료 정리. 같은 금리 충격도 FID 이전은 \"지연\", 이후는 \"손상차손\"으로 나타난다."}]}, {"h": "계산 틀 10가지", "blocks": [{"t": "mods", "items": [{"name": "자본비형 전원의 LCOE와 프로젝트 IRR", "formula": "LCOE = (CAPEX × 자본회수계수(WACC, 수명) + 연간 O&M) ÷ 연간 발전량 / IRR은 판매단가(PPA·CfD·입찰가) × 발전량 − O&M − 출력제한·공기지연 손실로 계산한 현금흐름의 내부수익률", "paras": ["태양광·풍력은 연료비가 없고 LCOE의 85~88%가 초기 투자 회수분이다. 그래서 가스·석탄(원가의 40~60%가 연료비)과 달리 건설 시점에 15~20년 가격을 약속할 수 있고, 빅테크가 PPA로 전력 원가를 고정하는 이유가 된다. 반대로 금리가 오르면 같은 설비의 LCOE가 급등한다. LCOE는 발전원 간 비교 지표일 뿐이고, 실제 투자 결정(FID)은 IRR이 요구수익률(WACC + 150~300bp)을 넘는지로 난다."], "fields": [{"k": "민감도", "v": "WACC 4.2%→10% 시 해상풍력 LCOE $105→163/MWh(Lazard). 해상풍력은 PF 부채비율 70~80%라 금리 100bp 하락 시 IRR 1.5~2.0%p 개선, FID 6~12개월 앞당김(업계 추정)."}, {"k": "숫자 예시", "v": "2025 LCOE: 육상풍력 $37~99, 해상풍력 $105~167/MWh(Lazard), 미국 태양광 $58/MWh(2011 대비 -63%). 태양광+4h ESS $76 vs 가스복합 $79/MWh. Enlight 프로젝트 무차입 수익률 1Q25 11~12% → 4Q25 12~13%."}]}, {"name": "미국향 태양광 모듈 제조 마진", "formula": "모듈 ASP ≈ 중국 FOB 바닥가 + 규제 프리미엄(UFLPA·AD/CVD·232·PFE) + 국산화 프리미엄(DCA) / 영업이익 = (ASP − 제조원가) × 출하량 + AMPC(셀 4센트/W, 모듈 7센트/W 등)", "paras": ["미국 시장은 중국산이 규제로 막혀 있어 가격이 '중국 가격 + 규제 비용'으로 형성된다. 여기에 미국 내 생산 부품에 주는 AMPC(45X)가 제조사 이익으로 직접 들어오므로, 시장은 AMPC를 포함한 이익과 제외한 이익을 구분해 본다. 프리미엄은 고객이 ITC를 받기 위해 비중국·미국산을 사야 하는 데서 나오므로, ITC가 사라지는 2028년 이후에는 추가 관세(Section 232) 없이는 유지가 어렵다는 것이 핵심 리스크다."], "fields": [{"k": "민감도", "v": "중국 FOB가 $0.09→$0.12/W로 오르면 비중국 모듈 가격 하한도 함께 상승. DCA(+10%p ITC) 충족 미국산 모듈은 시장가 대비 약 10% 또는 $0.10/W 이상 프리미엄 추정."}, {"k": "숫자 예시", "v": "2026.3 미국 모듈: 수입 $0.28, 미국산(수입셀) $0.36, 미국산(미국셀) $0.49/W. 한화솔루션 AMPC 추정치 2026년 약 9,000억~9,500억원, 2027년 약 1.2조원. 미국 내 모듈 설비 65GW지만 셀 자급 캐파가 작아 가동률 47%(2025, SEIA)."}]}, {"name": "비중국 폴리실리콘 프리미엄의 상한", "formula": "지불 가능 프리미엄 ≈ 폴리 1kg으로 만드는 셀 출력(400~500W) × 셀 AMPC(약 $0.04/W) ≈ $16~20/kg", "paras": ["미국 셀 제조사가 AMPC를 받으려면 2026년부터 Non-PFE 재료 비중 50%를 넘겨야 하고, 셀이 모듈 원가의 53~66%라 폴리·웨이퍼까지 비중국산이어야 한다. 셀 업체는 AMPC로 받는 돈만큼 비중국 폴리에 웃돈을 줄 수 있으므로, AMPC 규모가 폴리 프리미엄의 경제적 상한이 된다. 반대로 셀 가동률이 낮거나 AMPC가 축소되면 프리미엄도 줄어든다."], "fields": [{"k": "민감도", "v": "중국 폴리 현물가와 무관하게 비중국 폴리는 $17/kg 안팎에서 거래(2026.3, 업계 추정). Section 232 확정 시 비중국 ASP 상단 $18~20/kg 가능성."}, {"k": "숫자 예시", "v": "비중국 폴리 약 $17/kg vs 중국산 $6~7/kg(2026.3). 비중국 프리미엄 $10~20/kg(2026). 비중국 폴리 합산 약 34GW(글로벌 2%) vs 미국 결정질 모듈 캐파 2027E 64GW."}]}, {"name": "미국 ESS: 관세·AMPC·ITC가 만든 실질 셀 가격", "formula": "중국산 실질가 = 셀가 × (1 + 관세) + ITC 상실 리스크(시스템가 × 30%) / 한국산 미국 생산 실질가 = 셀가 − AMPC($35/kWh) × 고객 공유 비율", "paras": ["표면상 중국 LFP 셀은 한국산의 절반 가격이다. 그러나 관세가 붙고, 미국 생산 한국 셀은 AMPC를 받아 일부를 고객과 나눈다. 가장 큰 변수는 ESS 투자세액공제(48E ITC 30%)다. 시스템가 $250~300/kWh의 30%인 $75~90/kWh를 PFE 규정 위반 시 통째로 잃기 때문에, 셀 단가 차이보다 세액공제 적격성이 구매 결정을 좌우한다."], "fields": [{"k": "민감도", "v": "MACR 기준 2026년 55% → 2030년 이후 75%. 배터리가 원가의 60% 이상이라 셀이 중국산이면 기준 충족 불가. 122조 관세 만료 시 중국산 유효 관세 38.4%→28.4%."}, {"k": "숫자 예시", "v": "명목 셀가 중국 $50~55 vs 한국 $90~95/kWh, 실질 격차 $15~16/kWh(업계 추정). 관세 반영 중국산 LFP 셀 $90~100 vs 한국·미국산 약 $100/kWh, BESS 통합 판가 $134 vs $135/kWh(2026E, 다른 추정). 북미 ESS 사업 영업이익률 약 20% 가능 추정."}]}, {"name": "풍력 기자재(타워·베어링) 이익 구조", "formula": "매출 = 인도 물량 × 단가(후판·운송비 전가) / 영업이익 = 매출 × 공헌이익률 − 고정비 (+ 미국 생산분 AMPC)", "paras": ["타워·베어링은 터빈 OEM이 발주하므로 OEM 수주보다 6~12개월(타워는 12~18개월) 늦게 실적이 움직인다. 원자재 비용은 대부분 발주처에 전가되고, 공장 슬롯을 미리 파는 Capa Reservation이 일반화돼 이익은 가동률과 생산성의 함수가 된다. 미국 공장은 AMPC가 이익의 큰 몫이라 2027년 말 풍력 AMPC 종료 이후 수익성이 관건이다."], "fields": [{"k": "민감도", "v": "베어링 가동률 4Q23 약 20% → 4Q25 약 80% → 2026E 95%로 영업이익률 8.8%(2025)까지 회복. 미국 타워 법인 영업마진 약 4% → 한 자릿수 후반 개선 추진."}, {"k": "숫자 예시", "v": "씨에스윈드 2025 매출 2조 9,322억원·영업이익 3,224억원, 타워 수주 15.2억달러. 4Q25 분기 타워 수주 6.2억달러(최대). 씨에스베어링 2025 매출 1,261억원·영업이익 111억원."}]}, {"name": "디벨로퍼 개발이익 vs IPP 운영수익", "formula": "디벨로퍼: 개발이익 = MW당 매각단가 × 매각 용량 − 개발비 / IPP: 연 매출 = PPA 단가 × 발전량(용량 × 이용률 × 8,760h), 가치 = 배당가능현금(CAFD)·FFO 기준", "paras": ["디벨로퍼는 부지·인허가·계통 연결을 끝낸 프로젝트를 IPP·유틸리티·빅테크에 팔아 고수익·고위험 이익을 얻고, 인도 기준으로 매출이 잡혀 분기 변동이 크다. IPP는 발전소를 보유하며 10~20년 PPA로 반복 매출을 얻는다. 미국은 PPA 가격이 5년간 2배 이상 올라, 과거 저가 PPA가 만료될 때 재계약만으로 추가 투자 없이 수익이 오른다."], "fields": [{"k": "민감도", "v": "NextEra 재계약 시 MWh당 $14~40 인상(2032년까지 약 7.5GW 대상). 국내 디벨로퍼는 개발·운영 매출 비중이 17%→100%로 바뀌면 영업이익률 12%→65%로 상승 가능(업계 추정)."}, {"k": "숫자 예시", "v": "OCI Energy 파이프라인 7GW(4Q25), 매각 가정 태양광 약 1억원/MW·ESS 약 1.5억원/MW로 2026~2030 약 8,100억원(업계 추정). Enlight 운영 1GW당 연 약 2억달러 반복 매출. Alphabet의 Intersect 인수 47.5억달러(2.2GW 태양광·2.4GWh ESS)."}]}, {"name": "연료전지 온사이트 전원의 경제성", "formula": "실질 설비가 = kW당 설비가 × (1 − ITC 30%) / 발전원가 = (실질 설비가 × 자본회수계수 + 스택 교체비 + O&M) ÷ 발전량 + 가스 연료비 ÷ 효율", "paras": ["SOFC는 kW당 약 $3,363으로 가스터빈($2,400~2,600, 최근 견적)보다 비싸지만, 55~90일 납기와 모듈형 단계 증설, 최고 수준의 면적당 전력 밀도가 '전력을 기다리는 시간'의 비용을 줄인다. 데이터센터는 총비용 중 전력비가 약 20%이고 전력 공급 지연이 AI 경쟁력을 깎으므로 신뢰성만 보장되면 높은 전력단가를 감수한다. 국내는 수소발전 입찰시장에서 15~20년 고정가로 팔지만 비공개 상한가로 단가 인하 압력이 있다."], "fields": [{"k": "민감도", "v": "OBBBA로 2026.1.1 착공분부터 배출·PWA 요건 없이 30% ITC. 가스터빈 공급이 정상화되면 연료전지의 납기 우위는 약화. Henry Hub가 연료비의 핵심 변수."}, {"k": "숫자 예시", "v": "Bloom Energy 3Q25 매출 5.19억달러(+57.1%), AI 인프라 비중 백로그의 약 40%, 2025년 매출 20억달러. 생산능력 1GW→2GW(2026말). 국내 일반수소 입찰 연 1,300GWh(약 200MW), 2025 연료전지 확정 180.55MW."}]}, {"name": "LNG 차익거래와 직도입 발전 마진", "formula": "미국 LNG 도착가 ≈ 1.15 × Henry Hub + 액화수수료($2.25~3.50, 장기) + 운임 / 차익 = JKM(또는 TTF) − 미국 LNG 도착가 / 직도입 발전 마진 = SMP − 직도입 LNG 연료비", "paras": ["미국 LNG 장기계약은 액화수수료가 고정이라 해외 가격 급등의 차익 대부분이 구매자(직도입사·트레이더)에게 간다. 반대로 미계약·스팟 물량을 파는 수출업체는 암묵적 액화수수료가 $6 이상으로 장기의 2~3배가 된다. 국내 SMP는 한계발전기(주로 가스공사 LNG 발전)의 연료비로 정해지므로, 저가 직도입 LNG를 쓰는 발전사는 SMP 상승분을 마진으로 가져간다."], "fields": [{"k": "민감도", "v": "환율 1,350원·브렌트 $100·JKM $25 가정 시 발전용 LNG 연료비 단가 180원/kWh까지 상승. JKM $20·브렌트 $115·환율 1,500원 시 200원/kWh(다른 추정). 슈퍼 엘니뇨·파나마 정상화·SMP 상한제는 차익 축소 요인."}, {"k": "숫자 예시", "v": "2026.9 HH $2.9 vs JKM 약 $28, 미국산 직도입 가격 약 $11.4/MMBtu(업계 추정). Venture Global 2Q26 액화수수료 $6.45(1Q $3.82). SK가스 울산 GPS의 LNG 해외 매각 옵셔널리티 1카고당 약 400억원, 2H21~1H23 가동 가정 시 차익 약 1.2조원(업계 추정)."}]}, {"name": "팜 플랜테이션 이익과 연령 구조", "formula": "CPO 생산량 = 성숙 면적(ha) × FFB 수율(톤/ha) × OER / 이익 = CPO 생산량 × (CPO 가격 − 톤당 원가) + 다운스트림(정제·바이오연료) 스프레드", "paras": ["팜나무는 식재 후 약 3년 무수익, 7년까지 부분 수익, 8~18년에 최고 생산성(FFB 26~32톤/ha)을 내고 25~30년 주기로 재식재한다. 따라서 보유 나무의 연령 분포가 향후 5~15년 생산량과 재식재 CAPEX의 시간표다. OER 0.5%p 개선은 변동비 증가 없이 이익으로 직결되고, 추세적 하락은 인력·설비 관리 문제의 조기 경보다."], "fields": [{"k": "민감도", "v": "젊은 나무 편중 EV/EBITDA 10~12배, 균형 7~9배, 노령 편중 4~6배. 대규모 재식재 시 2027~2032 연 300~500만톤 공급 감소 가능(업계 추정)."}, {"k": "숫자 예시", "v": "말레이 2024 FFB 수율 16.7톤/ha, OER 19.67%(MPOB), 상위 업체 OER 21%대. 포스코인터내셔널 CPO 캐파 20만→60만톤(삼푸르나 인수), 2021~2025 팜사업 평균 영업이익률 약 40%."}]}, {"name": "해상풍력 GW를 기자재 시장으로 환산하기", "formula": "해상풍력 건설시장 = 설치 GW × GW당 CAPEX(7~8조원) → 해저송전망(18~20%) → 송전(45%) → 케이블(55%)·시공(45%) → 외부망(65%)·내부망(35%) / 자켓 시장 = GW × 약 8,000억원", "paras": ["정부 목표 GW를 품목별 원화 시장으로 바꾸는 방식이다. NREL의 CAPEX 비중과 환율 가정을 곱해 내려가며, 목표가 반복 하향된 역사를 감안해 보수(블룸버그 전망)와 목표(정부) 두 시나리오를 함께 본다. 국산화 가능성이 높은 하부구조물·해저케이블이 수혜 강도가 크고, 대형 해상 터빈은 내재화되지 않아 해외 의존도가 높다."], "fields": [{"k": "민감도", "v": "환율 1,400~1,450원 가정. 2030년 누적 3.2GW(블룸버그) vs 2035년 25GW(정부) 가정 차이로 해저송전 시장이 1.9조원 vs 15조원으로 8배 차이."}, {"k": "숫자 예시", "v": "국내 풍력 핵심 기자재 TAM 2026~2040 253조원(터빈 108, 하부구조물 63, 케이블 59, 타워 23조원, 해상이 91%, 업계 추정). 허가 35.6GW × GW당 8조원 ≈ 285조원 사업 규모. 서해안 HVDC 8GW 사업비 12조원(한전)·길이 환산 13.6조원."}]}], "open": 1}], "note": "시장에서 반복해서 쓰는 계산 틀을 공식 → 설명 → 민감도 → 숫자 예시 순으로 정리했다."}, {"h": "자주 나오는 오독 7가지", "blocks": [{"t": "grid", "items": [{"h": "\"LCOE가 싸면 FID가 난다\"", "p": ["LCOE는 발전원 간 비교 지표일 뿐이다. 투자는 판매단가(PPA·CfD), 금리, 계통접속·출력제한·공기지연을 반영한 **IRR이 요구수익률(WACC+150~300bp)을 넘을 때** 결정된다. 풍력 LCOE가 경쟁력이 있어도 2022~2024년 FID가 안 나온 이유다."]}, {"h": "\"중국 폴리 가격 반등 = 비중국 폴리 수혜\"", "p": ["중국 가격과 비중국 가격은 **이원 시장**이다. 비중국 폴리는 중국 현물과 무관하게 약 $17/kg 안팎에서 거래되고, 프리미엄의 상한은 미국 셀 AMPC가 정한다. 중국 반등은 모듈 바닥가를 올려 간접적으로만 도움이 된다."]}, {"h": "\"AMPC 포함 이익 = 지속 이익\"", "p": ["AMPC는 2033년 폐지(풍력 부품 2027년 말)되고 PFE 요건에 좌우된다. 영구 이익으로 보고 정상 멀티플을 주면 과대평가다. **일몰 연도별 이익 민감도**를 따로 본다."]}, {"h": "\"허가 GW = 수주 파이프라인\"", "p": ["국내 해상풍력 허가 약 34GW 중 상업운전은 0.4GW로 전환율이 약 1%다. 기자재 수요는 허가가 아니라 **FID·착공 전환 물량**으로 계산해야 한다."]}, {"h": "\"대기열 2,000GW = 곧 지어질 설비\"", "p": ["미국 대기열의 82%는 연결계약(IA) 이전 단계이고, 2000~2019년 신청 중 상업운전에 도달한 것은 19%뿐이다(LBNL). 대기열은 수요 지표이지 공급 확정 물량이 아니다."]}, {"h": "\"중국 셀이 절반 가격이니 중국산이 싸다\"", "p": ["명목 셀가는 중국 $50~55 vs 한국 $90~95/kWh지만, 관세와 AMPC를 반영한 실질 격차는 $15~16/kWh로 줄고, **ITC 적격성($75~90/kWh)**이 구매를 결정한다(2026, 업계 추정)."]}, {"h": "\"LNG 가격 급등 = 미국 LNG 수출업체 수혜\"", "p": ["장기계약 비중이 높은 수출업체는 액화수수료가 고정이라 차익이 거의 없다. 차익은 **직도입사·트레이더·겸용 발전소**처럼 물량과 옵션을 쥔 쪽으로 간다. 수출업체 중에서는 미계약 스팟 비중이 높은 곳만 레버리지를 가진다."]}], "cols": 2, "numbered": true}]}]}, "grid": {"title": "전력 수요·계통", "h2": "전력 수요와 계통 연계", "en": "Power Demand & Grid Interconnection", "lede": "에너지전환의 병목은 발전 설비가 아니라 **\"연결\"**이다. 데이터센터는 18~24개월이면 서지만 송전망은 3~7년이 걸리고, 미국 대기열에는 2,000GW가 넘는 설비가 줄 서 있다. 이 시간차가 계량기 뒤 온사이트 전원(BTM), ESS, 가스터빈·연료전지 수요를 동시에 만들었다. 수요가 어디서 오고 왜 막히는지를 알면 어떤 설비가 먼저 팔리는지가 보인다.", "sections": [{"h": "수요 좌표 — AI가 20년 정체를 깼다", "blocks": [{"t": "kpis", "items": [{"lab": "미국 데이터센터 전력", "val": "176 → 380~790TWh", "cap": "2023 → 2028~2030E(LBNL·EPRI). 전체 전력의 4.4% → 9~17%", "tag": "추정"}, {"lab": "글로벌 데이터센터 전력", "val": "415 → 945TWh", "cap": "2024 → 2030E 기준 시나리오(IEA)", "tag": "추정"}, {"lab": "빅테크 4사 CAPEX", "val": "5,959억달러", "cap": "2026E, +67% YoY(회사 가이던스 종합)", "tag": "추정"}, {"lab": "PJM 용량 경매가", "val": "$29 → $329", "cap": "$/MW-day, 2년간. 2027/28 경매 상한 도달", "tag": "확인"}, {"lab": "미국 계통 연결 대기", "val": "약 2,290GW", "cap": "2024말(LBNL), 태양광·ESS 약 1,800GW. 2025 2,061GW", "tag": "확인"}, {"lab": "IR → COD 소요", "val": "평균 61개월", "cap": "5년 이상, 북부 버지니아 데이터센터 최대 7년", "tag": "확인"}, {"lab": "미국 전력 예비율", "val": "24% → 11%", "cap": "2025 → 2030E, 2035 이후 마이너스(ICF)", "tag": "추정"}, {"lab": "AI 랙 전력", "val": "120kW → 1MW", "cap": "GB200 NVL72 약 120kW → Rubin Ultra 약 1MW(2027E)", "tag": "추정"}]}, {"t": "p", "text": "미국 전력 수요는 2025년 약 4,300TWh에서 2030년 5,100TWh(+19%)로 늘 전망이고(ISO/RTO·NextEra), 2025~2032 증가분의 43%가 데이터센터다(IHS). 글로벌 전력수요 증가율도 2015~2023년 연 2.4~2.5%에서 2026~2030년 3.6%로 올라선다(IEA). 쿼리당 전력은 검색 0.3Wh vs LLM 3~10Wh이고, GPU 효율이 좋아져도 사용량이 더 늘어나는 제번스의 역설이 작동한다."}]}, {"h": "양과 질 — AIDC 전력은 3계층으로 공급된다", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 340\" role=\"img\" aria-label=\"AI 데이터센터 전력은 밀리초 품질·분~시간 완충·상시 공급의 3계층으로 나뉘어 각기 다른 설비가 맡는다\"><defs><marker id=\"a-tr12\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><line x1=\"170\" y1=\"292\" x2=\"930\" y2=\"292\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.2\"/><line x1=\"170\" y1=\"288\" x2=\"170\" y2=\"296\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.2\"/><text x=\"170\" y=\"312\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".8\">1ms<\/text><line x1=\"294\" y1=\"288\" x2=\"294\" y2=\"296\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.2\"/><text x=\"294\" y=\"312\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".8\">20ms<\/text><line x1=\"455\" y1=\"288\" x2=\"455\" y2=\"296\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.2\"/><text x=\"455\" y=\"312\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".8\">1초<\/text><line x1=\"624\" y1=\"288\" x2=\"624\" y2=\"296\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.2\"/><text x=\"624\" y=\"312\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".8\">1분<\/text><line x1=\"793\" y1=\"288\" x2=\"793\" y2=\"296\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.2\"/><text x=\"793\" y=\"312\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".8\">1시간<\/text><line x1=\"850\" y1=\"288\" x2=\"850\" y2=\"296\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.2\"/><text x=\"850\" y=\"312\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".8\">4시간<\/text><line x1=\"930\" y1=\"288\" x2=\"930\" y2=\"296\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.2\"/><text x=\"930\" y=\"312\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".8\">상시<\/text><text x=\"930\" y=\"330\" font-size=\"10\" text-anchor=\"end\" fill-opacity=\".6\">시간축(로그)<\/text><text x=\"20\" y=\"115\" font-size=\"12\" font-weight=\"600\">① 전력 품질 정제<\/text><rect x=\"170.0\" y=\"96.0\" width=\"380.0\" height=\"28.0\" style=\"fill:var(--accent)\" fill-opacity=\"0.25\"/><text x=\"360\" y=\"115\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">온라인 UPS · 슈퍼커패시터 CBU<\/text><text x=\"360\" y=\"140\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".8\">전압 ±1~2% · 순간정전 20ms 미만 · THD 3% 이하<\/text><text x=\"20\" y=\"181\" font-size=\"12\" font-weight=\"600\">② 에너지 완충<\/text><rect x=\"623.9\" y=\"162.0\" width=\"226.1\" height=\"28.0\" style=\"fill:var(--accent)\" fill-opacity=\"0.4\"/><text x=\"737\" y=\"181\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">대용량 ESS(LFP)<\/text><text x=\"737\" y=\"206\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".8\">2~4C 방전 · 6,000사이클 이상<\/text><text x=\"20\" y=\"247\" font-size=\"12\" font-weight=\"600\">③ 에너지 공급<\/text><rect x=\"792.8\" y=\"228.0\" width=\"137.2\" height=\"28.0\" style=\"fill:var(--accent)\" fill-opacity=\"0.55\"/><text x=\"783\" y=\"247\" font-size=\"11.5\" text-anchor=\"end\" font-weight=\"600\">가스터빈·SOFC·태양광+ESS·계통<\/text><text x=\"783\" y=\"272\" font-size=\"10.5\" text-anchor=\"end\" fill-opacity=\".8\">관성(회전기)·가동률·속도<\/text><line x1=\"405\" y1=\"56\" x2=\"405\" y2=\"92\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" style=\"stroke:var(--alert)\" marker-end=\"url(#a-tr12)\"/><text x=\"399\" y=\"34\" font-size=\"11\" font-weight=\"600\" style=\"fill:var(--alert)\">AI 학습 부하: 0.3초에 정격 12%→57%<\/text><text x=\"399\" y=\"50\" font-size=\"10.5\" style=\"fill:var(--alert)\">(Siemens Energy 측정, 초당 190%)<\/text><\/svg>", "cap": "AI 학습 부하는 0.3초 만에 정격의 12%에서 57%로 뛴다(Siemens Energy 측정). 그래서 전력 공급은 시간축별로 나뉜다. **밀리초 품질은 UPS·슈퍼커패시터, 분~시간 완충은 ESS, 상시 공급은 가스터빈·SOFC·태양광+ESS·계통**이 맡는다. 계층마다 수혜 산업이 달라 서로 경쟁이 아니라 보완 관계이고, 800VDC 전환(2027)은 랙 근처 커패시터와 DC 버스 ESS를 필수로 만든다."}, {"t": "table", "cols": ["계층", "시간축", "핵심 설비", "요구 사양", "공급망"], "rows": [["전력 품질 정제", " ke-opacity=\".3\" stroke-width=\"1\"/><text x=\"242\" y=\"278\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">태양광+ESS<\/text><rect x=\"360\" y=\"244\" width=\"110\" height=\"32\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"415\" y=\"264\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">구내 배전<\/text><rect x=\"520\" y=\"244\" width=\"110\" height=\"32\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--accent)\"/><text x=\"575\" y=\"264\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">서버·랙<\/text><line x1=\"310\" y1=\"243\" x2=\"358\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr13)\"/><line x1=\"310\" y1=\"275\" x2=\"358\" y2=\"266\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr13)\"/><line x1=\"472\" y1=\"260\" x2=\"518\" y2=\"260\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr13)\"/><circle cx=\"650\" cy=\"250\" r=\"12\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\"/><text x=\"650\" y=\"254\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">M<\/text><rect x=\"706\" y=\"232\" width=\"130\" height=\"36\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"771\" y=\"254\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">계통(보조)<\/text><line x1=\"704\" y1=\"250\" x2=\"664\" y2=\"250\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\" marker-end=\"url(#a-tr13)\"/><text x=\"846\" y=\"246\" font-size=\"10.5\" style=\"fill:var(--accent)\">인허가 2~3개월로<\/text><text x=\"846\" y=\"262\" font-size=\"10.5\" style=\"fill:var(--accent)\">단축 사례<\/text><text x=\"20\" y=\"322\" font-size=\"11\">데이터센터 건설<\/text><rect x=\"330.0\" y=\"312.0\" width=\"132.0\" height=\"12.0\" style=\"fill:var(--accent)\" fill-opacity=\".7\"/><text x=\"470\" y=\"322\" font-size=\"11\" font-weight=\"600\">18~24개월<\/text><text x=\"20\" y=\"346\" font-size=\"11\">송전망·변전소<\/text><rect x=\"330.0\" y=\"336.0\" width=\"198.0\" height=\"12.0\" style=\"fill:var(--warn)\" fill-opacity=\".45\"/><rect x=\"528.0\" y=\"336.0\" width=\"264.0\" height=\"12.0\" style=\"fill:var(--warn)\" fill-opacity=\".2\"/><text x=\"800\" y=\"346\" font-size=\"11\" font-weight=\"600\">3~7년<\/text><\/svg>", "cap": "계통을 거치는 FTM은 송전망 대기 3~7년에 막히고, 발전소 옆에 붙는 Co-location은 FERC가 송전망 비용 분담을 요구하며 제도화했다. 그 결과 **데이터센터 부지 안에 가스터빈·SOFC·태양광+ESS를 까는 BTM이 2025말~2028년에 먼저** 늘고, FERC Order 2023으로 대기열이 정리되는 2028년 이후 계통 연결 설비(FTM)가 추가된다. 2025년 미국 신규 발표 가스발전 252GW 중 100GW(40%)가 온사이트 용도였다."}, {"t": "p", "text": "BTM 전원 선택은 LCOE보다 **건설 속도와 전력 품질**의 교집합이다. 가스터빈 3사의 리드타임이 4~7년으로 늘고 견적이 $1,200~1,600/kW에서 $2,400~2,600/kW로 오르자, 55~90일에 설치되는 SOFC(Bloom, 설비가 약 $3,363/kW)와 여유 캐파를 가진 2nd 티어 터빈, 태양광+ESS에 기회가 생겼다. 데이터센터 온사이트 가스발전에 붙는 ESS는 0.6GWh(2025)에서 약 1.5GWh(2027~28E)로 늘 전망이다(Bloomberg)."}, {"t": "bullets", "items": ["PJM Co-location Order(2025.12): 발전소 직결 대형 부하를 제도화 — BTM 인허가 2~3개월 단축 사례", "FERC Large Load Show Cause Order(2026.6): 전 RTO로 확대, 2027년 중 확정 — 병설 부하도 송전망 이용료·보조서비스 비용 부담", "Ratepayer Protection Pledge(2026.3): 빅테크 7곳이 필요 전력 직접 조달 서약, PJM은 15년 PPA로 150억달러 규모 신규 발전소 건설을 빅테크가 부담", "NERC 연산부하 신뢰도 표준(2026.12 제출): 데이터센터 ride-through 의무화 — 2H27 이후 안정용 대형 ESS 사실상 의무"]}]}, {"h": "계통 연결 대기열 — 줄이 길수록 ESS와 온사이트가 번다", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 940 330\" role=\"img\" aria-label=\"미국 계통 연결 대기열의 82%는 계약 전 단계이며 과거 신청의 19%만 상업운전에 도달했다\"><defs><marker id=\"a-tr14\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"30\" y=\"30\" width=\"150\" height=\"40\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"105\" y=\"54\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">연결 신청(IR)<\/text><line x1=\"182\" y1=\"50\" x2=\"208\" y2=\"50\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr14)\"/><rect x=\"210\" y=\"30\" width=\"150\" height=\"40\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"285\" y=\"54\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">계통영향 검토<\/text><line x1=\"362\" y1=\"50\" x2=\"388\" y2=\"50\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr14)\"/><rect x=\"390\" y=\"30\" width=\"150\" height=\"40\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--accent)\"/><text x=\"465\" y=\"54\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">연결계약(IA)<\/text><line x1=\"542\" y1=\"50\" x2=\"568\" y2=\"50\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr14)\"/><rect x=\"570\" y=\"30\" width=\"150\" height=\"40\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"645\" y=\"54\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">건설<\/text><line x1=\"722\" y1=\"50\" x2=\"748\" y2=\"50\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr14)\"/><rect x=\"750\" y=\"30\" width=\"150\" height=\"40\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"825\" y=\"54\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">상업운전(COD)<\/text><path d=\"M30 78 V84 H900 V78\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\"/><text x=\"465\" y=\"102\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">IR → COD 평균 61개월(5년+) · 북부 버지니아 데이터센터 최대 7년<\/text><text x=\"30\" y=\"146\" font-size=\"11.5\" font-weight=\"600\">현재 대기열<\/text><text x=\"30\" y=\"162\" font-size=\"10.5\" fill-opacity=\".8\">약 2,290GW (2024말)<\/text><rect x=\"250\" y=\"136\" width=\"525\" height=\"30\" rx=\"0\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><rect x=\"774.8\" y=\"136.0\" width=\"115.2\" height=\"30.0\" style=\"fill:var(--accent)\" fill-opacity=\".55\"/><text x=\"512\" y=\"156\" font-size=\"11\" text-anchor=\"middle\">IA 이전 약 82% (대기열 전체 중 태양광·ESS 약 1,800GW)<\/text><text x=\"832\" y=\"156\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">IA 18%<\/text><text x=\"30\" y=\"208\" font-size=\"11.5\" font-weight=\"600\">과거 신청<\/text><text x=\"30\" y=\"224\" font-size=\"10.5\" fill-opacity=\".8\">(2000~2019)<\/text><rect x=\"250.0\" y=\"198.0\" width=\"121.6\" height=\"30.0\" style=\"fill:var(--ok)\" fill-opacity=\".5\"/><rect x=\"372\" y=\"198\" width=\"518\" height=\"30\" rx=\"0\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"311\" y=\"218\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">COD 19%<\/text><text x=\"631\" y=\"218\" font-size=\"11\" text-anchor=\"middle\">철회·미도달 81%<\/text><text x=\"30\" y=\"266\" font-size=\"11.5\" font-weight=\"600\">추세<\/text><text x=\"250\" y=\"266\" font-size=\"11\">대기 2,600GW(2023) → 2,061GW(2025) — Order 2023의 클러스터 심사·철회 위약금이 투기 신청을 걸러냄<\/text><text x=\"250\" y=\"290\" font-size=\"11\" style=\"fill:var(--accent)\">→ IA 전환이 늘면 송전 기자재 발주 선행 신호, 대기가 길면 BTM·ESS 유연 연결 수요<\/text><text x=\"910\" y=\"318\" font-size=\"10\" text-anchor=\"end\" fill-opacity=\".6\">LBNL(Berkeley Lab)<\/text><\/svg>", "cap": "신규 발전소는 연결 신청(IR) → 계통영향 검토 → 연결계약(IA) → 건설 → 상업운전(COD)을 거치며 평균 61개월이 걸린다. 대기열 약 2,290GW 중 IA까지 간 물량은 18%에 불과하고, 과거 신청의 19%만 실제 운전에 도달했다(LBNL). **대기가 길수록 BTM·ESS 유연 연결 수요가 커지고, IA 전환이 늘면 송전 기자재 발주의 선행 신호**다."}, {"t": "grid", "items": [{"h": "ACC(접속점 합산 출력 제한)", "p": ["태양광+ESS 합산 출력을 접속점 한도 안으로 묶어 같은 연결 용량에 더 많은 설비를 붙이는 규칙(CAISO 실증). ESS가 초과분을 저장한다."]}, {"h": "SATOA(저장을 송전 자산으로)", "p": ["저장 자원을 송전 강화 수단으로 인정(ISO-NE, FERC 승인). 송전선을 새로 짓는 대신 ESS로 혼잡을 푼다."]}, {"h": "유연 연결", "p": ["데이터센터가 일부 시간 출력 제한을 받아들이면 배터리가 공백을 메워 연결 후보지가 늘고 대기열이 분산된다."]}, {"h": "FERC Order 2023", "p": ["선착순 개별 심사를 \"준비된 순서\"의 클러스터 심사로 바꾸고 철회 위약금을 도입. 대기 2,600GW(2023) → 2,061GW(2025)."]}], "cols": 2}]}, {"h": "출력제어 — 싸게 만든 전기를 버리는 문제", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 920 330\" role=\"img\" aria-label=\"한낮 태양광이 순부하를 경직성 전원 아래로 밀어내면 출력제어가 생기고 ESS가 그 전력을 저녁 피크로 옮긴다\"><defs><marker id=\"a-tr15\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><line x1=\"70\" y1=\"270\" x2=\"600\" y2=\"270\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.2\"/><text x=\"70\" y=\"288\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".75\">0시<\/text><text x=\"202\" y=\"288\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".75\">6시<\/text><text x=\"335\" y=\"288\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".75\">12시<\/text><text x=\"468\" y=\"288\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".75\">18시<\/text><text x=\"600\" y=\"288\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".75\">24시<\/text><path d=\"M191 270 L191.5 270.0 L197.0 269.7 L202.5 269.6 L208.0 269.4 L213.5 269.0 L219.1 268.5 L224.6 267.8 L230.1 266.9 L235.6 265.5 L241.1 263.8 L246.7 261.4 L252.2 258.4 L257.7 254.6 L263.2 249.9 L268.8 244.3 L274.3 237.6 L279.8 229.8 L285.3 221.1 L290.8 211.4 L296.4 201.1 L301.9 190.3 L307.4 179.3 L312.9 168.6 L318.4 158.6 L324.0 149.7 L329.5 142.2 L335.0 136.7 L340.5 133.2 L346.0 132.0 L351.6 133.2 L357.1 136.7 L362.6 142.2 L368.1 149.7 L373.6 158.6 L379.2 168.6 L384.7 179.3 L390.2 190.3 L395.7 201.1 L401.2 211.4 L406.8 221.1 L412.3 229.8 L417.8 237.6 L423.3 244.3 L428.9 249.9 L434.4 254 e:var(--alert)\" marker-end=\"url(#a-tr15)\"/><text x=\"525\" y=\"169\" font-size=\"10.5\" text-anchor=\"middle\" style=\"fill:var(--alert)\">저녁 급경사<\/text><text x=\"525\" y=\"185\" font-size=\"10.5\" text-anchor=\"middle\" style=\"fill:var(--alert)\">→ ESS 방전<\/text><line x1=\"300\" y1=\"20\" x2=\"326\" y2=\"20\" stroke=\"currentColor\" stroke-opacity=\".85\" stroke-width=\"1.8\"/><text x=\"332\" y=\"24\" font-size=\"10.5\">전력 수요<\/text><line x1=\"400\" y1=\"20\" x2=\"426\" y2=\"20\" stroke=\"currentColor\" stroke-opacity=\".95\" stroke-width=\"2\" stroke-dasharray=\"4 3\" style=\"stroke:var(--accent)\"/><text x=\"432\" y=\"24\" font-size=\"10.5\" style=\"fill:var(--accent)\">순부하(수요−태양광)<\/text><text x=\"70\" y=\"24\" font-size=\"12\" font-weight=\"600\">하루 전력 수급(개념도)<\/text><rect x=\"640\" y=\"40\" width=\"260\" height=\"230\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"654\" y=\"64\" font-size=\"12\" font-weight=\"600\" style=\"fill:var(--accent)\">한국<\/text><text x=\"654\" y=\"88\" font-size=\"10.8\">계통관리변전소 205곳 지정(2024.9)<\/text><text x=\"654\" y=\"112\" font-size=\"10.8\">2031년까지 일부 지역 신규 접속 제한<\/text><text x=\"654\" y=\"136\" font-size=\"10.8\">출력제어 조건부 접속 = ESS 동반 시 예외<\/text><text x=\"654\" y=\"170\" font-size=\"12\" font-weight=\"600\" style=\"fill:var(--accent)\">미국 CAISO<\/text><text x=\"654\" y=\"194\" font-size=\"10.8\">계통 인정 용량(ELCC)<\/text><text x=\"654\" y=\"218\" font-size=\"10.8\">태양광 단독 7% → +ESS 41%<\/text><text x=\"654\" y=\"242\" font-size=\"10.8\">ACC·SATOA: ESS를 송전 보강으로 인정<\/text><\/svg>", "cap": "한낮 태양광이 순부하를 원전·열공급 같은 경직성 전원의 최소 출력 아래로 밀어내면 **계통이 받을 수 없는 전력을 버리는 출력제어**가 생긴다. ESS는 이 전력을 저장해 저녁 급경사 구간에 내보내 태양광의 계통 인정 용량을 7%에서 41%로 올린다(CAISO). 한국은 계통 포화 지역의 신규 접속을 막되 ESS를 함께 설치하면 예외를 허용해, **규제가 ESS 동반 설치 수요를 만든다**."}, {"t": "p", "text": "국내는 2024.9 호남·제주·영남 등 205개 계통관리변전소를 지정하고 2031년까지 일부 지역 신규 재생에너지 접속을 제한했다. 서남해안은 송전망 병목으로 출력제한이 상시화돼 있어 서해안 HVDC(8GW)가 해상풍력 확대의 전제 조건이다. 12차 전기본 잠정안은 ESS 약 220GWh 필요를 추정했고(추정 범위 220~446GWh), 국내 장주기 ESS 필요량은 2038년 약 23GW(11차 전기본)다."}]}, {"h": "지표 사전 — 수요·계통·전원", "blocks": [{"t": "table", "cols": ["지표", "정의", "출처", "최근 수준", "해석"], "rows": [["SMP(계통한계가격)", "국내 전력시장 한계발전기 비용으로 정해지는 도매가(원/kWh)", "전력거래소", "2025 SMP 결정 비중 LNG 83%. LNG 연료비 단가 168~200원/kWh까지 상승 가능(2026E 추정)", "상승은 직도입 LNG·재생에너지 발전사 마진 확대, 한전 부담 확대. SMP 상한제 발동이 리스크"], ["미국 계통 접속 대기 용량·기간", "ISO/RTO 대기열 규모와 IR→COD 소요 기간", "Berkeley Lab(LBNL)", "약 2,300~2,500GW(2024~2025), IR→COD 평균 5년 이상(61개월), 버지니아 최대 7년. IA 통과 미준공 549GW(태양광 256·ESS 161GW)", "대기 장기화는 BTM 온사이트·ESS 수요 확대. IA 미준공 물량은 FTM 기자재의 잠재 수주잔고"], ["미국 ESS 적격 셀 캐파 vs 수요", "미국 역내 비PFE ESS 셀 생산능력과 BESS 설치 수요(GWh)", "BNEF, SNE리서치, 업계 추정", "2025 40/59, 2026 69/68, 2027 83/77GWh. 2028E 수요 140~150 vs 적격 캐파 142GWh(다른 추정)", "캐파가 수요를 밑돌면 실제 설치량은 적격 셀 공급이 결정, 한국 셀 가격 협상력 강화"], ["AIDC향 ESS 출하 비중", "Large-scale ESS·BBU·UPS 합산 데이터센터향 배터리 출하", "GGII", "2025 12GWh(5%) → 2027E 61GWh → 2030E 272GWh(31%)", "ESS 수요가 재생에너지 연계에서 전력 인프라 수요로 확장되는지 확인"], ["PJM 용량경매 가격", "발전사가 1MW를 대기시키는 대가($/MW-day)", "PJM", "$29 → $329(2년간), 2027/28 경매 상한 도달·예비력 목표 미달", "상승은 미국 전력 부족 심화, 장기 고정가 PPA·온사이트 전원 수요 증가"], ["가스터빈 리드타임·견적", "주요 3사 신규 주문 납기와 kW당 단가", "GE Vernova·Siemens Energy·MHI, 업계", "최대 4~7년, $2,400~2,600/kW(평시 $1,200~1,600), 백로그 80GW·슬롯 2030년까지 매진", "길어질수록 연료전지·태양광+ESS·2nd 티어 터빈의 상대 경쟁력 개선"], ["Bloom Energy 백로그·캐파", "SOFC 수주잔고 중 AI 인프라 비중과 생산능력", "Bloom Energy 공시", "AI 비중 약 40%(3Q25), 캐파 1→2GW(2026말), 주요 하이퍼스케일러 전부와 계약(2026)", "연료전지의 데이터센터 전원화 속도, 국내 슈퍼캡·특수변압기 공급사 수요의 선행지표"], ["빅테크 CAPEX", "Amazon·Microsoft·Alphabet·Meta(Oracle) 설비투자", "각 사 가이던스", "4사 2026E 5,959억달러(+67% YoY)", "AIDC 전력 수요·온사이트 전원·ESS 수요의 직접 동인"]]}]}]}, "subsidy": {"title": "보조금·정책 지도", "h2": "보조금·정책 지도", "en": "Subsidy & Policy Map", "lede": "이 섹터 이익의 상당 부분은 정책에서 나온다. **미국은 세액공제 일정과 PFE 관문이, 한국은 RPS에서 계약시장으로의 전환과 해상풍력특별법이, 중국은 반내권과 수출통제가** 수요·가격·마진의 경로를 정한다. 이 탭은 제도의 구조를 지도로 그리고, 개별 이슈의 진행 상황은 10 정책 워치에서 추적한다.", "sections": [{"h": "정책이 실적에 들어오는 네 경로", "blo 히는 시점이 다르다. **태양광·풍력은 2026.7.4 착공·2027년 말 준공으로 사실상 끝나고, ESS ITC·AMPC·원전 공제는 2033년 전후까지** 열려 있다. 그래서 2026~2027 태양광 설치 러시 뒤 2028년 수요 공백 우려와, ESS·연료전지의 상대 우대가 동시에 나온다. 반대로 PFE 관문은 2026년부터 매년 높아진다."}, {"t": "table", "cols": ["항목", "IRA", "OBBBA(2025.7)"], "rows": [["태양광·풍력 ITC/PTC", "2032년까지 신규 착공 전액, 2033년부터 단계 감축", "2026.7.4 전 착공(4년 내 준공) 또는 2027년 말 전 준공분만"], ["ESS ITC(48E)", "유지", "유지(2033년 이후 단계 감축), PFE 적용"], ["착공 판정", "Physical Work Test 또는 5% Safe Harbor", "Physical Work Test만(1.5MW 이하 태양광 예외, 2025.9.2 이후 착공분)"], ["PFE 규정", "없음(30D에 국한)", "PFE·실질적 지원 시 공제 불가, MACR 도입, SFE·FIE 정의 확장"], ["AMPC(45X)", "2030년부터 감축", "유지, 2033년 폐지, PFE 적용"], ["풍력 부품 AMPC", "단계적 축소", "2027년 말 일괄 종료, 중국 자본·부품 사용 시 제외"], ["크레딧 양도", "2032년까지", "2027년까지(풍력)"], ["연료전지 ITC", "청정수소 기반 우대, 배출 0g/kWh 요건, PWA 미충족 6%", "연료 종류 무관 30%, 배출 요건 삭제, 보너스 가산 미적용"], ["원전", "45U·45Y", "45U 2032년 유지, 45Y 2033년 착공분 100%"], ["주거용 25D", "2034년까지", "2025.12.31 종료"]], "title": "IRA → OBBBA 핵심 변경", "note": "IRS·미국 상원·First Solar"}]}, {"h": "FEOC·PFE·MACR — 비중국 비율이 매년 오른다", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 880 330\" role=\"img\" aria-label=\"PFE 비중국 원가 비율 기준은 2026년 40~60%에서 2030년 60~85%로 올라 하위 소재까지 탈중국을 요구한다\"><defs><marker id=\"a-tr17\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><line x1=\"70\" y1=\"276\" x2=\"560\" y2=\"276\" stroke=\"currentColor\" stroke-opacity=\".13\" stroke-width=\"1.2\"/><text x=\"62\" y=\"280\" font-size=\"10.5\" text-anchor=\"end\" fill-opacity=\".7\">30%<\/text><line x1=\"70\" y1=\"216\" x2=\"560\" y2=\"216\" stroke=\"currentColor\" stroke-opacity=\".13\" stroke-width=\"1.2\"/><text x=\"62\" y=\"220\" font-size=\"10.5\" text-anchor=\"end\" fill-opacity=\".7\">45%<\/text><line x1=\"70\" y1=\"156\" x2=\"560\" y2=\"156\" stroke=\"currentColor\" stroke-opacity=\".13\" stroke-width=\"1.2\"/><text x=\"62\" y=\"160\ "11\" font-weight=\"600\" style=\"fill:var(--warn)\">AMPC 인버터 70%<\/text><text x=\"570\" y=\"160\" font-size=\"11\" font-weight=\"600\">ITC 태양광 60%<\/text><text x=\"70\" y=\"22\" font-size=\"11.5\" font-weight=\"600\">비PFE(비중국) 원가 비율 기준 — 미달 시 공제 불가<\/text><text x=\"570\" y=\"200\" font-size=\"11.5\" font-weight=\"600\" style=\"fill:var(--accent)\">읽는 법<\/text><text x=\"570\" y=\"222\" font-size=\"10.5\">비율 = 비PFE 부품 원가 ÷ 전체 원가<\/text><text x=\"570\" y=\"240\" font-size=\"10.5\">ESS는 배터리가 원가 60%+<\/text><text x=\"570\" y=\"258\" font-size=\"10.5\">→ 셀이 중국산이면 사실상 불가<\/text><text x=\"570\" y=\"276\" font-size=\"10.5\">→ 양극재·음극재까지 조달 재편<\/text><text x=\"570\" y=\"312\" font-size=\"10\" fill-opacity=\".6\">IRS(OBBBA)<\/text><\/svg>", "cap": "MACR는 공제 대상 설비 원가 중 금지외국법인(PFE)이 아닌 곳에서 조달한 비율이다. 2026년 40~60%에서 2030년 60~85%로 올라, **셀·모듈 단계를 넘어 양극재·음극재·웨이퍼까지 비중국 조달**을 요구한다. ESS는 배터리가 원가의 60% 이상이라 셀이 중국산이면 사실상 충족이 불가능하다."}, {"t": "table", "cols": ["구분", "2026", "2027", "2028", "2029", "2030 이후"], "rows": [["ITC 적격시설(태양광 등)", "40%", "45%", "50%", "55%", "60%"], ["ITC ESS", "55%", "60%", "65%", "70%", "75%"], ["AMPC 태양광 부품", "50%", "60%", "70%", "80%", "85%"], ["AMPC 배터리 부품", "60%", "65%", "70%", "80%", "85%"], ["AMPC 인버터", "50%", "55%", "60%", "65%", "70%"]], "title": "PFE MACR 연도별 기준치(비PFE 원가 비율)", "note": "IRS(OBBBA)"}, {"t": "p", "text": "PFE 판정은 지분(중국 자본 25% 이상)과 실질 지배(SFE·FIE 정의 확장) 두 갈래다. 한국 기업이라도 중국 합작 지분이나 라이선스·장비 의존이 있으면 해당 여부를 따져야 하고, 실사에서는 **연도별 MACR 산정 결과와 그 근거 자료**를 요구해야 한다."}]}, {"h": "관세 4중망 — 반입·가격·혈통·자격", "blocks": [{"t": "table", "cols": ["규제", "질문", "작동 방식", "주요 일정"], "rows": [["UFLPA", "반입 자격이 있는가", "원산지 증빙 실패 시 압류·반송(누적 1만건+ 중 태양광 약 50%)", "2022~ 상시, 2025 집행 강화"], ["AD/CVD", "진입 가격이 적절한가", "동남아 4국 → 인도·인니·라오스 우회 물량 고율 관세", "3국 CVD 예비 2026.2, AD 예비 2026.4, 최종 2026.7 전후"], ["Section 232", "밸류체인 혈통이 깨끗한가", "폴리~모듈 전 구간 관세·최저수입가격 가능, 비중국 쿼터 거론", "BIS 보고 2026.3.28, 시행 2026.12.4 등 상이"], ["FEOC/PFE", "보조금 수혜 자격이 충분한가", "중국 자본 25%↑ 제외, MACR 비중국 비율 매년 상향", "2026.1 적용 시 TM은 2028년부터\"** 세 편을 먼저 읽으면 2025~2026 시장의 공통 논리가 잡힌다. 핵심 네 편에는 도식을 붙였다."}]}, {"h": "태양광 — 6편", "blocks": [{"t": "mods", "items": [{"name": "미국 태양광 '비중국 프리미엄'의 해부", "pill": "2025.10~2026.09", "lede": "중국 가격 바닥이 오르고 미국 규제망이 겹겹이 쌓이면서, 원산지를 증빙할 수 있는 비중국 모듈·소재 가격이 양방향에서 끌어올려지고 있다.", "paras": ["미국 태양광 시장은 가격이 중국 공급에 의해 정해지는 세계 시장과 분리돼 있다. 미국 규제는 네 개의 질문으로 이해하면 쉽다. UFLPA는 '반입 자격이 있는가'(강제노동 연계 여부를 증빙 못 하면 압류), AD/CVD는 '진입 가격이 적절한가'(우회 수출국 고율 관세), Section 232는 '밸류체인 혈통이 깨끗한가'(폴리~모듈 전 구간 관세 가능), FEOC/PFE는 '보조금 수혜 자격이 충분한가'(중국 자본 25% 이상이면 혜택 제외)를 묻는다.", "우회 경로는 차례로 닫혔다. 미국 모듈 수입의 92%를 차지하던 동남아 4국(베트남·태국·말레이시아·캄보디아)이 대부분 업체 200% 이상 관세로 막히자 인도·인니·라오스가 98%로 대체했지만, 이들도 2026.2 CVD 예비판정(80~130%)을 받았다. 그 결과 미국 모듈 수입은 2024년 54GW에서 2025년 13~16GW로 급감했다.", "공급 측에서는 중국 치킨게임이 끝나가고 있다. 2023~2025년 폴리 가격이 85% 이상 폭락하고 모듈이 $0.09/W까지 떨어진 뒤, 2025년 하반기 MIIT가 원가 이하 판매를 금지하고 수출 VAT 환급(9%)이 2026.4 폐지되면서 중국 TOPCon FOB는 $0.11~0.12/W로 올랐다. 비중국 가격은 이 바닥 위에 규제 프리미엄과 국산화(DCA) 프리미엄을 얹는 구조라 함께 오른다.", "희소성의 핵심은 셀과 웨이퍼다. 미국 내 모듈 설비는 65GW지만 셀 자급 캐파가 3GW 수준이라 가동률이 47%에 머물고, 실생산 28GW 중 First Solar와 한화 계열이 82%를 차지했다(2025). 비중국 폴리도 합산 34GW(글로벌 2%)에 불과해, 규제에 적합한 물량이 모자라는 동안 프리미엄은 유지된다.", "다만 이 프리미엄의 원천은 고객이 ITC를 받기 위해 비중국산을 사야 한다는 점이다. 2027년 말 이후 준공 태양광은 공제가 사실상 사라지므로, 2028년 이후에는 Section 232 같은 추가 관세가 설계되지 않으면 고객이 원산지와 무관하게 가장 싼 모듈을 고를 수 있다는 것이 업계의 공통 경고다."], "table": {"cols": ["구분", "가격($/W)", "시점·출처"], "rows": [["중국 TOPCon FOB", "0.11~0.12", "2026.1, PV Infolink"], ["미국 수입 모듈", "0.28", "2026.3, 업계 집계"], ["미국산(수입 셀)", "0.36", "2026.3"], ["미국산(미국 셀)", "0.49", "2026.3"], ["First Solar 신규 수주 ASP", "0.364", "4Q25, 회사 공시"], ["Section 232 모듈 하한(MIP)", "0.38", "2026.12 시행 가정, "]]}, "bullets": ["4중 규제: UFLPA·AD/CVD·Section 232·FEOC/PFE", "PFE 비중국 비율(ITC 태양광) 2026년 40% → 2030년 이후 60%", "미국 모듈 수입 54GW(2024) → 13~16GW(2025)", "Sunrun은 중국계 모듈(Canadian Solar·Jinko·LONGi)을 승인 목록에서 제외", "2028년 이후 프리미엄 유지의 열쇠는 Section 232"], "kr": "한화솔루션(미국 수직계열화), OCI홀딩스(비중국 폴리·웨이퍼), HD현대에너지솔루션(Non-FEOC 셀, 2025년 미국 매출 +257%)이 직접 노출된다.", "svg": "<
