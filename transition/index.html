y=\"40\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">Section 232<\/text><text x=\"533\" y=\"222\" font-size=\"11\" text-anchor=\"middle\" style=\"fill:var(--warn)\">혈통이 깨끗한가?<\/text><line x1=\"548\" y1=\"125\" x2=\"668\" y2=\"125\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr25)\"/><rect x=\"670\" y=\"50\" width=\"26\" height=\"150\" rx=\"3\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--warn)\"/><text x=\"683\" y=\"40\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">FEOC·PFE<\/text><text x=\"683\" y=\"222\" font-size=\"11\" text-anchor=\"middle\" style=\"fill:var(--warn)\">보조금 자격?<\/text><line x1=\"162\" y1=\"125\" x2=\"218\" y2=\"125\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr25)\"/><line x1=\"698\" y1=\"125\" x2=\"748\" y2=\"125\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" style=\"stroke:var(--accent)\" marker-end=\"url(#a-tr25)\"/><rect x=\"750\" y=\"90\" width=\"150\" height=\"70\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--accent)\"/><text x=\"825\" y=\"122\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">미국 시장<\/text><text x=\"825\" y=\"136\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">프리미엄 형성<\/text><text x=\"20\" y=\"256\" font-size=\"11\">결과: 美 모듈 수입 54GW(2024) → 13~16GW(2025) · 인도·인니·라오스 CVD 예비 80~130% · 중국 자본 25%↑ 기업은 보조금 제외<\/text><text x=\"308\" y=\"116\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".8\">억류·반송<\/text><text x=\"458\" y=\"116\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".8\">200%+ 관세<\/text><text x=\"608\" y=\"116\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".8\">관세·하한가<\/text><text x=\"723\" y=\"112\" font-size=\"10\" text-anchor=\"middle\" fill-opacity=\".8\">공제 배제<\/text><\/svg>", "cap": "미국은 UFLPA(반입 자격)·AD/CVD(진입 가격)·Section 232(혈통)·FEOC(보조금 자격)의 네 관문으로 중국·우회국 공급을 걸러낸다. 그 결과 모듈 수입이 54GW(2024)에서 13~16GW(2025)로 줄었고, 관문을 통과한 비중국 물량이 부족한 동안 프리미엄이 유지된다."}, {"name": "중국 폴리실리콘 구조조정: 담합에서 시장 퇴출로", "pill": "2025.07~2026.05", "lede": "OPEC식 감산 합의는 반독점 경고로 멈췄지만, 세제·표준 정책으로 한계기업을 밀어내는 방식으로 방향은 유지되고 있다.", "paras": ["중국 태양광은 2023~2025년 극심한 공급과잉을 겪었다. 2024년 글로벌 모듈 캐파는 1,392GW로 설치량(599GW)의 2배를 넘었고, 폴리·웨이퍼·셀·모듈 Top10 중 중국 기업 비중은 96·99·100·86%에 달했다. 폴리 연평균 가격은 2023년 -56%, 2024년 -63% 하락했다.", "중국 정부는 '반내권(反内卷)'을 내걸고 2025.7 원가 이하 판매를 경고했다. 업체들은 생산능력의 1/3을 매입·폐쇄하는 펀드를 결의하고 2025.12 Tongwei(30.35%)·GCL(16.79%)·East Hope·Daqo 등이 합작법인을 세웠다. 그러나 2026.1 SAMR(시장감독관리총국)이 설비 매입·폐쇄와 가격 합의를 반독점 위반으로 볼 수 있다고 경고하면서 계획이 연기됐다.", "정부는 방법을 바꿨다. 2026.4 수출 VAT 환급(9%)을 전면 폐지해 적자 수출 기업에 약 10%의 비용을 얹었고, 2026.3 강제 표준(GB)을 개정해 실제 출력과 명판의 일치를 감독하고 최저 효율 기준을 올렸다. 담합이 아닌 비용 상승을 통한 자연 퇴출이라 속도는 느리지만 공급 축소 방향은 유효하다는 평가다.", "가격 지표는 조사기관마다 엇갈린다. PV Infolink 기준으로는 저점 $5.58에서 2026.3 $8.29/kg(+49%)로 반등했다는 집계가 있는 반면, PV Insights 기준으로는 2026.1 $7.9에서 4월 $4.7/kg로 급락했다는 집계도 있다. 담합 기대가 꺼진 시점을 반영한 차이로 보이며, 인용 시 조사기관과 날짜를 반드시 병기해야 한다.", "한국 업체에 대한 함의는 간접적이다. OCI홀딩스는 중국과 분리된 시장에서 영업해 중국 가격 반등의 직접 수혜는 작지만, 원산지를 위장한 저가품 경쟁이 줄고 저원가 중국 업체(GCL 현금원가 $3.7/kg)가 먼저 이익을 회복하는 원가곡선 구조를 이해해야 한다."], "table": {"cols": ["시점", "사건", "가격 영향"], "rows": [["2025.07", "MIIT 원가 이하 판매 금지·반내권", "일시 반등"], ["2025.12", "폴리 구조조정 합작법인 설립", "기대 반영"], ["2026.01", "SAMR 반독점 경고", "합작법인 연기, 급락(PV Insights $7.9→)"], ["2026.03", "강제 표준(GB) 개정", "저품질 퇴출 유도"], ["2026.04", "수출 VAT 환급 9% 폐지", "수출 원가 약 10% 상승, $4.7/kg(PV Insights)"]]}, "bullets": ["합작법인 지분: Tongwei 30.35%, GCL 16.79%, East Hope 11.30%, Daqo 11.13%", "GCL 생산단가 $4.9 → $3.7/kg(2024→2025), 2H25 흑자전환", "Daqo 3Q25 5분기 만에 흑자전환", "폴리 가격 지표는 조사기관별 불일치(미확인)"], "kr": "OCI홀딩스는 이원화된 시장 구조상 직접 수혜는 제한적이며, 원산지 위장 저가품 경쟁 완화와 우주 태양전지용 수요 확인이 중장기 긍정 요인으로 거론된다."}, {"name": "페로브스카이트 탠덤: 대체가 아니라 적층, 효율이 아니라 금융", "pill": "2024.12~2026.06", "lede": "탠덤은 실리콘을 없애는 기술이 아니라 실리콘 위에 한 층을 더 쌓는 기술이며, 진짜 상업화 시점은 은행이 그 모듈을 담보로 돈을 빌려주는 순간이다.", "paras": ["실리콘 단일접합 셀은 밴드갭(약 1.1eV)보다 낮은 에너지의 빛은 못 쓰고 높은 에너지는 열로 잃는다. 오제 재결합까지 반영한 실효 상한이 약 29.4%인데, 상용 모듈은 22~24%, 실험실 최고는 27%대 후반이라 남은 여지가 2~3%p뿐이다. 탠덤은 밴드갭 1.6~1.7eV의 페로브스카이트를 위에 얹어 단파장을 위에서, 장파장을 아래 실리콘에서 흡수하는 '스펙트럼 분업'으로 이론 효율을 40%대로 올린다.", "상업적으로 현실적인 경로는 실리콘 하부 셀을 유지하는 2단자 적층이고, 하부 셀 품질이 좋을수록 탠덤 효율도 오른다. 그래서 TOPCon·HJT 투자는 좌초자산이 아니라 하부 플랫폼이 되며, LONGi(HJT 하부 34.85%, NREL 인증)·JinkoSolar(TOPCon 하부 34%대)·한화(Q.ANTUM 하부, 상용 M10 규격 28.6%, Fraunhofer 인증) 등 기존 강자가 모두 이 경로를 택했다. 신기술의 과실이 신규 진입자보다 기존 강자에게 먼저 가는 드문 사례다.", "가치 척도도 바뀐다. 모듈이 싸질수록 시스템 원가에서 토지·구조물·인허가·계통 등 비모듈 비용 비중이 커지므로, 같은 면적에서 15~20% 더 발전하는 탠덤의 가치는 $/W가 아니라 kWh/㎡와 프로젝트 IRR로 평가해야 한다. 특히 추가 1kWh의 가치를 전기요금·피크요금·RE100 비용 회피로 계산하는 데이터센터·반도체·물류센터가 초기 수요처로 꼽힌다.", "진짜 관문은 Bankability다. 태양광은 20~30년 발전량을 보증하는 인프라라, 효율이 1~2%p 높아도 열화율이 불확실하면 할인율·보증비·보험료가 올라 프리미엄이 증발한다. 페로브스카이트는 수분·열·UV·이온 이동에 민감한데 공개된 습열 데이터는 1,000시간 안팎이고, Oxford PV 보증도 10년(차세대 20년 목표)이다. 검증은 실험실 효율 → 표준 시험(IEC 61215/61730) → 다기후 장기 실증 → 보험·PF 승인 순이며, 레퍼런스를 먼저 쌓은 소수가 조달비용 하락의 선순환을 독점할 가능성이 크다.", "투자 신호는 장비 → 소재 → 모듈 순으로 온다. 파일럿·데모 라인 발주로 장비 매출이 먼저 나고, 양산이 반복되면 고객 인증에 편입된 소재가 락인 효과로 반복 매출을 쌓는다. 한 추정은 세계 탠덤 모듈 시장을 2026년 0.65GW(약 2.5억달러) → 2030년 27.9GW → 2035년 312.5GW(약 531억달러, 침투율 25%)로 가정했고, 중국 GCL은 이미 대면적(2.0㎡) 탠덤 27.1%와 GW급 공장을 확보해 한국보다 1~2년 앞서 있다는 평가도 있다."], "table": {"cols": ["검증 단계", "잔여 리스크", "확인할 체크포인트"], "rows": [["효율 검증", "장기 안정성·양산성", "대면적 셀 효율, 독립기관 인증"], ["표준 시험 통과", "25년 보증·현장 데이터 부족", "UV/TC/HF/DH 시험 범위"], ["실증 진입", "지역별 열화율 분산", "설치 지역, 12개월 성능, 초기 열화율"], ["상업 초기", "보증비·보험료·수율", "수율, 보증 조건, 고객군"], ["금융 가능성 상승", "프로젝트별 리스크 프리미엄", "보험 인수, lender list, PPA 적용"], ["Bankable 제품", "잔여 품질 리스크", "대형 프로젝트 반복 채택"]]}, "bullets": ["실리콘 실효 상한 약 29.4% vs 탠덤 이론 40%대", "셀 최고 34.85%(LONGi, 2025.4), 한화 상용 M10 28.6%(2024.12)", "업계 거론 탠덤 모듈 제조원가 $0.29~0.42/W(25~30% 효율)", "한화솔루션 2026 진천 파일럿 상업생산, 2027 상반기~2028 양산 목표, 유상증자 중 약 1,000억원 배정", "추정 가치 시나리오: 탠덤 사업부 Bear 0.34조·Base 2.2조·Bull 9.6조원(2035 터미널, 할인율 11%)"], "kr": "장비는 선익시스템·주성엔지니어링·아바코·필옵틱스, 소재는 엘케이켐·덕산네오룩스·피엔에이치테크·LG화학, 봉지·배리어는 아이컴포넌트·코오롱인더스트리, 전극은 대주전자재료가 후보로 거론되며 대부분 직접 수주는 미확인 단계다."}, {"name": "세액공제 이후의 미국 태양광: P·Q·C와 Section 232", "pill": "2025.07~2026.09", "lede": "2027년까지는 관세·PFE가 모듈 가격을 지키고 발전 사업은 가격·수요·비용이 동시에 우호적이지만, 2028년 이후 제조와 개발의 운명이 갈린다.", "paras": ["OBBBA(2025.7)는 태양광·풍력 ITC/PTC를 2026.7.4 이전 착공(4년 내 준공) 또는 2027년 말 이전 준공분으로 제한했다. 2025.9부터는 서류상 5% 비용 지출로 착공을 인정하던 세이프하버도 폐지돼 실제 공사(Physical Work Test)만 인정된다. 그 결과 2H25~1H26 착공 러시가 났고 2026~2027년 설치가 연 60GW 안팎으로 견조할 것으로 예상된다(업계 추정: 2025 53, 2026 61, 2027 60GW).", "발전 사업자에게는 P·Q·C가 동시에 우호적이다. 가격(P): 태양광 PPA가 5년간 2배 이상 올랐고(LevelTen), 과거 저가 PPA 만료분을 재계약하면 추가 투자 없이 수익이 오른다. 수요(Q): 미국 전력수요가 2030년까지 19% 늘고 예비율이 24%(2025)에서 11%(2030)로 떨어질 전망인데, 대형 가스터빈 납기가 4~5년이라 2030년 이전 공급원은 사실상 태양광+ESS뿐이다. 비용(C): 태양광 설치비는 2015년 대비 65% 떨어졌고, 2021년 이후 20~30% 올랐지만 PPA 상승이 이를 상쇄했으며 복합화력 건설비는 $900→$2,000/kW 이상으로 더 올랐다.", "제조사에게는 2028년이 분기점이다. ITC가 사라지면 고객은 원산지와 무관하게 가장 싼 모듈을 고르고, 제조사는 AMPC를 받아도 판매량 유지를 위해 가격을 내려야 한다. 그래서 Section 232가 핵심 변수로 떠올랐다. 232조는 폴리·웨이퍼까지 포함하고 지역이 아니라 실질 지배 소유주 기준으로 적용될 수 있으며, 상류는 낮고 하류로 갈수록 높은 관세에 비중국 기업 저율·무관세 쿼터(예: 폴리 수입 쿼터 연 4만톤)가 거론된다.", "한 자료(2026.8)는 Section 232 조치가 2026.12.4 시행되며 폴리·웨이퍼·셀·모듈에 최저수입가격(MIP, 모듈 하한 $0.38/W)과 15% 종가세를 부과하는 것으로 정리했다. 이 경우 미국 모듈 판가가 수입가 수준(약 $0.437/W)으로 수렴하는 시나리오가 제시됐다. 다른 자료들은 발표 시기·설계를 여전히 불확실로 보고 있어, 최종 확정 내용은 원문 확인이 필요하다.", "개발 측면에서는 '개발 완료 부지'가 가장 희소한 자산이 됐다. 태양광 건설은 1~2년이지만 부지·인허가·계통 연결에 2~3년이 걸리고, 예상 밖 네트워크 업그레이드 비용으로 개발 자체가 실패하는 사례가 늘었다. 유틸리티·IPP는 프리미엄을 주고 개발 완료 프로젝트를 사는 것을 선호해 디벨로퍼가 양극화되고, Enlight-Clenera(4.33억달러), Brookfield-Neoen(61억유로), Alphabet-Intersect(47.5억달러) 같은 M&A가 이어졌다."], "table": {"cols": ["구간", "태양광 ITC", "Non-PFE·미국산 수요", "모듈 가격 시사점"], "rows": [["2026~2027", "2026.7.4 전 착공 또는 2027년 말 준공분", "차별적 수요 집중", "견조(Non-PFE 셀 부족)"], ["2028 이후", "사실상 공제 불가", "차별 수요 감소", "가격 경쟁 심화, 추가 관세 필요"], ["ESS", "2033년까지 유지(MACR 매년 상향)", "Non-PFE 배터리 조달 집중", "태양광 기자재는 최소 비용 선호"]]}, "bullets": ["미국 전력 예비율 24%(2025) → 11%(2030E, ICF)", "2030 예비율 15% 달성에 ERCOT 20·MISO 13·PJM 10GW 추가 필요", "BNEF 미국 태양광 누적 전망(2025~2035) 363 → 272GW(-25%)로 하향(OBBBA 이후)", "Canadian Solar는 Non-PFE 셀 부족으로 2026년 미국 모듈 출하 약 17% 감소 전망", "NextEra: 태양광·배터리 물량은 2029년, 변압기는 2030년 물량까지 확보"], "kr": "OCI홀딩스(OCI Energy 텍사스 7GW 파이프라인, 2026~2030 6.6GW 매각 예정), 한화솔루션(AMPC 확대), SK이터닉스·삼성물산(디벨로퍼 모델)이 연결된다."}, {"name": "국내 태양광 연 10GW 시대: 모듈만의 문제가 아니다", "pill": "2025.12~2026.09", "lede": "2030년 재생에너지 100GW 목표는 매년 역대 최대 설치량의 두 배 이상을 요구하며, ESS·송전망·계약시장이 함께 따라와야 하는 시스템 문제다.", "paras": ["국내 재생에너지 설비는 2025년 37GW(2026.6 기준 40.9GW, 태양광 32.7GW)다. 정부는 2030년 100GW, 그중 태양광 57GW 순증을 목표로 하므로 향후 5년간 매년 약 11GW(12차 전기본 재전망 기준으로는 2027~2040 연 9.9GW)를 깔아야 한다. 역대 최대 연간 보급이 2020년 4.1GW였다는 점을 감안하면 매우 공격적인 목표다.", "이를 위해 제도가 동시에 바뀐다. 태양광 이격거리 규제 금지법(2026.9, 주거지 200m·도로 100m 이내만 예외), 영농형 태양광법(2026.11 예상, 농지 설치허가 8년 → 최대 23~30년), RPS 폐지와 설비용량 의무·계약시장 일원화(2027.1 신규 REC 발급 중단), 송전망 민간 개방(전력망 3법, 3년 한시 Build-Transfer), 한국판 IRA(국산 사용 인센티브) 등이다. 정부는 태양광 발전단가를 150원(2026) → 100원(2030) → 80원/kWh(2035)로 낮추는 목표를 제시했다.", "태양광은 낮에 몰리므로 ESS가 필수다. 신규 태양광 피크의 40~60%를 ESS가 흡수한다고 보면 연 4~6GW(4시간 기준 16~24GWh)가 필요한데, 중앙계약시장 입찰은 연 약 1GW 수준이다. 12차 전기본 재전망 기준으로 2040년 태양광 171GW의 피크 실효용량은 24.5GW(피크기여도 14.3%)에 불과해, 연계 ESS가 약 220GWh(태양광 175 + 풍력 44.5GWh) 필요하다는 추정이 나온다.", "송전망도 병목이다. 호남·제주 등 205개 계통관리변전소가 지정돼 일부 지역은 2031~2032년까지 신규 접속이 제한되고, 출력제어 조건부(ESS 동반 설치) 접속만 예외로 허용된다. 송변전 투자비는 11차 72.8조원에서 12차 재전망 115~124조원으로 늘 수 있고, 한전이 감당 못 하는 34.8~44.3조원이 민간 BT 시장이 될 것이라는 분석이 있다.", "수익 구조도 바뀐다. SMP+REC의 변동성 큰 구조에서 15~20년 고정가 계약시장으로 넘어가며, 입찰 상한가가 로드맵대로 낮아지면 PPA(최근 170~180원/kWh 이상)와의 격차가 커져 발전사업자가 RE100 수요기업과의 직접 PPA로 이동할 수 있다. 이익의 원천이 제조·시공에서 개발~전력판매~O&M을 묶는 '전력 구조화' 역량으로 옮겨가는 것이다."], "table": {"cols": ["에너지원", "2025 실적", "2030 목표", "2035 목표", "2040 전망"], "rows": [["사업용 태양광(GW)", "31", "87", "122", "155"], ["육상풍력(GW)", "2", "6", "12", "16"], ["해상풍력(GW)", "0.4", "3", "25", "45"], ["기타(GW)", "4", "4", "4", "4"], ["합계(자가용 제외)", "37", "100", "163", "220"]]}, "bullets": ["국내 모듈 캐파 약 6GW → 2030년 10GW 이상 목표", "PCS 배수 0.7(태양광 용량 대비 ESS 출력) 표준화", "ESS 필요량 상향 시나리오(석탄 대체 없음) 446GWh", "국내 ESS 배터리 연 15.6GWh·누적 약 52조원 시장(ASP $170/kWh 가정, 업계 추정)", "한국 풍력+태양광 발전 비중 6.1% vs OECD 18.1%(2024)"], "kr": "HD현대에너지솔루션(국내 모듈 점유율 1위 27%, 매출 국내 62%), 한화솔루션, SK이터닉스(솔라닉스 분산 태양광 PPA), 셀 3사와 LFP 소재사(엘앤에프·포스코퓨처엠)가 국내 시장 확대에 연결된다."}, {"name": "우주 에너지: kWh/㎡에서 Compute per kilogram으로", "pill": "2025.06~2026.05", "lede": "우주 데이터센터·달 기지 전력은 규모는 작지만 단가가 매우 높고, 경량 전력막과 발사비 하락이 곱셈으로 작용하는 장기 옵션이다.", "paras": ["우주 태양광은 대기·밤낮의 영향이 적어 24시간에 가까운 발전이 가능하다(Dawn-dusk 태양동기궤도). 우주 데이터센터는 전력 생산과 연산을 궤도에서 하고 결과만 내려보내는 구상으로, 1MW급 노드에 수천㎡의 태양전지가 필요할 수 있어 셀보다 구조물·전개장치·방열판이 질량을 좌우한다. 그래서 척도가 '발사질량 1kg당 전력·연산(Compute per kilogram)'으로 바뀐다.", "기존 우주용 셀은 III-V 다중접합(효율 약 30%)으로 매우 비싸다. 수백 nm 두께로 필름·금속박에 코팅할 수 있는 페로브스카이트는 롤러블 전력막 후보이고, 유연 탠덤 셀이 33.6% 효율과 5,000회 굽힘 후 91% 유지를 보고했다. 효율이 절대적으로 중요한 우주는 HJT 기반 탠덤으로 수렴할 가능성이 커, 200℃ 미만 저온 페이스트·은구리(Ag-Cu) 페이스트 수요가 생긴다(태양광 1GW당 페이스트 약 12톤 추정).", "경제성은 발사비에 달렸다. LEO 발사비는 우주왕복선 시대 kg당 5만달러 이상에서 팰컨9 약 $2,700로 떨어졌고 스타십은 $100 미만을 목표로 한다. Google은 $200, Starcloud는 약 $500/kg를 궤도 데이터센터 경제성 임계로 본다. 발사비가 절반, 전력막 무게가 절반이면 연산당 발사 부담은 1/4이 되지만, $1,500에서 멈추면 궤도 전력단가가 kWh당 약 $0.15로 지상보다 크게 비싸고 1GW 구축비도 지상의 약 3배(약 424억달러)다.", "SpaceX는 텍사스 배스트롭에 10GW 셀 공장을 짓고 1→10→100GW 단계적 증설을 구상한다는 보도가 있다. 다만 이는 우주·자가소비용이라 지상 프리미엄 모듈 시장과 분리되고, 중국 정부가 2026.5 HJT 장비의 대미 수출 불허 의사를 밝혀 장비 병목(Suzhou Maxwell 점유율 70%)이 변수다. 중국 GCL Optoelectronics도 우주 전용 페로브스카이트 양산(2027~2028)을 계획한다.", "달 원전은 규모가 작지만 단가가 지상의 수천 배다. NASA·DOE는 2030년 달 표면에 100kWe급 가스냉각 핵분열 원자로(FSP)를, 2028년 핵추진 우주선 첫 발사를 계획하며 2027 예산안에 핵추진·핵전력 독립 항목을 넣었다. 이 시장은 해외 밸류체인을 쓰기 어려운 우주·방산 원자로 특성상 미국 내 특수 기자재·연료(HALEU) 업체가 주도한다."], "bullets": ["LEO 발사비 $50,000+ → $2,700 → 목표 $100/kg 미만", "궤도 DC 경제성 임계 $200(Google Suncatcher) / 약 $500/kg(Starcloud)", "Google Suncatcher 궤도 시연 2027 예정", "FSP 100kWe 2030, 핵추진선 2028, Project Pele 2028", "폴리실리콘 초호황기(2011) PBR 4.9배가 역사적 상단으로 거론"], "kr": "OCI홀딩스(SpaceX 공급망 폴리 파트너십 보도), 대주전자재료(SpaceX로 추정되는 고객에 HJT용 Ag-Cu 페이스트 샘플 공급 확정), 동진세미켐, 한화솔루션(지상 탠덤과 동일 소재 플랫폼)이 거론된다. 실적 연결은 아직 초기다."}], "open": 1}], "note": "규제가 만든 이원 시장, 중국 구조조정, 탠덤의 금융 관문, 2028년 이후의 미국, 국내 10GW, 우주 에너지."}, {"h": "풍력·케이블 — 4편", "blocks": [{"t": "mods", "items": [{"name": "비용은 변동, 매출은 고정: 해상풍력 FID 부진의 구조와 재가격화", "pill": "2020~2026.08", "lede": "해상풍력의 문제는 LCOE가 아니라 저금리 시절 고정된 판매단가와 이후 오른 비용 사이의 간극이며, 유럽은 이를 메우는 재가격화를 시작했다.", "paras": ["풍력은 연료비가 없어 LCOE의 85~88%가 초기 투자 회수분이다. 2020~2021년 확정된 PPA·OREC(미국 주정부 해상풍력 인증서)는 저금리·저CAPEX를 전제로 했는데, 이후 기자재·설치비와 금리가 동시에 오르며 개발사가 요구하는 가격과 구매자가 수용할 수 있는 가격의 간극이 벌어졌다. WACC가 4.2%에서 10%로 오르면 해상풍력 LCOE는 $105에서 $163/MWh로 뛴다(Lazard).", "금리 충격은 프로젝트 단계별로 다르게 나타난다. FID 이전 프로젝트는 DSCR 하락으로 대출 가능액이 줄어 지연·지분 매각·재입찰로, FID 이후 프로젝트는 취소보다 자산가치 하락(손상차손)으로 먼저 나타난다. Ørsted는 2023년 약 5조원 손실과 미국 Ocean Wind 1·2(약 2.3GW) 취소, 2025년 600억DKK 유상증자·Hornsea4 취소, 1H26 미국 WACC +50bp로 24억DKK 손상을 인식했다.", "유럽 경매도 같은 경로를 밟았다. FiT에서 경쟁입찰로 넘어가며 무보조금·Negative bidding이 확산됐고, 낮은 판매가가 터빈·기자재 가격 인하로 전가됐다. 2023년 영국 AR5는 해상풍력 응찰이 전무했고 2025년 유럽에서 10.5GW가 유찰됐다. 설치량은 늘어도(2025년 글로벌 164.6GW) 중국이 70% 이상, 육상이 94%를 차지해 비중국 해상 기자재 업황 회복으로 보기 어려웠다.", "재가격화가 시작됐다. 영국은 AR6에서 상한가를 £44→£73/MWh로 올렸고, AR7(2026.1)에서는 예산 2배, 해상풍력 상한 약 £102→£113/MWh, CfD 계약기간 15→20년, 계획 단계 프로젝트 입찰 허용, 공급망 기여 평가(Clean Industry Bonus)를 도입해 역대 최대 약 8.2~8.4GW를 낙찰했다. 폴란드(€113~117), 아일랜드(€99/MWh) 등도 상한을 현실화하고 있다.", "개발사는 이제 WACC 대비 150~300bp, IRR 8.5% 이상을 요구하며 선별 투자한다. Clarksons는 2026년 글로벌 해상풍력 FID CAPEX를 297억달러(전년 390억)로 전망해 단기 공백은 남아 있지만, 재가격화가 진전되면 2~3년 후 하부구조물·설치 발주가 늘 것이다. 국내도 RPS 폐지·장기 계약시장 전환이 같은 재가격화 효과(매출 변동성 축소 → 요구수익률·조달금리 하락)를 낼 것으로 기대된다."], "table": {"cols": ["단계", "금리 상승의 1차 영향", "사업자 대응", "확인 지표"], "rows": [["운영 중", "자산가치 하락·차환비용 상승", "만기 연장, 지분 매각", "고정금리 비중, 물가연동"], ["FID·PF 완료", "NAV·기대 ROE 하락", "공사 지속, CAPEX 절감", "손상차손, 공정률"], ["계약 확보·FID 이전", "대출 가능액 감소", "FID 지연, 파트너 유치, 재협상", "PF 종결, IRR, farm-down"], ["신규 입찰", "요구 낙찰가 상승", "고가 입찰 또는 포기", "상한가, 계약기간, 물가연동"], ["기자재 발주", "확정발주 전환 지연", "생산계획 조정", "확정수주, book-to-bill"]]}, "bullets": ["육상 LCOE $37~99 vs 해상 $105~167/MWh(Lazard 2025)", "영국 AR7: 예산 9억→18억 파운드, CfD 20년, 약 8.2~8.4GW 낙찰(자료별 상이)", "영국 AR8(2027.2) 약 17GW 거론", "IRENA: 국가 간 금융비용 차이의 56%가 거시 요인", "2026.5 글로벌 펀드매니저 설문에서 풍력이 에너지 내 최하위 선호 — 기대치가 낮은 만큼 턴어라운드 신호 시 반응이 빠를 수 있음"], "kr": "국내 하부구조물(SK오션플랜트)·해저케이블(LS전선·대한전선)·시공(LS마린솔루션)은 FID 회복의 레버리지가 가장 큰 영역이고, 국내 RPS→장기계약 전환이 동일한 재가격화 논리로 연결된다."}, {"name": "풍력 회복의 순서: 육상 → OEM → 타워·베어링 → 해상", "pill": "2025.07~2026.08", "lede": "풍력 업황 회복은 한꺼번에 오지 않고, 발주 구조에 따라 품목별 시차를 두고 번진다.", "paras": ["풍력 발주는 입찰·오프테이크 → 인허가·계통 → FID → 터빈 선정 → 하부구조물·타워 → 케이블·변전 → 설치 → COD·O&M 순으로 진행된다. 중요한 것은 누가 발주하느냐다. 타워·베어링은 터빈 OEM이 발주하므로 OEM 수주보다 6~12개월 늦게 움직이고, 하부구조물·해저케이블은 디벨로퍼나 송전망 사업자(TSO)가 직접 발주하며, 수출·HVDC 케이블은 COD 3~5년 전 슬롯을 잡아 가장 먼저 움직인다.", "1단계 회복은 육상과 OEM에서 확인됐다. 터빈 ASP는 저점 대비 30~50% 높은 수준을 유지하고, Vestas는 2Q26 수주 +67%·EBIT 마진 10.4%, Nordex는 EBITDA 10.3%, Siemens Gamesa는 15개 분기 만에 흑자로 돌아섰다. 반면 GE Vernova Wind는 2Q26 주문 -40%·EBITDA 적자로 미국 육상의 인허가 지연·관세 영향을 드러냈다.", "미국 육상은 세액공제 기한이 수요를 당겼다. OBBBA로 2026.7.4 착공 또는 2027년 말 준공분만 공제가 인정되자 Rush Order가 발생해 Vestas 북미 수주가 3Q25 2.5GW(+130%)로 급증했고, 미국 육상 터빈 주문은 4Q25 2.3GW로 분기 최대를 기록했다. 2026년 미국 풍력 설치는 11.8GW(+54.9%)로 전망되지만, 2027년 AMPC 종료 이후에는 감소가 우세하고, 다만 세액공제 이후에도 연 10GW 내외와 Full-Repowering(2029년 3GW)이 받쳐줄 것이란 시각도 있다.", "2단계는 타워·베어링이다. 미국에서는 경쟁 타워사 Broadwind가 2026.5 풍력에서 철수했고 Arcosa가 공장을 4곳에서 2곳으로 줄여 타워 업계 캐파가 10GW에서 7GW로 줄 전망이다(2027E). 현지 공급 경쟁이 완화되는 가운데 Capa Agreement 기반 2027년 물량 발주가 4Q26 시작될 예정이다. 베어링은 베트남 이전을 마치고 가동률이 20%대에서 80%로 올랐고, 신규 유럽 고객(Vestas 2027, Enercon·Nordex 2028) 퀄이 진행 중이다.", "3단계인 해상은 가장 늦다. 해저케이블은 전력망 수요 덕분에 가장 견조하지만, 하부구조물은 국내 안마 해상풍력 재검토 등으로 2026년 실적 공백이 생기고 2027~2028년 공급 우위 이후 2029년 타이트해질 것으로 전망된다. 한편 2026년 글로벌 합계는 중국 5개년 계획 전환기 감소(93.9GW, -16.6%)로 -4%지만, 한국 기업이 접근 가능한 중국 외 시장은 59.2GW(+26.4%)로 성장한다는 점을 구분해야 한다."], "table": {"cols": ["밸류체인", "발주자", "발주 시점", "실적 반영"], "rows": [["터빈 OEM", "디벨로퍼", "FID 전 조건부, 주로 FID 이후", "가장 빠름"], ["타워·베어링", "터빈 OEM", "OEM 수주 후", "터빈 대비 6~12개월 후행"], ["하부구조물", "디벨로퍼·EPCI", "FID·터빈 선정 후", "프로젝트별 상이"], ["해저케이블", "디벨로퍼·TSO", "COD 3~5년 전", "비교적 선행"], ["설치", "디벨로퍼·EPCI", "제작계약 이후", "프로젝트별"], ["O&M", "운영사업자", "COD 이후", "반복 매출"]]}, "bullets": ["2026E 지역별 신규 설치: 유럽 24.8GW(+56.6%), 미국 11.8GW(+54.9%), 중국 외 합계 59.2GW(BNEF)", "독일 Wind-on-Land Act: 국토 2% 풍력 부지 의무, 신규 인허가 20.8GW 사상 최대", "글로벌 WTIV 선대 78→120척, 오더북 48→14척(2023.2→2026.2, Clarksons)", "리파워링: 유럽 2025년 2.0GW, GE 미국 잠재 10GW", "풍력 기자재는 터빈사 선행 P/E 대비 40~50% 할인이 관행"], "kr": "씨에스윈드(타워 1위, 4대 OEM 모두 고객), 씨에스베어링(GE 의존 80%대 → 유럽 다변화), SK오션플랜트(대만 자켓 1위·독일 해상변전소 자켓), LS전선·대한전선(케이블)이 순서대로 회복 레버리지를 가진다."}, {"name": "국내 해상풍력: 허가 30GW+, 실행 1%의 병목 해소", "pill": "2025.02~2026.09", "lede": "인허가·계통·금융 세 병목이 2026년 동시에 제도적으로 완화됐지만, 목표 하향과 군 작전성 문제로 실발주는 2026년 하반기 이후, 본격화는 2029년 이후로 보는 시각이 많다.", "paras": ["국내 해상풍력은 발전사업허가 물량이 30.5GW(2025, 90개소)~35.6GW(2025.11, 103개)에 달하지만 실제 설치는 350~400MW 수준으로 실행률이 약 1%다. 민간 개별 개발 구조에서 착공까지 7~10년(인허가 평균 71개월)이 걸렸고, 발전사업허가·해역이용·환경평가를 모두 마친 뒤 마지막에 받는 군 작전성 검토에서 부동의·위치 변경이 나오면 막대한 매몰비용이 생겼다. 사업허가 해상풍력의 50% 이상이 외국 기업 소유라는 점도 특징이다.", "계통도 막혀 있었다. 호남→수도권 송전능력은 4.5GW인데 2036년 호남 잉여전력은 58.5GW로 전망됐고, 호남 전 변전소가 계통관리변전소로 지정돼 2032년까지 신규 접속이 제한됐다. 금융은 수조원 규모 프로젝트에 PF 부채비율 70~80%가 필요해 고금리기에 조달이 난항이었다.", "2025~2026년 세 병목이 동시에 제도적으로 풀렸다. 해상풍력특별법(2026.3.26 시행)은 정부가 군 사전 심사를 거친 발전지구를 지정하고 28개 법률 42개 인허가를 의제 처리해 사업 기간을 10년에서 6.5년 이내(착공까지 약 7.5년 → 3.5~5년)로 줄이는 것이 목표다. 서해안 에너지고속도로(620km 해상 HVDC, 8GW, 12~13.6조원)는 송전능력을 약 39GW로 늘리고, 국민성장펀드 1호가 신안우이(390MW, 총사업비 3.4조원)에 7,500억원을 투입해 2.89조원 금융주선을 마쳤다.", "그러나 목표는 현실화됐다. 2025.12 정부는 11차 전기본의 2030년 풍력 18.3GW(해상 14.3GW)를 9GW(해상 3GW, 착공 포함 10.5GW)로 낮추고 2035년 37GW(해상 25GW), 2040년 60.5GW 경로를 제시했다. 착공 기준 10.5GW를 맞추려면 2026년 하반기~2027년 상반기 발주가 몰려야 하지만, 특별법 기반 발주는 2029년 이후 본격화될 것이라는 전망도 있다. 안마(532MW)는 군 작전성 이슈로 지연됐다가 재검토 목록에 올라 있다.", "기자재 시장 규모는 가정에 따라 크게 다르다. 한 추정은 12차 전기본 잠정 목표 기준 2026~2040 핵심 기자재 TAM을 253조원(해상 229조원, 터빈 108·하부구조물 63·케이블 59·타워 23조원)으로 추정했고, 국산 기자재 사용 비율 목표는 39%에서 60% 이상, 터빈 생산능력은 0.8GW에서 3.0GW로 제시됐다. 대형 해상 터빈은 아직 내재화되지 않아 국산화 가능성이 큰 하부구조물·케이블의 수혜 강도가 크다는 평가다."], "table": {"cols": ["상태", "주요 프로젝트"], "rows": [["상업운전", "전남해상풍력 1단지, 영광 낙월(365MW, 일부), 탐라, 한림(일부)"], ["착공·공사중", "신안우이(390MW, 2029.2 COD 목표), 영광 낙월"], ["PF·FID 완료", "영광 야월, 고창 동촌"], ["인허가 완료", "완도금일 1·2, 태안, 한동·평대, 한빛, 해송3, 해울이2"], ["인허가 진행", "압해, 다대포, 서남권 시범(2.4GW), 굴업도, 금오도"], ["중단·재검토", "영광 안마1·2(532MW), 울산 반딧불이(부유식 750MW)"]]}, "bullets": ["해상풍력 발전단가 목표 330원(2026) → 250원(2030) → 150원/kWh(2035), 현재 LCOE 약 $288/MWh(BNEF)", "고정가격 계약기간 20→25년, CfD·물가연동 검토", "항만 설치 역량 0.6 → 4GW/년, 15MW+ WTIV 2척 → 2030년 6척 이상", "해상풍력 중장기 입찰 이행안: 연 4GW+, 2030년까지 28GW 우선입찰(2026.6)", "고정가격계약 선정 5.9GW 중 착공 이후 단계 14.5%"], "kr": "SK오션플랜트(자켓, 안마 2026.6 스틸컷팅 예정이었으나 재검토), 씨에스윈드, LS마린솔루션(안마·신안우이·태안·해송 우선협상), LS전선·대한전선, 두산에너빌리티·유니슨(터빈), SK이터닉스(신안우이·굴업도 개발), 한화오션(설치선)이 연결된다.", "svg": "<svg viewBox=\"0 0 940 320\" role=\"img\" aria-label=\"해상풍력 목표 GW에 GW당 CAPEX와 품목 비중을 곱해 내려가면 국산화가 쉬운 하부구조물·케이블 시장이 나온다\"><defs><marker id=\"a-tr27\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"20\" y=\"30\" width=\"156\" height=\"54\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--accent)\"/><text x=\"98\" y=\"54\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">설치 1GW<\/text><text x=\"98\" y=\"68\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">× 7~8조원<\/text><line x1=\"178\" y1=\"57\" x2=\"204\" y2=\"57\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr27)\"/><rect x=\"206\" y=\"30\" width=\"156\" height=\"54\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"284\" y=\"54\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">해저송전망<\/text><text x=\"284\" y=\"68\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">18~20%<\/text><line x1=\"364\" y1=\"57\" x2=\"390\" y2=\"57\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr27)\"/><rect x=\"392\" y=\"30\" width=\"156\" height=\"54\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"470\" y=\"54\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">송전<\/text><text x=\"470\" y=\"68\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">45%<\/text><line x1=\"550\" y1=\"57\" x2=\"576\" y2=\"57\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr27)\"/><rect x=\"578\" y=\"30\" width=\"156\" height=\"54\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"656\" y=\"54\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">케이블 55%<\/text><text x=\"656\" y=\"68\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">시공 45%<\/text><line x1=\"736\" y1=\"57\" x2=\"762\" y2=\"57\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr27)\"/><rect x=\"764\" y=\"30\" width=\"156\" height=\"54\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"842\" y=\"54\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">외부망 65%<\/text><text x=\"842\" y=\"68\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">내부망 35%<\/text><text x=\"20\" y=\"110\" font-size=\"11\">병행: 자켓 하부구조물 GW당 약 8,000억원 · 허가 35.6GW × GW당 약 8조원 ≈ 285조원 사업 규모 (환율 1,400~1,450원, NREL 비중)<\/text><text x=\"20\" y=\"150\" font-size=\"12\" font-weight=\"600\">국내 풍력 핵심 기자재 TAM 2026~2040 = 253조원 (해상 91%, 업계 추정)<\/text><rect x=\"20.0\" y=\"164.0\" width=\"382.2\" height=\"40.0\" fill=\"currentColor\" fill-opacity=\".25\"/><text x=\"212\" y=\"182\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">터빈<\/text><text x=\"212\" y=\"198\" font-size=\"11\" text-anchor=\"middle\">108조원<\/text><rect x=\"404.2\" y=\"164.0\" width=\"222.1\" height=\"40.0\" style=\"fill:var(--accent)\" fill-opacity=\".5\"/><text x=\"516\" y=\"182\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">하부구조물<\/text><text x=\"516\" y=\"198\" font-size=\"11\" text-anchor=\"middle\">63조원<\/text><rect x=\"628.3\" y=\"164.0\" width=\"207.9\" height=\"40.0\" style=\"fill:var(--accent)\" fill-opacity=\".5\"/><text x=\"733\" y=\"182\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">케이블<\/text><text x=\"733\" y=\"198\" font-size=\"11\" text-anchor=\"middle\">59조원<\/text><rect x=\"838.2\" y=\"164.0\" width=\"79.8\" height=\"40.0\" style=\"fill:var(--ok)\" fill-opacity=\".5\"/><text x=\"879\" y=\"182\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">타워<\/text><text x=\"879\" y=\"198\" font-size=\"11\" text-anchor=\"middle\">23조원<\/text><text x=\"20\" y=\"234\" font-size=\"11\" style=\"fill:var(--accent)\">터빈은 대형 해상 모델이 내재화되지 않아 해외 의존 — 국산화 여지가 큰 하부구조물·케이블이 수혜 강도가 가장 높다<\/text><text x=\"20\" y=\"262\" font-size=\"11\">시나리오 차이: 2030 누적 3.2GW(블룸버그) vs 2035 25GW(정부) → 해저송전 시장 1.9조 vs 15조원(8배)<\/text><text x=\"20\" y=\"296\" font-size=\"10\" fill-opacity=\".65\">업계 추정치 — 목표 반복 하향 이력을 감안해 보수·목표 두 시나리오를 함께 볼 것<\/text><\/svg>", "cap": "정부 목표 GW에 GW당 CAPEX(7~8조원)와 NREL 품목 비중을 곱해 내려가면 해저송전망·케이블·하부구조물 시장이 나온다. 국내 풍력 기자재 TAM 253조원(2026~2040, 업계 추정) 중 국산화 여지가 큰 하부구조물(63조)·케이블(59조)의 수혜 강도가 가장 높고, 목표 반복 하향 이력 때문에 보수 시나리오와 함께 봐야 한다."}, {"name": "해저케이블·HVDC와 포설선: 과점이 만든 병목", "pill": "2025.07~2026.09", "lede": "해저케이블은 공급자가 소수인 가운데 해상풍력과 국가 간 전력망 수요가 겹치며, 대형 포설선 보유 여부가 수주와 가격 결정력을 가르는 시장이 됐다.", "paras": ["해저케이블 수요는 세 갈래다. 단지 내부를 잇는 인터어레이는 풍력 설치량에, 육지로 보내는 수출 케이블은 프로젝트 FID에, HVDC·인터커넥터는 국가 간 전력망 투자에 연동된다. 그래서 풍력 업황이 부진해도 전력망 투자가 이어지는 한 케이블 업황은 견조하고, Prysmian·NKT Transmission의 마진은 2Q26 20%를 넘었다. 유럽 3사 합산 수주잔고는 4Q25 약 €340억으로 연매출 4~6년치다.", "공급은 과점이다. 일본 내수 업체를 빼면 상위 4개사가 85%를 점유하고, 525kV 이상 HVDC 상용화 업체는 Prysmian·NKT·Nexans·LS전선·Sumitomo 5개사뿐이다. 선두 업체들은 2028~2029년 생산 물량을 이미 확보해 선별 수주를 하고 있다. 유럽은 2025~2030 신규 해상풍력 51.4GW로 아시아의 약 6배라, 글로벌 빅4가 아시아로 물량을 밀어낼 유인이 작아 아시아는 한국 업체의 과점 시장이 되고 있다는 분석이 있다.", "포설선은 더 희소하다. 전 세계 가용 CLV는 약 20척, 건조 중 7척이며 신조 1척은 2~3억달러·2~3년이 걸린다. 선두 제조사는 모두 1만톤급 이상 DP3 CLV를 보유·건조 중이다(NKT Eleonora 23,000톤, Prysmian Alessandro Volta 19,000톤, Jan De Nul 28,000톤). 국내는 선박법 카보타지로 외국 포설선 진입이 막히고, 풍력 입찰 안보지표로 중국산 케이블이 배제돼 사실상 국내 업체 시장이다.", "국내 최대 물량은 서해안 HVDC(에너지고속도로)다. 1단계 새만금-서화성(2GW, 2030 준공, 2.8조원: 컨버터 1.0·변전소 0.6·송전 1.2조원) → 2단계 신해남-당진(2036) → 3단계 신해남-서인천·새만금-영흥(2038)으로 이어지는 10년짜리 연속 발주 구조다. 한 추정은 사업비 중 해저케이블 제조·시공을 약 6조원(54%)으로 봤고, 동해안-신가평 HVDC(EP1, 4GW)는 2027 상반기 완공 예정이다.", "해상풍력 GW를 케이블 시장으로 환산하면, 1GW당 건설비 약 7조원 → 해저송전망 18~20% → 송전 45% → 케이블 55%·시공 45% 순으로 내려간다. 2030년 누적 3.2GW(블룸버그) 가정 시 송전 시장 1.9조원, 2035년 25GW(정부 목표) 가정 시 15조원이다. 해외에서는 베트남(PDP8 해상풍력 2030 6GW·2050 139GW)과 아세안 해저 HVDC(베트남-말레이시아-싱가포르 약 1,000km)가 다음 시장으로 거론된다."], "table": {"cols": ["보유사", "선박", "톤급", "취항"], "rows": [["Jan De Nul", "Fleeming Jenkin / William Thomson", "28,000", "2026~2027"], ["NKT", "Eleonora", "23,000", "2027"], ["Prysmian", "Alessandro Volta", "19,000", "2027"], ["Nexans", "Electra", "13,500", "2026"], ["LS마린솔루션", "신조(Tersan 건조)", "13,000", "2028"], ["대한전선", "PALOS", "4,400", "보유"], ["LS마린솔루션", "GL2030(증설)", "4,000→7,000", "2026"]]}, "bullets": ["국내 해상풍력 1GW당 케이블 약 8,000억원(자재 60:포설 40)", "안마 외부망 2,550억원(케이블 1,610억+시공 940억), 내부망 1,816억원(대한전선 턴키)", "LS전선 별도 수주잔고 약 12조원, 동해 4~5공장 물량 2031년까지, 버지니아 공장 6.81억달러(1Q28 양산)", "아시아(중국 제외) 해상풍력 케이블 발주 0.7조 → 4.4조원(2025→2032E, CAGR 29.5%)", "미국은 Jones Act로 자국적 CLV 1~2척 — 외국 선박과 협업 필수"], "kr": "LS(LS전선), 대한전선(당진 해저 2공장 2027), LS마린솔루션(국내 유일 해저 전력케이블 시공 트랙레코드), LS에코에너지(베트남 PTSC JV), 가온전선(내부망 진출 계획)이 핵심이며, 발주처는 한국전력이다."}]}], "note": "FID 부진의 구조와 재가격화, 회복의 순서, 국내 해상풍력 병목, 해저케이블·포설선 과점."}, {"h": "저장·온사이트 — 5편", "blocks": [{"t": "mods", "items": [{"name": "AI 데이터센터 전력의 양과 질: 3계층 구조", "pill": "2025.11~2026.05", "lede": "AI 데이터센터는 전기를 '많이' 쓰는 동시에 '깨끗하게' 써야 하며, 시간축별로 다른 설비가 이를 나눠 맡으면서 에너지전환 밸류체인 전체에 새 수요가 생겼다.", "paras": ["양의 측면에서 AI 데이터센터(AIDC)는 전력·데이터·반도체를 투입해 토큰을 생산하는 공장이다. 소비전력은 IT 부하×PUE×모델 규모×가동률×시간의 곱으로 커지고, GPU 효율이 개선돼도 토큰당 비용이 내려가 사용량이 더 늘어나는 제번스의 역설이 작동한다. PUE가 1.4에서 1.2로 좋아져도 IT 부하가 100MW에서 300MW로 늘면 총 전력은 140MW에서 360MW가 된다. 랙 전력은 일반 5~20kW에서 GB200 NVL72 약 120kW, Rubin Ultra NVL576 600kW~1MW(2027)로 커진다.", "미국 데이터센터 전력 사용량은 2023년 176TWh(전체의 4.4%)에서 2028~2030년 380~790TWh(9~17%)로 전망되고(LBNL·EPRI), 글로벌 데이터센터 전력은 2024년 415TWh에서 2030년 945TWh(IEA 기준 시나리오)로 늘어난다. 미국 데이터센터 용량은 2022말 17.5GW에서 2025말 34.3GW로 96% 늘었고, 3Q25 전 세계 건설 중 23.1GW의 73%(17.0GW)가 미국이다.", "질의 측면에서 AIDC는 전압 안정도 ±5%→±1~2%, 순간정전 허용 수백ms→20ms 미만, 고조파 왜곡 5%→3% 이하를 요구한다. 수천~수만 GPU가 동기화돼 한 곳의 이상이 전체 학습 재시작으로 번지기 때문이다. Siemens Energy 측정 사례에서 0.3초 만에 정격의 12%에서 57%로 수요가 뛰어 램프 속도가 초당 정격의 190%에 달했고, 비학습 시 1.5MW였던 변동폭이 학습 시 15MW로 커진다.", "그래서 전력 공급은 시간축별 3계층으로 나뉜다. ①전력 품질 정제(상시·ms~s): 온라인 UPS와 슈퍼커패시터 CBU, ②에너지 완충(분~시간): 2~4C 고출력·6,000사이클 이상의 대용량 ESS, ③에너지 공급(상시): 가스터빈·태양광·계통·장기적으로 SMR이다. 회전 발전기인 가스터빈·원전은 관성으로 주파수를 스스로 잡고, ESS는 ms 단위로 가장 빨리 반응하며, 태양광은 비용·탄소를 담당한다. 계층마다 수혜 산업이 달라 경쟁보다 보완 관계다.", "800VDC 전환은 이 구조를 강화한다. AC→DC→AC→DC 다단 변환을 줄여 종단 효율을 약 5% 높이고 구리를 약 45% 줄이지만(1MW 랙을 54V로 공급하면 버스바 구리만 약 200kg), 같은 비율의 전압 변동도 절대폭이 커져 CBU가 필수가 되고 중앙 정류기가 단일 실패지점이 되어 DC 버스에 대용량 ESS를 직결해야 한다. 2026.3 TI와 Flex는 슈퍼커패시터 CBU를 기본 구성으로 넣은 800VDC 레퍼런스 디자인·파워랙을 공개했다."], "table": {"cols": ["계층", "시간축", "핵심 설비", "요구 사양", "공급망"], "rows": [["전력 품질 정제", "상시, ms~s", "온라인 UPS, 슈퍼커패시터 CBU", "전압 ±1~2%, THD 3% 이하, 순간정전 20ms 미만", "Schneider·Vertiv·Eaton·ABB·Delta(60%+), 비나텍·LS머트리얼즈"], ["에너지 완충", "분~시간", "대용량 ESS(LFP), PCS·BMS", "2~4C 방전, 6,000사이클 이상", "셀·소재, SI(Tesla·Fluence)"], ["에너지 공급", "상시", "가스터빈, 태양광, 계통, 장기 SMR", "속도·주파수 응답·가동률", "터빈, 변압기, GIS, STATCOM"]]}, "bullets": ["AIDC 소비전력 중 냉각 비중 약 39%(Deloitte)", "ChatGPT 주간 이용자 1억(2023.11) → 9억(2026.2)", "검색 0.3Wh vs LLM 쿼리 3~10Wh", "AIDC향 ESS 배터리 12GWh(2025) → 272GWh(2030E, GGII)", "데이터센터 온사이트 가스발전 부착 ESS 0.6GWh(2025) → 약 1.5GWh(2027~28E)"], "kr": "ESS 셀(LG에너지솔루션·삼성SDI·SK온), 슈퍼캡(비나텍·LS머트리얼즈), UPS용 셀(삼성SDI), 가스터빈(두산에너빌리티), 배전·DC(LS ELECTRIC·효성중공업), 특수변압기(산일전기)가 계층별로 대응한다."}, {"name": "미국 ESS: 중국산 LFP의 가격 우위가 사라지는 산식", "pill": "2025.10~2026.09", "lede": "셀 가격은 중국산이 절반이지만 관세·세액공제·AMPC를 넣으면 격차가 사라지거나 역전되고, 미국 설치량은 수요가 아니라 '적격 공급'이 결정하게 된다.", "paras": ["출발점은 가격 차다. 중국 LFP ESS 셀은 kWh당 $50~55, 한국 셀은 $90~95 수준이다. 그러나 중국산에는 관세가 붙고, 미국에서 생산한 한국 셀은 kWh당 $35의 AMPC를 받아 일부를 고객과 나눈다. 관세 수준은 자료마다 다르게 제시된다. 기본 3.4%+301조 25%+122조 임시 10%=38.4%(122조 만료 시 28.4%)라는 계산, 2026년 301조 인상으로 합산 58.4%라는 계산, 최대 82.4%라는 언급이 공존해 인용 시 기준 확인이 필요하다.", "더 큰 변수는 투자세액공제다. ESS 시스템가 $250~300/kWh의 30%인 $75~90/kWh를 PFE 규정 위반 시 통째로 잃는다. OBBBA는 ESS 직접원가 중 금지외국법인(PFE)과 무관한 비중(MACR)이 2026년 55%에서 2030년 이후 75%를 넘어야 ITC를 준다. 그리드 BESS 원가에서 셀이 52%, 배터리 관련 합계가 60~65%라 셀을 중국산으로 쓰면 기준을 맞추기 어렵다. AMPC 자체에도 PFE 제한이 적용돼 양극재·음극재 등 하위 소재의 탈중국화가 뒤따라야 한다.", "그 결과 계산은 이렇게 된다. 관세 반영 중국산 LFP 셀 $90~100/kWh vs 한국·미국산 약 $100/kWh(AMPC 감안 시 역전), 시스템 기준 중국산 약 $134 vs 미국 생산 약 $135/kWh로 2026년 비슷해지고 2027년부터 미국산 우위라는 추정이 있다. 다른 추정은 명목 격차 $40 안팎이 관세·AMPC 반영 후 $15~16/kWh로 줄어든다고 본다. 여기에 CHARGE Act(원격 모니터링 가능한 중국 기술 ESS 수입 금지, 2026.2 발의)와 NDAA 154조(2027.10 국방 조달 금지)가 더해진다.", "공급은 제한적이다. 미국 ESS 셀 캐파는 한국 3사·Tesla(약 10GWh)·Canadian Solar(6GWh)·AESC 정도이고, 역내 ESS 셀 캐파 대비 수요는 2025년 40/59GWh(부족), 2026년 69/68GWh(균형), 2027년 83/77GWh(실질 공급 약 70GWh로 부족 지속)로 추정된다. 다른 자료는 2028년 수요 140~150GWh 대비 PFE 적격 캐파 142GWh로 본다. 2024년 미국 ESS 배터리의 약 87%가 중국산이었던 만큼 대체 속도가 관건이다.", "한국 셀 업체는 EV 라인을 ESS로 돌리고 있다. LG에너지솔루션은 미시간 LFP(17GWh) 가동 후 2026말 30GWh, 2027말 50GWh+를 계획하고, 삼성SDI는 스타플러스 NCA 라인 전환(4Q25)과 LFP 라인(4Q26)으로 2027말 약 30~36GWh, SK온은 조지아 라인 전환과 플랫아이언 수주를 진행 중이다. 다만 한 추정은 북미 셀 캐파가 IRA로 충분한 만큼 가치가 셀보다 협상력 있는 부품·SI와 운용 소프트웨어(GPM 80% 이상)로 이동할 수 있다고 경고한다."], "table": {"cols": ["항목", "내용"], "rows": [["관세(122조 포함)", "3.4% + 301조 25% + 122조 10% = 38.4%(만료 시 28.4%)"], ["관세(다른 산정)", "2025년 40.1% → 2026년 58.4%(301조 7.5→25% 인상 반영), 최대 82.4% 언급도 존재"], ["48E ITC", "기본 6%, 임금·도제 요건 충족 시 30%, 보너스 가산"], ["MACR(ESS)", "2026 55% → 2027 60% → 2028 65% → 2029 70% → 2030~ 75%"], ["배터리 원가 비중", "셀 52%, 배터리 관련 합계 60~65%(IRS Notice 2025-08)"], ["AMPC", "미국 생산 셀 $35/kWh, 모듈 $45/kWh(합계 기준 표기 상이), PFE 제한 적용"]]}, "bullets": ["2025 글로벌 ESS 수요 247GWh 중 미국 57GWh(23%), 미국 내 한국 점유율 약 14%(업계 추정)", "2030 미국 BESS 배터리 수요 약 120GWh, 역내 적격 캐파 중 한국 3사 87%(업계 추정)", "LGES ESS 매출 3.1조(2025) → 21.7조원(2028E), 삼성SDI 2.9조 → 9.2조원(업계 추정)", "DOE: 미국 BESS 구성품 중국산 비중 70~100%(2024.9)", "중국 배터리·소재 수출통제(2025.11): 300Wh/kg+ 셀, LFP 양극재, 흑연 음극재, 장비"], "kr": "LG에너지솔루션·삼성SDI·SK이노베이션(SK온) 외에 엘앤에프(LFP 양극재), 서진시스템(인클로저), 한중엔시에스·신성에스티(냉각·히트싱크), 율촌화학(파우치)이 비중국 공급망 수혜로 묶인다.", "svg": "<svg viewBox=\"0 0 920 300\" role=\"img\" aria-label=\"중국산 LFP 셀은 명목가가 절반이지만 관세·AMPC·ITC 적격성을 넣으면 실질 격차가 $15~16/kWh로 줄어든다\"><defs><marker id=\"a-tr26\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><text x=\"20\" y=\"26\" font-size=\"12\" font-weight=\"600\">미국 ESS 셀 구매 비교 ($/kWh, 2026 업계 추정 · 축척 아님)<\/text><text x=\"20\" y=\"88\" font-size=\"12.5\" font-weight=\"600\" style=\"fill:var(--alert)\">중국산 LFP<\/text><rect x=\"190\" y=\"50\" width=\"160\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"270\" y=\"78\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">명목 셀가<\/text><text x=\"270\" y=\"94\" font-size=\"11.5\" text-anchor=\"middle\" fill-opacity=\".78\">$50~55<\/text><line x1=\"352\" y1=\"82\" x2=\"378\" y2=\"82\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr26)\"/><rect x=\"380\" y=\"50\" width=\"160\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--alert)\"/><text x=\"460\" y=\"78\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">+ 관세<\/text><text x=\"460\" y=\"94\" font-size=\"11.5\" text-anchor=\"middle\" fill-opacity=\".78\">38.4~58.4%<\/text><line x1=\"542\" y1=\"82\" x2=\"568\" y2=\"82\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr26)\"/><rect x=\"570\" y=\"50\" width=\"160\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--alert)\"/><text x=\"650\" y=\"78\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">ITC 적격성<\/text><text x=\"650\" y=\"94\" font-size=\"11.5\" text-anchor=\"middle\" fill-opacity=\".78\">PFE 미달 위험<\/text><line x1=\"752\" y1=\"82\" x2=\"778\" y2=\"82\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" style=\"stroke:var(--accent)\" marker-end=\"url(#a-tr26)\"/><text x=\"20\" y=\"198\" font-size=\"12.5\" font-weight=\"600\" style=\"fill:var(--ok)\">한국산(미국 생산)<\/text><rect x=\"190\" y=\"160\" width=\"160\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"270\" y=\"188\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">명목 셀가<\/text><text x=\"270\" y=\"204\" font-size=\"11.5\" text-anchor=\"middle\" fill-opacity=\".78\">$90~95<\/text><line x1=\"352\" y1=\"192\" x2=\"378\" y2=\"192\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr26)\"/><rect x=\"380\" y=\"160\" width=\"160\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--ok)\"/><text x=\"460\" y=\"188\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">− AMPC<\/text><text x=\"460\" y=\"204\" font-size=\"11.5\" text-anchor=\"middle\" fill-opacity=\".78\">$35 × 고객 공유분<\/text><line x1=\"542\" y1=\"192\" x2=\"568\" y2=\"192\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr26)\"/><rect x=\"570\" y=\"160\" width=\"160\" height=\"64\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--ok)\"/><text x=\"650\" y=\"188\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">ITC 적격성<\/text><text x=\"650\" y=\"204\" font-size=\"11.5\" text-anchor=\"middle\" fill-opacity=\".78\">30% 유지<\/text><line x1=\"752\" y1=\"192\" x2=\"778\" y2=\"192\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" style=\"stroke:var(--accent)\" marker-end=\"url(#a-tr26)\"/><rect x=\"780\" y=\"50\" width=\"120\" height=\"174\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--accent)\"/><text x=\"840\" y=\"102\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">실질 비교<\/text><text x=\"840\" y=\"118\" font-size=\"11.5\" text-anchor=\"middle\" fill-opacity=\".78\">중국산(관세 후)<\/text><text x=\"840\" y=\"133\" font-size=\"11.5\" text-anchor=\"middle\" fill-opacity=\".78\">$90~100<\/text><text x=\"840\" y=\"149\" font-size=\"11.5\" text-anchor=\"middle\" fill-opacity=\".78\"><\/text><text x=\"840\" y=\"164\" font-size=\"11.5\" text-anchor=\"middle\" fill-opacity=\".78\">한국·미국산<\/text><text x=\"840\" y=\"180\" font-size=\"11.5\" text-anchor=\"middle\" fill-opacity=\".78\">약 $100<\/text><text x=\"20\" y=\"262\" font-size=\"11.5\" font-weight=\"600\" style=\"fill:var(--accent)\">→ ITC 30%(시스템가 $250~300의 $75~90)를 잃을 위험이 셀 단가 차이보다 커서 적격성이 구매를 결정한다<\/text><text x=\"20\" y=\"286\" font-size=\"10.5\" fill-opacity=\".8\">관세 산정은 자료마다 38.4%(122조 포함)·58.4%·최대 82.4%로 다르다 — 원문 기준 확인 필요<\/text><\/svg>", "cap": "명목 셀가는 중국산이 한국산의 절반이지만 관세가 붙고, 한국산 미국 생산 셀은 AMPC($35/kWh)의 일부를 고객과 나눈다. 결정적 변수는 **ITC 적격성**으로, PFE 미달 시 잃는 $75~90/kWh가 셀 단가 차이보다 크다."}, {"name": "국내 ESS: 실효용량으로 본 필요량과 중앙계약시장", "pill": "2025.07~2026.09", "lede": "재생에너지 설비가 명목상 충분해도 피크 시간에 계통에 기여하는 실효용량은 턱없이 작아, 국내 ESS는 연 15GWh 규모의 구조적 시장이 되고 한국 배터리 산업의 첫 후방 기지가 된다.", "paras": ["핵심 개념은 피크기여도다. 11차 전기본 기준 태양광은 설비용량의 14.3%, 풍력은 2.4%만 최대수요 시간대에 기여한다. 한국도 태양광이 늘면서 최대수요 시간대가 일몰 시점으로 이동했고(덕커브), 2026.4 전기요금 개편에서 최대부하 시간이 18~21시로 바뀌었다.", "12차 전기본 재전망 기준 2040년 최대수요 165GW에 예비율 22%를 적용하면 필요 설비는 201.3GW다. 원전·SMR 40.7GW, LNG 79.6GW, 양수 8.9GW에 태양광 171GW(실효 24.5GW)·풍력 65GW(실효 1.6GW)를 더해도 40.1GW가 부족하다. 이를 ESS로 메우면 태양광 연계 175GWh(신규 태양광 138GW×37%×PCS 배수 0.7, 5시간)와 풍력 연계 44.5GWh, 합계 약 220GWh가 필요하고, 석탄 36.7GW를 대체 없이 폐지하면 446GWh로 늘어난다(업계 추정).", "시장은 정부 주관 중앙계약시장으로 열린다. 1차(2025.7, 536MW)는 6시간 이상 장주기 ESS를 15년간 낙찰가로 보상했고, 1·2차 합계 6.8GWh 중 삼성SDI 56%(1차 76%, 2차 35%), SK온 25%(2차 50%), LG에너지솔루션 19%를 가져갔다. 3차(약 540MW)가 2026.9 진행됐고, 평가가 가격 중심에서 국내 공급망 기여도로 이동하고 있다. 제주 8시간 ESS는 7월 실효용량비율 98.25%를 인정받아 장주기일수록 용량정산에 유리하다.", "규제도 ESS 수요를 만든다. 계통 포화 변전소라도 발전량 일부를 ESS에 저장해 피크에 방전하는 '출력제어 조건부 접속'에 동의하면 예외적으로 접속을 허용한다. 반면 2026.4 계절·시간대별 요금 개편으로 피크저감용 BTM ESS 수익성은 악화됐고, ESS 충전요금 할인 일몰도 부담이다.", "산업적 의미는 이익보다 공급망이다. 국내 셀 3사의 LFP ESS 캐파는 5GWh 미만이지만 10GWh당 CAPEX 약 1.5조원 기준 3사 각 약 0.8조원이면 대응할 수 있다. 북미·중국은 고객이 시스템을 내재화해 셀 단가(kWh당 $90 미만)만 받지만 국내는 셀사가 시스템까지 맡아 ASP 약 $170/kWh를 가정할 수 있고, 연 3.3만톤의 LFP 양극재·전해액·분리막 수요가 국내 탈중국 소재 생태계를 만들어 미국 PFE 대응 무기가 된다는 논리다."], "table": {"cols": ["업체", "1차(2025.7)", "2차(2026.2)", "합계·점유율"], "rows": [["삼성SDI", "2.6GWh (76%)", "1.2GWh (35%)", "3.8GWh (56%)"], ["SK온", "0", "1.7GWh (50%)", "1.7GWh (25%)"], ["LG에너지솔루션", "0.8GWh (24%)", "0.5GWh (15%)", "1.3GWh (19%)"], ["합계", "3.4GWh", "3.4GWh", "6.8GWh"]]}, "bullets": ["11차 전기본 장주기 저장설비 목표 약 23GW(2038, 양수 포함)", "국내 ESS 배터리 연 15.6GWh, 누적 약 52조원(2027~2040, 업계 추정)", "셀 3사 균등 분배 시 각 매출 1.2조원·영업이익 약 900억원(장기 OPM 7% 가정)", "SK이터닉스 제주 표선 40MW/240MWh 1차 선정, SK이노베이션 E&S 2차 읍동·운남 수주", "삼성SDI SBB 1.7(6.14MWh, 2026.7), SBB 2.0(LFP, 2026.12)"], "kr": "삼성SDI·SK온·LG에너지솔루션(셀), 엘앤에프·포스코퓨처엠·피노(LFP 소재), 한중엔시에스·서진시스템(열관리·구조물), SK이터닉스·SK이노베이션 E&S(ESS 발전사업)가 국내 시장에 직접 노출된다."}, {"name": "연료전지: 데이터센터의 두 번째 온사이트 전원", "pill": "2025.07~2026.08", "lede": "계통은 늦고, 가스터빈은 밀렸고, 땅은 비싸다는 세 제약이 연료전지를 데이터센터 전원으로 만들었지만, 국내 시장은 정책 후순위로 밀리는 비대칭이 나타난다.", "paras": ["미국 유틸리티는 신규 데이터센터 계통 연결을 2028년 이후로 보는 반면 디벨로퍼는 2027년을 기대한다. DOE는 2030년 추가 부하 101GW 대비 신뢰 가능한 기저전원 증설이 22GW에 그쳐 정전 위험이 34배(설비 폐쇄 반영 시 약 100배) 늘 수 있다고 봤다. 이 공백을 메우는 온사이트 전원의 주력은 가스터빈이지만, 리드타임이 최대 7년·견적이 kW당 $2,400~2,600로 올랐다. 2030년까지 발표된 데이터센터 온사이트 전원 4.8GW 중 가스터빈이 33.3%, 연료전지가 22.9%다.", "SOFC는 세 가지 장점이 있다. 시간: Bloom이 Oracle에 계약 90일, 실제 55일 만에 납품했듯 납기가 짧고 모듈형이라 단계 증설이 쉽다. 장소: 복층 설계로 최대 100MW/acre의 전력 밀도를 내 애쉬번·산호세 같은 고지가 대도시권에 맞고, 10MW 기준 필요 면적이 태양광의 약 1/170이다. 전력 품질: 직류로 발전해 서버와 직결되고 무효전력 공급·폐열 냉각 활용이 가능하다. 약점은 kW당 약 $3,363의 설비가와 5~10년 스택 교체, 그리고 부하 급변 응답이 느려 슈퍼커패시터 보조가 필요하다는 점이다.", "정책이 경제성을 뒤집었다. OBBBA는 2026.1.1 이후 착공 연료전지에 온실가스 배출·PWA 요건 없이 30% ITC를 주고(국내부품 보너스는 미적용), 풍력·태양광 ITC는 2027년 말로 앞당겼다. 천연가스 기반이라도 SOFC 탄소집약도(308~378g/kWh)는 석탄(905.6g)의 1/3 수준이라 '석탄 대체형 즉시 감축' 논리도 쓰인다. 버지니아의 신규 데이터센터 디젤 백업 규제(Tier 4 수준) 강화도 대체 수요를 만든다.", "결과는 급성장이다. Bloom은 3Q25 매출 5.19억달러(+57.1%), 2025년 매출 20억달러·영업이익 7,400만달러로 사상 최대를 기록했고, Brookfield와 최대 50억달러 AI 인프라 파트너십(2025.10), Oracle 2.5~2.8GW 공급을 확보했다. 2025.3Q 첫 하이퍼스케일러 계약 후 9개월 만에 주요 하이퍼스케일러 전부와 네오클라우드 12곳 이상과 계약했으며, 생산능력은 2026말 2GW로 늘린다. Bloom은 2030년 미국 데이터센터의 33%가 100% 온사이트 전원을 쓸 것으로 본다(1년 전 설문 1%).", "국내는 반대다. 발전용 연료전지는 RPS 하 REC 가중치 2.0을 받다가 수소경제법으로 분리돼 일반수소(연 1,300GWh, 약 200MW)·청정수소 입찰시장으로만 보급된다. 누적 1.5GW(2026.4)로 세계 최대 시장이지만, 2024.10 청정수소발전 입찰이 취소됐고 2026년 청정수소 물량 1/3 축소·일반수소 입찰 폐지 가능성이 보도됐다. 공고 물량이 국내 2사 캐파를 밑돌아 단가 압력도 크다. 그래서 국내 업체의 관건은 미국 데이터센터로의 진입이다."], "table": {"cols": ["타입", "작동온도", "발전효율", "출력", "주 용도"], "rows": [["PEMFC(고분자)", "50~100℃(<120℃)", "약 35%", "수kW~수백kW", "수송·건물·비상전원"], ["PAFC(인산형)", "150~250℃", "약 42%", "수십~수백kW", "건물·열병합"], ["MCFC(용융탄산염)", "650℃", "약 47%", "300kW~수십MW", "유틸리티급 발전"], ["SOFC(고체산화물)", "600~900℃", "55~70%(열회수 약 90%)", "1kW~2MW 단위", "분산·데이터센터 온사이트"]]}, "bullets": ["세계 고정형 연료전지 누적 2GW+(한국 1GW+, 미국 600MW, 일본 336MW, 2024말)", "Equinix SV11: Bloom 20MW를 주전원, 계통을 백업으로 쓰는 첫 사례", "Bloom 국내 충주·대소원 에코파크 80MW 건설 중", "글로벌 연료전지 적용분야: 수송 80.9%, 발전 17.0%(2024, Mordor)", "산일전기 2Q26 신규수주의 약 30%가 Bloom향 SOFC 승압용 특수변압기로 추정"], "kr": "두산퓨얼셀(익산 PAFC 약 180MW, 새만금 SOFC 50MW 3Q25 양산, HyAxiom·Ceres 협업으로 미국 진입 추진), 블룸SK퓨얼셀·SK이터닉스(Bloom 국내 총판·80MW 고객), 비나텍(Bloom 비상전원 슈퍼캡 독점 공급 추정), 산일전기(특수변압기)가 연결된다."}, {"name": "BTM이 먼저, FTM은 2028년부터: 미국 전력망 정책의 시계열", "pill": "2025.02~2026.08", "lede": "미국 정책은 계통 연결의 '절차'만 줄일 뿐 변압기·가스터빈 같은 물리적 병목은 풀지 못해, 계통을 우회하는 온사이트 전원이 먼저 크고 계통 연결 신규 발전원은 2028년 이후에 따라온다.", "paras": ["미국 신규 발전원의 IR(연결 신청)→COD(상업운전)는 2025년 기준 61개월로, IR→IA(연결계약) 절차 45개월(중앙값)과 IA→COD 건설 31개월로 나뉜다. 대기열은 약 2,300~2,500GW로 10년 새 약 10배 늘었고, 2000~2019년 신청 프로젝트 중 실제 상업운전에 도달한 비율은 19%다. 2025년에는 발전 프로젝트 266GW가 취소됐는데 82%가 재생에너지였다.", "공급측 정책은 절차 단축이다. FERC Order 2023(2023.11)은 선착순을 '준비된 순서'로 바꾸고 클러스터 스터디를 의무화했으며, PJM RRI·MISO/SPP ERAS·PJM EIT 같은 한시 패스트트랙(2027말 일몰)은 대형 프로젝트를 신속 심사한다. 다만 패스트트랙 대부분이 가스발전이고, Order 2023 효과는 2027~2028년 이후에야 IA 통과 물량으로 나타난다.", "수요측 정책은 데이터센터가 스스로 전원을 마련하게 한다. PJM Co-location Order(2025.12)는 발전소 직결 대형 부하의 송전서비스를 제도화해 인허가를 약 2년에서 2~3개월로 줄였고, FERC Large Load Show Cause Order(2026.6)는 이를 전 RTO로 확대하며 계통전력 무임승차를 막는다. Ratepayer Protection Pledge(2026.3, 빅테크 7곳)와 PJM 하이퍼스케일러 긴급 경매(15년 PPA로 150억달러 신규 발전소 부담)는 빅테크의 발전 인프라 직접 참여를 요구한다. NERC 연산부하 신뢰도 표준(2026.12 제출)은 순간부하 대응을 법적 의무로 만들어 2H27 이후 안정용 대형 ESS를 사실상 의무화할 수 있다.", "그래서 수요는 2단계로 온다. 2025말~2028년은 BTM 중심으로 가스발전+ESS·연료전지가 주력이고, 초고압변압기 없이 부지 내 배전변압기·배전반·버스덕트·MV 배전케이블·특수변압기만 있으면 가동된다. 2028년 이후 Order 2023 처리분이 IA를 통과하면 태양광+ESS 중심 FTM 발전원과 초고압변압기·차단기·초고압케이블 수요가 추가된다. IA를 통과한 미준공 발전원은 549GW(태양광 256·ESS 161·풍력 76·가스 45GW)로 사실상 FTM 기자재의 잠재 수주잔고다.", "시장은 AIDC 수요가 공급을 압도해 BTM과 FTM이 서로 잠식하기보다 누적될 것으로 본다. 북미 ESS 신규 설치는 2025~2030년 연 28.9%, 그중 데이터센터향 BTM ESS는 연 약 60% 성장이 추정되고, 미국 상업지구 온사이트 가스발전량은 2025.9 672GWh(+11%)로 늘었다. 수혜 강도는 미국 노출도 기준으로 배전망 > ESS > 태양광·송전 기자재 순으로 제시됐다."], "table": {"cols": ["구간", "주력 전원", "수요 증가 품목", "관련 국내 업종"], "rows": [["2025말~2028 (BTM)", "가스발전+ESS, 연료전지", "ESS, 배전반·배전변압기, 버스덕트, MV 배전케이블, 특수변압기", "배터리, 배전기기, 전선(배전)"], ["2028~ (FTM 추가)", "태양광+ESS", "태양광 모듈, 초고압변압기·차단기, 초고압케이블, UPS/BBU", "태양광, 송전 전력기기, 전선(초고압)"], ["2027~2029 (전 구간)", "-", "NERC 표준에 따른 안정용 대형 ESS", "배터리"]]}, "bullets": ["발전원별 IR→COD: 가스 3.7년 vs 태양광+ESS 6.6년(LBNL)", "미국 신규 발전 2025 약 55GW(2002년 이후 최대) → 2026E 80GW(+46%, EIA)", "2026 미국 그리드 연결 예정 86GW 중 태양광 51%·풍력 14%·저장 28%", "2025년 미국 신규 발표 가스발전 252GW 중 온사이트 용도 100GW(40%)", "DOE §202(c) 비상명령(2026.5~6): 데이터센터 백업발전을 비상시 계통자원으로 가동 지시 가능"], "kr": "LS ELECTRIC(배전반 패키지), 산일전기(특수변압기), 가온전선(LSCUS 버스덕트, 누적 최대 5.5조원 계약), LG에너지솔루션·삼성SDI(ESS)가 1단계, 한화솔루션(모듈)·효성중공업·HD현대일렉트릭(초고압)·대한전선(초고압케이블)이 2단계 수혜로 분류됐다."}]}], "note": "AIDC 3계층, 미국 ESS 산식, 국내 ESS 실효용량, 연료전지, BTM→FTM 시계열."}, {"h": "가스·연료 — 3편", "blocks": [{"t": "mods", "items": [{"name": "카타르 쇼크: LNG 공급 부족이 수년짜리가 된 이유", "pill": "2026.03~2026.09", "lede": "호르무즈 봉쇄는 1차 충격이었고, Ras Laffan 설비 파괴와 증설 지연이 LNG 부족을 수년짜리로 만들었으며, 이번에는 동아시아가 가격 교란의 진원지가 될 수 있다.", "paras": ["글로벌 LNG 교역 약 4.3억톤 중 중동이 약 1억톤(23%)이고, 그중 88%(카타르·UAE)가 호르무즈 안쪽에 있다. 2026.3 미국-이란 전쟁으로 해협이 사실상 봉쇄되자 카타르는 LNG를 수출할 수 없게 됐고, 이어 Ras Laffan의 Train 4·6(연 1,280만톤, 카타르 캐파 7,700만톤의 17%)이 피격돼 복구에 3~5년이 걸린다. 그 결과 3~8월 카타르 수출 카고는 전년 509척에서 18척(-96%), 아시아향은 3,600만톤에서 445만톤(-88%)으로 줄었다.", "공급 공백은 장기화된다. 카타르는 7,700만톤에서 1.42억톤으로 늘리려던 North Field 증설(NFE)도 1년 이상 늦어질 수 있다고 밝혔고, Pearl GTL Train2 재가동은 2027.3 목표다. IEA는 2026~2030년 누적 공급손실을 120~140bcm(예정 신규 공급의 약 15%)으로 추정한다. QatarEnergy는 장기계약 의무를 지키려고 Cheniere·Venture Global·Woodside에서 2031년까지 미국 LNG를 사들이는 방안을 협의 중이며, Edison 등 유럽향 불가항력을 11월 초까지 연장했다.", "러-우 전쟁의 교훈이 참고가 된다. 당시 가격을 올린 것은 공급 차질 자체보다 대체 물량을 급히 구한 구매자의 규모였다. 유럽이 러시아 PNG를 LNG로 대체하며 수입을 74bcm에서 123bcm으로 늘리자 JKM이 9.4달러(1H21)에서 39.0달러(2H22)로 뛰었다. 이후 유럽은 러시아 의존도를 46%에서 13%로, 중동 비중을 4% 미만으로 낮추고 가스발전량도 467TWh에서 367TWh로 줄여 이번 봉쇄에서는 교란 주체가 되기 어렵다.", "반면 한·중·일은 중동산 비중이 각각 약 20%·30%·10%로 높아, 봉쇄가 길어지면 약 4,000만톤(55bcm)을 대체해야 한다. 이는 과거 유럽이 대체한 약 70bcm에 근접한다. 실제로 한국 LNG 수입 중 카타르 비중은 15.6%에서 5.8%로 줄고 미국 비중은 9.3%에서 15.1%로 늘었다(1~8월). 동시에 유럽 재고가 사상 최저 수준(EU 저장률 약 65%, 독일 50%대 중반)이라 9~11월 재고 확충 경쟁이 JKM과 TTF를 함께 끌어올렸다.", "하방 변수도 있다. 10~12월 정점이 예상되는 슈퍼 엘니뇨로 겨울이 따뜻하면 2022~23년 유럽처럼 가격이 급락할 수 있고, 파나마 운하 정상화는 미국→아시아 운송 병목을 풀어 차익을 줄인다. 중장기적으로는 미국(2026년 Plaquemines Phase I·Golden Pass Train 2), 캐나다·알래스카, FLNG 같은 비중동 공급이 늘어난다."], "table": {"cols": ["벤치마크", "지역", "성격", "수준(2026.9)"], "rows": [["Henry Hub", "미국", "루이지애나 파이프라인 가스 허브, 미국 LNG 수출가 기준", "$2.9/MMBtu(1월 $4.1)"], ["TTF", "유럽", "네덜란드 가상 허브, 지하저장 재고가 가격 좌우", "약 €83/MWh(≈$28)"], ["JKM", "동아시아", "Platts 해상 현물, 단기 수급에 민감", "약 $28/MMBtu(3.5년래 최고)"], ["참고: JKM 러-우 전쟁기", "동아시아", "1H21 9.4 → 2H22 39.0", "Bloomberg"]]}, "bullets": ["미국 LNG 수출 4MT(2016) → 109MT(2025), 1H26 17.4Bcf/d(+23%)", "미국 가스 수요 115 → 134Bcf/d(2030E), 증분의 70%가 LNG feedgas(WoodMac)", "EU REPowerEU: 러시아 단기 LNG 2026.4, 장기 LNG 2027.1.1 금지", "중국 15차 5개년: LNG 수용능력 연 2억톤, 러시아 PNG 확대·카타르 축소", "한·일 긴급 LNG 카고 스왑 체계 구축"], "kr": "한국가스공사는 카타르 연 610만톤 장기계약 공백을 고가 현물로 대체 중이라 미수금(4Q25 14조원) 재누적 우려와 해외 자원개발 이익 증가(GLNG·Prelude·모잠비크)가 동시에 나타난다."}, {"name": "누가 LNG 스프레드를 가져가는가: 계약 구조와 옵셔널리티", "pill": "2026.03~2026.09", "lede": "Henry Hub 약세와 JKM·TTF 강세의 괴리에서 이익은 '계약이 유연하고 설비에 선택권이 있는 쪽'으로 흐른다.", "paras": ["미국 LNG 가격은 115%×HH + 고정 액화수수료($2.25~3.50) + 운임으로 정해진다. 115%는 액화에 드는 연료·변동비, 고정 수수료는 설비 투자 회수분이다. 셰일 원유를 뽑을 때 함께 나오는 수반가스 덕분에 유가가 오르면 오히려 미국 가스 공급이 늘어, 전쟁 중 JKM +60%·TTF +53%일 때 HH는 0%였다. 목적지 제한이 없는 FOB 조건이라 구매자가 가장 비싼 시장으로 보낼 수 있다.", "수출업체 사이에서는 계약 구조가 성패를 가른다. 20년 장기계약은 수수료가 고정이라 해외 가격 급등의 차익 대부분이 구매자에게 가고, Cheniere처럼 생산량의 90% 이상을 2030년대 중반까지 장기계약한 업체는 물량 성장주에 가깝다. 반대로 스팟·단기 판매의 암묵적 액화수수료(해외가격-가스원가-운송비)는 평균 $6를 넘어 장기의 2~3배가 되며, Venture Global은 2Q26 액화수수료 $6.45(1Q $3.82)를 기록했고 2029년 말 캐파 85MTPA 중 38%가 미계약이다.", "국내에서는 세 가지 경로가 있다. 첫째, 미국산 LNG를 직도입하는 발전사는 SMP 상승(최대 180원/kWh 가정)과 낮은 원가(약 $11.4/MMBtu)의 차이로 마진이 커진다. 둘째, 천연가스반출입업을 등록하고 보세 탱크를 가진 사업자는 확보한 저가 LNG를 통관 없이 유럽·아시아 고가 시장에 재판매할 수 있다(포스코인터내셔널이 2020년 국내 최초 등록). 셋째, LNG·LPG 겸용 발전소는 LNG가 급등하면 LPG로 발전하고 LNG를 해외에 팔아 1카고당 약 400억원의 옵션 가치를 얻는다.", "SK가스 울산 GPS(1.2GW)는 세계 최초 LPG-LNG 겸용 발전소로, 러-우 전쟁기(2H21~1H23)에 가동됐다면 약 1.2조원의 차익이 났을 것으로 추정된다. LPG는 미국산 비중이 높아 중동 차질 영향이 작고 조달이 유연하다. 2026.3 LNG $15/MMBtu·LPG $780/톤은 당시 차익거래가 발생하던 가격대와 비슷했다. 다만 국내 수송용 LPG는 판가 동결로 역마진이다.", "규제가 가장 큰 리스크다. 한국 정부가 SMP 상한제나 민간 재고 확충 명령을 발동하면 직도입사 마진이 제한되고, 2022년처럼 피크 이익에는 낮은 멀티플이 적용되는 것이 일반적이다. 반면 가스공사는 도입가 상승이 요금기저를 키워 별도 이익에는 긍정적이지만 민수용 요금 동결로 미수금이 쌓이는 구조라, 해외 이익 증가와 요금 정책을 함께 확인해야 한다."], "table": {"cols": ["지역", "보유 주체", "특징"], "rows": [["광양", "포스코인터내셔널", "제2터미널로 저장 133만㎘, 보세탱크 운영, 2031년 180만㎘ 목표"], ["보령", "SK E&S·GS에너지", "SK E&S 발전소 연료 공급"], ["울산", "SK가스·KET", "보세구역, LPG-LNG 겸용 발전소 연계"], ["통영", "한화", "민간 터미널"], ["여수", "한양", "신규 증설 중"], ["인천·평택·삼척·통영·제주·당진", "한국가스공사", "국가 기간 기지"]]}, "bullets": ["2025 한국 LNG 수입: 가스공사 3,428만톤 / 직도입 1,244만톤(직도입 비중 26.6%)", "가스공사 장기도입계약 물량 3,135만톤(2025말)", "파나마 운하 일 32척(2026.9.15~), VLGC 슬롯 경매 최고 530만달러(전쟁 전 중간값 5.5만달러)", "포스코인터내셔널: 미국 가스전 인수(5.5억달러, 1.3Tscf), Cheniere 40만톤·Mexico Pacific 70만톤 도입, Alaska LNG 지분 1.17%(연 100만톤 우선권)", "SK E&S: Woodford 가스전(49.9%)·Freeport 220만톤, 호주 Barossa(37.5%), 싱가포르 PRISM 530만톤 트레이딩"], "kr": "SK이노베이션(E&S), SK가스, 포스코인터내셔널, 한국가스공사가 직접 노출되고, FLNG·LNG선을 짓는 삼성중공업·한화오션이 비중동 공급 확대의 수혜로 연결된다."}, {"name": "팜유: 식용유에서 정책 연료·SAF 원료로", "pill": "2025.11~2026.01", "lede": "팜유는 식용-정책 연료-올레오케미칼·SAF의 3층 수요 위에 나무 작물 특유의 공급 경직성과 EU 추적성 규제가 겹쳐, 가격 예측보다 '거래 가능한 물량을 가진 통합 사업자인가'가 격차를 만드는 원자재가 됐다.", "paras": ["수요는 세 층이다. 바닥은 식용유·가공식품이다. 인도의 2025/26 팜유 수입은 905만톤으로 최근 5년 중 두 번째 규모이고(식용유 중 팜유 점유율 62% 회복), 중국은 2027년까지 식용유 비축을 350만톤으로 늘린다. 두 나라 합산 추가 수요는 연 180~220만톤으로 추정된다. 가운데 층은 정책 연료다. 인니 팜유 소비 2,260만톤 중 바이오디젤이 1,490만톤으로 식품(740만톤)의 두 배이고, B50 시행 시 바이오디젤 필요량이 B40(1,560만KL) 대비 약 450만KL 늘어 수출 잔여 물량이 구조적으로 준다.", "위층은 성장 수요다. 올레오케미칼 시장은 2024년 262억달러에서 연 7.4% 성장(GVR)하고 원료 중 팜유가 40% 이상이며, 지방 알코올 신증설 약 128만톤(2025~2026)이 팜커널유 수요를 늘린다. SAF는 2034년 4,200~4,500만톤 수요 중 HEFA가 55~65%를 차지하는데, 폐식용유 공급이 2030년 약 1,200만톤에서 포화되면 팜 부산물(PFAD·RBD 스테아린) 1,000~2,000만톤이 부족분을 흡수할 것으로 추정된다.", "B50의 속도는 CPO와 경유의 가격 차가 정한다. CPO가 원유·경유보다 비싸질수록 혼합 의무 이행 보조금 부담이 커지고, 인니는 이를 수출부과금으로 충당한다(2025.12 인상 결정). 2025.12부터 약 6개월 도로주행 테스트를 거쳐 2027년 시행을 목표로 하므로, 도입 여부보다 시행 속도와 적용 범위(비자동차·산업용 포함)를 촉매로 봐야 한다.", "공급 상단은 나무가 닫는다. 팜나무는 식재 후 약 3년 무수익, 7년까지 부분 수익이고 재식재 후 만재까지 8~10년이 걸린다. 2024년 인니·말레이 평균 수령은 15.8년·16.5년, 20년 이상 노령목 비중은 38%·45%라 2027~2032년 대규모 재식재가 동시에 진행되면 연 300~500만톤 공급 감소가 불가피하다는 추정이다. 여기에 인니·말레이 생산 편중(83%), 말레이 외국인 노동 쿼터 축소(유효 인력 약 25.8만명, 3~4만명 부족), 라니냐 과습, 가노더마 줄기썩음(말레이 조사 면적의 13.7% 감염)이 겹친다.", "EUDR(대·중견 2026.12.30, 소기업 2027.6.30 적용)은 팜유 수요를 없애기보다 지리좌표 기반 추적·실사를 통과한 물량만 EU에 팔 수 있게 만든다. 소농·플라즈마 비중이 높은 공급망은 할인되고 추적 인프라를 갖춘 통합 사업자(플랜테이션→밀→정제→연료·올레오)의 물량에 프리미엄이 붙는다. 한편 동남아 플랜테이션의 대면적 단일 소유 토지가 데이터센터·재생에너지 부지로 재평가되는 흐름(말레이 조호르 Sedenak Tech Park 등)도 새로운 옵션으로 거론된다."], "table": {"cols": ["요인", "메커니즘", "관측 지표"], "rows": [["생산국 편중", "인니·말레이 83%, 동일 기후권 동시 충격", "월별 생산·재고(MPOB)"], ["재식재 시차", "초기 7년 무수익, 만재까지 8~10년", "평균 수령, 20년 이상 비중"], ["노동 병목", "수확 지연 → 과숙·낙과 → OER 하락", "외국인 쿼터, 수확 간격"], ["기후", "라니냐 과습·침수로 수확·물류 차질", "월간 생산, OER"], ["병해충", "봉지벌레, 가노더마 줄기썩음", "감염률, 1~2년 후 수율"], ["토지 경쟁", "데이터센터·산단과 토지 기회비용 경쟁", "신규 개간 인허가"]]}, "bullets": ["말레이 2024 CPO 1,934만톤, FFB 수율 16.7톤/ha, OER 19.67%(MPOB)", "FFB 1톤 → CPO 약 200kg, 팜커널 50kg, POME 600kg+", "ha당 오일: 팜 3.5~4톤 vs 해바라기 0.7~1톤", "직전 재식재 사이클(2011~2015) 가격 $1,250/톤 상회", "인니 SAF 로드맵: 국제선 1% 의무화 → 2060년 50%"], "kr": "포스코인터내셔널은 2025.11.20 삼푸르나 아그로를 인수해 12.8만ha·CPO 캐파 20만→60만톤(2030 70만, 2035 100만톤 목표)을 확보하고 정제공장(PT.AGPA 50만톤)·GS칼텍스와 바이오연료 JV(연 50만톤)를 갖춘 통합 사업자가 됐다. LX인터내셔널은 인니 농장 POME 바이오가스로 탄소배출 약 85% 감축을 추진한다.", "svg": "<svg viewBox=\"0 0 860 310\" role=\"img\" aria-label=\"팜나무는 8~18년에 수율 정점을 찍고 25~30년 주기로 재식재돼 보유 나무의 연령 분포가 곧 향후 생산량 시간표다\"><defs><marker id=\"a-tr28\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"200.7\" y=\"58.0\" width=\"163.3\" height=\"36.0\" style=\"fill:var(--accent)\" fill-opacity=\".18\"/><path d=\"M70 250 L119 250 L135 220 L152 178 L168 142 L184 112 L201 88 L233 76 L282 73 L331 79 L364 88 L413 118 L462 154 L511 190 L560 220\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".95\" stroke-width=\"2.2\" style=\"stroke:var(--accent)\"/><line x1=\"70\" y1=\"250\" x2=\"560\" y2=\"250\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.2\"/><text x=\"70\" y=\"266\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".75 조별 EV/EBITDA<\/text><text x=\"600\" y=\"78\" font-size=\"11\">젊은 나무 편중<\/text><text x=\"840\" y=\"78\" font-size=\"11\" text-anchor=\"end\" font-weight=\"600\">10~12배<\/text><text x=\"600\" y=\"102\" font-size=\"11\">균형<\/text><text x=\"840\" y=\"102\" font-size=\"11\" text-anchor=\"end\" font-weight=\"600\">7~9배<\/text><text x=\"600\" y=\"126\" font-size=\"11\">노령 편중<\/text><text x=\"840\" y=\"126\" font-size=\"11\" text-anchor=\"end\" font-weight=\"600\">4~6배<\/text><text x=\"600\" y=\"170\" font-size=\"12\" font-weight=\"600\" style=\"fill:var(--accent)\">평균 수령<\/text><text x=\"600\" y=\"194\" font-size=\"11\">인니 15.8년 · 말레이 16.5년<\/text><text x=\"600\" y=\"216\" font-size=\"11\">20년 이상 비중 38% · 45%<\/text><text x=\"600\" y=\"246\" font-size=\"11\" style=\"fill:var(--alert)\">→ 2027~2032 재식재 시<\/text><text x=\"600\" y=\"266\" font-size=\"11\" font-weight=\"600\" style=\"fill:var(--alert)\">연 300~500만톤 공급 감소 가능<\/text><\/svg>", "cap": "팜나무는 식재 후 3년 무수익, 8~18년에 FFB 26~32톤/ha의 정점을 찍고 25~30년 주기로 재식재된다. 인니·말레이 평균 수령이 16년 안팎이고 20년 이상 노령목이 38~45%라, 2027~2032년 대규모 재식재가 겹치면 연 300~500만톤 공급 감소가 가능하다는 것이 시장의 논리다."}]}], "note": "카타르 쇼크의 장기화, 계약 구조와 옵셔널리티, 팜유의 정책 연료화."}, {"h": "정책·금융 — 2편", "blocks": [{"t": "mods", "items": [{"name": "OBBBA 이후 미국 청정에너지 세제 지형: 착공·PFE·MACR", "pill": "2025.07~2026.09", "lede": "OBBBA는 IRA를 없앤 것이 아니라 전원별로 세제 혜택의 수명을 다르게 재단했고, 동시에 '누구에게서 샀는가'를 세액공제의 조건으로 만들었다.", "paras": ["전원별 차등이 핵심이다. 태양광·풍력 ITC/PTC는 2026.7.4 이전 착공(4년 내 준공 시 연속성 인정) 또는 2027년 말 이전 준공분만 인정되고, 풍력 부품 AMPC는 2027년 말 일괄 종료된다. 반면 ESS ITC는 2033년까지 유지(이후 단계 감축)되고, 원전 45U는 2032년까지, 45Y는 2033년 착공분까지 100% 유지된다. 연료전지는 연료 종류와 무관하게 30% ITC를 받는다. 주거용 태양광 25D는 2025년 말 종료됐다.", "착공 판정도 엄격해졌다. IRS Notice 2025-42로 2025.9.2 이후 착공분부터 5% 비용 지출 세이프하버가 폐지되고 실제 공사(Physical Work Test)만 인정된다(1.5MW 이하 태양광 예외). 서류상 착공으로 공제를 확보하기 어려워지자 실제 공사 착수가 가속됐고, 이것이 2025~2026 착공 러시와 2026~2027 설치 집중을 만든 제도적 원인이다.", "두 번째 축은 공급망 조건이다. 중국 등 우려국과 관련된 금지외국법인(PFE)의 '물질적 지원'을 받은 부품 비중이 기준을 넘으면 공제가 사라진다. 이를 재는 MACR(전체 직접원가 중 비PFE 비중)은 매년 오른다. IRS Notice 2025-08은 부품별 원가 비중표(Safe Harbor Table)를 제시해 계산 기준을 줬는데, BESS에서 셀이 52%, 태양광 기자재 구매비에서 셀 38%·모듈 약 66%로 사실상 셀 원산지가 적격성을 결정한다.", "제조사 AMPC(45X)는 2032년까지 유지(2033년 폐지)되지만 PFE 제한이 적용되고, 기준은 태양광 부품 50%(2026) → 85%(2030~), 배터리 부품 60% → 85%다. 중국 자본 25% 이상·실질 지배 기업은 수혜에서 제외되고 SFE(특정 외국기관)·FIE(외국 영향 기관) 정의도 넓어졌다. 이는 한국 기업에게 기회지만 동시에 하위 소재(양극재·음극재·웨이퍼)까지 탈중국화해야 하는 비용이기도 하다.", "결과적으로 투자 판단의 질문이 바뀌었다. '이 기업이 얼마나 싸게 만드는가'보다 '보조금을 언제까지, 어떤 공급망 조건으로 받는가'가 이익 추정의 핵심이 됐다. 딜 검토 시에는 이익 중 AMPC·ITC 관련 비중, 일몰 연도별 민감도, MACR 산정 근거, 고객과의 AMPC 공유 비율을 반드시 분해해야 한다."], "table": {"cols": ["구분", "2026", "2027", "2028", "2029", "2030 이후"], "rows": [["ITC 적격시설(태양광 등)", "40%", "45%", "50%", "55%", "60%"], ["ITC ESS", "55%", "60%", "65%", "70%", "75%"], ["AMPC 태양광 부품", "50%", "60%", "70%", "80%", "85%"], ["AMPC 배터리 부품", "60%", "65%", "70%", "80%", "85%"], ["AMPC 인버터", "50%", "55%", "60%", "65%", "70%"]]}, "bullets": ["DCA(국산 부품 가산 +10%p): 미국산 비중 45%(2025) → 50%(2026) → 55%(2027~)", "크레딧 양도는 2027년까지로 단축", "48E ITC: 기본 6%, PWA 충족 시 30%", "연료전지 48E: 배출 0g/kWh 요건 삭제, 보너스 가산 미적용", "2026년 착공분 PFE 비중국 비율은 40%(ITC 태양광)가 공통 기준으로 인용된다"], "kr": "AMPC 규모와 지속 기간이 한화솔루션·LG에너지솔루션·삼성SDI·씨에스윈드(미국 공장) 이익 추정의 핵심 변수이고, OCI홀딩스·엘앤에프 등 비중국 소재 공급사의 프리미엄도 이 규정에서 나온다."}, {"name": "금리와 자본비형 전원: 신재생의 진짜 원가", "pill": "2022~2026.09", "lede": "연료비가 0인 태양광·풍력의 가장 큰 원가는 돈의 가격이며, 빅테크가 신재생을 사는 이유와 해상풍력이 멈춘 이유가 모두 여기서 나온다.", "paras": ["가스·석탄·석유는 원가의 40~60%가 연료비라 20년 뒤 가격을 약속할 수 없다. 태양광·풍력은 연료비가 0이고 원가 대부분이 건설비(CAPEX)라 건설 시점에 15~20년 단가를 확정할 수 있다. 데이터센터 운영비의 30~40%가 전력비이고 미국 소매 전기요금이 2021년 이후 4년간 28% 올랐으며 PJM 용량 경매가가 2년 만에 $29에서 $329/MW-day로 11배가 된 상황에서, 빅테크가 신재생 PPA를 사는 이유는 ESG보다 운영비 통제에 가깝다.", "빅테크 4사가 최근 1년간 맺은 신재생 PPA는 23GW(BNEF)로 과거 15년 글로벌 기업 누적치의 9%에 달하고, 2025년 미국 기업 청정에너지 PPA 29.5GW 중 태양광이 66%였다. 계약 형태도 PPA에서 발전사 인수·코로케이션 같은 소유형으로 진화 중이다(Alphabet의 Intersect 인수). 2025년 미국 태양광 신규 설치의 77%가 공화당 우세 주에서 이뤄져 정치 리스크도 일부 완화되는 흐름이다.", "반대로 자본비형 전원의 핵심 리스크는 금리다. 금리 상승은 곧 LCOE 상승이고, 금융비용 비중이 큰 해상풍력이 가장 민감하다. 2022~2023년 미국·유럽 해상풍력 대규모 취소의 주원인이 여기에 있다. 한 추정은 금리 100bp 하락 시 해상풍력 IRR이 1.5~2.0%p 개선되고 FID가 6~12개월 앞당겨진다고 추정했고, 다른 자료는 2026년 중반 국내 금리 인상 사이클 진입 가능성을 해상풍력 PF의 부담 요인으로 꼽았다.", "제도로 금리 리스크를 줄이는 방법도 있다. CfD(차액계약)는 기준가격과 시장가 차이를 정산해 장기 현금흐름을 보장하고, 물가연동 조항은 인플레이션 위험을 구매자와 나눈다. 국민성장펀드 같은 정책금융(신안우이 7,500억원 선후순위 대출)은 민간 PF의 마중물로 조달금리를 낮춘다. 국내 RPS 폐지 후 15~20년 고정가 계약시장 전환도 매출 변동성을 줄여 요구수익률을 낮추는 효과가 있다.", "투자자 관점의 결론은 두 가지다. 하나는 설비 가격이 싸져도 금리가 오르면 프로젝트가 멈춘다는 점, 다른 하나는 수주 산업은 실적이 아니라 FID·입찰 개시 시점에 리레이팅된다는 점이다. 그래서 10년물 금리, CfD 상한가, PF 종결 건수가 기자재 업체의 선행지표가 된다."], "bullets": ["태양광+4h ESS LCOE $76 vs 가스복합 $79/MWh(2025)", "리튬이온 팩 가격 $1,191(2010) → $108/kWh(2024, Wood Mackenzie)", "주요국 10년물: 미국 4.6%, 독일 3.2%, 한국 4.2%대(2026.8.26)", "PJM 용량 경매가 $29 → $329/MW-day", "2026 미국 신규 전력 용량의 40%가 텍사스"], "kr": "SK이터닉스·OCI홀딩스(디벨로퍼), SK오션플랜트·LS마린솔루션(FID 레버리지 기자재)에게 금리와 정책금융은 실적보다 먼저 움직이는 변수다."}]}], "note": "OBBBA 이후 세제 지형, 금리와 자본비형 전원."}]}, "market": {"title": "시장·수급", "h2": "시장 규모와 수급", "en": "Market Size & Supply-Demand", "lede": "수급은 '물량은 늘지만 적격 공급은 부족하다'로 요약된다. 글로벌 태양광·풍력·ESS 설치는 사상 최대를 이어가지만 중국 비중이 70% 안팎이라, 한국 기업이 접근 가능한 시장은 미국의 규제 적격 공급(비중국 폴리·셀·ESS 셀)과 중국 외 풍력, 국내 정책 시장으로 따로 봐야 한다. 가스는 카타르 공백으로 지역 간 가격이 극단적으로 벌어졌다.", "sections": [{"h": "수급 좌표 — 여섯 개의 막대", "blocks": [{"t": "bars", "charts": [{"title": "2026E 지역별 풍력 신규 설치", "unit": "GW", "note": "BNEF(2026.3 인용). 글로벌 합계는 -4%지만 중국 외 +26.4%, 미국 +54.9%, 유럽 +56.6%", "items": [{"l": "글로벌", "v": 153.1, "tag": "추정"}, {"l": "중국", "v": 93.9, "tag": "추정"}, {"l": "중국 외", "v": 59.2, "tag": "추정"}, {"l": "유럽", "v": 24.8, "tag": "추정"}, {"l": "미국", "v": 11.8, "tag": "추정"}]}, {"title": "미국 vs 중국 태양광 모듈 가격", "unit": "$/W", "note": "2026.1~3 기준. 중국 FOB는 PV Infolink, 미국 가격은 업계 집계. 비중국 프리미엄 구조", "items": [{"l": "중국 TOPCon FOB", "v": 0.115, "tag": "확인"}, {"l": "미국 수입 모듈", "v": 0.28, "tag": "확인"}, {"l": "미국산(수입 셀)", "v": 0.36, "tag": "확인"}, {"l": "미국산(미국 셀)", "v": 0.49, "tag": "확인"}]}, {"title": "LNG·가스 가격 비교(2026.9)", "unit": "$/MMBtu", "note": "HH·JKM은 시장가(Platts 등), TTF는 € ke=\"currentColor\" stroke-opacity=\".3\" style=\"fill:var(--accent)\"/><text x=\"361\" y=\"50\" font-size=\"10.5\">영국 AR7<\/text><circle cx=\"420\" cy=\"52\" r=\"5\" stroke=\"currentColor\" stroke-opacity=\".3\" style=\"fill:var(--accent)\"/><text x=\"428\" y=\"66\" font-size=\"10.5\">美 착공 마감<\/text><circle cx=\"507\" cy=\"52\" r=\"5\" stroke=\"currentColor\" stroke-opacity=\".3\" style=\"fill:var(--accent)\"/><text x=\"515\" y=\"50\" font-size=\"10.5\">영국 AR8<\/text><rect x=\"287.6\" y=\"94.0\" width=\"255.5\" height=\"20.0\" style=\"fill:var(--accent)\" fill-opacity=\".6\"/><text x=\"294\" y=\"108\" font-size=\"10.5\" font-weight=\"600\">Vestas 북미 3Q25 +130% · 2Q26 수주 +67%<\/text><rect x=\"346.0\" y=\"148.0\" width=\"219.0\" height=\"20.0\" style=\"fill:var(--accent)\" fill-opacity=\".45\"/><text x=\"352\" y=\"162\" font-size=\"10.5\" font-weight=\"600\">4Q25 타워 수주 최대 → 2026 매출<\/text><line x1=\"288\" y1=\"116\" x2=\"346\" y2=\"146\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" style=\"stroke:var(--alert)\" marker-end=\"url(#a-tr22)\"/><text x=\"284\" y=\"138\" font-size=\"10.5\" text-anchor=\"end\" font-weight=\"600\" style=\"fill:var(--alert)\">6~12개월<\/text><rect x=\"200.0\" y=\"202.0\" width=\"292.0\" height=\"20.0\" style=\"fill:var(--accent)\" fill-opacity=\".35\"/><rect x=\"492.0\" y=\"202.0\" width=\"292.0\" height=\"20.0\" style=\"fill:var(--warn)\" fill-opacity=\".25\"/><rect x=\"784.0\" y=\"202.0\" width=\"146.0\" height=\"20.0\" style=\"fill:var(--accent)\" fill-opacity=\".6\"/><text x=\"346\" y=\"216\" font-size=\"10.5\" text-anchor=\"middle\">기존 잔고<\/text><text x=\"638\" y=\"216\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--warn)\">2027~28 발주 공백<\/text><text x=\"857\" y=\"216\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"600\">2029 타이트<\/text><rect x=\"200.0\" y=\"256.0\" width=\"730.0\" height=\"20.0\" style=\"fill:var(--ok)\" fill-opacity=\".4\"/><text x=\"565\" y=\"270\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"600\">COD 3~5년 전 슬롯 확보 — 풍력 부진에도 HVDC·인터커넥터로 견조<\/text><text x=\"930\" y=\"342\" font-size=\"10\" text-anchor=\"end\" fill-opacity=\".6\">위치는 공개 자료 기반 개념 배치<\/text><\/svg>", "cap": "풍력 회복은 한 번에 오지 않는다. **경매·정책 → 터빈 OEM 수주 → 6~12개월 뒤 타워·베어링 실적 → FID 이후 하부구조물**의 순서로 번지고, 해저케이블은 COD 3~5년 전에 슬롯을 잡아 풍력 부진기에도 HVDC·인터커넥터 수요로 견조하다. 기자재 기업의 공모 시점이 이 사슬의 어디에 있는지가 피어 선정과 밸류에이션 설명의 출발점이다."}], "note": "육상과 OEM이 먼저 회복하고, 타워·베어링은 6~12개월 후행, 해상 하부구조물은 2027~28 공백 뒤 2029년 타이트가 전망된다."}, {"h": "③ ESS·AIDC — EV 부진을 메우는 두 번째 배터리 시장", "blocks": [{"t": "brief", "items": [{"k": "무엇이", "v": "글로벌 ESS 241GWh(2025) → 710GWh(2030E, BNEF), AIDC향 12 → 272GWh(GGII). 미국 적격 셀 2027년 캐파 83 vs 수요 77GWh(실질 공급 약 70)."}, {"k": "왜 지금", "v": "301조 관세 인상·PFE·CHARGE Act 발의·중국 LFP 소재 수출통제가 한꺼번에 작동."}, {"k": "국내", "v": "LG에너지솔루션(미시간 LFP 17GWh), 삼성SDI(4Q26 LFP, 중앙계약시장 56%), SK온(서산 LFP 전환), 서진시스템·한중엔시에스·신성에스티, 엘앤에프(LFP 양극재)."}, {"k": "리스크", "v": "북미 신공장 양산 지연·초기 고정비, 단일 고객 의존, 2028년 전후 수급 균형."}]}], "note": "미국 적격 셀 부족과 데이터센터 부하 완충 수요가 겹쳐 한국 셀 3사·부품사의 미국 현지 공급이 본격화되는 초입이다."}, {"h": "④ 연료전지·온사이트 — 데이터센터의 두 번째 전원", "blocks": [{"t": "brief", "items": [{"k": "무엇이", "v": "Oracle 2.5~2.8GW·AEP 최대 1GW(Bloom), Bloom 캐파 1→2GW(2026말). 국내 일반수소 입찰 연 1,300GWh, 청정수소 1/3 축소 보도."}, {"k": "왜 지금", "v": "OBBBA 연료 무관 30% ITC(2026.1 착공분~), 가스터빈 리드타임 4~7년."}, {"k": "국내", "v": "산일전기(Bloom향 특수변압기), 비나텍(슈퍼캡 독점 공급), 서진시스템(플러밍 모듈), 두산퓨얼셀(HyAxiom 미국 판매 개시)."}, {"k": "리스크", "v": "가스터빈 공급 정상화 시 납기 우위 약화, 스택 교체 비용, AI 펀드 수급."}]}], "note": "가스터빈 병목이 SOFC에 창을 열었고, 국내는 입찰시장 축소로 글로벌과 비대칭이다."}, {"h": "⑤ LNG·가스 — 카타르 공백이 만든 수년짜리 스프레드", "blocks": [{"t": "brief", "items": [{"k": "무엇이", "v": "카타르 3~8월 출하 509→18척(−96%), IEA 누적 공급손실 120~140bcm. JKM 약 $28 vs HH $2.9, EU 저장률 약 65%."}, {"k": "왜 지금", "v": "카타르 캐파 17%(1,280만톤) 복구 3~5년, EU 러시아 가스 퇴출, 파나마 운하 통항 제한(32척)."}, {"k": "국내", "v": "포스코인터내셔널(반출입업·광양 저장·미국 가스전 인수), SK가스(LNG·LPG 겸용 울산 GPS), SK이노베이션(E&S), 한국가스공사, 삼성중공업(FLNG 10기 중 6기)."}, {"k": "리스크", "v": "슈퍼 엘니뇨 온난 겨울, 파나마 정상화, 호르무즈 조기 정상화, SMP 상한제."}]}], "note": "호르무즈 봉쇄와 Ras Laffan 피격으로 LNG 부족이 2026~2030년으로 길어졌고, 미국 LNG가 대체 공급원이 됐다."}, {"h": "⑥ 바이오연료·팜 — 나무가 닫는 공급 상단", "blocks": [{"t": "brief", "items": [{"k": "무엇이", "v": "인도·중국 합산 추가 수요 연 180~220만톤, SAF 2034년 4,200~4,500만톤 중 HEFA 55~65%."}, {"k": "왜 지금", "v": "B50 테스트(2025.12~)와 2027 시행 목표, EUDR 2026.12 적용."}, {"k": "국내", "v": "포스코인터내셔널(CPO 20→60만톤, 팜 영업이익률 평균 약 40%), LX인터내셔널."}, {"k": "리스크", "v": "인니 보조금 재원·토지 재분류, EUDR 추적성 미비."}]}], "note": "인니 B50이 수출 물량을 흡수하고 재식재 시차가 공급을 막아 팜유가 정책 연료·SAF 원료로 재평가된다."}, {"h": "⑦ 우주 에너지 — kWh/㎡에서 Compute per kilogram으로", "blocks": [{"t": "brief", "items": [{"k": "무엇이", "v": "LEO 발사비 $2,700/kg → 스타십 목표 $100 미만, 궤도 DC 임계 $200~500/kg. NASA 달 원전 100kWe(2030)."}, {"k": "왜 지금", "v": "SpaceX 태양광 1→10→100GW 구상, Google Suncatcher 2027 시연."}, {"k": "국내", "v": "OCI홀딩스(폴리), 대주전자재료·동진세미켐(페이스트), 한화솔루션(탠덤 플랫폼)."}, {"k": "리스크", "v": "실적보다 기대가 선행하는 테마 초기 단계, 방사선 내성·다년 신뢰성 미검증."}]}], "note": "궤도 데이터센터·달 기지 전력이 초경량 태양전지(HJT·탠덤)와 소형 원자로 수요를 만드는 장기 옵션이다."}, {"h": "지금 어디에 있나", "blocks": [{"t": "callout", "text": "2026.9 현재는 '정책 일정이 만든 수요 집중기'다. 미국은 2026.7.4 태양광·풍력 착공 마감을 지나 2027년까지 설치 러시가 이어지고, ESS는 PFE 규정과 관세로 한국 셀·부품의 미국 현지 공급이 본격화되는 초입이다. 국내는 해상풍력특별법 시행·RPS 폐지 확정·12차 전기본 잠정안으로 제도 골격은 갖췄지만 실발주는 아직 제한적이다. 가스는 카타르 공백과 유럽 저재고로 JKM·TTF가 3.5년래 최고인 반면, 겨울 기온과 규제가 단기 방향을 가를 변수다.", "title": "2026.9 현재"}]}, {"h": "사이클 연대기 2025.7~2026.9", "blocks": [{"t": "timeline", "items": [{"date": "2025-07", "title": "OBBBA 제정", "body": "태양광·풍력 ITC/PTC 조기 일몰, ESS ITC·AMPC는 유지하되 PFE·MACR 도입, 연료전지 연료 무관 ITC. 미국 태양광 전망 하향(BNEF 누적 -25%)과 ESS·연료전지 상대 수혜가 동시에 부각.", "tone": "중립"}, {"date": "2025-07", "title": "중국 반내권·폴리 구조조정 착수, 국내 ESS 1차 중앙계약시장", "body": "MIIT가 원가 이하 판매를 금지하며 폴리 가격 일시 반등. 국내 장주기 ESS 1차 입찰(536MW)에서 삼성SDI 76%.", "tone": "긍정"}, {"date": "2025-10", "title": "태양광+ESS 탈중국 공급망 부각", "body": "UFLPA 통관 강화로 비중국 폴리 가동률 90% 회복, ESS 셀 한-중 가격 역전 논리 확산. Bloom-Brookfield 50억달러 AI 인프라 파트너십으로 연료전지의 데이터센터 전원화가 가시화.", "tone": "긍정"}, {"date": "2025-11", "title": "중국 배터리·소재 수출통제, 포스코인터내셔널 팜 플랜테이션 인수", "body": "LFP 양극재·흑연 음극재·장비 수출 허가제(11.8)로 미국 ESS 공급망 재편 가속. 포스코인터내셔널이 삼푸르나 아그로를 인수해 CPO 캐파 3배로.", "tone": "중립"}, {"date": "2025-12", "title": "국내 풍력 목표 현실화, PJM Co-location Order 확정", "body": "2030 풍력 목표 18.3GW → 9GW(해상 3GW)로 하향하되 2035 37GW 경로 제시. 미국은 발전소 직결 대형 부하를 제도화해 BTM 데이터센터·ESS 수요가 즉시 발생.", "tone": "중립"}, {"date": "2026-01", "title": "중국 SAMR 폴리 담합 경고, 국민성장펀드 신안우이 투입", "body": "폴리 구조조정 합작법인이 반독점 경고로 연기되며 가격 급락(PV Insights 기준). 국내는 신안우이 해상풍력에 7,500억원 정책금융, 2.89조원 금융주선 완료. 영국 AR7로 유럽 해상풍력 재가격화 확인.", "tone": "중립"}, {"date": "2026-02", "title": "미-이란 전쟁 발발, CHARGE Act 발의", "body": "중동 리스크로 유가·LNG 급등 시작. 중국 기술 ESS 수입 금지 법안 발의, 인도·인니·라오스 태양광 CVD 예비판정(80~130%).", "tone": "중립"}, {"date": "2026-03", "title": "호르무즈 봉쇄·Ras Laffan 피격, 해상풍력특별법 시행", "body": "카타르 LNG 캐파 17% 손상, JKM +60%. 에너지 안보가 전환의 최상위 가치로 부상하며 재생에너지 재평가(EU Clean Energy Investment Strategy €660bn). 3.26 해상풍력특별법 시행.", "tone": "긍정"}, {"date": "2026-04", "title": "중국 수출 VAT 환급 폐지, 중국 셀 효율 28%대", "body": "태양광 수출 VAT 환급 9% 전면 폐지로 글로벌 모듈 바닥가 상승. LONGi HIBC 28.13%·Trina THBC 28.0%로 중국 기술 격차 확대, 한화솔루션은 유상증자로 탠덤·미국 투자 대응.", "tone": "중립"}, {"date": "2026-05", "title": "중국 HJT 장비 대미 수출 불허, 우주 에너지 테마", "body": "미·중 정상회담 이후 중국 정부가 HJT 장비 수출 불허 의사를 밝혀 미국 캐파 구축 병목 부각. SpaceX 100GW 태양광 구상·NASA 달 원전 등 우주 에너지가 새 서사로 등장.", "tone": "중립"}, {"date": "2026-06", "title": "FERC Large Load Order, 국내 해상풍력 입찰 이행안", "body": "Co-location 규칙의 전국 확대로 BTM 전원 비중 확대. 국내는 2035년까지 연도별 해상풍력 입찰 물량(연 4GW+)을 사전 제시해 공급망 가시성 제고.", "tone": "긍정"}, {"date": "2026-07", "title": "미국 태양광·풍력 착공 마감(7.4), SK이터닉스 KKR 편입", "body": "착공 러시가 마무리되며 2026~2027 설치 집중 확정. 국내 디벨로퍼의 자본 병목 완화. 서구 터빈 OEM 2Q 실적에서 Vestas·Nordex 두 자릿수 마진 확인, GE Wind는 부진.", "tone": "긍정"}, {"date": "2026-08", "title": "신재생법 개정(RPS 폐지)·12차 전기본 잠정안", "body": "RPS 폐지·계약시장 전환 확정, 2040 전력수요 상향으로 송변전 투자 115~124조원 전망과 ESS 약 220GWh 필요 추정. 풍력 2030 9.2GW·2040 60.5GW 경로.", "tone": "긍정"}, {"date": "2026-09", "title": "카타르 공백 장기화, 국내 태양광 이격거리 규제 폐지", "body": "IEA 2026~2030 누적 LNG 공급손실 120~140bcm, JKM 약 $28로 3.5년래 최고. 국내는 이격거리 금지법 시행과 ESS 3차 입찰(약 540MW) 진행.", "tone": "긍정"}]}]}, {"h": "상방 vs 하방", "blocks": [{"t": "proscons", "bull": ["AI 데이터센터 전력 수요가 공급을 압도해 태양광+ESS·연료전지·가스터빈·ESS가 경쟁이 아니라 누적 수요가 된다(BTM 선행, 2028 이후 FTM 추가).", "미국 규제(UFLPA·AD/CVD·232·PFE·CHARGE Act)가 만든 적격 공급 부족으로 비중국 폴리·셀·ESS 셀이 2027년까지 가격 협상력을 유지한다.", "풍력은 터빈 ASP 30~50% 회복과 CfD 재가격화(영국 AR7)로 밸류체인 마진이 정상화되고, OEM 수주가 6~12개월 뒤 타워·베어링 실적으로 번진다.", "국내는 RPS 폐지·장기 계약시장, 해상풍력특별법, 서해안 HVDC, 국민성장펀드로 인허가·계통·금융 3대 병목이 동시에 완화돼 2030년대 수백조원 규모 기자재 시장이 열린다.", "호르무즈 이후 에너지 안보가 정권과 무관한 구조적 동력이 되어, 연료 수입이 필요 없는 재생에너지와 비중동 LNG 공급망의 전략 가치가 높아진다.", "카타르 공백 장기화로 미국 LNG 스팟·직도입·보세 트레이딩·겸용 발전소의 스프레드 수익이 수년간 이어질 수 있다."], "bear": ["2028년 이후 미국 태양광 ITC 소멸로 비중국·미국산 모듈 프리미엄이 사라지고, Section 232가 기대와 다르게 설계되면 모듈 가격 경쟁이 재개된다.", "장기금리 재상승 시 해상풍력 FID 지연·손상차손이 반복되고, 국내 해상풍력은 군 작전성·주민수용성으로 착공이 재차 밀릴 수 있다.", "AMPC 일몰(풍력 2027말, 전체 2033), 미국 정책 변경(중간선거), 관세 완화가 한국 기업의 미국 이익을 직접 줄인다.", "북미 신공장 양산 지연·초기 고정비, 단일 고객 의존으로 ESS 부품사 이익 회복이 늦어질 수 있다(2025년 다수 부품사 영업이익 급감).", "중국 폴리 구조조정이 느슨해지거나 중국 업체가 탠덤·셀 효율에서 격차를 벌려 비중국 진영의 기술 프리미엄이 축소된다.", "슈퍼 엘니뇨로 따뜻한 겨울, 파나마 운하 정상화, 호르무즈 조기 정상화, SMP 상한제가 LNG 스프레드를 급격히 줄일 수 있다."], "lt": "상방 논리", "rt": "하방 논리"}]}, {"h": "다음에 확인할 것", "blocks": [{"t": "bullets", "items": ["Section 232 태양광 조치의 최종 설계(쿼터·최저수입가격·적용 기준)와 시행 시점", "NERC 연산부하 신뢰도 표준(2026.12 제출)과 FERC Large Load 규칙 확정 — ESS 의무화 강도", "영국 AR8·유럽 경매 결과와 글로벌 해상풍력 FID CAPEX 회복 여부", "국내 해상풍력 첫 예비지구 지정·서해안 HVDC 1단계 사업자 선정·2027 경쟁입찰 상한가", "한국 셀 3사 미국 ESS 라인 가동률·수율과 LFP 소재의 PFE 충족", "EU 가스 저장률 11월 목표 달성 여부와 겨울 기온, 카타르 설비 복구 일정"]}]}]}, "project": {"title": "프로젝트·수주 트래커", "h2": "프로젝트·수주 트래커", "en": "Project & Order Tracker", "lede": "수주·계약·M&A는 테마가 실적으로 넘어가는 증거다. **날짜·규모·상대방**을 기록해 두면 다음 딜 검토 때 피어 레퍼런스와 에퀴티 스토리의 근거로 바로 쓸 수 있다. 특히 이 섹터는 \"허가\"와 \"착공\" 사이의 거리가 멀어, 트래커는 파이프라인이 아니라 **확정 계약**을 중심으로 적었다.", "sections": [{"h": "국내 기업 주요 수주·계약·M&A", "blocks": [{"t": "table", "cols": ["시점", "기업", "내용", "규모", "상대방· xt><text x=\"661\" y=\"130\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">폴리·LNG·팜<\/text><line x1=\"661\" y1=\"146\" x2=\"661\" y2=\"168\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr24)\"/><rect x=\"575\" y=\"170\" width=\"172\" height=\"50\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"661\" y=\"191\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">사이클·원가곡선<\/text><text x=\"661\" y=\"206\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".78\">피크 이익 경계<\/text><line x1=\"661\" y1=\"222\" x2=\"661\" y2=\"244\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr24)\"/><rect x=\"575\" y=\"246\" width=\"172\" height=\"44\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--accent)\"/><text x=\"661\" y=\"272\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">PBR 밴드·연령 EV/EBITDA<\/text><path d=\"M480 52 V70 H846 V92\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.4\" marker-end=\"url(#a-tr24)\"/><rect x=\"760\" y=\"94\" width=\"172\" height=\"50\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"846\" y=\"116\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">신기술<\/text><text x=\"846\" y=\"130\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">탠덤·우주 에너지<\/text><line x1=\"846\" y1=\"146\" x2=\"846\" y2=\"168\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr24)\"/><rect x=\"760\" y=\"170\" width=\"172\" height=\"50\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"846\" y=\"191\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">실적 없음<\/text><text x=\"846\" y=\"206\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".78\">Bear/Base/Bull<\/text><line x1=\"846\" y1=\"222\" x2=\"846\" y2=\"244\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr24)\"/><rect x=\"760\" y=\"246\" width=\"172\" height=\"44\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--accent)\"/><text x=\"846\" y=\"272\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">시나리오 DCF<\/text><rect x=\"20\" y=\"310\" width=\"920\" height=\"44\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--alert)\"/><text x=\"480\" y=\"337\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">공통 함정: 보조금(AMPC·ITC)과 일회성 스프레드(LNG 차익 등)를 지속 이익으로 보고 정상 멀티플을 주는 것<\/text><\/svg>", "cap": "먼저 \"이익이 어디서 나오나\"를 묻는다. **정책 이익이 섞인 제조사는 AMPC를 분리한 PER, OEM에 후행하는 기자재는 할인 P/E·P/B, 감가상각이 순이익을 왜곡하는 발전 자산은 P/FFO, 사이클 원자재는 PBR 밴드, 실적 없는 신기술은 시나리오 DCF**다. 어느 경우든 보조금과 일회성 스프레드를 지속 이익으로 보는 것이 공통 함정이다."}]}, {"h": "방법론 상세 9가지", "blocks": [{"t": "mods", "items": [{"name": "12개월 선행 PER(제조사)", "lede": "태양광 셀·모듈, 배터리 셀 등 정책 수혜가 실적으로 확인되는 제조 구간", "paras": ["12개월 선행 EPS에 피어 PER을 적용하되 AMPC 포함·제외 이익을 분리해 본다. 이익 추정치 상향 여부가 핵심 트리거다."], "fields": [{"k": "밴드·레퍼런스", "v": "2028E 기준 글로벌 배터리 셀 평균 P/E 22.6배, 이차전지 소재 27.4배, 국내 소재 47.2배(2026.5)."}, {"k": "함정", "v": "AMPC는 2030년대 감축·폐지되고 PFE 요건에 좌우되므로 영구 이익으로 보면 과대평가. 중국 태양광 피어 PER은 적자·구조조정으로 왜곡돼 보정 필요."}]}, {"name": "터빈 OEM 대비 할인 P/E·P/B 밴드(풍력 기자재)", "lede": "타워·베어링·하부구조물 등 OEM 발주에 후행하는 기자재 업체", "paras": ["글로벌 터빈사(Vestas·Nordex) 12개월 선행 P/E에 40~50% 할인을 적용하거나, P/B 밴드에서 다운사이클 평균 이하 여부로 저평가를 판단한다. 하부구조물은 수주 공백기 변동성을 감안해 과거 3개년 평균 멀티플을 보수적으로 쓴다."], "fields": [{"k": "밴드·레퍼런스", "v": "터빈 OEM 2026E P/E 평균 약 23.3~23.4배 vs 국내 타워사 약 9.4배(2026.3). 할인 축소 조건은 미국 법인 마진 정상화·신규 고객 확보"}, {"k": "함정", "v": "OEM 대비 교섭력이 낮고 업황 후행성이 커 OEM 주가와 괴리 가능. 지배구조(최대주주 매각) 불확실성은 별도 할인 요인."}]}, {"name": "P/FFO·P/B(디벨로퍼·IPP)", "lede": "개발 기간 이익이 작고 COD 후 감가상각이 커서 순이익이 현금흐름을 왜곡하는 발전 자산 보유 기업", "paras": ["순이익 대신 FFO(순이익+감가상각 등)나 배당가능현금(CAFD) 대비 시가총액으로 평가한다. 디벨로퍼는 파이프라인 단계별(후기·착공 승인 전후) 용량 × MW당 매각단가로 개발가치를 산정한다."], "fields": [{"k": "밴드·레퍼런스", "v": "글로벌 인프라 디벨로퍼(Brookfield Renewable·Clearway·Boralex) P/FFO 평균 약 13배(2026.3). NextEra 2026 가이던스 기준 PER 약 23~24배, 5년 평균 24.4배"}, {"k": "함정", "v": "인도 기준 매출 인식으로 분기 변동이 커 연간 기준 평가 필요. 파이프라인 총량보다 계통 연결권 확보 비중이 중요하며, 공사(EPC) 매출 비중이 높으면 저마진 구조."}]}, {"name": "PBR 밴드·원가곡선(폴리실리콘)", "lede": "폴리실리콘 등 사이클이 큰 소재 장치산업", "paras": ["규제 환경별 PBR 구간(UFLPA 이후 비중국 프리미엄 시기 평균)을 기준선으로 쓰고, 원가곡선상 위치로 가격 하방 시 이익 방어력을 판단한다. 사업부 합산 시 피어 EV/EBITDA에 규모 할인을 적용한다."], "fields": [{"k": "밴드·레퍼런스", "v": "UFLPA 발효(2022.6) 이후 평균 PBR 약 0.5배, 12개월 선행 약 0.3배(2025.10), 2011년 초호황기 4.9배. 폴리 피어(Longi·Tongwei·Daqo·Wacker) 선행 EV/EBITDA 평균 약 12배"}, {"k": "함정", "v": "Section 232 등 규제 설계에 따라 프리미엄이 급변. 중국 가격과 비중국 가격이 분리된 이원 시장이라 중국 가격 반등을 곧바로 수혜로 읽으면 오류."}]}, {"name": "사업부 합산가치(SOTP)", "lede": "정유·배터리·발전·E&P를 함께 가진 복합 에너지 기업, 폴리+개발+발전 지주사, 종합상사", "paras": ["사업부별로 적합한 방법(정유·화학은 아시아 피어 EV/EBITDA, 배터리 자회사는 피어 대비 할인, E&P는 확인 매장량×배럴당 가치, 발전은 국내 발전 피어 EV/EBITDA, LPG 본업 EV/EBITDA 5.5~6.0배)을 적용해 합산한다."], "fields": [{"k": "밴드·레퍼런스", "v": "종합상사는 일본 5대 상사 선행 EV/EBITDA를 비교군으로 한국 디스카운트·이익 분산도·주주환원 차이를 할인"}, {"k": "함정", "v": "지주·상사 할인율 가정이 결과를 좌우. 일시적 스프레드 이익(LNG 차익거래 등)에 정상 멀티플을 주면 과대평가."}]}, {"name": "시나리오 DCF·옵션가치(신기술·신사업)", "lede": "페로브스카이트 탠덤, 우주 에너지, 신규 ESS 사업처럼 단기 실적이 없는 사업부", "paras": ["단계(2026~27 R&D·파일럿 → 2028~30 프리미엄 제품 → 2030~ Bankability 기반 확산)별로 Bear/Base/Bull 시나리오를 만들고 터미널 멀티플과 할인율로 현재가치를 구한다."], "fields": [{"k": "밴드·레퍼런스", "v": "탠덤 사업부 예시: 2035 터미널 EV/EBITDA 6~13배, 할인율 11%로 Bear 약 0.34조·Base 약 2.2조·Bull 약 9.6조원(업계 추정). 배터리는 ESS CAGR 25% 전후·AMPC 2032년 말 폐지 가정 DCF"}, {"k": "함정", "v": "시나리오 간 차이는 출하량보다 보조금 종료 후 자생 마진과 부여 배수에서 발생. 단기 실적 모델에 과도한 매출을 넣으면 위험."}]}, {"name": "EV/EBITDA(ESS SI·EMS·케이블 시공)", "lede": "ESS 시스템 통합·전력 인프라 EMS, 포설선 기반 해저케이블 시공", "paras": ["AI 인프라 밸류체인 편입 여부로 멀티플 레짐을 나누고, 케이블 시공은 증설(신조선) 완료 이후 연도 EBITDA에 프리미엄 멀티플을 적용한다."], "fields": [{"k": "밴드·레퍼런스", "v": "글로벌 EMS 과거 EV/EBITDA 5~10배 → AI 밸류체인 편입 업체 12~15배(Jabil 13.2배, Quanta 11.3배, Flex 15배). 초고압·해저 전선은 Prysmian 등 글로벌 피어 평균 P/B 적용"}, {"k": "함정", "v": "소프트웨어(EMS) 역량 없이 하드웨어 조립 비중이 크면 프리미엄 정당화 어려움. 신조선 인도 지연 시 증설 효과 이연."}]}, {"name": "연령 구조별 EV/EBITDA(팜 플랜테이션)", "lede": "팜 등 생물자산 기반 플랜테이션", "paras": ["보유 나무 연령 분포로 재식재 CAPEX 시점과 향후 생산량을 추정해 멀티플 구간을 정한다. 통합 사업자(플랜테이션→정제→연료)는 원자재 할인을 축소한다."], "fields": [{"k": "밴드·레퍼런스", "v": "젊은 나무 편중 10~12배, 균형 7~9배, 노령 편중 4~6배"}, {"k": "함정", "v": "EUDR 추적성 미비 시 판매 가능 시장이 제한돼 할인. 인니 토지 재분류 등 정책 리스크."}]}, {"name": "계약 구조별 평가(LNG)", "lede": "미국 LNG 수출업체, 가스 도매 공기업, 직도입 발전·트레이더", "paras": ["장기계약 90% 이상 수출업체는 물량 성장주, 미계약 비중이 높은 업체는 스프레드 레버리지 주식으로 본다. 가스공사는 요금기저·적정투자보수 기반, 직도입·트레이딩 이익은 피크 이익에 낮은 멀티플을 적용한다."], "fields": [{"k": "밴드·레퍼런스", "v": "2022년 러-우 전쟁 당시 이익 급증 후 정상화 경험이 멀티플 할인의 근거"}, {"k": "함정", "v": "가스공사 미수금이 배당 가시성을 좌우, 환율이 외화부채 평가손익을 흔든다. 정부 규제(SMP 상한제) 발동 시 이익 급감."}]}], "open": 2}]}, {"h": "섹터 주가 드라이버 7개", "blocks": [{"t": "grid", "items": [{"h": "장기금리", "p": ["자본비형 전원의 원가 그 자체다. 금리 하락기에는 디벨로퍼·IPP·해상풍력 기자재가, 상승기에는 FID 이전 프로젝트가 먼저 흔들린다. 2026.8.26 미국 10년물 4.6%, 한국 4.2%대."]}, {"h": "미국 정책 일정", "p": ["착공·준공 마감, PFE 기준 상향, Section 232, 중간선거(2026.11.3). 일정이 가까워질수록 \"수혜 기간\"이 주가의 핵심 변수가 된다."]}, {"h": "중국 가격", "p": ["폴리·모듈 FOB 바닥이 오르면 비중국 가격도 함께 오른다. 단 조사기관별 방향이 엇갈리는 구간이 많아 단일 지표에 의존하면 안 된다."]}, {"h": "AI 전력 수요", "p": ["빅테크 CAPEX(2026E 5,959억달러), PJM 용량가, Bloom 백로그가 ESS·연료전지·특수변압기·가스터빈의 선행 지표다."]}, {"h": "터빈 OEM 수주·마진", "p": ["Vestas·Nordex의 수주와 마진이 6~12개월 뒤 국내 타워·베어링 실적을 예고한다. OEM 주가와 기자재 주가 사이의 시차를 이용한 공모 타이밍 설명이 가능하다."]}, {"h": "LNG 스프레드", "p": ["JKM·TTF−HH 스프레드와 EU 저장률이 직도입·트레이딩 이익을 정한다. 피크 이익에는 낮은 멀티플이 붙는다."]}, {"h": "국내 입찰 결과", "p": ["ESS 중앙계약시장·해상풍력 경쟁입찰·수소발전 입찰의 물량과 낙찰가가 국내 매출의 가시성을 정한다."]}], "cols": 2, "numbered": true}]}, {"h": "IPO·자본시장 동향", "blocks": [{"t": "table", "cols": ["시점", "기업·거래", "내용", "ECM 시사점"], "rows": [["2026.3 발표", "한화솔루션 유상증자", "약 2.4조원(약 60% 채무 상환, 탠덤 파일럿 약 1,000억원). 다른 자료는 2026.8 1.17조원·주식수 31% 증가로 기술", "성장 투자와 재무구조 개선을 함께 설명하는 대형 유증 — 발표액·확정액·희석률을 원 공시로 확인"], ["2026.3", "SK이터닉스 최대주주 변경", "KKR 지분 43.5% 인수(3,480억원)", "FI 편입으로 자본 병목 완화, 향후 오버행·엑시트 구조가 변수"], ["진행 중", "SK오션플랜트 매각", "최대주주 SK에코플랜트 지분 35.6% 매각 협상, 지자체 반대로 지연", "지배구조 불확실성이 멀티플 할인으로 작용"], ["2026.3", "산일전기 2대주주 지분 매각 공시", "10%(305만주) 매각 계획", "상장 후 FI·2대주주 물량 출회 — 락업 설계의 중요성"], ["2026.12 목표", "GCL Optoelectronics 홍콩 IPO", "페로브스카이트 모듈 1→2GW 캐파", "탠덤 피어 형성, 신기술 밸류에이션 레퍼런스"], ["2025", "Fermi America 뉴욕·런던 동시 상장", "AIDC·반도체 전력용 원전(11GW) 프로젝트, 약 6.8억달러 IPO", "전력 인프라 프로젝트의 시장 기반 자금 조달 사례"], ["2026", "Bloom 관련 AI 펀드 청산", "비나텍 등 Bloom 공급망 국내 기업 수급 충격", "테마 편입 종목의 수급 변동성"]], "title": "IPO·자본시장 동향", "note": "공시·언론 기준. 개별 거래 조건은 원 공시로 확인."}]}, {"h": "ECM 시사점", "blocks": [{"t": "bullets", "items": ["IPO 관점에서 이 섹터 기업의 이익은 상당 부분이 정책(AMPC·ITC·계약시장 고정가)에서 나오므로, 증권신고서 투자위험에 보조금 일몰 연도별 이익 민감도와 공급망(MACR) 충족 근거를 정량으로 제시하는 것이 공모가 논리의 신뢰도를 좌우한다.", "수주 산업(풍력 기자재·케이블)은 실적 확인 전 FID·입찰 개시 시점에 리레이팅되는 경향이 있어, 공모 시점이 업황 사이클의 어디에 있는지(OEM 수주 선행 vs 기자재 후행)를 피어 선정과 함께 설명해야 한다.", "ESS 부품·EMS 업체는 AI 인프라 밸류체인 편입 여부로 멀티플 레짐이 달라지므로, 고객(하이퍼스케일러·SI) 직납 여부와 북미 현지 생산 비중을 핵심 에퀴티 스토리로 삼되 단일 고객 의존도와 신공장 양산 지연 이력은 반드시 공시해야 한다.", "디벨로퍼·IPP는 순이익보다 P/FFO·파이프라인 단계별 가치가 적합하므로, 국내 비교기업이 부족하면 해외 IPP 피어(Brookfield Renewable·Clearway·Enlight·NextEra)를 쓰는 근거와 국내 계약시장 전환 효과를 함께 제시해야 한다.", "최대주주 변경·지분 매각(SK이터닉스 KKR, SK오션플랜트 매각 협상, 오버행 해소 사례)은 이 섹터에서 반복되는 밸류에이션 변수라, 락업·오버행 구조 설계가 공모 흥행에 중요하다."]}, {"t": "callout", "text": "증권신고서 투자위험에는 **보조금 일몰 연도별 이익 민감도**, **MACR 충족 근거**, **단일 고객 의존도와 신공장 양산 지연 이력**, **최대주주 변경·FI 풋옵션 등 오버행 구조**를 정량으로 넣는 것이 공모가 논리의 신뢰도를 좌우한다.", "title": "공모 문서에 반드시 들어갈 것", "tone": "warn"}]}]}, "check": {"title": "체크포인트", "h2": "딜 체크포인트", "en": "Due Diligence Checkpoints", "lede": "에너지전환 기업은 같은 매출 성장이라도 **정책 수혜인지, 병목 자산의 가격인지, 일시적 러시인지**에 따라 지속성이 완전히 다르다. 먼저 유형별 5분 스캔으로 무엇을 의심해야 하는지 정하고, 세부 체크리스트로 내려간 뒤, 공통 레드플래그로 마무리한다.", "sections": [{"h": "기업 유형별 5분 스캔", "blocks": [{"t": "brief", "items": [{"k": "태양광 제조", "v": "미국 매출 비중과 lf-Assembled Monolayer", "def": "전자·정공 수송층과 자기조립단분자 계면층. 효율과 열화율을 좌우.", "group": "태양광"}, {"term": "TCO", "en": "Transparent Conductive Oxide", "def": "빛을 통과시키며 전기가 통하는 투명전도성 산화물 전극.", "group": "태양광"}, {"term": "CdTe 박막", "en": "Cadmium Telluride", "def": "카드뮴텔루라이드를 유리에 증착한 박막 모듈. First Solar 주력.", "group": "태양광"}, {"term": "III-V 다중접합", "en": "III-V multijunction", "def": "갈륨비소 등 화합물을 쌓은 초고효율 셀. 우주용 주류이나 고가.", "group": "태양광"}, {"term": "BOS", "en": "Balance of System", "def": "모듈·터빈을 제외한 인버터·구조물·배선·하부구조물·케이블 등 나머지 설비와 비용.", "group": "태양광"}, {"term": "BIPV", "en": "Building-Integrated Photovoltaics", "def": "건물 외벽·창호 등 건축자재와 일체화한 태양광.", "group": "태양광"}, {"term": "Bankability", "en": "Bankability", "def": "금융기관·보험사가 해당 기술·제품을 담보로 장기 자금을 제공할 수 있는 상태.", "group": "태양광"}, {"term": "T80 수명", "en": "T80 lifetime", "def": "초기 성능이 80%로 떨어지는 데 걸리는 시간.", "group": "태양광"}, {"term": "IEC 61215/61730", "en": "IEC PV standards", "def": "태양광 모듈 내구성·안전성 국제 표준. 통과 못 하면 PF 불가.", "group": "태양광"}, {"term": "풍력 터빈 OEM", "en": "Original Equipment Manufacturer", "def": "나셀·블레이드를 설계·제조해 디벨로퍼에 공급하는 터빈 제조사(Vestas·SGRE·GE·Nordex).", "group": "풍력·해양"}, {"term": "나셀", "en": "Nacelle", "def": "발전기·기어박스 등 핵심 부품을 담은 터빈 상부 몸체.", "group": "풍력·해양"}, {"term": "모노파일", "en": "Monopile", "def": "얕은 바다에 박는 단일 대형 강관 기초. 1기 1,000~2,500톤.", "group": "풍력·해양"}, {"term": "자켓", "en": "Jacket Foundation", "def": "깊은 바다용 격자형 철골 하부구조물.", "group": "풍력·해양"}, {"term": "부유식 해상풍력", "en": "Floating Offshore Wind", "def": "부유체를 계류해 심해에 설치하는 해상풍력. kW당 CAPEX가 가장 높다.", "group": "풍력·해양"}, {"term": "트랜지션피스", "en": "Transition Piece", "def": "터빈 타워와 모노파일을 연결하는 구조물.", "group": "풍력·해양"}, {"term": "해상변전소", "en": "Offshore Substation(OSS)", "def": "해상풍력 전력을 승압·집전해 육지로 보내는 해상 변전 설비.", "group": "풍력·해양"}, {"term": "인터어레이 / 수출 케이블", "en": "Inter-array / Export Cable", "def": "단지 내부를 잇는 케이블과 육지로 보내는 송전 케이블.", "group": "풍력·해양"}, {"term": "CLV", "en": "Cable Laying Vessel", "def": "해저케이블 포설·매설 전용선. 전 세계 약 20척.", "group": "풍력·해양"}, {"term": "
