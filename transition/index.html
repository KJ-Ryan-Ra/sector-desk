<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>에너지전환 리서치 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --ground:#FBFAF7; --surface:#FFFFFF; --raised:#F3F4F0; --sunken:#EFF1EC;
  --line:#E0E4DC; --line-strong:#C9D0C6;
  --ink:#17211F; --ink-2:#3A4744; --ink-3:#55625D; --ink-4:#626F6A;
  --accent:#557A12; --accent-soft:color-mix(in srgb,var(--accent) 10%,transparent); --accent-line:color-mix(in srgb,var(--accent) 34%,transparent);
  --ok:#1D7A5C; --warn:#8A6300; --alert:#A2304A; --dim:#55625D;
  --shadow:0 1px 2px rgba(23,33,31,.06),0 8px 24px -12px rgba(23,33,31,.18);
  --rail:252px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0C1116; --surface:#131A21; --raised:#1A232B; --sunken:#0F161C;
    --line:#253039; --line-strong:#33424E;
    --ink:#DCE5EA; --ink-2:#BCCAD2; --ink-3:#9DAEB9; --ink-4:#8DA0AB;
    --accent:#A3C64E; --ok:#3DB08E; --warn:#D2A63A; --alert:#D9738A; --dim:#9DAEB9;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0C1116; --surface:#131A21; --raised:#1A232B; --sunken:#0F161C;
  --line:#253039; --line-strong:#33424E;
  --ink:#DCE5EA; --ink-2:#BCCAD2; --ink-3:#9DAEB9; --ink-4:#8DA0AB;
  --accent:#A3C64E; --ok:#3DB08E; --warn:#D2A63A; --alert:#D9738A; --dim:#9DAEB9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;line-height:1.3;letter-spacing:-.011em}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
b{font-weight:600;color:var(--ink)}

.shell{display:flex;min-height:100vh;align-items:flex-start}
.rail{width:var(--rail);flex:0 0 var(--rail);position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brand .mark{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--accent);font-weight:500;display:flex;align-items:center;gap:7px;line-height:1.4}
.brand .mark::before{content:"";width:7px;height:7px;background:var(--accent);border-radius:50%;flex:none}
.brand h1{font-size:18px;margin-top:9px;letter-spacing:-.02em;font-weight:700}
.brand .sub{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.5}
.nav{flex:1;overflow-y:auto;padding:10px 10px 20px}
.nav-group{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.15em;color:var(--ink-4);padding:14px 10px 6px;text-transform:uppercase}
.nav button{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-family:inherit;font-size:13.5px;line-height:1.4}
.nav button:hover{background:var(--raised);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button .k{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);flex:none;width:16px}
.nav button[aria-current="true"] .k{color:var(--accent)}
.desks{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px}
.desks .dl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-4);width:100%;padding:2px 4px 4px}
.desks a{font-size:12px;text-decoration:none;color:var(--ink-3);border:1px solid var(--line);border-radius:14px;padding:3px 9px;white-space:nowrap}
.desks a:hover{color:var(--accent);border-color:var(--accent-line)}
.desks a.cur{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);pointer-events:none}
.railfoot{padding:12px 16px;border-top:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}

.main{flex:1;min-width:0;padding:0 0 96px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:11px 40px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.legend .li{display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.legend .sw{width:9px;height:9px;border-radius:2px;flex:none}
.stamps{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.stamp{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);white-space:nowrap}
.tsw{display:inline-flex;gap:2px;padding:2px;background:var(--sunken);border:1px solid var(--line);border-radius:7px}
.tsb{padding:4px 9px;border:0;border-radius:5px;background:transparent;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:11px;cursor:pointer}
.tsb[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.pane{display:none;padding:34px 40px 0;max-width:1220px}
.pane.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pane.on{animation:none}}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;font-weight:500}
.pane > h2{font-size:29px;margin-top:8px;letter-spacing:-.025em;font-weight:700}
.lede{color:var(--ink-2);font-size:15.5px;max-width:74ch;margin-top:11px;line-height:1.72}
.sec{margin-top:44px}
.sec > h3{font-size:17.5px;display:flex;align-items:center;gap:11px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.sec > h3::before{content:"";width:3px;height:15px;background:var(--accent);border-radius:2px;flex:none}
.note{color:var(--ink-2);font-size:14px;line-height:1.72;margin-top:12px;max-width:78ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.card h4{font-size:14.5px;margin-bottom:8px}
.card p{font-size:13.5px;color:var(--ink-2);line-height:1.68}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kg{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.kg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kg{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px;display:flex;flex-direction:column;gap:5px}
.kpi .lab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.kpi .val{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;color:var(--accent)}
.kpi .cap{font-size:11.5px;color:var(--ink-3);line-height:1.5}

.tag{display:inline-flex;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 7px;border-radius:4px;border:1px solid;white-space:nowrap;vertical-align:middle}
.t-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 34%,transparent);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.t-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 34%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.t-alert{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 34%,transparent);background:color-mix(in srgb,var(--alert) 10%,transparent)}
.t-dim{color:var(--ink-3);border-color:var(--line-strong);background:var(--raised)}
.t-acc{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-2);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--raised);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.62}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--raised)}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
td.tk{font-family:"IBM Plex Mono",monospace;color:var(--ink-3);font-size:12.5px;white-space:nowrap}
td.nm{font-weight:600;white-space:nowrap}
.tcap{font-size:13.5px;font-weight:600;margin:22px 0 8px}
.tnote{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);margin-top:8px;line-height:1.6}

.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:14px 17px;border-radius:0 8px 8px 0;font-size:14.5px;color:var(--ink-2);line-height:1.76;max-width:88ch}

.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 6px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink-3);border-radius:20px;padding:5px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ground);font-weight:500}
.search{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 13px;font-family:inherit;font-size:14px}
.search:focus{border-color:var(--accent);outline:none}
select.search{max-width:200px}
.count{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}

/* chain */
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 2px 10px;margin-top:16px}
.fnode{flex:0 0 150px;background:var(--sunken);border:1px solid var(--line-strong);border-radius:9px;padding:10px 12px;font-size:13px}
.fnode .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--accent)}
.fnode .t{font-weight:600;line-height:1.35;margin-top:2px}
.farr{flex:0 0 22px;display:grid;place-items:center;color:var(--ink-4);font-size:14px}
.vc{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:14px}
.vcx{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px;border-top:2px solid var(--accent)}
.vcx .r{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--accent);margin-bottom:5px}
.vcx h4{font-size:14px;margin-bottom:5px}
.vcx p{font-size:13.2px;color:var(--ink-2);line-height:1.66}
.vcx .co{font-size:12px;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.6}

/* modules */
.mods{display:grid;gap:10px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mod > summary{padding:14px 18px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mod > summary::-webkit-details-marker{display:none}
.mod > summary::after{content:"+";margin-left:auto;font-family:"IBM Plex Mono",monospace;color:var(--ink-4);font-size:16px}
.mod[open] > summary::after{content:"−"}
.mod > summary:hover{background:var(--raised)}
.mname{font-size:15px;font-weight:600}
.men{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-4)}
.mod .body{padding:4px 18px 18px;border-top:1px solid var(--line)}
.mod dl{margin:0}
.mod dt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4);margin:14px 0 4px}
.mod dd{margin:0;font-size:14.3px;color:var(--ink-2);line-height:1.74;max-width:86ch}
.pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 7px;border-radius:3px;background:var(--raised);border:1px solid var(--line);color:var(--ink-3)}
.dplede{font-size:15.5px;color:var(--ink);line-height:1.78;margin:16px 0 4px;padding:2px 0 2px 14px;border-left:3px solid var(--accent);max-width:84ch;font-weight:450}
.dpn p{margin-top:12px;font-size:14.5px;color:var(--ink-2);line-height:1.84;max-width:82ch}
.dpul{margin:10px 0 0;padding-left:18px}
.dpul li{font-size:14px;color:var(--ink-2);line-height:1.74;margin-bottom:8px;max-width:84ch}
.dpkr{margin-top:18px;padding:13px 16px;background:var(--sunken);border:1px solid var(--line);border-radius:9px;font-size:14px;color:var(--ink-2);line-height:1.72}
.dpkr .l{color:var(--accent);font-weight:600;margin-right:6px}
.formula{font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;padding:10px 13px;margin-top:10px;color:var(--ink);line-height:1.6;white-space:pre-wrap}

/* bars */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.chart h4{font-size:14.5px}
.chart .u{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.bar{display:grid;grid-template-columns:minmax(90px,34%) 1fr 72px;gap:10px;align-items:center}
.bar .bl{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.bar .bt{position:relative;height:12px;background:var(--sunken);border-radius:3px;border:1px solid var(--line)}
.bar .bf{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:2px}
.bar .bf.neg{background:var(--alert)}
.bar .bf.est{background:repeating-linear-gradient(135deg,var(--accent) 0 4px,color-mix(in srgb,var(--accent) 55%,transparent) 4px 7px)}
.bar .bf.neg.est{background:repeating-linear-gradient(135deg,var(--alert) 0 4px,color-mix(in srgb,var(--alert) 55%,transparent) 4px 7px)}
.bar .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink-4)}
.bar .bv{font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.chart .cn{font-size:12px;color:var(--ink-3);margin-top:12px;line-height:1.6;padding-top:10px;border-top:1px solid var(--line)}

/* timeline */
.tl{margin-top:18px;border-left:1px solid var(--line-strong);margin-left:6px}
.tli{position:relative;padding:0 0 20px 22px}
.tli::before{content:"";position:absolute;left:-5px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--dim)}
.tli.pos::before{border-color:var(--ok)} .tli.neg::before{border-color:var(--alert)}
.tli .d{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.tli h4{font-size:14.5px;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tli p{font-size:13.8px;color:var(--ink-2);margin-top:4px;line-height:1.7;max-width:84ch}
.bb{list-style:none;margin:10px 0 0;padding:0}
.bb li{font-size:13.8px;color:var(--ink-2);line-height:1.66;padding:8px 0;border-bottom:1px dashed var(--line)}
.bb li:last-child{border-bottom:0}

.ck li{list-style:none;display:flex;gap:9px;align-items:flex-start;font-size:13.8px;color:var(--ink-2);line-height:1.62;padding:6px 0}
.ck{margin:6px 0 0;padding:0}
.ck input{margin-top:4px;accent-color:var(--accent);flex:none}
.more{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-family:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
.more:hover{border-color:var(--accent);color:var(--accent)}
.evt{display:grid;grid-template-columns:104px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.evt .d{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.evt .n{font-size:14px;font-weight:600}
.evt .m{font-size:13px;color:var(--ink-3);margin-top:2px;line-height:1.55}
.evt.past .d{color:var(--ink-4)}
.cloud{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

@media (max-width:900px){
  .desks{display:none}
  .shell{flex-direction:column}
  .rail{position:static;width:100%;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{display:flex;overflow-x:auto;padding:8px;gap:4px}
  .nav-group{display:none}
  .nav button{width:auto;white-space:nowrap}
  .nav button .k{display:none}
  .desks{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px}
.desks .dl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-4);width:100%;padding:2px 4px 4px}
.desks a{font-size:12px;text-decoration:none;color:var(--ink-3);border:1px solid var(--line);border-radius:14px;padding:3px 9px;white-space:nowrap}
.desks a:hover{color:var(--accent);border-color:var(--accent-line)}
.desks a.cur{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);pointer-events:none}
.railfoot{display:none}
  .topbar{padding:10px 16px}
  .pane{padding:24px 16px 0}
  .pane > h2{font-size:24px}
  .bar{grid-template-columns:1fr 60px}
  .bar .bl{grid-column:1/-1}
  .evt{grid-template-columns:1fr;gap:2px}
}
/* ===== v2 blocks ===== */
.fig{margin:18px 0 0;padding:16px 14px 14px;background:var(--sunken);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.fig svg{display:block;width:100%;min-width:560px;height:auto;color:var(--ink-2)}
.fig svg text{fill:currentColor;font-family:inherit}
.fig figcaption{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2);line-height:1.74;max-width:86ch}
.sec .blk{margin-top:16px}
.callout.w{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.callout.r{border-left-color:var(--alert);background:color-mix(in srgb,var(--alert) 7%,transparent)}
.stage{display:grid;grid-template-columns:26px 1fr;gap:0 15px}
.stage .col{position:relative}
.stage .col::before{content:"";position:absolute;left:12px;top:6px;bottom:-6px;width:1px;background:var(--line)}
.stage:last-child .col::before{display:none}
.stage .dot{width:25px;height:25px;border-radius:50%;border:1px solid var(--accent-line);background:var(--surface);color:var(--accent);font-family:"IBM Plex Mono",monospace;font-size:11px;display:grid;place-items:center;position:relative;z-index:1;font-weight:500}
.stage .content{padding-bottom:22px}
.stage h4{font-size:15px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.stage .meta{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 8px}
.stage p{font-size:13.8px;color:var(--ink-2);line-height:1.68;max-width:80ch}
.stage .chk{font-size:12.8px;color:var(--ink-3);margin-top:7px;padding-left:12px;border-left:2px solid var(--line);line-height:1.6}
.stage .chk b{color:var(--accent);font-weight:500}
.dcard .dfl{display:flex;flex-wrap:wrap;gap:6px;padding-top:12px}

 fill-opacity=\".85\">이익이 쌓이는 곳: 비중국 폴리·셀 · 초고압·해저케이블과 포설선 · 계통권을 확보한 개발 부지 · 재계약 가능한 장기 PPA<\/text><\/svg>", "cap": "물자는 원료에서 수요처로 흐르지만 **돈의 크기를 정하는 것은 오른쪽 끝(PPA 단가)과 아래(세액공제·금리)**다. 제조 단계는 중국과 가격 경쟁을 하지만 규제가 만든 적격 공급 부족이 프리미엄을 얹고, 발전 자산은 계통권과 장기 계약이 가치를 만든다. 따라서 한 기업을 볼 때는 \"어느 박스에 있는가\"보다 \"어느 병목을 쥐고 있는가\"를 먼저 묻는다."}, {"t": "p", "text": "에너지전환 밸류체인은 '자원·소재 → 핵심 설비 → 구조물·BOS → 계통연계 → 개발·금융 → EPC → 발전·운영 → 연료 트레이딩 → 수요처'로 흐른다. 이익은 병목이 있는 곳(비중국 폴리·셀, 초고압 기기, 해저케이블·포설선, 개발 완료 부지)에 몰리고, 범용 제조 단계는 중국과의 가격 경쟁에 노출된다."}, {"t": "cards", "items": [{"r": "01", "h": "자원·원료", "p": "메탈실리콘·폴리실리콘, 리튬·LFP 전구체, 천연가스(가스전·셰일), 팜유(FFB·CPO) 등 기초 원료 생산", "co": "**마진 원천** 원가곡선상 위치와 원산지 증빙 가능성(비중국 폴리 $17/kg vs 중국 $6~7/kg). 팜은 나무 연령·OER\n**국내** OCI홀딩스, 포스코인터내셔널, LX인터내셔널, SK이노베이션(E&S), 한국가스공사"}, {"r": "02", "h": "소재·부품", "p": "웨이퍼·전극 페이스트·TCO 타겟·페로브스카이트 전구체·봉지재, LFP 양극재·파우치 필름, 냉각·버스바·히트싱크, 베어링·단조품", "co": "**마진 원천** 고객 인증에 편입된 소재의 락인과 반복 매출, 북미 현지 공장 보유 여부\n**국내** 대주전자재료, 나노신소재, 엘케이켐, 엘앤에프, 율촌화학, 한중엔시에스, 신성에스티, 씨에스베어링"}, {"r": "03", "h": "핵심 설비 제조", "p": "태양전지 셀·모듈, 배터리 셀, 연료전지 스택, 풍력 터빈(나셀·블레이드), 슈퍼커패시터", "co": "**마진 원천** 규제 프리미엄(FEOC·DCA)·AMPC 세액공제, 기술 세대교체(TOPCon→탠덤), 가동률\n**국내** 한화솔루션, HD현대에너지솔루션, LG에너지솔루션, 삼성SDI, SK온, 두산퓨얼셀, 두산에너빌리티, 유니슨, 비나텍"}, {"r": "04", "h": "구조물·BOS·전력변환", "p": "풍력 타워·하부구조물(모노파일·자켓), ESS 인클로저, PCS·인버터, 특수변압기·배전기기", "co": "**마진 원천** 캐파 예약(Capa Reservation)과 가동률, 원자재 전가 조항, 현지 생산\n**국내** 씨에스윈드, SK오션플랜트, 세아제강지주, 서진시스템, 산일전기, LS ELECTRIC, 효성중공업, HD현대일렉트릭"}, {"r": "05", "h": "계통연계·해상 시공", "p": "해저케이블(인터어레이·수출·HVDC), 케이블 포설선(CLV)·터빈 설치선(WTIV), 변환설비", "co": "**마진 원천** 소수 과점(525kV+ HVDC 5개사)과 포설선이라는 희소 자산, 턴키 수행 능력\n**국내** LS(LS전선), 대한전선, LS마린솔루션, LS에코에너지, 한화오션, 한국전력(발주)"}, {"r": "06", "h": "개발·금융", "p": "부지·인허가·계통 연결권 확보, PPA 체결, PF 조달 후 프로젝트 매각", "co": "**마진 원천** 개발 완료 부지의 희소성(태양광 약 1억원/MW, ESS 약 1.5억원/MW 매각 가정), 고위험·고수익\n**국내** SK이터닉스, OCI홀딩스(OCI Energy), 삼성물산"}, {"r": "07", "h": "EPC·시공", "p": "발전소 설계·조달·시공, 해상풍력 EPCI", "co": "**마진 원천** 수주 규모와 공정 관리, 저마진 구조라 개발·운영과 결합해야 이익률 상승\n**국내** 한화솔루션(미국 EPC), HD현대에너지솔루션, 금양그린파워, 삼성물산"}, {"r": "08", "h": "발전·운영(IPP)", "p": "발전소 보유·운영, PPA·계약시장·SMP로 전력 판매, O&M, 온사이트(BTM) 전원 공급", "co": "**마진 원천** 장기 고정가 계약의 현금흐름, PPA 재계약 시 가격 인상(+$14~40/MWh 사례), 연료 옵셔널리티\n**국내** SK이터닉스, SK이노베이션(E&S), SK가스, SGC에너지"}, {"r": "09", "h": "연료 트레이딩·저장", "p": "LNG 직도입·보세 저장·재수출(반출입업), LPG-LNG 연료 전환", "co": "**마진 원천** HH 연동 저가 LNG와 JKM·TTF 고가 시장 간 스프레드, 보세 탱크·자사선 보유 여부\n**국내** 포스코인터내셔널, SK가스, SK이노베이션(E&S), 한국가스공사, E1"}, {"r": "10", "h": "수요처", "p": "AI 데이터센터(하이퍼스케일러), 유틸리티, RE100 기업, 정부 계약시장", "co": "**마진 원천** 전력을 기다리는 시간의 기회비용이 커 높은 전력단가 수용(DC 운영비의 20~40%가 전력비)\n**국내** 삼성SDI(UPS·BBU), LS ELECTRIC(DC 배전) 등 공급사 관점에서 연결"}]}]}, {"h": "하위 섹터 10개 — 전원마다 속도·사이클·드라이버가 다르다", "blocks": [{"t": "grid", "items": [{"h": "태양광", "p": ["폴리실리콘→웨이퍼→셀→모듈→발전소로 이어지는 가장 빠른 전원(건설 약 18개월). 중국이 밸류체인 80~99%를 점유해 가격은 중국 공급이 정하고, 미국 시장은 규제로 분리돼 비중국 제품에 프리미엄이 붙는다. 기술은 PERC→TOPCon(현 주류)→페로브스카이트 탠덤(2027~2030 양산 목표)으로 이동 중이다."], "list": ["**드라이버** 중국 구조조정(폴리 가격), 미국 FEOC·AD/CVD·Section 232, 세액공제 일정, 국내 연 10GW 보급 목표", "**사이클** 공급과잉형 원자재 사이클. 2023~2025 폴리 가격 85% 이상 폭락 후 2026년 반내권 정책으로 바닥 다지기. 미국은 2026~2027 착공 러시 후 2028년 수요 공백 우려", "**국내** 한화솔루션, OCI홀딩스, HD현대에너지솔루션, 대주전자재료, 나노신소재, 엘케이켐"]}, {"h": "풍력", "p": ["육상은 저렴(LCOE $37~99/MWh)하고 해상은 단지당 1~2GW 규모지만 비싸고(LCOE $105~167) 금리에 가장 민감하다. 발주는 디벨로퍼 FID→터빈 OEM→타워·베어링(6~12개월 후행), 디벨로퍼 직접 발주인 하부구조물·케이블 순으로 번진다. 국내 기업은 기자재(타워·하부구조물·베어링·케이블) 중심이다."], "list": ["**드라이버** 금리·경매 상한가(CfD), 터빈 OEM 수주·ASP, 미국 세액공제 기한, 국내 해상풍력 인허가 전환율", "**사이클** 2022~2024 저가 경매·고금리로 이익 붕괴 → 2025~2026 터빈 ASP 30~50% 회복·영국 AR7로 재가격화 진행. 해상은 2027~28 하부구조물 공백 후 회복 전망", "**국내** 씨에스윈드, SK오션플랜트, 씨에스베어링, 유니슨, 두산에너빌리티, 세아제강지주"]}, {"h": "ESS·배터리 저장", "p": ["배터리 셀·PCS·BMS·EMS를 컨테이너로 통합한 전력 저장 설비. 재생에너지 간헐성 보완(분~시간), 계통 대체, AI 데이터센터 부하 완충의 세 수요가 겹친다. 미국은 관세·PFE로 중국산 LFP의 가격 우위가 사라져 현지 생산 한국 셀·부품사의 기회가 커졌다."], "list": ["**드라이버** 미국 48E ITC와 MACR(2026 55%→2030 75%), 관세, AMPC, 국내 중앙계약시장 입찰 물량, 데이터센터 BTM 수요", "**사이클** EV 부진을 ESS가 대체하는 전환기. 2025~2027 미국 적격 셀 부족, 2028년 전후 수급 균형 여부가 관건", "**국내** LG에너지솔루션, 삼성SDI, SK이노베이션(SK온), 엘앤에프, 서진시스템, 한중엔시에스, 신성에스티"]}, {"h": "연료전지·수소", "p": ["연료를 태우지 않고 전기화학 반응으로 발전하는 설비. 국내는 수소발전 입찰시장(연 160~180MW)에 의존하는 PAFC 중심이고, 미국은 SOFC가 AI 데이터센터 온사이트 전원으로 급부상했다(Oracle 2.5~2.8GW 등)."], "list": ["**드라이버** OBBBA 연료 무관 30% ITC, 가스터빈 공급 병목, 국내 일반·청정수소 입찰 물량", "**사이클** 글로벌(데이터센터 호황)과 국내(입찰 축소·청정수소 입찰 취소)의 비대칭", "**국내** 두산퓨얼셀, 에스퓨얼셀, 범한퓨얼셀, SK이터닉스(Bloom 총판), 비나텍(슈퍼캡)"]}, {"h": "온사이트(BTM) 발전", "p": ["계량기 뒤, 즉 데이터센터 부지 안에서 가스터빈·연료전지·태양광+ESS로 직접 전력을 만드는 방식. 미국 계통 접속 대기(3~7년)와 전력 품질 요구(전압 ±1~2%, 순간정전 20ms 미만)가 키웠다."], "list": ["**드라이버** 계통 대기 기간, FERC Co-location·Large Load 규칙, 가스터빈 리드타임, NERC 신뢰도 표준", "**사이클** 2025말~2028 BTM 선행, 2028년 이후 Order 2023 효과로 FTM(계통 연결) 신규 발전원 추가", "**국내** 두산에너빌리티(가스터빈), 산일전기(특수변압기), LS ELECTRIC(배전·DC), SK가스(연료)"]}, {"h": "해저케이블·계통연계", "p": ["해상풍력 전력을 육지로 보내는 인터어레이·수출 케이블과 장거리 HVDC. 525kV 이상 HVDC 상용화 업체는 세계 5개사, 포설선(CLV)은 약 20척에 불과한 과점·병목 시장이다."], "list": ["**드라이버** 해상풍력 FID, 국가 간 인터커넥터·HVDC(서해안 에너지고속도로 8GW), 포설선 가용성", "**사이클** 풍력 부진에도 전력망 투자로 견조. 수출·HVDC 케이블은 COD 3~5년 전 슬롯 확보로 선행 발주", "**국내** LS(LS전선), 대한전선, LS마린솔루션, LS에코에너지, 가온전선"]}, {"h": "LNG·가스 밸류체인", "p": ["가스전→액화→LNG선→재기화→발전·산업으로 이어진다. 미국 LNG는 Henry Hub에 연동돼 싸고 목적지 제약이 없어, 호르무즈 봉쇄·카타르 설비 피해로 아시아·유럽 가격이 치솟자 차익거래 가치가 커졌다. 가스는 BTM 전원과 재생에너지 백업의 핵심 연료다."], "list": ["**드라이버** JKM·TTF-HH 스프레드, 카타르 복구 속도, EU 저장률, 파나마 운하, 겨울 기온(엘니뇨)", "**사이클** 2026.3 호르무즈 봉쇄 후 공급 부족 장기화(IEA 2026~2030 누적 120~140bcm 손실). 온난 겨울·운하 정상화가 하방 변수", "**국내** 포스코인터내셔널, SK가스, SK이노베이션(E&S), 한국가스공사, 삼성중공업(FLNG)"]}, {"h": "바이오연료·팜유", "p": ["팜유는 식용(저변)-정책 연료(바이오디젤 의무혼합, 하단)-올레오케미칼·SAF(성장)의 3층 수요를 가진 원자재로 변했다. 인니 B40→B50이 수출 물량을 흡수하고, 재식재 시차·EUDR 추적성 규제가 공급 상단을 닫는다."], "list": ["**드라이버** 인니 B50 시행 속도, CPO-가스오일 스프레드, 타 식물유 스프레드, 재식재 사이클, EUDR", "**사이클** 2027~2032 대규모 재식재로 연 300~500만톤 공급 감소 가능성. 과거 2011~2015 재식재기 가격 $1,250/톤 상회", "**국내** 포스코인터내셔널, LX인터내셔널"]}, {"h": "재생에너지 개발·IPP", "p": ["디벨로퍼는 부지·인허가·계통 연결을 마친 프로젝트를 팔아 개발이익을, IPP는 발전소를 운영하며 PPA로 반복 매출을 얻는다. 미국은 PPA 가격이 5년간 2배 이상 올라 P·Q·C가 동시에 우호적이고, 국내는 RPS 폐지·계약시장 전환으로 장기 고정가 구조가 생긴다."], "list": ["**드라이버** PPA 가격, 계통 연결권, 금리, 국내 경쟁입찰 상한가 vs PPA 단가(170~180원/kWh)", "**사이클** 개발 완료 부지 희소성으로 디벨로퍼 양극화·M&A(Alphabet-Intersect, Brookfield-Neoen)", "**국내** SK이터닉스, OCI홀딩스(OCI Energy), 삼성물산, SGC에너지"]}, {"h": "우주 에너지", "p": ["궤도 데이터센터·달 기지용 전력(초경량 태양전지, 소형 원자로). 척도가 kWh/㎡에서 Compute per kilogram으로 바뀌어 HJT·페로브스카이트 탠덤과 저온 페이스트 수요를 만든다. 발사비 하락에 연동된 장기 옵션이다."], "list": ["**드라이버** LEO 발사비($2,700/kg→목표 $100 미만), NASA 예산(FSP 2030년 100kWe), SpaceX 태양광 증설 계획", "**사이클** 테마 초기 단계로 실적보다 기대가 선행. 2027~2028 실증(Suncatcher, 핵추진선)이 이정표", "**국내** OCI홀딩스(폴리), 대주전자재료·동진세미켐(페이스트), 한화솔루션(탠덤 플랫폼)"]}], "cols": 2}], "note": "같은 \"재생에너지\"로 묶여도 태양광은 18개월, 해상풍력은 7~11년이 걸린다. 사이클의 위치와 드라이버가 달라 같은 날 같은 뉴스에 반대로 움직이기도 한다."}, {"h": "전원별 속도가 곧 투자 순서다", "blocks": [{"t": "table", "cols": ["전원", "건설기간", "출력 특성", "CO2(g/kWh)", "상태·제약"], "rows": [["유틸리티 태양광", "약 18개월(1~4년)", "변동", "0", "즉시 가능, ESS 결합 필요"], ["육상풍력", "건설 1년 미만, 계통 포함 2~5년", "변동", "0", "적지·계통 대기"], ["해상풍력", "건설 2~4년, 전체 개발 7~11년", "변동", "0", "금리·PF에 민감"], ["가스복합(CCGT)", "2~4년(터빈 대기 시 5~7년)", "제어 가능", "390", "터빈 백로그 80GW, 슬롯 2030년까지 매진"], ["가스터빈(OCGT)", "1~3년", "제어 가능", "620", "LCOE 약 $220/MWh"], ["원전 재가동", "2~5년", "제어 가능", "0", "미국 1.5GW 전량 계약 완료"], ["원전 신규", "5~15년", "제어 가능", "0", "Vogtle 이후 신규 계획 제한"], ["SMR", "상용화 전", "제어 가능", "0", "2030년 전후 목표, HALEU 병목"], ["계통 연결", "3~7년", "-", "미국 약 350", "IR→COD 평균 61개월"]], "note": "IEA·LBNL·업계 종합. 전력이 급한 수요처는 LCOE보다 \"언제 켤 수 있나\"로 전원을 고른다."}, {"t": "callout", "text": "태양광+ESS(18개월) → 가스터빈(대기 4~7년) → 원전 재가동(2~5년) → 신규 원전·SMR(5~15년) 순으로 공급이 붙는다. 2025~2027 수요 집중이 태양광·ESS·연료전지에 먼저 오고, 계통·가스터빈 병목이 풀리는 2028년 이후 FTM 설비로 번지는 이유다.", "title": "읽는 법"}]}, {"h": "이 도구의 사용법", "blocks": [{"t": "grid", "items": [{"h": "처음 배울 때 순서", "p": ["01 산업 지도에서 전원별 속도와 밸류체인을 잡고, 02 기술 백과의 도식으로 폴리→셀→모듈, 셀→랙→PCS, 모노파일·자켓 같은 구조를 눈에 익힌다. 03 경제성 읽기에서 **LCOE·IRR·세액공제가 이익에 들어가는 길**을, 04 전력 수요·계통에서 **BTM·대기열·출력제어**를 이해한 뒤 05 보조금·정책 지도로 넘어가면 2025~2026 시장의 공통 논리가 한 번에 보인다. 06 딥다이브는 그다음에 주제별로 골라 읽는다."]}, {"h": "딜 검토할 때", "p": ["12 체크포인트의 **기업 유형별 5분 스캔**으로 시작해 공급망·원산지(PFE)와 보조금 의존도 항목을 먼저 돌린다. 이 섹터 이익의 상당 부분은 정책(AMPC·ITC·계약시장 고정가)에서 나오므로 10 정책 워치로 일몰 일정을 확인하고, 11 밸류에이션에서 제조(PER)·기자재(OEM 대비 할인)·발전 자산(P/FFO) 중 틀을 고른 뒤 09 수주 트래커와 13 유니버스에서 피어와 레퍼런스 딜을 찾는다."]}, {"h": "숫자를 인용하기 전에", "p": ["태그를 본다. **확인**은 실적·공시·실측, **추정**은 기관 전망이나 업계 가정, **미확인**은 자료 간 불일치다. 폴리실리콘 가격(조사기관별 방향이 반대), 중국산 ESS 대미 관세(38.4~82.4%), 국내 해상풍력 허가 물량(30.5~35.6GW), 글로벌 풍력 설치량(BNEF vs GWEC)은 반드시 출처·시점을 병기한다. 16 출처·데이터 품질 탭의 수치 상충표를 먼저 확인한다."]}, {"h": "이 자료의 한계", "p": ["근거는 2025.10~2026.09 국내외 산업 분석 자료·통계·기업 공시다(전력인프라·원전·정유화학 데스크와 겹치는 주제 포함). 자료 시점이 호르무즈 봉쇄(2026.3) 전후로 갈려 유가·LNG 가정이 크게 다르고, 대부분 업황 우호 톤이라 **낙관 편향**이 있다. 기업 수치는 공시·가이던스 기준이라 원문 대조가 필요하며, 개별 기업의 가격 판단·매매 의견은 다루지 않는다."]}], "cols": 2}]}]}, "tech": {"title": "기술 백과", "h2": "에너지전환 기술 백과", "en": "Technology Encyclopedia", "lede": "같은 \"재생에너지\"라도 태양광은 반도체 공정, 풍력은 중공업, ESS는 배터리 조립, 연료전지는 전기화학, LNG는 원자재 물류다. **기술 구조를 알아야 어느 단계에 병목과 마진이 있는지, 규제가 어디를 겨누는지** 읽을 수 있다. 각 절의 도식으로 구조를 잡고, 맨 아래 사전에서 40개 품목을 검색한다.", "sections": [{"h": "① 태양광 — 폴리에서 모듈까지, 중국이 전 단계를 쥐고 있다", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 312\" role=\"img\" aria-label=\"태양광 밸류체인 전 단계를 중국이 86~100% 쥐고 있어 비중국 프리미엄은 공급이 없는 상류에서 가장 크다\"><defs><marker id=\"a-tr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"30\" y=\"34\" width=\"150\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"105\" y=\"58\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">폴리실리콘<\/text><text x=\"105\" y=\"74\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">메탈실리콘 6N 정제<\/text><rect x=\"216\" y=\"34\" width=\"150\" height=\"56\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke \">셀<\/text><line x1=\"740\" y1=\"62\" x2=\"772\" y2=\"62\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-end=\"url(#a-tr2)\"/><text x=\"756\" y=\"28\" font-size=\"10\" text-anchor=\"middle\" fill-opacity=\".8\">모듈<\/text><text x=\"30\" y=\"120\" font-size=\"11\" fill-opacity=\".75\">세계 Top10 중 중국 기업 비중 (2024, 한국수출입은행)<\/text><rect x=\"30\" y=\"128\" width=\"150\" height=\"14\" rx=\"3\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><rect x=\"30.0\" y=\"128.0\" width=\"144.0\" height=\"14.0\" style=\"fill:var(--alert)\" fill-opacity=\".75\"/><text x=\"105\" y=\"158\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">96%<\/text><rect x=\"216\" y=\"128\" width=\"150\" height=\"14\" rx=\"3\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><rect x=\"216.0\" y=\"128.0\" width=\"148.5\" height=\"14.0\" style=\"fill:var(--alert)\" fill-opacity=\".75\"/><text x=\"291\" y=\"158\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">99%<\/text><rect x=\"402\" y=\"128\" width=\"150\" height=\"14\" rx=\"3\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><rect x=\"402.0\" y=\"128.0\" width=\"150.0\" height=\"14.0\" style=\"fill:var(--alert)\" fill-opacity=\".75\"/><text x=\"477\" y=\"158\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">100%<\/text><rect x=\"588\" y=\"128\" width=\"150\" height=\"14\" rx=\"3\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><rect x=\"588.0\" y=\"128.0\" width=\"129.0\" height=\"14.0\" style=\"fill:var(--alert)\" fill-opacity=\".75\"/><text x=\"663\" y=\"158\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--alert)\">86%<\/text><text x=\"849\" y=\"158\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".7\">해당 idth=\"150\" height=\"30\" rx=\"15\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"663\" y=\"286\" font-size=\"11\" text-anchor=\"middle\">한화·HD현대에너지<\/text><rect x=\"774\" y=\"266\" width=\"150\" height=\"30\" rx=\"15\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"849\" y=\"286\" font-size=\"11\" text-anchor=\"middle\">OCI Energy·SK이터닉스<\/text><\/svg>", "cap": "폴리실리콘→잉곳·웨이퍼→셀→모듈 전 단계에서 세계 상위 10개사 중 중국 기업 비중이 86~100%다(2024, 한국수출입은행). 그래서 세계 가격은 중국 공급이 정하고, 규제로 분리된 미국 시장의 **비중국 프리미엄은 비중국 공급이 거의 없는 상류(폴리·웨이퍼·셀)에서 가장 크게** 생긴다. 모듈만 미국에서 조립해서는 프리미엄을 다 받지 못하는 이유다."}, {"t": "p", "text": "태양광 원가 사슬은 **폴리(와트당 약 2.1g) → 잉곳·웨이퍼 → 셀 → 모듈**로 내려간다. 모듈이 밸류체인 시장가치의 약 45%, 유틸리티급 CAPEX의 약 29%를 차지하지만, 규제가 겨누는 것은 원산지 추적이 어려운 폴리·웨이퍼다. 비중국 태양광용 폴리 생산자는 Hemlock·Wacker·OCI 3곳(합산 약 34GW, 글로벌 설비의 2%)뿐이다."}, {"t": "figure", "svg": "<svg viewBox=\"0 0 960 350\" role=\"img\" aria-label=\"셀 기술은 실리콘 위에 층을 더하는 방향으로 진화하며 탠덤은 대체가 아니라 적층이다\"><defs><marker id=\"a-tr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><text x=\"120\" y=\"30\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"600\">PERC<\/text><rect x=\"30\" y=\"44\" width=\"180\" height=\"16\" rx=\"2\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"120\" y=\"56\" font-size=\"10.5\" text-anchor=\"middle\">전면 전극(Ag)<\/text><rect x=\"30\" y=\"60\" width=\"180\" height=\"18\" rx=\"2\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"120\" y=\"73\" font-size=\"11\" text-anchor=\"middle\">N+ 에미터<\/text><rect x=\"30\" y=\"78\" width=\"180\" height=\"66\" rx=\"2\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"120\" y=\"115\" font iddle\" fill-opacity=\".85\">기존 실리콘 위에 적층<\/text><text x=\"120\" y=\"224\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".85\">TOPCon 대비 −3~4%p<\/text><text x=\"350\" y=\"224\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".85\">탠덤 하부 셀 1순위<\/text><text x=\"580\" y=\"224\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".85\">BC는 전극을 후면에만<\/text><text x=\"810\" y=\"224\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".85\">단파장 위 · 장파장 아래<\/text><text x=\"350\" y=\"254\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">양산 26%+<\/text><text x=\"350\" y=\"272\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".75\"><\/text><text x=\"580\" y=\"254\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">28.13% (BC 기록)<\/text><text x=\"580\" y=\"272\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".75\">LONGi HIBC, 2026.4<\/text><text x=\"810\" y=\"254\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\" style=\"fill:var(--accent)\">34.85% (셀 기록)<\/text><text x=\"810\" y=\"272\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".75\">M10 상용 28.6% (한화)<\/text><line x1=\"30\" y1=\"296\" x2=\"930\" y2=\"296\" stroke=\"currentColor\" stroke-opacity=\".8\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\" style=\"stroke:var(--warn)\"/><text x=\"480\" y=\"318\" font-size=\"11.5\" text-anchor=\"middle\" style=\"fill:var(--warn)\">실리콘 단일접합 실효 한계 약 29.4% — BC·HJT 기록이 이미 28%대라 다음 효율 계단은 적층(탠덤)에서 나온다<\/text><text x=\"480\" y=\"338\" font-size=\"10.5\" text-anchor=\"middle\" fill-opacity=\".75\">공정 난이도: TOPCon은 기존 라인 개조, HJT는 저온 신규 장비(중국 1개사 약 70%), 탠덤은 대면적 균일도·장기 열화가 관문<\/text><\/svg>", "cap": "셀 기술은 실리콘 웨이퍼 위에 층을 더하는 방향으로 진화했다. TOPCon은 PERC 라인을 개조해 주류가 됐고, HJT·BC는 기록 효율이 이미 28%대로 **실리콘 단일접합 실효 한계(약 29.4%)에 근접**했다. 다음 효율 계단은 페로브스카이트를 위에 쌓는 탠덤이며, 대체가 아니라 적층이므로 **TOPCon·HJT 하부 셀과 대면적 양산 경험을 가진 실리콘 강자가 1차 수혜**라는 논리가 나온다."}, {"t": "table", "cols": ["기술", "구조 요점", "효율 좌표", "공정·장비", "국내 연결"], "rows": [["PERC", "P형 웨이퍼 + 후면 패시베이션", "TOPCon 대비 3~4%p 낮음", "이전 세대 주류", "대부분 전환 완료"], ["TOPCon", "N형 + 1~2nm 터널 산화막 + 도핑 폴리", "26% 이상(양산)", "PERC 라인 개조(LPCVD), 은 사용량 증가", "한화(Q.TRON), HD현대에너지솔루션(2025.5 전량 전환)"], ["HJT", "결정질 위 비정질 Si 박막 이종접합", "고효율, 우주용 적합", "200℃ 미만 저온 공정, 장비 중국 1개사 약 70%", "대주전자재료(저온 Ag-Cu 페이스트)"], ["BC", "전극을 후면에만 배치", "LONGi HIBC 28.13%, Trina THBC 28.0%(2026.4)", "후면 패터닝", "중국 기술 격차 확대 사례"], ["페로브스카이트 탠덤", "실리콘 하부 셀 + 밴드갭 1.6~1.7eV 상부 셀", "셀 34.85%(LONGi, NREL) · M10 28.6%(한화, Fraunhofer)", "증착·ALD·TCO·레이저, 공정 표준 미정", "한화솔루션 파일럿(2026), 선익·주성·아바코·필옵틱스, 엘케이켐·덕산네오룩스"], ["CdTe 박막", "유리 기판에 CdTe 증착", "결정질보다 낮음, 가격 약 2배", "미국 내 일관 생산", "First Solar(비교군)"]], "title": "태양전지 기술 비교", "note": "업계 종합. 실리콘 단일접합 실효 한계는 약 29.4%(학술), 상용 고효율 모듈 효율 22~24%(ITRPV, 2026)."}, {"t": "table", "cols": ["단계", "잔여 리스크", "확인할 체크포인트"], "rows": [["효율 검증", "장기 안정성·모듈화·양산성", "대면적 셀 효율, 독립기관 인증"], ["표준 시험 통과", "25년 보증·현장 데이터 부족", "UV/TC/HF/DH 시험 범위"], ["실증 진입", "지역별 열화율 분산", "설치 지역, 12개월 성능, 초기 열화율"], ["상업 초기", "보증비·보험료·수율", "수율, 모듈 출력, 보증 조건, 고객군"], ["금융 가능성 상승", "프로젝트별 리스크 프리미엄", "보험 인수, lender list, PPA 적용 사례"], ["Bankable 제품", "잔여 제조 품질 리스크", "대형 프로젝트 반복 채택, 보증 충당금 안정화"]], "title": "탠덤이 시장을 여는 순서 — 효율이 아니라 금융", "note": "Qcells·NREL. 효율 기록은 첫 관문일 뿐, 보험·PF 편입이 실제 수요를 연다."}]}, {"h": "② 풍력 — 누가 발주하느냐가 실적 시점을 정한다", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 920 400\" role=\"img\" aria-label=\"터빈·타워·베어링은 OEM 발주 사슬, 하부구조물·케이블은 디벨로퍼 직접 발주 사슬을 탄다\"><defs><marker id=\"a-tr4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><line x1=\"20\" y1=\"250\" x2=\"360\" y2=\"250\" stroke=\"currentColor\" stroke-opacity=\".35\" stroke-width=\"1.2\"/><text x=\"24\" y=\"244\" font-size=\"10\" fill-opacity=\".6\">해수면<\/text><line x1=\"20\" y1=\"322\" x2=\"360\" y2=\"322\" stroke=\"currentColo 336\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\"/><text x=\"810\" y=\"60\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">부유식<\/text><text x=\"505\" y=\"300\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".8\">얕은 바다<\/text><text x=\"660\" y=\"330\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".8\">깊은 바다<\/text><text x=\"810\" y=\"364\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".8\">심해 · 계류선<\/text><text x=\"420\" y=\"380\" font-size=\"11\" font-weight=\"600\" style=\"fill:var(--accent)\">디벨로퍼가 직접 발주<\/text><text x=\"536\" y=\"380\" font-size=\"11\" fill-opacity=\".85\">→ 하부구조물은 FID 후, 해저케이블은 COD 3~5년 전 슬롯<\/text><\/svg>", "cap": "풍력 밸류체인은 발주 사슬이 둘이다. **터빈 OEM이 발주하는 타워·베어링**은 OEM 수주 6~12개월 뒤에 실적이 움직이고, **디벨로퍼가 직접 발주하는 하부구조물·해저케이블**은 FID와 COD 일정에 묶인다. 수심이 깊어질수록 모노파일→자켓→부유식으로 구조물이 무거워지고 야드·설치선이 진입장벽이 된다."}, {"t": "table", "cols": ["밸류체인", "발주자", "발주 시점", "실적 반영"], "rows": [["터빈 OEM", "디벨로퍼", "FID 전 조건부, 주로 FID 이후", "가장 빠름"], ["타워·베어링", "터빈 OEM", "OEM 수주 후", "터빈 대비 6~12개월 후행(타워 12~18개월)"], ["하부구조물", "디벨로퍼·EPCI", "FID·터빈 선정 후", "프로젝트별 상이, 진행률 인식"], ["해저케이블", "디벨로퍼·TSO", "COD 3~5년 전", "비교적 선행"], ["설치", "디벨로퍼·EPCI", "제작계약 이후", "프로젝트별"], ["O&M", "운영사업자", "COD 이후", "반복 매출"]], "title": "풍력 밸류체인별 발주 구조", "note": "업계 자료 정리"}, {"t": "table", "cols": ["구분", "규모·특징", "LCOE(2025, Lazard)", "기초·구조물", "국내 연결"], "rows": [["육상풍력", "2~6MW급, 건설 1년 미만(계통 포함 2~5년)", "$37~99/MWh", "콘크리트 기초·타워", "유니슨·두산에너빌리티(터빈), 씨에스윈드·동국S&C(타워), 씨에스베어링"], ["고정식 해상풍력", "15~20MW 터빈, 단지당 1~2GW, 전체 개발 7~11년", "$105~167/MWh", "모노파일(1기 1,000~2,500톤)·자켓", "SK오션플랜트·세아제강지주·씨에스윈드(Bladt), LS전선·대한전선"], ["부유식 해상풍력", "심해, 계류선으로 고정", "고정식보다 높음(공개 수치 없음)", "반잠수식 부유체", "반딧불이(750MW, 재검토) 등"]], "title": "육상·해상·부유식 비교", "note": "GW당 CAPEX: 고정식 해상 약 8.0조원, 육상 약 2.9조원(환율 1,450원, 업계 추정)."}, {"t": "p", "text": "해상풍력은 설치선도 병목이다. 케이블 포설선(CLV)은 전 세계 약 20척(건조 중 7척), 신조 1척 2~3억달러에 건조 2~3년이 걸리고, 15MW 이상 터빈을 설치할 WTIV는 선대 78→120척·오더북 48→14척(2023.2→2026.2, Clarksons)으로 신조 발주가 줄었다. 국내는 카보타지(선박법)로 외국 포설선 진입이 제한된다."}]}, {"h": "③ ESS — 셀이 원가의 절반, 원산지가 곧 보조금", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 330\" role=\"img\" aria-label=\"원가의 절반 이상이 셀이라 셀 원산지가 곧 미국 세액공제 적격성을 결정한다\"><defs><marker id=\"a-tr5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><rect x=\"35\" y=\"108\" width=\"120\" height=\"58\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1\" style=\"stroke:var(--accent)\"/><text x=\"95\" y=\"134\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">셀<\/text><text x=\"95\" y=\"148\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">LFP·NCA<\/text><rect x=\"189\" y=\"108\" width=\"120\" height=\"58\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"249\" y=\"134\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">모듈<\/text><text x=\"249\" y=\"148\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">셀 직·병렬<\/text><rect x=\"343\" y=\"108\" width=\"120\" height=\"58\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"403\" y=\"134\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">랙<\/text><text x=\"403\" y=\"148\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">BMS 감시<\/text><rect x=\"497\" y=\"108\" width=\"120\" height=\"58\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"557\" y=\"134\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">컨테이너<\/text><text x=\"557\" y=\"148\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">열관리·소화<\/text><rect x=\"651\" y=\"108\" width=\"120\" height=\"58\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"711\" y=\"134\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">PCS<\/text><text x=\"711\" y=\"148\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">DC↔AC 변환<\/text><rect x=\"805\" y=\"108\" width=\"120\" height=\"58\" rx=\"6\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"865\" y=\"134\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">변압기·계통<\/text><text x=\"865\" y=\"148\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">송배전 접속<\/text><line x1=\"157\" y1=\"137\" x2=\"187\" y2=\"137\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-start=\"url(#a-tr5)\" marker-end=\"url(#a-tr5)\"/><text x=\"172\" y=\"128\" font-size=\"10\" text-anchor=\"middle\" fill-opacity=\".8\">DC<\/text><line x1=\"311\" y1=\"137\" x2=\"341\" y2=\"137\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-start=\"url(#a-tr5)\" marker-end=\"url(#a-tr5)\"/><text x=\"326\" y=\"128\" font-size=\"10\" text-anchor=\"middle\" fill-opacity=\".8\">DC<\/text><line x1=\"465\" y1=\"137\" x2=\"495\" y2=\"137\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-start=\"url(#a-tr5)\" marker-end=\"url(#a-tr5)\"/><text x=\"480\" y=\"128\" font-size=\"10\" text-anchor=\"middle\" fill-opacity=\".8\">DC<\/text><line x1=\"619\" y1=\"137\" x2=\"649\" y2=\"137\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-start=\"url(#a-tr5)\" marker-end=\"url(#a-tr5)\"/><text x=\"634\" y=\"128\" font-size=\"10\" text-anchor=\"middle\" fill-opacity=\".8\">DC<\/text><line x1=\"773\" y1=\"137\" x2=\"803\" y2=\"137\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" marker-start=\"url(#a-tr5)\" marker-end=\"url(#a-tr5)\"/><text x=\"788\" y=\"128\" font-size=\"10\" text-anchor=\"middle\" fill-opacity=\".8\">AC<\/text><rect x=\"343\" y=\"22\" width=\"428\" height=\"44\" rx=\"6\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"557\" y=\"40\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">EMS (에너지관리시스템)<\/text><text x=\"557\" y=\"56\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".78\">충·방전 지령 · SOC 관리 · 시장 입찰<\/text><line x1=\"403\" y1=\"66\" x2=\"403\" y2=\"106\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\" marker-end=\"url(#a-tr5)\"/><line x1=\"711\" y1=\"66\" x2=\"711\" y2=\"106\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\" marker-end=\"url(#a-tr5)\"/><text x=\"35\" y=\"44\" font-size=\"11\" fill-opacity=\".75\">양방향: 충전 AC→DC<\/text><text x=\"35\" y=\"62\" font-size=\"11\" fill-opacity=\".75\">방전 DC→AC<\/text><text x=\"35\" y=\"204\" font-size=\"11\" fill-opacity=\".75\">계통형 BESS 원가 구성 (IRS 가이던스 인용)<\/text><rect x=\"35.0\" y=\"212.0\" width=\"462.8\" height=\"30.0\" style=\"fill:var(--accent)\" fill-opacity=\".42\"/><rect x=\"497.8\" y=\"212.0\" width=\"93.5\" height=\"30.0\" style=\"fill:var(--accent)\" fill-opacity=\".2\"/><rect x=\"591\" y=\"212\" width=\"334\" height=\"30\" rx=\"0\" fill=\"var(--sunken)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"266\" y=\"232\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\">셀 약 52%<\/text><text x=\"545\" y=\"232\" font-size=\"11\" text-anchor=\"middle\">모듈·랙<\/text><text x=\"758\" y=\"232\" font-size=\"11\" text-anchor=\"middle\">나머지 35~40% (PCS·인클로저·열관리·EPC)<\/text><text x=\"313\" y=\"258\" font-size=\"11\" text-anchor=\"middle\" fill-opacity=\".8\">└ 배터리 관련 합계 60~65% ┘<\/text><text x=\"35\" y=\"292\" font-size=\"12\" font-weight=\"600\" style=\"fill:var(--accent)\">AMPC $35/kWh<\/text><text x=\"140\" y=\"292\" font-size=\"11\">→ 미국에서 만든 셀·모듈에만<\/text><text x=\"480\" y=\"292\" font-size=\"12\" font-weight=\"600\" style=\"fill:var(--alert)\">48E ITC 30%<\/text><text x=\"562\" y=\"292\" font-size=\"11\">→ 시스템가 $250~300/kWh의 $75~90/kWh<\/text><text x=\"480\" y=\"314\" font-size=\"11\" style=\"fill:var(--alert)\">MACR(비중국 비율 55%→75%) 미달이면 통째로 상실<\/text><text x=\"35\" y=\"314\" font-size=\"11\" fill-opacity=\".8\">고객과 일부 공유 → 실질 셀 가격 하락<\/text><\/svg>", "cap": "ESS는 셀→모듈→랙→컨테이너→PCS→계통으로 조립되고 EMS가 충·방전을 지령한다. 원가의 약 52%가 셀, 배터리 관련 합계가 60~65%라 **셀 원산지가 미국 세액공제(48E ITC 30%) 적격성을 사실상 결정**한다. 중국산 셀이면 PFE 비중국 비율(2026년 55%→2030년 이후 75%)을 넘기 어렵고, 이때 잃는 ITC($75~90/kWh)가 셀 단가 차이보다 크다."}, {"t": "p", "text": "신규 ESS의 90% 이상이 리튬이온이고 그중 LFP가 80% 이상이다. 고밀도·장주기 ESS가 늘며 냉각은 공랭(셀 온도 편차 약 10도)에서 수냉(약 3도)으로 넘어갔고, 글로벌 BESS 평균 듀레이션은 1.8시간(2020)에서 2.4시간(2024, LDES Council)으로 길어졌다. 미국 턴키 BESS 가격은 $165/kWh(2024, BNEF, 전년 −40%), ESS 설비 비용은 $122/kWh(2025)다."}, {"t": "table", "cols": ["제품", "셀 용량", "에너지", "케미스트리", "비고"], "rows": [["SBB 1.0", "145Ah", "3.842MWh", "NCA", "기존 제품"], ["SBB 1.5", "145Ah", "5.26MWh", "NCA", "현 주력, 1차 중앙계약시장 공급"], ["SBB 1.7", "152Ah", "6.14MWh", "NCA", "2026.7 출시, 첫 북미 생산 제품"], ["SBB 2.0", "273Ah", "5.0MWh", "LFP", "2026.12 출시 예정"]], "title": "ESS 컨테이너 제품 예시 — 삼성SDI SBB 라인업", "note": "회사 자료. 같은 컨테이너에 더 많은 MWh를 넣는 것이 세대 교체의 방향이고, LFP 전환이 미국 적격 공급의 관건이다."}, {"t": "table", "cols": ["항목", "슈퍼커패시터(EDLC)", "하이브리드 커패시터(LiC)", "리튬이온 배터리(LiB)"], "rows": [["저장 메커니즘", "전극 표면 물리적 흡탈착", "물리 + 화학 결합", "전극 내부 화학 결합"], ["에너지 밀도(Wh/kg)", "3~5", "7~12", "20~150"], ["출력 밀도(kW/kg)", "2.0~3.0", "1.0~2.0", "0.05~0.3"], ["충방전 효율(%)", "90~95", "90~95", "70~85"], ["동작 온도(℃)", "-40~+85", "-20~+70", "-20~+45"], ["수명(cycle)", "500,000 이상", "20,000 이상", "500~2,000"]], "title": "에너지 저장 기술별 특성 — 배터리·슈퍼커패시터·LiC", "note": "비나텍. 슈퍼커패시터는 에너지는 적지만 출력과 수명이 압도적이라 AI 부하의 순간 변동을 흡수한다."}]}, {"h": "④ 연료전지 — 온도가 용도를 가른다", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 350\" role=\"img\" aria-label=\"SOFC는 고온에서 천연가스를 바로 개질해 직류를 만들며 효율이 가장 높다\"><defs><marker id=\"a-tr6\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-rever nchor=\"middle\">JKM 11월물<\/text><text x=\"770\" y=\"392\" font-size=\"10\" text-anchor=\"middle\" fill-opacity=\".7\">약 $28 (Platts)<\/text><line x1=\"210\" y1=\"332\" x2=\"250\" y2=\"332\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><line x1=\"350\" y1=\"307\" x2=\"390\" y2=\"307\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><line x1=\"490\" y1=\"274\" x2=\"530\" y2=\"274\" stroke=\"currentColor\" stroke-opacity=\".5\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><line x1=\"630\" y1=\"274\" x2=\"720\" y2=\"274\" stroke=\"currentColor\" stroke-opacity=\".6\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><path d=\"M860 154 H880 V274 H860\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".9\" stroke-width=\"1.4\" style=\"stroke:var(--accent)\"/><text x=\"886\" y=\"208\" font-size=\"11\" font-weight=\"600\" style=\"fill:var(--accent)\">차익<\/text><text x=\"886\" y=\"224\" font-size=\"11\" font-weight=\"600\" style=\"fill:var(--accent)\">≈ $16.6<\/text><\/svg>", "cap": "미국 LNG는 **Henry Hub×115% + 고정 액화수수료 + 운임**으로 값이 매겨지고 목적지 제약이 없다. 카타르 공백으로 JKM이 약 $28까지 오르자 직도입가(약 $11.4, 업계 추정)와의 차이가 약 $16.6/MMBtu로 벌어졌는데(2026.9), 장기계약은 액화수수료가 고정이라 **이 차익은 수출업체가 아니라 물량을 쥔 구매자·트레이더**에게 간다. 스팟 물량을 파는 수출업체는 암묵적 액화수수료가 $6 이상(Venture Global 2Q26 $6.45)으로 뛰었다."}, {"t": "table", "cols": ["항목", "내용", "수준·시점"], "rows": [["Henry Hub", "미국 허브, 수출가 기준(115%×HH+수수료+운임)", "$2.9(2026.9)"], ["JKM", "동북아 현물(Platts)", "약 $28(2026.9), 러-우기 최고 반기평균 $39"], ["TTF", "유럽 허브, 저장 재고가 좌우", "약 €83/MWh(2026.9)"], ["한국 도입국 비중", "호주 32%·말레이 16%·카타르 15%·미국 9%(연간)", "2026 1~8월 카타르 5.8%, 미국 15.1%"], ["한국 수입 구성", "가스공사 3,428만톤 / 직도입 1,244만톤", "2025"]], "title": "LNG 가격 벤치마크와 국내 도입 구조", "note": "S&P Global Platts, KITA, 민간LNG산업협회"}]}, {"h": "⑥ 바이오연료 — 팜유는 식용·정책연료·SAF의 3층 수요", "blocks": [{"t": "p", "text": "팜유는 FFB(팜 열매) 1톤에서 CPO 약 200kg이 나온다(OER 약 20%). ha당 오일 생산성이 3.5~4톤으로 해바라기(0.7~1톤)의 4배라 식용 저변이 넓고, 인니 바이오디젤 의무혼합(B40→B50, 필요량 +450만KL)이 정책 연료로 하단을 받치며, 폐식용유 공급이 약 1,200만톤에서 포화되면 PFAD 같은 팜 정제 부산물이 SAF(HEFA) 원료의 부족분(1,000~2,000만톤, 2034E)을 메울 것으로 추정된다."}, {"t": "table", "cols": ["요인", "메커니즘", "관측 지표"], "rows": [["생산국 편중", "인니·말레이 83%, 동일 기후권 동시 충격", "월별 생산·재고"], ["재식재 시차", "초기 7년 무수익, 만재까지 8~10년", "평균 수령, 20년 이상 비중"], ["노동 병목", "수확 지연 → 과숙·낙과 → OER 하락", "외국인 쿼터, 수확 간격"], ["기후", "라니냐 과습·침수로 수확·물류 차질", "월간 생산, OER"], ["병해충", "봉지벌레 잎 피해, 가노더마 줄기썩음", "감염률, 1~2년 후 수율"], ["토지 경쟁", "데이터센터·산단과 토지 기회비용 경쟁", "신규 개간 인허가"]], "title": "팜유 공급 제약 요인", "note": "업계 자료 정리"}]}, {"h": "제품·기술 사전 — 40개 품목", "blocks": [{"t": "dict", "items": [{"name": "폴리실리콘", "en": "Polysilicon", "group": "태양광", "lede": "메탈실리콘을 6N 이상 고순도로 정제한 태양전지의 출발 원료다. 설비가 크고 전력 소모가 많은 장치산업이라 소수 대형사가 공급하며, 2026년 수요 기준 와트당 약 2.1g이 쓰인다. 중국이 설비의 90% 이상을 보유하고 비중국 태양광용 생산자는 Hemlock·Wacker·OCI 3곳(합산 약 34GW, 글로벌의 2%)뿐이다.", "fields": [{"k": "밸류체인 위치", "v": "메탈실리콘 → 폴리실리콘 → 잉곳·웨이퍼 → 셀 → 모듈"}, {"k": "가격·수요 결정 변수", "v": "중국 구조조정(감산·VAT 환급 폐지), 미국 UFLPA·Section 232·PFE 요건, 신규 공장 건설 약 5년의 공급 경직성"}, {"k": "실사 체크", "v": "원재료(메탈실리콘)까지 원산지 추적이 되는가, 장기공급계약의 가격·기간·선급금 구조, 원가곡선상 위치(GCL 현금원가 $3.7/kg 수준과 비교)"}, {"k": "국내 기업", "v": "OCI홀딩스(말레이시아 OCI TerraSus 연 3.5만톤)"}]}, {"name": "웨이퍼(비중국)", "en": "Wafer", "group": "태양광", "lede": "폴리 잉곳을 얇게 잘라 만든 셀 기판이다. 비중국 시장에서도 중국계 점유율이 95%를 넘어 원산지 증빙이 가능한 웨이퍼 공급은 극히 제한적이다. 미국 셀 업체 중 웨이퍼를 보유한 곳은 미보유 업체 대비 최대 $0.05~0.06/W(모듈가의 약 20%) 원가 우위를 가진다는 분석이 있다.", "fields": [{"k": "밸류체인 위치", "v": "폴리 → 잉곳 → 웨이퍼 → 셀"}, {"k": "가격·수요 결정 변수", "v": "UFLPA·FEOC 규제 범위 확대, 비중국 장비 가격·납기"}, {"k": "실사 체크", "v": "웨이퍼 단계까지 비중국 조달 비율, 신규 라인 램프업 수율"}, {"k": "국내 기업", "v": "OCI홀딩스(베트남 Neo Silicon 2.7→5.4GW), 한화솔루션(카터스빌)"}]}, {"name": "TOPCon 셀", "en": "Tunnel Oxide Passivated Contact", "group": "태양광", "lede": "PERC 후면에 1~2nm 터널 산화막과 도핑 폴리실리콘 층을 더한 N형 셀로, 효율을 PERC 대비 3~4%p 높였다(26% 이상). 기존 PERC 라인을 전환해 만들 수 있어 설비 교체가 필요한 HJT보다 먼저 주류가 됐고, 현재 신규 증설의 대부분을 차지한다. 탠덤의 가장 현실적인 하부 셀이기도 하다.", "fields": [{"k": "밸류체인 위치", "v": "N형 웨이퍼 → TOPCon 셀 → 단독 모듈 또는 탠덤 하부 셀"}, {"k": "가격·수요 결정 변수", "v": "설치 기반·공급망 규모, LPCVD 장비 호환성, 은 페이스트 사용량"}, {"k": "실사 체크", "v": "셀 효율과 양산 수율, 미국 FEOC 규정상 Non-PFE 셀 여부"}, {"k": "국내 기업", "v": "한화솔루션(Q.TRON), HD현대에너지솔루션(2025.5 전량 TOPCon 전환), 신성이엔지"}]}, {"name": "HJT·BC 셀", "en": "Heterojunction / Back Contact", "group": "태양광", "lede": "HJT는 결정질 실리콘 위에 비정질 실리콘 박막을 쌓은 셀로 200℃ 미만 저온 공정이 필요하고, BC는 전극을 후면에만 배치해 전면 가림을 없앤 셀이다. 2026.4 LONGi HIBC 28.13%, Trina THBC 28.0%로 실리콘 셀 효율 신기록이 나왔다. HJT 장비는 중국 1개사(Suzhou Maxwell)가 약 70%를 점유한다.", "fields": [{"k": "밸류체인 위치", "v": "N형 웨이퍼 → 비정질 박막 증착(HJT) 또는 후면전극 패터닝(BC) → 셀"}, {"k": "가격·수요 결정 변수", "v": "고효율 수요, 우주 태양광, 중국 장비 수출 통제"}, {"k": "실사 체크", "v": "장비 조달처(중국 대미 수출 불허 리스크), 저온 페이스트 적용 여부"}, {"k": "국내 기업", "v": "대주전자재료(저온 Ag-Cu 페이스트)"}]}, {"name": "페로브스카이트-실리콘 탠덤", "en": "Perovskite-Silicon Tandem", "group": "태양광", "lede": "실리콘 하부 셀 위에 밴드갭 약 1.6~1.7eV의 페로브스카이트 상부 셀을 쌓아 단파장은 위에서, 장파장은 아래에서 흡수하는 구조다. 실리콘 단일접합 실효 한계(약 29.4%)를 넘어 이론 효율 40%대에 접근하며, 셀 최고 34.85%(LONGi, NREL 인증), 상용 M10 규격 28.6%(한화, Fraunhofer 인증)가 확인됐다. 대체가 아니라 적층이므로 기존 실리콘 강자가 1차 수혜라는 논리가 핵심이다.", "fields": [{"k": "밸류체인 위치", "v": "웨이퍼 → TOPCon/HJT 하부 셀 → 재결합층 → 페로브스카이트 흡수층 → ETL/HTL → TCO → 봉지 → 모듈"}, {"k": "가격·수요 결정 변수", "v": "대면적 균일도·수율, 장기 열화율, 보증 기간, 금융권의 Bankability 인정"}, {"k": "실사 체크", "v": "공개 효율이 소면적 연구 셀인가 상용 규격인가, 야외 실증 기간·기후대, 보증(Oxford PV 10년→20년 목표), 보험·PF 편입 여부"}, {"k": "국내 기업", "v": "한화솔루션(진천 파일럿 2026, 2027 상반기~2028 양산 목표)"}]}, {"name": "페로브스카이트 증착·공정 장비", "en": "Deposition / ALD / Sputter / Laser", "group": "태양광", "lede": "상부 흡수층 증착기(진공증착 또는 슬롯다이·잉크젯 용액공정), 하부-상부 셀 연결용 ALD/CVD, 투명전극(TCO) 스퍼터, 셀 직렬 연결용 레이저 스크라이빙 장비다. 공정 표준이 아직 정해지지 않아 어떤 방식에 노출됐는지가 리스크다. 사이클 초기에는 파일럿·데모 라인 발주로 장비 매출이 소재·모듈보다 먼저 나온다.", "fields": [{"k": "밸류체인 위치", "v": "파일럿 라인 → 데모 라인 → 양산 라인 장비 발주"}, {"k": "가격·수요 결정 변수", "v": "공정 표준 방향, 대면적화, 반복 수주 여부"}, {"k": "실사 체크", "v": "진공 vs 용액 중 노출 방향, 파일럿 수주가 양산 수주로 이어졌는가"}, {"k": "국내 기업", "v": "선익시스템, 주성엔지니어링, 아바코, 필옵틱스"}]}, {"name": "페로브스카이트 전구체·계면소재", "en": "Precursor / HTL / ETL / SAM", "group": "태양광", "lede": "PbI₂·FAI·CsI 등 페로브스카이트 염과 정공·전자수송층, 자기조립단분자(SAM) 계면소재다. 결정화 품질·효율·열화율을 동시에 결정하며, 고객 신뢰성 데이터와 보험 심사에 한번 들어가면 재검증 비용 때문에 교체가 어려워 락인 효과가 크다. OLED 유기소재 기술이 전이되는 영역이다.", "fields": [{"k": "밸류체인 위치", "v": "샘플 승인 → 신뢰성 시험 편입 → 양산 반복 투입"}, {"k": "가격·수요 결정 변수", "v": "고객 인증 편입, 양산 반복성"}, {"k": "실사 체크", "v": "고객 신뢰성 데이터에 해당 소재가 포함됐는가, 양산 라인 채택 여부"}, {"k": "국내 기업", "v": "엘케이켐, 덕산네오룩스, 피엔에이치테크, LG화학"}]}, {"name": "봉지재·배리어 필름", "en": "Encapsulant / Barrier Film", "group": "태양광", "lede": "수분·산소·UV·열 침투를 막아 모듈 장기 열화를 억제하는 소재다. 페로브스카이트는 수분 안정성이 최대 약점이라 배리어 성능이 곧 보증 기간과 Bankability를 좌우한다. 표준 습열시험은 85℃/85%RH 1,000시간이지만 공개된 페로브스카이트 장기 데이터는 이 수준에 머문다.", "fields": [{"k": "밸류체인 위치", "v": "모듈 라미네이션 공정 투입"}, {"k": "가격·수요 결정 변수", "v": "보증 기간 확대 요구, Bankability 기준"}, {"k": "실사 체크", "v": "수분투과율 사양, 고객 모듈 인증 편입 여부"}, {"k": "국내 기업", "v": "아이컴포넌트, 코오롱인더스트리"}]}, {"name": "전극 페이스트(Ag·Ag-Cu)", "en": "Metallization Paste", "group": "태양광", "lede": "셀에서 전류를 뽑아내는 금속 전극 재료로 셀 원가·효율을 좌우한다. HJT·탠덤은 저온 경화가 필요하고, 은 가격 부담을 줄이려 은 일부를 구리로 대체한 Ag-Cu 페이스트가 쓰인다. 태양광 1GW당 페이스트 약 12톤이 소요된다는 추정이 있고, TOPCon·HJT 전환으로 패널당 은 사용량이 20~50% 늘어 은 수요를 끌어올렸다.", "fields": [{"k": "밸류체인 위치", "v": "은·구리 분말 → 페이스트 → 셀 전극 인쇄·소성/경화"}, {"k": "가격·수요 결정 변수", "v": "HJT·탠덤 채택, 은 가격, 비중국 공급망 요구"}, {"k": "실사 체크", "v": "샘플 공급이 양산 수주로 전환됐는가, 은 가격 전가 구조"}, {"k": "국내 기업", "v": "대주전자재료, 동진세미켐"}]}, {"name": "TCO 타겟", "en": "Transparent Conductive Oxide Target", "group": "태양광", "lede": "빛을 통과시키면서 전기가 통하는 투명전극을 스퍼터링으로 형성할 때 쓰는 타겟 소재로 HJT·탠덤·박막에 필요하다. 중국 업체를 제외하면 공급처가 사실상 한정돼 미국 수출용 유럽·인도 패널사의 비중국 조달 수요가 생겼다.", "fields": [{"k": "밸류체인 위치", "v": "타겟 제조 → 스퍼터링 → 셀 투명전극"}, {"k": "가격·수요 결정 변수", "v": "HJT·탠덤 증설, 비중국 조달 요건"}, {"k": "실사 체크", "v": "캐파 증설 계획(연 120톤 검토), 고객 다변화"}, {"k": "국내 기업", "v": "나노신소재"}]}, {"name": "결정질 태양광 모듈", "en": "PV Module", "group": "태양광", "lede": "셀을 연결해 유리·봉지재·프레임으로 패키징한 최종 발전 제품으로 밸류체인 시장가치의 약 45%, 유틸리티급 CAPEX의 약 29%를 차지한다. 미국 가격은 수입산 $0.28, 미국산(수입셀) $0.36, 미국산(미국셀) $0.49/W의 3단 구조다(2026.3). 국내는 등급제·탄소인증으로 1~2등급 제품이 무등급 대비 약 40% 높은 ASP를 받는다.", "fields": [{"k": "밸류체인 위치", "v": "셀 → 모듈 → 발전소(BOS 연결)"}, {"k": "가격·수요 결정 변수", "v": "미국 규제·DCA 요건, 중국 FOB 바닥가, 국내 보급 목표·국산 인센티브"}, {"k": "실사 체크", "v": "ASP 가정이 '중국 FOB + 규제 프리미엄' 구조와 정합한가, AMPC 포함 이익 비중, 2028년 이후 판가 시나리오"}, {"k": "국내 기업", "v": "한화솔루션, HD현대에너지솔루션, OCI홀딩스(미국 모듈)"}]}, {"name": "CdTe 박막 모듈", "en": "Cadmium Telluride Thin-film", "group": "태양광", "lede": "결정질 실리콘 대신 카드뮴텔루라이드를 유리 기판에 증착한 모듈이다. 미국 내 일관 생산이 가능해 PFE 규정에서 자유롭고 DCA(국산 부품 가산) 요건을 충족하는 사실상 유일한 모듈로, 미국 유틸리티 프로젝트의 30% 이상이 CdTe 기반이다. 모듈 가격은 결정질의 약 2배지만 규제 적합성이 프리미엄이다.", "fields": [{"k": "밸류체인 위치", "v": "유리 기판 증착(미국 공장) → 모듈"}, {"k": "가격·수요 결정 변수", "v": "DCA 10% 가산, PFE 비해당, 착공 기한 단축"}, {"k": "실사 체크", "v": "수주 ASP 추이(4Q25 신규 $0.364/W vs 잔고 평균 $0.30)"}, {"k": "국내 기업", "v": "국내 직접 기업 없음(비교군 First Solar)"}]}, {"name": "태양광+ESS 하이브리드 발전소", "en": "Solar-plus-Storage", "group": "태양광", "lede": "태양광에 4시간 안팎의 배터리를 붙여 낮 잉여전력을 저녁 피크로 옮기는 발전 자산이다. CAISO 기준 계통이 인정하는 용량(ELCC)이 태양광 단독 7%에서 태양광+ESS 41%로 뛰고, LCOE는 $76/MWh로 신규 가스복합($79)을 하회한다는 분석이 있다. 미국 2026년 신규 발전 용량의 약 79%가 태양광+BESS로 채워질 전망이다.", "fields": [{"k": "밸류체인 위치", "v": "모듈·인버터 + 배터리 → EPC → PPA 판매"}, {"k": "가격·수요 결정 변수", "v": "ESS 비용($122/kWh, 2025), 가스 발전 병목, 계통 인정 용량 규칙"}, {"k": "실사 체크", "v": "PCS 배수(국내 0.7) 등 설계 기준, ESS 저장시간과 실효용량 인정"}, {"k": "국내 기업", "v": "OCI홀딩스(OCI Energy), SK이터닉스, 한화솔루션(EPC)"}]}, {"name": "풍력 터빈(나셀·블레이드)", "en": "Wind Turbine", "group": "풍력·해양", "lede": "바람의 운동에너지를 전기로 바꾸는 핵심 설비로 육상 설치비의 절반 이상을 차지한다. 서구권 4대 OEM(Vestas·Siemens Gamesa·GE Vernova·Nordex)이 과점하며, 2022년 저점 대비 ASP가 30~50% 회복돼 Vestas·Nordex는 두 자릿수 마진을 되찾았다. 해상은 15~20MW로 대형화가 진행 중이다.", "fields": [{"k": "밸류체인 위치", "v": "베어링·기어박스 등 부품 → 나셀·블레이드 → 터빈 OEM → 디벨로퍼"}, {"k": "가격·수요 결정 변수", "v": "ASP 정상화, 저마진 잔고 소진, 리파워링, 중국 OEM 해외 진출"}, {"k": "실사 체크", "v": "OEM의 지역별 수주·book-to-bill, 국내 터빈 생산능력(0.8→3.0GW 목표)"}, {"k": "국내 기업", "v": "두산에너빌리티, 유니슨"}]}, {"name": "풍력 타워", "en": "Wind Tower", "group": "풍력·해양", "lede": "나셀과 블레이드를 받치는 대형 강관 구조물이다. 부피·중량이 커 장거리 운송이 어렵기 때문에 소비지 현지 생산이 필수이고, 계약은 사양 확정 전 공장 슬롯을 선점하는 Capa Reservation 방식으로 바뀌었다. 후판·운송비는 대체로 발주처에 전가되어 마진은 원자재보다 가동률이 좌우한다.", "fields": [{"k": "밸류체인 위치", "v": "후판 → 절단·용접 → 타워 섹션 → 터빈 OEM 납품(인도 기준 매출)"}, {"k": "가격·수요 결정 변수", "v": "터빈 OEM 수주(12~18개월 후 타워 발주), 미국 AMPC, 유럽 육상·해상 회복"}, {"k": "실사 체크", "v": "미국 비중과 AMPC(2027년 말 종료) 이후 수익성, 원가 전가 조항, 미국 경쟁사 철수(Broadwind)·축소(Arcosa) 효과"}, {"k": "국내 기업", "v": "씨에스윈드, 동국S&C"}]}, {"name": "해상풍력 하부구조물", "en": "Monopile / Jacket / Floater", "group": "풍력·해양", "lede": "해상 터빈과 해상변전소를 해저에 고정하거나 띄우는 구조물이다. 얕은 바다는 모노파일(1기 1,000~2,500톤), 깊은 바다는 자켓, 심해는 부유체를 쓴다. 해역별 맞춤 설계가 필요하고 초대형 야드가 진입장벽이며, 디벨로퍼가 별도 계약해 진행률 기준으로 매출을 인식한다. 국내 자켓 시장은 GW당 약 8,000억원으로 추정된다.", "fields": [{"k": "밸류체인 위치", "v": "후육강관 → 모노파일/자켓 제작 → 해상 운송 → EPCI 설치"}, {"k": "가격·수요 결정 변수", "v": "FID 이후 제작 슬롯, 현지조달 요구(대만 LCR 폐지·Jones Act), 2027~28 발주 공백 후 2029 타이트 전망"}, {"k": "실사 체크", "v": "수주잔고 중 FID 확정분 비율, 야드 캐파(연 50→70기 등), 지배구조(매각) 이슈"}, {"k": "국내 기업", "v": "SK오션플랜트, 씨에스윈드(Bladt), 세아제강지주(세아윈드)"}]}, {"name": "풍력 베어링", "en": "Pitch / Yaw / Main Bearing", "group": "풍력·해양", "lede": "블레이드 피치·나셀 요 회전과 메인샤프트를 지지하는 대형 베어링이다. 2~3MW 육상용이 주력이고 5~6MW·해상용으로 확대 중이며, 터빈사 퀄 승인이 진입장벽이다. OEM 수주에 6~12개월 후행하고 고정비 비중이 커 가동률이 이익률을 결정한다.", "fields": [{"k": "밸류체인 위치", "v": "소재 → 단조·가공 → 열처리 → 터빈 OEM 퀄 승인 → 납품"}, {"k": "가격·수요 결정 변수", "v": "OEM 수주, 고객 다변화(GE 의존도 80%대)"}, {"k": "실사 체크", "v": "신규 고객 퀄 일정(Vestas 2027, Enercon·Nordex 2028), 가동률 95% 도달 시 증설 여부"}, {"k": "국내 기업", "v": "씨에스베어링, 우림피티에스"}]}, {"name": "해저케이블(인터어레이·수출·HVDC)", "en": "Subsea Cable", "group": "풍력·해양", "lede": "해상 발전단지 내부를 잇는 인터어레이, 육지로 보내는 수출 케이블, 장거리 대용량 초고압직류(HVDC)로 나뉜다. 525kV 이상 HVDC 상용화 업체는 Prysmian·NKT·Nexans·LS전선·Sumitomo 5개사이고, 상위 4사가 85%를 점유한다. 수출·HVDC는 COD 3~5년 전 슬롯을 확보해 발주가 풍력보다 선행한다.", "fields": [{"k": "밸류체인 위치", "v": "도체·절연 → 케이블 제조 → CLV 적재·포설 → 변환설비 연계"}, {"k": "가격·수요 결정 변수", "v": "해상풍력 FID, 국가 간 인터커넥터·HVDC 투자, 국내 풍력 입찰 안보지표(중국산 배제)"}, {"k": "실사 체크", "v": "수요 중 풍력 외(HVDC·인터커넥터·통신) 비중, 증설 공장 가동 채택·퀄 여부, 대형셀 가동률(26~54%)"}, {"k": "국내 기업", "v": "비나텍(Bloom향), LS머트리얼즈(Vertiv MOU)"}]}, {"name": "온라인 UPS·BBU", "en": "UPS / Battery Backup Unit", "group": "저장·전력변환", "lede": "UPS는 평상시에도 정류기→배터리→인버터를 거쳐 전력을 공급해 전압 새그·고조파를 상시 차단하는 무정전 전원(절체 0ms), BBU는 서버랙 단위 백업 배터리다. AIDC 전력 품질 요건(전압 ±1~2%, THD 3% 이하)의 1차 방어선이며 상위 5사(Schneider·Vertiv·Eaton·ABB·Delta)가 60% 이상을 점유한다.", "fields": [{"k": "밸류체인 위치", "v": "고출력 셀·전력변환 → UPS/BBU → PDU·랙"}, {"k": "가격·수요 결정 변수", "v": "데이터센터 수, 전력 품질 요건"}, {"k": "실사 체크", "v": "고출력 셀 공급 점유율, 데이터센터향 매출 비중"}, {"k": "국내 기업", "v": "삼성SDI(UPS용 셀 세계 점유율 40~50%)"}]}, {"name": "특수변압기(신재생·ESS·연료전지용)", "en": "Special Transformer", "group": "저장·전력변환", "lede": "태양광 인버터·ESS PCS·SOFC 등 분산전원의 전압을 올려 구내 배전망이나 계통에 붙이는 변압기다. 전방이 재생에너지 발전(FTM)에서 데이터센터 온사이트(BTM)로 넓어졌고, Bloom Energy향 SOFC 승압용 수주가 대표 사례다.", "fields": [{"k": "밸류체인 위치", "v": "태양광/ESS/SOFC → 특수변압기 → 구내 배전 또는 계통"}, {"k": "가격·수요 결정 변수", "v": "BTM 온사이트 발전, 미국 재생에너지 설치량"}, {"k": "실사 체크", "v": "미국 매출 비중, 154kV 초고압 진입 계획, 캐파 증설 일정"}, {"k": "국내 기업", "v": "산일전기"}]}, {"name": "800VDC 배전·SST", "en": "800V DC Distribution / Solid-State Transformer", "group": "저장·전력변환", "lede": "13.8kV AC를 산업용 정류기·SST로 800V 직류로 바꿔 랙에 바로 공급하는 차세대 데이터센터 배전이다. 변환 단계를 줄여 종단 효율을 약 5% 높이고 구리를 약 45% 절감하지만, 중앙 정류기가 단일 실패지점이 되어 DC 버스에 대용량 ESS·CBU 결합이 필수가 된다.", "fields": [{"k": "밸류체인 위치", "v": "SST·정류기 → DC 배전 → 랙, 랙 인근 커패시터 + 시설단 BESS"}, {"k": "가격·수요 결정 변수", "v": "랙 전력 600kW~1MW(Rubin Ultra 2027), 빅테크 설계 채택"}, {"k": "실사 체크", "v": "규격 미확정 시장에서의 레퍼런스, 빅테크 수주 여부"}, {"k": "국내 기업", "v": "LS ELECTRIC(청주 DC 팩토리), 효성중공업(SST)"}]}, {"name": "SOFC(고체산화물 연료전지)", "en": "Solid Oxide Fuel Cell", "group": "연료전지·온사이트", "lede": "600~900℃ 고온에서 작동하는 연료전지로 전기효율 55~70%(열회수 시 총효율 약 90%), 천연가스·바이오가스·수소를 모두 쓸 수 있다. 직류로 발전해 서버와 직결 가능하고, 면적당 전력 밀도(최대 100MW/acre)가 가장 높으며 1년 이내(Oracle향 55일) 설치된다. 약점은 kW당 약 $3,363의 설비가와 5~10년 스택 교체다.", "fields": [{"k": "밸류체인 위치", "v": "천연가스/수소 → 개질 → 셀·스택 → BOP(인버터·열관리) → 온사이트 발전"}, {"k": "가격·수요 결정 변수", "v": "AI DC 온사이트 수요, OBBBA 30% ITC(배출 요건 삭제), 가스터빈 병목"}, {"k": "실사 체크", "v": "데이터센터향 백로그 비중과 계약 구조(판매 vs PPA), 스택 교체를 반영한 LCOE, FEOC 적합 공급망"}, {"k": "국내 기업", "v": "두산퓨얼셀(새만금 50MW), 블룸SK퓨얼셀, 미코파워, SK이터닉스(총판)"}]}, {"name": "PAFC(인산형 연료전지)", "en": "Phosphoric Acid Fuel Cell", "group": "연료전지·온사이트", "lede": "150~250℃ 중온형 1세대 발전용 연료전지로 발전효율 약 42%에 열판매로 총효율을 맞춘다. 국내 발전용 시장에서 사실상 독점 공급되지만, 데이터센터는 열보다 전력효율이 중요해 신규 수요는 SOFC로 이동하고 있다.", "fields": [{"k": "밸류체인 위치", "v": "스택 제조 → 주기기 납품 → 장기유지보수(LTSA)"}, {"k": "가격·수요 결정 변수", "v": "국내 일반수소 입찰 물량(연 160~200MW)"}, {"k": "실사 체크", "v": "입찰 낙찰 단가 추이, LTSA 매출 비중"}, {"k": "국내 기업", "v": "두산퓨얼셀(익산 약 180MW)"}]}, {"name": "PEMFC·MCFC", "en": "Polymer Electrolyte / Molten Carbonate Fuel Cell", "group": "연료전지·온사이트", "lede": "PEMFC는 120℃ 미만 저온형으로 시동이 빨라 수송·건물·비상전원에 쓰이며 글로벌 연료전지 시장의 약 80%(수송)가 여기에 속한다. MCFC는 650℃ 고온형으로 300kW~3MW 유틸리티급이지만 고온 부식이 과제다.", "fields": [{"k": "밸류체인 위치", "v": "MEA → 스택 → 시스템"}, {"k": "가격·수요 결정 변수", "v": "수소차·건물용 보급 정책, 유틸리티급 발전 수요"}, {"k": "실사 체크", "v": "발전용 전환 시 기술 장벽, 촉매 원가"}, {"k": "국내 기업", "v": "에스퓨얼셀(건물용), 범한퓨얼셀(잠수함·모빌리티)"}]}, {"name": "온사이트 가스터빈(OCGT·CCGT)", "en": "Gas Turbine", "group": "연료전지·온사이트", "lede": "데이터센터 BTM 전원의 주력이다. OCGT는 1~3년 건설에 LCOE 약 $220/MWh, CCGT는 2~4년에 약 $80/MWh다(IEA). 주요 3사 리드타임이 4~7년으로 늘고 견적이 $1,200~1,600/kW에서 $2,400~2,600/kW로 올라, 여유 캐파를 가진 2nd 티어와 연료전지에 기회가 생겼다. 회전 관성으로 주파수를 스스로 잡는 것이 인버터 전원 대비 장점이다.", "fields": [{"k": "밸류체인 위치", "v": "압축기·연소기 → 터빈 제작 → 발전소 EPC → BTM/계통"}, {"k": "가격·수요 결정 변수", "v": "AIDC 온사이트 수요, 터빈 슬롯, Henry Hub"}, {"k": "실사 체크", "v": "납기와 잉여 생산여력, 대형 3사 대비 리드타임 차이"}, {"k": "국내 기업", "v": "두산에너빌리티, 덕산네오룩스(자회사 압축기)"}]}, {"name": "미국산 LNG(FOB)", "en": "US LNG", "group": "가스·연료", "lede": "Henry Hub에 연동되는 목적지 유연 LNG다. 가격 공식은 115%×HH + 고정 액화수수료($2.25~3.50) + 운임이며, 구매자가 싣고 가서 어디든 팔 수 있어 차익거래가 가능하다. 미국 수출은 2016년 4MT에서 2025년 109MT로 늘었다.", "fields": [{"k": "밸류체인 위치", "v": "셰일가스(퍼미안·헤인즈빌) → 파이프라인 → 걸프만 액화 → LNG선 → 아시아·유럽 재기화"}, {"k": "가격·수요 결정 변수", "v": "HH-JKM/TTF 스프레드, 액화 캐파 증설, 파나마 운하 통항"}, {"k": "실사 체크", "v": "도입 계약의 HH 연동·유가 연동·현물 비중, 운송 경로별 운임 민감도"}, {"k": "국내 기업", "v": "SK이노베이션(E&S, Freeport 220만톤), 포스코인터내셔널, 한국가스공사"}]}, {"name": "LNG 터미널·보세 저장", "en": "LNG Terminal / Bonded Storage", "group": "가스·연료", "lede": "LNG를 하역·저장·재기화하는 설비다. 직도입은 자가소비 30일분 저장시설이 필요하고 국내 제3자 판매가 금지되지만, 천연가스반출입업을 등록하면 보세구역 LNG를 통관 없이 해외로 재판매할 수 있다. 가격 급등기에 저가 물량을 고가 시장으로 돌리는 차익거래의 제도적 기반이다.", "fields": [{"k": "밸류체인 위치", "v": "LNG선 → 터미널 저장 → 재기화(발전·산업) 또는 재수출"}, {"k": "가격·수요 결정 변수", "v": "지역 간 가격차, 반출입업 등록, 자사선 보유"}, {"k": "실사 체크", "v": "저장 용량(광양 133만㎘→180만㎘ 목표), 재수출 가능 물량"}, {"k": "국내 기업", "v": "포스코인터내셔널(광양), SK가스·KET(울산), SK E&S·GS에너지(보령), 한국가스공사"}]}, {"name": "LNG·LPG 겸용 가스복합발전", "en": "Dual-fuel CCGT", "group": "가스·연료", "lede": "LNG와 LPG를 모두 연료로 쓸 수 있는 복합화력이다. LNG가 급등하면 LPG로 발전하고 확보한 LNG를 해외에 팔아 전력 공백 없이 가격 차이를 수익화한다(1카고당 약 400억원 옵셔널리티 추정). 동시에 LNG 가격 상승이 SMP를 끌어올려 판매단가도 오른다.", "fields": [{"k": "밸류체인 위치", "v": "연료 선택(LNG/LPG) → 가스터빈 복합발전 → SMP 판매"}, {"k": "가격·수요 결정 변수", "v": "LNG-LPG 스프레드, SMP, 지역 전력 수요(울산 데이터센터 등)"}, {"k": "실사 체크", "v": "연료 조달 구조(직도입·장기계약), SMP 상한제 등 규제 민감도"}, {"k": "국내 기업", "v": "SK가스(울산 GPS 1.2GW)"}]}, {"name": "FLNG(부유식 LNG 생산설비)", "en": "Floating LNG", "group": "가스·연료", "lede": "해상 가스전 위에서 가스를 생산·액화·저장하는 선박형 설비로 육상 플랜트보다 빠르게 공급을 늘릴 수 있다. Eni는 2030년까지 FLNG로 연 2,000만톤 이상을 목표로 하고, 발주된 FLNG 10기 중 6기를 한국 조선사가 수주했다.", "fields": [{"k": "밸류체인 위치", "v": "해상 가스전 → FLNG 액화·저장 → LNG선 출하"}, {"k": "가격·수요 결정 변수", "v": "LNG 가격, 비중동 공급 확대, FID 파이프라인"}, {"k": "실사 체크", "v": "연간 수주 가능 척수(2기 이상), EPC 계약 형태"}, {"k": "국내 기업", "v": "삼성중공업, 한화오션, 한국가스공사(지분)"}]}, {"name": "조팜유(CPO)·팜 바이오디젤", "en": "Crude Palm Oil / FAME", "group": "바이오·우주", "lede": "팜열매(FFB) 과육에서 짠 원유 상태의 팜유로 FFB 1톤당 약 200kg이 나온다(OER 약 20%). 에스테르화해 경유 대체 바이오디젤로 쓰며, 인니 B40→B50 의무혼합은 필요량을 약 450만KL 늘려 수출 물량을 흡수한다. ha당 오일 생산성이 3.5~4톤으로 해바라기(0.7~1톤)의 4배다.", "fields": [{"k": "밸류체인 위치", "v": "FFB 수확 → 착유(밀) → CPO → 정제·분별 → 식품·바이오디젤(FAME)"}, {"k": "가격·수요 결정 변수", "v": "인니 혼합 의무, 인도·중국 수입, CPO-가스오일·타 식물유 스프레드"}, {"k": "실사 체크", "v": "나무 연령 구조, FFB 수율·OER, 외부(소농) FFB 비중, EUDR 추적성"}, {"k": "국내 기업", "v": "포스코인터내셔널, LX인터내셔널"}]}, {"name": "SAF 원료(PFAD·폐식용유)", "en": "Sustainable Aviation Fuel Feedstock", "group": "바이오·우주", "lede": "유지를 수소화하는 HEFA 공정이 SAF의 주력(2034년 55~65%) 경로다. 폐식용유 공급이 2030년 약 1,200만톤에서 포화되면 PFAD·RBD 스테아린 같은 팜 정제 부산물이 부족분(1,000~2,000만톤)을 흡수할 것으로 추정된다. 부산물은 식용·사료로 쓰이지 않아 식량 경쟁 논란에서 상대적으로 자유롭다.", "fields": [{"k": "밸류체인 위치", "v": "팜 정제 부산물·UCO → HEFA 수소화 → SAF"}, {"k": "가격·수요 결정 변수", "v": "IATA 넷제로, 인니 국제선 SAF 1% 의무화, EU RED III"}, {"k": "실사 체크", "v": "인증(ISCC·CORSIA), 오프테이크 계약, 원료 조달 안정성"}, {"k": "국내 기업", "v": "포스코인터내셔널(GS칼텍스와 인니 바이오연료 JV)"}]}, {"name": "우주용 초경량 전력막·소형 원자로", "en": "Space Solar / Fission Surface Power", "group": "바이오·우주", "lede": "궤도 데이터센터·위성용으로 필름·금속박에 페로브스카이트를 코팅한 롤러블 전력막(기존 우주용 III-V 다중접합은 효율 약 30%지만 고가)과, 달 기지용 100kWe급 핵분열 원자로(FSP, 2030 목표)가 거론된다. 우주에서는 셀보다 구조물·방열판이 질량을 좌우해 kg당 전력이 척도가 된다.", "fields": [{"k": "밸류체인 위치", "v": "경량 기판 코팅 → 전개 구조 → 위성·궤도 DC / HALEU·TRISO 연료 → 소형 원자로"}, {"k": "가격·수요 결정 변수", "v": "LEO 발사비($2,700/kg → 목표 $100 미만), NASA 예산"}, {"k": "실사 체크", "v": "실증 일정(Suncatcher 2027, 핵추진선 2028), 방사선 내성·다년 신뢰성"}, {"k": "국내 기업", "v": "한화솔루션(탠덤 소재 플랫폼), OCI홀딩스(폴리)"}]}], "placeholder": "품목·약어·국내 기업 검색 (예: TOPCon, 모노파일, LFP, SOFC)"}], "note": "각 카드: 정의 → 밸류체인 위치 → 가격·수요 결정 변수 → 실사 때 확인할 것 → 국내 기업. 칩으로 분야를 거른다."}]}, "econ": {"title": "경제성 읽기", "h2": "프로젝트 경제성 읽기", "en": "Reading Project Economics", "lede": "발전 자산의 가치는 **\"얼마에 팔 수 있나(PPA·CfD·계약시장)\"와 \"얼마에 돈을 빌렸나(금리)\"**로 거의 결정되고, 제조사 이익의 상당 부분은 세액공제에서 나온다. 임상 데이터를 읽는 순서가 있듯 프로젝트 숫자에도 읽는 순서가 있다. 이 탭은 시장에서 반복해서 쓰는 계산 틀과 흔한 오독을 정리한다.", "sections": [{"h": "읽는 순서 6단계 — 프로젝트 하나를 받으면", "blocks": [{"t": "steps", "items": [{"h": "판매 구조부터 본다", "meta": ["PPA", "CfD", "계약시장", "머천트"], "p": "누가 가격 위험을 지는지가 요구수익률을 정한다. 고정가 계약이면 금리와 공기만 보면 되고, 머천트(SMP 판매)면 가스값·출력제어까지 봐야 한다.", "chk": "계약 기간·가격·물가연동·재계약 조건"}, {"h": "CAPEX와 LCOE를 분해한다", "meta": ["자본비 85~88%", "O&M"], "p": "재생에너지는 LCOE의 대부분이 초기 투자 회수분이다. 설치비 추이(관세·인건비)와 설비 단가를 피어 프로젝트와 비교한다.", "chk": "MW당 CAPEX, 모듈·셀 원산지, EPC 계약 형태"}, {"h": "금융 구조로 IRR을 계산한다", "meta": ["PF 70~80%", "WACC+150~300bp"], "p": "무차입 IRR과 지분 IRR을 구분하고, 요구수익률(WACC+150~300bp)과 비교한다. 금리 100bp가 IRR 1.5~2.0%p를 움직인다(해상풍력, 업계 추정).", "chk": "PF 종결 여부, 고정금리 비중, DSCR"}, {"h": "보조금과 관문을 확인한다", "meta": ["ITC·PTC", "AMPC", "PFE·MACR"], "p": "세액공제를 받는지, 받을 자격(착공 기한·PWA·PFE)이 있는지, 양도해 현금화하는지 확인한다. 공제액이 IRR의 상당 부분이면 일몰 민감도가 핵심이다.", "chk": "물리적 착공 증빙, MACR 산정 근거"}, {"h": "계통·출력제어·공기 리스크를 깎는다", "meta": ["IA", "출력제어", "인허가"], "p": "계통 연결권(IA)이 없으면 파이프라인이 아니다. 계통 포화 지역은 출력제어로 이용률이 떨어지고, 인허가 지연은 금리 비용으로 돌아온다.", "chk": "IA 체결 여부, 네트워크 업그레이드 비용, 출력제어 이력"}, {"h": "누가 어떤 가치로 가져가는지 본다", "meta": ["MW당 매각가", "CAFD·FFO"], "p": "디벨로퍼는 개발 완료 시점의 MW당 매각가로, IPP는 운영 현금흐름(CAFD·FFO)으로 가치가 매겨진다. 같은 발전소라도 누구의 장부에 있느냐에 따라 평가 틀이 다르다.", "chk": "최근 거래 사례의 MW당 단가, PPA 만기 구조"}]}]}, {"h": "LCOE를 분해하면 금리가 곧 연료비다", "blocks": [{"t": "figure", "svg": "<svg viewBox=\"0 0 960 330\" role=\"img\" aria-label=\"재생에너지는 원가 대부분이 초기 자본비라 금리가 연료비 역할을 하며 해상풍력 LCOE는 WACC에 따라 55% 움직인다\"><defs><marker id=\"a-tr8\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"currentColor\" fill-opacity=\".6\"/><\/marker><\/defs><text x=\"30\" y=\"26\" font-size=\"12\" font-weight=\"600\">LCOE는 무엇으로 이루어지나<\/text><text x=\"40\" y=\"58\" font-size=\"11.5\" font-weight=\"600\">태양광·풍력<\/text><rect x=\"40.0\" y=\"66.0\" width=\"354.6\" height=\"32.0\" style=\"fill:var(--accent)\" fill-opacity=\".4\"/><rect x=\"395\" y=\"66\" width=\"55\" height=\"32\" rx=\"0\" fill=\"var(--surface)\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"1\"/><text x=\"216\" y=\"87\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"600\">자본비 회수 85~88%<\/text><text x=\"421\" y=\"87\" font-size=\"10.5\" text-anchor=\"middle\">O&amp;M<\/text><text x=\"40\" y=\"128\" font-size=\"11.5\" font-weight=\"600\">가스·석탄 발전<\/text><rect x=\"40\" y=\"136\" width=\"205\" height=\
